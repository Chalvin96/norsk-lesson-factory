  prompt_md: "It is Sunday at 4 p.m. Aino is at the station, Mikkel is going to the dentist, and Liv is spending the afternoon with her uncle. The train leaves at 4:20. Anders came home after school on Friday, and the concert lasts 90 minutes. Write Nora a message with this information."
