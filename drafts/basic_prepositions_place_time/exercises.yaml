- handle: retrieve-preposition-meanings
  op: write
  objective: obj-basic-prepositions-place-time-01
  bloom: apply
  prompt_md: "To Nora: Write a message in Norwegian. Lars is at the library now. Sara is going to the doctor's office. Omar is spending the afternoon with his grandmother. It is Sunday, and the meeting starts in three hours. Eva came home two days ago. The course lasts two hours. Put the information naturally."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Kan du fortelle meg hvor folk er, og hva som skjer senere?»
    - speaker: Mina
      text_md: «Ja, jeg sender deg en samlet oppdatering.»
  response_language: 'no'
  min_words: 35
  max_words: 65
  judge_prompt: "Assess the message purpose, all six facts and natural Norwegian prepositional expressions for location, destination, visiting a person, future and past time, and duration. Accept both «på biblioteket» and «i biblioteket» for Lars, and both «hos bestemoren» and «besøker bestemoren» for Omar."
  criteria:
  - id: message-purpose
    instruction: Svaret er en sammenhengende norsk melding til Nora som forklarer hvor folk er og når hendelser skjer.
  - id: six-updates
    instruction: Meldingen formidler alle de seks opplysningene fra oppgaven med riktig betydning.
  - id: relation-forms
    instruction: "Uses natural Norwegian expressions for location, destination, visiting a person, future time, past time, and duration. Accept «hos bestemoren» or «besøker bestemoren» for Omar."
  derived_from:
  - section_id: final-retrieval
