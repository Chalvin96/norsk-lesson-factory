  prompt_md: 'Build a complete noun phrase with «høy» and «tre» in the definite form.'
  response_language: "no"
  min_words: 3
  max_words: 3
  judge_prompt: Accept «det høye treet» or «det høge treet». Check for the neuter singular opening word, a valid definite adjective form, and the definite noun form.
  criteria:
  - id: opening-word
    instruction: Uses det, agreeing with singular neuter tre.
  - id: adjective-form
    instruction: Uses a valid definite form of the adjective, either «høye» or «høge».
  - id: definite-noun
    instruction: Uses treet, retaining the definite noun ending.
  derived_from:
  - section_id: controlled-phrase-production
