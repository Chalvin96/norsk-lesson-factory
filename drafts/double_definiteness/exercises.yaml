- handle: retrieve_double_definiteness_after_delay
  op: write
  objective: obj-double-definiteness-01
  bloom: apply
  prompt_md: 'Write Nora a message about the items she is going to pick up. Notes: an old chair by the door, a round table by the window, and small lamps by the register. Use the definite form with an article, an inflected adjective, and a noun.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hvilke ting skal jeg hente på bruktbutikken?»
  explanation_md: En tydelig melding viser til hver bestemt ting med riktig foranstilt ord, adjektivform og substantiv i bestemt form.
  derived_from:
  - section_id: retrieval-and-review
  response_language: "no"
  min_words: 15
  max_words: 35
  judge_prompt: "Check criteria den-chair, det-table, de-lamps. Record each criterion verdict separately. Accept natural Bokmål wording and word order."
  criteria:
  - id: den-chair
    instruction: The message identifies the old chair with den gamle stolen and places it by the door; accept both natural forms ved døren and ved døra.
  - id: det-table
    instruction: The message identifies the round table by the window with the complete specific phrase det runde bordet ved vinduet.
  - id: de-lamps
    instruction: The message uses de små lampene for the small lamps and locates them by the checkout; natural Bokmål forms such as ved kassa and ved kassen both satisfy the location.
