- handle: checkpoint_identify_situation
  op: choose
  objective: obj-ask-for-help-01
  bloom: understand
  prompt_md: Read the dialogue at the train station. Choose the sentence that tells what Mina cannot manage to do.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Unnskyld, jeg skal ta toget til Bergen.»
    - speaker: Ansatt
      text_md: «Det går fra spor fire om ti minutter.»
    - speaker: Mina
      text_md: «Takk, men jeg klarer ikke å finne spor fire.»
  options:
  - id: timing
    text: Toget går om ti minutter.
    correct: false
    why: This gives the departure time, not something that is blocking Mina.
  - id: missing-platform
    text: Jeg finner ikke spor fire.
    correct: true
    why: Mina says she cannot find platform four, so this sentence states her obstacle.
  - id: help-request
    text: Kan du hjelpe meg?
    correct: false
    why: This asks for help but does not state what is wrong.
  - id: other-problem
    text: Jeg forstår ikke beskjeden.
    correct: false
    why: This states a different problem and does not match Mina's situation.
  derived_from:
  - section_id: at-the-train-station
- handle: checkpoint_choose_obstacle
  op: recall_fill
  objective: obj-ask-for-help-01
  bloom: apply
  prompt_md: "Complete the sentence saying that Mina has not spotted the ticket."
  audio_target: Jeg finner ikke billetten her.
  segments:
  - text_md: "Mina leter etter billetten. Hun sier: «Jeg "
  - blank_id: missing-ticket
    options:
    - finner ikke
    - trenger ikke
    - har med
    - venter på
    answer_index: 0
  - text_md: ' billetten her.'
  derived_from:
  - section_id: stating-the-obstacle
- handle: checkpoint_build_approach
  op: write
  objective: obj-ask-for-help-01
  bloom: apply
  prompt_md: 'Address an employee in Norwegian. Get their attention, explain that you do not understand the instruction you were given, and ask for help.'
  response_language: 'no'
  min_words: 7
  max_words: 15
  judge_prompt: Check the Norwegian response against the task and report evidence for each criterion. Judge whether the response communicates each requested meaning in natural Norwegian. Accept valid wording variants; do not require a memorized sentence or reject a clear equivalent.
  criteria:
  - id: approach-attention
    instruction: Politely gets the nearby employee's attention.
  - id: approach-obstacle
    instruction: Explains that the speaker does not understand the instruction.
  - id: approach-request
    instruction: Clearly asks the employee for help.
  derived_from:
  - section_id: asking-directly-for-help
- handle: checkpoint_listen_next_action
  op: choose
  objective: obj-ask-for-help-01
  bloom: understand
  prompt_md: Read the dialogue. Choose the option that shows the actions Mina should take, in the same order as the replies.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Unnskyld, kan du hjelpe meg?»
    - speaker: Ansatt
      text_md: «Ja, vent litt.»
    - speaker: Mina
      text_md: «Hva gjør jeg nå?»
    - speaker: Ansatt
      text_md: «Ja, trykk her.»
    - speaker: Mina
      text_md: «Kan du vise meg veien?»
    - speaker: Ansatt
      text_md: «Ja, selvfølgelig. Bli med meg.»
  options:
  - id: swapped-first-two
    text: '1: Bli med den ansatte. 2: Vent litt. 3: Trykk her.'
    correct: false
    why: De to første handlingene står ikke i samme rekkefølge som svarene.
  - id: correct-actions
    text: '1: Vent litt. 2: Trykk her. 3: Bli med den ansatte.'
    correct: true
    why: «Vent litt», «trykk her» og «bli med meg» angir handlingene i riktig rekkefølge.
  - id: wrong-third
    text: '1: Vent litt. 2: Trykk her. 3: Gå til informasjonsskranken.'
    correct: false
    why: Det siste svaret ber Mina bli med den ansatte, ikke gå til en skranke.
  derived_from:
  - section_id: understanding-a-helpful-response
- handle: checkpoint_complete_sequence
  op: write
  objective: obj-ask-for-help-01
  bloom: apply
  prompt_md: 'The employee replies: «Ja, selvfølgelig. Prøv igjen nå.» First write a line saying that you cannot open the door and asking for help. Then reply that you will try again.'
  response_language: 'no'
  min_words: 8
  max_words: 20
  judge_prompt: Check the learner's lines before and after the quoted employee reply. Report evidence for every criterion and verify that the acceptance follows the reply.
  criteria:
  - id: door-obstacle
    instruction: Explains that the speaker cannot open the door.
  - id: complete-request
    instruction: Clearly asks for help with the door problem.
  - id: retry-acceptance
    instruction: After the employee's reply, says in Norwegian that they will try again.
  derived_from:
  - section_id: accepting-the-next-action
