- handle: recognize_zero_ending_neuter_plurals
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: "Nora is counting furniture for the meeting room. Choose the sentence that says there are three tables and two chairs."
  derived_from:
  - section_id: short-neuter-nouns-with-no-indefinite-plural-ending
  stem_md: "Choose the sentence with the correct plural forms."
  options:
  - id: er_plural
    text: Det står tre border og to stoler i møterommet.
    correct: false
    why: bord does not take an -er ending in the plural.
  - id: definite_singular
    text: Det står tre bordet og to stoler i møterommet.
    correct: false
    why: bordet is the definite singular, which does not follow tre.
  - id: correct
    text: Det står tre bord og to stoler inne i møterommet.
    correct: true
    why: Short neuter nouns such as bord keep the same form in the ubestemt flertall, while stol takes
      the -er plural.
  - id: definite_plural
    text: Det står tre bord og to stolene på gulvet i møterommet.
    correct: false
    why: stolene is the bestemt flertall, which does not follow to.
