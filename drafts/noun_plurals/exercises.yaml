- handle: notice_indefinite_and_definite_groups
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: "Nora is making a list of cups for the meeting room. First she mentions cups without referring to a particular group. Later, Amir refers to the group that has already been set out. Choose the expressions that fit both situations."
  derived_from:
  - section_id: the-most-common-pattern-er-and-ene
  stem_md: "Choose the pair with the correct meaning in both situations."
  options:
  - id: both_definite
    text: 'Først: koppene. Senere: koppene.'
    correct: false
    why: The first situation does not identify a particular group.
  - id: reversed
    text: 'Først: koppene. Senere: kopper.'
    correct: false
    why: The meanings are reversed.
  - id: correct
    text: 'Først: kopper. Senere: koppene.'
    correct: true
    why: kopper introduces an unspecified quantity; koppene refers to an identifiable group.
  - id: both_indefinite
    text: 'Først: kopper. Senere: kopper.'
    correct: false
    why: The second reference needs to identify the known group.
