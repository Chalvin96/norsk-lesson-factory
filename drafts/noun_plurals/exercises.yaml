- handle: track_plural_reference_in_context
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: "Nora and Amir are setting up the meeting room. The first sentence mentions four cups; the second refers to the same cups. Choose the dialogue with the correct use of definite and indefinite plural."
  derived_from:
  - section_id: following-a-noun-through-a-conversation
  stem_md: "Choose the dialogue that refers to the same group."
  options:
  - id: reversed
    text: Nora finner koppene. Fire kopper står ved døra.
    correct: false
    why: The first sentence treats the group as already known, while the second makes it indefinite.
  - id: first_definite
    text: Nora finner koppene. Koppene står ved døra.
    correct: false
    why: The first sentence is introducing the group, not referring back to an earlier group.
  - id: second_indefinite
    text: Nora finner fire kopper. Kopper står ved døra.
    correct: false
    why: The second sentence should identify the group introduced in the first sentence.
  - id: correct
    text: Nora finner fire kopper. Koppene står ved døra.
    correct: true
    why: kopper introduces the group; koppene refers back to the same identifiable cups.
- handle: repair_plural_form_errors
  op: write
  objective: obj-noun-plurals-01
  bloom: analyze
  prompt_md: "Nora finds the chairs Jonas showed her earlier. Correct the wrong form «stolerene» and briefly explain how the definite plural is formed from «stol»."
  derived_from:
  - section_id: common-mistakes-to-avoid
  response_language: 'no'
  min_words: 5
  max_words: 22
  judge_prompt: Check that the learner corrects stolerene to stolene, which refers to the previously identified chairs, and explains that the bestemt flertall ending attaches to the noun stem stol, not to the ubestemt flertall stoler. Accept concise natural Norwegian explanations.
  criteria:
  - id: corrected-form
    instruction: Replaces stolerene with the bestemt flertall stolene, referring to the chairs already identified.
  - id: plural-rule
    instruction: Explains that the bestemt flertall ending attaches to singular stem stol rather than the ubestemt flertall stoler.
  - id: concise-response
    instruction: Responds.
