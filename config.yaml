llm:
  timeout_seconds: 1800
  tiers:
    cheap:
      model: openai/gpt-5.6-luna
      variant: xhigh
    standard:
      model: openai/gpt-5.6-sol
      variant: low
    deep:
      model: openai/gpt-5.6-sol
      variant: medium
    deep_alt:
      model: zai-coding-plan/glm-5.3
      variant: max
  jobs:
    author:
      tier: standard
      agent_template: lesson-author
    reviewer:
      tier: deep_alt
      agent_template: catalog-review
    catalog_explorer:
      tier: cheap
      agent_template: catalog-research
    catalog_reviewer:
      tier: deep
      agent_template: catalog-review
    curriculum_reviewer:
      tier: deep
      agent_template: catalog-review
    normalizer:
      tier: cheap
      agent_template: lesson-author
    exercise_author:
      tier: cheap
      agent_template: exercise-author

