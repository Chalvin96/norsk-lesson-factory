# The built workbench app is generated by Vite; CI checks it matches a fresh build.
exclude: ^src/lesson_builder/web/app/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.1.0
    hooks:
      - id: complexipy
        # Check staged cognitive-complexity regressions without reopening the legacy backlog.
        types_or: [python, pyi]
        args: [--max-complexity-allowed, "15", --staged, --ignore-complexity]
  - repo: local
    hooks:
      - id: biome-check
        name: Biome format and lint check
        entry: scripts/check_staged_biome.sh
        language: system
        files: ^workbench/.*\.(ts|tsx|json|css)$
        exclude: ^workbench/(src/api/types\.generated\.ts|schema/.*\.json)$
      - id: workbench-types-check
        name: Check workbench wire schema freshness
        entry: npm run workbench:types:check
        language: system
        pass_filenames: false
        files: ^(workbench/schema/.*\.json|scripts/export_workbench_schema\.py|src/lesson_builder/.*\.py)$
      - id: mypy-staged
        name: Mypy changed source files
        entry: uv run mypy
        language: system
        types: [python]
        files: ^src/.*\.py$
