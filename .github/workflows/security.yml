name: security

on:
  pull_request:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Audit locked dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uv run pip-audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/requirements-audit.txt"
