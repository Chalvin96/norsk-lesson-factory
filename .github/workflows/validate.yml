name: validate

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lesson-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Check Python syntax
        run: uv run python -m compileall src/lesson_builder

      - name: Run lint
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src/

      - name: Validate lesson metadata
        run: uv run lesson-data lesson validate --require-files tests/fixtures/lessons/valid_minimal.json

      - name: Verify exported lessons are current
        run: |
          uv run lesson-data regenerate-dist --repo-root .
          git diff --exit-code -- dist/lessons dist/manifest.json

      - name: Run unit tests
        run: uv run pytest tests/ -q
