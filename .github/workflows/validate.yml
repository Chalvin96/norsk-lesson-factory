name: validate

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Convention checks compare changed files with the PR base revision.
          fetch-depth: 0

      - name: Set up uv with Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Install locked workbench dependencies
        run: npm --prefix workbench ci

      - name: Run the ordered validation gates
        env:
          CONVENTIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check -- --conventions-base "$CONVENTIONS_BASE"
