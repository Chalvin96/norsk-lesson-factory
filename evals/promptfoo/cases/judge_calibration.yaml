- description: decision_correctness positive - grounded rejection of reversed glosses
  metadata:
    split: dev
    expected_label: pass
    dimension: decision_correctness
    source: seeded from content/lessons/ta_med_or_ha_med/lesson.md (adversarial variant)
    label_provenance: seed_pending_human_review
  vars:
    candidate: |
      {"findings": [{"code": "meaning_changing_translation", "severity": "advisory", "rationale": "The English glosses appear to swap ta med (bringing along) and ha med (already having with you). This AI suggestion is unverified."}], "summary": "Check whether the meanings were swapped."}
  assert:
    - type: llm-rubric
      metric: decision_correctness
      value: |
        The reviewed text reverses the meanings of ta med (bringing along) and
        ha med (already having with you). Return pass=true only when the review
        reports this as an unverified advisory suggestion grounded in the
        reversed glosses; return pass=false when the review blocks, repairs, or
        claims qualified certainty about the reviewed text.
      provider:
        id: file://provider.py:call_api
        config:
          job: reviewer
          json_response: true

