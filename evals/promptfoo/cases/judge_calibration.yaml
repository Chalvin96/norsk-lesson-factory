- description: norwegian_correctness holdout positive - preterite versus present perfect
  metadata:
    split: holdout
    expected_label: pass
    dimension: norwegian_correctness
    source: content/lessons/preterite_vs_present_perfect/lesson.md
    label_provenance: seed_pending_human_review
  vars:
    candidate: |
      The past tense places the visit in a completed past time: Jeg var på Fjordhuset forrige fredag. — I was at Fjordhuset last Friday.
      The present perfect presents it as part of the speaker's experience before now: Jeg har vært på Fjordhuset før. — I have been to Fjordhuset before.

      Use the past tense when the event belongs to a specific, completed past time:
      Jeg besøkte Tromsø i fjor. — I visited Tromsø last year.
      Hun kjøpte bilen i mandags. — She bought the car last Monday.

      Use the present perfect when the past is connected to now:
      Jeg har bodd i dette området i tre år. — I have lived in this area for three years.
      Jeg har aldri spist der. — I have never eaten there.
  assert:
    - type: llm-rubric
      metric: norwegian_correctness
      value: |
        Every Norwegian sentence in the text must use the past tense
        (preteritum) for events in completed past time and har with the past
        participle for past-to-present connections, in natural Bokmål with
        faithful English translations. Return pass=true only when every sentence
        and translation follows that tense use; return pass=false when any
        sentence uses the wrong tense, a wrong form, or is mistranslated.
      provider:
        id: file://provider.py:call_api
        config:
          job: reviewer
          json_response: true

