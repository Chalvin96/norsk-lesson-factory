# Calibration seed for the semantic judge dimensions reused by the live suites.
#
# Each case grades one fixed candidate with the same configured judge adapter
# as the live suites. A positive expects the judge to pass it; its matching
# negative is the same content with one obvious fault and uses the identical
# rubric under `not-llm-rubric`, so the case passes only when the judge fails
# the faulty candidate. Labels are `seed_pending_human_review`: until a
# qualified Norwegian language/pedagogy reviewer confirms them, this file is a
# calibration aid, not a golden set. Keep it small and high-signal; do not add
# repetitive filler.

- description: norwegian_correctness positive - committed ta med / ha med explanation
  metadata:
    split: dev
    expected_label: pass
    dimension: norwegian_correctness
    source: content/lessons/ta_med_or_ha_med/lesson.md
    label_provenance: seed_pending_human_review
  vars:
    candidate: |
      Use ta med when a person causes an object or another person to come along from one place to another.
      Jeg tar med kaffe til møtet. — I'm bringing coffee to the meeting.
      Kan du ta med passet? — Can you bring your passport?

      Use ha med when the sentence describes what someone has with them in the current situation or during a journey.
      Jeg har med kaffe. — I have coffee with me.
      Har du med passet? — Do you have your passport with you?

      Ta med focuses on getting something or someone to accompany you. Ha med focuses on having that thing or person with you.
  assert:
    - type: llm-rubric
      metric: norwegian_correctness
      value: |
        Every occurrence of ta med and ha med in the text must use ta med for
        causing someone or something to come along and ha med for something
        already with someone, in natural Bokmål with faithful English
        translations. Return pass=true only when every occurrence and
        translation matches that contrast; return pass=false when any occurrence
        or translation swaps or blurs the two meanings.
      provider:
        id: file://provider.py:call_api
        config:
          job: reviewer
          json_response: true

