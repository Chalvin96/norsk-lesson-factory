- description: objective_alignment positive - four approved question kinds
  metadata:
    split: dev
    expected_label: pass
    dimension: objective_alignment
    source: content/lessons/question_word_order/lesson.md
    label_provenance: seed_pending_human_review
  vars:
    candidate: |
      The main decision is whether the question begins directly with the verb or begins with a question word followed by the verb.

      Simple yes/no questions put the verb first:
      Bor du i Bergen? — Do you live in Bergen?

      Negative questions keep the verb first and place ikke after the subject:
      Kommer han ikke i kveld? — Isn't he coming tonight?

      Questions with a question word put the question word first and the verb second:
      Hvor kjøper jeg billett? — Where do I buy a ticket?

      Permission questions use the same verb-first pattern with kan jeg or får jeg:
      Kan jeg betale med kort? — Can I pay by card?
  assert:
    - type: llm-rubric
      metric: objective_alignment
      value: |
        The approved objective for this material is to ask and recognize simple
        Norwegian yes/no, negative, wh-, and permission questions, with no
        second learner outcome. Return pass=true only when the text teaches all
        four approved question kinds and gives no other learner outcome its own
        teaching; return pass=false when any of the four kinds is missing or a
        second outcome is taught alongside them.
      provider:
        id: file://provider.py:call_api
        config:
          job: reviewer
          json_response: true

