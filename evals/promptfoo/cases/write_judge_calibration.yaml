      Learner task: I går ledet du et verksted for kollegaen Eva. Du skulle
      bestille rom 204, men bestillingen gikk ikke gjennom. Eva hadde lovet å ta
      med prosjektoren, men den kom ikke. Skriv en e-post på 15–35 ord der du
      forteller om de to avtalene som ikke ble fulgt. Bruk «skulle ha» + partisipp
      i begge setningene.

      Criteria:
      - room-arrangement (gating): The email explains that room 204 was an
        earlier arrangement that was not fulfilled.
      - projector-arrangement (gating): The email explains that Eva's
        projector promise was not fulfilled.
      - email-purpose (gating): The response is an intelligible email or
        direct message to Eva about the workshop problem.
      - workshop-word-bounds (gating): The response contains 15 to 35 words.
      - skulle-ha-forms (gating): Each failed arrangement is expressed with
        skulle ha plus a past participle.

      Judge instructions: Check the email against criteria room-arrangement,
      projector-arrangement, email-purpose, workshop-word-bounds, and
      skulle-ha-forms. Only criteria whose ids do not end in -observation are
      gating. Accept natural Bokmål variants.

      Learner response: «Hei Eva! Rom 204 skulle ha vært bestilt, men
      reservasjonen gikk ikke gjennom. Du skulle ha tatt med prosjektoren,
      men den kom ikke fram.»
