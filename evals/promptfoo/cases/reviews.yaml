- description: Preservation review catches a dropped protected example
  metadata:
    case_id: preservation-dropped-contrast
    surface: preservation_review
    cefr: A1
    kind: phraseology
    source_lesson: synthetic
  options:
    disableVarExpansion: true
  vars:
    surface: preservation_review
    expected_issue_categories: [dropped_contrast]
    plan: |
      ---
      kind: phraseology
      approved: true
      learner_outcome: Distinguish bringing an item from already having it with you.
      ---

      # Plan

      Preserve the meaning contrast and its examples.
    draft: |
      ## At the station

      `Jeg tar med boka` means I am bringing the book. `Jeg har med boka` means I already
      have the book with me.

    lesson_md: |
      ---
      type: Lesson
      slug: preserve-review
      title: Ta med eller ha med
      cefr_level: A1
      goal: Preserve the meaning contrast.
      default_lang: nb
      grounding_mode: grounded
      requirements_ref: plan.md
      bloom_targets: [understand]
      objectives:
        - id: obj-bring-have
          statement: Distinguish bringing an item from already having it with you.
          bloom_targets: [understand]
      ---

      ## At the station

      `Jeg har med boka` means I already have the book with me.

    exercise_requests_yaml: |
      - handle: choose-meaning
        objective_ref: obj-bring-have
        bloom: understand
        evidence_route: meaning_selection
        evidence: Distinguish bringing an item from already having it with you.
  assert:
    - type: python
      metric: planted_error_recall
      value: file://assertions.py:validate_review_outcomes
