      \  - tok-1\n  - tok-2\n  - tok-3\n  - tok-4\n  - tok-5\n  - tok-6\n  - tok-7\n  - tok-8\n"
    mechanical_audit: '{"status": "clean", "exercise_handles": ["complete_the_proportional_frame"],
      "marker_handles": ["complete_the_proportional_frame"], "built_answers": [], "findings": []}'
  assert:
  - type: llm-rubric
    metric: decision_correctness
    value: Return pass=true only if the review passes this correct package with no findings or edits.
      The explanation and keyed answer agree on jo subject-verb and desto verb-subject order. Do
      not penalize the reviewer for leaving concise useful feedback intact. Return pass=false for
      an invented defect or unnecessary rewrite.
    provider: *id001
  - type: python
    value: file://assertions.py:validate_review_edit_handle_coverage
    metric: audited_handles
  - type: python
    value: file://assertions.py:validate_review_edit_replacements
    metric: grounded_edits
