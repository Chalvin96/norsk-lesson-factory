- description: 'PR222 regression: feedback contradicts the keyed word order'
  metadata:
    case_id: review-edit-jo-desto-planted
    surface: review_edit
    cefr: A2
    kind: grammar
    source_lesson: PR222 curated excerpt
  options:
    disableVarExpansion: true
  vars:
    surface: review_edit
    expected_exercise_ids: [complete_the_proportional_frame]
    expected_finding_handles: [complete_the_proportional_frame]
    lesson_md: '# Proportional change

      Use jo + comparative + subject + verb, followed by desto + comparative + verb + subject. For
      example: Jo mer du øver, desto tryggere blir du.


      {% raw %}{{exercise: complete_the_proportional_frame}}{% endraw %}

      '
    exercises_yaml: "- handle: complete_the_proportional_frame\n  op: build\n  objective: obj-jo-desto-correlatives-01\n\
      \  bloom: apply\n  prompt_md: 'Build one complete Norwegian sentence for exam preparation:\
      \ more practice\n    leads to greater confidence. Use jo ... desto and all supplied tokens.'\n\
      \  explanation_md: Each half has comparative wording, and the finite verb follows the\n   \
      \ subject inside both jo/desto clauses.\n  tokens:\n  - token_id: tok-1\n    text: Jo\n  -\
      \ token_id: tok-2\n    text: mer\n  - token_id: tok-3\n    text: du\n  - token_id: tok-4\n\
      \    text: øver,\n  - token_id: tok-5\n    text: desto\n  - token_id: tok-6\n    text: tryggere\n\
      \  - token_id: tok-7\n    text: blir\n  - token_id: tok-8\n    text: du.\n  answer_order:\n\
      \  - tok-1\n  - tok-2\n  - tok-3\n  - tok-4\n  - tok-5\n  - tok-6\n  - tok-7\n  - tok-8\n"
    mechanical_audit: '{"status": "clean", "exercise_handles": ["complete_the_proportional_frame"],
      "marker_handles": ["complete_the_proportional_frame"], "built_answers": [], "findings": []}'
  assert:
    - type: python
      metric: planted_error_recall
      value: file://assertions.py:validate_review_outcomes
