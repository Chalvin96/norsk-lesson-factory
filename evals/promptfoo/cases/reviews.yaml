- description: 'PR222 regression: rubric loses the required tense'
  metadata:
    surface: review_edit
    cefr: A2
    kind: grammar
    source_lesson: PR222 curated excerpt
  vars:
    surface: review_edit
    lesson_md: '# Present perfect

      Use present perfect for an earlier action with a result now: Jeg har låst døra. The retrieval
      exercise must demonstrate present perfect, not merely describe a current state.


      {% raw %}{{exercise: result}}{% endraw %}

      '
    exercises_yaml: "- handle: result\n  op: write\n  objective: obj-result\n  bloom: apply\n  prompt_md:\
      \ Write one Norwegian sentence using present perfect for an earlier action\n    whose result\
      \ matters now.\n  response_language: 'no'\n  judge_prompt: Check the criterion.\n  criteria:\n\
      \  - id: present-result\n    instruction: Gives a natural Norwegian sentence about a result\
      \ that matters now.\n"
    mechanical_audit: '{"status": "clean", "exercise_handles": ["result"], "marker_handles": ["result"],
      "built_answers": [], "findings": []}'
  assert:
  - type: llm-rubric
    metric: decision_correctness
    value: Return pass=true only if the review requests an edit restoring explicit present-perfect
      use to the criterion, preserving the earlier-action/result-now meaning. A current-state sentence
      alone must not satisfy it. Return pass=false if the weak criterion is passed or the repair
      removes the grammar requirement from the prompt.
    provider: *id001
  - type: python
    value: file://assertions.py:validate_review_edit_handle_coverage
    metric: audited_handles
  - type: python
    value: file://assertions.py:validate_review_edit_replacements
    metric: grounded_edits

