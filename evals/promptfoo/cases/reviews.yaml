# Labeled reviewer and judge cases. Each case supplies the exact inputs a
# production reviewer sees and asserts only the material decision (and, where a
# wrong-but-right-looking verdict is a distinct failure, the grounding of that
# decision). Judge job: curriculum_reviewer, independent from the live target job.

- description: Lesson review catches a meaning-changing explanation
  metadata:
    surface: lesson_review
    cefr: A1
    kind: phraseology
    source_lesson: synthetic
  vars:
    surface: lesson_review
    plan: |
      ---
      kind: phraseology
      approved: true
      learner_outcome: Distinguish bringing an item from already having it with you.
      objectives:
        - id: obj-bring-have
          statement: Distinguish bringing an item from already having it with you.
      ---

      # Plan

      Teach the meaning contrast between bringing an item and already having it with you.
    draft: |
      # Ta med eller ha med

      `Jeg tar med boka` means the book is already with me. `Jeg har med boka` means I am
      bringing the book. The learner must choose the expression from the intended meaning.
  assert:
    - type: llm-rubric
      metric: decision_correctness
      value: |
        The draft under review reverses the two Norwegian expressions (tar med
        is glossed as already having, har med as bringing). Return pass=true
        only when the review verdict is needs_repair and it reports a grounded
        meaning-changing translation finding for this reversal. Accept the
        production-supported category names `meaning_changing_translation` or
        `incorrect_claim`; return
        pass=false when the review passes the draft or misses the reversal.
      provider:
        id: file://provider.py:call_api
        config:
          job: curriculum_reviewer
          json_response: true
    - type: llm-rubric
      metric: reasoning_quality
      value: |
        The reported finding must be grounded in the reviewed draft: it quotes
        or locates the reversed glosses, and its repair instruction replaces the
        reversed meanings with the correct ones without inventing unrelated
        defects. Return pass=true only when the evidence and repair instruction
        do exactly that; return pass=false when the finding cites text not in
        the draft or the repair instruction is ungrounded or overbroad.
      provider:
        id: file://provider.py:call_api
        config:
          job: curriculum_reviewer
          json_response: true

- description: Preservation review catches a dropped protected example
  metadata:
    surface: preservation_review
    cefr: A1
    kind: phraseology
    source_lesson: synthetic
  vars:
    surface: preservation_review
    plan: |
      ---
      kind: phraseology
      approved: true
      learner_outcome: Distinguish bringing an item from already having it with you.
      ---

      # Plan

      Preserve the meaning contrast and its examples.
    draft: |
      ## At the station

      `Jeg tar med boka` means I am bringing the book. `Jeg har med boka` means I already
      have the book with me.

    lesson_md: |
      ---
      type: Lesson
      slug: preserve-review
      title: Ta med eller ha med
      cefr_level: A1
      goal: Preserve the meaning contrast.
      default_lang: nb
      grounding_mode: grounded
      requirements_ref: plan.md
      bloom_targets: [understand]
      objectives:
        - id: obj-bring-have
          statement: Distinguish bringing an item from already having it with you.
          bloom_targets: [understand]
      ---

      ## At the station

      `Jeg har med boka` means I already have the book with me.

    exercise_requests_yaml: |
      - handle: choose-meaning
        objective_ref: obj-bring-have
        bloom: understand
        evidence_route: meaning_selection
        evidence: Distinguish bringing an item from already having it with you.
  assert:
    - type: llm-rubric
      metric: decision_correctness
      value: |
        The normalized source dropped the `Jeg tar med boka` example and its
        bringing meaning that the protected draft contains. Return pass=true
        only when the review verdict is needs_repair and at least one grounded
        finding uses a production-supported preservation category such as
        `dropped_example` or `dropped_contrast`, with a repair instruction that
        restores that exact content. Additional grounded preservation findings
        are valid; return pass=false when the review passes the normalized
        source or fails to identify the dropped sentence and its meaning.
      provider:
        id: file://provider.py:call_api
        config:
          job: curriculum_reviewer
          json_response: true

- description: Review and edit reports real defects in a lesson package
  metadata:
    surface: review_edit
    cefr: A1
    kind: grammar
    source_lesson: synthetic
  vars:
    surface: review_edit
    lesson_md: |
      # Counting

      ::: examples
      - no: ✗ Jeg trenger ett pose.
      - en: Intended: I need one bag.
      - no: ✗ Hun kjøper en brød.
      - en: Intended: She is buying one loaf of bread.
      :::

      {% raw %}{{exercise: label-first}}{% endraw %}
      {% raw %}{{exercise: label-second}}{% endraw %}

    exercises_yaml: |
      - handle: label-first
        op: choose
        objective: count-quantity
        bloom: understand
        prompt_md: Choose the correct quantity phrase.
        stem_md: Jeg trenger ___ pose.
        options:
          - id: en
            text: en
            correct: true
            why: Pose is masculine, so use en for one.
          - id: ett
            text: ett
            correct: false
            why: Ett is for neuter nouns, but pose is masculine.
      - handle: label-second
        op: choose
        objective: count-quantity
        bloom: understand
        prompt_md: Choose the correct quantity phrase.
        stem_md: Hun kjøper ___ brød.
        options:
          - id: ett
            text: ett
            correct: true
            why: Brød is neuter, so use ett for one.
          - id: en
            text: en
            correct: false
            why: En is for masculine nouns, but brød is neuter.
    mechanical_audit: |
      {
        "status": "clean",
        "exercise_handles": ["label-first", "label-second"],
        "marker_handles": ["label-first", "label-second"],
        "built_answers": [],
        "findings": []
      }
  assert:
    - type: llm-rubric
      metric: source_language_labels
      value: |
        The prepared package exposes two intentionally wrong Norwegian examples
        in a typed examples block. Their English glosses use `Intended:`, which
        is not a recognized negative-example marker, so the bad Norwegian could
        become model audio. Return pass=true only when the review is needs_edit,
        identifies both examples, and proposes a bounded source-grounded fix
        that prevents that audio while preserving the negative teaching intent.
        Either relabeling both glosses to `Intended meaning:` or moving the
        examples into a supported warning callout is valid. Do not pass a broad
        rewrite, an unrelated style preference, or an edit that erases the
        original negative examples.
      provider:
        id: file://provider.py:call_api
        config:
          job: curriculum_reviewer
          json_response: true
    - type: python
      value: file://assertions.py:validate_review_edit_handle_coverage
      metric: audited_handles
    - type: python
      value: file://assertions.py:validate_review_edit_replacements
      metric: grounded_edits

- description: Review and edit leaves a clean package unchanged
  metadata:
    surface: review_edit
    cefr: A1
    kind: phraseology
    source_lesson: synthetic
  vars:
    surface: review_edit
    lesson_md: |
      # At the station

      ::: examples
      - no: Jeg tar med boka.
      - en: I am bringing the book.
      :::

      {% raw %}{{exercise: clear-choice}}{% endraw %}

    exercises_yaml: |
      - handle: clear-choice
        op: choose
        objective: bring-have
        bloom: understand
        prompt_md: Choose the phrase for bringing the book.
        options:
          - id: tar-med
            text: tar med
            correct: true
            why: Tar med means bringing something.
          - id: har-med
            text: har med
            correct: false
            why: Har med means already having something with you.
    mechanical_audit: |
      {
        "status": "clean",
        "exercise_handles": ["clear-choice"],
        "marker_handles": ["clear-choice"],
        "built_answers": [],
        "findings": []
      }
  assert:
    - type: llm-rubric
      metric: review_edit_conservatism
      value: |
        The supplied package contains natural Norwegian and no concrete defect.
        Return pass=true only when the review returns verdict `pass`, audits the
        `clear-choice` handle, returns no findings, and returns no edits. Do not
        invent a style preference or rewrite valid content. Return pass=false
        when the review proposes a correction without a grounded defect.
      provider:
        id: file://provider.py:call_api
        config:
          job: curriculum_reviewer
          json_response: true
    - type: python
      value: file://assertions.py:validate_review_edit_handle_coverage
      metric: audited_handles
    - type: python
      value: file://assertions.py:validate_review_edit_replacements
      metric: grounded_edits

- description: Standalone review distinguishes local and missing context
  metadata:
    surface: standalone_review
    cefr: A1
    kind: phraseology
    source_lesson: synthetic
  vars:
    surface: standalone_review
    payload: |
      [
        {
          "id": "clear",
          "operation": "choose",
          "prompt": "Choose the Norwegian phrase for bringing the book.",
          "stem": "You are bringing the book.",
          "options": [
            {"option_id": "bring", "text": "Jeg tar med boka."},
            {"option_id": "have", "text": "Jeg har med boka."}
          ]
        },
        {
          "id": "missing",
          "operation": "choose",
          "prompt": "Return to the dialogue above and choose the reply.",
          "stem": null,
          "options": [
            {"option_id": "a", "text": "Ja."},
            {"option_id": "b", "text": "Nei."}
          ]
        }
      ]
  assert:
    - type: llm-rubric
      metric: decision_correctness
      value: |
        The payload contains exercise `clear`, which carries its complete task,
        and exercise `missing`, whose prompt refers to a dialogue that is not
        present. Return pass=true only when the review marks `clear` standalone
        and `missing` context-dependent, with exactly one status per id and no
        correctness or naturalness claims; return pass=false when either id gets
        the other status, a status is missing, or the review judges answer
        correctness instead of standalone context.
      provider:
        id: file://provider.py:call_api
        config:
          job: curriculum_reviewer
          json_response: true

- description: Pedagogy review identifies a concrete wrong Bokmål form
  metadata:
    surface: pedagogy
    cefr: A1
    kind: grammar
    source_lesson: synthetic
  vars:
    surface: pedagogy
    lesson: |
      {
        "title": "Comparing things",
        "cefr_level": "A1",
        "goal": "Compare two things with better.",
        "objectives": [{"id":"o1","statement":"Compare two things."}],
        "elements": [{
          "element_kind":"section","id":"s1","role":"model","title":"Comparison",
          "blocks":[{"kind":"paragraph","spans":[{"kind":"text","value":"Godere is the Norwegian form for better."}]}]
        }]
      }
  assert:
    - type: llm-rubric
      metric: decision_correctness
      value: |
        The lesson text presents `godere` as the Norwegian form for better, but
        the correct Bokmål comparative is `bedre`. Return pass=true only when the
        review reports a grounded issue that identifies this wrong form and
        names `bedre`; return pass=false when the review passes the lesson or
        invents additional defects that the text does not contain.
      provider:
        id: file://provider.py:call_api
        config:
          job: curriculum_reviewer
          json_response: true

