[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norsk-lesson-factory"
version = "0.1.0"
description = "Phase 1 Norwegian grammar lesson generation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1.0",
    "httpx==0.27.0",
    "json-repair>=0.61.0",
    "pydantic>=2.0",
    "python-dotenv==1.0.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "langchain-core>=1.0,<2.0",
    "uvicorn>=0.38,<1.0",
]

[project.scripts]
lesson-data = "lesson_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-xdist>=3.8.0",
    "factory-boy>=3.3.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
