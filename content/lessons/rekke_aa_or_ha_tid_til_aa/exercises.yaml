- handle: checkpoint_negative_problem
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: analyze
  prompt_md: Read the four negative Norwegian sentences. Choose the interpretation
    set that classifies every sentence correctly. Available-time means lack of room
    in the schedule; cutoff means inability to complete before an endpoint. 1. Nora
    har ikke tid til å kontrollere tallene. 2. Nora rekker ikke å skrive om teksten
    før møtet begynner. 3. Emil har ikke tid til å forlate kontoret. 4. Emil rekker
    ikke å ta bussen.
  derived_from:
  - section_id: negative-statements-reveal-the-difference
  stem_md: Choose the interpretation set that classifies all four sentences correctly.
  options:
  - id: set-first-pair-swapped
    text: '1: Manglende ferdigstillelse før et tidspunkt (failure to finish before
      a cutoff); 2: Mangel på tilgjengelig tid (lack of available time); 3: Mangel
      på tilgjengelig tid (lack of available time); 4: Manglende ferdigstillelse før
      et tidspunkt (failure to finish before a cutoff).'
    correct: false
    why: This reverses the meanings of the first two sentences.
  - id: set-second-pair-swapped
    text: '1: Mangel på tilgjengelig tid (lack of available time); 2: Manglende ferdigstillelse
      før et tidspunkt (failure to finish before a cutoff); 3: Manglende ferdigstillelse
      før et tidspunkt (failure to finish before a cutoff); 4: Mangel på tilgjengelig
      tid (lack of available time).'
    correct: false
    why: This reverses the meanings of the third and fourth sentences.
  - id: set-all-cutoff
    text: '1: Manglende ferdigstillelse før et tidspunkt (failure to finish before
      a cutoff); 2: Manglende ferdigstillelse før et tidspunkt (failure to finish
      before a cutoff); 3: Manglende ferdigstillelse før et tidspunkt (failure to
      finish before a cutoff); 4: Manglende ferdigstillelse før et tidspunkt (failure
      to finish before a cutoff).'
    correct: false
    why: Sentences 1 and 3 describe lack of general available time, not failure against
      a stated or understood cutoff.
  - id: set-correct
    text: '1: Mangel på tilgjengelig tid (lack of available time); 2: Manglende ferdigstillelse
      før et tidspunkt (failure to finish before a cutoff); 3: Mangel på tilgjengelig
      tid (lack of available time); 4: Manglende ferdigstillelse før et tidspunkt
      (failure to finish before a cutoff).'
    correct: true
    why: Sentences 1 and 3 use har ikke tid til å for lack of schedule room; sentences
      2 and 4 use rekke ikke å for failure against a cutoff, including an understood
      bus departure.
