- handle: checkpoint_hidden_cutoff
  op: write
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: 'For each situation, write a few words in Norwegian that identify the
    event limiting the available time and explain why the action must be completed
    before it. Situations: 1. At a station, you want to buy coffee, but the bus leaves
    in five minutes. 2. You need to buy food, but the shop closes soon. 3. You need
    to send an email, and the meeting starts shortly. 4. You need to finish a report,
    and it is due at the end of the day.'
  derived_from:
  - section_id: completion-before-a-cutoff-rekke-aa
  response_language: 'no'
  min_words: 20
  max_words: 75
  judge_prompt: Check all four situations separately and report evidence for each
    criterion. Accept concise natural Norwegian wording and equivalent endpoint descriptions.
  criteria:
  - id: hidden-endpoints
    instruction: Identifies the relevant endpoint in each of the bus, shop, meeting,
      and report situations.
  - id: completion-before-endpoint
    instruction: Explains for each situation why the action must be completed before
      that endpoint.
