- handle: guided_nora_emil_plan
  op: write
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: Continue the office story in four short Norwegian lines. Write one positive
    and one negative line about actions Nora and Emil can complete before the bus
    leaves. Write one positive and one negative line about activities they have time
    to do during the journey. Use rekke å for the bus-cutoff lines and ha tid til
    å for the journey-availability lines.
  derived_from:
  - section_id: guided-practice-in-new-situations
  response_language: 'no'
  min_words: 20
  max_words: 60
  judge_prompt: Check all four lines separately. Accept natural Norwegian variants,
    but require the requested polarity, time perspective, and target expression in
    each line.
  criteria:
  - id: cutoff-positive
    instruction: Includes a positive rekke å line connecting completed action with
      the bus departure.
  - id: cutoff-negative
    instruction: Includes a negative rekke å line connecting failure to complete an
      action with the bus departure.
  - id: availability-positive
    instruction: Includes a positive ha tid til å line about an activity during the
      journey.
  - id: availability-negative
    instruction: Includes a negative ha tid til å line about an activity during the
      journey.
