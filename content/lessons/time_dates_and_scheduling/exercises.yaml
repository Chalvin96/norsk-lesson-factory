- handle: understand_course_plan
  op: choose
  objective: obj-time-dates-and-scheduling-01
  bloom: understand
  derived_from:
  - section_id: practice-understand-the-course-plan
  prompt_md: Choose the complete interpretation of the course-start schedule.
  stem_md: Which statement correctly identifies the date, course start time, meeting
    time, and meaning of halv seks?
  options:
  - id: wrong_date
    text: Kurset begynner 15. mai klokka halv seks (17.30), og Nora og Amir møtes
      klokka kvart over fem (17.15).
    correct: false
    why: The course date is incorrect.
  - id: correct
    text: Kurset begynner 14. mai klokka halv seks (17.30), og Nora og Amir møtes
      klokka kvart over fem (17.15).
    correct: true
    why: This identifies the correct date and both times, and interprets halv seks
      as 17.30.
  - id: wrong_meeting_time
    text: Kurset begynner 14. mai klokka halv seks (17.30), og Nora og Amir møtes
      klokka kvart på seks (17.45).
    correct: false
    why: The meeting time is incorrect.
  - id: wrong_course_time
    text: Kurset begynner 14. mai klokka halv fem (16.30), og Nora og Amir møtes klokka
      kvart over fem (17.15).
    correct: false
    why: Halv seks means 17.30, not 16.30.
- handle: locate_time_around_the_hour
  op: categorize
  objective: obj-time-dates-and-scheduling-01
  bloom: analyze
  prompt_md: 'Classify each Norwegian schedule sentence by direction around the named
    hour: after the hour with over, or before the hour with på.'
  buckets:
  - bucket_id: after-hour
    label: After the named hour — over
  - bucket_id: before-hour
    label: Before the named hour — på
  items:
  - item_id: after-1
    text: 17.10 — Bussen går klokka ti over fem.
    bucket_id: after-hour
  - item_id: after-2
    text: 17.15 — Møtet starter klokka kvart over fem.
    bucket_id: after-hour
  - item_id: before-1
    text: 17.50 — Timen begynner klokka ti på seks.
    bucket_id: before-hour
  - item_id: before-2
    text: 17.45 — Bussen går klokka kvart på seks.
    bucket_id: before-hour
  explanation_md: "Clock expressions are calculated around the coming hour: halv seks is 17:30, and over/på/før place minutes relative to the named hour."
  derived_from:
  - section_id: practice-locate-time-around-the-hour
- handle: interpret_half_hour_expressions
  op: choose
  objective: obj-time-dates-and-scheduling-01
  bloom: understand
  prompt_md: Choose the single mapping that correctly interprets all three digital
    times. Focus on the hour named in halv expressions.
  options:
  - id: half-mapping-correct
    text: 17.20 = ti på halv seks; 17.30 = halv seks; 17.40 = ti over halv seks.
    correct: true
    why: The midpoint is halv seks at 17.30; ti på halv seks is 17.20 and ti over
      halv seks is 17.40.
  - id: half-mapping-reversed
    text: 17.20 = ti over halv seks; 17.30 = halv seks; 17.40 = ti på halv seks.
    correct: false
    why: The before-and-after directions are reversed around the midpoint.
  - id: half-mapping-shifted
    text: 17.20 = ti på halv seks; 17.30 = ti over halv seks; 17.40 = halv seks.
    correct: false
    why: Halv seks names the midpoint at 17.30, not 17.40.
  - id: half-mapping-mixed
    text: 17.20 = halv seks; 17.30 = ti på halv seks; 17.40 = ti over halv seks.
    correct: false
    why: The midpoint and the two surrounding expressions are assigned to the wrong
      times.
  derived_from:
  - section_id: practice-interpret-half-hour-expressions
- handle: express_a_given_clock_time
  op: recall_fill
  objective: obj-time-dates-and-scheduling-01
  bloom: apply
  prompt_md: Complete each Norwegian sentence with the everyday clock expression for
    the given digital time.
  audio_target: "Bussen går klokka ti over fem. Timen begynner klokka kvart over fem. Kurset begynner klokka halv seks. Møtet starter klokka kvart på seks."
  segments:
  - text_md: '17.10 — Bussen går klokka '
  - blank_id: bus-time
    options:
    - ti over fem
    - ti på fem
    answer_index: 0
  - text_md: '. 17.15 — Timen begynner klokka '
  - blank_id: lesson-time
    options:
    - kvart over fem
    - kvart på fem
    answer_index: 0
  - text_md: '. 17.30 — Kurset begynner klokka '
  - blank_id: course-time
    options:
    - halv seks
    - halv fem
    answer_index: 0
  - text_md: '. 17.45 — Møtet starter klokka '
  - blank_id: meeting-time
    options:
    - kvart på seks
    - kvart over fem
    answer_index: 0
  - text_md: .
  explanation_md: "Everyday clock phrases count around the next hour: 17:30 is halv seks, not halv fem."
  derived_from:
  - section_id: practice-express-a-given-clock-time
