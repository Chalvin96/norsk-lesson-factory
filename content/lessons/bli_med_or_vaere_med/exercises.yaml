- handle: first_checkpoint_finding_change
  op: choose
  objective: obj-bli-med-or-vaere-med-01
  bloom: understand
  prompt_md: Choose the interpretation that matches both uses in the developing trip
    plan. Identify what each Norwegian expression highlights.
  derived_from:
  - section_id: central-contrast
  stem_md: The plan says «Først spør Sara om Jonas vil bli med.» About Omar, Sara
    says «Han er med på turen, men han blir med først i morgen.» Which interpretation
    matches both uses?
  options:
  - id: reversed-viewpoints
    text: «Først spør Sara om Jonas vil bli med» reports that Jonas already participates;
      «Han er med på turen» presents an invitation for Omar to join.
    correct: false
    why: 'This reverses the viewpoints: the first expression concerns joining, and
      the second reports inclusion.'
  - id: correct
    text: «Først spør Sara om Jonas vil bli med» presents an invitation for Jonas
      to enter the trip; «Han er med på turen» presents Omar as already included in
      the trip.
    correct: true
    why: Bli med highlights entry through an invitation or decision, while er med
      reports existing participation or inclusion.
  - id: both-entry
    text: Both expressions describe someone entering the trip through a new decision
      to join.
    correct: false
    why: The second expression uses er med and describes participation that is already
      settled.
