- handle: context_cabin_plan
  op: write
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: 'Write a short, connected Norwegian sequence about the cabin trip. From
    Friday''s viewpoint, state that Lea accepts the invitation to ride in Sara''s
    car, Jonas is already included in the trip, Omar is already included but will
    physically join on Saturday, and Lea accepts the request to help carry the food
    and participates in that team. Then switch to the later viewpoint and report Omar''s
    joining and participation. Use blir med and er med for Friday''s plan, and ble
    med and var med when reporting the later Saturday result. Keep the viewpoint distinction
    clear: use a form of bli med for acceptance or arrival and a form of være med
    for established inclusion or participation in the food-carrying team.'
  derived_from:
  - section_id: back-at-cabin-trip
  response_language: 'no'
  min_words: 35
  max_words: 75
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål wording around the required people and events, but require
    the stated timeline and the required bli med/være med viewpoint contrast, including
    the appropriate present and past forms.
  criteria:
  - id: cabin-roles
    instruction: Identifies Lea as accepting the invitation and helping carry the
      food, identifies Jonas and Omar as already included in the trip, and identifies
      Omar as joining later.
  - id: cabin-time-forms
    instruction: Uses present forms for Friday's plan and past forms when reporting
      Omar's later joining and participation.
  - id: cabin-viewpoint-contrast
    instruction: Uses a form of **bli med** for acceptance or later arrival and a
      form of **være med** for established inclusion or participation in the food-carrying
      team.
- handle: final_retrieval_pairs
  op: write
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: Write two short connected Norwegian pairs in new contexts using your own
    wording. In pair one, describe a person accepting an invitation to a study group
    using blir med, then describe that person's membership using er med. In pair two,
    describe a person who participated in a concert last year using var med, then
    describe a friend deciding to join this year's concert using blir med. Use new
    names and lexical details.
  derived_from:
  - section_id: final-retrieval
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: 'Check the response against the task and report evidence for each
    criterion. Accept natural names, connectors, and surrounding wording, but require
    the specified forms and viewpoint contrast: blir med for entering or accepting,
    er med for settled membership, and var med for past participation.'
  criteria:
  - id: study-group-viewpoints
    instruction: Uses **blir med** for accepting the study-group invitation and **er
      med** for the person's existing membership.
  - id: concert-viewpoints
    instruction: Uses **var med** for participation in the concert last year and **blir
      med** for the friend's decision to join this year's concert.
  - id: new-context-pairs
    instruction: Creates two connected pairs in the requested study-group and concert
      contexts with new names and lexical details.
