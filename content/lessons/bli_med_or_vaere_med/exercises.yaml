  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: 'Complete both exchanges with the expression that fits the speaker''s
    viewpoint. The activities are future in time, so use the focus of each response
    rather than time alone: the first response accepts an invitation, while the second
    confirms participation as settled.'
  explanation_md: "Use blir med when accepting the invitation as a new decision; use er med when confirming participation that is already settled."
  derived_from:
  - section_id: useful-overlap-invitations
  audio_target: "— Vi skal på biblioteket etter jobb. Vil du være med? — Ja, jeg blir med til biblioteket. — Er du med på dugnaden på lørdag? — Ja, jeg er med; jeg står på deltakerlista."
