- handle: contrast_before_after
  op: choose
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: Choose the pair that follows Nora from deciding to join the choir rehearsal
    to taking part in it.
  derived_from:
  - section_id: same-event-two-viewpoints
  stem_md: Nora initially says no. Later she changes her mind and joins the rehearsal.
    Once it begins, she participates with the choir. Which pair expresses that sequence?
  options:
  - id: entry-then-participation
    text: Først blir Nora med på korøvelsen. Etterpå er Nora med på korøvelsen.
    correct: true
    why: Blir med marks Nora's entry; er med describes her participation afterwards.
  - id: participation-then-entry
    text: Først er Nora med på korøvelsen. Etterpå blir Nora med på korøvelsen.
    correct: false
    why: This puts established participation before the decision to join.
  - id: entry-twice
    text: Først blir Nora med på korøvelsen. Etterpå blir Nora med på korøvelsen.
    correct: false
    why: The second sentence should describe participation after entry, not a second
      act of joining.
- handle: viewpoint_overlap
