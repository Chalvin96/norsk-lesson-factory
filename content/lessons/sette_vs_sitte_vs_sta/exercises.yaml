- handle: notice_action_and_position
  op: categorize
  objective: obj-sette-vs-sitte-vs-sta-01
  bloom: analyze
  prompt_md: 'In the meeting-room examples below, classify each Norwegian
    sentence by physical role: placing action, seated position, or upright position.
    Classify the meaning rather than translating the verb mechanically.'
  explanation_md: "Sette describes causing something to enter a position; sitte and stå describe the position itself."
