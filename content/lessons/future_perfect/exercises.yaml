    bucket_id: future-completion
- handle: weekend_trip_future_completion_transfer
  op: write
  objective: obj-future-perfect-01
  bloom: apply
  prompt_md: You are preparing for a family cabin trip. The family leaves at ten o'clock
    on Saturday. Write three short Norwegian messages about packing food, charging
    the car, checking the weather forecast, and giving a key to a neighbor. Use one
    planned completion with skal ha, one prediction with vil ha, and one evidence-based
    expected result with kommer til å ha. Make each message refer to completion before
    departure.
  derived_from:
  - section_id: transfer-preparing-for-a-weekend-trip
  response_language: 'no'
  min_words: 20
  max_words: 55
  judge_prompt: Check the response against the task and report evidence for every
    criterion.
  criteria:
  - id: planned-completion
    instruction: Includes one planned cabin-trip responsibility with skal ha and an
      appropriate past participle.
  - id: future-prediction
    instruction: Includes one prediction with vil ha and an appropriate past participle,
      viewed from departure time.
  - id: evidence-based-expectation
    instruction: Includes present evidence and uses the complete form kommer til å
      ha, including til å, with an appropriate past participle.
  - id: later-reference-points
    instruction: Makes each message include or clearly depend on a later reference
      point before departure.
  - id: shared-completion-meaning
    instruction: Uses all three constructions accurately to express completion before
      the family leaves.
