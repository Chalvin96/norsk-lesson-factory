- handle: future_completion_timeline
  op: choose
  objective: obj-future-perfect-01
  bloom: understand
  prompt_md: 'Two workplace situations: Maja has not finished the report yet, and
    the meeting is later. Eirik has not sent the plan yet, and lunch is later. Choose
    the complete interpretation for both situations: the action is unfinished now
    and will be complete before the stated later point.'
  derived_from:
  - section_id: first-checkpoint-finding-time-points
  stem_md: Choose the interpretation that expresses future completion in both situations.
  options:
  - id: present-completion
    text: 1. Maja har skrevet rapporten nå. / Maja has written the report now. 2.
      Eirik har sendt planen allerede. / Eirik has already sent the plan.
    correct: false
    why: Both statements present the actions as complete now, not unfinished until
      a later point.
  - id: ordinary-future
    text: 1. Maja skal skrive rapporten etter møtet. / Maja will write the report
      after the meeting. 2. Eirik skal sende planen ved lunsj. / Eirik will send the
      plan at lunch.
    correct: false
    why: These statements describe future activities, not completion before the later
      points.
  - id: future-completion
    text: 1. Maja er ikke ferdig med rapporten ennå, men hun skal ha skrevet den før
      møtet. / Maja has not finished the report yet, but she will have written it
      before the meeting. 2. Eirik har ikke sendt planen ennå, men han vil ha sendt
      den før lunsj. / Eirik has not sent the plan yet, but he will have sent it before
      lunch.
    correct: true
    why: Both statements identify an unfinished action and completion before a later
      point.
  - id: after-deadline
    text: 1. Maja skal ha skrevet rapporten etter møtet. / Maja will have written
      the report after the meeting. 2. Eirik vil ha sendt planen etter lunsj. / Eirik
      will have sent the plan after lunch.
    correct: false
    why: Both actions are completed after the stated later points rather than before
      them.
- handle: future_completion_form
  op: recall_fill
  objective: obj-future-perfect-01
  bloom: apply
  prompt_md: Complete each Norwegian sentence with the correct future-perfect unit.
    Each future marker is already supplied.
  explanation_md: "Future perfect uses a future marker + «ha» + past participle to show completion before a later deadline or reference point."
  derived_from:
  - section_id: form-checkpoint
  audio_target: "Før møtet skal jeg ha skrevet rapporten. Ved lunsj vil Eirik ha sendt planen. Før fredag kommer vi til å ha gjort ferdig oppgaven. Når kurset er slutt, vil jeg ha lest den siste teksten."
  segments:
  - text_md: 'Før møtet skal jeg '
  - blank_id: form-written
    options:
    - ha skrevet
    - skrive
    answer_index: 0
  - text_md: ' rapporten. Ved lunsj vil Eirik '
  - blank_id: form-sent
    options:
    - ha sendt
    - sende
    answer_index: 0
  - text_md: ' planen. Før fredag kommer vi til å '
  - blank_id: form-done
    options:
    - ha gjort ferdig
    - gjøre ferdig
    answer_index: 0
  - text_md: ' oppgaven. Når kurset er slutt, vil jeg '
  - blank_id: form-read
    options:
    - ha lest
    - lese
    answer_index: 0
  - text_md: ' den siste teksten.'
