  buckets:
  - bucket_id: happening-now
    label: Activity happening now
  - bucket_id: complete-now
    label: Completed now
  - bucket_id: ordinary-future
    label: Ordinary future activity
  - bucket_id: future-completion
    label: Complete before a later point
  items:
