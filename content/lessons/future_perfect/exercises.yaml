  objective: obj-future-perfect-01
  bloom: analyze
  prompt_md: Place each Norwegian sentence in the bucket that describes its time relationship.
    Focus on whether the action is happening now, already complete now, an ordinary
    future activity, or complete before a later point.
  derived_from:
