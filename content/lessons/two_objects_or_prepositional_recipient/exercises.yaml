- handle: transfer_recipient_patterns_to_cafe_scene
  op: write
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: 'In Norwegian, write four short sentences about Lea finding Emil''s backpack
    at a café and contacting him. Mention the backpack, a message, the number, and
    the receipt. Alternate the frames exactly: sentences 1 and 3 use verb + recipient
    + theme without til; sentences 2 and 4 use verb + theme + til + recipient. Make
    clear who receives each item, and use original café wording throughout.'
  derived_from:
  - section_id: cumulative-transfer-a-forgotten-backpack
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check exactly four Norwegian sentences against the task and report
    evidence for each criterion. Accept natural Bokmål wording and inflection for
    the listed items, including ryggsekken or sekken for the backpack and nummeret
    for the number. Require clear recipients and themes, the specified alternating
    frame order, and a new café context rather than copied office wording.
  criteria:
  - id: cafe-who-receives-what
    instruction: Makes it clear who receives each of the backpack, message, number,
      and receipt.
  - id: cafe-alternating-order
    instruction: Uses recipient before theme without til in sentences 1 and 3, and
      theme before til + recipient in sentences 2 and 4.
  - id: cafe-transfer-accuracy
    instruction: Uses accurate recipient–theme frame choice and ordering in the new
      café context.
- handle: recall_two_recipient_frames
  op: write
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: 'Without looking back, write in Norwegian the two ordering patterns for
    gi and sende. Then write two new Norwegian sentences about one transfer, such
    as sending the address to the customer: first put the recipient before the theme
    without til; then put the theme before til + recipient. Keep the same recipient
    and theme in both sentences.'
  derived_from:
  - section_id: short-review
  response_language: 'no'
  min_words: 15
  max_words: 45
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept equivalent Norwegian wording for the labels recipient and theme, but require
    both structural orders and the Norwegian function words uten til and til. The
    two example sentences must describe the same new transfer and must not copy a
    complete sentence from the lesson.
  criteria:
  - id: two-object-pattern
    instruction: States in Norwegian the pattern verb + mottaker + tema, uten til,
      or an equivalent Norwegian formulation.
  - id: til-pattern
    instruction: States in Norwegian the pattern verb + tema + til + mottaker, or
      an equivalent Norwegian formulation.
  - id: same-transfer-two-frames
    instruction: Produces two Norwegian sentences about the same transfer, with recipient
      before theme in the first and theme before til + recipient in the second.
