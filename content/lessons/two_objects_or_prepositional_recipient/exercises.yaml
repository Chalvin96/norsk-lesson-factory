- handle: notice_recipient_before_theme
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: Read these Norwegian office sentences and choose the interpretation that
    correctly identifies the recipient and the theme. The recipient is the person
    who receives something; the theme is the thing given or sent. Jonas gir Nora nøkkelen.
    (Jonas gives Nora the key.) Jeg sender henne boka. (I send her the book.)
  derived_from:
  - section_id: two-participants-after-the-verb
  stem_md: Which option correctly identifies the recipient and the theme in both sentences?
  options:
  - id: roles-reversed
    text: Nøkkelen and boka are recipients; Nora and henne are themes.
    correct: false
    why: The objects are themes, not recipients, in these sentences.
  - id: mixed-roles
    text: Nora is a recipient and nøkkelen is a recipient; henne and boka are themes.
    correct: false
    why: Nøkkelen is the theme in the first sentence, and henne is the recipient in
      the second.
  - id: no-recipient
    text: The elements after gi and sende are both themes, so no recipient is identified.
    correct: false
    why: The first element after the verb identifies the recipient.
  - id: roles-correct
    text: Nora and henne are recipients; nøkkelen and boka are themes.
    correct: true
    why: Nora and henne are the first elements after gir or sender; nøkkelen and boka
      follow as themes.
- handle: match_roles_across_frames
  op: match_pairs
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: remember
  prompt_md: Match each Norwegian sentence with the sentence describing the same transfer
    in the other frame. Track both the recipient and the theme.
  explanation_md: "The two-object frame places recipient before theme; the til frame places the theme before til + recipient."
  derived_from:
  - section_id: frame-2-theme-before-til-recipient
  left:
  - left_id: left-1
    text: Jonas gir Nora nøkkelen.
  - left_id: left-2
    text: Mari sender Jonas adressen.
  right:
  - right_id: right-1
    text: Jonas gir nøkkelen til Nora.
  - right_id: right-2
    text: Mari sender adressen til Jonas.
  pairs:
  - left_id: left-1
    right_id: right-1
  - left_id: left-2
    right_id: right-2
- handle: choose_licensed_recipient_frame
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: Choose one complete Norwegian sentence. Its first clause must use verb
    + recipient + theme without til, and its second clause must use verb + theme +
    til + recipient. Keep both clauses correctly ordered.
  derived_from:
  - section_id: choosing-the-frame
  stem_md: Which complete sentence uses both licensed frames in the required order?
  options:
  - id: til-before-theme
    text: Gi til Nora nøkkelen, og send bildet til meg.
    correct: false
    why: The first clause incorrectly puts til + recipient before the theme.
  - id: recipient-first-twice
    text: Gi Nora nøkkelen, og send meg bildet.
    correct: false
    why: The second clause uses recipient before theme instead of theme before til
      + recipient.
  - id: both-licensed
    text: Gi Nora nøkkelen, og send bildet til meg.
    correct: true
    why: The first clause puts the recipient before the theme without til; the second
      puts the theme before til + recipient.
  - id: mixed-second-frame
    text: Gi Nora nøkkelen, og send til meg bildet.
    correct: false
    why: The second clause mixes til + recipient with the wrong element order.
