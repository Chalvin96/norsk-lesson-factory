- handle: retrieve_and_transfer_old_neighborhood
  op: write
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: Henrik has returned to the neighborhood where he lived as a student.
    Write 5–7 short Norwegian sentences about his regular travel, meals, study, and
    evening activities during his student years, using pleide å + infinitive for each
    recurring habit. Report one completed action during today's visit with an ordinary
    past-tense verb. Then briefly explain in Norwegian why pleide å fits the routine
    sentences but not today's finished event. Use your own wording; do not copy a
    complete sentence from the lesson.
  derived_from:
  - section_id: final-retrieval-and-transfer
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants and suitable ordinary past-tense verbs; do not
    require exact wording from the lesson.
  criteria:
  - id: recurring-habits
    instruction: Describes Henrik's regular travel, meals, study, and evening activities
      with pleide å + infinitive.
  - id: finished-event
    instruction: Reports one completed action during today's visit with an ordinary
      past-tense verb, not pleide å.
  - id: contrast-explanation
    instruction: Briefly explains in Norwegian why pleide å fits recurring past behavior
      but not one finished event.
  - id: independent-transfer
    instruction: Uses Henrik's new situation and own wording instead of copying a
      complete sentence from the lesson.
