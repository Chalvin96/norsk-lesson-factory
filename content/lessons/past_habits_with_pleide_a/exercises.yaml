- handle: choose_past_habit_or_finished_event
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: understand
  prompt_md: Sara regularly bought coffee on her way to work in the past. This morning
    she bought two cups. Choose the pair that uses pleide å only for the former recurring
    behavior and ordinary past for today's finished action.
  derived_from:
  - section_id: a-former-evening-habit-and-one-evening
  stem_md: Which pair completes both situations with the correct meaning?
  options:
  - id: ordinary-past-for-both
    text: «Sara kjøpte kaffe på vei til jobb. I morges kjøpte Sara to kopper kaffe.»
      (Sara bought coffee on her way to work. This morning Sara bought two cups of
      coffee.)
    correct: false
    why: The first situation is a recurring former behavior, so the taught pattern
      uses pleide å.
  - id: correct
    text: «Sara pleide å kjøpe kaffe på vei til jobb. I morges kjøpte Sara to kopper
      kaffe.» (Sara used to buy coffee on her way to work. This morning Sara bought
      two cups of coffee.)
    correct: true
    why: The first sentence presents a former routine with pleide å, while the second
      presents one finished action with ordinary past.
