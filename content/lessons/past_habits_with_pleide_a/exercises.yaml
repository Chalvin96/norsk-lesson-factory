- handle: notice_routine_and_event
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: understand
  prompt_md: Choose the complete interpretation of the supplied Maja and Jonas statements
    that separates recurring childhood routines from actions during Maja's single
    trip yesterday and identifies the helpful time expressions.
  derived_from:
  - section_id: back-in-the-old-neighborhood
  stem_md: Which interpretation correctly separates the recurring routines from the
    finished trip?
  options:
  - id: wrong-all-event
    text: The four lines with «pleide å» describe one finished event, while the lines
      connected to «I går» describe routines. «I går» names a recurring past period.
    correct: false
    why: «Pleide å» marks recurring past behavior, and «I går» places an action in
      a finished past time.
  - id: wrong-time-cues
    text: Only «hver morgen» marks a routine. «Da jeg bodde her» and «etter skolen»
      describe single events, while the three actions connected to «I går» are routines.
    correct: false
    why: The context presents «Da jeg bodde her» and «etter skolen» as part of repeated
      childhood routines, not single events.
  - id: correct
    text: The recurring childhood routines are «Da jeg bodde her, pleide jeg å sykle
      langs elva hver morgen.» (When I lived here, I used to cycle along the river
      every morning), «Ja, og du pleide å vente på meg ved den gamle brua.» (Yes,
      and you used to wait for me by the old bridge), «Vi pleide å kjøpe is i kiosken
      etter skolen også.» (We used to buy ice cream at the kiosk after school too),
      and «Det stemmer. Eieren pleide å kjenne alle barna i området.» (That’s right.
      The owner used to know all the children in the area.). The single trip yesterday
      includes «I går syklet jeg langs elva igjen.» (Yesterday I cycled along the
      river again), «Stoppet du ved kiosken?» (Did you stop at the kiosk?), and «Ja,
      jeg kjøpte en is.» (Yes, I bought an ice cream). «Da jeg bodde her», «hver morgen»,
      and «etter skolen» support a recurring past period, while «I går» places actions
      in one finished trip.
    correct: true
    why: This separates recurring past behavior from actions in one finished visit
      and uses the conversation’s time expressions as evidence.
  - id: wrong-repetition
    text: All seven actions belong to recurring childhood behavior because several
      actions occurred. The distinction between «pleide å» and ordinary past forms
      does not matter.
    correct: false
    why: Several actions during one visit do not become a recurring past habit.
