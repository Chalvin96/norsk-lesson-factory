- handle: understand_complete_everyday_instructions
  op: choose
  objective: obj-imperative-01
  bloom: understand
  prompt_md: Determine the action, object, and destination expressed by the two instructions.
  derived_from:
  - section_id: useful-instructions
  stem_md: 'Item 1: Ta glassene! 2. Sett glassene her! Choose the correct interpretation.'
  options:
  - id: take-then-put
    text: First take the glasses. Then put the glasses here.
    correct: true
    why: Ta means take, while Sett means put and her supplies the destination.
  - id: take-twice
    text: Both instructions tell the listener to take the glasses.
    correct: false
    why: The second instruction uses Sett and specifies where to put the glasses.
  - id: put-then-take
    text: First put the glasses here. Then take the glasses.
    correct: false
    why: This reverses the actions expressed by Ta and Sett.
- handle: build_two_step_instructions
  op: build
  objective: obj-imperative-01
  bloom: apply
  prompt_md: Build a sensible two-step party-setup instruction. Move the chair, then
    open the door. Join the actions with og.
  derived_from:
  - section_id: useful-instructions
  tokens:
  - token_id: chair
    text: stolen
  - token_id: and
    text: og
  - token_id: open
    text: åpne
  - token_id: door
    text: døra!
  - token_id: move
    text: Flytt
  answer_order:
  - move
  - chair
  - and
  - open
  - door
- handle: repair_common_imperative_errors
  op: find_fix
  objective: obj-imperative-01
  bloom: analyze
  prompt_md: 'Select the single incorrect verb form in this instruction. The feedback explains the natural command form.'
  derived_from:
  - section_id: common-imperative-errors
  tokens:
  - token_id: incorrect-verb
    text: Setter
  - token_id: object
    text: glasset
  - token_id: location
    text: her!
  error_token_id: incorrect-verb
  feedback: Replace Setter with Sett. Sett glasset her! preserves the intended meaning
    while removing the present-tense ending.
