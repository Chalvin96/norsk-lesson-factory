- handle: notice_imperatives_in_party_setup
  op: choose
  objective: obj-imperative-01
  bloom: understand
  prompt_md: Identify which lines directly instruct Sara and what actions she should
    perform.
  derived_from:
  - section_id: imperative-meaning
  stem_md: 'Mina says: 1. Du kommer inn. 2. Ta denne esken! 3. Sett glassene her!
    Choose the correct interpretation.'
  options:
  - id: instruction-one-only
    text: 'Only line 1 is an instruction: come inside. Lines 2 and 3 describe actions.'
    correct: false
    why: Lines 2 and 3 begin with imperative verbs and directly instruct the listener.
  - id: instructions-one-two
    text: 'Lines 1 and 2 are instructions: come inside, then take this box. Line 3
      is a statement.'
    correct: false
    why: Du kommer inn is a statement, while Sett glassene her! is an instruction.
  - id: instructions-two-three
    text: 'Lines 2 and 3 are instructions: take this box, then put the glasses here.
      Line 1 is a statement.'
    correct: true
    why: The imperative verbs Ta and Sett directly tell Sara what to do.
- handle: form_regular_imperatives_for_room_setup
  op: recall_fill
  objective: obj-imperative-01
  bloom: apply
  prompt_md: Complete each room-setup instruction with the imperative of the verb
    in parentheses.
  explanation_md: "The imperative addresses the listener directly and normally omits the subject. Regular infinitives in -e usually drop -e, while frequent short and irregular verbs must be learned as whole forms."
  derived_from:
  - section_id: remove-unstressed-e
  audio_target: "Flytt bordet! Finn serviettene! Lukk døra! Legg glassene på bordet! Kom hit!"
  segments:
  - text_md: 'Item 1: '
  - blank_id: move-table
    options:
    - Finn
    - Flytt
    answer_index: 1
  - text_md: ' bordet! (å flytte) 2. '
  - blank_id: find-objects
    options:
    - Finn
    - Flytt
    answer_index: 0
  - text_md: ' serviettene! (å finne) 3. '
  - blank_id: close-door
    options:
    - Legg
    - Lukk
    answer_index: 1
  - text_md: ' døra! (å lukke) 4. '
  - blank_id: place-glasses
    options:
    - Legg
    - Lukk
    answer_index: 0
  - text_md: ' glassene på bordet! (å legge) 5. '
  - blank_id: come-here
    options:
    - Finn
    - Kom
    answer_index: 1
  - text_md: ' hit! (å komme)'
