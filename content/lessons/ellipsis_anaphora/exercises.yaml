- handle: integrated_cohesive_conversation
  op: write
  objective: obj-ellipsis-anaphora-01
  bloom: apply
  prompt_md: 'Rewrite the following short planning conversation in natural Norwegian.
    For each repeated part, replace only unnecessary repetition with the appropriate
    choice among omission, det, gjøre det, gjerne, samme her, and slik. Keep enough
    detail for every reference to remain clear. Make the result sound connected and
    economical. Source conversation: - Mina: Jeg skal sette ut koppene hvis ingen
    andre skal sette ut koppene. - Eirik: Møtet er flyttet til lørdag. Jeg vet at
    møtet er flyttet til lørdag. - Mina: Kan du sende invitasjonene? Jeg skal sende
    invitasjonene etter lunsj. - Eirik: Skal vi invitere Kari til dugnaden? Ja, jeg
    vil gjerne invitere Kari til dugnaden. - Mina: Jeg er litt stresset før dugnaden.
    Jeg er også litt stresset før dugnaden. - Eirik: Vi setter stolene langs veggen
    og bordene ved vinduet. Vi bør sette stolene langs veggen og bordene ved vinduet
    på samme måte igjen.'
  response_language: 'no'
  judge_prompt: Check the rewritten dialogue against the task and report evidence
    for each criterion. Accept natural Bokmål variants when they preserve the requested
    functions and clear references; do not require exact lexical wording. Verify that
    repetition is reduced only when the omitted or pointed-to meaning is recoverable,
    and that each target form fits its discourse function.
  criteria:
  - id: economical-target-use
    instruction: Replaces unnecessary repeated material with an appropriate target
      device from the task so the conversation sounds connected and economical.
  - id: clear-references
    instruction: Keeps enough context for every omitted or backward-pointing meaning
      to remain immediately understandable.
  derived_from:
  - section_id: back-at-community-centre
- handle: retrieval_and_review
  op: write
  objective: obj-ellipsis-anaphora-01
  bloom: apply
  prompt_md: 'Write in natural Norwegian. Part 1: Briefly explain what each target
    form points to: an omitted action, shared information, a repeated action, willing
    acceptance, a shared reaction, or a manner of doing something. Part 2: Continue
    each of the six new volunteer-event exchanges in Norwegian. Use omission, standalone
    det, gjøre det, gjerne, samme her, and slik exactly once each across the six replies.
    Count standalone det separately from the det inside gjøre det. Make every reference
    clear and each reply natural. 1. A volunteer says: Jeg kan bære kassene hvis du
    ikke kan bære kassene. Reply with omission when the second volunteer cannot carry
    the boxes. 2. A volunteer says: Leveransen til frivilligsentralen kommer på tirsdag.
    Reply with standalone det to show relief or knowledge. 3. A volunteer asks: Kan
    du ringe de nye frivillige? Reply with an inflected form of gjøre det to say you
    will do it now. 4. A volunteer asks: Skal vi spørre Liv om å registrere gjestene?
    Reply with gjerne to accept willingly. 5. A volunteer says: Jeg blir litt nervøs
    før dugnaden. Reply with samme her to share the feeling. 6. A volunteer says:
    Vi skriver fargene på kassene og setter dem ved døren. Reply with slik to point
    to this method.'
  response_language: 'no'
  judge_prompt: Check both parts against the task and report evidence for each criterion.
    For the six replies, count standalone det separately from the fixed construction
    gjøre det. Accept natural Bokmål variants when they preserve the requested reference
    and discourse function. Verify that omission keeps the necessary modal or auxiliary
    and leaves only the shared action unspoken, and verify that each other target
    construction has its requested function and occurs once across the six replies.
  criteria:
  - id: function-explanations
    instruction: Explains in Norwegian what omission, det, gjøre det, gjerne, samme
      her, and slik point to, covering omitted action, shared information, repeated
      action, willing acceptance, shared reaction, and method.
  - id: six-natural-replies
    instruction: Uses omission, standalone det, gjøre det, gjerne, samme her, and
      slik exactly once in six natural replies about the new volunteer event.
  - id: clear-references
    instruction: Makes each omitted action, shared fact or reaction, repeated action,
      and method recoverable from its exchange.
  derived_from:
  - section_id: retrieval-review
