    - ta med
    - ha med
    answer_index: 0
  - text_md: ' passet. På flyplassen spør venninnen: '
  - blank_id: airport-question
    options:
    - Har du med
    - Tar du med
    answer_index: 0
  - text_md: ' passet? Lea åpner veska og sier at hun '
  - blank_id: confirmed-expression
    options:
    - har med
    - tar med
    answer_index: 0
  - text_md: ' passet.'
