- handle: guided_context_practice
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Write four short Norwegian sentences for these moments: before departure,
    state that one person will bring food; at the bus stop, ask whether another person
    has a blanket with them; at the park, report that someone has two friends with
    them; while discussing the next picnic, ask someone to bring a ball. Use ta med
    when arranging accompaniment and ha med when describing existing presence.'
  derived_from:
  - section_id: guided-context-practice
  response_language: 'no'
  judge_prompt: Check the response against every criterion and report evidence for
    each. Accept natural equivalent Norwegian wording and suitable names, but require
    the requested meanings and the distinction between ta med and ha med.
  criteria:
  - id: four-sentences
    instruction: Provides four short Norwegian sentences, one for each requested moment.
  - id: food-before-departure
    instruction: States before departure that one person will bring food, using a
      natural ta med expression.
  - id: blanket-bus-stop
    instruction: At the bus stop, asks whether another person has a blanket with them,
      using a natural ha med expression.
  - id: friends-at-park
    instruction: At the park, reports that someone has two friends with them, using
      a natural ha med expression.
  - id: ball-next-picnic
    instruction: During discussion of the next picnic, asks someone to bring a ball,
      using a natural ta med expression.
  - id: consistent-distinction
    instruction: Applies the distinction consistently across all four sentences.
- handle: retrieval_and_review
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: Write two connected Norwegian sentences about
    one object. In the first, arrange for it to accompany someone; in the second,
    confirm that the person has it with them.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: Check the response against the two connected Norwegian-sentence criteria and report evidence for each. Accept natural equivalent wording with the requested change from arranging accompaniment to confirming presence.
  criteria:
  - id: connected-norwegian-sentences
    instruction: Writes two connected Norwegian sentences about one object.
  - id: viewpoint-change
    instruction: Uses a Norwegian ta med expression for arranging accompaniment first
      and a Norwegian ha med expression for confirming presence second.
