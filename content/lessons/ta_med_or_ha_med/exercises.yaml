- handle: identify_ta_med_ha_med
  op: categorize
  objective: obj-ta-med-or-ha-med-01
  bloom: analyze
  prompt_md: Classify every listed use below. Put each use that
    arranges for something to come along in arranging-accompaniment; put each use
    that checks what is already with someone in already-present. Use the situation,
    not a translation of both expressions as bring.
  explanation_md: "Ta med views bringing as an action or preparation; ha med views the item as already accompanying the person."
  derived_from:
  - section_id: first-checkpoint-identify-action-and-situation
  buckets:
  - bucket_id: arranging-accompaniment
    label: Arranging for something to come along
  - bucket_id: already-present
    label: Checking what is already with someone
  items:
  - item_id: emil-ta-med
    text: 'Emil: ta med'
    bucket_id: arranging-accompaniment
  - item_id: nora-ha-med
    text: 'Nora: ha med'
    bucket_id: already-present
- handle: complete_travel_sequence
  op: recall_fill
  objective: obj-ta-med-or-ha-med-01
  bloom: understand
  prompt_md: Complete the travel sequence by choosing one appropriate Norwegian expression
    in each gap. The same passport is first made part of the journey, then checked
    and confirmed at the airport.
  derived_from:
  - section_id: second-checkpoint-complete-the-travel-sequence
  audio_target: "Før Lea går til flyplassen, må hun ta med passet. På flyplassen spør venninnen: «Har du med passet?» Lea åpner veska og sier at hun har med passet."
  segments:
