- handle: find_the_station_luggage
  op: write
  objective: obj-noun-phrase-order-01
  bloom: apply
  prompt_md: At the station, produce four natural Bokmål noun phrases. First, point
    out one small suitcase with a demonstrative. Second, identify several heavy bags
    as yours with the possessive first. Third, identify the shared red backpack with
    the possessive last. Fourth, point to that same shared red backpack among other
    luggage with a demonstrative and a postposed possessive. Use koffert for suitcase,
    veske for bag, and ryggsekk for backpack. Use the station meanings rather than
    copying cabin expressions.
  derived_from:
  - section_id: find-the-station-luggage
  response_language: 'no'
  judge_prompt: Check all four requested meanings and report evidence for every criterion.
    Require natural Bokmål agreement and the specified order. Accept ordinary Bokmål
    inflection of the specified station nouns, but do not accept a cabin phrase that
    ignores the new luggage meanings.
  criteria:
  - id: demonstrative-suitcase
    instruction: Produces a phrase meaning one small suitcase with denne + definite
      adjective + definite noun.
  - id: preposed-heavy-bags
    instruction: Produces a phrase meaning several heavy bags as the speaker's, with
      the possessive first, followed by an adjective and an indefinite plural noun.
  - id: postposed-shared-backpack
    instruction: Produces a phrase meaning the shared red backpack, using den + definite
      adjective + definite noun + postposed vår.
  - id: combined-shared-backpack
    instruction: Produces a phrase meaning this shared red backpack of ours, using
      a demonstrative + definite adjective + definite noun + postposed possessive.
  - id: station-transfer
    instruction: Uses the specified station luggage vocabulary and applies the requested
      noun-phrase frames to the changed situation rather than copying a cabin expression.
