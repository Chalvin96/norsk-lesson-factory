- handle: dinner_combined_interpretation
  op: choose
  objective: obj-modal-nuance-01
  bloom: analyze
  prompt_md: Choose the interpretation that keeps modal meaning and particle stance
    as separate layers in Nora’s delayed-dinner conversation.
  derived_from:
  - section_id: transfer-delayed-dinner
  stem_md: 'Nora says: «Jeg må jo handle nå.» She asks: «De skal vel komme klokka
    åtte?» She estimates: «Maten vil nok bli kald hvis vi venter.» She reacts: «Du
    kan da ikke servere uten brød.» She suggests: «Vi bør vel starte suppen nå.» Which
    interpretation is correct?'
  options:
  - id: collapsed-probability
    text: Må jo, skal vel, vil nok, kan da, and bør vel all express different degrees
      of probability.
    correct: false
    why: The modals and particles contribute different kinds of meaning, not one certainty
      scale.
  - id: particle-only
    text: 'The particles carry the complete meaning: jo gives necessity, vel gives
      arrangement, nok gives prediction, da gives ability, and vel gives advice.'
    correct: false
    why: The modal verbs supply the action or event framing.
  - id: modal-only
    text: The modal verbs carry the complete meaning, and jo, vel, nok, and da are
      decorative words with no effect on the conversation.
    correct: false
    why: The particles mark shared grounding, assumption, probability, and engaged
      response stance.

  - id: correct
    text: Må in må jo handle nå expresses necessity, while jo frames it as evident
      or relevant; skal in skal vel komme marks an arrangement, while vel presents
      it as an assumption seeking agreement; vil predicts the food becoming cold,
      while nok marks that result as probable; kan concerns practical possibility,
      while da adds an engaged reaction or insistence; bør gives sensible advice,
      while vel softens it and invites agreement.
    correct: true
    why: Each combination preserves two independent layers instead of treating it
      as a fixed expression.
