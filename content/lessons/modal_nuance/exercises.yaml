- handle: modal_and_particle_layering
  op: choose
  objective: obj-modal-nuance-01
  bloom: analyze
  prompt_md: Choose the interpretation that separates the modal layer from the particle
    layer and gives a natural English rendering.
  derived_from:
  - section_id: combining-modals-particles
  stem_md: 'Jonas has told Ingrid that his meeting with Sara is arranged. Ingrid asks:
    «Du skal vel møte Sara på stasjonen?» Which interpretation best contrasts the
    combined form with each contribution on its own?'
  options:
  - id: probability-source
    text: 'Skal marks Ingrid’s probability judgment and vel identifies information
      from a schedule. Natural English: The schedule probably says you will meet Sara.'
    correct: false
    why: Probability and source attribution are not the contributions of this combination.
  - id: single-fixed-meaning
    text: Skal vel is one fixed expression meaning must. The two words cannot be interpreted
      separately.
    correct: false
    why: The lesson explicitly teaches separate modal and particle contributions.
  - id: particle-arrangement
    text: 'Vel presents the arranged meeting, while skal merely asks Ingrid to confirm
      it. Natural English: You might meet Sara.'
    correct: false
    why: Skal supplies the arrangement perspective, and vel supplies assumption and
      confirmation.
  - id: correct
    text: 'Skal presents the meeting as arranged; vel presents that arrangement as
      Ingrid’s assumption and seeks confirmation. Bare skal would report the arrangement
      without the confirmation-seeking stance, while vel alone would contribute tentative
      assumption rather than arrangement. Natural English: You are going to meet Sara
      at the station, right?'
    correct: true
    why: The answer keeps the arrangement and the listener-oriented assumption as
      separate layers.
- handle: repair_dictionary_translation
  op: choose
  objective: obj-modal-nuance-01
  bloom: analyze
  prompt_md: Choose the complete repair of literal English-based interpretations in
    these contexts.
  derived_from:
  - section_id: common-translation-traps
  stem_md: 'Ordinary future: «Jeg kommer i morgen.» Instruction: «Du skal gå nå.»
    Possibility versus probability: «Hun kan være hjemme.» / «Hun er nok hjemme.»
    Shared grounding: «Du vet jo det.» Engaged response: «Det kan jeg da.» Which interpretation
    rejects the misleading dictionary glosses?'
  options:
  - id: literal
    text: Jeg kommer i morgen must contain vil because it refers to the future; skal
      and må are interchangeable; kan means probably; jo is empty; and da always means
      then in time.
    correct: false
    why: These are the translation traps identified in the lesson.
  - id: correct
    text: Jeg kommer i morgen uses present tense for an ordinary future event; Du
      skal gå nå is an instruction or assigned course, not the same as må; Hun kan
      være hjemme keeps being home possible, while Hun er nok hjemme makes it probable;
      Du vet jo det invokes shared or evident information; Det kan jeg da is engaged
      reassurance or insistence, not chronological then.
    correct: true
    why: Each interpretation follows the surrounding context and preserves the stance
      that a mechanical gloss would miss.
  - id: probability-only
    text: All future forms express prediction, kan and nok both mean probability,
      jo marks uncertainty, and da marks a later time.
    correct: false
    why: The forms express different relationships to action, evidence, and conversation.
  - id: obligation-only
    text: Jeg kommer i morgen and Du skal gå nå both express obligation, while Hun
      kan være hjemme and Det kan jeg da both express permission.
    correct: false
    why: The contexts support ordinary future reference, instruction, possibility,
      and engaged response instead.
- handle: anchor_dialogue_stance_reconstruction
  op: choose
  objective: obj-modal-nuance-01
  bloom: analyze
  prompt_md: Choose the integrated reconstruction that follows how stance changes
    through the station conversation.
  derived_from:
  - section_id: back-at-station
  stem_md: «Har Sara kommet?» «Nei, toget står fortsatt utenfor byen. Det må være
    noe galt med signalene.» «Det kan ta lang tid, da.» «Ja, men ifølge appen skal
    toget kjøre videre snart.» «Du blir vel på stasjonen og venter?» «Jeg kan jo ikke
    dra fra stasjonen nå.» «Nei, selvfølgelig. Jeg bør kanskje sjekke når neste ferge
    går.» «Det er nok best. Vi vil uansett ikke rekke den første ferga.» Which reconstruction
    is correct?
  options:
  - id: correct
    text: Må in Det må være noe galt med signalene marks a strong conclusion from
      evidence; kan in Det kan ta lang tid keeps the delay possible, while da links
      the response to the situation; ifølge appen identifies the source for skal,
      which presents the continuation as expected; vel presents the station plan as
      assumed and seeks confirmation; jo frames Jonas’s inability to leave as evident
      or relevant; bør presents Ingrid’s check as sensible; nok marks her judgment
      as probable; and vil predicts that they will miss the first ferry.
    correct: true
    why: The reconstruction identifies each target form and tracks the changing travel
      circumstances instead of supplying English equivalents only.
  - id: reversed-stance
    text: Må expresses a requirement to repair the signals; kan makes the delay probable;
      skal gives Jonas’s own guaranteed prediction; vel asks neutrally; jo marks uncertainty;
      bør gives a requirement; nok reports the app; and vil gives advice.
    correct: false
    why: The dialogue assigns different sources, strengths, and interpersonal functions.
  - id: fixed-gloss
    text: Må, skal, bør, and vil all simply mean different kinds of must or will,
      while vel, jo, nok, and da add no independent stance.
    correct: false
    why: The dialogue is designed to show distinct modal and particle contributions.
  - id: source-only
    text: Every target form reports information from the app, so the speakers make
      no conclusions, predictions, recommendations, or appeals for confirmation.
    correct: false
    why: Only skal is explicitly tied to the app; the other forms have different contextual
      bases.
