- handle: vel_assumption_and_confirmation
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that shows what the speaker assumes and how
    vel changes the exchange.
  derived_from:
  - section_id: vel-assumption-confirmation
  stem_md: 'Neutral question: «Skal du møte Sara på stasjonen?» Question with vel:
    «Du skal vel møte Sara på stasjonen?» Softened estimate: «Det tar vel omtrent
    en time.» Which interpretation is correct?'
  options:
  - id: certainty
    text: Vel makes both statements completely certain and removes any need for confirmation.
    correct: false
    why: Vel leaves room for correction and commonly invites confirmation.
  - id: permission
    text: Vel asks whether Sara has permission to meet at the station.
    correct: false
    why: The particle concerns assumption and confirmation, not permission.
  - id: arrangement-only
    text: Vel adds an arrangement to the neutral question but does not change the
      speaker-listener relationship.
    correct: false
    why: Skal can present the arrangement; vel adds the assumption and appeal to the
      listener.
  - id: correct
    text: The neutral question asks without presenting a stated assumption; the vel
      question presents the meeting as expected and seeks confirmation; the estimate
      is softened as a tentative belief.
    correct: true
    why: Vel appeals to what seems likely or expected instead of asking from complete
      ignorance.
- handle: jo_shared_ground
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that identifies the shared-ground, evident,
    or corrective stance added by jo.
  derived_from:
  - section_id: jo-shared-evident-corrective
  stem_md: 'Compare: «Jeg har nøkkelen i sekken.» and «Jeg har jo nøkkelen i sekken.»
    In the conversation, Jonas is responding to concern that the key may be missing.
    He also says: «Vi kan jo ta en taxi.» Which interpretation is correct?'
  options:
  - id: correct
    text: The factual key statement remains similar, but jo frames the key as relevant,
      evident, or worth recalling; in «Vi kan jo ta en taxi», jo presents the taxi
      as an available or obvious solution.
    correct: true
    why: Jo adds common-ground or corrective framing without proving that the listener
      knew the fact beforehand.
  - id: fact-change
    text: Jo changes the location of the key and means that Jonas has probably lost
      it.
    correct: false
    why: Jo changes interpersonal framing, not the factual location.
  - id: probability
    text: Jo marks the speaker’s probability judgment in both sentences.
    correct: false
    why: Probability is the central stance use of nok, not jo.
  - id: empty
    text: Jo adds no meaning; both sentences have exactly the same conversational
      force.
    correct: false
    why: The lesson presents jo as an appeal to shared, evident, or readily available
      information.
- handle: nok_probability_judgment
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that distinguishes probability nok from possibility,
    source-based skal, and quantity nok.
  derived_from:
  - section_id: nok-probability-judgment
  stem_md: «Toget kommer nok senere.» «Det kan bli glatt i kveld.» «Ifølge værmeldingen
    skal det bli kaldere i natt.» «Vi har nok mat.» Which mapping is correct?
  options:
  - id: correct
    text: Nok in the first sentence marks the speaker’s likely conclusion; kan in
      the second keeps a possibility open; skal in the third attributes information
      to the weather forecast; nok in the fourth means enough.
    correct: true
    why: The contexts distinguish personal probability, open possibility, external
      source, and sufficient quantity.
  - id: all-probability
    text: All four sentences express the speaker’s probability judgment.
    correct: false
    why: Kan presents possibility, skal identifies a source, and nok mat means enough.
  - id: source-probability
    text: The first sentence reports a source, the second expresses probability, and
      the third means enough.
    correct: false
    why: The explicit source cue belongs to the third sentence, and quantity belongs
      to the fourth.
  - id: enough-everywhere
    text: Nok means enough in the first and fourth sentences, while kan and skal both
      mean probable.
    correct: false
    why: Nok in the first comments on the likelihood of the whole statement.
- handle: da_consequence_or_response_stance
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that connects each use of da to its conversational
    trigger.
  derived_from:
  - section_id: da-consequence-response-stance
  stem_md: A. «Toget er forsinket. Da må vi vente.» B. «Kan du handle?» — «Det kan
    jeg da.» C. «Du har vel ikke glemt billettene?» — «Nei da, de ligger i lomma.»
    Which classification is correct?
  options:
  - id: time-only
    text: All three uses place the action after an earlier event in chronological
      time.
    correct: false
    why: The response uses of da express engagement, not time sequence.
  - id: consequence-only
    text: A, B, and C all link a practical consequence to a condition without adding
      response stance.
    correct: false
    why: B and C are engaged responses with reassurance or correction.
  - id: correct
    text: A links a consequence to the delayed train; B adds reassurance or insistence
      to the offer of ability; C gives an engaged correction or reassurance about
      the tickets.
    correct: true
    why: Da connects A to a changed situation and makes B and C responsive stances
      rather than chronological time references.
  - id: probability
    text: Da marks probability in A and asks for confirmation in B and C.
    correct: false
    why: Probability and confirmation are not the central contributions of da here.
