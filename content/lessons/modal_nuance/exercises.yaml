- handle: ma_source_or_conclusion
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that distinguishes må by meaning, not by a
    fixed English gloss.
  derived_from:
  - section_id: ma-necessity-or-conclusion
  stem_md: 'Cabin preparation: «Du må huske nøkkelen.» The office is closed and no
    one answers: «Det må være feil adresse.» Which interpretation fits both statements?'
  options:
  - id: reversed
    text: «Du må huske nøkkelen.» expresses a conclusion from evidence; «Det må være
      feil adresse.» expresses practical necessity.
    correct: false
    why: The contexts support the opposite interpretation.
  - id: both-necessity
    text: 'Both statements express practical necessity: someone must remember the
      key and someone must have the wrong address.'
    correct: false
    why: The second statement describes an inference, not an order or requirement.
  - id: correct
    text: «Du må huske nøkkelen.» expresses practical necessity; «Det må være feil
      adresse.» expresses a strong conclusion from evidence.
    correct: true
    why: The first statement requires an action, while the second infers an explanation
      from evidence.
  - id: both-conclusion
    text: Both statements express conclusions from evidence.
    correct: false
    why: The cabin statement presents a necessary action.
- handle: kan_meaning_in_context
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that distinguishes ability, permission, and
    possibility in these exchanges.
  derived_from:
  - section_id: kan-ability-permission-possibility
  stem_md: A. «Sara kan kjøre på vinterføre.» B. «Kan jeg sette veska her?» C. «Toget
    kan bli forsinket.» Which mapping is correct?
  options:
  - id: swapped-ability-possibility
    text: A presents possibility; B asks for permission; C expresses ability.
    correct: false
    why: A concerns Sara’s capability, while C concerns what may happen.
  - id: correct
    text: A expresses ability; B asks for permission; C presents possibility.
    correct: true
    why: The person can drive, the speaker asks whether an action is allowed, and
      the train delay is only possible.
  - id: all-possibility
    text: All three statements present possibility.
    correct: false
    why: The question about the bag is a permission request, and Sara’s sentence concerns
      ability.
  - id: ability-permission-swapped
    text: A asks for permission; B expresses ability; C presents possibility.
    correct: false
    why: The first two meanings are reversed.
- handle: skal_basis_of_statement
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that identifies what gives each statement with
    skal its authority.
  derived_from:
  - section_id: skal-arrangement-requirement-source
  stem_md: 'The cabin trip is agreed: «Vi skal dra på hytta i helga.» A workplace
    instruction says: «Du skal levere nøkkelen i resepsjonen.» The source is explicit:
    «Ifølge værmeldingen skal det bli kaldere i natt.» Which mapping is correct?'
  options:
  - id: source-instruction-arrangement
    text: The first reports an external source, the second presents an arrangement,
      and the third gives an instruction.
    correct: false
    why: The explicit cues support a different order.
  - id: all-arrangement
    text: All three statements present arrangements for the future.
    correct: false
    why: The second is an instruction and the third is attributed to the weather forecast.
  - id: correct
    text: The first presents a speaker-backed arrangement, the second an authoritative
      instruction, and the third information attributed to an external source.
    correct: true
    why: The surrounding cues identify an agreed plan, an instruction, and a weather-report
      source.
  - id: all-authority
    text: All three statements are direct instructions from the speaker.
    correct: false
    why: Only the workplace sentence is an authoritative instruction.
- handle: vil_willingness_or_prediction
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that distinguishes desire or willingness, prediction,
    and characteristic result.
  derived_from:
  - section_id: vil-willingness-prediction-result
  stem_md: «Jeg vil gjerne hjelpe.» «Sara vil være sulten når hun kommer.» «For mye
    salt vil ødelegge smaken.» Which mapping is correct?
  options:
  - id: correct
    text: The first expresses willingness or desire; the second predicts Sara’s condition;
      the third describes a characteristic result.
    correct: true
    why: Gjerne supports willingness, the subject and situation support prediction,
      and too much salt produces an expected result.
  - id: all-prediction
    text: All three statements make neutral predictions about the future.
    correct: false
    why: The first statement explicitly concerns willingness or desire.
  - id: result-willingness-prediction
    text: The first describes a characteristic result; the second expresses willingness;
      the third predicts Sara’s condition.
    correct: false
    why: The meanings do not fit the subjects and contexts.
  - id: all-willingness
    text: All three statements describe what a person wants to do.
    correct: false
    why: The second and third statements are not about a person’s willingness.
- handle: bor_advice_or_expectation
  op: choose
  objective: obj-modal-nuance-01
  bloom: understand
  prompt_md: Choose the interpretation that distinguishes advice from reasonable expectation
    and compares bør with må.
  derived_from:
  - section_id: bor-advice-expectation
  stem_md: 'Cabin preparation: «Du bør ta med en varm jakke.» Arrival estimate: «Toget
    bør være her snart.» Stronger requirement: «Du må ta med pass.» Which interpretation
    is correct?'
  options:
  - id: reversed
    text: The jacket sentence expresses expectation; the train sentence gives advice;
      bør makes the jacket necessary.
    correct: false
    why: The subject train supports expectation, and bør is weaker than må.
  - id: correct
    text: The jacket sentence gives advice; the train sentence expresses reasonable
      expectation; må makes bringing the passport necessary, while bør makes the jacket
      advisable rather than necessary.
    correct: true
    why: A person can receive advice, while a train cannot sensibly receive advice;
      må is stronger than bør for action.
  - id: both-advice
    text: Both bør sentences give advice, and må merely gives a softer recommendation.
    correct: false
    why: The train sentence expresses expectation, and må is stronger.
  - id: both-expectation
    text: Both bør sentences express predictions, and må also expresses a prediction
      about the passport.
    correct: false
    why: The jacket sentence evaluates an action as sensible, and the passport sentence
      states necessity.
