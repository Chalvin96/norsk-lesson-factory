- handle: distinguish_all_members_from_whole_item
  op: choose
  objective: obj-quantity-and-countability-01
  bloom: analyze
  prompt_md: Choose the option whose quantity words match both cleaning situations.
    Situation 1 concerns every member of a plural group. Situation 2 concerns one
    kitchen cleaned as one complete whole.
  derived_from:
  - section_id: every-member-or-one-complete-thing
  stem_md: Which option expresses the two intended meanings?
  options:
  - id: members-then-whole
    text: 1) Sara vasket alle glassene. 2) Sara vasket hele kjøkkenet.
    correct: true
    why: Alle marks every member of the plural group; hele marks one complete kitchen.
  - id: whole-then-members
    text: 1) Sara vasket hele kjøkkenet. 2) Sara vasket alle glassene.
    correct: false
    why: The quantity expressions do not match the two situations in the stated order.
