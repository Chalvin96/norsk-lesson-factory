- handle: pack_for_cabin_trip
  op: write
  objective: obj-quantity-and-countability-01
  bloom: apply
  prompt_md: 'Write a short connected exchange in Norwegian between two friends packing
    for a weekend at a cabin. Write 10–14 sentences and use each taught form at least
    once: mange, mye, noen, noe, litt, få, lite, all, alt, alle, hele, and begge.
    Make the cabin context show a clear reason for each choice: plural countable items,
    uncountable amounts, an unspecified amount, a small amount, a small insufficient
    number, a small insufficient amount, every member of a plural group, all of a
    common-gender amount, everything, one complete weekend, and both members of an
    exactly-two group.'
  derived_from:
  - section_id: transfer-preparing-for-a-weekend-trip
  response_language: 'no'
  min_words: 45
  max_words: 100
  judge_prompt: Check the response against the cabin task and report evidence for
    each criterion. Accept natural Bokmål wording and sentence order when the required
    quantity meanings and listed forms remain clear.
  criteria:
  - id: quantity-forms
    instruction: Uses each of mange, mye, noen, noe, litt, få, lite, all, alt, alle,
      hele, and begge naturally and matches each form to its intended noun or meaning.
  - id: quantity-context
    instruction: Makes countability, amount, group scope, whole-period, and exactly-two
      meanings clear in the connected cabin exchange.
- handle: quantity_words_quick_review
  op: write
  objective: obj-quantity-and-countability-01
  bloom: apply
  prompt_md: 'Write eight short Norwegian sentences in a new household context, one for
    each meaning: many countable items, much of
    an amount, some countable items, a small insufficient amount, every member of
    a group, one complete period, everything, and both members of an exactly-two group.
    Make each context clear.'
  derived_from:
  - section_id: final-retrieval-request-quantity-words-quick-review
  response_language: 'no'
  min_words: 24
  max_words: 70
  judge_prompt: Check the eight sentences against the task and report evidence for
    each criterion. Accept natural Bokmål nouns and phrasing when the requested quantity
    meaning is clear; do not require exact sentence wording.
  criteria:
  - id: many-countable
    instruction: Uses mange with a plural countable household noun to express many
      countable items.
  - id: much-amount
    instruction: Uses mye with an uncountable household amount.
  - id: some-countable
    instruction: Uses noen with plural countable household items to express some.
  - id: small-insufficient-amount
    instruction: Uses lite with an uncountable amount and makes its insufficiency
      clear.
  - id: every-member
    instruction: Uses alle with a plural group to express every member.
  - id: complete-period
    instruction: Uses hele with a definite period to express one complete period.
  - id: everything
    instruction: Uses alt independently to express everything.
  - id: exactly-two
    instruction: Uses begge for the members of an explicitly exactly-two group.
