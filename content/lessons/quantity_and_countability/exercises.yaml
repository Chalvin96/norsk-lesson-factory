- handle: contrast_litt_and_lite
  op: choose
  objective: obj-quantity-and-countability-01
  bloom: analyze
  prompt_md: Choose the option that matches both situations. Situation 1 describes
    a small amount that is available and enough. Situation 2 describes a small amount
    that is insufficient and requires buying more.
  derived_from:
  - section_id: few-and-little-fa-lite-and-litt
  stem_md: Which option uses litt and lite with the intended meanings?
  options:
  - id: insufficient-then-available
    text: 1) Vi har lite melk til kaffen; det er nok. 2) Vi har litt melk; det er
      ikke nok, så vi må kjøpe mer.
    correct: false
    why: The forms are reversed for the sufficient and insufficient situations.
  - id: available-then-insufficient
    text: 1) Vi har litt melk til kaffen; det er nok. 2) Vi har lite melk; det er
      ikke nok, så vi må kjøpe mer.
    correct: true
    why: Litt presents a small available amount neutrally; lite presents an insufficient
      amount.
