- handle: recognize_negative_question_meaning
  op: choose
  objective: obj-question-word-order-01
  bloom: understand
  prompt_md: In the cinema-plan exchange, Sara expects Emil to come. Jonas asks Kommer
    han ikke?, and Sara replies Jo, han kommer. Choose the interpretation that matches
    this exchange.
  derived_from:
  - section_id: sec-negative-questions
  stem_md: What is Jonas checking with Kommer han ikke??
  options:
  - id: negative-confirmed
    text: Kommer han ikke? means Isn’t he coming?; Jonas checks whether Emil is not
      coming, and Sara confirms that idea with nei.
    correct: false
    why: The lesson uses jo when the speaker rejects a negative idea; nei would support
      the negative answer.
  - id: negative-expectation
    text: Kommer han ikke? means Isn’t he coming?; Jonas checks whether Emil is not
      coming, and Sara rejects that idea with Jo, han kommer.
    correct: true
    why: A negative question checks the negative idea here, and jo rejects that idea.
  - id: location-question
    text: Kommer han ikke? asks where Emil is, so Sara should answer with a place.
    correct: false
    why: The question asks about Emil coming, not about his location.
- handle: distinguish_question_openings
  op: choose
  objective: obj-question-word-order-01
  bloom: understand
  prompt_md: 'In Sara and Jonas''s cinema conversation, choose the pair that matches
    both intentions: first ask whether someone is coming tonight, then ask where to
    buy a ticket.'
  derived_from:
  - section_id: sec-questions-with-a-question-word
  stem_md: Which pair has the correct opening for each intention?
  options:
  - id: correct-pair
    text: Kommer du i kveld? — Are you coming tonight?; Hvor kjøper du billett? —
      Where do you buy a ticket?
    correct: true
    why: The yes/no question starts with the verb, while the place question starts
      with a question word followed by the verb.
  - id: subject-first-pair
    text: Du kommer i kveld? — Are you coming tonight?; Hvor du kjøper billett? —
      Where do you buy a ticket?
    correct: false
    why: The first line keeps subject-first order, and the second puts the subject
      before the verb after the question word.
  - id: two-yes-no-questions
    text: Kommer du i kveld? — Are you coming tonight?; Kjøper du billett inne? —
      Do you buy a ticket inside?
    correct: false
    why: Both lines are verb-first yes/no questions; the second does not ask for place
      information with a question word.
