- handle: notice_v2_in_the_cafe
  op: recall_fill
  objective: obj-fronting-and-v2-inversion-01
  bloom: understand
  prompt_md: Identify the fronted element, finite verb, and subject in each main clause.
    Treat the multiword opening «På kjøkkenet» as one element, not as two positions.
  explanation_md: "A fronted time, place, or negative expression occupies the first position, so only the finite verb moves before the subject; any infinitive stays later."
  derived_from:
  - section_id: central-pattern
  audio_target: "I morgen åpner vi reparasjonskafeen. På kjøkkenet kan Elias lage kaffe."
  segments:
  - text_md: 'Clause 1: «I morgen åpner vi reparasjonskafeen.» Fronted element: '
  - blank_id: clause-1-fronted
    options:
    - I morgen
    - På kjøkkenet
    - Først
    answer_index: 0
  - text_md: '; finite verb: '
  - blank_id: clause-1-finite
    options:
    - åpner
    - kan
    - har
    answer_index: 0
  - text_md: '; subject: '
  - blank_id: clause-1-subject
    options:
    - vi
    - Elias
    - Nora
    answer_index: 0
  - text_md: '. Clause 2: «På kjøkkenet kan Elias lage kaffe.» Fronted element: '
  - blank_id: clause-2-fronted
    options:
    - På kjøkkenet
    - I morgen
    - Først
    answer_index: 0
  - text_md: '; finite verb: '
  - blank_id: clause-2-finite
    options:
    - kan
    - åpner
    - har
    answer_index: 0
  - text_md: '; subject: '
  - blank_id: clause-2-subject
    options:
    - Elias
    - vi
    - de
    answer_index: 0
- handle: front_a_time_or_place
  op: build
  objective: obj-fronting-and-v2-inversion-01
  bloom: apply
  prompt_md: Rewrite the neutral statement «Vi åpner reparasjonskafeen i morgen.»
    by putting «I morgen» first. Build one complete Norwegian main clause with the
    same meaning. Put the finite verb before the subject.
  derived_from:
  - section_id: changing-the-starting-point
  tokens:
  - token_id: ft-1
    text: I
  - token_id: ft-2
    text: morgen
  - token_id: ft-3
    text: åpner
  - token_id: ft-4
    text: vi
  - token_id: ft-5
    text: reparasjonskafeen.
  answer_order:
  - ft-1
  - ft-2
  - ft-3
  - ft-4
  - ft-5
- handle: move_only_the_finite_verb
  op: build
  objective: obj-fronting-and-v2-inversion-01
  bloom: apply
  prompt_md: Rewrite «Elias må ta en tidligere buss på lørdag.» by fronting «På lørdag».
    Build the complete sentence. Put only the finite verb «må» before the subject;
    keep the infinitive «ta» later in the clause.
  derived_from:
  - section_id: when-there-is-more-than-one-verb
  tokens:
