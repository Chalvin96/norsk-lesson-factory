- handle: complete_emphatic_openings
  op: recall_fill
  objective: obj-fronting-and-v2-inversion-01
  bloom: apply
  prompt_md: Complete the emphatic main clause meaning “They use the large room only
    on Saturdays.” The opening «Bare på lørdager» is one fronted element. Choose the
    finite verb and then the subject.
  derived_from:
  - section_id: negative-and-restrictive-openings
  audio_target: "Bare på lørdager bruker de det store rommet."
  segments:
  - text_md: 'Bare på lørdager '
  - blank_id: emphatic-finite
    options:
    - bruker
    - kommer
    - har
    answer_index: 0
  - text_md: ' '
  - blank_id: emphatic-subject
    options:
    - de
    - Elias
    - Nora
    answer_index: 0
  - text_md: ' det store rommet.'
