    text: må
  - token_id: mv-4
    text: Elias
  - token_id: mv-5
    text: ta
  - token_id: mv-6
    text: en
  - token_id: mv-7
    text: tidligere
  - token_id: mv-8
    text: buss.
  answer_order:
  - mv-1
  - mv-2
  - mv-3
  - mv-4
  - mv-5
  - mv-6
