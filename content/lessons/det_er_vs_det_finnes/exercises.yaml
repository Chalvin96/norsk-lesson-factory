- handle: new-to-known-sequence
  op: write
  objective: obj-det-er-vs-det-finnes-01
  bloom: apply
  prompt_md: Write a brief connected sequence in Norwegian about a hotel facility
    for Jonas to send to Sara. First announce that a facility exists with det finnes;
    then identify or describe the now-known facility with det er.
  derived_from:
  - section_id: controlled-choice-to-connected-use
  response_language: 'no'
  min_words: 8
  max_words: 25
  judge_prompt: Check the sequence against the task. Accept any natural Bokmål facility
    and any natural identification or description, but require det finnes for the
    new existence information and det er for the known referent that follows.
  criteria:
  - id: new-existence
    instruction: The first sentence uses det finnes to announce a hotel facility as
      existing or available.
  - id: known-referent
    instruction: A following sentence uses det er to identify or describe the facility
      after it is known.
- handle: neighbourhood-information-transfer
  op: write
  objective: obj-det-er-vs-det-finnes-01
  bloom: apply
  prompt_md: Write four short connected Norwegian sentences for visitors in a neighbourhood,
    not a hotel. Announce two local services or facilities with det finnes; then identify
    one now-known place with det er; then describe that known place with det er. Use
    neighbourhood content rather than copying hotel dialogue.
  derived_from:
  - section_id: transfer-to-a-neighbourhood
  response_language: 'no'
  min_words: 16
  max_words: 40
  judge_prompt: Accept natural Bokmål variants for services, places, locations, and
    descriptions. Require two existence or availability statements with det finnes,
    followed by identification and description of a known place with det er. Confirm
    that the content is neighbourhood-based and does not copy the hotel dialogue.
  criteria:
  - id: neighbourhood-existence
    instruction: Announces two neighbourhood services or facilities with det finnes
      for existence or availability.
  - id: neighbourhood-identification
    instruction: Uses det er to identify one place that has already been introduced.
  - id: neighbourhood-description
    instruction: Uses det er to describe a place that is already known.
  - id: neighbourhood-transfer
    instruction: Uses unfamiliar neighbourhood content rather than repeating the hotel
      dialogue.
- handle: existence-or-description-retrieval
  op: write
  objective: obj-det-er-vs-det-finnes-01
  bloom: apply
  prompt_md: Without looking back, write exactly three short Norwegian sentences about
    a useful place or service nearby and another place or service. First say that
    the useful place or service exists or is available nearby with det finnes; then
    identify or describe that known place with det er; finally ask whether the other
    place or service is available with Finnes det.
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: Accept any natural Bokmål places, services, and locations, including
    lexical choices different from the lesson examples. Require exactly three sentences,
    the requested existence statement with det finnes, the identification or description
    with det er, and the existence question with Finnes det.
  criteria:
  - id: retrieval-existence
    instruction: States that one useful nearby place or service exists or is available
      with det finnes.
  - id: retrieval-description
    instruction: Identifies or describes that known place or service with det er.
  - id: retrieval-question
    instruction: Asks whether another place or service is available with Finnes det.
