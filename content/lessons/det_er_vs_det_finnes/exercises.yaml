- handle: hotel-meaning-notice
  op: choose
  objective: obj-det-er-vs-det-finnes-01
  bloom: understand
  prompt_md: Choose the interpretation that correctly explains all three hotel messages.
  derived_from:
  - section_id: first-checkpoint-notice-speakers-purpose
  stem_md: Which explanation correctly classifies the room, luggage-room, and restaurant
    messages?
  options:
  - id: wrong-description
    text: Det er rom 214 announces that any room exists; Det finnes et bagasjerom
      ved resepsjonen describes a known luggage room; and Finnes det en restaurant
      på hotellet? identifies a particular restaurant.
    correct: false
    why: 'The meanings are reversed: the room is identified, while the luggage room
      and restaurant concern existence or availability.'
  - id: wrong-location-rule
    text: Every statement uses det finnes because each one mentions a hotel place;
      det er cannot identify or describe a room.
    correct: false
    why: A location does not decide the expression; speaker purpose does.
  - id: correct
    text: Det er rom 214 identifies a particular room; Det finnes et bagasjerom ved
      resepsjonen introduces a luggage room as existing; and Finnes det en restaurant
      på hotellet? asks about restaurant existence or availability.
    correct: true
    why: Det er identifies a known thing, while det finnes and finnes det express
      existence or availability.
- handle: known-thing-description
