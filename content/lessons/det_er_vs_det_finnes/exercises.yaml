    answer_index: 0
  - text_md: ' ganske lyst og stille. Gjesten spør: Hvor er nøkkelkortet? '
  - blank_id: blank-known-keycard-location
    options:
    - Det er
    - Det finnes
    answer_index: 0
  - text_md: ' på rommet. Gjesten spør: Hvilket rom er dette? '
  - blank_id: blank-known-room-identity
    options:
    - Det er
    - Det finnes
    answer_index: 0
  - text_md: ' rommet ved heisen.'
