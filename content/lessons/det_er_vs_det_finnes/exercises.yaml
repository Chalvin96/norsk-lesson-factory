  objective: obj-det-er-vs-det-finnes-01
  bloom: understand
  prompt_md: Complete each hotel reply with the expression used to identify or describe
    a known person, place, or object.
  explanation_md: "Use «det finnes» to introduce that something exists or is available. Use «det er» to identify, locate, or describe something already established."
  derived_from:
  - section_id: identifying-and-describing-with-det-er
  audio_target: "Gjesten spør: Hvordan er rom 214? Det er ganske lyst og stille. Gjesten spør: Hvor er nøkkelkortet? Det er på rommet. Gjesten spør: Hvilket rom er dette? Det er rommet ved heisen."
  segments:
  - text_md: 'Gjesten spør: Hvordan er rom 214? '
  - blank_id: blank-known-room-description
    options:
