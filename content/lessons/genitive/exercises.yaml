- handle: identify_thing_and_connection
  op: choose
  objective: obj-genitive-01
  bloom: understand
  prompt_md: During Nora's move, identify the thing described and the person or thing
    connected to it in each phrase.
  derived_from:
  - section_id: sec-first-notice-who-or-what-is-connected-to-whom
  stem_md: 'Choose the complete interpretation that is correct for all four phrases:
    Noras bøker, bøkene til Nora, nøkkelen til leiligheten, and Noras bror.'
  options:
  - id: reversed-roles
    text: 'Noras bøker: thing = Nora; connection = bøker. bøkene til Nora: thing =
      Nora; connection = bøkene. nøkkelen til leiligheten: thing = leiligheten; connection
      = nøkkelen. Noras bror: thing = Nora; connection = bror.'
    correct: false
    why: This reverses the identified thing and the connected person or thing.
  - id: mixed-roles
    text: 'Noras bøker: thing = bøker; connection = Nora. bøkene til Nora: thing =
      bøkene; connection = Nora. nøkkelen til leiligheten: thing = leiligheten; connection
      = nøkkelen. Noras bror: thing = bror; connection = Nora.'
    correct: false
    why: The interpretation of nøkkelen til leiligheten reverses the two roles.
  - id: correct
    text: 'Noras bøker (“Nora’s books”): thing = bøker; connection = Nora. bøkene
      til Nora (“Nora’s books”): thing = bøkene; connection = Nora. nøkkelen til leiligheten
      (“the key to the apartment”): thing = nøkkelen; connection = leiligheten. Noras
      bror (“Nora’s brother”): thing = bror; connection = Nora.'
    correct: true
    why: Each interpretation separates the identified thing from its owner or connection.
- handle: build_s_pattern
  op: choose
  objective: obj-genitive-01
  bloom: apply
  prompt_md: Choose the natural Norwegian label for Nora's books.
  derived_from:
  - section_id: sec-the-s-pattern
  stem_md: Nora and Emil label moving boxes. One box contains books that belong to
    Nora. Which label uses the -s pattern correctly?
  options:
  - id: correct-s
    text: Noras bøker
    correct: true
    why: The owner takes -s directly, and the following noun has no definite ending.
  - id: definite-head
    text: Noras bøkene
    correct: false
    why: The noun after an -s owner is bøker, not definite bøkene.
  - id: english-apostrophe
    text: Nora's bøker
    correct: false
    why: Norwegian attaches -s without an apostrophe.
- handle: repair_s_pattern_errors
  op: find_fix
  objective: obj-genitive-01
  bloom: analyze
  prompt_md: 'Nora writes the phrase `Nora’s bok` with an English-style apostrophe. Select
    the one token that is wrong/needs changing.'
  derived_from:
  - section_id: sec-the-s-pattern
  tokens:
  - token_id: repair-owner
    text: Nora’s
  - token_id: repair-thing
    text: bok.
  error_token_id: repair-owner
  feedback: 'Replace the English-style apostrophe with direct Norwegian -s: Noras.
    Keep the unmarked thing bok. The corrected label is Noras bok.'
- handle: build_til_pattern
  op: choose
  objective: obj-genitive-01
  bloom: apply
  prompt_md: Choose the til-pattern version of «Emils sykkel».
  derived_from:
  - section_id: sec-the-til-pattern
  stem_md: Emil asks which bicycle is his while the car is being unloaded. Which phrase
    keeps the meaning of «Emils sykkel» and uses the til pattern?
  options:
  - id: indefinite-object
    text: sykkel til Emil
    correct: false
    why: The ownership reading needs the definite object sykkelen before til.
  - id: correct-til
    text: sykkelen til Emil
    correct: true
    why: The til pattern puts the definite object first and the owner after til.
  - id: reversed-order
    text: Emil til sykkelen
    correct: false
    why: The identified object comes before til, and the owner comes after it.
- handle: contrast_noun_form_by_pattern
  op: recall_fill
  objective: obj-genitive-01
  bloom: apply
  prompt_md: Complete both labels for the same bicycle connection. The pattern is
    supplied; retrieve only the correct noun form in each slot.
  explanation_md: "The -s pattern is owner + s + indefinite noun; the «til» pattern reverses the order and uses the definite noun: «Emils sykkel» / «sykkelen til Emil»."
  derived_from:
  - section_id: sec-the-til-pattern
  audio_target: "Emils sykkel. Sykkelen til Emil."
  segments:
  - text_md: '-s label: Emils '
  - blank_id: s-thing-form
    options:
    - sykkel
    - sykkelen
    answer_index: 0
  - text_md: '. til label: '
  - blank_id: til-thing-form
    options:
    - sykkelen
    - sykkel
    answer_index: 0
  - text_md: ' til Emil.'
- handle: choose_s_or_til_for_context
  op: build
  objective: obj-genitive-01
  bloom: apply
  prompt_md: During the move, build one complete Norwegian sentence for an exchange
    that starts from the owner and then starts from the identified object. Say that
    Emil's phone is the phone connected to Emil. Use -s in the first phrase and definite
    thing + til in the second phrase. Include terminal punctuation.
  derived_from:
  - section_id: sec-choosing-between-s-and-til
  tokens:
  - token_id: context-owner-form
    text: Emils
  - token_id: context-owner-thing
    text: telefon
  - token_id: context-link
    text: er
  - token_id: context-til-thing
    text: telefonen
  - token_id: context-til-word
    text: til
  - token_id: context-til-owner
    text: Emil.
  answer_order:
  - context-owner-form
  - context-owner-thing
  - context-link
  - context-til-thing
  - context-til-word
  - context-til-owner
