  - transform-til-owner
- handle: diagnose_pattern_mistake
  op: find_fix
  objective: obj-genitive-01
  bloom: analyze
  prompt_md: 'Nora owns the specific book named in the phrase `bok til Nora`. Select the
    one token that is wrong/needs changing for this ownership reading.'
  derived_from:
  - section_id: sec-common-mistakes-to-avoid
  tokens:
  - token_id: diagnose-thing
    text: bok
  - token_id: diagnose-til
    text: til
  - token_id: diagnose-owner
    text: Nora.
  error_token_id: diagnose-thing
  feedback: The identified thing before til must be definite for this ownership or
    connection reading. Replace bok with boka; the corrected phrase is boka til Nora.
- handle: transfer_patterns_to_community_center
  op: write
  objective: obj-genitive-01
  bloom: apply
  prompt_md: 'At a community center, write four short Norwegian statements for staff
    sorting keys, signs, bags, room information, and equipment. Write: (1) a group''s
    key with the connection first and -s, (2)
    the same key relationship with the object first and til, (3) a building''s name
    with the connection first and -s, and (4) the same name relationship with the
    object first and til. Keep each pair''s meaning unchanged.'
  derived_from:
  - section_id: sec-cumulative-transfer-at-a-community-center
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that preserve the requested relationships and patterns.
    Reject English-style apostrophes, wrong order, or wrong noun definiteness.
  criteria:
  - id: community-s-pattern
    instruction: Writes a natural community-center statement with the connection first,
      direct Norwegian -s, and an unmarked identified thing.
  - id: community-til-pattern
    instruction: Writes the same key relationship with the definite identified thing
      first, followed by til and the connection.
  - id: community-meaning-pair
    instruction: Writes the building-name pair with -s and til while preserving the
      same connection and meaning.
- handle: final_retrieval_s_and_til
  op: write
  objective: obj-genitive-01
  bloom: apply
  prompt_md: Create four short Norwegian phrases about new everyday belongings and
    connections. Use a book connected to Emil with owner-first -s, the same book relationship
    with object-first
    til, a house-and-balcony connection with connection-first -s, and the same balcony
    relationship with object-first til.
  derived_from:
  - section_id: sec-retrieval-and-review
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants using taught forms when they match each cue. Require
    the same intended relationship within each pair.
  criteria:
  - id: final-person-s
    instruction: Uses owner + direct Norwegian -s + unmarked thing for the person-and-book
      relationship.
  - id: final-person-til
    instruction: Uses definite thing + til + owner for the same person-and-book relationship.
  - id: final-connection-s
    instruction: Uses connection + direct Norwegian -s + unmarked thing for the house-and-balcony
      relationship.
  - id: final-connection-til
    instruction: Uses definite thing + til + connection for the same house-and-balcony
      relationship.
