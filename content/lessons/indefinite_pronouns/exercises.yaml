- handle: retrieve_four_indefinites
  op: write
  objective: obj-indefinite-pronouns-01
  bloom: apply
  prompt_md: Without looking back, write four short, simple Bokmål sentences about
    a shop that has closed for the day. Use each of the four indefinite forms taught
    in this lesson once, and make every intended referent clear through the context.
    Keep the situation fresh and do not copy the kitchen dialogue.
  derived_from:
  - section_id: final-retrieval-request-retrieve-four-indefinites
  response_language: 'no'
  max_words: 40
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept natural Bokmål variants when they preserve the requested form,
    clear referent, and meaning.
  criteria:
  - id: four-shop-sentences
    instruction: Writes four short, simple Bokmål sentences about the closed shop.
  - id: uses-noen
    instruction: Uses noen in one sentence for a clear person or plural countable
      referent.
  - id: uses-noe
    instruction: Uses noe in one sentence for a clear unspecified thing, substance
      or amount, or infinitive pattern.
  - id: uses-ingen
    instruction: Uses ingen in one sentence as stand-alone no one or before a singular
      en- or ei-noun or plural noun.
  - id: uses-ingenting
    instruction: Uses ingenting as a stand-alone word meaning nothing.
