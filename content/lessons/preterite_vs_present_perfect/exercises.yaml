- handle: anchor_message_revision
  op: write
  objective: obj-preterite-vs-present-perfect-01
  bloom: apply
  prompt_md: Write Leila’s connected Norwegian message to a colleague. State that
    she has been to Fjordhuset before, that she was there last Friday, and what she
    did there. Explain that Jonas only wants coffee tonight because he has already
    eaten. Also state that Leila has lived in the area for three years and still lives
    there. Use appropriate past tense or present perfect for every relationship.
  derived_from:
  - section_id: returning-to-leila-and-jonas
  response_language: 'no'
  min_words: 45
  max_words: 85
  judge_prompt: Check the message against each requested meaning. Accept natural Bokmål
    wording and word-order variants when tense and time relationship remain clear.
    Report evidence for every criterion.
  criteria:
  - id: prior-experience
    instruction: Uses present perfect to state Leila’s prior experience with Fjordhuset.
  - id: specific-occasion
    instruction: Uses past tense for Leila’s visit last Friday.
  - id: completed-actions
    instruction: Uses past tense for what Leila did during that completed visit.
  - id: current-result
    instruction: Uses present perfect to explain that Jonas only wants coffee because
      he has already eaten.
  - id: continuing-duration
    instruction: Uses present perfect to state that Leila has lived in the area for
      three years and still lives there.
  - id: connected-message
    instruction: Presents the requested meanings as one understandable connected message.
- handle: cumulative_evening_transfer
  op: write
  objective: obj-preterite-vs-present-perfect-01
  bloom: apply
  prompt_md: 'Write one coherent Norwegian paragraph about Sara. She is still cleaning
    for guests tonight and has cleaned a lot today. The food is ready now because
    she has made dinner. She sent a message at three o’clock. She has lived in the
    flat for four years and still lives there. She has hosted guests before. Last
    month she hosted a completed dinner: first the guests arrived, then they ate,
    and afterwards they went home. Express all six time relationships with appropriate
    tenses.'
  derived_from:
  - section_id: cumulative-transfer-a-different-evening
  response_language: 'no'
  min_words: 65
  max_words: 110
  judge_prompt: Check whether the paragraph expresses every supplied situation with
    the tense required by its viewpoint. Accept natural Bokmål variants that preserve
    all meanings. Report evidence for each criterion.
  criteria:
  - id: unfinished-period
    instruction: Uses present perfect to summarize Sara’s cleaning within today, which
      is still continuing.
  - id: current-result
    instruction: Uses present perfect for making dinner when its present result is
      that the food is ready.
  - id: specific-event
    instruction: Uses past tense for sending a message at three o’clock.
  - id: continuing-duration
    instruction: Uses present perfect for living in the flat for four years when Sara
      still lives there.
  - id: prior-experience
    instruction: Uses present perfect to state that Sara has hosted guests before.
  - id: narrative-sequence
    instruction: Uses past tense consistently for the arrival, meal, and departure
      during last month’s completed dinner.
  - id: coherent-account
    instruction: Integrates all requested meanings into one understandable paragraph.
- handle: final_tense_retrieval
  op: write
  objective: obj-preterite-vs-present-perfect-01
  bloom: apply
  prompt_md: 'Write five controlled Norwegian examples: one sentence about an unspecified experience, one about an event yesterday, one about a result that matters now, one about an activity continuing since a stated starting point, and one containing two completed events in sequence. Keep all five examples in Norwegian and make each time meaning clear.'
  derived_from:
  - section_id: final-retrieval-request
  response_language: 'no'
  min_words: 45
  max_words: 100
  judge_prompt: Check each Norwegian example against its assigned meaning. Accept varied natural Bokmål vocabulary when tense and time reference agree. Report evidence for every criterion.
  criteria:
  - id: unspecified-experience
    instruction: Uses present perfect to give a natural Norwegian sentence about an unspecified experience before now.
  - id: yesterday-event
    instruction: Uses past tense for a natural Norwegian sentence about an event yesterday.
  - id: present-result
    instruction: Uses present perfect for a natural Norwegian sentence about a result that matters now.
  - id: continuing-since
    instruction: Uses present perfect for a natural Norwegian sentence about an activity continuing since a stated starting point.
  - id: completed-sequence
    instruction: Uses past tense for a natural Norwegian sentence containing two completed events in sequence.
