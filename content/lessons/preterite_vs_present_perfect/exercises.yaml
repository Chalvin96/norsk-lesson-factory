- handle: anchor_time_connections
  op: categorize
  objective: obj-preterite-vs-present-perfect-01
  bloom: analyze
  prompt_md: Classify what motivates each highlighted verb in Leila and Jonas’s dialogue.
    Use the stated time expression, sequence, experience, present consequence, or
    continuing situation—not verb form alone.
  explanation_md: "Use preterite with a finished, specified past time; use present perfect for experience, present relevance, or a period continuing to now."
  derived_from:
  - section_id: an-evening-plan
  buckets:
  - bucket_id: completed-past
    label: Completed past time or completed sequence
  - bucket_id: past-to-present
    label: Earlier situation connected to the present
  items:
  - item_id: item-01
    text: Har du vært på Fjordhuset før? (Experience at any time before now.)
    bucket_id: past-to-present
  - item_id: item-02
    text: Jeg var der forrige fredag.
    bucket_id: completed-past
  - item_id: item-03
    text: Forrige fredag spiste vi middag.
    bucket_id: completed-past
  - item_id: item-04
    text: Forrige fredag hørte vi på et band etter middagen.
    bucket_id: completed-past
  - item_id: item-05
    text: Jeg har aldri spist der. (Experience up to now.)
    bucket_id: past-to-present
  - item_id: item-06
    text: Jeg har hørt mye positivt om stedet. (What Jonas knows now.)
    bucket_id: past-to-present
  - item_id: item-07
    text: Jeg har allerede spist. (He does not need dinner now.)
    bucket_id: past-to-present
  - item_id: item-08
    text: Du spiste tidlig! (A completed meal earlier today.)
    bucket_id: completed-past
  - item_id: item-09
    text: Jeg har jobbet siden klokka åtte i dag. (The working period continues.)
    bucket_id: past-to-present
  - item_id: item-10
    text: Jeg tok lunsj før elleve.
    bucket_id: completed-past
  - item_id: item-11
    text: Jeg har bodd i dette området i tre år. (Leila still lives there.)
    bucket_id: past-to-present
  - item_id: item-12
    text: Jeg bodde i Bergen i tre år før jeg flyttet hit.
    bucket_id: completed-past
  - item_id: item-13
    text: Jeg bodde i Bergen før jeg flyttet hit.
    bucket_id: completed-past
  - item_id: item-14
    text: Da jeg bodde i Bergen, gikk jeg ofte på små konserter.
    bucket_id: completed-past
