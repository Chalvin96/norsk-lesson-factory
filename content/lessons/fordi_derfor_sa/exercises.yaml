- handle: find_the_cause
  op: choose
  objective: obj-fordi-derfor-sa-01
  bloom: understand
  prompt_md: Read three everyday cause-and-result situations. Choose the set that
    puts each result first, places the information answering why after fordi, and
    begins each reason clause at fordi. The scored evidence is cause-and-result meaning
    and connector choice; word order is context only.
  derived_from:
  - section_id: giving-the-reason-with-fordi
  stem_md: Which set correctly expresses these three relationships in Norwegian? 1.
    Mina took a taxi because the bus did not come. 2. We stayed home because it was
    raining. 3. Nora left early because she did not feel well.
  options:
  - id: therefore-set
    text: 'Mina tok taxi. Derfor kom ikke bussen. Det regnet. Derfor ble vi hjemme.
      Nora følte seg ikke bra. Derfor dro hun tidlig. '
    correct: false
    why: This set uses derfor instead of a postposed fordi clause and reverses the
      first cause-and-result relation.
  - id: correct-cause-set
    text: 'Mina tok taxi fordi bussen ikke kom. Vi ble hjemme fordi det regnet. Nora
      dro tidlig fordi hun ikke følte seg bra. '
    correct: true
    why: Each line puts the result first, then uses fordi to begin the reason that
      answers why.
  - id: so-set
    text: 'Mina tok taxi, så bussen ikke kom. Det regnet, så vi ble hjemme. Nora følte
      seg ikke bra, så hun dro tidlig. '
    correct: false
    why: This set uses så with cause-first order instead of the requested result-first
      fordi pattern.
- handle: fordi_word_order
  op: recall_fill
  objective: obj-fordi-derfor-sa-01
  bloom: remember
  prompt_md: 'Complete each Norwegian sentence. The meanings are: I took a taxi because
    the bus did not come; We ate at home because the restaurant was not open. Choose
    the subordinate clause after fordi. The scored form is fordi + subject + ikke
    + finite verb.'
  explanation_md: "After «fordi», use subordinate order with «ikke» before the finite verb. Sentence-initial «derfor» triggers verb–subject inversion, while result-linking «så» is followed by ordinary subject–verb order."
  derived_from:
  - section_id: giving-the-reason-with-fordi
  audio_target: "Jeg tok taxi fordi bussen ikke kom. Vi spiste hjemme fordi restauranten ikke var åpen."
  segments:
  - text_md: 'Jeg tok taxi fordi '
  - blank_id: because-bus-clause
    options:
    - bussen ikke kom
    - bussen kom ikke
    answer_index: 0
  - text_md: '. Vi spiste hjemme fordi '
  - blank_id: because-restaurant-clause
    options:
    - restauranten ikke var åpen
    - restauranten var ikke åpen
    answer_index: 0
  - text_md: .
