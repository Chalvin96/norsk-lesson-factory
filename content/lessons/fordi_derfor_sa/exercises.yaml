    - han ikke kunne låse døra
    answer_index: 0
  - text_md: .
- handle: connector_meaning_choice
  op: choose
  objective: obj-fordi-derfor-sa-01
  bloom: understand
  prompt_md: 'Choose the set that matches each information order: result plus reason
    with fordi; cause plus a separate result beginning with Derfor; cause plus a directly
    linked result with så. Score connector meaning and information order; the verb
    positions are shown but are not the primary evidence.'
  derived_from:
  - section_id: three-ways-to-describe-the-same-relationship
  stem_md: Which set correctly expresses these three relationships in Norwegian? 1.
    We canceled the trip because the weather was bad. 2. The weather was bad. Therefore,
    we canceled the trip. 3. The weather was bad, so we canceled the trip.
  options:
  - id: correct-three-connectors
    text: 'Vi avlyste turen fordi været var dårlig. Været var dårlig. Derfor avlyste
      vi turen. Været var dårlig, så vi avlyste turen. '
    correct: true
    why: The three lines use fordi for a following reason, derfor for a separate consequence,
      and så for a directly linked result.
  - id: swapped-result-connectors
    text: 'Vi avlyste turen fordi været var dårlig. Været var dårlig, så vi avlyste
      turen. Været var dårlig. Derfor avlyste vi turen. '
    correct: false
    why: The second and third lines assign så and derfor to the wrong information
      orders.
  - id: reversed-reason
    text: 'Været var dårlig fordi vi avlyste turen. Været var dårlig. Derfor avlyste
      vi turen. Været var dårlig, så vi avlyste turen. '
    correct: false
    why: The first line reverses the intended result-and-reason relationship instead
      of placing the result before its fordi-clause.
