- handle: scene_relationship_check
  op: choose
  objective: obj-verb-complementation-01
  bloom: understand
  prompt_md: 'Read this cabin exchange: Mina asks «Har du bestemt deg for å bli med
    på hytta?» Erik replies «Jeg håper å bli med, men sjefen sier at vi må levere
    rapporten på fredag.» Mina asks «Kan du jobbe med rapporten i kveld?» Erik says
    «Ja, jeg tror at jeg kan bli ferdig før torsdag.» Mina says «Da bør du begynne
    å pakke også.» Erik promises «Jeg lover at jeg skal gi deg beskjed i morgen.»
    Choose the complete reading. Identify who performs each action and which complement
    contains another explicitly stated subject.'
  derived_from:
  - section_id: weekend-deadline
  stem_md: Choose the complete reading of Mina and Erik's cabin exchange.
  options:
  - id: mina-reading
    text: Mina is expected to come, Mina submits the report, Mina works tonight, Mina
      packs, and Mina gives the answer; all actions have the same understood subject.
    correct: false
    why: The exchange addresses Erik as du and jeg, and the report clause explicitly
      states vi.
  - id: mixed-reading
    text: Erik comes, Erik alone submits the report, Erik works, Erik packs, and Mina
      gives the answer; the at-clause has no separate subject.
    correct: false
    why: The report clause has the explicit subject vi, and the final clause has the
      explicit subject jeg.
  - id: correct-reading
    text: «Har du bestemt deg for å bli med på hytta?» — Erik is the person expected
      to come; «Jeg håper å bli med» — Erik hopes to come; «sjefen sier at vi må levere
      rapporten på fredag» — vi is the stated subject that has to submit; «Kan du
      jobbe med rapporten i kveld?» — Erik can work tonight; «Da bør du begynne å
      pakke også» — Erik should pack; «Jeg lover at jeg skal gi deg beskjed i morgen»
      — Erik is the person who will give the answer. The report action has another
      explicitly stated subject, vi.
    correct: true
    why: The å-actions are understood as Erik’s actions, while the at-clause about
      submitting explicitly states vi as its subject.
- handle: same_person_infinitive_recognition
  op: choose
  objective: obj-verb-complementation-01
  bloom: understand
  prompt_md: Classify every statement by identifying whether the person connected
    to the first verb is the intended or possible performer, and mark which statements
    use an å-infinitive for that relationship.
  derived_from:
  - section_id: a-infinitive
  stem_md: Choose the classification set that correctly marks the same-person å-infinitive
    relationship.
  options:
  - id: all-same
    text: All four statements use an å-infinitive, and the first-verb subject performs
      every second action.
    correct: false
    why: The last two statements use at-clauses, and the third explicitly names Mina
      inside its clause.
  - id: correct-classification
    text: «Erik håper å bli med.» — Erik is the understood performer, and this is
      the å-infinitive relationship. «Mina planlegger å reise på fredag.» — Mina is
      the understood performer, and this is the å-infinitive relationship. «Jeg håper
      at Mina reiser på fredag.» — Mina is explicitly stated in an at-clause, not
      an å-infinitive. «Jeg tror at jeg forstår.» — this is a finite at-clause, not
      an å-infinitive.
    correct: true
    why: The å-infinitive examples link the second action to the person connected
      to the first verb; the at-clauses state their own finite clause structure.
  - id: clause-as-infinitive
    text: The first two statements use å-infinitives, but «Jeg håper at Mina reiser
      på fredag.» also uses an å-infinitive because Mina is the performer.
    correct: false
    why: A stated subject and finite verb after at form a complete clause, not an
      å-infinitive.
