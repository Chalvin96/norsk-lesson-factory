- handle: meaning_contrast_selection
  op: choose
  objective: obj-verb-complementation-01
  bloom: understand
  prompt_md: 'Choose the completion set that matches all three meanings. Use the full
    overt at form for the finite content clause: I hope to leave on Friday; I hope
    that Mina leaves on Friday; I think that I am leaving early.'
  derived_from:
  - section_id: compare-complements
  stem_md: Choose the completion set that matches all three meanings.
  options:
  - id: correct-contrast
    text: «Jeg håper å reise på fredag.» — I hope to leave on Friday. «Jeg håper at
      Mina reiser på fredag.» — I hope that Mina leaves on Friday. «Jeg tror at jeg
      drar tidlig.» — I think that I am leaving early.
    correct: true
    why: The first sentence uses an å-infinitive for the same understood performer,
      while the second and third use complete at-clauses with explicit subjects.
  - id: wrong-complement-set
    text: «Jeg håper at jeg reiser på fredag.» — I hope that I leave on Friday. «Jeg
      håper å reise på fredag.» — I hope to leave on Friday. «Jeg tror å dra tidlig.»
      — I think to leave early.
    correct: false
    why: The second sentence does not state Mina as the performer, and the neutral
      pattern practised after tro is a finite content clause with overt at.
  - id: wrong-first-verb
    text: «Jeg planlegger å dra tidlig.» — I plan to leave early. «Jeg håper at Mina
      reiser på fredag.» — I hope that Mina leaves on Friday. «Jeg tror at jeg drar
      tidlig.» — I think that I am leaving early.
    correct: false
    why: The first sentence changes the supplied first verb from håper to planlegger,
      so it does not match the requested meaning.
