- handle: final_retrieval
  op: write
  objective: obj-verb-complementation-01
  bloom: apply
  prompt_md: Without looking back, write three short connected sentences in Norwegian
    about tomorrow's cabin trip. Include one planned action with an å-infinitive,
    one complete statement with an at-clause, and one modal ability with a bare infinitive.
    Choose each written complement from its meaning and structure.
  derived_from:
  - section_id: quick-review
  response_language: 'no'
  judge_prompt: Check the three sentences against the task. Accept natural Bokmål
    variants when each requested pattern and meaning is clear, and report evidence
    for each criterion.
  criteria:
  - id: planned-action
    instruction: Includes one planned action with å followed by an infinitive.
  - id: overt-content-clause
    instruction: Includes one complete statement introduced by overt at, with its
      own subject and finite verb.
  - id: modal-bare-infinitive
    instruction: Includes one modal followed directly by a bare infinitive without
      å.
