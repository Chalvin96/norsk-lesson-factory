  prompt_md: Complete Elias's notes. Choose the adjective form according to whether
    it is inside a definite noun phrase or follows «er».
  explanation_md: "Inside a definite noun phrase the adjective takes -e; after er it agrees with the noun: det store bordet, but bordet er stort."
  derived_from:
  - section_id: before-the-noun-and-after-er
  audio_target: "Det store bordet står i stua. Bordet er stort. Den grønne stolen står her. Stolen er grønn."
  segments:
