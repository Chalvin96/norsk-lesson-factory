- handle: small-object-genders
  op: recall_fill
  objective: obj-adjective-agreement-01
  bloom: remember
  prompt_md: Complete Maja's box labels with forms of «liten». For the feminine box,
    select the option that lists both accepted labels; either «lita» or «liten» is
    valid after «ei».
  explanation_md: "Liten has the neuter form lite; after ei, both lita and liten are accepted in Bokmål."
  derived_from:
  - section_id: the-irregular-adjective-liten
  audio_target: "En liten stol; ei lita lampe eller ei liten lampe; et lite bord."
  segments:
  - text_md: 'Box 1: en '
  - blank_id: masculine-liten
    options:
    - liten
    - lite
    - lita
    answer_index: 0
  - text_md: ' stol. Box 2, both accepted labels: '
  - blank_id: feminine-liten-variants
    options:
    - ei lite lampe / ei lille lampe
    - ei lita lampe / ei liten lampe
    - ei små lampe / ei liten lampe
    answer_index: 1
  - text_md: '. Box 3: et '
  - blank_id: neuter-liten
    options:
    - liten
    - lille
    - lite
    answer_index: 2
  - text_md: ' bord.'
