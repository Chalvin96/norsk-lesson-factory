- handle: indefinite-room-labels
  op: recall_fill
  objective: obj-adjective-agreement-01
  bloom: apply
  prompt_md: Complete Maja's labels with the supplied adjective in the form that matches
    each article and noun.
  explanation_md: "Use the base adjective after en or ei, and add -t after et: en fin stol, ei kald natt, et dyrt bord."
  derived_from:
  - section_id: indefinite-singular-forms
  audio_target: "En fin stol; ei kald natt; et dyrt bord."
  segments:
  - text_md: 'fin: en '
  - blank_id: masculine-fin
    options:
    - fin
    - fine
    - fint
    answer_index: 0
  - text_md: ' stol; kald: ei '
  - blank_id: feminine-kald
    options:
    - kalde
    - kald
    - kaldt
    answer_index: 1
  - text_md: ' natt; dyr: et '
  - blank_id: neuter-dyr
    options:
    - dyr
    - dyre
    - dyrt
    answer_index: 2
  - text_md: ' bord.'
