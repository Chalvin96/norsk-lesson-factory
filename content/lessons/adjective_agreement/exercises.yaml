    - stor
    - stort
    - store
    answer_index: 2
  - text_md: ' bordet står i stua. Bordet er '
  - blank_id: after-er-neuter
    options:
    - stort
    - stor
    - store
    answer_index: 0
  - text_md: '. Den '
  - blank_id: before-masculine-noun
    options:
    - grønn
    - grønne
    - grønt
