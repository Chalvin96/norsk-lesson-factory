  derived_from:
  - section_id: practising-in-new-situations
  audio_target: "Jeg finner ikke nøkkelen her. Jeg forstår ikke dette spørsmålet. Jeg får ikke startet maskinen nå."
  segments:
  - text_md: 'Item 1: You cannot find a key here. Complete the Norwegian statement: '
  - blank_id: missing-key-statement
    options:
    - Jeg finner ikke nøkkelen her.
    - Jeg finner ikke billetten her.
    - Jeg finner ikke hotellet her.
    answer_index: 0
  - text_md: ' Item 2: You do not understand this question. Complete the Norwegian
