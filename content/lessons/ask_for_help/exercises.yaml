  - blank_id: unclear-question-statement
    options:
    - Jeg forstår ikke dette spørsmålet.
    - Jeg forstår ikke beskjeden.
    - Jeg forstår ikke dette ordet.
    answer_index: 0
  - text_md: ' Item 3: You cannot get the machine started now. Complete the Norwegian
      statement: '
  - blank_id: machine-start-statement
    options:
    - Jeg får ikke startet maskinen nå.
    - Jeg får ikke åpnet døra.
    - Jeg får ikke kjøpt billett.
    answer_index: 0
- handle: practice_3_add_request
  op: write
  objective: obj-ask-for-help-01
  bloom: apply
  prompt_md: 'Write three short Norwegian requests to a stranger: one for a missing
    key, one for an unclear question, and one for a machine that cannot be started.
    For each request, use “Unnskyld”, state the obstacle with a taught pattern, and
    add “Kan du hjelpe meg?”. Keep the requests brief.'
  derived_from:
  - section_id: practising-in-new-situations
  response_language: 'no'
  min_words: 18
  max_words: 45
  judge_prompt: Check all three requests separately and report evidence for each criterion.
    Accept natural punctuation and capitalization variants, but require the obstacle
    and help request to match each situation.
  criteria:
  - id: matched-obstacle-patterns
    instruction: Uses “Jeg finner ikke …” for the missing key, “Jeg forstår ikke …”
      for the unclear question, and “Jeg får ikke …” for the machine that cannot start.
  - id: linked-help-requests
    instruction: Links each obstacle naturally to “Kan du hjelpe meg?”.
  - id: stranger-attention
    instruction: Uses “Unnskyld” in each request when addressing a stranger.
  - id: brief-controlled-form
    instruction: Keeps each request short and controlled without extra information.
- handle: practice_4_understand_and_accept
  op: write
  objective: obj-ask-for-help-01
  bloom: apply
  prompt_md: 'For each helper message, explain in Norwegian what the learner should do
    next and give a short Norwegian acceptance: 1. «Ja, vent litt.» 2. «Se på skjermen.»
    3. «Bli med meg.» Use taught acceptance forms such as «Ok.», «Ja, takk.», or «Greit,
    takk.»'
  derived_from:
  - section_id: practising-in-new-situations
  response_language: 'no'
  min_words: 12
  max_words: 45
  judge_prompt: Check the three Norwegian action meanings and the three Norwegian acceptances
    separately. Report evidence for every criterion.
  criteria:
  - id: waiting-meaning
    instruction: Explains in Norwegian that «Ja, vent litt.» means the learner should wait a moment.
  - id: screen-meaning
    instruction: Explains in Norwegian that «Se på skjermen.» means the learner should look at the screen.
  - id: following-meaning
    instruction: Explains in Norwegian that «Bli med meg.» means the learner should come with or follow the helper.
  - id: short-acceptances
    instruction: Gives one short, natural Norwegian acceptance after each action,
      using taught forms such as “Ok.”, “Ja, takk.”, or “Greit, takk.”
- handle: practice_5_follow_whole_exchange
  op: write
  objective: obj-ask-for-help-01
  bloom: apply
  prompt_md: Write a short Norwegian exchange at a station information desk. You cannot
    understand a message about your train. Include, in order, an attention-getter,
    the obstacle, “Kan du hjelpe meg?”, a brief positive employee response with one
    taught next action, and a final short acceptance.
  derived_from:
  - section_id: practising-in-new-situations
  response_language: 'no'
  min_words: 15
  max_words: 45
  judge_prompt: Check the exchange in sequence and report evidence for every criterion.
    Accept natural taught variants for the positive response, next action, and acceptance.
  criteria:
  - id: sequence-start
    instruction: Includes “Unnskyld”, an obstacle using “Jeg forstår ikke …”, and
      “Kan du hjelpe meg?” in that order.
  - id: positive-response-action
    instruction: Includes a brief positive employee response and one taught next action,
      such as “Ja, selvfølgelig.” followed by “Se på skjermen der borte.”
  - id: final-acceptance
    instruction: Ends with a short taught acceptance such as “Ok.”, “Ja, takk.”, or
      “Greit, takk.”
  - id: short-practical-exchange
    instruction: Keeps the exchange short and practical.
- handle: retrieval_review_help_sequence
  op: write
  objective: obj-ask-for-help-01
  bloom: apply
  prompt_md: 'Write one short Norwegian exchange in a new setting: at a museum entrance,
    you cannot find the information desk. Use your own wording. Include attention,
    the obstacle, a help request, a positive response, one next action, and a final
    acceptance.'
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 15
  max_words: 40
  judge_prompt: Check the exchange for the complete help-seeking sequence, natural
    Norwegian, and original wording. Report evidence for every criterion.
  criteria:
  - id: full-help-seeking-sequence
    instruction: Shows attention, an obstacle, a request for help, a positive response,
      one next action, and acceptance in clear order.
  - id: new-situation-wording
    instruction: Uses the museum and information-desk situation with original wording.
  - id: natural-concise-exchange
    instruction: Produces one short, clear, and natural Norwegian exchange.
