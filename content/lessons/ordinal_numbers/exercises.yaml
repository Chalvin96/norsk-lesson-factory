- handle: notice-order-in-the-quiz
  op: choose
  objective: obj-ordinal-numbers-01
  bloom: understand
  prompt_md: Choose the mapping that correctly explains all four ordinal expressions
    as order, rank, or position rather than quantity.
  derived_from:
  - section_id: showing-order-rather-than-quantity
  stem_md: Which option correctly maps for andre gang, det første bordet, den tredje
    runden, and andreplass to a visit, a table, a round, and a team's rank?
  options:
  - id: swapped-meanings
    text: for andre gang — a table; det første bordet — a round; den tredje runden
      — a team's rank; andreplass — a visit.
    correct: false
    why: The expressions are matched to the wrong ordered objects or positions.
  - id: correct
    text: for andre gang — a visit; det første bordet — a table; den tredje runden
      — a round; andreplass — a team's rank.
    correct: true
    why: Each ordinal expression identifies the stated visit occurrence, table, round,
      or team rank.
  - id: rotated-meanings
    text: for andre gang — a round; det første bordet — a team's rank; den tredje
      runden — a visit; andreplass — a table.
    correct: false
    why: The expressions are matched to the wrong ordered objects or positions.
