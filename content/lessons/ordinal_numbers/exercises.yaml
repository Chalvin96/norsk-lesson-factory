- handle: choose-quantity-or-order
  op: choose
  objective: obj-ordinal-numbers-01
  bloom: understand
  prompt_md: Choose the option whose Norwegian sentences express all six meanings.
    The scored dimension is quantity versus order, not sentence-form variation.
  derived_from:
  - section_id: a-likely-mistake
  stem_md: 'Choose the set that expresses these meanings: two rounds exist; a person
    has number four; someone is playing the second round; a room is on the fifth floor;
    people sit in the third row; Nora came in first place.'
  options:
  - id: correct
    text: 'Vi har to runder. Hun har nummer fire. Vi spiller den andre runden. Rommet
      ligger i femte etasje. Vi sitter på tredje rad. Nora kom på førsteplass. '
    correct: true
    why: The set uses cardinal numbers for quantity or identification and ordinal
      numbers for round, floor, row, and rank.
  - id: quantity-mix
    text: 'Vi har to runder. Hun har nummer fire. Vi spiller to runder. Hotellet har
      fem etasjer. Vi sitter på tredje rad. Nora kom på førsteplass. '
    correct: false
    why: Vi spiller to runder and Hotellet har fem etasjer express quantities, not
      the second round and the fifth floor.
  - id: wrong-rank
    text: 'Vi har to runder. Hun har nummer fire. Vi spiller den andre runden. Rommet
      ligger i femte etasje. Vi sitter på tredje rad. Nora kom på tredjeplass. '
    correct: false
    why: The final sentence gives Nora third place instead of first place.
- handle: express-rank-and-position
  op: write
  objective: obj-ordinal-numbers-01
  bloom: apply
  prompt_md: 'A race finishes in this order: Sofie first, Omar second, and Lina third.
    Write three short Norwegian sentences stating each person''s position. Use ordinal
    numbers to express first, second, and third place.'
  derived_from:
  - section_id: position-and-rank
  response_language: 'no'
  min_words: 9
  max_words: 25
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants only when they clearly state the three race positions
    with ordinal forms, not cardinal-number statements.
  criteria:
  - id: sofie-first
    instruction: States that Sofie came in first place, using første as an ordinal.
  - id: omar-second
    instruction: States that Omar came in second place, using andre as an ordinal.
  - id: lina-third
    instruction: States that Lina came in third place, using tredje as an ordinal.
- handle: locate-by-ordered-position
  op: write
  objective: obj-ordinal-numbers-01
  bloom: apply
  prompt_md: 'A visitor asks for directions in a building. Write three short Norwegian
    sentences in your own wording: say that the meeting room is on the fourth floor,
    the visitor''s seat is in the second row, and the third door is on the left. Use
    an ordinal in each sentence; use your own wording.'
  derived_from:
  - section_id: finding-places-in-an-ordered-setting
  response_language: 'no'
  min_words: 12
  max_words: 30
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that preserve all three locations and use fjerde,
    andre, and tredje as ordinals; exact wording is not required.
  criteria:
  - id: fourth-floor
    instruction: Locates the meeting room on the fourth floor with fjerde as an ordinal.
  - id: second-row
    instruction: Locates the visitor's seat in the second row with andre as an ordinal.
  - id: third-door
    instruction: Identifies the third door on the left with tredje as an ordinal.
- handle: complete-the-quiz-result
  op: write
  objective: obj-ordinal-numbers-01
  bloom: apply
  prompt_md: 'Reconstruct this quiz result in four or five short Norwegian sentences.
    Facts: you played in the third round; you answered the first and fourth questions
    correctly; your team came in first place; the team at the first table came in
    second place. Use complete Norwegian phrases with ordinal numbers.'
  derived_from:
  - section_id: returning-to-the-quiz
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants and pronoun changes only when all four facts remain
    explicit and each position uses the corresponding ordinal form.
  criteria:
  - id: third-round
    instruction: States that the quiz took place in the third round, using tredje
      as an ordinal.
  - id: first-fourth-questions
    instruction: States that the first and fourth questions were answered correctly,
      using første and fjerde as ordinals.
  - id: team-first-place
    instruction: States that the learner's team came in first place, using første
      as an ordinal.
  - id: first-table-second-place
    instruction: States that the team at the first table came in second place, using
      første and andre as ordinals.
- handle: describe-saras-ordered-day
  op: write
  objective: obj-ordinal-numbers-01
  bloom: apply
  prompt_md: 'Write five short Norwegian sentences describing Sara''s ordered
    day. Include these facts: her office is on the fourth floor; she attends her first
    meeting in the morning; she visits the second office along the corridor; she takes
    the third bus home; the next day she is second in the café queue. Use an ordinal
    for every position or sequence. Use your own wording.'
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 25
  max_words: 65
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that preserve all five facts and use the requested
    ordinal forms; do not accept cardinal forms for these positions.
  criteria:
  - id: sara-fourth-floor
    instruction: States that Sara's office is on the fourth floor, using fjerde as
      an ordinal.
  - id: sara-first-meeting
    instruction: States that Sara attends her first meeting, using første as an ordinal.
  - id: sara-second-office
    instruction: States that Sara visits the second office along the corridor, using
      andre as an ordinal.
  - id: sara-third-bus
    instruction: States that Sara takes the third bus home, using tredje as an ordinal.
  - id: sara-second-queue
    instruction: States that Sara is second in the café queue, using andre as an ordinal.
- handle: recall-and-use-three-ordinals
  op: write
  objective: obj-ordinal-numbers-01
  bloom: apply
  prompt_md: 'Write three short Norwegian sentences about a train station: use første,
    andre, and tredje once each, with one target word in each sentence. Each sentence
    must show order, rank, or position, not quantity. Use your own wording.'
  derived_from:
  - section_id: quick-retrieval-and-review
  response_language: 'no'
  min_words: 9
  max_words: 30
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept any natural Bokmål sentence that uses each target word as an ordinal showing
    order, rank, or position. Reject uses where a target word only identifies quantity
    or a number.
  criteria:
  - id: uses-forste
    instruction: Uses første in one sentence to show first position, rank, or order.
  - id: uses-andre
    instruction: Uses andre in one sentence to show second position, rank, or order.
  - id: uses-tredje
    instruction: Uses tredje in one sentence to show third position, rank, or order.
