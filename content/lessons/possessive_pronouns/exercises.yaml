- handle: cabin_trip_owner_selection
  op: choose
  objective: obj-possessive-pronouns-01
  bloom: understand
  prompt_md: During cabin packing, Mina points to her own key. Choose the Norwegian
    phrase that expresses her intended owner meaning.
  derived_from:
  - section_id: cumulative-transfer-packing-for-a-cabin-trip
  stem_md: Mina points to her own cabin key. Which phrase means my key?
  options:
  - id: cabin-my-key
    text: nøkkelen min
    correct: true
    why: min expresses Mina’s ownership of the masculine singular key.
  - id: cabin-your-key
    text: nøkkelen din
    correct: false
    why: din expresses the addressee’s ownership, not Mina’s.
  - id: cabin-our-key
    text: nøkkelen vår
    correct: false
    why: vår expresses shared ownership, not Mina’s individual ownership.
