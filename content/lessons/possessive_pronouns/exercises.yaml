- handle: final_my_your_our_retrieval
  op: write
  objective: obj-possessive-pronouns-01
  bloom: apply
  prompt_md: 'Three unlabeled belongings remain: a bag, a towel, and several keys.
    Write one short Norwegian phrase or sentence for each: identify the bag as mine,
    the towel as yours, and the keys as ours. Use the noun forms veska, håndkleet,
    and nøklene so the three items show different gender or number forms.'
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 6
  max_words: 24
  judge_prompt: Check the three requested Norwegian phrases or sentences against the
    task and report evidence for each criterion. Accept natural sentence framing and
    punctuation, but require the specified noun forms, owner meanings, and possessive
    agreement.
  criteria:
  - id: bag-is-mine
    instruction: Identifies the bag as mine with the specified feminine form and matching
      possessive, such as veska mi.
  - id: towel-is-yours
    instruction: Identifies the towel as yours with the specified neuter form and
      matching possessive, such as håndkleet ditt.
  - id: keys-are-ours
    instruction: Identifies the several keys as ours with the specified plural form
      and matching possessive, such as nøklene våre.
