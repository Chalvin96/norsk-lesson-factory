- handle: notice_embedded_question_order
  op: choose
  objective: obj-embedded-questions-01
  bloom: understand
  prompt_md: Choose the sentence that correctly embeds the question. The question
    word is not the subject.
  derived_from:
  - section_id: direct-and-embedded-questions
  stem_md: Which sentence uses question word + subject + finite verb inside the embedded
    question?
  options:
  - id: correct
    text: Vet du hvor spor 12 er?
    correct: true
    why: 'The embedded question has question word + subject + finite verb: hvor +
      spor 12 + er.'
  - id: inverted-platform
    text: Vet du hvor er spor 12?
    correct: false
    why: The finite verb comes before the subject, copying direct-question order.
  - id: inverted-departure
    text: Jeg lurer på hvorfor er avgangen endret.
    correct: false
    why: The finite verb comes before the subject inside the embedded question.
