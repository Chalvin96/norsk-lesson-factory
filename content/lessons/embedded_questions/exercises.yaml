- handle: complete_embedded_information_statement
  op: recall_fill
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: Complete each statement by selecting the taught embedded clause with
    subordinate-clause word order.
  derived_from:
  - section_id: statements-that-contain-questions
  audio_target: "Mina er usikker på om de har bestilt lunsj. Jonas husker ikke hvilket rom møtet er i. Vi må finne ut når resepsjonen stenger."
  segments:
  - text_md: 'Mina er usikker på '
  - blank_id: mina-clause
    options:
    - om de har bestilt lunsj
    - de har om bestilt lunsj
    answer_index: 0
  - text_md: '. Jonas husker ikke '
  - blank_id: jonas-clause
    options:
    - hvilket rom møtet er i
    - hvilket rom er møtet i
    answer_index: 0
  - text_md: '. Vi må finne ut '
  - blank_id: reception-clause
    options:
    - når resepsjonen stenger
    - når stenger resepsjonen
    answer_index: 0
  - text_md: .
- handle: repair_embedded_question_word_order
  op: find_fix
  objective: obj-embedded-questions-01
  bloom: analyze
  prompt_md: 'Jonas''s message contains one local word-order error in an embedded
    question about the bus and hotel. Select the only token group that must be corrected.
    The intended meaning is: “Do you know whether the bus does not go to the hotel?”
    Keep the question meaning and punctuation unchanged.'
  derived_from:
  - section_id: a-practical-editing-check
  tokens:
  - token_id: tok-1
    text: Vet
  - token_id: tok-2
    text: du
  - token_id: tok-3
    text: om
  - token_id: tok-4
    text: bussen
  - token_id: tok-5
    text: går ikke
  - token_id: tok-6
    text: til
  - token_id: tok-7
    text: hotellet?
  error_token_id: tok-5
  feedback: 'Replace går ikke with ikke går: Vet du om bussen ikke går til hotellet?'
- handle: use_embedded_questions_at_hotel_reception
  op: write
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: 'Write four natural Norwegian sentences addressed to hotel reception,
    one for each need: ask when breakfast ends; ask whether you can leave your suitcase
    here; ask where the airport bus stops; and ask why the key card does not work.
    Use a question word for specific information and om for the yes-or-no question.
    Put the subject before the finite verb in every embedded question, and put internal
    ikke before its finite verb in at least one sentence. Use your own wording rather
    than copying a complete lesson example.'
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 20
  max_words: 60
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: complete-reception-set
    instruction: Produces four complete, natural Bokmål sentences addressed to hotel
      reception, preserving the four requested information needs.
  - id: question-word-and-om
    instruction: Uses a question word for specific information and om for the yes-or-no
      need.
  - id: subordinate-order
    instruction: Places the subject before the finite verb in each embedded question.
  - id: internal-negation
    instruction: Places internal ikke before the finite verb in at least one embedded
      question.
- handle: retrieve_embedded_question_pattern
  op: write
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: Write in Norwegian a plain-language explanation of the embedded-question
    pattern and exactly two original sentences set in a hotel, workplace, or travel
    situation. One sentence must be a larger question introduced by a question word.
    The other must be a statement introduced by om. In the explanation, include
    subject-before-finite-verb order, the placement of internal ikke, and the subject-question
    pattern with som.
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 35
  max_words: 75
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: pattern-explanation
    instruction: States in plain Norwegian that embedded questions use a question
      word or om, place the subject before the finite verb, place internal ikke before
      that verb, and use subject question phrase + som + finite verb when appropriate.
  - id: question-word-sentence
    instruction: Produces one new larger question introduced by a question word with
      subordinate-clause word order.
  - id: om-statement
    instruction: Produces one new statement introduced by om with subordinate-clause
      word order.
  - id: new-wording
    instruction: Uses a new everyday situation and wording instead of copying a complete
      lesson sentence.
