- handle: select_question_word_or_om
  op: choose
  objective: obj-embedded-questions-01
  bloom: understand
  prompt_md: Choose the pair in which the first sentence asks where the hotel is and
    the second asks whether it is far away.
  derived_from:
  - section_id: questions-answered-with-yes-or-no-use-om
  stem_md: Which pair uses the correct introducer for each meaning?
  options:
  - id: correct
    text: Vet du hvor hotellet er? / Kan du sjekke om hotellet er langt unna?
    correct: true
    why: Hvor introduces specific location information; om introduces a yes-or-no
      question.
  - id: swapped-introducers
    text: Vet du om hotellet er langt unna? / Kan du sjekke hvor hotellet er?
    correct: false
    why: 'The meanings appear in the opposite order: om asks whether, while hvor asks
      for a location.'
