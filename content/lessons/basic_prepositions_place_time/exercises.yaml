- handle: transfer-weekend-plan
  op: write
  objective: obj-basic-prepositions-place-time-01
  bloom: apply
  prompt_md: Write a connected practical message from Emil. Say that he is currently
    at work, will leave in half an hour, will travel to Bergen, and will stay with
    his sister Lea for two days. Also say that he will be at Lea’s place and that
    Lea travelled to Oslo one week ago. Use suitable forms from i, på, hos, til, om,
    for … siden, and durational i.
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 30
  max_words: 70
  judge_prompt: Check only whether the connected message communicates the requested
    situation using appropriate Norwegian place and time prepositions. Report evidence
    for every criterion. Treat reasonable changes in sentence order and supporting
    verb forms as acceptable.
  criteria:
  - id: current-location
    instruction: States that Emil is currently at work using the conventional current-location
      phrase **på jobb**.
  - id: destination
    instruction: States that Emil will travel to Bergen using **til Bergen** for the
      destination.
  - id: visit-location
    instruction: States that Emil will be at Lea’s place using **hos Lea**.
  - id: future-time
    instruction: States that Emil will leave in half an hour using **om en halvtime**.
  - id: past-time
    instruction: States that Lea travelled to Oslo one week ago using the frame **for
      en uke siden**.
  - id: duration
    instruction: States that Emil’s stay with Lea lasts two days using durational
      **i to dager**.
- handle: retrieve-preposition-meanings
  op: write
  objective: obj-basic-prepositions-place-time-01
  bloom: apply
  prompt_md: 'Write six fresh, short Norwegian examples in your own words: one for
    current location, one for a destination, one for a visit location, one for future
    time from now, one for past time before now, and one for activity duration. Keep every example in Norwegian and make each meaning clear from its context.'
  derived_from:
  - section_id: final-retrieval
  response_language: 'no'
  min_words: 30
  max_words: 100
  judge_prompt: Check for six distinct Norwegian examples with the requested meanings.
    Accept any natural, simple example grounded in the taught patterns. Report evidence
    for every criterion; do not require specific people, places, or time quantities.
  criteria:
  - id: current-location
    instruction: Gives a natural current-location example using taught **i** or **på**
      usage and a clear Norwegian context.
  - id: destination
    instruction: Gives a destination example using **til** and makes the destination
      meaning clear from the Norwegian context.
  - id: visit-location
    instruction: Gives a visit-location example using **hos** with a person or professional
      and a clear Norwegian context.
  - id: future-time
    instruction: Gives a future-time-from-now example using **om** plus an amount
      of time and a clear Norwegian context.
  - id: past-time
    instruction: Gives a past-time-before-now example using **for … siden** with the
      amount inside the frame and a clear Norwegian context.
  - id: activity-duration
    instruction: Gives an activity-duration example using **i** plus an amount of
      time and a clear Norwegian context.
