- handle: plan_neighbourhood_meal_with_conditions
  op: write
  objective: obj-conditional-clauses-01
  bloom: apply
  prompt_md: 'Write exactly four Norwegian planning sentences for a neighbourhood
    meal. Sentence 1: rain remains possible; put a negative real condition first and
    say that the group can eat outside if it does not rain. Sentence 2: tables may
    be available; state the result first and the real condition second. Sentence 3:
    the current venue is not larger; put an imagined condition first and use a negative
    ville-result. Sentence 4: the bus may not come; state the real result first and
    put the negative condition second. Use hvis in every sentence, place ikke according
    to its clause, and use inversion after each initial hvis-clause.'
  derived_from:
  - section_id: transfer-to-new-situation
  response_language: 'no'
  min_words: 32
  max_words: 90
  judge_prompt: Check each planning sentence against its supplied fact, required condition
    type, clause order, negation location, and main-clause order. Accept natural Bokmål
    variants that preserve those constraints.
  criteria:
  - id: condition-patterns
    instruction: Uses real forms for the possible weather, tables, and bus events,
      and an imagined past-plus-ville pattern for the venue that is not larger.
  - id: negation-placement
    instruction: Places ikke before the finite verb in negative hvis-clauses and after
      ville in the requested negative imagined result.
  - id: inversion
    instruction: Begins each result following an initial hvis-clause with finite verb
      followed by subject.
  - id: integrated-plan
    instruction: Produces four complete hvis-sentences covering all supplied meal-planning
      facts and required clause orders.
- handle: retrieve_hvis_condition_patterns
  op: write
  objective: obj-conditional-clauses-01
  bloom: apply
  prompt_md: 'Write exactly four complete Norwegian hvis-sentences for these new situations.
    1: A train may be delayed; put the real condition first and state what you will
    do. 2: A friend may not find the meeting place; state a real result first and
    put the negative condition second. 3: Your home does not have more space; put
    an imagined condition first and state what you would do. 4: Give advice to another
    person with Hvis jeg var deg, placing the advice result first. Use correct subordinate-clause
    and main-clause word order throughout.'
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 28
  max_words: 80
  judge_prompt: Check independent retrieval of the required real and imagined hvis-patterns.
    Accept natural Bokmål wording when meaning, specified clause order, verb forms,
    and word order are correct. Report evidence for each criterion.
  criteria:
  - id: real-retrieval
    instruction: Produces real conditions for the possible train delay and the possible
      failure to find the meeting place.
  - id: imagined-retrieval
    instruction: Uses an imagined past-plus-ville pattern for the home and an appropriate
      Hvis jeg var deg advice pattern.
  - id: subordinate-order
    instruction: Uses subordinate-clause order, including ikke before the finite verb
      in the negative hvis-clause.
  - id: main-clause-order
    instruction: Uses inversion after the initial conditions and ordinary subject–verb
      order when the result is placed first.
