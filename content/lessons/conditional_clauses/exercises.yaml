- handle: write_real_plan_conditions
  op: write
  objective: obj-conditional-clauses-01
  bloom: apply
  prompt_md: 'Write exactly four brief hvis-sentences in Norwegian for Maja''s plan:
    the train may arrive on time, the weather may improve, Jonas may not make dinner,
    and the bus may not come for the return trip. Present all four as real possibilities.
    Put the condition first in two sentences and second in two. Use correct word order
    in both clauses, including ikke before the finite verb inside each negative hvis-clause.
    Vocabulary variety is not scored.'
  derived_from:
  - section_id: real-condition-uses
  response_language: 'no'
  min_words: 28
  max_words: 80
  judge_prompt: Check the four Norwegian sentences against the supplied situations.
    Accept natural variants that preserve real-condition meaning and required word
    order. Report evidence for every criterion; do not score vocabulary variety.
  criteria:
  - id: real-possibilities
    instruction: Presents all four supplied situations as real possibilities rather
      than imagined alternatives.
  - id: clause-order-variation
    instruction: Uses two condition-first sentences and two condition-second sentences.
  - id: subordinate-order
    instruction: Places ikke before the finite verb in each negative hvis-clause.
  - id: main-clause-order
    instruction: Uses verb–subject inversion after each initial hvis-clause and ordinary
      main-clause order when the result comes first.
- handle: distinguish_real_and_imagined_conditions
