  objective: obj-conditional-clauses-01
  bloom: analyze
  prompt_md: Classify each cabin statement by the meaning and verb-form contrast shown.
    Use the present-pattern versus past-in-the-hvis-clause plus ville-in-the-result
    evidence. Word order is not separately scored.
  explanation_md: "Use present forms for a real or open condition; past in the hvis-clause plus ville marks an imagined present situation."
  derived_from:
  - section_id: imagined-conditions
  buckets:
  - bucket_id: real
    label: 'Real possibility: present pattern'
  - bucket_id: imagined
    label: 'Imagined or remote: past form plus ville'
  items:
