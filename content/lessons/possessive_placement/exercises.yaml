- handle: choose_placement_from_information_focus
  op: recall_fill
  objective: obj-possessive-placement-01
  bloom: apply
  prompt_md: Fill both Norwegian phrase slots. The first context explicitly requests
    the unmarked written default. The second explicitly requests owner-first emphasis.
    Both matched orders are grammatical; score the requested placement and its corresponding
    noun form.
  explanation_md: "Postposed possessive is the neutral default; moving it before the noun emphasizes who owns the item and changes the noun to indefinite form."
  derived_from:
  - section_id: checkpoint-neutral-information-or-owner-contrast
  audio_target: "Sykkelen min står ute. Min sykkel er rød."
  segments:
  - text_md: 'There are two bicycles. Give the routine location answer about yours
      with the unmarked written pattern: “ '
  - blank_id: routine-bicycle
    options:
    - sykkelen min
    - min sykkel
    answer_index: 0
  - text_md: ' står ute.” To make the owner prominent, say: “ '
  - blank_id: owner-bicycle
    options:
    - min sykkel
    - sykkelen min
    answer_index: 0
  - text_md: ' er rød.”'
- handle: repair_possessive_placement_mismatches
  op: find_fix
  objective: obj-possessive-placement-01
  bloom: analyze
  prompt_md: Select the one token that is wrong/needs changing.
  derived_from:
  - section_id: checkpoint-repair-possessive-placement-mismatches
  tokens:
  - token_id: repair-1
    text: Min
  - token_id: repair-2
    text: sekken
  - token_id: repair-3
    text: er
  - token_id: repair-4
    text: her.
  error_token_id: repair-2
  feedback: Change sekken to sekk after the preposed possessive, producing Min sekk
    er her. The parallel mismatch sekk min is also rejected; its matched postposed
    form is sekken min.
- handle: complete_cabin_ownership_clarification
  op: recall_fill
  objective: obj-possessive-placement-01
  bloom: apply
  prompt_md: Complete both Norwegian phrase slots in the cabin continuation. The first
    slot explicitly requests the unmarked written default for a routine location answer.
    The second explicitly requests owner-first emphasis while correcting Emil. Both
    lua mi and mi lue are grammatical matched forms; the non-requested alternative
    must not be called ungrammatical.
  derived_from:
  - section_id: checkpoint-continue-cabin-exchange
  audio_target: "Hvor er lua? Lua mi er her. Mi lue er her."
  segments:
  - text_md: 'Emil: Hvor er lua? Nora gives the routine location answer with postposed
      possessive: “ '
  - blank_id: cabin-routine
    options:
    - lua mi
    - mi lue
    answer_index: 0
  - text_md: ' er her.” Emil says the hat belongs to him. Nora corrects him with owner-first
      emphasis: “ '
  - blank_id: cabin-emphasis
    options:
    - mi lue
    - lua mi
    answer_index: 0
  - text_md: ' er her.”'
