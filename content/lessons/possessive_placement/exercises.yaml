- handle: notice_possessive_noun_pairing
  op: categorize
  objective: obj-possessive-placement-01
  bloom: analyze
  prompt_md: Classify each Norwegian phrase into exactly one bucket. Focus on the
    taught pairing between possessive placement and noun form, not on which possessive
    is used.
  explanation_md: "Postposed possessives take a definite noun and usually sound neutral; preposed possessives take an indefinite noun and emphasize the owner."
  derived_from:
  - section_id: checkpoint-noticing-two-patterns
  buckets:
  - bucket_id: after-definite
    label: Possessive after noun + definite noun
  - bucket_id: before-indefinite
    label: Possessive before noun + indefinite noun
  items:
  - item_id: item-huset-mitt
    text: huset mitt
    bucket_id: after-definite
  - item_id: item-sykkelen-min
    text: sykkelen min
    bucket_id: after-definite
  - item_id: item-lua-mi
    text: lua mi
    bucket_id: after-definite
  - item_id: item-mitt-hus
    text: mitt hus
    bucket_id: before-indefinite
  - item_id: item-min-sykkel
    text: min sykkel
    bucket_id: before-indefinite
  - item_id: item-mi-lue
    text: mi lue
    bucket_id: before-indefinite
