- handle: retrieve_possessive_placement_rule
  op: write
  objective: obj-possessive-placement-01
  bloom: apply
  prompt_md: Without looking back, write the two regular common-noun patterns taught
    in the lesson. Give one natural Norwegian example of the unmarked written default
    and one natural Norwegian example with deliberate owner-first emphasis. Then briefly
    state in Norwegian how the noun form changes in the two patterns. Use a new lexical
    frame rather than copying a complete lesson sentence.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that preserve the requested placement and noun-
    form pairing. Do not mark the other matched order as wrong merely because it is
    not the requested communicative default.
  criteria:
  - id: postposed-pattern
    instruction: States the regular unmarked pattern as a definite common noun followed
      by a possessive.
  - id: preposed-pattern
    instruction: States the owner-first pattern as a possessive followed by an indefinite
      common noun.
  - id: default-example
    instruction: Gives one natural Norwegian example of the unmarked written default.
  - id: emphasis-example
    instruction: Gives one natural Norwegian example with deliberate owner-first emphasis.
  - id: noun-form-explanation
    instruction: Briefly explains in Norwegian how noun form changes between the two
      taught patterns.
