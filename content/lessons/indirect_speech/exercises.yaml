- handle: office-message-relay
  op: write
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: 'Write 3 connected sentences in Norwegian. Sara is speaking directly
    to Liv now. Relay these three parts of Jonas''s account as indirect speech, not
    direct quotes: Jonas said that Liv''s train was cancelled and that she was working
    from home; he said that Liv had asked him to send the clients a message; and he
    said that Amir had asked when Liv was coming back to the office. Use at for statement
    reports, keep når in the reported information question, and use subordinate word
    order. Because Sara speaks to Liv, use du for Liv and ham for Jonas where needed.'
  derived_from:
  - section_id: back-at-the-office
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept equivalent natural Bokmål variants only when they preserve all three messages
    and the requested viewpoint.
  criteria:
  - id: reports-all-messages
    instruction: Relays all three specified parts as complete indirect reports rather
      than direct quotations.
  - id: uses-reporting-forms
    instruction: Uses at for statement reports and keeps når in the reported information
      question.
  - id: subordinate-order
    instruction: Uses subordinate word order inside the reported at- and når-clauses.
  - id: shifts-viewpoint
    instruction: Uses du for Liv and ham for Jonas where the new speaker perspective
      requires those forms.
