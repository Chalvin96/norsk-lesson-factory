- handle: anchor-message-map
  op: categorize
  objective: obj-indirect-speech-01
  bloom: analyze
  prompt_md: Classify each report by its complete message map. In this office dialogue,
    Jonas reports Liv's messages as hun and Amir's as han; in the report with meg,
    meg refers to Jonas. Choose the bucket that identifies original speaker, message
    function, and recipient only when recipient is stated. Do not infer a recipient.
  explanation_md: "Indirect speech shifts viewpoint and uses subordinate order: «at/om/question word + subject + sentence adverb + finite verb». Reported requests use «be + person + om å + infinitive»."
  derived_from:
  - section_id: a-missed-meeting
  buckets:
  - bucket_id: liv-statement-no-recipient
    label: Liv — statement — recipient not stated
  - bucket_id: liv-question-no-recipient
    label: Liv — question — recipient not stated
  - bucket_id: liv-request-jonas
    label: Liv — request — Jonas
  - bucket_id: amir-statement-no-recipient
    label: Amir — statement — recipient not stated
  - bucket_id: amir-question-no-recipient
    label: Amir — question — recipient not stated
  items:
  - item_id: item-1
    text: Hun sa at toget til Bergen var innstilt.
    bucket_id: liv-statement-no-recipient
  - item_id: item-2
    text: Hun spurte om vi kunne flytte presentasjonen.
    bucket_id: liv-question-no-recipient
  - item_id: item-3
    text: Hun ba meg også om å sende kundene en melding i dag.
    bucket_id: liv-request-jonas
  - item_id: item-4
    text: Han sa at han allerede hadde snakket med dem.
    bucket_id: amir-statement-no-recipient
  - item_id: item-5
    text: Han spurte også når Liv kom tilbake til kontoret.
    bucket_id: amir-question-no-recipient
  - item_id: item-6
    text: Hun sa at hun skulle komme tilbake hit i dag.
    bucket_id: liv-statement-no-recipient
