- handle: final-indirect-speech-retrieval
  op: write
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: Write a compact connected set of 5 Norwegian indirect reports in a new
    situation; do not copy a complete chapter example. You are Mina, speaking to Erik
    the next morning about yesterday's museum visit. A woman guide said «Utstillingen
    åpner klokka ti.», asked «Har Erik bestilt billett?», asked «Hvorfor kom dere
    sent?» and asked «Hvem tok med billettene?». She also told Mina «Vent utenfor.».
    Report all five messages indirectly. Use at for the statement, om only for the
    yes-or-no question, preserve question-word reports with subordinate order and
    som when the question word is the subject, and report the instruction with be
    noen om å. Keep the yesterday timeline and Mina's perspective when choosing pronouns
    and tense.
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 30
  max_words: 70
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept equivalent natural Bokmål variants only when they preserve the specified
    message types, timeline, and speaker perspective.
  criteria:
  - id: reports-all-five-messages
    instruction: Communicates the guide's statement, two information questions, yes-or-no
      question, and instruction as indirect reports.
  - id: uses-indirect-forms
    instruction: Uses at for the statement, om only for the yes-or-no question, and
      question-word clauses without direct-question inversion.
  - id: uses-subject-som
    instruction: Uses hvem som for the question in which hvem is the clause subject.
  - id: reports-instruction
    instruction: Reports the instruction with a natural be + person + om å + infinitive
      construction.
  - id: preserves-time-and-perspective
    instruction: Uses a coherent past viewpoint and identifies Mina, Erik, and the
      guide consistently from Mina's position.
