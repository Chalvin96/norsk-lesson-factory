- handle: report-time-viewpoint
  op: choose
  objective: obj-indirect-speech-01
  bloom: analyze
  prompt_md: 'Choose the complete set of reports that preserves all three time relationships:
    the office closing time is still a general fact, Liv''s illness belonged only
    to the earlier day, and the client conversation happened before an earlier past
    report.'
  derived_from:
  - section_id: choosing-tense-in-a-report
  stem_md: Choose the set that matches all three contexts and uses meaningful tense
    rather than automatic backshifting.
  options:
  - id: automatic-backshift
    text: 1. Amir sa at kontoret stengte klokka fem. 2. Liv sa at hun var syk. 3.
      Amir sa at han allerede snakket med kundene.
    correct: false
    why: This backshifts the continuing general fact and does not use past perfect
      for the event completed before the past report.
  - id: viewpoint-preserved
    text: 1. Amir sa at kontoret stenger klokka fem. 2. Liv sa at hun var syk. 3.
      Amir sa at han allerede hadde snakket med kundene.
    correct: true
    why: The present keeps the general fact current, the past presents the earlier
      illness, and the past perfect places the client conversation before the past
      report.
  - id: present-for-earlier-events
    text: 1. Amir sa at kontoret stenger klokka fem. 2. Liv sa at hun er syk. 3. Amir
      sa at han allerede har snakket med kundene.
    correct: false
    why: The present forms incorrectly present the earlier illness and completed past
      event as current from the required past viewpoint.
