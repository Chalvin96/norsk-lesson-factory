- handle: recognize_zero_ending_neuter_plurals
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: Read the sentence and choose the complete interpretation of the unchanged
    noun.
  derived_from:
  - section_id: short-neuter-nouns-with-no-indefinite-plural-ending
  stem_md: Det står tre bord i rommet.
  options:
  - id: regular_plural
    text: tre border — three tables; indefinite plural with -er
    correct: false
    why: border is the incorrect overextended -er form for this noun.
  - id: definite_plural
    text: bordene — the tables; definite plural
    correct: false
    why: The sentence uses the unchanged indefinite plural bord.
  - id: singular
    text: et bord — one table; singular
    correct: false
    why: The sentence contains tre, not one.
  - id: correct
    text: tre bord — three tables; indefinite plural with zero ending
    correct: true
    why: The number tre shows that bord is plural, even though the noun has no visible
      ending.
