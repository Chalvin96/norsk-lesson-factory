- handle: recognize_common_irregular_plurals
  op: match_pairs
  objective: obj-noun-plurals-01
  bloom: remember
  prompt_md: Match each singular noun and requested plural status with the taught
    irregular plural form. This tests recognition, not independent spelling recall.
  explanation_md: "These plurals change inside the stem: bok–bøker, mann–menn, and fot–føtter."
  derived_from:
  - section_id: some-common-nouns-change-inside-the-word
  left:
  - left_id: book-indefinite
    text: ei/en bok → indefinite plural
  - left_id: book-definite
    text: ei/en bok → definite plural
  - left_id: man-indefinite
    text: en mann → indefinite plural
  - left_id: man-definite
    text: en mann → definite plural
  - left_id: foot-indefinite
    text: en fot → indefinite plural
  - left_id: foot-definite
    text: en fot → definite plural
  right:
  - right_id: books-indefinite
    text: bøker — books
  - right_id: books-definite
    text: bøkene — the books
  - right_id: men-indefinite
    text: menn — men
  - right_id: men-definite
    text: mennene — the men
  - right_id: feet-indefinite
    text: føtter — feet
  - right_id: feet-definite
    text: føttene — the feet
  pairs:
  - left_id: book-indefinite
    right_id: books-indefinite
  - left_id: book-definite
    right_id: books-definite
  - left_id: man-indefinite
    right_id: men-indefinite
  - left_id: man-definite
    right_id: men-definite
  - left_id: foot-indefinite
    right_id: feet-indefinite
  - left_id: foot-definite
    right_id: feet-definite
- handle: track_plural_reference_in_context
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: Nora and Amir are arranging the meeting room. The first sentence introduces
    four cups; the second refers to that same group. Choose the exchange with the
    correct plural definiteness.
  derived_from:
  - section_id: following-a-noun-through-a-conversation
  stem_md: Choose the exchange that tracks the introduced group correctly.
  options:
  - id: correct
    text: Nora finner fire kopper. Koppene står ved døra.
    correct: true
    why: kopper introduces the group; koppene refers back to the same identifiable
      cups.
  - id: reversed
    text: Nora finner koppene. Fire kopper står ved døra.
    correct: false
    why: The first sentence treats the group as already known, while the second makes
      it indefinite.
  - id: first_definite
    text: Nora finner koppene. Koppene står ved døra.
    correct: false
    why: The first sentence is introducing the group, not referring back to an earlier
      group.
  - id: second_indefinite
    text: Nora finner fire kopper. Kopper står ved døra.
    correct: false
    why: The second sentence should identify the group introduced in the first sentence.
- handle: repair_plural_form_errors
  op: find_fix
  objective: obj-noun-plurals-01
  bloom: analyze
  prompt_md: Select the one token that is wrong/needs changing.
  derived_from:
  - section_id: common-mistakes-to-avoid
  tokens:
  - token_id: tok-1
    text: Nora
  - token_id: tok-2
    text: finner
  - token_id: tok-3
    text: stolerene
  - token_id: tok-4
    text: .
  error_token_id: tok-3
  feedback: Replace stolerene with stolene. The definite plural ending attaches to
    singular stem stol, not to indefinite plural stoler.
- handle: choose_plural_forms_for_picnic
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: Two family members are packing a picnic. In each option, the first list
    introduces items and the second list refers to the same items. Choose the list
    pair with correct plural definiteness across regular, unstressed-e, zero-ending,
    and irregular nouns.
  derived_from:
  - section_id: cumulative-transfer-preparing-for-a-picnic
  stem_md: Choose the connected picnic exchange with the correct indefinite and definite
    plural choices.
  options:
  - id: reversed
    text: 'A: Vi pakker posene, koppene, eplene, glassene og bøkene. B: Nå ligger
      poser, kopper, epler, glass og bøker i sekken.'
    correct: false
    why: The first list uses definite forms before the items are introduced, and the
      second loses the known reference.
  - id: correct
    text: 'A: Vi pakker poser, kopper, epler, glass og bøker. B: Nå ligger posene,
      koppene, eplene, glassene og bøkene i sekken.'
    correct: true
    why: The first list introduces unspecified quantities; the second list refers
      to the known items.
  - id: no_reference
    text: 'A: Vi pakker poser, kopper, epler, glass og bøker. B: Nå ligger poser,
      kopper, epler, glass og bøker i sekken.'
    correct: false
    why: The second list does not mark the items as the known group from the first
      list.
  - id: mixed_first
    text: 'A: Vi pakker poser, koppene, epler, glass og bøker. B: Nå ligger posene,
      koppene, eplene, glassene og bøkene i sekken.'
    correct: false
    why: koppene is definite even though the first list introduces the cups.
