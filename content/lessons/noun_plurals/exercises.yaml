- handle: notice_indefinite_and_definite_groups
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: Nora is listing cups needed for the meeting room. No particular cups
    have been introduced in the first situation; in the second, Amir refers to cups
    already brought into the room. Choose the pair that expresses both meanings.
  derived_from:
  - section_id: the-most-common-pattern-er-and-ene
  stem_md: Choose the pair with the correct plural meaning in both situations.
  options:
  - id: both_definite
    text: 'Først: koppene (the cups). Senere: koppene (the cups).'
    correct: false
    why: The first situation does not identify a particular group.
  - id: reversed
    text: 'Først: koppene (the cups). Senere: kopper (cups).'
    correct: false
    why: The meanings are reversed.
  - id: correct
    text: 'Først: kopper (cups). Senere: koppene (the cups).'
    correct: true
    why: kopper introduces an unspecified quantity; koppene refers to an identifiable
      group.
  - id: both_indefinite
    text: 'Først: kopper (cups). Senere: kopper (cups).'
    correct: false
    why: The second reference needs to identify the known group.
