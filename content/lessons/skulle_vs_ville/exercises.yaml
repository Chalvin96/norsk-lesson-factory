- handle: contrast-plan-and-willingness
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: Write two Norwegian sentences about Nora and Emil. In the first, present
    an earlier arrangement that Nora would drive Emil. In the second, present a different
    past situation where Emil needed a driver and Nora was ready to help. Then add
    one short Norwegian statement explaining the meaning difference between skulle
    and ville in your two sentences.
  derived_from:
  - section_id: ville-for-past-willingness
  response_language: 'no'
  min_words: 15
  max_words: 45
  judge_prompt: Check the two sentences and the brief Norwegian explanation. Accept
    natural wording with the same person and action. The first sentence must frame
    an earlier arrangement with skulle + infinitive; the second must frame contextually
    established willingness with ville + infinitive after a stated need or request.
  criteria:
  - id: arrangement-with-skulle
    instruction: Presents Nora’s action as an earlier arrangement using *skulle* +
      infinitive.
  - id: willingness-with-ville
    instruction: Presents Nora’s readiness to act in response to Emil’s need using
      *ville* + infinitive.
  - id: explains-meaning-contrast
    instruction: States in Norwegian that *skulle* marks the arrangement while *ville*
      marks contextual past willingness.
