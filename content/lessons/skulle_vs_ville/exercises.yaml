- handle: distinguish-reported-and-hypothetical-would
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'Write four natural Norwegian sentences, one for each situation. Use
    skulle when reporting the explicit earlier skal plan or promise, and ville for
    the imagined result of a condition. 1. Maja earlier said: Jeg skal bli med. Report
    her statement later. 2. Jonas earlier promised: Jeg skal sende dokumentet samme
    kveld. Report the promise later. 3. Imagine that the flat were cheaper. State
    the result of renting it. 4. Imagine that she lived closer. State the result of
    visiting her more often.'
  derived_from:
  - section_id: ville-for-hypothetical-results
  response_language: 'no'
  min_words: 24
  max_words: 65
  judge_prompt: Check the four Norwegian sentences against their supplied meanings.
    Require skulle + infinitive in the two reports of explicit earlier skal statements,
    and ville + infinitive in the two imagined results with conditional meaning. Accept
    natural variations in subjects and reporting verbs. If a report genuinely leaves
    both modals natural, accept either only when the learner’s wording supports that
    reading.
  criteria:
  - id: reported-modal-selection
    instruction: Selects *skulle* for both reports that preserve explicit earlier
      *skal* meanings.
  - id: hypothetical-modal-selection
    instruction: Selects *ville* + infinitive for both results that depend on imagined
      conditions.
  - id: separates-meanings
    instruction: Keeps reported earlier plans or promises distinct from hypothetical
      results across all four sentences.
- handle: interpret-market-follow-up
  op: choose
  objective: obj-skulle-vs-ville-01
  bloom: understand
  prompt_md: Choose the complete interpretation of every modal occurrence in this
    continuation of the market scene.
  derived_from:
  - section_id: back-at-the-market
  stem_md: 'Read the dialogue: 1. Vi trodde at du skulle komme senere. — We thought
    that you would come later. 2. Det trodde jeg også, men naboen min ville kjøre
    meg. — I thought so too, but my neighbour was willing to drive me. 3. Flott! Du
    sa tidligere at du ville lage kaffe. Har du fortsatt lyst til det? — Great! You
    said earlier that you were willing to make coffee. Do you still want to? 4. Ja.
    Hvis dere fant en stor termos, ville jeg lage kaffe til alle. — Yes. If you found
    a large thermos, I would make coffee for everyone. 5. Termosen skulle stå på kjøkkenet,
    men jeg finner den ikke. — The thermos was supposed to be in the kitchen, but
    I cannot find it. 6. Jakob sa at han skulle ta den med. Jeg ringer ham. — Jakob
    said that he would bring it. I will call him.'
  options:
  - id: willingness-map
    text: 1. skulle komme senere reports willingness. 2. ville kjøre meg reports an
      earlier arrangement. 3. ville lage kaffe is a hypothetical result. 4. ville
      jeg lage kaffe reports willingness. 5. skulle stå på kjøkkenet expresses willingness.
      6. skulle ta den med is a hypothetical result.
    correct: false
    why: The dialogue explicitly marks 2 and 3 as willingness, but 1, 4, 5, and 6
      have different meanings.
  - id: connected-meaning-map
    text: 1. skulle komme senere reports an expected event and preserves an earlier
      skal-type meaning. 2. ville kjøre meg expresses the neighbour’s willingness.
      3. ville lage kaffe reports Sara’s earlier willingness. 4. ville jeg lage kaffe
      is a hypothetical result dependent on finding a thermos. 5. skulle stå på kjøkkenet
      expresses an expectation about the thermos’s location. 6. skulle ta den med
      reports Jakob’s earlier plan or commitment.
    correct: true
    why: The connected context distinguishes reported expectation or commitment, willingness,
      and hypothetical result.
  - id: all-reported-plan
    text: All six occurrences report earlier plans or expectations, including the
      two occurrences of ville.
    correct: false
    why: The conditional result in 4 and the willingness readings in 2 and 3 are not
      earlier arrangements.
  - id: all-hypothetical
    text: All six occurrences describe imagined results, because every English translation
      contains a form of would.
    correct: false
    why: English would does not determine one Norwegian modal; only 4 has hypothetical
      result meaning here.
- handle: transfer-cabin-plans
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'Write a short connected Norwegian account of a delayed cabin trip, followed
    by a short follow-up message. Use the new cabin situation and include all four
    meanings in the connected text: - one earlier
    arrangement for the trip, expressed with skulle + infinitive; - one later report
    preserving a friend’s explicit earlier skal-type plan or commitment, expressed
    with skulle + infinitive; - one earlier response to a stated request or need for
    help, expressed with ville + infinitive; - one imagined bad-weather result that
    depends on a condition, expressed with ville + infinitive. Make the account and
    follow-up message show why each modal is chosen.'
  derived_from:
  - section_id: cumulative-transfer-a-delayed-cabin-trip
  response_language: 'no'
  min_words: 45
  max_words: 100
  judge_prompt: Check the connected cabin account and follow-up message against every
    criterion. Accept natural cabin vocabulary, infinitives, subjects, and sentence
    order when each required meaning is clear. Accept either modal for a reported
    context only when the learner’s supplied wording genuinely leaves skulle and future-in-the-past
    ville equally natural. Do not require copied lesson sentences.
  criteria:
  - id: cabin-arrangement
    instruction: Includes an earlier cabin arrangement expressed with *skulle* + infinitive.
  - id: cabin-reported-plan
    instruction: Includes a later report preserving an explicit earlier *skal*-type
      plan or commitment with *skulle* + infinitive.
  - id: cabin-willingness
    instruction: Includes an earlier response to a stated request or need for help
      using *ville* + infinitive for willingness.
  - id: cabin-hypothetical
    instruction: Includes an imagined bad-weather result dependent on a condition
      using *ville* + infinitive.
  - id: integrated-transfer
    instruction: Connects all four meanings in a new cabin account and follow-up message.
- handle: retrieve-skulle-versus-ville
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: Produce four natural Norwegian sentences, one for each new situation
    below. After each sentence, add a few Norwegian words explaining the modal choice.
    1. Yesterday, Nora arranged to call the doctor after lunch. 2. Later, Kari reports
    Jonas’s explicit earlier promise to send the document that same evening. 3. Earlier,
    Sara volunteered to help when neighbours needed help carrying tables. 4. Imagine
    that the weather at the cabin were better and more people would come. Select skulle
    for the earlier arrangement or reported earlier skal promise, and ville for past
    willingness or the hypothetical result.
  derived_from:
  - section_id: final-retrieval
  response_language: 'no'
  min_words: 35
  max_words: 90
  judge_prompt: Check four Norwegian sentences and their short Norwegian explanations.
    Accept natural lexical and structural variants that preserve each situation. Require
    skulle for the appointment arrangement and explicit earlier promise, and ville
    for the stated past willingness and imagined result. If a reported prompt genuinely
    leaves both modals natural, accept either when the learner’s context supports
    that reading.
  criteria:
  - id: retrieves-earlier-plan
    instruction: Uses *skulle* to present the appointment as an earlier arrangement.
  - id: retrieves-reported-promise
    instruction: Uses *skulle* to report the explicit earlier *skal* promise.
  - id: retrieves-willingness
    instruction: Uses *ville* to present Sara’s contextually established past willingness
      to help.
  - id: retrieves-hypothetical
    instruction: Uses *ville* + infinitive for the result of the imagined weather
      condition.
  - id: explains-modal-choices
    instruction: Adds a few Norwegian words explaining the meaning choice after each
      Norwegian sentence.
