- handle: notice-earlier-plans
  op: choose
  objective: obj-skulle-vs-ville-01
  bloom: understand
  prompt_md: Revisit the market preparation examples. Choose the complete interpretation
    that identifies what each use of skulle points back to and whether completion
    is asserted.
  derived_from:
  - section_id: skulle-for-an-earlier-plan
  stem_md: 'Read these statements: 1. Emil skulle hente bordene. — Emil was going
    to collect the tables. 2. Vi skulle spise sammen på fredag. — We were supposed
    to eat together on Friday. 3. Bussen skulle komme klokka halv ti. — The bus was
    due to arrive at half past nine.'
  options:
  - id: willingness
    text: 'All three statements present willingness to act: Emil was willing to collect
      the tables, the group was willing to eat, and the bus was willing to arrive.'
    correct: false
    why: The contexts describe arrangements or expectations, not people’s willingness.
  - id: hypothetical-results
    text: All three statements describe imagined results that depend on an unstated
      condition.
    correct: false
    why: Imagined results are taught with ville; these statements refer to earlier
      plans or expectations.
  - id: earlier-plans-expectation
    text: Emil’s job was previously arranged, the meal was an earlier arrangement,
      and the bus arrival was an earlier expectation or schedule. None of the three
      statements guarantees that the action happened.
    correct: true
    why: Skulle presents a recoverable earlier plan, arrangement, or expectation,
      not the final result.
  - id: completed-actions
    text: All three statements say that the actions definitely happened as planned.
    correct: false
    why: The lesson states that skulle describes the plan or expectation, whether
      or not the action was completed.
