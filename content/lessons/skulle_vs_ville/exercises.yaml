- handle: report-future-from-past
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'Write four short Norwegian past reports, one for each earlier statement
    below. Preserve the explicit earlier skal-type plan, schedule, promise, or announcement
    with skulle + infinitive. 1. Emil earlier said: Jeg skal hente bordene. Report
    this later. 2. The timetable earlier stated: Bussen skal komme klokka halv ti.
    Report this later. 3. Jonas earlier promised: Jeg skal sende dokumentet samme
    kveld. Report the promise later. 4. The teacher earlier announced: Prøven skal
    begynne klokka ti. Report the announcement later.'
  derived_from:
  - section_id: skulle-for-future-viewed-from-the-past
  response_language: 'no'
  min_words: 24
  max_words: 70
  judge_prompt: Check all four Norwegian reports against the task and report evidence
    for each criterion. Accept natural variations in reporting verb, subject reference,
    and word order when the earlier plan, schedule, promise, or announcement remains
    clear. Require skulle followed by an infinitive for these explicit earlier skal
    contexts. If a supplied report genuinely leaves skulle and future-in-the- past
    ville equally natural, accept either modal when the surrounding wording supports
    that reading.
  criteria:
  - id: preserves-earlier-skal
    instruction: Preserves the earlier plan, schedule, promise, or announcement in
      all four reports.
  - id: uses-skulle-infinitive
    instruction: Uses *skulle* followed by an infinitive in each report of the explicit
      earlier *skal* meaning.
