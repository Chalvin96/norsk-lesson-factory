- handle: notice_sentence_structure
  op: categorize
  objective: obj-discourse-connectors-02
  bloom: analyze
  prompt_md: Classify each Norwegian excerpt by the structural pattern it demonstrates.
    Identify the connector when one is present, the finite verb, and the subject from
    the words shown. Items 2 and 3 are the two parts of one sentence; item 3 is the
    main clause following item 2. Distinguish connector-initial V2,
    subject-before-verb order inside an opening selv om clause, inversion in the
    following main clause, and ordinary subject–verb order after men. Do not treat
    men as a fronted adverbial connector.
  explanation_md: "An opening connector occupies the first position of a Norwegian main clause, so the finite verb comes next. Inside a subordinate clause such as «selv om …», the subject stays before the verb."
  derived_from:
  - section_id: connectors-v2-rule
  buckets:
  - bucket_id: connector_initial_v2
    label: Connector-initial main clause with finite verb before subject
  - bucket_id: selv_om_subordinate_order
    label: Subject–verb order inside an selv om clause
  - bucket_id: selv_om_following_main_v2
    label: Inversion in the main clause following an opening selv om clause
  - bucket_id: men_subject_verb
    label: Ordinary subject–verb order after men
  items:
  - item_id: structure-1
    text: Først kom det bare seks frivillige.
    bucket_id: connector_initial_v2
  - item_id: structure-2
    text: Selv om butikken lå langt unna
    bucket_id: selv_om_subordinate_order
  - item_id: structure-3
    text: hentet Nora malingen.
    bucket_id: selv_om_following_main_v2
  - item_id: structure-4
    text: men vi begynte som planlagt.
    bucket_id: men_subject_verb
