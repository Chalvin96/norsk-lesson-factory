- handle: end_council_report
  op: write
  objective: obj-discourse-connectors-01
  bloom: apply
  prompt_md: Write 12–35 words in Norwegian to end the volunteer-day report. First
    state a final event using Til slutt. Then add an overall evaluation using Alt
    i alt or a conclusion containing altså. Use each connector for its intended purpose
    and maintain correct word order.
  derived_from:
  - section_id: drawing-a-conclusion
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept either the taught overall-conclusion form with alt i alt or
    a natural conclusion containing altså, provided the two connectors have distinct
    chronological and evaluative functions.
  criteria:
  - id: final-event
    instruction: Uses til slutt for the final event.
  - id: overall-conclusion
    instruction: Uses alt i alt or altså for the conclusion.
  - id: connector-functions
    instruction: Uses each connector for its intended chronological or evaluative
      purpose.
  - id: correct-word-order
    instruction: Maintains correct word order.
- handle: repair_fronted_connector
  op: find_fix
  objective: obj-discourse-connectors-01
  bloom: analyze
  prompt_md: 'Select the one token misplaced in the Norwegian sentence. The feedback explains the word-order repair and the connector meaning.'
  derived_from:
  - section_id: common-mistakes-to-avoid
  tokens:
  - token_id: repair-01
    text: Deretter
  - token_id: repair-02
    text: elevene
  - token_id: repair-03
    text: reparerte
  - token_id: repair-04
    text: porten.
  error_token_id: repair-02
  feedback: Deretter marks a later step and fills the first position. The finite verb
    reparerte must come before the subject elevene; identify this placement error
    and rewrite the complete sentence.
- handle: coherent_project_update
  op: write
  objective: obj-discourse-connectors-01
  bloom: apply
  prompt_md: Write an 80–130-word Norwegian council update as one coherent account
    of the garden workday, without copying the dialogue line by line. Begin with the
    initial situation, organize the work in sequence, add supporting information,
    mention an obstacle and its response, explain a cause-and-result relationship,
    and end with a final event and an overall conclusion. Use connectors for distinct
    functions, including sequence, addition, cause, result, and conclusion. Include
    a fronted adverbial connector with finite verb before subject; an opening selv
    om clause followed by an inverted main clause; a fordi clause and the opening
    selv om clause with subject before finite verb; one men clause whose first constituent
    after men is the subject; and one men clause with a taught adverbial fronted after
    men, so the finite verb comes before the subject. Do not count men itself as a
    fronted adverbial.
  derived_from:
  - section_id: extended-practice
  response_language: 'no'
  min_words: 80
  max_words: 130
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Require one coherent garden-project report with distinct connector
    functions, all requested subordinate and main-clause word orders, and both contrasting
    men patterns. Accept natural Bokmål variants grounded in the lesson.
  criteria:
  - id: coherent-report
    instruction: Reads as one coherent report rather than isolated sentences.
  - id: distinct-connector-functions
    instruction: Uses connectors for distinct functions.
  - id: fronted-adverbial-v2
    instruction: Places the finite verb before the subject after fronted adverbial
      connectors.
  - id: opening-selv-om-inversion
    instruction: Uses inversion in the main clause following an opening selv om clause.
  - id: subordinate-order
    instruction: Retains subject-before-verb order inside the modeled fordi and selv
      om clauses.
  - id: men-subject-verb
    instruction: Uses subject–verb order after men when the subject is the coordinated
      clause's first constituent.
  - id: men-fronted-adverbial-v2
    instruction: Uses verb–subject order when a taught adverbial is fronted after
      men.
- handle: short_retrieval_review
  op: write
  objective: obj-discourse-connectors-02
  bloom: apply
  prompt_md: 'Without looking back, write six numbered sentences in Norwegian, one
    for each relationship: sequence, addition, direct contrast, concession, cause,
    and conclusion. Use fresh situations and lexical frames rather than copying complete
    lesson sentences. Set the addition sentence outside the garden report in an everyday
    grocery-shopping context, using i tillegg or dessuten. Use men or derimot for
    direct contrast, likevel or selv om for concession, and fordi for cause with subject
    before finite verb in its subordinate clause. Use a fronted adverbial connector
    in at least four sentences. Before submitting, check second-position finite verbs
    after each fronted adverbial connector. Do not treat men itself as a fronted adverbial.
    If a taught adverbial follows men, apply the V2 check to that adverbial; if concession
    uses selv om, do not apply the main-clause check inside its subordinate clause.'
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 35
  max_words: 90
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Verify six distinct relationship sentences, the grocery-shopping addition
    context, the required connector choices, at least four fronted adverbials, and
    the separate main-clause and subordinate-clause word-order rules. Reject copied
    complete lesson sentences.
  criteria:
  - id: six-relationships
    instruction: Produces one sentence for each of the six relationships.
  - id: direct-contrast
    instruction: Uses men or derimot for direct contrast.
  - id: concession
    instruction: Uses likevel or selv om for concession.
  - id: fordi-order
    instruction: Uses fordi with the modeled subordinate-clause word order.
  - id: fronted-four
    instruction: Uses a fronted adverbial connector in at least four sentences.
  - id: grocery-addition
    instruction: Sets the addition sentence in an everyday grocery-shopping context
      outside the garden report.
  - id: second-position-check
    instruction: Keeps finite verbs in second position after fronted adverbial connectors.
  - id: men-not-fronted
    instruction: Does not treat men itself as a fronted adverbial connector.
  - id: selv-om-boundary
    instruction: Does not apply the main-clause V2 check inside a selv om subordinate
      clause.
