- handle: strengthen_report
  op: write
  objective: obj-discourse-connectors-01
  bloom: apply
  prompt_md: Write 35–70 words in Norwegian for Ingrid and Samir's council report.
    Add two coherent supporting facts, with one sentence beginning with I tillegg
    and one beginning with Dessuten. Then respond to Skoleklassen kom. with a follow-up
    about the teacher's tools. Choose i tillegg if the tools are extra information
    or deretter if they are a later event, and explain in Norwegian how the alternative
    would change the listener's interpretation from addition to sequence or from sequence
    to addition. Use verb–subject order after every fronted adverbial connector.
  derived_from:
  - section_id: adding-another-point
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept natural Bokmål variants, but require both added facts, the requested
    connector choices, the explanation of the alternative interpretation, and correct
    verb–subject order after each fronted adverbial connector.
  criteria:
  - id: coherent-supporting-details
    instruction: Adds coherent supporting details to the council report.
  - id: i-tillegg-fact
    instruction: Uses i tillegg to introduce one added fact.
  - id: dessuten-fact
    instruction: Uses dessuten to introduce one added fact.
  - id: relationship-choice
    instruction: Selects a connector that matches the intended addition or sequence
      relationship.
  - id: alternative-interpretation
    instruction: Explains how the alternative connector changes the listener's interpretation.
  - id: fronted-adverbial-order
    instruction: Uses verb–subject order after each fronted adverbial connector.
- handle: present_obstacle_response
  op: write
  objective: obj-discourse-connectors-02
  bloom: apply
  prompt_md: Write a brief Norwegian response about the volunteer day. Present the
    rain as one problem and the distant shop as another. Use one likevel construction
    beginning with fronted Likevel to connect a problem with its response. Write one
    sentence beginning with an opening Selv om clause to connect the other problem
    with its response. Add one direct contrast between two people, things, or situations
    using men or derimot. Make every relationship clear and use inversion in the main
    clauses after fronted Likevel and after the opening Selv om clause.
  derived_from:
  - section_id: expressing-contrast-concession
  response_language: 'no'
  min_words: 30
  max_words: 65
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Require a clear rain response, a clear distant-shop response, one direct
    contrast, the requested likevel and selv om constructions, and correct inversion
    in both relevant main clauses.
  criteria:
  - id: clear-relationships
    instruction: Makes the rain response, distant-shop response, and direct contrast
      clear.
  - id: direct-contrast
    instruction: Uses men or derimot for the direct contrast.
  - id: likevel-concession
    instruction: Uses likevel for one concession.
  - id: opening-selv-om
    instruction: Begins one sentence with a selv om clause.
  - id: main-clause-inversion
    instruction: Uses inversion in the main clauses after fronted likevel and an opening
      selv om clause.
