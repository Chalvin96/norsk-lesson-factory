- handle: repair_meaning_and_form
  op: find_fix
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: analyze
  prompt_md: 'Select the token where the practical-payoff expression is incomplete. The feedback gives the complete form.'
  tokens:
  - token_id: repair-01
    text: Det
  - token_id: repair-02
    text: lønner
  - token_id: repair-03
    text: å
  - token_id: repair-04
    text: bestille
  - token_id: repair-05
    text: tidlig.
  error_token_id: repair-02
  feedback: The practical-payoff expression is lønne seg. Add seg after lønner and
    before å; the repaired sentence is Det lønner seg å bestille tidlig.
  derived_from:
  - section_id: common-mistakes
- handle: guided_application_decisions
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: Write four short Norwegian recommendations, one for each development.
    Use one target expression in each response and include a brief reason. 1. Advance
    tickets are discounted when bought early. 2. The restaurant is excellent but far
    away. 3. The slower route has beautiful scenery. 4. A travel card covers several
    journeys.
  response_language: 'no'
  min_words: 30
  max_words: 80
  judge_prompt: Check each recommendation against its development and report evidence
    for each criterion. Accept natural Bokmål variants with the required target expression
    and a clear reason.
  criteria:
  - id: broad-worth-experiences
    instruction: Uses verdt å for the excellent distant restaurant and the scenic
      slow route, with a reason showing quality or experience.
  - id: practical-benefit-actions
    instruction: Uses lønner seg for the discounted advance tickets and the travel
      card, with a reason showing a measurable advantage.
  derived_from:
  - section_id: guided-application
- handle: revise_dual_interpretations
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: 'Write two Norwegian sentences about the same action: getting up early.
    In the first sentence, the reason is that the roads are quieter and traffic is
    easier; use the practical-payoff expression. In the second sentence, the reason
    is that the sunrise over the fjord is beautiful; use the general-worth expression.
    Keep the action constant and include the reason in each sentence.'
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check both sentences for the same action, the requested reason, and
    the matching target expression. Report evidence for each criterion and accept
    natural Bokmål variants.
  criteria:
  - id: constant-action
    instruction: Keeps getting up early as the same action in both sentences.
  - id: reason-matched-expressions
    instruction: Uses lønner seg for the practical traffic reason and verdt å for
      the broad sunrise experience.
  derived_from:
  - section_id: guided-application
- handle: retrieval_and_review
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: 'Without looking back, write in Norwegian. Write one sentence recommending
    an experience with verdt å and a short general-worth reason. Write one sentence
    recommending a practical action with lønner seg and a short concrete-benefit reason.
    Finally, write one question about the same action in two versions: use verdt å
    with a broad reason and lønner seg with a practical reason. Add a short reason
    to each sentence.'
  response_language: 'no'
  min_words: 35
  max_words: 80
  judge_prompt: Check all recommendations and both versions of the question against
    the task. Report evidence for each criterion and accept natural Bokmål variants
    that keep the intended distinction clear.
  criteria:
  - id: experience-recommendation
    instruction: The experience recommendation uses verdt å and gives a short general-worth
      reason.
  - id: practical-recommendation
    instruction: The practical-action recommendation uses lønner seg and gives a short
      concrete-benefit reason.
  - id: dual-question-forms
    instruction: The same action appears in both question versions, with verdt å for
      the broad reason and lønner seg for the practical reason.
  - id: clear-reasons
    instruction: Each sentence includes a short reason that makes its intended framing
      clear.
  derived_from:
  - section_id: retrieval-and-review
