  objective: obj-word-order-main-clauses-01
  bloom: apply
  prompt_md: 'Complete both Norwegian statements with the supplied sentence adverb.
    Keep the neutral order in each frame: subject + verb + adverb, or fronted phrase
    + verb + subject + adverb.'
  explanation_md: "In a neutral main clause, the sentence adverb comes after the finite verb."
  derived_from:
  - section_id: placing-common-sentence-adverbs
  audio_target: "Hun kommer ikke i dag. På lørdager sitter de vanligvis ved vinduet."
