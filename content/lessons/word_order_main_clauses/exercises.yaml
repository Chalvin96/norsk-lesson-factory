- handle: transfer_word_order_to_library_plans
  op: write
  objective: obj-word-order-main-clauses-01
  bloom: apply
  prompt_md: Write four short Norwegian main clauses about Maja and a classmate arranging
    a weekday meeting at the library. Include one subject-first statement, one statement
    beginning with a time or place phrase, one yes/no question, and one wh-question.
    Include one of the common sentence adverbs ikke, alltid, ofte, or vanligvis naturally.
    Keep all clauses in the simple present tense and use original library/weekday
    wording throughout.
  derived_from:
  - section_id: cumulative-transfer-weekday-appointment
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept natural Bokmål wording, lexical choices, and punctuation variants
    when they preserve the requested library/weekday meanings and clause types. Do
    not require any sentence from the lesson verbatim.
  criteria:
  - id: four-clause-sequence
    instruction: 'Produces four simple present-tense Norwegian main clauses about
      a weekday meeting at the library: one subject-first statement, one statement
      beginning with a time or place phrase, one neutral yes/no question, and one
      wh-question.'
  - id: clause-specific-order
    instruction: 'Uses the required order in each clause: subject + verb; fronted
      phrase + verb + subject; verb + subject; and question word or phrase + verb
      + subject.'
  - id: adverb-and-transfer
    instruction: Uses one of ikke, alltid, ofte, or vanligvis naturally and keeps
      content in the new weekday-library situation without copying a complete café
      sentence.
- handle: retrieve_main_clause_frames
  op: write
  objective: obj-word-order-main-clauses-01
  bloom: apply
  prompt_md: 'Without looking back, write four short Norwegian examples, one for each
    of these frames: subject-first statement, fronted time/place statement, yes/no
    question, and wh-question. Use a familiar present-tense verb in each example.
    If you include a sentence adverb, place it naturally.'
  derived_from:
  - section_id: final-retrieval-request
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: Check evidence for every criterion. Accept natural Bokmål examples
    and different familiar present-tense verbs when each frame and intended meaning
    are clear. Treat sentence adverbs as optional; when present, require natural placement.
  criteria:
  - id: four-word-order-frames
    instruction: 'Provides one short Norwegian example for each frame: subject-first
      statement, fronted time/place statement, yes/no question, and wh-question.'
  - id: frame-specific-verb-order
    instruction: 'Places the present-tense verb correctly: after the subject in a
      subject-first statement; after the fronted phrase and before the subject in
      a fronted statement; first in a yes/no question; and after the question word
      or phrase and before the subject in a wh-question.'
  - id: natural-adverb-placement
    instruction: 'Places any included sentence adverb naturally: after the present-tense
      verb in subject-first statements, and after the subject in fronted statements
      or questions.'
