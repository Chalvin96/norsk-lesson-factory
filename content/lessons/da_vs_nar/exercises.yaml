- handle: notice_specific_past_da
  op: choose
  objective: obj-da-vs-nar-01
  bloom: understand
  prompt_md: Choose the interpretation that explains why the time word fits the single
    completed past event.
  derived_from:
  - section_id: one-specific-past-occasion-da
  stem_md: 'Read: Da jeg kom hjem på fredag, lå det en melding på telefonen. Choose
    the complete meaning of the time clause and connector.'
  options:
  - id: repeated-past
    text: The clause describes a repeated routine every time I came home; the connector
      should be når, not da.
    correct: false
    why: The sentence identifies one Friday arrival, not a recurring routine.
  - id: specific-past
    text: The clause Da jeg kom hjem på fredag describes one particular completed
      arrival on Friday; da is appropriate. (When I came home on Friday, there was
      a message on my phone.)
    correct: true
    why: The Friday arrival is one identified, completed past occasion, so da fits.
  - id: future-time
    text: The clause describes a future arrival; the connector should be når, not
      da.
    correct: false
    why: The sentence describes a completed past arrival, not a future event.
- handle: distinguish_single_and_repeated_past
  op: categorize
  objective: obj-da-vs-nar-01
  bloom: analyze
  prompt_md: Classify each sentence by its past-time meaning. Use one bucket per sentence;
    the bucket labels include the connector that matches the meaning.
  explanation_md: "Use da for one specific past occasion and når for events that happened repeatedly."
  derived_from:
  - section_id: repeated-time-nar
  buckets:
  - bucket_id: single-past
    label: One specific completed past occasion
  - bucket_id: repeated-past
    label: Repeated past pattern
  items:
  - item_id: sunday-visit
    text: Da jeg besøkte bestemor på søndag, bakte hun vafler. (When I visited Grandma
      on Sunday, she made waffles.)
    bucket_id: single-past
  - item_id: regular-visit
    text: Når jeg besøkte bestemor, bakte hun alltid vafler. (When I visited Grandma,
      she always made waffles.)
    bucket_id: repeated-past
  - item_id: train-yesterday
    text: Da toget kom i går, sto Anna på perrongen. (When the train arrived yesterday,
      Anna was standing on the platform.)
    bucket_id: single-past
  - item_id: train-mornings
    text: Når toget kom om morgenen, sto Anna vanligvis på perrongen. (When the train
      arrived in the morning, Anna was usually standing on the platform.)
    bucket_id: repeated-past
