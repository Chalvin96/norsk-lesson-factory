- handle: short_contextual_completion
  op: write
  objective: obj-sentence-adverbs-01
  bloom: apply
  prompt_md: Write four short, natural Norwegian messages about Nora, Jonas, and Emil
    planning dinner. Use full clauses, not isolated fragments, and use each of ikke,
    aldri, vanligvis, and kanskje exactly once. Message 1 must be an ordinary subject-first
    main clause saying that Emil may arrive after work, with kanskje. Message 2 must
    be a complete sentence containing a fordi subordinate clause saying that Emil
    is not coming, with ikke in that subordinate clause. Message 3 must be an ordinary
    subject-first main clause saying that Nora never eats after nine, with aldri.
    Message 4 must be a complete sentence containing an om subordinate clause asking
    whether Jonas usually wants to eat at the restaurant, with vanligvis in that subordinate
    clause. Keep the intended practical meanings.
  derived_from:
  - section_id: cumulative-transfer-planning-a-weekday-dinner
  response_language: 'no'
  min_words: 20
  max_words: 60
  judge_prompt: Check the four requested messages and report evidence for every criterion.
    Mark a criterion unmet when the required meaning, clause type, or adverb placement
    is not observable.
  criteria:
  - id: four-messages
    instruction: Provides four complete natural Norwegian messages matching the four
      requested dinner meanings, not isolated fragments.
  - id: target-adverbs
    instruction: Uses ikke, aldri, vanligvis, and kanskje exactly once each.
  - id: main-placement
    instruction: Places the adverb after the finite verb in the ordinary subject-first
      main clauses in messages 1 and 3.
  - id: subordinate-placement
    instruction: Places the adverb before the finite verb in the fordi subordinate
      clause in message 2 and the om subordinate clause in message 4.
- handle: final_retrieval
  op: write
  objective: obj-sentence-adverbs-01
  bloom: apply
  prompt_md: Write exactly four short Norwegian sentences about
    a changed plan, using your own details. Sentence
    1 must be an ordinary subject-first main clause with a target sentence adverb.
    Sentence 2 must be a complete sentence with a target sentence adverb inside an
    unfronted subordinate clause introduced by at, fordi, hvis, or om. Sentence 3
    must be a compound sentence with a target sentence adverb in each coordinated
    main clause. Sentence 4 must begin with a fronted subordinate clause containing
    one target sentence adverb and must have another target sentence adverb in the
    following main clause. Use at least three of ikke, aldri, vanligvis, and kanskje.
    In sentence 4, use an unstressed pronoun subject in the following main clause.
  derived_from:
  - section_id: final-retrieval-request
  response_language: 'no'
  min_words: 20
  max_words: 70
  judge_prompt: Check exactly four sentences against the task and report evidence
    for every criterion. Mark a criterion unmet when the required clause structure
    or sentence-adverb placement is missing or ambiguous.
  criteria:
  - id: ordinary-main
    instruction: Sentence 1 is an ordinary subject-first main clause with the target
      adverb after the finite verb.
  - id: unfronted-subordinate
    instruction: Sentence 2 contains an unfronted subordinate clause introduced by
      an approved connector with the target adverb before its finite verb.
  - id: compound-main-clauses
    instruction: Sentence 3 has two coordinated main clauses and places a target adverb
      after the finite verb in each clause.
  - id: fronted-subordinate-and-main
    instruction: Sentence 4 has a fronted subordinate clause with its adverb before
      the finite verb and a following main clause with the sequence finite verb, unstressed
      pronoun subject, and adverb.
  - id: retrieval-variety
    instruction: Uses at least three distinct target adverbs and gives original changed-plan
      content rather than copying a lesson example.
