- handle: identify_present_meaning
  op: choose
  objective: obj-present-tense-01
  bloom: understand
  prompt_md: Read both Norwegian statements. Choose the interpretation that classifies
    each whole sentence as happening now or happening regularly.
  stem_md: 'Item 1: Mina jobber hjemme i dag. 2. Jonas vasker kjøkkenet hver lørdag.
    Which classification is correct?'
  options:
  - id: now-regular
    text: 1. noe som skjer nå (happening now); 2. noe som skjer regelmessig (happens
      regularly).
    correct: true
    why: The time expressions show that the first statement describes now and the
      second describes a regular habit.
  - id: regular-now
    text: 1. noe som skjer regelmessig (happens regularly); 2. noe som skjer nå (happening
      now).
    correct: false
    why: 'The classifications are reversed: i dag signals now, while hver lørdag signals
      a regular habit.'
  derived_from:
  - section_id: present-tense-two-common-meanings
- handle: build_regular_present_forms
  op: recall_fill
  objective: obj-present-tense-01
  bloom: apply
  prompt_md: Complete each short statement with the present-tense form of the shown
    infinitive.
  explanation_md: 'For these regular verbs, add -r to the infinitive: jobbe becomes
    jobber, and bo becomes bor. The forms without -r are infinitives, not the
    present-tense forms required here.'
  audio_target: "Jeg jobber hjemme. Jonas lager kaffe. Vi spiller musikk hver kveld. De vasker kjøkkenet nå. Mina bor i Bergen."
  segments:
  - text_md: 'For å jobbe: Jeg '
  - blank_id: jobbe-present
    options:
    - jobber
    - jobbe
    answer_index: 0
  - text_md: ' hjemme. For å lage: Jonas '
  - blank_id: lage-present
    options:
    - lager
    - lage
    answer_index: 0
  - text_md: ' kaffe. For å spille: Vi '
  - blank_id: spille-present
    options:
    - spiller
    - spille
    answer_index: 0
  - text_md: ' musikk hver kveld. For å vaske: De '
  - blank_id: vaske-present
    options:
    - vasker
    - vaske
    answer_index: 0
  - text_md: ' kjøkkenet nå. For å bo: Mina '
  - blank_id: bo-present
    options:
    - bor
    - bo
    answer_index: 0
  - text_md: ' i Bergen.'
  derived_from:
  - section_id: forming-present-tense-regular-verbs
- handle: keep_verb_unchanged
  op: build
  objective: obj-present-tense-01
  bloom: apply
  prompt_md: Start with Mina jobber hjemme. Rebuild it with Vi as the subject. Change
    only the subject and keep the present-tense verb unchanged.
  explanation_md: 'Changing Mina to Vi changes who works, but not the verb: both Mina
    jobber and Vi jobber use jobber. Norwegian present-tense verbs do not change with
    the subject.'
  tokens:
  - token_id: subject-vi
    text: Vi
  - token_id: verb-jobber
    text: jobber
  - token_id: place-hjemme
    text: hjemme.
  answer_order:
  - subject-vi
  - verb-jobber
  - place-hjemme
  derived_from:
  - section_id: verb-does-not-change-with-subject
- handle: select_er_har_gjor
