  - blank_id: location-er
    options:
    - er
    - har
    - gjør
    answer_index: 0
  - text_md: ' hjemme. Mina '
  - blank_id: possession-har
    options:
    - er
    - har
    - gjør
    answer_index: 1
  - text_md: ' kaffe. Jonas '
  - blank_id: task-gjor
    options:
    - er
    - har
    - gjør
    answer_index: 2
  - text_md: ' mye hjemme.'
  derived_from:
  - section_id: three-essential-present-tense-forms
- handle: avoid_english_progressive_pattern
  op: find_fix
  objective: obj-present-tense-01
  bloom: analyze
  prompt_md: Select the one token that is wrong/needs changing.
  tokens:
  - token_id: subject-jeg
    text: Jeg
  - token_id: extra-er
    text: er
  - token_id: verb-jobber
    text: jobber
  - token_id: place-hjemme
    text: hjemme.
  error_token_id: extra-er
  feedback: Remove er. The repaired sentence is Jeg jobber hjemme. Norwegian uses
    the single present-tense verb jobber for this current action.
  derived_from:
  - section_id: norwegian-present-tense-and-english-ing
