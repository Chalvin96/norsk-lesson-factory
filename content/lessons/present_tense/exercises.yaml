- handle: describe_sara_and_emil
  op: write
  objective: obj-present-tense-01
  bloom: apply
  prompt_md: Write six short Bokmål statements about Sara and Emil. State that Sara
    is at home today, usually works in a café on Saturdays, and does some work on
    her computer; state that Emil is in the kitchen, has time, and is making lunch.
    Use natural present-tense forms, including regular verbs and er, har, and gjør.
    Add suitable time expressions so current actions and habits are clear. Keep the
    response focused on these present-tense forms.
  response_language: 'no'
  min_words: 25
  max_words: 50
  judge_prompt: Check all six statements against the task and report evidence for
    each criterion. Accept natural Bokmål variants that preserve the requested facts
    and present-tense forms, including natural placement of time expressions. Do not
    accept an unnecessary er before an action verb.
  criteria:
  - id: sara-current-location
    instruction: States in natural Norwegian that Sara is at home today, using **er**
      and a present-time expression.
  - id: sara-cafe-habit
    instruction: States that Sara usually works in a café on Saturdays, using a regular
      present-tense form and a habitual time expression.
  - id: emil-state-possession
    instruction: States that Emil is in the kitchen and has time, using **er** and
      **har**.
  - id: current-work-actions
    instruction: States that Emil is making lunch and Sara is doing some work on her
      computer, using natural present-tense forms including **lager** and **gjør**.
  - id: target-scope
    instruction: Uses the requested simple present-tense forms without introducing
      another grammatical target.
  derived_from:
  - section_id: transfer-to-new-everyday-situation
- handle: retrieve_the_present_tense
  op: write
  objective: obj-present-tense-01
  bloom: apply
  prompt_md: 'Write five separate short Bokmål statements, one for each prompt: Sara
    is working at home today; Emil works at a café every Saturday; Sara is at home;
    Emil has a meeting; Sara cleans every Saturday. Retrieve the appropriate present-
    tense forms for the two actions, the location, the possession, and the cleaning
    activity. Use time expressions and never put er before an action verb.'
  response_language: 'no'
  min_words: 20
  max_words: 40
  judge_prompt: Check the five statements against the task and report evidence for
    each criterion. Accept natural Bokmål variants that preserve the requested facts,
    time meanings, and target forms. Do not accept er jobber or another form that
    adds an unnecessary progressive pattern.
  criteria:
  - id: current-action
    instruction: States that Sara works at home today with **jobber** and a current-time
      expression, without **er** before the action verb.
  - id: habitual-action
    instruction: States that Emil works at a café every Saturday with the unchanged
      form **jobber** used for the other subject.
  - id: state-er
    instruction: States Sara’s location with **er**.
  - id: possession-har
    instruction: States that Emil has a meeting with **har**.
  - id: task-gjor
    instruction: States that Sara cleans every Saturday with **gjør rent** and a habitual
      time expression.
  derived_from:
  - section_id: short-retrieval-review
