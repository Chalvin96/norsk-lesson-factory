- handle: final_guided_exchange
  op: write
  objective: obj-make-weather-small-talk-01
  bloom: apply
  prompt_md: Write a short Norwegian exchange between Nora and Amir outside a grocery
    shop on a hot afternoon. One person should open with a weather observation. The
    other should acknowledge or gently contrast it and ask one related follow-up.
    End by either closing politely or adding one sentence that clearly continues the
    exchange.
  response_language: 'no'
  judge_prompt: Check the Norwegian exchange against the task and report evidence
    for each criterion. Accept natural Bokmål variants that preserve the requested
    meaning and conversational sequence.
  criteria:
  - id: brief-exchange
    instruction: Keeps the exchange brief.
  - id: connected-turns
    instruction: Uses connected turns.
  - id: clear-direction
    instruction: Makes the conversation direction clear from opening to close or continuation.
  derived_from:
  - section_id: final-guided-practice
- handle: retrieval_review_weather_exchange
  op: write
  objective: obj-make-weather-small-talk-01
  bloom: apply
  prompt_md: 'Write exactly four connected Norwegian lines about one weather situation:
    one weather opening, one natural acknowledgement or contrast, one follow-up question,
    and one closing sentence.'
  response_language: 'no'
  judge_prompt: Check the four Norwegian lines against the task and report evidence
    for each criterion. Accept natural Bokmål variants that preserve the requested
    meaning and sequence.
  criteria:
  - id: weather-opening
    instruction: Includes a weather opening.
  - id: acknowledgement-or-contrast
    instruction: Includes a natural acknowledgement or contrast.
  - id: follow-up-question
    instruction: Includes a follow-up question.
  - id: closing-sentence
    instruction: Includes a closing sentence.
  - id: same-weather-situation
    instruction: Keeps all four lines connected to the same weather situation.
  derived_from:
  - section_id: retrieval-and-review
