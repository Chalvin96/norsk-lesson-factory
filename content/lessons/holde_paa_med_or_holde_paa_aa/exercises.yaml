- handle: identify_named_activity
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: 'Write three Norwegian sentences about the busy afternoon: - the student
    is occupied with a school assignment; - the cook is occupied with dinner; - the
    cyclist is occupied with repairs to a bicycle. Use holde på med in every sentence.
    Put a Norwegian noun or named task directly after med, and keep each sentence
    broad rather than naming an exact action.'
  derived_from:
  - section_id: naming-an-activity
  response_language: 'no'
  judge_prompt: Check that the response contains one sentence for each role. Require
    holder på med with med directly before a noun or nominal activity in all three
    sentences. Accept natural Bokmål variants, including leksene, middagen, and sykkelen,
    when they preserve the school-assignment, dinner, and bicycle-repair activities.
    Report evidence for each criterion.
  criteria:
  - id: named-activity-form
    instruction: Each sentence places med directly before a Norwegian noun or named
      task.
  - id: named-activity-coverage
    instruction: The three sentences describe the student's school assignment, the
      cook's dinner, and the cyclist's bicycle repairs as broad occupied activities.
- handle: make_action_more_precise
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: 'Write three Norwegian sentences, one for each person in this scene:
    - the student is answering the final question; - the cook is washing vegetables;
    - the cyclist is tightening a screw. Use holde på å followed by the appropriate
    infinitive in every sentence. Replace the broad named activity with the specific
    action; do not use med before these infinitives.'
  derived_from:
  - section_id: showing-an-unfolding-action
  response_language: 'no'
  judge_prompt: Check for three sentences matching the student, cook, and cyclist.
    Require the infinitives svare, vaske, and stramme, with the requested meanings
    and natural complements. Require holder på å, not holder på med, before each infinitive.
    Accept natural subject wording and normal Bokmål inflection. Report evidence for
    each criterion.
  criteria:
  - id: specific-action-coverage
    instruction: 'The response replaces each broad activity with the requested specific
      action: answering the final question, washing vegetables, and tightening a screw.'
  - id: infinitive-action-form
    instruction: Each sentence uses å before the infinitive and does not use med before
      that infinitive.
- handle: move_between_broad_and_specific_descriptions
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: 'Write six Norwegian sentences for one community hall before a party.
    First write three broad descriptions of people occupied with the decorations,
    food, and music. Use holde på med before a noun or nominal activity. Then write
    three more precise descriptions: someone is hanging balloons, someone is baking
    a cake, and someone is testing the speakers. Use holde på å before an infinitive
    for these actions. Keep all six descriptions in one natural scene.'
  derived_from:
  - section_id: one-situation-two-viewpoints
  response_language: 'no'
  judge_prompt: Check that three broad descriptions use holder på med plus a noun
    or nominal activity, and that three specific descriptions use holder på å plus
    an infinitive. Require the decorations, food, music, hanging balloons, baking
    a cake, and testing speakers to be represented. Accept natural Bokmål variants
    when all descriptions fit the same community-hall-before-party scene. Report evidence
    for each criterion.
  criteria:
  - id: broad-specific-viewpoint
    instruction: The response keeps med plus a named activity for all broad descriptions
      and å plus an infinitive for all specific actions.
  - id: shared-community-scene
    instruction: The six descriptions could naturally belong to the same community-hall-before-party
      scene.
- handle: ask_then_narrow_the_focus
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: Write a connected three-line Norwegian exchange between two colleagues
    preparing for a meeting. Begin exactly with Hva holder du på med?. In the second
    line, answer with a broad meeting task using holde på med before a noun or nominal
    activity. In the third line, ask a follow-up that proposes a specific unfolding
    action using holde på å before an infinitive. Make the third line naturally narrow
    the focus from the broad task in the second line.
  derived_from:
  - section_id: questions-in-conversation
  response_language: 'no'
  judge_prompt: Require the exact opening question Hva holder du på med?. Check that
    the answer names a broad meeting-related task with med before a noun or nominal
    activity, and that the follow-up proposes a specific action with å before an infinitive.
    Accept natural meeting-related variants, including en presentasjon til møtet and
    sjekke utstyret, when the three lines form a connected broad-to-specific exchange.
    Report evidence for each criterion.
  criteria:
  - id: connected-two-pattern-dialogue
    instruction: 'The exchange uses both patterns in connected lines: the exact broad
      question, a med answer naming a task, and an å follow-up proposing an action.'
  - id: broad-to-specific-focus
    instruction: The exchange moves naturally from a broad activity to a specific
      unfolding action in the same meeting context.
- handle: repair_the_structure
  op: find_fix
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: analyze
  prompt_md: 'Select the single token whose form does not fit the phrase and intended meaning.'
  tokens:
  - token_id: tok-1
    text: Jeg
  - token_id: tok-2
    text: holder
  - token_id: tok-3
    text: på
  - token_id: tok-4
    text: med
  - token_id: tok-5
    text: lage
  - token_id: tok-6
    text: middag.
  error_token_id: tok-4
  feedback: Replace med with å before infinitive lage; the intended meaning remains
    I am making dinner. A noun-focused repair is Jeg holder på med middagen.
  derived_from:
  - section_id: common-mistakes
- handle: final_practice_new_situation
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: 'Write in Norwegian about a family preparing to leave for a weekend trip.
    - Write one broad sentence about each person: one is occupied with the luggage,
    one with breakfast, and one with the car. Use holde på med before the noun or
    named task. - Write one more precise sentence for each person: the first is packing
    clothes, the second is making sandwiches, and the third is checking the tires.
    Use holde på å before the appropriate infinitive. - Turn one broad-and-specific
    pair into a brief three-line dialogue. Start with Hva holder du på med?, give
    a broad answer with med, and ask a follow-up about the specific action with å
    plus an infinitive. Keep each broad task and its specific action in the same situation.'
  derived_from:
  - section_id: final-practice-in-a-new-situation
  response_language: 'no'
  judge_prompt: Check that the response represents all three broad tasks with holder
    på med before nouns or nominal activities, and all three specific actions with
    holder på å before infinitives. Require the luggage, breakfast, car, packing clothes,
    making sandwiches, and checking tires to be matched correctly. Check that the
    dialogue contains the broad question, broad answer, and specific-action follow-up,
    with a clear shift of focus. Accept natural Bokmål variants that preserve these
    meanings. Report evidence for each criterion.
  criteria:
  - id: weekend-pattern-consistency
    instruction: The three broad tasks use holde på med, and the three corresponding
      specific actions use holde på å plus an infinitive.
  - id: weekend-dialogue-shift
    instruction: The brief dialogue moves clearly from a broad activity to a specific
      action and includes the required broad question, answer, and follow-up question.
- handle: retrieval_and_review
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: 'Without looking back, write the Norwegian response you would say aloud.
    First state in Norwegian the distinction between the two target frames. Then write
    one present-tense sentence about Jonas working on a named activity with the broad
    frame, and one present-tense sentence about Jonas doing an unfolding action with
    the specific frame. Use a taught but
    non-copied lexical frame, such as a report about public transport for the activity
    and checking equipment for the action. Do not copy a complete lesson sentence.'
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: 'Check three pieces of evidence: a Norwegian rule stating that med
    precedes a named activity or noun and å precedes an infinitive action; one present-tense
    Jonas sentence with holder på med directly before a noun or nominal activity;
    and one present-tense Jonas sentence with holder på å before an infinitive. Accept
    natural Bokmål variants, including en rapport om kollektivtransport and utstyret,
    but require a lexical pairing that is not copied verbatim from a lesson sentence.
    Report evidence for each criterion.'
  criteria:
  - id: rule-retrieval
    instruction: The response states in Norwegian that holde på med precedes a named
      activity or noun and holde på å precedes an infinitive action.
  - id: jonas-named-activity
    instruction: The response includes one present-tense sentence about Jonas using
      holder på med before a named activity or noun.
  - id: jonas-unfolding-action
    instruction: The response includes one present-tense sentence about Jonas using
      holder på å before an infinitive action.
