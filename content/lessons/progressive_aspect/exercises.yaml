- handle: report_current_preparations
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: 'Write a short Norwegian description of a new birthday-visit scene. Describe
    several people preparing a meal now: someone is decorating the room, someone is
    cooking, someone is waiting by the door, and someone is resting briefly on a sofa.
    Use holder på å + infinitive when posture is irrelevant, and use a present posture
    frame such as sitter og, står og, or ligger og when posture is meaningful. Use
    birthday-visit wording.'
  derived_from:
  - section_id: cumulative-transfer-preparing-birthday-visit
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the Norwegian response against the task and report evidence
    for each criterion. Accept natural Bokmål variants when they preserve the requested
    meanings and frame forms; do not require exact wording.
  criteria:
  - id: scene-coverage
    instruction: Describes decorating, cooking, waiting by the door, and resting on
      a sofa in natural Norwegian.
  - id: present-activity-frames
    instruction: Uses present-time activity frames to show actions happening now.
  - id: neutral-frame
    instruction: Uses at least one present holder på å + infinitive frame when posture
      is irrelevant.
  - id: posture-frame
    instruction: Uses at least one present posture frame with sitter og, står og,
      or ligger og when posture is meaningful.
  - id: transfer-wording
    instruction: Uses wording appropriate to the birthday-visit situation.
- handle: reconstruct_arrival_moment
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: Write a connected Norwegian account of the moment an unexpected birthday
    guest arrived while preparations were underway. Describe what different people
    were doing at that past moment. Use at least one holdt på å + infinitive frame
    and at least one past posture frame, such as satt og skrev or sto og ventet; keep
    both verbs in the past in every posture frame. Use birthday-visit wording.
  derived_from:
  - section_id: cumulative-transfer-preparing-birthday-visit
  response_language: 'no'
  min_words: 30
  max_words: 70
  judge_prompt: Check the Norwegian response against the task and report evidence
    for each criterion. Accept natural Bokmål variants that satisfy the required past-time
    meanings and frame forms; do not require exact wording.
  criteria:
  - id: coherent-past-scene
    instruction: Describes a connected scene around the birthday guest's arrival in
      natural Norwegian.
  - id: past-holde-frame
    instruction: Uses at least one holdt på å + infinitive frame for an activity in
      progress at the past moment.
  - id: past-posture-frame
    instruction: Uses at least one posture frame with a past posture verb and a past
      activity verb.
  - id: tense-consistency
    instruction: Keeps each activity frame internally consistent with the shared past
      reference point.
  - id: transfer-wording
    instruction: Uses wording appropriate to the birthday-visit situation.
- handle: retrieval_and_review
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: Write a short Norwegian review. First explain the difference between holder
    på å lage and står og lager. Then change both frames
    to describe a past moment. Finish with one sentence using a taught present-time
    activity frame about something happening around you now and one sentence using
    a taught past-time activity frame about what you were doing at a specific time
    yesterday.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 45
  max_words: 90
  judge_prompt: Check the Norwegian response against the task and report evidence
    for each criterion. Accept natural Bokmål variants when they preserve the requested
    meanings and grammar; do not require exact wording.
  criteria:
  - id: frame-difference
    instruction: Explains that holder på å lage highlights ongoing activity without
      stating posture, while står og lager presents standing posture and uses og with
      a tense-marked activity verb.
  - id: past-forms
    instruction: Changes holder på å lage to holdt på å lage and står og lager to
      sto og lagde.
  - id: present-example
    instruction: Writes one sentence about something happening now using a taught
      present-time activity frame.
  - id: past-example
    instruction: Writes one sentence about what the learner was doing at a specific
      time yesterday using a taught past-time activity frame.
