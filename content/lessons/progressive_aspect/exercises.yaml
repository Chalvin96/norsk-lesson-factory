- handle: notice_ongoing_focus
  op: choose
  objective: obj-progressive-aspect-01
  bloom: understand
  prompt_md: Read the comparison in the stem and choose the interpretation that matches
    the contrast between neutral tense reporting and explicit ongoing focus.
  derived_from:
  - section_id: main-meaning-choice
  stem_md: At a past moment, Jonas compares «Jeg lagde kaffe.» with «Jeg holdt på
    å lage kaffe.». Which interpretation matches the stated contrast?
  options:
  - id: reversed-contrast
    text: '«Jeg lagde kaffe.» — I was in the middle of making coffee. «Jeg holdt på
      å lage kaffe.» — I made coffee: a neutral report.'
    correct: false
    why: This reverses the meanings of the simple past and the activity frame.
  - id: no-focus-contrast
    text: «Jeg lagde kaffe.» and «Jeg holdt på å lage kaffe.» both report the action
      neutrally; the frame adds no extra ongoing focus.
    correct: false
    why: The frame explicitly highlights the activity as ongoing.
  - id: neutral-versus-focus
    text: '«Jeg lagde kaffe.» — I made coffee: a neutral report. «Jeg holdt på å lage
      kaffe.» — I was in the middle of making coffee: explicit ongoing focus.'
    correct: true
    why: The simple past reports the action, while holdt på å highlights the activity
      as ongoing around the past moment.
- handle: build_holde_pa_a_frame
  op: recall_fill
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: Complete both Norwegian recasts. Select the form of holde that matches
    each time expression, and keep the activity verb in the infinitive after å.
  derived_from:
  - section_id: using-holde-pa-a
  audio_target: "Nå holder Sara på å lage kaffe. I går holdt Amir på å lage kaffe."
  segments:
  - text_md: 'Nå '
  - blank_id: present-holde
    options:
    - holder
    - holdt
    answer_index: 0
  - text_md: ' Sara på å '
  - blank_id: present-activity
    options:
    - lage
    - lagde
    answer_index: 0
  - text_md: ' kaffe. I går '
  - blank_id: past-holde
    options:
    - holder
    - holdt
    answer_index: 1
  - text_md: ' Amir på å '
  - blank_id: past-activity
    options:
    - lage
    - lagde
    answer_index: 0
  - text_md: ' kaffe.'
- handle: choose_meaningful_activity_frame
  op: choose
  objective: obj-progressive-aspect-01
  bloom: analyze
  prompt_md: Choose the pair that best matches both physical situations. Treat stated
    posture as meaningful, and use a neutral frame when posture is unknown.
  derived_from:
  - section_id: showing-posture-as-well-as-activity
  stem_md: 'Scene 1: a person is standing at a bus stop and waiting. Scene 2: Amir
    is making coffee, but his posture is unknown. Which pair matches both scenes?'
  options:
  - id: neutral-and-unsupported-posture
    text: 1. Hun holder på å vente på bussen. — She is waiting for the bus. 2. Amir
      sitter og lager kaffe. — Amir is sitting and making coffee.
    correct: false
    why: The first sentence omits the stated posture, and the second adds a posture
      that the scene does not provide.
  - id: wrong-posture-and-neutral
    text: 1. Hun sitter og venter på bussen. — She is sitting and waiting for the
      bus. 2. Amir holder på å lage kaffe. — Amir is making coffee.
    correct: false
    why: The first sentence gives the wrong posture for the person at the bus stop.
  - id: posture-and-unsupported-posture
    text: 1. Hun står og venter på bussen. — She is standing and waiting for the bus.
      2. Amir står og lager kaffe. — Amir is standing and making coffee.
    correct: false
    why: The second sentence unnecessarily claims that Amir is standing.
  - id: posture-and-neutral
    text: 1. Hun står og venter på bussen. — She is standing and waiting for the bus.
      2. Amir holder på å lage kaffe. — Amir is making coffee.
    correct: true
    why: The first frame shows visible standing posture; the second highlights the
      activity without claiming a posture.
