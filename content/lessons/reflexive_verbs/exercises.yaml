- handle: notice_reflexive_reference
  op: choose
  objective: obj-reflexive-verbs-01
  bloom: understand
  derived_from:
  - section_id: checkpoint-notice-reflexive-reference
  prompt_md: Read the Norwegian sentences. Choose the interpretation that marks only
    the sentences where the person acts on themselves and therefore needs a reflexive
    pronoun.
  stem_md: 'Item 1: Jeg vasker meg før skolen. 2. Jeg vasker bilen før skolen. 3.
    Nora kler på seg før turen. 4. Nora kler på barnet før turen.'
  options:
  - id: sentences-1-and-4
    text: Bare setning 1 og 4 trenger et refleksivt pronomen.
    correct: false
    why: Sentence 4 has barnet as an ordinary object, not a reflexive object.
  - id: all-sentences
    text: Alle fire setningene trenger et refleksivt pronomen.
    correct: false
    why: Sentences 2 and 4 affect an ordinary object or another person.
  - id: sentences-1-and-3
    text: Bare setning 1 og 3 trenger et refleksivt pronomen.
    correct: true
    why: In sentences 1 and 3, the subject and object refer to the same participant;
      sentences 2 and 4 have ordinary objects.
  - id: sentences-2-and-4
    text: Bare setning 2 og 4 trenger et refleksivt pronomen.
    correct: false
    why: Sentences 2 and 4 use ordinary objects rather than actions directed back
      at the subject.
