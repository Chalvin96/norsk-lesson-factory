- handle: recall_reflexive_forms
  op: write
  objective: obj-reflexive-verbs-01
  bloom: apply
  derived_from:
  - section_id: short-retrieval-and-review
  prompt_md: 'Write the matching reflexive pronoun after each
    subject: jeg, du, hun, vi, dere, and de. Then write one short Norwegian sentence
    about getting ready with «gjøre seg klar» or «kle på seg», and one short Norwegian
    sentence about looking forward to an everyday event with «glede seg til». Inflect
    each reflexive pronoun to match its subject.'
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants with correct subject–pronoun agreement. For the
    two sentences, accept natural wording that uses the required complete reflexive
    expressions.
  criteria:
  - id: subject-pronoun-pattern
    instruction: 'Gives the correct reflexive pronouns for all six subjects: jeg–meg,
      du–deg, hun–seg, vi–oss, dere–dere, and de–seg.'
  - id: getting-ready-sentence
    instruction: Writes one short Norwegian sentence about getting ready using a complete
      taught reflexive expression, such as gjøre seg klar or kle på seg.
  - id: looking-forward-sentence
    instruction: Writes one short Norwegian sentence about looking forward to an everyday
      event using the complete expression glede seg til.
