- handle: choose_reflexive_or_ordinary_object
  op: choose
  objective: obj-reflexive-verbs-01
  bloom: understand
  derived_from:
  - section_id: checkpoint-choose-reflexive-or-ordinary-object
  prompt_md: Choose the one complete set of Norwegian sentences that uses a reflexive
    pronoun when the subject receives the action and an ordinary object when someone
    or something else receives it.
  stem_md: 'Complete these six scenes: 1. I wash myself before departure. 2. I wash
    the car before departure. 3. Nora dresses herself before the concert. 4. Nora
    dresses the child before the concert. 5. We sit down on the bench. 6. We place
    the chairs by the table.'
  options:
  - id: reflexive-for-all
    text: 1. Jeg vasker meg før avreise. 2. Jeg vasker meg før avreise. 3. Nora kler
      på seg før konserten. 4. Nora kler på seg før konserten. 5. Vi setter oss på
      benken. 6. Vi setter oss ved bordet.
    correct: false
    why: The reflexive forms are incorrectly used for the car, the child, and the
      chairs.
  - id: correct-reference
    text: 1. Jeg vasker meg før avreise. 2. Jeg vasker bilen før avreise. 3. Nora
      kler på seg før konserten. 4. Nora kler på barnet før konserten. 5. Vi setter
      oss på benken. 6. Vi setter stolene ved bordet.
    correct: true
    why: The reflexive forms are used when the subject and object are the same; bilen,
      barnet, and stolene are ordinary objects.
  - id: ordinary-object-for-all
    text: 1. Jeg vasker bilen før avreise. 2. Jeg vasker bilen før avreise. 3. Nora
      kler på barnet før konserten. 4. Nora kler på barnet før konserten. 5. Vi setter
      stolene ved bordet. 6. Vi setter stolene ved bordet.
    correct: false
    why: The ordinary objects are incorrectly used where the subjects act on themselves.
  - id: mixed-reference
    text: 1. Jeg vasker meg før avreise. 2. Jeg vasker meg før avreise. 3. Nora kler
      på seg før konserten. 4. Nora kler på barnet før konserten. 5. Vi setter stolene
      på benken. 6. Vi setter oss ved bordet.
    correct: false
    why: Several sentences do not match the stated recipient of the action, including
      the washing and placing scenes.
