- handle: shop_distance_noticing
  op: choose
  objective: obj-demonstrative-pronouns-01
  bloom: understand
  derived_from:
  - section_id: at-the-second-hand-shop
  prompt_md: The shop has objects beside Maja and Jonas and objects farther away.
    Choose the interpretation that correctly identifies the close and far demonstratives.
    Focus on distance, not noun gender or number.
  stem_md: Which interpretation matches the shop scene?
  options:
  - id: reversed
    text: 'Beside the speakers: den lampa, det speilet, de stolene. Farther away:
      denne lampa, dette speilet, disse stolene.'
    correct: false
    why: The close and far sets are reversed.
  - id: close-far
    text: 'Beside the speakers: denne lampa, dette speilet, disse stolene. Farther
      away: den lampa, det speilet, de stolene.'
    correct: true
    why: The close set is denne/dette/disse; the far set is den/det/de.
  - id: mixed
    text: 'Beside the speakers: denne lampa, det speilet, disse stolene. Farther away:
      den lampa, dette speilet, de stolene.'
    correct: false
    why: The neuter forms are assigned to the wrong distance.
- handle: demonstrative_agreement_selection
  op: recall_fill
  objective: obj-demonstrative-pronouns-01
  bloom: apply
  explanation_md: "Use denne/den for common singular, dette/det for neuter singular, and disse/de for plural; the noun remains definite after the demonstrative."
  derived_from:
  - section_id: plural-disse-or-de
  prompt_md: Fill each blank with the demonstrative that matches the noun. Close or
    far is already stated; focus on noun gender or number.
  audio_target: "Denne lampa, dette speilet og disse stolene. Den lampa, det speilet og de stolene."
  segments:
  - text_md: 'Close objects: '
  - blank_id: close-common-singular
    options:
    - disse
    - denne
    - dette
    answer_index: 1
  - text_md: ' lampa, '
  - blank_id: close-neuter-singular
    options:
    - denne
    - disse
    - dette
    answer_index: 2
  - text_md: ' speilet, '
  - blank_id: close-plural
    options:
    - disse
    - denne
    - dette
    answer_index: 0
  - text_md: ' stolene. Far objects: '
  - blank_id: far-common-singular
    options:
    - de
    - den
    - det
    answer_index: 1
  - text_md: ' lampa, '
  - blank_id: far-neuter-singular
    options:
    - de
    - den
    - det
    answer_index: 2
  - text_md: ' speilet, '
  - blank_id: far-plural
    options:
    - de
    - det
    - den
    answer_index: 0
  - text_md: ' stolene.'
- handle: definite_form_repair
  op: find_fix
  objective: obj-demonstrative-pronouns-01
  bloom: analyze
  derived_from:
  - section_id: the-noun-must-be-definite
  prompt_md: Select the one token that is wrong/needs changing.
  tokens:
  - token_id: tok-1
    text: denne
  - token_id: tok-2
    text: stol
  error_token_id: tok-2
  feedback: 'The noun after a demonstrative must be definite: change «stol» to «stolen».'
- handle: complete_reference_building
  op: choose
  objective: obj-demonstrative-pronouns-01
  bloom: apply
  derived_from:
  - section_id: making-both-choices-together
  prompt_md: Choose the labels that correctly distinguish all three nearby items.
  stem_md: Maja points to one lamp, one table, and several chairs beside her. Which
    set uses the right demonstrative and noun form for every item?
  options:
  - id: correct-set
    text: denne lampa · dette bordet · disse stolene
    correct: true
    why: The nearby common singular, neuter singular, and plural forms are denne,
      dette, and disse, each followed by a definite noun.
  - id: indefinite-nouns
    text: denne lampe · dette bord · disse stoler
    correct: false
    why: A demonstrative requires the definite noun forms lampa, bordet, and stolene.
  - id: agreement-mismatch
    text: dette lampa · denne bordet · de stolene
    correct: false
    why: Dette is neuter, denne is common singular, and de points to farther-away
      plural items.
