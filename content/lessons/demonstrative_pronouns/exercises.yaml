- handle: counter_summary
  op: write
  objective: obj-demonstrative-pronouns-01
  bloom: apply
  derived_from:
  - section_id: back-at-the-counter
  prompt_md: 'Write one short Norwegian counter summary with four complete noun phrases:
    the selected lamp, selected mirror, selected chairs, and rejected chairs at the
    back. Use the taught demonstrative plus definite-noun pattern, and include bakerst
    with the rejected chairs.'
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept normal capitalization and punctuation, but require each listed
    demonstrative to be followed by its definite noun.
  criteria:
  - id: selected-common-singular
    instruction: Uses «denne lampa» for the selected lamp, with definite noun «lampa».
  - id: selected-neuter-singular
    instruction: Uses «dette speilet» for the selected mirror, with definite noun
      «speilet».
  - id: selected-plural
    instruction: Uses «disse stolene» for the selected chairs, with definite noun
      «stolene».
  - id: rejected-plural-far
    instruction: Uses «de stolene bakerst» for the rejected chairs at the back.
- handle: moving_day_transfer
  op: write
  objective: obj-demonstrative-pronouns-01
  bloom: apply
  derived_from:
  - section_id: transfer-to-a-new-situation
  prompt_md: 'In the unpacking scene, write six short Norwegian placement statements,
    one for each cue: a box beside Jonas (close), a box near the door (far), a picture
    in Maja''s hands (close), a picture on the far wall (far), books on the nearby
    table (close), and books across the room (far). Use a complete demonstrative noun
    phrase in every statement. Use new wording rather than copying any complete sentence
    from the lesson.'
  response_language: 'no'
  judge_prompt: Check all six cues and report evidence for every criterion. Accept
    varied natural Norwegian placement verbs and normal capitalization or punctuation.
    Require the listed demonstrative plus definite noun for the matching cue.
  criteria:
  - id: close-box
    instruction: Uses «denne esken» for the box beside Jonas, with definite noun «esken».
  - id: far-box
    instruction: Uses «den esken» for the box near the door, with definite noun «esken».
  - id: close-picture
    instruction: Uses «dette bildet» for the picture in Maja’s hands, with definite
      noun «bildet».
  - id: far-picture
    instruction: Uses «det bildet» for the picture on the far wall, with definite
      noun «bildet».
  - id: close-books
    instruction: Uses «disse bøkene» for the books on the nearby table, with definite
      noun «bøkene».
  - id: far-books
    instruction: Uses «de bøkene» for the books across the room, with definite noun
      «bøkene».
