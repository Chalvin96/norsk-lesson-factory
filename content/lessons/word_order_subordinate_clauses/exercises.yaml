- handle: put_negation_in_the_intended_clause
  op: write
  objective: obj-word-order-subordinate-clauses-01
  bloom: apply
  prompt_md: Write two parallel Norwegian sentences. In the first, say that Henrik
    does not say that Anna is coming. In the second, say that Henrik says that Anna
    is not coming. Keep the same subjects, reporting verb, linker, and embedded verb
    in both sentences; move ikke to the clause whose meaning is negative.
  derived_from:
  - section_id: more-than-one-subordinate-clause
  response_language: 'no'
  min_words: 8
  max_words: 16
  judge_prompt: Check both sentences against the task and report evidence for each
    criterion. Accept optional final punctuation, but require the same lexical frame
    and the two specified negation scopes.
  criteria:
  - id: main-report-negation
    instruction: The first sentence places ikke in the main clause after the finite
      verb sier, negating the reporting action.
  - id: embedded-event-negation
    instruction: The second sentence places ikke in the at clause before the finite
      verb kommer, negating the embedded event.
- handle: write_a_connected_update
  op: write
  objective: obj-word-order-subordinate-clauses-01
  bloom: apply
  prompt_md: Write a short connected Norwegian update to another resident about a
    home repair visit. Mention a technician, a spare key, a neighbour, and a possible
    delay. Include a reported fact with at; a reason with fordi or a condition with
    hvis; a relative clause with som or der identifying a person or object; one sentence
    in which a subordinate clause is nested inside another structure; and ikke or
    another taught sentence adverb in a subordinate clause where it naturally clarifies
    word order. Use your own wording rather than copying a complete lesson sentence,
    and connect the ideas clearly.
  derived_from:
  - section_id: cumulative-transfer-a-changed-everyday-situation
  response_language: 'no'
  min_words: 35
  max_words: 65
  judge_prompt: Check the update against the task and report evidence for every criterion.
    Accept natural Bokmål wording for the repair context, either fordi or hvis, and
    either som or der. Require clear clause relationships and correct local subordinate-clause
    word order; do not require exact wording or a particular placement of the subordinate
    clauses.
  criteria:
  - id: repair-context
    instruction: Mentions a technician, a spare key, a neighbour, and a possible delay.
  - id: reported-fact-at
    instruction: Includes a reported fact introduced by at.
  - id: reason-or-condition
    instruction: Includes a clear reason introduced by fordi or a clear condition
      introduced by hvis.
  - id: relative-description
    instruction: Includes a som or der relative clause that identifies a person or
      object.
  - id: nested-subordination
    instruction: Includes a sentence in which one subordinate clause is nested inside
      another structure.
  - id: adverb-placement
    instruction: Uses ikke or another taught sentence adverb naturally in a subordinate
      clause and places it before that clause finite verb.
  - id: connected-relationships
    instruction: Connects the ideas into a clear update with correct local subordinate-clause
      word order.
