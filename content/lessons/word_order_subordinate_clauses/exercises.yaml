- handle: mark_clause_boundaries
  op: categorize
  objective: obj-word-order-subordinate-clauses-01
  bloom: analyze
  prompt_md: The source sentences are Jeg håper at Anna snart ser meldingen når hun
    ikke lenger sitter på bussen. and Maja sier at de trenger en nabo som kan åpne
    døra hvis Henrik ikke finner nøkkelen. Classify each displayed clause excerpt
    as a main clause, linker-led subordinate clause, or relative clause. Use each
    excerpt as one clause boundary and inspect its local subject, sentence adverb,
    and finite verb. Boundary recognition, not sentence production, is scored.
  derived_from:
  - section_id: more-than-one-subordinate-clause
  buckets:
  - bucket_id: boundary-main
    label: Main clause
  - bucket_id: boundary-linker
    label: 'Linker-led subordinate clause: linker + subject + optional sentence adverb
      + finite verb'
  - bucket_id: boundary-relative
    label: Relative clause introduced by som
  items:
  - item_id: boundary-1
    text: Jeg håper
    bucket_id: boundary-main
  - item_id: boundary-2
    text: at Anna snart ser meldingen
    bucket_id: boundary-linker
  - item_id: boundary-3
    text: når hun ikke lenger sitter på bussen
    bucket_id: boundary-linker
  - item_id: boundary-4
    text: Maja sier
    bucket_id: boundary-main
  - item_id: boundary-5
    text: at de trenger en nabo
    bucket_id: boundary-linker
  - item_id: boundary-6
    text: som kan åpne døra
    bucket_id: boundary-relative
  - item_id: boundary-7
    text: hvis Henrik ikke finner nøkkelen
    bucket_id: boundary-linker
