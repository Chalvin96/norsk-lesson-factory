- handle: notice_infinitive_marker_in_context
  op: choose
  objective: obj-infinitive-marker-01
  bloom: understand
  prompt_md: Choose one group of Norwegian statements.
  derived_from:
  - section_id: infinitive-and-marker
  stem_md: Which group has å introducing each second verb after a non-modal first
    verb?
  options:
  - id: group-modal
    text: Maja kan spise. Elias skal reise.
    correct: false
    why: These modal verbs take bare infinitives, so this group does not show å plus
      an infinitive.
  - id: group-missing
    text: Maja liker spise. Elias håper komme.
    correct: false
    why: The non-modal verbs liker and håper require å before the infinitives.
  - id: group-correct
    text: Maja liker å spise. Elias håper å reise.
    correct: true
    why: Both non-modal first verbs are followed by å and the unchanged infinitive.
- handle: choose_marker_after_first_verb
  op: recall_fill
  objective: obj-infinitive-marker-01
  bloom: apply
  prompt_md: Complete each Norwegian sentence by choosing the form required after
    the first verb.
  explanation_md: "Modal verbs take a bare infinitive, while verbs such as «håpe» and «prøve» take «å + infinitive». The infinitive itself does not change."
  derived_from:
  - section_id: after-modal-verbs
  audio_target: "På mandag håper jeg å besøke Bergen. I kveld må jeg lage middag. På lørdag vil vi møte Anna. Etter jobb prøver hun å lese på norsk."
  segments:
  - text_md: 'På mandag håper jeg '
  - blank_id: visit-form
    options:
    - besøke
    - å besøke
    answer_index: 1
  - text_md: ' Bergen.'
  - text_md: ' I kveld må jeg '
  - blank_id: dinner-form
    options:
    - lage
    - å lage
    answer_index: 0
  - text_md: ' middag.'
  - text_md: ' På lørdag vil vi '
  - blank_id: meet-form
    options:
    - å møte
    - møte
    answer_index: 1
  - text_md: ' Anna.'
  - text_md: ' Etter jobb prøver hun '
  - blank_id: read-form
    options:
    - å lese
    - lese
    answer_index: 0
  - text_md: ' på norsk.'
