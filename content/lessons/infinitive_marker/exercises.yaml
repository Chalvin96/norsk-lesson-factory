    text: Anna,
  - token_id: tok-6
    text: men
  - token_id: tok-7
    text: hun
  - token_id: tok-8
    text: kan
  - token_id: tok-9
    text: møte
  - token_id: tok-10
    text: Anna.
  - token_id: tok-1
