    text: kan
  - token_id: tok-3
    text: å
  - token_id: tok-4
    text: møte
  - token_id: tok-5
    text: Elias,
  - token_id: tok-6
    text: men
  - token_id: tok-7
    text: hun
  - token_id: tok-8
    text: håper
  - token_id: tok-9
    text: å
  - token_id: tok-10
    text: møte
  - token_id: tok-11
    text: Elias.
  error_token_id: tok-3
  feedback: 'Remove the extra å after modal kan. Keep å before møte after non-modal
    håper. Correct message: Maja kan møte Elias, men hun håper å møte Elias.'
