- handle: translation_error_repair
  op: write
  objective: obj-hvis-vs-om-01
  bloom: analyze
  prompt_md: Correct the Norwegian message by replacing the connector, then explain
    in Norwegian whether the corrected clause is a condition or an embedded yes/no
    question.
  response_language: 'no'
  judge_prompt: Check the corrected connector and Norwegian classification against every
    criterion. Accept natural wording when the clause meaning is clear.
  criteria:
  - id: corrected-connector
    instruction: Replaces hvis with om in «Jeg vet ikke om bussen er forsinket».
  - id: clause-classification
    instruction: Explains in Norwegian that the corrected clause is an embedded yes/no question, not a condition.
  derived_from:
  - section_id: common-mistake-translating-if-mechanically
- handle: dialogue_continuation
  op: write
  objective: obj-hvis-vs-om-01
  bloom: apply
  prompt_md: Write a short, connected continuation in Norwegian as Henrik's message
    to Maja after Nora's bus message. Ask Maja whether she needs anything, then explain
    what you will do if she needs something. Use om in the embedded yes/no question
    and hvis in the condition.
  response_language: 'no'
  min_words: 12
  max_words: 30
  judge_prompt: Accept natural Norwegian wording and clear pronoun choices. Check
    the response against the task and report evidence for each criterion.
  criteria:
  - id: embedded-question-om
    instruction: Asks, in an embedded yes/no question, whether Maja needs something,
      using om.
  - id: condition-hvis
    instruction: Includes a condition introduced by hvis and a result that depends
      on Maja needing something.
  - id: connected-message
    instruction: Connects the question and condition in a coherent message from Henrik
      to Maja.
  derived_from:
  - section_id: back-to-maja-henrik-and-nora
- handle: new_plan_transfer
  op: write
  objective: obj-hvis-vs-om-01
  bloom: apply
  prompt_md: 'Write a short, connected plan in Norwegian for Emil and Sara''s Sunday
    walk. Include information Sara needs to discover: whether the café is open on
    Sunday. Include what they will do if it is open, and what they will do if it rains.
    Use om for the embedded yes/no question and hvis for each condition. Phrase the
    plan in your own words; do not copy a complete lesson sentence.'
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Accept natural Norwegian wording and equivalent natural variants.
    Check the response against the task and report evidence for each criterion.
  criteria:
  - id: om-discovery
    instruction: States what Sara needs to discover with an embedded yes/no question
      introduced by om.
  - id: hvis-cafe
    instruction: States what they will do if the café is open, using a condition introduced
      by hvis.
  - id: hvis-rain
    instruction: States what they will do if it rains, using a condition introduced
      by hvis.
  - id: connected-plan
    instruction: Connects the discovery and both conditions into a coherent Sunday-walk
      plan.
  derived_from:
  - section_id: transfer-to-a-new-situation
- handle: retrieval_and_review
  op: write
  objective: obj-hvis-vs-om-01
  bloom: apply
  prompt_md: Without looking back, write a short connected review in Norwegian about
    a new everyday plan. State one unresolved yes/no issue someone needs to find out
    using om. Then state what will happen under one condition based on that issue
    using hvis. Use a new lexical frame and do not copy a complete sentence from the
    lesson.
  response_language: 'no'
  min_words: 12
  max_words: 30
  judge_prompt: Accept any natural Norwegian wording and lexical choice that satisfies
    the task. Check the response against the task and report evidence for each criterion.
  criteria:
  - id: unresolved-om-issue
    instruction: Reports an unresolved yes/no issue inside a larger sentence, introduced
      by om.
  - id: hvis-condition-result
    instruction: States a result that depends on the same issue, with a condition
      introduced by hvis.
  - id: coherent-review
    instruction: Connects the issue and condition in a coherent short plan.
  derived_from:
  - section_id: retrieval-and-review
