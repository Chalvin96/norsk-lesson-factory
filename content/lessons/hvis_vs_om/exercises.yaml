- handle: whether_test
  op: choose
  objective: obj-hvis-vs-om-01
  bloom: apply
  prompt_md: Choose the Norwegian pair that preserves both meanings of English “if.”
  stem_md: You need to find out if the shop is open. If it is open, you will go inside.
    Which pair expresses the unresolved question first and the condition second?
  options:
  - id: connectors-reversed
    text: Jeg vet ikke hvis butikken er åpen. Om butikken er åpen, går jeg inn.
    correct: false
    why: The connectors are reversed for these two meanings.
  - id: correct-contrast
    text: Jeg vet ikke om butikken er åpen. Hvis butikken er åpen, går jeg inn.
    correct: true
    why: Om introduces the unresolved yes/no question; hvis introduces the condition
      for going inside.
  - id: both-hvis
    text: Jeg vet ikke hvis butikken er åpen. Hvis butikken er åpen, går jeg inn.
    correct: false
    why: The first sentence embeds a yes/no question and therefore needs om.
  derived_from:
  - section_id: embedded-yes-no-questions-with-om
