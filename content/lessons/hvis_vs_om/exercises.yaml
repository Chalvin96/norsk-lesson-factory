- handle: anchor_meaning_check
  op: categorize
  objective: obj-hvis-vs-om-01
  bloom: analyze
  prompt_md: 'Classify each sentence''s clause introduced by hvis or om. Use its communicative
    function: a condition or an unanswered yes/no question.'
  buckets:
  - bucket_id: condition
    label: Condition
  - bucket_id: embedded-yes-no-question
    label: Embedded yes/no question
  items:
  - item_id: anchor-1
    text: Hvis Nora trenger skyss, kan Henrik hente henne.
    bucket_id: condition
  - item_id: anchor-2
    text: Maja vet ikke om Nora trenger skyss.
    bucket_id: embedded-yes-no-question
  explanation_md: "Use «hvis» for a condition whose result follows, and «om» for an unresolved embedded yes/no question meaning whether."
  derived_from:
  - section_id: the-central-choice
- handle: condition_recognition
  op: recall_fill
  objective: obj-hvis-vs-om-01
  bloom: understand
  prompt_md: Complete each message with hvis or om. Decide whether the first clause
    sets a condition or reports an unresolved yes/no question.
  audio_target: "Hvis det blir sent, tar Henrik en taxi. Maja vet ikke om toget er forsinket. Hvis det regner, spiser vi inne."
  segments:
  - text_md: 'Sentence 1: '
  - blank_id: condition-1
    options:
    - Hvis
    - Om
    answer_index: 0
  - text_md: ' det blir sent, tar Henrik en taxi. Sentence 2: Maja vet ikke '
  - blank_id: condition-2
    options:
    - hvis
    - om
    answer_index: 1
  - text_md: ' toget er forsinket. Sentence 3: '
  - blank_id: condition-3
    options:
    - Hvis
    - Om
    answer_index: 0
  - text_md: ' det regner, spiser vi inne.'
  derived_from:
  - section_id: conditions-with-hvis
