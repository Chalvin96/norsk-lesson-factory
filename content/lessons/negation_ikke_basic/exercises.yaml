- handle: repair_statement_word_order
  op: write
  objective: obj-negation-ikke-basic-01
  bloom: analyze
  prompt_md: Write one natural Norwegian sentence beginning with I dag that means
    Elias does not have a lunchbox. After the sentence, briefly explain in Norwegian
    why ikke follows the finite verb har and the subject Elias.
  derived_from:
  - section_id: statements-two-verbs
  response_language: 'no'
  min_words: 10
  max_words: 30
  judge_prompt: Check the Norwegian sentence and explanation. Report evidence for
    every criterion. Accept natural Bokmål variants that preserve the requested
    meaning and word order.
  criteria:
  - id: time-initial-sentence
    instruction: Writes a Norwegian sentence beginning with I dag that says Elias does
      not have a lunchbox.
  - id: negative-placement
    instruction: Places finite verb har before subject Elias and ikke after Elias.
  - id: norwegian-explanation
    instruction: Explains briefly in Norwegian why ikke follows har and Elias.
