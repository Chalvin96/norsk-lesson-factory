- handle: diagnose_ikke_across_sentence_types
  op: write
  objective: obj-negation-ikke-basic-01
  bloom: analyze
  prompt_md: Write four natural Norwegian lines about Maja and Elias. Include a
    subject-first negative statement with Jeg, a neutral negative question with pronoun
    subject du, a neutral negative question with full-noun subject Maja, and a negative
    modal statement beginning with Vi kan. Use ikke in each line. After each line,
    briefly identify its sentence type and subject form in Norwegian.
  derived_from:
  - section_id: common-placement-mistakes
  response_language: 'no'
  min_words: 24
  max_words: 70
  judge_prompt: Check the four Norwegian lines and their short Norwegian labels.
    Report evidence for every criterion. Accept natural Bokmål variants when each
    requested sentence type, subject, meaning, and ikke placement are clear.
  criteria:
  - id: subject-first-statement
    instruction: Includes a subject-first negative statement with Jeg and places ikke
      after the finite verb and subject.
  - id: pronoun-question
    instruction: Includes a neutral negative yes-no question with pronoun subject du
      and places ikke after du.
  - id: full-noun-question
    instruction: Includes a neutral negative yes-no question with full-noun subject
      Maja and places ikke after the finite verb and before Maja.
  - id: modal-statement
    instruction: Includes a negative statement beginning with Vi kan and places ikke
      after kan.
  - id: sentence-labels
    instruction: Identifies each line's sentence type and subject form in Norwegian.
- handle: transfer_ikke_to_evening_plans
  op: write
  objective: obj-negation-ikke-basic-01
  bloom: apply
  prompt_md: 'Write a short four-line exchange in natural Bokmål about Maja and Elias
    making plans after work. Include: a subject-first negative statement saying that
    Elias cannot come; a negative statement beginning with the time expression I kveld,
    saying that the shop is not open; a neutral yes-no negative question with pronoun
    subject du, asking whether du will go to the shop; and a neutral negative question
    with full-noun subject Maja, asking whether Maja is coming to the shop. The exchange
    should show that one person is unavailable, the shop is closed, and the original
    plan changes. Use ikke and your own wording.'
  derived_from:
  - section_id: transfer-evening-plans
  response_language: 'no'
  min_words: 16
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept natural Bokmål variants only when they preserve the requested
    meaning, sentence type, and ikke placement.
  criteria:
  - id: transfer-subject-statement
    instruction: Includes a subject-first negative statement with ikke after the finite
      verb and subject.
  - id: transfer-fronted-time
    instruction: Includes a negative statement beginning with I kveld, with the finite
      verb before the subject and ikke after the subject.
  - id: transfer-pronoun-question
    instruction: Includes a neutral negative yes-no question with pronoun du in the
      order finite verb + du + ikke.
  - id: transfer-full-noun-question
    instruction: Includes a neutral negative question with full-noun subject Maja
      in the order finite verb + ikke + Maja.
  - id: transfer-evening-context
    instruction: Uses the requested after-work situation with an unavailable person,
      a closed shop, and a changed plan in original wording.
- handle: retrieve_basic_ikke_patterns
  op: write
  objective: obj-negation-ikke-basic-01
  bloom: apply
  prompt_md: 'Write four natural Bokmål sentences, one for each meaning. First write
    a negative statement meaning I am not going to the shop. Then write a negative
    yes-no question meaning Aren’t you going to the shop?, using pronoun du. Switch
    to a different evening-plans situation for the last pair: write a negative statement
    meaning Elias is not coming this evening, then a neutral negative yes-no question
    meaning Isn’t Elias coming this evening?, using full-noun Elias. Use the stated
    statement and question patterns and your own wording.'
  derived_from:
  - section_id: retrieval-review
  response_language: 'no'
  min_words: 18
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept natural Bokmål variants with the same meanings when they preserve
    the required statement order, question order, and subject type.
  criteria:
  - id: retrieval-first-statement
    instruction: Reconstructs the first negative statement with subject + finite verb
      + ikke + rest.
  - id: retrieval-pronoun-question
    instruction: Reconstructs the first negative question with finite verb + pronoun
      du + ikke.
  - id: retrieval-second-statement
    instruction: Writes the evening-plans negative statement with ikke after the finite
      verb and subject.
  - id: retrieval-full-noun-question
    instruction: Writes the evening-plans neutral negative question with finite verb
      + ikke + full-noun subject Elias.
  - id: retrieval-new-situation
    instruction: Uses a different evening-plans situation with original wording.
