- handle: anchor_reference_notice
  op: choose
  objective: obj-personal-pronouns-object-01
  bloom: understand
  prompt_md: 'Sara and Jonas are outside the cinema. The dialogue contains «Ser du
    meg?», «Nå ser jeg deg», «Kjenner du ham?», «Jeg kjenner ham», and «Emil venter
    på henne». Choose the complete reference map for these object pronouns.'
  derived_from:
  - section_id: meeting-outside-cinema
  stem_md: Which complete reference map is correct?
  options:
  - id: map-switched
    text: meg → Jonas; deg → Sara; ham → Emil; ham → Emil; henne → Amina
    correct: false
    why: It switches the speaker and listener references.
  - id: map-correct
    text: meg → Sara; deg → Jonas; ham → Emil; ham → Emil; henne → Amina
    correct: true
    why: It maps every highlighted form to the person it refers to, including both
      references to Emil.
  - id: map-gender-switched
    text: meg → Sara; deg → Jonas; ham → Amina; ham → Amina; henne → Emil
    correct: false
    why: It assigns the male and female object forms to the wrong people.
