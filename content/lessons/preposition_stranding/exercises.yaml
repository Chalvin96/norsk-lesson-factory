- handle: notice_question_links
  op: choose
  objective: obj-preposition-stranding-01
  bloom: understand
  prompt_md: Read the everyday question and choose the analysis that identifies the
    linked question word and preposition and distinguishes it from a subject question.
  derived_from:
  - section_id: formal-everyday-placement
  stem_md: Which analysis correctly identifies the question word and the preposition
    connected to it?
  options:
  - id: isolated-preposition
    text: Hvem snakket du med? (Who did you speak with?) — med is an isolated final
      word and has no connection to hvem.
    correct: false
    why: Med belongs to the question phrase represented by hvem.
  - id: linked-preposition
    text: Hvem snakket du med? (Who did you speak with?) — hvem is linked to med;
      med remains later, unlike a subject question with no stranded preposition.
    correct: true
    why: The taught everyday pattern moves hvem to the beginning and keeps med after
      the verb.
  - id: subject-analysis
    text: Hvem snakket du med? (Who did you speak with?) — hvem is the subject and
      med is linked to du.
    correct: false
    why: The sentence asks about the person connected to med, not the subject.
- handle: complete_stranded_prepositions_in_questions
  op: recall_fill
  objective: obj-preposition-stranding-01
  bloom: apply
  prompt_md: Complete each party-planning question with the preposition required by
    the expression. Keep the question word or phrase at the beginning.
  explanation_md: "The preposition belongs to the verb or expression and stays at the end when its complement is questioned or represented by som."
  derived_from:
  - section_id: asking-natural-questions
  audio_target: "Maja spør: Hvem snakker du med? Jonas spør: Hva snakker dere om? Maja spør: Hvem venter hun på? Jonas spør: Hvilket hus bor de i?"
  segments:
  - text_md: 'Maja spør: Hvem snakker du '
  - blank_id: question-med
    options:
    - med
    - om
    answer_index: 0
  - text_md: '? Jonas spør: Hva snakker dere '
  - blank_id: question-om
    options:
    - med
    - om
    answer_index: 1
  - text_md: '? Maja spør: Hvem venter hun '
  - blank_id: question-pa
    options:
    - på
    - i
    answer_index: 0
  - text_md: '? Jonas spør: Hvilket hus bor de '
  - blank_id: question-i
    options:
    - i
    - på
    answer_index: 0
  - text_md: '?'
