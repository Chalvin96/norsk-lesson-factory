  objective: obj-preposition-stranding-01
  bloom: remember
  prompt_md: Match each described noun with the preposition later in its relative
    clause. The correct links show why the preposition remains inside the clause.
  explanation_md: "Som represents the earlier noun, while the verb keeps its required preposition later in the relative clause."
  derived_from:
  - section_id: relative-clauses
  left:
  - left_id: noun-naboen
    text: Naboen som jeg snakket med
  - left_id: noun-hoyttaleren
    text: Høyttaleren som vi hørte på
  - left_id: noun-rommet
    text: Rommet som gjestene skal være i
  - left_id: noun-sangen
    text: Sangen som folk liker å danse til
  right:
