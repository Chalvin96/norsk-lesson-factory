- handle: retrieve_end_position_pattern
  op: write
  objective: obj-preposition-stranding-01
  bloom: apply
  prompt_md: 'Without looking back, write in natural Bokmål: one question and one
    sentence with a relative clause. Use different prepositions in the two sentences.
    After each sentence, briefly state which earlier question word or noun the preposition
    connects to.'
  derived_from:
  - section_id: short-review
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for every
    criterion. Accept different natural Bokmål wording and any taught prepositions,
    provided the two prepositions differ and their connections and positions are clear.
  criteria:
  - id: question-stranding
    instruction: Writes one natural Bokmål question with the question word or phrase
      early and its required preposition later.
  - id: relative-stranding
    instruction: Writes one natural Bokmål sentence with a relative clause, with the
      described noun before the clause and the required preposition retained inside
      it.
  - id: different-prepositions
    instruction: Uses different prepositions in the question and the relative-clause
      sentence.
  - id: connection-notes
    instruction: Briefly states in Norwegian which earlier question word or noun each
      preposition connects to.
