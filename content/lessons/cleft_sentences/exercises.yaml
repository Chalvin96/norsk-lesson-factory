- handle: short_retrieval_review
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: 'Invent one simple everyday event. Write four separate Bokmål cleft sentences
    about that same event, in this order:
    highlight who in the first, what in the second, when in the third, and where in
    the fourth. Put each highlighted element immediately after det er or det var.
    In the first sentence, the highlighted person performs the action, so follow that
    person with som. After writing, check the four focus positions and the som link.'
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 20
  max_words: 70
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept any natural Bokmål event, as long as all four sentences describe one
    coherent event. Accept det er or det var when
    it fits the event, and accept the taught optional at after a highlighted time
    or place. The first sentence must highlight the performing person immediately
    after the opening and use som after that person. The second, third, and fourth
    sentences must respectively highlight a thing, a time, and a place immediately
    after the opening. No single fixed lexical answer is required.
  criteria:
  - id: same-event
    instruction: All four sentences describe one coherent everyday event.
  - id: who-focus
    instruction: The first sentence highlights the performing person immediately after
      det er or det var and follows that person with som.
  - id: what-focus
    instruction: The second sentence places the event’s highlighted thing immediately
      after det er or det var.
  - id: when-focus
    instruction: The third sentence places the event’s highlighted time immediately
      after det er or det var.
  - id: where-focus
    instruction: The fourth sentence places the event’s highlighted place immediately
      after det er or det var.
