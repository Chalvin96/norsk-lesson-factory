- handle: notice_fixed_det_in_the_cafe_call
  op: choose
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: understand
  prompt_md: Choose the interpretation that correctly covers Mina's weather and ambient
    statements in the café call. What does repeated «det» do, and what conditions
    do the statements report?
  derived_from:
  - section_id: a-change-of-plans
  stem_md: Which interpretation is correct?
  options:
  - id: named-object
    text: In each sentence, «det» names the weather or another object that is raining,
      windy, cold, dark, warm, or pleasant.
    correct: false
    why: In these statements, «det» does not refer to a named object.
  - id: limited-det
    text: Only «det regner» and «det blåser ganske mye» use fixed «det». In the other
      sentences, «det» refers to a particular cold, dark, warm, or pleasant thing.
    correct: false
    why: The ambient sentences with «det er» and «det begynner å bli» also use fixed
      «det» without a named semantic subject.
  - id: fixed-ambient
    text: «Det regner» (It's raining), «det blåser ganske mye» (It's quite windy),
      «det er kaldt» (It's cold), «det begynner å bli mørkt» (It's starting to get
      dark), and «det er varmt og hyggelig der inne» (It's warm and pleasant inside)
      all use fixed «det» as the grammatical subject. «Det» does not name an object.
    correct: true
    why: Norwegian uses fixed «det» when no person or thing is the semantic subject;
      the sentences report the listed weather and ambient conditions.
- handle: complete_weather_verb_reports
  op: recall_fill
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: apply
  prompt_md: Complete the three Norwegian reports. The meanings are rain in Bergen
    today, snow in Oslo today, and wind by the sea today, in that order. Select the
    full weather expression; keep «det» and do not put «er» before the weather verb.
  explanation_md: "Weather and ambient clauses use fixed «det». Weather verbs are direct («det regner»), while adjective conditions use neuter singular after «er/blir» («det er varmt», «det blir mørkt»)."
  derived_from:
  - section_id: weather-verbs-with-det
  audio_target: "Det regner i Bergen i dag. Det snør i Oslo i dag. Det blåser ved sjøen i dag."
  segments:
  - text_md: 'I Bergen i dag: '
  - blank_id: bergen-rain
    options:
    - det er regner
    - det regner
    - regner
    answer_index: 1
  - text_md: '. I Oslo i dag: '
  - blank_id: oslo-snow
    options:
    - det er blåser
    - snør
    - det snør
    answer_index: 2
  - text_md: '. Ved sjøen i dag: '
  - blank_id: sea-wind
    options:
    - det blåser
    - blåser
    - det er blåser
    answer_index: 0
  - text_md: .
- handle: distinguish_named_subject_from_ambient_det
  op: categorize
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: analyze
  prompt_md: 'Classify each Norwegian sentence by what it describes: a named thing
    as subject, or a general ambient condition with fixed «det». Judge only whether
    the sentence has a named semantic subject; adjective agreement is not the focus.'
  derived_from:
  - section_id: named-subject-and-ambient-det
  buckets:
  - bucket_id: named-subject
    label: 'Named subject: a particular thing is described.'
  - bucket_id: ambient-det
    label: 'Ambient condition: no named semantic subject; fixed «det» is used.'
  items:
  - item_id: coffee-named
    text: Kaffen er kald. — The coffee is cold.
    bucket_id: named-subject
  - item_id: weather-cold
    text: Det er kaldt. — It’s cold.
    bucket_id: ambient-det
  - item_id: room-named
    text: Rommet er mørkt. — The room is dark.
    bucket_id: named-subject
  - item_id: ambient-dark
    text: Det er mørkt. — It’s dark.
    bucket_id: ambient-det
  - item_id: oven-named
    text: Ovnen er varm. — The oven is hot.
    bucket_id: named-subject
  - item_id: ambient-warm
    text: Det er varmt. — It’s warm.
    bucket_id: ambient-det
