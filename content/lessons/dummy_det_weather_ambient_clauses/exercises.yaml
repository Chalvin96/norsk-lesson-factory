- handle: report_conditions_from_the_cabin
  op: write
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: apply
  prompt_md: 'You are at a mountain cabin before deciding whether to go for a walk.
    Write a short connected report in Norwegian with four complete statements: report
    snow outside, cold outdoors, warmth inside, and darkness that is increasing. Use
    fixed «det» in every weather or ambient statement because no particular person
    or thing is the semantic subject. Use your own natural Bokmål wording and do not
    copy a lesson sentence verbatim.'
  derived_from:
  - section_id: transfer-a-morning-at-the-cabin
  response_language: 'no'
  min_words: 12
  max_words: 40
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that express the four requested conditions and
    use fixed «det» appropriately.
  criteria:
  - id: reports-snow
    instruction: Reports snow outside with a complete Norwegian weather statement.
  - id: reports-outdoor-cold
    instruction: Reports that it is cold outdoors with a complete ambient statement.
  - id: reports-indoor-warmth
    instruction: Reports that it is warm inside with a complete ambient statement.
  - id: reports-increasing-darkness
    instruction: Reports increasing darkness with a complete statement using the change
      pattern.
  - id: fixed-det-all-statements
    instruction: Uses fixed «det» as the grammatical subject in all four statements.
- handle: retrieve_fixed_det_weather_rule
  op: write
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: apply
  prompt_md: 'Forklar regelen om fast «det» på norsk. Gi deretter tre egne Bokmål-eksempler:
    ett med et værverb, ett med «det er» for en omgivelsestilstand, og ett med «det blir»
    for en omgivelsestilstand som endrer seg. Ikke kopier hele eksempelsetninger fra
    leksjonen.'
  derived_from:
  - section_id: final-retrieval
  response_language: 'no'
  min_words: 20
  max_words: 65
  judge_prompt: Check the Norwegian rule explanation and the three original Bokmål examples
    against every criterion. Accept natural Norwegian wording and do not require sentences
    from the lesson verbatim.
  criteria:
  - id: explains-fixed-det-rule
    instruction: Explains in Norwegian that fixed «det» is used when weather or an ambient
      condition has no semantic subject.
  - id: weather-verb-example
    instruction: Gives one original complete Bokmål sentence with fixed «det» directly
      followed by regner, snør, or blåser, without «er» before the weather verb.
  - id: det-er-example
    instruction: Gives one original complete Bokmål sentence using fixed «det» plus
      «er» for an ambient condition.
  - id: det-blir-example
    instruction: Gives one original complete Bokmål sentence using fixed «det» plus
      «blir» for a changing ambient condition.
