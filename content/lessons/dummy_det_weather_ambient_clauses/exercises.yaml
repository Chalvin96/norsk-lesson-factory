- handle: respond_to_local_weather_questions
  op: write
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: apply
  prompt_md: Answer these three questions in Norwegian. Write one complete weather
    or ambient statement for each. Include the requested place or time information,
    and use rain for the first answer, cold for the second, and wind for the third.
    Include Bergen and i dag in the first answer, hytta and om morgenen in the second,
    and sjøen and i dag in the third. 1. «Hvordan er været i Bergen i dag?» — What
    is the weather like in Bergen today? 2. «Hvordan er det på hytta om morgenen?»
    — What is it like at the cabin in the morning? 3. «Hvordan er det ved sjøen i
    dag?» — What is it like by the sea today?
  derived_from:
  - section_id: adding-place-and-time
  response_language: 'no'
  min_words: 12
  max_words: 40
  judge_prompt: Check the three answers separately and report evidence for every required
    weather, place, time, and fixed-«det» criterion. Accept natural Bokmål variants when
    the requested numbered answer remains clear.
  criteria:
  - id: three-complete-answers
    instruction: Gives one complete Norwegian weather or ambient statement for each
      of the three questions.
  - id: fixed-det-each-answer
    instruction: Uses fixed «det» as the grammatical subject in every statement instead
      of omitting it.
  - id: requested-settings
    instruction: Includes Bergen and i dag in the first answer, hytta and om morgenen
      in the second, and sjøen and i dag in the third.
  - id: first-rain-answer
    instruction: Makes answer 1 a complete rain statement about Bergen i dag with fixed «det».
  - id: second-cold-answer
    instruction: Makes answer 2 a complete cold ambient statement about hytta om morgenen with fixed «det».
  - id: third-wind-answer
    instruction: Makes answer 3 a complete wind statement about sjøen i dag with fixed «det».
