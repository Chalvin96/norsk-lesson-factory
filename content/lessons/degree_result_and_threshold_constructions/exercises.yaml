- handle: transfer_threshold_choices_to_departure
  op: write
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: apply
  prompt_md: 'Context: Mina and Jonas must pack, carry their luggage, show mobile
    tickets, and reach the bus before it leaves. Write a short connected Norwegian
    account with one stated or presented consequence using så … at, one blocked action
    using for … til å, and one reached or unreached threshold using … nok til å or
    ikke … nok til å. Use a complete clause after at and an infinitive after til å.
    Each sentence should help explain whether they are ready to leave.'
  derived_from:
  - section_id: sec-transfer-getting-ready-for-a-train
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants when they preserve the requested meanings and constructions.
  criteria:
  - id: departure-consequence
    instruction: Includes a stated or presented departure-related consequence with
      **så … at** and a complete clause after **at**.
  - id: departure-excess
    instruction: Includes a blocked departure-related action with **for … til å**
      and an infinitive after **til å**.
  - id: departure-threshold
    instruction: Includes a reached or unreached threshold with **… nok til å** or
      **ikke … nok til å**.
  - id: connected-departure-account
    instruction: Connects the three sentences to Mina and Jonas being ready or not
      ready to leave.
- handle: retrieve_three_degree_patterns
  op: write
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: apply
  prompt_md: 'Context: Without looking back, use a new everyday setting such as cooking,
    studying, traveling, or working at home. Write one brief Norwegian sentence for
    each meaning: a degree followed by a stated or presented consequence, a degree
    beyond the limit for an action, and a degree that reaches the threshold for an
    action. Use så … at, for … til å, and … nok til å respectively. Put a complete
    clause after at and an infinitive after til å.'
  derived_from:
  - section_id: sec-short-retrieval-and-review
  response_language: 'no'
  min_words: 18
  max_words: 45
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants when they preserve the requested meanings and constructions.
  criteria:
  - id: three-patterns
    instruction: Provides three distinct Norwegian sentences using **så … at**, **for
      … til å**, and **… nok til å** in the requested order.
  - id: meaning-alignment
    instruction: Matches consequence, beyond-limit, and threshold meanings to the
      three constructions.
  - id: complement-forms
    instruction: Uses a complete clause after **at** and an infinitive after **til
      å**.
