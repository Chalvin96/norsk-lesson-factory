- handle: select_pattern_from_intended_message
  op: write
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: apply
  prompt_md: 'Context: Short everyday situations involve missing transport, preparing
    food, hearing announcements, carrying luggage, and finding a place to work. In
    new everyday situations, write three short Norwegian sentences: one for a stated
    or presented consequence, one for a blocked action, and one for a reached threshold.
    Match them with så … at, for … til å, and … nok til å respectively. A consequence
    may be factual, modal, or hypothetical.'
  derived_from:
  - section_id: sec-common-mistakes-connected-sentences
  response_language: 'no'
  min_words: 18
  max_words: 45
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants when they preserve the requested meaning and construction.
  criteria:
  - id: consequence-pattern
    instruction: Uses **så … at** for a stated or presented consequence, with a complete
      clause after **at**.
  - id: excess-pattern
    instruction: Uses **for … til å** for a blocked action, with an infinitive after
      **til å**.
  - id: sufficiency-pattern
    instruction: Uses **… nok til å** for a reached threshold, with **nok** after
      the adjective or adverb.
  - id: new-lexical-frame
    instruction: Uses new everyday situations rather than copying a complete taught
      sentence.
