- handle: notice_actual_consequence
  op: choose
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: understand
  prompt_md: 'Context: Mina and Jonas are outside the cabin in darkness. Choose the
    Norwegian sentence that presents the darkness as leading to this result: Mina
    cannot see the numbers. Use a complete clause after at.'
  derived_from:
  - section_id: sec-consequence-saa-at
  stem_md: Which sentence presents the specified consequence with så … at?
  options:
  - id: option-excess
    text: Det er for mørkt til å lese koden uten lys.
    correct: false
    why: This presents an action as blocked by excess degree, not a stated consequence.
  - id: option-different-result
    text: Det er så kaldt at vannet fryser.
    correct: false
    why: This has the consequence pattern but describes a different condition and
      result.
  - id: option-consequence
    text: Det er så mørkt at Mina ikke kan se tallene.
    correct: true
    why: This presents a consequence and uses a complete clause after at.
- handle: distinguish_result_from_excess
  op: choose
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: analyze
  prompt_md: 'Context: After entering the cabin, Mina and Jonas face hot soup from
    the stove and a heavy suitcase. Choose the Norwegian pair that expresses these
    messages in order: the heat leads Mina to wait, and the suitcase is too heavy
    for Jonas to lift. The first message is a consequence; the second is a blocked
    action.'
  derived_from:
  - section_id: sec-limit-for-til-aa
  stem_md: Which pair maps the consequence to så … at and the blocked action to for
    … til å?
  options:
  - id: option-reversed-mapping
    text: 1. Suppa er for varm til å spise nå. 2. Kofferten er så tung at Jonas ikke
      klarer å løfte den.
    correct: false
    why: The first sentence presents a blocked action and the second presents a consequence,
      reversing the requested mapping.
  - id: option-correct-mapping
    text: 1. Suppa er så varm at Mina må vente. 2. Kofferten er for tung til å løfte.
    correct: true
    why: The first sentence presents a consequence; the second evaluates lifting against
      a limit.
  - id: option-two-consequences
    text: 1. Suppa er så varm at Mina må vente. 2. Kofferten er så tung at Jonas ikke
      klarer å løfte den.
    correct: false
    why: Both sentences present consequences; the second does not use the excess pattern.
