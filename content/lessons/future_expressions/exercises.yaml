  bloom: apply
  prompt_md: Complete Maja and Jonas’s controlled planning exchange. Use skal with
    the supplied infinitive, never å after skal, and keep skal in its normal question
    position.
  explanation_md: "Use «skal» for a commitment, present tense for a fixed timetable, «vil» for an assessment, and «kommer til å» for an expectation supported by present evidence."
