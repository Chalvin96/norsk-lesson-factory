- handle: vil_prediction_interpretation
  op: choose
  objective: obj-future-expressions-01
  bloom: analyze
  prompt_md: 'Read these statements about the journey, wishes, and plans: - Jeg tror
    Maja vil like Lillehammer. - Jeg vil hjelpe deg. - Decided plan: I will pick you
    up at six. Choose the complete interpretation and reformulation that preserves
    the intended meanings.'
  derived_from:
  - section_id: two-meanings-of-vil
  stem_md: Choose the correct interpretation of vil and the decided-plan reformulation.
  options:
  - id: wrong-1
    text: Jeg tror Maja vil like Lillehammer expresses desire; Jeg vil hjelpe deg
      expresses a prediction; for the decided plan, use Jeg vil hente deg klokka seks.
    correct: false
    why: The contexts are reversed, and vil is less clear than skal for the decided
      plan.
  - id: correct
    text: Jeg tror Maja vil like Lillehammer expresses a prediction; Jeg vil hjelpe
      deg expresses desire or willingness; for the decided plan, use Jeg skal hente
      deg klokka seks.
    correct: true
    why: Context makes vil predictive in the first sentence, desire or willingness
      in the second, and skal clearer for the decided plan.
  - id: wrong-2
    text: Jeg tror Maja vil like Lillehammer expresses a prediction; Jeg vil hjelpe
      deg expresses desire or willingness; for the decided plan, use Jeg vil hente
      deg klokka seks.
    correct: false
    why: The first two interpretations fit, but a decided plan is more clearly expressed
      with skal.
  - id: wrong-3
    text: Jeg tror Maja vil like Lillehammer expresses a prediction; Jeg vil hjelpe
      deg expresses a decided plan; for the decided plan, use Jeg skal hente deg klokka
      seks.
    correct: false
    why: Jeg vil hjelpe deg expresses desire or willingness in this context, not a
      stated decided plan.
