- handle: future_anchor_noticing
  op: choose
  objective: obj-future-expressions-01
  bloom: understand
  prompt_md: 'Read this Maja and Jonas weekend-plan exchange: Maja: Jeg skal kjøpe
    billetter i kveld. Jonas: Toget går klokka ni i morgen. Maja: Jeg tror Jonas vil
    like Lillehammer. Jonas: Se på de mørke skyene! Det kommer til å regne. Choose
    the single option that assigns the correct role to all four future references.'
  derived_from:
  - section_id: first-checkpoint-speaker-perspective
  stem_md: Choose the complete role mapping for the exchange.
  options:
  - id: correct
    text: skal = personal commitment; går = timetable or settled arrangement; vil
      = prediction presented as an opinion; kommer til å = expected result supported
      by available information.
    correct: true
    why: The four forms frame future events through four different perspectives.
  - id: wrong-1
    text: skal = personal commitment; går = timetable or settled arrangement; vil
      = desire or willingness; kommer til å = expected result supported by available
      information.
    correct: false
    why: The context Jeg tror presents vil as a prediction, not desire or willingness.
  - id: wrong-2
    text: skal = timetable or settled arrangement; går = personal commitment; vil
      = prediction presented as an opinion; kommer til å = expected result supported
      by available information.
    correct: false
    why: The personal commitment uses skal, while the timetable uses present tense
      går.
  - id: wrong-3
    text: skal = personal commitment; går = timetable or settled arrangement; vil
      = expected result supported by available information; kommer til å = prediction
      presented as an opinion.
    correct: false
    why: The opinion cue Jeg tror supports vil, while the visible clouds support kommer
      til å.
- handle: skal_plan_formation
