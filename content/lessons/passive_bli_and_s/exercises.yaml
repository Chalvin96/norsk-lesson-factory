- handle: omit_irrelevant_agent
  op: write
  objective: obj-passive-bli-and-s-02
  bloom: apply
  derived_from:
  - section_id: checkpoint-omit-irrelevant-agent
  prompt_md: 'Rewrite the following practical notices in Norwegian. The named workers
    in the first two notices are irrelevant: put the affected item first, omit the
    worker, and choose a natural passive. Use an s-passive for the after-use routine
    and a bli-passive for the particular evening event. The worker in the third notice
    is relevant, so leave that notice unchanged. Return only the three resulting notices.
    1. Renholderen rydder bord etter bruk. (The cleaner clears tables after use.)
    2. Teknikeren henger opp det nye skiltet i kveld. (The technician puts up the
    new sign this evening.) 3. En bibliotekar møter deg ved inngangen klokka fem.
    (A librarian meets you at the entrance at five.)'
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for each criterion.
    The expected core rewrites are «Bord ryddes etter bruk.» and «Det nye skiltet
    blir hengt opp i kveld.», but accept equally natural Bokmål variants that preserve
    the same passive patterns and information focus. The relevant librarian must remain
    in the third notice.
  criteria:
  - id: omit-irrelevant-agents
    instruction: Omits the irrelevant worker in the first two rewrites, puts the affected
      item first, and leaves the relevant librarian in the third notice.
  - id: passive-pattern-support
    instruction: Uses a natural s-passive for the after-use routine and a natural
      bli-passive for the evening event.
- handle: revise_library_reopening_notice
  op: write
  objective: obj-passive-bli-and-s-01
  bloom: apply
  derived_from:
  - section_id: checkpoint-revise-library-reopening-notice
  prompt_md: Revise Marius's draft public notice for the library reopening. Return
    only the revised Norwegian notice. Keep all four content points, remove irrelevant
    workers, put affected items or events first, use s-passives for recurring or instructional
    points, and use bli-passives for particular event updates. 1. Ansatte rydder bord
    etter bruk. (Staff clear tables after use.) 2. Renholderen vasker gulvet hver
    dag. (The cleaner washes the floor every day.) 3. Teknikeren henger opp det nye
    skiltet i kveld. (The technician puts up the new sign this evening.) 4. Vaktmesteren
    reparerte døren på fredag. (The caretaker repaired the door on Friday.)
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check all four content points against the task and report evidence
    for each criterion. Expected core forms are «Bord ryddes etter bruk.», «Gulvet
    vaskes hver dag.», «Det nye skiltet blir hengt opp i kveld.», and «Døren ble reparert
    på fredag.». Accept natural Bokmål variants only when they preserve all content
    cues, the requested passive distinction, and omission of irrelevant agents.
  criteria:
  - id: routine-s-passives
    instruction: Recasts the first two recurring or instructional points as natural
      s-passives and preserves their cues such as etter bruk and hver dag.
  - id: event-bli-passives
    instruction: Recasts the last two particular events as natural blir/ble + past
      participle forms and preserves their time cues.
  - id: integrated-agent-omission
    instruction: Removes irrelevant workers and makes the affected items or events
      the focus throughout the revised notice.
- handle: create_cafe_opening_update
  op: write
  objective: obj-passive-bli-and-s-02
  bloom: apply
  derived_from:
  - section_id: cafe-opening-transfer
  prompt_md: 'Write two short Norwegian parts for a café opening: one public notice
    and one conversational internal update. In the public notice, state that napkins
    are collected at the counter every day and cups are cleared after use. Use s-passives
    for these recurring customer procedures. In the internal update, report that the
    new coffee machine will be installed tomorrow and the ventilation was inspected
    on Friday. Use bli-passives for these particular events. Omit workers when their
    identities do not matter. Use original café wording.'
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check both parts against the task and report evidence for each criterion.
    Expected evidence is two public procedure sentences in -s and two internal event
    updates using blir/ble + past participle, with worker identities omitted. Accept
    natural Bokmål lexical variants that preserve the two communicative settings and
    passive prototypes, but do not accept a verbatim lesson sentence as the transfer
    response.
  criteria:
  - id: cafe-public-s-passives
    instruction: Uses natural s-passives for both recurring or direct-customer procedures
      in the public notice.
  - id: cafe-internal-bli-passives
    instruction: Uses natural blir/ble + past participle forms for both particular
      event updates in the internal message.
  - id: cafe-agent-omission
    instruction: Omits worker identities where they do not matter and keeps the affected
      items or events in focus.
- handle: retrieve_bli_and_s_passive
  op: write
  objective: obj-passive-bli-and-s-02
  bloom: apply
  derived_from:
  - section_id: short-retrieval-review
  prompt_md: Respond in Norwegian. First state
    the practical tendency that distinguishes the two passive patterns. Then produce
    one Norwegian sentence for a recurring procedure with the exact cue hver dag and
    an s-passive, and one conversational report about a particular event happening
    now or already completed with a bli-passive and an explicit time cue. Omit an
    irrelevant agent in both sentences. Use original wording for a setting such as
    a café, office, or shop.
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept concise natural Bokmål wording and different lexical frames, including
    either blir or ble for the particular event, when the time cue and event reading
    are clear. Do not require a verbatim model sentence.
  criteria:
  - id: states-passive-tendency
    instruction: States in Norwegian that s-passive is often used for routines, procedures,
      or instructions, while bli-passive is often used for particular events.
  - id: recurring-s-sentence
    instruction: Provides one natural Bokmål s-passive sentence with hver dag, omitting
      an irrelevant agent and focusing the affected thing.
  - id: event-bli-sentence
    instruction: Provides one natural Bokmål bli-passive sentence for a current or
      completed particular event with an explicit time cue, omitting an irrelevant
      agent and focusing the affected event or thing.
