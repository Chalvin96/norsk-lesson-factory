- handle: notice_passive_focus
  op: choose
  objective: obj-passive-bli-and-s-02
  bloom: understand
  derived_from:
  - section_id: checkpoint-noticing-passive-focus
  prompt_md: Compare the two supplied library messages. Select one complete interpretation
    of what each passive puts in focus and why the employee need not be named.
  stem_md: Compare «Bord ryddes etter bruk.» and «Det nye skiltet blir hengt opp i
    kveld.» Which interpretation best explains what each passive puts in focus and
    why the worker is unnecessary?
  options:
  - id: focus-agent
    text: Begge setningene setter den ansatte som utfører handlingen, i fokus; bordene
      og skiltet er bare bakgrunn. (Both sentences focus on the employee who acts;
      the tables and sign are only background.)
    correct: false
    why: This reverses the information focus of a passive sentence.
  - id: focus-reversed
    text: «Bord ryddes etter bruk.» handler om én bestemt ansatt, mens «Det nye skiltet
      blir hengt opp i kveld.» er en generell rutine. Derfor må den ansatte navngis.
      (The first is about one particular employee, while the second is a general routine.
      Therefore the employee must be named.)
    correct: false
    why: It confuses the routine with the particular event and wrongly makes the agent
      necessary.
  - id: focus-correct
    text: «Bord ryddes etter bruk.» setter bordene og rutinen i fokus, mens «Det nye
      skiltet blir hengt opp i kveld.» setter den konkrete hendelsen med skiltet i
      fokus. Hvem som utfører handlingen, er ikke viktig. (The first focuses on tables
      and the routine; the second focuses on the particular sign event. The worker
      is not important.)
    correct: true
    why: The affected thing or particular event is the focus, while the agent is irrelevant.
