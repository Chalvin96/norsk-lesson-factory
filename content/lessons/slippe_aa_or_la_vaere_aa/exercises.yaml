- handle: identify_removed_requirement
  op: choose
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: understand
  prompt_md: Use the Saturday-event context. The three relevant tasks are meeting
    early, collecting the cakes, and baking the cakes. Choose the complete interpretation
    that connects each task to the caretaker, the delivery, or the bakery order. The
    interpretation must show that slippe å removes a requirement, not that the task
    is necessarily not performed.
  derived_from:
  - section_id: when-a-requirement-disappears
  stem_md: Which interpretation correctly connects the three uses of slippe å to the
    arrangements?
  options:
  - id: correct
    text: Vaktmesterens hjelp gjør at vi slipper å møte tidlig; leveringen gjør at
      Nora slipper å hente kakene; bestillingen hos bakeriet gjør at Nora slipper
      å bake kakene. Kravene er fjernet, men setningene sier ikke at oppgavene ikke
      blir gjort.
    correct: true
    why: The caretaker removes the need to meet early, the delivery removes the need
      to collect the cakes, and the bakery order removes the need to bake them. None
      of this proves that the actions do not happen.
  - id: swapped-arrangements
    text: Vaktmesterens hjelp gjør at vi slipper å bake kakene; leveringen gjør at
      Nora slipper å møte tidlig; bestillingen hos bakeriet gjør at Nora slipper å
      hente kakene. Ordningene er eksterne, men koblingene er feil.
    correct: false
    why: The arrangements are assigned to the wrong tasks.
  - id: personal-choice
    text: Vaktmesterens hjelp gjør at vi lar være å møte tidlig; leveringen gjør at
      Nora lar være å hente kakene; bestillingen hos bakeriet gjør at Nora lar være
      å bake kakene. Alle tre oppgavene er fortsatt mulige, men dette er personlige
      valg.
    correct: false
    why: The context describes requirements removed by arrangements, not deliberate
      personal decisions.
- handle: identify_deliberate_non_action
  op: choose
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: understand
  prompt_md: Use the examples about Emil cycling and Nora buying more coffee. Choose
    the interpretation that explains both decisions, including that each action remains
    possible and is deliberately rejected.
  derived_from:
  - section_id: when-someone-intentionally-does-nothing
  stem_md: Which interpretation correctly explains Emil's and Nora's deliberate non-action?
  options:
  - id: absent-necessity
    text: Emil slipper å sykle fordi veien er glatt, og Nora slipper å kjøpe mer kaffe.
      Handlingene er derfor bare unødvendige, ikke bevisste valg.
    correct: false
    why: This treats both situations as absent necessity instead of deliberate non-action.
  - id: impossible-actions
    text: Emil kunne sykle, men veien gjør sykling umulig; Nora kunne kjøpe mer kaffe,
      men en regel gjør kjøpet umulig. De lar være å handle fordi handlingene ikke
      lenger er mulige.
    correct: false
    why: The lesson says the actions remain available; the people choose not to do
      them.
  - id: correct
    text: Emil kunne sykle, men han lar være å sykle fordi veien er glatt. Nora kunne
      kjøpe mer kaffe, men hun lar være å kjøpe mer kaffe fordi hun bestemmer seg
      for ikke å gjøre det.
    correct: true
    why: Both actions remain possible, and each person deliberately chooses not to
      perform the action.
