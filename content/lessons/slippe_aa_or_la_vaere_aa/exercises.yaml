    options:
    - slipper å
    - lar være å
    answer_index: 0
  - text_md: ' komme tidlig.'
  - text_md: ' Nora har bestemt seg for ikke å kjøpe mer kaffe, så hun '
  - blank_id: frame-choice-2
    options:
    - slipper å
    - lar være å
    answer_index: 1
  - text_md: ' kjøpe mer kaffe.'
- handle: explain_external_requirement_or_intentional_non_action
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: Read the paired situations below. In Norwegian, explain which sentence
    expresses absent necessity caused by an external arrangement and which expresses
    deliberate non-action. Add one plausible reason for each interpretation. Do not
    translate both expressions as a general negative. - Arrangøren dekker gebyret
    for Ida. Ida slipper å betale gebyret. - Jonas kan svare på meldingen, men han
    lar være å svare på meldingen.
  derived_from:
  - section_id: practice-explain-the-difference
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: Check the Norwegian response against the task and report evidence
    for each criterion. Accept natural Bokmål paraphrases, but require a clear contrast
    between externally removed necessity and deliberate choice.
  criteria:
  - id: external-arrangement
    instruction: Links the sentence with slippe å to the organizer's external arrangement
      and explains that payment is not required from Ida.
  - id: intentional-choice
    instruction: Links the sentence with la være å to Jonas's deliberate non-action
      while replying remains possible.
  - id: plausible-reasons
    instruction: Gives one plausible reason for each interpretation.
- handle: build_cause_before_choosing_phrase
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: Write two separate two-sentence situations in Norwegian. In the first,
    sentence 1 must establish that a colleague takes over a work task, and sentence
    2 must summarize the result with slipper å. In the second, sentence 1 must establish
    that you decide not to send an angry message, and sentence 2 must summarize the
    result with lar være å. Put each cause or decision before its phrase, and do not
    use either target expression until sentence 2 of its situation.
  derived_from:
  - section_id: practice-build-a-cause-before-choosing-the-phrase
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Check the Norwegian response against the two assigned situations and
    report evidence for each criterion. Accept natural present-tense Bokmål forms
    of the required expressions.
  criteria:
  - id: external-cause-before-phrase
    instruction: Establishes the colleague's takeover in sentence 1 and uses slipper
      å in sentence 2 to express absent necessity.
  - id: personal-decision-before-phrase
    instruction: Establishes the decision not to send an angry message in sentence
      1 and uses lar være å in sentence 2 to express deliberate non-action.
  - id: cause-precedes-expression
    instruction: Places each assigned cause or personal decision before the corresponding
      phrase, rather than choosing the phrase before the context is clear.
- handle: continue_saturday_preparations
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: 'Continue this Saturday preparation exchange in Norwegian with 3–5 short
    updates involving Sigrid, Nora, and Emil. Do not copy the given lines. Sigrid:
    Lokalet er allerede pyntet, så dere slipper å komme tidlig. Emil: Flott. Da lar
    jeg være å sette alarmen på seks. Nora: Jeg slipper også å hente kakene. Bakeriet
    kjører dem ut. Include at least one new task that is no longer required because
    of Sigrid, a delivery service, the weather, or another arrangement. Use slippe
    å and state the arrangement that explains it. Also include at least one action
    that Nora or Emil deliberately chooses not to perform, using la være å.'
  derived_from:
  - section_id: back-to-saturdays-event
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: Check the Norwegian continuation against the task and report evidence
    for each criterion. Accept natural Bokmål wording and inflection when the two
    meanings remain clear.
  criteria:
  - id: new-removed-requirement
    instruction: Uses a natural form of slippe å for a newly described task that is
      no longer required and explicitly includes the arrangement that removed the
      need.
  - id: intentional-non-action
    instruction: Uses a natural form of la være å for an action Nora or Emil intentionally
      chooses not to perform.
- handle: retrieve_need_or_choice_contrast
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: Write both final-review ideas in Norwegian and
    briefly explain the difference. For the first idea, describe a changed situation
    that removes the need to do a task and use the present frame slipper å. For the
    second, describe a task that remains possible but is deliberately not done and
    use the present frame lar være å. Use your own tasks rather than copying a complete
    prompt sentence, then add one brief Norwegian explanation of the contrast.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Check the Norwegian review against the task and report evidence for
    each criterion. Accept natural Bokmål paraphrases that preserve the two meanings.
  criteria:
  - id: need-meaning
    instruction: Uses slipper å for the first idea, where a changed situation removes
      the need to perform the task.
  - id: choice-meaning
    instruction: Uses lar være å for the second idea, where the task remains possible
      but is deliberately not performed.
  - id: contrast-explained
    instruction: Briefly explains in Norwegian the difference between absent necessity
      and intentional non-action.
