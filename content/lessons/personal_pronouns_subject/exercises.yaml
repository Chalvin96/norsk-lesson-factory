- handle: identify_pronoun_reference_in_cafe
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: understand
  prompt_md: 'Read the three café lines and choose the complete reference mapping.
    The goal is to identify who each pronoun represents, not to translate. Maja: «Ja,
    jeg jobber her i dag.» (Yes, I work here today.) Ali: «Jobber du her, Maja?» (Do
    you work here, Maja?) Emil, about Nora and Ali: «De er raske!» (They are quick!)
    Which mapping is correct for jeg, du, and de?'
  derived_from:
  - section_id: replacing-a-name-with-a-subject-pronoun
  stem_md: Choose the mapping that correctly identifies the speaker, listener, and
    people being discussed.
  options:
  - id: mapping-b
    text: Maja bruker «jeg» om seg selv (I); Ali bruker «du» til Nora og Ali (you,
      two or more people); Emil bruker «de» om Maja (they).
    correct: false
    why: Ali addresses Maja alone, and Emil discusses Nora and Ali.
  - id: mapping-c
    text: Maja bruker «jeg» om seg selv (I); Ali bruker «du» til Emil (you, one person);
      Emil bruker «de» om Nora og Ali (they).
    correct: false
    why: Ali addresses Maja, not Emil.
  - id: mapping-a
    text: Maja bruker «jeg» om seg selv (I); Ali bruker «du» til Maja (you, one person);
      Emil bruker «de» om Nora og Ali (they).
    correct: true
    why: Maja is speaking, Maja is addressed as one person, and Nora and Ali are being
      discussed.
