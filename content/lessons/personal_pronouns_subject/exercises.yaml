- handle: use_subject_pronouns_at_the_library
  op: write
  objective: obj-personal-pronouns-subject-01
  bloom: apply
  prompt_md: 'At a library table, write five short, simple Bokmål sentences for these
    exchanges. Use subject pronouns according to each perspective and use the library
    situation rather than the café wording: 1. Nora introduces herself and refers
    to Ali as another student. 2. Maja asks Ali, one person, whether he is ready.
    3. Jonas tells Nora and Ali together to put the books on the table. 4. Maja tells
    Jonas what Nora and Ali are doing; she is talking about them, not to them. 5.
    Nora describes a task she shares with Ali. Write only the five Norwegian sentences.'
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that preserve the required conversational role
    and subject-pronoun reference; do not require exact vocabulary beyond the requested
    library situation.
  criteria:
  - id: self-and-discussed-person
    instruction: Uses *jeg* for Nora as speaker and *han* for Ali as the male person
      being discussed in the introduction.
  - id: one-person-addressed
    instruction: Uses *du* when Maja addresses Ali, one person, in the readiness question.
  - id: group-addressed
    instruction: Uses *dere* when Jonas addresses Nora and Ali together.
  - id: group-discussed
    instruction: Uses *de* when Maja discusses Nora and Ali with Jonas.
  - id: shared-task
    instruction: Uses *vi* when Nora describes a task shared with Ali.
