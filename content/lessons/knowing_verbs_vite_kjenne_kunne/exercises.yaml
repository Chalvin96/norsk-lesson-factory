- handle: further_practice_visiting_another_town
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: Write a short Norwegian exchange with one question-and-answer pair for
    each point. Ask or state the hotel’s location or address as factual information,
    ask or state whether one friend is familiar with Bergen, and ask or state whether
    the other friend has the learned ability to drive confidently in heavy traffic.
    Keep location, familiarity, and driving ability separate.
  derived_from:
  - section_id: further-practice-in-new-situations
  response_language: 'no'
  min_words: 20
  max_words: 65
  judge_prompt: Accept natural Bokmål alternatives that preserve the three roles.
    Pass when hotel location or address is expressed as factual knowledge with vite,
    Bergen familiarity with kjenne, and learned driving ability with kan plus an infinitive.
    Do not accept a response that treats familiarity or driving skill as the hotel-location
    fact.
  criteria:
  - id: hotel-location-fact
    instruction: Keeps the hotel’s location or address as factual information and
      uses a natural form of vite for it.
  - id: bergen-familiarity
    instruction: Uses a natural form of kjenne to express personal familiarity with
      Bergen.
  - id: driving-ability
    instruction: Uses a natural form of kan with a driving infinitive to express learned
      driving ability, separately from location and familiarity.
