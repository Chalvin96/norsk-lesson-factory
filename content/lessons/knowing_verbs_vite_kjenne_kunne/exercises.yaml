- handle: checkpoint_familiarity_or_identity
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: Write exactly two short sentences in Norwegian about Lea and Mari. The
    first sentence must say that Lea knows who Mari is because she has seen Mari’s
    name on the schedule. The second must say that Lea has no personal familiarity
    with Mari because they have never spoken. Keep identity and personal familiarity
    separate.
  derived_from:
  - section_id: kjenne-being-familiar-with-someone-or-something
  response_language: 'no'
  min_words: 8
  max_words: 25
  judge_prompt: Accept natural Bokmål variants that preserve the two meanings and
    the stated context. Pass only when identity and personal familiarity appear in
    separate sentences. A factual form such as «Jeg vet hvem Mari er.» and a familiarity
    form such as «Jeg kjenner ikke Mari.» are valid evidence.
  criteria:
  - id: identity
    instruction: States that Lea knows who Mari is, using a factual identity construction
      such as «Jeg vet hvem Mari er.»
  - id: personal-familiarity
    instruction: States that Lea has no personal familiarity with Mari, using a natural
      form of kjenne such as «Jeg kjenner ikke Mari.»
  - id: separate-sentences
    instruction: Uses one sentence for identity and a different sentence for personal
      familiarity, so the two meanings are distinguished.
- handle: checkpoint_information_or_ability
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: Write two short sentences in Norwegian about Lea and the sound system.
    In the first, state that she knows how the system works because she has read and
    understood the procedure. In the second, state whether the available context supports
    saying that she can operate it. Do not claim an ability that has not been established.
  derived_from:
  - section_id: kunne-having-a-learned-skill-or-ability
  response_language: 'no'
  min_words: 10
  max_words: 40
  judge_prompt: Accept natural variants such as «Hun vet hvordan lydanlegget fungerer,
    men vi vet ikke om hun kan bruke det.» The response must express factual knowledge
    of the procedure and uncertainty about operating ability. Reject both an unsupported
    positive claim that she can operate it and an unsupported claim that she cannot.
  criteria:
  - id: procedure-knowledge
    instruction: Uses vite hvordan to state Lea’s established knowledge of how the
      sound system works.
  - id: unsupported-skill
    instruction: States that the context does not establish whether Lea can operate
      the system and does not assert that she has that ability.
- handle: checkpoint_compare_matched_situations
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: 'Write twelve short Norwegian questions: three about each topic— a colleague,
    a town, a computer program, and a musical instrument. For every topic, ask one
    question about factual information, one about personal familiarity, and one about
    a learned ability. Keep the central topic constant within each trio; natural Norwegian
    may add a necessary complement for the ability question.'
  derived_from:
  - section_id: three-questions-with-three-meanings
  response_language: 'no'
  min_words: 35
  max_words: 140
  judge_prompt: Accept natural Bokmål wording, inflection, and necessary complements.
    Pass only when all four topics have three questions and each trio clearly contains
    factual information, personal familiarity, and learned ability. The response must
    use vet for factual questions, kjenner for familiarity, and kan for ability according
    to meaning, while keeping each topic central within its trio.
  criteria:
  - id: topic-constancy
    instruction: Keeps the colleague, town, computer program, and musical instrument
      as the central topics within their respective three-question groups.
  - id: meaning-based-verb-choice
    instruction: Uses the present forms vet, kjenner, and kan for factual information,
      personal familiarity, and learned ability respectively in every topic group.
- handle: contextual_practice_lea_first_day
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: Write a short Norwegian message of four sentences about Lea after the
    community-centre event. Include a factual statement about where the cups go in
    the building, a familiarity statement about Mari and Arne after working together,
    a factual statement that Mari is on the work schedule, and an ability statement
    about making tea with the machine. Make the three kinds of knowing clear through
    your verb choices.
  derived_from:
  - section_id: back-at-the-community-centre
  response_language: 'no'
  min_words: 20
  max_words: 65
  judge_prompt: Accept natural Bokmål variants that preserve all four requested details.
    Valid evidence can include «Jeg vet hvor vi skal sette koppene», «Jeg kjenner
    både Mari og Arne litt nå», «Jeg vet at Mari står på arbeidsplanen», and «Jeg
    kan lage te med denne maskinen». Check that factual information uses vite, familiarity
    uses kjenne, and practical ability uses kunne.
  criteria:
  - id: building-fact
    instruction: States a factual detail about where the cups belong in the building
      using a natural form of vite.
  - id: organiser-familiarity
    instruction: States that Lea is personally familiar with Mari and Arne after working
      together using a natural form of kjenne.
  - id: schedule-fact
    instruction: States the schedule information that Mari is on the work schedule
      using a natural factual form of vite.
  - id: kitchen-skill
    instruction: States that Lea can make tea with the machine using a natural form
      of kunne, normally kan with an infinitive.
