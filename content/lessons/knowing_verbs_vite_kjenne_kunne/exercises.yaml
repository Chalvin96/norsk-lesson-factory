- handle: retrieval_review_three_kinds
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: 'Choose one coherent situation that supports all three kinds of knowledge.
    Write three short Norwegian statements: one fact someone knows, one person or
    place someone is familiar with, and one learned skill someone possesses. Then
    write a brief Norwegian explanation for each statement, explaining why it requires
    vite, kjenne, or kunne.'
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 30
  max_words: 95
  judge_prompt: Accept any coherent situation and natural Bokmål wording. Pass only
    when the response contains one concrete factual statement, one personal or place
    familiarity statement, and one learned-skill statement, followed by a separate
    explanation for each choice. The explanations must connect fact to vite, familiarity
    to kjenne, and ability to kunne; a bare list without explanations is insufficient.
  criteria:
  - id: known-fact
    instruction: States one concrete fact someone knows using a natural present form
      of vite, such as vet.
  - id: familiar-person-or-place
    instruction: Names a person or place someone is familiar with using a natural
      present form of kjenne, such as kjenner.
  - id: learned-skill
    instruction: States one learned skill someone possesses using a natural present
      form of kunne, such as kan with an infinitive.
  - id: choice-explanations
    instruction: Explains separately in Norwegian why each of the three statements
      requires vite, kjenne, or kunne according to its meaning.
