- handle: notice_comparison_meaning
  op: categorize
  objective: obj-adjective-and-adverb-comparison-01
  bloom: analyze
  prompt_md: Mina and Jonas are evaluating bicycles, routes, and cycling styles. Classify
    each Norwegian statement as a base description with no comparison, a comparison
    between two alternatives, or the highest or lowest degree in a group. Do not infer
    the category from a word ending alone.
  explanation_md: "A base form describes without comparing, a comparative sets two alternatives against each other, and a superlative identifies an extreme within a group."
  derived_from:
  - section_id: what-comparison-forms-do
  buckets:
  - bucket_id: base-description
    label: Base description (no comparison)
  - bucket_id: two-way-comparison
    label: Comparison between two alternatives
  - bucket_id: group-extreme
    label: Highest or lowest degree in a group
  items:
  - item_id: statement-1
    text: Sykkelen er lett.
    bucket_id: base-description
  - item_id: statement-2
    text: Den blå sykkelen er lettere enn den røde.
    bucket_id: two-way-comparison
  - item_id: statement-3
    text: Den blå sykkelen er lettest.
    bucket_id: group-extreme
  - item_id: statement-4
    text: Jonas sykler fort.
    bucket_id: base-description
  - item_id: statement-5
    text: Jonas sykler fortere enn Mina.
    bucket_id: two-way-comparison
  - item_id: statement-6
    text: Jonas sykler fortest.
    bucket_id: group-extreme
