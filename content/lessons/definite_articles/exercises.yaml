- handle: retrieve-definite_noun_patterns
  op: write
  objective: obj-definite-articles-01
  bloom: apply
  prompt_md: 'After a picnic, write brief Norwegian statements identifying where these
    known things are in the park: one basket, one book introduced as `ei bok`, one apple, and groups of cups
    and bags. Write one statement for each item or group. Retrieve the taught definite
    singular forms for the individual objects and the regular definite plural forms
    for the groups. Express definiteness through the noun endings, not a separate word
    for English the.'
  derived_from:
  - section_id: final-retrieval-and-review
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Require one natural Norwegian location statement for each individual object and
    group. Accept varied natural Bokmål location wording and any natural Norwegian
    noun for basket when its definite singular form ends in -en. Require the taught
    feminine -a form for book, neuter -et for apple, and regular plural -ene for cups
    and bags. Do not count a separate English-style article as a definite noun ending.
  criteria:
  - id: singular-endings
    instruction: Uses definite singular forms for the basket, book, and apple, with
      -en, -a, and -et respectively.
  - id: plural-endings
    instruction: Uses definite plural forms for the cups and bags with the regular
      -ene pattern.
  - id: location-statements
    instruction: Gives one natural Norwegian location statement for each of the three
      individual objects and the two groups.
  - id: noun-ending-definiteness
    instruction: Expresses the meaning of the through noun endings rather than through
      a separate article.
