- handle: notice-known-singular-nouns
  op: choose
  objective: obj-definite-articles-01
  bloom: understand
  prompt_md: In this lost-property situation, koppen, boka, and posen are particular
    objects at the table already known to Nora and Amir. Choose the interpretation
    that identifies these forms and explains why each refers to a known object.
  derived_from:
  - section_id: checkpoint-noticing-known-things
  stem_md: Which explanation best matches the stated situation?
  options:
  - id: known-particular-objects
    text: Koppen, boka og posen er de bestemte tingene ved bordet som Nora og Amir
      allerede kjenner. — The cup, the book, and the bag are the particular things
      at the table that Nora and Amir already know.
    correct: true
    why: The three nouns identify particular objects already established in the stated
      situation, so their definite endings carry the meaning of the.
  - id: first-mentions
    text: Koppen, boka og posen er nye ting som Nora og Amir ikke kjenner ennå. —
      The cup, the book, and the bag are new things that Nora and Amir do not know
      yet.
    correct: false
    why: This option treats the already identified objects as new or unknown.
  - id: indefinite-known-objects
    text: En kopp, ei bok og en pose er de bestemte tingene som Nora og Amir allerede
      kjenner. — A cup, a book, and a bag are the definite things that Nora and Amir
      already know.
    correct: false
    why: The indefinite forms introduce new or unspecified objects; they do not mark
      the known objects in the stated situation.
- handle: form-definite-singular-endings
  op: recall_fill
  objective: obj-definite-articles-01
  bloom: apply
  prompt_md: Nora is listing individual objects after the cooking class. Each object
    is already identified. Complete each sentence with the taught definite singular
    form, without adding a separate word for English the.
  explanation_md: "Attach the definite ending to the noun: stolen, boka, kartet; do not add an extra article for English the."
  derived_from:
  - section_id: checkpoint-forming-definite-singular-nouns
  audio_target: "I rommet står stolen ved døra. På stolen ligger boka ved døra. I veska ligger kartet ved boka."
  segments:
  - text_md: 'For en stol: I rommet står '
  - blank_id: singular-masculine
    options:
    - stolene
    - stolen
    - en stol
    answer_index: 1
  - text_md: ' ved døra. For ei bok: På stolen ligger '
  - blank_id: singular-feminine
    options:
    - ei bok
    - bøkene
    - boka
    answer_index: 2
  - text_md: ' ved døra. For et kart: I veska ligger '
  - blank_id: singular-neuter
    options:
    - et kart
    - kartet
    answer_index: 1
  - text_md: ' ved boka.'
- handle: choose-singular-definiteness-from-context
  op: choose
  objective: obj-definite-articles-01
  bloom: understand
  prompt_md: A visitor enters a classroom and notices one new object at a time. Choose
    the complete set that uses an indefinite singular noun for each first mention
    and a definite singular noun for the later reference to the same object.
  derived_from:
  - section_id: checkpoint-choosing-meaning-not-only-endings
  stem_md: Which set keeps the new-object-to-known-object contrast in all three pairs?
  options:
  - id: definite-then-indefinite
    text: På bordet ligger nøkkelen. En nøkkel er ved døra. — The key is on the table;
      a key is by the door. I rommet står veska. Ei veske er ved bordet. — The handbag
      is in the room; a handbag is by the table. På bordet ligger kartet. Et kart
      er i veska. — The map is on the table; a map is in the handbag.
    correct: false
    why: This reverses the required order by using definite forms for first mentions
      and indefinite forms for later references.
  - id: indefinite-throughout
    text: På bordet ligger en nøkkel. En nøkkel er ved døra. — A key is on the table;
      a key is by the door. I rommet står ei veske. Ei veske er ved bordet. — A handbag
      is in the room; a handbag is by the table. På bordet ligger et kart. Et kart
      er i veska. — A map is on the table; a map is in the handbag.
    correct: false
    why: The later sentences still use indefinite forms, so they do not mark the already
      identified objects.
  - id: indefinite-then-definite
    text: På bordet ligger en nøkkel. Nøkkelen er ved døra. — A key is on the table;
      the key is by the door. I rommet står ei veske. Veska er ved bordet. — A handbag
      is in the room; the handbag is by the table. På bordet ligger et kart. Kartet
      er i veska. — A map is on the table; the map is in the handbag.
    correct: true
    why: Each first mention is indefinite, and the second sentence uses the definite
      form for the same identifiable object.
