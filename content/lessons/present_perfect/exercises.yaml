- handle: present_relevance_choice
  op: choose
  objective: obj-present-perfect-01
  bloom: analyze
  prompt_md: Classify the four situations and choose when har plus a past participle
    is appropriate.
  derived_from:
  - section_id: sec-present-relevance-finished-occasion
  stem_md: 'A is current coffee availability: Jeg har kjøpt kaffe. B is coffee bought
    yesterday: Jeg kjøpte kaffe i går. C asks about seeing a film: Har du sett den
    filmen? D asks about Friday: Så du den filmen på fredag.'
  options:
  - id: current-or-experience
    text: A og C har forbindelse med nå og bruker har + partisipp; B og D gjelder
      ferdige fortider. (A and C connect to now and use har + past participle; B and
      D concern finished past occasions.)
    correct: true
    why: A reports a current result and C asks about experience; B and D specify finished
      past occasions.
  - id: all-four
    text: Alle fire bruker har + partisipp. (All four use har + past participle.)
    correct: false
    why: B and D locate events in finished past times.
  - id: finished-only
    text: Bare B og D bruker har + partisipp. (Only B and D use har + past participle.)
    correct: false
    why: B and D are the finished-time contrasts, not the present-relevant cases.
