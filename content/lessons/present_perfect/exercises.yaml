- handle: current_result_connection
  op: choose
  objective: obj-present-perfect-01
  bloom: understand
  prompt_md: Read the statements and choose the interpretation that explains why the
    present perfect is useful now.
  derived_from:
  - section_id: sec-completed-action-result-now
  stem_md: Jeg har mistet nøkkelen. Vi har laget middag. Jeg har lest boka, så du
    kan låne den.
  options:
  - id: finished-time
    text: Det viktigste er bare en ferdig fortid, uten forbindelse til nå. (The only
      important point is a finished past, without a connection to now.)
    correct: false
    why: The lesson presents these statements through their present results.
  - id: result-now
    text: Nøkkelen er borte nå, middagen er klar nå, og boka kan lånes nå. (The key
      is unavailable now, dinner is ready now, and the book can be borrowed now.)
    correct: true
    why: The present results are the reason for choosing the present perfect.
- handle: experience_up_to_now
  op: choose
  objective: obj-present-perfect-01
  bloom: understand
  prompt_md: A speaker asks about experience at any time up to now, not about one
    particular finished occasion. Which sentence fits?
  derived_from:
  - section_id: sec-experience-up-to-now
  stem_md: Choose the sentence that asks about experience up to the present.
  options:
  - id: friday
    text: Så du den filmen på fredag? (Did you see that film on Friday?)
    correct: false
    why: The finished occasion is located on Friday.
  - id: last-year
    text: Hun var i Tromsø i fjor. (She was in Tromsø last year.)
    correct: false
    why: The finished occasion is located in last year.
  - id: experience
    text: Har du spist norsk brunost? (Have you eaten Norwegian brown cheese?)
    correct: true
    why: The question asks whether the experience has happened at any time up to now.
