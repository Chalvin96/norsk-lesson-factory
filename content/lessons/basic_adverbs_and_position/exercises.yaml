  bloom: apply
  prompt_md: Build the neutral sentence meaning “Erik always arrives late.” Place
    alltid after the verb.
  explanation_md: "In a main clause with a simple verb, alltid normally follows the finite verb: Erik kommer alltid sent."
  derived_from:
  - section_id: position-of-frequency-and-negative-adverbs
  tokens:
  - token_id: tok-kommer
    text: kommer
  - token_id: tok-alltid
    text: alltid
  - token_id: tok-sent
    text: sent.
  - token_id: tok-erik
    text: Erik
  answer_order:
  - tok-erik
  - tok-kommer
  - tok-alltid
  - tok-sent
