- handle: anchor_adverb_noticing
  op: match_pairs
  objective: obj-basic-adverbs-and-position-01
  bloom: remember
  prompt_md: Match each adverb in the supplied sentences to the information it contributes.
  explanation_md: "Ofte marks frequency, ikke negation, langsomt manner, and nå time; classify the information each word adds to its sentence."
  derived_from:
  - section_id: what-an-adverb-does
  left:
  - left_id: adverb-ofte
    text: ofte — Jeg kommer ofte sent.
  - left_id: adverb-ikke
    text: ikke — Jeg er ikke sen i dag.
  - left_id: adverb-langsـomt
    text: langsomt — Jeg arbeider langsomt.
  - left_id: adverb-naa
    text: nå — Jeg jobber stille nå.
  right:
  - right_id: meaning-frequency
    text: often — frequency
  - right_id: meaning-negation
    text: not — negation
  - right_id: meaning-manner
    text: slowly — manner
  - right_id: meaning-time
    text: now — time
  pairs:
  - left_id: adverb-ofte
    right_id: meaning-frequency
  - left_id: adverb-ikke
    right_id: meaning-negation
  - left_id: adverb-langsـomt
    right_id: meaning-manner
  - left_id: adverb-naa
    right_id: meaning-time
- handle: quality_or_action_form
  op: recall_fill
  objective: obj-basic-adverbs-and-position-01
  bloom: apply
  prompt_md: Complete each pair with the supplied adjective's correct form. Use the
    adjective after er and the adverbial form for the action.
  explanation_md: "After er, the word describes the subject and stays adjectival; with an action verb, use the adverbial form, often with -t."
  derived_from:
  - section_id: using-an-adjective-to-describe-an-action
  audio_target: "Bilen er rask. Bilen kjører raskt. Sangeren er god. Sangeren synger godt."
