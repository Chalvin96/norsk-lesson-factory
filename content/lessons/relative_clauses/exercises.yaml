- handle: describe_workshop_people_and_things
  op: write
  objective: obj-relative-clauses-01
  bloom: apply
  prompt_md: Write two connected Norwegian sentences for a newly arrived volunteer.
    Identify Erik as the person who can help with the lamp, and identify a lamp that
    you want to repair. Use a complete som-clause in each sentence. Do not repeat
    the described noun or an unnecessary pronoun inside its som-clause.
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: workshop-identification
    instruction: Identifies Erik and the lamp with complete som-clauses in two connected
      Norwegian sentences.
  - id: no-unnecessary-repetition
    instruction: Does not repeat either described noun or an unnecessary pronoun inside
      its som-clause.
  derived_from:
  - section_id: back-at-workshop
- handle: transfer_som_to_station_scene
  op: write
  objective: obj-relative-clauses-01
  bloom: apply
  prompt_md: At a busy railway station, write three short Norwegian sentences for
    a friend. Identify (1) the man who is standing by the ticket machine, (2) the
    jacket that is easy to recognize, and (3) the suitcase that Nora has with her.
    Make the first two described nouns perform the action in their som-clauses, and
    make Nora perform the action in the third clause. Keep every som-clause next to
    the noun phrase it describes. Use original wording.
  response_language: 'no'
  min_words: 20
  max_words: 55
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: station-identification
    instruction: Identifies all three specified station people or things with clear
      som-clauses.
  - id: actor-patterns
    instruction: Uses noun + som + verb for the first two descriptions and noun +
      som + subject + verb for the third description.
  - id: clear-attachment
    instruction: Keeps each som-clause next to the noun phrase it describes.
  derived_from:
  - section_id: transfer-new-situation
- handle: retrieve_core_som_patterns
  op: write
  objective: obj-relative-clauses-01
  bloom: apply
  prompt_md: 'Choose a familiar place other than a workshop or railway station. First
    write both core som patterns: noun + som + verb, and noun + som + subject + verb.
    Then write two complete Norwegian sentences
    about people or things in that place: one where the described noun performs the
    action, and one where another person acts on the described noun. Use som to add
    clear identifying information. Do not repeat the described noun or an unnecessary
    pronoun inside either som-clause.'
  response_language: 'no'
  min_words: 25
  max_words: 65
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: core-pattern-recall
    instruction: 'Reconstructs both core structures with som: noun + som + verb, and
      noun + som + subject + verb.'
  - id: subject-relative-example
    instruction: Provides a fresh Norwegian sentence where the described person or
      thing performs the action after som.
  - id: object-relative-example
    instruction: Provides a fresh Norwegian sentence where another person acts on
      the described person or thing, with that subject retained after som.
  - id: no-repeated-reference
    instruction: Avoids unnecessary repeated nouns or pronouns inside both relative
      clauses.
  derived_from:
  - section_id: retrieval-and-review
