  derived_from:
  - section_id: relative-clause-subject-action
- handle: distinguish_relative_clause_actors
  op: choose
  objective: obj-relative-clauses-01
  bloom: analyze
  prompt_md: Which option correctly interprets who performs the action in these paired
    relative clauses? A. «Jeg kjenner mannen som reparerer lampen.» B. «Jeg kjenner
    mannen som Lea møtte.»
  options:
  - id: correct
    text: 'A: Mannen reparerer lampen. B: Lea møtte mannen. — A: The man repairs the
      lamp. B: Lea met the man.'
    correct: true
    why: In A, the noun before som performs the action. In B, Lea is the subject after
      som and the man receives the action.
  - id: incorrect
    text: 'A: Lea reparerer lampen. B: Mannen møtte Lea. — A: Lea repairs the lamp.
      B: The man met Lea.'
    correct: false
    why: This changes the actor in both clauses instead of following the words after
      som.
  derived_from:
  - section_id: relative-clause-object-action
- handle: build_object_relative_clauses
  op: build
  objective: obj-relative-clauses-01
  bloom: apply
  prompt_md: 'Combine these notes into one Norwegian sentence: «Dette er boka.» «Amir
    anbefalte boka.» Keep Amir after som and do not repeat boka with an object pronoun.'
  tokens:
  - token_id: object-1
    text: Dette
  - token_id: object-2
    text: er
  - token_id: object-3
    text: boka
  - token_id: object-4
    text: som
  - token_id: object-5
    text: Amir
  - token_id: object-6
    text: anbefalte.
  answer_order:
  - object-1
  - object-2
  - object-3
  - object-4
  - object-5
  - object-6
  explanation_md: "When the shared noun is the object inside the relative clause, som may be omitted; the subject inside the clause remains overt."
  derived_from:
  - section_id: relative-clause-object-action
