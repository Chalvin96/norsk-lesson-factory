- handle: notice_som_connections
  op: choose
  objective: obj-relative-clauses-01
  bloom: understand
  prompt_md: Which option correctly identifies the person or thing described by each
    som-clause in this workshop dialogue? 1. «Hvem er mannen som snakker med Nora?»
    2. «Det er han som har nøkkelen til verktøyrommet.» 3. «Jeg trenger en lader som
    passer til denne PC-en.» 4. «Det ligger en lader i skapet som står ved vinduet.»
    5. «Er det skapet som ikke kan låses?» 6. «kvinnen som du møtte ved inngangen»
    7. «en lampe som jeg vil reparere»
  options:
  - id: incorrect
    text: '1: Nora («snakker med Nora»); 2: nøkkelen («har nøkkelen til verktøyrommet»);
      3: denne PC-en («passer til denne PC-en»); 4: en lader («står ved vinduet»);
      5: skapet («ikke kan låses»); 6: du («du møtte ved inngangen»); 7: jeg («jeg
      vil reparere») — 1: Nora; 2: the key; 3: this computer; 4: a charger; 5: the
      cupboard; 6: you; 7: I.'
    correct: false
    why: This assigns several clauses to a person or thing inside the clause instead
      of to the noun phrase being described.
  - id: correct
    text: '1: mannen («snakker med Nora»); 2: han («har nøkkelen til verktøyrommet»);
      3: en lader («passer til denne PC-en»); 4: skapet («står ved vinduet»); 5: skapet
      («ikke kan låses»); 6: kvinnen («du møtte ved inngangen»); 7: en lampe («jeg
      vil reparere») — 1: the man; 2: him; 3: a charger; 4: the cupboard; 5: the cupboard;
      6: the woman; 7: a lamp.'
    correct: true
    why: Each listed noun phrase is the person or thing that the following som-clause
      identifies.
  derived_from:
  - section_id: first-day-community-workshop
- handle: build_subject_relative_clauses
  op: build
  objective: obj-relative-clauses-01
  bloom: apply
  prompt_md: 'Combine these notes into one Norwegian sentence: «Vi bruker et program.»
    «Programmet fungerer på gamle PC-er.» Use noun + som + verb and do not add another
    subject pronoun after som.'
  tokens:
  - token_id: subject-1
    text: Vi
  - token_id: subject-2
    text: bruker
  - token_id: subject-3
    text: et
  - token_id: subject-4
    text: program
  - token_id: subject-5
    text: som
  - token_id: subject-6
    text: fungerer
  - token_id: subject-7
    text: på
  - token_id: subject-8
    text: gamle
  - token_id: subject-9
    text: PC-er.
  answer_order:
  - subject-1
  - subject-2
  - subject-3
  - subject-4
  - subject-5
  - subject-6
  - subject-7
  - subject-8
  - subject-9
  explanation_md: "Som introduces the relative clause and represents the described noun; any required preposition remains with its verb inside the clause."
  derived_from:
  - section_id: relative-clause-subject-action
- handle: repair_extra_subjects
  op: find_fix
  objective: obj-relative-clauses-01
  bloom: analyze
  prompt_md: Select the one token that is wrong/needs changing.
  tokens:
  - token_id: extra-1
    text: Jeg
  - token_id: extra-2
    text: kjenner
  - token_id: extra-3
    text: en
  - token_id: extra-4
    text: mann
  - token_id: extra-5
    text: som
  - token_id: extra-6
    text: han
  - token_id: extra-7
    text: jobber
  - token_id: extra-8
    text: her.
  error_token_id: extra-6
  feedback: Remove the unnecessary subject pronoun; som already represents the person
