- handle: select_modal_from_context
  op: choose
  objective: obj-modal-verbs-basic-01
  bloom: understand
  prompt_md: 'Choose the set of four Norwegian sentences that matches the situations
    in order: 1. Jonas is able to make dinner. 2. Jonas wants to make dinner. 3. Jonas
    has to make dinner. 4. Jonas is going to make dinner.'
  derived_from:
  - section_id: sec-choice-changes-the-message
  stem_md: Select the set with the correct modal for each meaning and a bare infinitive
    after every modal.
  options:
  - id: marker-added
    text: Jonas kan å lage middag. Jonas vil å lage middag. Jonas må å lage middag.
      Jonas skal å lage middag.
    correct: false
    why: The infinitive marker å must not appear after these modal verbs.
  - id: meanings-reversed
    text: Jonas vil lage middag. Jonas kan lage middag. Jonas skal lage middag. Jonas
      må lage middag.
    correct: false
    why: The modal choices do not match the four meanings in order.
  - id: all-four-correct
    text: Jonas kan lage middag. Jonas vil lage middag. Jonas må lage middag. Jonas
      skal lage middag.
    correct: true
    why: The modals match ability, desire, necessity, and plan in order, and each
      is followed directly by lage.
