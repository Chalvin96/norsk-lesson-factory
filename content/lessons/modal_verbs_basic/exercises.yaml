- handle: contrast_vil_and_ma
  op: choose
  objective: obj-modal-verbs-basic-01
  bloom: understand
  prompt_md: 'Choose the option that matches both situations, in order: 1. Nora wants
    to go home. 2. Nora has to go home.'
  derived_from:
  - section_id: sec-ma-necessity
  stem_md: Choose the Norwegian sentences that express the two meanings in the stated
    order.
  options:
  - id: vil-then-ma
    text: Nora vil gå hjem. Nora må gå hjem.
    correct: true
    why: The first sentence uses vil for desire; the second uses må for necessity.
      Both use the bare infinitive gå.
  - id: ma-then-vil
    text: Nora må gå hjem. Nora vil gå hjem.
    correct: false
    why: The meanings are in the opposite order.
