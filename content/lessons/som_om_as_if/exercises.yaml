- handle: notice_imagined_resemblance
  op: choose
  objective: obj-som-om-as-if-01
  bloom: understand
  prompt_md: 'Read the two office comments. Choose the interpretation that identifies
    the observable behaviour and imagined situation in both comments. Mina: «Erik
    smiler som om ingenting har skjedd.» Jonas: «Erik ser ut som om han ikke er bekymret.»'
  derived_from:
  - section_id: checkpoint-notice-imagined-resemblance
  stem_md: Which interpretation correctly explains both comments?
  options:
  - id: facts
    text: Mina vet at ingenting har skjedd, og Jonas vet at Erik ikke er bekymret.
    correct: false
    why: It turns both imagined situations into facts and removes the comparison meaning.
  - id: question-condition
    text: Mina spør om ingenting har skjedd, og Jonas beskriver hva som skjer hvis
      Erik ikke er bekymret.
    correct: false
    why: It replaces imagined resemblance with an embedded question and a condition.
  - id: observation-only
    text: Mina og Jonas legger merke til Erik, men de trekker ingen sammenligning
      med en forestilt situasjon.
    correct: false
    why: It mentions observation but supplies no imagined situation for either comment.
  - id: correct
    text: Mina kan observere at Erik smiler som om ingenting har skjedd; dette er
      en forestilt sammenligning, ikke et faktum. Jonas kan observere at Erik ser
      ut som om han ikke er bekymret; også dette er en forestilt sammenligning, ikke
      et faktum.
    correct: true
    why: It identifies both observable behaviours and both imagined situations, and
      it treats neither imagined situation as established fact.
- handle: distinguish_comparison_question_condition
  op: recall_fill
  objective: obj-som-om-as-if-01
  bloom: understand
  prompt_md: 'Complete each context with the connector that matches its meaning: an
    imagined resemblance, an embedded yes-or-no question, or a condition.'
  explanation_md: "Som om introduces an apparent or imagined comparison, rather than a factual reason, condition, or question."
  derived_from:
  - section_id: checkpoint-distinguish-comparison-question-condition
  audio_target: "Han smiler som om ingenting har skjedd. Vi finner ut om toget kommer. Vi går inn hvis toget kommer."
  segments:
  - text_md: 'Han smiler '
  - blank_id: comparison-connector
    options:
    - som om
    - om
    - hvis
    answer_index: 0
  - text_md: ' ingenting har skjedd. Vi finner ut '
  - blank_id: embedded-question-connector
    options:
    - som om
    - om
    - hvis
    answer_index: 1
  - text_md: ' toget kommer. Vi går inn '
  - blank_id: condition-connector
    options:
    - som om
    - om
    - hvis
    answer_index: 2
  - text_md: ' toget kommer.'
