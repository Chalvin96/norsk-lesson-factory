- handle: interpret_office_follow_up
  op: write
  objective: obj-som-om-as-if-01
  bloom: apply
  prompt_md: After Erik’s result, answer in Norwegian. Explain the difference between
    om in å vite om noe skjedde and som om in å smile som om ingenting har skjedd.
    Then write one additional sentence about Erik’s behaviour using som om for an
    imagined comparison.
  derived_from:
  - section_id: checkpoint-interpret-office-follow-up
  response_language: 'no'
  min_words: 18
  max_words: 40
  judge_prompt: Check that the response explains the two connector meanings and includes
    one additional natural Norwegian sentence with som om. Accept natural wording
    variants that preserve the distinction and imagined meaning; do not require exact
    wording.
  criteria:
  - id: connector-meaning-boundary
    instruction: Explains in Norwegian that om introduces whether something happened,
      while som om presents an imagined comparison.
  - id: erik-behaviour-sentence
    instruction: Writes one additional natural Norwegian sentence about Erik’s behaviour
      using som om to connect an observable behaviour with an imagined situation.
- handle: transfer_som_om_station_scene
  op: write
  objective: obj-som-om-as-if-01
  bloom: apply
  prompt_md: 'Write 3–4 short Norwegian sentences about this station scene: the departure
    board has stopped updating; one traveller repeatedly checks the time; another
    unpacks food for a long wait; and a railway employee continues working calmly.
    The travellers do not know whether the train has been cancelled. Use som om in
    a comparison for each visible behaviour. Use these familiar imagined-clause ideas:
    toget er forsinket, det blir lenge å vente, and ingenting har skjedd.'
  derived_from:
  - section_id: cumulative-transfer-a-delayed-train
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check that the response includes all three observations and uses som
    om to connect each visible behaviour with an imagined situation. Accept natural
    Norwegian variants that preserve the three requested meanings and the target construction;
    do not require exact wording.
  criteria:
  - id: station-observations
    instruction: Includes repeated time-checking, unpacking food for a long wait,
      and the railway employee working calmly.
  - id: station-som-om-comparisons
    instruction: Uses som om with imagined clauses expressing a delayed train, a long
      wait, and nothing having happened.
- handle: retrieve_som_om_boundary
  op: write
  objective: obj-som-om-as-if-01
  bloom: apply
  prompt_md: Answer in Norwegian. State when Norwegian uses
    som om. Write one sentence about behaviour or appearance using som om. Briefly
    explain why your sentence expresses a comparison with an imagined situation, not
    a condition with hvis or an embedded yes-or-no question with om.
  derived_from:
  - section_id: retrieval-review-som-om-boundary
  response_language: 'no'
  min_words: 18
  max_words: 45
  judge_prompt: Check for the rule, one Norwegian sentence using som om, and a brief
    meaning boundary explanation. Accept natural Norwegian wording variants that preserve
    the comparison, condition, and embedded-question distinction.
  criteria:
  - id: rule-and-application
    instruction: States that som om links observable behaviour or appearance to an
      imagined situation and uses som om in one natural Norwegian sentence.
  - id: meaning-boundary
    instruction: Explains why the sentence expresses imagined resemblance rather than
      a condition with hvis or an embedded yes-or-no question with om.
