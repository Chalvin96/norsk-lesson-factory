- handle: five_connections_from_one_evening
  op: write
  objective: obj-coordinating-conjunctions-01
  bloom: apply
  prompt_md: Write five short Norwegian sentences about one evening involving food,
    weather, transport, and a change of plan. Write one sentence with og for addition,
    one with men for contrast, one with eller for choice, one with for for a reason,
    and one with så for a result.
  derived_from:
  - section_id: transfer-to-new-situation
  response_language: 'no'
  min_words: 20
  max_words: 70
  judge_prompt: Check that the response contains five short Norwegian sentences and
    report evidence for each criterion. Judge each conjunction by the relationship
    it creates. Do not score vocabulary variety.
  criteria:
  - id: og-addition
    instruction: Contains one sentence using og to express addition.
  - id: men-contrast
    instruction: Contains one sentence using men to express contrast.
  - id: eller-choice
    instruction: Contains one sentence using eller to present alternatives.
  - id: for-reason
    instruction: Contains one sentence placing a statement or action before for and
      a logical reason after it.
  - id: sa-result
    instruction: Contains one sentence placing a situation before så and a logical
      result after it.
