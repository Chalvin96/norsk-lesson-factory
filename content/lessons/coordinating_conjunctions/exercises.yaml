- handle: notice_addition
  op: choose
  objective: obj-coordinating-conjunctions-01
  bloom: understand
  prompt_md: Choose the sentence where both items belong together and og expresses
    simple addition.
  derived_from:
  - section_id: adding-with-og
  stem_md: Mina wants both coffee and cake. Which sentence matches?
  options:
  - id: addition
    text: Mina kjøper kaffe og kake.
    correct: true
    why: Both items are included, so og expresses addition.
  - id: reason
    text: Mina kjøper kaffe, for hun er trøtt.
    correct: false
    why: For introduces a reason.
  - id: choice
    text: Mina kjøper kaffe eller kake.
    correct: false
    why: Eller presents the items as alternatives.
  - id: result
    text: Mina er trøtt, så hun kjøper kaffe.
    correct: false
    why: Så introduces a result.
  - id: contrast
    text: Mina kjøper kaffe, men ikke kake.
    correct: false
    why: Men introduces a contrast rather than simple addition.
