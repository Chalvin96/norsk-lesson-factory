- handle: trip_plan_response_transfer
  op: write
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: 'Answer all six trip questions in Norwegian. The fact after each question
    tells the intended meaning. Write a natural complete response beginning with Ja,
    Nei, or Jo. For positive questions, use Ja for yes and Nei for no. For negative
    questions containing ikke, use Jo when the fact is yes and Nei when the fact is
    no. Include ikke in negative clauses. 1. Fact: You are going on a trip on Sunday.
    Question: «Skal du på tur på søndag?» 2. Fact: You are not driving to the trip.
    Question: «Kjører du til turen?» 3. Fact: You are bringing food. Question: «Tar
    du ikke med mat?» 4. Fact: You are not arriving early. Question: «Kommer du ikke
    tidlig?» 5. Fact: You are bringing coffee. Question: «Tar du med kaffe?» 6. Fact:
    You are going on a trip on Sunday. Question: «Skal du ikke på tur på søndag?»'
  response_language: 'no'
  judge_prompt: Check all six trip answers and report evidence for each criterion.
    The key is item 1 Ja with an affirmative clause, item 2 Nei with a negative clause,
    item 3 Jo with an affirmative clause, item 4 Nei with a negative clause, item
    5 Ja with an affirmative clause, and item 6 Jo with an affirmative clause. Negative
    clauses must contain ikke. Accept natural Norwegian wording variants that preserve
    each supplied fact.
  criteria:
  - id: trip-response-word
    instruction: Begins item 1 with Ja, item 2 with Nei, item 3 with Jo, item 4 with
      Nei, item 5 with Ja, and item 6 with Jo, matching question polarity and intended
      fact.
  - id: trip-complete-meaning
    instruction: Each complete response preserves the supplied trip fact; negative
      facts are expressed with ikke, and natural Norwegian wording variants are accepted.
  derived_from:
  - section_id: trip-plan-response-transfer-practice
- handle: trip_plan_addition_transfer
  op: write
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: Respond to each traveler statement in Norwegian by adding yourself to
    the same fact. With positive statements, use også. With negative statements, retain
    ikke and use heller, or use the short personal reply Ikke jeg heller when it fits.
    Use short and complete forms where natural. 1. «Mina skal på tur på søndag.» 2.
    «Oskar tar med mat.» 3. «Lise kommer ikke tidlig.» 4. «Per kjører ikke til turen.»
    5. «Nora tar med kaffe.» 6. «Jonas liker ikke kaffe.»
  response_language: 'no'
  judge_prompt: Check all six trip additions and report evidence for each criterion.
    Items 1, 2, and 5 are positive and require a natural addition with også. Items
    3, 4, and 6 are negative and require heller while retaining ikke, or the accepted
    short reply Ikke jeg heller when adding the learner. Accept short and complete
    forms and natural wording variants.
  criteria:
  - id: trip-addition-word
    instruction: Uses også for the positive traveler statements in items 1, 2, and
      5; uses heller with retained ikke, or Ikke jeg heller, for the negative statements
      in items 3, 4, and 6. The added response preserves the same fact.
  derived_from:
  - section_id: trip-plan-addition-transfer-practice
