- handle: positive_question_response
  op: write
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: 'Answer all five positive yes/no questions in Norwegian. For each item,
    give a short answer (Ja or Nei) and then a matching complete sentence. You may
    combine them naturally, for example Ja, jeg kommer på filmkvelden. Use ikke in
    every complete negative answer. Only response polarity is scored; ordinary vocabulary
    variation is allowed. 1. Fact: You are coming to film night. Question: «Kommer
    du på filmkvelden?» 2. Fact: You do not eat fish. Question: «Spiser du fisk?»
    3. Fact: You work today. Question: «Jobber du i dag?» 4. Fact: You are not at
    home. Question: «Er du hjemme?» 5. Fact: You do not like coffee. Question: «Liker
    du kaffe?»'
  response_language: 'no'
  judge_prompt: Check all five answers and report evidence for each criterion. Items
    1 and 3 require Ja with affirmative meaning. Items 2, 4, and 5 require Nei with
    negative meaning, and their complete sentences must contain ikke. Accept natural
    Norwegian wording variants and do not score vocabulary or formatting.
  criteria:
  - id: response-polarity
    instruction: Uses Ja for items 1 and 3 and Nei for items 2, 4, and 5, matching
      each supplied fact.
  - id: negative-ikke
    instruction: Includes ikke in the complete sentences for items 2, 4, and 5 and
      preserves their negative meanings; accept natural wording variants.
  derived_from:
  - section_id: positive-question-response-practice
- handle: negative_question_meaning
  op: choose
  objective: obj-answering-ja-nei-jo-01
  bloom: understand
  prompt_md: Choose the Norwegian response that shows whether the respondent confirms
    or contradicts the negative idea.
  stem_md: Kari has said that she is coming to film night. The question is «Kommer
    Kari ikke på filmkvelden?» Choose the response that matches this fact.
  options:
  - id: contradicts-negative
    text: Jo, Kari kommer på filmkvelden.
    correct: true
    why: Jo contradicts the negative question and confirms that Kari is coming.
  - id: confirms-negative
    text: Nei, Kari kommer ikke på filmkvelden.
    correct: false
    why: Nei confirms the negative idea, but the context says that Kari is coming.
  derived_from:
  - section_id: negative-question-meaning-practice
