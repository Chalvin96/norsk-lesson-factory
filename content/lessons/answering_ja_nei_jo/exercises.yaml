- handle: negative_question_full_response
  op: write
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: 'Answer all four questions in Norwegian. Every question contains ikke,
    and the supplied fact tells whether to contradict or confirm the negative idea.
    Write a complete answer: use Jo plus an affirmative sentence when the fact is
    true, and Nei plus a negative sentence containing ikke when the fact is false.
    Natural wording variations are accepted. 1. Fact: You arrive at seven. Question:
    «Kommer du ikke klokka sju?» 2. Fact: You do not bring drinks. Question: «Tar
    du ikke med drikke?» 3. Fact: You eat pizza. Question: «Spiser du ikke pizza?»
    4. Fact: You do not attend film night. Question: «Kommer du ikke på filmkvelden?»'
  response_language: 'no'
  judge_prompt: Check all four answers and report evidence for each criterion. The
    key is item 1 Jo with an affirmative clause, item 2 Nei with a negative clause,
    item 3 Jo with an affirmative clause, and item 4 Nei with a negative clause. Negative
    clauses must contain ikke. Accept natural Norwegian wording variants and treat
    ordinary vocabulary as supporting context.
  criteria:
  - id: negative-question-word
    instruction: Uses Jo for the affirmative facts in items 1 and 3 and Nei for the
      negative facts in items 2 and 4.
  - id: following-clause-polarity
    instruction: The complete clause after the response word matches the supplied
      fact; negative clauses contain ikke, while positive clauses do not need it.
      Accept natural wording variants.
  derived_from:
  - section_id: negative-question-full-response-practice
- handle: correcting_an_assumption
  op: write
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: 'Correct each mistaken assumption in Norwegian. For a false positive
    assumption, write Nei and then a complete sentence with the actual fact. For a
    false negative assumption, write Jo and then a complete sentence with the actual
    fact. The correction word is the primary scored evidence. 1. Assumption: «Maja
    kommer på filmkvelden.» Actual fact: Maja does not come. 2. Assumption: «Jonas
    kommer ikke på filmkvelden.» Actual fact: Jonas comes. 3. Assumption: «Sara tar
    ikke med mat.» Actual fact: Sara brings food. 4. Assumption: «Emil er med på filmkvelden.»
    Actual fact: Emil is not attending.'
  response_language: 'no'
  judge_prompt: Check all four corrections and report evidence for the criterion.
    Items 1 and 4 must begin with Nei; items 2 and 3 must begin with Jo. The following
    sentence must agree with the supplied actual fact so the correction is interpretable.
    Accept natural Norwegian wording variants and do not score vocabulary details.
  criteria:
  - id: correction-word
    instruction: Uses Nei for the false positive assumptions in items 1 and 4 and
      Jo for the false negative assumptions in items 2 and 3; the following sentence
      states the supplied actual fact, with natural wording accepted.
  derived_from:
  - section_id: correcting-an-assumption-practice
- handle: affirmative_addition_with_ogsa
  op: write
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: Add yourself to each affirmative film-night statement in Norwegian. For
    each item, write a short addition such as Jeg også. or a complete sentence such
    as Jeg lager også popcorn. Make clear that you share the stated action or situation
    and use også. Its placement may vary. 1. «Maja lager popcorn.» 2. «Jonas dekker
    bordet.» 3. «Sara kjøper drikke.» 4. «Emil er hjemme.»
  response_language: 'no'
  judge_prompt: Check all four additions and report evidence for the criterion. Every
    base statement is affirmative. Accept Jeg også. when the shared fact is clear,
    or a natural complete clause such as Jeg lager også popcorn. Do not require a
    fixed position for også and do not score ordinary wording.
  criteria:
  - id: affirmative-ogsa-addition
    instruction: Each response adds jeg to the same affirmative fact and uses også;
      accept the short form Jeg også. or a natural complete Norwegian clause with
      også in a natural position.
  derived_from:
  - section_id: affirmative-addition-with-ogsa-practice
- handle: negative_addition_with_heller
  op: write
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: Add yourself to each negative statement in Norwegian. You may write a
    complete clause with ikke ... heller, such as Jeg spiser ikke fisk heller, or
    the short reply Ikke jeg heller when the subject and fact are clear. Preserve
    the negative meaning and use heller. 1. «Maja spiser ikke fisk.» 2. «Jonas tar
    ikke buss.» 3. «Sara jobber ikke på lørdag.» 4. «Emil liker ikke te.»
  response_language: 'no'
  judge_prompt: Check all four additions and report evidence for the criterion. Each
    response must retain the negative fact and use heller. Accept complete clauses
    such as Jeg spiser ikke fisk heller and the short form Ikke jeg heller when the
    context makes the shared fact clear. Do not score subject wording or heller placement
    beyond natural Norwegian usage.
  criteria:
  - id: negative-heller-addition
    instruction: Each response makes a natural negative addition with heller, retaining
      ikke in a complete clause or using the accepted short reply Ikke jeg heller
      when the subject is clear.
  derived_from:
  - section_id: negative-addition-with-heller-practice
