- handle: interpret_bare_position_contrasts
  op: choose
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: analyze
  prompt_md: Compare the paired messages and choose the interpretation that explains
    the scope contrast and the alternatives excluded in each sentence.
  derived_from:
  - section_id: bare-scope-mistake
  stem_md: Which interpretation correctly explains both sentences?
  options:
  - id: bare-contrast-reversed
    text: '“Bare Liv kjøper dessert.” means “Liv is buying only dessert”: bare restricts
      dessert. “Liv kjøper bare dessert.” means “Only Liv is buying dessert”: bare
      restricts Liv.'
    correct: false
    why: The option reverses the scope of bare in both sentences.
  - id: bare-contrast-correct
    text: '“Bare Liv kjøper dessert.” means “Only Liv is buying dessert”: bare restricts
      the person and excludes other people from buying dessert. “Liv kjøper bare dessert.”
      means “Liv is buying only dessert”: bare restricts what Liv buys and excludes
      other purchases.'
    correct: true
    why: Moving bare changes whether the excluded alternatives are other people or
      other purchases by Liv.
  - id: bare-contrast-mechanical
    text: Both sentences mean “Liv is buying only dessert” because bare always restricts
      the object, regardless of its position.
    correct: false
    why: Particle placement determines scope; bare does not always restrict the object.
