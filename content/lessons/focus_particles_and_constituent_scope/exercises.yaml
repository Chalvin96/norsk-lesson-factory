- handle: notice_focus_in_cabin_dialogue
  op: choose
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: understand
  prompt_md: Choose the complete interpretation that correctly identifies the scope
    of bare, også, til og med, and selv in the supplied cabin-dinner sentences.
  derived_from:
  - section_id: cabin-dinner
  stem_md: Which interpretation correctly identifies what each particle focuses on
    and paraphrases the messages in English?
  options:
  - id: interpretation-whole-sentence
    text: Bare and også describe the whole sentence without a focused constituent.
      Til og med adds blue cheese, while selv means only Liv. The English translations
      are only Amir, Liv too, only bread, cheese as well, even blue cheese, and even
      Liv.
    correct: false
    why: The option gives translations but does not identify the actual particle scope
      and misstates the functions of til og med and selv.
  - id: interpretation-swapped
    text: “Bare Amir kommer klokka seks.” restricts klokka seks. “Også Liv kommer
      klokka seks.” adds klokka seks. “Amir tar bare brød.” means Amir is bringing
      bread as well. “Liv tar også ost.” restricts ost. “I kveld tar hun til og med
      blåmuggost.” presents hun as surprising. “Ja, selv Liv vil prøve den.” means
      Liv did the action herself.
    correct: false
    why: The option assigns particles to the wrong constituents and confuses focus
      selv with personal-action selv.
  - id: interpretation-correct
    text: '“Bare Amir kommer klokka seks.” means “Only Amir is coming at six”: bare
      restricts Amir. “Også Liv kommer klokka seks.” means “Liv is coming at six too”:
      også adds Liv. “Amir tar bare brød.” means “Amir is bringing only bread”: bare
      restricts bread. “Liv tar også ost.” means “Liv is bringing cheese as well”:
      også adds cheese. “I kveld tar hun til og med blåmuggost.” means “Tonight she
      is even bringing blue cheese”: til og med marks blue cheese as surprising. “Ja,
      selv Liv vil prøve den.” means “Yes, even Liv wants to try it”: selv marks Liv
      as surprising.'
    correct: true
    why: The interpretation identifies the focused person or thing for every particle
      and gives the intended English meaning.
