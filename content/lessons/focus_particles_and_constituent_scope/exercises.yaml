- handle: transfer_focus_to_workplace_picnic
  op: write
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: apply
  prompt_md: 'Write four original short Norwegian updates about a workplace picnic.
    Make these meanings explicit:
    (1) only one employee attends, with bare before the restricted participant; (2)
    a food, time, or place is added to an established picnic plan, with også before
    the added constituent; (3) an unexpected person participates, with selv before
    that person; and (4) a different food, time, or place is surprising, with til
    og med before that constituent. Make each focus scope clear through placement.'
  derived_from:
  - section_id: transfer-workplace-picnic
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: bare-participant-scope
    instruction: Uses bare before the participant being restricted in one workplace-picnic
      update.
  - id: ogsa-added-scope
    instruction: Uses også before the constituent being added in one workplace-picnic
      update.
  - id: selv-surprising-person
    instruction: Uses selv before an unexpected person in one workplace-picnic update.
  - id: til-og-med-surprising-constituent
    instruction: Uses til og med before a different surprising food, time, or place
      in one workplace-picnic update.
  - id: clear-transfer-scope
    instruction: Places each particle so the restricted, added, or surprising constituent
      is clear.
- handle: compare_picnic_scope_shifts
  op: write
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: apply
  prompt_md: Create two pairs of original Norwegian sentences about one workplace
    picnic. In pair one,
    keep the core event broadly constant but shift bare from restricting which employee
    brings salad to restricting what that employee brings. In pair two, keep the core
    meeting event broadly constant but shift også from adding a participant to adding
    the meeting location. After the pairs, explain each scope contrast briefly in
    Norwegian.
  derived_from:
  - section_id: transfer-workplace-picnic
  response_language: 'no'
  min_words: 25
  max_words: 70
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: bare-scope-shift
    instruction: Provides a sentence pair where bare shifts restriction from a participant
      to an item while the core picnic event remains constant.
  - id: ogsa-scope-shift
    instruction: Provides a sentence pair where også shifts addition from a participant
      to a location while the core meeting event remains constant.
  - id: contrast-explanation
    instruction: Explains in Norwegian which constituent is restricted or added in each
      sentence.
  - id: intentional-placement
    instruction: Uses particle placement intentionally rather than repeating one memorized
      position.
