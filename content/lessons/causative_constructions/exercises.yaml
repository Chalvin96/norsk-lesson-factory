  - state-adjective
- handle: separate_action_and_state_results
  op: choose
  objective: obj-causative-constructions-01
  bloom: understand
  prompt_md: In two paired situations, Sara causes Jonas to wash the dishes, and a
    long journey makes Nora tired. Choose the Bokmål pair that preserves an action
    result in the first situation and a state result in the second. Permission with
    la is not scored.
  derived_from:
  - section_id: separate-action-and-state-results
  stem_md: Which pair uses the correct construction for each intended result?
  options:
  - id: action-state-correct
    text: Sara får Jonas til å vaske opp. Den lange reisen gjør Nora trøtt.
    correct: true
    why: Få expresses the caused action, while gjøre expresses the caused state.
  - id: permission-state
    text: Sara lar Jonas vaske opp. Den lange reisen gjør Nora trøtt.
    correct: false
    why: The first sentence expresses permission instead of causing the action.
  - id: action-action
    text: Sara får Jonas til å vaske opp. Den lange reisen får Nora til å sove.
    correct: false
    why: The second sentence uses an action construction instead of the required adjective
      state construction.
