  objective: obj-causative-constructions-01
  bloom: apply
  prompt_md: At the community centre, loud music causes the neighbours to become angry.
    Build the complete Bokmål sentence with gjøre + object + adjective. Use the plural
    adjective form that describes naboene.
  explanation_md: "Use gjøre plus object plus adjective for a result: musikken gjør naboene sinte."
  derived_from:
  - section_id: complete-gjoere-result-states
  tokens:
