- handle: anchor_causative_meanings
  op: choose
  objective: obj-causative-constructions-01
  bloom: understand
  prompt_md: In Sara and Jonas's community-centre dialogue, read these selected lines.
    Identify the meaning relationship in each line. Pronoun forms and word order are
    supporting context, not separate scoring goals. 1. Sara får Jonas til å rydde
    bordene. 2. Sara lar Jonas hvile litt. 3. Bråket gjør Jonas trøtt.
  derived_from:
  - section_id: anchor-causative-meanings
  stem_md: Choose the complete meaning classification for lines 1–3.
  options:
  - id: meaning-swap-action-permission
    text: '1: tillater en handling; 2: forårsaker en handling; 3: forårsaker en tilstand.'
    correct: false
    why: The meanings of lines 1 and 2 are reversed.
  - id: meaning-swap-state-action
    text: '1: forårsaker en tilstand; 2: tillater en handling; 3: forårsaker en handling.'
    correct: false
    why: Lines 1 and 3 are assigned the wrong result type.
  - id: meaning-correct
    text: '1: forårsaker en handling; 2: tillater en handling; 3: forårsaker en tilstand.'
    correct: true
    why: Line 1 expresses causing an action, line 2 permission, and line 3 causing
      a state.
- handle: build_faa_action_causatives
  op: build
  objective: obj-causative-constructions-01
  bloom: apply
  prompt_md: At an everyday workplace, Sara influences Jonas to clean the meeting
    room. Construct the complete Bokmål sentence. Make Sara the subject, Jonas the
    object, and use få + object + til å + infinitive.
  explanation_md: "Use få plus the person affected plus til å plus infinitive when someone gets another person to perform an action."
  derived_from:
  - section_id: build-faa-action-causatives
  tokens:
  - token_id: faa-subject
    text: Sara
  - token_id: faa-verb
    text: får
  - token_id: faa-object
    text: Jonas
  - token_id: faa-til
    text: til
  - token_id: faa-aa
    text: å
  - token_id: faa-infinitive
    text: rydde
  - token_id: faa-place
    text: møterommet.
  answer_order:
  - faa-subject
  - faa-verb
  - faa-object
  - faa-til
  - faa-aa
  - faa-infinitive
  - faa-place
- handle: contrast_faa_and_la
  op: choose
  objective: obj-causative-constructions-01
  bloom: understand
  prompt_md: Jonas wants to go home early, and Sara gives him permission. Choose the
    Bokmål sentence that expresses permission rather than causing Jonas to start the
    action.
  derived_from:
  - section_id: contrast-faa-and-la
  stem_md: Which sentence matches the intended relationship?
  options:
  - id: permission-causation
    text: Sara får Jonas til å gå hjem tidlig.
    correct: false
    why: Få expresses causing Jonas to perform the action, not simply giving permission.
  - id: permission-correct
    text: Sara lar Jonas gå hjem tidlig.
    correct: true
    why: La expresses permission with the object followed by a bare infinitive.
- handle: complete_gjoere_result_states
