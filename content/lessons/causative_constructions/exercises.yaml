- handle: family_dinner_causative_transfer
  op: write
  objective: obj-causative-constructions-01
  bloom: apply
  prompt_md: Write a short connected account in Norwegian about family members preparing
    dinner. Include one caused action using få + object + til å + infinitive, one
    permitted action using la + object + bare infinitive, and one caused emotional
    or physical state using gjøre + object + adjective. Each sentence should express
    one clear relationship and fit the family-dinner setting.
  derived_from:
  - section_id: family-dinner-causative-transfer
  response_language: 'no'
  judge_prompt: Check the Norwegian response against the task and report evidence
    for each criterion. Accept natural Bokmål variants when they preserve the required
    causative meaning and construction.
  criteria:
  - id: dinner-caused-action
    instruction: Includes one natural Bokmål sentence in which one family member causes
      another to perform an action with få + object + til å + infinitive.
  - id: dinner-permitted-action
    instruction: Includes one natural Bokmål sentence in which one family member gives
      another permission with la + object + bare infinitive.
  - id: dinner-caused-state
    instruction: Includes one natural Bokmål sentence using gjøre + object + adjective
      to express a caused emotional or physical state.
  - id: dinner-clear-relationships
    instruction: Each required sentence expresses one clear relationship, and the
      account remains coherent in the family-dinner setting.
