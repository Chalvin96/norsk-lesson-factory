- handle: retrieve_double_definiteness_after_delay
  op: write
  objective: obj-double-definiteness-01
  bloom: apply
  prompt_md: Write three brief Norwegian descriptions for Nora. Identify one specific
    chair, one specific table, and one specific group of lamps among several choices.
    Use den in one description, det in one, and de in one. Each description must contain
    an adjective and a definite noun. Write from memory rather than copying a model.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 9
  max_words: 30
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants, but require the specified opening word and the
    full definite pattern in each description.
  criteria:
  - id: den-description
    instruction: Includes one specific chair description using den, an adjective in
      the taught definite form, and a definite noun.
  - id: det-description
    instruction: Includes one specific table description using det, an adjective in
      the taught definite form, and a definite noun.
  - id: de-description
    instruction: Includes one specific group-of-lamps description using de, an adjective
      in the taught definite form, and a definite noun.
