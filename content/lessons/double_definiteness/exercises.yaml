- handle: notice_double_definiteness_in_shop_dialogue
  op: recall_fill
  objective: obj-double-definiteness-01
  bloom: understand
  prompt_md: In the shop dialogue, complete the three noun phrases for the old chair,
    the round table, and the small lamps. For each phrase, fill the opening word,
    the adjective form, and the definite noun form.
  explanation_md: "A definite noun phrase with an adjective normally marks definiteness twice: den/det/de + adjective in -e + definite noun, for example «det store speilet»."
  derived_from:
  - section_id: first-checkpoint-notice-the-full-pattern
  audio_target: "Den gamle stolen står her. Det runde bordet står ved vinduet. De små lampene henger over bordet."
  segments:
  - text_md: 'The old chair: '
  - blank_id: old-chair-opening
    options:
    - den
    - det
    - de
    answer_index: 0
  - text_md: ' '
  - blank_id: old-chair-adjective
    options:
    - gamle
    - gammel
    answer_index: 0
  - text_md: ' '
  - blank_id: old-chair-noun
    options:
    - stolen
    - stol
    answer_index: 0
  - text_md: '. The round table: '
  - blank_id: round-table-opening
    options:
    - den
    - det
    - de
    answer_index: 1
  - text_md: ' '
  - blank_id: round-table-adjective
    options:
    - runde
    - rund
    answer_index: 0
  - text_md: ' '
  - blank_id: round-table-noun
    options:
    - bordet
    - bord
    answer_index: 0
  - text_md: '. The small lamps: '
  - blank_id: small-lamps-opening
    options:
    - den
    - det
    - de
    answer_index: 2
  - text_md: ' '
  - blank_id: small-lamps-adjective
    options:
    - små
    - røde
    answer_index: 0
  - text_md: ' '
  - blank_id: small-lamps-noun
    options:
    - lampene
    - lamper
    answer_index: 0
  - text_md: .
