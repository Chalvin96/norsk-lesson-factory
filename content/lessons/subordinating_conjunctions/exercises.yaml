- handle: identify_at_content_clause
  op: choose
  objective: obj-subordinating-conjunctions-01
  bloom: understand
  prompt_md: Read the weather, transport, and cabin messages. Select the option that
    marks each complete dependent clause introduced by at and identifies the content
    it supplies. Marking only at is incomplete.
  derived_from:
  - section_id: reporting-a-thought-or-statement-with-at
  stem_md: Maja tror at bussen kommer snart. Jonas sier at han er klar. Vi vet at
    veien er åpen. Which option is correct?
  options:
  - id: conjunction-only
    text: '[at] bussen kommer snart; [at] han er klar; [at] veien er åpen.'
    correct: false
    why: Only the conjunction is marked, not the complete dependent clause.
  - id: complete-content-clauses
    text: '[at bussen kommer snart] — what Maja thinks; [at han er klar] — what Jonas
      says; [at veien er åpen] — known information.'
    correct: true
    why: Each marked span includes at and the complete content clause.
  - id: whole-sentences
    text: '[Maja tror at bussen kommer snart]; [Jonas sier at han er klar]; [Vi vet
      at veien er åpen].'
    correct: false
    why: The marked spans include the main clauses instead of isolating the at-clauses.
