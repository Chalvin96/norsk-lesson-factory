  - id: conjunctions-only
    text: '[Når] vi kommer fram, lager vi middag; Vi kjøper mat [før] vi kjører til
      hytta; [Mens] Jonas pakker, sjekker Maja butikken.'
    correct: false
    why: Only the conjunctions are marked, not the complete dependent clauses.
  - id: whole-sentences
    text: '[Når vi kommer fram, lager vi middag]; [Vi kjøper mat før vi kjører til
      hytta]; [Mens Jonas pakker, sjekker Maja butikken].'
    correct: false
    why: The marked spans include the main events instead of isolating the time clauses.
  - id: full-time-clauses-and-events
    text: '[Når vi kommer fram] — lager vi middag; [før vi kjører til hytta] — Vi
      kjøper mat; [Mens Jonas pakker] — sjekker Maja butikken.'
    correct: true
    why: Each marked span is a complete time clause, including clauses that come before
      the main clause.
