- handle: mark_dependent_clauses_in_bicycle_message
  op: choose
  objective: obj-subordinating-conjunctions-01
  bloom: understand
  prompt_md: Read Amina’s message. Select the option that marks every complete dependent
    clause, including its introductory conjunction, and links each clause to the main
    event or message part it completes or modifies. Clause-internal word order is
    not scored.
  derived_from:
  - section_id: cumulative-transfer
  stem_md: Amina sier at de sykler på søndag. Henrik tar med en regnjakke fordi værmeldingen
    melder regn. Hvis kafeen er åpen, stopper de når de kommer fram. De hører på radio
    mens de sykler, selv om det regner. Which option is correct?
  options:
  - id: conjunctions-only
    text: Amina sier [at] de sykler på søndag. Henrik tar med en regnjakke [fordi]
      værmeldingen melder regn. [Hvis] kafeen er åpen, stopper de [når] de kommer
      fram. De hører på radio [mens] de sykler, [selv om] det regner.
    correct: false
    why: Only the conjunctions are marked, so none of the dependent clauses is complete.
  - id: all-boundaries-and-functions
    text: Amina sier [at de sykler på søndag] — reported content; Henrik tar med en
      regnjakke [fordi værmeldingen melder regn] — reason; [Hvis kafeen er åpen] —
      condition for stopping; stopper de [når de kommer fram] — time of stopping;
      De hører på radio [mens de sykler] — overlapping actions; De hører på radio
      [selv om det regner] — unexpected contrast.
    correct: true
    why: Every dependent clause is complete, and each clause is linked to the correct
      main event and function.
  - id: wrong-functions
    text: Amina sier [at de sykler på søndag] — reason; Henrik tar med en regnjakke
      [fordi værmeldingen melder regn] — reported content; [Hvis kafeen er åpen] —
      time of stopping; stopper de [når de kommer fram] — condition; De hører på radio
      [mens de sykler] — unexpected contrast; De hører på radio [selv om det regner]
      — overlapping actions.
    correct: false
    why: Several clause boundaries are marked, but their functions and links to the
      main events are incorrectly assigned.
