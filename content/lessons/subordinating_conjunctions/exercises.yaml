- handle: locate_hvis_dependency
  op: choose
  objective: obj-subordinating-conjunctions-01
  bloom: understand
  prompt_md: Read the cabin plans. Select the option that marks every complete hvis-clause
    and states which event or decision depends on each condition.
  derived_from:
  - section_id: stating-a-condition-with-hvis
  stem_md: Hvis det blir kaldt, tar Jonas med ved. Hvis butikken ved hytta er stengt,
    kan vi handle på veien. Hvis veien er åpen, drar vi. Which option is correct?
  options:
  - id: full-conditions-and-dependent-events
    text: '[Hvis det blir kaldt] → tar Jonas med ved; [Hvis butikken ved hytta er
      stengt] → kan vi handle på veien; [Hvis veien er åpen] → drar vi.'
    correct: true
    why: Each marked span contains the full hvis-clause, and each arrow identifies
      the event that depends on its condition.
  - id: conjunctions-only
    text: '[Hvis] det blir kaldt, tar Jonas med ved; [Hvis] butikken ved hytta er
      stengt, kan vi handle på veien; [Hvis] veien er åpen, drar vi.'
    correct: false
    why: Only Hvis is marked, so the dependent clauses are incomplete.
  - id: whole-clauses
    text: '[Hvis det blir kaldt, tar Jonas med ved]; [Hvis butikken ved hytta er stengt,
      kan vi handle på veien]; [Hvis veien er åpen, drar vi].'
    correct: false
    why: Each marked span incorrectly includes the event that depends on the condition.
- handle: recognize_time_clause_boundaries
  op: choose
  objective: obj-subordinating-conjunctions-01
  bloom: understand
  prompt_md: Read the Saturday preparation sequence. Select the option that marks
    each complete dependent clause introduced by når, før, or mens and identifies
    the main event it places in time.
  derived_from:
  - section_id: placing-events-in-time
  stem_md: Når vi kommer fram, lager vi middag. Vi kjøper mat før vi kjører til hytta.
    Mens Jonas pakker, sjekker Maja butikken. Which option is correct?
