- handle: identify_selv_om_clause
  op: choose
  objective: obj-subordinating-conjunctions-01
  bloom: understand
  prompt_md: Read the plan descriptions. Select the option that marks each complete
    dependent clause beginning with the two-word conjunction selv om. The whole expression
    belongs together.
  derived_from:
  - section_id: expressing-an-unexpected-contrast-with-selv-om
  stem_md: Jonas pakker regnjakka selv om han håper på sol. Selv om det regner, går
    de en liten tur. Which option is correct?
  options:
  - id: conjunction-only
    text: Jonas pakker regnjakka [selv om] han håper på sol; [Selv om] det regner,
      går de en liten tur.
    correct: false
    why: The two-word conjunction is marked, but the rest of each dependent clause
      is missing.
  - id: first-word-only
    text: Jonas pakker regnjakka [selv] om han håper på sol; [Selv] om det regner,
      går de en liten tur.
    correct: false
    why: Only selv is marked, so the conjunction is split and the clauses are not
      identified.
  - id: complete-selv-om-clauses
    text: Jonas pakker regnjakka [selv om han håper på sol]; [Selv om det regner],
      går de en liten tur.
    correct: true
    why: Each marked span includes both words of selv om and the complete clause that
      follows.
