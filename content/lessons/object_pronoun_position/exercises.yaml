- handle: choose_the_known_object
  op: choose
  objective: obj-object-pronoun-position-01
  bloom: understand
  prompt_md: Choose the one complete object-pronoun set that fits all five meeting-room
    exchanges.
  derived_from:
  - section_id: what-does-the-pronoun-replace
  stem_md: Replace the repeated object in each line. The intended meanings are calling
    Sara, helping Jonas, having the key, having the card, and having the cups. 1.
    Jeg ringer Sara. 2. Maja hjelper Jonas. 3. Har du nøkkelen? – Ja, jeg har nøkkelen.
    4. Har du kortet? – Ja, jeg har kortet. 5. Har du koppene? – Ja, jeg har koppene.
  options:
  - id: set-wrong-person
    text: 1. Jeg ringer ham. 2. Maja hjelper henne. 3. Ja, jeg har den. 4. Ja, jeg
      har det. 5. Ja, jeg har dem.
    correct: false
    why: ham and henne do not match the genders of Sara and Jonas in these lines.
  - id: set-correct
    text: 1. Jeg ringer henne. 2. Maja hjelper ham. 3. Ja, jeg har den. 4. Ja, jeg
      har det. 5. Ja, jeg har dem.
    correct: true
    why: Sara is feminine, Jonas is masculine, nøkkelen is masculine, kortet is neuter,
      and koppene is plural; the pronouns match each reference.
  - id: set-wrong-gender
    text: 1. Jeg ringer henne. 2. Maja hjelper ham. 3. Ja, jeg har det. 4. Ja, jeg
      har den. 5. Ja, jeg har dem.
    correct: false
    why: den and det are reversed for nøkkelen and kortet.
  - id: set-wrong-number
    text: 1. Jeg ringer henne. 2. Maja hjelper ham. 3. Ja, jeg har den. 4. Ja, jeg
      har det. 5. Ja, jeg har den.
    correct: false
    why: koppene is plural, so dem is required instead of den.
