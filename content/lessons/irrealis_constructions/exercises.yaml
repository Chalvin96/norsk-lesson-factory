- handle: select_would_or_could_result
  op: recall_fill
  objective: obj-irrealis-constructions-01
  bloom: understand
  prompt_md: Complete both hypothetical conditions. The result clauses already supply
    ville or kunne; choose the past-tense form that presents an imagined present or
    future. Do not change the supplied result meaning.
  derived_from:
  - section_id: checkpoint-select-would-or-could-result
  audio_target: "Jeg har lite tid. Hvis jeg hadde mer tid, ville jeg lese boka. Jeg bor langt unna. Hvis jeg bodde nærmere, kunne jeg komme oftere."
  segments:
  - text_md: 'Jeg har lite tid. Hvis jeg '
  - blank_id: time-condition
    options:
    - hadde
    - har
    answer_index: 0
  - text_md: ' mer tid, ville jeg lese boka. Jeg bor langt unna. Hvis jeg '
  - blank_id: distance-condition
    options:
    - bodde
    - bor
    answer_index: 0
  - text_md: ' nærmere, kunne jeg komme oftere.'
- handle: distinguish_hypothetical_time_reference
  op: choose
  objective: obj-irrealis-constructions-01
  bloom: analyze
  prompt_md: 'Read the two facts. Case 1: Nora has little free time now and imagines
    having more time. Case 2: Nora did not buy the ticket yesterday and the trip is
    over. Choose the pair of Norwegian sentences that uses the required hypothetical
    time frame in each case.'
  derived_from:
  - section_id: checkpoint-distinguish-hypothetical-time-reference
  stem_md: Choose the pair that matches the present/future hypothesis and the contrary-to-fact
    past.
  options:
  - id: present-past
    text: 'Nå: Hvis Nora hadde mer tid, ville hun lese boka. Tidligere: Hvis Nora
      hadde kjøpt billetten, ville hun ha reist.'
    correct: true
    why: The first sentence imagines a different present; the second uses hadde +
      past participle and ville ha + past participle for the completed past.
  - id: ordinary-past
    text: 'Nå: Hvis Nora har mer tid, ville hun lese boka. Tidligere: Hvis Nora kjøpte
      billetten, ville hun ha reist.'
    correct: false
    why: The condition forms do not use the taught patterns for the two time frames.
  - id: present-mixed-result
    text: 'Nå: Hvis Nora hadde mer tid, ville hun lese boka. Tidligere: Hvis Nora
      hadde kjøpt billetten, ville hun reise.'
    correct: false
    why: The completed past case needs the past result form ville ha reist.
