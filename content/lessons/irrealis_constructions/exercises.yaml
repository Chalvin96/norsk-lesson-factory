- handle: recognize_hypothetical_distance
  op: choose
  objective: obj-irrealis-constructions-01
  bloom: analyze
  prompt_md: Read the three Norwegian conditions. Choose the classification set that
    distinguishes an open possibility from a more distant or unreal situation. Use
    the taught contrast between an ordinary condition and past tense + ville. 1. Hvis
    jeg får fri på fredag, reiser jeg med toget. 2. Hvis jeg hadde mer tid, ville
    jeg jobbe hjemme. 3. Hvis vi finner en større leilighet, flytter vi i høst.
  derived_from:
  - section_id: checkpoint-recognize-hypothetical-distance
  stem_md: Choose the classification set that correctly labels conditions 1, 2, and
    3.
  options:
  - id: distant-open-open
    text: '1: en mer fjern eller uvirkelig situasjon; 2: en åpen mulighet; 3: en åpen
      mulighet'
    correct: false
    why: Condition 1 is an ordinary open condition, not the past tense + ville pattern.
  - id: open-open-distant
    text: '1: en åpen mulighet; 2: en åpen mulighet; 3: en mer fjern eller uvirkelig
      situasjon'
    correct: false
    why: Condition 2 contains the taught distant or unreal pattern.
  - id: open-distant-open
    text: '1: en åpen mulighet; 2: en mer fjern eller uvirkelig situasjon; 3: en åpen
      mulighet'
    correct: true
    why: Conditions 1 and 3 use ordinary present conditions for open possibilities;
      condition 2 uses past tense + ville for an imagined situation.
