- handle: interpret_conditions_in_return_scene
  op: choose
  objective: obj-irrealis-constructions-01
  bloom: analyze
  prompt_md: In the return scene, Maja and Eirik have not yet confirmed Friday off,
    they do not have a car, and they did not book the train yesterday. Read the three
    lines and choose the complete English interpretation that matches the cabin trip.
    1. Hvis Maja får fri på fredag, drar vi til hytta. 2. Hvis vi hadde bil, ville
    vi kjøre til hytta. 3. Hvis vi hadde bestilt toget i går, ville vi ha fått billigere
    billetter.
  derived_from:
  - section_id: checkpoint-interpret-conditions-in-return-scene
  stem_md: Choose the interpretation that explains what each conditional implies.
  options:
  - id: imagined-now-possible-now-unchangeable-past
    text: Sentence 1 is only imagined now; sentence 2 remains genuinely possible;
      sentence 3 describes a missed past opportunity that cannot be changed now.
    correct: false
    why: Sentence 1 presents an open Friday possibility, while sentence 2 uses past
      tense + ville.
  - id: possible-now-imagined-now-unchangeable-past
    text: Sentence 1 remains genuinely possible; sentence 2 imagines having a car
      now; sentence 3 describes a missed past opportunity that cannot be changed now.
    correct: true
    why: The first condition is open, the second contradicts a current fact, and the
      third refers to an unchangeable missed event yesterday.
  - id: possible-now-unchangeable-past-imagined-now
    text: Sentence 1 remains genuinely possible; sentence 2 describes an unchangeable
      past opportunity; sentence 3 imagines a different present.
    correct: false
    why: Sentence 2 concerns the current absence of a car, and sentence 3 concerns
      yesterday.
- handle: transfer_irrealis_to_new_situation
  op: write
  objective: obj-irrealis-constructions-01
  bloom: apply
  prompt_md: Write a short exchange in Norwegian between two friends discussing a
    concert. One friend does not currently live near the venue, and both friends bought
    their tickets too late to get an earlier discount. Include one hypothesis about
    the present or future and one contrary-to-fact condition about the past. Make
    the time reference clear from these stated facts and use your own wording.
  derived_from:
  - section_id: retrieval-and-transfer
  response_language: 'no'
  judge_prompt: Check the Norwegian exchange against the task and report evidence
    for each criterion. Accept natural Bokmål ville + past participle without overt
    ha as an equivalent result form for the contrary-to-fact past criterion.
  criteria:
  - id: concert-context
    instruction: 'Uses the concert situation: one friend currently lives away from
      the venue, and both friends missed the earlier discount because they bought
      tickets late.'
  - id: present-future-hypothesis
    instruction: Includes a present or future hypothesis with a past-tense hvis-clause
      and ville + infinitive.
  - id: past-counterfactual
    instruction: Includes a contrary-to-fact past condition with hadde + past participle
      and the full result form ville ha + past participle; natural Bokmål ville +
      past participle without overt ha is also accepted for the result.
