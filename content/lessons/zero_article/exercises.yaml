- handle: distinguish_sport_from_object
  op: choose
  objective: obj-zero-article-01
  bloom: understand
  prompt_md: Choose the sentence in which the noun names a sport rather than one physical
    object.
  derived_from:
  - section_id: sports-and-activities
  stem_md: Which sentence uses no article because the noun names a sport?
  options:
  - id: sport
    text: Barna spiller fotball.
    correct: true
    why: Fotball names the sport, so it has no article.
  - id: object
    text: Amir kjøper en fotball.
    correct: false
    why: En fotball refers to one physical ball.
  - id: mass-noun
    text: Nora drikker kaffe.
    correct: false
    why: Kaffe is a mass noun here, not a sport.
- handle: describe_sport_habits
  op: write
  objective: obj-zero-article-01
  bloom: apply
  prompt_md: 'Write two short Norwegian profile sentences from these facts: Amir plays
    chess with a neighbor after work; Nora practises karate after school. Use complete
    sentences and no article before each sport or game name.'
  derived_from:
  - section_id: sports-and-activities
  response_language: 'no'
  min_words: 8
  max_words: 20
  judge_prompt: Check the Norwegian response against the supplied two profiles and
    report evidence for each criterion.
  criteria:
  - id: sport-zero-article
    instruction: Uses each supplied sport or game name, sjakk and karate, without
      an article.
  - id: complete-profiles
    instruction: Writes two complete Norwegian sentences that express the supplied
      profiles.
- handle: recognize_mass_noun_meaning
  op: choose
  objective: obj-zero-article-01
  bloom: understand
  prompt_md: 'Choose the pair that shows both taught zero-article mass-noun meanings:
    substance in general and an unspecified quantity.'
  derived_from:
  - section_id: mass-nouns-food-drink-and-other-substances
  stem_md: Which pair uses a mass noun without an article in both meanings?
  options:
  - id: definite-and-serving
    text: Kaffen er varm. Nora bestiller en kaffe.
    correct: false
    why: The first noun is definite and the second refers to one serving.
  - id: generic-and-definite
    text: Jeg liker kaffe. Kaffen er varm.
    correct: false
    why: Only the first noun has the generic zero-article meaning.
  - id: both-zero-mass
    text: Jeg liker kaffe. Vi har kaffe og te.
    correct: true
    why: The first sentence refers to coffee generally and the second to an unspecified
      supply.
  - id: substance-and-serving
    text: Nora drikker kaffe. Nora bestiller en kaffe.
    correct: false
    why: The second noun refers to one serving with an article.
