- handle: identify_role_zero_article
  op: choose
  objective: obj-zero-article-01
  bloom: understand
  prompt_md: Choose the set containing only sentences in which the noun names a person's
    role without an article.
  derived_from:
  - section_id: roles-and-occupations
  stem_md: Choose the set in which role nouns follow er, blir, or jobber som without
    an article.
  options:
  - id: mixed-role-object
    text: Sara er lege. Amir snakker med en lege. Nora er en student.
    correct: false
    why: The set includes a person being talked to and a role with an article.
  - id: all-role-zero
    text: Amir er lærer. Nora blir journalist. Hun jobber som kokk.
    correct: true
    why: All three nouns name roles and appear without an article.
  - id: mixed-articles
    text: Sara er en lege. Faren min er lege. Hun jobber som en kokk.
    correct: false
    why: Two role nouns incorrectly have articles.
  - id: mixed-patterns
    text: Jeg vil bli journalist. De snakker et tysk. Amir kjøper en fotball.
    correct: false
    why: The set includes a language with an article and a physical object.
