- handle: build_study_evening_message
  op: write
  objective: obj-zero-article-01
  bloom: apply
  prompt_md: Write a connected Norwegian planning message for a study evening at the
    library using all six facts below. Use no article in the taught role, language,
    sport or game, mass-noun, transport, and indefinite-plural patterns. - Mina works
    as a teacher during the evening. - Amir writes Norwegian for the group. - The
    students play chess during the break. - The group has coffee and bread. - They
    come to the library by train, using med tog. - They need cups.
  derived_from:
  - section_id: cumulative-transfer-planning-a-study-evening
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the Norwegian planning message against all supplied facts and
    report evidence for each criterion.
  criteria:
  - id: six-zero-article-patterns
    instruction: Uses no article with the supplied role, language, sport or game,
      mass nouns, and indefinite plural, and uses med tog for transport.
  - id: connected-study-message
    instruction: Writes a connected Norwegian planning message using all six supplied
      facts.
