  objective: obj-zero-article-01
  bloom: apply
  prompt_md: Write one complete Norwegian journey statement for each supplied fact.
    Use the taught transport expression required by each plan. - Amir — work — med
    buss - Nora — school — med tog - Sara — the station — med bil - Jonas — a social
    event — med fly - Liv — the café — på sykkel
