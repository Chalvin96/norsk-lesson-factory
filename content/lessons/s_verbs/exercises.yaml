- handle: select_motes_or_ses_by_intended_meaning
  op: choose
  objective: obj-s-verbs-01
  bloom: understand
  prompt_md: Amir and a colleague have arranged to meet at the station, and Amir is
    ending the exchange by referring to seeing one another there. Choose the Norwegian
    line that matches the focus.
  derived_from:
  - section_id: motes-and-ses-together
  stem_md: Choose the line that focuses on seeing one another while ending the exchange.
  options:
  - id: ses-line
    text: Flott. Vi ses der!
    correct: true
    why: This line refers to seeing one another while ending the exchange.
  - id: motes-line
    text: Vi møtes på stasjonen klokka åtte.
    correct: false
    why: This line arranges or describes a meeting rather than expressing the farewell
      focus.
