- handle: identify_lexical_s_verbs_in_context
  op: categorize
  objective: obj-s-verbs-01
  bloom: analyze
  prompt_md: Classify each Norwegian sentence by the meaning of its s-ending verb.
    Use the specific bucket that fits the whole sentence; do not classify from the
    final -s alone.
  explanation_md: "Lexical s-verbs such as synes, trives, finnes, møtes, and ses have their own meanings; the -s does not automatically mark a passive."
  derived_from:
  - section_id: first-checkpoint-notice-difference
  buckets:
  - bucket_id: lexical-opinion
    label: Personal opinion
  - bucket_id: lexical-comfort
    label: Comfort in a place, group, or situation
  - bucket_id: lexical-existence
    label: Existence or availability
  - bucket_id: lexical-mutual-meeting
    label: Mutual meeting
  - bucket_id: lexical-seeing
    label: Seeing one another or saying goodbye
  - bucket_id: passive-action
    label: Passive action done to the subject
  items:
  - item_id: item-opinion
    text: Jeg synes byen er fin.
    bucket_id: lexical-opinion
  - item_id: item-comfort
    text: Amir trives på jobben.
    bucket_id: lexical-comfort
  - item_id: item-existence
    text: Det finnes en kafé ved biblioteket.
    bucket_id: lexical-existence
  - item_id: item-meeting
    text: Amir og Nora møtes på kafeen.
    bucket_id: lexical-mutual-meeting
  - item_id: item-seeing
    text: Flott. Vi ses der!
    bucket_id: lexical-seeing
  - item_id: item-passive
    text: Kafeen stenges klokka seks.
    bucket_id: passive-action
