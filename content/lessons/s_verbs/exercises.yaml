- handle: transfer_s_verbs_to_an_evening_course
  op: write
  objective: obj-s-verbs-01
  bloom: apply
  prompt_md: Write a short connected message in Norwegian to Jonas about Maja and
    her evening course. Use each of synes, trives, finnes, møtes, and ses exactly
    once as a complete lexical verb. Give an opinion about the course, say how Maja
    feels in the group, mention something that exists or is available at the school,
    and describe when the classmates meet and when Maja and Jonas see one another.
    For every meeting or seeing statement, include all mutual participants in its
    subject.
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the message against the task and report concrete evidence for
    each criterion.
  criteria:
  - id: five-complete-forms
    instruction: Uses synes, trives, finnes, møtes, and ses exactly once as complete
      lexical s-verbs.
  - id: central-meanings
    instruction: Uses the five verbs for personal opinion, comfort in a situation,
      existence or availability, mutual meeting, and seeing one another.
  - id: mutual-subjects
    instruction: Represents all mutual participants in the subject of every meeting
      or seeing statement.
