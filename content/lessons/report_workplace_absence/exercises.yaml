- handle: add_next_contact_to_staged_message
  op: write
  objective: obj-report-workplace-absence-01
  bloom: apply
  prompt_md: Write a concise professional Norwegian message for Emil. State that he
    cannot come to work on Thursday, will be away all day, and will update his manager
    by four about whether he can work on Friday.
  derived_from:
  - section_id: sec-practice-build-a-message-in-stages
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept equivalent natural Bokmål wording and either one sentence or several short
    sentences, provided all requested facts remain clear.
  criteria:
  - id: emil-absence
    instruction: States that Emil cannot come to work on Thursday.
  - id: emil-timing
    instruction: States that Emil will be away all day.
  - id: emil-next-contact
    instruction: States that Emil will update his manager by four about whether he
      can work on Friday.
- handle: final_retrieval_and_review
  op: write
  objective: obj-report-workplace-absence-01
  bloom: apply
  prompt_md: Imagine you work at a library and cannot attend your Friday shift. Write
    a short Norwegian workplace absence message for this new situation. Use original
    wording. State that you cannot come to work, give
    clear timing, and finish with either a specific next contact or a practical handover.
  derived_from:
  - section_id: sec-final-retrieval-and-review
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept equivalent natural Bokmål wording and either a concrete next contact or
    a concrete handover. Do not require exact lesson wording.
  criteria:
  - id: new-situation
    instruction: Uses the new library and Friday-shift situation without copying a
      complete lesson sentence.
  - id: absence
    instruction: States that the writer cannot attend work.
  - id: timing
    instruction: Gives clear timing for the absence.
  - id: next-step
    instruction: Finishes with either a specific next contact or a practical handover.
