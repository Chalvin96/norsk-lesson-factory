- handle: identify_central_message
  op: choose
  objective: obj-report-workplace-absence-01
  bloom: understand
  prompt_md: 'Sara says: «Hei, Henrik. Det er Sara. Jeg er dessverre syk og kan ikke
    komme på jobb i dag.» Choose the option that identifies both the absence and its
    timing, without using later meeting details.'
  derived_from:
  - section_id: sec-essential-absence-message
  stem_md: Which option states both Sara's absence and its timing?
  options:
  - id: central-today
    text: Jeg er syk og kan ikke komme på jobb i dag.
    correct: true
    why: This identifies both the absence and the fact that it applies today.
  - id: central-tomorrow
    text: Jeg kan ikke komme på jobb i morgen.
    correct: false
    why: This gives tomorrow as the timing, not today.
  - id: at-work-now
    text: Jeg er på jobb nå.
    correct: false
    why: This says that the speaker is at work, not absent.
  - id: after-lunch
    text: Jeg kan komme på jobb etter lunsj, men ikke før.
    correct: false
    why: This describes coming after lunch rather than being unable to come today.
