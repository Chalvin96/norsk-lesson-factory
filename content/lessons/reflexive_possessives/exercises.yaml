- handle: office_ownership_transfer
  op: write
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: Write five short Norwegian sentences about colleagues closing an office
    and collecting personal belongings. Include one sentence with each of sin, si,
    sitt, and sine for an item owned by its subject, and at least one sentence where
    a colleague handles another colleague's item, using hans, hennes, or deres. Use
    original office wording.
  derived_from:
  - section_id: sec-cumulative-office-ownership-transfer
  response_language: 'no'
  min_words: 30
  max_words: 55
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Norwegian wording and equivalent possessive forms that preserve
    the required ownership relationships.
  criteria:
  - id: office-context
    instruction: Describes colleagues closing an office and collecting personal belongings
      in five original Norwegian sentences.
  - id: ownership-contrast
    instruction: Uses sin, si, sitt, or sine when the subject owns the item, and hans,
      hennes, or deres when another colleague owns the item.
  - id: noun-agreement
    instruction: Matches sin with masculine singular, si with feminine singular, sitt
      with neuter singular, and sine with plural possessed nouns.
- handle: two_question_review
  op: write
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: 'First state in Norwegian the two questions you use when choosing a
    possessive. Then write four short Norwegian sentences about people leaving a shared
    place: use sin in one sentence, si in one, sitt in one, and sine in one. In every
    sentence, the subject must own the possessed noun.'
  derived_from:
  - section_id: sec-final-retrieval-review
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Norwegian paraphrases of the two questions and natural sentences
    that preserve the required subject–owner relationship.
  criteria:
  - id: ownership-question
    instruction: States that the first question checks whether the subject owns the
      possessed noun.
  - id: noun-question
    instruction: States that the second question checks the gender or number of the
      possessed noun.
  - id: four-reflexive-forms
    instruction: Writes four short Norwegian sentences with sin, si, sitt, and sine,
      one form per sentence.
  - id: subject-owner
    instruction: Makes the subject the owner of the possessed noun in all four sentences.
