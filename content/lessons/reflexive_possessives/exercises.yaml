- handle: anchor_ownership_map
  op: choose
  objective: obj-reflexive-possessives-01
  bloom: understand
  prompt_md: Read the cabin sentence and choose the complete interpretation that identifies
    the subject, the possessed item, and whether the item belongs to the subject.
    Do not score agreement yet.
  derived_from:
  - section_id: sec-checkpoint-anchor-ownership-map
  stem_md: 'Interpret this cabin sentence: Jonas tar på seg jakka si.'
  options:
  - id: subject-owns-item
    text: Subjektet er Jonas, tingen er jakka, og Jonas eier den selv — The subject
      is Jonas, the item is the jacket, and Jonas owns it himself.
    correct: true
    why: The subject Jonas owns the jacket, so the sentence expresses his own jacket.
  - id: other-person-owns-item
    text: Subjektet er Jonas, tingen er jakka, og Nora eier den — The subject is Jonas,
      the item is the jacket, and Nora owns it.
    correct: false
    why: The sentence does not make Nora the owner.
  - id: wrong-subject
    text: Subjektet er Nora, tingen er jakka, og Nora eier den selv — The subject
      is Nora, the item is the jacket, and Nora owns it herself.
    correct: false
    why: The subject in the sentence is Jonas, not Nora.
  - id: wrong-item
    text: Subjektet er Jonas, tingen er passet, og Jonas eier den selv — The subject
      is Jonas, the item is the passport, and Jonas owns it himself.
    correct: false
    why: The possessed item in the sentence is the jacket, not the passport.
