- handle: notice_location_or_direction
  op: choose
  objective: obj-directional-vs-locative-adverbs-01
  bloom: understand
  prompt_md: Read the whole situation before choosing. Emil is already inside and
    is walking around indoors. Select the sentence that describes his current location
    rather than movement into a place.
  derived_from:
  - section_id: sec-location-or-direction
  stem_md: Choose the Norwegian sentence that matches the situation.
  options:
  - id: location
    text: Emil går inne.
    correct: true
    why: The activity happens while Emil is already indoors, so inne is a location
      form.
  - id: direction
    text: Emil går inn.
    correct: false
    why: Inn marks movement into a place, not activity that remains indoors.
- handle: interpret_movement_in_context
  op: choose
  objective: obj-directional-vs-locative-adverbs-01
  bloom: understand
  prompt_md: Emil is already outside and walks there; he does not cross into the outside.
    Choose the form that expresses the location of the activity despite the movement
    verb.
  derived_from:
  - section_id: sec-movement-verb-meaning
  stem_md: Choose the sentence that matches the intended meaning.
  options:
  - id: change-of-place
    text: Emil går ut.
    correct: false
    why: Ut expresses movement from inside to outside.
  - id: activity-location
    text: Emil går ute.
    correct: true
    why: The walking happens while Emil is already outside, so ute describes the location.
