- handle: repair_location_direction_mistakes
  op: find_fix
  objective: obj-directional-vs-locative-adverbs-01
  bloom: analyze
  prompt_md: 'Find the one incorrect word in this direct question. The speaker asks
    for an unknown place: Der er kafeen? Select the word that must be repaired. The
    scored distinction is question versus statement meaning.'
  derived_from:
  - section_id: sec-common-mistakes
  tokens:
  - token_id: repair-1
    text: Der
  - token_id: repair-2
    text: er
  - token_id: repair-3
    text: kafeen?
  error_token_id: repair-1
  feedback: 'Replace Der with Hvor: Hvor er kafeen? uses hvor to ask for an unknown
    place; der identifies a place in a statement.'
- handle: reconstruct_the_meeting_route
  op: write
  objective: obj-directional-vs-locative-adverbs-01
  bloom: apply
  prompt_md: 'Write a short account in Norwegian of Emil''s route through the community
    centre and afterward. Include his current place in room 204, his movement down
    to the café, the café''s current location, and his later movement home. Use these
    frames if helpful: Emil er ... . Han går ... til kafeen. Kafeen er ... . Til slutt
    går han ... . Use location forms for current places and directional forms for
    movement. Exact dialogue recall is not required.'
  derived_from:
  - section_id: sec-returning-maja-emil
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Check the route and its sequence against every criterion. Accept natural
    Norwegian wording and do not require exact dialogue recall, but report evidence for
    the room, café, and home events separately.
  criteria:
  - id: room-204-current-place
    instruction: States in Norwegian that Emil is currently in room 204 using a location form.
  - id: movement-to-cafe
    instruction: States that Emil moves down to the café using a directional form and preserves that sequence.
  - id: cafe-current-location
    instruction: States where the café currently is using a location form.
  - id: movement-home
    instruction: States that Emil later moves home using a directional form and places this event last.
- handle: transfer_to_a_new_visit
  op: write
  objective: obj-directional-vs-locative-adverbs-01
  bloom: apply
  prompt_md: Write a connected Norwegian exchange and short route description for
    Nora's new visit to Henrik's flat. Nora is outside and does not know which entrance
    or floor to use. Henrik is inside and upstairs. Have Nora ask with hvor, have
    Henrik direct her toward him, have her move through the building, and end with
    them leaving and going to Nora's home. Use location forms for positions and directional
    forms for movements. Keep her/hit and der/dit consistent with each speaker's viewpoint.
    Do not copy the community-centre dialogue.
  derived_from:
  - section_id: sec-transfer-new-visit
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Norwegian wording when it preserves the location-direction contrast
    and speaker viewpoint.
  criteria:
  - id: new-visit-where-question
    instruction: Includes a direct question with hvor about an unknown place.
  - id: new-visit-location-direction
    instruction: Uses location forms for current positions and directional forms for
      movement through and out of the building.
  - id: new-visit-speaker-viewpoint
    instruction: Maintains a consistent speaker-relative use of her/hit and der/dit.
