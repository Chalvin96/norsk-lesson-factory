- handle: choose_home_location_or_direction
  op: choose
  objective: obj-directional-vs-locative-adverbs-01
  bloom: understand
  prompt_md: The speaker is travelling home after a meeting. Choose the Norwegian
    form that expresses movement homeward, not an activity taking place at home.
  derived_from:
  - section_id: sec-home-location-direction
  stem_md: Choose the sentence that expresses the intended meaning.
  options:
  - id: direction
    text: Jeg går hjem.
    correct: true
    why: Hjem is the directional form used for movement toward home.
  - id: location
    text: Jeg går hjemme.
    correct: false
    why: Hjemme describes a location where an activity takes place.
- handle: use_speaker_viewpoint
  op: choose
  objective: obj-directional-vs-locative-adverbs-01
  bloom: understand
  prompt_md: Maja is in room 204 and speaks to Emil, who is elsewhere in the building.
    Choose the exchange in which each speaker uses the forms relative to their own
    viewpoint.
  derived_from:
  - section_id: sec-here-there-viewpoint
  stem_md: Choose the exchange that matches both speakers viewpoints.
  options:
  - id: swapped-viewpoints
    text: 'Maja: Jeg er her. Kom dit. Emil: Du er der. Jeg går hit.'
    correct: false
    why: Maja should use hit toward her own location, while Emil should use dit toward
      hers.
  - id: consistent-viewpoints
    text: 'Maja: Jeg er her. Kom hit. Emil: Du er der. Jeg går dit.'
    correct: true
    why: Maja uses her and hit for her location; Emil uses der and dit for that other
      location.
