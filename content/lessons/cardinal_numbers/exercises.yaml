    options:
    - åtte
    - seks
    - ni
    answer_index: 0
  - text_md: ' bøker 3 apples: '
  - blank_id: three-apples
    options:
    - fire
    - tre
    - to
    answer_index: 1
  - text_md: ' epler 10 tables: '
  - blank_id: ten-tables
    options:
    - fem
    - ni
    - ti
    answer_index: 2
  - text_md: ' bord 6 eggs: '
  - blank_id: six-eggs
    options:
    - seks
    - fem
    - sju
    answer_index: 0
  - text_md: ' egg 1 cup: '
  - blank_id: one-cup
    options:
    - ett
    - en
    - to
    answer_index: 1
  - text_md: ' kopp'
