- handle: set-the-table-transfer
  op: write
  objective: obj-cardinal-numbers-01
  bloom: apply
  prompt_md: Mina is setting a table for visitors. Write 2–4 Norwegian sentences stating
    that she has two chairs, one table, one cup, and three glasses. Use the correct
    quantity phrase for every item, including both en and ett for the one-item groups.
  derived_from:
  - section_id: new-situation
  response_language: 'no'
  min_words: 10
  max_words: 30
  judge_prompt: Check that the response describes the stated table-setting quantities
    in natural Norwegian. Report evidence for each criterion and accept natural sentence
    variants.
  criteria:
  - id: chairs-quantity
    instruction: States the quantity two chairs as to stoler.
  - id: table-ett
    instruction: States the quantity one table as ett bord.
  - id: cup-en
    instruction: States the quantity one cup as en kopp.
  - id: glasses-quantity
    instruction: States the quantity three glasses as tre glass.
