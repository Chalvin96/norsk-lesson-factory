  objective: obj-cardinal-numbers-01
  bloom: remember
  prompt_md: Fill each blank with the Norwegian number matching the stated group size.
  explanation_md: "Use en before a common-gender noun such as kopp and ett before a neuter noun; higher numbers do not carry that gender contrast."
  derived_from:
