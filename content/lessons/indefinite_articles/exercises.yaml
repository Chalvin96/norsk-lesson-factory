  - text_md: .
- handle: four_way_retrieval_review
  op: write
  objective: obj-indefinite-articles-01
  bloom: apply
  prompt_md: 'Without looking back, write four natural Norwegian examples: one with
    en, one with ei, one with et, and one with no article. Make the no-article example
    express either a simple role after være or a substance.'
  derived_from:
  - section_id: back-at-the-flat
  response_language: 'no'
  min_words: 4
  max_words: 20
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that clearly use the requested article or no-article
    meaning.
  criteria:
  - id: en-example
    instruction: Includes one natural singular noun phrase with en.
  - id: ei-example
    instruction: Includes one natural singular noun phrase with ei.
  - id: et-example
    instruction: Includes one natural singular noun phrase with et.
  - id: no-article-example
    instruction: Includes one natural no-article example expressing a simple role
      after være or a substance.
