- handle: room_article_hunt
  op: recall_fill
  objective: obj-indefinite-articles-01
  bloom: understand
  prompt_md: |
    Fill each blank with the correct Norwegian indefinite article. This exercise explicitly
    uses the traditional three-gender convention: use «ei» for feminine nouns, and treat
    «ei» as the keyed answer even though «en» is also used for feminine nouns in some
    Norwegian varieties. Read each completed article-and-noun phrase as one unit.
  explanation_md: "Choose the article from the noun’s gender: en for masculine/common, ei for feminine in this three-gender convention, and et for neuter. A profession after «være» is normally bare."
  derived_from:
  - section_id: one-thing-en-ei-et
  audio_target: "Amina ser en seng, ei hylle og et skrivebord."
  segments:
  - text_md: 'Amina ser '
  - blank_id: room-seng-article
    options:
    - en
    - et
    - ei
    answer_index: 0
  - text_md: ' seng, '
  - blank_id: room-hylle-article
    options:
    - et
    - ei
    - en
    answer_index: 1
  - text_md: ' hylle og '
  - blank_id: room-skrivebord-article
    options:
    - en
    - ei
    - et
    answer_index: 2
  - text_md: ' skrivebord.'
