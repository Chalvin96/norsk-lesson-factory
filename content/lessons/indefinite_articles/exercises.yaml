- handle: drink_or_serving
  op: choose
  objective: obj-indefinite-articles-01
  bloom: understand
  prompt_md: Amina orders one serving of coffee at a café. Choose the sentence that
    expresses this serving meaning rather than coffee as a substance.
  derived_from:
  - section_id: no-article-for-a-substance
  stem_md: Which sentence matches the café order?
  options:
  - id: substance
    text: Amina kjøper kaffe.
    correct: false
    why: Kaffe without an article refers to coffee as a substance or product.
  - id: serving
    text: Amina kjøper en kaffe.
    correct: true
    why: En kaffe treats coffee as one countable serving.
