- handle: noun_focus_in_the_cabin
  op: recall_fill
  objective: obj-exclamatives-with-for-and-sa-01
  bloom: understand
  prompt_md: Complete each cabin reaction. Choose the marker that makes each reaction
    noun-focused, with the reaction organized around a person, place, or thing.
  explanation_md: "Use «for en/et/noen» when the noun phrase is the focus. Use «så + adjective/adverb» for degree, and keep subject-before-verb statement order in a full exclamation."
  derived_from:
  - section_id: noun-focused-exclamations-with-for
  audio_target: "For en fin leilighet! For et stort kjøkken! For noen vakre blomster!"
  segments:
  - text_md: 'Item 1: '
  - blank_id: cabin-noun-marker-1
    options:
    - For
    - Så
    answer_index: 0
  - text_md: ' en fin leilighet! 2. '
  - blank_id: cabin-noun-marker-2
    options:
    - Så
    - For
    answer_index: 1
  - text_md: ' et stort kjøkken! 3. '
  - blank_id: cabin-noun-marker-3
    options:
    - For
    - Så
    answer_index: 0
  - text_md: ' noen vakre blomster!'
- handle: shift_the_focus
  op: recall_fill
  objective: obj-exclamatives-with-for-and-sa-01
  bloom: apply
  prompt_md: Complete two reactions to the same evening. Focus on the named evening
    first, then on the degree of its quality. Choose the marker that matches each
    focus.
  derived_from:
  - section_id: for-sa-focus-contrast
  audio_target: "For en vakker kveld! Så vakker kvelden er!"
  segments:
  - text_md: 'Same quiet evening — noun focus: '
  - blank_id: shift-noun-marker
    options:
    - Så
    - For
    answer_index: 1
  - text_md: ' en vakker kveld! Same evening — degree focus: '
  - blank_id: shift-degree-marker
    options:
    - Så
    - For
    answer_index: 0
  - text_md: ' vakker kvelden er!'
- handle: exclamation_not_question
  op: build
  objective: obj-exclamatives-with-for-and-sa-01
  bloom: apply
  prompt_md: Build the complete Norwegian så exclamation. Keep the subject before
    the verb so the response is an exclamation, not a question.
  derived_from:
  - section_id: exclamations-keep-statement-word-order
  tokens:
  - token_id: tok-2
    text: vakker
  - token_id: tok-3
    text: utsikten
  - token_id: tok-4
    text: er!
  - token_id: tok-1
    text: Så
  answer_order:
  - tok-1
  - tok-2
  - tok-3
  - tok-4
- handle: repair_mixed_reactions
  op: find_fix
  objective: obj-exclamatives-with-for-and-sa-01
  bloom: analyze
  prompt_md: Select the one token that is wrong/needs changing.
  derived_from:
  - section_id: avoid-mixing-the-two-patterns
  tokens:
  - token_id: tok-marker
    text: Så
  - token_id: tok-article
    text: en
  - token_id: tok-adjective
    text: søt
  - token_id: tok-noun
    text: hund!
  error_token_id: tok-marker
  feedback: Replace Så with For; the repaired reaction is For en søt hund!.
- handle: complete_the_cabin_conversation
