  objective: obj-exclamatives-with-for-and-sa-01
  bloom: apply
  prompt_md: Complete two new turns in Ingrid’s cabin conversation. Maja admires a
    named view; Elias emphasizes the degree of its beauty. Select the complete Norwegian
    exclamation with the intended marker and statement word order.
  derived_from:
  - section_id: back-at-the-cabin
  audio_target: "For en vakker utsikt vi hadde! Så fin utsikten er!"
  segments:
  - text_md: 'Maja: '
  - blank_id: cabin-turn-maja
    options:
    - Så vakker utsikten er!
    - For en vakker utsikt hadde vi!
    - For en vakker utsikt vi hadde!
    answer_index: 2
  - text_md: ' Then Elias: '
  - blank_id: cabin-turn-elias
    options:
    - Så fin utsikten er!
    - Så fin er utsikten!
    - For en fin utsikt!
    answer_index: 0
- handle: birthday_party_reactions
  op: recall_fill
  objective: obj-exclamatives-with-for-and-sa-01
  bloom: apply
  prompt_md: Complete controlled reactions for Amir and Nora at a birthday party.
    For each meaning cue, select the complete Norwegian exclamation. Use for for noun
    focus and så for degree focus, while keeping the subject before the verb in full
    clauses.
  derived_from:
  - section_id: transfer-to-a-new-situation
  audio_target: "For en vakker sang de synger! Så vakkert de synger! For et godt måltid vi har laget! Så glade de er!"
  segments:
  - text_md: 'Noun focus — a named song at the party: '
  - blank_id: party-song-noun
    options:
    - Så vakker sangen er!
    - For en vakker sang de synger!
    - Så vakker er sangen!
    answer_index: 1
  - text_md: ' Degree focus — how beautifully they sing: '
  - blank_id: party-song-degree
    options:
    - For en vakker sang de synger!
    - Så vakkert synger de!
    - Så vakkert de synger!
    answer_index: 2
  - text_md: ' Noun focus — a good meal at the party: '
  - blank_id: party-meal-noun
    options:
    - For et godt måltid vi har laget!
    - Så godt måltidet er!
    - For et godt måltid har vi laget!
    answer_index: 0
  - text_md: ' Degree focus — how happy the guests are: '
  - blank_id: party-guests-degree
    options:
    - For noen glade gjester!
    - Så glade de er!
    - Så glade er de!
    answer_index: 1
- handle: two_ways_to_react
  op: write
  objective: obj-exclamatives-with-for-and-sa-01
  bloom: apply
  prompt_md: 'Choose an everyday scene at a workplace, shop, or bus stop. Write exactly
    two Norwegian exclamations about it: one
    noun-focused reaction about a person or thing using for, and one degree-focused
    reaction using så. In any full clause, keep the subject before the verb; do not
    use question inversion.'
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Treat any question inversion as failing the word-order criterion.
  criteria:
  - id: noun-focused-for
    instruction: Uses one noun-focused exclamation with for for a person or thing.
  - id: degree-focused-sa
    instruction: Uses one degree-focused exclamation with så.
  - id: no-question-inversion
    instruction: Keeps the subject before the verb in any full clause and does not
      use question inversion.
