- handle: reconstruct_maris_delay
  op: write
  objective: obj-pluperfect-01
  bloom: apply
  prompt_md: 'Write a short guided account in Norwegian about Mari’s delay. State
    that she went to the wrong bus stop because she followed the old bus route to
    the café, discovered the mistake, and waited for the next bus. Also include these
    earlier facts: she checked the new bus route, she saved the old route on her phone,
    and the bus on the new route left the correct stop. Keep the main events in the
    simple past and mark each earlier completed fact with hadde plus a past participle.
    Write 4–6 sentences.'
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: Check the Norwegian account against the task and report concrete evidence
    for each criterion. Do not award a criterion without explicit language evidence.
  criteria:
  - id: main-sequence
    instruction: States that Mari followed the old bus route to the wrong stop, discovered
      the mistake, and waited for the next bus in simple past.
  - id: prior-completions
    instruction: 'Uses hadde followed by an accurate past participle for each supplied
      earlier fact: checking the new route, saving the old route, and the bus leaving
      the correct stop.'
  derived_from:
  - section_id: returning-to-mari-jonas-and-amina
- handle: repair_the_reversed_timeline
  op: find_fix
  objective: obj-pluperfect-01
  bloom: analyze
  prompt_md: 'The guests arrived first, and only afterward did we clean the kitchen.
    Select the one token that is wrong/needs changing in this timeline.'
  tokens:
  - token_id: tok-1
    text: Da
  - token_id: tok-2
    text: gjestene
  - token_id: tok-3
    text: hadde
  - token_id: tok-4
    text: kommet,
  - token_id: tok-5
    text: hadde
  - token_id: tok-6
    text: vi
  - token_id: tok-7
    text: ryddet
  - token_id: tok-8
    text: kjøkkenet.
  error_token_id: tok-5
  feedback: 'Remove the second «hadde». The arrival is earlier, so keep «hadde kommet»
    and use simple past for later cleaning: «Da gjestene hadde kommet, ryddet vi kjøkkenet.»'
  derived_from:
  - section_id: likely-misconception-not-every-earlier-event-needs-hadde
- handle: cabin_arrival_transfer
  op: write
  objective: obj-pluperfect-01
  bloom: apply
  prompt_md: Write four short affirmative Norwegian statements about the holiday cabin.
    Henrik and Lea arrived late on Friday evening. Before they arrived, their friends
    lit the fire, bought food, made the beds, and found the key. Show each completed
    preparation with hadde plus a past participle.
  response_language: 'no'
  judge_prompt: Check the Norwegian statements against the task and report evidence
    for each criterion. Accept natural Bokmål variants for the supplied facts.
  criteria:
  - id: cabin-facts
    instruction: Writes four affirmative Norwegian statements covering lighting the
      fire, buying food, making the beds, and finding the key.
  - id: cabin-form
    instruction: Uses hadde followed by an accurate past participle for each preparation.
  - id: cabin-timeline
    instruction: Places each preparation clearly before Henrik and Lea arrived.
  derived_from:
  - section_id: transfer-arriving-at-a-holiday-cabin
- handle: what_had_already_happened
  op: write
  objective: obj-pluperfect-01
  bloom: apply
  prompt_md: At a railway station, Sara arrived late. Write exactly two Norwegian
    sentences stating two natural things that had already happened before she arrived.
    Choose your own actions rather than copying a complete lesson sentence. Use hadde
    plus a past participle in each sentence.
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål variants that fit the station context, but not a complete
    sentence copied verbatim from the lesson.
  criteria:
  - id: two-earlier-actions
    instruction: Writes exactly two Norwegian sentences with two distinct completed
      actions before Sara arrived.
  - id: past-perfect-forms
    instruction: Uses hadde followed by an accurate past participle in each sentence.
  - id: earlier-reference
    instruction: Makes both actions clearly earlier than Sara’s arrival.
  derived_from:
  - section_id: final-retrieval
