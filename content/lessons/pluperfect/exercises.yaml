- handle: notice_the_earlier_event
  op: choose
  objective: obj-pluperfect-01
  bloom: understand
  prompt_md: 'In the café scene, read these two statements: «Da Mari kom, hadde vi
    bestilt mat.» «Da Mari kom, hadde servitøren satt maten på bordet.» Choose the
    complete interpretation of both timelines.'
  stem_md: Which option identifies the action completed first and Mari’s later arrival
    in both statements?
  options:
  - id: reversed-events
    text: I begge setningene kom Mari først; vi bestilte mat og servitøren satte maten
      på bordet etterpå.
    correct: false
    why: This reverses the earlier and later events marked by the past perfect.
  - id: earlier-events
    text: I setningen «Da Mari kom, hadde vi bestilt mat» viser «hadde bestilt» at
      vi bestilte mat før Mari kom. I setningen «Da Mari kom, hadde servitøren satt
      maten på bordet» viser «hadde satt» at servitøren satte maten på bordet før
      Mari kom.
    correct: true
    why: Both hadde phrases mark actions completed before Mari’s arrival.
  derived_from:
  - section_id: late-arrival
