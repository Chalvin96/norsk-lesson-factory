- handle: correct_gender_errors_on_majas_list
  op: choose
  objective: obj-noun-gender-01
  bloom: analyze
  prompt_md: 'Maja writes `en hylle` in a Bokmål shopping list. Which statement correctly
    describes the article choice? Remember that Bokmål permits both common-gender `en`
    and feminine `ei` for this noun.'
  derived_from:
  - section_id: checkpoint-repair-article-mistakes
  options:
  - id: both-accepted
    text: Both `en hylle` and `ei hylle` are valid Bokmål forms.
    correct: true
    why: Hylle can use common gender with en or feminine gender with ei in Bokmål.
  - id: feminine-only
    text: Only `ei hylle` is valid; `en hylle` must be corrected.
    correct: false
    why: Common-gender `en hylle` is also an accepted Bokmål form.
  - id: common-only
    text: Only `en hylle` is valid; `ei hylle` must be corrected.
    correct: false
    why: Feminine `ei hylle` is also an accepted Bokmål form.
