- handle: describe_missing_items_in_the_study_room
  op: write
  objective: obj-noun-gender-01
  bloom: apply
  prompt_md: 'Jonas is checking a study room. Write three short Norwegian sentences:
    say whether a chair is present or missing, do the same for a shelf, and do the
    same for a table. Use complete phrases with the correct indefinite articles for
    stol, hylle, and bord. You may use either traditional three-gender Bokmål with ei
    for feminine nouns or consistent common-gender Bokmål with en. Communicate about
    this study room rather than copying the shop dialogue.'
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål wording and ordinary word order. This exercise uses the
    traditional three-gender convention, so prefer en stol, ei hylle, and et bord; also
    accept consistent common-gender en with feminine nouns as valid Bokmål. Require clear
    statements about whether each object is present or missing.
  criteria:
  - id: study-chair
    instruction: Uses the correct indefinite article with stol in a complete Norwegian
      sentence about the study room.
  - id: study-shelf
    instruction: Uses the correct indefinite article with hylle in a complete Norwegian
      sentence about the study room.
  - id: study-table
    instruction: Uses the correct indefinite article with bord in a complete Norwegian
      sentence about the study room.
  - id: study-status
    instruction: States whether each of the three objects is present or missing in
      new Norwegian sentences about the study room.
- handle: retrieve_three_gender_patterns
  op: write
  objective: obj-noun-gender-01
  bloom: apply
  prompt_md: 'Complete all three parts in Norwegian. First write
    the article-noun phrases for stol (chair), lampe (lamp), and bord (table). Then
    add the correct article to bok (book), nøkkel (key), teppe (rug), hylle (shelf),
    vindu (window), and bilde (picture). Finally write three short sentences about
    objects needed in a room: one with an en noun, one with an ei noun, and one with
    an et noun. You may use either traditional three-gender Bokmål with ei for feminine
    nouns or consistent common-gender Bokmål with en.'
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 25
  max_words: 70
  judge_prompt: Check every requested phrase and sentence. Accept ordinary natural
    Bokmål wording and word order. This exercise uses the traditional three-gender
    convention, so the taught forms are en stol, ei lampe, et bord, ei bok, en nøkkel,
    et teppe, ei hylle, et vindu, and et bilde; also accept consistent common-gender en
    with feminine nouns as valid Bokmål. For the final part, require three Norwegian
    room-object sentences about what is needed, with one en phrase, one feminine phrase,
    and one et phrase. Report evidence for each criterion.
  criteria:
  - id: first-three-phrases
    instruction: Writes the correct article-noun phrases for stol, lampe, and bord.
  - id: remaining-six-phrases
    instruction: Writes the correct articles with bok, nøkkel, teppe, hylle, vindu,
      and bilde.
  - id: three-gender-sentences
    instruction: Writes three short Norwegian sentences about objects needed in a
      room, with one masculine en phrase, one feminine ei or en phrase, and one et phrase.
