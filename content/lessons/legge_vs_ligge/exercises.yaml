- handle: follow_one_object
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: apply
  prompt_md: 'Choose one object that naturally follows the legge–ligge pattern, such
    as a passport during a journey or a contract at an office. Write four connected
    Norwegian sentences about the same situation: first a present placement using
    legger, then its present location using ligger, one past placement using la, and
    one past location using lå.'
  derived_from:
  - section_id: fourth-checkpoint
  response_language: 'no'
  min_words: 20
  max_words: 60
  judge_prompt: Check whether the learner follows one compatible object through present
    and past placement and location. Report evidence for every criterion and accept
    natural Bokmål variation that preserves the requested forms and situation.
  criteria:
  - id: present-placement
    instruction: Describes someone putting the object somewhere in the present using
      **legger**.
  - id: present-location
    instruction: Describes the object's compatible present location using **ligger**.
  - id: past-placement
    instruction: Describes a past act of putting the object somewhere using **la**.
  - id: past-location
    instruction: Describes the object's compatible past location using **lå**.
  - id: same-situation
    instruction: Keeps the same object and a coherent basic situation across all four
      sentences.
- handle: final_guided_practice
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: apply
  prompt_md: Write a short connected continuation about the group looking for one
    more cabin object needed for the evening. Choose an object that naturally follows
    the legge–ligge pattern. Include a question about its location, an explanation
    of where someone put it, a statement about where it is now, and a final instruction
    to put it in a useful place. Use forms of legge for placement and forms of ligge
    for location.
  derived_from:
  - section_id: final-guided-practice
  response_language: 'no'
  min_words: 25
  max_words: 70
  judge_prompt: Check the continuation for all four requested parts, connected cabin
    context, and consistent use of legge for placement actions and ligge for compatible
    locations. Report evidence for every criterion and accept natural Bokmål variants.
  criteria:
  - id: location-question
    instruction: Includes a question about the object's location using an appropriate
      form of **ligge**.
  - id: placement-explanation
    instruction: Explains where someone put the object using an appropriate form of
      **legge**.
  - id: current-location
    instruction: States where the object is now using an appropriate form of **ligge**.
  - id: final-instruction
    instruction: Ends with an instruction to put the object in a useful place using
      an appropriate form of **legge**.
  - id: connected-continuation
    instruction: Presents all four parts as connected language in the cabin situation
      with one compatible object.
