- handle: identify_action_or_location
  op: categorize
  objective: obj-legge-vs-ligge-01
  bloom: analyze
  prompt_md: 'Classify each cabin sentence by its meaning: someone puts an object
    somewhere, or something is located somewhere. Do not change the sentences.'
  explanation_md: "Legge describes causing something to change location and normally takes an object; ligge describes the resulting location."
  derived_from:
  - section_id: first-checkpoint
  buckets:
  - bucket_id: placement-action
    label: Putting an object somewhere
  - bucket_id: location
    label: Saying where something is located
  items:
  - item_id: towels-action
    text: Maja legger håndklærne på senga.
    bucket_id: placement-action
  - item_id: keys-location
    text: Nøklene ligger på bordet.
    bucket_id: location
  - item_id: food-action
    text: Henrik legger maten i kjøleskapet.
    bucket_id: placement-action
  - item_id: clothes-location
    text: Klærne ligger i skapet.
    bucket_id: location
  - item_id: jackets-action
    text: Maja legger jakkene på benken.
    bucket_id: placement-action
  - item_id: towels-location
    text: Håndklærne ligger på badet.
    bucket_id: location
