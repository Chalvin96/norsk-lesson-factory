- handle: retrieve_four_past_perspectives
  op: write
  objective: obj-conditional-perfect-01
  bloom: apply
  prompt_md: Write exactly four short Norwegian sentences about one failed plan to
    join a morning hike. Sentence one must express an unfulfilled expectation with
    skulle ha. Sentence two must express an unreal outcome under a different past
    circumstance with ville ha. Sentence three must express regret or criticism with
    burde ha or burde ikke ha. Sentence four must express an unused possibility with
    kunne ha. Each sentence must use modal plus ha plus a past participle and communicate
    its distinct perspective. Use one coherent fresh situation.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 35
  max_words: 80
  judge_prompt: Check the response against the task and report evidence separately
    for each criterion. Accept natural Bokmål variants that preserve the four required
    modal perspectives and the modal-perfect structure.
  criteria:
  - id: four-modal-perfect-sentences
    instruction: Writes exactly four coherent Norwegian sentences, each using modal
      plus ha plus a past participle.
  - id: unfulfilled-expectation
    instruction: Uses skulle ha for an arrangement or expectation that failed.
  - id: unreal-past-outcome
    instruction: Uses ville ha for a result under a different past circumstance.
  - id: retrospective-judgment
    instruction: Uses burde ha or burde ikke ha for regret or criticism about the
      past.
  - id: missed-possibility
    instruction: Uses kunne ha for an available action that was not realized.
