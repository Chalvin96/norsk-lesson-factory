- handle: notice_modal_perspective
  op: choose
  objective: obj-conditional-perfect-01
  bloom: understand
  prompt_md: Choose the one interpretation set that correctly matches all four modal
    phrases in this failed dinner context. Score perspective, not participle form.
  derived_from:
  - section_id: looking-back-from-the-present
  stem_md: Match each phrase with its target reading and choose the complete set.
  options:
  - id: swapped-set
    text: skulle ha vært ferdige nå — retrospective advice or judgment; burde ha begynt
      tidligere — unfulfilled expectation; kunne ha laget en salat — unreal past outcome;
      ville ha tatt med noe hvis jeg hadde visst — missed possibility.
    correct: false
    why: This swaps the expectation and judgment readings and also swaps the possibility
      and unreal-outcome readings.
  - id: surface-set
    text: skulle ha vært ferdige nå — unfulfilled expectation; burde ha begynt tidligere
      — missed possibility; kunne ha laget en salat — retrospective advice or judgment;
      ville ha tatt med noe hvis jeg hadde visst — unreal past outcome.
    correct: false
    why: kunne ha is treated as advice and burde ha as possibility, contrary to the
      target readings.
  - id: reversed-set
    text: skulle ha vært ferdige nå — unreal past outcome; burde ha begynt tidligere
      — missed possibility; kunne ha laget en salat — unfulfilled expectation; ville
      ha tatt med noe hvis jeg hadde visst — retrospective advice or judgment.
    correct: false
    why: The set assigns all four phrases to the wrong perspectives.
  - id: correct-set
    text: skulle ha vært ferdige nå — unfulfilled expectation (You were supposed to
      be finished by now); burde ha begynt tidligere — retrospective advice or judgment
      (We should have started earlier); kunne ha laget en salat — missed possibility
      (I could have made a salad); ville ha tatt med noe hvis jeg hadde visst — unreal
      past outcome (I would have brought something if I had known).
    correct: true
    why: This set assigns each modal the target perspective established by the context.
