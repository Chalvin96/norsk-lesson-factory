- handle: notice_known_past_time
  op: choose
  objective: obj-past-tense-01
  bloom: understand
  prompt_md: 'Read the Monday-morning exchange. Choose the one interpretation that
    identifies the first known-past expression and correctly links the event verbs
    to their infinitives. Maja: Hva gjorde du i går? Jonas: Jeg gikk til byen og tok
    bussen hjem.'
  derived_from:
  - section_id: checkpoint-notice-known-past-time
  stem_md: Which interpretation matches the exchange?
  options:
  - id: shared-known-past
    text: «I går» etablerer kjent fortid. «Gjorde» er preteritum av «å gjøre», «gikk»
      er preteritum av «å gå», og «tok» er preteritum av «å ta». De senere verbene
      hører til samme tidsramme, selv om «i går» ikke gjentas.
    correct: true
    why: The expression establishes known past time, and the verb–infinitive links
      and shared frame are correct.
  - id: present-routine
    text: «I går» beskriver nåtid. «Gjorde», «gikk» og «tok» må derfor leses som nåtidsformer,
      og de senere setningene har ingen felles tidsramme.
    correct: false
    why: «I går» is a past-time expression, and these forms are preteritum.
  - id: separate-time-frames
    text: «I går» etablerer ikke tidsrammen. «Gjorde», «gikk» og «tok» må tolkes hver
      for seg, så samtalen viser ikke en felles fortid.
    correct: false
    why: The dialogue uses one shared past-time frame established by «i går».
