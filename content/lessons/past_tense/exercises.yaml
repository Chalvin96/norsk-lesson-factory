- handle: choose_tense_from_time_frame
  op: choose
  objective: obj-past-tense-01
  bloom: understand
  prompt_md: Read the exchange and choose the form that fits the shared time frame.
  derived_from:
  - section_id: checkpoint-choose-tense-time-frame
  stem_md: 'Maja: Hva gjorde du i går? Jonas: Jeg [BLANK] hjemme.'
  options:
  - id: past-form
    text: var
    correct: true
    why: The preceding question establishes a known past time, so «var» is required.
  - id: present-form
    text: er
    correct: false
    why: «Er» is present tense and does not fit the past time established by «i går».
- handle: reconstruct_the_evening
  op: write
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: 'Write a short account in Norwegian for Maja''s incomplete notes about
    Sara and Jonas''s evening. The fixed time frame is «I går kveld». Use these events
    in this order: - Sara waited for the bus (å vente). - Jonas called Maja (å ringe).
    - Sara tried to find a café (å prøve). - Jonas went to the station (å gå). - Jonas
    did not take the bus (å ta). - They came home (å komme). Include positive statements
    and one negative statement.'
  derived_from:
  - section_id: practice-reconstruct-evening
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: Check the response against the task and report evidence for each criterion.
    Accept natural Bokmål wording and normal sentence variation when the required
    event meanings, event order, and verb forms are clear.
  criteria:
  - id: consistent-preteritum
    instruction: Uses Norwegian preteritum consistently for the shared past time «I
      går kveld».
  - id: regular-forms
    instruction: Uses the correct preteritum forms «ventet», «ringte», and «prøvde»
      for the supplied regular events.
  - id: irregular-forms
    instruction: Uses the correct preteritum forms «gikk», «tok», and «kom» for the
      supplied irregular events.
  - id: positive-negative
    instruction: Includes positive statements and one clear negative statement for
      the bus event, using «tok ikke» or an equivalent natural Bokmål construction.
  - id: event-content
    instruction: >-
      Includes all six requested events: Sara waits for the bus, Jonas calls Maja,
      Sara tries to find a café, Jonas goes to the station, Jonas does not take the
      bus, and they come home.
  - id: event-sequence
    instruction: Presents the six requested events in the stated order.
