  objective: obj-jo-desto-correlatives-01
  bloom: apply
  prompt_md: 'Build one complete Norwegian sentence for exam preparation: more practice
    leads to greater confidence. Use jo ... desto and all supplied tokens.'
  explanation_md: "Each half has comparative wording. In the jo-clause, the finite verb follows the subject; in the desto-clause, the finite verb comes before the subject: jo mer du øver, desto tryggere blir du."
