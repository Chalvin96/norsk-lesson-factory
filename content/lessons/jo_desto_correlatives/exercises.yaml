- handle: notice_the_linked_changes
  op: choose
  objective: obj-jo-desto-correlatives-01
  bloom: understand
  prompt_md: Read these five proportional statements from a kitchen decision. Choose
    the interpretation that identifies both changing scales and the direction of the
    second scale in every statement. 1. Jo lenger vi venter, desto senere blir kjøkkenet
    ferdig. 2. Jo raskere vi bestemmer oss, desto større blir risikoen for feil valg.
    3. Jo flere tilbud vi sammenligner, desto lettere blir det å velge. 4. Jo mer jeg
    ser på prisene, jo mindre sikker blir jeg. 5. Jo tidligere vi sender bestillingen,
    desto bedre blir resultatet.
  derived_from:
  - section_id: a-kitchen-decision
  stem_md: Choose the interpretation that shows the proportional statements describe
    connected changes rather than unrelated facts.
  options:
  - id: reversed-directions
    text: Ventetiden øker, og kjøkkenet blir ferdig tidligere; beslutningstempoet
      øker, og risikoen for feil valg blir mindre; antallet tilbud vi sammenligner
      øker, og det blir vanskeligere å velge; jeg ser mer på prisene, og jeg blir
      sikrere; vi sender bestillingen tidligere, og resultatet blir dårligere.
    correct: false
    why: This reverses the direction of the connected changes.
  - id: all-linked-correct
    text: Ventetiden øker, og kjøkkenet blir ferdig senere; beslutningstempoet øker,
      og risikoen for feil valg blir større; antallet tilbud vi sammenligner øker,
      og det blir lettere å velge; jeg ser mer på prisene, og jeg blir mindre sikker;
      vi sender bestillingen tidligere, og resultatet blir bedre.
    correct: true
    why: This option identifies both changing things and the direction of the second
      change in all five statements.
  - id: unrelated-facts
    text: 'Utsagnene beskriver bare fem separate fakta: kjøkkenet blir ferdig, beslutningen
      tas, tilbud sammenlignes, priser sees på og bestilling sendes. Ingen endring
      i den ene delen er koblet til den andre.'
    correct: false
    why: The construction explicitly connects two changes in each statement.
- handle: match_the_direction_of_change
  op: choose
  objective: obj-jo-desto-correlatives-01
  bloom: understand
  prompt_md: Choose the Norwegian set that expresses all four proportional relationships
    listed here (study, money, travel, and work).
  derived_from:
  - section_id: one-change-follows-another
  stem_md: 'Choose the set that expresses all four intended relationships: more practice
    leads to more confidence; buying less leads to saving more; leaving earlier leads
    to meeting less traffic; working longer on the text leads to a better text.'
  options:
  - id: directions-match
    text: 'Jo mer du øver, desto tryggere blir du. Jo mindre vi kjøper, jo mer sparer
      vi. Jo tidligere vi drar, desto mindre trafikk møter vi. Jo lenger hun arbeider
      med teksten, desto bedre blir den. '
    correct: true
    why: All four second comparatives express the intended result of the first change.
  - id: one-direction-reversed
    text: 'Jo mer du øver, desto tryggere blir du. Jo mindre vi kjøper, jo mer sparer
      vi. Jo tidligere vi drar, desto mer trafikk møter vi. Jo lenger hun arbeider
      med teksten, desto bedre blir den. '
    correct: false
    why: The travel relationship gives more traffic after leaving earlier, contrary
      to the intended result.
  - id: directions-reversed
    text: 'Jo mindre du øver, desto tryggere blir du. Jo mindre vi kjøper, jo mindre
      sparer vi. Jo tidligere vi drar, desto mer trafikk møter vi. Jo lenger hun arbeider
      med teksten, desto verre blir den. '
    correct: false
    why: Several second comparatives give the opposite direction from the intended
      relationships.
- handle: complete_the_proportional_frame
