- handle: advise_maja_and_henrik
  op: write
  objective: obj-jo-desto-correlatives-01
  bloom: apply
  prompt_md: 'Write three short recommendations in Norwegian for Maja and Henrik,
    one for each update: delaying the order further means later kitchen completion;
    discovering more extra costs makes the cheapest offer less attractive; requesting
    fewer changes lets the company finish sooner. Link each change and result with
    either jo ... desto or jo ... jo. Use your own wording.'
  derived_from:
  - section_id: back-to-maja-and-henrik
  response_language: 'no'
  min_words: 20
  max_words: 55
  judge_prompt: Accept natural Norwegian variants that preserve the supplied renovation
    facts and target construction. Check the response against the task and report
    evidence for each criterion.
  criteria:
  - id: renovation-links
    instruction: Links each of the three renovation changes to its likely result in
      a proportional construction.
  - id: target-pairing
    instruction: Uses jo ... desto or jo ... jo in each recommendation.
  - id: independent-wording
    instruction: Uses original Norwegian wording for the renovation recommendations.
