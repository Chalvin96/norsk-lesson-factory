- handle: identify_understood_noun
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: A shop assistant has mentioned «et lite bord» and «de blå stolene».
    Later, the assistant refers to them only as «det lille» and «de blå». Choose
    the complete interpretation for both shortened phrases. Focus on which nouns
    are understood; adjective endings are not the primary target.
  derived_from:
  - section_id: understanding-what-has-been-left-out
  stem_md: Which option correctly identifies the understood noun for each phrase?
  options:
  - id: reversed
    text: det lille viser til stolene; de blå viser til et bord
    correct: false
    why: The noun references are reversed.
  - id: correct
    text: det lille viser til et bord; de blå viser til stolene
    correct: true
    why: The shop context makes et bord the understood noun for det lille and stolene
      the understood plural noun for de blå.
  - id: other-objects
    text: det lille viser til et skjerf; de blå viser til en stol
    correct: false
    why: These references do not match the established shop context or the singular
      and plural phrases.
- handle: distinguish_definite_gender_and_number
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: In the second-hand shop, interpret den, det, and de. Choose the complete
    interpretation that identifies one common-gender object, one neuter object, and
    several objects.
  derived_from:
  - section_id: definite-forms-the-red-one-and-the-red-ones
  stem_md: Which option correctly classifies den røde, det røde, and de røde?
  options:
  - id: correct
    text: den røde = én stol eller én kopp; det røde = ett skjerf eller ett glass;
      de røde = flere ting
    correct: true
    why: Den marks one common-gender object, det marks one neuter object, and de marks
      several objects.
  - id: swapped-singular-genders
    text: den røde = ett skjerf eller ett glass; det røde = én stol eller én kopp;
      de røde = flere ting
    correct: false
    why: The two singular gender interpretations are swapped.
  - id: swapped-number
    text: den røde = flere ting; det røde = ett skjerf eller ett glass; de røde =
      én stol eller én kopp
    correct: false
    why: The interpretations for den and de have the wrong number.
