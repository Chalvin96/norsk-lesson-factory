- handle: track_reference_across_the_dialogue
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: 'Read this shop exchange: «Vi trenger noen svarte stoler. De svarte
    står ved døra, og de blå står ved vinduet.» Choose the complete interpretation
    showing which phrase introduces an indefinite group, which phrase refers back
    to it, and which phrase identifies the other known group.'
  derived_from:
  - section_id: returning-to-maja-and-erik
  stem_md: Which interpretation correctly tracks noen svarte, de svarte, and de blå?
  options:
  - id: definite-first
    text: noen svarte og de svarte viser begge til en kjent gruppe; de blå introduserer
      en ny gruppe
    correct: false
    why: Noen is indefinite, and de does not introduce an indefinite group.
  - id: reversed-reference
    text: noen svarte introduserer en gruppe; de svarte viser til en annen gruppe;
      de blå viser tilbake til de svarte
    correct: false
    why: The later phrase de svarte is the one that refers back to the introduced
      group.
  - id: correct
    text: noen svarte introduserer noen svarte stoler; de svarte viser tilbake til
      disse stolene; de blå viser til en annen kjent gruppe blå stoler
    correct: true
    why: Noen introduces an indefinite group, de svarte refers back to that group,
      and de blå identifies another known group.
- handle: transfer_adjective_noun_phrases_to_the_bakery
  op: write
  objective: obj-adjectives-as-nouns-01
  bloom: apply
  prompt_md: 'At a bakery, Nora and Hassan are choosing cakes for a meeting. Write
    six short Norwegian responses using adjectives as complete noun phrases and omitting
    the cake nouns. Cover these situations: an unspecified singular common-gender
    cake, an unspecified singular neuter cake, a particular visible common-gender
    cake, a particular visible neuter cake, an unspecified plural group, and a particular
    visible plural group. Use familiar adjectives from the lesson, but create bakery
    responses rather than copying a complete furniture-shop sentence.'
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Check all six requested bakery responses and report evidence for each
    criterion. Accept any adjective form taught in the lesson when it agrees with
    the requested definiteness, gender, and number; do not require one particular
    adjective. Each response must use an adjective-only noun phrase rather than speaking
    the cake noun.
  criteria:
  - id: indefinite-common-singular
    instruction: Includes an unspecified singular common-gender bakery choice with
      en and an agreeing adjective form.
  - id: indefinite-neuter-singular
    instruction: Includes an unspecified singular neuter bakery choice with et and
      an agreeing adjective form.
  - id: definite-common-singular
    instruction: Includes a particular singular common-gender bakery choice with den
      and a definite adjective form.
  - id: definite-neuter-singular
    instruction: Includes a particular singular neuter bakery choice with det and
      a definite adjective form.
  - id: indefinite-plural
    instruction: Includes an unspecified plural bakery choice with the plural adjective
      form and no de.
  - id: definite-plural
    instruction: Includes a particular plural bakery choice with de and the plural
      adjective form.
