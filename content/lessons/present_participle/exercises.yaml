- handle: replace_false_progressive_forms
  op: find_fix
  objective: obj-present-participle-01
  bloom: analyze
  prompt_md: Find the single erroneous progressive construction in this mechanical
    translation. The intended meaning is that looking is the main activity.
  derived_from:
  - section_id: norwegian-no-progressive
  tokens:
  - token_id: tok-1
    text: Ingrid
  - token_id: tok-2
    text: er seende
  - token_id: tok-3
    text: på
  - token_id: tok-4
    text: kjøkkenet.
  error_token_id: tok-2
  feedback: 'Replace the selected construction er seende with the finite verb ser:
    Ingrid ser på kjøkkenet. Norwegian normally uses an ordinary finite verb when
    the activity itself is the main statement.'
- handle: select_natural_structure_for_english_ing
  op: write
  objective: obj-present-participle-01
  bloom: apply
  prompt_md: 'Write four short Norwegian sentences, one for each numbered meaning.
    Use a different natural structure for each: (1) during an apartment viewing, we
    noticed a beeping alarm in the hallway; use an invariable -ende form to describe
    the alarm; (2) Jonas is waiting for the train; use an ordinary finite verb because
    waiting is the main activity; (3) the people living above us seem pleasant; use
    a relative clause with som; (4) reading the contract carefully is important; use
    an infinitive-based structure. Do not translate every English -ing form mechanically
    as -ende.'
  derived_from:
  - section_id: other-english-ing-structures
  response_language: 'no'
  min_words: 18
  max_words: 55
  judge_prompt: Check all four sentences against the four numbered meanings and report
    evidence for each criterion. Accept natural lexical and word-order alternatives
    when they preserve the meaning and required structure. Reject mechanical er plus
    -ende progressive forms.
  criteria:
  - id: noun-participle
    instruction: Describes the alarm with an adjective-like, invariable -ende form.
  - id: finite-main-activity
    instruction: Uses an ordinary finite Norwegian verb for Jonas’s main waiting activity,
      not være plus -ende.
  - id: relative-clause
    instruction: Uses a relative clause with som to identify the people living above.
  - id: infinitive-structure
    instruction: Uses an infinitive-based structure to express reading the contract
      as a general activity.
