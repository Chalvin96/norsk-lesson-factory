- handle: choose_participle_or_relative_clause
  op: choose
  objective: obj-present-participle-01
  bloom: analyze
  prompt_md: Choose the natural everyday Norwegian reformulation. The English meaning
    identifies the people by where they live, so score the structural choice between
    a relative clause and a compressed participle phrase.
  derived_from:
  - section_id: relative-clause
  stem_md: The people living on the floor above you are an older couple.
  options:
  - id: relative-clause
    text: De som bor i etasjen over, er et eldre par.
    correct: true
    why: A relative clause is the usual conversational choice when people are identified
      by where they live.
  - id: compressed-participle
    text: De boende i etasjen over er et eldre par.
    correct: false
    why: De boende is a formal or compressed expression; the relative clause is more
      natural in this everyday context.
- handle: use_participle_for_accompanying_action
  op: recall_fill
  objective: obj-present-participle-01
  bloom: apply
  prompt_md: Fill each blank with the invariable -ende form that adds an accompanying
    action, posture, or manner. Each sentence already contains its finite main verb.
  derived_from:
  - section_id: adverb-like-use
  audio_target: "Vaktmesteren kommer løpende til inngangen. Naboen kom bærende på en stor eske. Ingrid nikket smilende til Mari."
  segments:
  - text_md: 'Vaktmesteren kommer '
  - blank_id: caretaker-running
    options:
    - løpende
    - bærende
    - smilende
    answer_index: 0
  - text_md: ' til inngangen.'
  - text_md: " Naboen kom "
  - blank_id: neighbour-carrying
    options:
