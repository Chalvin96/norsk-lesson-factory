- handle: retrieve_ende_choices_at_the_station
  op: write
  objective: obj-present-participle-01
  bloom: apply
  prompt_md: 'Write four short natural Norwegian sentences about Ingrid and Jonas
    at the railway station, one for each numbered meaning: (1) the waiting passengers
    look at the clock; use an invariable adjective-like -ende form; (2) a conductor
    comes running along the platform while speaking on the phone; use an adverb-like
    -ende form with a finite main verb; (3) Jonas is looking at the train times; use
    an ordinary finite Norwegian verb, not være plus -ende; (4) Ingrid buys coffee
    by pressing the green button; use a natural non-participle method structure with
    ved å plus an infinitive. Do not use -ende as an automatic translation of every
    English -ing form.'
  derived_from:
  - section_id: cumulative-transfer
  response_language: 'no'
  min_words: 20
  max_words: 65
  judge_prompt: Check the four sentences against the four numbered meanings and report
    evidence for each criterion. Accept natural Norwegian lexical and word-order variants
    when each required structural contrast remains clear.
  criteria:
  - id: waiting-passengers
    instruction: Uses an invariable adjective-like -ende form to describe the waiting
      passengers.
  - id: conductor-accompanying-action
    instruction: Uses an adverb-like -ende form with a finite main verb for the conductor’s
      accompanying running.
  - id: station-main-activity
    instruction: Uses an ordinary finite Norwegian verb for Jonas’s looking or checking
      activity, without være plus -ende.
  - id: method-infinitive
    instruction: Uses a natural non-participle method expression, such as ved å plus
      an infinitive, for getting the coffee.
