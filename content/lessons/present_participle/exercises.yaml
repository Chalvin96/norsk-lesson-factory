- handle: identify_present_participles_in_context
  op: recall_fill
  objective: obj-present-participle-01
  bloom: understand
  prompt_md: Complete each blank with the taught present participle that fits the
    meaningful Norwegian sentence. Use the form that describes the person, thing,
    or event.
  explanation_md: "The -ende form is invariable across gender and number and presents an accompanying activity or manner."
  derived_from:
  - section_id: the-present-participle
  audio_target: "Jeg så en sovende katt som lå stille i vogna. Vi våknet av en pipende alarm. I gangen hørte vi en pipende røykvarsler. Vaktmesteren kommer løpende etter alarmen."
  segments:
  - text_md: 'Jeg så en '
  - blank_id: sleeping-cat
    options:
    - sovende
    - pipende
    - løpende
    answer_index: 0
  - text_md: ' katt som lå stille i vogna.'
  - text_md: " Vi våknet av en "
  - blank_id: beeping-alarm
    options:
    - pipende
    - sovende
    - smilende
    answer_index: 0
  - text_md: ' alarm.'
  - text_md: " I gangen hørte vi en "
  - blank_id: beeping-smoke-alarm
    options:
    - pipende
    - sovende
    - smilende
    answer_index: 0
  - text_md: ' røykvarsler.'
  - text_md: " Vaktmesteren kommer "
  - blank_id: running-caretaker
    options:
    - løpende
    - bærende
    - smilende
    answer_index: 0
  - text_md: ' etter alarmen.'
