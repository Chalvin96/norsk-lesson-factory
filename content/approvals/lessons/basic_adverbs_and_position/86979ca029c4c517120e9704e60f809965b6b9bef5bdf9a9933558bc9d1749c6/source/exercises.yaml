      text_md: «Hei! Jeg heter Runa.»
    - speaker: B
      text_md: «Hei!»
  options:
  - id: wellbeing
    text: Hvordan har du det?
    correct: false
    why: This asks how B is doing, not what B is called.
  - id: state
    text: Jeg er Runa.
    correct: false
    why: This states A's name again instead of asking for B's name.
  - id: close
    text: Vi ses!
