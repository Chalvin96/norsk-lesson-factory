      text_md: «Jeg heter Eline.»
    - speaker: B
      text_md: «Hyggelig å møte deg. Ha det bra!»
  options:
  - id: state-name
    text: It states the speaker's name.
    correct: false
    why: The line gives no speaker name.
  - id: close
    text: It closes the conversation.
    correct: true
    why: Ha det bra is a farewell at the end of the exchange.
  - id: ask-name
    text: It asks for the other person's name.
    correct: false
    why: The line contains a farewell, not a name question.
  derived_from:
  - section_id: closing-the-exchange
