- handle: review_complete_meeting
  op: write
  objective: obj-basic-adverbs-and-position-01
  bloom: apply
  prompt_md: 'Write a 12–24-word Norwegian exchange for the café: greet, ask and answer names, say something
    friendly, and close. Include the visible dialogue in your submitted exchange and word count.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Person A
      text_md: «Hei! Vi skal jobbe sammen på kaféen i dag.»
    - speaker: Person B
      text_md: «Hei, så hyggelig!»
  response_language: 'no'
  judge_prompt: Check criteria greeting, name-question, name-answer, friendly-line, closing, and word-count.
  criteria:
  - id: greeting
    instruction: The exchange contains a Norwegian greeting.
  - id: name-question
    instruction: One speaker asks for the other person's name.
  - id: name-answer
    instruction: The other speaker answers by giving their name.
  - id: friendly-line
    instruction: The exchange contains a natural friendly meeting expression.
  - id: closing
    instruction: The exchange ends with a natural closing.
  - id: word-count
    instruction: The submitted exchange, including the visible dialogue, is between 12 and 24 words long.
  derived_from:
  - section_id: building-the-complete-first-meeting
