- handle: understand_complete_everyday_instructions
  op: choose
  objective: obj-imperative-01
  bloom: understand
  prompt_md: Determine the action, object, and destination expressed by the two instructions.
  derived_from:
  - section_id: useful-instructions
  stem_md: 'The candles are in a box. Mina tells Sara: «Hent lysene fra esken og plasser dem midt på bordet!» Choose the correct interpretation.'
  options:
  - id: put-then-take
    text: First place the candles in the middle of the table. Then fetch them from the box.
    correct: false
    why: This reverses the order of the two instructions.
  - id: take-then-put
    text: First fetch the candles from the box. Then place them in the middle of the table.
    correct: true
    why: The first action retrieves the candles; the second gives their destination.
  - id: take-twice
    text: Both instructions tell the listener to fetch the candles from the box.
    correct: false
    why: The second instruction tells Sara where to place the candles.
- handle: build_two_step_instructions
