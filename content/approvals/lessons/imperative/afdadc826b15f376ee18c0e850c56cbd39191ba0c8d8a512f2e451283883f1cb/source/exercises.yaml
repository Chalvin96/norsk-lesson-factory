  objective: obj-imperative-01
  bloom: apply
  prompt_md: Complete each room-setup instruction with the imperative of the verb in parentheses.
  explanation_md: The imperative addresses the listener directly and normally omits the subject. Regular
    infinitives in -e usually drop -e, while frequent short and irregular verbs must be learned as whole
    forms.
  derived_from:
  - section_id: remove-unstressed-e
  audio_target: Flytt bordet! Finn serviettene! Lukk døra! Legg duken på bordet! Kom hit!
