  objective: obj-imperative-01
  bloom: apply
  prompt_md: Build a sensible two-step party-setup instruction. Move the chair, then open the door. Join
    the actions with og.
  derived_from:
  - section_id: useful-instructions
  tokens:
  - token_id: chair
    text: stolen
  - token_id: and
    text: og
  - token_id: open
    text: åpne
  - token_id: door
    text: døra!
  - token_id: move
    text: Flytt
  answer_order:
  - move
  - chair
  - and
  - open
  - door
- handle: repair_common_imperative_errors
  op: find_fix
  objective: obj-imperative-01
  bloom: analyze
  prompt_md: Select the one token that must be corrected to make this a natural Norwegian command.
  derived_from:
  - section_id: common-imperative-errors
  tokens:
  - token_id: verb-form
    text: Setter
  - token_id: object
    text: glasset
  - token_id: location
    text: her!
  error_token_id: verb-form
  feedback: Replace Setter with Sett. Sett glasset her! preserves the intended meaning while removing
    the present-tense ending.
