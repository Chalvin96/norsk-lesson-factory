- handle: final_imperative_retrieval
  op: write
  objective: obj-imperative-01
  bloom: apply
  prompt_md: "Write three short instructions in Norwegian for someone setting up a room. Tell the person to move something, look at something, and put something in a certain place."
  derived_from:
  - section_id: short-review
  response_language: "no"
  judge_prompt: Check that the response contains exactly three clear
    room-preparation instructions in natural Norwegian. Report direct evidence
    for every criterion, accepting natural choices of familiar objects and
    locations when each required action is explicit.
  criteria:
  - id: clear-actions
    instruction: The three instructions communicate clear actions with correctly
      formed imperative verbs.
  - id: no-present-endings
    instruction: Imperative verbs have no unnecessary present-tense -r endings.
  - id: move-object
    instruction: One instruction tells the helper to move an object.
  - id: look-at-something
    instruction: One instruction tells the helper to look at something.
  - id: put-in-place
    instruction: One instruction tells the helper to put something in a
      particular place.
