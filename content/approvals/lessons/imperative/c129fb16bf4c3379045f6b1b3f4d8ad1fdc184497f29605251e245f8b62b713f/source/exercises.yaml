- handle: understand_complete_everyday_instructions
  op: choose
  objective: obj-imperative-01
  bloom: understand
  prompt_md: "Choose the meaning that shows what Sara should fetch and where she should put it."
  derived_from:
  - section_id: useful-instructions
  stem_md: "The lights are in a box. Mina says to Sara: «Hent lysene fra esken og plasser dem midt på bordet!»"
  options:
  - id: put-then-take
    text: First place the candles in the middle of the table. Then fetch them
      from the box.
    correct: false
    why: This reverses the order of the two instructions.
  - id: take-then-put
    text: First fetch the candles from the box. Then place them in the middle of
      the table.
    correct: true
    why: The first action retrieves the candles; the second gives their
      destination.
  - id: take-twice
    text: Both instructions tell the listener to fetch the candles from the box.
    correct: false
    why: The second instruction tells Sara where to place the candles.
- handle: build_two_step_instructions
  op: build
  objective: obj-imperative-01
  bloom: apply
  prompt_md: "A guest needs to move the chair and then open the door. Put together one instruction with «og»."
  derived_from:
  - section_id: useful-instructions
  tokens:
  - token_id: chair
    text: stolen
  - token_id: and
    text: og
  - token_id: open
    text: åpne
  - token_id: door
    text: døra!
  - token_id: move
    text: Flytt
  answer_order:
  - move
  - chair
  - and
  - open
  - door
- handle: repair_common_imperative_errors
  op: find_fix
  objective: obj-imperative-01
  bloom: analyze
  prompt_md: "Choose the word that needs to change to make this a natural Norwegian instruction."
  derived_from:
  - section_id: common-imperative-errors
  tokens:
  - token_id: verb-form
    text: Setter
  - token_id: object
    text: glasset
  - token_id: location
    text: her!
  error_token_id: verb-form
  feedback: Replace Setter with Sett. Sett glasset her! preserves the intended
    meaning while removing the present-tense ending.
