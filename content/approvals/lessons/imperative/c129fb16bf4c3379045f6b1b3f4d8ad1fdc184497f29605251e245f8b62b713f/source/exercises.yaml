  explanation_md: Imperativ retter seg direkte til den som lytter, og subjektet
    står vanligvis ikke med. Verb på -e mister som regel -e; vanlige korte og
    uregelrette verb må læres som egne former.
  derived_from:
  - section_id: remove-unstressed-e
  audio_target: Flytt bordet! Finn serviettene! Lukk døra! Legg duken på bordet!
    Kom hit!
