- handle: notice_imperatives_in_party_setup
  op: choose
  objective: obj-imperative-01
  bloom: understand
  prompt_md: "Choose the lines that tell Sara what to do."
  derived_from:
  - section_id: imperative-meaning
  stem_md: "Mina says: 1. Sara venter ved døra. 2. Hent lyktene fra hylla. 3. Plasser dem ved vinduet."
  options:
  - id: instruction-one-only
    text: 'Only line 1 is an instruction: wait by the door. Lines 2 and 3 describe
      actions.'
    correct: false
    why: Lines 2 and 3 directly tell Sara to fetch the lanterns and place them
      by the window.
  - id: instructions-one-two
    text: 'Lines 1 and 2 are instructions: wait by the door, then fetch the lanterns.
      Line 3 is a statement.'
    correct: false
    why: «Sara venter ved døra» is a statement, while «Plasser dem ved vinduet»
      is also an instruction.
  - id: instructions-two-three
    text: 'Lines 2 and 3 are instructions: fetch the lanterns, then place them by
      the window. Line 1 is a statement.'
    correct: true
    why: «Hent» and «Plasser» directly tell Sara what to do; line 1 describes
      her position.
