- handle: anchor_causative_meanings
  op: choose
  objective: obj-causative-constructions-01
  bloom: understand
  prompt_md: "Velg forklaringen som passer til alle setningene."
  derived_from:
  - section_id: anchor-causative-meanings
  stem_md: 'Sara: «Jeg fikk Jonas til å rydde bordene.» Sara: «Jeg lot Nora gjøre ferdig plakatene.» Jonas:
    «Bråket gjorde meg trøtt.»'
  options:
  - id: reading-one
    text: '1: gir tillatelse til en handling; 2: utløser en handling; 3: fører til en tilstand.'
    correct: false
    why: The first two relationships are reversed; influence produces the first action, while permission
      allows the second.
  - id: reading-two
    text: '1: fører til en tilstand; 2: gir tillatelse til en handling; 3: utløser en handling.'
    correct: false
    why: The first result is an action by Jonas, while trøtt describes a resulting state.
  - id: reading-three
    text: '1: utløser en handling; 2: gir tillatelse til en handling; 3: fører til en tilstand.'
    correct: true
    why: Fikk Jonas til å rydde triggers an action, lot Nora gjøre gives permission for an action, and
      gjorde meg trøtt brings about a state.
