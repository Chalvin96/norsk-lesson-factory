- handle: family_dinner_causative_transfer
  op: write
  objective: obj-causative-constructions-01
  bloom: apply
  prompt_md: "**Melding fra broren din:** «Jeg kommer sent. Hva skjedde mens dere gjorde klar familiemiddagen?» Per hadde ikke kjøpt brød, men Mari overtalte ham, og han kjøpte det. Barna ville pynte bordet, og Mari lot dem gjøre det. Da gjestene ble forsinket, ble alle utålmodige. Svar broren din. Fortell hva som skjedde, og bruk «få», «la» og «gjøre»."
  min_words: 20
  max_words: 40
  derived_from:
  - section_id: family-dinner-causative-transfer
  response_language: 'no'
  judge_prompt: "Evaluate the reply using dinner-audience, dinner-purpose, dinner-facts, dinner-causative-frames as gating criteria. Criteria ending in -observation are diagnostic only and must never make the response fail. Dinner-causative-frames passes only when all three frames are well formed: få + object + til å + infinitive for the persuaded action, la + object + bare infinitive for the permitted action, and gjøre + object + adjective with correct agreement for the caused state. A missing til å, an intrusive å after la, or a wrong adjective agreement fails dinner-causative-frames. Anchors: Must pass while flagging relevant observations: «Hei! Mari fikk onkel Per til å kjøpe brød. Hun lot barna pynte bordet. Forsinkelsen gjorde alle utålmodige. Nå er nesten alt klart til middagen.» Must fail dinner-facts: «Hei! Onkel Per bakte en kake, og barna dro hjem. Alle var glade.» Must fail dinner-causative-frames: «Hei! Mari fikk onkel Per kjøpe brød. Hun lot barna å pynte bordet. Forsinkelsen gjorde alle utålmodig. Nå er nesten alt klart.»"
  criteria:
  - id: dinner-audience
    instruction: The response is a coherent Norwegian reply addressed appropriately to the writer's brother.
  - id: dinner-purpose
    instruction: The response explains what happened while the family prepared dinner.
  - id: dinner-facts
    instruction: The response accurately covers Per buying bread after Mari's persuasion, the children
      decorating after receiving permission, and everyone becoming impatient because of the delay.
  - id: dinner-causative-frames
    instruction: 'The response expresses all three causative relationships with well-formed constructions:
      få + object + til å + infinitive for the persuaded action, la + object + bare infinitive for the
      permitted action, and gjøre + object + adjective for the caused state; a missing til å, an intrusive
      å after la, or a wrong adjective agreement fails this criterion.'
  - id: dinner-faa-frame-observation
    instruction: Diagnose whether the persuaded action is expressed with a well-formed få + object + til
      å + infinitive construction; do not fail the response for this criterion.
  - id: dinner-la-frame-observation
    instruction: Diagnose whether the permitted action is expressed with a well-formed la + object + bare
      infinitive construction; do not fail the response for this criterion.
  - id: dinner-gjoere-frame-observation
    instruction: Diagnose whether the caused state is expressed with a well-formed gjøre + object + adjective
      construction, including adjective agreement; do not fail the response for this criterion.
