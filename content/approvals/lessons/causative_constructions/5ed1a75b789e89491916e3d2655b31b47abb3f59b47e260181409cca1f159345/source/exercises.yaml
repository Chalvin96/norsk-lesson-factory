    text: Emil
  - token_id: role-verb
    text: lar
  - token_id: role-object
    text: Jonas
  - token_id: role-infinitive
    text: åpne
  - token_id: role-object-two
    text: døren.
  answer_order:
  - role-subject
  - role-verb
  - role-object
  - role-infinitive
  - role-object-two
- handle: family_dinner_causative_transfer
  op: write
  objective: obj-causative-constructions-01
  bloom: apply
  prompt_md: '**Message from your brother:** «Jeg kommer sent. Hva skjedde mens dere gjorde klar familiemiddagen?»
    **Facts:** Uncle Per had not bought bread, so Mari persuaded him and he bought bread; the children
    wanted to decorate the table, and Mari gave permission, so they decorated it; everyone was calm, but
    the guests were delayed, so everyone became impatient. Reply to your brother in 20–40 Norwegian words:
    explain what happened and use causative constructions with få, la, and gjøre.'
  derived_from:
  - section_id: family-dinner-causative-transfer
  response_language: 'no'
  judge_prompt: 'Evaluate the reply using dinner-audience, dinner-purpose, dinner-facts, dinner-causative-frames,
    and dinner-length as gating criteria. Criteria ending in -observation are diagnostic only and must
    never make the response fail. Anchors: Must pass: «Hei! Mari fikk onkel Per til å kjøpe brød. Hun
    lot barna pynte bordet. Forsinkelsen gjorde alle utålmodige. Nå er nesten alt klart til middagen.»
    Must fail dinner-facts: «Hei! Onkel Per bakte en kake, og barna dro hjem. Alle var glade.» Must pass
    while flagging relevant observations: «Hei! Mari fikk onkel Per kjøpe brød. Hun lot barna å pynte
    bordet. Forsinkelsen gjorde alle utålmodig. Nå er nesten alt klart.»'
  criteria:
  - id: dinner-audience
    instruction: The response is a coherent Norwegian reply addressed appropriately to the writer's brother.
  - id: dinner-purpose
    instruction: The response explains what happened while the family prepared dinner.
  - id: dinner-facts
    instruction: The response accurately covers Per buying bread after Mari's persuasion, the children
      decorating after receiving permission, and everyone becoming impatient because of the delay.
  - id: dinner-causative-frames
    instruction: 'The response expresses the three causative relationships with the verbs få, la, and
      gjøre: influence producing an action, permission for an action, and a caused state.'
  - id: dinner-length
    instruction: The response contains 20–40 words.
  - id: dinner-faa-frame-observation
    instruction: Diagnose whether the persuaded action is expressed with a well-formed få + object + til
      å + infinitive construction; do not fail the response for this criterion.
  - id: dinner-la-frame-observation
    instruction: Diagnose whether the permitted action is expressed with a well-formed la + object + bare
      infinitive construction; do not fail the response for this criterion.
  - id: dinner-gjoere-frame-observation
    instruction: Diagnose whether the caused state is expressed with a well-formed gjøre + object + adjective
      construction, including adjective agreement; do not fail the response for this criterion.
