  - token_id: faa-aa
    text: å
  - token_id: faa-infinitive
    text: rydde
  - token_id: faa-place
    text: møterommet.
  answer_order:
  - faa-subject
  - faa-verb
  - faa-object
  - faa-til
  - faa-aa
  - faa-infinitive
  - faa-place
- handle: contrast_faa_and_la
  op: choose
  objective: obj-causative-constructions-01
  bloom: analyze
  prompt_md: Choose the sentence that matches the situation.
  derived_from:
  - section_id: contrast-faa-and-la
  stem_md: 'Jonas: «Jeg vil gjerne gå hjem tidlig i dag.» Sara: «Det er greit. Du kan gå nå.»'
  options:
  - id: candidate-one
    text: Sara får Jonas til å gå hjem tidlig.
    correct: false
    why: This says Sara's influence causes Jonas to leave, rather than that she permits what he already
      wants to do.
  - id: candidate-two
    text: Sara lar Jonas gå hjem tidlig.
    correct: true
    why: This presents Jonas's departure as an action Sara permits.
  - id: candidate-three
    text: Sara gjør Jonas rolig.
    correct: false
    why: This describes a change in Jonas's state, not permission to leave.
