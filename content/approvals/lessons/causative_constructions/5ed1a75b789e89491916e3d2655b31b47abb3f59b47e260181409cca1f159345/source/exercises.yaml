  - state-adjective
- handle: separate_action_and_state_results
  op: choose
  objective: obj-causative-constructions-01
  bloom: analyze
  prompt_md: Choose the pair that preserves both intended results.
  derived_from:
  - section_id: separate-action-and-state-results
  stem_md: '**Situation 1:** Jonas did not plan to wash up. Sara persuaded him, and he washed up. **Situation
    2:** Nora was rested before a long journey. Afterward, she was tired.'
  options:
  - id: candidate-three
    text: Sara fikk Jonas til å vaske opp. Den lange reisen fikk Nora til å sove.
    correct: false
    why: The second sentence changes the stated result from becoming tired to performing the action of
      sleeping.
  - id: candidate-four
    text: Oppvasken gjorde Jonas sliten. Den lange reisen gjorde Nora trøtt.
    correct: false
    why: The first sentence replaces Sara's influence and Jonas's washing action with a caused state.
  - id: candidate-one
    text: Sara fikk Jonas til å vaske opp. Den lange reisen gjorde Nora trøtt.
    correct: true
    why: The first sentence reports an influenced action, while the second reports a resulting state.
  - id: candidate-two
    text: Sara lot Jonas vaske opp. Den lange reisen gjorde Nora trøtt.
    correct: false
    why: The first sentence presents Sara as permitting an action Jonas intended, which conflicts with
      the persuasion in the situation.
- handle: track_causative_roles
  op: build
  objective: obj-causative-constructions-01
  bloom: apply
  prompt_md: Build Emil's report.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Kan jeg åpne døren?»
    - speaker: Emil
      text_md: «Ja, det er greit.»
  explanation_md: Emil is the person granting permission, Jonas is the person acting, and åpne follows
    the object without å.
  derived_from:
  - section_id: track-causative-roles
  tokens:
