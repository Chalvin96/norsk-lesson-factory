  response_language: 'no'
  judge_prompt: Check that the Norwegian message contains 12–24 words and accurately conveys Emil’s current
    location, departure in half an hour, destination, two-day stay with Lea, and Lea’s visit to Oslo one
    week ago.
  criteria:
  - id: updates
    instruction: Meldingen formidler alle opplysningene med riktig betydning.
  - id: relations
    instruction: Meldingen bruker naturlige norske uttrykk for nåværende sted, framtidig tidspunkt, reisemål,
