- handle: retrieve-preposition-meanings
  op: write
  objective: obj-basic-prepositions-place-time-01
  bloom: apply
  prompt_md: 'Til: Nora. Formål: Forklar hvor folk er, og når ting skjer. Skriv en norsk melding på 35–65
    ord til Nora som formidler disse seks opplysningene uten å kopiere formuleringene: Lars befinner seg
    der man låner bøker, akkurat nå; legekontoret er Saras reisemål; Omar er på besøk hos bestemoren sin;
    møtet starter tre timer fra nå; Eva kom hjem for to dager siden; kurset varer to timer. Bruk på for
    nåværende sted, til for reisemål, hos for besøkssted hos en person, om for framtidig tidspunkt, for
    ... siden for tidligere tidspunkt og i for varighet.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Kan du fortelle meg hvor folk er, og hva som skjer senere?»
    - speaker: Mina
      text_md: «Ja, jeg sender deg en samlet oppdatering.»
  response_language: 'no'
  min_words: 35
  max_words: 65
  judge_prompt: Vurder formål, de seks opplysningene, ordgrensen og at svaret bruker på for nåværende
    sted, til for reisemål, hos for besøkssted hos en person, om for framtidig tidspunkt, for ... siden
    for tidligere tidspunkt og i for varighet.
  criteria:
  - id: message-purpose
    instruction: Svaret er en sammenhengende norsk melding til Nora som forklarer hvor folk er og når
      hendelser skjer.
  - id: six-updates
    instruction: Meldingen formidler alle de seks opplysningene fra oppgaven med riktig betydning.
  - id: relation-forms
    instruction: 'Svaret bruker de nødvendige preposisjonsformene riktig: på for nåværende sted, til for
      reisemål, hos for besøkssted hos en person, om for framtidig tidspunkt, for ... siden for tidligere
      tidspunkt og i for varighet.'
  - id: word-bound
    instruction: Meldingen inneholder 35–65 ord.
  derived_from:
  - section_id: final-retrieval
- handle: first_day_exchange
  op: write
  objective: obj-basic-prepositions-place-time-01
  bloom: apply
  prompt_md: 'Write a 15–30-word Norwegian message to Nora about where people are and when events happen.
    Include: Aino is at the station now; Mikkel is going to the dentist; Liv is visiting her uncle;
    a train leaves in twenty minutes; Anders came to school yesterday; and a concert lasts ninety minutes.
    Use suitable Norwegian prepositions and time expressions.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Nora spør hvor vennene hennes er, og når de møtes.»
    - speaker: Elev
      text_md: «Skriv en kort melding med opplysninger om steder og tid.»
  response_language: 'no'
  judge_prompt: Check that the Norwegian message contains 15–30 words and conveys all six updates accurately
    using suitable expressions for location, destination, visiting a person, future time, past time, and
    duration.
  criteria:
  - id: updates
    instruction: Meldingen formidler alle de seks opplysningene med riktig betydning.
  - id: relations
    instruction: Meldingen bruker naturlige norske uttrykk for nåværende sted, reisemål, besøk hos en
      person, framtidig tidspunkt, tidligere tidspunkt og varighet.
  - id: word-count
    instruction: Meldingen inneholder 15–30 ord.
  derived_from:
  - section_id: transfer-to-a-new-situation
