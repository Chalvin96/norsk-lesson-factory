- handle: repair_the_misunderstanding
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: analyze
  prompt_md: Rewrite the four Norwegian notes so each expresses the meaning given. Some verb forms may
    already be correct; change only forms that do not match the intended action or location. Return the
    four sentences in order in 18–50 Norwegian words.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Henrik is putting the keys on the table now.
    - speaker: Henrik
      text_md: «Henrik ligger nøklene på bordet.»
    - speaker: Context
      text_md: The towels are already on the bed; nobody is moving them.
    - speaker: Henrik
      text_md: «Håndklærne legger på senga.»
    - speaker: Context
      text_md: The groceries are in the fridge now.
    - speaker: Henrik
      text_md: «Dagligvarene ligger i kjøleskapet.»
    - speaker: Context
      text_md: Henrik is putting the jackets in the hallway now.
    - speaker: Henrik
      text_md: «Henrik legger jakkene i gangen.»
  response_language: 'no'
  min_words: 18
  max_words: 50
  judge_prompt: Evaluate the four sentences against their supplied meanings. Require Henrik's present placement
    of the keys to use a form of legge; the towels' and groceries' locations to use a form of ligge; and
    Henrik's present placement of the jackets to use a form of legge. Accept natural punctuation and
    equivalent wording that preserves each fact. Do not require the learner to change sentences whose verb
    already matches the meaning.
  criteria:
  - id: keys-placement
    instruction: Correctly states that Henrik places the keys on the table now using a form of legge.
  - id: towels-location
    instruction: Correctly states that the towels are on the bed using a form of ligge.
  - id: groceries-location
    instruction: Correctly states that the groceries are in the fridge using a form of ligge.
  - id: jackets-placement
    instruction: Correctly states that Henrik places the jackets in the hallway now using a form of legge.
  - id: preserves-meanings
    instruction: Preserves all four supplied action or location meanings without contradiction.
  - id: response-length
    instruction: Returns four Norwegian sentences in 18–50 words.
  derived_from:
  - section_id: third-checkpoint
- handle: follow_one_object
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: apply
  prompt_md: Choose a familiar object of your own that can naturally be described with the taught legge–ligge pattern.
    Write a 25–55-word Norwegian update to a colleague about that same object. Describe one person placing
    it somewhere now, where it is now, one earlier placement, and where it was at a specific past time.
    Choose your own places and time details; do not use a supplied scenario or sentence.
  stimulus: []
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Evaluate whether the response follows the visible task. Accept any suitable object, coherent
    places and times, and natural Norwegian wording. Require two distinct placement actions, two corresponding
    location statements about the same object, present and past time reference, and the requested length.
    Do not require a particular object, person, place, or sentence template.
  criteria:
  - id: present-action-and-location
    instruction: Describes a present placement action and the current location of the chosen object.
  - id: past-action-and-location
    instruction: Describes an earlier placement action and the object's location at a specific past time.
  - id: placement-verbs
    instruction: Uses a form of legge for each placement action.
  - id: location-verbs
    instruction: Uses a form of ligge for each compatible location statement.
  - id: consistent-object-and-details
    instruction: Keeps the chosen object, placements, and locations coherent without contradicting itself.
  - id: message-purpose
    instruction: Produces a coherent Norwegian update addressed to a colleague within 25–55 words.
  derived_from:
  - section_id: fourth-checkpoint
- handle: final_guided_practice
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: apply
  prompt_md: 'Write a 30–65-word Norwegian continuation in which the group looks for one more object needed
    for the evening. Choose a new object that can naturally follow the taught legge–ligge pattern; do not
    reuse the deck of cards or its bookshelf, sofa, or table locations. Create a plausible situation and
    include a question about the object''s location, where someone put it earlier, where it is now, and a
    useful instruction to put it somewhere. Use forms of legge for placement and ligge for location.'
  stimulus: []
  response_language: 'no'
  min_words: 30
  max_words: 65
  judge_prompt: Evaluate the visible continuation task. Accept any new suitable object, plausible locations,
    and coherent invented details; do not require fixed wording or locations. Require all four requested
    communicative moves, natural target forms for placement and location, and the word range. The object
    must differ from the preceding deck-of-cards example; keep the continuation in a coherent cabin setting.
  criteria:
  - id: location-question
    instruction: Asks where the newly chosen object is.
  - id: earlier-action
    instruction: Explains where someone put the chosen object earlier.
  - id: current-location
    instruction: Reports where the chosen object is now.
  - id: final-instruction
    instruction: Gives someone a useful instruction to put the chosen object somewhere.
  - id: legge-ligge
    instruction: Uses a form of legge for placement actions and a compatible form of ligge for location statements.
  - id: fresh-coherent-scenario
    instruction: Uses a new object and coherent invented details rather than repeating the deck-of-cards example.
  - id: reply-purpose
    instruction: Produces a coherent Norwegian continuation for the group within 30–65 words.
  derived_from:
  - section_id: final-guided-practice
