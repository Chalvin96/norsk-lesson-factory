- handle: follow_one_object
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: apply
  prompt_md: You are updating a colleague about a contract. Read the exchange between Nora and Amir, then
    write a 25–55-word message in Norwegian that reports Nora's action today, where the contract is now,
    Amir's action yesterday, and where it was all morning. Use a form of legge for each placement action
    and a form of ligge for each location statement.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Jeg setter kontrakten på skrivebordet nå.»
    - speaker: Amir
      text_md: «I går satte jeg den i den blå mappa, og den var der hele formiddagen.»
    - speaker: Nora
      text_md: «Nå er den på skrivebordet.»
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Evaluate the gating criteria present-placement, present-location, past-placement, past-location,
    placement-verbs, location-verbs, supplied-facts, and message-purpose. Report a verdict and evidence
    for every criterion id.
  criteria:
  - id: present-placement
    instruction: Reports that Nora puts the contract on the desk now.
  - id: present-location
    instruction: Reports that the contract is on the desk now.
  - id: past-placement
    instruction: Reports that Amir put the contract in the blue folder yesterday.
  - id: past-location
    instruction: Reports that the contract was in the blue folder all morning.
  - id: placement-verbs
    instruction: Uses a form of legge for each placement action.
  - id: location-verbs
    instruction: Uses a form of ligge for each location statement.
  - id: supplied-facts
    instruction: Preserves the supplied people, object, places, and time references without contradiction.
  - id: message-purpose
    instruction: Produces a coherent Norwegian update addressed to a colleague within 25–55 words.
  derived_from:
  - section_id: fourth-checkpoint
- handle: final_guided_practice
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: apply
  prompt_md: 'Ingrid is trying to find the deck of cards. Write a 30–65-word reply in Norwegian to Ingrid:
    ask where the deck is, explain that Henrik put it on the bookshelf earlier, report that it is now
    under the sofa, and tell Maja to put it on the table. Use forms of legge for placement and ligge for
    location.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ingrid
      text_md: «Maja og jeg finner ikke kortstokken. Henrik flyttet den tidligere, men vi vet ikke hvor
        den er nå. Kan du hjelpe oss?»
    - speaker: Maja
      text_md: «Ja, jeg leter ved sofaen og bokhylla.»
  response_language: 'no'
  min_words: 30
  max_words: 65
  judge_prompt: Evaluate the gating criteria location-question, earlier-action, current-location, final-instruction,
    legge-ligge, supplied-facts, and reply-purpose. Report a verdict and evidence for every criterion
    id. A response that omits the required legge and ligge distinctions must fail legge-ligge.
  criteria:
  - id: location-question
    instruction: Asks where the deck of cards is.
  - id: earlier-action
    instruction: Explains that Henrik put the deck on the bookshelf earlier.
  - id: current-location
    instruction: Reports that the deck is under the sofa now.
  - id: final-instruction
    instruction: Tells Maja to put the deck on the table.
  - id: legge-ligge
    instruction: Uses a form of legge for the placement actions and a form of ligge for the location statements.
  - id: supplied-facts
    instruction: Preserves the supplied object, people, places, and time relationship without contradiction.
  - id: reply-purpose
    instruction: Produces a coherent Norwegian reply to Ingrid within 30–65 words.
  derived_from:
  - section_id: final-guided-practice
