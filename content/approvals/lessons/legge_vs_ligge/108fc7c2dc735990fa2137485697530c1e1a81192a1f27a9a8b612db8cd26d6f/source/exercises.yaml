- handle: repair_the_misunderstanding
  op: write
  objective: obj-legge-vs-ligge-01
  bloom: analyze
  prompt_md: "Skriv om de fire beskjedene på norsk slik at de uttrykker den oppgitte meningen. Noen verbformer kan allerede være riktige. Endre bare formene som ikke passer. Skriv setningene i rekkefølge."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Situasjon
      text_md: Henrik plasserer nøklene på bordet nå.
    - speaker: Henrik
      text_md: «Henrik ligger nøklene på bordet.»
    - speaker: Situasjon
      text_md: Håndklærne er på senga fra før; ingen flytter dem.
    - speaker: Henrik
      text_md: «Håndklærne legger på senga.»
    - speaker: Context
      text_md: The groceries are in the fridge now.
    - speaker: Henrik
      text_md: «Dagligvarene ligger i kjøleskapet.»
    - speaker: Context
      text_md: Henrik is putting the jackets in the hallway now.
    - speaker: Henrik
      text_md: «Henrik legger jakkene i gangen.»
  response_language: 'no'
  min_words: 18
  max_words: 50
  judge_prompt: Evaluate the four sentences against their supplied meanings. Require Henrik's present placement of the keys to use a form of legge; the towels' and groceries' locations to use a form of ligge; and Henrik's present placement of the jackets to use a form of legge. Accept natural punctuation and equivalent wording that preserves each fact. Do not require the learner to change sentences whose verb already matches the meaning.
  criteria:
  - id: keys-placement
    instruction: Correctly states that Henrik places the keys on the table now using a form of legge.
  - id: towels-location
    instruction: Correctly states that the towels are on the bed using a form of ligge.
  - id: groceries-location
    instruction: Correctly states that the groceries are in the fridge using a form of ligge.
  - id: jackets-placement
    instruction: Correctly states that Henrik places the jackets in the hallway now using a form of legge.
  - id: preserves-meanings
    instruction: Preserves all four supplied action or location meanings without contradiction.
  derived_from:
  - section_id: third-checkpoint
