- handle: notice_question_links
  op: choose
  objective: obj-preposition-stranding-01
  bloom: understand
  prompt_md: Velg analysen som passer til spørsmålene.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Hvem snakker med Jonas?»
    - speaker: Jonas
      text_md: «Hvem snakker Maja med?»
  options:
  - id: complement-then-subject
    text: I det første spørsmålet er hvem knyttet til med; i det andre er hvem subjekt.
    correct: false
    why: Dette bytter om rollene i de to spørsmålene.
  - id: subject-both
    text: Hvem er subjekt i begge spørsmålene.
    correct: false
    why: Maja er subjekt i det andre spørsmålet, og hvem er knyttet til med.
  - id: subject-then-complement
    text: I det første spørsmålet er hvem subjekt; i det andre er hvem knyttet til med.
    correct: true
    why: Det første spørsmålet spør hvem som snakker, og det andre spør hvem Maja snakker med.
  derived_from:
  - section_id: subject-contrast
