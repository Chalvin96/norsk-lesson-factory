- handle: retrieve_end_position_pattern
  op: write
  objective: obj-preposition-stranding-01
  bloom: apply
  prompt_md: 'Jonas skriver: «Vi trenger en høyttaler. Lea har en. Vi hørte på den i går.» Skriv Maja en melding på 20–35 ord. Spør hvem dere kan låne en høyttaler av, og bruk en leddsetning med «som» om høyttaleren dere hørte på i går.'
  derived_from:
  - section_id: short-review
  response_language: "no"
  judge_prompt: 'Evaluate criteria question, relative-clause, preposition-placement and word-bound. The message must ask who they can borrow a speaker from, with «av» after «en høyttaler» in the question; an optional time phrase may follow «av». It must identify the heard speaker in a relative clause with «på» in its natural clause position. Accept natural variants that meet both requirements. Anchors that must pass: «Hvem kan vi låne en høyttaler av? Er det høyttaleren som vi hørte på i går? Lea kan kanskje hjelpe oss med å finne den.» and «Hvem kan vi låne en høyttaler av i morgen? Er det høyttaleren som vi hørte på i går? Lea kan kanskje hjelpe oss med å finne den.» Anchor that must fail the question requirement: «Hvem kan vi låne en høyttaler? Er det høyttaleren som vi hørte på i går? Lea kan kanskje hjelpe oss med å finne den.»'
  criteria:
  - id: question
    instruction: The message asks who they can borrow a speaker from, with «av» at the end of the question.
  - id: relative-clause
    instruction: The message identifies the speaker they heard by using a relative clause introduced with som.
  - id: word-bound
    instruction: The message contains 20–35 words.
  - id: preposition-placement
    instruction: The question places «av» after «en høyttaler»; a time phrase may follow «av». In the relative clause, «på» follows «hørte» and remains inside the clause; a time phrase may follow «på».
