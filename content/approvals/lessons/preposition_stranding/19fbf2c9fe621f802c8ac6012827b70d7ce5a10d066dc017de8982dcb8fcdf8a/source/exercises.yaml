- handle: notice_question_links
  op: choose
  objective: obj-preposition-stranding-01
  bloom: understand
  prompt_md: Choose the analysis that matches the two questions.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Hvem snakker med Jonas?»
    - speaker: Jonas
      text_md: «Hvem snakker Maja med?»
  options:
  - id: complement-then-subject
    text: In the first question, hvem is linked to med; in the second, hvem is the subject.
    correct: false
    why: This reverses the two grammatical roles.
  - id: subject-both
    text: Hvem is the subject in both questions.
    correct: false
    why: Maja is the subject of the second question, and hvem represents the person linked to med.
  - id: subject-then-complement
    text: In the first question, hvem is the subject; in the second, hvem is linked to med.
    correct: true
    why: The first question asks who is talking, while the second asks which person completes the expression
      snakke med noen.
  derived_from:
  - section_id: subject-contrast
