  prompt_md: Match each described noun with its preposition.
  explanation_md: Som points back to the described noun, while the expression keeps its associated preposition
    inside the relative clause.
  derived_from:
  - section_id: relative-clauses
  left:
  - left_id: noun-naboen
    text: Naboen som jeg snakket ___
  - left_id: noun-hoyttaleren
    text: Høyttaleren som vi hørte ___
  - left_id: noun-rommet
    text: Rommet som gjestene skal være ___
  - left_id: noun-sangen
    text: Sangen som folk liker å danse ___
  right:
  - right_id: prep-med
    text: med — i selskap med noen
  - right_id: prep-pa
    text: på — lytte til noe
  - right_id: prep-i
    text: i — befinne seg inne i noe
  - right_id: prep-til
    text: til — bevege seg etter musikk
  pairs:
  - left_id: noun-naboen
    right_id: prep-med
  - left_id: noun-hoyttaleren
    right_id: prep-pa
  - left_id: noun-rommet
    right_id: prep-i
  - left_id: noun-sangen
    right_id: prep-til
