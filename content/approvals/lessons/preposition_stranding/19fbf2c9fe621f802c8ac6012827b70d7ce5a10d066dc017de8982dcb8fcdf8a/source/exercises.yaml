- handle: retrieve_end_position_pattern
  op: write
  objective: obj-preposition-stranding-01
  bloom: apply
  prompt_md: 'Jonas writes: «Vi trenger en høyttaler. Lea har en. Vi hørte på den i går.» Write a 20–35-word
    message to Maja that asks which speaker they can borrow and that identifies the speaker they heard
    by joining the information with the relative word som.'
  derived_from:
  - section_id: short-review
  response_language: 'no'
  judge_prompt: 'Evaluate only criteria question, relative-clause and word-bound. Report preposition-placement-observation
    diagnostically and never use it to fail the response. Anchor that must pass: «Hvilken høyttaler kan
    vi låne? Er det høyttaleren som vi hørte på i går? Lea kan kanskje hjelpe oss med å finne den.» Anchor
    that must fail question: «Vi kan låne høyttaleren. Det er høyttaleren som vi hørte på i går. Lea kan
    kanskje hjelpe oss med å finne den.» Anchor that must pass while flagging preposition-placement-observation:
    «Hvilken høyttaler kan vi låne? Er det høyttaleren som vi hørte på i går? Kanskje Lea kan hjelpe oss
    med å finne den.»'
  criteria:
  - id: question
    instruction: The message asks which speaker they can borrow.
  - id: relative-clause
    instruction: The message identifies the speaker they heard by using a relative clause introduced with
      som.
  - id: word-bound
    instruction: The message contains 20–35 words.
  - id: preposition-placement-observation
    instruction: Diagnose whether the question and relative clause retain their associated prepositions
      in natural everyday Bokmål positions; this observation never fails the response.
