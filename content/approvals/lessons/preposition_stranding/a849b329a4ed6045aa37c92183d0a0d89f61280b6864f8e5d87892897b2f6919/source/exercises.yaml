- handle: retrieve_end_position_pattern
  op: write
  objective: obj-preposition-stranding-01
  bloom: apply
  prompt_md: 'Jonas writes: «Vi trenger en høyttaler. Lea har en. Vi hørte på den i går.» Write a 20–35-word
    message to Maja asking who they can borrow a speaker from, then identify the speaker they heard with
    a relative clause introduced by som. Put «av» at the end of the question and leave «på» in its natural
    position later in the relative clause; a time phrase may follow it.'
  derived_from:
  - section_id: short-review
  response_language: 'no'
  judge_prompt: 'Evaluate criteria question, relative-clause, preposition-placement and word-bound. The
    message must ask who they can borrow a speaker from, with «av» at the end of the question, and identify
    the heard speaker in a relative clause with «på» later in its natural clause position; a time phrase may
    follow it. Accept natural variants that meet both
    requirements. Anchor that must pass: «Hvem kan vi låne en høyttaler av? Er det høyttaleren som vi hørte
    på i går? Lea kan kanskje hjelpe oss med å finne den.» Anchor that must fail the question requirement:
    «Hvem kan vi låne en høyttaler? Er det høyttaleren som vi hørte på i går? Lea kan kanskje hjelpe oss
    med å finne den.»'
  criteria:
  - id: question
    instruction: The message asks who they can borrow a speaker from, with «av» at the end of the question.
  - id: relative-clause
    instruction: The message identifies the speaker they heard by using a relative clause introduced with
      som.
  - id: word-bound
    instruction: The message contains 20–35 words.
  - id: preposition-placement
    instruction: The question has «av» at its end. In the relative clause, «på» follows «hørte» and remains inside the clause; a time phrase may follow «på».
