- handle: review_avoid_repeated_pronoun
  op: choose
  objective: obj-preposition-stranding-01
  bloom: analyze
  prompt_md: Choose the natural everyday question.
  derived_from:
  - section_id: common-mistakes
  stem_md: Maja snakket med en gjest, men Jonas vet ikke hvilken gjest.
  options:
  - id: missing-preposition
    text: Hvem snakket Maja?
    correct: false
    why: This drops med from the expression snakke med noen.
  - id: no-repeated-pronoun
    text: Hvem snakket Maja med?
    correct: true
    why: Hvem supplies the person linked to med, so no additional pronoun is needed.
  - id: repeated-pronoun
    text: Hvem snakket Maja med henne?
    correct: false
    why: Henne repeats the person already represented by hvem.
