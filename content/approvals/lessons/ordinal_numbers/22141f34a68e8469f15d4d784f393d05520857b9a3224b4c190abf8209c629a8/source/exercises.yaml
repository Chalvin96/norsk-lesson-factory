- handle: notice-order-in-the-quiz
  op: choose
  objective: obj-ordinal-numbers-01
  bloom: understand
  prompt_md: Choose what the four Norwegian expressions have in common.
  derived_from:
  - section_id: showing-order-rather-than-quantity
  stem_md: 'Fire uttrykk fra quizen: for andre gang, det første bordet, den tredje runden, andreplass.'
  options:
  - id: quantity
    text: They show how many visits, tables, rounds, or teams there are.
    correct: false
    why: A quantity reading would use cardinals such as to, tre, or fire.
  - id: identifying-number
    text: They give a label such as a table number or a shirt number.
    correct: false
    why: A label is an ordinary number; these forms mark a position in a sequence.
  - id: order-rank-position
    text: They show order, rank, or position.
    correct: true
    why: Each expression selects a visit, table, round, or rank by its place in a sequence.
