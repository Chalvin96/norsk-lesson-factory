- handle: review_quantity-or-order
  op: choose
  objective: obj-ordinal-numbers-01
  bloom: understand
  prompt_md: Choose the sentence that tells where the room is.
  derived_from:
  - section_id: a-likely-mistake
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Resepsjonist
      text_md: «Det er fem etasjer i hotellet, og rommet deres ligger helt øverst.»
    - speaker: Gjest
      text_md: «Så vi skal helt til topps?»
  options:
  - id: floor-quantity
    text: Hotellet har en resepsjon i første etasje.
    correct: false
    why: This locates the reception but does not locate the room.
  - id: wrong-position
    text: Rommet ligger i fjerde etasje.
    correct: false
    why: This locates the room by order, but it selects floor four instead of floor five.
  - id: room-position
    text: Rommet ligger i femte etasje.
    correct: true
    why: The room is on the top floor of a five-storey building, so the ordinal is femte.
  explanation_md: The pair fem/femte contrasts quantity with ordered position; cardinal numbers are the
    prerequisite.
