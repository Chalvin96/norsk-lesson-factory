  prompt_md: "En lærer underviser i norsk. En bok ligger på kontoret, og Amir lånte den. Fullfør hullene med en relativsetning som begynner med «som» (1–4 ord): «Læreren ___ må få beskjed. Boka ___ ligger på kontoret.»"
  response_language: 'no'
  min_words: 3
  max_words: 8
  judge_prompt: Vurder kriteriene teacher-completion og book-completion.
  criteria:
  - id: teacher-completion
    instruction: Første hull fullføres med en relativsetning som begynner med som og identifiserer læreren
      i samsvar med de oppgitte faktaene, for eksempel at læreren underviser i norsk.
  - id: book-completion
    instruction: Andre hull fullføres med en relativsetning som begynner med som, slik at boka identifiseres
      som den Amir lånte. Relativsetningen må være grammatisk og må ikke gjenta hovedordet eller bruke
      et resumptivt pronomen.
