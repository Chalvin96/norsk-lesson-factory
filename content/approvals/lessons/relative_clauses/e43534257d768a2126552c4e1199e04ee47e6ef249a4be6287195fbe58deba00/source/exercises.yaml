  prompt_md: "Nora står ved billettautomaten på stasjonen. Hun har på seg ei rød jakke. Kofferten hennes er blå, og hun kjøpte den i Bergen. Skriv en melding på 25–50 ord til en venn som skal møte henne. Bruk to som-setninger: én der det beskrevne substantivet utfører handlingen, og én der Nora utfører den."
  response_language: 'no'
  min_words: 25
  max_words: 50
  judge_prompt: Vurder alle kriteriene station-purpose, station-facts, word-bound, actor-pattern-observation
    og attachment-observation som krav.
  criteria:
  - id: station-purpose
    instruction: Meldingen er skrevet til en venn og gir nok informasjon til å finne Nora og kofferten.
  - id: station-facts
    instruction: Meldingen gir nok informasjon til å finne Nora og kofferten og oppfyller de synlige kravene. Den trenger ikke ta med alle opplysningene om jakka og hvor kofferten ble kjøpt.
  - id: word-bound
    instruction: Meldingen inneholder 25–50 ord.
  - id: actor-pattern-observation
    instruction: Teksten bruker både en som-setning der det beskrevne substantivet er aktør, og en der
      Nora er uttrykt aktør.
  - id: attachment-observation
    instruction: Hver som-setning står slik at det er klart hvilket substantiv den beskriver.
  derived_from:
  - section_id: transfer-new-situation
