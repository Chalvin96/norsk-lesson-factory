  prompt_md: Velg hvem som utfører handlingen i hver relativsetning.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: "A. Jeg kjenner mannen som reparerer bilen. B. Jeg kjenner mannen som bilen skremte."
  options:
  - id: car-man
    text: 'A: Bilen reparerer mannen. B: Mannen skremte bilen.'
    correct: false
    why: >-
      I A snur alternativet aktøren: mannen reparerer bilen. I B er bilen aktør for skremte. Derfor
      identifiserer alternativet ikke aktøren riktig i begge setningene.
  - id: man-man
    text: 'A: Mannen reparerer bilen. B: Mannen skremte bilen.'
    correct: false
    why: A er riktig, men i B står bilen foran verbet og er derfor aktøren.
  - id: man-car
    text: 'A: Mannen reparerer bilen. B: Bilen skremte mannen.'
    correct: true
    why: I A står verbet rett etter som; i B står bilen som uttrykt subjekt etter som.
  explanation_md: Ordene etter som viser om det beskrevne substantivet eller et uttrykt subjekt utfører
    handlingen.
