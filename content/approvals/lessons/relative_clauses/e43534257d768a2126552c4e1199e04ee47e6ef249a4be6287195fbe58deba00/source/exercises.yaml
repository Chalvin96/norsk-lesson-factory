  prompt_md: "Skriv en melding på 20–35 ord til en ny frivillig. Erik kan hjelpe med lampa, som du leverte i morges. Lampa står på arbeidsbenken. Bruk én som-setning til å identifisere Erik og én til å identifisere lampa."
  response_language: 'no'
  min_words: 20
  max_words: 35
  judge_prompt: Vurder kriteriene workshop-message, supplied-facts, word-bound og som-clarity-observation
    som krav; rapporter også reference-form-observation diagnostisk.
  criteria:
  - id: workshop-message
    instruction: Meldingen henvender seg til en ny frivillig og gjør det mulig å finne både riktig hjelper
      og riktig lampe.
  - id: supplied-facts
    instruction: Meldingen er forenlig med de tre oppgitte faktaene og finner ikke på motstridende opplysninger.
  - id: word-bound
    instruction: Meldingen inneholder 20–35 ord.
  - id: som-clarity-observation
    instruction: Meldingen bruker tydelige og grammatisk korrekte som-setninger til å identifisere Erik
      og lampen.
  - id: reference-form-observation
    instruction: Registrer eventuelle unødvendige subjekt- eller objektpronomen i som-setningene som diagnostisk
      informasjon.
  derived_from:
  - section_id: back-at-workshop
