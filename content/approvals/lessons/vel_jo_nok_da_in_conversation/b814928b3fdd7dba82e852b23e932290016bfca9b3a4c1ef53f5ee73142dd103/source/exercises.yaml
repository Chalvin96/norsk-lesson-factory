- handle: interpret_jo_shared_ground_in_lines
  op: choose
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: understand
  prompt_md: 'You are visiting your friend Haavard in Trondheim. His mother greets you at the door: «Dere har jo møtt meg før.» (You have met me before.) Later, you and Haavard wait for the bus you take together every week. You have both checked its schedule before, and he says: «Bussen går jo hvert tiende minutt.» (The bus runs every ten minutes.)'
  stem_md: What does jo signal in both lines?
  options:
  - id: shared-next-step
    text: In both lines the speaker marks the sentence as the natural next step in the talk and coaxes the listener along.
    correct: false
    why: Marking a shared next step with coaxing is the job of conversational da.
  - id: shared-ground-reminder
    text: In both lines the speaker treats the claim as something both speakers already know, reminding the listener of shared ground.
    correct: true
    why: Jo marks a claim as shared property—a reminder, not news.
  - id: guess-for-confirmation
    text: In both lines the speaker floats a best guess and asks the listener to confirm or correct it.
    correct: false
    why: Floating a claim for confirmation is the job of vel.
  - id: likely-assessment
    text: In both lines the speaker marks the claim as a likely assessment or prediction.
    correct: false
    why: Likelihood is a common contribution of nok, not jo.
- handle: choose_jo_or_vel_for_stance
  op: recall_fill
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: apply
  prompt_md: 'You and your friend Marit agreed last week to drive to Bergen today. Marit packed the car last night, and you half-remember that the road atlas went in with everything else. Complete your two lines. Blank 1—«Vi skulle ... dra til Bergen i dag.» (We were going to drive to Bergen today.): you remind Marit of the plan you made together last week. Blank 2—«Du har ... kartet med deg?» (You do have the atlas with you?): you are not sure, and you want Marit to confirm it.'
  audio_target: Vi skulle jo dra til Bergen i dag. Du har vel kartet med deg?
  segments:
  - text_md: 'Vi skulle '
  - blank_id: line1-particle
    options:
    - jo
    - vel
    answer_index: 0
  - text_md: ' dra til Bergen i dag. Du har '
  - blank_id: line2-particle
    options:
    - jo
    - vel
    answer_index: 1
  - text_md: ' kartet med deg?'
  explanation_md: 'Line 1 takes jo: the plan was made together, so the speaker treats it as shared ground and expects agreement. Line 2 takes vel: the speaker is unsure and holds the claim out for Marit to confirm.'
- handle: interpret_nok_as_likelihood
  op: choose
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: understand
  prompt_md: 'You and Sindre are leaving the office. The transit app shows high occupancy, and you say: «Trikken er nok full nå.»'
  stem_md: What does nok most directly contribute in this sentence?
  options:
  - id: shared-fact
    text: It marks the tram's fullness as a fact already shared by both speakers.
    correct: false
    why: Treating a claim as shared ground is a common function of jo, not this nok.
  - id: settled-next-step
    text: It marks taking the tram as a next step the speakers have settled together.
    correct: false
    why: Conversational da can connect a turn to a settled next step; this nok evaluates the likelihood of the claim.
  - id: likely-assessment
    text: It presents a full tram as the speaker's likely assessment.
    correct: true
    why: Here nok marks likelihood. The app provides a reason, but nok can also mark a likely assessment based on experience or expectation.
  - id: enough-tram
    text: It says that there is a sufficient quantity of tram.
    correct: false
    why: Quantity nok means enough, but in this clause nok comments on how likely the claim is.
- handle: soften_request_with_conversational_da
  op: recall_fill
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: apply
  prompt_md: "You and your friend Sofie are off to the cinema, and she is unsure whether to come. Blank 1—Complete your warm invitation with the particle that coaxes her along: «Bli med ...!» (Come along!) Blank 2—Sofie is still hesitant because she does not know when the film starts. Choose the reply that uses sentence-final conversational da to continue your direct encouragement while suggesting that the two of you ask the usher."
  audio_target: Bli med, da! Vi spør vakten, da.
  segments:
  - text_md: 'Bli med, '
  - blank_id: coax-particle
    options:
    - da
    - vel
    - jo
    answer_index: 0
  - text_md: '! '
  - blank_id: placement-choice
    options:
    - Da spør vi vakten.
    - Vi spør vakten, da.
    answer_index: 1
  explanation_md: In this friendly invitation, sentence-final da supports a coaxing reading; another situation or tone could make da sound insistent or impatient. Both versions can present a next step, but only Vi spør vakten, da contains the target sentence-final particle. Sentence-initial Da is a linker meaning then.
- handle: diagnose_particle_misfit_in_exchange
  op: choose
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: analyze
  prompt_md: Kari is staying with her cousin Ola in Oslo. She wants to buy a drill bit at the local hardware shop, but she has never been there; Ola knows the neighbourhood. Kari is only guessing about the closing time and wants Ola to confirm. Which particle completes her question?
  stem_md: «Butikken stenger ___ klokka seks?»
  derived_from:
  - section_id: one-sentence-four-moves
  options:
  - id: jo-shared
    text: jo
    correct: false
    why: Jo presents the closing time as shared knowledge, but Kari is unsure and seeks confirmation.
  - id: vel-confirmation
    text: vel
    correct: true
    why: Vel marks Kari's tentative assumption and invites Ola to confirm or correct it.
  - id: nok-inference
    text: nok
    correct: false
    why: Nok would present her own likely assessment, rather than ask Ola to confirm the time.
- handle: produce_particle_dialogue_in_new_situation
  op: write
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: apply
  prompt_md: It is Thursday afternoon in the office, and you and your colleague Ben are planning a surprise birthday party for your boss on Friday afternoon. Write a short dialogue in Norwegian between you and Ben—three to five lines, about 25 to 60 words, with the speaker name at the start of each line. Choose two of jo, vel, nok, and conversational da. Use each chosen word at least once with a context-supported function. Jo can present shared knowledge, vel a tentative expectation or confirmation request, nok a likely assessment, and da a response to circumstances or a coaxing next step. If you choose da, make the surrounding wording clearly coaxing, settling, insistent, or impatient rather than treating da as automatically friendly.
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: dialogue-situation
    instruction: Writes a coherent Norwegian dialogue between the two named colleagues, set in the office party-planning situation, in three to five lines with a speaker label on each line.
  - id: exactly-two-target-particles
    instruction: Uses exactly two different target words from jo, vel, nok, and conversational da, with each chosen word used at least once.
  - id: particle-functions-fit-context
    instruction: Each chosen word has a context-supported function specified in the prompt; any use of da has a tone supported by the surrounding situation and wording.
