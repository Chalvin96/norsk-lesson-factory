    - vel
    - jo
    - nok
    answer_index: 1
  - text_md: ' klokka seks i går.»'
  explanation_md: Eva corrects Lars by treating yesterday's agreement as knowledge they already share, so jo fits. Vel would seek confirmation, while nok would present the time as a likely assessment.
- handle: review_soften_request_with_conversational_da
  op: recall_fill
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: apply
  prompt_md: The last bus leaves in one minute. Amir is still tying his shoes, and Nora impatiently urges him to move. Complete Nora's line with the conversational particle that fits her insistent tone.
  audio_target: Kom igjen, da!
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: The last bus leaves in one minute, and Amir is still tying his shoes.
    - speaker: Nora
      text_md: «Kom igjen, ___!»
  segments:
  - text_md: '«Kom igjen, '
  - blank_id: insistent-particle
    options:
    - vel
    - jo
    - da
    answer_index: 2
  - text_md: '!»'
  explanation_md: Sentence-final da can strengthen an impatient or insistent prompt when the urgency and tone support that reading. Vel would make the line sound more tentative, while jo would frame its content as shared ground.
- handle: review_nok_likelihood_fill
  op: write
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: apply
  prompt_md: >-
    A road worker has just reported fresh rockfall above Fjellveien. Write Liv's sentence saying the road will be closed after the rockfall. Use «nok» for a likely conclusion or «vel» for a tentative expectation; both are natural here.
  response_language: 'no'
  min_words: 6
  max_words: 7
  judge_prompt: Accept a natural forecast using either «nok» for a likely conclusion based on the rockfall or «vel» for a tentative expectation. Do not require one particle when both convey a defensible reading.
  criteria:
  - id: likelihood-forecast
    instruction: The response says Fjellveien will likely be closed after the rockfall and uses «nok» or «vel» naturally.
- handle: review_produce_dialogue_particles
  op: write
  objective: obj-vel-jo-nok-da-in-conversation-01
  bloom: apply
  prompt_md: >-
    Mina is unsure whether Eirik brought the cabin key, so she asks him to confirm. Eirik answers that he has it. A weather alert then reports heavy rain throughout Saturday. Write Mina's two lines with particles: use «vel» for her confirmation question, and use «nok» or «vel» for her likely assessment.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Du har ___ nøkkelen til hytta med deg?»
    - speaker: Eirik
      text_md: «Ja, den ligger i sekken.»
    - speaker: Context
      text_md: A weather alert reports heavy rain throughout Saturday.
    - speaker: Mina
      text_md: «Da må vi ___ spise inne på lørdag.»
  response_language: 'no'
  min_words: 12
  max_words: 20
  judge_prompt: Require Mina's two requested lines in order. Eirik's reply and the weather alert are background context, not lines the learner must reproduce. Accept «vel» in Mina's confirmation question. For her weather-based assessment, accept either natural «nok» or tentative «vel». Do not fail a response for choosing vel in the second line.
  criteria:
  - id: confirmation-question
    instruction: Mina naturally asks Eirik to confirm whether he has the key, using «vel».
  - id: weather-assessment
    instruction: Mina naturally concludes that they will likely eat inside on Saturday, using «nok» or «vel».
