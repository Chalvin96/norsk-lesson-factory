  prompt_md: "Fullfør hver setning med det vanlige norske uttrykket for klokkeslettet."
  audio_target: Bussen går klokka ti over fem. Timen begynner klokka kvart over fem. Kurset begynner klokka halv seks. Møtet starter klokka kvart på seks.
  segments:
  - text_md: '17.10 — Bussen går klokka '
  - blank_id: bus-time
    options:
    - ti over fem
    - ti på fem
    answer_index: 0
  - text_md: '. 17.15 — Timen begynner klokka '
  - blank_id: lesson-time
    options:
    - kvart over fem
    - kvart på fem
    answer_index: 0
  - text_md: '. 17.30 — Kurset begynner klokka '
  - blank_id: course-time
    options:
    - halv fem
    - halv seks
    answer_index: 1
  - text_md: '. 17.45 — Møtet starter klokka '
  - blank_id: meeting-time
    options:
    - kvart over fem
    - kvart på seks
    answer_index: 1
  - text_md: .
  explanation_md: "17.30 er halv seks. Før halv seks teller vi tilbake fra halv: 17.20 er ti på halv seks, og 17.25 er fem på halv seks. Etter halv teller vi fram mot neste hele time: 17.45 er kvart på seks."
  derived_from:
  - section_id: practice-express-a-given-clock-time
