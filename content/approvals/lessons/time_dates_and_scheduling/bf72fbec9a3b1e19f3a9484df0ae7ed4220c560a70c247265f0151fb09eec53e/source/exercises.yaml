- handle: understand_course_plan
  op: choose
  objective: obj-time-dates-and-scheduling-01
  bloom: understand
  derived_from:
  - section_id: practice-understand-the-course-plan
  prompt_md: "Velg oppsummeringen som stemmer med kursplanen."
  stem_md: "Timeplan: «Kurset begynner 14. mai klokka halv seks. Nora og Amir møtes klokka kvart over fem.» Hvilket alternativ oppgir riktig dato, kursstart, møtetid og betydningen av halv seks?"
  options:
  - id: wrong_meeting_time
    text: Kurset begynner den fjortende mai klokka 17.30, og Nora og Amir møtes klokka 17.45.
    correct: false
    why: Møtet er klokka 17.15; kvart over fem betyr femten over fem.
  - id: wrong_course_time
    text: Kurset begynner den fjortende mai klokka 16.30, og Nora og Amir møtes klokka 17.15.
    correct: false
    why: Halv seks betyr 17.30, ikke 16.30.
  - id: correct
    text: Kurset begynner den fjortende mai klokka 17.30, og Nora og Amir møtes klokka 17.15.
    correct: true
    why: Den fjortende mai er datoen i planen. Halv seks er 17.30, og kvart over fem er 17.15.
  - id: wrong_date
    text: Kurset begynner den femtende mai klokka 17.30, og Nora og Amir møtes klokka 17.15.
    correct: false
    why: Planen sier 14. mai, altså den fjortende mai.
- handle: locate_time_around_the_hour
  op: categorize
  objective: obj-time-dates-and-scheduling-01
  bloom: analyze
  prompt_md: "Les tidsuttrykkene. Avgjør om hvert uttrykk viser til før eller etter den oppgitte hele timen."
  buckets:
  - bucket_id: after-hour
    label: Etter den oppgitte timen
  - bucket_id: before-hour
    label: Før den oppgitte timen
  items:
  - item_id: after-1
    text: Bussen går klokka tjue over ni.
    bucket_id: after-hour
  - item_id: after-2
    text: Møtet starter klokka fem over to.
    bucket_id: after-hour
  - item_id: before-1
    text: Timen begynner klokka ti på fire.
    bucket_id: before-hour
  - item_id: before-2
    text: Bussen går klokka kvart på elleve.
    bucket_id: before-hour
  explanation_md: "«Tjue over ni» er tjue minutter etter ni, mens «ti på fire» er ti minutter før fire. «Halv seks» viser til 17.30."
  derived_from:
  - section_id: practice-locate-time-around-the-hour
- handle: interpret_half_hour_expressions
  op: choose
  objective: obj-time-dates-and-scheduling-01
  bloom: understand
  prompt_md: "Velg riktig kobling mellom klokkeslettene og uttrykkene."
  stem_md: 'Klokkeslettene er 17.20, 17.30 og 17.40. Hvilken kobling til de norske uttrykkene er riktig?'
  options:
  - id: half-mapping-mixed
    text: 17.20 = halv seks; 17.30 = ti på halv seks; 17.40 = ti over halv seks.
    correct: false
    why: The midpoint and the two surrounding expressions are assigned to the wrong times.
  - id: half-mapping-correct
    text: 17.20 = ti på halv seks; 17.30 = halv seks; 17.40 = ti over halv seks.
    correct: true
    why: The midpoint is halv seks at 17.30; ti på halv seks is 17.20 and ti over halv seks is 17.40.
  - id: half-mapping-reversed
    text: 17.20 = ti over halv seks; 17.30 = halv seks; 17.40 = ti på halv seks.
    correct: false
    why: The before-and-after directions are reversed around the midpoint.
  - id: half-mapping-shifted
    text: 17.20 = ti på halv seks; 17.30 = ti over halv seks; 17.40 = halv seks.
    correct: false
    why: Halv seks names the midpoint at 17.30, not 17.40.
  derived_from:
  - section_id: practice-interpret-half-hour-expressions
- handle: express_a_given_clock_time
  op: recall_fill
  objective: obj-time-dates-and-scheduling-01
