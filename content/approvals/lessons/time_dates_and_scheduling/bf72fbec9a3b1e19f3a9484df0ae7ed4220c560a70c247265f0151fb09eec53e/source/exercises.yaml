  judge_prompt: Check that the response is a single Norwegian sentence beginning with "Vi møtes" and confirming a meeting on Friday 19 June at quarter past nine. Accept natural variants such as "Vi møtes fredag 19. juni klokka kvart over ni." The sentence must include the weekday, date, and time.
