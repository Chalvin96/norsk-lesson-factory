- handle: remember_the_plan
  op: write
  objective: obj-time-dates-and-scheduling-01
  bloom: apply
  prompt_md: 'Travel note: «Tog: 8. september, avgang 17.15. Seneste møtetid: 17.00.» Jon asks: «Når går
    toget, og når skal vi møtes?» Write Sara''s short reply in Norwegian. State the date in spoken form,
    express both times in everyday Norwegian, suggest meeting at the permitted earlier time, and confirm
    that plan in 2–3 short sentences.'
  response_language: 'no'
  min_words: 8
  max_words: 35
  judge_prompt: Check whether the response states the supplied date as an ordinal, expresses the train
    time as kvart over fem or an equivalent natural Norwegian expression of 17.15, proposes meeting at
    five, and confirms the same factual plan. Accept natural Norwegian variants; do not require an exact
    wording or a speaking response.
  criteria:
  - id: date-in-words
    instruction: States 8 September as åttende september or another natural Norwegian ordinal date form.
  - id: event-time
    instruction: Acknowledges that the train leaves at 17.15 using a correct everyday Norwegian time expression.
  - id: meeting-time
    instruction: Proposes and confirms meeting at 17.00.
  - id: factual-plan
    instruction: Communicates one clear, internally consistent plan in 2 to 3 short Norwegian sentences.
  derived_from:
  - section_id: final-retrieval-request-remember-the-plan
