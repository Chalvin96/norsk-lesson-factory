  judge_prompt: Check that the response is a correct Norwegian time expression for 17.20, i.e., "ti på
    halv seks" or an equivalent natural expression. Accept variants like "ti på halv seks" or "ti på halv
    seks" (no punctuation). Do not accept "ti over halv seks" or "halv seks".
  criteria:
  - id: time-expression
    instruction: Uses a correct Norwegian expression for 17.20, such as "ti på halv seks".
  derived_from:
  - section_id: practice-express-a-given-clock-time
