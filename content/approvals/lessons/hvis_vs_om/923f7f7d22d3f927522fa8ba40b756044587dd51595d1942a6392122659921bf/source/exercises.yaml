    answer_index: 0
  - text_md: ' det blir sent, tar jeg en taxi.» Maja: «Jeg vet ikke '
  - blank_id: condition-2
    options:
    - hvis
    - om
    answer_index: 1
  - text_md: ' toget er forsinket.» Henrik: «'
  - blank_id: condition-3
    options:
    - Hvis
    - Om
    answer_index: 0
  - text_md: ' det regner, spiser vi inne.»'
  explanation_md: The taxi and indoor meal depend on conditions, so they take «hvis». Maja reports the
