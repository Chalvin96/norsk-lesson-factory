  objective: obj-hvis-vs-om-01
  bloom: analyze
  prompt_md: Complete each sentence with hvis or om.
  audio_target: 'Lea, møtet og toget: hver setning mangler ett innledningsord. Avgjør om faktumet presenteres
    som en betingelse eller som et uavklart ja/nei-spørsmål.'
  segments:
  - text_md: 'Henrik: «'
  - blank_id: paired-1a
    options:
    - Hvis
    - Om
    answer_index: 0
  - text_md: ' Lea er hjemme, ringer jeg henne.» Maja: «Jeg vet ikke '
  - blank_id: paired-1b
    options:
    - hvis
    - om
    answer_index: 1
  - text_md: ' Lea er hjemme.» Henrik: «'
  - blank_id: paired-2a
    options:
    - Hvis
    - Om
    answer_index: 0
  - text_md: ' møtet slutter tidlig, tar vi toget.» Maja: «Vi må finne ut '
  - blank_id: paired-2b
