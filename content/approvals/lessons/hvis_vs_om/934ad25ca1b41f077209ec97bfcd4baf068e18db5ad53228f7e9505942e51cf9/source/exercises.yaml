- handle: whether_test
  op: choose
  objective: obj-hvis-vs-om-01
  bloom: apply
  prompt_md: Choose the pair that preserves both meanings.
  stem_md: You need to find out whether the shop is open. If it is open, you will go inside.
  options:
  - id: connectors-reversed
    text: Jeg vet ikke hvis butikken er åpen. Om butikken er åpen, går jeg inn.
    correct: false
    why: This assigns the condition connector to the unresolved question and the question connector to
      the ordinary condition.
  - id: correct-contrast
    text: Jeg vet ikke om butikken er åpen. Hvis butikken er åpen, går jeg inn.
    correct: true
    why: The first sentence embeds an unresolved yes/no question; the second makes entering depend on
      the shop being open.
  - id: both-hvis
    text: Jeg vet ikke hvis butikken er åpen. Hvis butikken er åpen, går jeg inn.
    correct: false
    why: The second connector fits its condition, but the first clause is an unresolved question rather
      than a condition.
  derived_from:
  - section_id: embedded-yes-no-questions-with-om
- handle: paired_meaning_contrast
