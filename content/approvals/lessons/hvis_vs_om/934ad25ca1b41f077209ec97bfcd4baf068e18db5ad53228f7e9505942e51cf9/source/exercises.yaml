- handle: anchor_meaning_check
  op: categorize
  objective: obj-hvis-vs-om-01
  bloom: analyze
  prompt_md: Classify each highlighted clause.
  buckets:
  - bucket_id: condition
    label: Condition
  - bucket_id: embedded-yes-no-question
    label: Embedded yes/no question
  items:
  - item_id: anchor-1
    text: Hvis Nora trenger skyss, kan Henrik hente henne.
    bucket_id: condition
  - item_id: anchor-2
    text: Maja vet ikke om Nora trenger skyss.
    bucket_id: embedded-yes-no-question
  explanation_md: «Hvis» introduces a circumstance that controls a result; «om» introduces an unresolved
    yes/no question.
  derived_from:
  - section_id: the-central-choice
