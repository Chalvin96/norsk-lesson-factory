      Oskar’s earlier commitment is reported.
    correct: true
    why: The lines show an expected arrival, the friend's past willingness, an imagined result, and a reported plan.
  - id: all-arrangements
    text: All four lines describe arrangements fixed before the conversation.
    correct: false
    why: The lines include willingness, an imagined result, an expectation, and a reported plan, not only fixed arrangements.
  - id: all-willingness
    text: All four lines describe people who were willing to act.
    correct: false
    why: Mina's expectation, Oskar's reported plan, and the conditional imagined result do not express willingness.
- handle: transfer-cabin-plans
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'E-post fra Ida: «Hva skjedde med hytteturen, og hva ville dere gjort hvis været ble verre?»
    Fakta: Gruppen hadde avtalt å reise fredag klokka 17. Lars hadde sagt: «Jeg skal ta med nøkkelen.»
    Da bilen brøt sammen, tilbød Mina seg å kjøre. Værmeldingen var usikker. Skriv et svar på 55–85 ord
    på norsk. Forklar planen, Lars’ tidligere utsagn, Minas tilbud etter sammenbruddet og alternativet
    ved verre vær. Bruk *skulle* med infinitiv for den planlagte avreisen og Lars’ utsagn, og *ville*
    med infinitiv for Minas tilbud og det tenkte væralternativet.'
  derived_from:
  - section_id: cumulative-transfer-a-delayed-cabin-trip
  response_language: 'no'
  min_words: 55
  max_words: 85
  judge_prompt: 'Vurder bare den synlige e-postoppgaven. Kriteriene answers-ida, includes-cabin-facts,
    explains-alternative, word-bound og alle fire kriteriene som slutter på -observation er obligatoriske.
    Godta sammenhengende, naturlige varianter. Ankeret som må godkjennes er: «Hei Ida! Vi skulle reise
    fredag klokka fem. Lars hadde sagt at han skulle ta med nøkkelen. Da bilen stoppet, ville Mina kjøre
    oss videre. Hvis været ble verre, ville vi bli hjemme, men først skulle vi prøve å finne en annen
    bil. Jeg håper hytteturen fortsatt kan gjennomføres. Turen er planlagt og ville vært hyggelig for
    alle i gruppen.» Et svar som ikke inneholder de nødvendige hyttefaktaene, skal underkjennes, for eksempel:
    «Hei! Planene endret seg, men alt ordnet seg til slutt.» Modalformene skal uttrykke henholdsvis planlagt
    avreise med skulle og infinitiv, Lars’ tidligere utsagn med skulle og infinitiv, Minas tilbud med
    ville og infinitiv, og det tenkte værutfallet med ville og infinitiv.'
  criteria:
  - id: answers-ida
    instruction: Replies to Ida and explains what happened with the cabin trip.
  - id: includes-cabin-facts
    instruction: Includes the arranged departure, Lars’s earlier statement, and Mina’s offer after the
      breakdown.
  - id: explains-alternative
    instruction: States the imagined bad-weather alternative.
  - id: word-bound
    instruction: Contains 55–85 words.
  - id: cabin-arrangement-observation
    instruction: Must express the arranged departure naturally with *skulle* and a bare infinitive.
  - id: cabin-report-observation
    instruction: Must report Lars’s earlier *skal*-type commitment with *skulle* and a bare infinitive.
  - id: cabin-willingness-observation
    instruction: Must express Mina’s readiness after the breakdown with *ville* and a bare infinitive.
  - id: cabin-hypothetical-observation
    instruction: Must express the imagined weather result with *ville* and a bare infinitive.
- handle: retrieve-skulle-versus-ville
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'Draft to the neighbourhood group: «Vi ville møtes klokka ni; det var avtalt tirsdag. Sara
    skulle hjelpe da vi manglet folk, og hun tilbød seg frivillig. Jakob sa tidligere: “Jeg skal ta med
    termosen”, så han ville ta den med. Hvis det regnet, skulle vi flytte bordene inn.» It did not rain,
    and the group had not agreed on a rain procedure; that final line is a hypothetical, not a plan. Write
    a corrected 45–70-word Norwegian message that preserves all four stated meanings.'
  derived_from:
  - section_id: final-retrieval
  response_language: 'no'
  min_words: 45
  max_words: 70
  judge_prompt: 'Evaluate only the visible revision task. Criteria preserves-four-meanings, produces-clear-message,
    and word-bound are gating. Criteria ending in -observation are diagnostic and never fail an otherwise
    adequate revision. The learner need not retain the draft’s sentence order. Anchor that must pass:
    «Vi skulle møtes klokka ni, slik vi hadde avtalt. Sara ville hjelpe da vi manglet folk, fordi hun
    tilbød seg frivillig. Jakob hadde sagt at han skulle ta med termosen. Hvis det regnet, ville vi flytte
    bordene inn, slik at markedet kunne fortsette uten problemer. Alle i gruppa fikk beskjed om planen
    på forhånd.» Anchor that must fail preserves-four-meanings: «Planene for markedet var uklare, men
    alle prøvde å hjelpe.» A message that retains one wrong modal fails the preserves-four-meanings gating
    criterion; the corresponding observation may also be flagged.'
  criteria:
  - id: preserves-four-meanings
    instruction: Preserves the earlier meeting arrangement, Sara’s voluntary offer, Jakob’s earlier commitment,
      and the imagined rain result.
  - id: produces-clear-message
    instruction: Produces a coherent message suitable for the neighbourhood group.
  - id: word-bound
    instruction: Contains 45–70 words.
  - id: revised-modal-choices-observation
    instruction: Observe whether *skulle* is used for the arrangement and reported commitment and *ville*
      for willingness and the imagined result; report remaining problems diagnostically.
  - id: bare-infinitive-observation
    instruction: Observe whether modal complements use bare infinitives without *å*; report problems diagnostically.
