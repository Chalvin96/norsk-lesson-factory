- handle: report-future-from-past
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'Jonas skrev i går: «Jeg skal sende dokumentet i kveld.» I dag spør kollegaen din hva Jonas
    lovet. Write a 20–35-word Norwegian reply to your colleague that reports the promise. Bruk *skulle*
    fulgt av en grunninfinitiv.'
  derived_from:
  - section_id: skulle-for-future-viewed-from-the-past
  response_language: 'no'
  min_words: 20
  max_words: 35
  judge_prompt: 'Evaluate only the visible reply task. Criterion reports-promise, criterion word-bound,
    and criterion modal-choice-observation are gating. Accept natural wording and pronoun reference. Anchor
    that must pass: «Jonas lovet i går at han skulle sende dokumentet samme kveld. Du kan derfor trygt
    vente på det her i dag.» Anchor that must fail reports-promise: «Jeg vet ikke hva Jonas sa om dokumentet.»
    A reply that reports the promise but uses a different modal or does not use *skulle* followed by a
    bare infinitive fails modal-choice-observation.'
  criteria:
  - id: reports-promise
    instruction: Replies to the colleague and clearly reports Jonas’s stated promise to send the document.
  - id: word-bound
    instruction: Contains 20–35 words.
  - id: modal-choice-observation
    instruction: Preserves the earlier *skal*-type commitment with *skulle* followed by a bare infinitive.
      Replies that do not make this modal distinction fail.
