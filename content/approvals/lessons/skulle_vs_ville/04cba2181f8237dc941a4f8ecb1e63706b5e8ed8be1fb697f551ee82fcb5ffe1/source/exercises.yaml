- handle: distinguish-reported-and-hypothetical-would
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'Du kan allerede bruke modalverb + infinitiv. Nå sammenligner du det forvekslingsparet *skulle*
    og *ville*. Fakta til en markedsoppdatering: Maja sa tidligere: «Jeg skal kjøpe huset.» Kjøpet er
    derfor planen hennes. Leiligheten er for dyr for gruppen. Gruppen forestiller seg at den er billigere;
    da leier de den. Skriv en norsk oppdatering på 35–55 ord til markedsgruppen. Bruk *skulle* etterfulgt
    av en bare infinitiv for å rapportere Majas plan, og *ville* etterfulgt av en bare infinitiv for å
    uttrykke hva gruppen ville gjøre hvis leiligheten var billigere.'
  derived_from:
  - section_id: ville-for-hypothetical-results
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: 'Vurder bare den synlige oppdateringen. Kriteriene reports-majas-plan, conveys-imagined-result,
    addresses-group, word-bound, reported-plan-modal-observation og hypothetical-modal-observation er
    avgjørende. Eksempel som må bestå: «Maja sa tidligere at hun skulle kjøpe huset, og derfor regner
    vi kjøpet som planen hennes. Leiligheten er for dyr for gruppen vår akkurat nå. Hvis den var billigere,
    ville vi leie den. Dette er dagens oppdatering til markedsgruppen.» Eksempel som må stryke på conveys-imagined-result:
    «Leiligheten er billig, og vi leier den nå.» En feil i modalverbet gir stryk på det tilhørende modalverbkriteriet.'
  criteria:
  - id: reports-majas-plan
    instruction: Reports Maja’s stated plan to buy the house.
  - id: conveys-imagined-result
    instruction: Conveys that renting the flat is the result of imagining a lower price, not a current
      fact.
  - id: addresses-group
    instruction: Reads as an update relevant to the market group.
  - id: word-bound
    instruction: Contains 35–55 words.
  - id: reported-plan-modal-observation
    instruction: Requires that Maja’s earlier *skal*-type plan is reported with *skulle* and a bare infinitive.
  - id: hypothetical-modal-observation
    instruction: Requires that the imagined result is expressed with *ville* and a bare infinitive.
- handle: interpret-market-follow-up
  op: choose
  objective: obj-skulle-vs-ville-01
  bloom: understand
  prompt_md: Choose the interpretation that matches every line.
  derived_from:
