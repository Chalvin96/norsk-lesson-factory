  stem_md: 'Mina: «Vi regnet med at du skulle komme etter lunsj.» Ali: «Jeg trengte hjelp med utstyret,
    og vennen min ville bære det.» Ali: «Hvis vi fikk en større bil, ville vi ta med alle kassene.» Lea:
    «Oskar sa at han skulle låse døra etter møtet.»'
  options:
  - id: drive-as-arrangement
    text: Mina expected Ali later; his friend had agreed to help earlier; taking every box depends on an imagined
      condition; Oskar’s earlier plan to lock up is reported.
    correct: false
    why: This incorrectly turns Ali's friend's willingness into an earlier agreement.
  - id: expected-willing-hypothetical-commitment
