- handle: contrast-plan-and-willingness
  op: write
  objective: obj-skulle-vs-ville-01
  bloom: apply
  prompt_md: 'Emil spør om Nora hadde avtalt å kjøre ham, eller om hun tilbød seg etter at bilen stoppet. Fredag avtalte Nora å kjøre ham til markedet lørdag. Søndag stoppet bilen, og Nora tilbød seg å kjøre. Svar på 35–55 ord med passende former av «skulle» og «ville».'
  derived_from:
  - section_id: ville-for-past-willingness
  response_language: "no"
  min_words: 35
  max_words: 55
  judge_prompt: 'Evaluate only the visible reply task. Criteria distinguishes-situations, uses-given-facts, and word-bound are gating. The two criteria ending in -observation are diagnostic and never fail the reply. Accept natural paraphrases. Anchor that must pass: «På lørdag var kjøringen avtalt allerede fredag, da Nora skulle kjøre Emil til markedet. På søndag tilbød Nora seg først da bilen hans stoppet, og han trengte akutt hjelp; da ville hun kjøre ham videre.» Anchor that must fail distinguishes-situations: «Nora kjørte Emil både lørdag og søndag.» A reply that exchanges skulle and ville fails distinguishes-situations, even if it otherwise states the factual contrast.'
  criteria:
  - id: distinguishes-situations
    instruction: Clearly distinguishes the earlier arrangement from the later voluntary offer, using skulle for the earlier planned drive and ville for Nora’s later willingness.
  - id: uses-given-facts
    instruction: Uses the supplied facts without contradicting them.
  - id: word-bound
    instruction: Contains 35–55 words.
  - id: arrangement-modal-observation
    instruction: Observe whether the earlier arrangement is naturally expressed with *skulle* and a bare infinitive; report problems diagnostically.
  - id: willingness-modal-observation
    instruction: Observe whether Nora’s readiness after the stated need is naturally expressed with *ville* and a bare infinitive; report problems diagnostically.
