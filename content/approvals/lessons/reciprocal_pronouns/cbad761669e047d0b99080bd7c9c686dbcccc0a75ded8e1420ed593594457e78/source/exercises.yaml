  prompt_md: Read each Norwegian sentence and sort it by the meaning it carries.
  stem_md: Decide whether each sentence describes one shared activity or an action that passes between
    the people.
  explanation_md: A plural subject can act together without acting toward one another; hverandre marks
    the two-way action.
  buckets:
  - bucket_id: joint
    label: One shared activity
  - bucket_id: reciprocal
    label: An action between the people
  items:
