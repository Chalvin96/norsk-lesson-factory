      text_md: «Jeg bærer kassene til Noor i dag.»
    - speaker: Noor
      text_md: «Jeg bærer bagene til Aida i dag.»
  options:
  - id: joint-activity
    text: Aida og Noor bærer de samme kassene sammen.
