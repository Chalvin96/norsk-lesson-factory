    text: Ada lager suppe til Kim.
    correct: false
    why: This reports only one direction, which the dialogue does not support.
  - id: shared-meal
    text: Ada og Kim lager suppe sammen.
    correct: true
    why: They prepare one shared pot, so the activity is joint.
