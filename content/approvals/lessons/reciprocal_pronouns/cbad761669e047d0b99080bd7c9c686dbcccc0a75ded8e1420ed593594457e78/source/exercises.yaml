- handle: write_reciprocal_sentences_in_new_context
  op: write
  objective: obj-reciprocal-pronouns-01
  bloom: apply
  prompt_md: 'The building caretaker asks how the neighbors cooperated after the winter storm. Write a
    35–55-word Norwegian message that states all three facts: the neighbors cleared snow for one another,
    sent one another warnings about icy paths, and borrowed tools from one another last week.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Vaktmester
      text_md: «Det var mye snø etter stormen. Hvilke ting gjorde naboene for å samarbeide?»
    - speaker: Nabo
      text_md: «De ryddet området, delte informasjon om farlige steder og lånte utstyr i forrige uke.»
  response_language: 'no'
  min_words: 35
  max_words: 55
  explanation_md: A useful report communicates the supplied facts clearly and uses reciprocal wording
    for each two-way relationship.
  judge_prompt: Evaluate only the listed gating criteria. Criteria whose ids end in -observation are diagnostic
    only and must never cause failure. Report a verdict and evidence for every criterion id.
  criteria:
  - id: neighbor-facts
    instruction: The message communicates all three supplied facts about snow clearing, icy-path warnings,
      and borrowing tools.
  - id: reciprocal-forms
    instruction: The message expresses each of the three two-way relationships with an explicit and natural
      use of hverandre.
  - id: audience-purpose
    instruction: The response is a coherent Norwegian report suitable for updating the caretaker.
  - id: word-bound
    instruction: The message contains 35–55 words.
  - id: reciprocal-form-observation
    instruction: The message uses hverandre for all three relationships between the neighbors.
  - id: preposition-form-observation
    instruction: 'Observation only: note whether any preposition used before hverandre fits its Norwegian
      verb expression; do not fail the message for this.'
  derived_from:
  - section_id: guided-transfer-new-situation
- handle: retrieve_and_transfer_hverandre
  op: write
  objective: obj-reciprocal-pronouns-01
  bloom: apply
  prompt_md: 'Nora has asked for a short plan for Saturday''s trip. Write a 30–50-word Norwegian reply
    that explicitly uses reciprocal constructions for all four facts: the friends will call one another
    on Friday, wait for one another at the station, help one another with the luggage, and send one another
    messages during the trip.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Kan du sende meg en kort plan for lørdagsturen?»
    - speaker: Jon
      text_md: «Ja. Vi har avtalt flere punkter for reisen og møtes ved stasjonen.»
  response_language: 'no'
  min_words: 30
  max_words: 50
  explanation_md: The reply should give Nora a complete, practical plan based on the supplied facts and
    use reciprocal constructions for each relationship.
  judge_prompt: Evaluate only the listed gating criteria. Criteria whose ids end in -observation are diagnostic
    only and must never cause failure. Report a verdict and evidence for every criterion id.
  criteria:
  - id: trip-facts
    instruction: The reply communicates all four supplied facts about calling, waiting, helping with bags,
      and sending messages.
  - id: reciprocal-constructions
    instruction: The reply explicitly uses natural Norwegian reciprocal constructions for all four relationships.
  - id: reply-purpose
    instruction: The response is a coherent Norwegian reply that gives Nora the requested plan.
  - id: word-bound
    instruction: The reply contains 30–50 words.
  - id: reciprocal-form
    instruction: The reply expresses each reciprocal relationship with hverandre.
  - id: construction-choice-observation
    instruction: 'Observation only: note whether hverandre is placed directly after suitable verbs and
      after the required preposition in expressions such as vente på; do not fail the reply for this.'
  derived_from:
  - section_id: retrieval-and-review
