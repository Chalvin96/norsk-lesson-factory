    text: Vennene lager én middag sammen.
    bucket_id: joint
  - item_id: reciprocal-cooking
    text: Vennene lager middag til hverandre.
    bucket_id: reciprocal
  - item_id: joint-walking
    text: Naboene går sammen til bussen.
    bucket_id: joint
  - item_id: reciprocal-waiting
    text: Naboene venter på hverandre ved bussen.
    bucket_id: reciprocal
  derived_from:
