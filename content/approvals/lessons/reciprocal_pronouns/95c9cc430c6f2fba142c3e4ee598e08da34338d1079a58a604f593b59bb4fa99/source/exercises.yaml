- handle: write_reciprocal_sentences_in_new_context
  op: write
  objective: obj-reciprocal-pronouns-01
  bloom: apply
  prompt_md: "Skriv en melding til vaktmesteren om hjelpen i parsellhagen. Ta med alle tre opplysningene og bruk gjensidige uttrykk der det passer."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Vaktmester
      text_md: Hvordan gikk det i parsellhagen mens dere var borte?
    - speaker: Nabo
      text_md: Ava vannet plantene for Omar mens han var bortreist. Omar tok vare på plantene hennes da
        hun var syk. De byttet stiklinger og ga hverandre råd om plantene.
  response_language: 'no'
  min_words: 35
  max_words: 55
  explanation_md: Meldingen gjengir de tre opplysningene og bruker gjensidige uttrykk om handlingene som
    gikk begge veier.
  judge_prompt: Evaluate only the listed criteria. Accept natural Bokmål and any accurate description
    of the supplied plant-care facts. Require reciprocal wording only for relationships the stimulus establishes
    as mutual.
  criteria:
  - id: neighbor-facts
    instruction: The message communicates all three supplied facts about watering, caring for plants,
      and exchanging cuttings and advice.
  - id: reciprocal-forms
    instruction: The message accurately uses reciprocal expressions for actions the neighbors performed
      for one another, without requiring every fact to be reciprocal.
  - id: audience-purpose
    instruction: The response is a coherent Norwegian report suitable for updating the caretaker.
  - id: reciprocal-form-observation
    instruction: 'Observation only: note where hverandre occurs; do not treat it as required for facts
      that are not mutual.'
  - id: preposition-form-observation
    instruction: 'Observation only: note whether any preposition used before hverandre fits its Norwegian
      verb expression; do not fail the message for this.'
  derived_from:
  - section_id: guided-transfer-new-situation
- handle: retrieve_and_transfer_hverandre
  op: write
  objective: obj-reciprocal-pronouns-01
  bloom: apply
  prompt_md: "Skriv et svar til Nora med planen for lørdagsturen. Ta med alle opplysningene, og bruk «hverandre» minst én gang om en gjensidig handling."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: Kan du sende meg en kort plan for lørdagsturen?
    - speaker: Jon
      text_md: Vi kan ringe på vei, møtes ved stasjonen og bytte på å bære sekkene. Jeg sender deg planen,
        og du sender meg rutetidene.
  response_language: 'no'
  min_words: 30
  max_words: 50
  explanation_md: Svaret skal gi Nora en fullstendig og praktisk plan. Bruk «hverandre» minst én gang
    om en gjensidig handling, og gjengi de andre opplysningene naturlig.
  judge_prompt: Evaluate the listed criteria using only facts supplied in the prompt and dialogue. Accept
    natural Norwegian reciprocal constructions; do not require an unsupplied detail.
  criteria:
  - id: trip-facts
    instruction: The reply communicates all supplied facts about calling, meeting at the station, carrying
      the bags; do not infer or require a number of bags, and exchanging the plan and schedule.
  - id: reciprocal-constructions
    instruction: The reply uses at least one natural construction with hverandre for an action established
      as mutual in the stimulus.
  - id: reply-purpose
    instruction: The response is a coherent Norwegian reply that gives Nora the requested plan.
  - id: reciprocal-form-observation
    instruction: The reply must use hverandre at least once for a mutual action. Other supplied facts
      may be expressed naturally, including with møtes or bytte på å bære.
  - id: construction-choice-observation
    instruction: 'Observation only: note whether hverandre is placed directly after suitable verbs and
      after the required preposition in expressions such as vente på; do not fail the reply for this.'
  derived_from:
  - section_id: retrieval-and-review
