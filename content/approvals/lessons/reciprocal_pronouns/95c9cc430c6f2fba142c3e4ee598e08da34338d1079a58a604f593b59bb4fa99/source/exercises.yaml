  objective: obj-reciprocal-pronouns-01
  bloom: understand
  prompt_md: Velg setningen som passer til Aida og Noor.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Aida
      text_md: «Jeg bærer kassene til Noor i dag.»
    - speaker: Noor
      text_md: «Jeg bærer bagene til Aida i dag.»
  options:
  - id: joint-activity
    text: Aida og Noor bærer de samme kassene sammen.
    correct: false
    why: Dialogen beskriver to ulike oppgaver, ikke én felles bærejobb.
  - id: one-way-noor
    text: Noor bærer kassene alene.
    correct: false
    why: Dialogen sier at begge bærer noe til den andre, hver sin vei.
  - id: reciprocal-help
    text: Aida og Noor bærer ting til hverandre.
    correct: true
    why: Begge bærer noe til den andre, hver sin vei.
