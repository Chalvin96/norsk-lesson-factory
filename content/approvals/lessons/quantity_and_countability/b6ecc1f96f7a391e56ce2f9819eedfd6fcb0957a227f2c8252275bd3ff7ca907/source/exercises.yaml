  stem_md: 'Result 1: Sara washed every glass in a plural set. Result 2: Sara cleaned one complete kitchen.'
  options:
  - id: whole-twice
    text: Sara vasket ett glass. Sara vasket hele kjøkkenet.
    correct: false
    why: Ett selects one glass rather than every glass in the plural set, even though hele fits the complete
      kitchen.
  - id: members-then-whole
    text: Sara vasket alle glassene. Sara vasket hele kjøkkenet.
    correct: true
    why: Alle includes every member of the plural set, while hele presents the kitchen as one complete
      thing.
  - id: whole-then-members
    text: Sara vasket alle glassene. Sara vasket hele kjøkkenene.
    correct: false
    why: Alle fits the plural glasses, but hele kjøkkenene refers to multiple complete kitchens rather
      than one complete kitchen.
  - id: members-twice
    text: Sara vasket alle glassene. Sara vasket alle kjøkkenene.
    correct: false
    why: Alle fits the plural glasses but refers to multiple kitchens instead of one complete singular
      kitchen.
