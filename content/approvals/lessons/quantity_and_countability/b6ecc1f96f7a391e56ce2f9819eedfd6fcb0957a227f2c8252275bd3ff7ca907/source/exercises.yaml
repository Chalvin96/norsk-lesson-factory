- handle: contrast_litt_and_lite
  op: choose
  objective: obj-quantity-and-countability-01
  bloom: analyze
  prompt_md: Choose the reply that matches both facts.
  derived_from:
  - section_id: few-and-little-fa-lite-and-litt
  stem_md: 'Fact 1: There is enough milk for the coffee. Fact 2: There is not enough milk, so more must
    be bought.'
  options:
  - id: insufficient-then-available
    text: 1) Vi har lite melk til kaffen. 2) Vi har litt melk, og det er nok til kaffen.
    correct: false
    why: The forms reverse the intended perspectives; the first amount is sufficient, while the second
      is insufficient.
  - id: available-then-insufficient
    text: 1) Vi har litt melk til kaffen. 2) Vi har lite melk, så vi må kjøpe mer.
    correct: true
    why: Litt presents the available small amount neutrally, while lite presents the second amount as
      insufficient.
  - id: available-twice
    text: 1) Vi har litt melk til kaffen. 2) Vi har litt melk, så vi trenger ikke kjøpe mer.
    correct: false
    why: The second form does not express the stated shortage as clearly as lite.
  - id: insufficient-twice
    text: 1) Vi har lite melk til kaffen. 2) Vi har lite melk, så vi må kjøpe mer.
    correct: false
    why: The first form suggests a shortage even though the stated amount is enough.
