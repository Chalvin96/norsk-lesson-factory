- handle: pack_for_cabin_trip
  op: write
  objective: obj-quantity-and-countability-01
  bloom: apply
  prompt_md: 'Two friends are packing for a cabin trip: they have two maps, six bags, bread, water, a
    little coffee that is enough for breakfast, too little milk for the weekend, three flashlights with
    only one working, one complete weekend, and five jobs that everyone must finish. Write a 55–90-word
    Norwegian message to the other friend explaining what they have and what they must buy. Use accurate
    Norwegian quantity expressions for countable items and uncountable amounts. You must distinguish the
    sufficient small amount of coffee from the insufficient amount of milk, and express the complete weekend,
    the exact group of two, and that everyone must finish the jobs.'
  derived_from:
  - section_id: transfer-preparing-for-a-weekend-trip
  response_language: 'no'
  min_words: 55
  max_words: 90
  judge_prompt: 'Vurder hyttemeldingen mot de synlige kravene: Den skal være en sammenhengende norsk melding
    på 55–90 ord som gjengir faktaene riktig, bruker passende mengdeuttrykk for tellelige ting og utellelige
    mengder, og uttrykker de små mengdene, hele helgen, gruppen på to og at alle må fullføre oppgavene.
    Bestått eksempel: Meldingen oppfyller alle disse kravene. Ikke bestått eksempel: Meldingen har færre
    enn 55 ord, mangler ett av de uttrykkelig etterspurte mengdeområdene eller bruker en grammatisk feil
    mengdeform.'
  criteria:
  - id: cabin-message
    instruction: Writes a comprehensible Norwegian message to the other friend explaining what they have
      and what they must buy.
  - id: supplied-facts
    instruction: Uses the supplied cabin facts without materially contradicting them.
  - id: word-bound
    instruction: Contains 55–90 words.
  - id: countability
    instruction: Uses accurate Norwegian quantity forms for countable items and uncountable amounts, including
      forms such as «to kart», «seks vesker», «litt kaffe» and «for lite melk».
  - id: scope
    instruction: Accurately expresses the exact group of two, the whole weekend, and that everyone must
      finish the jobs.
  - id: small-quantity
    instruction: Accurately distinguishes the small amount of coffee that is sufficient from the insufficient
      amount of milk.
- handle: quantity_words_quick_review
  op: write
  objective: obj-quantity-and-countability-01
  bloom: apply
  prompt_md: 'Romkameraten spør om en oppdatering av matforrådet. Eplekurven er nesten full, risbeholderen
    er godt fylt, og tomater ligger klare til salaten uten at tallet oppgis. Melken rekker ikke til frokosten,
    så mer må kjøpes. Familien er hjemme: Fire personer bor der, og ingen er bortreist. Matlagingen varer
    fra kveldens start
    til slutt. Det står to rene flasker klare, og hver forberedelsesoppgave er ferdig. Skriv et norsk svar
    på 35–60 ord som rapporterer situasjonen, sier uttrykkelig at melk må kjøpes, og bruker passende mengdeord.'
  derived_from:
  - section_id: final-retrieval-request-quantity-words-quick-review
  response_language: 'no'
  min_words: 35
  max_words: 60
  judge_prompt: Vurder de synlige kravene til svaret om matforrådet, med kriteriene svarformål, oppgitte
    matforrådsfakta, hva som må kjøpes, riktige mengdeord og ordgrense. Et svar består bare hvis det er
    naturlig norsk, er på 35–60 ord, gjengir de oppgitte matforrådsfaktaene, sier uttrykkelig at melk
    må kjøpes, og bruker mengdeord som passer til tellelighet, mengde, totalomfang, helhet og en gruppe
    på nøyaktig to. Et svar som sier «mye epler» i stedet for et tellelig antall, skal underkjennes. Et
    svar som utelater hva som må kjøpes, skal underkjennes.
  criteria:
  - id: reply-purpose
    instruction: Writes a comprehensible Norwegian reply that updates the housemate about the pantry and
      preparations.
  - id: supplied-pantry-facts
    instruction: Reports the supplied facts, including the milk shortage, without materially contradicting
      them, explicitly says that milk must be bought, and uses quantity words that accurately express
      countability, amount, total scope, wholeness, and an exactly-two group.
  - id: word-bound
    instruction: Contains 35–60 words.
  - id: quantity-selection
    instruction: Uses quantity words accurately for countable nouns, uncountable amounts, total scope,
      wholeness, and an exactly-two group.
