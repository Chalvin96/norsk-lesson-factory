  options:
  - id: object-surprise
    text: Liv lagde til og med maten.
    correct: false
    why: Her er maten det overraskende leddet, ikke Liv.
  - id: focus-selv
    text: Selv Liv lagde maten.
    correct: true
    why: Foran Liv markerer «selv» personen som overraskende inkludert.
