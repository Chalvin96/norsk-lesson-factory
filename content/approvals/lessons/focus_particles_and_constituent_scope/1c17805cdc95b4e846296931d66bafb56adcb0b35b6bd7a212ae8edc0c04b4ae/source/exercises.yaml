    leddet.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Liv kjøper dessert, og ingenting annet.»
    - speaker: Sofie
      text_md: «Amir bidrar med dessert i tillegg.»
    - speaker: Jonas
      text_md: «Naboene kommer, enda ingen ventet det.»
    - speaker: Sofie
      text_md: «Gruppen spiser ute, enda det er november.»
  derived_from:
  - section_id: retrieval-review
  response_language: 'no'
  min_words: 20
  max_words: 35
  judge_prompt: Vurder kriteriene liv-purchase, amir-addition, unexpected-neighbors, surprising-time,
    message-purpose, word-bound, bare-placement, ogsa-placement og even-placement som beståttkrav. Alle
    disse synlige kravene må være oppfylt; legg ikke til andre beståttkrav.
  criteria:
  - id: liv-purchase
    instruction: Meldingen uttrykker at dessert er det eneste Liv kjøper.
  - id: amir-addition
    instruction: Meldingen uttrykker at Amir er en ekstra dessertkjøper.
  - id: unexpected-neighbors
    instruction: Meldingen uttrykker at naboenes deltakelse er overraskende.
  - id: surprising-time
    instruction: Meldingen uttrykker at det er overraskende at gruppen spiser ute i november.
  - id: message-purpose
    instruction: Svaret fungerer som én forståelig korrigert melding til lunsjgruppen.
  - id: word-bound
    instruction: Meldingen inneholder 20–35 ord.
  - id: bare-placement
    instruction: Meldingen bruker «bare» slik at kjøpet, og ikke Liv, avgrenses.
  - id: ogsa-placement
    instruction: Meldingen bruker «også» slik at Amir legges til dessertkjøperne.
  - id: even-placement
    instruction: Meldingen bruker «selv» eller «til og med» foran det overraskende leddet.
