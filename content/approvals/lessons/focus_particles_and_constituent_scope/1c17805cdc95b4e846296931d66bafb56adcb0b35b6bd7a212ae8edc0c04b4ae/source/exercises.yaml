- handle: transfer_focus_to_workplace_picnic
  op: write
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: apply
  prompt_md: Du skriver til kollegene for å oppdatere piknikplanen. Bruk «bare» for å avgrense hvem som
    kommer, «også» for å legge til en matvare, og «selv» eller «til og med» foran det overraskende leddet.
    Skriv en tydelig melding på 30–50 ord.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Jeg kommer på pikniken, men ingen andre fra økonomiavdelingen kan.»
    - speaker: Jonas
      text_md: «Bra. Tar du med mat?»
    - speaker: Mina
      text_md: «Ja, jeg tar med salat og brød.»
    - speaker: Jonas
      text_md: «Direktøren kommer faktisk, enda hun vanligvis takker nei.»
    - speaker: Mina
      text_md: «Så hyggelig. Og vi møtes ute, enda det er meldt regn.»
  derived_from:
  - section_id: transfer-workplace-picnic
  response_language: 'no'
  min_words: 30
  max_words: 50
  judge_prompt: Vurder kriteriene facts-attendance, facts-food, facts-surprise, audience-purpose, word-bound,
    bare-scope, ogsa-scope og surprising-scope som beståttkrav. Alle disse synlige kravene må være oppfylt;
    legg ikke til andre beståttkrav.
  criteria:
  - id: facts-attendance
    instruction: Meldingen sier at Mina er den eneste fra økonomiavdelingen som kommer.
  - id: facts-food
    instruction: Meldingen sier at Mina tar med både salat og brød.
  - id: facts-surprise
    instruction: Meldingen sier at direktøren kommer, og formidler at dette er overraskende.
  - id: audience-purpose
    instruction: Svaret fungerer som en forståelig oppdatering til kollegene.
  - id: word-bound
    instruction: Meldingen inneholder 30–50 ord.
  - id: bare-scope
    instruction: Meldingen bruker «bare» tydelig for å uttrykke at én person er den eneste fra økonomiavdelingen
      som kommer.
  - id: ogsa-scope
    instruction: Meldingen bruker «også» tydelig foran én av matvarene.
  - id: surprising-scope
    instruction: Meldingen bruker «selv» eller «til og med» tydelig foran den overraskende personen, tingen
      eller omstendigheten.
- handle: compare_picnic_scope_shifts
  op: write
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: analyze
  prompt_md: 'En kollega spør hvorfor disse meldingene betyr forskjellige ting: A: Bare Ada tar med salat.
    B: Ada tar bare med salat. C: Også Per møter oss i parken. D: Per møter oss også i parken, i tillegg
    til på kontoret. Svar kollegaen på norsk og forklar forskjellene på 35–65 ord.'
  derived_from:
  - section_id: transfer-workplace-picnic
  response_language: 'no'
  min_words: 35
  max_words: 65
  judge_prompt: Vurder kriteriene bare-pair-meaning, ogsa-pair-meaning, colleague-explanation og word-bound.
    Hvert av disse synlige kravene må være oppfylt; legg ikke til andre beståttkrav.
  criteria:
  - id: bare-pair-meaning
    instruction: Forklarer at A avgrenser hvem som tar med salat, mens B avgrenser hva Ada tar med.
  - id: ogsa-pair-meaning
    instruction: Forklarer at C legger Per til deltakerne, mens D i denne konteksten legger parken til
      Pers møtesteder.
  - id: colleague-explanation
    instruction: Svaret er formulert som en forståelig forklaring til kollegaen.
  - id: word-bound
    instruction: Svaret inneholder 35–65 ord.
- handle: retrieve_focus_particle_placement
