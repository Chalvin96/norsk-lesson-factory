- handle: notice_focus_in_cabin_dialogue
  op: choose
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: understand
  prompt_md: Velg hva «bare» avgrenser.
  derived_from:
  - section_id: cabin-dinner
  stem_md: 'Jonas: Hva tar Amir med? Sofie: Amir tar bare brød.'
  options:
  - id: bare-restricts-person
    text: Amir er den eneste personen som tar med brød.
    correct: false
    why: Da måtte «bare» stå foran Amir.
  - id: bare-restricts-item
    text: Brød er det eneste Amir tar med.
    correct: true
    why: «Bare» står rett foran brød og utelukker andre ting.
  - id: bare-adds-item
    text: Amir tar med brød i tillegg til andre ting.
    correct: false
    why: Det ville være en tilføyelse, mens «bare» uttrykker en avgrensning.
