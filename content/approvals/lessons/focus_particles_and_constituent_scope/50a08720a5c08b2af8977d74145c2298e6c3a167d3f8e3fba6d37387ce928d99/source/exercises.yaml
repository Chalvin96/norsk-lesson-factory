- handle: transfer_focus_to_workplace_picnic
  op: write
  objective: obj-focus-particles-and-constituent-scope-01
  bloom: apply
  prompt_md: 'Write a clear message to your colleagues about the picnic plan. Use «bare» for who is coming, «også» for an additional food item, and «selv» or «til og med» for the surprising guest, the director.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Jeg kommer på pikniken, men ingen andre fra økonomiavdelingen kan.»
    - speaker: Jonas
      text_md: «Bra. Tar du med mat?»
    - speaker: Mina
      text_md: «Ja, jeg tar med salat og brød.»
    - speaker: Jonas
      text_md: «Direktøren kommer faktisk, enda hun vanligvis takker nei.»
    - speaker: Mina
      text_md: «Så hyggelig. Og vi møtes ute, enda det er meldt regn.»
  derived_from:
  - section_id: transfer-workplace-picnic
  response_language: 'no'
  min_words: 30
  max_words: 50
  judge_prompt: "Vurder kriteriene facts-attendance, facts-food, facts-surprise, audience-purpose, bare-scope, ogsa-scope og surprising-scope som beståttkrav. Alle disse synlige kravene må være oppfylt; legg ikke til andre beståttkrav."
  criteria:
  - id: facts-attendance
    instruction: Meldingen sier at Mina er den eneste fra økonomiavdelingen som kommer.
  - id: facts-food
    instruction: Meldingen sier at Mina tar med både salat og brød.
  - id: facts-surprise
    instruction: Meldingen sier at direktøren kommer, og formidler at dette er overraskende.
  - id: audience-purpose
    instruction: Svaret fungerer som en forståelig oppdatering til kollegene.
  - id: bare-scope
    instruction: Meldingen bruker «bare» tydelig for å uttrykke at én person er den eneste fra økonomiavdelingen
      som kommer.
  - id: ogsa-scope
    instruction: Meldingen bruker «også» naturlig for å vise at den ene matvaren føyes til den andre; godta både salat som tillegg til brød og brød som tillegg til salat.
  - id: surprising-scope
    instruction: Meldingen bruker «selv» eller «til og med» foran direktøren for å markere at hennes deltakelse er overraskende.
