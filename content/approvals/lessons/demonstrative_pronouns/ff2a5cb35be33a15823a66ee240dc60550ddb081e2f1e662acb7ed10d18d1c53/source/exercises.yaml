- handle: definite_form_repair
  op: find_fix
  objective: obj-demonstrative-pronouns-01
  bloom: analyze
  derived_from:
  - section_id: the-noun-must-be-definite
  prompt_md: 'Which word must change to make the phrase «denne stol her» grammatically correct?'
  tokens:
