- handle: full_reference_discrimination
  op: choose
  objective: obj-demonstrative-pronouns-01
  bloom: analyze
  derived_from:
  - section_id: describing-a-particular-object
  prompt_md: 'Choose the reply that shows which chairs Maja means.'
  stem_md: 'Sales assistant: «Mener du de gamle stolene bakerst?» Maja: «Nei, jeg mener stolene ved siden av meg.»'
  options:
  - id: near-singular-chair
    text: «Jeg mener denne stolen ved siden av meg.»
    correct: false
    why: This is a grammatical phrase for one nearby chair, but Maja means several chairs.
  - id: nearby-old-chairs
    text: «Jeg mener disse stolene her.»
    correct: true
    why: The plural demonstrative marks the chairs as nearby, and the definite noun remains visible.
  - id: distant-old-chairs
    text: «Jeg mener de stolene bakerst.»
    correct: false
    why: The noun phrase is well formed, but «de» selects the farther-away set.
- handle: counter_summary
  op: write
  objective: obj-demonstrative-pronouns-01
  bloom: apply
  derived_from:
  - section_id: back-at-the-counter
  prompt_md: 'Write a short message to the sales assistant. Ask for the lamp and mirror on the counter here and the chairs by Maja, but not the chairs at the back. Use a demonstrative pronoun and a definite noun for each item.'
  min_words: 12
  max_words: 25
  response_language: "no"
  judge_prompt: "Assess only criteria selected-common-singular, selected-neuter-singular, selected-plural, rejected-plural-far, audience-purpose. A response passes when every listed criterion is met."
  criteria:
  - id: selected-common-singular
    instruction: Identifies the selected nearby lamp with «denne lampa» or «denne lampen».
  - id: selected-neuter-singular
    instruction: Identifies the selected nearby mirror with «dette speilet».
  - id: selected-plural
    instruction: Identifies the selected nearby chairs with «disse stolene».
  - id: rejected-plural-far
    instruction: Identifies the rejected chairs with «de stolene» and a clear far-location phrase, such as «bakerst» or «der borte».
  - id: audience-purpose
    instruction: Functions as a clear note telling the shop assistant what is and is not being bought.
- handle: moving_day_transfer
  op: write
  objective: obj-demonstrative-pronouns-01
  bloom: apply
  derived_from:
  - section_id: transfer-to-a-new-situation
  prompt_md: 'Write a message to Jonas. You are standing with him by the door. The box by you should go to the kitchen, and the box farthest away should go to the bathroom. The picture you are holding should go to the bedroom; the picture at the other end of the room should go to the living room. The books by you should go on the shelf, and the books by Maja, on the other side of the room, should go to the office. Use demonstrative pronouns and definite nouns.'
  min_words: 35
  max_words: 60
  response_language: "no"
  judge_prompt: "Assess only criteria all-six-items, destinations, audience-purpose, demonstrative-agreement, and definite-nouns. A response passes when every listed criterion is met."
  criteria:
  - id: all-six-items
    instruction: Refers clearly to all six rows in the supplied facts list.
  - id: destinations
    instruction: Assigns each item to the destination shown for it.
  - id: audience-purpose
    instruction: Functions as a practical message to Jonas about where the belongings should go.
  - id: demonstrative-agreement
    instruction: Uses «denne/den» for each box, «dette/det» for each picture, and «disse/de» for the books, choosing the close form for items marked «nær deg» and the far form for items marked «lenger borte» or «langt borte».
  - id: definite-nouns
    instruction: Uses the definite forms «esken», «bildet», and «bøkene» after the demonstratives.
