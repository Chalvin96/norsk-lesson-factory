- handle: shop_distance_noticing
  op: choose
  objective: obj-demonstrative-pronouns-01
  bloom: understand
  derived_from:
  - section_id: at-the-second-hand-shop
  prompt_md: 'Choose the interpretation that fits the conversation.'
  stem_md: 'Maja: «Se på denne lampa her.» Jonas: «Hva med den lampa ved vinduet?» Maja: «Jeg liker dette speilet her.» Jonas: «Jeg foretrekker det speilet ved døra.»'
  options:
  - id: same-distance
    text: Both demonstrative sets identify objects at the same distance.
    correct: false
    why: This overlooks the contrast between objects «her» and objects by the window or door.
  - id: close-versus-far
    text: «Denne/dette» identifies the nearby objects; «den/det» identifies the farther-away objects.
    correct: true
    why: The location cues «her», «ved vinduet», and «ved døra» establish the close–far contrast.
  - id: far-versus-close
    text: «Denne/dette» identifies the farther-away objects; «den/det» identifies the nearby objects.
    correct: false
    why: This reverses the single contrast shown by the location cues.
