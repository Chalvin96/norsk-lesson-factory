- handle: complete_reference_building
  op: choose
  objective: obj-demonstrative-pronouns-01
  bloom: apply
  derived_from:
  - section_id: making-both-choices-together
  prompt_md: 'Choose the complete answer.'
  stem_md: 'Maja is standing by a table. Three chairs are on the other side of the room. Jonas: «Hvilke møbler mener du?»'
  options:
  - id: close-table-indefinite-chairs
    text: «Dette bord her og de stoler der borte.»
    correct: false
    why: The distances are represented, but both nouns incorrectly remain indefinite.
  - id: close-table-far-chairs
    text: «Dette bordet her og de stolene der borte.»
    correct: true
    why: The reply combines the close neuter form with the far plural form, and both nouns are definite.
  - id: far-table-close-chairs
    text: «Det bordet her og disse stolene der borte.»
    correct: false
    why: The noun agreement is possible, but both distance choices contradict the location cues.
