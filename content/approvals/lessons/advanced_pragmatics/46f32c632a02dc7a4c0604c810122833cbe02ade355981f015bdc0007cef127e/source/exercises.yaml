- handle: review_confirmed_or_open
  op: choose
  objective: obj-advanced-pragmatics-01
  bloom: analyze
  prompt_md: Velg planen som er bekreftet.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Kinoen er booket i kveld — jeg sendte bekreftelsen i morges.»
    - speaker: Mina
      text_md: «Vi kan kanskje få kinoen i kveld — jeg spør om den er ledig.»
  options:
  - id: neither-confirmed
    text: Neither line is confirmed.
    correct: false
    why: The confirmation message in the first line settles that plan.
  - id: first-confirmed
    text: Only the first line is confirmed.
    correct: true
    why: The morning confirmation makes the first plan settled; the second stays a possibility with a check still to come.
  - id: both-confirmed
    text: Both lines are confirmed.
    correct: false
    why: Kanskje and the pending question keep the second plan unconfirmed.
  derived_from:
  - section_id: confirmed-plan
