- handle: review_jo_meaning
  op: choose
  objective: obj-answering-ja-nei-jo-01
  bloom: understand
  prompt_md: Les samtalen og velg hva den andre personen mener.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ingrid
      text_md: «Har du ikke tid i morgen?»
    - speaker: Peter
      text_md: «Jo, det har jeg.»
  options:
  - id: has-time
    text: Peter has time tomorrow.
    correct: true
    why: Jo rejects the negative assumption and confirms that Peter does have time.
  - id: no-time
    text: Peter does not have time tomorrow.
    correct: false
    why: That is the plain Nei reading; Jo says the opposite of the negative question.
  - id: unsure
    text: Peter is not sure whether he has time tomorrow.
    correct: false
    why: The reply is a clear confirmation, not uncertainty.
  derived_from:
  - section_id: negative-question-meaning-practice
