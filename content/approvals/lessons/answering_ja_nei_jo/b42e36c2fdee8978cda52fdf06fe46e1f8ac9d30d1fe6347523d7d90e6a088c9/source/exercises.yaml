- handle: notice_jo_in_dialogue
  op: choose
  objective: obj-answering-ja-nei-jo-01
  bloom: understand
  prompt_md: Velg det Maja svarer om Sara.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Kommer ikke Sara på filmkvelden?»
    - speaker: Maja
      text_md: «Jo.»
  options:
  - id: already-arrived
    text: Sara is already at the film night.
    correct: false
    why: Jo confirms that Sara is coming, but it does not say she has already arrived.
  - id: coming-later
    text: Sara is coming to the film night.
    correct: true
    why: Jo rejects the negative assumption, so Maja confirms that Sara is coming.
  - id: not-coming
    text: Sara is not coming to the film night.
    correct: false
    why: That would be the answer if Maja had said Nei; Jo means the opposite of the negative question.
  derived_from:
  - section_id: negative-question-meaning-practice
