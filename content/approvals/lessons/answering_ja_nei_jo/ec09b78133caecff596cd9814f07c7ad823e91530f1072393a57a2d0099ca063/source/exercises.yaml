- handle: choose_full_response
  op: choose
  objective: obj-answering-ja-nei-jo-01
  bloom: apply
  prompt_md: You are coming to film night. Choose your answer.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Kommer du ikke på filmkvelden?»
  options:
  - id: nei-mismatch
    text: Nei, jeg kommer.
    correct: false
    why: Nei would confirm that you are not coming — the sentence contradicts it.
  - id: jo-full
    text: Jo, jeg kommer.
    correct: true
    why: Jo rejects the negative assumption and the sentence states the true fact.
  - id: ja-mismatch
    text: Ja, jeg kommer ikke.
    correct: false
    why: Ja does not fit a negative question here, and the sentence contradicts the fact.
  derived_from:
  - section_id: negative-question-full-response-practice
