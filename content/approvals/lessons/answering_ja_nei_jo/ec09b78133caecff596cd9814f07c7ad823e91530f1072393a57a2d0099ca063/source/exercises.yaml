- handle: notice_jo_in_dialogue
  op: choose
  objective: obj-answering-ja-nei-jo-01
  bloom: understand
  prompt_md: What do we learn about Sara?
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Kommer ikke Sara på filmkvelden?»
    - speaker: Maja
      text_md: «Jo, men hun kommer litt senere.»
  options:
  - id: already-arrived
    text: She has already arrived.
    correct: false
    why: Nothing says she is there now — only that she comes later.
  - id: coming-later
    text: She is coming, but later.
    correct: true
    why: Jo rejects the negative assumption — Sara IS coming.
  - id: not-coming
    text: She is not coming.
    correct: false
    why: That would be the answer if Maja had said Nei; Jo means the opposite of the negative question.
  derived_from:
  - section_id: negative-question-meaning-practice
