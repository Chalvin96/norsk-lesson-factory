- handle: review_jo_meaning
  op: choose
  objective: obj-answering-ja-nei-jo-01
  bloom: understand
  prompt_md: At a party, what does the reply mean?
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Friend
      text_md: «Kommer du ikke på festen?»
    - speaker: You
      text_md: «Jo, jeg kommer.»
  options:
  - id: uncertain
    text: Maybe, I am not sure.
    correct: false
    why: The reply gives a clear confirmation, not uncertainty.
  - id: coming
    text: Yes, I am coming; Jo rejects the negative.
    correct: true
    why: Jo rejects the negative question and confirms that you are coming.
  - id: not-coming
    text: No, I am not coming.
    correct: false
    why: This misreads Jo as a plain Nei and contradicts the reply.
  derived_from:
  - section_id: negative-question-meaning-practice
