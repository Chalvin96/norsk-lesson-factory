  prompt_md: "Melding til nabolagsgruppen: Det kan bli opphold → gruppen kan spise ute. Bordene kan være ledige → gruppen reserverer dem. Lokalet er ikke større → gruppen forestiller seg at det er større og at de ikke trenger ekstrabord. Bussen kommer kanskje ikke → gjestene tar taxi. Skriv en melding på 45–85 ord med alle fire opplysningene og «hvis». Skriv om både åpne muligheter og den tenkte situasjonen med naturlig ordstilling."
  response_language: 'no'
  min_words: 45
  max_words: 85
  judge_prompt: 'Evaluate the response only against the listed criteria. A response passes when all criteria
    without the -observation suffix are met. Criteria ending in -observation are diagnostic and never
    cause failure. Anchors: Must pass: "Hei alle! Hvis det blir opphold, kan vi spise ute. Vi reserverer
    bordene hvis de er ledige. Hvis lokalet var større, ville vi ikke trengt ekstrabord. Gjestene tar
    taxi hvis bussen ikke kommer. Vi møtes klokka seks på fredag hjemme hos meg. Si fra om planen passer."
    Must fail: "Hei alle! Vi håper på fint vær og et større lokale. Gi beskjed." It omits the supplied
    condition-result relationships. Must fail while flagging form-accuracy: "Hei alle! Hvis det blir opphold,
    vi kan spise ute. Vi reserverer bordene hvis de er ledige. Hvis lokalet var større, ville vi ikke
    trengt ekstrabord. Gjestene tar taxi hvis bussen kommer ikke. Vi møtes klokka seks på fredag hjemme
    hos meg. Si fra om planen passer." Two clauses use incorrect word order, so form-accuracy is not met.'
  criteria:
  - id: audience-purpose
    instruction: Writes a Norwegian planning message to the neighbourhood group.
  - id: supplied-facts
    instruction: Communicates all four supplied condition-result relationships without contradicting them.
  - id: word-bound
    instruction: Uses 45–85 words.
  - id: hvis-use
    instruction: Uses hvis to connect every supplied condition with its result.
  - id: form-accuracy
    instruction: Uses present forms for open possibilities and past tense with ville for the imagined
      alternative, places ikke before the finite verb in hvis-clauses, and inverts after a leading hvis-clause.
  - id: closing-tone-observation
    instruction: 'Observation only: note whether the message ends with a natural invitation to reply;
      do not fail a message that communicates the plan.'
