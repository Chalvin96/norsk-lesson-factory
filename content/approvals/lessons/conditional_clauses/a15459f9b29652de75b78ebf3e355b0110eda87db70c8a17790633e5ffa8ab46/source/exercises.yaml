- handle: write_real_plan_conditions
  op: write
  objective: obj-conditional-clauses-01
  bloom: apply
  prompt_md: "Maja og Jonas planlegger helga sammen. Melding fra Maja til Jonas: Toget kan komme i tide → vi rekker bussen. Været kan bli bedre → vi går ut. Jonas lager kanskje ikke middag → Maja lager mat. Bussen kommer kanskje ikke → de tar taxi. Skriv en melding på 35–70 ord med alle fire opplysningene og «hvis». Bruk naturlig ordstilling."
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: 'Evaluate the response only against the listed criteria. A response passes when all criteria
    without the -observation suffix are met. Criteria ending in -observation are diagnostic and never
    cause failure. Anchors: Must pass: "Hei Jonas! Hvis toget kommer i tide, rekker vi bussen. Vi går
    ut hvis været blir bedre. Hvis du ikke lager middag, lager jeg mat. De tar taxi hvis bussen ikke kommer.
    Kan du gi meg beskjed i kveld? Vi snakkes!" Must fail: "Hei Jonas! Toget, været, middag og buss kan
    endre planen." It does not express the four supplied condition-result relationships with hvis. Must
    fail while flagging word-order: "Hei Jonas! Hvis toget kommer i tide, vi rekker bussen. Vi går ut
    hvis været blir bedre. Hvis du ikke lager middag, lager jeg mat. De tar taxi hvis bussen ikke kommer.
    Kan du gi meg beskjed i kveld? Vi snakkes!" The first result uses incorrect inversion after a leading
    hvis-clause, so word-order is not met.'
  criteria:
  - id: audience-purpose
    instruction: Writes a Norwegian message to Jonas that communicates the weekend plan.
  - id: supplied-facts
    instruction: Expresses all four supplied condition-result relationships without contradicting them.
  - id: word-bound
    instruction: Uses 35–70 words.
  - id: hvis-use
    instruction: Uses hvis to connect every supplied condition with its result.
  - id: word-order
    instruction: Places ikke before the finite verb in each hvis-clause and uses inversion, with the finite
      verb before the subject, after a leading hvis-clause.
  - id: closing-tone-observation
    instruction: 'Observation only: note whether the message ends with a natural friendly close; do not
      fail a message that communicates the plan.'
  derived_from:
  - section_id: real-condition-uses
