  - id: supplied-facts
    instruction: Communicates all four supplied condition-result relationships without contradicting them.
  - id: word-bound
    instruction: Uses 45–85 words.
  - id: hvis-use
    instruction: Uses hvis to connect every supplied condition with its result.
  - id: form-accuracy
    instruction: Uses present forms for open possibilities and past tense with ville for the imagined
      alternative, places ikke before the finite verb in hvis-clauses, and inverts after a leading hvis-clause.
  - id: closing-tone-observation
    instruction: 'Observation only: note whether the message ends with a natural invitation to reply;
      do not fail a message that communicates the plan.'
