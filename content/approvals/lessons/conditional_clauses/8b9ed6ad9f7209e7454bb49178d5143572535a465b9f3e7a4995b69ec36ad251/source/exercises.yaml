  prompt_md: 'Melding til nabolagsgruppen: Det kan bli opphold → gruppen kan spise ute. Bordene kan være
    ledige → gruppen reserverer dem. Lokalet er ikke større → gruppen forestiller seg at det er større
    og at de ikke trenger ekstrabord. Bussen kommer kanskje ikke → gjestene tar taxi. Write a 45–85-word
    planning message using all four facts and hvis. Use correct form and word order: present forms for
