- handle: short_retrieval_review
  op: write
  objective: obj-complex-passives-01
  bloom: apply
  prompt_md: 'Du svarer hotellsjefen med fire korte statusoppdateringer. Servicenotater: rengjøring av
    alle rom før nye gjester kommer; aktivering av ett nøkkelkort før innsjekking; heisreparasjon i går;
    utvidelse av frokostrommet i dag, med mer plass nå. Bruk en passivform i hver av de fire oppdateringene.
    Skriv 22–75 ord.'
  explanation_md: A complete reply distinguishes a routine, a modal requirement, a dated past event and
    a completed event with a present result, and it uses a passive form for each of the four updates.
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 22
  max_words: 75
  judge_prompt: 'Evaluate the reply against criteria routine-content, requirement-content, dated-event-content,
    result-content, passive-forms and word-bound. The visible task asks for one passive form in each of
    the four updates, so accept any natural Norwegian passive. Anchors: PASS: «Alle rom rengjøres før
    nye gjester kommer. Nøkkelkortet må aktiveres før innsjekking. Heisen ble reparert i går. Frokostrommet
    er blitt utvidet i dag, så det er mer plass nå.» FAIL: «Hotellet er klart.» This omits the four supplied
    updates. FAIL: «Vi rengjør alle rom før nye gjester kommer. Aktiver nøkkelkortet før innsjekking.
    En tekniker reparerte heisen i går. Vi utvidet frokostrommet i dag, så det er mer plass nå.» This
    uses active forms instead of the required passives and therefore fails passive-forms.'
  criteria:
  - id: routine-content
    instruction: States that every room is cleaned before new guests arrive.
  - id: requirement-content
    instruction: States that one key card must be activated before check-in.
  - id: dated-event-content
    instruction: States that the lift was repaired yesterday.
  - id: result-content
    instruction: States that the breakfast room was expanded today and has more space now.
  - id: passive-forms
    instruction: 'Gating requirement: every one of the four updates uses a passive form. Accept any natural
      Norwegian passive construction, such as an s-passive (rengjøres), a modal passive (må aktiveres),
      ble plus a past participle (ble reparert), or har blitt or er blitt plus a past participle (har
      blitt utvidet, er blitt utvidet). A reply that uses only active verbs such as rengjør, aktiver,
      reparerte or utvidet fails this criterion.'
  - id: word-bound
    instruction: Contains 22–75 words.
