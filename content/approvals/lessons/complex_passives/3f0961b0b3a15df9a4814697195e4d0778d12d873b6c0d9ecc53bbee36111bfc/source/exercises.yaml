- handle: short_retrieval_review
  op: write
  objective: obj-complex-passives-01
  bloom: apply
  prompt_md: "Du svarer hotellsjefen med fire korte statusoppdateringer. Servicenotater: rengjøring av alle rom før nye gjester kommer; aktivering av ett nøkkelkort før innsjekking; heisreparasjon i går; utvidelse av frokostrommet i dag, med mer plass nå. Bruk s-passiv for rutinen, modalverb + s-passiv for kravet, ble + partisipp for hendelsen i går og har blitt + partisipp for den fullførte utvidelsen."
  explanation_md: >-
    Notatene krever s-passiv i presens om rutinen, modalverb + s-passiv om kravet, «ble» + partisipp
    om gårsdagens hendelse og «har blitt» + partisipp om den fullførte utvidelsen som har betydning
    nå.
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 22
  max_words: 75
  judge_prompt: "Evaluate routine-content, requirement-content, dated-event-content, result-content, requested-forms. Require an s-passive for the routine, a modal followed by an s-passive for the requirement, ble plus a participle for yesterday, and har blitt plus a participle for the completed expansion. Accept natural changes in wording, word order, and reference to the hotel or its staff when the requested construction and meaning remain clear. Do not impose wording or details beyond the visible task. PASS: «Alle rom rengjøres før nye gjester kommer. Nøkkelkortet må aktiveres før innsjekking. Heisen ble reparert i går. Frokostrommet har blitt utvidet i dag, så det er mer plass nå.» FAIL: «Hotellet er klart.» It omits the four updates. FAIL: «Vi rengjør alle rom før nye gjester kommer. Nøkkelkortet må aktiveres før innsjekking. Heisen ble reparert i går. Frokostrommet ble utvidet i dag, så det er mer plass nå.» The routine is active and the result update lacks the requested present-perfect passive."
  criteria:
  - id: routine-content
    instruction: States that every room is cleaned before new guests arrive.
  - id: requirement-content
    instruction: States that one key card must be activated before check-in.
  - id: dated-event-content
    instruction: States that the lift was repaired yesterday.
  - id: result-content
    instruction: States that the breakfast room was expanded today and has more space now.
  - id: requested-forms
    instruction: 'Gating requirement: use an s-passive for the routine, modal plus s-passive for the
      requirement, ble plus a participle for yesterday, and har blitt plus a participle for the completed
      event with a present result. Accept natural lexical and syntactic variants that preserve those
      requested constructions; do not require exact sample wording.'
