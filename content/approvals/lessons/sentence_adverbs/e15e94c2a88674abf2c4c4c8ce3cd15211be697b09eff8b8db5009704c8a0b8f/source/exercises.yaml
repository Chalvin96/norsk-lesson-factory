  bloom: apply
  prompt_md: "Send fire korte meldinger om middagsplanene til Nora, Jonas og Emil. Bruk «ikke», «aldri», «vanligvis» og «kanskje» én gang hver. Skriv til Nora om Emil kanskje kommer etter jobb. Forklar hvorfor Emil ikke kan komme med en fordi-setning. Fortell Jonas at Nora aldri spiser etter klokka ni. Spør om Jonas vanligvis vil spise på restauranten med en om-setning."
  derived_from:
  - section_id: cumulative-transfer-planning-a-weekday-dinner
  response_language: 'no'
  min_words: 20
  max_words: 60
  judge_prompt: Check the four requested messages and report evidence for every criterion. Mark a criterion
    unmet when the required meaning, clause type, or adverb placement is not observable.
  criteria:
  - id: four-messages
    instruction: Provides four complete natural Norwegian messages matching the four requested dinner
      meanings, not isolated fragments.
  - id: target-adverbs
    instruction: Uses ikke, aldri, vanligvis, and kanskje exactly once each.
  - id: adverb-placement
    instruction: "Places «kanskje» and «aldri» correctly for each clause type in the clauses about Emil's arrival and Nora's eating: after the finite verb in an ordinary main clause, before it in a subordinate clause."
  - id: subordinate-placement
    instruction: Places the adverb before the finite verb in the fordi subordinate clause in message 2
      and the om subordinate clause in message 4.
- handle: final_retrieval
  op: write
  objective: obj-sentence-adverbs-01
  bloom: apply
  prompt_md: "Skriv fire korte setninger på norsk om en endret plan. Bruk minst tre av «ikke», «aldri», «vanligvis» og «kanskje». 1) Skriv en vanlig helsetning med et av adverbene. 2) Skriv en helsetning med en leddsetning med «at», «fordi», «hvis» eller «om», og plasser et av adverbene i leddsetningen. Ikke sett leddsetningen først. 3) Skriv to helsetninger bundet sammen, med et adverb i hver. 4) Begynn med en leddsetning som inneholder et adverb, og bruk et adverb til i helsetningen etterpå. I den siste setningen skal subjektet i helsetningen være et trykksvakt pronomen."
  derived_from:
  - section_id: final-retrieval-request
  response_language: 'no'
  min_words: 20
  max_words: 70
  judge_prompt: Check exactly four sentences against the task and report evidence for every criterion.
    Mark a criterion unmet when the required clause structure or sentence-adverb placement is missing
    or ambiguous.
  criteria:
  - id: ordinary-main
    instruction: Sentence 1 is an ordinary subject-first main clause with the target adverb after the
      finite verb.
  - id: unfronted-subordinate
    instruction: Sentence 2 contains an unfronted subordinate clause introduced by an approved connector
      with the target adverb before its finite verb.
  - id: compound-main-clauses
    instruction: Sentence 3 has two coordinated main clauses and places a target adverb after the finite
      verb in each clause.
  - id: fronted-subordinate-and-main
    instruction: Sentence 4 has a fronted subordinate clause with its adverb before the finite verb and
      a following main clause with the sequence finite verb, unstressed pronoun subject, and adverb.
  - id: retrieval-variety
    instruction: Uses at least three distinct target adverbs in a coherent update about a changed plan. Accept learner-created details or details from lesson examples when the required structures are correct.
