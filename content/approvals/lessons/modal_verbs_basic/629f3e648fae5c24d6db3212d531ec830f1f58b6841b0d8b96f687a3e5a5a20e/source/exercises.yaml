  bloom: analyze
  prompt_md: 'Velg alternativet som passer til de fire opplysningene om Jonas, i riktig rekkefølge.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Eli
      text_md: «Er Jonas nødt til å dekke bordet før gjestene kommer?»
    - speaker: Nora
      text_md: «Ja, det er nødvendig.»
    - speaker: Eli
      text_md: «Er det avtalt at han handler i kveld?»
    - speaker: Nora
      text_md: «Ja, det er avtalt.»
    - speaker: Eli
      text_md: «Har han lært seg å bake brød?»
    - speaker: Nora
      text_md: «Ja, han har lært det.»
    - speaker: Eli
      text_md: «Har han lyst til å lage suppe?»
    - speaker: Nora
      text_md: «Ja, det har han lyst til.»
  derived_from:
  - section_id: sec-choice-changes-the-message
  stem_md: 'Velg alternativet med riktig betydning og form i alle setningene.'
  options:
  - id: marker-added
    text: Jonas må å dekke bordet. Jonas skal å handle i kveld. Jonas kan å bake brød. Jonas vil å lage suppe.
    correct: false
    why: The meanings match, but å is incorrectly placed after every modal.
  - id: meanings-reversed
    text: Jonas skal dekke bordet. Jonas må handle i kveld. Jonas vil bake brød. Jonas kan lage suppe.
    correct: false
    why: The sentences use bare infinitives, but the modal meanings are in the wrong order.
  - id: all-four-correct
    text: Jonas må dekke bordet. Jonas skal handle i kveld. Jonas kan bake brød. Jonas vil lage suppe.
    correct: true
    why: The modals express necessity, an arranged plan, ability, and desire in the order given.
