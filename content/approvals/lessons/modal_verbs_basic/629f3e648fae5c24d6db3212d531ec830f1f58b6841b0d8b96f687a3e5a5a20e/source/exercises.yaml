- handle: retrieve_four_modal_patterns
  op: write
  objective: obj-modal-verbs-basic-01
  bloom: apply
  prompt_md: 'Skriv at du ønsker å fotografere på turen. Bruk et modalverb med infinitiv uten å.'
  response_language: 'no'
  min_words: 3
  max_words: 12
  judge_prompt: "Evaluate preference, modal-choice, bare-infinitive as gating criteria. The response must be one short Norwegian sentence that states the speaker wants to take photographs on the walk, using «vil» directly followed by a bare infinitive. Accept natural alternatives such as «Jeg vil fotografere», «Jeg vil fotografere fuglene», and «Jeg vil ta bilder av fuglene». Anchor that must pass: «Jeg vil ta bilder av fuglene.»"
  criteria:
  - id: preference
    instruction: States that the speaker wants or prefers to take photographs during the walk, rather than merely being able, required, or scheduled to do so.
  - id: modal-choice
    instruction: Uses «vil» to express this personal desire; accept natural variations in wording and the activity phrase.
  - id: bare-infinitive
    instruction: Places the bare infinitive directly after «vil», with no «å» between them.
  - id: one-sentence
    instruction: Writes one simple Norwegian sentence.
  derived_from:
  - section_id: sec-short-retrieval-review
