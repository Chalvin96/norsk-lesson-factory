- handle: contrast_vil_and_ma
  op: choose
  objective: obj-modal-verbs-basic-01
  bloom: understand
  prompt_md: Choose the pair that matches the two dialogues in order.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Jeg har lyst til å gå hjem, men jeg trenger ikke.»
    - speaker: Amir
      text_md: «Så du blir litt til?»
    - speaker: Nora
      text_md: «Ja, gjerne.»
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Jeg er nødt til å gå hjem nå.»
    - speaker: Amir
      text_md: «Hvorfor det?»
    - speaker: Nora
      text_md: «Den siste bussen går snart.»
  derived_from:
  - section_id: sec-ma-necessity
  stem_md: Choose the pair in the same order.
  options:
  - id: ma-then-vil
    text: Nora må gå hjem. Nora vil gå hjem.
    correct: false
    why: This reverses the intended meanings of the two situations.
  - id: vil-then-ma
    text: Nora vil gå hjem. Nora må gå hjem.
    correct: true
    why: The first sentence expresses desire, while the second expresses necessity.
