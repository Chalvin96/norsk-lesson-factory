- handle: select_modal_from_context
  op: choose
  objective: obj-modal-verbs-basic-01
  bloom: analyze
  prompt_md: Choose the set that matches the four things said about Jonas, in order.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Eli
      text_md: «Er Jonas flink til å lage mat?»
    - speaker: Nora
      text_md: «Ja, det er han.»
    - speaker: Eli
      text_md: «Har han lyst til å lage middag i dag?»
    - speaker: Nora
      text_md: «Ja, det har han.»
    - speaker: Eli
      text_md: «Er han nødt til å lage middag?»
    - speaker: Nora
      text_md: «Ja, gjestene kommer klokka seks.»
    - speaker: Eli
      text_md: «Er det avtalt?»
    - speaker: Nora
      text_md: «Ja, det er avtalt.»
  derived_from:
  - section_id: sec-choice-changes-the-message
  stem_md: Select the set with the intended meaning and form in every sentence.
  options:
  - id: marker-added
    text: Jonas kan å lage middag. Jonas vil å lage middag. Jonas må å lage middag. Jonas skal å lage
      middag.
    correct: false
    why: The meanings match, but å is incorrectly placed after every modal.
  - id: meanings-reversed
    text: Jonas vil lage middag. Jonas kan lage middag. Jonas skal lage middag. Jonas må lage middag.
    correct: false
    why: The sentences use bare infinitives, but the modal meanings are in the wrong order.
  - id: all-four-correct
    text: Jonas kan lage middag. Jonas vil lage middag. Jonas må lage middag. Jonas skal lage middag.
    correct: true
    why: The modals express ability, desire, necessity, and an arranged plan in order.
