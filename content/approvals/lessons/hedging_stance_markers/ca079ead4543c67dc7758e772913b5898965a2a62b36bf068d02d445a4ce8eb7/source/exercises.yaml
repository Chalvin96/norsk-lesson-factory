  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: 'Check the response against criteria facts-covered, useful-connected-update, audience-purpose,
    and word-bound; report diagnostic verdicts for all ids ending in -observation without using them in
    the all-met pass rule. Valid variant that must pass: a coherent update covering all supplied facts
    and helping the colleague plan, regardless of exact marker choices. Near-miss that must fail: a list
    that omits Nora’s report and gives no usable morning plan. Good-message-with-form-error that must
