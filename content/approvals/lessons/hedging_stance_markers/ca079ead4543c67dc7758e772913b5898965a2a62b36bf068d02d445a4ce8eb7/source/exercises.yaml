  objective: obj-hedging-stance-markers-01
  bloom: apply
  prompt_md: 'Facts for Henrik’s colleague: the outdoor stage may remain closed; puddles cover its electrical
    connections; volunteer Nora says the replacement equipment arrives at noon; Henrik and the colleague
    already agreed to test it before opening; the expected audience is about 180. Write a natural 80–110-word
