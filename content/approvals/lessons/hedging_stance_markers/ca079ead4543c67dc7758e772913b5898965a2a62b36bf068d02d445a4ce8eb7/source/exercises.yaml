    instruction: Presents both outcomes as open possibilities and uses kanskje for each one.
  - id: both-updates
    instruction: Covers the weather and bus updates without presenting either outcome as established.
  - id: audience-purpose
    instruction: Functions as an update to Maja about the concert preparations.
  - id: word-bound
    instruction: Contains 35–50 words.
- handle: possibility_or_inference_recognition
  op: choose
  objective: obj-hedging-stance-markers-01
  bloom: understand
  stem_md: 'Weather service: «Regn er én mulighet, men prognosen er usikker.»'
  prompt_md: Choose the response that preserves the open uncertainty.
  options:
  - id: maybe-rain
    text: Det regner kanskje på lørdag.
    correct: true
    why: Kanskje leaves rain as one unresolved possibility.
  - id: likely-rain
    text: Det regner nok på lørdag.
    correct: false
    why: Nok presents rain as the speaker’s likely conclusion, which is stronger than the note supports.
  - id: reported-rain
    text: Det regner visst på lørdag.
    correct: false
    why: Visst presents the claim as indirectly reported rather than merely possible.
  explanation_md: Kanskje marks an open possibility, whereas nok presents one outcome as likely.
- handle: possibility_or_inference_supported
  op: choose
  objective: obj-hedging-stance-markers-01
  bloom: apply
  stem_md: The forecast shows heavy rain, and dark clouds are already gathering above the outdoor stage.
  prompt_md: Choose the most natural conclusion.
  options:
  - id: likely-cancel
    text: Konserten blir nok flyttet inn.
    correct: true
    why: Nok fits a likely conclusion drawn from the forecast and visible clouds.
  - id: open-cancel
    text: Konserten blir kanskje flyttet inn.
    correct: false
    why: Kanskje is possible, but it does not express the evidence-based likely assessment highlighted
      by the context.
  - id: reported-cancel
    text: Konserten blir visst flyttet inn.
    correct: false
    why: Visst would require an indirect report rather than observable evidence.
  explanation_md: Observable evidence supports an inference with nok.
