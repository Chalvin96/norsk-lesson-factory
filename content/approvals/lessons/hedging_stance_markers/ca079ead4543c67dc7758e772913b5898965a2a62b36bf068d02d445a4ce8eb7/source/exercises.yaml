- handle: reconstructing_the_planning_conversation
  op: write
  objective: obj-hedging-stance-markers-01
  bloom: apply
  prompt_md: 'Facts: the delivery van may be unavailable; volunteer Nora says the sound equipment is delayed;
    the car park is full; the walk from the car park is about ten minutes; Maja and Henrik already agreed
    to open the gates early. Write a natural 70–100-word exchange in Norwegian in which Maja and Henrik
    decide how to handle transport and setup.'
  derived_from:
  - section_id: back-at-the-cultural-centre
  response_language: 'no'
  judge_prompt: 'Check the response against criteria supplied-facts, connected-decision, audience-purpose,
    and word-bound; report diagnostic verdicts for all ids ending in -observation without using them in
    the all-met pass rule. Valid variant that must pass: a connected exchange that covers every fact and
    reaches a workable decision even if it uses different natural wording. Near-miss that must fail: unrelated
    example sentences that do not decide how to handle transport and setup. Good-message-with-form-error
    that must pass with observations flagged: a coherent decision-making exchange that covers every fact
    but confuses visst and nok.'
  criteria:
  - id: supplied-facts
    instruction: Includes the possibly unavailable van, Nora’s report, the full car park, the approximate
      ten-minute walk, and the earlier agreement about opening the gates.
  - id: connected-decision
    instruction: Forms one connected exchange that reaches a decision about transport and setup.
  - id: audience-purpose
    instruction: Uses dialogue appropriate to Maja and Henrik planning together.
  - id: word-bound
    instruction: Contains 70–100 words.
  - id: possibility-marker-observation
    instruction: Observe whether an open possibility is naturally marked, but do not fail the response
      on this criterion.
  - id: inference-marker-observation
    instruction: Observe whether the full car park supports a likely inference with nok, but do not fail
      the response on this criterion.
  - id: reported-source-marker-observation
    instruction: Observe whether Nora’s report is distinguished with visst or visstnok, but do not fail
      the response on this criterion.
  - id: shared-knowledge-marker-observation
    instruction: Observe whether the earlier agreement is invoked with jo, but do not fail the response
      on this criterion.
  - id: opinion-marker-observation
    instruction: Observe whether a personal view is framed with a taught opinion marker, but do not fail
      the response on this criterion.
  - id: approximation-marker-observation
    instruction: Observe whether the walking time is marked as approximate, but do not fail the response
      on this criterion.
