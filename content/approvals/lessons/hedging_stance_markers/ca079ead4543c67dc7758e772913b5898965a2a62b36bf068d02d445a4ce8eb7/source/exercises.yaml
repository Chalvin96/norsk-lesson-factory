    instruction: Connects the facts into an update that helps the colleague plan the morning.
  - id: audience-purpose
    instruction: Functions as an update from Henrik to a colleague.
  - id: word-bound
    instruction: Contains 80–110 words.
  - id: possibility-marker-observation
    instruction: Observe whether the uncertain stage opening is marked with kanskje, but do not fail the
      response on this criterion.
  - id: inference-marker-observation
    instruction: Observe whether the puddles support an inference with nok, but do not fail the response
      on this criterion.
  - id: reported-source-marker-observation
    instruction: Observe whether Nora’s report is marked with visst or visstnok, but do not fail the response
      on this criterion.
  - id: shared-knowledge-marker-observation
    instruction: Observe whether the testing agreement is invoked with jo, but do not fail the response
      on this criterion.
  - id: tentative-agreement-marker-observation
    instruction: Observe whether any tentative request for confirmation uses vel naturally, but do not
      fail the response on this criterion.
  - id: opinion-marker-observation
    instruction: Observe whether a personal judgment uses a taught opinion frame, but do not fail the
      response on this criterion.
  - id: approximation-marker-observation
    instruction: Observe whether the audience figure is appropriately approximate, but do not fail the
      response on this criterion.
