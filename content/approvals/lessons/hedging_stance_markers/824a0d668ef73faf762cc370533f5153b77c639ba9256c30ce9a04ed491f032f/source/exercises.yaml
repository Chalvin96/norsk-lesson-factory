      agreement, and the approximate audience.
  - id: useful-connected-update
    instruction: Connects the facts and inference into an update that helps the colleague plan the morning.
  - id: evidence-based-inference
    instruction: Draws a cautious inference from the puddles covering the electrical connections, such as that the connections may need inspection or drying before use; does not present this as a confirmed fact. Exact marker words are not required.
  - id: evidence-stance
    instruction: Attributes Nora’s noon report to Nora and distinguishes it from uncertain conditions
      and inferences; exact marker words are not required when source and certainty are clear.
  - id: shared-agreement
    instruction: Refers to the testing agreement as something the writer and colleague already settled.
  - id: tentative-confirmation
    instruction: Asks the colleague to confirm a tentative assumption about the morning plan, using
      natural wording; a suitable vel question is one option.
  - id: personal-view
    instruction: Gives the writer’s view of the best morning plan with natural opinion wording.
  - id: audience-purpose
    instruction: Functions as an update from Henrik to a colleague.
  - id: word-bound
    instruction: Contains 80–110 words.
  - id: possibility-marker-observation
    instruction: Observe whether the uncertain stage opening is marked with kanskje, but do not fail on
      this criterion.
  - id: inference-marker-observation
    instruction: Observe whether the puddles support an inference with nok, but do not fail on this criterion.
  - id: reported-source-marker-observation
    instruction: Observe whether Nora’s report is marked with visst or visstnok, but do not fail on this
      criterion.
  - id: shared-knowledge-marker-observation
    instruction: Observe whether the testing agreement is invoked with jo, but do not fail on this criterion.
  - id: tentative-agreement-marker-observation
    instruction: Observe whether any tentative request for confirmation uses vel naturally, but do not
      fail on this criterion.
  - id: opinion-marker-observation
    instruction: Observe whether a personal judgment uses a taught opinion frame, but do not fail on this
      criterion.
  - id: approximation-marker-observation
    instruction: Observe whether the audience figure is appropriately approximate, but do not fail on
      this criterion.
