  - id: tro-support
    text: Komiteen tror kommunen vil støtte arrangementet, fordi bidraget kan betale for en vekter
      som arrangørene ikke har råd til.
    correct: false
    why: Tro expresses uncertainty about a factual outcome, not the committee’s argued position.
  - id: stacked-support
    text: Etter min mening mener komiteen at kommunen bør støtte arrangementet, fordi bidraget kan
      betale for en vekter som arrangørene ikke har råd til.
    correct: false
    why: The two opinion frames are stacked without a separate function, even though the reason is
