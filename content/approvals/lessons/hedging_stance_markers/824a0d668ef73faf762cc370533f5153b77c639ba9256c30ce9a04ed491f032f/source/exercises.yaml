  objective: obj-hedging-stance-markers-01
  bloom: apply
  prompt_md: >-
    Forhold på arrangementsområdet: Utescenen er kanskje fortsatt stengt. Vannpytter dekker de
    elektriske koblingene. Nora sier at nytt utstyr kommer klokka tolv. Henrik og kollegaen har
    avtalt å teste det før åpning. Det ventes rundt 180 publikummere. Skriv en oppdatering på 80–110
    ord som hjelper kollegaen med morgenplanen. Skill Noras beskjed fra det som er usikkert, vis til
