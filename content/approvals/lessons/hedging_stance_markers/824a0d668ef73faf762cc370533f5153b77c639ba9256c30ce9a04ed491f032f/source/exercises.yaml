- handle: reconstructing_the_planning_conversation
  op: write
  objective: obj-hedging-stance-markers-01
  bloom: apply
  prompt_md: >-
    Varebilen er kanskje ikke tilgjengelig. Nora sier at lydutstyret er forsinket. Parkeringsplassen
    er full, og det tar omtrent ti minutter å gå derfra. Maja og Henrik har avtalt å åpne portene
    tidlig. Skriv en samtale på 70–100 ord der de planlegger transport og rigging og blir enige om
    en løsning. Skill Noras
    beskjed fra egne antakelser, vis til avtalen, trekk en sannsynlig slutning om parkeringsplassen
    og ta med et personlig standpunkt.
  derived_from:
  - section_id: back-at-the-cultural-centre
  response_language: 'no'
  judge_prompt: 'Check the response against criteria supplied-facts, connected-decision, evidence-stance,
    car-park-inference, shared-agreement, personal-view, audience-purpose, and word-bound; report diagnostic verdicts for all ids ending in -observation without using them in
    the all-met pass rule. Valid variant that must pass: a connected exchange that covers every fact and
    reaches a workable decision and meets all stated criteria even if it uses different natural wording. Near-miss that must fail: unrelated
    example sentences that do not decide how to handle transport and setup. Accept natural wording without
    exact marker words, but fail a response that presents Nora’s report as mere speculation or a guess
    about the car park as something Nora reported.'
  criteria:
  - id: supplied-facts
    instruction: Includes the possibly unavailable van, Nora’s report, the full car park, the approximate
      ten-minute walk, and the earlier agreement about opening the gates.
  - id: connected-decision
    instruction: Forms one connected exchange that reaches a decision about transport and setup.
  - id: evidence-stance
    instruction: Keeps Nora’s report distinct from open possibilities and inferences; exact marker words
      are not required when the source and certainty are expressed naturally.
  - id: car-park-inference
    instruction: Draws a plausible, clearly inferential conclusion from the full car park about parking
      or transport; accepts natural wording without requiring nok.
  - id: shared-agreement
    instruction: Invokes the earlier gate-opening agreement as something both speakers already know.
  - id: personal-view
    instruction: Gives a participant’s own view of the best transport or setup plan, with natural opinion wording.
  - id: audience-purpose
    instruction: Uses dialogue appropriate to Maja and Henrik planning together.
  - id: word-bound
    instruction: Contains 70–100 words.
  - id: possibility-marker-observation
    instruction: Observe whether an open possibility is naturally marked, but do not fail the response
      on this criterion.
  - id: inference-marker-observation
    instruction: Observe whether the full car park supports a likely inference with nok, but do not fail
      the response on this criterion.
  - id: reported-source-marker-observation
    instruction: Observe whether Nora’s report is distinguished with visst or visstnok, but do not fail
      the response on this criterion.
  - id: shared-knowledge-marker-observation
    instruction: Observe whether the earlier agreement is invoked with jo, but do not fail the response
      on this criterion.
  - id: opinion-marker-observation
    instruction: Observe whether a personal view is framed with a taught opinion marker, but do not fail
      the response on this criterion.
  - id: approximation-marker-observation
    instruction: Observe whether the walking time is marked as approximate, but do not fail the response
      on this criterion.
