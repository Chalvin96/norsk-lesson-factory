  - id: word-bound
    instruction: Contains 35–50 words.
- handle: report_or_inference_recognition
  op: choose
  objective: obj-hedging-stance-markers-01
  bloom: understand
  stem_md: "Melding fra frivillig: «Lydutstyret blir levert etter klokka seks.»"
  prompt_md: "Velg svaret som formidler beskjeden."
  options:
  - id: reported-delay
    text: Lydutstyret kommer visst etter klokka seks.
    correct: true
    why: Visst marks the volunteer’s message as the indirect source.
  - id: possible-delay
    text: Lydutstyret kommer kanskje etter klokka seks.
    correct: false
    why: Kanskje makes the delay an open possibility and loses the reported-source meaning.
  - id: inferred-delay
    text: Lydutstyret kommer nok etter klokka seks.
    correct: false
    why: Nok presents a likely inference rather than information passed on from the volunteer.
  explanation_md: "«Visst» eller «visstnok» passer når opplysningen kommer fra en annen kilde."
- handle: report_or_inference_supported
  op: choose
  objective: obj-hedging-stance-markers-01
  bloom: apply
  stem_md: >-
    Et nettvarsel fra veimyndigheten sier at adkomstveien er stengt. Det er mulig at varselet ikke
    er oppdatert.
  prompt_md: "Velg formuleringen som tydeligst viser at opplysningen kommer fra varselet, uten å fremstille den som helt sikker."
  options:
  - id: reported-closure
    text: Veien er visst stengt.
    correct: true
    why: Visst presents the closure as indirectly reported information from the notice.
  - id: inferred-closure
    text: Veien er nok stengt.
    correct: false
    why: «Nok» markerer først og fremst talerens egen slutning, ikke at opplysningen kommer fra varselet.
  - id: open-closure
    text: Veien er kanskje stengt.
    correct: false
    why: «Kanskje» viser en åpen mulighet, men sier ikke at opplysningen kommer fra varselet.
  explanation_md: "«Visst» gir en opplysning fra en annen kilde videre. «Nok» markerer en egen sannsynlig
    slutning, og «kanskje» en åpen mulighet."
