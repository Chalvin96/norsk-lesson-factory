- handle: open_uncertainty_checkpoint
  op: write
  objective: obj-hedging-stance-markers-01
  bloom: apply
  prompt_md: >-
    Værmelding: «Meteorologene er usikre på om været blir bedre før konserten.» Transportmelding:
    «Det er uavklart om bussen kommer før publikum.» Skriv en oppdatering på 35–50 ord til Maja.
    Presenter begge mulighetene som usikre, og bruk «kanskje» om hver av dem.
  derived_from:
  - section_id: expressing-uncertainty-with-kanskje
  response_language: 'no'
  judge_prompt: Check the response against criteria open-possibilities, both-updates, audience-purpose,
    and word-bound; report a verdict for each criterion and add no gating requirements.
  criteria:
  - id: open-possibilities
    instruction: Presents both outcomes as open possibilities and uses kanskje for each one.
  - id: both-updates
    instruction: Covers the weather and bus updates without presenting either outcome as established.
  - id: audience-purpose
    instruction: Functions as an update to Maja about the concert preparations.
  - id: word-bound
    instruction: Contains 35–50 words.
- handle: possibility_or_inference_recognition
  op: choose
  objective: obj-hedging-stance-markers-01
  bloom: understand
  stem_md: "Værmelding: «Regn er mulig, men varselet er usikkert.»"
  prompt_md: "Velg svaret som lar utfallet stå åpent."
  options:
  - id: maybe-rain
    text: Det regner kanskje på lørdag.
    correct: true
    why: Kanskje leaves rain as one unresolved possibility.
  - id: likely-rain
    text: Det regner nok på lørdag.
    correct: false
    why: Nok presents rain as the speaker’s likely conclusion, which is stronger than the note supports.
  - id: reported-rain
    text: Det regner visst på lørdag.
    correct: false
    why: Visst presents the claim as indirectly reported rather than merely possible.
  explanation_md: "«Kanskje» viser til en åpen mulighet. «Nok» framstiller et utfall som sannsynlig."
- handle: possibility_or_inference_supported
  op: choose
  objective: obj-hedging-stance-markers-01
  bloom: apply
  stem_md: >-
    Værmeldingen varsler kraftig regn, og mørke skyer samler seg. Arrangørene har ikke bestemt seg for om konserten skal flyttes inn.
  prompt_md: >-
    Velg setningen som uttrykker en åpen mulighet om å flytte konserten inn. Arrangørene har ikke
    bestemt seg.
  options:
  - id: possible-move
    text: Konserten blir kanskje flyttet inn.
    correct: true
    why: «Kanskje» lar flytting være en åpen mulighet uten å si at den er sannsynlig.
  - id: likely-move
    text: Konserten blir nok flyttet inn.
    correct: false
    why: Kraftig regn og mørke skyer kan støtte denne sannsynlige slutningen, men «nok» uttrykker ikke en åpen mulighet.
  - id: reported-move
    text: Konserten blir visst flyttet inn.
    correct: false
    why: «Visst» antyder en indirekte beskjed, men ingen slik beskjed er nevnt.
  explanation_md: "«Kanskje» passer til en uavklart plan. «Nok» presenterer en sannsynlig slutning, og
    «visst» antyder en indirekte beskjed."
- handle: possibility_or_inference_checkpoint
  op: write
  objective: obj-hedging-stance-markers-01
