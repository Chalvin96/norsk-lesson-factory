  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: 'Check the response against criteria facts-covered, useful-connected-update, evidence-based-inference,
    evidence-stance, shared-agreement, tentative-confirmation, personal-view, audience-purpose, and word-bound; report diagnostic verdicts for all ids ending in -observation without using them in
    the all-met pass rule. Valid variant that must pass: a coherent update covering all supplied facts
    and helping the colleague plan while meeting all stated criteria, regardless of exact marker choices. Near-miss that must fail: a list
