- handle: presenting_a_view_supported
  op: choose
  objective: obj-hedging-stance-markers-01
  bloom: apply
  stem_md: >-
    Henrik uttaler seg på vegne av komiteen og argumenterer for kommunal støtte. Begrunnelsen er at
    bidraget kan betale for en vekter som arrangørene ikke har råd til.
  prompt_md: "Velg svaret som uttrykker komiteens standpunkt og begrunner det med utgiftene til vakthold."
  options:
  - id: mener-support
    text: Komiteen mener at kommunen bør støtte arrangementet fordi bidraget kan betale for en vekter
      som arrangørene ikke har råd til.
