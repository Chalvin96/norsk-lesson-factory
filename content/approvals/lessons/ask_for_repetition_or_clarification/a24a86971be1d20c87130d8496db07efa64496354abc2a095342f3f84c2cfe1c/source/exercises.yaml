- handle: integrated-practice-repairing-complete-exchange
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: 'A colleague calls from the library, but the connection breaks while the colleague is giving two instructions. Write a short three-line dialogue in Norwegian: Mina asks for the unclear part to be repeated, the colleague repeats it, and Mina confirms the instructions and says what she will do next.'
  min_words: 18
  max_words: 32
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kollega
      text_md: «Lesesalen må låses klokka atten tretti. Legg nøkkelen i den blå boksen ved personalinngangen.»
    - speaker: Situasjon
      text_md: Forbindelsen brytes idet kollegaen forteller hvor nøkkelen skal legges.
  response_language: 'no'
  judge_prompt: Evaluate gating criteria message-repeated, instructions-confirmed, and next-step-stated. Also check that the colleague's repeated detail matches the message. Record request-form-observation diagnostically; its verdict must never cause failure. Accept natural Bokmål variants and minor form errors when the communicative outcome is clear.
  criteria:
  - id: message-repeated
    instruction: Requests that the colleague repeat the unclear instructions or the details that were missed.
  - id: detail-repeated
    instruction: Repeats that the key should be left in the blue box by the staff entrance.
  - id: instructions-confirmed
    instruction: Confirms that the reading room must be locked at 18:30 and the key belongs in the blue box by the staff entrance.
  - id: next-step-stated
    instruction: States a relevant next action, such as locking the reading room and leaving the key in the specified box.
  - id: request-form-observation
    instruction: 'Observation only: note whether the reply uses a conventional repetition or slower-speech request naturally; never gate on this.'
  explanation_md: 'Samtalen brytes før én opplysning blir tydelig. Dialogen bør rette opp misforståelsen, bekrefte beskjedene og fortsette oppgaven.'
  derived_from:
  - section_id: integrated-practice-repairing-complete-exchange
- handle: short-retrieval-review
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Quick review:** Write one natural request in Norwegian for each situation: You missed an entire message; the person is speaking too fast; you do not understand one word; you think one detail may be wrong. Then complete the conversation with the bus driver in the correct order: ask for the departure details again, let the driver repeat platform nine and 5:10 p.m., confirm the details, and continue the conversation.'
  min_words: 45
  max_words: 85
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Forbindelsen blir brutt mens den ansatte forteller om avgangen. Bussen går fra plattform ni klokka 17.10.
  response_language: 'no'
  judge_prompt: "Evaluate whether the response includes an appropriate, distinct Norwegian request for each of the four listed situations and completes the bus-call repair sequence. Accept natural Bokmål variants; do not require fixed phrases. For the call, require three turns in order: a request for the missed departure, the employee's repetition of platform nine and 17.10, then an acknowledgment and relevant continuation."
  criteria:
  - id: four-repair-requests
    instruction: Provides an appropriate Norwegian request for a missed message, speech that is too fast, an unfamiliar word, and a possibly incorrect detail.
  - id: call-repair-sequence
    instruction: In the bus call, first requests the missed departure information, then includes the employee repeating platform nine and 17.10, and finally acknowledges those details.
  - id: call-continued
    instruction: Continues or closes the bus call naturally after acknowledging the information.
  explanation_md: 'Den nye situasjonen lar deg bruke hele oppklaringssekvensen.'
  derived_from:
  - section_id: short-retrieval-review
