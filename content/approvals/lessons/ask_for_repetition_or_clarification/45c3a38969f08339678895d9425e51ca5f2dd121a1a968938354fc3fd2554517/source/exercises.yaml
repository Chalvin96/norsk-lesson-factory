- handle: recognizing-hearing-problem
  op: choose
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: understand
  prompt_md: Choose the reply that fits the situation.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Kaffekverna bråker slik at Mina ikke hører resten av beskjeden.
    - speaker: Jonas
      text_md: «Mina, kan du …»
  options:
  - id: ask-for-word-meaning
    text: «Unnskyld, hva betyr “kan”?»
    correct: false
    why: This treats one word as unfamiliar, but the noise hid the whole message.
  - id: check-a-detail
    text: «Mener du bord fire?»
    correct: false
    why: This proposes a detail that Mina never heard.
  - id: ask-for-repetition
    text: «Unnskyld, kan du gjenta?»
    correct: true
    why: The whole message was lost in the noise, so Mina needs to hear it again.
  explanation_md: Ask for repetition when noise hides the whole message.
  derived_from:
  - section_id: recognizing-hearing-problem
- handle: choosing-help-that-matches-the-problem
  op: choose
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: understand
  prompt_md: Choose the reply that fits the situation.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Jonas har gjentatt beskjeden to ganger, men snakker like fort hver gang; han gjentar alltid
        ordene i samme høye tempo.
    - speaker: Jonas
      text_md: «Kunden vil ha to kaffe, ett glass vann og en bolle.»
  options:
  - id: ask-about-meaning
    text: «Hva mener du, egentlig?»
    correct: false
    why: This asks about intended meaning, although the words are clear and only their speed is the obstacle.
  - id: request-repetition
    text: «Kan du gjenta beskjeden?»
    correct: false
    why: Jonas has already repeated the whole message twice at the same fast tempo, and he always repeats
      at that tempo, so another repetition would still arrive too quickly.
  - id: request-slower-speech
    text: «Kan du snakke saktere?»
    correct: true
    why: Jonas always repeats the message at the same fast tempo, so Mina needs the same words delivered
      more slowly.
  explanation_md: Ask for slower speech when the words arrive too quickly, even when the message has already
    been repeated.
  derived_from:
  - section_id: choosing-help-that-matches-the-problem
- handle: clarification-word-or-meaning
  op: choose
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: understand
  prompt_md: Mina understands the rest of the sentence but not the word «ledig». Choose the reply that
    asks specifically what that word means.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Mina forstår «dette bordet er», men ikke ordet «ledig».
    - speaker: Jonas
      text_md: «Dette bordet er ledig.»
  options:
  - id: ask-speaker-intention
    text: «Hva mener du?»
    correct: false
    why: This asks about Jonas's overall intention instead of the single word Mina has not learned.
  - id: ask-for-slower-speech
    text: «Kan du snakke litt saktere?»
    correct: false
    why: Slower speech would repeat the same unfamiliar word without explaining it.
  - id: ask-word-meaning
    text: «Hva betyr “ledig”?»
    correct: true
    why: This isolates the unfamiliar word and asks for its meaning.
  explanation_md: Use «Hva betyr …?» for an unfamiliar word and «Hva mener du?» for unclear intent.
  derived_from:
  - section_id: ask-about-the-unclear-part
- handle: isolating-an-unfamiliar-word
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Til Jonas på jobb** Jonas sier: «Legg kvitteringen ved kassen.» Write Mina''s question
    asking what *kvitteringen* means, and her confirming reply that states what a receipt shows the customer
    paid, in 8–18 Norwegian words.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Legg kvitteringen ved kassen.»
    - speaker: Jonas
      text_md: «En kvittering viser hva kunden har betalt.»
  response_language: 'no'
  judge_prompt: Evaluate gating criteria focused-question and meaning-confirmed. Record understanding-observation
    diagnostically; its verdict must never cause failure. Accept natural Bokmål variants and minor language
    errors that preserve the message.
  criteria:
  - id: focused-question
    instruction: Asks Jonas what «kvitteringen» means.
  - id: meaning-confirmed
    instruction: Acknowledges that a receipt shows what the customer paid.
  - id: understanding-observation
    instruction: 'Observation only: note whether Mina signals that she now understands; never gate on
      this.'
  explanation_md: A focused word question followed by a confirmation closes the repair.
  derived_from:
  - section_id: isolating-an-unfamiliar-word
- handle: confirming-place-time-or-object
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Melding til Aksel** Aksel sier: «Vi møtes utenfor.» Write Nora''s question checking whether
    he means outside the library, and her final reply after he answers «Nei, utenfor kinoen.», in 8–18
    Norwegian words.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Aksel
      text_md: «Vi møtes utenfor.»
    - speaker: Aksel
      text_md: «Nei, utenfor kinoen.»
  response_language: 'no'
  judge_prompt: Evaluate gating criteria detail-checked and correction-registered. Record meeting-continued-observation
    diagnostically; its verdict must never cause failure. Accept natural Bokmål variants and minor language
    errors that preserve the message.
  criteria:
  - id: detail-checked
    instruction: Asks whether Aksel means outside the library.
  - id: correction-registered
    instruction: Repeats or clearly acknowledges «utenfor kinoen».
  - id: meeting-continued-observation
    instruction: 'Observation only: note whether the reply ends with a relevant continuation of the meeting
      arrangement; never gate on this.'
  explanation_md: A detail check proposes an interpretation; repeating the correction shows what was understood.
  derived_from:
  - section_id: confirming-place-time-or-object
- handle: completing-repair-cycle
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Til Jonas på kafeen** Jonas sier: «Ta to kopper kaffe til bord fire.» Write Mina''s request
    to have the whole order repeated, her confirmation of it, and her next step, in 12–24 Norwegian words.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Kaffekverna overdøver hele bestillingen fra Jonas.
    - speaker: Jonas
      text_md: «Ta to kopper kaffe til bord fire.»
  response_language: 'no'
  judge_prompt: Evaluate criteria repetition-requested, order-confirmed, and cafe-task-continued. Every
    criterion mirrors the visible task. Accept natural Bokmål variants and minor language errors that
    preserve the repair sequence.
  criteria:
  - id: repetition-requested
    instruction: Requests repetition because the whole order was missed.
  - id: order-confirmed
    instruction: Confirms two cups of coffee for table four.
  - id: cafe-task-continued
    instruction: States a relevant next action at the café.
  explanation_md: A complete repair requests help, confirms the recovered information, and resumes the
    task.
  derived_from:
  - section_id: completing-repair-cycle
- handle: revise-repair-message
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Mina’s draft reply to Jonas** Rewrite Mina’s reply in 4–10 Norwegian words so Jonas can
    verify the corrected table. State the corrected table as the Norwegian word «fem», not a digit.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Bestillingen skal til bord 5.»
    - speaker: Mina
      text_md: «Greit, bord 6.»
    - speaker: Jonas
      text_md: «Nei, jeg mener bord 5.»
  response_language: 'no'
  judge_prompt: Evaluate gating criterion table-five-explicit, stated as a Norwegian word rather than
    a digit. Record reply-closed-observation diagnostically; its verdict must never cause failure. Accept
    concise natural Bokmål variants.
  criteria:
  - id: table-five-explicit
    instruction: Makes table five explicit in Mina’s revised reply, using the Norwegian word «fem» rather
      than a digit.
  - id: reply-closed-observation
    instruction: 'Observation only: note whether the reply also signals acceptance or readiness to continue;
      never gate on this.'
  explanation_md: Repeating the corrected detail gives the speaker evidence that the repair worked.
  derived_from:
  - section_id: failing-to-register-a-correction
- handle: integrated-practice-repairing-complete-exchange
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Melding fra en kollega på kafeen** The colleague says too quickly: «Kunden ved døra vil
    betale med kort, og etterpå kan du rydde bord seks.» Write Mina''s request for slower speech, her
    confirmation of the tasks, and her next step, in 18–32 Norwegian words.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kollega
      text_md: «Kunden ved døra vil betale med kort, og etterpå kan du rydde bord seks.»
    - speaker: Kollega
      text_md: «Kunden ved døra vil betale med kort. Etterpå kan du rydde bord seks.»
  response_language: 'no'
  judge_prompt: Evaluate gating criteria speed-problem-repaired, tasks-confirmed, and work-continued.
    Record slower-speech-form-observation diagnostically; its verdict must never cause failure. Accept
    natural Bokmål variants and minor form errors when the communicative outcome is clear.
  criteria:
  - id: speed-problem-repaired
    instruction: Makes a suitable request for slower speech.
  - id: tasks-confirmed
    instruction: Confirms paying by card for the customer by the door and clearing table six afterwards.
  - id: work-continued
    instruction: States a relevant next action.
  - id: slower-speech-form-observation
    instruction: 'Observation only: note whether Mina uses a conventional slower-speech request accurately;
      never gate on this.'
  explanation_md: The situation invites a slower-speech request, but successful communication is the gating
    outcome.
  derived_from:
  - section_id: integrated-practice-repairing-complete-exchange
