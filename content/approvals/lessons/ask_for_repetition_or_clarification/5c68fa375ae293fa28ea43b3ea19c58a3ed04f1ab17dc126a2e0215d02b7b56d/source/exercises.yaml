  - id: focused-question
    instruction: Asks Jonas what «kvitteringen» means.
  - id: meaning-confirmed
    instruction: Acknowledges that a receipt shows what the customer paid.
  - id: understanding-observation
    instruction: 'Observation only: note whether Mina signals that she now understands; never gate on this.'
  explanation_md: 'Et presist spørsmål om ordet, fulgt av en bekreftelse, avslutter oppklaringen.'
  derived_from:
