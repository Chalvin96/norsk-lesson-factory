      text_md: «En kvittering viser hva kunden har betalt.»
  response_language: 'no'
  judge_prompt: Evaluate gating criteria focused-question and meaning-confirmed. Record understanding-observation diagnostically; its verdict must never cause failure. Accept natural Bokmål variants and minor language errors that preserve the message.
