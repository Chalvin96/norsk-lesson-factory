- handle: recognizing-hearing-problem
  op: choose
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: understand
  prompt_md: Velg svaret som passer i situasjonen.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Kaffekverna bråker slik at Mina ikke hører resten av beskjeden.
    - speaker: Jonas
      text_md: «Mina, kan du …»
  options:
  - id: ask-for-word-meaning
    text: «Unnskyld, hva betyr “kan”?»
    correct: false
    why: This treats one word as unfamiliar, but the noise hid the whole message.
  - id: check-a-detail
    text: «Mener du bord fire?»
    correct: false
    why: This proposes a detail that Mina never heard.
  - id: ask-for-repetition
    text: «Unnskyld, kan du gjenta?»
    correct: true
    why: The whole message was lost in the noise, so Mina needs to hear it again.
  explanation_md: 'Be om å få beskjeden gjentatt når støy gjør at du ikke hører den.'
  derived_from:
  - section_id: recognizing-hearing-problem
- handle: choosing-help-that-matches-the-problem
  op: choose
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: understand
  prompt_md: "Velg svaret som best løser Minas problem."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Mina synes det er vanskelig å forstå Jonas fordi han snakker fort.
    - speaker: Mina
      text_md: «Kan du gjenta beskjeden?»
    - speaker: Jonas
      text_md: «Kunden vil ha to kaffe, ett glass vann og en bolle.»
    - speaker: Context
      text_md: Jonas gjentar like fort som første gang.
  options:
  - id: ask-about-meaning
    text: «Hva mener du, egentlig?»
    correct: false
    why: This asks about intended meaning, although the words are clear and only their speed is the obstacle.
  - id: request-repetition
    text: «Kan du gjenta beskjeden?»
    correct: false
    why: Jonas has already repeated the whole message twice at the same fast tempo, and he always repeats at that tempo, so another repetition would still arrive too quickly.
  - id: request-slower-speech
    text: «Kan du snakke saktere?»
    correct: true
    why: Jonas always repeats the message at the same fast tempo, so Mina needs the same words delivered more slowly.
  explanation_md: 'Be personen snakke saktere når ordene kommer for fort, også om beskjeden allerede er gjentatt.'
  derived_from:
  - section_id: choosing-help-that-matches-the-problem
- handle: clarification-word-or-meaning
  op: choose
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: understand
  prompt_md: "Mina kjenner ikke betydningen av ett av ordene i setningen. Velg spørsmålet som ber om betydningen av akkurat det ordet."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Mina forstår «dette bordet er», men ikke ordet «ledig».
    - speaker: Jonas
      text_md: «Dette bordet er ledig.»
  options:
  - id: ask-speaker-intention
    text: «Hva mener du?»
    correct: false
    why: This asks about Jonas's overall intention instead of the single word Mina has not learned.
  - id: ask-for-slower-speech
    text: «Kan du snakke litt saktere?»
    correct: false
    why: Slower speech would repeat the same unfamiliar word without explaining it.
  - id: ask-word-meaning
    text: «Hva betyr “ledig”?»
    correct: true
    why: This isolates the unfamiliar word and asks for its meaning.
  explanation_md: 'Bruk «Hva betyr …?» om et ukjent ord og «Hva mener du?» når meningen er uklar.'
  derived_from:
  - section_id: ask-about-the-unclear-part
