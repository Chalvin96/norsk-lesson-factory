- handle: review_discriminate_complete_response
  op: choose
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: Velg svaret som bekrefter det rettede klokkeslettet og fortsetter avtalen.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Resepsjonist
      text_md: «Avtalen er klokka tre.»
    - speaker: Ringende
      text_md: «Mener du klokka to?»
    - speaker: Resepsjonist
      text_md: «Nei, klokka tre.»
  options:
  - id: continue-with-wrong-time
    text: «Greit, da kommer jeg klokka to.»
    correct: false
    why: It continues without adopting the corrected time.
  - id: confirm-and-continue
    text: «Å, klokka tre. Da kommer jeg litt før.»
    correct: true
    why: It registers the corrected time and continues the arrangement.
  - id: acknowledge-only
    text: «Å, klokka tre.»
    correct: false
    why: It registers the time but gives no evidence of continuing the arrangement.
  explanation_md: 'Et godt svar bekrefter den siste opplysningen før samtalen går videre.'
