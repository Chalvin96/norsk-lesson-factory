  derived_from:
  - section_id: completing-repair-cycle
- handle: revise-repair-message
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Mina’s draft reply to Jonas** Rewrite Mina’s reply in 4–10 Norwegian words so Jonas can
    verify the corrected table. State the corrected table as the Norwegian word «fem», not a digit.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Bestillingen skal til bord 5.»
    - speaker: Mina
      text_md: «Greit, bord 6.»
    - speaker: Jonas
      text_md: «Nei, jeg mener bord 5.»
  response_language: 'no'
  judge_prompt: Evaluate gating criterion table-five-explicit, stated as a Norwegian word rather than
    a digit. Record reply-closed-observation diagnostically; its verdict must never cause failure. Accept
    concise natural Bokmål variants.
  criteria:
  - id: table-five-explicit
    instruction: Makes table five explicit in Mina’s revised reply, using the Norwegian word «fem» rather
      than a digit.
  - id: reply-closed-observation
    instruction: 'Observation only: note whether the reply also signals acceptance or readiness to continue;
      never gate on this.'
  explanation_md: Repeating the corrected detail gives the speaker evidence that the repair worked.
  derived_from:
  - section_id: failing-to-register-a-correction
- handle: integrated-practice-repairing-complete-exchange
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: 'A phone call from a colleague at the library breaks up during two instructions. Write a short
    three-turn Norwegian exchange: Mina asks for the unclear detail again, the colleague repeats it, and
    Mina confirms the instructions and says what she will do next. Use 18–32 words.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kollega
      text_md: «Lesesalen må låses klokka atten tretti. Legg nøkkelen i den blå boksen ved personalinngangen.»
    - speaker: Context
      text_md: The call breaks up before Mina can make out where the key should be left.
  response_language: 'no'
  judge_prompt: Evaluate gating criteria message-repeated, instructions-confirmed, and next-step-stated.
    Also check that the colleague's repeated detail matches the message. Record request-form-observation
    diagnostically; its verdict must never cause failure. Accept natural Bokmål variants and minor form
    errors when the communicative outcome is clear.
  criteria:
  - id: message-repeated
    instruction: Requests that the colleague repeat the unclear instructions or the details that were missed.
  - id: detail-repeated
    instruction: Repeats that the key should be left in the blue box by the staff entrance.
  - id: instructions-confirmed
    instruction: Confirms that the reading room must be locked at 18:30 and the key belongs in the blue box by the staff entrance.
  - id: next-step-stated
    instruction: States a relevant next action, such as locking the reading room and leaving the key in the specified box.
  - id: request-form-observation
    instruction: 'Observation only: note whether the reply uses a conventional repetition or slower-speech request naturally;
      never gate on this.'
  explanation_md: The interrupted call leaves one detail unclear; the exchange should repair that gap,
    confirm the instructions, and continue with the relevant task.
  derived_from:
  - section_id: integrated-practice-repairing-complete-exchange
- handle: short-retrieval-review
  op: write
  objective: obj-ask-for-repetition-or-clarification-01
  bloom: apply
  prompt_md: '**Kort repetisjon:** Write one natural Norwegian request for each situation: you missed a whole
    message; the speaker is talking too fast; one word is unfamiliar; you think one detail may be wrong.
    Then complete a repair sequence for this call: the connection cuts out as the bus employee gives the
    departure details. Ask for help, acknowledge the repeated information, and continue the call naturally.
    Write 45–85 Norwegian words in total.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Forbindelsen blir brutt idet den ansatte forteller om avgangen.
    - speaker: Ansatt
      text_md: «Bussen går fra plattform ni klokka 17.10.»
  response_language: 'no'
  judge_prompt: Evaluate whether the response includes an appropriate, distinct Norwegian request for each
    of the four listed situations and completes the bus-call repair sequence. Accept natural Bokmål variants;
    do not require fixed phrases. For the call, require a request suited to missing information, a clear
    acknowledgment of the repeated platform and time, and a relevant continuation.
  criteria:
  - id: four-repair-requests
    instruction: Provides an appropriate Norwegian request for a missed message, speech that is too fast,
      an unfamiliar word, and a possibly incorrect detail.
  - id: call-repair-sequence
    instruction: In the bus call, requests help with the missed departure information and acknowledges the
      repeated platform nine and 17.10.
  - id: call-continued
    instruction: Continues or closes the bus call naturally after acknowledging the information.
  explanation_md: The changed context tests transfer of the full repair cycle.
  derived_from:
  - section_id: short-retrieval-review
