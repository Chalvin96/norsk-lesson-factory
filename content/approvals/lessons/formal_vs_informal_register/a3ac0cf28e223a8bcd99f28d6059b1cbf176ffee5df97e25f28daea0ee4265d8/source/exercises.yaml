  criteria:
  - id: five-marker-effects
    instruction: Explains bare as casual or minimizing, jo as shared or presupposed knowledge, vel as tentative, altså as a conclusion, and faktisk as contrast or unexpected truth.
  - id: preserved-essential-facts
    instruction: Preserves all four supplied facts in the update to Eirik.
  - id: neutral-update
    instruction: Presents the facts to Eirik in a clear, neutral professional register.
  - id: response-word-bound
