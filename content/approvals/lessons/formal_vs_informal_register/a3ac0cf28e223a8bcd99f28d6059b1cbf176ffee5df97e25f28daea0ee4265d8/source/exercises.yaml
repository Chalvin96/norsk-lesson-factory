  prompt_md: Choose one request.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Du skriver en e-post til en ekstern regnskapsfører du ikke har møtt før. Du vil at hun bekrefter at hun har mottatt fakturaen.
  stem_md: Which complete request is most natural?
  options:
  - id: fragment
    text: Faktura mottatt?
    correct: false
    why: The fragment depends on chat-like shared context rather than a complete email request.
  - id: unclear
    text: En bekreftelse kunne muligens vært ønskelig.
    correct: false
    why: It hides both the recipient's action and the object of confirmation.
  - id: du_request
    text: Kan du bekrefte at du har mottatt fakturaen?
    correct: true
    why: Ordinary present-day professional Norwegian uses du, even with a contact you have not met.
  - id: de_request
    text: Kan De bekrefte at De har mottatt fakturaen?
    correct: false
    why: Capitalized De adds traditional distance that this ordinary modern email does not call for.
  explanation_md: Professional tone does not normally require replacing du with De.
  derived_from:
  - section_id: du-professional
- handle: review_request_form
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: apply
  prompt_md: Choose one request.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: En tekniker du ikke har jobbet med før, må se på en feil som ikke haster. Det passer best at hun gjør det når hun selv har tid.
  stem_md: Which request best fits the situation?
  options:
  - id: demanding
    text: Du må se på feilen i dag.
    correct: false
    why: It adds urgency and pressure that the non-urgent situation does not call for.
  - id: vague
    text: Det hadde vært fint om noen så på feilen etter hvert.
    correct: false
    why: It does not clearly ask this technician to inspect the fault.
  - id: considerate
    text: Kunne du sett på feilen en gang når det passer deg?
    correct: true
    why: The tentative opening fits an unfamiliar technician and a non-urgent fault.
  - id: imperative
    text: Se på feilen.
    correct: false
    why: The bare imperative presents the request as a direct instruction.
  explanation_md: A cooperative request stays explicit about the action while reflecting the relationship and the low urgency.
  derived_from:
  - section_id: directness-requests
- handle: review_sentence_style
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: apply
  prompt_md: Choose one update.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Intern melding: «Leveransen fredag blir forsinket. Mangler én vare.» Du skal sende beskjeden videre til en leverandør som ikke kjenner saken.'
  stem_md: Which version can you send as it stands?
  options:
  - id: changed_meaning
    text: Leveransen på fredag er avlyst fordi alle varene er utsolgt.
    correct: false
    why: It changes a delay involving one item into a cancellation involving every item.
  - id: self_contained
    text: Leveransen som skulle komme fredag, blir forsinket fordi én av varene ikke er tilgjengelig.
    correct: true
    why: It identifies the delivery, original day, delay, and cause without prior context.
  - id: fragment
    text: Blir forsinket. Mangler én.
    correct: false
    why: The omitted subject and vague reference depend on shared context.
  - id: heavy
    text: Det foreligger en leveranseforsinkelsesproblematikk grunnet varemangel.
    correct: false
    why: It is less clear because it replaces ordinary verbs with dense nominal wording.
  explanation_md: A self-contained professional update supplies the missing context in clear sentences.
  derived_from:
  - section_id: sentence-style-flow
- handle: review_marker_effect
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: understand
  prompt_md: Choose the best explanation.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Nora skriver til en koordinator: «Vi trenger vel svar innen fredag.»'
  stem_md: What does «vel» signal here?
  options:
  - id: gives_reason
    text: It explains why Friday matters.
    correct: false
    why: The sentence still gives no reason for the deadline.
  - id: marks_surprise
    text: It shows that Friday is unexpectedly early.
    correct: false
    why: The line does not establish the contrast normally needed for that interpretation.
  - id: weakens_precision
    text: It can make a requirement sound tentative rather than firm.
    correct: true
    why: Vel invites agreement or uncertainty, so it weakens a deadline that should be precise.
  - id: adds_formality
    text: It makes the deadline more official.
    correct: false
    why: Vel is conversational and tentative rather than an official marker.
  explanation_md: Remove tentative framing when the communicative purpose requires a firm, precise deadline.
  derived_from:
  - section_id: conversational-markers
- handle: review_closing
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: apply
  prompt_md: Choose one closing.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Du avslutter en e-post til en hotellresepsjon du ikke har vært i kontakt med før, etter å ha spurt om en bekreftelse.
  stem_md: Which closing best completes this email?
  options:
  - id: ceremonial_closing
    text: Ærbødigst Nora
    correct: false
    why: It creates an archaic ceremonial tone that is inconsistent with an ordinary modern email.
  - id: friendly_professional
    text: Takk for hjelpen. Med vennlig hilsen Nora
    correct: true
    why: It matches the courteous request and the unfamiliar business recipient.
  - id: casual_farewell
    text: Ha det bra!
    correct: false
    why: It is a natural conversational farewell but is more casual than this email.
  - id: chat_closing
    text: Snakkes snart!
    correct: false
    why: The familiar wording fits a close-contact chat more readily than this email.
  explanation_md: A closing should continue the relationship and tone established by the rest of the message.
  derived_from:
  - section_id: closings-tone
- handle: review_confirmation_context
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: apply
  prompt_md: Choose the best interpretation.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kari
      text_md: «Jeg kan sende avtalen til kunden nå.»
    - speaker: Per
      text_md: «Det ser bra ut. Du kan sende avtalen.»
  stem_md: What is Per doing?
  options:
  - id: commanding
    text: He is assigning Kari a new task without discussion.
    correct: false
    why: Sending the agreement is already Kari's proposal, not a new assignment.
  - id: hinting
    text: He is indirectly suggesting that the agreement needs revision.
    correct: false
    why: He states that it looks good and authorizes sending it.
  - id: refusing
    text: He is refusing permission to contact the customer.
    correct: false
    why: «Du kan» grants rather than refuses permission in this exchange.
  - id: authorizing
    text: He is approving an action Kari has offered to take.
    correct: true
    why: Per's «Du kan sende» grants permission for the action Kari proposed.
  explanation_md: The prior turn makes the utterance an approval, not an abrupt command.
  derived_from:
  - section_id: back-to-nora
- handle: review_register_transfer
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: apply
  prompt_md: Choose one response.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: "Du jobber ved et museum og skriver til en skolekoordinator du ikke har møtt før. Tjue ekstra personer er meldt til omvisningen tirsdag, inkludert elever og medfølgende voksne. Bemanningen låses ved lunsjtid dagen før ankomsten, men museet mangler fortsatt et sikkert samlet antall personer."
  stem_md: Which full response best fits the audience and purpose?
  options:
  - id: close_chat
    text: "Hei! Hvor mange blir dere til slutt? Trenger tallet mandag."
    correct: false
    why: The compressed wording assumes more shared context and sounds like a familiar chat.
  - id: vague_politeness
    text: "Hei, vi gleder oss til besøket på tirsdag. Det hadde kanskje vært fint om dere kunne si litt mer om gruppen når dere får anledning, slik at vi kan se på planleggingen."
    correct: false
    why: It hides the fixed deadline and practical reason.
  - id: ceremonial_demand
    text: "God dag. De pålegges herved å oversende Deres fullstendige elevantall før planleggingen avsluttes."
    correct: false
    why: It turns a routine professional request into an old-fashioned, authoritarian demand.
  - id: clear_professional
    text: "Hei, kan du bekrefte hvor mange personer som kommer totalt, inkludert elever og medfølgende voksne, innen mandag klokka tolv? Da rekker vi å planlegge guidene til tirsdagens besøk. Takk for hjelpen. Vennlig hilsen Mari"
    correct: true
    why: It asks for the total headcount, including accompanying adults, and gives the deadline, reason, and event in a natural professional email.
  explanation_md: Successful transfer preserves clarity while adjusting context, directness, sentence completeness, and tone to a new professional situation.
  derived_from:
  - section_id: integrated-practice
