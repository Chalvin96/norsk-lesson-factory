- handle: marker_effect_choice
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: understand
  prompt_md: Choose the best interpretation.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Eirik
      text_md: «Å flytte møtet krever nye utstyrsbestillinger.»
    - speaker: Nora
      text_md: «Du kan bare flytte møtet til et annet rom.»
  stem_md: What effect can «bare» have here?
  options:
  - id: fixed_deadline
    text: It makes the time limit precise.
    correct: false
    why: Bare affects the perceived effort or pressure, not the presence of a deadline.
  - id: ceremonial_distance
    text: It makes the sentence old-fashioned and ceremonial.
    correct: false
    why: Bare is conversational rather than a marker of ceremonial distance.
  - id: factual_surprise
    text: It marks the room change as contrary to expectation.
    correct: false
    why: Highlighting unexpected truth is more closely associated with faktisk in this lesson.
  - id: minimizes_work
    text: It can make Nora sound as if she is minimizing a task that is not simple.
    correct: true
    why: Eirik's line shows that the move involves additional work, so bare can sound dismissive.
  explanation_md: Conversational markers express stance; their effect depends on the surrounding facts and relationship.
  derived_from:
  - section_id: conversational-markers
