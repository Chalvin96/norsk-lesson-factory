  prompt_md: "Du skriver til en ukjent kontakt på jobb. Du trenger den nyeste versjonen før et møte klokka 14. Skriv en profesjonell e-post. Be tydelig og vennlig, og bruk «du»."
  min_words: 22
  max_words: 55
  response_language: 'no'
  judge_prompt: "Evaluate only `retains-du`, `meeting-context`, `clear-cooperative-request`. Accept natural Bokmål and different cooperative request forms. Calibration anchors: Must pass: «Hei, kan du sende meg den nyeste versjonen før møtet klokka 14? Da rekker jeg å kontrollere tallene på forhånd. Takk for hjelpen. Vennlig hilsen Nora» Must fail: «Hei! Send versjonen nå!» Must fail on clear-cooperative-request: «Hei, du må sende meg den nyeste versjonen før møtet klokka 14, slik at jeg får kontrollert tallene. Takk. Vennlig hilsen Nora» because it imposes an obligation on an unfamiliar contact."
  criteria:
  - id: retains-du
    instruction: Keeps the pronoun du and does not replace it with De.
  - id: meeting-context
    instruction: States that the version is needed before the meeting at 14.00.
  - id: clear-cooperative-request
    instruction: Makes the requested action clear without imposing an obligation on this unfamiliar contact or using the abrupt punctuation and unsupported urgency of the original.
  - id: request-form-observation
    instruction: Diagnose whether the chosen request form sounds more forceful than the situation invites; this observation never fails an otherwise valid answer.
  derived_from:
  - section_id: du-professional
