  op: write
  objective: obj-formal-vs-informal-register-01
  bloom: apply
  prompt_md: "Skriv en kort, profesjonell forespørsel til Eirik, en ukjent bygningskoordinator. Rommet torsdag er for lite fordi flere enn ventet meldte seg på. Be ham undersøke eller sende forslag til større rom. Du trenger svar innen klokka 16 for å bestille adgangskort."
  min_words: 27
  max_words: 55
  response_language: 'no'
  judge_prompt: "Evaluate only `unmistakable-action`, `deadline`, `deadline-reason`, `cooperative-tone`. Accept natural Bokmål and more than one suitable request form. Do not require a specific modal. Calibration anchors: Must pass: «Hei Eirik, flere har meldt seg på møtet enn forventet. Kunne du undersøkt om et større rom er ledig på torsdag? Vi trenger svar innen klokka fire fordi adgangskortene må bestilles da. På forhånd takk.» Must fail: «Hei, vi har et romproblem. Håper du ordner det snart.» Must pass with `modal-choice-observation` flagged: «Hei Eirik, kan du sende meg en oversikt over større rom innen klokka fire? Flere har meldt seg på, og adgangskortene må bestilles da. Takk for hjelpen.»"
  criteria:
  - id: unmistakable-action
    instruction: Clearly asks Eirik to check or send available larger-room options.
  - id: deadline
    instruction: States the deadline as 16.00.
  - id: deadline-reason
    instruction: Explains that access cards must be ordered by that time.
  - id: cooperative-tone
    instruction: Frames the inconvenient action as a clear, cooperative request rather than a command or vague hint.
  - id: modal-choice-observation
    instruction: Diagnose the degree of tentativeness created by the request form; this observation never fails an otherwise valid answer.
  derived_from:
  - section_id: directness-requests
- handle: sentence_style_choice
