- handle: register_choice
  op: choose
  objective: obj-formal-vs-informal-register-01
  bloom: understand
  prompt_md: 'Velg meldingen som passer best til situasjonen.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Nora trenger et større rom til torsdagens møte. Hun skriver til Eirik, en bygningskoordinator hun ikke kjenner fra før, og trenger svar før klokka fire for å bestille adgangskort.'
  options:
  - id: vague_hint
    text: Det hadde kanskje vært fint om romsituasjonen kunne ses litt nærmere på i løpet av uken, om det passer.
    correct: false
    why: It softens the message until the requested action and deadline are unclear.
  - id: professional_request
    text: Hei Eirik, kunne du undersøkt om et større rom er ledig på torsdag? Vi trenger en avklaring innen klokka fire fordi adgangskortene må bestilles da. Vennlig hilsen Nora
    correct: true
    why: It supplies context, a clear request, a reason, and a deadline in a tone suited to an unfamiliar professional contact.
  - id: chatty_message
    text: Hei Eirik! Vi trenger visst et større rom til torsdag. Har du noe ledig?
    correct: false
    why: Its conversational tone can work in an ordinary workplace message, but it omits the deadline and why Nora needs an answer by then.
  - id: old_fashioned
    text: Det bes herved om at De oversender Deres bekreftelse på et ledig større rom innen klokken fire, ettersom adgangskort skal bestilles da.
    correct: false
    why: It conveys excessive distance through old-fashioned pronouns and administrative phrasing.
  explanation_md: 'En profesjonell e-post kan bruke vanlig, moderne språk og samtidig gi nødvendig sammenheng, en tydelig forespørsel, en begrunnelse og en frist.'
  derived_from:
  - section_id: register-situation
