      text_md: 'Nora skriver til en koordinator hun ikke har møtt før. Hun vil be ham bekrefte at han har mottatt dokumentene.'
  options:
  - id: chat_fragment
    text: Mottatt dokumentene?
    correct: false
    why: The fragment may work in a shared-context chat but is too compressed for this email.
  - id: vague_statement
    text: Dokumentene hadde vært fine å få bekreftet.
    correct: false
    why: The wording obscures who should confirm receipt and what response is requested.
  - id: modern_du
    text: Kan du bekrefte at du har mottatt dokumentene?
    correct: true
    why: Ordinary professional Norwegian commonly uses du and creates tone through the whole request.
  - id: traditional_de
    text: Kan De bekrefte at De har mottatt dokumentene?
    correct: false
    why: Capitalized De creates an unusually traditional or distant tone in an ordinary modern workplace email.
  explanation_md: 'Bruk av «du» gjør ikke en profesjonell melding uformell. Tydelighet, sammenheng og hvordan forespørselen formuleres, påvirker tonen.'
