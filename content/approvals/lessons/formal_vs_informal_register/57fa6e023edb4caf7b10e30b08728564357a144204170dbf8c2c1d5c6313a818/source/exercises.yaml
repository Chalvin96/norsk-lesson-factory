  criteria:
  - id: relationship-inconvenience-purpose
    instruction: Identifies the unfamiliar professional relationship, the short-notice inconvenience, and the room-related purpose.
  - id: evidence-from-excerpts
    instruction: "Uses the supplied draft and revision to identify the requested relationship, inconvenience, purpose, and cooperative changes; quotations and exact wording are not required."
  - id: cooperative-revision-explanation
    instruction: Explains how the revised context, reason for the deadline, and request make the message more cooperative than the commands and exclamation marks without dropping the deadline.
