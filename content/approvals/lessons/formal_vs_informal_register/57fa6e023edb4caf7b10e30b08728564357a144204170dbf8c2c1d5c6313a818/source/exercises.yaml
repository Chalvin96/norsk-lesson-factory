  prompt_md: "Les samtalen. Forklar kort hva «bare», «jo», «vel», «altså» og «faktisk» uttrykker her. Skriv deretter en nøytral, profesjonell oppdatering til Eirik med alle faktaene. Hele svaret skal være."
  min_words: 70
  max_words: 110
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Vi har jo fått mange flere påmeldinger til møtet på torsdag.»
    - speaker: Nora
      text_md: «Rommet blir vel for lite. Vi trenger faktisk et større rom allerede i morgen.»
    - speaker: Jonas
      text_md: «Bare send Eirik en melding, så ordner det seg.»
    - speaker: Nora
      text_md: «Vi må altså kontakte ham i dag.»
  response_language: 'no'
  judge_prompt: "Evaluate only `five-marker-effects`, `preserved-essential-facts`, `neutral-update`. Accept contextual nuances supported by the supplied lines. Do not fail a valid update merely because it retains a marker appropriately."
  criteria:
  - id: five-marker-effects
    instruction: Explains bare as casual or minimizing, jo as shared or presupposed knowledge, vel as tentative, altså as a conclusion, and faktisk as contrast or unexpected truth.
  - id: preserved-essential-facts
    instruction: Preserves all four supplied facts in the update to Eirik.
  - id: neutral-update
    instruction: Presents the facts to Eirik in a clear, neutral professional register.
