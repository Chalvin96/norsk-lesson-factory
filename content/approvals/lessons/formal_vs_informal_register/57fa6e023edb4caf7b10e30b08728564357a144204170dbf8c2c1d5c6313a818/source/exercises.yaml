  prompt_md: 'Velg den beste e-postsetningen til koordinatoren. Den må forklare behovet for et større rom og be om svar innen klokka 16, slik at adgangskort kan bestilles.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Nora skriver til en ekstern koordinator om rommet som er bestilt til torsdagens møte.'
  options:
  - id: different_fact
    text: Møtet på torsdag er avlyst fordi rommet er opptatt, så vi trenger ikke et nytt rom.
    correct: false
    why: It is complete but changes the practical facts rather than restating them clearly.
  - id: complete_email
    text: Flere har meldt seg på enn ventet, så vi trenger et større rom til møtet på torsdag. Kan du sjekke om et rom er ledig og svare innen klokka 16, slik at adgangskort kan bestilles?
    correct: true
    why: It names the reservation, event, day, cause, and need so the message stands alone.
  - id: chat_fragments
    text: Hei! Gjelder torsdag. Trenger noe større. Fikser du det?
    correct: false
    why: The fragments depend on shared context the external recipient does not have.
  - id: administrative_nouns
    text: På bakgrunn av deltakerantallsøkningen foreligger et romendringsbehov som bør imøtekommes før torsdagens møte.
    correct: false
    why: It conveys the situation but does not clearly ask the coordinator to check or offer an available room.
  explanation_md: En god e-post gir koordinatoren nok informasjon og ber tydelig om rom og svar innen fristen.
  derived_from:
  - section_id: sentence-style-flow
