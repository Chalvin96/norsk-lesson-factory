- handle: integrated_cohesive_conversation
  op: write
  objective: obj-ellipsis-anaphora-01
  bloom: apply
  prompt_md: "Melding fra Mina til Eirik: «Maten er bestilt. Kan du hente nøkkelen etter jobb? Jeg kan gjøre det hvis du ikke har tid. I fjor satte vi langbord langs veggene. La oss bruke samme løsning. Jeg er litt nervøs før middagen. Vil du gå gjennom planen sammen klokka fire?» Skriv Eiriks svar til Mina i en melding: bekreft hva du vet, si hvem som henter nøkkelen, reager på nervøsiteten med «samme her», godta planmøtet med «gjerne», og omtal bordløsningen med «slik» uten unødvendig gjentakelse."
  min_words: 55
  max_words: 80
  response_language: 'no'
  judge_prompt: 'Vurder svaret bare etter kriteriene nedenfor. Et svar består når alle kriterier uten suffikset «-observation» er oppfylt. Kriterier med «-observation» er diagnostiske og kan aldri føre til underkjenning. Ankereksempler: Må bestå: «Takk for meldingen. Jeg vet at maten er bestilt, og jeg henter nøkkelen etter jobb, så du slipper. Samme her, men det går nok fint. Jeg kan også ta med serviettene. Klokka fire passer fint, og jeg blir gjerne med på å gå gjennom planen. Bordene kan stå på samme måte som i fjor, og vi gjør det slik igjen.» Må underkjennes på content-coverage: «Takk for meldingen. Vi snakkes senere.» Må underkjennes på no-repetition eller slik-reference: en melding som gjentar hele bordoppsettet fra i fjor i stedet for å vise tilbake til det med «slik». Rapporter en dom for hvert kriterium-id og legg ikke til andre krav.'
  criteria:
  - id: audience-purpose
    instruction: Svaret er Eiriks melding til Mina som følger opp planleggingen.
  - id: content-coverage
    instruction: Svaret bekrefter matopplysningen, fordeler henting av nøkkelen, reagerer på nervøsiteten, svarer på møtet klokka fire og omtaler bordløsningen.
  - id: clear-references
    instruction: Det er tydelig hvilke opplysninger, handlinger og løsninger svaret viser tilbake til.
  - id: no-repetition
    instruction: Svaret viser tilbake til bordløsningen med en kort referanse i stedet for å gjenta hele oppsettet.
  - id: gjerne-acceptance
    instruction: Svaret godtar planmøtet med «gjerne».
  - id: samme-her
    instruction: Svaret deler reaksjonen på nervøsiteten med «samme her».
  - id: slik-reference
    instruction: Svaret viser tilbake til måten bordene skal ordnes på med «slik».
  - id: omission-observation
    instruction: Registrer om svaret naturlig utelater en tydelig forstått handling; dette påvirker ikke bestått.
  - id: det-observation
    instruction: Registrer om «det» naturlig viser tilbake til delt informasjon; dette påvirker ikke bestått.
  - id: gjore-det-observation
    instruction: Registrer om en form av «gjøre det» naturlig viser tilbake til en handling; dette påvirker ikke bestått.
  derived_from:
  - section_id: back-at-community-centre
- handle: retrieval_and_review
  op: write
  objective: obj-ellipsis-anaphora-01
  bloom: apply
  prompt_md: "På et nytt frivilligarrangement forklar kort hva hvert uttrykk viser til. Skriv deretter seks korte svar på norsk, og bruk én gang hver: utelatelse, «det», «gjøre det», «gjerne», «samme her» og «slik». Nora ordner stolene før gjestene kommer, mens Emil henter utstyr et annet sted og ikke rekker å ordne stolene. Arrangøren sier at dørene åpner klokka ti. En frivillig ber deg bære registreringsboksen etter lunsj. En venn foreslår å lage navneskilt sammen. En annen frivillig er nervøs for å møte nye familier. Laget vil registrere gjestene før utdelingen av navneskilt og bruke samme framgangsmåte neste gang."
  response_language: 'no'
  min_words: 45
  max_words: 100
  judge_prompt: "Evaluate form-explanation, omitted-action, det-fact, gjore-det-action, willing-acceptance, shared-reaction, manner-reference. Require six written responses with each target form used naturally once, and a brief accurate explanation of what each form refers to. Accept natural Bokmål variants; do not require exact model sentences."
  criteria:
  - id: form-explanation
    instruction: Briefly explains that omission recovers an action from context; det points to shared information; gjøre det refers back to an action; gjerne accepts a suggestion; samme her shares a reaction; and slik refers to a method.
  - id: omitted-action
    instruction: Says Nora can arrange the chairs but Emil cannot, using a natural modal with the understood action omitted.
  - id: det-fact
    instruction: Reacts naturally to the announcement that the doors open at ten, using det to refer to that shared information.
  - id: gjore-det-action
    instruction: Accepts the request to carry the sign-in box after lunch and uses a natural form of gjøre det to refer to the action.
  - id: willing-acceptance
    instruction: Accepts the suggestion to prepare name badges together with a natural willing response.
  - id: shared-reaction
    instruction: Responds to the volunteer's nervousness with a natural expression that shares the same reaction.
  - id: manner-reference
    instruction: Refers to the agreed registration-and-badge sequence as a method to use again, with a natural form of slik and without repeating all the steps.
  explanation_md: 'Bruk hvert uttrykk i en ny situasjon, og gjør det tydelig hva det viser til.'
  derived_from:
  - section_id: retrieval-review
