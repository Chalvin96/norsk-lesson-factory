- handle: integrated_cohesive_conversation
  op: write
  objective: obj-ellipsis-anaphora-01
  bloom: apply
  prompt_md: 'Melding fra Mina til Eirik: «Maten er bestilt. Kan du hente nøkkelen etter jobb? Jeg kan
    gjøre det hvis du ikke har tid. I fjor satte vi langbord langs veggene. La oss bruke samme løsning.
    Jeg er litt nervøs før middagen. Vil du gå gjennom planen sammen klokka fire?» Skriv Eiriks svar til
    Mina i en melding på 55–80 ord: bekreft hva du vet, si hvem som henter nøkkelen, reager på nervøsiteten
    med «samme her», godta planmøtet med «gjerne», og omtal bordløsningen med «slik» uten unødvendig gjentakelse.'
  response_language: 'no'
  judge_prompt: 'Vurder svaret bare etter kriteriene nedenfor. Et svar består når alle kriterier uten
    suffikset «-observation» er oppfylt. Kriterier med «-observation» er diagnostiske og kan aldri føre
    til underkjenning. Ankereksempler: Må bestå: «Takk for meldingen. Jeg vet at maten er bestilt, og
    jeg henter nøkkelen etter jobb, så du slipper. Samme her, men det går nok fint. Jeg kan også ta med
    serviettene. Klokka fire passer fint, og jeg blir gjerne med på å gå gjennom planen. Bordene
    kan stå på samme måte som i fjor, og vi gjør det slik igjen.» Må underkjennes på content-coverage:
    «Takk for meldingen. Vi snakkes senere.» Må underkjennes på no-repetition eller slik-reference: en
    melding som gjentar hele bordoppsettet fra i fjor i stedet for å vise tilbake til det med «slik».
    Rapporter en dom for hvert kriterium-id og legg ikke til andre krav.'
  criteria:
  - id: audience-purpose
    instruction: Svaret er Eiriks melding til Mina som følger opp planleggingen.
  - id: content-coverage
    instruction: Svaret bekrefter matopplysningen, fordeler henting av nøkkelen, reagerer på nervøsiteten,
      svarer på møtet klokka fire og omtaler bordløsningen.
  - id: word-bound
    instruction: Svaret inneholder 55–80 ord.
  - id: clear-references
    instruction: Det er tydelig hvilke opplysninger, handlinger og løsninger svaret viser tilbake til.
  - id: no-repetition
    instruction: Svaret viser tilbake til bordløsningen med en kort referanse i stedet for å gjenta hele
      oppsettet.
  - id: gjerne-acceptance
    instruction: Svaret godtar planmøtet med «gjerne».
  - id: samme-her
    instruction: Svaret deler reaksjonen på nervøsiteten med «samme her».
  - id: slik-reference
    instruction: Svaret viser tilbake til måten bordene skal ordnes på med «slik».
  - id: omission-observation
    instruction: Registrer om svaret naturlig utelater en tydelig forstått handling; dette påvirker ikke
      bestått.
  - id: det-observation
    instruction: Registrer om «det» naturlig viser tilbake til delt informasjon; dette påvirker ikke bestått.
  - id: gjore-det-observation
    instruction: Registrer om en form av «gjøre det» naturlig viser tilbake til en handling; dette påvirker
      ikke bestått.
  derived_from:
  - section_id: back-at-community-centre
- handle: retrieval_and_review
  op: write
  objective: obj-ellipsis-anaphora-01
  bloom: apply
  prompt_md: 'At a new volunteer event, briefly explain what each compact form refers to. Then write six short Norwegian replies, using omission, det, gjøre det, gjerne, samme her, and slik once each. Situations: Nora can arrange the chairs but Emil cannot; the organizer announces that doors open at ten; a volunteer asks you to carry the sign-in box after lunch; a friend suggests preparing name badges together; another volunteer says they feel nervous about welcoming new families; the team agrees to register guests before handing out badges and wants to use that same method at the next event. Keep each reference clear and natural.'
  response_language: 'no'
  min_words: 45
  max_words: 100
  judge_prompt: Evaluate form-explanation, omitted-action, det-fact, gjore-det-action, willing-acceptance, shared-reaction, manner-reference, and word-bound. Require six written responses with each target form used naturally once, and a brief accurate explanation of what each form refers to. Accept natural Bokmål variants; do not require exact model sentences.
  criteria:
  - id: form-explanation
    instruction: Briefly explains that omission recovers an action from context; det points to shared information; gjøre det refers back to an action; gjerne accepts a suggestion; samme her shares a reaction; and slik refers to a method.
  - id: omitted-action
    instruction: Says Nora can arrange the chairs but Emil cannot, using a natural modal with the understood action omitted.
  - id: det-fact
    instruction: Reacts naturally to the announcement that the doors open at ten, using det to refer to that shared information.
  - id: gjore-det-action
    instruction: Accepts the request to carry the sign-in box after lunch and uses a natural form of gjøre det to refer to the action.
  - id: willing-acceptance
    instruction: Accepts the suggestion to prepare name badges together with a natural willing response.
  - id: shared-reaction
    instruction: Responds to the volunteer's nervousness with a natural expression that shares the same reaction.
  - id: manner-reference
    instruction: Refers to the agreed registration-and-badge sequence as a method to use again, with a natural form of slik and without repeating all the steps.
  - id: word-bound
    instruction: Contains 45–100 words.
  explanation_md: The learner must retrieve each form and keep its reference clear in a new volunteer-event context.
  derived_from:
  - section_id: retrieval-review
