- handle: retrieve_double_definiteness_after_delay
  op: write
  objective: obj-double-definiteness-01
  bloom: apply
  prompt_md: 'Write Nora a 15–35-word Norwegian message identifying all three items she must collect:
    the old chair by the door, the round table by the window, and the small lamps by the checkout.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hvilke ting skal jeg hente på bruktbutikken?»
  explanation_md: A clear message identifies each specific item with the appropriate opening word, adjective
    form and definite noun.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Check criteria den-chair, det-table, de-lamps and word-bound. Record each criterion verdict
    separately. Accept natural Bokmål wording and word order.
  criteria:
  - id: den-chair
    instruction: The message identifies the old chair by the door with the complete specific phrase den
      gamle stolen ved døren.
  - id: det-table
    instruction: The message identifies the round table by the window with the complete specific phrase
      det runde bordet ved vinduet.
  - id: de-lamps
    instruction: The message identifies the small lamps by the checkout with the complete specific phrase
      de små lampene ved kassen.
  - id: word-bound
    instruction: The message contains 15–35 words.
