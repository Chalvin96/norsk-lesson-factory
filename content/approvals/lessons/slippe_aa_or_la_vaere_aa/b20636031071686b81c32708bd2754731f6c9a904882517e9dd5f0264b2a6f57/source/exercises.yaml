- handle: identify_removed_requirement
  op: choose
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: understand
  prompt_md: 'Velg tolkningen som passer til de tre oppgavene: møte tidlig, bære bordene og bake kakene. Ta hensyn til ordningene med vaktmesteren, leveringen og bakeribestillingen.'
  derived_from:
  - section_id: when-a-requirement-disappears
  stem_md: Hvordan påvirker ordningene de tre oppgavene?
  options:
  - id: swapped-arrangements
    text: Vaktmesterens hjelp gjør at vi slipper å bake kakene; leveringen gjør at Nora slipper å møte tidlig; bestillingen hos bakeriet gjør at vi slipper å bære bordene. Kravene er fjernet, men setningene sier ikke at oppgavene ikke blir gjort.
    correct: false
    why: The arrangements are assigned to the wrong tasks.
  - id: personal-choice
    text: Vaktmesterens hjelp gjør at vi lar være å møte tidlig; leveringen gjør at vi lar være å bære bordene; bestillingen hos bakeriet gjør at Nora lar være å bake kakene. Alle tre oppgavene er fortsatt mulige, men dette er personlige valg.
    correct: false
    why: The context describes requirements removed by arrangements, not deliberate personal decisions.
  - id: correct
    text: Vaktmesterens hjelp gjør at vi slipper å møte tidlig; leveringen gjør at vi slipper å bære bordene; bestillingen hos bakeriet gjør at Nora slipper å bake kakene. Kravene er fjernet, men setningene sier ikke at oppgavene ikke blir gjort.
    correct: true
    why: The caretaker removes the need to meet early, the delivery removes the need to carry the tables, and the bakery order removes the need to bake them. None of this proves that the actions do not happen.
- handle: identify_deliberate_non_action
  op: choose
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: understand
  prompt_md: Velg tolkningen som passer til Emils og Noras valg.
  derived_from:
  - section_id: when-someone-intentionally-does-nothing
  stem_md: Hvorfor sykler ikke Emil og kjøper ikke Nora mer kaffe?
  options:
  - id: absent-necessity
    text: Emil slipper å sykle fordi veien er glatt, og Nora slipper å kjøpe mer kaffe. Handlingene er derfor bare unødvendige, ikke bevisste valg.
    correct: false
    why: This treats both situations as absent necessity instead of deliberate non-action.
  - id: impossible-actions
    text: Emil kunne sykle, men veien gjør sykling umulig; Nora kunne kjøpe mer kaffe, men en regel gjør kjøpet umulig. De lar være å handle fordi handlingene ikke lenger er mulige.
    correct: false
    why: The lesson says the actions remain available; the people choose not to do them.
  - id: correct
    text: Emil kunne sykle, men han lar være å sykle fordi veien er glatt. Nora kunne kjøpe mer kaffe, men hun lar være å kjøpe mer kaffe fordi hun bestemmer seg for ikke å gjøre det.
    correct: true
    why: Both actions remain possible, and each person deliberately chooses not to perform the action.
