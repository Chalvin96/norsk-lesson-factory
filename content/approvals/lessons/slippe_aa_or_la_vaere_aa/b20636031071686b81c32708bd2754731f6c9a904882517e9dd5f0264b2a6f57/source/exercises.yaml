- handle: explain_external_requirement_or_intentional_non_action
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: 'Forklar forskjellen på de to situasjonene på norsk. I den første dekker arrangøren Idas gebyr, så hun slipper å betale. I den andre kan Jonas svare på meldingen, men lar være. Oppgi én mulig grunn til hver handling.'
  derived_from:
  - section_id: practice-explain-the-difference
  response_language: "no"
  min_words: 35
  max_words: 70
  judge_prompt: Check the Norwegian response against the task and report evidence for each criterion. Accept natural Bokmål paraphrases, but require a clear contrast between externally removed necessity and deliberate choice.
  criteria:
  - id: external-arrangement
    instruction: Links the sentence with slippe å to the organizer's external arrangement and explains that payment is not required from Ida.
  - id: intentional-choice
    instruction: Links the sentence with la være å to Jonas's deliberate non-action while replying remains possible.
  - id: plausible-reasons
    instruction: Gives one plausible reason for each interpretation.
- handle: build_cause_before_choosing_phrase
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: 'Skriv to situasjoner på norsk, med to setninger i hver. Først: En kollega overtar en arbeidsoppgave, så du slipper å gjøre den. Deretter: Du bestemmer deg for ikke å sende en sint melding, selv om du kan. Bruk «slipper å» og «lar være å» i den andre setningen i hver situasjon.'
  derived_from:
  - section_id: practice-build-a-cause-before-choosing-the-phrase
  response_language: "no"
  min_words: 25
  max_words: 55
  judge_prompt: Check the Norwegian response against the two assigned situations and report evidence for each criterion. Accept natural present-tense Bokmål forms of the required expressions.
  criteria:
  - id: external-cause-before-phrase
    instruction: Establishes the colleague's takeover in sentence 1 and uses slipper å in sentence 2 to express absent necessity.
  - id: personal-decision-before-phrase
    instruction: Establishes the decision not to send an angry message in sentence 1 and uses lar være å in sentence 2 to express deliberate non-action.
  - id: cause-precedes-expression
    instruction: Places each assigned cause or personal decision before the corresponding phrase, rather than choosing the phrase before the context is clear.
- handle: continue_saturday_preparations
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: 'Fortsett samtalen med 3–5 korte replikker mellom Sigrid, Nora og Emil. Ikke gjenta replikkene som står her. Ta med en oppgave noen slipper å gjøre på grunn av en ordning, og en handling Nora eller Emil bevisst lar være å gjøre. Forklar hva valgene skyldes, og bruk «slippe å» og «la være å».'
  derived_from:
  - section_id: back-to-saturdays-event
  response_language: "no"
  min_words: 35
  max_words: 70
  judge_prompt: Check the Norwegian continuation against the task and report evidence for each criterion. Accept natural Bokmål wording and inflection when the two meanings remain clear.
  criteria:
  - id: new-removed-requirement
    instruction: Uses a natural form of slippe å for a newly described task that is no longer required and explicitly includes the arrangement that removed the need.
  - id: intentional-non-action
    instruction: Uses a natural form of la være å for an action Nora or Emil intentionally chooses not to perform.
- handle: retrieve_need_or_choice_contrast
  op: write
  objective: obj-slippe-aa-or-la-vaere-aa-01
  bloom: apply
  prompt_md: Skriv to korte situasjoner på norsk. I den første gjør en endring at en oppgave ikke lenger er nødvendig. I den andre lar noen bevisst være å gjøre noe som fortsatt er mulig. Bruk «slipper å» og «lar være å», og forklar kort forskjellen.
  derived_from:
  - section_id: retrieval-and-review
  response_language: "no"
  min_words: 25
  max_words: 55
  judge_prompt: Check the Norwegian review against the task and report evidence for each criterion. Accept natural Bokmål paraphrases that preserve the two meanings.
  criteria:
  - id: need-meaning
    instruction: Uses slipper å for the first idea, where a changed situation removes the need to perform the task.
  - id: choice-meaning
    instruction: Uses lar være å for the second idea, where the task remains possible but is deliberately not performed.
  - id: contrast-explained
    instruction: Briefly explains in Norwegian the difference between absent necessity and intentional non-action.
