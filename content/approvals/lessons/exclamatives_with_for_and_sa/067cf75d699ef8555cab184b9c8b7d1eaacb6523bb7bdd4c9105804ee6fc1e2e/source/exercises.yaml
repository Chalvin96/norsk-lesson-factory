- handle: two_ways_to_react
  op: write
  objective: obj-exclamatives-with-for-and-sa-01
  bloom: apply
  prompt_md: 'Ingrid writes: «Hytta har store vinduer. Fjorden er svært vakker, og det er helt stille
    om kvelden.» Write Ingrid a 21–40-word Norwegian message addressed to Ingrid that thanks her for the
    cabin or the stay, reacts to at least two listed details, includes a noun-focused «for en/et/noen
    ...» exclamation, and includes a degree-focused «så + adjective/adverb ...» exclamation. If you use
    a full clause, keep statement word order with the subject before the verb; do not use question inversion.'
  explanation_md: A successful message addresses Ingrid, thanks her for the cabin or stay, reacts to at
    least two supplied details, and produces both required exclamation patterns.
  response_language: 'no'
  judge_prompt: Check the response against all gating criteria. Any full clause used for an exclamation
    must keep statement word order, with the subject before the verb; question inversion fails the
    word-order criterion. Do not require a full clause when an otherwise valid exclamation does not use one.
  criteria:
  - id: message-to-ingrid
    instruction: The Norwegian message is addressed or clearly directed to Ingrid.
  - id: thanks-owner
    instruction: The message thanks Ingrid for the cabin or the stay.
  - id: two-cabin-details
    instruction: 'The message reacts to at least two supplied details: the large windows, the beautiful
      fjord, or the quiet evenings.'
  - id: for-exclamation
    instruction: The message contains a noun-focused exclamation built with «for en/et/noen ...».
  - id: sa-exclamation
    instruction: The message contains a degree-focused exclamation built with «så» followed by an adjective
      or adverb.
  - id: word-bound
    instruction: The message contains 21–40 words.
  - id: no-question-inversion
    instruction: Any full clause used for an exclamation keeps statement word order, with the subject
      before the verb; question inversion fails this criterion. A full clause is not required.
  derived_from:
  - section_id: retrieval-and-review
