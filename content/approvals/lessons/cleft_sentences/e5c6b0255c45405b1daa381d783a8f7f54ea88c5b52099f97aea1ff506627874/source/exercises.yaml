      text_md: «Amir dekket bordet i går.»
    - speaker: Sigrid
      text_md: «Nei, jeg dekket bordet i går.»
    - speaker: Morten
      text_md: «Sigrid lager maten nå.»
    - speaker: Amir
      text_md: «Nei, jeg lager maten nå.»
  response_language: 'no'
  min_words: 10
  max_words: 35
  judge_prompt: 'Check the response against the task and report evidence for each criterion. Expected responses are: 1. Det var Sigrid som dekket bordet i går. 2. Det er Amir som lager maten nå. Accept natural equivalent wording only when it keeps the stated actor, action, and time. Each highlighted person must be followed by som. Score person focus primarily; the opening tense must fit the past or present context.'
  criteria:
  - id: actual-person
    instruction: Each correction places the actual person immediately after det var or det er.
  - id: som-link
    instruction: Each highlighted person is followed by som before the action.
  - id: time-fit
    instruction: The completed past action uses det var, and the present action uses det er.
  derived_from:
  - section_id: highlighting-who
