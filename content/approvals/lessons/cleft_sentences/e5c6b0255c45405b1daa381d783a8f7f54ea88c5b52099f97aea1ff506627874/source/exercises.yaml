- handle: find_the_highlighted_information
  op: choose
  objective: obj-cleft-sentences-01
  bloom: understand
  prompt_md: "Velg alternativet som viser hva hvert uttrykk framhever, i samme rekkefølge."
  stem_md: "Hvilket alternativ viser riktig fokus i setning 1–4?"
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Fire kløyvingssetninger fra leksjonen: 1. Det var Sigrid som hentet stolene. 2. Det var stolene Sigrid hentet. 3. Det var i går Sigrid hentet stolene. 4. Det er Amir som har nøkkelen nå.'
  options:
  - id: mapping-b
    text: '1: ting (stolene); 2: person (Sigrid); 3: tid (i går); 4: person (Amir).'
    correct: false
    why: 'Sentences 1 and 2 have their focus types exchanged: Sigrid is the person in 1 and stolene the thing in 2.'
  - id: mapping-c
    text: '1: person (Sigrid); 2: ting (stolene); 3: tid (i går); 4: ting (nøkkelen).'
    correct: false
    why: Sentence 4 highlights Amir, the person, not nøkkelen.
  - id: mapping-d
    text: '1: person (Sigrid); 2: tid (i går); 3: ting (stolene); 4: person (Amir).'
    correct: false
    why: 'Sentences 2 and 3 have their focus types exchanged: stolene is the thing in 2 and i går the time in 3.'
  - id: mapping-a
    text: '1: person (Sigrid); 2: ting (stolene); 3: tid (i går); 4: person (Amir).'
    correct: true
    why: 'The element right after det var or det er carries the focus: Sigrid in 1, stolene in 2, i går in 3, and Amir in 4.'
  derived_from:
  - section_id: central-meaning-choice
- handle: identify_the_responsible_person
