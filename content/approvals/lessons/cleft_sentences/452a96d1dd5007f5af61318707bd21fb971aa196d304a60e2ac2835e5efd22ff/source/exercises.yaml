- handle: short_retrieval_review
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: 'Read the dialogue, then write four separate Bokmål cleft sentences about the event, in this order: highlight who first, what second, when third, and where fourth. Put each highlighted element immediately after det er or det var, and follow the highlighted person with som.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hva gjorde Eli i går?»
    - speaker: Tom
      text_md: «Eli kjøpte blomstene på torget.»
  response_language: 'no'
  min_words: 20
  max_words: 70
  judge_prompt: 'Check the response against the task and report evidence for each criterion. The event is Eli kjøpte blomstene på torget i går. Canonical answers are: 1. Det var Eli som kjøpte blomstene på torget i går. 2. Det var blomstene Eli kjøpte på torget i går. 3. Det var i går Eli kjøpte blomstene på torget. 4. Det var på torget Eli kjøpte blomstene i går. Accept the taught optional at after a highlighted time or place, and accept det er or det var when it fits the event. Each sentence must highlight the requested element immediately after the opening, and the first sentence must follow the highlighted person with som.'
  criteria:
  - id: same-event
    instruction: 'All four sentences describe the single event from the dialogue: Eli bought the flowers at the square yesterday.'
  - id: who-focus
    instruction: The first sentence highlights Eli immediately after det er or det var and follows Eli with som.
  - id: what-focus
    instruction: The second sentence places blomstene immediately after det er or det var.
  - id: when-focus
    instruction: The third sentence places i går immediately after det er or det var.
  - id: where-focus
    instruction: The fourth sentence places på torget immediately after det er or det var.
  derived_from:
  - section_id: short-retrieval-review
