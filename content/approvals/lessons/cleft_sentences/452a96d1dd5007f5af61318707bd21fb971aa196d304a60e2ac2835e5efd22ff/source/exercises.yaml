    turns:
    - speaker: Amir
      text_md: «Jeg hentet stolene til middagen.»
    - speaker: Sigrid
      text_md: «Jeg lager maten til middagen.»
  response_language: 'no'
  min_words: 10
  max_words: 35
  judge_prompt: 'Check the response against the task and report evidence for each criterion. Expected responses are: 1. Det var stolene Amir hentet til middagen. 2. Det er maten Sigrid lager til middagen. Accept natural equivalent wording when the same person, action, and event are preserved. Score the object focus; do not require a particular vocabulary change beyond preserving each event.'
  criteria:
  - id: object-position
    instruction: Each response places the relevant object immediately after det var or det er.
  - id: event-preserved
    instruction: Each object-focused response preserves the person and action from its source statement.
  derived_from:
  - section_id: highlighting-what
- handle: correct_the_time
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: Read the dialogue. Each question contains a wrong time and the reply corrects it. Write one Norwegian cleft for each correction that highlights the correct time.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: A
      text_md: «Kommer gjestene på torsdag?»
    - speaker: B
      text_md: «Nei, gjestene kommer på fredag.»
    - speaker: A
      text_md: «Begynte møtet klokka fem?»
    - speaker: B
      text_md: «Nei, møtet begynte klokka seks.»
    - speaker: A
      text_md: «Arbeider Sigrid best om kvelden?»
    - speaker: B
      text_md: «Nei, Sigrid arbeider best om morgenen.»
  response_language: 'no'
  min_words: 15
  max_words: 45
  judge_prompt: 'Check the response against the task and report evidence for each criterion. Expected responses are: 1. Det er på fredag gjestene kommer. 2. Det var klokka seks møtet begynte. 3. Det er om morgenen Sigrid arbeider best. Accept the taught optional at after a highlighted time expression. Accept equivalent natural wording only when the corrected time remains immediately after det er or det var. Score time focus, not the surrounding event wording.'
  criteria:
  - id: corrected-time-focus
    instruction: Each reply places the corrected day, hour, or part of the day immediately after det er or det var.
  - id: time-correction
    instruction: Each reply identifies the actual time rather than the mistaken time.
  - id: opening-fit
    instruction: Present or current situations use det er, and the completed past situation uses det var.
  derived_from:
  - section_id: highlighting-when
- handle: locate_the_missing_item
