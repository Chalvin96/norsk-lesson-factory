- handle: find_the_highlighted_information
  op: choose
  objective: obj-cleft-sentences-01
  bloom: understand
  prompt_md: Four cleft sentences are shown. Choose the option that gives the correct focus type for each sentence, in order.
  stem_md: Which option gives the correct focus type for sentences 1–4?
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Four cleft sentences from the lesson: 1. Det var Sigrid som hentet stolene. 2. Det var stolene Sigrid hentet. 3. Det var i går Sigrid hentet stolene. 4. Det er Amir som har nøkkelen nå.'
  options:
  - id: mapping-b
    text: '1: ting (stolene); 2: person (Sigrid); 3: tid (i går); 4: person (Amir).'
    correct: false
    why: 'Sentences 1 and 2 have their focus types exchanged: Sigrid is the person in 1 and stolene the thing in 2.'
  - id: mapping-c
    text: '1: person (Sigrid); 2: ting (stolene); 3: tid (i går); 4: ting (nøkkelen).'
    correct: false
    why: Sentence 4 highlights Amir, the person, not nøkkelen.
  - id: mapping-d
    text: '1: person (Sigrid); 2: tid (i går); 3: ting (stolene); 4: person (Amir).'
    correct: false
    why: 'Sentences 2 and 3 have their focus types exchanged: stolene is the thing in 2 and i går the time in 3.'
  - id: mapping-a
    text: '1: person (Sigrid); 2: ting (stolene); 3: tid (i går); 4: person (Amir).'
    correct: true
    why: 'The element right after det var or det er carries the focus: Sigrid in 1, stolene in 2, i går in 3, and Amir in 4.'
  derived_from:
  - section_id: central-meaning-choice
- handle: identify_the_responsible_person
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: At the birthday-dinner preparations two people are blamed wrongly. Read the dialogue, then write one Norwegian cleft sentence for each correction. Highlight the person who actually did the action, keep the action and the time, and follow the highlighted person with som.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lea
      text_md: «Amir dekket bordet i går.»
    - speaker: Sigrid
      text_md: «Nei, jeg dekket bordet i går.»
    - speaker: Morten
      text_md: «Sigrid lager maten nå.»
    - speaker: Amir
      text_md: «Nei, jeg lager maten nå.»
  response_language: 'no'
  min_words: 10
  max_words: 35
  judge_prompt: 'Check the response against the task and report evidence for each criterion. Expected responses are: 1. Det var Sigrid som dekket bordet i går. 2. Det er Amir som lager maten nå. Accept natural equivalent wording only when it keeps the stated actor, action, and time. Each highlighted person must be followed by som. Score person focus primarily; the opening tense must fit the past or present context.'
  criteria:
  - id: actual-person
    instruction: Each correction places the actual person immediately after det var or det er.
  - id: som-link
    instruction: Each highlighted person is followed by som before the action.
  - id: time-fit
    instruction: The completed past action uses det var, and the present action uses det er.
  derived_from:
  - section_id: highlighting-who
- handle: shift_focus_person_to_thing
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: Two people describe what they handled for the dinner. Read the dialogue and write one Norwegian cleft sentence for each speaker that highlights the thing, not the person. Keep the person, the action, and the event.
  stimulus:
