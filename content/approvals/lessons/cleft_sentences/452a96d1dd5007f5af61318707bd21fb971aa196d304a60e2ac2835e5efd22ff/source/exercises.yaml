- handle: match_the_cleft_to_the_question
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: 'Read the dialogue, then answer each question with a separate Bokmål cleft, in this order: 1. Hvem fant nøkkelen? 2. Hva fant Amir? 3. Hvor fant Amir nøkkelen? 4. Når fant Amir nøkkelen? Make only the requested information the focus in each line.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sigrid
      text_md: «Har du sett nøkkelen?»
    - speaker: Amir
      text_md: «Ja, jeg fant den på kjøkkenet i morges.»
  response_language: 'no'
  min_words: 25
  max_words: 65
  judge_prompt: 'Check the response against the task and report evidence for each criterion. Canonical answers are: 1. Det var Amir som fant nøkkelen på kjøkkenet i morges. 2. Det var nøkkelen Amir fant på kjøkkenet i morges. 3. Det var på kjøkkenet Amir fant nøkkelen i morges. 4. Det var i morges Amir fant nøkkelen på kjøkkenet. Accept the taught optional at after the highlighted place or time. Accept natural equivalent wording when each line preserves the event. Score each line only for whether its highlighted element answers its specified question.'
  criteria:
  - id: who-focus
    instruction: The first sentence highlights Amir as the answer to who.
  - id: what-focus
    instruction: The second sentence highlights nøkkelen as the answer to what.
  - id: where-focus
    instruction: The third sentence highlights på kjøkkenet as the answer to where.
  - id: when-focus
    instruction: The fourth sentence highlights i morges as the answer to when.
  derived_from:
  - section_id: one-event-four-possible-focuses
- handle: reconstruct_the_key_search
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: 'Read the dialogue, then answer each question with one separate Bokmål cleft, in this order: 1. Hvem kom på hvor nøkkelen kunne være? 2. Hva fant Amir? 3. Hvor hang jakka? 4. Når trenger Lea stolene? Highlight only the requested information in each line.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sigrid
      text_md: «Jeg kom på hvor nøkkelen kunne være!»
    - speaker: Amir
      text_md: «Jeg fant nøkkelen i jakkelomma.»
    - speaker: Lea
      text_md: «Jakka hang ved døra, og jeg trenger stolene nå.»
  response_language: 'no'
  min_words: 25
  max_words: 65
  judge_prompt: 'Check the response against the task and report evidence for each criterion. Canonical answers are: 1. Det var Sigrid som kom på hvor nøkkelen kunne være. 2. Det var nøkkelen Amir fant i jakkelomma. 3. Det var ved døra jakka hang. 4. Det er nå Lea trenger stolene. Accept the taught optional at after the highlighted place or time. Accept natural equivalent wording when the stated fact is preserved. Score each line only for its requested focus dimension, not for a different highlighted element.'
  criteria:
  - id: who-focus
    instruction: The first line highlights Sigrid as the answer to who.
  - id: what-focus
    instruction: The second line highlights nøkkelen as the answer to what.
  - id: where-focus
    instruction: The third line highlights ved døra as the answer to where.
  - id: when-focus
    instruction: The fourth line highlights nå as the answer to when.
  derived_from:
  - section_id: back-at-the-flat
