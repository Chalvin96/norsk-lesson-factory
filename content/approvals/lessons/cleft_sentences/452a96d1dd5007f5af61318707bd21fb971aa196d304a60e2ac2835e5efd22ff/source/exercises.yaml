- handle: place_the_focus_in_time
  op: write
  objective: obj-cleft-sentences-01
  bloom: apply
  prompt_md: 'Complete both Norwegian cleft sentences by choosing the correct opening form for each blank. 1. Amir has the key now: [BLANK] Amir som har nøkkelen nå. 2. Amir had the key yesterday: [BLANK] Amir som hadde nøkkelen i går.'
  response_language: 'no'
  min_words: 8
  max_words: 25
  judge_prompt: 'Check the response against the task and report evidence for each criterion. Expected full sentences are: 1. Det er Amir som har nøkkelen nå. 2. Det var Amir som hadde nøkkelen i går. Accept capitalization or punctuation variants. Score only the opening form: the current situation requires det er, and the completed past situation requires det var.'
  criteria:
  - id: present-opening
    instruction: The current sentence begins with det er.
  - id: past-opening
    instruction: The completed past sentence begins with det var.
