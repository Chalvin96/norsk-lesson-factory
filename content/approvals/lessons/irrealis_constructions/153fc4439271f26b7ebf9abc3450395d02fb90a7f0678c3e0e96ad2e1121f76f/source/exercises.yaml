- handle: interpret_conditions_in_return_scene
  op: choose
  objective: obj-irrealis-constructions-01
  bloom: analyze
  prompt_md: 'Les vilkårene. Velg tolkningen som passer til alle tre.'
  derived_from:
  - section_id: checkpoint-interpret-conditions-in-return-scene
  stem_md: 'Velg tolkningen som forklarer hva hvert vilkår innebærer.'
  options:
  - id: imagined-now-possible-now-unchangeable-past
    text: '1: en tenkt situasjon nå; 2: en åpen mulighet; 3: en mulighet i fortida
      som ikke ble noe av.'
    correct: false
    why: Vilkår 1 er åpent, mens vilkår 2 bruker fortidsform + ville/kunne.
  - id: possible-now-imagined-now-unchangeable-past
    text: '1: en åpen mulighet; 2: en tenkt situasjon nå; 3: en mulighet i fortida
      som ikke ble noe av.'
    correct: true
    why: Vilkår 1 er åpent, vilkår 2 gjelder en bil som ikke er klar, og vilkår
      3 viser til gårsdagen.
  - id: possible-now-unchangeable-past-imagined-now
    text: '1: en åpen mulighet; 2: en mulighet i fortida som ikke ble noe av; 3: en
      tenkt situasjon nå.'
    correct: false
    why: Vilkår 2 gjelder om bilen er klar nå, mens vilkår 3 handler om
      gårsdagen.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Første vilkår: Hvis det ikke regner fredag, drar vi på tur. Andre
        vilkår: Hvis bilen var klar nå, kunne vi hente deg. Eirik har bil, men den
        står på verksted. Tredje vilkår: Hvis vi hadde reist tidligere i går, ville
        vi ha rukket toget.'
- handle: transfer_irrealis_to_new_situation
  op: write
  objective: obj-irrealis-constructions-01
  bloom: apply
  prompt_md: "Ida bor langt fra konsertlokalet. Hun og Jon kjøpte billettene for sent til å få rabatt. Skriv en dialog på norsk om konserten. Ta med én tenkt situasjon nå eller framover og én situasjon i fortida som ikke ble noe av. Bruk opplysningene om Ida og rabatten."
  min_words: 30
  max_words: 55
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ida
      text_md: «Jeg bor langt fra konsertlokalet, og vi kjøpte billettene for
        sent til å få rabatten.»
    - speaker: Jon
      text_md: «Kanskje vi kan finne en annen løsning neste gang.»
  derived_from:
  - section_id: retrieval-and-transfer
  response_language: 'no'
  judge_prompt: Check the Norwegian dialogue against the task and report
    evidence for every criterion. Accept natural Bokmål forms of present/future
    hypotheses and past counterfactuals, including suitable alternatives with
    kunne. Do not enforce one modal choice where the prompt leaves the meaning
    open.
  criteria:
  - id: concert-context
    instruction: 'Uses the concert situation: one friend currently lives away from
      the venue, and both friends missed the earlier discount because they bought
      tickets late.'
  - id: present-future-hypothesis
    instruction: Includes a natural present or future hypothesis with a
      past-form conditional clause and a fitting result. Accept ville, kunne, or
      another natural modal where the meaning supports it.
  - id: past-counterfactual
    instruction: Includes a contrary-to-fact past condition with hadde + past
      participle and a natural result. Accept a suitable result with ville or
      kunne, with or without ha when Norwegian usage permits.
