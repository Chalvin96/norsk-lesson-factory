  explanation_md: 'Presensformene «har» og «bor» uttrykker reelle forhold. Lina har
    lite tid, og Mats bor langt unna, så fortidsformene markerer de tenkte alternativene.'
  derived_from:
  - section_id: checkpoint-select-would-or-could-result
