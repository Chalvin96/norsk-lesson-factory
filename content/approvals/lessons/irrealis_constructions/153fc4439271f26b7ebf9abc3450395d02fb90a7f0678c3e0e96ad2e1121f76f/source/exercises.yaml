- handle: recognize_hypothetical_distance
  op: choose
  objective: obj-irrealis-constructions-01
  bloom: analyze
  prompt_md: 'Les setningene. Velg gruppen som klassifiserer vilkårene som åpen mulighet,
    tenkt situasjon eller noe som ikke skjedde.'
  derived_from:
  - section_id: checkpoint-recognize-hypothetical-distance
  stem_md: 'Velg gruppen som riktig klassifiserer vilkårene 1, 2 og 3.'
  options:
  - id: distant-open-open
    text: '1: en mer fjern eller uvirkelig situasjon; 2: en åpen mulighet; 3: en åpen
      mulighet'
    correct: false
    why: Vilkår 1 er en åpen mulighet, ikke en tenkt situasjon.
  - id: open-open-distant
    text: '1: en åpen mulighet; 2: en åpen mulighet; 3: en mer fjern eller uvirkelig
      situasjon'
    correct: false
    why: Vilkår 2 beskriver en tenkt situasjon nå, mens vilkår 3 er en åpen
      mulighet.
  - id: open-distant-open
    text: '1: en åpen mulighet; 2: en mer fjern eller uvirkelig situasjon; 3: en åpen
      mulighet'
    correct: true
    why: Vilkår 1 og 3 er åpne muligheter. Vilkår 2 forestiller seg en annen
      situasjon nå.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Vilkår 1: Hvis toget er i rute, rekker vi møtet. Vilkår 2: Hvis jeg
        hadde bil, ville jeg kjøre til hytta. Vilkår 3: Hvis det regner i morgen, tar vi
        bussen.'
