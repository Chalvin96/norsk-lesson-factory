- handle: use_speaker_viewpoint
  op: choose
  objective: obj-directional-vs-locative-adverbs-01
  bloom: analyze
  prompt_md: Choose the conversation that makes both people's points of view clear.
  derived_from:
  - section_id: sec-here-there-viewpoint
  stem_md: Aisha is by the library entrance, and Per is by the fountain on the other side of the square. Aisha asks Per to come to her. Per says where Aisha is from his point of view, and where he is going.
  options:
  - id: location-direction-mismatch
    text: 'Aisha: Jeg venter der ved biblioteket. Kom dit! Per: Du venter her borte. Jeg går hit nå.'
    correct: false
    why: The forms for Aisha's position, her invitation, and Per's destination do not match the speakers' viewpoints.
  - id: consistent-viewpoints
    text: 'Aisha: Jeg venter her ved biblioteket. Kom hit! Per: Du venter der borte. Jeg går dit nå.'
    correct: true
    why: Aisha locates herself where she is and directs Per toward her; Per locates her away from himself and names her place as his destination.
  - id: swapped-directions
    text: 'Aisha: Jeg venter her ved biblioteket. Kom dit! Per: Du venter der borte. Jeg går hit nå.'
    correct: false
    why: Aisha is inviting Per toward her, and Per is going away from his current location toward Aisha; the directional forms are reversed.
