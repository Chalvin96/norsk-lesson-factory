- handle: reconstruct_the_meeting_route
  op: write
  objective: obj-directional-vs-locative-adverbs-01
  bloom: apply
  prompt_md: "A classmate asks where Emil was and where he went next. Write a message in the correct order: Emil was in room 204, went down to the café by the entrance, and then went home. Also say that the café is one floor below the room. Use location and direction adverbs."
  derived_from:
  - section_id: sec-returning-maja-emil
  response_language: "no"
  min_words: 20
  max_words: 45
  judge_prompt: 'Evaluate route-facts, route-order, message-purpose, and place-direction-observation as gating criteria. The response must report positions with location forms and movement with directional forms. Anchors: PASS — «Emil var i rom 204. Så gikk han ned til kafeen, som var nede ved inngangen. Etterpå gikk han hjem.» FAIL route-facts — «Emil var ved kafeen og gikk tilbake til rom 204.» PASS — «Emil var i rom 204. Så gikk han ned til kafeen. Kafeen var nede ved inngangen. Etterpå gikk han hjem.»'
  criteria:
  - id: route-facts
    instruction: The message states that Emil was in room 204, went down to the café, states that the café was downstairs by the entrance, and later went home.
  - id: route-order
    instruction: The events appear in the order supplied in the task.
  - id: message-purpose
    instruction: The response is a Norwegian message to the classmate about Emil's route.
  - id: place-direction-observation
    instruction: The message must use location forms for positions and directional forms for movement; failure on this criterion fails the response.
- handle: transfer_to_a_new_visit
  op: write
  objective: obj-directional-vs-locative-adverbs-01
  bloom: apply
  prompt_md: "Ida is outside a music school. Per is in the practice room on the second floor. Ida asks which entrance to use and which floor he is on. She goes in and upstairs to him. Later, they go downstairs, out of the building, and to the bus stop. Write the message exchange. Use location adverbs for places and direction adverbs for movement, and keep track of who is speaking."
  derived_from:
  - section_id: sec-transfer-new-visit
  response_language: "no"
  min_words: 25
  max_words: 60
  judge_prompt: Evaluate whether the exchange asks for the entrance and floor, communicates Ida’s route inside and upstairs, and confirms their later trip to the bus stop. Check natural location-versus-direction forms and speaker viewpoint; accept coherent Bokmål wording without requiring fixed expressions.
  criteria:
  - id: visit-question
    instruction: The exchange includes Ida asking Per which entrance to use and which floor he is on.
  - id: arrival-route
    instruction: The exchange communicates that Ida enters the building and reaches Per on the second floor.
  - id: later-plan
    instruction: The exchange communicates that they later leave the building and head to the bus stop.
  - id: exchange-purpose
    instruction: The response is a Norwegian text-message exchange that helps Ida arrive and confirms the later plan.
  - id: place-direction-observation
    instruction: Report whether location forms describe positions and directional forms describe movement; incorrect forms fail the response.
  - id: viewpoint-observation
    instruction: Report whether any her/hit and der/dit forms are consistent with each speaker's viewpoint; inconsistent forms fail the response.
