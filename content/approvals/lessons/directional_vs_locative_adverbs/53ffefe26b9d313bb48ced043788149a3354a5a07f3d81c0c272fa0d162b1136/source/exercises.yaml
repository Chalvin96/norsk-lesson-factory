- handle: reconstruct_the_meeting_route
  op: write
  objective: obj-directional-vs-locative-adverbs-01
  bloom: apply
  prompt_md: 'Situation: A classmate missed the meeting and asks where Emil was and where he went. Facts:
    Emil was in room 204; he went down to the café; the café was downstairs by the entrance; afterward
    he went home. Audience: your classmate. Purpose: send a 20–45-word Norwegian message that reports
    the route in order, using location forms for positions and directional forms for movement.'
  derived_from:
  - section_id: sec-returning-maja-emil
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: 'Evaluate route-facts, route-order, message-purpose, and place-direction-observation as
    gating criteria. The response must report positions with location forms and movement with directional
    forms. Anchors: PASS — «Emil var i rom 204. Så gikk han ned til kafeen, som var nede ved inngangen.
    Etterpå gikk han hjem.» FAIL route-facts — «Emil var ved kafeen og gikk tilbake til rom 204.» PASS
    — «Emil var i rom 204. Så gikk han ned til kafeen. Kafeen var nede ved inngangen. Etterpå gikk han
    hjem.»'
  criteria:
  - id: route-facts
    instruction: The message states that Emil was in room 204, went down to the café, states that the
      café was downstairs by the entrance, and later went home.
  - id: route-order
    instruction: The events appear in the order supplied in the task.
  - id: message-purpose
    instruction: The response is a Norwegian message to the classmate about Emil's route.
  - id: place-direction-observation
    instruction: The message must use location forms for positions and directional forms for movement;
      failure on this criterion fails the response.
- handle: transfer_to_a_new_visit
  op: write
  objective: obj-directional-vs-locative-adverbs-01
  bloom: apply
  prompt_md: 'Situation: Nora is outside Henrik''s block; Henrik is inside in his third-floor flat; Nora
    does not know the entrance or floor, so she asks Henrik where the entrance is and which floor he is
    on; Nora enters and goes upstairs; later they go downstairs, leave the building, and go to Nora''s
    home. Audience: Henrik and Nora in a text-message exchange. Purpose: write a 25–60-word Norwegian
    exchange that helps Nora arrive and confirms their later plan, using location forms for positions
    and directional forms for movement.'
  derived_from:
  - section_id: sec-transfer-new-visit
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: 'Evaluate visit-question, arrival-route, later-plan, exchange-purpose, place-direction-observation,
    and viewpoint-observation as gating criteria. Anchors: PASS — «Nora: Hvor er inngangen? Henrik: Den
    er ved butikken. Nora: Hvilken etasje er du i? Henrik: Jeg er oppe i tredje etasje. Kom hit! Nora:
    Nå går jeg inn og opp til deg i tredje etasje. Senere går vi ned, ut og hjem til meg.» FAIL arrival-route
    — «Nora: Jeg venter hjemme. Henrik: Vi møtes i morgen.» FAIL place-direction-observation — «Nora:
    Hvor er inngangen? Henrik: Den er ved butikken. Nora: Hvilken etasje er du i? Henrik: Jeg er oppe
    i tredje etasje. Kom hit! Nora: Jeg er inne og oppe.» FAIL viewpoint-observation — «Nora: Hvor er
    inngangen? Henrik: Den er ved butikken. Nora: Hvilken etasje er du i? Henrik: Jeg er oppe i tredje
    etasje. Kom dit! Nora: Nå går jeg inn og opp. Senere går vi ned, ut og hjem til meg.»'
  criteria:
  - id: visit-question
    instruction: The exchange includes Nora asking Henrik where the entrance is and which floor he is
      on, as the visible task requires.
  - id: arrival-route
    instruction: The exchange communicates that Nora enters the building and reaches Henrik on the third
      floor.
  - id: later-plan
    instruction: The exchange communicates that they later leave the building and go to Nora's home.
  - id: exchange-purpose
    instruction: The response is a Norwegian text-message exchange that helps Nora arrive and confirms
      the later plan.
  - id: place-direction-observation
    instruction: Report whether location forms describe positions and directional forms describe movement;
      incorrect forms fail the response.
  - id: viewpoint-observation
    instruction: Report whether her/hit and der/dit are consistent with each speaker's viewpoint; inconsistent
      forms fail the response.
