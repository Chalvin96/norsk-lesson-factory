- handle: identify_broad_evaluations
  op: categorize
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: analyze
  prompt_md: Sort each Norwegian statement into General worth or Practical payoff. Choose the bucket that
    matches the meaning of the statement.
  buckets:
  - bucket_id: general-worth
    label: General worth
  - bucket_id: practical-payoff
    label: Practical payoff
  items:
  - item_id: broad-1
    text: Den nye forestillingen gjorde kvelden minneverdig.
    bucket_id: general-worth
  - item_id: practical-1
    text: Forhåndskjøpet sparte familien flere hundre kroner.
    bucket_id: practical-payoff
  - item_id: broad-2
    text: Romanen ga leseren noe å tenke på lenge etterpå.
    bucket_id: general-worth
  - item_id: practical-2
    text: Direkteruten kutter reisetida med en halvtime.
    bucket_id: practical-payoff
  - item_id: broad-3
    text: Turen langs fjorden ga oss en utsikt vi fortsatt snakker om.
    bucket_id: general-worth
  - item_id: practical-3
    text: Ved å samle bestillingen fikk gruppa lavere fraktkostnad.
    bucket_id: practical-payoff
  explanation_md: Verdt å gives a broad evaluation of worth; lønne seg describes a practical payoff for
    the subject.
  derived_from:
  - section_id: general-worth-verdt-a
- handle: find_practical_advantage
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: Imagine you are giving advice to a friend. For each situation, write one short sentence in
    Norwegian stating the concrete practical advantage. Use the expression «lønner seg» in every sentence.
    Do not give only a general evaluation such as saying that the action is pleasant or interesting. 1.
    Book train tickets several weeks before departure instead of at the last minute. 2. Compare prices
    at several shops before buying the same item. 3. Take a direct bus instead of a route with changes.
    4. Buy several items together when a shop offers a lower total price for the group.
  response_language: 'no'
  min_words: 20
  max_words: 70
  judge_prompt: Check each sentence against its situation and report evidence for the criterion. Accept
    natural Bokmål variants when they clearly name a concrete benefit or saving and use the expression
    «lønner seg».
  criteria:
  - id: concrete-practical-payoff
    instruction: For all four situations, uses the expression «lønner seg» and states a concrete benefit
      or saving such as money, time, fewer problems, or a better result rather than only pleasure or interest.
  derived_from:
  - section_id: practical-payoff-lonne-seg
- handle: choose_according_to_reason
  op: choose
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: analyze
  prompt_md: 'Choose the pair that completes the two reasons in order. The action is taking a detour.
    Reason one is broad: the view is beautiful, so the experience deserves the effort. Reason two is practical:
    the detour helps avoid traffic.'
  stem_md: Choose the Norwegian pair that matches the two reasons.
  options:
  - id: payoff-then-worth
    text: Det lønner seg å ta en omvei fordi utsikten er vakker. Det er verdt å ta en omvei fordi du unngår
      kø.
    correct: false
    why: 'The reasons are switched: the beautiful view is a broad experience, while avoiding traffic is
      the practical benefit.'
  - id: worth-then-payoff
    text: Det er verdt å ta en omvei fordi utsikten er vakker. Det lønner seg å ta en omvei fordi du unngår
      kø.
    correct: true
    why: The first sentence presents a beautiful view as general worth; the second presents avoiding traffic
      as practical payoff.
  derived_from:
  - section_id: either-expression
