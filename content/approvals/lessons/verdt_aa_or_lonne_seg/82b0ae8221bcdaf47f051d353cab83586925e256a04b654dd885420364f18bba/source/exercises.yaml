- handle: repair_meaning_and_form
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: analyze
  prompt_md: 'Repair both recommendations in natural Norwegian, keeping each action and reason. 1. Booking
    early gets cheaper tickets: «Det lønner å bestille tidlig fordi billettene koster mindre.» Restore the
    incomplete practical-payoff expression. 2. Getting up early gives a beautiful sunrise: «Det lønner seg
    å stå opp tidlig fordi soloppgangen er vakker.» Rewrite the second sentence so its expression matches
    the broad experience. You may change the wording as needed.'
  response_language: 'no'
  min_words: 15
  max_words: 50
  judge_prompt: 'Evaluate both repairs against the stated meaning. Accept natural Norwegian alternatives
    that correctly restore the reflexive form in the first sentence and use an appropriate broad-worth frame
    in the second; do not require a single exact wording.'
  criteria:
  - id: practical-form-repair
    instruction: The first recommendation uses a complete practical-payoff expression with seg and retains
      the lower-price reason for booking early.
  - id: broad-worth-repair
    instruction: The second recommendation uses a natural expression of broad worth, such as verdt å, and
      retains the beautiful-sunrise experience as its reason.
  - id: word-bound
    instruction: The response contains 15–50 words.
  derived_from:
  - section_id: common-mistakes
- handle: guided_application_decisions
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: Write a recommendation to Jonas and Selma for each development. Use one target expression
    in each response and include a brief reason. 1. Advance tickets are discounted when bought early.
    2. The restaurant is excellent but far away. 3. The slower route has beautiful scenery. 4. A travel
    card covers several journeys.
  response_language: 'no'
  min_words: 30
  max_words: 80
  judge_prompt: Check each recommendation against its development and report evidence for each criterion.
    Accept natural Bokmål variants with the required target expression and a clear reason.
  criteria:
  - id: broad-worth-experiences
    instruction: Uses verdt å for the excellent distant restaurant and the scenic slow route, with a reason
      showing quality or experience.
  - id: practical-benefit-actions
    instruction: Uses lønner seg for the discounted advance tickets and the travel card, with a reason
      showing a measurable advantage.
  derived_from:
  - section_id: guided-application
- handle: revise_dual_interpretations
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: 'Write two sentences in Norwegian for a travel blog about the same action: getting up early.
    In the first sentence, the reason is that the roads are quieter and traffic is easier; use the practical-payoff
    expression. In the second sentence, the reason is that the sunrise over the fjord is beautiful; use
    the general-worth expression. Keep the action constant and include the reason in each sentence.'
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check both sentences for the same action, the requested reason, the matching target expression,
    and natural Norwegian. Report evidence for each criterion and accept natural Bokmål variants.
  criteria:
  - id: constant-action
    instruction: Keeps getting up early as the same action in both sentences.
  - id: reason-matched-expressions
    instruction: Uses lønner seg for the practical traffic reason and verdt å for the broad sunrise experience,
      with both sentences written in natural Norwegian.
  derived_from:
  - section_id: guided-application
- handle: retrieval_and_review
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: 'Write a short review for a language learning app. Without looking back, write in Norwegian.
    Write one sentence recommending an experience with verdt å and a short general-worth reason. Write
    one sentence recommending a practical action with lønner seg and a short concrete-benefit reason.
    Finally, write two versions of one question about the practical action: use verdt å with a broad reason
    and lønner seg with a practical reason. Add a short reason to each sentence.'
  response_language: 'no'
  min_words: 35
  max_words: 80
  judge_prompt: Vurder alle anbefalingene og begge spørsmålsversjonene opp mot oppgaven. Rapporter belegg
    for hvert kriterium, og godta naturlige bokmålsvarianter som tydelig beholder det tilsiktede skillet.
  criteria:
  - id: experience-recommendation
    instruction: The experience recommendation uses verdt å and gives a short general-worth reason.
  - id: practical-recommendation
    instruction: The practical-action recommendation uses lønner seg and gives a short concrete-benefit
      reason.
  - id: dual-question-forms
    instruction: The practical action appears in both question versions, with verdt å for the broad reason
      and lønner seg for the practical reason.
  - id: clear-reasons
    instruction: Each sentence includes a short reason that makes its intended framing clear.
  derived_from:
  - section_id: retrieval-and-review
