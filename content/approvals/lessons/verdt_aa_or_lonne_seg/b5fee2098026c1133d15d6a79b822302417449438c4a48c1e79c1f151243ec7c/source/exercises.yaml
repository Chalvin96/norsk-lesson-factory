- handle: repair_meaning_and_form
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: analyze
  prompt_md: "Rett begge rådene på naturlig norsk, og behold handling og grunn. 1. Tidlig bestilling gir billigere billetter: «Det lønner å bestille tidlig fordi billettene koster mindre.» Rett uttrykket for praktisk nytte. 2. Du får se en vakker soloppgang hvis du står opp tidlig: «Det lønner seg å stå opp tidlig fordi soloppgangen er vakker.» Skriv setningen om slik at uttrykket passer til den generelle opplevelsen."
  response_language: 'no'
  min_words: 15
  max_words: 50
  judge_prompt: 'Evaluate both repairs against the stated meaning. Accept natural Norwegian alternatives that correctly restore the reflexive form in the first sentence and use an appropriate broad-worth frame in the second; do not require a single exact wording.'
  criteria:
  - id: practical-form-repair
    instruction: The first recommendation uses a complete practical-payoff expression with seg and retains the lower-price reason for booking early.
  - id: broad-worth-repair
    instruction: The second recommendation uses a natural expression of broad worth, such as verdt å, and retains the beautiful-sunrise experience as its reason.
  - id: word-bound
    instruction: The response contains 15–50 words.
  derived_from:
  - section_id: common-mistakes
- handle: guided_application_decisions
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: "Gi Jonas og Selma ett råd for hver situasjon. Bruk ett av måluttrykkene og ta med en kort grunn. 1. Forhåndsbilletter er billigere. 2. Restauranten er svært god, men ligger langt unna. 3. Den langsommere ruta har vakker utsikt. 4. Reisekortet dekker flere reiser."
  response_language: 'no'
  min_words: 30
  max_words: 80
  judge_prompt: Check each recommendation against its development and report evidence for each criterion. Accept natural Bokmål variants with the required target expression and a clear reason.
  criteria:
  - id: broad-worth-experiences
    instruction: Uses verdt å for the excellent distant restaurant and the scenic slow route, with a reason showing quality or experience.
  - id: practical-benefit-actions
    instruction: Uses lønner seg for the discounted advance tickets and the travel card, with a reason showing a measurable advantage.
  derived_from:
  - section_id: guided-application
- handle: revise_dual_interpretations
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: "Skriv to setninger til en reiseblogg om å sykle til jobben. Ta med to grunner: Du kan unngå kø, og du får en hyggelig tur langs fjorden. Behold samme handling i begge setningene, og ta med én grunn i hver."
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Check both sentences for the same action, the requested reason, the matching target expression, and natural Norwegian. Report evidence for each criterion and accept natural Bokmål variants.
  criteria:
  - id: constant-action
    instruction: Keeps cycling to work as the same action in both sentences.
  - id: reason-matched-expressions
    instruction: Uses lønner seg for the practical benefit of avoiding traffic and verdt å for the broadly enjoyable fjord-side ride, with both sentences written in natural Norwegian.
  derived_from:
  - section_id: guided-application
- handle: retrieval_and_review
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: "Skriv en kort anmeldelse for en språklæringsapp uten å se på eksemplene. Skriv på norsk: én setning som anbefaler en opplevelse med verdt å og en generell grunn; én setning som anbefaler en praktisk handling med lønner seg og en konkret fordel; og to spørsmål om den praktiske handlingen, ett med verdt å og en generell grunn, og ett med lønner seg og en praktisk grunn."
  response_language: 'no'
  min_words: 35
  max_words: 80
  judge_prompt: Vurder alle anbefalingene og begge spørsmålsversjonene opp mot oppgaven. Rapporter belegg for hvert kriterium, og godta naturlige bokmålsvarianter som tydelig beholder det tilsiktede skillet.
  criteria:
  - id: experience-recommendation
    instruction: The experience recommendation uses verdt å and gives a short general-worth reason.
  - id: practical-recommendation
    instruction: The practical-action recommendation uses lønner seg and gives a short concrete-benefit reason.
  - id: dual-question-forms
    instruction: The practical action appears in both question versions, with verdt å for the broad reason and lønner seg for the practical reason.
  - id: clear-reasons
    instruction: Each sentence includes a short reason that makes its intended framing clear.
  derived_from:
  - section_id: retrieval-and-review
