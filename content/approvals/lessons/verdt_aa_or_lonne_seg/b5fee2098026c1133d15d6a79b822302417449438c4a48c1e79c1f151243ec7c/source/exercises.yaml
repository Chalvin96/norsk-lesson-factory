- handle: find_practical_advantage
  op: write
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: apply
  prompt_md: "Tenk deg at du gir en venn råd. Skriv én kort setning på norsk for hvert punkt, og forklar den konkrete praktiske fordelen. Bruk uttrykket «lønner seg» hver gang. 1. Bestill togbilletter flere uker før avreise i stedet for i siste liten. 2. Sammenlign priser i flere butikker før du kjøper den samme varen. 3. Ta en direktebuss i stedet for en rute med bytte. 4. Kjøp flere varer sammen når butikken gir lavere samlet pris."
  response_language: 'no'
  min_words: 20
  max_words: 70
  judge_prompt: Check each sentence against its situation and report evidence for the criterion. Accept natural Bokmål variants when they clearly name a concrete benefit or saving and use the expression «lønner seg».
  criteria:
  - id: concrete-practical-payoff
    instruction: For all four situations, uses the expression «lønner seg» and states a concrete benefit or saving such as money, time, fewer problems, or a better result rather than only pleasure or interest.
  derived_from:
  - section_id: practical-payoff-lonne-seg
- handle: choose_according_to_reason
  op: choose
  objective: obj-verdt-aa-or-lonne-seg-01
  bloom: analyze
  prompt_md: 'Velg paret som passer til grunnene i riktig rekkefølge. Først får du se en vakker utsikt ved å ta omveien. Deretter er omveien praktisk fordi den gjør at du unngår kø.'
  stem_md: "Velg det norske setningsparet som passer til grunnene."
  options:
  - id: payoff-then-worth
    text: Det lønner seg å ta en omvei fordi utsikten er vakker. Det er verdt å ta en omvei fordi du unngår kø.
    correct: false
    why: 'Grunnene er byttet om: Den vakre utsikten er en god opplevelse, mens det å unngå kø er en praktisk fordel.'
  - id: worth-then-payoff
    text: Det er verdt å ta en omvei fordi utsikten er vakker. Det lønner seg å ta en omvei fordi du unngår kø.
    correct: true
    why: Den første setningen viser at utsikten gjør omveien til en fin opplevelse. Den andre viser den praktiske fordelen ved å unngå kø.
  derived_from:
  - section_id: either-expression
