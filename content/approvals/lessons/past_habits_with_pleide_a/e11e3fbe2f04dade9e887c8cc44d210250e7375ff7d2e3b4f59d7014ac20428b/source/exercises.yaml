- handle: notice_routine_and_event
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: understand
  prompt_md: "Velg tolkningen som passer til dialogen."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Da jeg bodde her, pleide jeg å sykle langs elva hver morgen.»
    - speaker: Jonas
      text_md: «Du pleide å vente på meg ved den gamle brua.»
    - speaker: Maja
      text_md: «Vi pleide å kjøpe is etter skolen også.»
    - speaker: Maja
      text_md: «I går syklet jeg langs elva igjen og kjøpte en is.»
  options:
  - id: all-routines
    text: All four activities are former routines that Maja used to repeat regularly.
    correct: false
    why: The last line places the cycling and the ice-cream purchase on one specific day, «i går», not
      in a recurring past period.
  - id: correct
    text: The three childhood activities are former routines, while yesterday's cycling and ice-cream
      purchase are finished events from one visit.
    correct: true
    why: «Pleide å» marks the repeated childhood activities, and «i går» reports one finished visit.
  - id: all-events
    text: All four activities are single finished events, three from childhood and one from yesterday.
    correct: false
    why: The first three lines use «pleide å», which presents repeated childhood habits rather than one-off
      events.
  derived_from:
  - section_id: back-in-the-old-neighborhood
