- handle: choose_past_habit_or_finished_event
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: understand
  prompt_md: "Velg paret som passer til begge situasjonene."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Emil
      text_md: «Var kaffebaren et fast stopp på vei til jobb før?»
    - speaker: Sara
      text_md: «Ja, hver arbeidsdag i flere år.»
    - speaker: Emil
      text_md: «Hva med i morges?»
    - speaker: Sara
      text_md: «Da ble det to kopper kaffe.»
  options:
  - id: ordinary-past-for-both
    text: «En dag kjøpte Sara kaffe på vei til jobb. I morges kjøpte Sara to kopper kaffe.»
    correct: false
    why: Den første setningen beskriver én bestemt anledning, ikke en gjentatt vane.
  - id: pleide-for-both
    text: «Sara pleide å kjøpe kaffe på vei til jobb. I morges pleide Sara å kjøpe to kopper kaffe.»
    correct: false
    why: Den andre setningen gjelder én bestemt morgen, så den kan ikke uttrykke en etablert vane.
  - id: correct
    text: «Sara pleide å kjøpe kaffe på vei til jobb. I morges kjøpte Sara to kopper kaffe.»
    correct: true
    why: Den første setningen beskriver en vane som gjentok seg i en tidligere periode, mens den andre
      forteller hva som skjedde i morges.
  derived_from:
  - section_id: a-former-evening-habit-and-one-evening
- handle: test_the_habit_boundary
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: "Velg paret som skiller mellom en handling som skjedde flere ganger i går og en gammel vane."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: I går ringte jeg mamma tre ganger mens jeg flyttet. Da jeg var barn, ringte
        jeg bestefar hver søndag i flere år.
  options:
  - id: event-then-habit
    text: «I går flyttet jeg og ringte mamma flere ganger. Bestefar fikk telefon fra meg hver søndag i barndommen.»
    correct: true
    why: Meldingene om gårsdagen beskriver én avgrenset dag, mens søndagstelefonene var en tidligere rutine.
  - id: habit-then-event
    text: «I går pleide jeg å ringe mamma tre ganger. Før ringte jeg bestefar hver søndag.»
    correct: false
    why: Pleide å wrongly treats the three calls yesterday as a former routine.
  - id: two-habits
    text: «I går pleide jeg å ringe mamma tre ganger. Før pleide jeg å ringe bestefar hver søndag.»
    correct: false
    why: The Sunday calls were a routine; yesterday's calls were one finished occasion.
  - id: present-then-habit
    text: «I går ringer jeg mamma tre ganger. Før pleide jeg å ringe bestefar hver søndag.»
    correct: false
    why: The calls yesterday need a past-tense report.
  explanation_md: "At en handling gjentas én dag, gjør den ikke automatisk til en gammel vane. En aktivitet hver søndag over flere år beskriver en rutine."
  derived_from:
  - section_id: more-than-once-does-not-always-mean-a-habit
