  - token_id: tok-7
    text: skolen.
  error_token_id: tok-4
  feedback: "Etter «pleide å» bruker vi infinitiv: «gå». «Pleide» viser allerede til fortiden."
  derived_from:
  - section_id: keep-the-next-verb-in-the-infinitive
- handle: continue_maja_and_jonas_memory
  op: write
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: "Skriv et svar fra Maja til Jonas. Fortell hva de pleide å gjøre om sommeren, ta med at Jonas som regel hadde med saft, og skill rutinene fra den ene sykkelturen Maja hadde i går."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Husker du somrene ved innsjøen?»
    - speaker: Context
      text_md: "Da de var barn, syklet Maja og Jonas ofte til innsjøen om sommeren. Jonas tok som regel med saft."
    - speaker: Jonas
      text_md: «Kom du forbi innsjøen i går?»
    - speaker: Context
      text_md: Maja syklet én gang forbi innsjøen i går.
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: Evaluate childhood-cycling, childhood-lemonade, yesterday-ride, and contrast-forms as
    gating criteria. Accept natural Norwegian wording that reports the two old routines, using «pleide
    å» for at least one of them, and yesterday's single ride with ordinary past tense.
  criteria:
  - id: childhood-cycling
    instruction: Reports that Maja and Jonas regularly cycled to the lake in childhood summers.
  - id: childhood-lemonade
    instruction: Reports that Jonas usually brought saft on those trips.
  - id: yesterday-ride
    instruction: Reports that Maja syklet én gang forbi innsjøen i går.
  - id: contrast-forms
    instruction: Uses pleide å with infinitive for at least one former routine and a natural past-tense
      form for yesterday's single event; the other routine may use pleide å or a natural habitual past
      such as «som regel» with a preteritum form.
  derived_from:
  - section_id: returning-to-maja-and-jonas
- handle: retrieve_and_transfer_old_neighborhood
  op: write
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: "Skriv en melding fra Henrik til Nora med egne ord. Ta med rutinene fra studenttida: Han tok bussen til campus hver ukedag, spiste suppe på studentkafeen på fredager, leste på biblioteket hver kveld og spilte sjakk med Ali etterpå. Bruk «pleide å» minst én gang om en rutine; uttrykk de andre rutinene naturlig. Fortell også at han gikk til campus én gang i dag."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Henrik har kommet tilbake til det gamle studentstrøket sitt og skriver til venninnen Nora.
  response_language: 'no'
  min_words: 45
  max_words: 70
  judge_prompt: "Check criteria recurring-habits, finished-event, independent-transfer, event-form-observation, and comprehensibility as gating criteria. Accept natural Bokmål variants and report evidence for every criterion id."
  criteria:
  - id: recurring-habits
    instruction: The message presents all four supplied activities as recurring routines from Henrik's student years. It uses «pleide å» followed by an infinitive for at least one routine; the others may use «pleide å» or natural habitual past-tense wording.
  - id: finished-event
    instruction: The message reports Henrik's single walk to campus during today's visit.
  - id: independent-transfer
    instruction: The response uses the learner's own wording and does not copy a complete sentence from
      the lesson.
  - id: comprehensibility
    instruction: The distinction between Henrik's former routines and today's visit is understandable.
  - id: event-form-observation
    instruction: The message expresses today's single finished action with an ordinary past-tense form,
      not «pleide å».
  derived_from:
  - section_id: final-retrieval-and-transfer
- handle: review_habit_or_finished_event
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: "Velg meldingen som passer til begge opplysningene."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lars
      text_md: «Hva var Idas faste rutine før i tiden?»
    - speaker: Ragnhild
      text_md: «Hun tok en svømmetur hver mandag før undervisningen.»
    - speaker: Lars
      text_md: «Og hva skjedde sist mandag?»
    - speaker: Ragnhild
      text_md: «Da svømte hun over innsjøen for første gang.»
  options:
  - id: routine-for-event
    text: «Ida pleide å svømme før skolen hver mandag. Sist mandag pleide hun å krysse innsjøen én gang.»
    correct: false
    why: A single dated lake crossing is not an established past routine.
  - id: correct
    text: «Ida pleide å svømme før skolen hver mandag. Sist mandag svømte hun over innsjøen én gang.»
    correct: true
    why: The weekly activity is a former routine, while the lake crossing is one finished event.
  - id: swap-facts
    text: «Ida pleide å krysse innsjøen hver mandag i skoleårene. Sist mandag svømte hun én gang før skolen.»
    correct: false
    why: 'This swaps the two facts: the weekly school-year routine was the morning swim, while the lake
      crossing happened once, last Monday.'
  derived_from:
  - section_id: final-retrieval-and-transfer
- handle: review_pleide_a_infinitive
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: "Velg svaret med riktig verbform."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hva gjorde dere vanligvis hos bestemor om sommeren?»
    - speaker: Context
      text_md: De besøkte henne hver uke.
  options:
  - id: past-after-a
    text: «Vi pleide å besøkte henne hver uke.»
    correct: false
    why: The second verb cannot remain in the past tense because «pleide» already carries the past meaning.
  - id: missing-a
    text: «Vi pleide besøke henne hver uke.»
    correct: false
    why: The taught construction requires the infinitive marker between «pleide» and the infinitive.
  - id: correct
    text: «Vi pleide å besøke henne hver uke.»
    correct: true
    why: The construction contains «pleide», the infinitive marker «å», and the infinitive «besøke».
  derived_from:
  - section_id: keep-the-next-verb-in-the-infinitive
