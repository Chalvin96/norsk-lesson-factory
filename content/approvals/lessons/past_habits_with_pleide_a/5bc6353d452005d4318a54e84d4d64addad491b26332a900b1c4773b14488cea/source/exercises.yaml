- handle: retrieve_and_transfer_old_neighborhood
  op: write
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: Write a 45–70-word Norwegian message from Henrik to Nora in your own wording without copying
    a lesson sentence. Recall all four student routines—taking the bus to campus every weekday, eating
    soup in the student café on Fridays, studying at the library every evening, and playing chess with
    Ali afterward—and report that Henrik walked to campus once today. Also explain in Norwegian why «pleide
    å» fits the recurring routines but not today's single finished event.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Henrik har kommet tilbake til det gamle studentstrøket sitt og skriver til venninnen Nora.
  response_language: 'no'
  min_words: 45
  max_words: 70
  judge_prompt: Check criteria recurring-habits, finished-event, contrast-explanation, independent-transfer,
    genre-and-length, event-form-observation, and comprehensibility as gating criteria. Accept natural
    Bokmål variants and report evidence for every criterion id.
  criteria:
  - id: recurring-habits
    instruction: The message presents all four supplied activities as recurring routines from Henrik's
      student years and expresses each routine with «pleide å» followed by an infinitive.
  - id: finished-event
    instruction: The message reports Henrik's single walk to campus during today's visit.
  - id: contrast-explanation
    instruction: The response explains in Norwegian why «pleide å» fits the recurring routines but not
      today's single finished event.
  - id: independent-transfer
    instruction: The response uses the learner's own wording and does not copy a complete sentence from
      the lesson.
  - id: genre-and-length
    instruction: The response is a Norwegian message to Nora containing 45–70 words.
  - id: comprehensibility
    instruction: The distinction between Henrik's former routines and today's visit is understandable.
  - id: event-form-observation
    instruction: The message expresses today's single finished action with an ordinary past-tense form,
      not «pleide å».
  derived_from:
  - section_id: final-retrieval-and-transfer
- handle: review_habit_or_finished_event
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: Choose the report that matches both facts.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lars
      text_md: «Hva var Idas faste rutine før i tiden?»
    - speaker: Ragnhild
      text_md: «Hun tok en svømmetur hver mandag før undervisningen.»
    - speaker: Lars
      text_md: «Og hva skjedde sist mandag?»
    - speaker: Ragnhild
      text_md: «Da svømte hun over innsjøen for første gang.»
  options:
  - id: routine-for-event
    text: «Ida pleide å svømme før skolen hver mandag. Sist mandag pleide hun å krysse innsjøen én gang.»
    correct: false
    why: A single dated lake crossing is not an established past routine.
  - id: correct
    text: «Ida pleide å svømme før skolen hver mandag. Sist mandag svømte hun over innsjøen én gang.»
    correct: true
    why: The weekly activity is a former routine, while the lake crossing is one finished event.
  - id: swap-facts
    text: «Ida pleide å krysse innsjøen hver mandag i skoleårene. Sist mandag svømte hun én gang før skolen.»
    correct: false
    why: 'This swaps the two facts: the weekly school-year routine was the morning swim, while the lake
      crossing happened once, last Monday.'
  derived_from:
  - section_id: final-retrieval-and-transfer
- handle: review_pleide_a_infinitive
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: apply
  prompt_md: Choose the well-formed reply.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hva gjorde dere vanligvis hos bestemor om sommeren?»
    - speaker: Context
      text_md: They visited her every week.
  options:
  - id: past-after-a
    text: «Vi pleide å besøkte henne hver uke.»
    correct: false
    why: The second verb cannot remain in the past tense because «pleide» already carries the past meaning.
  - id: missing-a
    text: «Vi pleide besøke henne hver uke.»
    correct: false
    why: The taught construction requires the infinitive marker between «pleide» and the infinitive.
  - id: correct
    text: «Vi pleide å besøke henne hver uke.»
    correct: true
    why: The construction contains «pleide», the infinitive marker «å», and the infinitive «besøke».
  derived_from:
  - section_id: keep-the-next-verb-in-the-infinitive
