- handle: choose_past_habit_or_finished_event
  op: choose
  objective: obj-past-habits-with-pleide-a-01
  bloom: understand
  prompt_md: Choose the pair that matches both situations.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Emil
      text_md: «Var kaffebaren et fast stopp på vei til jobb før?»
    - speaker: Sara
      text_md: «Ja, hver arbeidsdag i flere år.»
    - speaker: Emil
      text_md: «Hva med i morges?»
    - speaker: Sara
      text_md: «Da ble det to kopper kaffe.»
  options:
  - id: ordinary-past-for-both
    text: «En dag kjøpte Sara kaffe på vei til jobb. I morges kjøpte Sara to kopper kaffe.»
    correct: false
    why: Den første setningen beskriver én bestemt anledning, ikke en gjentatt vane.
  - id: pleide-for-both
    text: «Sara pleide å kjøpe kaffe på vei til jobb. I morges pleide Sara å kjøpe to kopper kaffe.»
    correct: false
    why: Den andre setningen gjelder én bestemt morgen, så den kan ikke uttrykke en etablert vane.
  - id: correct
    text: «Sara pleide å kjøpe kaffe på vei til jobb. I morges kjøpte Sara to kopper kaffe.»
    correct: true
    why: Den første setningen beskriver en vane som gjentok seg i en tidligere periode, mens den andre
      forteller hva som skjedde i morges.
  derived_from:
  - section_id: a-former-evening-habit-and-one-evening
