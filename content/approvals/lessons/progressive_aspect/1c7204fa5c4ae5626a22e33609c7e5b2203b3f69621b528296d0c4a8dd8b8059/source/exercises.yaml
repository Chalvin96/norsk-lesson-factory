- handle: review_repair_mixed_activity_frames
  op: choose
  objective: obj-progressive-aspect-01
  bloom: analyze
  prompt_md: Choose the corrected reply.
  derived_from:
  - section_id: back-at-quiz-night
  stem_md: Ida asks, «Hva gjorde du mens jeg var ute?» Jonas was sitting at his desk and sorting photographs.
  options:
  - id: wrong-connector
    text: Mens du var ute, satt jeg å sorterte bildene.
    correct: false
    why: A posture frame joins two tense-marked verbs with og, not å.
  - id: wrong-activity-tense
    text: Mens du var ute, satt jeg og sorterer bildene.
    correct: false
    why: The past reference point requires the activity verb to be in the past as well.
  - id: infinitive-after-og
    text: Mens du var ute, satt jeg og sortere bildene.
    correct: false
    why: The activity verb after og must carry tense rather than remain an infinitive.
  - id: corrected-posture-frame
    text: Mens du var ute, satt jeg og sorterte bildene.
    correct: true
    why: Sto and ventet are both past forms joined by og.
  explanation_md: A past posture frame uses og between two past-tense verbs, here satt and sorterte.
