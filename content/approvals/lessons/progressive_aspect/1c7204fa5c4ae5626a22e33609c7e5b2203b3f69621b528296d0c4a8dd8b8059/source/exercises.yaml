- handle: notice_ongoing_focus
  op: choose
  objective: obj-progressive-aspect-01
  bloom: understand
  prompt_md: Choose the interpretation that matches the contrast.
  derived_from:
  - section_id: main-meaning-choice
  stem_md: At seven o’clock, Jonas says either «Jeg lagde kaffe» or «Jeg holdt på å lage kaffe». What
    contrast does the activity frame express?
  options:
  - id: reversed-contrast
    text: «Jeg lagde kaffe» highlights an ongoing activity, while «Jeg holdt på å lage kaffe» reports
      a completed event neutrally.
    correct: false
    why: This reverses the contrast between the simple past and the activity frame.
  - id: completion-contrast
    text: «Jeg holdt på å lage kaffe» says that Jonas finished the coffee before seven.
    correct: false
    why: The activity frame highlights what was in progress around seven; it does not state completion.
  - id: neutral-versus-focus
    text: «Jeg lagde kaffe» reports the action, while «Jeg holdt på å lage kaffe» highlights it as ongoing
      around seven.
    correct: true
    why: Holdt på å places the activity in progress around the stated past moment.
  explanation_md: The simple past can report an action, while holdt på å gives its ongoing phase extra
    focus.
