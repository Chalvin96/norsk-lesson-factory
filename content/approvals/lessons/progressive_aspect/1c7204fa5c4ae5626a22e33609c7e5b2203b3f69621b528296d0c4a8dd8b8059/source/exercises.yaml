- handle: choose_meaningful_activity_frame
  op: choose
  objective: obj-progressive-aspect-01
  bloom: analyze
  prompt_md: Velg paret som gjengir både aktiviteten og den oppgitte kroppsstillingen i scenene.
  derived_from:
  - section_id: showing-posture-as-well-as-activity
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hva ser du, Tom?»
    - speaker: Tom
      text_md: «Liv er ved bussholdeplassen. Hun står og ser etter bussen.»
    - speaker: Nora
      text_md: «Og Amir?»
    - speaker: Tom
      text_md: «Han er på kjøkkenet og bruker kaffemaskinen, men jeg ser ham ikke, så jeg vet ikke hvilken
        stilling han har.»
  options:
  - id: neutral-and-unsupported-posture
    text: Liv holder på å se etter bussen. 2. Amir sitter og lager kaffe.
    correct: false
    why: Den første formuleringen utelater den synlige kroppsstillingen, mens den andre finner på at Amir
      sitter.
  - id: wrong-posture-and-neutral
    text: Liv sitter og ser etter bussen. 2. Amir holder på å lage kaffe.
    correct: false
    why: Den nøytrale formuleringen passer den andre scenen, men sitter passer ikke med at Liv står.
  - id: posture-and-unsupported-posture
    text: Liv står og ser etter bussen. 2. Amir står og lager kaffe.
    correct: false
    why: Den første formuleringen passer, men den andre finner på at Amir står.
  - id: posture-and-neutral
    text: Liv står og ser etter bussen. 2. Amir holder på å lage kaffe.
    correct: true
    why: Den første formuleringen tar med den synlige kroppsstillingen, mens den andre unngår å påstå
      en ukjent stilling.
  explanation_md: En formulering med kroppsstilling passer når stillingen er synlig. «Holder på å» framhever
    aktiviteten uten å påstå en ukjent kroppsstilling.
