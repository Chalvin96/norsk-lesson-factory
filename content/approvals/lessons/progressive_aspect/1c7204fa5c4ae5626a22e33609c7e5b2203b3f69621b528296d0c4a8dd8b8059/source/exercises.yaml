- handle: report_current_preparations
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: 'Mari texts, «Hva skjer hjemme før bursdagsbesøket?» Facts: Nora decorates the room; Per
    makes soup; Eva waits by the door; Ali is lying on the sofa and resting. Reply to Mari in 35–55 Norwegian words so
    she can picture what everyone is doing now. Use both a natural Norwegian present «holder på å» + infinitive
    construction and a suitable present posture construction, such as «ligger og» for Ali resting on the
    sofa.'
  derived_from:
  - section_id: cumulative-transfer-preparing-birthday-visit
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: 'Judge the criteria message-purpose, fact-coverage, current-time, progressive-aspect,
    and word-bound as gating requirements. Valid anchor that must pass: «Hei Mari! Nå holder Nora på å
    pynte rommet med ballonger og bannere. Per holder på å lage suppe på kjøkkenet, Eva venter ved døra
    på gjestene, og Ali ligger på sofaen og hviler. Alt blir klart snart. Vi gleder oss!» Near-miss that
    must fail fact-coverage: «Hei! Alle gjør seg klare til festen nå.»'
  criteria:
  - id: message-purpose
    instruction: The response is a Norwegian reply to Mari that helps her picture the current preparation
      scene.
  - id: fact-coverage
    instruction: The response covers Nora decorating, Per making soup, Eva waiting by the door, and Ali
      resting on the sofa.
  - id: current-time
    instruction: The response presents the supplied activities as happening now.
  - id: word-bound
    instruction: The response contains 35–55 words.
  - id: neutral-frame-observation
    instruction: Observe whether a present holder på å + infinitive frame appears and flag any form error
      without failing the response.
  - id: posture-frame-observation
    instruction: Observe whether a suitable present posture frame appears and flag any form error without
      failing the response.
  - id: progressive-aspect
    instruction: The response uses both a natural Norwegian present holder på å + infinitive construction
      for an ongoing activity and a suitable present posture construction, such as «ligger og» for Ali
      resting on the sofa.
- handle: reconstruct_arrival_moment
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: 'Mari asks, «Hva skjedde da bursdagsgjesten kom klokka sju?» Facts at seven: Nora decorated
    the room; Per stood at the stove and made soup; Eva sat by the door and checked the guest list; Ali
    rested on the sofa. Reply to Mari in 40–70 Norwegian words so she understands what was in progress
    when the guest arrived. Use holdt på å + infinitive for Nora’s ongoing activity, and use og with past
    forms for both verbs in each posture frame.'
  derived_from:
  - section_id: cumulative-transfer-preparing-birthday-visit
  response_language: 'no'
  min_words: 40
  max_words: 70
  judge_prompt: 'Judge all criteria as gating requirements. The response must use holdt på å + infinitive
    for Nora’s past ongoing activity and past posture frames with og and past forms for both verbs. Valid
    anchor that must pass: «Da gjesten kom klokka sju, holdt Nora på å pynte rommet. Per sto ved komfyren
    og lagde suppe, Eva satt ved døra og sjekket gjestelista, og Ali lå og hvilte på sofaen. Alt var nesten
    klart da hun ringte på døra.»'
  criteria:
  - id: reply-purpose
    instruction: The response is a connected Norwegian reply explaining the scene to Mari.
  - id: fact-coverage
    instruction: The response covers all four supplied activities without contradicting the facts.
  - id: arrival-reference
    instruction: The response relates the activities to the guest’s arrival at seven.
  - id: word-bound
    instruction: The response contains 40–70 words.
  - id: past-holde-frame-observation
    instruction: The response uses holdt på å + infinitive for Nora’s past ongoing activity.
  - id: past-posture-frame-observation
    instruction: The response uses og with past forms for both verbs in each past posture frame.
- handle: retrieval_and_review
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: Your study partner asks, «Hva er forskjellen på holder på å lage og står og lager, og hvordan
    blir begge uttrykkene i fortid?» Write a 45–80-word Norwegian reply that explains the meaning difference,
    gives both past forms, and includes «Nå holder jeg på å lage ...» and one example tied to a specific
    time yesterday using «sto og lagde».
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 45
  max_words: 80
  judge_prompt: 'Judge all criteria reply-purpose, meaning-difference, past-recasts, time-examples, example-form-observation,
    and word-bound as gating requirements. Valid anchor that must pass: «Holder på å lage framhever aktiviteten
    uten å si noe om kroppsstilling. Står og lager viser også at personen står. I fortid heter det holdt
    på å lage og sto og lagde. Nå holder jeg på å lage middag. Klokka åtte i går sto jeg og lagde middag.»
    Near-miss that must fail meaning-difference: «De betyr akkurat det samme. I fortid bruker vi holdt
    og sto. Nå holder jeg på å lage middag, og i går sto jeg og lagde middag.» Good-message-with-form-error
    anchor that must fail example-form-observation: «Holder på å lage fokuserer på aktiviteten, mens står
    og lager viser stillingen. Fortidsformene er holdt på å lage og sto og lagde. Nå holder jeg på å lager
    middag. Klokka ni i går sto jeg og lagde middag.»'
  criteria:
  - id: reply-purpose
    instruction: The response is a Norwegian reply that answers the study partner’s full question.
  - id: meaning-difference
    instruction: The response explains that holde på å highlights an ongoing activity without specifying
      posture, while står og also presents standing posture.
  - id: past-recasts
    instruction: The response supplies holdt på å lage and sto og lagde as the requested past forms.
  - id: time-examples
    instruction: The response includes one current example and one past example tied to a specific time
      yesterday.
  - id: word-bound
    instruction: The response contains 45–80 words.
  - id: example-form-observation
    instruction: The current example must use the target frame holder på å lage, and the past example
      tied to a specific time yesterday must use the target frame sto og lagde; both examples must use
      grammatical Norwegian verb forms and connectors.
