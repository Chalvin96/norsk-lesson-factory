- handle: report_current_preparations
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: "Mari spør: «Hva skjer hjemme før bursdagsbesøket?» Nora pynter rommet, Per lager suppe, Eva venter ved døra, og Ali ligger på sofaen og hviler. til Mari om hva alle gjør nå. Bruk både holder på å + infinitiv og en passende stillingskonstruksjon, for eksempel ligger og hviler."
  derived_from:
  - section_id: cumulative-transfer-preparing-birthday-visit
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: "Judge the criteria message-purpose, fact-coverage, current-time, progressive-aspect as gating requirements. Valid anchor that must pass: «Hei Mari! Nå holder Nora på å pynte rommet med ballonger og bannere. Per holder på å lage suppe på kjøkkenet, Eva venter ved døra på gjestene, og Ali ligger på sofaen og hviler. Alt blir klart snart. Vi gleder oss!» Near-miss that must fail fact-coverage: «Hei! Alle gjør seg klare til festen nå.»"
  criteria:
  - id: message-purpose
    instruction: The response is a Norwegian reply to Mari that helps her picture the current preparation
      scene.
  - id: fact-coverage
    instruction: The response covers Nora decorating, Per making soup, Eva waiting by the door, and Ali
      resting on the sofa.
  - id: current-time
    instruction: The response presents the supplied activities as happening now.
  - id: neutral-frame-observation
    instruction: Observe whether a present holder på å + infinitive frame appears and flag any form error
      without failing the response.
  - id: posture-frame-observation
    instruction: Observe whether a suitable present posture frame appears and flag any form error without
      failing the response.
  - id: progressive-aspect
    instruction: The response uses both a natural Norwegian present holder på å + infinitive construction
      for an ongoing activity and a suitable present posture construction, such as «ligger og» for Ali
      resting on the sofa.
