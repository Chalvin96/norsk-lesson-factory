- handle: notice_ongoing_focus
  op: choose
  objective: obj-progressive-aspect-01
  bloom: understand
  prompt_md: "Velg tolkningen som beskriver kontrasten."
  derived_from:
  - section_id: main-meaning-choice
  stem_md: "Nora spør hva Jonas holdt på med klokka sju. Han svarer enten «Jeg lagde kaffe» eller «Jeg holdt på å lage kaffe». Hva viser uttrykket holdt på å?"
  options:
  - id: reversed-contrast
    text: «Jeg lagde kaffe» framhever en aktivitet som pågikk, mens «Jeg holdt på å lage kaffe» forteller nøytralt om noe som ble ferdig.
    correct: false
    why: Dette snur forskjellen mellom enkel preteritum og aktivitetsrammen.
  - id: completion-contrast
    text: «Jeg holdt på å lage kaffe» sier at Jonas ble ferdig før klokka sju.
    correct: false
    why: Aktivitetsrammen framhever det som pågikk rundt klokka sju, uten å si at handlingen ble fullført.
  - id: neutral-versus-focus
    text: «Jeg lagde kaffe» forteller om handlingen, mens «Jeg holdt på å lage kaffe» viser at den pågikk rundt klokka sju.
    correct: true
    why: «Holdt på å» viser at aktiviteten pågikk på det oppgitte tidspunktet.
  explanation_md: "Preteritum kan fortelle om en handling. Holdt på å framhever at handlingen var i gang."
