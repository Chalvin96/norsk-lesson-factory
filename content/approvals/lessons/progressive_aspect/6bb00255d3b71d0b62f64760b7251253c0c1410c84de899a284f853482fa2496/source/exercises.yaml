- handle: retrieval_and_review
  op: write
  objective: obj-progressive-aspect-01
  bloom: apply
  prompt_md: "Studiepartneren spør om forskjellen mellom holder på å og står og, og hvordan uttrykkene brukes i fortid. Svar studiepartneren. Forklar forskjellen, oppgi fortidsformene, og lag egne eksempler på noe som skjer nå og noe som skjedde på et bestemt tidspunkt i går."
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 45
  max_words: 80
  judge_prompt: "Judge all criteria reply-purpose, meaning-difference, past-recasts, time-examples, example-form-observation as gating requirements. Valid anchor that must pass: «Holder på å lage framhever aktiviteten uten å si noe om kroppsstilling. Står og lager viser også at personen står. I fortid heter det holdt på å lage og sto og lagde. Nå holder jeg på å lage middag. Klokka åtte i går sto jeg og lagde middag.» The named activity forms illustrate the pattern; accept other suitable verbs. Near-miss that must fail meaning-difference: «De betyr akkurat det samme. I fortid bruker vi holdt og sto. Nå holder jeg på å lage middag, og i går sto jeg og lagde middag.» Good-message-with-form-error anchor that must fail example-form-observation: «Holder på å lage fokuserer på aktiviteten, mens står og lager viser stillingen. Fortidsformene er holdt på å lage og sto og lagde. Nå holder jeg på å lager middag. Klokka ni i går sto jeg og lagde middag.»"
  criteria:
  - id: reply-purpose
    instruction: The response is a Norwegian reply that answers the study partner’s full question.
  - id: meaning-difference
    instruction: The response explains that holde på å highlights an ongoing activity without specifying
      posture, while står og also presents standing posture.
  - id: past-recasts
    instruction: The response gives the past forms for both patterns, using holdt på å + infinitive and a past posture verb + og + a past activity verb. Accept any suitable activity verb.
  - id: time-examples
    instruction: The response includes one current example and one past example tied to a specific time
      yesterday.
  - id: example-form-observation
    instruction: The current and past examples use grammatical Norwegian verb forms and connectors appropriate to the described activity and time.
