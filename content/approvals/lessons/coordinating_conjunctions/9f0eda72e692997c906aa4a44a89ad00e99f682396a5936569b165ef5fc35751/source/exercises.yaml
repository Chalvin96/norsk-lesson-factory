- handle: five_connections_from_one_evening
  op: write
  objective: obj-coordinating-conjunctions-01
  bloom: apply
  prompt_md: 'Message from Lea: We are eating at home tonight. The restaurant is closed. Amir likes soup
    but is short on time. We can eat at six or seven. Write a 30–60-word Norwegian reply that confirms
    or adjusts the dinner plan, explains the choices, and links the ideas with coordinating conjunctions:
    og, men, eller, for, så.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lea
      text_md: «Vi spiser hjemme i kveld. Restauranten er stengt. Vi har suppe, salat og brød. Amir liker
        suppe, men han har liten tid. Vi kan spise klokka seks eller klokka sju.»
    - speaker: Amir
      text_md: «Jeg svarer Lea og bekrefter planen.»
  response_language: 'no'
  min_words: 30
  max_words: 60
  judge_prompt: Evaluate criteria reply-purpose, explains-choices, uses-conjunctions, and word-bound as
    gating criteria; record og-addition-observation, men-contrast-observation, eller-choice-observation,
    for-reason-observation, and sa-result-observation diagnostically; observations must never make the
    response fail.
  criteria:
  - id: reply-purpose
    instruction: The reply is a Norwegian reply to Lea that confirms or adjusts the dinner plan.
  - id: explains-choices
    instruction: The reply explains the choices, for example why the meal is at home or which time fits,
      using the supplied facts.
  - id: uses-conjunctions
    instruction: The reply links ideas with all five coordinating conjunctions og, men, eller, for, and
      så, each used accurately.
  - id: word-bound
    instruction: The reply contains 30–60 words.
  - id: og-addition-observation
    instruction: 'Observation only: note whether og expresses addition accurately; do not fail the reply
      on this observation.'
  - id: men-contrast-observation
    instruction: 'Observation only: note whether men expresses contrast accurately; do not fail the reply
      on this observation.'
  - id: eller-choice-observation
    instruction: 'Observation only: note whether eller presents alternatives accurately; do not fail the
      reply on this observation.'
  - id: for-reason-observation
    instruction: 'Observation only: note whether for introduces a logical reason accurately; do not fail
      the reply on this observation.'
  - id: sa-result-observation
    instruction: 'Observation only: note whether så introduces a logical result accurately; do not fail
      the reply on this observation.'
  derived_from:
  - section_id: transfer-to-new-situation
