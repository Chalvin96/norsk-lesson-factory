- handle: read_dinner_line
  op: choose
  objective: obj-conditional-perfect-01
  bloom: understand
  prompt_md: Choose the meaning of Mina's sentence.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Jeg trodde du hadde kjøpt brød.»
    - speaker: Mina
      text_md: «Vi avtalte i morges at du skulle kjøpe det. Du skulle ha kjøpt brød.»
  options:
  - id: later-judgment
    text: Mina now thinks buying bread would have been wiser.
    correct: false
    why: This is retrospective advice, which in this context would select burde ha; Mina instead recalls
      their morning agreement.
  - id: unused-option
    text: Buying bread was merely one available option.
    correct: false
    why: An available but unused option would select kunne ha; here the purchase was something the two
      had agreed on.
  - id: expected-not-done
    text: Buying bread was an agreed task that was not carried out.
    correct: true
    why: Skulle ha presents an unfulfilled earlier arrangement that Mina and Jonas had made.
  derived_from:
  - section_id: looking-back-from-the-present
- handle: read_jonas_line
  op: choose
  objective: obj-conditional-perfect-01
  bloom: understand
  prompt_md: Choose the meaning of Jonas's sentence.
  stimulus:
