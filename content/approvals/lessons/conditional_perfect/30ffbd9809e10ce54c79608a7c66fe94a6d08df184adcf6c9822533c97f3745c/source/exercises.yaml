  objective: obj-conditional-perfect-01
  bloom: analyze
  prompt_md: Velg setningen som rapporterer Eriks avtalte plan om å møte Lea klokka seks.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lea
      text_md: «Erik lovet å komme klokka seks, men han kom klokka sju.»
  options:
  - id: judgment
    text: Erik burde ha møtt Lea klokka seks.
    correct: false
    why: This evaluates six o'clock as the better choice rather than reporting the promise.
  - id: planned
    text: Erik skulle ha møtt Lea klokka seks.
    correct: true
    why: The stated promise selects skulle ha.
  - id: possibility
    text: Erik kunne ha møtt Lea klokka seks.
    correct: false
    why: This presents six o'clock as an available option rather than a promise.
  explanation_md: The confusable pair is skulle ha versus burde ha; an arrangement selects skulle ha,
    while retrospective advice selects burde ha.
  derived_from:
  - section_id: skulle-ha-and-burde-ha-are-not-identical
- handle: distinguish_skulle_ville
  op: choose
  objective: obj-conditional-perfect-01
  bloom: analyze
  prompt_md: Choose the interpretation of the report about the lake.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: The lake froze during the cold night. «Hvis temperaturen hadde steget over null, ville isen ha smeltet.»
  options:
  - id: planned-or-expected
    text: The ice had been expected to melt, but it did not.
    correct: false
    why: This describes an expectation, while the report gives the result of a different past condition.
  - id: judgment
    text: The speaker thinks the ice ought to have melted, whatever the temperature was.
    correct: false
    why: This is a retrospective judgment, not the meaning of the conditional report.
  - id: unreal-result
    text: The ice would have melted as a result of the higher temperature.
    correct: true
    why: Ville ha describes the physical result under the unrealized temperature condition.
  explanation_md: The report presents melting as the result of a condition that did not occur. Skulle ha would frame it as planned or expected, while burde ha would add a judgment.
  derived_from:
  - section_id: do-not-replace-ville-with-skulle-automatically
