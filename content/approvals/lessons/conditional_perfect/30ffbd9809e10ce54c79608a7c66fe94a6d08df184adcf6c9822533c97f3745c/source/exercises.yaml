    end in -observation are gating. Accept natural Bokmål variants.
  criteria:
  - id: failed-plan
    instruction: The message reports the unfulfilled agreement to meet at the station at eight.
  - id: different-result
    instruction: The message describes a past result that depended on different circumstances.
  - id: retrospective-judgment
    instruction: The message evaluates at least one past action or decision as wise or unwise.
  - id: unused-option
    instruction: The message identifies asking the partner for a lift as an available option that was
