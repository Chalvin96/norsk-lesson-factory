  - id: coherent-message
    instruction: The response is one intelligible message about the supplied hike situation.
  - id: hike-word-bounds
    instruction: The response contains 45 to 80 words.
  - id: target-forms
    instruction: The message uses skulle ha, ville ha, burde ha or burde ikke ha, and kunne ha with past
      participles.
  derived_from:
