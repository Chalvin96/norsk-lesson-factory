      text_md: «Toget ble innstilt, og jeg hørte ingenting fra deg.»
    - speaker: Jonas
      text_md: «Jeg burde ha sendt deg en melding.»
  options:
  - id: arrangement
    text: He had promised or arranged to send a message.
    correct: false
    why: An unfulfilled promise or arrangement would select skulle ha.
  - id: self-criticism
    text: He thinks sending a message would have been the better action.
    correct: true
    why: Burde ha evaluates an earlier action retrospectively.
  - id: possibility
    text: Sending a message was possible, without any judgment.
    correct: false
    why: A neutral unrealized possibility would select kunne ha.
  derived_from:
  - section_id: looking-back-from-the-present
