  stimulus:
  - kind: dialogue
    turns:
    - speaker: Amir
      text_md: «Jeg visste ikke at toget var innstilt. Hvis jeg hadde visst det, hadde jeg tatt bussen.»
  options:
  - id: arrangement
    text: Amir skulle ha tatt bussen hvis han hadde visst det.
    correct: false
    why: Skulle ha would foreground an earlier plan or expectation, which the stimulus does not give.
  - id: advice
    text: Amir burde ha tatt bussen hvis han hadde visst det.
    correct: false
    why: Burde ha evaluates the choice instead of stating the conditional result.
  - id: unreal-result
    text: Amir ville ha tatt bussen hvis han hadde visst det.
    correct: true
    why: The bus journey is the result of a past condition that was not met.
  explanation_md: The confusable pair is skulle ha versus ville ha; the prerequisite is distinguishing
    an earlier plan from a conditional result.
  derived_from:
  - section_id: do-not-replace-ville-with-skulle-automatically
