- handle: hike_regret_story
  op: write
  objective: obj-conditional-perfect-01
  bloom: apply
  prompt_md: Send your hiking partner a message after Saturday's failed trip. You had agreed to meet at
    the station at eight. You stayed home because it rained. The forecast had shown sun all week. You
    could have asked your partner to drive, but you did not. Write a coherent 45–80-word Norwegian message
    explaining the failed plan, an imagined different result, what was unwise, and an unused option, using
    skulle ha, ville ha, burde ha or burde ikke ha, and kunne ha with past participles.
  response_language: 'no'
  min_words: 45
  max_words: 80
  judge_prompt: Check the message against criteria failed-plan, different-result, retrospective-judgment,
    unused-option, coherent-message, hike-word-bounds, and target-forms. Only criteria whose ids do not
    end in -observation are gating. Accept natural Bokmål variants.
  criteria:
  - id: failed-plan
    instruction: The message reports the unfulfilled agreement to meet at the station at eight.
  - id: different-result
    instruction: The message describes a past result that depended on different circumstances.
  - id: retrospective-judgment
    instruction: The message evaluates at least one past action or decision as wise or unwise.
  - id: unused-option
    instruction: The message identifies asking the partner for a lift as an available option that was
      not used.
  - id: coherent-message
    instruction: The response is one intelligible message about the supplied hike situation.
  - id: hike-word-bounds
    instruction: The response contains 45 to 80 words.
  - id: target-forms
    instruction: The message uses skulle ha, ville ha, burde ha or burde ikke ha, and kunne ha with past
      participles.
  derived_from:
  - section_id: retrieval-and-review
