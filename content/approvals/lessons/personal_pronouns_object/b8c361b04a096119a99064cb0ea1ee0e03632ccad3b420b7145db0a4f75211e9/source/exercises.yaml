- handle: anchor_reference_notice
  op: choose
  objective: obj-personal-pronouns-object-01
  bloom: understand
  prompt_md: Choose who «henne» refers to.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sara
      text_md: «Amina kjøper billetter. Emil venter på henne utenfor kinoen.»
  options:
  - id: ref-emil
    text: Personen som venter.
    correct: false
    why: «Henne» viser ikke til personen som venter.
  - id: ref-amina
    text: Amina.
    correct: true
    why: «Henne» viser tilbake til Amina, som Emil venter på.
  - id: ref-sara
    text: Personen som snakker.
    correct: false
    why: «Henne» viser ikke til personen som snakker.
  derived_from:
  - section_id: meeting-outside-cinema
