- handle: dinner_plan_transfer
  op: write
  objective: obj-faa-til-or-klare-aa-01
  bloom: apply
  prompt_md: Write a 35–55-word Norwegian message to a colleague about preparing a talk. Explain that
    the speaker worked only after you adjusted its cable, and that you delivered the talk calmly despite
    being nervous. Use both få til and klare å naturally, keeping the result and effort perspectives clear;
    the expressions can overlap and are not exact opposites.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kollega
      text_md: «Hvordan gikk lydprøven før foredraget?»
    - speaker: Du
      text_md: «Høyttaleren virket først etter at jeg justerte kabelen. Jeg var nervøs, men holdt likevel
        foredraget rolig.»
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: Check criteria message-purpose, uses-target-expressions, supplied-facts, word-bound,
    target-patterns, and focus-distinction. For this task, require a form from the få til family to foreground
    the sound working after the cable adjustment and a form from the klare å family to foreground the
    speaker delivering despite nerves. Accept natural forms such as «fikk høyttaleren til å virke» and
    «klarte å holde foredraget». Both expressions can be natural for either event in other contexts, but a
    response that reverses or erases the requested result and effort distinction does not meet this task.
    Record target-style-observation diagnostically.
  criteria:
  - id: message-purpose
    instruction: The response is a message to a colleague about preparing for a talk.
  - id: uses-target-expressions
    instruction: The response uses both få til and klare å to describe the speaker working after a cable adjustment and the writer delivering the talk despite nerves.
  - id: supplied-facts
    instruction: The response remains consistent with the supplied talk-preparation facts and does not invent a conflicting account.
  - id: word-bound
    instruction: The response contains 35–55 words.
  - id: target-patterns
    instruction: The response uses natural Norwegian forms, including få til or få + object pronoun +
      til, including a noun or pronoun as object, and klare å + infinitive.
  - id: focus-distinction
    instruction: The sound-working sentence foregrounds the successful result after the cable adjustment,
      and the talk-delivery sentence foregrounds the writer’s effort or capacity despite nerves. Do not pass
      a response that reverses these requested perspectives or uses both sentences to foreground only the
      result or only the effort.
  - id: target-style-observation
    instruction: 'Observation only: note which expression is used for each event. Natural overlap remains
      valid generally; this task specifically requests the result and effort perspectives above.'
  derived_from:
  - section_id: integrated-practice
