- handle: sa_result_order
  op: recall_fill
  objective: obj-faa-til-or-klare-aa-01
  bloom: apply
  prompt_md: Complete each sentence so så links the situation to its stated result in natural Norwegian.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lærer
      text_md: «Hva skjedde som følge av hver situasjon?»
    - speaker: Elev
      text_md: «Jeg vil knytte situasjonene direkte til resultatene.»
  audio_target: Det regnet, så vi tok bussen. Han fant ikke nøklene, så han kunne ikke låse døra.
  segments:
  - text_md: 'Det regnet, så '
  - blank_id: so-bus-result
    options:
    - vi tok bussen
    - tok vi bussen
    answer_index: 0
  - text_md: '. Han fant ikke nøklene, så '
  - blank_id: so-key-result
    options:
    - han ikke kunne låse døra
    - han kunne ikke låse døra
    answer_index: 1
  - text_md: .
  explanation_md: Result-linking så is followed here by an ordinary subject-first main clause; the finite
    verb comes before ikke.
  derived_from:
  - section_id: connecting-a-cause-and-result-with-sa
- handle: connector_meaning_choice
  op: choose
  objective: obj-faa-til-or-klare-aa-01
  bloom: understand
  prompt_md: Choose the option where all three sentences are correct.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Hvorfor avlyste dere turen?»
    - speaker: Mina
      text_md: «Været var dårlig.»
  options:
  - id: sa-order-error
    text: Vi avlyste turen fordi været var dårlig. Været var dårlig. Derfor avlyste vi turen. Været var
      dårlig, så avlyste vi turen.
    correct: false
    why: After result-linking så the clause keeps subject–verb order, so avlyste vi is wrong.
  - id: correct-three-connectors
    text: Vi avlyste turen fordi været var dårlig. Været var dårlig. Derfor avlyste vi turen. Været var
      dårlig, så vi avlyste turen.
    correct: true
    why: Fordi gives the reason after the result, sentence-initial derfor takes verb–subject order, and
      så links the cause to its result with subject–verb order.
  - id: derfor-order-error
    text: Vi avlyste turen fordi været var dårlig. Været var dårlig. Derfor vi avlyste turen. Været var
      dårlig, så vi avlyste turen.
    correct: false
    why: After sentence-initial derfor the finite verb must come before the subject.
  explanation_md: Fordi follows a result with its reason; derfor begins a separate consequence with inversion;
    så links a cause to its result with ordinary main-clause order.
  derived_from:
  - section_id: three-ways-to-describe-the-same-relationship
- handle: connector_and_verb_position
