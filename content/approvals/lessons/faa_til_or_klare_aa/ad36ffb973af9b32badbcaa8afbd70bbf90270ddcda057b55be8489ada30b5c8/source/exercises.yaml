      text_md: «Hvordan kan vi knytte hvert resultat til årsaken?»
    - speaker: Elev
      text_md: «Jeg vil gjøre begge forklaringene tydelige.»
  audio_target: Jeg tok taxi fordi bussen ikke kom. Vi spiste hjemme fordi restauranten ikke var åpen.
  segments:
