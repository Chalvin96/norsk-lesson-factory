  - blank_id: because-bus-clause
    options:
    - bussen ikke kom
    - bussen ankom ikke
    answer_index: 0
  - text_md: '. Vi spiste hjemme fordi '
  - blank_id: because-restaurant-clause
    options:
    - restauranten åpnet ikke
    - restauranten var ikke åpen
    answer_index: 1
  - text_md: .»
  explanation_md: After fordi, ikke normally comes before the finite verb.
  derived_from:
  - section_id: giving-the-reason-with-fordi
