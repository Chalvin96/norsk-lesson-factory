- handle: find_the_cause
  op: choose
  objective: obj-faa-til-or-klare-aa-01
  bloom: understand
  prompt_md: Choose the sentence that gives the reason for the result in the dialogue.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Hvorfor tok du taxi?»
    - speaker: Mina
      text_md: «Bussen kom ikke.»
  options:
  - id: cause-reversed
    text: Bussen kom ikke fordi Mina tok taxi.
    correct: false
    why: This makes the taxi ride the cause of the bus not coming.
  - id: result-instead
    text: Mina rakk møtet etter at hun tok taxi.
    correct: false
    why: This describes what happened after the taxi ride instead of why Mina took it.
  - id: cause-correct
    text: Mina tok taxi fordi bussen ikke kom.
    correct: true
    why: Fordi introduces the reason for the result stated before it.
  explanation_md: Fordi introduces the reason for the result stated before it.
  derived_from:
  - section_id: giving-the-reason-with-fordi
- handle: fordi_word_order
  op: recall_fill
  objective: obj-faa-til-or-klare-aa-01
