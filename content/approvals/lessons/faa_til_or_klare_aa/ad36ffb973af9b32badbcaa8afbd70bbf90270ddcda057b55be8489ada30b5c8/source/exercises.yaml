  derived_from:
  - section_id: connector-and-word-order-must-work-together
- handle: follow_up_response_discrimination
  op: choose
  objective: obj-faa-til-or-klare-aa-01
  bloom: apply
  prompt_md: Choose the reply that answers Jonas's question with correct word order.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Hvorfor var du nervøs?»
    - speaker: Mina
      text_md: «Jeg hadde ikke lest den siste rapporten.»
  options:
  - id: follow-up-reversed
    text: Jeg hadde ikke lest den siste rapporten fordi jeg var nervøs.
    correct: false
    why: This makes nervousness the reason the report was not read.
  - id: follow-up-correct
    text: Jeg var nervøs fordi jeg ikke hadde lest den siste rapporten.
    correct: true
    why: The reply states the result and gives the reason with subordinate-clause word order.
  - id: follow-up-main-order
    text: Jeg var nervøs fordi jeg hadde ikke lest den siste rapporten.
    correct: false
    why: This preserves main-clause placement of ikke after hadde inside the fordi-clause.
  explanation_md: In a fordi-clause, ikke comes before hadde, and the reason must match Jonas's question.
  derived_from:
  - section_id: returning-to-mina-and-jonas
- handle: revise_dinner_message
  op: choose
  objective: obj-faa-til-or-klare-aa-01
  bloom: apply
  prompt_md: Choose the corrected message.
  stem_md: «Ovnen virker ikke. Derfor jeg bestilte mat. Leveringen er sen, så blir middagen forsinket.»
  options:
  - id: revise-sa-only
    text: Ovnen virker ikke. Derfor jeg bestilte mat. Leveringen er sen, så middagen blir forsinket.
    correct: false
    why: The så-clause is repaired, but the sentence beginning with derfor still lacks V2 inversion.
  - id: revise-correct
    text: Ovnen virker ikke. Derfor bestilte jeg mat. Leveringen er sen, så middagen blir forsinket.
    correct: true
    why: Derfor has verb–subject order, while the result clause after så has subject–verb order.
  - id: revise-derfor-only
    text: Ovnen virker ikke. Derfor bestilte jeg mat. Leveringen er sen, så blir middagen forsinket.
    correct: false
    why: The derfor-clause is repaired, but the result clause after så still has inversion.
  explanation_md: Use Derfor + finite verb + subject, but så + subject + finite verb for the result-linking
    pattern practiced here.
  derived_from:
  - section_id: transfer-to-a-new-situation
- handle: dinner_plan_transfer
  op: write
  objective: obj-faa-til-or-klare-aa-01
  bloom: apply
  prompt_md: Write a 35–55-word Norwegian message to the guests. Use at least two of fordi, derfor, and
    så to explain the delay and the dinner plan.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Gjest
      text_md: «Når blir middagen klar? Vi er sultne.»
    - speaker: Emil
      text_md: «Ovnen sluttet å virke. Jeg bestilte mat fra en restaurant, men leveringen kom sent.»
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: Check criteria message-purpose, uses-connectors, supplied-facts, word-bound, and connector-order.
    Record connector-style-observation diagnostically.
  criteria:
  - id: message-purpose
    instruction: The response is a message to the guests that explains the delay and communicates the
      dinner plan.
  - id: uses-connectors
    instruction: The response uses at least two of fordi, derfor, and så to connect the reason and the
      result.
  - id: supplied-facts
    instruction: The response remains consistent with the supplied facts and does not invent a conflicting
      account.
  - id: word-bound
    instruction: The response contains 35–55 words.
  - id: connector-order
    instruction: The response uses natural Norwegian word order in each connector clause it writes.
  - id: connector-style-observation
    instruction: 'Observation only: note which connectors and clause patterns the learner uses; do not
      fail an otherwise acceptable response.'
  derived_from:
  - section_id: transfer-to-a-new-situation
