  - token_id: c-2
    text: gikk
  - token_id: c-3
    text: hjem
  - token_id: c-4
    text: fordi
  - token_id: c-5
    text: jeg
  - token_id: c-6
    text: ikke
  - token_id: c-7
    text: følte
  - token_id: c-8
    text: meg
  - token_id: c-9
    text: bra.
  answer_order:
  - c-1
  - c-2
  - c-3
  - c-4
  - c-5
  - c-6
  - c-7
  - c-8
  - c-9
  explanation_md: The result comes first; fordi introduces the reason, where ikke precedes the finite
