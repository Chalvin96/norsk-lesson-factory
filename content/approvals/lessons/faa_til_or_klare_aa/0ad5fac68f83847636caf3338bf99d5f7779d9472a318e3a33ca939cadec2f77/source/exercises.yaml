  prompt_md: 'Mina byttet kabel og fikk vist presentasjonen. Hvilken forklaring passer best til de to setningene?'
  explanation_md: 'Begge uttrykkene kan fortelle at Mina lyktes. «Fikk til» framhever resultatet av å få presentasjonen til å virke; «klarte å» framhever Minas evne eller innsats. Samtalen viser at hun lyktes, men gjør ikke ett uttrykk feil.'
  derived_from:
