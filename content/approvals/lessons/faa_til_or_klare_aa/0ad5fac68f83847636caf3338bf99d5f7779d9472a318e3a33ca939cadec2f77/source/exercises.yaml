  judge_prompt: Check criteria message-purpose, uses-target-expressions, supplied-facts, word-bound, target-patterns, and focus-distinction. Require a form from the få til family to foreground the successful result of getting the seeds to sprout, and a form from the klare å family to foreground the writer's effort or ability to plant them before the holiday. Accept natural variants. Both expressions can be natural for either event in other contexts, but a response that reverses or erases the requested result and effort distinction does not meet this task.
  criteria:
  - id: message-purpose
    instruction: The response is a message to the writer's sister about the garden work.
  - id: uses-target-expressions
    instruction: The response uses both få til and klare å to describe getting the seeds to sprout and planting them before the holiday.
  - id: supplied-facts
    instruction: The response remains consistent with the supplied gardening facts and does not invent a conflicting account.
  - id: word-bound
    instruction: The response contains 35–55 words.
  - id: target-patterns
    instruction: Uses a natural få til pattern, including få + noun or pronoun + til å + infinitive, for the seeds sprouting, and uses klare å + infinitive for planting them before the holiday.
  - id: focus-distinction
    instruction: The sentence about the seeds foregrounds the successful result of sprouting; the sentence about planting foregrounds the writer's effort or capacity to finish before the holiday. Do not pass a response that reverses these requested perspectives or uses both sentences to foreground only the result or only the effort.
  - id: target-style-observation
    instruction: 'Observation only: note which expression is used for each event; the requested result and effort perspectives are the gating focus.'
