  stem_md: 'Etter at kabelen var byttet, fikk Mina vist presentasjonen. Sammenlign: «Mina fikk til å vise presentasjonen etter at de byttet kabel.» / «Mina klarte å vise presentasjonen etter at de byttet kabel.»'
  options:
  - id: result-versus-capacity
    text: Both sentences report success; fikk til foregrounds the successful result, while klarte å foregrounds Mina’s ability or effort.
    correct: true
    why: The cable change explains the achieved result; the alternate wording can still truthfully describe Mina's success while focusing on what she managed to do.
  - id: success-versus-attempt
    text: Fikk til reports success, while klarte å only reports an unsuccessful attempt.
    correct: false
    why: Klarte å can describe successful completion too; it foregrounds capacity or effort rather than denying the result.
  - id: identical-emphasis
    text: Both sentences report success and necessarily emphasize the same thing.
    correct: false
    why: The result of the task and Mina's ability or effort are different possible points of focus.
  - id: result-only
    text: Only the first sentence can be used because Mina has already shown the presentation.
    correct: false
    why: The second sentence is also grammatical and compatible with the stated success.
