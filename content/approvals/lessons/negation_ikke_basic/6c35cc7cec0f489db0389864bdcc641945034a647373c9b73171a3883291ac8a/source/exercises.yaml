- handle: transfer_ikke_to_evening_plans
  op: write
  objective: obj-negation-ikke-basic-01
  bloom: apply
  prompt_md: 'Elias er opptatt i kveld, butikken er stengt, og Maja og Elias kan møtes
    i morgen klokka 17. Skriv en melding på norsk på 25–40 ord til Maja. Forklar hvorfor
    Elias ikke kan følge planen i kveld, og bruk «ikke» i setningen om ham. Foreslå et
    nytt tidspunkt.'
  derived_from:
  - section_id: transfer-evening-plans
  response_language: 'no'
  min_words: 25
  max_words: 40
  judge_prompt: >-
    Vurder kriteriene evening-facts, audience-purpose, transfer-word-bound og statement-placement-observation.
    Id-en varied-placement-observation rapporteres diagnostisk og inngår ikke i beståttregelen.
    Godta
    enhver naturlig melding som formidler faktaene og den nye tiden. Vurder plasseringen
    av «ikke» etter
    leddtypen: I en helsetning følger hovedsetningsordstillingen, for eksempel «Elias
    har ikke tid» eller
    «I kveld har ikke Elias tid». I en leddsetning som innledes med «fordi», står
    subjektet før «ikke»
    og det finitte verbet, for eksempel «fordi Elias ikke har tid». Ikke krev en bestemt
    ordlyd.
  criteria:
  - id: evening-facts
    instruction: Formidler at Elias er utilgjengelig i kveld, at butikken er
      stengt, og at møtet kan flyttes til i morgen klokka 17.
  - id: audience-purpose
    instruction: Er en forståelig melding til Maja som forklarer endringen og
      foreslår den nye tiden.
  - id: transfer-word-bound
    instruction: Inneholder 25–40 ord.
  - id: statement-placement-observation
    instruction: >-
      Plasserer «ikke» etter leddtypen i setningen om Elias: hovedsetningsordstilling
      i en helsetning,
      eller subjekt + «ikke» + finitt verb i en leddsetning som «fordi Elias ikke
      har tid».
  - id: varied-placement-observation
    instruction: Registrerer diagnostisk eventuell korrekt bruk av ikke i andre
      setningstyper; dette kriteriet kan ikke alene føre til underkjenning.
