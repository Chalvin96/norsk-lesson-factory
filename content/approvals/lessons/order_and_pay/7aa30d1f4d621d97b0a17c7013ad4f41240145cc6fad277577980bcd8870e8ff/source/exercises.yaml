    instruction: Oppgir kortbetaling i et kort, naturlig svar.
  derived_from:
  - section_id: checking-how-to-pay
- handle: review_closing_transaction
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: "Give the café worker a short reply."
  min_words: 3
  max_words: 4
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ansatt
      text_md: «Skal du ha noe mer?»
    - speaker: Context
      text_md: "Du er ferdig med bestillingen."
  response_language: 'no'
  judge_prompt: Vurder kriteriet closing-chunk. Godta et kort, høflig svar som tydelig sier at kunden
