- handle: review_changing_quantities
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: "Write the phrase for the new amount."
  min_words: 2
  max_words: 3
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: "Du har allerede bestilt én flaske vann, men vil nå ha to."
  response_language: 'no'
  judge_prompt: Vurder kriteriet plural-chunk. Registrer plural-form-observation diagnostisk.
  criteria:
  - id: plural-chunk
    instruction: Skriver et korrekt uttrykk som betyr to flasker vann.
  - id: plural-form-observation
    instruction: 'Observation only: registrer om flertallsformen etter tallet er korrekt; ikke underkjenn
      en naturlig tilsvarende variant.'
  derived_from:
  - section_id: saying-how-many
- handle: review_item_price_or_total
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: "Write the question the customer asks now."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kunde
      text_md: «Jeg tar en kaffe og to rundstykker.»
    - speaker: Ansatt
      text_md: «Er det alt?»
    - speaker: Context
      text_md: "Kunden svarer ja og vil vite hva hele bestillingen koster."
  response_language: 'no'
  judge_prompt: Vurder kriteriet total-question. Godta lærte, naturlige spørsmål om totalprisen.
  criteria:
  - id: total-question
    instruction: Spør om prisen på hele bestillingen, ikke bare én vare.
  derived_from:
  - section_id: checking-the-price
- handle: review_confirming_payment
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: "Tell the cashier how you will pay."
  min_words: 2
  max_words: 3
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ansatt
      text_md: «Hvordan vil du betale?»
    - speaker: Context
      text_md: "Du vil betale med kort."
  response_language: 'no'
  judge_prompt: Vurder kriteriet payment-chunk. Godta et kort, naturlig uttrykk for kortbetaling med valgfritt
    «takk».
  criteria:
