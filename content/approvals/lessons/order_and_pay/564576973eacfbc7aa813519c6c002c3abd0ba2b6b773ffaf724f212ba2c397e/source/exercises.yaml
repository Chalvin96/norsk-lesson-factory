- handle: making_first_request
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: 'Meny: et rundstykke med ost, en kopp te, en flaske vann. Velg to varer og skriv to fullstendige
    bestillinger av de samme varene, hver med et ulikt bestillingsuttrykk.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: "Ved kafédisken vil du bestille to varer fra menyen på to ulike måter."
  response_language: 'no'
  judge_prompt: Vurder kriteriene first-order og second-order. Registrer frame-variety-observation diagnostisk.
    Godta bøying, tegnsetting og rekkefølge som ikke endrer bestillingen.
  criteria:
  - id: first-order
    instruction: Den første bestillingen er en fullstendig norsk bestilling av begge varene.
  - id: second-order
    instruction: Den andre bestillingen er en fullstendig norsk bestilling av de samme to varene og bruker
      et annet bestillingsuttrykk enn den første.
  - id: frame-variety-observation
    instruction: 'Observation only: registrer om bestillingene bruker to tydelige, naturlige bestillingsrammer
      (for eksempel Jeg vil gjerne ha og Kan jeg få); ikke underkjenn en naturlig tilsvarende variant.'
  derived_from:
  - section_id: choosing-an-item
- handle: responding_to_choice
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: Svar kort på begge spørsmålene, og skriv så én fullstendig bestilling som samler valgene
    dine.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Vil du ha liten eller stor kaffe?»
    - speaker: Context
      text_md: "Du svarer kort."
    - speaker: Nora
      text_md: «Vil du ha melk i kaffen?»
    - speaker: Context
      text_md: Svar kort, og bestill deretter alt i én fullstendig replikk.
  response_language: 'no'
  judge_prompt: Vurder kriteriene size-response, milk-response og combined-order. Godta både liten og
    stor og både med og uten melk når den fullstendige bestillingen samsvarer med svarene.
  criteria:
  - id: size-response
    instruction: Det første svaret velger tydelig én størrelse.
  - id: milk-response
    instruction: Det andre svaret velger tydelig melk eller ikke melk.
  - id: combined-order
    instruction: Den siste setningen er en fullstendig bestilling som samsvarer med begge valgene.
  derived_from:
  - section_id: choosing-between-options
- handle: changing_quantities
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: Skriv den nye bestillingen som én fullstendig setning med riktige substantivformer etter
    tallene.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: "Først bestilte du én kaffe og to flasker vann. Du vil endre bestillingen: Du trenger dobbelt så mye kaffe, men bare én flaske vann."
  response_language: 'no'
  judge_prompt: Vurder kriteriene order-frame og quantity-forms. Registrer plural-form-observation diagnostisk.
    Godta både «to kaffer» og «to kopper kaffe», og begge rekkefølger på varene.
  criteria:
  - id: order-frame
    instruction: Skriver én fullstendig norsk bestilling.
  - id: quantity-forms
    instruction: Bestiller to kaffer (eller to kopper kaffe) og én flaske vann med riktige tall- og substantivformer.
  - id: plural-form-observation
    instruction: 'Observation only: registrer om flertallsformene etter tallene er korrekte; ikke underkjenn
      en naturlig tilsvarende variant.'
  derived_from:
  - section_id: saying-how-many
- handle: item_price_or_total
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: Skriv de to norske prisspørsmålene Sara stiller.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: "Sara står ved disken med en kanelbolle og en bestilling. Først vil hun vite hva kanelbollen koster, og deretter hva hele bestillingen koster."
  response_language: 'no'
  judge_prompt: Vurder kriteriene named-item-price og whole-order-total. Godta naturlige lærte varianter
    med samme betydning.
  criteria:
  - id: named-item-price
    instruction: Det første spørsmålet spør om prisen på den navngitte varen.
  - id: whole-order-total
    instruction: Det andre spørsmålet spør om totalprisen for hele bestillingen.
  derived_from:
  - section_id: checking-the-price
- handle: confirming_payment
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: 'Skriv tre replikker i denne rekkefølgen: et kort svar, samme svar i en fullstendig setning
    og et avsluttende spørsmål til kassereren om én felles betaling.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hvordan vil du betale?»
    - speaker: Context
      text_md: "Sara og Emil vil betale sammen med samme betalingsmåte."
  response_language: 'no'
  judge_prompt: Vurder kriteriene short-payment-reply, complete-payment-sentence og shared-payment-question.
    Godta kort eller kontant når samme metode brukes i de to første linjene.
  criteria:
  - id: short-payment-reply
    instruction: Gir et kort svar som tydelig velger én betalingsmåte.
  - id: complete-payment-sentence
    instruction: Uttrykker den samme betalingsmåten i en fullstendig setning.
  - id: shared-payment-question
    instruction: Spør om de kan betale sammen.
  derived_from:
  - section_id: checking-how-to-pay
- handle: guided_transaction
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: "Skriv kundens fem svar i riktig rekkefølge: bestilling, valg av melk, spørsmål om totalpris, betaling og avslutning."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ansatt
      text_md: «Hei! Hva vil du ha?»
    - speaker: Context
      text_md: Du vil bestille to kaffer og én kanelbolle.
    - speaker: Ansatt
      text_md: «Vil du ha melk i kaffen?»
    - speaker: Context
      text_md: Du vil ikke ha melk.
    - speaker: Ansatt
      text_md: «Er det alt?»
    - speaker: Context
      text_md: Du vil svare at det er alt og spørre om totalprisen.
    - speaker: Ansatt
      text_md: «Det blir 96 kroner. Hvordan vil du betale?»
    - speaker: Context
      text_md: Du vil betale med kort.
    - speaker: Ansatt
      text_md: «Vil du ha kvitteringen?»
    - speaker: Context
      text_md: Du vil ha kvitteringen.
  response_language: 'no'
  min_words: 17
  max_words: 45
  judge_prompt: Vurder kriteriene guided-order, guided-choice, guided-total, guided-payment og guided-close.
    Godta naturlige tegnsettings- og høflighetsvarianter.
  criteria:
  - id: guided-order
    instruction: Bestiller de oppgitte varene i riktig mengde med en fullstendig bestillingsramme.
  - id: guided-choice
    instruction: Velger kaffe uten melk.
  - id: guided-total
    instruction: Svarer at det er alt og spør om totalprisen.
  - id: guided-payment
    instruction: Oppgir kort som betalingsmåte etter prisopplysningen.
  - id: guided-close
    instruction: Tar imot kvitteringen og avslutter høflig.
  derived_from:
  - section_id: guided-transaction
- handle: integrated_transaction
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: Fortsett dialogen fra bestilling til avslutning. La den ansatte spørre om kunden vil spise
    der eller ta med, opplyse totalsummen og spørre om betalingsmåte.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ansatt
      text_md: «God morgen! Hva kan jeg hjelpe deg med?»
    - speaker: Context
      text_md: "Kunden bestiller en kopp te og tre kanelboller til å ta med, spør om totalprisen og betaler 154 kroner kontant. Kunden trenger ikke kvittering og avslutter høflig."
  response_language: 'no'
  min_words: 35
  max_words: 65
  judge_prompt: Vurder kriteriene order-choice-quantity, total-and-payment og polite-close. Registrer
    transaction-language-observation diagnostisk. Ikke legg til andre krav.
  criteria:
  - id: order-choice-quantity
    instruction: Bestiller én kopp te og tre kanelboller med riktige former og velger å ta med da den
      ansatte spør.
  - id: total-and-payment
    instruction: Spør om totalprisen, lar den ansatte oppgi 154 kroner og gjennomfører kontantbetaling
      etter spørsmålet om betalingsmåte.
  - id: polite-close
    instruction: Takker nei til kvitteringen og avslutter dialogen høflig.
  - id: transaction-language-observation
    instruction: 'Observation only: registrer om bestillings-, mengde- eller betalingsformene har mindre
      språkfeil; kriteriet kan ikke alene føre til underkjenning.'
  derived_from:
  - section_id: integrated-practice
- handle: quick_retrieval_review
  op: write
  objective: obj-order-and-pay-01
  bloom: apply
  prompt_md: 'Skriv replikkene kunden sier til den kaféansatte: bestill varene, spør om prisen for hele
    kjøpet, oppgi at du vil betale med kort og avslutt kjøpet høflig.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ansatt
      text_md: «Hei! Hva vil du ha?»
    - speaker: Context
      text_md: "Kunden vil ha tre kanelboller, spørre om totalprisen, betale med kort og avslutte høflig."
  response_language: 'no'
  max_words: 45
  judge_prompt: Vurder kriteriene ordering-expression, plural-quantity-expression, total-expression, card-payment-expression
    og completion-expression. Godta alle naturlige formuleringer som utfører de synlige trinnene.
  criteria:
  - id: ordering-expression
    instruction: Bestiller kanelboller av den kaféansatte.
  - id: plural-quantity-expression
    instruction: Gjør antallet tre tydelig med en passende flertallsform.
  - id: total-expression
    instruction: Spør om prisen for hele kjøpet.
  - id: card-payment-expression
    instruction: Spør om eller oppgir kortbetaling.
  - id: completion-expression
    instruction: Avslutter kjøpet høflig etter betalingen.
  derived_from:
  - section_id: quick-retrieval-review
