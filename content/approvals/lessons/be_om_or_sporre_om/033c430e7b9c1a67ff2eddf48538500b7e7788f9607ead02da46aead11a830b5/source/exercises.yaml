- handle: first_checkpoint_intended_result
  op: choose
  objective: obj-be-om-or-sporre-om-01
  bloom: understand
  prompt_md: Choose the reply that fits both of Nora's needs.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Nora vil vite når frokosten begynner, og hun vil ha et ekstra håndkle.
    - speaker: Nora
      text_md: «Hva sier jeg?»
  options:
  - id: both-information
    text: Kan jeg spørre om frokosttidene? Kan jeg spørre når håndkleet kommer?
    correct: false
    why: The second line asks when the towel will arrive instead of requesting an extra towel.
  - id: correct
    text: Kan jeg spørre om frokosttidene? Kan jeg be om et ekstra håndkle?
    correct: true
    why: Spørre om frames the topic Nora wants information about, and be om requests the towel as an item.
  - id: reversed-forms
    text: Kan jeg be om frokosttidene? Kan jeg spørre om det finnes ekstra håndklær?
    correct: false
    why: 'The first line requests information as if it were an item, and the second asks whether extra
      towels are available instead of requesting one.'
  derived_from:
  - section_id: first-checkpoint-intended-result
- handle: controlled_practice_requesting_things_and_actions
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'Kafévert: Hva kan jeg hjelpe deg med? Fakta: Du vil ha regningen. Kollegaen din skal sende
    en e-post til kunden. Write two numbered requests in 12–28 words total: use be om for the bill, and
    use be + the person + om å for the email.'
  response_language: 'no'
  judge_prompt: Check the response against cafe-bill, colleague-email, and word-bound. Accept natural
    Bokmål variants that preserve the supplied facts.
  criteria:
  - id: cafe-bill
    instruction: The first request asks for the bill with be om.
  - id: colleague-email
    instruction: The second request asks the colleague to send an email, using be plus the person plus
      om å and the action.
  - id: word-bound
    instruction: The complete response contains 12–28 words.
  explanation_md: An item follows be om, while a person who should act comes before om å.
  derived_from:
  - section_id: controlled-practice-requesting-things-and-actions
- handle: second_checkpoint_formulate_information_questions
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'Resepsjonist: Hva vil du vite? Supplied questions: 1. Når begynner frokosten? 2. Hvor mye
    koster en togbillett? 3. Når åpner museet? 4. Når begynner kurset? Write four numbered topic introductions
    in 20–44 words total, using spørre om.'
  response_language: 'no'
  judge_prompt: Check the response against breakfast-topic, train-price-topic, museum-hours-topic, course-start-topic,
    and word-bound. Assess only the four requested topic introductions.
  criteria:
  - id: breakfast-topic
    instruction: The first introduction uses spørre om to introduce breakfast as the topic; the supplied direct question provides the specific information need.
  - id: train-price-topic
    instruction: The second introduction uses spørre om to introduce the train ticket or ticket price as the topic; the supplied direct question provides the specific information need.
  - id: museum-hours-topic
    instruction: The third introduction uses spørre om to introduce the museum as the topic; the supplied direct question provides the specific information need.
  - id: course-start-topic
    instruction: The fourth introduction uses spørre om to introduce the course as the topic; the supplied direct question provides the specific information need.
  - id: word-bound
    instruction: The complete response contains 20–44 words.
  explanation_md: Spørre om introduces the topic; the supplied direct question identifies the precise
    information needed.
  derived_from:
  - section_id: second-checkpoint-formulate-information-questions
- handle: contrast_practice_change_intended_result
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'Servitør: Hva ønsker du? Fakta: Først vil du få den fysiske menyen. Deretter vil du vite
    om menyen har vegetarretter. Write a two-sentence reply of 12–26 words.'
  response_language: 'no'
  judge_prompt: Check the response against menu-item, menu-information, order, and word-bound. Accept
    natural Bokmål variants that communicate the supplied facts.
  criteria:
  - id: menu-item
    instruction: The first sentence requests the physical menu with be om.
  - id: menu-information
    instruction: The second sentence asks about vegetarian options with spørre om.
  - id: order
    instruction: The item request comes before the information question.
  - id: word-bound
    instruction: The response contains 12–26 words.
  explanation_md: The shared noun does not determine the expression; the intended result does.
  derived_from:
  - section_id: contrast-practice-change-intended-result
- handle: guided_correction_activity
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'Resepsjonist: Hva trenger du? Fakta: Du vil få en nøkkel til rom 12. Du vil vite når frokosten
    begynner. Write a two-sentence reply of 12–28 words.'
  response_language: 'no'
  judge_prompt: Check the response against key-request, breakfast-information, and word-bound. Accept
    natural Bokmål variants that communicate both supplied intentions.
  criteria:
  - id: key-request
    instruction: One sentence uses be om to request the key.
  - id: breakfast-information
    instruction: One sentence uses spørre om to ask specifically when breakfast begins or what time it starts.
  - id: word-bound
    instruction: The response contains 12–28 words.
  explanation_md: The key is an item to receive, whereas breakfast time is information to learn.
  derived_from:
  - section_id: guided-correction-activity
- handle: final_contextual_practice
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'You are a guest at a hotel reception. Write two polite Norwegian lines: ask for a printed city map, then ask the receptionist to arrange a wake-up call for six tomorrow morning. Use 12–24 words total.'
  response_language: 'no'
  min_words: 12
  max_words: 24
  judge_prompt: >-
    Check that the response has two natural guest requests: one requesting a printed city map as an item, and one asking the receptionist to arrange a wake-up call for six tomorrow morning. The item request should use be om; the action request should use a natural form of be + the person or pronoun + om å + infinitive. Accept natural Bokmål variants and direct-address pronouns.
  criteria:
  - id: map-request
    instruction: One line requests a printed city map with a form of be om.
  - id: wake-up-action
    instruction: One line asks the receptionist to arrange a wake-up call for six tomorrow morning, using a form of be followed by the addressee or a coherent noun for the receptionist, then om å and an infinitive.
  - id: two-lines
    instruction: The response contains two guest lines suitable for a hotel reception.
  - id: word-bound
    instruction: The response contains 12–24 words.
  explanation_md: One line requests an item to receive; the other asks a specific person to perform an action.
  derived_from:
  - section_id: final-contextual-practice
- handle: retrieval_and_review
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'Melding fra Amir: «Jeg er på biblioteket. Jeg trenger en kopi av artikkelen, bibliotekaren
    skal finne den, og jeg vil vite når biblioteket stenger.» Write a 28–50-word reply that explains the
    distinction between be om and spørre om and gives one suitable sentence for each need: use be om for
    the copy, be + the person + om å for the librarian, and spørre om for the closing time.'
  response_language: 'no'
  judge_prompt: Check the response against distinction-explanation, copy-request, librarian-action, closing-information,
    and word-bound. Accept natural Bokmål variants grounded in Amir's message.
  criteria:
  - id: distinction-explanation
    instruction: The reply explains that be om requests an item or action, while spørre om seeks information
      about a topic.
  - id: copy-request
    instruction: The reply includes a suitable be om request for a copy of the article.
  - id: librarian-action
    instruction: The reply includes a suitable request for the librarian to find the article, using be
      plus the person plus om å.
  - id: closing-information
    instruction: The reply includes a suitable use of spørre om for the library closing time.
  - id: word-bound
    instruction: The response contains 28–50 words.
  explanation_md: The three needs require an item request, an action request, and an information question.
  derived_from:
  - section_id: retrieval-and-review
- handle: review_item_request
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: Servitøren spør hva du trenger. Write a Norwegian request for a glass of water, using the
    item-request expression taught in this section. Use 4–7 words.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Servitør
      text_md: «Hva trenger du?»
    - speaker: Context
      text_md: Glasset ditt er tomt, og du vil ha et nytt glass vann.
  response_language: 'no'
  judge_prompt: Check the response against uses-be-om, item-request, and word-bound. Accept any natural
    inflected form of be om.
  criteria:
  - id: uses-be-om
    instruction: The response uses a form of be om to request the item.
  - id: item-request
    instruction: The response asks the server for a glass of water.
  - id: word-bound
    instruction: The response contains 4–7 words.
  explanation_md: A physical item that should be provided is requested with the item-request expression.
  derived_from:
  - section_id: retrieval-and-review
- handle: review_person_action_request
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: Du snakker til sjåføren og vil at hun skal vente. Write a Norwegian sentence that asks the
    driver to wait, using the person-action request expression taught in this section. Use 4–7 words.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Du sitter i taxien og vil at sjåføren skal vente mens du henter noe.
  response_language: 'no'
  judge_prompt: Check the response against uses-be-om-aa, action-request, and word-bound. Accept a natural
    inflected form of be followed by om å, with either direct-address deg or a coherent noun for the driver
    as the requested person.
  criteria:
  - id: uses-be-om-aa
    instruction: The response uses a form of be followed by om å and an infinitive, with deg or a coherent
      noun for the driver as the requested person.
  - id: action-request
    instruction: The response asks the driver to wait.
  - id: word-bound
    instruction: The response contains 4–7 words.
  explanation_md: In a request for another person to act, the person comes between the request verb and
    the infinitive marker.
  derived_from:
  - section_id: retrieval-and-review
- handle: review_information_question
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: Museumsvert spør hva du vil vite. Du vil vite når museet åpner. Write a Norwegian sentence
    that asks about the opening time, using the information-topic expression taught in this section. Use
    4–7 words.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Museumsvert
      text_md: «Hva vil du vite?»
    - speaker: Context
      text_md: Du vil vite når museet åpner.
  response_language: 'no'
  judge_prompt: Check the response against uses-sporre-om, information-topic, and word-bound. Accept any
    natural inflected form of spørre om with the opening-time topic.
  criteria:
  - id: uses-sporre-om
    instruction: The response uses a form of spørre om to introduce the opening-time topic.
  - id: information-topic
    instruction: The response asks about the museum's opening time.
  - id: word-bound
    instruction: The response contains 4–7 words.
  explanation_md: When the desired result is information, the information-topic expression introduces
