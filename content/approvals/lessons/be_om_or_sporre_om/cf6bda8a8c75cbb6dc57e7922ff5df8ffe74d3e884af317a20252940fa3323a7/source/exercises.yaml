  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'Receptionist: «Hva vil du vite?» Write four numbered openings for these questions: When does breakfast start? How much does a train ticket cost? When does the museum open? When does the course start? Use «spørre om».'
  min_words: 20
  max_words: 44
  response_language: 'no'
  judge_prompt: "Check the response against breakfast-topic, train-price-topic, museum-hours-topic, course-start-topic. Assess only the four requested topic introductions."
  criteria:
