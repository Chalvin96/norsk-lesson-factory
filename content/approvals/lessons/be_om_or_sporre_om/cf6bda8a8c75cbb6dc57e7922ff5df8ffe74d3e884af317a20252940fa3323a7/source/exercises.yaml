- handle: review_menu_result_contrast
  op: choose
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: 'Choose the reply that suits the guest’s requests.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Servitør
      text_md: «Menyen ligger på bordet. Hva ønsker du?»
    - speaker: Context
      text_md: Gjesten vil først vite om suppen er vegetarisk, og deretter vil
        gjesten få regningen.
  options:
  - id: correct
    text: Jeg spør om suppen er vegetarisk. Så ber jeg om regningen.
    correct: true
    why: Spørre om introduces the soup as an information topic, while be om
      requests the bill as an item to be provided.
  - id: both-request
    text: Jeg ber om suppen. Så ber jeg om regningen.
    correct: false
    why: The first line requests the soup itself instead of the information
      about whether it is vegetarian, so it does not match the first wish.
  - id: both-information
    text: Jeg spør om suppen er vegetarisk. Så spør jeg hvor stor regningen er.
    correct: false
    why: The first expression fits, but the second asks for information about
      the bill's amount instead of requesting the bill.
  explanation_md: 'Velg uttrykk etter hva gjesten ønsker å oppnå, selv om begge ønskene kommer opp i samme samtale.'
  derived_from:
  - section_id: retrieval-and-review
