    instruction: The first introduction uses spørre om to introduce breakfast as
      the topic; the supplied direct question provides the specific information
      need.
  - id: train-price-topic
    instruction: The second introduction uses spørre om to introduce the train
      ticket or ticket price as the topic; the supplied direct question provides
      the specific information need.
  - id: museum-hours-topic
    instruction: The third introduction uses spørre om to introduce the museum
      as the topic; the supplied direct question provides the specific
      information need.
  - id: course-start-topic
    instruction: The fourth introduction uses spørre om to introduce the course
      as the topic; the supplied direct question provides the specific
      information need.
  explanation_md: '«Spørre om» innleder temaet. Det direkte spørsmålet viser hvilken opplysning du trenger.'
  derived_from:
  - section_id: second-checkpoint-formulate-information-questions
