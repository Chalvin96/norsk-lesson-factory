- handle: first_checkpoint_intended_result
  op: choose
  objective: obj-be-om-or-sporre-om-01
  bloom: understand
  prompt_md: Velg svaret som passer til begge Noras behov.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Nora vil vite når frokosten begynner, og hun vil ha et ekstra
        håndkle.
    - speaker: Nora
      text_md: «Hva sier jeg?»
  options:
  - id: both-information
    text: Kan jeg spørre om frokosttidene? Kan jeg spørre når håndkleet kommer?
    correct: false
    why: The second line asks when the towel will arrive instead of requesting
      an extra towel.
  - id: correct
    text: Kan jeg spørre om frokosttidene? Kan jeg be om et ekstra håndkle?
    correct: true
    why: Spørre om frames the topic Nora wants information about, and be om
      requests the towel as an item.
  - id: reversed-forms
    text: Kan jeg be om frokosttidene? Kan jeg spørre om det finnes ekstra
      håndklær?
    correct: false
    why: 'The first line requests information as if it were an item, and the second
      asks whether extra towels are available instead of requesting one.'
  derived_from:
  - section_id: first-checkpoint-intended-result
- handle: controlled_practice_requesting_things_and_actions
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: "Kafévert: «Hva kan jeg hjelpe deg med?» Du vil ha regningen, og kollegaen din skal sende en e-post til kunden. Skriv to nummererte forespørsler: be om regningen, og be en person om å sende e-posten."
  min_words: 12
  max_words: 28
  response_language: 'no'
  judge_prompt: "Check the response against cafe-bill, colleague-email. Accept natural Bokmål variants that preserve the supplied facts."
  criteria:
  - id: cafe-bill
    instruction: The first request asks for the bill with be om.
  - id: colleague-email
    instruction: The second request asks the colleague to send an email, using
      be plus the person plus om å and the action.
  explanation_md: 'Etter «be om» kommer tingen. Når en person skal gjøre noe, står personen foran «om å».'
  derived_from:
  - section_id: controlled-practice-requesting-things-and-actions
- handle: second_checkpoint_formulate_information_questions
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: "Resepsjonist: «Hva vil du vite?» Skriv fire nummererte innledninger til spørsmålene: Når begynner frokosten? Hvor mye koster en togbillett? Når åpner museet? Når begynner kurset? Bruk «spørre om»."
  min_words: 20
  max_words: 44
  response_language: 'no'
  judge_prompt: "Check the response against breakfast-topic, train-price-topic, museum-hours-topic, course-start-topic. Assess only the four requested topic introductions."
  criteria:
  - id: breakfast-topic
    instruction: The first introduction uses spørre om to introduce breakfast as
      the topic; the supplied direct question provides the specific information
      need.
  - id: train-price-topic
    instruction: The second introduction uses spørre om to introduce the train
      ticket or ticket price as the topic; the supplied direct question provides
      the specific information need.
  - id: museum-hours-topic
    instruction: The third introduction uses spørre om to introduce the museum
      as the topic; the supplied direct question provides the specific
      information need.
  - id: course-start-topic
    instruction: The fourth introduction uses spørre om to introduce the course
      as the topic; the supplied direct question provides the specific
      information need.
  explanation_md: '«Spørre om» innleder temaet. Det direkte spørsmålet viser hvilken opplysning du trenger.'
  derived_from:
  - section_id: second-checkpoint-formulate-information-questions
- handle: contrast_practice_change_intended_result
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: "Servitør: «Hva ønsker du?» Først vil du ha menyen, og deretter vil du vite om den har vegetarretter. Svar i to setninger."
  min_words: 12
  max_words: 26
  response_language: 'no'
  judge_prompt: "Check the response against menu-item, menu-information, order. Accept natural Bokmål variants that communicate the supplied facts."
  criteria:
  - id: menu-item
    instruction: The first sentence requests the physical menu with be om.
  - id: menu-information
    instruction: The second sentence asks about vegetarian options with spørre
      om.
  - id: order
    instruction: The item request comes before the information question.
  explanation_md: 'Uttrykket avgjøres av hva du vil oppnå, ikke av substantivet dere snakker om.'
  derived_from:
  - section_id: contrast-practice-change-intended-result
