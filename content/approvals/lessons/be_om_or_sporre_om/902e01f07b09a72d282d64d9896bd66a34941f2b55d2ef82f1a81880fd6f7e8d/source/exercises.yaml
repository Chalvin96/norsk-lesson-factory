- handle: final_contextual_practice
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: "Du er gjest i hotellresepsjonen. Be høflig om et trykt bykart, og be deretter resepsjonisten bestille vekking klokka seks i morgen. Skriv to replikker på norsk."
  response_language: 'no'
  min_words: 12
  max_words: 24
  judge_prompt: >-
    Check that the response has two natural guest requests: one requesting a printed
    city map as an item, and one asking the receptionist to arrange a wake-up call
    for six tomorrow morning. The item request should use be om; the action request
    should use a natural form of be + the person or pronoun + om å + infinitive. Accept
    natural Bokmål variants and direct-address pronouns.
  criteria:
  - id: map-request
    instruction: One line requests a printed city map with a form of be om.
  - id: wake-up-action
    instruction: One line asks the receptionist to arrange a wake-up call for
      six tomorrow morning, using a form of be followed by the addressee or a
      coherent noun for the receptionist, then om å and an infinitive.
  - id: two-lines
    instruction: The response contains two guest lines suitable for a hotel
      reception.
  explanation_md: 'Den ene replikken ber om en ting. Den andre ber en bestemt person om å gjøre noe.'
  derived_from:
  - section_id: final-contextual-practice
- handle: retrieval_and_review
  op: write
  objective: obj-be-om-or-sporre-om-01
  bloom: apply
  prompt_md: "Amir skriver: «Jeg er på biblioteket. Jeg trenger en kopi av artikkelen, bibliotekaren skal finne den, og jeg vil vite når biblioteket stenger.» Forklar forskjellen mellom «be om» og «spørre om», og skriv én passende setning for hvert behov: be om kopien, be bibliotekaren om å finne den, og spørre om stengetiden."
  min_words: 28
  max_words: 50
  response_language: 'no'
  judge_prompt: "Check the response against distinction-explanation, copy-request, librarian-action, closing-information. Accept natural Bokmål variants grounded in Amir's message."
  criteria:
  - id: distinction-explanation
    instruction: The reply explains that be om requests an item or action, while
      spørre om seeks information about a topic.
  - id: copy-request
    instruction: The reply includes a suitable be om request for a copy of the
      article.
  - id: librarian-action
    instruction: The reply includes a suitable request for the librarian to find
      the article, using be plus the person plus om å.
  - id: closing-information
    instruction: The reply includes a suitable use of spørre om for the library
      closing time.
  explanation_md: 'De tre behovene krever henholdsvis en forespørsel om en ting, en forespørsel om en handling og et spørsmål om informasjon.'
  derived_from:
  - section_id: retrieval-and-review
