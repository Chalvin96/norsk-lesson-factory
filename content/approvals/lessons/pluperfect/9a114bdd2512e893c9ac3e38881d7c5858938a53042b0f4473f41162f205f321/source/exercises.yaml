      sentences.
  - id: both-before
    text: Bestillingen og serveringen skjedde før Mari kom.
    correct: true
    why: The two past-perfect phrases present completed events before Mari’s
      arrival.
  explanation_md: «Hadde bestilt» og «hadde satt» viser begge til noe som var
    gjort da Mari kom.
