- handle: reconstruct_maris_delay
  op: write
  objective: obj-pluperfect-01
  bloom: apply
  prompt_md: "Du er Mari. Skriv Jonas en melding om hvorfor du kom for sent. Ta med disse punktene: sjekke den nye bussruta; lagre den gamle ruta på telefonen; følge den gamle ruta til feil holdeplass; oppdage feilen etter bussavgangen; vente på neste buss. Bruk «hadde» med partisipp om det som skjedde før du kom fram."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Hvorfor kom du så sent til kafeen?»
  response_language: "no"
  min_words: 45
  max_words: 65
  judge_prompt: "Evaluate the gating criteria main-events, earlier-facts, explanation-purpose, pluperfect-form when deciding whether the response passes."
  criteria:
  - id: main-events
    instruction: States that Mari followed the old route to the wrong stop,
      discovered the problem, and waited for the next bus.
  - id: earlier-facts
    instruction: Includes the supplied facts about checking the new route,
      saving the old route, and the bus already being gone.
  - id: explanation-purpose
    instruction: Gives Jonas a coherent explanation of why Mari was late.
  - id: pluperfect-form
    instruction: Uses «hadde» with a correct past participle to mark an earlier
      fact.
  derived_from:
  - section_id: returning-to-mari-jonas-and-amina
