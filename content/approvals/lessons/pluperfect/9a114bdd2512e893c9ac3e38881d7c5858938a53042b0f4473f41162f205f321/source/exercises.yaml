    text: Bestillingen og serveringen skjedde etter at Mari kom.
    correct: false
    why: This reverses the relationship expressed by the past-perfect phrases.
  - id: order-split
    text: Bestillingen skjedde før Mari kom, men serveringen skjedde etterpå.
    correct: false
