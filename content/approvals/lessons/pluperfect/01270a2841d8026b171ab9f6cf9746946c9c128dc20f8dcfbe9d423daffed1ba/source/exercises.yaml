  prompt_md: Choose the timeline described by both sentences.
  stem_md: «Da Mari kom, hadde vi bestilt mat.» «Da Mari kom, hadde servitøren satt maten på bordet.»
  options:
  - id: both-after
    text: Bestillingen og serveringen skjedde etter at Mari kom.
    correct: false
    why: This reverses the relationship expressed by the past-perfect phrases.
  - id: order-split
    text: Bestillingen skjedde før Mari kom, men serveringen skjedde etterpå.
    correct: false
    why: This treats identical timeline marking differently in the two sentences.
  - id: both-before
    text: Bestillingen og serveringen skjedde før Mari kom.
    correct: true
    why: The two past-perfect phrases present completed events before Mari’s arrival.
  explanation_md: «Hadde bestilt» and «hadde satt» both look back from the moment Mari arrived.
  derived_from:
  - section_id: late-arrival
