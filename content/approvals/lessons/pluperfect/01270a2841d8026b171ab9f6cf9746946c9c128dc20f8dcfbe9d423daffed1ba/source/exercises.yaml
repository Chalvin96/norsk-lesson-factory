- handle: discriminate_past_sequence
  op: choose
  objective: obj-pluperfect-01
  bloom: analyze
  prompt_md: Choose the sentence that matches the facts.
  stem_md: 'Facts: First: Filmen begynte. Later: Vi kom til kinoen. By that later moment, the film was
    already over.'
  options:
  - id: both-main-sequence
    text: Da vi kom til kinoen, begynte filmen.
    correct: false
    why: This places the film’s beginning at the time of arrival, while the facts say it was already over.
  - id: film-earlier
    text: Da vi kom til kinoen, hadde filmen begynt.
    correct: true
    why: The past perfect marks the film’s beginning as earlier than the arrival.
  - id: arrival-earlier
    text: Vi kom til kinoen før filmen begynte.
    correct: false
    why: This reverses the stated order.
  explanation_md: Choose the sentence that places the film’s beginning before the arrival.
  derived_from:
  - section_id: likely-misconception-not-every-earlier-event-needs-hadde
- handle: reconstruct_maris_delay
  op: write
  objective: obj-pluperfect-01
  bloom: apply
  prompt_md: 'Message from Jonas: «Hvorfor kom du så sent til kafeen?» Facts in order: Mari sjekket den
    nye bussruta på forhånd, men lagret likevel den gamle ruta på telefonen. Hun fulgte den gamle bussruta
    og gikk derfor til feil holdeplass. Da hun oppdaget feilen, var bussen fra riktig holdeplass allerede
    borte. Hun ventet på neste buss. Write a 45–65-word message to Jonas explaining why Mari was late.
    Your message must use «hadde» with at least one past participle for an earlier fact.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Hvorfor kom du så sent til kafeen?»
    - speaker: Mari
      text_md: «Jeg skal forklare hva som skjedde.»
  response_language: 'no'
  min_words: 45
  max_words: 65
  judge_prompt: Evaluate the gating criteria main-events, earlier-facts, explanation-purpose, pluperfect-form,
    and word-bound when deciding whether the response passes.
  criteria:
  - id: main-events
    instruction: States that Mari followed the old route to the wrong stop, discovered the problem, and
      waited for the next bus.
  - id: earlier-facts
    instruction: Includes the supplied facts about checking the new route, saving the old route, and the
      bus already being gone.
  - id: explanation-purpose
    instruction: Gives Jonas a coherent explanation of why Mari was late.
  - id: pluperfect-form
    instruction: Uses «hadde» with a correct past participle to mark an earlier fact.
  - id: word-bound
    instruction: Contains 45–65 words.
  derived_from:
  - section_id: returning-to-mari-jonas-and-amina
