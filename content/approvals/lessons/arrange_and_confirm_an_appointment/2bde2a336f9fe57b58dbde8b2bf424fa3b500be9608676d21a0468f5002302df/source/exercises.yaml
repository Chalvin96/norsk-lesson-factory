- handle: state_purpose
  op: choose
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Choose the request that matches the note.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: '**Notat fra Mina** Problem: jeg ser dårlig på avstand. Sted: optiker.'
  options:
  - id: brake-check
    text: Jeg vil gjerne bestille en time for en bremsesjekk.
    correct: false
    why: The service concerns bicycle brakes rather than eyesight.
  - id: haircut
    text: Jeg vil gjerne bestille en time for en hårklipp.
    correct: false
    why: The service concerns hair rather than eyesight.
  - id: eye-test
    text: Jeg vil gjerne bestille en time for en synstest.
    correct: true
    why: A synstest matches the stated problem and the optician.
  derived_from:
  - section_id: checkpoint-state-purpose
- handle: ask_availability
  op: choose
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Choose the question that asks the business about the open period.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: '**Optikerens kalender** | Periode | Status | |---|---| | Mandag | Full | | Tirsdag morgen
        | Full | | Tirsdag ettermiddag | Ledig |'
  options:
  - id: wrong-period
    text: Har dere noe ledig tirsdag morgen?
    correct: false
    why: It asks about the same business availability but names a full period.
  - id: personal-suitability
    text: Passer tirsdag ettermiddag for deg?
    correct: false
    why: It asks whether Tuesday suits one person rather than whether the business has an open appointment.
  - id: open-period
    text: Har dere noe ledig tirsdag ettermiddag?
    correct: true
    why: It asks the business about the period marked open.
  derived_from:
  - section_id: checkpoint-ask-availability
- handle: understand_offered_time
  op: choose
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: understand
  prompt_md: Choose the calendar entry for the offered appointment.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Verkstedet
      text_md: «Vi har en ledig time torsdag klokka halv tre.»
  options:
  - id: thursday-1530
    text: Torsdag klokka 15.30
    correct: false
    why: This treats halv tre as half past three.
  - id: thursday-1415
    text: Torsdag klokka 14.15
    correct: false
    why: This interprets the expression as quarter past two.
  - id: thursday-1430
    text: Torsdag klokka 14.30
    correct: true
    why: Halv tre is half past two.
  derived_from:
  - section_id: understanding-offered-slot
- handle: accept_precisely
  op: choose
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Choose the response that accepts the exact offered slot and names both the offered day and
    the offered time.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Resepsjonisten
      text_md: '«Vi har to timer på onsdag: klokka ti og klokka ett. Passer klokka ti?»'
    - speaker: Context
      text_md: '**Mina sin kalender** Ledig etter klokka ni.'
  options:
  - id: vague-acceptance
    text: Ja, onsdag passer fint.
    correct: false
    why: It confirms only the day and leaves the two offered times unresolved, so it does not name the
      offered time.
  - id: precise-acceptance
    text: Ja, onsdag klokka ti passer fint.
    correct: true
    why: It accepts and repeats the offered day and time.
  - id: other-slot
    text: Ja, onsdag klokka ett passer fint.
    correct: false
    why: It accepts the other Wednesday slot.
  derived_from:
  - section_id: checkpoint-accept-precisely
- handle: reject_and_counter
  op: choose
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Choose the reply that rejects the conflict and proposes a possible alternative.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Verkstedet
      text_md: «Passer tirsdag klokka ett?»
    - speaker: Context
      text_md: '**Mina sin kalender** | Tid | Status | |---|---| | Tirsdag 09.00–16.00 | På jobb | | Onsdag
        morgen | Ledig |'
  options:
  - id: repeats-conflict
    text: Dessverre passer ikke det. Jeg er på jobb da. Hva med tirsdag klokka ett?
    correct: false
    why: It rejects the offer and then proposes the same conflicting slot.
  - id: valid-counterproposal
    text: Dessverre passer ikke det. Jeg er på jobb da. Hva med onsdag morgen?
    correct: true
    why: It rejects the work conflict and proposes the available period.
  - id: rejects-without-alternative
    text: Dessverre passer ikke det. Jeg er på jobb da. Jeg kan ikke komme.
    correct: false
    why: It explains the rejection but does not make the requested counterproposal.
  derived_from:
  - section_id: checkpoint-reject-counter
- handle: confirm_full_appointment
  op: choose
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Choose the confirmation that matches every detail.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: '**Timekortet** | Formål | Dato | Tid | |---|---|---| | Bremsesjekk | Fredag 14. mars |
        16.15 |'
  options:
