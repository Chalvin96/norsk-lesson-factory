  - id: wrong-purpose
    text: 'Ja, det stemmer: fredag 14. mars klokka 16.15 for en synstest.'
    correct: false
    why: The date and time match, but the service is different.
  - id: complete-match
    text: 'Ja, det stemmer: fredag 14. mars klokka 16.15 for en bremsesjekk.'
    correct: true
    why: The purpose, date, and time all match the card.
  derived_from:
  - section_id: checkpoint-confirm-full-appointment
- handle: appointment_message
  op: write
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Write a 25–45 word reply to the clinic. Reject the Tuesday 12 May at 10.00 offer because
    you are at work, accept the Thursday 14 May at 15.30 offer, and confirm the purpose, date, and time.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Fjordklinikken
      text_md: «Hei! Vi kan tilby synstest tirsdag 12. mai klokka 10.00. Hvis det ikke passer, har vi
        også torsdag 14. mai klokka 15.30.»
    - speaker: Context
      text_md: '**Kalenderen din** Tirsdag klokka 10.00: på jobb. Torsdag klokka 15.30: ledig.'
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: Evaluate criteria [addresses-clinic-message], [rejects-conflict], [accepts-workable-slot],
    [confirms-details], and [word-bound]. Criterion [accepts-workable-slot] fails if the reply only asks
    about or requests the Thursday slot instead of accepting it. Criterion [appointment-language-observation]
    is diagnostic only and cannot make the answer fail.
  criteria:
  - id: addresses-clinic-message
    instruction: The reply is written to Fjordklinikken as a response to its appointment offer.
  - id: rejects-conflict
    instruction: The reply states that Tuesday 12 May at 10.00 does not work.
  - id: accepts-workable-slot
    instruction: The reply accepts Thursday 14 May at 15.30 as the chosen appointment, rather than merely
      asking whether that slot is available.
  - id: confirms-details
    instruction: The reply identifies the synstest, Thursday 14 May, and 15.30 consistently.
  - id: word-bound
    instruction: The reply contains 25–45 words.
  - id: appointment-language-observation
    instruction: Observe whether the learner uses natural language for rejecting, accepting, or confirming
      an appointment; report issues diagnostically without failing the answer.
  derived_from:
  - section_id: making-counterproposal
  - section_id: confirming-purpose-date-time
- handle: revise_confirmation
  op: write
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Rewrite the reply in 12–25 words so the dental office can verify the purpose, date, and time.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Tannlegen
      text_md: «Da er du satt opp for kontroll mandag 7. september klokka 08.30.»
    - speaker: Context
      text_md: '**Ditt utkast** Ja, mandag stemmer.'
  response_language: 'no'
  min_words: 12
  max_words: 25
  judge_prompt: Evaluate criteria [reply-to-office], [complete-correction], [consistent-details], and
    [word-bound]. Criterion [confirmation-form-observation] is diagnostic only and cannot make the answer
    fail.
  criteria:
  - id: reply-to-office
    instruction: The response functions as a reply confirming the dental appointment.
  - id: complete-correction
    instruction: The revised reply includes the control appointment, Monday 7 September, and 08.30.
  - id: consistent-details
    instruction: No appointment detail contradicts the dental office's message.
  - id: word-bound
    instruction: The reply contains 12–25 words.
  - id: confirmation-form-observation
    instruction: Observe whether the learner uses a natural confirmation expression; report issues diagnostically
      without failing the answer.
  derived_from:
  - section_id: common-mistakes
- handle: integrated_transfer
  op: write
  objective: obj-arrange-and-confirm-an-appointment-01
  bloom: apply
  prompt_md: Write a 70–110 word Norwegian chat between Nora and the salon. Nora asks about Friday afternoon,
    rejects the first offer of Friday 2 October at 13.00 because she works until 14.00, proposes a time
    after 15.00, accepts the final slot of Friday 2 October at 15.30, and confirms the haircut, date,
    and time.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: '**Salongfakta** | Detalj | Informasjon | |---|---| | Kunde | Nora | | Formål | Hårklipp
        | | Ønsket periode | Fredag ettermiddag | | Første tilbud | Fredag 2. oktober klokka 13.00 | |
        Konflikt | Nora jobber til klokka 14.00 | | Noras alternativ | Etter klokka 15.00 | | Avtalt tid
        | Fredag 2. oktober klokka 15.30 |'
  response_language: 'no'
  min_words: 70
  max_words: 110
  judge_prompt: Evaluate criteria [chat-genre], [states-purpose], [asks-availability], [handles-first-offer],
    [makes-counterproposal], [accepts-final-slot], [confirms-full-booking], [consistent-booking], and
    [word-bound]. Criterion [target-forms-observation] is diagnostic only and cannot make the answer fail.
  criteria:
  - id: chat-genre
    instruction: The response is a Norwegian chat exchange between Nora and the salon.
  - id: states-purpose
    instruction: Nora communicates that the appointment is for a haircut.
  - id: asks-availability
    instruction: Nora asks about availability Friday afternoon.
  - id: handles-first-offer
    instruction: Nora rejects Friday 2 October at 13.00 because she works until 14.00.
  - id: makes-counterproposal
    instruction: Nora asks for or proposes a time after 15.00.
  - id: accepts-final-slot
    instruction: Nora accepts Friday 2 October at 15.30.
  - id: confirms-full-booking
    instruction: The exchange confirms the haircut, Friday 2 October, and 15.30.
  - id: consistent-booking
    instruction: The exchange concerns one appointment and does not contradict the supplied facts.
  - id: word-bound
    instruction: The response contains 70–110 words.
  - id: target-forms-observation
    instruction: Observe the naturalness of the availability, rejection, counterproposal, acceptance,
      and confirmation forms; report issues diagnostically without failing the answer.
  derived_from:
  - section_id: integrated-transfer-practice
