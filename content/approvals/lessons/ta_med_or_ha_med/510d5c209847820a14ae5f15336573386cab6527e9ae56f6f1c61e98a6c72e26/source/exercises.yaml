- handle: change_the_viewpoint
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: Rewrite the six facts as short Norwegian sentences. Report the first three as what each person
    has with them now; report the last three as planned actions to bring the people or objects along. Use ha
    med for current accompaniment and ta med for planned actions.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sander
      text_md: «Jeg har dokumentene hos meg.»
    - speaker: Mina
      text_md: «Vi har håndklærne hos oss.»
    - speaker: Sander
      text_md: «Mina har søsteren sin hos seg.»
    - speaker: Mina
      text_md: «Før avreise sørger Sander for at dokumentene blir med til kontoret.»
    - speaker: Sander
      text_md: «Vi sørger for at håndklærne blir med til stranda.»
    - speaker: Mina
      text_md: «Jeg sørger for at søsteren min blir med på konserten.»
  explanation_md: The first three sentences report present accompaniment; the last three describe planned
    actions. Natural Norwegian permits more than one position for med in these sentences.
  derived_from:
  - section_id: third-checkpoint-change-the-viewpoint
  response_language: 'no'
  min_words: 30
  max_words: 60
  judge_prompt: Evaluate six-facts, viewpoint-contrast, norwegian, and word-bound. Accept natural Bokmål
    variants that preserve each fact and meaning, including «Sander har med dokumentene» and «Sander har
    dokumentene med»; do not require a single position for med.
  criteria:
  - id: six-facts
    instruction: 'Preserves all six facts: Sander has the documents; we have towels; Mina has her sister with her; Sander plans to take the documents to the office; we plan to take towels to the beach; Mina plans to take her sister to the concert.'
  - id: viewpoint-contrast
    instruction: Uses ha med to report what is currently with someone in the first three sentences, and ta med for planned actions in the last three; accept natural placement of med before or after the object.
  - id: norwegian
    instruction: The sentences are understandable, natural Bokmål.
  - id: word-bound
    instruction: The response contains 30–60 words.
- handle: guided_context_practice
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Til: Læreren din. Formål: Fortell kort hvordan piknikdagen ble planlagt og gjennomført.
    Før avreise skulle Ali sørge for at maten ble med. På busstoppet kontrollerte Nora om Liv hadde et
    teppe hos seg. I parken hadde Mina to venner hos seg. Ved planleggingen av neste piknik ba Nora Ali
    sørge for at en ball blir med. Bruk ta med for de to planlagte handlingene og ha med for kontrollen
    og rapporten. Skriv en norsk melding på 45–65 ord.'
  explanation_md: A natural message normally shifts from actions that arrange accompaniment before departure
    to checks and reports about what is already present later.
  derived_from:
  - section_id: guided-context-practice
  response_language: 'no'
  judge_prompt: Evaluate criteria message-purpose, supplied-facts, norwegian-text, word-bound, action-form,
    and state-form as gating criteria. Record action-form-observation and state-form-observation diagnostically,
    but never fail the response because of either observation. Add no requirements beyond these criterion
    ids.
  criteria:
  - id: message-purpose
    instruction: Writes a coherent message to the teacher that reports the planning and course of the
      picnic day.
  - id: supplied-facts
    instruction: Communicates all four supplied facts without materially changing who acts, what accompanies
      them, or when each event occurs.
  - id: norwegian-text
    instruction: Writes the message in understandable Norwegian.
  - id: word-bound
    instruction: Uses 45–65 words.
  - id: action-form
    instruction: Uses a natural ta med form for both actions that arrange accompaniment.
  - id: state-form
    instruction: Uses a natural ha med form for the bus-stop check and park report.
  - id: action-form-observation
    instruction: 'Observation only: note whether the taught ta med form appears; do not fail a natural
      equivalent.'
  - id: state-form-observation
    instruction: 'Observation only: note whether the taught ha med form appears; do not fail a natural
      equivalent.'
- handle: retrieval_and_review
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Situasjon: Du og Erik står ved bilen før dere går tur. Mottaker: Erik. Formål: Send én kort
    melding der du ber ham sørge for at paraplyen blir med fra bilen, og sier at dere vil ha den med på
    turen. Skriv meldingen på 12–20 ord.'
  explanation_md: Both clauses belong to the same moment before the walk. The request presents bringing the
    umbrella as an action; the second clause describes having it with you on the walk.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: Evaluate criteria recipient-and-purpose, single-setting, same-object, norwegian-text,
    word-bound, action-form, and state-form as gating criteria. Accept natural Norwegian alternatives that
    preserve the action and possession meanings. Add no requirements beyond these criterion ids.
  criteria:
  - id: recipient-and-purpose
    instruction: Addresses Erik with one coherent message before the walk, asking him to bring the umbrella
      from the car and expressing that it is wanted on the walk.
  - id: single-setting
    instruction: Both clauses make sense in the same setting and at the same time, before the walk begins.
  - id: same-object
    instruction: Both clauses concern the same umbrella.
  - id: norwegian-text
    instruction: Writes the message in understandable Norwegian.
  - id: word-bound
    instruction: Uses 12–20 words.
  - id: action-form
    instruction: Uses a natural ta med form to express the action of bringing the umbrella from the car.
  - id: state-form
    instruction: Uses a natural ha med form to express having the umbrella with them on the walk.
- handle: review_ta_med_action
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Du pakker solbrillene til en fjelltur. Skriv én setning som sier at du sørger for at de
    blir med. Bruk ett av uttrykkene «ta med» eller «ha med» i riktig form.'
  explanation_md: Before departure, the reply presents the action that makes the sunglasses accompany
    the speaker, so ta med expresses the action.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: Evaluate only criterion action-expression. Accept a grammatical sentence using the taught
    expression for the planned action of bringing the sunglasses along, and add no other gating requirement.
  criteria:
  - id: action-expression
    instruction: Uses ta med to express the planned action of bringing the sunglasses along.
- handle: review_ha_med_state
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Du er på en hytte, og lommelykten er allerede i sekken din. Skriv én setning som forteller
    at lommelykten er hos deg på turen. Bruk ett av uttrykkene «ta med» eller «ha med» i riktig form.'
  explanation_md: The sentence reports an object as already accompanying the speaker, so har med expresses
    the state.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: Evaluate only criterion state-expression. Accept a grammatical sentence using the taught
    expression for the flashlight already being with the speaker, and add no other gating requirement.
  criteria:
  - id: state-expression
    instruction: Uses ha med to report that the flashlight is already with the speaker.
