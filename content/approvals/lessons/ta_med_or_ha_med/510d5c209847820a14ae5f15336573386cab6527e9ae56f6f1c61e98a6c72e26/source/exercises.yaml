- handle: identify_ta_med_ha_med
  op: categorize
  objective: obj-ta-med-or-ha-med-01
  bloom: analyze
  prompt_md: Sort each line by meaning. Does it arrange for someone or something to accompany a person, or check or report whether something is with them?
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Emil
      text_md: «Skal jeg ta med noe mat?»
    - speaker: Nora
      text_md: «Jeg har ikke med nøkkelen.»
    - speaker: Emil
      text_md: «Da kan jeg ta den med.»
    - speaker: Nora
      text_md: «Har du med varme klær?»
  explanation_md: Ta med presents an action that makes something accompany a person; ha med presents something
    as already accompanying the person.
  derived_from:
  - section_id: first-checkpoint-identify-action-and-situation
  buckets:
  - bucket_id: arranging-accompaniment
    label: Arranging for someone or something to accompany a person
  - bucket_id: already-present
    label: Checking or reporting whether something is with someone
  items:
  - item_id: food-before-departure
    text: Skal jeg ta med noe mat?
    bucket_id: arranging-accompaniment
  - item_id: key-on-bus
    text: Jeg har ikke med nøkkelen.
    bucket_id: already-present
  - item_id: key-from-home
    text: Da kan jeg ta den med.
    bucket_id: arranging-accompaniment
  - item_id: clothes-on-journey
    text: Har du med varme klær?
    bucket_id: already-present
