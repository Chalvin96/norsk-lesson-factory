- handle: guided_context_practice
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Til: Læreren din. Formål: Fortell kort hvordan piknikdagen ble planlagt og gjennomført.
    Før avreise skulle Ali sørge for at maten ble med. På busstoppet kontrollerte Nora om Liv hadde et
    teppe hos seg. I parken hadde Mina to venner hos seg. Ved planleggingen av neste piknik ba Nora Ali
    sørge for at en ball blir med. Bruk ta med for de to planlagte handlingene og ha med for kontrollen
    og rapporten. Skriv en norsk melding på 45–65 ord.'
  explanation_md: A natural message normally shifts from actions that arrange accompaniment before departure
    to checks and reports about what is already present later.
  derived_from:
  - section_id: guided-context-practice
  response_language: 'no'
  judge_prompt: Evaluate criteria message-purpose, supplied-facts, norwegian-text, word-bound, action-form,
    and state-form as gating criteria. Record action-form-observation and state-form-observation diagnostically,
    but never fail the response because of either observation. Add no requirements beyond these criterion
    ids.
  criteria:
  - id: message-purpose
    instruction: Writes a coherent message to the teacher that reports the planning and course of the
      picnic day.
  - id: supplied-facts
    instruction: Communicates all four supplied facts without materially changing who acts, what accompanies
      them, or when each event occurs.
  - id: norwegian-text
    instruction: Writes the message in understandable Norwegian.
  - id: word-bound
    instruction: Uses 45–65 words.
  - id: action-form
    instruction: Uses a natural ta med form for both actions that arrange accompaniment.
  - id: state-form
    instruction: Uses a natural ha med form for the bus-stop check and park report.
  - id: action-form-observation
    instruction: 'Observation only: note whether the taught ta med form appears; do not fail a natural
      equivalent.'
  - id: state-form-observation
    instruction: 'Observation only: note whether the taught ha med form appears; do not fail a natural
      equivalent.'
- handle: retrieval_and_review
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Situasjon: Før turen ber du Erik sørge for at paraplyen blir med. På møtestedet ser du etter
    paraplyen og ber ham bekrefte at den er hos ham. Mottaker: Erik. Formål: Send én kort melding som
    uttrykker begge tidspunktene. Bruk ta med i forespørselen og ha med i bekreftelsen. Skriv en norsk
    melding på 18–30 ord.'
  explanation_md: The message needs an earlier arrangement and a later confirmation about the same umbrella;
    natural Norwegian commonly changes expression when the viewpoint changes.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: Evaluate criteria recipient-and-purpose, two-viewpoints, same-object, norwegian-text,
    word-bound, action-form, and state-form as gating criteria. Record action-form-observation and state-form-observation
    diagnostically, but never fail the response because of either observation. Add no requirements beyond
    these criterion ids.
  criteria:
  - id: recipient-and-purpose
    instruction: Addresses Erik with a coherent message that first requests an action and later asks for
      confirmation.
  - id: two-viewpoints
    instruction: Clearly expresses both the request before the trip and the confirmation check at the
      meeting place.
  - id: same-object
    instruction: Both parts concern the supplied umbrella.
  - id: norwegian-text
    instruction: Writes the message in understandable Norwegian.
  - id: word-bound
    instruction: Uses 18–30 words.
  - id: action-form
    instruction: Uses a natural ta med form for the request.
  - id: state-form
    instruction: Uses a natural ha med form for the later check.
  - id: action-form-observation
    instruction: 'Observation only: note whether the taught ta med form appears; do not fail a natural
      equivalent.'
  - id: state-form-observation
    instruction: 'Observation only: note whether the taught ha med form appears; do not fail a natural
      equivalent.'
- handle: review_ta_med_action
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Situasjon: Du pakker til en fjelltur og vil uttrykke handlingen som får solbrillene med
    på turen. Skriv denne setningen: «Jeg skal ta med solbrillene.»'
  explanation_md: Before departure, the reply presents the action that makes the sunglasses accompany
    the speaker, so ta med expresses the action.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  judge_prompt: Evaluate only criterion action-expression. Accept the visible target sentence with harmless
    punctuation variation, and add no other gating requirement.
  criteria:
  - id: action-expression
    instruction: Supplies the action expression ta med in the sentence «Jeg skal ta med solbrillene.»
