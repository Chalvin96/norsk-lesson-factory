  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Build the six sentences in the new viewpoint from the dialogue: use ha med for what each
    person already has, and ta med for what is arranged.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sander
      text_md: «Jeg har dokumentene hos meg.»
    - speaker: Mina
      text_md: «Vi har håndklærne hos oss.»
    - speaker: Sander
      text_md: «Mina har søsteren sin hos seg.»
    - speaker: Mina
      text_md: «Før avreise sørger Sander for at dokumentene blir med til kontoret.»
    - speaker: Sander
      text_md: «Vi sørger for at håndklærne blir med til stranda.»
