  bloom: apply
  prompt_md: 'Du pakker solbrillene til en fjelltur. Skriv én setning om at du sørger for at de blir med. Bruk «ta med» i riktig form.'
  explanation_md: «Ta med» beskriver handlingen der solbrillene blir pakket til turen.
  derived_from:
  - section_id: retrieval-and-review
  response_language: "no"
  judge_prompt: Evaluate only criterion action-expression. Accept a grammatical sentence using the taught expression for the planned action of bringing the sunglasses along, and add no other gating requirement.
  criteria:
  - id: action-expression
    instruction: Uses ta med to express the planned action of bringing the sunglasses along.
