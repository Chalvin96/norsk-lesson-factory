- handle: change_the_viewpoint
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: Skriv om de seks opplysningene som korte norske setninger. Bruk «ha med» om det personene har hos seg nå, og «ta med» om det de planlegger å ta med seg.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sander
      text_md: «Jeg har dokumentene hos meg.»
    - speaker: Mina
      text_md: «Vi har håndklærne hos oss.»
    - speaker: Sander
      text_md: «Mina har søsteren sin hos seg.»
    - speaker: Mina
      text_md: «Før avreise sørger Sander for at dokumentene blir med til kontoret.»
    - speaker: Sander
      text_md: «Vi sørger for at håndklærne blir med til stranda.»
    - speaker: Mina
      text_md: «Jeg sørger for at søsteren min blir med på konserten.»
  explanation_md: De tre første setningene forteller hva personene har med seg nå. De tre siste beskriver noe de planlegger å ta med. Begge plasseringene av «med» kan være naturlige på norsk.
  derived_from:
  - section_id: third-checkpoint-change-the-viewpoint
  response_language: "no"
  min_words: 30
  max_words: 60
  judge_prompt: Evaluate six-facts, viewpoint-contrast, norwegian, and word-bound. Accept natural Bokmål variants that preserve each fact and meaning, including «Sander har med dokumentene» and «Sander har dokumentene med»; do not require a single position for med.
  criteria:
  - id: six-facts
    instruction: 'Preserves all six facts: Sander has the documents; we have towels; Mina has her sister with her; Sander plans to take the documents to the office; we plan to take towels to the beach; Mina plans to take her sister to the concert.'
  - id: viewpoint-contrast
    instruction: Uses ha med to report what is currently with someone in the first three sentences, and ta med for planned actions in the last three; accept natural placement of med before or after the object.
  - id: norwegian
    instruction: The sentences are understandable, natural Bokmål.
  - id: word-bound
    instruction: The response contains 30–60 words.
- handle: guided_context_practice
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Skriv en melding på 45–65 ord til læreren din om piknikdagen. Ali sørget for at maten ble med før avreise. På busstoppet sjekket Nora om Liv hadde et teppe. I parken hadde Mina to venner hos seg. Til neste piknik ba Nora Ali sørge for at en ball blir med. Bruk både ta med og ha med naturlig i meldingen.'
  explanation_md: Før avreise handler det om å sørge for at noe blir med. Senere spør man om noe allerede er med eller forteller at det er det.
  derived_from:
  - section_id: guided-context-practice
  response_language: "no"
  judge_prompt: Evaluate criteria message-purpose, supplied-facts, norwegian-text, word-bound, action-form, and state-form as gating criteria. Record the observation criteria diagnostically, but do not fail a response based on them. The prompt requests both taught expressions, so require them for the two form criteria.
  criteria:
  - id: message-purpose
    instruction: Writes a coherent message to the teacher that reports the planning and course of the picnic day.
  - id: supplied-facts
    instruction: Communicates all four supplied facts without materially changing who acts, what accompanies them, or when each event occurs.
  - id: norwegian-text
    instruction: Writes the message in understandable Norwegian.
  - id: word-bound
    instruction: Uses 45–65 words.
  - id: action-form
    instruction: Uses a natural ta med form for both actions that arrange accompaniment.
  - id: state-form
    instruction: Uses a natural ha med form for the bus-stop check and park report.
  - id: action-form-observation
    instruction: 'Observation only: note whether the taught ta med form appears; do not fail a natural equivalent.'
  - id: state-form-observation
    instruction: 'Observation only: note whether the taught ha med form appears; do not fail a natural equivalent.'
- handle: retrieval_and_review
  op: write
  objective: obj-ta-med-or-ha-med-01
  bloom: apply
  prompt_md: 'Du og Erik står ved bilen før dere går tur. Skriv en kort melding der du ber ham ta med paraplyen fra bilen, og sier at dere vil ha den med på turen. Bruk både «ta med» og «ha med». Skriv 12–20 ord.'
  explanation_md: Begge setningene gjelder før turen. Den første ber om at paraplyen blir tatt med, og den andre sier at dere skal ha den med på turen.
  derived_from:
  - section_id: retrieval-and-review
  response_language: "no"
  judge_prompt: Evaluate criteria recipient-and-purpose, single-setting, same-object, norwegian-text, word-bound, action-form, and state-form as gating criteria. The prompt requests both taught expressions, so require them for the two form criteria while accepting natural inflection and placement variants.
  criteria:
  - id: recipient-and-purpose
    instruction: Addresses Erik with one coherent message before the walk, asking him to bring the umbrella from the car and expressing that it is wanted on the walk.
  - id: single-setting
    instruction: Both clauses make sense in the same setting and at the same time, before the walk begins.
  - id: same-object
    instruction: Both clauses concern the same umbrella.
  - id: norwegian-text
    instruction: Writes the message in understandable Norwegian.
  - id: word-bound
    instruction: Uses 12–20 words.
  - id: action-form
    instruction: Uses a natural ta med form to ask Erik to bring the umbrella from the car.
  - id: state-form
    instruction: Uses a natural ha med form to say that they want the umbrella with them on the walk.
