- handle: recognize_proposal
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: understand
  prompt_md: Choose the interpretation that matches the dialogue.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Skal vi gå en tur etter jobb?»
    - speaker: Jonas
      text_md: «Ja, det passer fint.»
  options:
  - id: walk-before-work
    text: Mina foreslår en spasertur før jobb, og Jonas sier seg enig.
    correct: false
    why: Tidspunktet i dialogen er etter jobb, ikke før.
  - id: walk-after-work
    text: Mina foreslår en spasertur etter jobb, og Jonas sier seg enig.
    correct: true
    why: «Skal vi gå en tur etter jobb?» er Minas forslag, og «Ja, det passer fint» viser at Jonas er enig.
  - id: coffee-after-work
    text: Mina foreslår å ta en kaffe etter jobb, og Jonas sier seg enig.
    correct: false
    why: Dialogen handler om å gå en tur, ikke om kaffe.
  - id: groceries-after-work
    text: Mina foreslår å handle mat etter jobb, og Jonas sier seg enig.
    correct: false
    why: Mat blir ikke nevnt i denne dialogen.
  derived_from:
  - section_id: proposing-an-activity
- handle: distinguish_activity_acceptance
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: understand
  prompt_md: Choose the interpretation that matches Jonas's reply.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Skal vi ta en kaffe på fredag klokka tre?»
    - speaker: Jonas
      text_md: «Kaffen er jeg med på, men klokka tre er uaktuell for meg.»
  options:
  - id: activity-and-time
    text: Jonas vil være med på kaffen, og tidspunktet passer ham.
    correct: false
    why: Han sier at klokka tre er uaktuell, så tidspunktet er ikke akseptert.
  - id: rejects-activity
    text: Jonas vil ikke være med på kaffen, men tidspunktet passer ham.
    correct: false
    why: «Kaffen er jeg med på» viser at han sier ja til kaffen.
  - id: alternative-given
    text: Jonas vil være med på kaffen og foreslår et nytt tidspunkt.
    correct: false
    why: Han nevner ikke noe nytt tidspunkt i denne dialogen.
  - id: activity-only
    text: Jonas vil være med på kaffen, men tidspunktet passer ikke for ham.
    correct: true
    why: «Kaffen er jeg med på» viser at han sier ja til kaffen, mens «uaktuell» viser at tidspunktet ikke passer.
  derived_from:
  - section_id: responding-to-a-proposal
- handle: select_cooperative_alternative
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: Choose the reply that keeps the activity and offers one usable alternative.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Skal vi gå en tur på lørdag formiddag?»
    - speaker: Context
      text_md: Emil vil gjerne bli med. Han jobber lørdag formiddag, men er ledig søndag ettermiddag.
  options:
  - id: rejects-activity
    text: Nei, jeg vil ikke gå en tur. Men søndag ettermiddag passer.
    correct: false
    why: Den avviser selve turen, som Emil gjerne vil være med på.
  - id: vague-alternative
    text: Gjerne, men jeg kan ikke da. Kanskje en annen gang.
    correct: false
    why: Den gir ingen brukbar tid.
  - id: one-alternative
    text: Gjerne, men lørdag formiddag passer ikke. Hva med søndag ettermiddag?
    correct: true
    why: Den beholder turen, avviser bare den opptatte tiden og gir ett konkret alternativ.
  - id: too-many-alternatives
    text: Gjerne! Hva med søndag ettermiddag eller lørdag kveld?
    correct: false
    why: Den gir flere alternativer, men Emil er bare ledig søndag ettermiddag.
  derived_from:
  - section_id: offering-one-alternative
- handle: select_final_confirmation
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: Choose the reply that confirms the agreed plan without changing it.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Skal vi se en film på Kino Nova søndag klokka sju?»
    - speaker: Jonas
      text_md: «Ja, det passer fint.»
  options:
  - id: wrong-place
    text: Flott! Da møtes vi på kafeen søndag klokka sju.
    correct: false
    why: Den bekrefter dagen og klokkeslettet, men flytter møtet fra Kino Nova til en kafé.
  - id: confirm-plan
    text: Flott! Da møtes vi på Kino Nova søndag klokka sju.
    correct: true
    why: Den bekrefter avtalt aktivitet, sted, dag og klokkeslett uten å endre dem.
  - id: wrong-time
    text: Søndag passer, men jeg kommer først klokka åtte.
    correct: false
    why: Den endrer klokkeslettet fra sju til åtte.
  - id: wrong-day
    text: Gjerne! Da ses vi fredag klokka sju på Kino Nova.
    correct: false
    why: Den endrer avtalt dag fra søndag til fredag.
  derived_from:
  - section_id: agreeing-and-stating-the-final-plan
- handle: respond_to_availability
  op: write
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: 'Mina writes: «Skal vi ta en kaffe på lørdag klokka to?» You want to have coffee, but you are helping your sister at two, so that time does not work. Reply to Mina so she knows that you accept the coffee plan but cannot meet at two. Do not suggest a different time. Write 8–24 Norwegian words.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Skal vi ta en kaffe på lørdag klokka to?»
  response_language: 'no'
  min_words: 8
  max_words: 24
  judge_prompt: 'Evaluate only the visible reply task. Report verdicts for activity-accepted, time-unavailable, and cooperative-language-observation. The first two criteria are gating. Any criterion whose id ends in «-observation» is diagnostic and must not fail an otherwise valid reply. Anchors: PASS: «Ja, gjerne! Jeg vil gjerne ta en kaffe, men jeg kan ikke klokka to.» PASS: «Ja, gjerne! Jeg hjelper søsteren min da.» FAIL time-unavailable: «Ja, gjerne! Klokka to passer fint.»'
  criteria:
  - id: activity-accepted
    instruction: The reply communicates that the writer wants to join the coffee plan.
  - id: time-unavailable
    instruction: The reply communicates that the writer cannot meet at two o'clock, for example by saying they are busy or unavailable.
  - id: cooperative-language-observation
    instruction: Observe whether the reply uses a warm or cooperative response such as «gjerne», «hyggelig» or an equivalent; this is diagnostic only.
  derived_from:
  - section_id: saying-when-you-are-available
- handle: offer_one_alternative
  op: write
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: 'Nora writes: «Skal vi gå en tur på lørdag formiddag?» You want to join, but you work then. You are free Sunday afternoon. Reply to Nora to accept the walk, explain the time problem, and offer Sunday afternoon as the one alternative. Write 12–35 Norwegian words.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Skal vi gå en tur på lørdag formiddag?»
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: 'Evaluate only the visible reply task. Report verdicts for accepts-walk, saturday-unavailable, one-sunday-alternative, and alternative-form-observation. The first three criteria are gating. Any criterion whose id ends in «-observation» is diagnostic and must not fail an otherwise valid reply. Anchors: PASS: «Jeg blir gjerne med, men jeg jobber lørdag formiddag. Kan vi gå søndag ettermiddag i stedet?» FAIL one-sunday-alternative: «Jeg blir gjerne med, men jeg kan ikke på lørdag. Kanskje en annen gang.» PASS with alternative-form-observation flagged: «Turen høres hyggelig ut. Jeg jobber lørdag formiddag, men søndag ettermiddag passer for meg.»'
  criteria:
  - id: accepts-walk
    instruction: The reply communicates that the writer wants to join the walk.
  - id: saturday-unavailable
    instruction: The reply communicates that Saturday morning is unavailable.
  - id: one-sunday-alternative
    instruction: The reply offers Sunday afternoon as exactly one alternative time.
  - id: alternative-form-observation
    instruction: Observe whether the alternative is framed with «hva med», «kan vi» or an equivalent proposal form; this is diagnostic only.
  derived_from:
  - section_id: offering-one-alternative
- handle: build_complete_exchange
  op: write
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: 'Write a message exchange between Ada and Leo. Purpose: agree on a cinema plan. Facts: Ada proposes Saturday at 18:00; Leo wants to join but works then; Leo is free Sunday at 19:00; Ada accepts and clearly confirms the cinema plan for Sunday at 19:00 at Kino Nova. Write 35–70 Norwegian words and end with Ada''s confirmation that restates the agreed plan.'
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: 'Evaluate only the visible message task. Report verdicts for initial-cinema-proposal, leo-time-problem, one-alternative, final-cinema-confirmation, and target-forms-observation. The first four criteria are gating. Any criterion whose id ends in «-observation» is diagnostic and must not fail an otherwise valid exchange. Anchors: PASS: «Ada: Skal vi gå på Kino Nova på lørdag klokka seks? Leo: Gjerne, men jeg jobber da. Hva med søndag klokka sju? Ada: Ja, det passer. Da ser vi filmen på Kino Nova søndag klokka sju.» FAIL final-cinema-confirmation: «Ada: Skal vi gå på kino lørdag klokka seks? Leo: Jeg jobber da. Hva med søndag klokka sju? Ada: Ja, fint.» PASS with target-forms-observation flagged: «Ada: Kino Nova lørdag klokka seks? Leo: Det vil jeg, men jeg jobber. Søndag klokka sju passer. Ada: Avtale. Vi ser film på Kino Nova søndag klokka sju.»'
  criteria:
  - id: initial-cinema-proposal
    instruction: Ada proposes going to the cinema on Saturday at 18:00.
  - id: leo-time-problem
    instruction: Leo communicates that he wants to join but works at the initially proposed time.
  - id: one-alternative
    instruction: Leo offers Sunday at 19:00 as exactly one alternative.
  - id: final-cinema-confirmation
    instruction: Ada accepts and clearly confirms the cinema plan for Sunday at 19:00, restating the activity, place, day, and time.
  - id: target-forms-observation
    instruction: Observe whether the exchange uses practiced proposal and confirmation forms such as «skal vi», «hva med» or «da»; this is diagnostic only.
  derived_from:
  - section_id: back-to-mina-and-jonas
- handle: final_retrieval_review
  op: write
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: 'Write a message exchange between Sara and Amir. Purpose: agree on lunch. Facts: Sara proposes Tuesday at 12:00 in the canteen; Amir wants to join but has a meeting then; Amir is free at 13:00; Sara accepts and clearly confirms lunch in the canteen on Tuesday at 13:00. Write 35–70 Norwegian words and end with Sara''s confirmation that restates the agreed plan.'
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: 'Evaluate only the visible message task. Report verdicts for lunch-proposal, initial-time-unavailable, one-o-clock-alternative, final-lunch-plan, and practiced-language-observation. The first four criteria are gating. Any criterion whose id ends in «-observation» is diagnostic and must not fail an otherwise valid exchange. Anchors: PASS: «Sara: Skal vi spise lunsj i kantina på tirsdag klokka tolv? Amir: Gjerne, men jeg har et møte da. Hva med klokka ett? Sara: Ja, det passer. Da spiser vi lunsj i kantina tirsdag klokka ett.» FAIL final-lunch-plan: «Sara: Skal vi spise lunsj tirsdag klokka tolv? Amir: Jeg har møte. Hva med ett? Sara: Ja, fint.» PASS with practiced-language-observation flagged: «Sara: Lunsj i kantina tirsdag klokka tolv? Amir: Det vil jeg, men jeg har møte. Jeg er ledig klokka ett. Sara: Avtale. Vi spiser i kantina tirsdag klokka ett.»'
  criteria:
  - id: lunch-proposal
    instruction: Sara proposes lunch in the canteen on Tuesday at 12:00.
  - id: initial-time-unavailable
    instruction: Amir communicates that he wants to join but has a meeting at the proposed time.
  - id: one-o-clock-alternative
    instruction: Amir offers 13:00 as exactly one alternative.
  - id: final-lunch-plan
    instruction: Sara clearly confirms lunch in the canteen on Tuesday at 13:00, restating the activity, place, day, and time.
  - id: practiced-language-observation
    instruction: Observe whether the exchange uses practiced forms such as «skal vi», «hva med» or «da»; this is diagnostic only.
  derived_from:
  - section_id: final-retrieval-and-review
