  - id: final-bowling-plan
    instruction: Sara accepts and clearly confirms bowling at Lucky Strike on
      Friday at 18:00, restating the activity, place, day, and time.
  - id: practiced-language-observation
    instruction: 'Observation only: note whether the exchange uses the practiced proposal
      and confirmation patterns; this is diagnostic only.'
