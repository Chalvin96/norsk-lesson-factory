- handle: recognize_proposal
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: understand
  prompt_md: "Choose the meaning that shows what Mina suggests and the activity and time she mentions."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Mina og Jonas snakker om hva de kan gjøre etter jobb.
    - speaker: Mina
      text_md: «Skal vi gå en tur etter jobb?»
    - speaker: Jonas
      text_md: «Ja, det passer fint.»
  options:
  - id: confirms-existing-plan
    text: Mina spør om den avtalte gåturen etter jobb fortsatt gjelder, og Jonas
      bekrefter avtalen.
    correct: false
    why: De har ikke avtalt en tur ennå, så Mina spør ikke om en eksisterende
      avtale.
  - id: shared-proposal
    text: Mina foreslår at de går en tur etter jobb, og Jonas takker ja.
    correct: true
    why: «Skal vi …?» foreslår en aktivitet sammen som Jonas kan takke ja eller
      nei til.
  - id: obligation
    text: Mina sier at Jonas må gå en tur etter jobb, og han godtar kravet.
    correct: false
    why: Ingenting tyder på at Mina kan pålegge Jonas å gå tur; de er venner.
  - id: reports-own-plan
    text: Mina forteller at hun har bestemt seg for å gå en tur etter jobb.
    correct: false
    why: Mina spør om en felles aktivitet i stedet for bare å fortelle om sin
      egen plan.
  derived_from:
  - section_id: proposing-an-activity
- handle: distinguish_activity_acceptance
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: understand
  prompt_md: "Choose the meaning that matches Jonas's reply."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Skal vi ta en kaffe på fredag klokka tre?»
    - speaker: Jonas
      text_md: «Kaffen er jeg med på, men klokka tre er uaktuell for meg.»
  options:
  - id: activity-and-time
    text: Jonas vil være med på kaffen, og tidspunktet passer ham.
    correct: false
    why: Han sier at klokka tre er uaktuell, så tidspunktet er ikke akseptert.
  - id: rejects-activity
    text: Jonas vil ikke være med på kaffen, men tidspunktet passer ham.
    correct: false
    why: «Kaffen er jeg med på» viser at han sier ja til kaffen.
  - id: alternative-given
    text: Jonas vil være med på kaffen og foreslår et nytt tidspunkt.
    correct: false
    why: Han nevner ikke noe nytt tidspunkt i denne dialogen.
  - id: activity-only
    text: Jonas vil være med på kaffen, men tidspunktet passer ikke for ham.
    correct: true
    why: «Kaffen er jeg med på» viser at han sier ja til kaffen, mens «uaktuell»
      viser at tidspunktet ikke passer.
  derived_from:
  - section_id: responding-to-a-proposal
- handle: select_cooperative_alternative
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: "Choose the reply that keeps the activity and suggests one possible alternative."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Skal vi gå en tur på lørdag formiddag?»
    - speaker: Context
      text_md: Emil vil gjerne bli med. Han jobber lørdag formiddag, men er
        ledig søndag ettermiddag.
  options:
  - id: rejects-activity
    text: Nei, jeg vil ikke gå en tur. Men søndag ettermiddag passer.
    correct: false
    why: Den avviser selve turen, som Emil gjerne vil være med på.
  - id: vague-alternative
    text: Gjerne, men jeg kan ikke da. Kanskje en annen gang.
    correct: false
    why: Den gir ingen brukbar tid.
  - id: one-alternative
    text: Gjerne, men lørdag formiddag passer ikke. Hva med søndag ettermiddag?
    correct: true
    why: Den beholder turen, avviser bare den opptatte tiden og gir ett konkret
      alternativ.
  - id: too-many-alternatives
    text: Gjerne! Hva med søndag ettermiddag eller lørdag kveld?
    correct: false
    why: Den gir flere alternativer, men Emil er bare ledig søndag ettermiddag.
  derived_from:
  - section_id: offering-one-alternative
- handle: select_final_confirmation
  op: choose
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: "Choose the reply that confirms the plan without changing it."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Skal vi se en film på Kino Nova søndag klokka sju?»
    - speaker: Jonas
      text_md: «Ja, det passer fint.»
  options:
  - id: wrong-place
    text: Flott! Da møtes vi på kafeen søndag klokka sju.
    correct: false
    why: Den bekrefter dagen og klokkeslettet, men flytter møtet fra Kino Nova
      til en kafé.
  - id: confirm-plan
    text: Flott! Da møtes vi på Kino Nova søndag klokka sju.
    correct: true
    why: Den bekrefter avtalt aktivitet, sted, dag og klokkeslett uten å endre
      dem.
  - id: wrong-time
    text: Søndag passer, men jeg kommer først klokka åtte.
    correct: false
    why: Den endrer klokkeslettet fra sju til åtte.
  - id: wrong-day
    text: Gjerne! Da ses vi fredag klokka sju på Kino Nova.
    correct: false
    why: Den endrer avtalt dag fra søndag til fredag.
  derived_from:
  - section_id: agreeing-and-stating-the-final-plan
- handle: respond_to_availability
  op: write
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: "You want to get coffee, but you are helping your sister then. Reply that you want coffee but cannot meet at two. Do not suggest another time."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Skal vi ta en kaffe på lørdag klokka to?»
  response_language: "no"
  min_words: 8
  max_words: 24
  judge_prompt: 'Evaluate only the visible reply task. Report verdicts for activity-accepted,
    time-unavailable, no-alternative-time, and cooperative-language-observation. The
    first three criteria are gating. Any criterion whose id ends in «-observation»
    is diagnostic and must not fail an otherwise valid reply. Anchors: PASS: «Ja,
    gjerne! Jeg vil gjerne ta en kaffe, men jeg kan ikke klokka to.» PASS: «Ja, gjerne!
    Jeg hjelper søsteren min da, så klokka to passer ikke.» FAIL time-unavailable:
    «Ja, gjerne! Klokka to passer fint.»'
  criteria:
  - id: activity-accepted
    instruction: The reply communicates that the writer wants to join the coffee
      plan.
  - id: time-unavailable
    instruction: The reply communicates that the writer cannot meet at two
      o'clock, for example by saying they are busy or unavailable.
  - id: no-alternative-time
    instruction: The reply does not propose a different time or day; it accepts
      the coffee plan and explains the conflict without suggesting a
      replacement.
  - id: cooperative-language-observation
    instruction: 'Observation only: note whether the reply uses a warm or cooperative
      tone; this is diagnostic only.'
  derived_from:
  - section_id: saying-when-you-are-available
- handle: offer_one_alternative
  op: write
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: "You would like to come, but you work on Saturday morning. You are free on Sunday afternoon. Reply to Nora: say yes to the walk, say that Saturday does not work, and suggest Sunday."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Skal vi gå en tur på lørdag formiddag?»
  response_language: "no"
  min_words: 12
  max_words: 35
  judge_prompt: 'Evaluate only the visible reply task. Report verdicts for accepts-walk,
    saturday-unavailable, one-sunday-alternative, and alternative-form-observation.
    The first three criteria are gating. Any criterion whose id ends in «-observation»
    is diagnostic and must not fail an otherwise valid reply. Anchors: PASS: «Jeg
    blir gjerne med, men jeg jobber lørdag formiddag. Kan vi gå søndag ettermiddag
    i stedet?» FAIL one-sunday-alternative: «Jeg blir gjerne med, men jeg kan ikke
    på lørdag. Kanskje en annen gang.» PASS with alternative-form-observation flagged:
    «Turen høres hyggelig ut. Jeg jobber lørdag formiddag, men søndag ettermiddag
    passer for meg.»'
  criteria:
  - id: accepts-walk
    instruction: The reply communicates that the writer wants to join the walk.
  - id: saturday-unavailable
    instruction: The reply communicates that Saturday morning is unavailable.
  - id: one-sunday-alternative
    instruction: The reply offers Sunday afternoon as exactly one alternative
      time.
  - id: alternative-form-observation
    instruction: 'Observation only: note whether the alternative is framed as a proposal
      rather than a bare statement; this is diagnostic only.'
  derived_from:
  - section_id: offering-one-alternative
- handle: build_complete_exchange
  op: write
  objective: obj-agree-on-informal-plans-01
  bloom: apply
  prompt_md: "Write a message exchange in Norwegian between Ada and Leo. Ada suggests going to the cinema on Saturday at 6 p.m. Leo would like to come, but he is working then. He is free on Sunday at 7 p.m. Ada agrees and confirms the cinema plan at Kino Nova on Sunday at 7 p.m. End with Ada confirming the plan."
  response_language: "no"
  min_words: 35
  max_words: 70
  judge_prompt: 'Evaluate only the visible message task. Report verdicts for initial-cinema-proposal,
    leo-time-problem, one-alternative, final-cinema-confirmation, and target-forms-observation.
    The first four criteria are gating. Any criterion whose id ends in «-observation»
    is diagnostic and must not fail an otherwise valid exchange. Anchors: PASS: «Ada:
    Skal vi gå på Kino Nova på lørdag klokka seks? Leo: Gjerne, men jeg jobber da.
    Hva med søndag klokka sju? Ada: Ja, det passer. Da ser vi filmen på Kino Nova
    søndag klokka sju.» FAIL final-cinema-confirmation: «Ada: Skal vi gå på kino lørdag
    klokka seks? Leo: Jeg jobber da. Hva med søndag klokka sju? Ada: Ja, fint.» PASS
    with target-forms-observation flagged: «Ada: Kino Nova lørdag klokka seks? Leo:
    Det vil jeg, men jeg jobber. Søndag klokka sju passer. Ada: Avtale. Vi ser film
    på Kino Nova søndag klokka sju.»'
  criteria:
  - id: initial-cinema-proposal
    instruction: Ada proposes going to the cinema on Saturday at 18:00.
  - id: leo-time-problem
    instruction: Leo communicates that he wants to join but works at the
      initially proposed time.
  - id: one-alternative
    instruction: Leo offers Sunday at 19:00 as exactly one alternative.
  - id: final-cinema-confirmation
    instruction: Ada accepts and clearly confirms the cinema plan for Sunday at
      19:00, restating the activity, place, day, and time.
  - id: target-forms-observation
    instruction: 'Observation only: note whether the exchange uses the practiced proposal
      and confirmation patterns; this is diagnostic only.'
  derived_from:
  - section_id: back-to-mina-and-jonas
