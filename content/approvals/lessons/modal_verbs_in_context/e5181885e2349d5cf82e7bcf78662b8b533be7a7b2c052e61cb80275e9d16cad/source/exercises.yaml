- handle: distinguish_action_and_evidence_readings
  op: categorize
  objective: obj-modal-verbs-in-context-01
  bloom: analyze
  prompt_md: 'Sorter setningene etter hva modalverbet uttrykker.'
  buckets:
  - bucket_id: action-meaning
    label: Action meaning
  - bucket_id: evidence-meaning
    label: Evidence, report, or expectation
  items:
  - item_id: submit-form
    text: Du må levere skjemaet før fredag.
    bucket_id: action-meaning
  - item_id: bicycle-evidence
    text: Hun må være på kontoret; sykkelen hennes står utenfor.
    bucket_id: evidence-meaning
  - item_id: friday-plan
    text: Vi skal møte kunden på fredag.
    bucket_id: action-meaning
  - item_id: reported-teacher
    text: Den nye læreren skal være svært flink, ifølge kollegene.
    bucket_id: evidence-meaning
  - item_id: save-copy
    text: Du bør lagre en kopi før du lukker dokumentet.
    bucket_id: action-meaning
  - item_id: expected-bus
    text: Bussen bør være her om fem minutter hvis rutetabellen holder.
    bucket_id: evidence-meaning
  explanation_md: 'En handlingsbetydning gjelder noe noen må, planlegger eller bør
    gjøre. En vurdering uttrykker en slutning, gjengir en kilde eller viser til en
    rimelig forventning.'

- handle: classify_evidence_reading
  op: categorize
  objective: obj-modal-verbs-in-context-01
  bloom: analyze
  prompt_md: 'Sorter påstandene etter om de bygger på tegn, gjengir en kilde eller
    uttrykker en forventning på vilkår.'
  buckets:
  - bucket_id: inference-ma
    label: Inference from clues
  - bucket_id: report-skal
    label: Information attributed to a source
  - bucket_id: expectation-bor
    label: Reasonable expectation
  items:
  - item_id: office-lights
    text: Kari må være hjemme; lyset i stua er på, og hun svarer på telefonen.
    bucket_id: inference-ma
  - item_id: office-window
    text: Det bør være noen på kontoret ennå; vinduet er opplyst, og jeg hører
      Kari snakke der inne.
    bucket_id: inference-ma
  - item_id: wet-streets
    text: Det må ha blåst kraftig i natt; flere greiner ligger på bakken.
    bucket_id: inference-ma
  - item_id: newspaper-concert
    text: Ifølge arrangøren skal konserten begynne klokka åtte.
    bucket_id: report-skal
  - item_id: neighbour-renovation
    text: Museet skal ha fått en ny kafé, forteller guiden.
    bucket_id: report-skal
  - item_id: timetable-train
    text: Ferga bør være framme om en halvtime dersom været holder seg.
    bucket_id: expectation-bor
  - item_id: normal-delivery
    text: Det bør bli ledige plasser hvis alle melder seg av innen fristen.
    bucket_id: expectation-bor
  explanation_md: 'Sorter etter hva påstanden bygger på. Et modalverb kan uttrykke
    en tendens, men sammenhengen er viktig: «bør» kan vise en slutning ut fra synlige
    tegn eller en forventning på bestemte vilkår.'

- handle: transfer_modals_across_action_and_evidence
  op: write
  objective: obj-modal-verbs-in-context-01
  bloom: apply
  prompt_md: "Melding fra lageret: «Budbilen forlot terminalen klokka 09.15. Vanlig kjøretid er 45 minutter, men pakken har ikke kommet klokka 11.00.» Kunden trenger pakken før klokka 14.00. Nora kan ringe transportselskapet, og Amir møter kunden klokka 13.30. Skriv en dialog. Bruk må til en slutning om forsinkelsen, skal til å gjengi lagerets beskjed, bør til en forventning på vilkår og et modalverb til å foreslå neste steg."
  response_language: 'no'
  min_words: 30
  max_words: 70
  judge_prompt: "Evaluate criteria dialogue-purpose, facts-supported, inference-from-clues, reported-information, conditional-expectation, action-modal, and natural-bokmal as gating criteria. Accept natural Bokmål variants that use the required modal readings accurately. Quote relevant evidence. Do not add requirements."
  criteria:
  - id: dialogue-purpose
    instruction: The response is a coherent workplace dialogue that interprets
      the delay and agrees on a next action.
  - id: facts-supported
    instruction: The dialogue does not contradict the warehouse message or
      supplied facts.
  - id: natural-bokmal
    instruction: The response is understandable, natural Bokmål.
  - id: inference-from-clues
    instruction: Uses må to draw a plausible inference from the delivery facts.
  - id: reported-information
    instruction: Uses skal to relay the warehouse's information as attributed to
      that source.
  - id: conditional-expectation
    instruction: Uses bør for an expectation tied to a condition, such as
      ordinary travel conditions.
  - id: action-modal
    instruction: Uses a modal with an action meaning to propose or agree on a
      next step.
  explanation_md: 'Bruk må til slutningen, skal til opplysningen fra lageret, bør
    til forventningen og et modalverb om handling til neste steg.'

