- handle: review_transfer_modal_reading
  op: categorize
  objective: obj-modal-verbs-in-context-01
  bloom: apply
  prompt_md: Sort each reply by the reading of the highlighted modal.
  buckets:
    - bucket_id: necessity-ma
      label: Necessary action
    - bucket_id: possibility-kan
      label: Possible action
    - bucket_id: plan-skal
      label: Planned action
    - bucket_id: wish-vil
      label: Wish
    - bucket_id: advice-bor
      label: Advice
    - bucket_id: inference-ma
      label: Inference from clues
    - bucket_id: report-skal
      label: Information from a source
    - bucket_id: expectation-bor
      label: Reasonable expectation
  items:
    - item_id: necessary-call
      text: Kunden venter, så vi må ringe transportselskapet nå.
      bucket_id: necessity-ma
    - item_id: possible-collect
      text: Jeg kan hente pakken på terminalen.
      bucket_id: possibility-kan
    - item_id: planned-meeting
      text: Jeg skal møte kunden klokka halv to.
      bucket_id: plan-skal
    - item_id: wished-solution
      text: Jeg vil helst finne en løsning før lunsj.
      bucket_id: wish-vil
    - item_id: advised-message
      text: Du bør sende kunden en oppdatering.
      bucket_id: advice-bor
    - item_id: inferred-traffic
      text: Budbilen må stå i kø; den dro for nesten to timer siden.
      bucket_id: inference-ma
    - item_id: reported-breakdown
      text: Budbilen skal ha fått motorstopp, ifølge transportselskapet.
      bucket_id: report-skal
    - item_id: expected-arrival
      text: Pakken bør komme før klokka to hvis bilen er på vei igjen.
      bucket_id: expectation-bor
  explanation_md: The surrounding reason, source, condition, or intended action determines the reading; the modal form alone does not.
  derived_from: transfer_modals_across_action_and_evidence
