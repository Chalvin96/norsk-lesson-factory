- handle: set-the-table-transfer
  op: write
  objective: obj-cardinal-numbers-01
  bloom: apply
  prompt_md: "Mina skal dekke bordet: 2 stoler, 1 bord, 1 kopp og 3 glass. Skriv en melding på norsk og fortell hva som er tilgjengelig. Bruk riktige mengdeuttrykk og «en» eller «ett» ved entall."
  explanation_md: 'En fullstendig melding oppgir alle fire mengdene med norske mengdeuttrykk og riktig «en» eller «ett».'
  derived_from:
  - section_id: new-situation
  response_language: 'no'
  min_words: 10
  max_words: 30
  judge_prompt: "Evaluate only criteria chairs-quantity, table-quantity, cup-quantity, glasses-quantity. Report a verdict and evidence for every criterion. A quantity stated with the wrong one-form gender fails its criterion: «en bord» fails table-quantity and «ett kopp» fails cup-quantity. Accept natural sentence order and punctuation. Anchors: Must pass: \"Hei Mina! Du har to stoler, ett bord, en kopp og tre glass.\" Must fail: \"Hei Mina! Du har to stoler, ett bord og en kopp.\" It omits the glasses. Must fail: \"Hei Mina! Du har tre stoler, ett bord, en kopp og tre glass.\" The chair quantity is wrong. Must fail: \"Hei Mina! Du har to stoler, en bord, ett kopp og tre glass.\" The table and cup one-forms use the wrong gender."
  criteria:
  - id: chairs-quantity
    instruction: States that two chairs are available using a Norwegian quantity
      phrase (to stoler).
  - id: table-quantity
    instruction: States that one table is available using the correct Norwegian
      one-form (ett bord).
  - id: cup-quantity
    instruction: States that one cup is available using the correct Norwegian
      one-form (en kopp).
  - id: glasses-quantity
    instruction: States that three glasses are available using a Norwegian
      quantity phrase (tre glass).
