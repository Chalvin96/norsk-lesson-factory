- handle: set-the-table-transfer
  op: write
  objective: obj-cardinal-numbers-01
  bloom: apply
  prompt_md: 'Table check for Mina: chairs: 2, table: 1, cup: 1, glasses: 3. Write Mina a 10–30-word message
    in Norwegian telling her what is available, using Norwegian quantity phrases and the correct en or
    ett one-form for each single item.'
  explanation_md: A complete message reports the four supplied quantities with suitable Norwegian quantity
    phrases, choosing en or ett to match each noun's gender.
  derived_from:
  - section_id: new-situation
  response_language: 'no'
  min_words: 10
  max_words: 30
  judge_prompt: 'Evaluate only criteria chairs-quantity, table-quantity, cup-quantity, glasses-quantity
    and word-bound. Report a verdict and evidence for every criterion. A quantity stated with the wrong
    one-form gender fails its criterion: «en bord» fails table-quantity and «ett kopp» fails cup-quantity.
    Accept natural sentence order and punctuation. Anchors: Must pass: "Hei Mina! Du har to stoler, ett
    bord, en kopp og tre glass." Must fail: "Hei Mina! Du har to stoler, ett bord og en kopp." It omits
    the glasses. Must fail: "Hei Mina! Du har tre stoler, ett bord, en kopp og tre glass." The chair quantity
    is wrong. Must fail: "Hei Mina! Du har to stoler, en bord, ett kopp og tre glass." The table and cup
    one-forms use the wrong gender.'
  criteria:
  - id: chairs-quantity
    instruction: States that two chairs are available using a Norwegian quantity phrase (to stoler).
  - id: table-quantity
    instruction: States that one table is available using the correct Norwegian one-form (ett bord).
  - id: cup-quantity
    instruction: States that one cup is available using the correct Norwegian one-form (en kopp).
  - id: glasses-quantity
    instruction: States that three glasses are available using a Norwegian quantity phrase (tre glass).
  - id: word-bound
    instruction: Contains 10–30 words.
- handle: final-counting-review
  op: write
  objective: obj-cardinal-numbers-01
  bloom: apply
  prompt_md: 'Breakfast table: banana: 1, apples: 2, cups: 3, glass: 1, eggs: 4, loaf of bread: 1. Write
    a 12–35-word message in Norwegian to a guest describing what is on the table, using Norwegian quantity
    phrases and the correct en or ett one-form for each single item.'
  explanation_md: A complete message reports all six supplied quantities with suitable Norwegian quantity
    phrases, choosing en or ett to match each noun's gender.
  derived_from:
  - section_id: retrieval-review
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: 'Evaluate only criteria banana-quantity, apples-quantity, cups-quantity, glass-quantity,
    eggs-quantity, bread-quantity and word-bound. Report a verdict and evidence for every criterion. A
    quantity stated with the wrong one-form gender fails its criterion: «ett banan» fails banana-quantity,
    «en glass» fails glass-quantity and «en brød» fails bread-quantity. Accept natural sentences, list-like
    phrasing and equivalent punctuation. Anchors: Must pass: "Hei! På bordet er det en banan, to epler,
    tre kopper, ett glass, fire egg og ett brød." Must fail: "Hei! På bordet er det en banan, to epler,
    tre kopper og fire egg." It omits the glass and bread. Must fail: "Hei! På bordet er det en banan,
    tre epler, tre kopper, ett glass, fire egg og ett brød." The apple quantity is wrong. Must fail: "Hei!
    På bordet er det ett banan, to epler, tre kopper, en glass, fire egg og en brød." The banana, glass
    and bread one-forms use the wrong gender.'
  criteria:
  - id: banana-quantity
    instruction: States that the table has one banana using the correct Norwegian one-form (en banan).
  - id: apples-quantity
    instruction: States that the table has two apples using a Norwegian quantity phrase (to epler).
  - id: cups-quantity
    instruction: States that the table has three cups using a Norwegian quantity phrase (tre kopper).
  - id: glass-quantity
    instruction: States that the table has one glass using the correct Norwegian one-form (ett glass).
  - id: eggs-quantity
    instruction: States that the table has four eggs using a Norwegian quantity phrase (fire egg).
  - id: bread-quantity
    instruction: States that the table has one loaf of bread using the correct Norwegian one-form (ett
      brød).
  - id: word-bound
    instruction: Contains 12–35 words.
