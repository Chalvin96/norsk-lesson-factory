    instruction: Writes a coherent Norwegian message to Mina about the proposed walk.
  - id: all-cabin-facts
    instruction: 'Reports all four facts: it is snowing outside, it is cold outside, it is warm inside, and the daylight is fading or it is getting dark.'
  - id: fixed-det
