- handle: notice_fixed_det_in_the_cafe_call
  op: choose
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: understand
  prompt_md: Velg den beste forklaringen.
  derived_from:
  - section_id: a-change-of-plans
  stem_md: 'Mina: «Det regner, og det blåser ganske mye.» Mina: «Det er kaldt, og det begynner å bli mørkt.»'
  options:
  - id: named-weather
    text: «Det» refers to a particular thing called været.
    correct: false
    why: No particular thing is being described; the sentences report weather and surrounding conditions.
  - id: verb-only
    text: «Det» is fixed only before regner and blåser.
    correct: false
    why: The clauses with er and blir also describe conditions without a named semantic subject.
  - id: fixed-subject
    text: «Det» fills the subject position without naming a particular thing.
    correct: true
    why: Norwegian uses fixed «det» in weather and ambient clauses that have no semantic subject.
  explanation_md: 'Mina: «Det regner, og det blåser ganske mye.» Mina: «Det er kaldt, og det begynner å bli mørkt.»'
