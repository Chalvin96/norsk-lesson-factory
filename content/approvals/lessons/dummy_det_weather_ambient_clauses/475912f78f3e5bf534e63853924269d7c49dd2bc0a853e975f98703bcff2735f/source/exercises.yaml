- handle: choose_current_or_changing_condition
  op: choose
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: analyze
  prompt_md: Velg meldingen som passer til begge observasjonene.
  explanation_md: «Er» beskriver en tilstand nå, mens «blir» beskriver en forandring.
  derived_from:
  - section_id: reporting-a-change-with-blir
  stem_md: 'Kl. 15: Det er lyst ute. Kl. 17: Det begynner å bli mørkt.'
  options:
  - id: two-current
    text: Det er lyst klokka 15. Det er mørkt klokka 17.
    correct: false
    why: The second sentence presents darkness as a state rather than a change in progress.
  - id: two-changing
    text: Det blir lyst klokka 15. Det blir mørkt klokka 17.
    correct: false
    why: The first observation says it is already light, not that it is becoming light.
  - id: reversed-change
    text: Det blir mørkt klokka 15. Det er lyst klokka 17.
    correct: false
    why: This reverses the supplied observations.
  - id: current-then-change
    text: Det er lyst klokka 15. Det blir mørkt klokka 17.
    correct: true
    why: The first sentence reports the current light; the second reports increasing darkness.
