- handle: retrieve_fixed_det_weather_rule
  op: write
  objective: obj-dummy-det-weather-ambient-clauses-01
  bloom: apply
  prompt_md: 'Mina skriver til Jonas fra Bergen. Notat: regn og lav temperatur. Svar med en naturlig melding på 7–12 ord. Bruk en værsetning og en setning om tilstanden.'
  derived_from:
  - section_id: final-retrieval
  response_language: "no"
  min_words: 7
  max_words: 12
  judge_prompt: Judge the correction using criteria two-correct-clauses and word-bound. A valid variant that must pass is «Det regner i Bergen, og det er kaldt ute.» A near-miss that must fail is «Det er regner i Bergen, og det er kaldt.» because the rain clause still has the wrong form «er regner»; the cold clause «det er kaldt» is itself correct.
  criteria:
  - id: two-correct-clauses
    instruction: The corrected message has a complete rain clause with fixed «det» and no «er», and a complete cold ambient clause with the neuter form «kaldt».
  - id: word-bound
    instruction: Uses 7–12 words.
