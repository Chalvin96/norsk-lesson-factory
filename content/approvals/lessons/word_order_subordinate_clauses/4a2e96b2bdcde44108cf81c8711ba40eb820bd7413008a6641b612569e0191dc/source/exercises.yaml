  objective: obj-word-order-subordinate-clauses-01
  bloom: analyze
  prompt_md: 'Read each complete sentence and locate its clause boundaries before classifying its full
    structure: one linker-led subordinate clause, two nested linker-led subordinate clauses, or a relative
    clause together with another subordinate clause.'
  derived_from:
  - section_id: more-than-one-subordinate-clause
  buckets:
  - bucket_id: one-linker
    label: One linker-led subordinate clause
  - bucket_id: nested-linkers
    label: Two nested linker-led subordinate clauses
  - bucket_id: relative-and-linker
    label: A relative clause and another subordinate clause
  items:
  - item_id: boundary-1
    text: Fordi rommet er opptatt, øver bandet hjemme.
    bucket_id: one-linker
  - item_id: boundary-2
    text: Elias tror at butikken stenger tidlig.
    bucket_id: one-linker
