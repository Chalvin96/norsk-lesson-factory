  - token_id: indirect-5
    text: Anna
  - token_id: indirect-6
    text: allerede
  - token_id: indirect-7
    text: har
  - token_id: indirect-8
    text: dokumentet.
  answer_order:
  - indirect-1
  - indirect-2
  - indirect-3
  - indirect-4
  - indirect-5
  - indirect-6
