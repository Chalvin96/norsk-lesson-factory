- handle: notice_word_order_signal
  op: categorize
  objective: obj-word-order-subordinate-clauses-01
  bloom: analyze
  prompt_md: Classify each displayed clause by its word-order pattern. Choose the main-clause bucket for
    subject + finite verb + ikke, or the subordinate-clause bucket for linker + subject + ikke + finite
    verb.
  stimulus: []
  explanation_md: A subordinate clause normally places the subject before sentence adverbs such as ikke
    and then the finite verb.
  derived_from:
  - section_id: main-clauses-and-subordinate-clauses
  buckets:
  - bucket_id: main-clause-order
    label: 'Main-clause order: subject + finite verb + ikke'
  - bucket_id: subordinate-clause-order
    label: 'Subordinate-clause order: linker + subject + ikke + finite verb'
  items:
  - item_id: signal-1
    text: Hun kommer ikke.
    bucket_id: main-clause-order
  - item_id: signal-2
    text: fordi hun ikke kommer
    bucket_id: subordinate-clause-order
  - item_id: signal-3
    text: Bussen går ikke klokka åtte.
    bucket_id: main-clause-order
  - item_id: signal-4
    text: at hun ikke kommer på møtet
    bucket_id: subordinate-clause-order
- handle: build_a_linked_explanation
  op: build
  objective: obj-word-order-subordinate-clauses-01
  bloom: apply
  prompt_md: 'Build the complete Norwegian sentence from the supplied tokens. The linker is provided as
    fordi. Meaning: Maja takes a taxi because the bus is not running. Place the subordinate-clause subject,
    sentence adverb, and finite verb in that order.'
  explanation_md: Fordi starts a subordinate clause, so the subject comes before ikke and the finite verb.
  derived_from:
  - section_id: building-clauses-with-common-linkers
  tokens:
  - token_id: linked-1
    text: Maja
  - token_id: linked-2
    text: tar
  - token_id: linked-3
    text: en
  - token_id: linked-4
    text: taxi
  - token_id: linked-5
    text: fordi
  - token_id: linked-6
    text: bussen
  - token_id: linked-7
    text: ikke
  - token_id: linked-8
    text: går.
  answer_order:
  - linked-1
  - linked-2
  - linked-3
  - linked-4
  - linked-5
  - linked-6
  - linked-7
  - linked-8
- handle: move_the_condition
  op: build
  objective: obj-word-order-subordinate-clauses-01
  bloom: apply
  prompt_md: Move the final hvis clause in Vi åpner døra hvis naboen ikke finner nøkkelen. to the beginning
    and build the resulting complete Norwegian sentence. Keep subordinate order, add a comma after the
    initial clause, and open the following main clause with the finite verb before its subject.
  explanation_md: Fronting the hvis-clause does not change its internal order, but it triggers verb-second
    order in the following main clause.
  derived_from:
  - section_id: building-clauses-with-common-linkers
  tokens:
  - token_id: condition-1
    text: Hvis
  - token_id: condition-2
    text: naboen
  - token_id: condition-3
    text: ikke
  - token_id: condition-4
    text: finner
  - token_id: condition-5
    text: nøkkelen,
  - token_id: condition-6
    text: åpner
  - token_id: condition-7
    text: vi
  - token_id: condition-8
    text: døra.
  answer_order:
  - condition-1
  - condition-2
  - condition-3
  - condition-4
  - condition-5
  - condition-6
  - condition-7
  - condition-8
- handle: turn_a_direct_question_into_an_indirect_question
  op: build
  objective: obj-word-order-subordinate-clauses-01
  bloom: apply
  prompt_md: 'Build the complete Norwegian sentence from the supplied tokens. Meaning: Henrik asks Maja
    whether Anna already has the document. Use om + subject + sentence adverb + finite verb in the embedded
    question. Do not use direct-question verb-first order after om.'
  explanation_md: An indirect yes/no question begins with om and keeps subordinate-clause order rather
    than direct-question inversion.
  derived_from:
