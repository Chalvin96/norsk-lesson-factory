- handle: identify_the_role_of_som
  op: categorize
  objective: obj-word-order-subordinate-clauses-01
  bloom: analyze
  prompt_md: Classify each complete noun phrase by the role of som. Use the first bucket when som represents
    the subject and no explicit subject follows som. Use the second bucket when the noun is the object
    and an explicit subject follows som.
  explanation_md: Som is the subject when no other subject appears inside the relative clause; otherwise
    it represents the object.
  derived_from:
  - section_id: relative-clauses-with-som
  buckets:
  - bucket_id: som-subject
    label: Som is the subject; no explicit subject follows som
  - bucket_id: som-object
    label: The noun is the object; an explicit subject follows som
  items:
  - item_id: role-1
    text: naboen som kommer tidlig
    bucket_id: som-subject
  - item_id: role-2
    text: naboen som ikke kommer i dag
    bucket_id: som-subject
  - item_id: role-3
    text: personen som sender dokumentet
    bucket_id: som-subject
  - item_id: role-4
    text: dokumentet som Anna sender
    bucket_id: som-object
  - item_id: role-5
    text: dokumentet som Anna ikke sender
    bucket_id: som-object
  - item_id: role-6
    text: dokumentet som hun har på datamaskinen
    bucket_id: som-object
