    bucket_id: nested-linkers
  - item_id: boundary-4
    text: Jeg håper at bussen går når skolen slutter.
    bucket_id: nested-linkers
  - item_id: boundary-5
    text: Vi ansatte en vaktmester som låser døra når bygget er tomt.
    bucket_id: relative-and-linker
  - item_id: boundary-6
