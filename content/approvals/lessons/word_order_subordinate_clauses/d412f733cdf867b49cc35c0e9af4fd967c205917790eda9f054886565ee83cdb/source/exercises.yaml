- handle: put_negation_in_the_intended_clause
  op: write
  objective: obj-word-order-subordinate-clauses-01
  bloom: apply
  prompt_md: "Skriv to setninger med Henrik, «fortelle», «at» og «Anna kommer». I den første skal «ikke» gjelde selve fortellingen; i den andre skal «ikke» gjelde om Anna kommer."
  derived_from:
  - section_id: more-than-one-subordinate-clause
  response_language: 'no'
  min_words: 8
  max_words: 16
  judge_prompt: Check both sentences against the task and report evidence for each criterion. Accept natural Norwegian reporting verbs and optional final punctuation, but require the two specified negation scopes.
  criteria:
  - id: main-report-negation
    instruction: The first sentence places ikke after the finite reporting verb, negating the act of telling.
  - id: embedded-event-negation
    instruction: The second sentence places ikke in the at clause before the finite verb kommer, negating the embedded event.
- handle: write_a_connected_update
  op: write
  objective: obj-word-order-subordinate-clauses-01
  bloom: apply
  prompt_md: "Skriv en kort, sammenhengende oppdatering på norsk til en annen beboer om et reparasjonsbesøk hjemme. Nevn en tekniker, en reservenøkkel, en nabo og en mulig forsinkelse. Ta med en opplysning med at, en grunn med fordi eller en betingelse med hvis, en relativsetning med som om en person eller ting, og ikke eller et annet setningsadverb i en leddsetning der det passer naturlig. Formuler egne setninger."
  derived_from:
  - section_id: cumulative-transfer-a-changed-everyday-situation
  response_language: 'no'
  min_words: 35
  max_words: 65
  judge_prompt: Check the update against the task and report evidence for every criterion. Accept natural Bokmål wording for the repair context, either fordi or hvis, and require a som relative clause. Require clear clause relationships and correct local subordinate-clause word order; do not require exact wording or a particular placement of the subordinate clauses.
  criteria:
  - id: repair-context
    instruction: Mentions a technician, a spare key, a neighbour, and a possible delay.
  - id: reported-fact-at
    instruction: Includes a reported fact introduced by at.
  - id: reason-or-condition
    instruction: Includes a clear reason introduced by fordi or a clear condition introduced by hvis.
  - id: relative-description
    instruction: Includes a som relative clause that identifies a person or object.
  - id: adverb-placement
    instruction: Uses ikke or another taught sentence adverb naturally in a subordinate clause and places it before that clause finite verb.
  - id: connected-relationships
    instruction: Connects the ideas into a clear update with correct local subordinate-clause word order.
