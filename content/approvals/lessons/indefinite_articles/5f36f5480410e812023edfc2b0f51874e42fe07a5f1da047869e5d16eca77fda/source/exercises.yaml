- handle: drink_or_serving
  op: choose
  objective: obj-indefinite-articles-01
  bloom: understand
  prompt_md: Choose the sentence that matches the order for one serving.
  stem_md: At the café, the cashier asks what Amina wants. Amina orders one cup of coffee.
  options:
  - id: definite-serving
    text: Jeg vil gjerne ha kaffen.
    correct: false
    why: This refers to particular coffee already known.
  - id: serving
    text: Jeg vil gjerne ha en kaffe.
    correct: true
    why: En kaffe presents the order as one countable serving.
  - id: substance
    text: Jeg vil gjerne ha kaffe.
    correct: false
    why: The bare noun presents coffee as a substance rather than one serving.
  - id: wrong-gender-serving
    text: Jeg vil gjerne ha et kaffe.
    correct: false
    why: The article does not match the taught form for one serving of coffee.
  derived_from:
  - section_id: no-article-for-a-substance
- handle: full_response_choice
  op: choose
  objective: obj-indefinite-articles-01
  bloom: analyze
  prompt_md: Choose the message that matches all four facts and follows the lesson's mandatory three-gender
    convention.
  stem_md: Amina found a room. The room has a shelf. Ingrid works there as a teacher. At home they drink
    coffee.
  options:
  - id: room-wrong-gender
    text: Jeg har funnet en rom. Ingrid er lærer. Vi drikker kaffe. Rommet har ei hylle.
    correct: false
    why: The article with rom is incorrect.
  - id: role-treated-as-person
    text: Jeg har funnet et rom. Ingrid er en lærer. Vi drikker kaffe. Rommet har ei hylle.
    correct: false
    why: The profession is a bare role after er.
  - id: substance-treated-as-serving
    text: Jeg har funnet et rom. Ingrid er lærer. Vi drikker en kaffe. Rommet har ei hylle.
    correct: false
    why: The coffee is described as a serving instead of a substance.
  - id: all-facts-correct
    text: Jeg har funnet et rom. Ingrid er lærer. Vi drikker kaffe. Rommet har ei hylle.
    correct: true
    why: The message matches every fact and uses the lesson's required forms.
  explanation_md: The correct message uses et rom, bare lærer after er, bare kaffe for the substance,
    and ei hylle under the three-gender convention.
  derived_from:
  - section_id: bringing-the-choices-together
