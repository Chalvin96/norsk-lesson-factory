- handle: four_way_retrieval_review
  op: write
  objective: obj-indefinite-articles-01
  bloom: analyze
  prompt_md: Write 20–40 Norwegian words about your kitchen and workday. Include one singular phrase with
    en for a countable object, one with ei for a countable object, one with et for a countable object,
    and one bare profession after er or jobber som.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Marta
      text_md: «Hva har du på kjøkkenet, og hva jobber du som?»
    - speaker: Jon
      text_md: «Jeg forteller om tingene og jobben min.»
  response_language: 'no'
  judge_prompt: Check the visible criteria uses-en, uses-ei, uses-et, bare-profession, comprehensible-message,
    and word-bound. All listed criteria gate. Report a verdict for every criterion id.
  criteria:
  - id: uses-en
    instruction: The response includes at least one correct singular noun phrase with en for a countable
      object.
  - id: uses-ei
    instruction: The response includes at least one correct singular noun phrase with ei for a countable
      object.
  - id: uses-et
    instruction: The response includes at least one correct singular noun phrase with et for a countable
      object.
  - id: bare-profession
    instruction: The response includes a profession used without an article after er or jobber som.
  - id: comprehensible-message
    instruction: The Norwegian is comprehensible enough for the listener to understand the description.
  - id: word-bound
    instruction: The response contains 20–40 words.
  derived_from:
  - section_id: bringing-the-choices-together
- handle: room_reply_message
  op: write
  objective: obj-indefinite-articles-01
  bloom: apply
  prompt_md: 'Nora asks about your new shared flat. Reply in 25–45 Norwegian words and include these facts:
    your room has a bed, shelf, and desk; a student and a teacher live there; at home you drink coffee.
    Use en, ei, or et correctly for the listed objects.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hvordan er det nye kollektivet? Hva har du på rommet, hvem bor der, og hva drikker dere?»
    - speaker: Amina
      text_md: «Jeg prøver å beskrive kollektivet uten å glemme noen detaljer.»
  response_language: 'no'
  judge_prompt: Evaluate only the listed criteria. The criteria reply-purpose, supplied-facts, article-forms,
    word-bound, and comprehensible-message are gating. Criteria whose ids end in -observation are diagnostic
    and must never make the response fail. Report a verdict for every criterion id.
  criteria:
  - id: reply-purpose
    instruction: The response is a message to Nora describing the new shared flat.
  - id: supplied-facts
    instruction: The response communicates that the room has a bed, shelf, and desk, that a student and
      teacher live there, and that coffee is drunk at home.
  - id: article-forms
    instruction: The singular indefinite phrases for the bed, shelf, and desk use articles that match
      the lesson's required gender convention.
  - id: word-bound
    instruction: The response contains 25–45 words.
  - id: comprehensible-message
    instruction: The Norwegian is comprehensible enough for Nora to understand the description.
  - id: count-articles-observation
    instruction: 'Observation only: report the article used with each supplied singular noun and whether
      it matches the noun''s gender; do not fail the response.'
  - id: role-form-observation
    instruction: 'Observation only: report whether student and teacher are bare role nouns after være;
      do not fail the response.'
  - id: substance-form-observation
    instruction: 'Observation only: report whether coffee at home is presented without an article; do
      not fail the response.'
  derived_from:
  - section_id: back-at-the-flat
- handle: first_day_exchange
  op: write
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: Write a 15–30-word Norwegian exchange for a classmate at the door. Greet, ask and answer
    names, mark the meeting as friendly, and close.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Hei! Jeg er ny i klassen.»
    - speaker: Jonas
      text_md: «Velkommen! La oss hilse ordentlig.»
  response_language: 'no'
  judge_prompt: Check criteria opens-greeting, both-names, friendly-meeting, closes, and word-bound. Record
    connected-observation diagnostically. All non-observation criteria gate.
  criteria:
  - id: opens-greeting
    instruction: The exchange opens with a Norwegian greeting.
  - id: both-names
    instruction: One speaker asks for the other person's name, and both speakers give their names.
  - id: friendly-meeting
    instruction: The exchange includes a natural friendly meeting expression.
  - id: closes
    instruction: The exchange ends with a natural goodbye.
  - id: word-bound
    instruction: The exchange contains 15–30 words.
  - id: connected-observation
    instruction: 'Observation only: note whether the lines form one connected conversation; do not fail
      an otherwise complete exchange.'
  derived_from:
  - section_id: guided-exchange-practice
