- handle: drink_or_serving
  op: choose
  objective: obj-indefinite-articles-01
  bloom: understand
  prompt_md: Choose the sentence that matches the order for one serving.
  stem_md: At the café, the cashier asks what Amina wants. She orders one cup of coffee to take away.
  options:
  - id: definite-serving
    text: Jeg vil gjerne ha kaffen.
    correct: false
    why: This refers to particular coffee already known.
  - id: serving
    text: Jeg vil gjerne ha en kaffe.
    correct: true
    why: En kaffe presents the order as one countable serving.
  - id: substance
    text: Jeg vil gjerne ha litt kaffe.
    correct: false
    why: The reply asks for some coffee as a substance, not one countable serving.
  - id: wrong-gender-serving
    text: Jeg vil gjerne ha et kaffe.
    correct: false
    why: The article does not match the taught form for one serving of coffee.
  derived_from:
  - section_id: no-article-for-a-substance
- handle: full_response_choice
  op: choose
  objective: obj-indefinite-articles-01
  bloom: analyze
  prompt_md: 'Choose the message that matches the facts and follows the lesson’s three-gender pattern.
    Use ei for the feminine noun here; en is also accepted with many feminine nouns in Bokmål.'
  stem_md: Omar is packing for a weekend trip. He has one cup, one book, and one map in his bag. His roommate
    is a doctor. At home they drink tea as a beverage, not as one serving.
  options:
  - id: cup-wrong-gender
    text: I sekken har jeg ei kopp, ei bok og et kart. Romkameraten min er lege. Vi drikker te hjemme.
    correct: false
    why: Kopp is masculine in the lesson’s convention and takes en.
  - id: role-treated-as-person
    text: I sekken har jeg en kopp, ei bok og et kart. Romkameraten min er en lege. Vi drikker te hjemme.
    correct: false
    why: In this neutral description, lege names a role after er and is normally bare.
  - id: substance-treated-as-serving
    text: I sekken har jeg en kopp, ei bok og et kart. Romkameraten min er lege. Vi drikker en te hjemme.
    correct: false
    why: The stem means tea as a beverage; en te would mean one serving.
  - id: all-facts-correct
    text: I sekken har jeg en kopp, ei bok og et kart. Romkameraten min er lege. Vi drikker te hjemme.
    correct: true
    why: The message matches the facts, uses the lesson’s three-gender pattern, and treats lege as a role
      and tea as a substance.
  explanation_md: The countable objects take en kopp, ei bok, and et kart in the lesson’s three-gender
    pattern. A neutral role after er and tea as a beverage are bare.
  derived_from:
  - section_id: bringing-the-choices-together
