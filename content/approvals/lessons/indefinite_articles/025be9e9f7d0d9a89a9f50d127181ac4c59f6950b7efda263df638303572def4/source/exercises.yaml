    text: en seng · en hylle · et skrivebord
    correct: false
    why: The lesson's three-gender convention uses ei with hylle.
  - id: gender-labels-neuter-as-masculine
    text: en seng · ei hylle · en skrivebord
    correct: false
    why: Skrivebord is neuter and requires et.
  - id: gender-labels-masculine-as-neuter
    text: et seng · ei hylle · et skrivebord
    correct: false
    why: Seng is masculine and requires en.
  - id: gender-labels-correct
    text: en seng · ei hylle · et skrivebord
    correct: true
    why: The three-gender convention maps -en to en, -a to ei, and -et to et.
