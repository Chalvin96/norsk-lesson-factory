  - section_id: no-article-for-a-substance
- handle: full_response_choice
  op: choose
  objective: obj-indefinite-articles-01
  bloom: analyze
  prompt_md: Velg meldingen som passer til opplysningene. Bruk «ei» foran
    hunkjønnsordet her; på bokmål godtas også «en» foran mange hunkjønnsord.
  stem_md: Omar pakker til helgetur. Han har med én kopp, én bok og ett kart.
    Romkameraten hans er lege. Hjemme drikker de te som drikke, ikke som én
    porsjon.
  options:
  - id: cup-wrong-gender
    text: I sekken har jeg ei kopp, ei bok og et kart. Romkameraten min er lege.
      Vi drikker te hjemme.
    correct: false
    why: Kopp is masculine in the lesson’s convention and takes en.
  - id: role-treated-as-person
    text: I sekken har jeg en kopp, ei bok og et kart. Romkameraten min er en
      lege. Vi drikker te hjemme.
    correct: false
    why: In this neutral description, lege names a role after er and is normally
      bare.
  - id: substance-treated-as-serving
    text: I sekken har jeg en kopp, ei bok og et kart. Romkameraten min er lege.
      Vi drikker en te hjemme.
    correct: false
    why: The stem means tea as a beverage; en te would mean one serving.
  - id: all-facts-correct
    text: I sekken har jeg en kopp, ei bok og et kart. Romkameraten min er lege.
      Vi drikker te hjemme.
    correct: true
    why: The message matches the facts, uses the lesson’s three-gender pattern,
      and treats lege as a role and tea as a substance.
  explanation_md: Bruk «en kopp», «ei bok» og «et kart» om de tre tingene. Et
    yrke etter «er» står uten artikkel, og «te» som drikke står også uten
    artikkel.
  derived_from:
  - section_id: bringing-the-choices-together
