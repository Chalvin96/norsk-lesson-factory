- handle: drink_or_serving
  op: choose
  objective: obj-indefinite-articles-01
  bloom: understand
  prompt_md: Velg setningen som passer til bestillingen av én porsjon.
  stem_md: Amina bestiller én kopp kaffe som hun skal ta med seg.
  options:
  - id: definite-serving
    text: Jeg vil gjerne ha kaffen.
    correct: false
    why: This refers to particular coffee already known.
  - id: serving
    text: Jeg vil gjerne ha en kaffe.
    correct: true
    why: En kaffe presents the order as one countable serving.
  - id: substance
    text: Jeg vil gjerne ha litt kaffe.
    correct: false
    why: The reply asks for some coffee as a substance, not one countable
      serving.
  - id: wrong-gender-serving
    text: Jeg vil gjerne ha et kaffe.
    correct: false
    why: The article does not match the taught form for one serving of coffee.
