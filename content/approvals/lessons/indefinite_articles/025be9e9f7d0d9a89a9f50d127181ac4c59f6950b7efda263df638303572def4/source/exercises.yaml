- handle: four_way_retrieval_review
  op: write
  objective: obj-indefinite-articles-01
  bloom: analyze
  prompt_md: "Svar Marta om kjøkkenet og jobben din. Bruk én ubestemt frase med «en», én med «ei», én med «et» og et yrke uten artikkel etter «er» eller «jobber som»."
  min_words: 20
  max_words: 40
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Marta
      text_md: «Hva har du på kjøkkenet, og hva jobber du som?»
  response_language: "no"
  judge_prompt: "Check the visible criteria uses-en, uses-ei, uses-et, bare-profession, comprehensible-message. All listed criteria gate. Report a verdict for every criterion id."
  criteria:
  - id: uses-en
    instruction: The response includes at least one correct singular noun phrase
      with en for a countable object.
  - id: uses-ei
    instruction: The response includes at least one correct singular noun phrase
      with ei for a countable object.
  - id: uses-et
    instruction: The response includes at least one correct singular noun phrase
      with et for a countable object.
  - id: bare-profession
    instruction: The response includes a profession used without an article
      after er or jobber som.
  - id: comprehensible-message
    instruction: The Norwegian is comprehensible enough for the listener to
      understand the description.
  derived_from:
  - section_id: bringing-the-choices-together
- handle: room_reply_message
  op: write
  objective: obj-indefinite-articles-01
  bloom: apply
  prompt_md: "Nora spør om det nye kollektivet ditt. Svar Nora. Fortell hvem du bor med, hvordan rommet og kjøkkenet er, at romkameraten arbeider som kokk, og at dere drikker kaffe hjemme. Bruk «en», «ei» og «et» foran tellbare substantiver i entall; bruk «ei» her."
  min_words: 25
  max_words: 45
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hei! Hvordan er det nye kollektivet? Hvem bor der, og hvordan er
        kjøkkenet?»
  response_language: "no"
  judge_prompt: "Evaluate only the listed criteria. The criteria reply-purpose, supplied-facts, article-forms, supplied-noun-forms, and comprehensible-message are gating. Criteria whose ids end in -observation are diagnostic and must never make the response fail. Report a verdict for every criterion id."
  criteria:
  - id: reply-purpose
    instruction: The response is a message to Nora describing the new shared
      flat.
  - id: supplied-facts
    instruction: The response mentions a neighbor, a lamp in the room, and a
      shared kitchen; says the flatmate is a cook; and says coffee is drunk at
      home, either as a beverage without an article or as one serving with «en
      kaffe».
  - id: article-forms
    instruction: The response uses en with a masculine countable noun, ei with a
      feminine countable noun, and et with a neuter countable noun, following
      the requested lesson pattern. Treat accepted en forms for feminine nouns
      as linguistically valid, though the prompt asks for ei here to demonstrate
      the pattern.
  - id: supplied-noun-forms
    instruction: The neighbor and lamp are expressed with suitable articles if
      phrased as singular countable nouns. The shared kitchen may naturally be
      expressed with bare «kjøkken» after «dele» or as «et kjøkken». The
      flatmate's role as cook is expressed without an indefinite article. Coffee
      may be expressed as the beverage without an article or as one serving with
      «en kaffe». Accept natural rephrasing that preserves those meanings.
  - id: comprehensible-message
    instruction: The Norwegian is comprehensible enough for Nora to understand
      the description.
  - id: count-articles-observation
    instruction: "Observation only: report the article used with each supplied singular
      countable noun and whether it matches the noun's gender, including accepted
      feminine en variants; bare «kjøkken» after «dele» is also natural; do not fail
      the response."
  - id: role-form-observation
    instruction: 'Observation only: report whether kokk is a bare role noun after
      være; do not fail the response.'
  - id: substance-form-observation
    instruction: 'Observation only: report whether coffee at home is presented as
      a beverage without an article or as a serving with «en kaffe»; do not fail the
      response.'
  derived_from:
  - section_id: back-at-the-flat
