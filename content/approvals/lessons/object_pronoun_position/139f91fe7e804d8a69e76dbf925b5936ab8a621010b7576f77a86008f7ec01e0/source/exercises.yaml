  - token_id: move-verb
    text: ringer
  - token_id: move-object
    text: henne
  - token_id: move-negation
    text: ikke.
  answer_order:
  - move-subject
  - move-verb
  - move-object
  - move-negation
- handle: contrast_noun_and_pronoun
