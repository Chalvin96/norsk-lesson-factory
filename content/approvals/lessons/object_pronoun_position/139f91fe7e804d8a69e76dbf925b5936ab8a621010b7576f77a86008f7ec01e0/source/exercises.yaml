- handle: review_one_or_two_verbs
  op: choose
  objective: obj-object-pronoun-position-01
  bloom: analyze
  prompt_md: Choose the two neutral replies.
  derived_from:
  - section_id: when-the-sentence-has-two-verbs
  stem_md: 'A: Finner Lea nøkkelen? B: ___. A: Kan Lea finne kortet? B: ___.'
  options:
  - id: review-one-verb-generalized
    text: Nei, hun finner den ikke. Nei, hun kan det ikke finne.
    correct: false
    why: The second reply incorrectly applies the one-verb pattern inside a modal construction.
  - id: review-ikke-generalized
    text: Nei, hun finner ikke den. Nei, hun kan ikke finne det.
    correct: false
    why: The first reply incorrectly keeps ikke immediately after the only verb.
  - id: review-forms-reversed
    text: Nei, hun finner det ikke. Nei, hun kan ikke finne den.
    correct: false
    why: The positions fit, but the pronouns reverse masculine nøkkelen and neuter kortet.
  - id: review-both-correct
    text: Nei, hun finner den ikke. Nei, hun kan ikke finne det.
    correct: true
    why: The one-verb reply places den before ikke, while the two-verb reply places det after finne.
