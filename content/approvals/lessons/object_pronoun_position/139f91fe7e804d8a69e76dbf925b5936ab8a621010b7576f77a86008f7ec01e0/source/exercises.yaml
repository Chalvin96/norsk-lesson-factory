- handle: repair_the_message
  op: find_fix
  objective: obj-object-pronoun-position-01
  bloom: analyze
  prompt_md: Select the misplaced object pronoun.
  derived_from:
  - section_id: when-the-sentence-has-two-verbs
  stimulus_md: Jeg finner ikke henne nå. Jeg kan ikke hjelpe henne.
  explanation_md: 'Only the first henne is misplaced: a neutral one-verb clause puts it before ikke, while the two-verb clause keeps it after hjelpe.'
  tokens:
  - token_id: repair-s1-subject
    text: Jeg
  - token_id: repair-s1-verb
    text: finner
  - token_id: repair-s1-negation
    text: ikke
  - token_id: repair-henne-1
    text: henne
  - token_id: repair-s1-adverb
    text: nå.
  - token_id: repair-s2-subject
    text: Jeg
  - token_id: repair-s2-modal
    text: kan
  - token_id: repair-s2-negation
    text: ikke
  - token_id: repair-s2-main
    text: hjelpe
  - token_id: repair-henne-2
    text: henne.
  error_token_id: repair-henne-1
  feedback: 'Move the marked henne before ikke: Jeg finner henne ikke nå. The second sentence is correct because henne follows hjelpe.'
