- handle: choose_the_known_object
  op: choose
  objective: obj-object-pronoun-position-01
  bloom: understand
  prompt_md: Choose the object-pronoun set that completes every sentence.
  derived_from:
  - section_id: what-does-the-pronoun-replace
  stem_md: Jeg ringer Sara → Jeg ringer ___. Maja hjelper Jonas → Maja hjelper ___. Har du nøkkelen? → Ja, jeg har ___. Har du kortet? → Ja, jeg har ___. Har du koppene? → Ja, jeg har ___.
  options:
  - id: set-wrong-person
    text: ham; henne; den; det; dem
    correct: false
    why: The person pronouns reverse the roles of Sara and Jonas.
  - id: set-correct
    text: henne; ham; den; det; dem
    correct: true
    why: The forms match the two people, the genders of the singular nouns, and the plural noun.
  - id: set-wrong-gender
    text: henne; ham; det; den; dem
    correct: false
    why: The singular thing pronouns reverse the masculine noun nøkkelen and the neuter noun kortet.
  - id: set-wrong-number
    text: henne; ham; den; det; den
    correct: false
    why: The last form is singular, but koppene is plural.
- handle: replace_and_place_affirmative
  op: build
  objective: obj-object-pronoun-position-01
  bloom: apply
  prompt_md: Build both rewrites with den and henne.
  derived_from:
  - section_id: position-in-an-affirmative-sentence
  stimulus_md: Maja finner nøkkelen. I dag hjelper Jonas Sara.
  explanation_md: In an affirmative main clause, the object pronoun follows the verb or the post-verbal subject.
  tokens:
  - token_id: affirmative-subject-1
    text: Maja
  - token_id: affirmative-verb-1
    text: finner
  - token_id: affirmative-object-1
    text: den.
  - token_id: affirmative-time-1
    text: I
  - token_id: affirmative-time-2
    text: dag
  - token_id: affirmative-verb-2
    text: hjelper
  - token_id: affirmative-subject-2
    text: Jonas
  - token_id: affirmative-object-2
    text: henne.
  answer_order:
  - affirmative-subject-1
  - affirmative-verb-1
  - affirmative-object-1
  - affirmative-time-1
  - affirmative-time-2
  - affirmative-verb-2
  - affirmative-subject-2
  - affirmative-object-2
- handle: move_before_ikke
