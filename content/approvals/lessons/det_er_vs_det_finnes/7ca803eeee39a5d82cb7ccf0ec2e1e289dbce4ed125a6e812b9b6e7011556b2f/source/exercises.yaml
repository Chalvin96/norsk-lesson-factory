  judge_prompt: "Evaluate only the visible message task. Criteria availability-form, follow-up-forms are gating; no criterion is diagnostic-only. Valid variant that must pass: «Det finnes et vaskerom i andre etasje. Det er rommet med det blå skiltet ved trappa.» Near-miss that must fail because it never uses det finnes: «Vaskerommet er i andre etasje.» Near-miss that must fail because it never identifies or describes the laundry room with det er: «Det finnes et vaskerom i andre etasje.»"
  criteria:
  - id: availability-form
