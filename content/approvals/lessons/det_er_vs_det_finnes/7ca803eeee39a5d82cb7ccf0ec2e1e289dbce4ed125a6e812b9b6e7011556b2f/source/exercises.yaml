  - id: notice-correct
    text: The first line names a specific room; the second says a luggage room is available; the third asks whether a restaurant exists.
    correct: true
    why: Det er rom 214 names a particular room, det finnes et bagasjerom announces something available, and finnes det en restaurant? asks whether it exists.
  - id: notice-swap-first
    text: The first line says a room is available; the second names a specific luggage room; the third asks whether a restaurant exists.
    correct: false
    why: 'The first two jobs are swapped: the opening line names room 214, while the luggage-room line announces availability.'
