  bloom: understand
  prompt_md: "Choose the explanation that fits all three messages."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ingrid
      text_md: «Det er rom 214.»
    - speaker: Ingrid
      text_md: «Det finnes et bagasjerom ved resepsjonen.»
    - speaker: Sara
      text_md: «Finnes det en restaurant på hotellet?»
