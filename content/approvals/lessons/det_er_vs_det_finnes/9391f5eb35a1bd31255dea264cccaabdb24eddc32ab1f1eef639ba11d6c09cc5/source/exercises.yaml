- handle: new-to-known-sequence
  op: write
  objective: obj-det-er-vs-det-finnes-01
  bloom: apply
  prompt_md: 'Fakta: Hotellet har et lite treningsrom i kjelleren; døra ligger ved siden av heisen; rommet
    er lyst og moderne. Write an 8–25 word Norwegian message to Sara: announce the basement gym as available
    with det finnes, then use det er to identify or describe it with at least one supplied detail so she
    can find or recognize it.'
  derived_from:
  - section_id: controlled-choice-to-connected-use
  response_language: 'no'
  min_words: 8
  max_words: 25
  judge_prompt: 'Evaluate only the visible message task. Criteria availability-form, follow-up-forms,
    and word-bound are gating; no criterion is diagnostic-only. Valid variant that must pass: «Det finnes
    et lite treningsrom i kjelleren. Det er lyst og moderne, og døra er ved siden av heisen.» Near-miss
    that must fail because it never uses det finnes: «Treningsrommet er lyst og moderne.» Near-miss that
    must fail because it never identifies or describes the gym with det er: «Det finnes et lite treningsrom
    i kjelleren.»'
  criteria:
  - id: availability-form
    instruction: The message announces the basement gym as available using det finnes.
  - id: follow-up-forms
    instruction: The message then uses det er to identify or describe the gym with at least one supplied
      detail that helps Sara find or recognize it.
  - id: word-bound
    instruction: The response contains 8–25 words.
