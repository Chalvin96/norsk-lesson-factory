- handle: interpret_office_follow_up
  op: write
  objective: obj-som-om-as-if-01
  bloom: apply
  prompt_md: 'Jonas skriver: «Erik fikk ikke jobben. Likevel smiler han hele tiden. Vet vi hvorfor?» Fakta: Resultatet er kjent: Erik fikk ikke jobben. Smilet er synlig. Årsaken til smilet er ikke kjent. Svar Jonas på norsk og skill mellom det dere vet og inntrykket smilet gir. Bruk som om i en setning om inntrykket. Skriv 30–50 ord.'
  derived_from:
  - section_id: checkpoint-interpret-office-follow-up
  response_language: 'no'
  min_words: 30
  max_words: 50
  judge_prompt: Evaluate office-facts, knowledge-impression-boundary, and som-om-observation as gating criteria. Record om-observation and clause-order-observation diagnostically; an unmet diagnostic observation must never fail the response.
  criteria:
  - id: office-facts
    instruction: The reply says that Erik did not get the job, that he is smiling, and that the reason is unknown.
  - id: knowledge-impression-boundary
    instruction: The reply distinguishes confirmed information from the impression created by Erik’s smile.
  - id: som-om-observation
    instruction: The reply uses som om for the impression without presenting the imagined situation as a known fact.
  - id: om-observation
    instruction: Record whether the learner naturally uses om for the unresolved question.
  - id: clause-order-observation
    instruction: Record whether any subordinate clause containing ikke uses familiar subordinate-clause order.
- handle: revise_som_om_clause_order
  op: choose
  objective: obj-som-om-as-if-01
  bloom: analyze
  prompt_md: Choose the corrected sentence.
  derived_from:
  - section_id: common-mistakes
  stem_md: 'Faktum: Han kjenner ingen av de andre gjestene. Utkast: «Han oppfører seg som om han kjenner ikke noen her.» Rett ordstillingen.'
  options:
  - id: negation-after-verb
    text: Han oppfører seg som om han kjenner ikke noen her.
    correct: false
    why: In the subordinate clause after «som om», «ikke» comes before the finite verb «kjenner».
  - id: subordinate-order
    text: Han oppfører seg som om han ikke kjenner noen her.
    correct: true
    why: «Som om» introduces the imagined comparison; the subordinate clause puts «ikke» before «kjenner».
