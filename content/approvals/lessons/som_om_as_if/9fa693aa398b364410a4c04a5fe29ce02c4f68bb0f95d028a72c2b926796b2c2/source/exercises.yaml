- handle: notice_imagined_resemblance
  op: choose
  objective: obj-som-om-as-if-01
  bloom: understand
  prompt_md: Choose the best interpretation.
  derived_from:
  - section_id: checkpoint-notice-imagined-resemblance
  stem_md: 'Mina: «Erik smiler som om ingenting har skjedd.» Jonas: «Erik ser ut som om han ikke er bekymret.»'
  options:
  - id: confirmed-facts
    text: De slår fast at ingenting har skjedd, og at Erik ikke er bekymret.
    correct: false
    why: This treats both impressions as confirmed facts.
  - id: open-questions
    text: De spør om noe har skjedd, og om Erik er bekymret.
    correct: false
    why: This changes descriptions of appearance into requests for information.
  - id: imagined-resemblance
    text: De beskriver hvordan Erik virker, uten å slå fast at de forestilte situasjonene er sanne.
    correct: true
    why: Som om links observable behaviour or appearance to an imagined situation.
- handle: discriminate_som_om_om_pair
  op: choose
  objective: obj-som-om-as-if-01
  bloom: understand
  prompt_md: Choose the two replies that fit.
  derived_from:
  - section_id: checkpoint-distinguish-comparison-question-condition
  stimulus:
  - kind: dialogue
    turns:
    - speaker: "A"
      text_md: "Hvordan virker Erik?"
    - speaker: "B"
      text_md: "Han snakker ___ han kjenner alle."
  - kind: dialogue
    turns:
    - speaker: "A"
      text_md: "Hva vil Mina vite?"
    - speaker: "B"
      text_md: "Hun spør ___ Erik kjenner alle."
  options:
  - id: question-then-comparison
    text: om · 2. som om
    correct: false
    why: 'This reverses the two functions: an impression is not an embedded question.'
  - id: comparison-then-question
    text: som om · 2. om
    correct: true
    why: The first reply describes an impression; the second reports a yes-or-no question.
