  bloom: analyze
  prompt_md: Mina and Jonas are evaluating bicycles, routes, and cycling styles. Classify each Norwegian
    statement as a base description with no comparison, a comparison between two alternatives, or the
    highest or lowest degree in a group. Do not infer the category from a word ending alone.
  explanation_md: A base form describes without comparing, a comparative sets two alternatives against
    each other, and a superlative identifies an extreme within a group.
