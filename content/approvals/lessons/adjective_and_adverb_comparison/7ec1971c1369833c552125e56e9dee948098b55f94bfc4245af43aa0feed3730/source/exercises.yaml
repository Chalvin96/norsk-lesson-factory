    bucket_id: group-extreme
  - item_id: statement-1
    text: Hjelmen føles tung.
    bucket_id: base-description
  - item_id: statement-5
    text: Stien er brattere enn grusveien.
    bucket_id: two-way-comparison
  - item_id: statement-6
    text: Av alle tre veiene er grusveien bredest.
    bucket_id: group-extreme
  - item_id: statement-2
    text: Den nye hjelmen veier mindre enn den gamle.
    bucket_id: two-way-comparison
  - item_id: statement-4
    text: Sara løper rolig.
    bucket_id: base-description
