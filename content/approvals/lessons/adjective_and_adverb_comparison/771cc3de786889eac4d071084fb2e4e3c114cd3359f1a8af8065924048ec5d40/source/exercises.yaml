    complete each two-way comparison with the regular -ere form and the connector that introduces the
    second side. The connector is tested where it is blank.
  explanation_md: Use -ere for a regular two-way comparison and introduce the second side with enn.
  derived_from:
  - section_id: regular-comparison
  audio_target: Den blå sykkelen er lettere enn den røde. Jonas er raskere enn Mina. Sykkelen er billigere
