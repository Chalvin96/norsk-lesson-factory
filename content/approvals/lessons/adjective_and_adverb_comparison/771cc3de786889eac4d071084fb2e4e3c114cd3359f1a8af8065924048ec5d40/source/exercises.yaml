    options:
    - enn
    - som
    answer_index: 0
  - text_md: ' den røde.'
  - text_md: ' Jonas er '
  - blank_id: comparative-2
    options:
    - raskest
    - raskere
    answer_index: 1
  - text_md: ' '
  - blank_id: connector-2
    options:
    - som
    - enn
    answer_index: 1
  - text_md: ' Mina.'
  - text_md: ' Sykkelen er '
  - blank_id: comparative-3
    options:
    - billigere
    - billigst
    answer_index: 0
  - text_md: ' '
  - blank_id: connector-3
    options:
    - enn
    - som
    answer_index: 0
  - text_md: ' scooteren. Denne ruta er '
  - blank_id: comparative-4
    options:
    - raskere
    - kortere
    answer_index: 1
  - text_md: ' '
  - blank_id: connector-4
    options:
    - som
    - enn
    answer_index: 1
  - text_md: ' den andre.'
- handle: select_regular_or_long_comparison
  op: recall_fill
  objective: obj-adjective-and-adverb-comparison-01
  bloom: apply
  prompt_md: The rental shop describes several bicycles and plans. Complete the five Norwegian sentences.
    In order, the intended meanings are lighter, cheapest, more comfortable, most modern, and more efficient.
    Each blank contrasts the regular suffix pattern with the mer or mest pattern for the same meaning;
    choose the pattern that is correct for that adjective and sentence frame.
  explanation_md: Use -ere or -est with common short adjectives; longer adjectives commonly use mer for
    two-way comparison and mest for a group extreme.
  derived_from:
  - section_id: longer-forms-with-mer-and-mest
  audio_target: Den blå sykkelen er lettere enn den røde. Mina valgte den billigste sykkelen. Den røde
    sykkelen har et mer komfortabelt sete enn den blå. Dette er den mest moderne sykkelen i butikken.
    Planen er mer effektiv enn den gamle.
  segments:
  - text_md: 'Den blå sykkelen er '
  - blank_id: pattern-1
    options:
    - lettere
    - mer lett
    answer_index: 0
  - text_md: ' enn den røde.'
  - text_md: ' Mina valgte den '
  - blank_id: pattern-2
    options:
    - mest billige
    - billigste
    answer_index: 1
  - text_md: ' sykkelen.'
  - text_md: ' Den røde sykkelen har et '
  - blank_id: pattern-3
    options:
    - mest komfortabelt
    - mer komfortabelt
    answer_index: 1
  - text_md: ' sete enn den blå.'
  - text_md: ' Dette er den '
  - blank_id: pattern-4
    options:
    - mer moderne
    - mest moderne
    answer_index: 1
  - text_md: ' sykkelen i butikken.'
  - text_md: ' Planen er '
  - blank_id: pattern-5
    options:
    - mest effektiv
    - mer effektiv
    answer_index: 1
  - text_md: ' enn den gamle.'
