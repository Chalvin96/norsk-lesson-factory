- handle: transfer_comparisons_to_commuting
  op: write
  objective: obj-adjective-and-adverb-comparison-01
  bloom: apply
  prompt_md: "Hvilken transportmåte passer Erik best til jobbreisen? Sammenlign å gå, ta buss og sykle i en melding. Ta hensyn til pris, fart, komfort, pålitelighet, avstand og effektivitet. Bruk adjektiv og adverb, regelrette og uregelrette former, mer/mest og minst én superlativ."
  derived_from:
  - section_id: cumulative-transfer-choosing-a-journey-to-work
  response_language: "no"
  min_words: 35
  max_words: 65
  judge_prompt: Check the Norwegian response against the commuting task and
    report evidence for every criterion. Accept natural Bokmål wording when it
    preserves the requested comparison meaning and target pattern.
  criteria:
  - id: commuting-factors
    instruction: Addresses price, speed, comfort, reliability, distance, and
      travel efficiency across the three commuting options.
  - id: two-way-and-group
    instruction: Includes at least one comparison between two alternatives and
      at least one highest- or lowest-degree statement across all three
      alternatives.
  - id: pattern-variety
    instruction: Uses at least one accurate regular -ere or -est form, one mer
      or mest form, and one taught irregular comparison form.
  - id: thing-and-action
    instruction: Uses an adjective to compare a travel option and an adverb to
      compare how Erik travels.
  - id: new-commuting-context
    instruction: Keeps the comparisons in Erik's commuting situation rather than
      copying the lesson's bicycle-trip sentences.
