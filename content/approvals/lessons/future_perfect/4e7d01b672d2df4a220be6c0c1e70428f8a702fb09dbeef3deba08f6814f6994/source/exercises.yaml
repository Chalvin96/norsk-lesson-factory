- handle: future_completion_viewpoint_choice
  op: choose
  objective: obj-future-perfect-01
  bloom: analyze
  prompt_md: "Velg svaret som passer best i samtalen."
  stem_md: 'Maja: Klokka er fire nå. Vi har bare ti sider igjen, og vi leser ti sider i timen. Tror du boka er ferdig før
    klokka seks?'
  options:
  - id: wrong-timeframe
    text: Ja, vi hadde lest boka før klokka seks.
    correct: false
    why: Hadde lest places the completion before a past reference point, not before the coming six o'clock.
  - id: future-activity
    text: Ja, vi skal begynne å lese boka før klokka seks.
    correct: false
    why: They are already reading; beginning to read does not answer whether the book will be finished.
  - id: evidence-reading
    text: Ja, vi kommer til å ha lest boka før klokka seks.
    correct: true
    why: Kommer til å ha presents completion as an expected result supported by the current pace.
  - id: ordinary-reading
    text: Ja, vi kommer til å lese boka etter klokka seks.
    correct: false
    why: This describes later activity rather than completion before six.
  derived_from:
  - section_id: meaning-choice-checkpoint
