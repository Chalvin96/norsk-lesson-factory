- handle: future_completion_timeline
  op: choose
  objective: obj-future-perfect-01
  bloom: understand
  prompt_md: "Velg setningen som viser at rapporten er ferdig før møtet begynner."
  stem_md: 'Akkurat nå arbeider Maja med rapporten. Kl. 14: Møtet begynner.'
  options:
  - id: present-activity
    text: Maja skriver rapporten nå.
    correct: false
    why: Dette plasserer skrivingen i nåtiden i stedet for å framstille rapporten som ferdig før et senere
      tidspunkt.
  - id: present-perfect
    text: Maja har skrevet deler av rapporten.
    correct: false
    why: Dette viser at bare deler av rapporten er skrevet, ikke at hele rapporten er ferdig.
  - id: ordinary-future
    text: Maja skal skrive rapporten etter møtet.
    correct: false
    why: Dette planlegger skrivingen etter møtet og viser derfor ikke at rapporten er ferdig før møtet.
  - id: future-completion
    text: Maja skal ha skrevet rapporten før møtet.
    correct: true
    why: «Skal ha» sammen med perfektum partisipp framstiller rapporten som ferdig før det senere møtet.
  derived_from:
  - section_id: first-checkpoint-finding-time-points
