- handle: notice_sentence_structure
  op: categorize
  objective: obj-discourse-connectors-02
  bloom: analyze
  prompt_md: Classify each Norwegian excerpt by its word order. Items 2 and 3 are the two parts of one
    sentence. For each excerpt, find the finite verb and the subject, then decide which one comes first
    and whether the clause is a main clause, a subordinate clause, or a coordinated clause.
  explanation_md: A fronted adverbial or a fronted subordinate clause fills the first position of a Norwegian
    main clause, so the finite verb comes next. Inside a subordinate clause the subject stays before the
    finite verb.
  derived_from:
  - section_id: connectors-v2-rule
  buckets:
  - bucket_id: connector_initial_v2
    label: Main clause opened by a fronted adverbial, with the finite verb before the subject
  - bucket_id: selv_om_subordinate_order
    label: Subordinate clause, with the subject before the finite verb
  - bucket_id: selv_om_following_main_v2
    label: Main clause following a fronted subordinate clause, with the finite verb before the subject
  - bucket_id: men_subject_verb
    label: Coordinated clause, with the subject before the finite verb
  items:
  - item_id: structure-1
    text: Først kom det bare seks frivillige.
    bucket_id: connector_initial_v2
  - item_id: structure-2
    text: Selv om butikken lå langt unna
    bucket_id: selv_om_subordinate_order
  - item_id: structure-3
    text: hentet Nora malingen.
    bucket_id: selv_om_following_main_v2
  - item_id: structure-4
    text: men vi begynte som planlagt.
    bucket_id: men_subject_verb
- handle: build_clear_timeline
  op: write
  objective: obj-discourse-connectors-01
  bloom: apply
  prompt_md: Retell the garden workday in four short Norwegian sentences in chronological order. First, only
    six volunteers arrived; then the school class arrived; after that, the group painted the benches; finally,
    they cleaned the whole area. Begin each stage with a suitable sequence connector and use V2 word order.
  derived_from:
  - section_id: showing-sequence
  response_language: 'no'
  min_words: 15
  max_words: 50
  judge_prompt: >-
    Evaluate the response against the four-event retelling, chronological order, sequence-connectors, V2,
    and word-bound criteria. Accept natural Bokmål wording and suitable sequence connectors. Each of the
    four events must be stated, and each sentence must place its finite verb immediately after the fronted
    connector.
  criteria:
  - id: four-events
    instruction: Includes the arrival of the six volunteers, the school class, the bench painting, and the area cleanup.
  - id: chronological-order
    instruction: Presents the four events in the supplied chronological order.
  - id: sequence-connectors
    instruction: Begins each stage with an appropriate sequence connector.
  - id: v2-after-connector
    instruction: Places the finite verb directly after each fronted sequence connector.
  - id: word-bound
    instruction: Contains 15–50 Norwegian words.
- handle: strengthen_report
  op: write
  objective: obj-discourse-connectors-01
  bloom: apply
  prompt_md: Write 35–70 words in Norwegian for Ingrid and Samir's council report. Add two coherent supporting
    facts, with one sentence beginning with I tillegg and one beginning with Dessuten. Then respond to
    Skoleklassen kom. with a follow-up about the teacher's tools. Choose i tillegg if the tools are extra
    information or deretter if they are a later event, and explain in Norwegian how the alternative would
    change the listener's interpretation from addition to sequence or from sequence to addition. Use verb–subject
    order after every fronted adverbial connector.
  derived_from:
  - section_id: adding-another-point
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: Check the response against the task and report evidence for every criterion. Accept natural
    Bokmål variants, but require both added facts with I tillegg and Dessuten each beginning a sentence,
    the follow-up about the teacher's tools, the requested connector choices, the explanation of the alternative
    interpretation, and correct verb–subject order after each fronted adverbial connector.
  criteria:
  - id: coherent-supporting-details
    instruction: Adds two coherent supporting facts to the council report.
  - id: i-tillegg-sentence
    instruction: Begins one sentence with I tillegg to add a supporting fact.
  - id: dessuten-sentence
    instruction: Begins one sentence with Dessuten to add a supporting fact.
  - id: follow-up-tools
    instruction: Responds to Skoleklassen kom. with a follow-up about the teacher's tools.
  - id: relationship-choice
    instruction: Selects i tillegg or deretter to match the intended addition or sequence relationship.
  - id: alternative-interpretation
    instruction: Explains in Norwegian how the alternative connector would change the listener's interpretation.
  - id: fronted-adverbial-order
    instruction: Uses verb–subject order after each fronted adverbial connector.
- handle: present_obstacle_response
  op: write
  objective: obj-discourse-connectors-02
  bloom: apply
  prompt_md: Write a brief Norwegian response about the volunteer day. Present the rain as one problem
    and the distant shop as another. Use one likevel construction beginning with fronted Likevel to connect
    a problem with its response. Write one sentence beginning with an opening Selv om clause to connect
    the other problem with its response. Add one direct contrast between two people, things, or situations
    using men or derimot. Make every relationship clear and use inversion in the main clauses after fronted
    Likevel and after the opening Selv om clause.
  derived_from:
  - section_id: expressing-contrast-concession
  response_language: 'no'
  min_words: 30
  max_words: 65
  judge_prompt: Check the response against the task and report evidence for every criterion. Require a
    clear rain response, a clear distant-shop response, one direct contrast, the requested likevel and
    selv om constructions, and correct inversion in both relevant main clauses.
  criteria:
  - id: clear-relationships
    instruction: Makes the rain response, distant-shop response, and direct contrast clear.
  - id: direct-contrast
    instruction: Uses men or derimot for the direct contrast.
  - id: likevel-concession
    instruction: Uses likevel for one concession.
  - id: opening-selv-om
    instruction: Begins one sentence with a selv om clause.
  - id: main-clause-inversion
    instruction: Uses inversion in the main clauses after fronted likevel and an opening selv om clause.
- handle: distinguish_cause_contrast
