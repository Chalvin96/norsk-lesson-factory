  objective: obj-discourse-connectors-02
  bloom: apply
  prompt_md: Arrange the supplied tokens into two linked versions of the same bad-weather cause-and-result
    relationship. First state the cause, then the result in a new main clause; next state the result first
    and attach the cause as a reason. Use every token exactly once and keep correct Norwegian word order.
  derived_from:
  - section_id: linking-cause-result
  tokens:
  - token_id: cause-01
    text: Det regnet kraftig.
  - token_id: cause-02
    text: vi under tak.
  - token_id: cause-03
    text: fordi
  - token_id: cause-04
    text: Derfor
  - token_id: cause-05
    text: arbeidet
  - token_id: cause-06
    text: Vi arbeidet under tak
  - token_id: cause-07
    text: det
  - token_id: cause-08
    text: regnet kraftig.
  answer_order:
  - cause-01
  - cause-04
  - cause-05
  - cause-02
  - cause-06
  - cause-03
  - cause-07
  - cause-08
- handle: end_council_report
  op: write
  objective: obj-discourse-connectors-01
  bloom: apply
  prompt_md: Write 12–35 words in Norwegian to end the volunteer-day report. First state a final event
    using Til slutt. Then evaluate the day overall using Alt i alt, or use altså to state an evaluative
    conclusion. Use each connector for its intended purpose and maintain correct word order.
  derived_from:
  - section_id: drawing-a-conclusion
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: Check the response against the task and report evidence for every criterion. Accept either
    the taught overall-conclusion form with alt i alt or a natural conclusion containing altså, provided
    the two connectors have distinct chronological and evaluative functions.
  criteria:
  - id: final-event
    instruction: Uses til slutt for the final event.
  - id: overall-conclusion
    instruction: Uses alt i alt for an overall evaluation, or uses altså for an evaluative conclusion about the day.
  - id: connector-functions
    instruction: Uses each connector for its intended chronological or evaluative purpose.
  - id: correct-word-order
    instruction: Maintains correct word order.
- handle: repair_fronted_connector
  op: choose
  objective: obj-discourse-connectors-01
  bloom: analyze
  prompt_md: Choose the sentence that correctly places the finite verb after the fronted sequence connector.
  stem_md: The caretaker repaired the gate first. The students then painted it.
  derived_from:
  - section_id: common-mistakes-to-avoid
  options:
  - id: correct-v2
    text: Deretter malte elevene porten.
    correct: true
    why: Deretter is in first position, followed by the finite verb malte and then the subject elevene.
  - id: subject-before-verb
    text: Deretter elevene malte porten.
    correct: false
    why: A fronted Deretter requires the finite verb before the subject in a main clause.
  - id: verb-at-end
    text: Deretter elevene porten malte.
    correct: false
    why: The finite verb cannot remain at the end of this main clause after a fronted connector.
- handle: coherent_project_update
  op: write
  objective: obj-discourse-connectors-01
  bloom: apply
  prompt_md: Write an 80–130-word Norwegian council update as one coherent account of the garden workday,
    without copying the dialogue line by line. Begin with the initial situation, organize the work in
    sequence, add supporting information, mention an obstacle and its response, explain a cause-and-result
    relationship, and end with a final event and an overall conclusion. Use connectors for distinct functions,
    including sequence, addition, cause, result, and conclusion. Include a fronted adverbial connector
    with finite verb before subject; an opening selv om clause followed by an inverted main clause; a
    fordi clause and the opening selv om clause with subject before finite verb; one men clause whose
    first constituent after men is the subject; and one men clause with a taught adverbial fronted after
    men, so the finite verb comes before the subject. Do not count men itself as a fronted adverbial.
  derived_from:
  - section_id: extended-practice
  response_language: 'no'
  min_words: 80
  max_words: 130
  judge_prompt: Check the response against the task and report evidence for every criterion. Require one
    coherent garden-project report that opens with the initial situation, organizes events in sequence,
    adds supporting information, mentions an obstacle and its response, explains a cause-and-result relationship,
    and ends with a final event and an overall conclusion. Also require the specified connector functions,
    subordinate and main-clause word orders, and both contrasting men patterns.
  criteria:
  - id: coherent-report
    instruction: Reads as one coherent report rather than isolated sentences.
  - id: opening-initial-situation
    instruction: Begins the report with the initial situation.
  - id: sequence
    instruction: Organizes the work in a clear chronological sequence.
  - id: supporting-information
    instruction: Adds supporting information beyond the main sequence.
  - id: obstacle-and-response
    instruction: Mentions an obstacle and the response to it.
  - id: cause-and-result
    instruction: Explains a clear cause-and-result relationship.
  - id: final-event-and-conclusion
    instruction: Ends with a final event and an overall conclusion.
  - id: distinct-connector-functions
    instruction: Uses sequence, addition, cause, result, and conclusion connectors for their distinct
      functions.
  - id: fronted-adverbial-v2
    instruction: Places the finite verb before the subject after a fronted adverbial connector.
  - id: opening-selv-om-inversion
    instruction: Uses inversion in the main clause following an opening selv om clause.
  - id: subordinate-order
    instruction: Retains subject-before-verb order inside the modeled fordi and selv om clauses.
  - id: men-subject-verb
    instruction: Uses subject–verb order after men when the subject is the coordinated clause's first
      constituent.
  - id: men-fronted-adverbial-v2
    instruction: Includes one men clause with a taught adverbial fronted after men, with the finite verb
      before the subject.
- handle: short_retrieval_review
  op: write
  objective: obj-discourse-connectors-02
  bloom: apply
  prompt_md: 'Without looking back, write six numbered sentences in Norwegian, one for each relationship:
    sequence, addition, direct contrast, concession, cause, and conclusion. Use fresh situations and lexical
    frames rather than copying complete lesson sentences. Set the addition sentence outside the garden
    report in an everyday grocery-shopping context, using i tillegg or dessuten. Use men or derimot for
    direct contrast, likevel or selv om for concession, and fordi for cause with subject before finite
    verb in its subordinate clause. Use a fronted adverbial connector in at least four sentences. Before
    submitting, check second-position finite verbs after each fronted adverbial connector. Do not treat
    men itself as a fronted adverbial connector. If a taught adverbial follows men, apply the V2 check
    to that adverbial; if concession uses selv om, do not apply the main-clause check inside its subordinate
    clause.'
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 35
  max_words: 90
  judge_prompt: Check the response against the task and report evidence for every criterion. Verify six
    distinct relationship sentences, the grocery-shopping addition context, the required connector choices,
    at least four sentences with a fronted adverbial connector, and the separate main-clause and subordinate-clause
    word-order rules. Reject copied complete lesson sentences.
  criteria:
  - id: six-relationships
    instruction: Produces one sentence for each of the six relationships.
  - id: direct-contrast
    instruction: Uses men or derimot for direct contrast.
  - id: concession
    instruction: Uses likevel or selv om for concession.
  - id: fordi-order
    instruction: Uses fordi with the modeled subordinate-clause word order.
  - id: fronted-four
    instruction: Uses a fronted adverbial connector in at least four sentences.
  - id: grocery-addition
    instruction: Sets the addition sentence in an everyday grocery-shopping context outside the garden
      report.
  - id: second-position-check
    instruction: Keeps finite verbs in second position after fronted adverbial connectors.
  - id: men-not-fronted
    instruction: Does not treat men itself as a fronted adverbial connector.
  - id: selv-om-boundary
    instruction: Does not apply the main-clause V2 check inside a selv om subordinate clause.
