- handle: checkpoint_correct_permanence_shortcut
  op: write
  objective: obj-vaere-or-bli-for-state-and-change-01
  bloom: apply
  prompt_md: 'Write a Norwegian text message to a friend explaining four pairs of situations: an existing
    condition before lunch and becoming hungry later, a singer''s existing nervousness and becoming calm
    later, a jacket that is wet after yesterday''s rainy walk and a dry jacket becoming wet during today''s
    walk, and still being tired today after yesterday''s work and becoming tired during today''s long shift. For every
    pair, use er for the first existing state and blir for the later change.'
  derived_from:
  - section_id: checkpoint-correct-the-permanence-shortcut
  response_language: 'no'
  min_words: 20
  max_words: 100
  judge_prompt: Check that the response covers all four pairs and uses er for each first state and blir
    for each change.
  criteria:
  - id: covers-four-pairs
    instruction: Covers all four supplied pairs of situations.
  - id: state-then-change
    instruction: For each pair, describe the existing state with er and the later change into or away
      from that state with blir.
  - id: er-blir-observation
    instruction: 'Observation only: note lexical and stylistic variation; do not fail a natural equivalent.'
- handle: guided_practice_follow_one_object_through_time
  op: write
  objective: obj-vaere-or-bli-for-state-and-change-01
  bloom: apply
  prompt_md: 'Choose one element from the concert room: the temperature, tables, lighting, hall, or Mina''s
    mood. Write a short Norwegian note to the event organiser with a three-stage timeline: the element''s
    initial state, the event that changes it, and its state after the change. Use er for the initial and
    resulting states and blir for the transition.'
  derived_from:
  - section_id: guided-practice-follow-one-object-through-time
  response_language: 'no'
  min_words: 10
  max_words: 60
  judge_prompt: Check that the response gives a coherent three-stage timeline and uses er for both states
    and blir for the transition.
  criteria:
  - id: coherent-timeline
    instruction: Describes the selected element's initial state, the event, and the resulting state in
      a coherent timeline.
  - id: er-blir-sequence
    instruction: Uses er for the initial state, blir for the transition, and er for the resulting state.
  - id: er-blir-sequence-observation
    instruction: 'Observation only: note the selected element and adjective choices; do not fail a natural
      equivalent.'
