- handle: distinguish_subject_invariance
  op: choose
  objective: obj-past-tense-01
  bloom: understand
  prompt_md: "Choose the version that tells about both actions in the past."
  derived_from:
  - section_id: one-form-every-subject
  stem_md: "Gardening yesterday: Liv planted tulip bulbs in the garden first. Later that afternoon, Kaja and Ali did the same."
  options:
  - id: group-present
    text: Liv plantet tulipanløk i går. Kaja og Ali planter samme type løk senere på ettermiddagen.
    correct: false
    why: Planter changes the second action to present even though the note places it yesterday.
  - id: same-past-form
    text: Liv plantet tulipanløk i går. Kaja og Ali plantet samme type løk senere på ettermiddagen.
    correct: true
    why: Plantet stays the same with Liv and with the plural subject Kaja og Ali.
  - id: reversed-time
    text: Liv planter tulipanløk i går. Kaja og Ali plantet samme type løk senere på ettermiddagen.
    correct: false
    why: Planter is present tense and does not fit the first action's stated time yesterday.
