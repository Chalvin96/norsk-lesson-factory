- handle: notice_known_past_time
  op: choose
  objective: obj-past-tense-01
  bloom: understand
  prompt_md: "Choose the meaning that fits the conversation."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Hva gjorde du i går?»
    - speaker: Jonas
      text_md: «Jeg gikk til byen og tok bussen hjem.»
  options:
  - id: present-routine
    text: «I går» beskriver en vanlig rutine, så «gikk» og «tok» uttrykker nåtid.
    correct: false
    why: A routine reading conflicts with the specific past expression «i går».
  - id: separate-events
    text: Bare «gjorde» hører til fortiden; verbene i svaret har ingen etablert tidsramme.
    correct: false
    why: The time frame established by the question also governs the answer.
  - id: shared-known-past
    text: «I går» etablerer en kjent fortid, og «gikk» og «tok» hører til den samme tidsrammen.
    correct: true
    why: The question establishes one shared past-time frame for the reply.
  derived_from:
  - section_id: checkpoint-notice-known-past-time
- handle: discriminate_present_preteritum
  op: choose
  objective: obj-past-tense-01
  bloom: understand
  prompt_md: "Choose the verb pair that fits both time frames."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kontekst
      text_md: Nå jobber Jonas hjemme hver mandag. I går ___ Maja ham klokka ni.
  options:
  - id: past-then-present
    text: jobbet — ringer
    correct: false
    why: This reverses the tense choices licensed by «hver mandag» and «i går».
  - id: both-present
    text: jobber — ringer
    correct: false
    why: The second form ignores the stated past time.
  - id: both-past
    text: jobbet — ringte
    correct: false
    why: The first form treats a current recurring routine as a finished past occasion.
  - id: present-then-past
    text: jobber — ringte
    correct: true
    why: The recurring present situation and the specific past event require different tenses.
  derived_from:
  - section_id: known-past-time
