- handle: maintain_preteritum_in_questions_and_negatives
  op: choose
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: "Maja wants to know whether Jonas took the train yesterday. Choose the negative yes/no question with «tok» and «ikke»."
  options:
  - id: past-negative
    text: Tok ikke Jonas toget i går?
    correct: true
    why: Tok is the preteritum form, and ikke makes this a negative question.
  - id: present-negative
    text: Tar ikke Jonas toget i går?
    correct: false
    why: Tar is present tense and conflicts with «i går».
  - id: past-positive
    text: Tok Jonas toget i går?
    correct: false
    why: This is a positive question, not a negative question.
  - id: past-statement
    text: Jonas tok ikke toget i går.
    correct: false
    why: This is a negative statement, not a question.
  derived_from:
  - section_id: checkpoint-maintain-preteritum-questions-negatives
- handle: discriminate_past_question
  op: choose
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: "Choose a natural question Maja can ask."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kontekst
      text_md: Kalenderen viser kino lørdag klokka sju. Maja vil vite om Jonas dro dit.
  options:
  - id: present-question
    text: Går du på kino på lørdag?
    correct: false
    why: This asks about a present or planned event rather than the completed Saturday event.
  - id: direct-past-question
    text: Gikk du på kino på lørdag?
    correct: true
    why: Norwegian places the complete past-tense verb before the subject.
  - id: english-helper
    text: Gjorde du gå på kino på lørdag?
    correct: false
    why: This imports an English-style past auxiliary before an infinitive.
  derived_from:
  - section_id: past-negatives-and-questions
- handle: choose_tense_from_time_frame
  op: choose
  objective: obj-past-tense-01
  bloom: understand
  prompt_md: "Choose the verb form that fits the conversation."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Hva gjorde du i går?»
    - speaker: Jonas
      text_md: «Jeg [BLANK] hjemme.»
  options:
  - id: present-form
    text: er
    correct: false
    why: Present tense conflicts with the time frame established by «i går».
  - id: past-form
    text: var
    correct: true
    why: The question places Jonas’s reply within yesterday’s known past time.
  derived_from:
  - section_id: checkpoint-choose-tense-time-frame
- handle: revise_past_message
  op: choose
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: "Choose the message where only the verb tenses have been corrected."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «I går jobber jeg til fire. Etterpå går jeg hjem og spiste middag.»
  options:
  - id: last-present
    text: I går jobbet jeg til fire. Etterpå gikk jeg hjem og spiser middag.
    correct: false
    why: The final event is incorrectly shifted into present tense.
  - id: changed-meaning
    text: I dag jobber jeg til fire. Etterpå går jeg hjem og spiser middag.
    correct: false
    why: This removes the errors by changing the message from yesterday to today.
  - id: all-past
    text: I går jobbet jeg til fire. Etterpå gikk jeg hjem og spiste middag.
    correct: true
    why: All three events belong to the same completed day.
  - id: first-only
    text: I går jobbet jeg til fire. Etterpå går jeg hjem og spiste middag.
    correct: false
    why: The second event remains in present tense despite the continuing past frame.
  derived_from:
  - section_id: choose-tense-time-frame
- handle: reconstruct_the_evening
  op: write
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: "To Eva: Tell her what Lea did yesterday afternoon. Write a message and include these points in order: wait for the train until four; buy coffee; meet the neighbor at the station; eat lunch together; walk to the bus stop; get home at seven."
  response_language: "no"
  min_words: 30
  max_words: 45
  judge_prompt: Report a verdict for each criterion id. Determine the overall pass from all criteria.
  criteria:
  - id: audience-purpose
    instruction: The response is a message to Eva that reports what happened during the afternoon.
  - id: supplied-facts
    instruction: The response includes all six supplied events without contradicting the facts.
  - id: event-order
    instruction: The six events appear in the supplied chronological order.
  - id: norwegian-message
    instruction: The message is intelligible Norwegian.
  - id: regular-forms
    instruction: The response reports the supplied train-waiting event with a natural preteritum form,
      for example «ventet»; accept equivalent natural past-tense wording.
  - id: weak-and-irregular-forms
    instruction: The response reports the supplied buying, meeting, eating, walking, and arriving events
      with natural preteritum forms, for example «kjøpte», «møtte», «spiste», «gikk», and «kom»; accept
      equivalent natural past-tense wording.
  - id: shared-past-frame
    instruction: The account maintains preteritum after the past time is established.
  derived_from:
  - section_id: practice-reconstruct-evening
- handle: report_yesterdays_journey
  op: write
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: "You arrived late for work yesterday. Write a connected message in Norwegian to a colleague and explain why you were late. Include these points in order: miss the bus at 7:10; ask a station worker about another route; take the train at eight; send your colleague a message; arrive at work at nine."
  explanation_md: Fortell om hendelsene som ble avsluttet i går, med naturlige norske formuleringer.
  derived_from:
  - section_id: practice-report-yesterdays-journey
  response_language: "no"
  min_words: 20
  max_words: 45
  judge_prompt: >-
    Judge whether the message explains the delayed journey using the supplied events, in a coherent order,
    with completed events expressed in appropriate Norwegian past forms. Accept natural paraphrases.
  criteria:
  - id: colleague-message
    instruction: Writes a connected message to a colleague explaining the late arrival yesterday.
  - id: supplied-events
    instruction: Includes missing the 07:10 bus, asking a station employee for another route, changing to the 08:00 train, sending a message to the colleague, and arriving at work at 9:00, in that order.
  - id: past-tense
    instruction: Expresses the completed events with appropriate Norwegian past-tense forms; accept natural alternatives for the verbs and phrasing.
