- handle: review_retrieve_common_irregular_preteritum
  op: choose
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: "Choose the sentence with the correct irregular past-tense forms."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kontekst
      text_md: 'I går: gå · ta · komme.'
  options:
  - id: present-forms
    text: I går går Mina til parken, tar en kaffe og kommer tilbake før middag.
    correct: false
    why: These present forms conflict with the past time «i går».
  - id: regular-ending
    text: I går gikkte Mina til parken, tokte en kaffe og komte tilbake før middag.
    correct: false
    why: Irregular verbs do not take the regular -te ending.
  - id: correct-irregular
    text: I går gikk Mina til parken, tok en kaffe og kom tilbake før middag.
    correct: true
    why: Gikk, tok, and kom are the correct irregular preteritum forms.
  derived_from:
  - section_id: retrieval-review-past-tense
