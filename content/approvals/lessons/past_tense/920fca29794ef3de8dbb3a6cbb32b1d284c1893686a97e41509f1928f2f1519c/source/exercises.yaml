- handle: review_form_regular_preteritum
  op: choose
  objective: obj-past-tense-01
  bloom: apply
  prompt_md: "Choose the sentence with the correct past-tense forms."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kontekst
      text_md: 'I går: snakke · kjøpe.'
  options:
  - id: infinitive-form
    text: I går snakket Sara med Maja, og de kjøpe billetter.
    correct: false
    why: The infinitive kjøpe is not a finite past form.
  - id: regular-past
    text: I går snakket Sara med Maja, og de kjøpte billetter.
    correct: true
    why: Regular preteritum adds -et or -te to these verb stems.
  - id: present-forms
    text: I går snakker Sara med Maja, og de kjøper billetter.
    correct: false
    why: Present tense conflicts with the past time «i går».
