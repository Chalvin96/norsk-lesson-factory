- handle: notice_known_past_time
  op: choose
  objective: obj-past-tense-01
  bloom: understand
  prompt_md: Choose the interpretation that fits the exchange.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Hva gjorde du i går?»
    - speaker: Jonas
      text_md: «Jeg gikk til byen og tok bussen hjem.»
  options:
  - id: present-routine
    text: «I går» beskriver en vanlig rutine, så «gikk» og «tok» uttrykker nåtid.
    correct: false
    why: A routine reading conflicts with the specific past expression «i går».
  - id: separate-events
    text: Bare «gjorde» hører til fortiden; verbene i svaret har ingen etablert tidsramme.
    correct: false
    why: The time frame established by the question also governs the answer.
  - id: shared-known-past
    text: «I går» etablerer en kjent fortid, og «gikk» og «tok» hører til den samme tidsrammen.
    correct: true
    why: The question establishes one shared past-time frame for the reply.
