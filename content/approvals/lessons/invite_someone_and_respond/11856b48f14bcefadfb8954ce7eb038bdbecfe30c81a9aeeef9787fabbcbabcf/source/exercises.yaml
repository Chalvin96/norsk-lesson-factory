- handle: complete_social_exchange
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: extended-practice-complete-a-social-exchange
  prompt_md: "Sara suggests lunch on Friday at 12. Emil is working then and suggests Saturday at 1 p.m. Sara is free then. Write a message exchange where they arrange lunch."
  response_language: "no"
  min_words: 20
  max_words: 50
  judge_prompt: 'Evaluate criteria named-participants, activity-clear, original-time-problem,
    alternative-clear, final-confirmation, and invitation-form. Pass only when all
    six are met. Valid variant that must pass: «Sara: Har du lyst til å spise lunsj
    fredag klokka tolv? Emil: Beklager, jeg jobber da. Hva med lørdag klokka ett?
    Sara: Ja, det passer bra!» Near-miss that must fail final-confirmation: the exchange
    ends immediately after Emil proposes Saturday. «Vil du å spise lunsj?» must fail
    invitation-form because the taught invitation construction is malformed. Other
    minor errors may be noted diagnostically.'
  criteria:
  - id: named-participants
    instruction: Presents the exchange as messages between Sara and Emil.
  - id: activity-clear
    instruction: Invites Emil to lunch.
  - id: original-time-problem
    instruction: States that Friday at 12.00 does not work because Emil is
      working.
  - id: alternative-clear
    instruction: Offers Saturday at 13.00.
  - id: final-confirmation
    instruction: Shows Sara accepting or confirming the alternative.
  - id: invitation-form
    instruction: Sara's invitation uses a grammatical Norwegian invitation
      construction, such as «Har du lyst til å ...?» or «Vil du ...?» without an
      extra «å» after «vil du».
  - id: invitation-form-observation
    instruction: 'Observation only: diagnostically note minor wording errors outside
      the taught invitation construction; never fail a natural invitation variant.'
- handle: accept_immediately
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: extended-practice-complete-a-social-exchange
  prompt_md: "Sara invites Emil to lunch on Friday at 12. Emil can go, but asks where they will meet. Sara chooses Kafé Sol. Write a message exchange: Sara invites him, Emil accepts and asks where, and Sara confirms the place."
  response_language: "no"
  min_words: 20
  max_words: 40
  judge_prompt: 'Evaluate criteria revised-exchange, immediate-acceptance, warm-tone,
    practical-detail, and invitation-form. Pass only when all five are met. Valid
    variant that must pass: «Sara: Har du lyst til å spise lunsj fredag klokka tolv?
    Emil: Ja, gjerne! Hvor skal vi møtes? Sara: På Kafé Sol.» Near-miss that must
    fail practical-detail: Emil accepts but neither person settles where to meet.
    «Vil du å spise lunsj?» must fail invitation-form; report unrelated minor language
    errors only under language-form-observation.'
  criteria:
  - id: revised-exchange
    instruction: Writes a Sara–Emil lunch exchange for Friday at 12.00.
  - id: immediate-acceptance
    instruction: Emil accepts the Friday invitation without declining or
      proposing Saturday.
  - id: warm-tone
    instruction: Expresses a warm, willing response.
  - id: practical-detail
    instruction: Emil asks where to meet, and Sara names Kafé Sol.
  - id: invitation-form
    instruction: Sara's invitation uses a grammatical Norwegian invitation
      construction, allowing natural variants but rejecting «Vil du å ...?».
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if
      present; this criterion never causes failure.'
