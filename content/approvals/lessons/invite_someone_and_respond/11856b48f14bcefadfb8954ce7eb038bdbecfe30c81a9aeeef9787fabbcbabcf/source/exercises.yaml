- handle: respond_warmly
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: checkpoint-respond-warmly
  prompt_md: 'Lea asks: «Har du lyst til å ta en kaffe på lørdag?» You would like to go, but do not know when or where. Reply warmly and ask when or where you will meet.'
  response_language: "no"
  min_words: 4
  max_words: 20
  judge_prompt: 'Evaluate criteria clear-acceptance and meeting-question. Pass only
    when both are met. Valid variant that must pass: «Ja, gjerne! Når passer det?»
    Near-miss that must fail meeting-question: «Ja, gjerne!» A warm, understandable
    message with a minor form error must pass the gating criteria; report the error
    only under language-form-observation.'
  criteria:
  - id: clear-acceptance
    instruction: Clearly accepts Lea's invitation.
  - id: meeting-question
    instruction: Asks when or where they should meet.
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if
      present; this criterion never causes failure.'
- handle: decline_and_offer_saturday
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: checkpoint-decline-and-keep-plan-open
  prompt_md: 'Nora asks: «Vil du bli med på kino på fredag?» You cannot go on Friday, but Saturday works. Reply politely and suggest Saturday.'
  response_language: "no"
  min_words: 4
  max_words: 20
  judge_prompt: 'Evaluate criteria courteous-refusal and saturday-alternative. Pass
    only when both are met. Valid variant that must pass: «Beklager, jeg kan ikke
    på fredag. Hva med lørdag?» Near-miss that must fail saturday-alternative: «Beklager,
    jeg kan ikke på fredag.» A courteous message that communicates both facts but
    contains a minor form error must pass the gating criteria; report the error only
    under language-form-observation.'
  criteria:
  - id: courteous-refusal
    instruction: Clearly and courteously declines Friday.
  - id: saturday-alternative
    instruction: Offers Saturday as the replacement.
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if
      present; this criterion never causes failure.'
- handle: propose_seven
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: checkpoint-decline-and-keep-plan-open
  prompt_md: 'Ali asks: «Skal vi møtes klokka seks?» Six does not work, but seven does. Let him know and suggest seven with «Hva med …?» or «men».'
  response_language: "no"
  min_words: 4
  max_words: 20
  judge_prompt: 'Evaluate criteria six-does-not-work and seven-proposal. Pass only
    when both are met. Valid variant that must pass: «Klokka seks passer ikke. Hva
    med klokka sju?» Near-miss that must fail seven-proposal: «Klokka seks passer
    ikke.» A clear message with a minor form error must pass the gating criteria;
    report the error only under language-form-observation.'
  criteria:
  - id: six-does-not-work
    instruction: Makes clear that six does not work.
  - id: seven-proposal
    instruction: Proposes seven using «Hva med …?» or a construction with «men».
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if
      present; this criterion never causes failure.'
