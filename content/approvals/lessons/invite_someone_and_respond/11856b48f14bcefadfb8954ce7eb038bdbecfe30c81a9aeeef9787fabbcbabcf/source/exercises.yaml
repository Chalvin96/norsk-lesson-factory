- handle: combine_two_exchanges
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: retrieval-and-review
  prompt_md: "Eva invites Per for coffee on Tuesday. Per accepts and asks where they will meet. Lise suggests a walk at 5 p.m., but Kim cannot then and suggests 6 p.m. Lise accepts. Write both message exchanges."
  response_language: "no"
  min_words: 20
  max_words: 50
  judge_prompt: Evaluate criteria accepted-exchange, declined-exchange,
    proposed-time, and clear-plans. Pass only when all four are met. Valid
    variants may use any natural invitation, acceptance, courteous refusal, and
    confirmation wording that preserves the supplied facts. A response must fail
    the relevant criterion if Per does not accept or if Kim does not replace
    17.00 with 18.00. Complete, understandable exchanges with a minor form error
    must pass the gating criteria; report the error only under
    language-form-observation.
  criteria:
  - id: accepted-exchange
    instruction: Shows Per accepting coffee on Tuesday and asking where.
  - id: declined-exchange
    instruction: Shows Kim declining the suggested time of 17.00.
  - id: proposed-time
    instruction: Shows Kim proposing 18.00 and Lise accepting it.
  - id: clear-plans
    instruction: Communicates the people, activities, and resulting plans
      clearly.
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if
      present; this criterion never causes failure.'
