- handle: respond_warmly
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: checkpoint-respond-warmly
  prompt_md: 'Lea: «Har du lyst til å ta en kaffe på lørdag?» You want to go, but the time and place are
    unknown. Reply to Lea with a warm acceptance and ask when or where to meet.'
  response_language: 'no'
  min_words: 4
  max_words: 20
  judge_prompt: 'Evaluate criteria clear-acceptance and meeting-question. Pass only when both are met.
    Valid variant that must pass: «Ja, gjerne! Når passer det?» Near-miss that must fail meeting-question:
    «Ja, gjerne!» A warm, understandable message with a minor form error must pass the gating criteria;
    report the error only under language-form-observation.'
  criteria:
  - id: clear-acceptance
    instruction: Clearly accepts Lea's invitation.
  - id: meeting-question
    instruction: Asks when or where they should meet.
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if present; this criterion
      never causes failure.'
- handle: decline_and_offer_saturday
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: checkpoint-decline-and-keep-plan-open
  prompt_md: 'Nora: «Vil du bli med på kino på fredag?» Your calendar: Friday — unavailable; Saturday
    — available. Reply to Nora courteously and offer Saturday.'
  response_language: 'no'
  min_words: 4
  max_words: 20
  judge_prompt: 'Evaluate criteria courteous-refusal and saturday-alternative. Pass only when both are
    met. Valid variant that must pass: «Beklager, jeg kan ikke på fredag. Hva med lørdag?» Near-miss that
    must fail saturday-alternative: «Beklager, jeg kan ikke på fredag.» A courteous message that communicates
    both facts but contains a minor form error must pass the gating criteria; report the error only under
    language-form-observation.'
  criteria:
  - id: courteous-refusal
    instruction: Clearly and courteously declines Friday.
  - id: saturday-alternative
    instruction: Offers Saturday as the replacement.
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if present; this criterion
      never causes failure.'
- handle: propose_seven
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: checkpoint-decline-and-keep-plan-open
  prompt_md: 'Ali: «Skal vi møtes klokka seks?» Your calendar: 18.00 — unavailable; 19.00 — available.
    Reply that six does not work and propose seven with «Hva med …?» or «men».'
  response_language: 'no'
  min_words: 4
  max_words: 20
  judge_prompt: 'Evaluate criteria six-does-not-work and seven-proposal. Pass only when both are met.
    Valid variant that must pass: «Klokka seks passer ikke. Hva med klokka sju?» Near-miss that must fail
    seven-proposal: «Klokka seks passer ikke.» A clear message with a minor form error must pass the gating
    criteria; report the error only under language-form-observation.'
  criteria:
  - id: six-does-not-work
    instruction: Makes clear that six does not work.
  - id: seven-proposal
    instruction: Proposes seven using «Hva med …?» or a construction with «men».
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if present; this criterion
      never causes failure.'
- handle: repair_the_exchange
  op: find_fix
  objective: obj-invite-someone-and-respond-01
  bloom: analyze
  stimulus: []
  prompt_md: Select the one token that must be removed from Mina's invitation.
  derived_from:
  - section_id: checkpoint-repair-the-exchange
  explanation_md: 'After «vil du», use the infinitive directly: «Vil du gå på kino i kveld?»'
  tokens:
  - token_id: tok-vil
    text: Vil
  - token_id: tok-du
    text: du
  - token_id: tok-a
    text: å
  - token_id: tok-ga
    text: gå
  - token_id: tok-pa
    text: på
  - token_id: tok-kino
    text: kino
  - token_id: tok-i
    text: i
  - token_id: tok-kveld
    text: kveld?
  error_token_id: tok-a
  feedback: 'Remove «å» after «Vil du». The corrected invitation is: «Vil du gå på kino i kveld?»'
- handle: complete_social_exchange
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: extended-practice-complete-a-social-exchange
  prompt_md: 'Facts: People: Sara and Emil. Activity: lunch. First suggestion: Friday at 12.00. Emil''s
    reason: he is working. Emil''s alternative: Saturday at 13.00. Sara can accept the alternative. Write
    their 20–50-word message exchange to arrange the lunch.'
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: 'Evaluate criteria named-participants, activity-clear, original-time-problem, alternative-clear,
    and final-confirmation. Pass only when all five are met. Valid variant that must pass: «Sara: Har
    du lyst til å spise lunsj fredag klokka tolv? Emil: Beklager, jeg jobber da. Hva med lørdag klokka
    ett? Sara: Ja, det passer bra!» Near-miss that must fail final-confirmation: the exchange ends immediately
    after Emil proposes Saturday. A complete, understandable exchange with an invitation-form error must
    pass the gating criteria; report the error only under invitation-form-observation.'
  criteria:
  - id: named-participants
    instruction: Presents the exchange as messages between Sara and Emil.
  - id: activity-clear
    instruction: Invites Emil to lunch.
  - id: original-time-problem
    instruction: States that Friday at 12.00 does not work because Emil is working.
  - id: alternative-clear
    instruction: Offers Saturday at 13.00.
  - id: final-confirmation
    instruction: Shows Sara accepting or confirming the alternative.
  - id: invitation-form-observation
    instruction: 'Observation only: diagnostically note an invitation-form error, if present; this criterion
      never causes failure.'
- handle: accept_immediately
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: extended-practice-complete-a-social-exchange
  prompt_md: 'Omar: «Har du lyst til å spise lunsj på Kafé Sol på lørdag?» You want to go, but Omar has
    not given a time. Reply warmly and ask what time to meet.'
  response_language: 'no'
  min_words: 4
  max_words: 20
  judge_prompt: 'Evaluate criteria immediate-acceptance, warm-tone, and practical-detail. Pass only when
    all three are met. Valid variant that must pass: «Ja, gjerne! Når skal vi møtes?» Near-miss that must
    fail practical-detail: «Ja, gjerne!» A warm, understandable response with a minor form error must
    pass the gating criteria; report the error only under language-form-observation.'
  criteria:
  - id: immediate-acceptance
    instruction: Clearly accepts the lunch invitation.
  - id: warm-tone
    instruction: Expresses a warm, willing response.
  - id: practical-detail
    instruction: Asks what time they should meet.
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if present; this criterion
      never causes failure.'
- handle: retrieve_core_responses
  op: recall_fill
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  stimulus: []
  prompt_md: Complete each response with the form that matches its purpose.
  explanation_md: The four completions respectively form an invitation, a warm acceptance, a courteous
    decline, and a specific alternative.
  derived_from:
  - section_id: retrieval-and-review
  audio_target: Har du lyst til å gå på kino? Ja, det vil jeg gjerne. Takk for invitasjonen, men jeg kan
    ikke. Jeg kan ikke på fredag. Hva med lørdag?
  segments:
  - text_md: 'Har du lyst '
  - blank_id: invitation-connector
    options:
    - til å
    - å til
    answer_index: 0
  - text_md: ' gå på kino? 2. Ja, det '
  - blank_id: warm-acceptance
    options:
    - vil jeg gjerne
    - kan jeg ikke
    answer_index: 0
  - text_md: '. 3. Takk for invitasjonen, men jeg '
  - blank_id: courteous-decline
    options:
    - vil gjerne
    - kan ikke
    answer_index: 1
  - text_md: '. 4. Jeg kan ikke på fredag. Hva med '
  - blank_id: alternative-day
    options:
    - søndag
    - lørdag
    answer_index: 1
  - text_md: '?'
- handle: combine_two_exchanges
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: retrieval-and-review
  prompt_md: 'Exchange 1 facts: Eva invites Per to coffee on Tuesday; Per accepts and asks where. Exchange
    2 facts: Lise suggests a walk at 17.00; Kim cannot meet then but proposes 18.00; Lise accepts. Write
    both message exchanges in 20–50 words total.'
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Evaluate criteria accepted-exchange, declined-exchange, proposed-time, and clear-plans.
    Pass only when all four are met. Valid variants may use any natural invitation, acceptance, courteous
    refusal, and confirmation wording that preserves the supplied facts. A response must fail the relevant
    criterion if Per does not accept or if Kim does not replace 17.00 with 18.00. Complete, understandable
    exchanges with a minor form error must pass the gating criteria; report the error only under language-form-observation.
  criteria:
  - id: accepted-exchange
    instruction: Shows Per accepting coffee on Tuesday and asking where.
  - id: declined-exchange
    instruction: Shows Kim declining the suggested time of 17.00.
  - id: proposed-time
    instruction: Shows Kim proposing 18.00 and Lise accepting it.
  - id: clear-plans
    instruction: Communicates the people, activities, and resulting plans clearly.
  - id: language-form-observation
    instruction: 'Observation only: diagnostically note a Norwegian form error, if present; this criterion
      never causes failure.'
- handle: review_invitation_connector
  op: write
  objective: obj-invite-someone-and-respond-01
  bloom: apply
  derived_from:
  - section_id: retrieval-and-review
  prompt_md: 'Fullfør invitasjonen med riktig ord: «Har du lyst til ___ komme på besøk?» Skriv det manglende
    ordet.'
  response_language: 'no'
  min_words: 1
  max_words: 1
  judge_prompt: Vurder invitasjonsordet. Godkjenn bare hvis svaret er nøyaktig «å», som kreves før infinitiven
    «komme».
  criteria:
  - id: invitation-connector
    instruction: Skriver «å» i mellomrommet før «komme».
