- handle: omit_irrelevant_agent
  op: write
  objective: obj-passive-bli-and-s-02
  bloom: apply
  prompt_md: "Skriv en offentlig beskjed på 20–40 ord til bibliotekets besøkende. Fortell at bord ryddes etter bruk, at det nye skiltet henges opp i kveld, og at bibliotekar Nora møter skoleklassen ved inngangen klokka fem. Utelat de ansatte i de to første opplysningene, men ta med Nora som kontaktperson."
  response_language: 'no'
  min_words: 20
  max_words: 40
  judge_prompt: Vurder svaret etter kriteriene public-facts, contact-named, agent-omission, word-bound
    og passive-choice-observation. Registrer observasjonen diagnostisk.
  criteria:
  - id: public-facts
    instruction: Beskjeden bevarer rutinen med bordene og kveldens skiltoppsetting.
  - id: contact-named
    instruction: Beskjeden navngir Nora som kontakt for skoleklassen ved inngangen klokka fem.
  - id: agent-omission
    instruction: Beskjeden utelater renholderen og teknikeren i de to første punktene.
  - id: word-bound
    instruction: Beskjeden inneholder 20–40 ord.
  - id: passive-choice-observation
    instruction: 'Observation only: registrer diagnostisk om rutinen uttrykkes med s-passiv og kveldshendelsen
      med bli-passiv.'
  explanation_md: En offentlig beskjed kan utelate ukjente eller irrelevante arbeidere, men bør beholde
    navnet når mottakeren trenger det.
  derived_from:
  - section_id: checkpoint-omit-irrelevant-agent
- handle: discriminate_passive_response
  op: choose
  objective: obj-passive-bli-and-s-01
  bloom: analyze
  prompt_md: Velg svaret som passer begge situasjonene.
  stem_md: 'Kunde: «Hvordan leverer jeg lånte bøker når hoveddøra er stengt?» Leder: «Er reparasjonen
    av luka ferdig? Den sto på planen for i går.»'
  options:
  - id: time-mismatch
    text: «Bøkene blir levert i luka i går.» / «Ja, luka repareres hver kveld.»
    correct: false
    why: Tidsformene gjør kundens prosedyre til en avsluttet handling og gårsdagens reparasjon til en
      rutine.
  - id: procedure-then-report
    text: «Bøkene leveres i luka.» / «Ja, luka ble reparert i går.»
    correct: true
    why: Første svar gir en generell prosedyre; andre rapporterer én avsluttet hendelse.
  - id: wrong-second
    text: «Bøkene legges i luka.» / «Ja, luka repareres i går.»
    correct: false
    why: S-passiven «repareres» kan ikke beskrive én fullført reparasjon i går.
  derived_from:
  - section_id: checkpoint-choose-passive-pattern
- handle: revise_library_reopening_notice
  op: write
  objective: obj-passive-bli-and-s-01
  bloom: analyze
  prompt_md: "Rett Marius’ beskjed og skriv den på nytt for bibliotekets besøkende. «Bøkene blir leveres i luka. Luka blir tømt hver kveld. Det nye skiltet henges opp hver kveld. Døra ble repareres på fredag.» Lånerne leverer bøker i luka hver kveld mens hoveddøra er stengt. Ansatte tømmer luka hver kveld. Det nye skiltet skal opp én gang i kveld, og en vaktmester reparerte døra på fredag. Bruk naturlige passivformer og skill mellom den faste kveldsrutinen og enkelthendelsene. Skriv 20–45 ord."
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Vurder svaret etter kriteriene passive-contrast, content-preserved, errors-repaired og word-bound.
  criteria:
  - id: passive-contrast
    instruction: Uses a natural s-passive for a recurring routine and a natural bli-passive for at least one particular event, as requested.
  - id: content-preserved
    instruction: Den rettede beskjeden bevarer de fire oppgitte faktaene og skiller den faste kveldsrutinen
      fra skiltoppsettingen som skjer én gang i kveld.
  - id: errors-repaired
    instruction: «Bøkene blir leveres» er rettet til en naturlig passivform for bokleveringen, «ble repareres» er rettet til «ble reparert», og ingen dobbel passiv står igjen.
  - id: word-bound
    instruction: Beskjeden inneholder 20–45 ord.
  explanation_md: Bli-passiv bruker partisipp etter «blir» eller «ble», mens s-passiv passer en fast rutine. Tidsuttrykkene må fortsatt skille rutiner fra enkelthendelser.
  derived_from:
  - section_id: checkpoint-revise-library-reopening-notice
