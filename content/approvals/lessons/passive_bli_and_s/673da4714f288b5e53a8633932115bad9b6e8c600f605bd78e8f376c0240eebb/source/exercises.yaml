  - id: routine-s-event-bli
    text: Luka tømmes hver kveld, og det nye skiltet blir hengt opp i kveld.
    correct: true
    why: Den faste rutinen uttrykkes kort med s-passiv, mens kveldens bestemte hendelse uttrykkes med
