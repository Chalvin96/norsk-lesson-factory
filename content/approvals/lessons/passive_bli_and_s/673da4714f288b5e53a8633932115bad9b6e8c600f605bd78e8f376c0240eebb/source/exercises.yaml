  objective: obj-passive-bli-and-s-01
  bloom: analyze
  prompt_md: Velg svaret som passer begge situasjonene.
  stem_md: 'Kunde: «Hvordan leverer jeg lånte bøker når hoveddøra er stengt?» Leder: «Er reparasjonen
    av luka ferdig? Den sto på planen for i går.»'
  options:
  - id: time-mismatch
    text: «Bøkene blir levert i luka i går.» / «Ja, luka repareres hver kveld.»
    correct: false
    why: Tidsformene gjør kundens prosedyre til en avsluttet handling og gårsdagens reparasjon til en
      rutine.
  - id: procedure-then-report
    text: «Bøkene leveres i luka.» / «Ja, luka ble reparert i går.»
    correct: true
    why: Første svar gir en generell prosedyre; andre rapporterer én avsluttet hendelse.
  - id: wrong-second
    text: «Bøkene legges i luka.» / «Ja, luka repareres i går.»
    correct: false
    why: S-passiven «repareres» kan ikke beskrive én fullført reparasjon i går.
  derived_from:
  - section_id: checkpoint-choose-passive-pattern
- handle: revise_library_reopening_notice
  op: write
  objective: obj-passive-bli-and-s-01
  bloom: analyze
  prompt_md: 'Mottaker: bibliotekets besøkende. Formål: rette og publisere Marius sin beskjed. Utkast:
    «Bøkene blir leveres i luka. Luka blir tømt hver kveld. Det nye skiltet henges opp hver kveld. Døra
    ble repareres på fredag.» Utkastet har to dobbel passiv-feil som skal rettes. Behold «blir» i setningen
    om levering, og rett verbformen etter «blir». Fakta: Lånerne leverer bøker i luka mens hoveddøra er
    stengt; Ansatte tømmer luka hver kveld; Det nye skiltet skal opp én gang i kveld; En vaktmester reparerte
    døra på fredag. Skriv en rettet beskjed på 20–45 ord.'
  response_language: 'no'
  min_words: 20
  max_words: 45
  judge_prompt: Vurder svaret etter kriteriene content-preserved, errors-repaired og word-bound.
  criteria:
  - id: content-preserved
    instruction: Den rettede beskjeden bevarer de fire oppgitte faktaene og skiller den faste kveldsrutinen
      fra skiltoppsettingen som skjer én gang i kveld.
  - id: errors-repaired
    instruction: Formene «blir leveres» og «ble repareres» er rettet til partisipp etter «blir» og «ble»,
      og ingen dobbel passiv står igjen.
  - id: word-bound
    instruction: Beskjeden inneholder 20–45 ord.
  explanation_md: Etter «blir» og «ble» brukes partisipp, ikke s-passiv. Tidsuttrykkene må fortsatt vise
    hvilke handlinger er rutiner og hvilke er enkelthendelser.
  derived_from:
  - section_id: checkpoint-revise-library-reopening-notice
