- handle: cabin_trip_message_building
  op: write
  objective: obj-possessive-pronouns-01
  bloom: apply
  prompt_md: 'You are Mina. Send Jonas a 15–35-word Norwegian packing message so he can find everything,
    using possessives that agree with their nouns. Facts: Mina''s bag is by the door; Jonas''s card is
    on the table; their shared clothes are in the car.'
  explanation_md: A successful message communicates the three locations clearly. It must also use matching
    possessives so ownership is expressed with correct Norwegian agreement.
  derived_from:
  - section_id: cumulative-transfer-packing-for-a-cabin-trip
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: 'Report verdicts for bag-location, card-location, clothes-location, word-bound, and possessive-agreement.
    All five criteria are gating. Anchor that must pass: "Hei Jonas! Veska mi står ved døra, kortet ditt
    ligger på bordet, og klærne våre er i bilen." Near-miss that must fail card-location: "Hei Jonas!
    Veska mi står ved døra, og klærne våre er i bilen." Form-error message that must fail possessive-agreement:
    "Hei Jonas! Veska min står ved døra, kortet ditt ligger på bordet, og klærne våre er i bilen."'
  criteria:
  - id: bag-location
    instruction: States that Mina's bag is by the door.
  - id: card-location
    instruction: States that Jonas's card is on the table.
  - id: clothes-location
    instruction: States that the clothes shared by Mina and Jonas are in the car.
  - id: word-bound
    instruction: Contains 15–35 words.
  - id: possessive-agreement
    instruction: Uses Norwegian possessives that agree with their nouns.
