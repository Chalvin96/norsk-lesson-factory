- handle: notice_presentational_frames
  op: choose
  objective: obj-presentational-det-with-delayed-subjects-01
  bloom: understand
  prompt_md: Choose the best description of the three det-sentences.
  stem_md: 'Maja: «Det står en varebil utenfor nå. Det kommer et bud opp trappa også. Det ligger en ny
    pakke ved døra.»'
  options:
  - id: place-only
    text: The det in each sentence refers to a place, and no participant is introduced.
    correct: false
    why: The place phrases utenfor, opp trappa and ved døra are adverbials; the participants are the noun
      phrases after the verb.
  - id: indefinite-presentation
    text: Each det-sentence has an indefinite noun phrase after the verb, so it presents a participant
      for the first time.
    correct: true
    why: The noun phrases after det are en varebil, et bud and en ny pakke, all indefinite forms.
  - id: definite-reference
    text: Each det-sentence has a definite noun phrase after the verb, so it points back to a participant
      already mentioned.
    correct: false
    why: Definite forms such as varebilen or budet do not follow det in this dialogue.
  derived_from:
  - section_id: checkpoint-noticing-presentation
- handle: choose_new_participant_presentation
  op: categorize
  objective: obj-presentational-det-with-delayed-subjects-01
  bloom: analyze
  prompt_md: Sort each Norwegian sentence by information status.
  explanation_md: Presentational det introduces a new indefinite participant; a familiar participant can
    be the ordinary subject.
  derived_from:
  - section_id: checkpoint-choosing-message-shape
  buckets:
  - bucket_id: new-participant
    label: New participant
  - bucket_id: familiar-participant
    label: Familiar participant
  items:
  - item_id: det-van
    text: «Det står en varebil utenfor.»
    bucket_id: new-participant
  - item_id: def-van
    text: «Varebilen står utenfor.»
    bucket_id: familiar-participant
  - item_id: det-courier
    text: «Det kommer et bud opp trappa.»
    bucket_id: new-participant
  - item_id: def-courier
    text: «Budet kommer opp trappa.»
    bucket_id: familiar-participant
