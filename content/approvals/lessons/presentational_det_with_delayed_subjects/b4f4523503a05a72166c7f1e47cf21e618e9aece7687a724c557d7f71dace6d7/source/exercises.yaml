- handle: repair_presentational_sentences
  op: find_fix
  objective: obj-presentational-det-with-delayed-subjects-01
  bloom: analyze
  prompt_md: "Find the word that needs to be changed."
  derived_from:
  - section_id: checkpoint-repairing-errors
  stem_md: 'Jonas has not heard about this before. Maja says: «Det kommer budet opp trappa også.»'
  tokens:
  - token_id: repair-det
    text: Det
  - token_id: repair-verb
    text: kommer
  - token_id: repair-subject
    text: budet
  - token_id: repair-place
    text: opp
  - token_id: repair-stairs
    text: trappa
  - token_id: repair-also
    text: også.
  error_token_id: repair-subject
  feedback: A first mention needs the indefinite phrase et bud, not the definite form budet.
