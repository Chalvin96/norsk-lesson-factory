  stem_md: Lea har kjøpt togbillett og bestemt avreisetiden. Amir vurderer flere
    aktiviteter; en tur langs sjøen virker hyggelig.
  options:
  - id: inclined-then-decided
    text: «Jeg har lyst til å reise klokka ni.» 2. «Jeg vil gå en tur langs
      sjøen.»
    correct: false
    why: Dette bytter om den bestemte planen og den åpne tilbøyeligheten.
  - id: both-decided
    text: «Jeg vil reise klokka ni.» 2. «Jeg vil gå en tur langs sjøen.»
    correct: false
    why: Den andre situasjonen sier bare at turen virker hyggelig; den er ikke
      valgt.
  - id: both-inclined
    text: «Jeg har lyst til å reise klokka ni.» 2. «Jeg har lyst til å gå en tur
      langs sjøen.»
    correct: false
    why: Den første situasjonen inneholder en gjennomført beslutning, ikke bare
      en aktivitet som frister.
  - id: decided-then-inclined
    text: «Jeg vil reise klokka ni.» 2. «Jeg har lyst til å gå en tur langs
      sjøen.»
    correct: true
    why: Den første situasjonen presenterer en fast intensjon, mens den andre
      presenterer en aktivitet som frister.
