    intensjon eller som en tilbøyelighet.
- handle: review_vil_ha_or_lyst_pa
  op: choose
  objective: obj-uttrykke-onske-med-vil-og-ha-lyst-til-01
  bloom: analyze
  prompt_md: "Velg tolkningen som best viser hva hver person legger vekt på."
  explanation_md: Begge uttrykkene kan brukes om noe man ønsker seg. Vil ha kan
    uttrykke et direkte valg, mens har lyst på kan vise at noe virker fristende.
    Sammenhengen gjør forskjellen tydelig uten at det andre uttrykket blir feil.
  derived_from:
  - section_id: retrieval-and-review
  stem_md: 'Kunden peker på en bestemt sekk og sier: «Jeg vil ha akkurat denne.» En
    venn sier: «Jeg har lyst på en grønn sekk.»'
  options:
  - id: correct
    text: Den første ytringen er et direkte valg av en bestemt ting; den andre
      sier at en slik ting frister.
    correct: true
    why: «Akkurat denne» viser et direkte valg; den andre setningen uttrykker at
      en type sekk frister.
  - id: reversed-emphasis
    text: Den første sier bare at tingen frister; den andre er et direkte valg
      av én bestemt ting.
    correct: false
    why: Dette snur om på betydningen av «akkurat denne» og beskrivelsen av en
      grønn sekk.
  - id: both-commitments
    text: Begge setningene uttrykker like tydelig at personen har bestemt seg
      for å kjøpe tingen.
    correct: false
    why: Den andre setningen uttrykker en tilbøyelighet uten å velge én bestemt
      sekk.
  - id: both-appeal
    text: Begge setningene sier bare at en type ting virker fristende.
    correct: false
    why: Den første setningen viser til en bestemt sekk og uttrykker et direkte
      valg.
