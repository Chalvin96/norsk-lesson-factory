  bloom: apply
  prompt_md: '**Melding fra Nora til gruppa** «Det regner. Museet er åpent til klokka
    17, banen går hvert kvarter, og kafeen ved museet har varm suppe. Hva gjør vi?»
    Svar vennene. Bruk minst to relevante opplysninger fra meldingen.
