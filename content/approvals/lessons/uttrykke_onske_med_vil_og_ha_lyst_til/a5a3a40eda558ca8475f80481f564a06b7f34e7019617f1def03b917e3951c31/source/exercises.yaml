  explanation_md: Skillet mellom en bestemt plan og en fristende aktivitet
    hjelper vennene å forstå hva du foreslår.
  derived_from:
  - section_id: guided-practice-changing-plans
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: "Vurder reply-purpose, supplied-facts, norwegian, vil-plan og lyst-activity som bindende. Rapporter lyst-thing-observation diagnostisk; det kan ikke føre til underkjenning."
  criteria:
  - id: reply-purpose
    instruction: Svarer Nora og foreslår hva gruppa kan gjøre i regnet.
  - id: supplied-facts
    instruction: Bruker minst to relevante opplysninger fra meldingen.
  - id: norwegian
    instruction: Meldingen er skrevet på forståelig norsk.
  - id: vil-plan
    instruction: Bruker vil fulgt direkte av infinitiv om én bestemt plan.
  - id: lyst-activity
    instruction: Bruker har lyst til å fulgt av infinitiv om én aktivitet som
      frister.
  - id: lyst-thing-observation
    instruction: 'Observation only: Registrer om meldingen bruker har lyst på naturlig
      om mat, drikke eller en ting; dette skal ikke føre til underkjenning.'
