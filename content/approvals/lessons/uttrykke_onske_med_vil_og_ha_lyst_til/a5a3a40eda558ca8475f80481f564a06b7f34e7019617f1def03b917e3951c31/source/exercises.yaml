- handle: interpret_speakers_perspective
  op: choose
  objective: obj-uttrykke-onske-med-vil-og-ha-lyst-til-01
  bloom: understand
  prompt_md: Velg tolkningen som passer til de to replikkene.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sara
      text_md: «Jeg vil lage middag etter konserten.»
    - speaker: Mia
      text_md: «Så koselig! Skal du handle først?»
    - speaker: Sara
      text_md: «Nei, jeg kjøpte alt i går.»
    - speaker: Mia
      text_md: «Jeg har lyst til å bli med på konserten, men jeg vet ikke om jeg
        får tid.»
  derived_from:
  - section_id: checkpoint-interpret-speakers-perspective
  options:
  - id: inclination-then-direct
    text: "Sara virker bare fristet av middag, mens Mia allerede har bestemt seg for
      konserten."
    correct: false
    why: Denne tolkningen bytter om hva vil og har lyst til å uttrykker i de to
      replikkene.
  - id: both-direct
    text: "Både Sara og Mia forteller om planer de allerede har bestemt seg for."
    correct: false
    why: Har lyst til å uttrykker noe som frister, ikke en avgjørelse som er
      tatt.
  - id: both-inclination
    text: "Både Sara og Mia beskriver bare noe som frister, uten noen bestemt plan."
    correct: false
    why: Vil presenterer et direkte ønske eller en plan, slik den første
      replikken gjør.
  - id: direct-then-inclination
    text: "Sara uttrykker en bestemt middagsplan; Mia nevner en konsert som frister,
      men er usikker."
    correct: true
    why: Vil står med infinitiv og uttrykker et direkte ønske eller en plan,
      mens har lyst til å uttrykker at aktiviteten frister uten å være bestemt.
  explanation_md: Vil presenterer et direkte ønske eller en intensjon. Har lyst
    til å presenterer en aktivitet som frister.
