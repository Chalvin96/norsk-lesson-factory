  stem_md: Lea har kjøpt togbillett og bestemt avreisetiden. 2. Amir vurderer flere aktiviteter; en tur langs sjøen virker hyggelig.
  options:
  - id: inclined-then-decided
    text: «Jeg har lyst til å reise klokka ni.» 2. «Jeg vil gå en tur langs sjøen.»
    correct: false
    why: Dette bytter om den bestemte planen og den åpne tilbøyeligheten.
