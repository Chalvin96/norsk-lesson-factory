- handle: review_vil_ha_or_lyst_pa
  op: choose
  objective: obj-uttrykke-onske-med-vil-og-ha-lyst-til-01
  bloom: analyze
  prompt_md: Choose the interpretation that best captures what each speaker emphasizes.
  explanation_md: Both expressions are natural for wanting an item. Vil ha can present a direct choice,
    while har lyst på can present an item as appealing; context helps foreground the difference without
    making the other expression ungrammatical.
  derived_from:
  - section_id: retrieval-and-review
  stem_md: 'Kunden peker på en bestemt sekk og sier: «Jeg vil ha akkurat denne.» En venn sier: «Jeg har lyst på en grønn sekk.»'
  options:
  - id: correct
    text: The first statement presents a direct choice of a specific item; the second says that this kind of item appeals to the speaker.
    correct: true
    why: Akkurat denne marks a direct choice, while the other sentence expresses an inclination toward a type of item.
  - id: reversed-emphasis
    text: The first statement says that the item is merely appealing; the second presents a direct choice of one specific item.
    correct: false
    why: This reverses the emphasis provided by akkurat denne and the general description of a green bag.
  - id: both-commitments
    text: Both sentences express an equally definite purchase decision.
    correct: false
    why: The second sentence expresses an inclination, without identifying a particular selected item.
  - id: both-appeal
    text: Both sentences only say that a kind of item sounds appealing.
    correct: false
    why: The first sentence points to a specific item and presents it as the customer's direct choice.
