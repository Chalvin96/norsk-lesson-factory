- handle: review_choose_perspective
  op: choose
  objective: obj-glede-seg-til-or-vaere-glad-for-01
  bloom: analyze
  prompt_md: "Velg svaret som passer til begge opplysningene."
  stem_md: "**Beskjed:** Konserten er avlyst. Billettkontoret har allerede refundert pengene."
  options:
  - id: anticipation-of-concert
    text: Liv gleder seg til konserten.
    correct: false
    why: This contradicts the update that the concert was cancelled.
  - id: anticipation-of-refund
    text: Liv gleder seg til å få pengene tilbake.
    correct: false
    why: This treats an already completed refund as something still anticipated.
  - id: appreciation-of-refund
    text: Liv er glad for at hun fikk pengene tilbake.
    correct: true
    why: The refund has already happened and is the fact Liv appreciates.
