- handle: distinguish_rekke_ha_tid
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: understand
  prompt_md: Choose the sentence that matches the situation.
  stem_md: Nora and Emil must finish a report before the meeting at 15.00. Nora wants to help Emil after
    the meeting, when there is no stated deadline.
  explanation_md: Ha tid til å describes room in a schedule. Rekke å presents an action as something that
    must be completed before a cutoff.
  derived_from:
  - section_id: the-central-distinction
  options:
  - id: cutoff-reading
    text: Nora rekker å hjelpe Emil etter møtet.
    correct: false
    why: Rekker å suggests successful completion before a cutoff, but the situation gives no deadline
      for helping after the meeting.
  - id: missing-til
    text: Nora har tid å hjelpe Emil etter møtet.
    correct: false
    why: The availability meaning is appropriate, but the frame must include til before å.
  - id: availability-correct
    text: Nora har tid til å hjelpe Emil etter møtet.
    correct: true
    why: The sentence presents the period after the meeting as available time for helping.
- handle: checkpoint_hidden_cutoff
  op: write
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: Du skriver en kort arbeidsnote til Nora på 35–70 ord. Bruk uttrykket rekke å, med riktig
    bøying og nekting ved behov, for å vise hva som må bli ferdig før hvert synlige endepunkt i samtalen,
    og skriv tydelig hvilket endepunkt som gjelder for hver oppgave.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Jeg må bli ferdig med å rydde pulten før jeg tar bussen. Bussen går kl. 16.00.»
    - speaker: Emil
      text_md: «Jeg må kjøpe melk før nærbutikken stenger kl. 16.30.»
    - speaker: Nora
      text_md: «Jeg må gjøre sakspapirene ferdige før møtet starter kl. 17.00.»
    - speaker: Emil
      text_md: «Jeg må fullføre rapporten før innleveringsportalen stenger kl. 18.00.»
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: Evaluate criteria bus-endpoint, shop-endpoint, meeting-endpoint, report-endpoint, and
    explicit-rekke-aa. Accept concise, natural Norwegian, but do not accept an equivalent expression in
    place of the required rekke å frame.
  criteria:
  - id: bus-endpoint
    instruction: Identifies the bus departure at 16.00 as the endpoint for finishing the desk.
  - id: shop-endpoint
    instruction: Identifies the shop closing at 16.30 as the endpoint for buying milk.
  - id: meeting-endpoint
    instruction: Identifies the meeting start at 17.00 as the endpoint for finishing the papers.
  - id: report-endpoint
    instruction: Identifies the portal closing at 18.00 as the endpoint for finishing the report.
  - id: explicit-rekke-aa
    instruction: Uses the frame rekke å, with suitable tense or negation, for each task.
