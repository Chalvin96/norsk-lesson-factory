- handle: checkpoint_intended_perspective
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: "Velg setningen som passer best til hver situasjon."
  stem_md: "En kollega spør om du har tid til å lese en melding i et ledig tidsrom i ettermiddag. En annen spør om meldingen kan leses før et møte begynner. Senere er det tid til å lage lunsj etter møtet, men lunsjen må være klar før gjestene kommer."
  explanation_md: The first and third situations highlight available periods; the second and fourth focus
    on finishing before a cutoff. The expressions can overlap in real contexts, but these cues foreground
    different perspectives.
  derived_from:
  - section_id: compare-the-same-activity
  options:
  - id: availability-all
    text: Har du tid til å lese beskjeden i ettermiddag? Har du tid til å lese beskjeden før møtet begynner?
      Vi har tid til å lage lunsj etter møtet. Vi har tid til å lage lunsj før gjestene kommer.
    correct: false
    why: This overlooks the explicitly foregrounded cutoff in the meeting and guest situations.
  - id: perspectives-fit
    text: Har du tid til å lese beskjeden i ettermiddag? Rekker du å lese beskjeden før møtet begynner?
      Vi har tid til å lage lunsj etter møtet. Vi rekker å lage lunsj før gjestene kommer.
    correct: true
    why: The sentences match the stated availability periods and completion cutoffs.
  - id: cutoff-all
    text: Rekker du å lese beskjeden i ettermiddag? Rekker du å lese beskjeden før møtet begynner? Vi
      rekker å lage lunsj etter møtet. Vi rekker å lage lunsj før gjestene kommer.
    correct: false
    why: This casts the two open periods as completion-before-cutoff tasks.
- handle: checkpoint_negative_problem
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: analyze
  prompt_md: "Velg tolkningene som passer til alle fire setningene."
  stem_md: "Først: Nora har ikke tid til å kontrollere tallene. Deretter: Nora rekker ikke å skrive om teksten før møtet
    begynner. Så: Emil har ikke tid til å forlate kontoret. Til slutt: Emil rekker ikke å ta bussen."
  explanation_md: «Har ikke tid til å» sier at tiden ikke er tilgjengelig. «Rekker ikke å» sier at handlingen ikke blir ferdig før et tidspunkt.
  derived_from:
  - section_id: negative-statements-reveal-the-difference
  options:
  - id: set-first-pair-swapped
    text: '1: fullføring før frist; 2: ledig tid; 3: ledig tid; 4: fullføring før frist.'
    correct: false
    why: Dette bytter om på betydningen av setning 1 og 2.
  - id: set-second-pair-swapped
    text: '1: ledig tid; 2: fullføring før frist; 3: fullføring før frist; 4: ledig tid.'
    correct: false
    why: Dette bytter om på betydningen av setning 3 og 4.
  - id: set-all-cutoff
    text: '1: fullføring før frist; 2: fullføring før frist; 3: fullføring før frist; 4: fullføring før frist.'
    correct: false
    why: Setning 1 og 3 sier at tiden ikke er tilgjengelig, ikke at noe må bli ferdig før et bestemt tidspunkt.
  - id: set-correct
    text: '1: ingen ledig tid; 2: ikke ferdig før møtet; 3: ingen ledig tid; 4: ikke ferdig før bussen går.'
    correct: true
    why: Setning 1 og 3 sier at tiden ikke er tilgjengelig. Setning 2 og 4 sier at handlingen ikke blir ferdig før et oppgitt tidspunkt.
- handle: guided_schedule_to_deadline
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: "Velg setningsgruppen som viser at hver oppgave må fullføres før fristen."
  stem_md: "Meldingen må leses før neste møte. Gjestene kommer til et bestemt tidspunkt, og skjemaet stenger til et bestemt klokkeslett."
  explanation_md: These situations foreground completion before fixed cutoffs, so rekke å is the clearest
    framing here.
  derived_from:
  - section_id: guided-practice-in-new-situations
  options:
  - id: deadline-set
    text: Jeg rekker å lese meldingen før møtet begynner. Vi rekker å kjøpe mat før gjesten kommer. Hun
      rekker å fylle ut skjemaet før systemet stenger.
    correct: true
    why: Each sentence focuses on completing the task before the stated cutoff.
  - id: availability-set
    text: Jeg har tid til å lese meldingen før møtet begynner. Vi har tid til å kjøpe mat før gjesten kommer.
      Hun har tid til å fylle ut skjemaet før systemet stenger.
    correct: false
    why: This can be grammatical, but it foregrounds available time rather than whether each task will
      be completed before the cutoff.
  - id: mixed-set
    text: Jeg har tid til å lese meldingen før møtet begynner. Vi rekker å kjøpe mat før gjesten kommer.
      Hun har tid til å fylle ut skjemaet før systemet stenger.
    correct: false
    why: The task asks for a consistent deadline-focused perspective across all three situations.
- handle: guided_deadline_to_availability
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: "Velg setningsgruppen som viser at aktivitetene passer inn i ledige tidsrom."
  stem_md: "Fire personer har ledig tid etter lunsj, i dag, i kveld og i helgen. Ingen av aktivitetene har en frist."
  explanation_md: With open periods as the focus and no completion cutoff, ha tid til å presents the
    activities as fitting into the schedule.
  derived_from:
  - section_id: guided-practice-in-new-situations
  options:
  - id: availability-set
    text: Jeg har tid til å ringe kollegaen etter lunsj. Vi har tid til å lage lunsj i dag. Hun har tid
      til å gå gjennom dokumentet i kveld. Har du tid til å besøke en venn i helgen?
    correct: true
    why: Each sentence presents an activity as fitting an open period in someone's schedule.
  - id: cutoff-set
    text: Jeg rekker å ringe kollegaen etter lunsj. Vi rekker å lage lunsj i dag. Hun rekker å gå gjennom
      dokumentet i kveld. Rekker du å besøke en venn i helgen?
    correct: false
    why: This presents the activities as completion goals rather than available periods.
  - id: mixed-set
    text: Jeg rekker å ringe kollegaen etter lunsj. Vi har tid til å lage lunsj i dag. Hun rekker å gå
      gjennom dokumentet i kveld. Har du tid til å besøke en venn i helgen?
    correct: false
    why: The task asks for a consistent availability perspective across all four situations.
