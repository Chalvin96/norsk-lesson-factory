- handle: distinguish_rekke_ha_tid
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: understand
  prompt_md: "Velg setningen som passer til situasjonen."
  stem_md: "Nora og Emil må bli ferdige med en rapport før møtet klokka 15.00. Etter møtet vil Nora hjelpe Emil, men det haster ikke."
  explanation_md: Ha tid til å describes room in a schedule. Rekke å presents an action as something that
    must be completed before a cutoff.
  derived_from:
  - section_id: the-central-distinction
  options:
  - id: cutoff-reading
    text: Nora rekker å hjelpe Emil etter møtet.
    correct: false
    why: Rekker å suggests successful completion before a cutoff, but the situation gives no deadline
      for helping after the meeting.
  - id: missing-til
    text: Nora har tid å hjelpe Emil etter møtet.
    correct: false
    why: The availability meaning is appropriate, but the frame must include til before å.
  - id: availability-correct
    text: Nora har tid til å hjelpe Emil etter møtet.
    correct: true
    why: The sentence presents the period after the meeting as available time for helping.
- handle: checkpoint_hidden_cutoff
  op: write
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: "Skriv en kort melding til Nora. Bruk «rekke å» med riktig bøying og nektingsord. Finn fristen i hver situasjon ut fra opplysningene om buss, stengetid, møtestart og portal. Si hvilke oppgaver som rekker å bli ferdige, og hvilke som ikke gjør det."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Klokka er 15.55. Det tar minst ti minutter å rydde pulten. Bussen min hjem går kl. 16.00.»
    - speaker: Emil
      text_md: «Klokka er 16.20. Butikken stenger kl. 16.30, og jeg trenger minst femten minutter til å kjøpe melk.»
    - speaker: Nora
      text_md: «Klokka er 16.25. Møtet starter kl. 17.00, og sakspapirene trenger minst tjue minutter til.»
    - speaker: Emil
      text_md: «Klokka er 17.20. Rapporten mangler en avslutning som tar omtrent femten minutter å skrive. Innleveringsportalen stenger kl. 18.00.»
  response_language: 'no'
  min_words: 35
  max_words: 70
  judge_prompt: Evaluate criteria bus-endpoint, shop-endpoint, meeting-endpoint, report-endpoint, and
    explicit-rekke-aa. Accept concise, natural Norwegian, but do not accept an equivalent expression in
    place of the required rekke å frame.
  criteria:
  - id: bus-endpoint
    instruction: >-
      Recognizes the 16.00 home bus as Nora's cutoff: with only five minutes remaining and at least ten
      minutes of work, she will not finish clearing the desk in time.
  - id: shop-endpoint
    instruction: >-
      Recognizes the 16.30 closing time as Emil's cutoff: fifteen minutes of shopping will not fit into
      the ten minutes remaining.
  - id: meeting-endpoint
    instruction: >-
      Recognizes the 17.00 meeting as Nora's cutoff and that the twenty-minute task fits within the thirty-five
      minutes remaining.
  - id: report-endpoint
    instruction: >-
      Recognizes the 18.00 portal closing as Emil's cutoff and that the fifteen-minute task fits within
      the forty minutes remaining.
  - id: explicit-rekke-aa
    instruction: Uses the frame rekke å, with suitable tense or negation, for each task.
