  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: Choose the sentence set that presents each activity as fitting an available period.
  stem_md: After lunch, today, this evening, and this weekend are open periods in four people's schedules;
