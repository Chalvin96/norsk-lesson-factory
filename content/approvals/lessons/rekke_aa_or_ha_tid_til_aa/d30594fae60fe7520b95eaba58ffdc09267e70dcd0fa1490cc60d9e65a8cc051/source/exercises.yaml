    correct: true
    why: Each sentence presents an activity as fitting an open period in someone's schedule.
  - id: cutoff-set
    text: Jeg rekker å ringe kollegaen etter lunsj. Vi rekker å lage lunsj i dag. Hun rekker å gå gjennom
      dokumentet i kveld. Rekker du å besøke en venn i helgen?
    correct: false
    why: This presents the activities as completion goals rather than available periods.
  - id: mixed-set
    text: Jeg rekker å ringe kollegaen etter lunsj. Vi har tid til å lage lunsj i dag. Hun rekker å gå
      gjennom dokumentet i kveld. Har du tid til å besøke en venn i helgen?
    correct: false
    why: The task asks for a consistent availability perspective across all four situations.
- handle: guided_nora_emil_plan
  op: write
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: Nora og Emil må forlate kontoret kl. 15.55. Skriveren er ute av drift til kl. 16.10, og bussen går kl. 16.00. Skriv en melding på 15–35 ord til Nora. Bruk rekke å + infinitiv for utskriften og ha tid til å + infinitiv for lesingen på bussen. Tilpass verbformen til meldingen.
  derived_from:
  - section_id: guided-practice-in-new-situations
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Evaluate whether the message uses the requested rekke å frame for the printing deadline
    and ha tid til å frame for the reading opportunity, with the stated meanings. Accept natural Bokmål
    variants and verb inflections; do not pass an answer that uses unrelated frames for either meaning.
  criteria:
  - id: cutoff-negative
    instruction: Uses a natural negative form of rekke å + infinitive to state that the document cannot be printed before the 16.00 bus leaves.
  - id: availability-positive
    instruction: Uses ha tid til å + infinitive to state positively that there is an available period on the bus for reading.
- handle: transfer_daily_priorities
  op: write
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: Du skriver til en kollega for å avklare dagens prioriteringer. Kundesvaret må sendes før
    kl. 14; du har en ledig halvtime etter lunsj til å kontrollere vedlegget; kollegaen kan hjelpe fra
    kl. 13.30; møtet begynner kl. 14.15. Skriv en melding på 45–70 ord som foreslår en plan, bruker rekke
    å om kundesvaret, bruker ha tid til å om vedlegget og spør om kollegaen kan hjelpe.
  derived_from:
  - section_id: guided-practice-in-new-situations
  response_language: 'no'
  min_words: 45
  max_words: 70
  judge_prompt: Evaluate all gating criteria, including the required use of rekke å and ha tid til å.
    Record the two observation criteria diagnostically only.
  criteria:
  - id: plan-content
    instruction: Proposes a workable plan that accounts for the 14.00 customer deadline, the free half-hour,
      the colleague's availability, and the 14.15 meeting.
  - id: colleague-request
    instruction: Asks the colleague for help with a relevant part of the work.
  - id: rekke-required
    instruction: Uses rekke å appropriately for completing the customer reply before 14.00.
  - id: ha-tid-required
    instruction: Uses ha tid til å appropriately for the available time to check the attachment.
  - id: word-bound
    instruction: Contains 45–70 words.
  - id: rekke-observation
    instruction: 'Observation only: note whether another use of rekke å is natural; do not fail the response.'
  - id: ha-tid-observation
    instruction: 'Observation only: note whether another use of ha tid til å is natural; do not fail the
      response.'
