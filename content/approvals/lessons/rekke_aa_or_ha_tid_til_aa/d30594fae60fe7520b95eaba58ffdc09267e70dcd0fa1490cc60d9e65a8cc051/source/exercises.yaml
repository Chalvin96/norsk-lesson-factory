  - id: explicit-cutoff
    text: Jeg rekker å gå gjennom kontrakten før møtet begynner.
    correct: true
    why: This most directly presents the contract review as something that must be completed before the
      meeting.
  - id: general-availability
    text: Jeg har tid til å lese kontrakten i dag.
    correct: false
    why: This says the activity fits into the day but does not express completion before the meeting.
