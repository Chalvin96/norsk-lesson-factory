- handle: checkpoint_intended_perspective
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: Choose the set that best fits the four situations.
  stem_md: A colleague asks about a free period this afternoon to read a message. Another asks whether
    the message can be read before a meeting begins. Later, there is an open period after the meeting for
    making lunch, followed by a plan to finish lunch before guests arrive.
  explanation_md: The first and third situations highlight available periods; the second and fourth focus
    on finishing before a cutoff. The expressions can overlap in real contexts, but these cues foreground
    different perspectives.
  derived_from:
  - section_id: compare-the-same-activity
  options:
  - id: availability-all
    text: Har du tid til å lese beskjeden i ettermiddag? Har du tid til å lese beskjeden før møtet begynner?
      Vi har tid til å lage lunsj etter møtet. Vi har tid til å lage lunsj før gjestene kommer.
    correct: false
    why: This overlooks the explicitly foregrounded cutoff in the meeting and guest situations.
  - id: perspectives-fit
    text: Har du tid til å lese beskjeden i ettermiddag? Rekker du å lese beskjeden før møtet begynner?
      Vi har tid til å lage lunsj etter møtet. Vi rekker å lage lunsj før gjestene kommer.
    correct: true
    why: The sentences match the stated availability periods and completion cutoffs.
  - id: cutoff-all
    text: Rekker du å lese beskjeden i ettermiddag? Rekker du å lese beskjeden før møtet begynner? Vi
      rekker å lage lunsj etter møtet. Vi rekker å lage lunsj før gjestene kommer.
    correct: false
    why: This casts the two open periods as completion-before-cutoff tasks.
- handle: checkpoint_negative_problem
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: analyze
  prompt_md: Choose the interpretation set that classifies all four sentences correctly.
  stem_md: Nora har ikke tid til å kontrollere tallene. 2. Nora rekker ikke å skrive om teksten før møtet
    begynner. 3. Emil har ikke tid til å forlate kontoret. 4. Emil rekker ikke å ta bussen.
  explanation_md: Har ikke tid til å denies available time. Rekker ikke å denies successful completion
    before a stated or understood cutoff.
  derived_from:
  - section_id: negative-statements-reveal-the-difference
  options:
  - id: set-first-pair-swapped
    text: '1: cutoff; 2: availability; 3: availability; 4: cutoff.'
    correct: false
    why: This reverses the time perspectives in sentences 1 and 2.
  - id: set-second-pair-swapped
    text: '1: availability; 2: cutoff; 3: cutoff; 4: availability.'
    correct: false
    why: This reverses the time perspectives in sentences 3 and 4.
  - id: set-all-cutoff
    text: '1: cutoff; 2: cutoff; 3: cutoff; 4: cutoff.'
    correct: false
    why: Sentences 1 and 3 concern room in a schedule rather than completion before an endpoint.
  - id: set-correct
    text: '1: availability; 2: cutoff; 3: availability; 4: cutoff.'
    correct: true
    why: Sentences 1 and 3 deny available time; sentences 2 and 4 deny completion before a cutoff.
- handle: guided_schedule_to_deadline
  op: choose
  objective: obj-rekke-aa-or-ha-tid-til-aa-01
  bloom: apply
  prompt_md: Choose the sentence set that focuses on finishing each task before its deadline.
  stem_md: The meeting starts before there will be another chance to read the message. The guest arrives
    at a fixed time, and the form closes at a stated time.
  explanation_md: These situations foreground completion before fixed cutoffs, so rekke å is the clearest
    framing here.
  derived_from:
  - section_id: guided-practice-in-new-situations
  options:
  - id: deadline-set
    text: Jeg rekker å lese meldingen før møtet begynner. Vi rekker å kjøpe mat før gjesten kommer. Hun
      rekker å fylle ut skjemaet før systemet stenger.
    correct: true
    why: Each sentence focuses on completing the task before the stated cutoff.
  - id: availability-set
    text: Jeg har tid til å lese meldingen før møtet begynner. Vi har tid til å kjøpe mat før gjesten kommer.
      Hun har tid til å fylle ut skjemaet før systemet stenger.
    correct: false
    why: This can be grammatical, but it foregrounds available time rather than whether each task will
      be completed before the cutoff.
  - id: mixed-set
    text: Jeg har tid til å lese meldingen før møtet begynner. Vi rekker å kjøpe mat før gjesten kommer.
      Hun har tid til å fylle ut skjemaet før systemet stenger.
    correct: false
    why: The task asks for a consistent deadline-focused perspective across all three situations.
