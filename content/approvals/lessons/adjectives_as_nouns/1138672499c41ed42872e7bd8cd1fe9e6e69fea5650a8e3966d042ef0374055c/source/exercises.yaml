- handle: identify_understood_noun
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: Koble hver kortform til substantivet den viser til.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: Vi ser på et bord og flere stoler.
    - speaker: Erik
      text_md: Det lille passer best. De blå står ved døra.
  stem_md: Velg tolkningen som passer til samtalen.
  options:
  - id: unmentioned
    text: det lille = et skap; de blå = en lampe
    correct: false
    why: These nouns are not established in the dialogue.
  - id: correct
    text: det lille = et bord; de blå = flere stoler
    correct: true
    why: Det lille is singular neuter, while de blå is plural.
  - id: reversed
    text: det lille = flere stoler; de blå = et bord
    correct: false
    why: The singular and plural references are reversed.
- handle: distinguish_definite_gender_and_number
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: Sorter den, det og de etter kjønn og tall.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: Her er en stol, et skap og flere lamper.
    - speaker: Erik
      text_md: Jeg liker den røde, det røde og de røde.
  stem_md: Sorter uttrykkene etter kjønn og tall.
  options:
  - id: number-swap
    text: den røde = flertall; det røde = intetkjønn entall; de røde =
      hankjønn/hunkjønn entall
    correct: false
    why: «Den» og «de» viser til feil tall.
  - id: correct
    text: den røde = hankjønn/hunkjønn entall; det røde = intetkjønn entall; de
      røde = flertall
    correct: true
    why: «Den» og «det» viser til entall med ulikt kjønn, mens «de» viser til
      flertall.
  - id: gender-swap
    text: den røde = intetkjønn entall; det røde = hankjønn/hunkjønn entall; de
      røde = flertall
    correct: false
    why: Kjønnsformene for hankjønn/hunkjønn og intetkjønn er byttet om.
