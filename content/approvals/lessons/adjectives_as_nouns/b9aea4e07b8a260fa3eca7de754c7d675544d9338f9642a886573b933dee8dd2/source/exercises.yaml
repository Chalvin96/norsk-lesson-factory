- handle: identify_understood_noun
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: Match each shortened phrase to its understood noun.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: Vi ser på et bord og flere stoler.
    - speaker: Erik
      text_md: Det lille passer best. De blå står ved døra.
  stem_md: Which interpretation is correct?
  options:
  - id: unmentioned
    text: det lille = et skap; de blå = en lampe
    correct: false
    why: These nouns are not established in the dialogue.
  - id: correct
    text: det lille = et bord; de blå = flere stoler
    correct: true
    why: Det lille is singular neuter, while de blå is plural.
  - id: reversed
    text: det lille = flere stoler; de blå = et bord
    correct: false
    why: The singular and plural references are reversed.
- handle: distinguish_definite_gender_and_number
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: Classify den, det and de by gender and number.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: Her er en stol, et skap og flere lamper.
    - speaker: Erik
      text_md: Jeg liker den røde, det røde og de røde.
  stem_md: Which classification is correct?
  options:
  - id: number-swap
    text: den røde = plural; det røde = neuter singular; de røde = common-gender singular
    correct: false
    why: Den and de are assigned the wrong number.
  - id: correct
    text: den røde = common-gender singular; det røde = neuter singular; de røde = plural
    correct: true
    why: Den and det mark singular gender, while de marks plural.
  - id: gender-swap
    text: den røde = neuter singular; det røde = common-gender singular; de røde = plural
    correct: false
    why: The two singular gender meanings are swapped.
