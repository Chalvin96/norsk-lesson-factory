- handle: track_reference_across_the_dialogue
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: understand
  prompt_md: Track which group each adjective phrase refers to.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: Jeg så noen svarte stoler ved døra.
    - speaker: Erik
      text_md: De svarte står ved døra, og de blå står ved vinduet.
  stem_md: Which interpretation is correct?
  options:
  - id: same-group
    text: All three phrases refer to the same group of chairs.
    correct: false
    why: De blå identifies a different colour group.
  - id: correct
    text: Noen svarte introduces a group; de svarte refers back to it; de blå identifies another known
      group.
    correct: true
    why: Noen introduces an indefinite group, while de marks known plural groups.
  - id: reversed
    text: De svarte introduces a new group; noen svarte refers back to it; de blå refers to the first
      group.
    correct: false
    why: Noen, not de, introduces the group.
- handle: transfer_adjective_noun_phrases_to_the_bakery
  op: write
  objective: obj-adjectives-as-nouns-01
  bloom: apply
  prompt_md: Write a 30–45-word message to your meeting partner choosing cakes and baked goods from the
    supplied bakery situation. Include one indefinite common-gender phrase, one indefinite neuter phrase,
    one definite common-gender phrase, one definite neuter phrase, one indefinite plural phrase and one
    definite plural phrase; omit the nouns.
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 30
  max_words: 45
  judge_prompt: Check criteria C1 through C6 and the word-bound criterion. Report each criterion separately.
    Accept any taught adjective that agrees with the requested gender, number and definiteness, and require
    every phrase in C1 through C6 to express a choice of a cake or baked good from the supplied bakery
    situation.
  criteria:
  - id: C1-indefinite-common
    instruction: Contains an indefinite common-gender adjective-only phrase with en that expresses a choice
      of a cake or baked good from the supplied bakery situation.
  - id: C2-indefinite-neuter
    instruction: Contains an indefinite neuter adjective-only phrase with et and the neuter adjective
      form that expresses a choice of a cake or baked good from the supplied bakery situation.
  - id: C3-definite-common
    instruction: Contains a definite common-gender adjective-only phrase with den and the definite adjective
      form that expresses a choice of a cake or baked good from the supplied bakery situation.
  - id: C4-definite-neuter
    instruction: Contains a definite neuter adjective-only phrase with det and the definite adjective
      form that expresses a choice of a cake or baked good from the supplied bakery situation.
  - id: C5-indefinite-plural
    instruction: Contains an indefinite plural adjective-only phrase without de that expresses a choice
      of a cake or baked good from the supplied bakery situation.
  - id: C6-definite-plural
    instruction: Contains a definite plural adjective-only phrase with de that expresses a choice of a
      cake or baked good from the supplied bakery situation.
  - id: C7-word-bound
    instruction: Contains between 30 and 45 words.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: På disken står det flere kaker og bakverk. Vi skal velge til møtet.
    - speaker: Hassan
      text_md: Kaken er en kake, og bakverket er et bakverk. Skriv en kort melding til meg med valgene
        dine.
