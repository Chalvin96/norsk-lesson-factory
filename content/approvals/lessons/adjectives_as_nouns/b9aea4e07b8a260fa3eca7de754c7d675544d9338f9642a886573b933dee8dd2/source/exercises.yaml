- handle: review_contrast_indefinite_and_definite_singular
  op: choose
  objective: obj-adjectives-as-nouns-01
  bloom: apply
  prompt_md: 'Choose Maja''s line: she first names two new things she has not settled on, then points
    to the two she has chosen.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: Vi har en gammel lampe og et gammelt bord på lageret.
    - speaker: Erik
      text_md: Vi trenger noe nytt før kundene kommer. Hva foreslår du?
  stem_md: Which line is correct?
  options:
  - id: neuter-form
    text: Jeg vurderer en ny og et nytt. Til slutt velger jeg den nye og det nytt.
    correct: false
    why: A definite neuter phrase before an understood noun takes the -e form, not -t.
  - id: correct
    text: Jeg vurderer en ny og et nytt. Til slutt velger jeg den nye og det nye.
    correct: true
    why: The first two phrases leave the two items open, and the last two point to the items Maja has
      settled on.
  - id: reversed
    text: Jeg vurderer den nye og det nye. Til slutt velger jeg en ny og et nytt.
    correct: false
    why: This points to the settled items first and leaves the open phrases for last.
