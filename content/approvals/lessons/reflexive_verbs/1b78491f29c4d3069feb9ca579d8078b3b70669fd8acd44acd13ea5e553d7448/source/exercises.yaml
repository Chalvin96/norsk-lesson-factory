- handle: recall_reflexive_forms
  op: write
  objective: obj-reflexive-verbs-01
  bloom: apply
  derived_from:
  - section_id: short-retrieval-and-review
  prompt_md: 'Nora writes: «Bussen går 07.20. Jeg er klar, og jeg gleder meg til turen. Er dere klare?»
    Reply to Nora in 25–40 Norwegian words to say what you and your family are doing, whether you will
    reach the bus, and what you anticipate. Use at least one reflexive verb with a pronoun that matches
    its subject. Every reflexive form you use must have the pronoun that matches its subject.'
  response_language: 'no'
  min_words: 25
  max_words: 40
  judge_prompt: 'Evaluate audience-purpose, supplied-facts, word-count, and reflexive-forms criteria as
    gating criteria. The response must be a natural Norwegian message to Nora, answer whether the group
    will reach the bus, state what the writer and family are doing, mention something the writer anticipates,
    contain 25–40 Norwegian words, use at least one reflexive verb, and match the subject in every reflexive form used.
    Anchor that must pass: «Hei Nora! Vi gjør oss klare nå, og pappa vasker bilen. Vi rekker bussen hvis
    vi går om fem minutter. Jeg gleder meg til turen.» Anchor that must fail because the reflexive pronoun
    does not match its subject: «Hei Nora! Vi gjør seg klare nå, og pappa vasker bilen. Vi rekker bussen
    hvis vi går om fem minutter, og jeg gleder meg til turen.» Anchor that must fail because it lacks
    a required reflexive verb: «Hei Nora! Vi pakker sekken og venter på bussen. Vi rekker bussen hvis
    vi går om fem minutter, og jeg ser fram til turen.»'
  criteria:
  - id: audience-purpose
    instruction: Replies to Nora as a message and answers whether the group will reach the bus.
  - id: supplied-facts
    instruction: States what the writer and family are doing and mentions something the writer anticipates.
  - id: word-count
    instruction: Contains 25–40 Norwegian words.
  - id: reflexive-forms
    instruction: Uses at least one reflexive verb and matches each reflexive pronoun to its subject.
