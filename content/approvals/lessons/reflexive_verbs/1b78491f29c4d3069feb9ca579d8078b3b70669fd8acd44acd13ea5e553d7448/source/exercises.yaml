- handle: notice_reflexive_reference
  op: choose
  objective: obj-reflexive-verbs-01
  bloom: understand
  derived_from:
  - section_id: checkpoint-notice-reflexive-reference
  stem_md: Jeg vasker meg før skolen. 2. Jeg vasker bilen før skolen. 3. Nora kler på seg før turen. 4.
    Nora kler på barnet før turen.
  prompt_md: Choose the sentences where the subject acts on themselves.
  options:
  - id: sentences-1-and-4
    text: Setning 1 og 4.
    correct: false
    why: Sentence 1 is reflexive, but barnet in sentence 4 is another person receiving the action.
  - id: all-sentences
    text: Alle fire setningene.
    correct: false
    why: Bilen and barnet are ordinary objects, so sentences 2 and 4 are not reflexive.
  - id: sentences-1-and-3
    text: Setning 1 og 3.
    correct: true
    why: In sentences 1 and 3, the object refers back to the subject.
  - id: sentences-2-and-4
    text: Setning 2 og 4.
    correct: false
    why: These sentences describe actions directed at a car and a child, not back at the subject.
