- handle: choose_reflexive_or_ordinary_object
  op: choose
  objective: obj-reflexive-verbs-01
  bloom: understand
  derived_from:
  - section_id: checkpoint-choose-reflexive-or-ordinary-object
  stem_md: "I wash myself before departure, but I wash the car too; Nora dresses herself before the concert, but she dresses the child too; we sit down on the bench and place chairs by the table."
  prompt_md: "Velg det norske settet som viser hvem som utfører og mottar hver handling."
  options:
  - id: reflexive-for-all
    text: Jeg vasker bilen før avreise. 2. Jeg vasker meg før avreise. 3. Nora kler på barnet før konserten.
      4. Nora kler på seg før konserten. 5. Vi setter stolene på benken. 6. Vi setter oss ved bordet.
    correct: false
    why: Scenes 1, 3, and 5 name other recipients of the actions; they do not describe the subject acting on itself.
  - id: correct-reference
    text: Jeg vasker meg før avreise. 2. Jeg vasker bilen før avreise. 3. Nora kler på seg før konserten.
      4. Nora kler på barnet før konserten. 5. Vi setter oss på benken. 6. Vi setter stolene ved bordet.
    correct: true
    why: Reflexive pronouns mark actions returning to the subject, while bilen, barnet, and stolene name
      other recipients.
  - id: ordinary-object-for-all
    text: Jeg vasker hendene før avreise. 2. Jeg vasker bilen før avreise. 3. Nora kler barnet før konserten.
      4. Nora kler på barnet før konserten. 5. Vi setter stolene på benken. 6. Vi setter stolene ved bordet.
    correct: false
    why: These sentences use ordinary objects for actions directed at someone or something else.
  - id: mixed-reference
    text: Jeg vasker meg før avreise. 2. Jeg vasker bilen før avreise. 3. Nora kler på seg før konserten.
      4. Nora kler på barnet før konserten. 5. Vi setter stolene på benken. 6. Vi setter oss ved bordet.
    correct: false
    why: Scenes 5 and 6 reverse whether we sit ourselves or place the chairs.
