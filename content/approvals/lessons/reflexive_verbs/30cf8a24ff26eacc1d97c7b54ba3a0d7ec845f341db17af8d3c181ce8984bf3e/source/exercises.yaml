- handle: recall_reflexive_forms
  op: write
  objective: obj-reflexive-verbs-01
  bloom: apply
  derived_from:
  - section_id: short-retrieval-and-review
  prompt_md: "Skriv et svar på 25–40 ord til Nora om hva du og familien skal gjøre, om dere rekker bussen, og hva du gleder deg til. Bruk minst ett refleksivt verb med pronomen som passer til subjektet."
  response_language: 'no'
  min_words: 25
  max_words: 40
  judge_prompt: 'Evaluate audience-purpose, supplied-facts, word-count, and reflexive-forms criteria as
    gating criteria. The response must be a natural Norwegian message to Nora, answer whether the group
    will reach the bus, state what the writer and family plan to do, say what the writer looks forward to,
    contain 25–40 Norwegian words, use at least one reflexive verb, and match the subject in every reflexive form used. The response must state what the writer looks forward to.
    Anchor that must pass: «Hei Nora! Vi skal gjøre oss klare, og pappa skal vaske bilen. Vi rekker bussen hvis
    vi går om fem minutter. Jeg gleder meg til turen.» Anchor that must fail because the reflexive pronoun
    does not match its subject: «Hei Nora! Vi skal gjøre seg klare, og pappa skal vaske bilen. Vi rekker bussen
    hvis vi går om fem minutter, og jeg gleder meg til turen.» Anchor that must fail because it lacks
    a required reflexive verb: «Hei Nora! Vi skal pakke sekken og vente på bussen. Vi rekker bussen hvis
    vi går om fem minutter, og jeg ser fram til turen.»'
  criteria:
  - id: audience-purpose
    instruction: Replies to Nora as a message and answers whether the group will reach the bus.
  - id: supplied-facts
    instruction: States what the writer and family plan to do and states what the writer looks forward to.
  - id: word-count
    instruction: Contains 25–40 Norwegian words.
  - id: reflexive-forms
    instruction: Uses at least one reflexive verb and matches each reflexive pronoun to its subject.
