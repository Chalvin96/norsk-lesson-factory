  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: "Velg Eriks svar der han gjengjelder den vennlige hilsenen."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sigrid
      text_md: «Jeg heter Sigrid.»
    - speaker: Erik
      text_md: «Jeg er Erik.»
    - speaker: Sigrid
      text_md: «Hyggelig å møte deg.»
  options:
  - id: close-now
    text: Ha det!
    correct: false
    why: Dette avslutter samtalen før Erik svarer vennlig tilbake.
  - id: return-friendly
    text: Hyggelig å møte deg også!
    correct: true
    why: «Hyggelig å møte deg også» svarer med uttrykket eleven har lært i leksjonen.
  - id: repeat-name
    text: Jeg heter Lars.
    correct: false
    why: Erik presenterer et annet navn i stedet for å svare på Sigrids vennlige replikk.
