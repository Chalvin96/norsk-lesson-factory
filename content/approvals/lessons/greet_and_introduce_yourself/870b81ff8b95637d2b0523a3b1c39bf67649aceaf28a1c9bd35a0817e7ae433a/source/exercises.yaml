      text_md: Ada og Leo er nye naboer. De møtes mens de venter på en forsinket heis og har bare et øyeblikk til å snakke.
  response_language: 'no'
  judge_prompt: Check that the exchange includes a greeting, a natural two-way introduction of Ada and Leo, a friendly line, and a closing. One name question with the other person’s answer is enough; do not require both people to repeat the same question.
  criteria:
  - id: greeting
    instruction: The exchange contains a Norwegian greeting.
  - id: name-exchange
    instruction: One person asks the other's name and receives an answer, and both Ada and Leo's names are introduced naturally without repeating a name question after the names are known.
