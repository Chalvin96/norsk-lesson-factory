  prompt_md: "Ada og Leo er nye naboer. De møtes mens de venter på en forsinket heis og har bare et øyeblikk til å snakke. Skriv en samtale: Hils, spør etter navn, presenter dere, si noe hyggelig og avslutt før heisen kommer."
  min_words: 12
  max_words: 24
  stimulus:
