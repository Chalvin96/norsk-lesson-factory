- handle: notice_name_question
  op: choose
  objective: obj-greet-and-introduce-yourself-01
  bloom: understand
  prompt_md: "Velg hva Mina spør om."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Hei! Jeg heter Mina. Hva heter du?»
  options:
  - id: wellbeing
    text: How the other person feels.
    correct: false
    why: A wellbeing question would use Hvordan har du det?
  - id: other-name
    text: The other person's name.
    correct: true
    why: Hva heter du? asks for the person addressed to give their name.
  - id: own-name
    text: Mina's name.
    correct: false
    why: Mina gives her own name with Jeg heter Mina.
  derived_from:
  - section_id: a-first-meeting
