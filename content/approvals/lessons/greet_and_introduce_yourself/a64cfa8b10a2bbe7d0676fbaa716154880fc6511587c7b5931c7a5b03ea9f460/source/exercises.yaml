- handle: notice_name_question
  op: choose
  objective: obj-greet-and-introduce-yourself-01
  bloom: understand
  prompt_md: At the language school, what does Mina want to know?
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Hei! Jeg heter Mina. Hva heter du?»
  options:
  - id: his-name
    text: His name.
    correct: true
    why: Hva heter du? asks the other person's name.
  - id: her-name
    text: Her own name.
    correct: false
    why: Stating her own name is Jeg heter Mina — that part is already said.
  - id: how-he-feels
    text: How he is feeling.
    correct: false
    why: That would be Hvordan har du det? — a different exchange.
  derived_from:
  - section_id: a-first-meeting
- handle: match_line_to_job
  op: match_pairs
  objective: obj-greet-and-introduce-yourself-01
  bloom: understand
  prompt_md: Match each line to its job.
  left:
  - left_id: own-name
    text: Jeg heter Mina.
  - left_id: ask-name
    text: Hva heter du?
  - left_id: friendly
    text: Hyggelig å møte deg.
  - left_id: closing
    text: Ha det!
  right:
  - right_id: job-asks
    text: Asks the other person's name
  - right_id: job-states
    text: States your own name
  - right_id: job-friendly
    text: Marks the meeting as friendly
  - right_id: job-close
    text: Closes the exchange
  pairs:
  - left_id: own-name
    right_id: job-states
  - left_id: ask-name
    right_id: job-asks
  - left_id: friendly
    right_id: job-friendly
  - left_id: closing
    right_id: job-close
  derived_from:
  - section_id: the-shape-of-the-exchange
- handle: begin_the_meeting
  op: speak
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: 'Read exactly this opening aloud: Hei! Jeg heter Nora.'
  target: Hei! Jeg heter Nora.
  derived_from:
  - section_id: greeting-with-hei
- handle: answer_aleksander
  op: write
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: Answer with your name and return the friendly expression. (5–10 words)
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Aleksander
      text_md: «Hei! Jeg heter Aleksander. Hva heter du?»
  response_language: 'no'
  judge_prompt: Check the answer against the task and report evidence for each criterion.
  criteria:
  - id: gives-name
    instruction: Answers with Jeg heter and a name.
  - id: returns-friendly
    instruction: Returns a natural friendly expression appropriate after meeting someone, such as Hyggelig
      å møte deg or Koselig å møte deg.
  - id: friendly-form-observation
    instruction: Observation, not gating — note whether the taught Hyggelig å møte deg form appears; do
      not fail a natural equivalent.
  derived_from:
  - section_id: asking-the-other-persons-name
- handle: choose_next_line
  op: choose
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: Sigrid and Erik have just told each other their names. What should Erik say now?
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sigrid
      text_md: «Hyggelig å møte deg.»
  options:
  - id: returns-friendly
    text: Hyggelig å møte deg også.
    correct: true
    why: Also returns the friendly expression — the natural next move at this point.
  - id: repeats-name
    text: Jeg heter Erik.
    correct: false
    why: Names are already exchanged; this re-answers a question nobody asked again.
  - id: jumps-to-close
    text: Ha det!
    correct: false
    why: Closing straight away skips the returned greeting — abrupt right after meeting.
  derived_from:
  - section_id: responding-to-the-name-question
- handle: complete_the_exchange
  op: recall_fill
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: Complete the exchange.
  audio_target: Hei! Jeg heter Mina. Hva heter du? Jeg heter Jonas. Hyggelig å møte deg. Hyggelig å møte
    deg også. Ha det!
  segments:
  - text_md: 'Mina: Hei! Jeg '
  - blank_id: heter-1
    options:
    - het
    - heter
    answer_index: 1
  - text_md: ' Mina. Hva '
  - blank_id: heter-2
    options:
    - heter
    - het
    answer_index: 0
  - text_md: ' du? Jonas: Jeg heter Jonas. Mina: Hyggelig å '
  - blank_id: mote
    options:
    - møtes
    - møte
    answer_index: 1
  - text_md: ' deg. Jonas: Hyggelig å møte deg også. Mina: Ha '
  - blank_id: det
    options:
    - der
    - det
    answer_index: 1
  - text_md: '!'
  explanation_md: The same verb form heter states a name and asks for one; møte deg marks the meeting
    as friendly.
  derived_from:
  - section_id: building-the-complete-first-meeting
- handle: first_day_exchange
  op: write
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: 'First day at Norwegian class. You meet a classmate at the door. Write a short exchange for
    both speakers: greet each other, ask and answer names, say something friendly about meeting, and close
    the conversation. (15–30 words)'
  response_language: 'no'
  judge_prompt: Check the exchange against the task and report evidence for each criterion.
  criteria:
  - id: opens-greeting
    instruction: Opens with a Norwegian greeting such as Hei!.
  - id: both-names
    instruction: Each speaker states their name, and one speaker asks the other person's name; accept
      natural wording variants.
  - id: closes-friendly
    instruction: Ends with a natural closing such as Ha det! or Vi ses!, with a friendly meeting expression
      before it.
  - id: connected-observation
    instruction: Observation, not gating — lines respond to each other as one conversation.
  derived_from:
  - section_id: guided-exchange-practice
- handle: review_state_name
  op: recall_fill
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: Complete the line with the Norwegian verb.
  audio_target: Hei! Jeg heter Live.
  segments:
  - text_md: 'At a cooking class, Live meets Even: «Hei! Jeg '
  - blank_id: name-verb
    options:
    - heter
    - het
    - har
    answer_index: 0
  - text_md: ' Live.»'
  explanation_md: Jeg heter states the speaker's name.
  derived_from:
  - section_id: saying-your-name-with-jeg-heter
- handle: review_friendly_line
  op: recall_fill
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: Complete the friendly meeting line.
  audio_target: Hyggelig å møte deg.
  segments:
  - text_md: 'After introducing yourself, say: «Hyggelig å '
  - blank_id: friendly-verb
    options:
    - møte
    - heter
    - ha
    answer_index: 0
  - text_md: ' deg.»'
  explanation_md: Hyggelig å møte deg marks the meeting as friendly.
  derived_from:
  - section_id: marking-the-meeting-as-friendly
- handle: review_ask_name
  op: write
  objective: obj-greet-and-introduce-yourself-01
  bloom: apply
  prompt_md: You meet a new classmate at the language school. Ask for their name. Write only the question.
  response_language: 'no'
  judge_prompt: Check the response against the task and report evidence for each criterion.
  criteria:
  - id: asks-name
    instruction: Asks the other person's name in natural Norwegian.
  - id: taught-question-observation
    instruction: Observation, not gating — note whether the taught Hva heter du? form appears; do not
      fail a natural equivalent.
  derived_from:
  - section_id: asking-the-other-persons-name
- handle: review_closing_function
  op: choose
  objective: obj-greet-and-introduce-yourself-01
  bloom: understand
  prompt_md: What job does this line do?
  stem_md: 'At the end of a short conversation, a learner says: «Ha det bra!»'
  options:
  - id: close
    text: It closes the conversation.
    correct: true
    why: Ha det bra is a natural farewell and closes the conversation.
  - id: ask-name
    text: It asks for the other person's name.
    correct: false
    why: The line is a farewell, not a name question.
  - id: state-name
    text: It states the speaker's name.
    correct: false
    why: The line gives no name.
  derived_from:
  - section_id: closing-the-exchange
