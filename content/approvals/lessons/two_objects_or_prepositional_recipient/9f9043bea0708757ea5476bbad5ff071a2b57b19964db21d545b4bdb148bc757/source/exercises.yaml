- handle: choose_licensed_recipient_frame
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: "Velg den riktig bygde beskjeden."
  derived_from:
  - section_id: choosing-the-frame
  stem_md: "Oppgaver før møtet: Nora skal få nøkkelen. Jeg skal få bildet. Bruk først
    mønsteret uten til og deretter mønsteret med til."
  options:
  - id: wrong-first-frame
    text: Gi nøkkelen Nora, og send bildet til meg.
    correct: false
    why: Without til, the first clause puts the theme before the recipient.
  - id: both-licensed
    text: Gi Nora nøkkelen, og send bildet til meg.
    correct: true
    why: The first clause has recipient before theme; the second has theme
      before til + recipient.
  - id: til-before-theme
    text: Gi til Nora nøkkelen, og send bildet til meg.
    correct: false
    why: The first clause puts til + recipient before the theme.
  - id: recipient-first-with-til
    text: Gi Nora nøkkelen, og send til meg bildet.
    correct: false
    why: The second clause puts til + recipient before the theme.
  explanation_md: "Uten til står mottaker før tema. Med til står tema før til + mottaker."
