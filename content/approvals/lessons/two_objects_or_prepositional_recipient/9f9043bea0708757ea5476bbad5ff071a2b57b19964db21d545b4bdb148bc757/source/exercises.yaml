- handle: transfer_recipient_patterns_to_cafe_scene
  op: write
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: "Melding fra Emil: «Hei, Lea! Jeg glemte ryggsekken min på Kafé Sol. Kan du be den ansatte sende meg en melding? Send også telefonnummeret til meg. Den ansatte kan gi deg kvitteringen.» Skriv en melding til den ansatte. Opplys at du sender Emil telefonnummeret. Be den ansatte sende en melding om ryggsekken til Emil og gi deg kvitteringen. Bruk én setning med to objekter om telefonnummeret og én setning med til om meldingen."
  derived_from:
  - section_id: cumulative-transfer-a-forgotten-backpack
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: "Evaluate criteria cafe-message-purpose, cafe-transfer-facts, cafe-recipient-frames as gating criteria. Report a verdict and evidence for every criterion id."
  criteria:
  - id: cafe-message-purpose
    instruction: The response is a Norwegian message to the café employee that
      explains what must be returned or sent and to whom, and asks the employee
      to give the receipt to the writer.
  - id: cafe-transfer-facts
    instruction: The response accurately uses the supplied facts about the
      backpack, message, phone number, and receipt without requiring invented
      transfer details. Lea herself sends Emil the phone number; the employee sends
      Emil a message about the backpack and gives Lea the receipt.
  - id: cafe-recipient-frames
    instruction: The response explicitly demonstrates both a two-object frame for
      Lea sending Emil the phone number and a til-recipient frame for the employee
      sending the message about the backpack to Emil; pass only when the message
      shows who receives what in both frames.
- handle: recall_two_recipient_frames
  op: write
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: "En medelev gikk glipp av forklaringen om de to mønstrene for mottaker. Skriv et notat som forklarer begge. Bruk samme overføring i begge eksemplene: Læreren sender eleven et dokument, først uten til og deretter med til."
  derived_from:
  - section_id: short-review
  response_language: 'no'
  min_words: 20
  max_words: 40
  judge_prompt: "Evaluate criteria note-audience-purpose, two-object-pattern, til-pattern, same-transfer-two-frames. Report a verdict and evidence for every criterion id. Add no requirements beyond those criteria."
  criteria:
  - id: note-audience-purpose
    instruction: The response is a Norwegian study note that helps the classmate
      understand the two recipient patterns.
  - id: two-object-pattern
    instruction: The note explains or demonstrates that the recipient precedes
      the theme when til is absent.
  - id: til-pattern
    instruction: The note explains or demonstrates that the theme precedes til +
      recipient.
  - id: same-transfer-two-frames
    instruction: The examples preserve læreren as sender, eleven as recipient,
      and dokumentet as theme in both frames.
- handle: review_identify_recipient_theme
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: Hvem mottar bekreftelsen, og hva blir sendt?
  derived_from:
  - section_id: short-review
  stem_md: På hotellet sender resepsjonisten en bekreftelse til gjesten.
  options:
  - id: confirmation-recipient
    text: Mottaker = en bekreftelse; tema = gjesten.
    correct: false
    why: Dette bytter om på mottakeren og det som blir sendt.
  - id: receptionist-recipient
    text: Mottaker = resepsjonisten; tema = en bekreftelse.
    correct: false
    why: Resepsjonisten sender bekreftelsen, men mottar den ikke.
  - id: guest-recipient
    text: Mottaker = gjesten; tema = en bekreftelse.
    correct: true
    why: Gjesten mottar bekreftelsen.
  explanation_md: «Til gjesten» viser mottakeren; «en bekreftelse» er det som
    sendes.
- handle: review_order_without_til
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: "Velg det riktige svaret uten til."
  derived_from:
  - section_id: short-review
  stem_md: "Melding fra Sara: «Jeg trenger kartet før turen.» Svar: «Klart. Jeg sender
    …»"
  options:
  - id: til-recipient-theme
    text: til deg kartet i kveld.
    correct: false
    why: This adds til but leaves the marked recipient before the theme.
  - id: recipient-theme
    text: deg kartet i kveld.
    correct: true
    why: Without til, the recipient deg comes before the theme kartet.
  - id: theme-recipient
    text: kartet deg i kveld.
    correct: false
    why: This puts the theme before an unmarked recipient.
  explanation_md: "Uten til kommer sender, mottaker og tema i denne rekkefølgen."
- handle: review_order_with_til
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: "Velg det riktige svaret med til."
  derived_from:
  - section_id: short-review
  stem_md: "Melding fra Ali: «Kunden venter på kontrakten.» Svar: «Jeg sender …»"
  options:
  - id: til-recipient-theme
    text: til kunden kontrakten nå.
    correct: false
    why: This puts til + recipient before the theme.
  - id: recipient-til-theme
    text: kunden til kontrakten nå.
    correct: false
    why: This incorrectly marks the theme with til.
  - id: theme-til-recipient
    text: kontrakten til kunden nå.
    correct: true
    why: The theme kontrakten comes before til + recipient.
  explanation_md: "Med til står temaet før til + mottaker."
- handle: review_preserve_transfer_across_frames
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: "Velg setningen som beskriver den samme overføringen."
  derived_from:
  - section_id: short-review
  stem_md: "Utgangspunkt: «Vi gir barnet maten.» Skriv samme handling med til."
  options:
  - id: wrong-til-order
    text: Vi gir til barnet maten.
    correct: false
    why: This preserves the roles but puts til + recipient before the theme.
  - id: same-transfer
    text: Vi gir maten til barnet.
    correct: true
    why: Barnet remains the recipient, and maten remains the theme.
  - id: roles-reversed
    text: Vi gir barnet til maten.
    correct: false
    why: This marks maten as though it were the recipient.
  explanation_md: "Når vi bytter mønster, endres rekkefølgen, men ikke hvem som får
    hva."
- handle: review_choose_frame_from_context
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: "Velg svaret med til som har riktig ordstilling."
  derived_from:
  - section_id: short-review
  stem_md: "Nora: «Hva sender du til Dina?» Jonas: «Et kart.»"
  options:
  - id: mixed-order
    text: Jeg sender til Dina kartet først.
    correct: false
    why: «Kartet» er temaet, og «til Dina» er mottakeren. Med «til» står temaet først.
  - id: theme-first-til
    text: Jeg sender kartet til Dina først.
    correct: true
    why: Med «til» står temaet «adressen» før mottakeren.
  - id: recipient-first
    text: Jeg sender Dina kartet først.
    correct: false
    why: Her mangler «til», og mottakeren står før temaet.
  explanation_md: "Med til står temaet før til + mottaker."
