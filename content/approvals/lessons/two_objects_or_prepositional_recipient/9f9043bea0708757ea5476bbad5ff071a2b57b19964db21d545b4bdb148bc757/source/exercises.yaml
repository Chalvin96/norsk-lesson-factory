    text: Jonas gir Nora nøkkelen.
  - left_id: left-key-to-jonas
    text: Nora gir Jonas nøkkelen.
  right:
  - right_id: right-key-to-nora
    text: nøkkelen til Nora
  - right_id: right-key-to-jonas
    text: nøkkelen til Jonas
  pairs:
