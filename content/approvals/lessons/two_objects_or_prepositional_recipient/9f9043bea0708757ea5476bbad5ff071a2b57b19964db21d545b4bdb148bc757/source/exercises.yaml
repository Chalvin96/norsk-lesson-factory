- handle: notice_recipient_before_theme
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: "Velg den riktige beskrivelsen."
  derived_from:
  - section_id: two-participants-after-the-verb
  stem_md: På kontoret gir Jonas Nora nøkkelen. Jeg sender henne boka.
  options:
  - id: first-sentence-reversed
    text: Nora og boka er mottakere; nøkkelen og «henne» er temaer.
    correct: false
    why: Dette identifiserer rollene riktig bare i den første setningen.
  - id: second-sentence-reversed
    text: Nøkkelen og «henne» er mottakere; Nora og boka er temaer.
    correct: false
    why: Dette identifiserer rollene riktig bare i den andre setningen.
  - id: roles-correct
    text: Nora og henne er mottakere; nøkkelen og boka er temaer.
    correct: true
    why: Nora og «henne» mottar nøkkelen og boka.
  - id: roles-reversed
    text: Nora og henne er temaer; nøkkelen og boka er mottakere.
    correct: false
    why: Dette bytter om på personene som mottar noe, og tingene som blir gitt.
  explanation_md: "Nora får nøkkelen, og henne viser til personen som får boka."
- handle: match_roles_across_frames
  op: match_pairs
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: "Koble hver setning med to objekter til uttrykket med til som har samme
    mottaker og tema. Finn personen som får tingen, og tingen som overføres."
  explanation_md: "I setningen med to objekter står mottakeren før temaet. Med til
    kommer temaet før til + mottaker. Den som gir, gjentas ikke."
  derived_from:
