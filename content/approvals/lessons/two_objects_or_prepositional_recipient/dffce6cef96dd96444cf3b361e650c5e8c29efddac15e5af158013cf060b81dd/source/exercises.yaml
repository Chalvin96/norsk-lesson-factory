- handle: transfer_recipient_patterns_to_cafe_scene
  op: write
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: 'Message from Emil: Hei, Lea! Jeg glemte ryggsekken min på Kafé Sol. Kan du be den ansatte
    sende meg en melding? Send også telefonnummeret til meg. Den ansatte kan gi deg kvitteringen. Write
    a 25–45-word Norwegian message to the café employee explaining what must be returned or sent and to
    whom, and asking the employee to give you the receipt. Include both a sentence with two objects and
    a sentence using «til» to show who receives what.'
  derived_from:
  - section_id: cumulative-transfer-a-forgotten-backpack
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: Evaluate criteria cafe-message-purpose, cafe-transfer-facts, cafe-recipient-frames, and
    cafe-word-bound as gating criteria. Report a verdict and evidence for every criterion id.
  criteria:
  - id: cafe-message-purpose
    instruction: The response is a Norwegian message to the café employee that explains what must be returned
      or sent and to whom, and asks the employee to give the receipt to the writer.
  - id: cafe-transfer-facts
    instruction: The response accurately uses the supplied facts about the backpack, message, phone number,
      and receipt without requiring invented transfer details.
  - id: cafe-word-bound
    instruction: The response contains 25–45 words.
  - id: cafe-recipient-frames
    instruction: The response explicitly demonstrates both a two-object frame and a til-recipient frame,
      using the supplied facts; pass only when the message shows who receives what in both frames.
- handle: recall_two_recipient_frames
  op: write
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: 'Study note: A classmate missed the explanation of the two recipient patterns. Use one transfer:
    læreren sends eleven a document. Write a 20–40-word Norwegian note explaining both patterns and giving
    the transfer once without til and once with til.'
  derived_from:
  - section_id: short-review
  response_language: 'no'
  min_words: 20
  max_words: 40
  judge_prompt: Evaluate criteria note-audience-purpose, two-object-pattern, til-pattern, same-transfer-two-frames,
    and note-word-bound. Report a verdict and evidence for every criterion id. Add no requirements beyond
    those criteria.
  criteria:
  - id: note-audience-purpose
    instruction: The response is a Norwegian study note that helps the classmate understand the two recipient
      patterns.
  - id: two-object-pattern
    instruction: The note explains or demonstrates that the recipient precedes the theme when til is absent.
  - id: til-pattern
    instruction: The note explains or demonstrates that the theme precedes til + recipient.
  - id: same-transfer-two-frames
    instruction: The examples preserve læreren as sender, eleven as recipient, and dokumentet as theme
      in both frames.
  - id: note-word-bound
    instruction: The response contains 20–40 words.
- handle: review_identify_recipient_theme
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: Choose the correct role assignment.
  derived_from:
  - section_id: short-review
  stem_md: På hotellet Resepsjonisten sender en bekreftelse til gjesten.
  options:
  - id: confirmation-recipient
    text: Recipient = en bekreftelse; theme = gjesten.
    correct: false
    why: This reverses the receiver and the thing sent.
  - id: receptionist-recipient
    text: Recipient = resepsjonisten; theme = en bekreftelse.
    correct: false
    why: Resepsjonisten performs the sending rather than receiving the confirmation.
  - id: guest-recipient
    text: Recipient = gjesten; theme = en bekreftelse.
    correct: true
    why: Gjesten receives the confirmation.
  explanation_md: Til gjesten identifies the recipient; en bekreftelse is the theme.
- handle: review_order_without_til
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: Choose the correct reply without til.
  derived_from:
  - section_id: short-review
  stem_md: 'Melding fra Sara: Jeg trenger kartet før turen. You: Klart. Jeg sender …'
  options:
  - id: til-recipient-theme
    text: til deg kartet i kveld.
    correct: false
    why: This adds til but leaves the marked recipient before the theme.
  - id: recipient-theme
    text: deg kartet i kveld.
    correct: true
    why: Without til, the recipient deg comes before the theme kartet.
  - id: theme-recipient
    text: kartet deg i kveld.
    correct: false
    why: This puts the theme before an unmarked recipient.
  explanation_md: The frame without til is sender + recipient + theme.
- handle: review_order_with_til
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: Choose the correct reply with til.
  derived_from:
  - section_id: short-review
  stem_md: 'Melding fra Ali: Kunden venter på kontrakten. You: Jeg sender …'
  options:
  - id: til-recipient-theme
    text: til kunden kontrakten nå.
    correct: false
    why: This puts til + recipient before the theme.
  - id: recipient-til-theme
    text: kunden til kontrakten nå.
    correct: false
    why: This incorrectly marks the theme with til.
  - id: theme-til-recipient
    text: kontrakten til kunden nå.
    correct: true
    why: The theme kontrakten comes before til + recipient.
  explanation_md: The til frame places the theme before til + recipient.
- handle: review_preserve_transfer_across_frames
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: Choose the sentence that preserves the transfer.
  derived_from:
  - section_id: short-review
  stem_md: 'Source: Vi gir barnet maten. Rewrite the same event with til.'
  options:
  - id: wrong-til-order
    text: Vi gir til barnet maten.
    correct: false
    why: This preserves the roles but puts til + recipient before the theme.
  - id: same-transfer
    text: Vi gir maten til barnet.
    correct: true
    why: Barnet remains the recipient, and maten remains the theme.
  - id: roles-reversed
    text: Vi gir barnet til maten.
    correct: false
    why: This marks maten as though it were the recipient.
  explanation_md: Changing frames changes the order, not who receives what.
- handle: review_choose_frame_from_context
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: apply
  prompt_md: Choose the correctly ordered reply that uses til.
  derived_from:
  - section_id: short-review
  stem_md: 'Nora: Hva sender du først? Mari: Adressen. Jonas skal ha den.'
  options:
  - id: mixed-order
    text: Jeg sender til Jonas adressen først.
    correct: false
    why: This puts til + recipient before the theme.
  - id: theme-first-til
    text: Jeg sender adressen til Jonas først.
    correct: true
    why: With til, the theme adressen comes before til + recipient.
  - id: recipient-first
    text: Jeg sender Jonas adressen først.
    correct: false
    why: This omits til and puts the recipient before the theme.
  explanation_md: With til, the theme comes before til + recipient.
