  - left_id: left-email
    text: Vi sender kunden en e-post.
  right:
  - right_id: right-address
    text: Mari sender adressen til Jonas.
  - right_id: right-email
    text: Vi sender en e-post til kunden.
  - right_id: right-key
    text: Jonas gir nøkkelen til Nora.
  pairs:
  - left_id: left-key
    right_id: right-key
  - left_id: left-address
