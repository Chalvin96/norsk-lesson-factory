- handle: notice_recipient_before_theme
  op: choose
  objective: obj-two-objects-or-prepositional-recipient-01
  bloom: understand
  prompt_md: Choose the correct description.
  derived_from:
  - section_id: two-participants-after-the-verb
  stem_md: På kontoret Jonas gir Nora nøkkelen. Jeg sender henne boka.
  options:
  - id: first-sentence-reversed
    text: Nora and boka are recipients; nøkkelen and henne are themes.
    correct: false
    why: This identifies the roles correctly only in the second sentence.
  - id: second-sentence-reversed
    text: Nøkkelen and henne are recipients; Nora and boka are themes.
    correct: false
    why: This identifies the roles correctly only in the first sentence.
  - id: roles-correct
    text: Nora and henne are recipients; nøkkelen and boka are themes.
    correct: true
    why: Nora and henne receive the objects named by nøkkelen and boka.
  - id: roles-reversed
    text: Nora and henne are themes; nøkkelen and boka are recipients.
    correct: false
    why: This reverses the people receiving something and the things being transferred.
  explanation_md: Nora receives the key, and henne receives the book.
