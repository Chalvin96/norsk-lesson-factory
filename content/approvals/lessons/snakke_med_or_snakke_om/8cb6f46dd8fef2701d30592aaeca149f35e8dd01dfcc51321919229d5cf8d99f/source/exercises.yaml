- handle: retrieval_and_review
  op: write
  objective: obj-snakke-med-or-snakke-om-01
  bloom: apply
  prompt_md: 'Revisjonskort til en klassekamerat: 1. en setning med bare en samtalepartner 2. en setning
    med bare et tema 3. en setning med både partner og en person som tema 4. et spørsmål om hvem man snakker
    med 5. et spørsmål om hva eller hvem man snakker om Skriv fem norske linjer på til sammen 20–50 ord,
    og bruk snakke med og snakke om.'
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 20
  max_words: 50
  judge_prompt: Evaluate five-lines, partner-only-sentence, topic-only-sentence, combined-sentence, partner-question,
    topic-question, role-distinction, and word-bound as gating criteria.
  criteria:
  - id: five-lines
    instruction: The response contains five identifiable Norwegian lines in the requested order.
  - id: partner-only-sentence
    instruction: Line 1 uses snakke med to name only a conversation partner.
  - id: topic-only-sentence
    instruction: Line 2 uses snakke om to name only a topic.
  - id: combined-sentence
    instruction: Line 3 uses snakke med ... om ... with a partner and a person as the topic.
  - id: partner-question
    instruction: Line 4 asks who participates by using hvem ... med.
  - id: topic-question
    instruction: Line 5 asks what or whom is discussed by using hva/hvem ... om.
  - id: role-distinction
    instruction: The five lines consistently distinguish a participant from a topic.
  - id: word-bound
    instruction: The complete response contains 20–50 words.
