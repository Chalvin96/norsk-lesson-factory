- handle: third_checkpoint_ask_right_question
  op: write
  objective: obj-snakke-med-or-snakke-om-01
  bloom: apply
  prompt_md: 'Melding fra Mina: «Jeg snakker med noen om rommet. Jonas snakker med Ingrid om noe annet.»
    Svar Mina med to spørsmål for å finne samtalepartneren hennes og temaet til Jonas. Skriv 8–20 ord.'
  derived_from:
  - section_id: third-checkpoint-ask-the-right-question
  response_language: 'no'
  min_words: 8
  max_words: 20
  judge_prompt: Evaluate partner-question-form, topic-question-form, and word-bound as gating criteria.
    Record partner-information-observation and topic-information-observation diagnostically; an observation
    must not make an otherwise successful answer fail.
  criteria:
  - id: partner-question-form
    instruction: The reply asks who Mina is speaking with using a natural hvem ... med pattern.
  - id: topic-question-form
    instruction: The reply asks what or whom Jonas is discussing using a natural hva/hvem ... om pattern.
  - id: word-bound
    instruction: The complete reply contains 8–20 words.
  - id: partner-information-observation
    instruction: Observe whether the reply asks Mina who her conversation partner is; this is diagnostic
      only.
  - id: topic-information-observation
    instruction: Observe whether the reply asks what or whom Jonas is discussing; this is diagnostic only.
