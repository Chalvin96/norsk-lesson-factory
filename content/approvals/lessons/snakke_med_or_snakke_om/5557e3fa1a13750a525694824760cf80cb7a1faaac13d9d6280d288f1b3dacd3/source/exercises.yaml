- handle: full_response_role_discrimination
  op: choose
  objective: obj-snakke-med-or-snakke-om-01
  bloom: apply
  prompt_md: "Choose the reply that correctly says who Erik will talk to and what the conversation will be about."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lederen
      text_md: «Kan du snakke med Erik om budsjettet etter møtet?»
    - speaker: Kollegaen
      text_md: «Hva skal du gjøre etter møtet?»
  options:
  - id: topic-erik-partner-budget
    text: Jeg skal snakke om Erik og budsjettet etter møtet.
    correct: false
    why: "This reverses the roles: Erik is the conversation partner, while both Erik and the budget are presented as topics."
  - id: both-as-topics
    text: Jeg skal snakke om Erik samt budsjettet etter møtet.
    correct: false
    why: This reports both Erik and the budget as topics instead of making Erik the conversation partner.
  - id: erik-only
    text: Jeg skal snakke med Erik, men ikke om budsjettet.
    correct: false
    why: This identifies the conversation partner but leaves out the required subject.
  - id: partner-erik-topic-budget
    text: Jeg skal snakke med Erik etter møtet om budsjettet.
    correct: true
    why: Erik will participate in the conversation, and the budget will be its subject.
  derived_from:
  - section_id: compare-the-meanings
