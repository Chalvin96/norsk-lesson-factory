- handle: review_discriminate_complete_message
  op: choose
  objective: obj-report-workplace-absence-01
  bloom: apply
  prompt_md: Choose the message that is ready to send.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Til: Maja, butikksjef Fakta: Du kan ikke arbeide mandag. Du blir borte hele dagen. Du
        ringer Maja senest klokka 14.00 om tirsdag.'
  derived_from:
  - section_id: sec-final-retrieval-and-review
  stem_md: Which message communicates the absence, timing, and next contact?
  options:
  - id: wrong-day
    text: Jeg kan ikke komme på jobb tirsdag og blir borte hele dagen. Jeg ringer deg innen klokka to.
    correct: false
    why: This changes the absence from Monday to Tuesday.
  - id: all-three
    text: Jeg kan ikke komme på jobb mandag og blir borte hele dagen. Jeg ringer deg innen klokka to om
      tirsdag.
    correct: true
    why: This includes the Monday absence, its duration, and the promised deadline for the next contact.
  - id: missing-duration
    text: Jeg kan ikke komme på jobb mandag. Jeg ringer deg innen klokka to om tirsdag.
    correct: false
    why: This omits the known fact that the absence lasts all day.
  - id: vague-contact
    text: Jeg kan ikke komme på jobb mandag og blir borte hele dagen. Jeg ringer deg senere.
    correct: false
    why: This makes the next contact vague instead of preserving the two o'clock deadline.
  explanation_md: The ready-to-send message preserves every supplied fact without leaving the manager
    to ask when or what happens next.
