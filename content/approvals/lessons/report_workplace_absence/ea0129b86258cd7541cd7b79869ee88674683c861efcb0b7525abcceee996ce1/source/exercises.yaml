- handle: notice_resolved_handover
  op: choose
  objective: obj-report-workplace-absence-01
  bloom: understand
  prompt_md: Choose the reply that resolves the urgent task.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Klokka 10.00: Sara skulle lede et kundemøte. Nora kan lede møtet. Nora har fått notatene.'
  derived_from:
  - section_id: sec-arranging-a-handover
  stem_md: Which reply gives Henrik a complete handover?
  options:
  - id: task-only
    text: Jeg har et kundemøte klokka ti.
    correct: false
    why: This identifies the urgent task but does not say who will handle it.
  - id: person-only
    text: Nora er på jobb i dag.
    correct: false
    why: This identifies an available colleague but does not assign the meeting.
  - id: notes-only
    text: Notatene er ferdige.
    correct: false
    why: This describes the notes but does not resolve responsibility for the meeting.
  - id: resolved
    text: Nora kan ta kundemøtet, og hun har fått notatene.
    correct: true
    why: This names the replacement, the task, and access to the needed information.
  explanation_md: A useful handover says what will happen to the task, not only that the task exists.
