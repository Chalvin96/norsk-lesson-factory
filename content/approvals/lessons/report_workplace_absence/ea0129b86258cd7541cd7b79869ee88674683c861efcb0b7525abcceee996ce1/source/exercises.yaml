- handle: discriminate_complete_absence_message
  op: choose
  objective: obj-report-workplace-absence-01
  bloom: apply
  prompt_md: Choose the message that gives the manager all required information.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Torsdag morgen: Emil kan ikke arbeide torsdag. Han blir borte hele dagen. Lise kan ta
        imot leveransen.'
  derived_from:
  - section_id: sec-practice-build-a-message-in-stages
  stem_md: Which message clearly covers the absence, timing, and handover?
  options:
  - id: no-duration
    text: Jeg kan ikke komme på jobb på torsdag. Lise kan ta imot leveransen.
    correct: false
    why: This gives the day and handover but omits the known full-day duration.
  - id: no-absence
    text: Leveransen kommer på torsdag. Lise kan ta imot den.
    correct: false
    why: This gives the delivery handover but does not state Emil's absence or how long it lasts.
  - id: unresolved-task
    text: Jeg kan ikke komme på jobb på torsdag og blir borte hele dagen. Det kommer en levering.
    correct: false
    why: This mentions the delivery but does not say who will receive it.
  - id: complete
    text: Jeg kan ikke komme på jobb på torsdag og blir borte hele dagen. Lise kan ta imot leveransen.
    correct: true
    why: This covers the absence, its full-day timing, and the practical handover.
  explanation_md: A complete message lets the manager understand what is happening, when it applies, and
    what happens next.
- handle: add_next_contact_to_staged_message
  op: write
  objective: obj-report-workplace-absence-01
  bloom: apply
  prompt_md: 'Til: Emils leder Fakta: Emil kan ikke komme på jobb torsdag. Han blir borte hele dagen.
    Han vet ikke om han kan arbeide fredag. Han sender svar senest torsdag klokka 16.00. Write a concise
    Norwegian workplace message using the facts.'
  derived_from:
  - section_id: sec-practice-build-a-message-in-stages
  response_language: 'no'
  min_words: 15
  max_words: 35
  judge_prompt: Evaluate criteria emil-absence, emil-timing, and emil-next-contact from the visible task.
    Record emil-wording-observation diagnostically; it must not affect the pass result. Accept equivalent
    natural Bokmål and one or more short sentences.
  criteria:
  - id: emil-absence
    instruction: States that Emil cannot come to work on Thursday.
  - id: emil-timing
    instruction: States that Emil will be away all day Thursday.
  - id: emil-next-contact
    instruction: States that Emil will provide an update by four on Thursday about Friday.
  - id: emil-wording-observation
    instruction: Records whether the message uses a clear workplace-absence expression such as «kan ikke
      komme på jobb»; this criterion is diagnostic only.
