- handle: notice_contact_deadline
  op: choose
  objective: obj-report-workplace-absence-01
  bloom: understand
  prompt_md: Choose the promise that gives Henrik a deadline.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Tirsdag morgen: Sara vet ikke om hun kan arbeide onsdag. Henrik trenger svar senest klokka
        15.00 tirsdag.'
  derived_from:
  - section_id: sec-saying-what-happens-next
  stem_md: "Which reply promises an update no later than three without setting an exact time?"
  options:
  - id: at-three
    text: Jeg gir deg beskjed klokka tre.
    correct: false
    why: This promises contact at exactly three rather than no later than three.
  - id: later
    text: Jeg gir deg beskjed senere.
    correct: false
    why: This promises contact but gives no useful deadline.
  - id: tomorrow
    text: Jeg gir deg beskjed i morgen.
    correct: false
    why: This places the update after Henrik's Tuesday deadline.
  - id: by-three
    text: Jeg gir deg beskjed innen klokka tre.
    correct: true
    why: This names the contact action and sets three o'clock as the latest time.
  explanation_md: Innen klokka tre means that the update will arrive no later than three.
