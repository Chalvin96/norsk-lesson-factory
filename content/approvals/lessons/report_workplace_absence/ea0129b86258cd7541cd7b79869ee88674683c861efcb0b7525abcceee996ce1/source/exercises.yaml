- handle: identify_central_message
  op: choose
  objective: obj-report-workplace-absence-01
  bloom: understand
  prompt_md: Choose the sentence that states both Sara's absence and when it applies.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Tirsdag klokka 07.15 sier Sara: «Hei, Henrik. Det er Sara. Jeg er dessverre syk og kan
        ikke komme på jobb i dag.»'
  derived_from:
  - section_id: sec-essential-absence-message
  stem_md: Which option captures the key information in Sara's message?
  options:
  - id: absent-unknown
    text: Sara må holde seg hjemme fra arbeid.
    correct: false
    why: This states the absence, but leaves its timing unclear.
  - id: absent-tomorrow
    text: Sara blir hjemme fra arbeid onsdag.
    correct: false
    why: This changes the absence from today to Wednesday.
  - id: central-today
    text: Sara kan ikke komme på jobb tirsdag.
    correct: true
    why: Sara says she cannot come to work today, which is Tuesday in the stated context.
  - id: sick-today
    text: Sara kommer på jobb senere denne tirsdagen.
    correct: false
    why: This says Sara will attend later that day rather than that she will be absent.
  explanation_md: The central message combines the absence with the day it applies.
- handle: notice_timing_contrast
  op: choose
  objective: obj-report-workplace-absence-01
  bloom: understand
  prompt_md: Choose the sentence that gives the useful timing.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: 'Onsdag lager lederen vaktplanen for torsdag: Emil kan ikke arbeide noen del av vakten 08.00–16.00.'
  derived_from:
  - section_id: sec-giving-useful-timing
  stem_md: Which sentence tells the manager how long Emil will be absent?
  options:
  - id: daytime
    text: Jeg blir borte på dagen.
    correct: false
    why: This describes a general part of the day rather than identifying the Thursday shift.
  - id: whole-day
    text: Jeg blir borte hele dagen på torsdag.
    correct: true
    why: This covers the full Thursday shift.
  - id: today
    text: Jeg blir borte hele dagen i dag.
    correct: false
    why: This changes the stated day from Thursday to today.
  - id: after-lunch
    text: Jeg kommer på jobb etter lunsj.
    correct: false
    why: This says Emil will attend part of the shift.
  explanation_md: Useful timing identifies both the relevant day and the known duration.
