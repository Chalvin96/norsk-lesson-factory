- handle: present_relevance_choice
  op: choose
  objective: obj-present-perfect-01
  bloom: analyze
  prompt_md: 'Read the four Norwegian lines. Choose the pair where the present perfect fits: the result or experience matters now, not just at a finished time.'
  derived_from:
  - section_id: sec-present-relevance-finished-occasion
  stimulus:
  - kind: dialogue
    turns:
    - speaker: A
      text_md: «Jeg har kjøpt kaffe, så vi kan lage kaffe nå.»
    - speaker: B
      text_md: «Jeg har kjøpt kaffe i går.»
    - speaker: C
      text_md: «Har du sett den filmen?»
    - speaker: D
      text_md: «Så du den filmen på fredag?»
  options:
  - id: finished-pair
    text: B og D
    correct: false
    why: >-
      D correctly uses the simple past for a finished occasion, but B combines har with the finished-time
      expression i går.
  - id: current-or-experience
    text: A og C
    correct: true
    why: A reports a result that matters now, and C asks about experience without naming a finished occasion.
  - id: mixed-pair
    text: A og B
    correct: false
    why: >-
      A is present-relevant, but B combines har with the finished-time expression i går.
