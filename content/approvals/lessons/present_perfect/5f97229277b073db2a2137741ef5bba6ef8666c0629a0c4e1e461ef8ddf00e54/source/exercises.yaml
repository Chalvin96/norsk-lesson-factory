- handle: current_result_connection
  op: choose
  objective: obj-present-perfect-01
  bloom: understand
  prompt_md: 'Read the three sentences. Choose the Norwegian paraphrase that keeps the meaning.'
  derived_from:
  - section_id: sec-completed-action-result-now
  stem_md: 'Jeg har mistet nøkkelen. Vi har laget middag. Jeg har lest boka, så du kan låne den.'
  options:
  - id: future-shift
    text: Nøkkelen blir borte, middagen blir klar, og boka skal lånes.
    correct: false
    why: These forms move the statements to the future instead of keeping the result that already holds.
  - id: past-only
    text: Nøkkelen var borte, middagen var klar, og boka kunne lånes.
    correct: false
    why: These past forms describe only a finished past and lose the result that the present perfect keeps.
  - id: present-result
    text: Nøkkelen er borte, middagen er klar, og boka kan lånes.
    correct: true
    why: The present forms keep the result that the present perfect points to.
