- handle: final_present_perfect_retrieval
  op: write
  objective: obj-present-perfect-01
  bloom: apply
  prompt_md: Without looking back, write one short Norwegian sentence for each new situation. 1. Ida cleaned
    the community hall floor earlier today, and it is clean now. 2. Mina has never taken the night train.
    3. Lina started speaking Norwegian at work six months ago and still does. Use har plus a suitable
    past participle in each sentence to show the connection to the present. Write the forms yourself;
    do not copy a model sentence.
  derived_from:
  - section_id: sec-retrieval-review
  response_language: 'no'
  min_words: 15
  max_words: 55
  judge_prompt: Check three natural Norwegian present-perfect sentences against the three supplied situations.
    Require har with an appropriate past participle in each, a present result for the cleaned floor, experience
    up to now for the night train, and a continuing situation lasting six months for speaking Norwegian
    at work. Accept natural lexical and word-order variants without requiring an exact model sentence.
  criteria:
  - id: present-result
    instruction: Uses har plus a suitable past participle to say Ida cleaned the community hall floor
      and it is clean now.
  - id: experience
    instruction: Uses har plus a suitable past participle to express that Mina has never taken the night
      train as experience up to now.
  - id: continuing-situation
    instruction: Uses har plus a suitable past participle and a six-month duration to express that Lina
      still speaks Norwegian at work.
  - id: complete-form-and-meaning
    instruction: Writes three complete Norwegian sentences whose tense and time meanings fit the supplied
      situations.
