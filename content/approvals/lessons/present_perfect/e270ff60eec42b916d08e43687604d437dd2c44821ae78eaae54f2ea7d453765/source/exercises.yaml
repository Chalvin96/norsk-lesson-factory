- handle: present_relevance_choice
  op: choose
  objective: obj-present-perfect-01
  bloom: analyze
  prompt_md: Read the four Norwegian lines and choose the pair that uses the present perfect appropriately.
  derived_from:
  - section_id: sec-present-relevance-finished-occasion
  stimulus:
  - kind: dialogue
    turns:
    - speaker: A
      text_md: «Jeg har kjøpt kaffe, så vi kan lage kaffe nå.»
    - speaker: B
      text_md: «Jeg kjøpte kaffe i går.»
    - speaker: C
      text_md: «Har du sett den filmen?»
    - speaker: D
      text_md: «Så du den filmen på fredag?»
  options:
  - id: finished-pair
    text: B og D
    correct: false
    why: Both lines locate events in finished past time and use the simple past.
  - id: current-or-experience
    text: A og C
    correct: true
    why: A reports a result that matters now, and C asks about experience without naming a finished occasion.
  - id: mixed-pair
    text: A og D
    correct: false
    why: D names the finished occasion på fredag and therefore uses the simple past.
