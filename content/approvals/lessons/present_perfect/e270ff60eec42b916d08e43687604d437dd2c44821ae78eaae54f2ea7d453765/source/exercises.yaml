  - id: yesterday
    text: Brunostspørsmål med en bestemt gårsdag
    correct: false
    why: Spørsmålet viser til én bestemt, avsluttet anledning.
  - id: experience
    text: Brunostspørsmål uten bestemt tidspunkt
    correct: true
    why: Spørsmålet nevner ingen avsluttet anledning og spør om erfaring.
