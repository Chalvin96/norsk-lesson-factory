- handle: meaning_contrast_selection
  op: choose
  objective: obj-verb-complementation-01
  bloom: analyze
  prompt_md: "Velg setningen som gjengir Minas to ønsker riktig."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Jeg vil gjerne dra på fredag.»
    - speaker: Mina
      text_md: «Det hadde vært fint om Leo dro den dagen også.»
  derived_from:
  - section_id: compare-complements
  options:
  - id: leo-twice
    text: «Mina håper at Leo reiser fredag, og Leo håper å reise fredag.»
    correct: false
    why: This changes both who is expected to make the first journey and whose hope the second statement reports.
  - id: both-travelers
    text: «Mina håper å reise fredag, og hun håper at Leo reiser fredag.»
    correct: true
    why: The å-infinitive presents Mina's hoped-for action, while the at-clause explicitly assigns the other trip to Leo.
  - id: mina-twice
    text: «Mina håper å reise fredag, og Leo håper at Mina reiser fredag.»
    correct: false
    why: This changes whose hope the second statement reports.
