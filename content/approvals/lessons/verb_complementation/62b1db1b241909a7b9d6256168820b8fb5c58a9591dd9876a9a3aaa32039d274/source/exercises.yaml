- handle: scene_relationship_check
  op: choose
  objective: obj-verb-complementation-01
  bloom: understand
  prompt_md: "Velg tolkningen som passer til dialogen."
  derived_from:
  - section_id: weekend-deadline
  stem_md: 'Mina: «Jeg håper å bli med på hytta.» Erik: «Sjefen sier at vi må levere rapporten fredag.» Mina: «Da bør du begynne å pakke.»'
  options:
  - id: all-mina
    text: '«Jeg håper å bli med på hytta» — Mina is understood to come; «vi må levere rapporten fredag» — vi must submit it; «du bør begynne å pakke» — Mina is addressed and should pack.'
    correct: false
    why: The quoted pronoun du addresses Erik, not Mina.
  - id: all-erik
    text: '«Jeg håper å bli med på hytta» — Erik is understood to come; «vi må levere rapporten fredag» — vi must submit it; «du bør begynne å pakke» — Erik is addressed and should pack.'
    correct: false
    why: Mina says the first-person jeg, so Erik is not the person who hopes to come.
  - id: same-person-and-clause
    text: '«Jeg håper å bli med på hytta» — Mina is understood to come; «vi må levere rapporten fredag» — vi must submit it; «du bør begynne å pakke» — Erik is addressed and should pack.'
    correct: true
    why: The å-infinitive links bli to Mina, the at-clause states vi, and du refers to Erik.
- handle: same_person_infinitive_recognition
  op: choose
  objective: obj-verb-complementation-01
  bloom: understand
  prompt_md: 'For hvert utsagn: Finn den underforståtte personen etter å, og avgjør om leddet er en å-infinitiv eller en fullstendig at-setning.'
  derived_from:
  - section_id: a-infinitive
  stem_md: 'Erik håper å bli med. Mina planlegger å reise på fredag. Jeg håper at Mina reiser på fredag. Jeg tror at jeg forstår.'
  options:
  - id: speaker
    text: '«Erik håper å bli med» — Erik er underforstått som den som blir med i en å-infinitiv; «Mina planlegger å reise på fredag» — Mina er underforstått som den som reiser i en å-infinitiv; «Jeg håper at Mina reiser på fredag» — Mina er uttrykt som subjekt i en fullstendig at-setning; «Jeg tror at jeg forstår» — jeg er uttrykt som subjekt i en fullstendig at-setning.'
    correct: true
    why: I de to første setningene forstås subjektet til infinitiven ut fra personen knyttet til hovedverbet. At-setningene har hvert sitt uttrykte subjekt.
  - id: listener
    text: '«Erik håper å bli med» — Erik er uttrykt i en fullstendig at-setning; «Mina planlegger å reise på fredag» — Mina er uttrykt i en fullstendig at-setning; «Jeg håper at Mina reiser på fredag» — Mina står i en å-infinitiv; «Jeg tror at jeg forstår» — jeg står i en å-infinitiv.'
    correct: false
    why: De to første setningene har ikke et uttrykt subjekt etter å. Hovedverbet angir hvem som utfører handlingen.
  - id: earlier-person
    text: '«Erik håper å bli med» — Erik er underforstått som den som blir med i en å-infinitiv; «Mina planlegger å reise på fredag» — Mina er underforstått som den som reiser i en å-infinitiv; «Jeg håper at Mina reiser på fredag» — jeg er uttrykt som subjekt i en fullstendig at-setning; «Jeg tror at jeg forstår» — jeg er uttrykt som subjekt i en fullstendig at-setning.'
    correct: false
    why: I «Jeg håper at Mina reiser» er Mina subjektet i at-setningen; i «Jeg tror at jeg forstår» er jeg subjektet.
