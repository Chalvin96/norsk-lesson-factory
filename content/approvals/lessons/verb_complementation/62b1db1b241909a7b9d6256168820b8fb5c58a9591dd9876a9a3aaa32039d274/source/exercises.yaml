- handle: dinner_plan_transfer
  op: write
  objective: obj-verb-complementation-01
  bloom: apply
  prompt_md: "Skriv en oppdatering på norsk til vennegjengen ut fra notatene: Nora har ansvar for middagen klokka 19. Jonas er på jobb til klokka 18. Gjestebidrag: brød eller salat. Bruk setningsmønstre fra leksjonen til å beskrive planen, gjengi opplysningen fra Jonas og si hva gjestene kan gjøre."
  min_words: 45
  max_words: 65
  explanation_md: "Velg leddsetningsmønstre som passer naturlig til opplysningene og formålet."
  derived_from:
  - section_id: transfer-everyday-situation
  response_language: 'no'
  judge_prompt: "Evaluate dinner-facts, audience-purpose, a-infinitive, content-clause, and modal-bare-infinitive as gating criteria. Accept natural Bokmål wording and equivalent phrases that preserve the requested meanings and complement structures."
  criteria:
  - id: dinner-facts
    instruction: The message communicates the dinner time, Jonas's work end time, and what the guests may bring.
  - id: audience-purpose
    instruction: The response is a coherent update addressed appropriately to the friend group.
  - id: a-infinitive
    instruction: Uses a natural å-infinitive with å followed by an infinitive to express Nora's dinner plan.
  - id: content-clause
    instruction: Uses a finite content clause to report Jonas's working hours, with an explicit subject and finite verb. Accept natural use or omission of at.
  - id: modal-bare-infinitive
    instruction: Uses a modal followed directly by a bare infinitive to say what the guests may bring.
