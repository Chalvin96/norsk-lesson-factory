- handle: reply_to_nora_about_the_delay
  op: write
  objective: obj-fronting-and-v2-inversion-01
  bloom: apply
  prompt_md: '**Melding fra Nora:** «Hvor er du? Skal jeg åpne reparasjonskafeen alene?» **Fakta:** Bussen
    kom ikke. Neste buss går klokka 09.20. Du kommer klokka ti hvis bussen er i rute. Svar Nora på norsk
    i 35–50 ord, og ta med alle faktaene: at «Bussen kom ikke», når neste buss går, når du kommer, spør
    «Kan du åpne uten meg?», og start minst én hovedsetning med et tids- eller kondisjonsuttrykk slik
    at det finitte verbet står foran subjektet.'
  explanation_md: A useful reply answers Nora with the supplied facts. Fronted time or condition expressions
    should demonstrate V2, with the finite verb before the subject, and subordinate clauses should keep
    the subject before the finite verb.
  derived_from:
  - section_id: back-at-the-repair-cafe
  response_language: 'no'
  judge_prompt: Check the response against reply-purpose, supplied-facts, norwegian-response, word-bound,
    and v2-and-boundary-observation. Report v2-and-boundary-observation separately, but make it a required
    criterion.
  criteria:
  - id: reply-purpose
    instruction: The response is a reply to Nora that explains the delay and gives the plan.
  - id: supplied-facts
    instruction: 'The response conveys the delay and the plan: that «Bussen kom ikke», when the next bus
      leaves, when the learner arrives, and asks «Kan du åpne uten meg?»'
  - id: norwegian-response
    instruction: The response is understandable Norwegian.
  - id: word-bound
    instruction: The response contains 35–50 words.
  - id: v2-and-boundary-observation
    instruction: The response starts at least one main clause with a time or condition expression, placing
      its finite verb before its subject.
