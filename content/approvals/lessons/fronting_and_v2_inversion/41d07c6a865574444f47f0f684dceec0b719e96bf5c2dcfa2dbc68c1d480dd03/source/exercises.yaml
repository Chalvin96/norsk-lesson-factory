- handle: reply_to_nora_about_the_delay
  op: write
  objective: obj-fronting-and-v2-inversion-01
  bloom: apply
  prompt_md: '**Melding fra Nora:** «Hvor er du? Skal jeg åpne reparasjonskafeen alene?» **Fakta:** Bussen kom ikke. Neste buss går klokka 09.20. Du kommer klokka ti hvis bussen er i rute. Svar Nora på norsk i 35–50 ord. Ta med alle faktaene, spør «Kan du åpne uten meg?», og begynn minst én hovedsetning med et tids- eller vilkårsuttrykk.'
  explanation_md: 'Et godt svar til Nora bruker de oppgitte faktaene. Når et tids- eller vilkårsuttrykk står først i hovedsetningen, kommer det finitte verbet foran subjektet. Leddsetninger beholder subjektet foran det finitte verbet.'
  derived_from:
  - section_id: back-at-the-repair-cafe
  response_language: 'no'
  judge_prompt: Check the response against reply-purpose, supplied-facts, conditional-arrival, norwegian-response, word-bound, and v2-and-boundary-observation. Treat every listed criterion as required and accept natural Norwegian wording for the condition.
  criteria:
  - id: reply-purpose
    instruction: The response is a reply to Nora that explains the delay and gives the plan.
  - id: supplied-facts
    instruction: 'The response conveys the delay and the plan: that «Bussen kom ikke», when the next bus leaves, when the learner arrives, and asks «Kan du åpne uten meg?»'
  - id: conditional-arrival
    instruction: States that the speaker arrives at ten if the bus is on schedule, using a natural subordinate condition such as hvis bussen er i rute. Do not require the stronger meaning only if.
  - id: norwegian-response
    instruction: The response is understandable Norwegian.
  - id: word-bound
    instruction: The response contains 35–50 words.
  - id: v2-and-boundary-observation
    instruction: The response starts at least one main clause with a time or condition expression, placing its finite verb before its subject.
