- handle: notice_v2_in_the_cafe
  op: choose
  objective: obj-fronting-and-v2-inversion-01
  bloom: understand
  prompt_md: 'Les hovedsetningene. Velg analysen som identifiserer hvert foranstilt ledd, finitt verb og subjekt riktig.'
  stem_md: '**Oppdatering fra verkstedet** 1. På tirsdag åpner Sara verkstedet. 2. I foajeen kan Omar vente.'
  options:
  - id: identify-v2-roles
    text: 1. Foranstilt ledd «På tirsdag»; finitt verb «åpner»; subjekt «Sara». 2. Foranstilt ledd «I foajeen»; finitt verb «kan»; subjekt «Omar».
    correct: true
    why: Begge setningene begynner med et tids- eller stedsuttrykk, fulgt av det finitte verbet og subjektet.
  - id: subject-as-fronted
    text: 1. Foranstilt ledd «Sara»; finitt verb «åpner»; subjekt «På tirsdag». 2. Foranstilt ledd «Omar»; finitt verb «kan»; subjekt «I foajeen».
    correct: false
    why: Sara og Omar er subjektene; tids- og stedsuttrykkene står først.
  - id: infinitive-as-finite
    text: 1. Foranstilt ledd «På tirsdag»; finitt verb «åpner»; subjekt «Sara». 2. Foranstilt ledd «I foajeen»; finitt verb «vente»; subjekt «Omar».
    correct: false
    why: «Kan» er det finitte modalverbet; «vente» står i infinitiv.
  explanation_md: 'Et foranstilt tids- eller stedsuttrykk står først, deretter kommer det finitte verbet og subjektet. Med modalverb står infinitiven senere i setningen.'
  derived_from:
  - section_id: central-pattern
