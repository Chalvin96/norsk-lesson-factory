- handle: notice_v2_in_the_cafe
  op: choose
  objective: obj-fronting-and-v2-inversion-01
  bloom: understand
  prompt_md: Read both main clauses and choose the analysis that correctly identifies each fronted phrase,
    finite verb, and subject.
  stem_md: '**Workshop update** 1. På tirsdag åpner Sara verkstedet. 2. I foajeen kan Omar vente.'
  options:
  - id: identify-v2-roles
    text: 1. Fronted phrase «På tirsdag»; finite verb «åpner»; subject «Sara». 2. Fronted phrase «I foajeen»; finite verb «kan»; subject «Omar».
    correct: true
    why: Each clause begins with a time or place phrase, followed by the finite verb and then the subject.
  - id: subject-as-fronted
    text: 1. Fronted phrase «Sara»; finite verb «åpner»; subject «På tirsdag». 2. Fronted phrase «Omar»; finite verb «kan»; subject «I foajeen».
    correct: false
    why: Sara and Omar are the subjects; the time and place expressions are fronted.
  - id: infinitive-as-finite
    text: 1. Fronted phrase «På tirsdag»; finite verb «åpner»; subject «Sara». 2. Fronted phrase «I foajeen»; finite verb «vente»; subject «Omar».
    correct: false
    why: «Kan» is the finite modal verb; «vente» is the infinitive.
  explanation_md: A fronted time or place phrase takes the first position, followed by the finite verb and
    then the subject. With a modal, the infinitive remains later in the clause.
  derived_from:
  - section_id: central-pattern
