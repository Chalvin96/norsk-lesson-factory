- handle: review_complete_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "Write a short dialogue in Norwegian with a neighbor about a shared problem in the building. Include a fact you can observe, a practical result, and one suitable request. Have the neighbor agree there is a problem and promise one clear action. Then confirm the action. Write five natural lines. Include the fact, result, request, reply, and confirmation."
  response_language: 'no'
  judge_prompt: Check that the dialogue includes an observable fact about a shared building problem, a practical effect, a proportionate request, the neighbor’s acknowledgment and agreement to a specific action, and confirmation of that action. Accept natural Bokmål variants.
  criteria:
  - id: elevator-fact
    instruction: Includes an observable fact about a shared problem in the building.
  - id: elevator-effect
    instruction: Includes one practical effect of the problem.
  - id: elevator-request
    instruction: Includes one proportionate request addressing the problem.
  - id: elevator-acknowledgment-action
    instruction: Includes the neighbor’s acknowledgment and agreement to take one specific action.
  - id: elevator-confirmation
    instruction: Confirms the neighbor’s specific agreed action.
  derived_from:
  - section_id: final-retrieval-review
