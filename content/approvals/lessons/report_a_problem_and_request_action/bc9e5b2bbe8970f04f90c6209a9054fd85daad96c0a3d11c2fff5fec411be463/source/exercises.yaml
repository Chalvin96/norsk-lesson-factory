- handle: find_factual_core
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "Write one short sentence in Norwegian about the hotel room window that will not close. Say only what you can see. Do not blame anyone or guess the cause."
  response_language: 'no'
  judge_prompt: Check that the sentence naturally describes the hotel-room window as impossible to close,
    without blame or speculation. Accept natural Bokmål variants.
  criteria:
  - id: factual-window-report
    instruction: Describes the hotel-room window itself as impossible to close, without blame or a guessed
      cause.
  derived_from:
  - section_id: observable-facts
- handle: connect_problem_to_effect
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "A delivered box has a broken bottle inside, and liquid has damaged the other goods. Write two short sentences in Norwegian: first a fact you can observe, then a practical result. Keep the facts clear and link them."
  response_language: 'no'
  judge_prompt: Check that the response contains two distinct, natural Bokmål sentences in the requested
    order. The first must report an observable condition without speculation. The second must state a
    practical consequence connected to that condition. Accept equivalent factual descriptions and plausible
    practical effects.
  criteria:
  - id: observable-fact-first
    instruction: States only an observable fact about the broken bottle or liquid damage in the first
      sentence.
  - id: practical-effect-second
    instruction: Describes one practical effect in the second sentence.
  - id: distinct-clear-connection
    instruction: Keeps fact and effect distinct while making their connection clear.
  derived_from:
  - section_id: explain-effect
- handle: add_suitable_request
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "The hotel room window will not close, and the room is getting cold. Write one polite request to the hotel for a clear way to fix the problem."
  response_language: 'no'
  judge_prompt: Check for one natural Bokmål request naming one proportionate action that addresses the
    window or cold room. Accept requests to inspect or repair the window or provide another room. Reject
    vague, unrelated, or disproportionate demands.
  criteria:
  - id: one-clear-action
    instruction: Requests one clear action from hotel staff.
  - id: direct-remedy
    instruction: Requests a practical remedy that responds directly to the window problem and cold room.
  - id: no-unrelated-demands
    instruction: Adds no unrelated demands.
  derived_from:
  - section_id: request-remedy
- handle: confirm_agreement
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "The transport company has promised to pick up the damaged parcel tomorrow morning. Confirm the plan in Norwegian, check the time, and ask if you need to print a return label."
  response_language: 'no'
  judge_prompt: Check that the response confirms both collection of the damaged parcel and tomorrow morning,
    then asks whether the customer must print a return label. Accept natural Bokmål wording and either
    a separate label question or a clearly separated question in the same message.
  criteria:
  - id: promised-collection
    instruction: Restates that the delivery company will collect the damaged parcel.
  - id: tomorrow-morning
    instruction: Checks that the collection will happen tomorrow morning.
  - id: return-label
    instruction: Asks whether the customer needs to print a return label.
  derived_from:
  - section_id: confirm-next-step
- handle: build_radiator_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "Write a short message to the landlord. Say that the bedroom radiator is still cold when it is on, and ask for one suitable solution."
  response_language: 'no'
  judge_prompt: Check for an observable radiator fact and one appropriate request. Accept natural Bokmål
    variants, but require every sentence to remain relevant to resolving the radiator problem.
  criteria:
  - id: radiator-fact
    instruction: States that the bedroom radiator remains cold when it is switched on.
  - id: appropriate-action
    instruction: Requests one appropriate action to resolve or inspect the radiator problem.
  - id: focused-message
    instruction: Keeps every sentence relevant to resolving the radiator problem.
  derived_from:
  - section_id: controlled-practice
- handle: build_lamp_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "The order confirmation shows three lamps, but only two arrived. Write a message to the shop asking them to send the missing lamp. Use words about delivery."
  response_language: 'no'
  judge_prompt: Check for the two-of-three delivery fact and a request to send the missing lamp in natural
    Bokmål. Reject housing-specific wording that changes the shop-delivery situation.
  criteria:
  - id: lamp-delivery-fact
    instruction: States that only two of the three lamps arrived.
  - id: missing-lamp-request
    instruction: Asks the shop to send the missing lamp.
  - id: delivery-context
    instruction: Uses delivery-related language rather than housing-specific language.
  derived_from:
  - section_id: controlled-practice
- handle: final_washing_machine_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "Write a short dialogue in Norwegian about a washing machine that stops halfway through every wash. Include an observable fact, a practical result, and a suitable request. Use the service company's reply: «Vi sender en tekniker på tirsdag mellom klokka to og fire.» Confirm the action and time. Write four natural lines. Include the fact, result, request, and confirmation."
  response_language: 'no'
  judge_prompt: Check that the dialogue includes an observable fact that the washing machine stops during every wash, a practical effect, a proportionate request, and confirmation that a technician will come on Tuesday between two and four. Accept natural Bokmål variants.
  criteria:
  - id: washing-machine-fact
    instruction: Includes an observable fact that the washing machine stops during every wash.
  - id: practical-effect
    instruction: Includes one practical effect of the washing-machine problem.
  - id: proportionate-request
    instruction: Includes one proportionate request addressing the washing-machine problem.
  - id: technician-confirmation
    instruction: Confirms that a technician will come on Tuesday between two and four.
  derived_from:
  - section_id: final-retrieval-review
- handle: observable_fact_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: understand
  prompt_md: "Choose the statement that describes a fact you can observe."
  explanation_md: "Et observerbart faktum beskriver noe som kan kontrolleres direkte."
  derived_from:
  - section_id: observable-facts
  options:
  - id: opt-4
    text: Jeg tror det er en lekkasje.
    correct: false
    why: Dette er en antakelse, ikke en direkte observasjon.
  - id: opt-1
    text: Det er en sprekk i vindusruta.
    correct: true
  - id: opt-2
    text: Dette ser ut som dårlig vedlikehold.
    correct: false
    why: Dette er en vurdering av årsaken, ikke et direkte observerbart faktum.
  - id: opt-3
    text: Sprekken kom fordi noen slengte igjen vinduet.
    correct: false
    why: Dette tillegger noen skyld uten at årsaken kan observeres direkte.
- handle: effect_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: understand
  prompt_md: "Choose the practical result of this fact: «Varmeovnen virker ikke.»"
  explanation_md: "Følgen beskriver en konkret praktisk konsekvens av at varmeovnen ikke virker."
  derived_from:
  - section_id: explain-effect
  options:
  - id: opt-2
    text: så jeg er sint.
    correct: false
    why: This is an emotional reaction, not a practical effect.
  - id: opt-3
    text: så jeg får en ny jobb.
    correct: false
    why: This is unrelated to the heater not working.
  - id: opt-4
    text: så jeg blir rik.
    correct: false
    why: This is unrelated to the heater not working.
  - id: opt-1
    text: så jeg må bruke ekstra tepper for å holde varmen.
    correct: true
- handle: request_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "The hotel has taken your suitcase to the wrong room, and you need it before you leave. Choose the request that solves the problem."
  explanation_md: "Be personalet levere kofferten til rommet ditt. Da får du den feilplasserte kofferten."
  derived_from:
  - section_id: request-remedy
  options:
  - id: opt-3
    text: Kan dere bekrefte at hotellet har bagasjeoppbevaring?
    correct: false
    why: Information about storage does not recover the suitcase from the wrong room.
  - id: opt-4
    text: Kan jeg få en ekstra nøkkel til rommet?
    correct: false
    why: An extra room key does not bring back the suitcase.
  - id: opt-1
    text: Kan dere hente kofferten og levere den til rommet mitt?
    correct: true
  - id: opt-2
    text: Kan dere flytte meg til et annet hotell?
    correct: false
    why: Moving hotels does not address the misplaced suitcase directly.
- handle: confirmation_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "After the reply «Vi ordner det snart», you want to know when someone will come to help. Choose the question that checks the time."
  explanation_md: "Et omtrentlig tidspunkt gjør avtalen tydeligere."
  derived_from:
  - section_id: confirm-next-step
  options:
  - id: opt-3
    text: Kan du gjøre det nå?
    correct: false
    why: This is a demand, not a confirmation of the next step.
  - id: opt-4
    text: Hva er problemet?
    correct: false
    why: This asks for a problem description, not a confirmation.
  - id: opt-1
    text: Kan du si hvilken dag teknikeren kommer?
    correct: true
  - id: opt-2
    text: Så du ordner det?
    correct: false
    why: This merely repeats the promise without checking a concrete detail.
