- handle: review_request
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: 'Velg den mest passende konkrete forespørselen til dette problemet: «Nøkkelkortet virker
    ikke.»'
  explanation_md: Den riktige forespørselen er konkret og passer til problemet. De andre er enten for
    vage, uforholdsmessige eller irrelevante.
  derived_from:
  - section_id: request-remedy
  options:
  - id: opt-3
    text: Kan dere hjelpe med dette?
    correct: false
    why: Dette er vagt og ber ikke om en tydelig handling.
  - id: opt-4
    text: Kan jeg få en suite?
    correct: false
    why: Dette står ikke i forhold til problemet med nøkkelkortet.
  - id: opt-1
    text: Kan resepsjonen lage et nytt nøkkelkort til meg?
    correct: true
  - id: opt-2
    text: Kan dere bytte hele låsesystemet?
    correct: false
    why: Dette står ikke i forhold til et problem med ett enkelt nøkkelkort.
- handle: review_confirmation
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: Velg det beste spørsmålet for å sjekke omtrent når hjelpen kommer etter svaret «Vi sender
    noen senere.»
  explanation_md: Det riktige spørsmålet ber om et konkret tidspunkt og gjør det vage løftet til en avklarbar
    avtale. De andre gjentar, krever eller endrer informasjonen.
  derived_from:
  - section_id: confirm-next-step
  options:
  - id: opt-3
    text: Kan dere sende noen nå?
    correct: false
    why: Dette er et krav, ikke en bekreftelse.
  - id: opt-4
    text: Kan du forklare problemet?
    correct: false
    why: Dette ber om en problembeskrivelse, ikke en bekreftelse.
  - id: opt-1
    text: Vet dere hvilken dag noen kan komme?
    correct: true
  - id: opt-2
    text: Så dere sender noen?
    correct: false
    why: Dette gjentar bare løftet uten å sjekke en konkret detalj.
- handle: review_complete_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: Write a short Norwegian exchange with a neighbor about a shared problem in your building.
    Include one observable fact, one practical effect, and one proportionate request. Then reply as the
    neighbor, acknowledging the problem and agreeing to take one specific action. Add a sentence confirming
    that action. Label your five sentences as Fact, Effect, Request, Acknowledgment, and Confirmation.
  response_language: 'no'
  judge_prompt: Check that five labeled Norwegian sentences perform the five requested jobs. Require an
    observable fact about a shared building problem, a practical effect, a proportionate request, the
    neighbor’s acknowledgment and agreement to a specific action, and confirmation of that action. Accept
    natural Bokmål variants and equivalent clear labels.
  criteria:
  - id: elevator-fact
    instruction: Includes an observable fact about a shared problem in the building.
  - id: elevator-effect
    instruction: Includes one practical effect of the problem.
  - id: elevator-request
    instruction: Includes one proportionate request addressing the problem.
  - id: elevator-acknowledgment-action
    instruction: Includes the neighbor’s acknowledgment and agreement to take one specific action.
  - id: elevator-confirmation
    instruction: Confirms the neighbor’s specific agreed action.
  - id: elevator-labels
    instruction: Labels which sentence is the Fact, Effect, Request, Acknowledgment, and Confirmation.
  derived_from:
  - section_id: final-retrieval-review
