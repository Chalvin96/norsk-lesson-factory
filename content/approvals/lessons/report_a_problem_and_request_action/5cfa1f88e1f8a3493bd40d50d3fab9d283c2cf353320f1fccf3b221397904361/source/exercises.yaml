- handle: find_factual_core
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: Write one short factual Norwegian sentence saying that a hotel-room window cannot be closed.
    Describe only what you can observe, without blame or a guessed cause.
  response_language: 'no'
  judge_prompt: Check that the sentence naturally describes the hotel-room window as impossible to close,
    without blame or speculation. Accept natural Bokmål variants.
  criteria:
  - id: factual-window-report
    instruction: Describes the hotel-room window itself as impossible to close, without blame or a guessed
      cause.
  derived_from:
  - section_id: observable-facts
- handle: connect_problem_to_effect
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: A delivered box contains one broken bottle, and liquid has damaged the other items. Write
    two short Norwegian sentences. First state only an observable fact. Then state one practical effect,
    keeping the fact and effect distinct and clearly connected.
  response_language: 'no'
  judge_prompt: Check that the response contains two distinct, natural Bokmål sentences in the requested
    order. The first must report an observable condition without speculation. The second must state a
    practical consequence connected to that condition. Accept equivalent factual descriptions and plausible
    practical effects.
  criteria:
  - id: observable-fact-first
    instruction: States only an observable fact about the broken bottle or liquid damage in the first
      sentence.
  - id: practical-effect-second
    instruction: Describes one practical effect in the second sentence.
  - id: distinct-clear-connection
    instruction: Keeps fact and effect distinct while making their connection clear.
  derived_from:
  - section_id: explain-effect
- handle: add_suitable_request
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: A hotel-room window cannot be closed, and the room is becoming cold. Write one Norwegian
    request asking hotel staff for one clear, practical remedy that directly addresses this problem. Do
    not add unrelated demands.
  response_language: 'no'
  judge_prompt: Check for one natural Bokmål request naming one proportionate action that addresses the
    window or cold room. Accept requests to inspect or repair the window or provide another room. Reject
    vague, unrelated, or disproportionate demands.
  criteria:
  - id: one-clear-action
    instruction: Requests one clear action from hotel staff.
  - id: direct-remedy
    instruction: Requests a practical remedy that responds directly to the window problem and cold room.
  - id: no-unrelated-demands
    instruction: Adds no unrelated demands.
  derived_from:
  - section_id: request-remedy
- handle: confirm_agreement
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: A delivery company has agreed to collect a damaged parcel tomorrow morning. Write one Norwegian
    confirmation sentence that restates the promised collection and checks the time. Then ask in Norwegian
    whether you need to print a return label.
  response_language: 'no'
  judge_prompt: Check that the response confirms both collection of the damaged parcel and tomorrow morning,
    then asks whether the customer must print a return label. Accept natural Bokmål wording and either
    a separate label question or a clearly separated question in the same message.
  criteria:
  - id: promised-collection
    instruction: Restates that the delivery company will collect the damaged parcel.
  - id: tomorrow-morning
    instruction: Checks that the collection will happen tomorrow morning.
  - id: return-label
    instruction: Asks whether the customer needs to print a return label.
  derived_from:
  - section_id: confirm-next-step
- handle: build_radiator_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: Write a focused Norwegian message to a landlord. State that a bedroom radiator remains cold
    when switched on, then request one appropriate action.
  response_language: 'no'
  judge_prompt: Check for an observable radiator fact and one appropriate request. Accept natural Bokmål
    variants, but require every sentence to remain relevant to resolving the radiator problem.
  criteria:
  - id: radiator-fact
    instruction: States that the bedroom radiator remains cold when it is switched on.
  - id: appropriate-action
    instruction: Requests one appropriate action to resolve or inspect the radiator problem.
  - id: focused-message
    instruction: Keeps every sentence relevant to resolving the radiator problem.
  derived_from:
  - section_id: controlled-practice
- handle: build_lamp_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: Write a Norwegian report to a shop. State that the order confirmation lists three lamps but
    only two arrived, then ask the shop to send the missing lamp. Use delivery-related language.
  response_language: 'no'
  judge_prompt: Check for the two-of-three delivery fact and a request to send the missing lamp in natural
    Bokmål. Reject housing-specific wording that changes the shop-delivery situation.
  criteria:
  - id: lamp-delivery-fact
    instruction: States that only two of the three lamps arrived.
  - id: missing-lamp-request
    instruction: Asks the shop to send the missing lamp.
  - id: delivery-context
    instruction: Uses delivery-related language rather than housing-specific language.
  derived_from:
  - section_id: controlled-practice
- handle: final_washing_machine_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: 'Write a short Norwegian exchange about a washing machine that stops during every wash. Include
    one observable fact, one practical effect, and one proportionate request. Then use this service-provider
    response: «Vi sender en tekniker på tirsdag mellom klokka to og fire.» Add a sentence confirming the
    agreed action and time. Label your four sentences as Fact, Effect, Request, and Confirmation.'
  response_language: 'no'
  judge_prompt: Check that four labeled Norwegian sentences perform the four requested jobs. Require an
    observable fact that the washing machine stops during every wash, a practical effect, a proportionate
    request, and confirmation that a technician will come on Tuesday between two and four. Accept natural
    Bokmål variants and equivalent clear labels for the four jobs.
  criteria:
  - id: washing-machine-fact
    instruction: Includes an observable fact that the washing machine stops during every wash.
  - id: practical-effect
    instruction: Includes one practical effect of the washing-machine problem.
  - id: proportionate-request
    instruction: Includes one proportionate request addressing the washing-machine problem.
  - id: technician-confirmation
    instruction: Confirms that a technician will come on Tuesday between two and four.
  - id: communicative-labels
    instruction: Labels which sentence is the Fact, Effect, Request, and Confirmation.
  derived_from:
  - section_id: final-retrieval-review
- handle: observable_fact_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: understand
  prompt_md: Choose the statement that is an observable fact.
  explanation_md: The correct answer describes a direct observation that can be checked. The other statements
    express opinion, blame, or speculation.
  derived_from:
  - section_id: observable-facts
  options:
  - id: opt-4
    text: Jeg tror det er en lekkasje.
    correct: false
    why: Dette er en antakelse, ikke en direkte observasjon.
  - id: opt-1
    text: Det er en sprekk i vindusruta.
    correct: true
  - id: opt-2
    text: Dette ser ut som dårlig vedlikehold.
    correct: false
    why: Dette er en vurdering av årsaken, ikke et direkte observerbart faktum.
  - id: opt-3
    text: Sprekken kom fordi noen slengte igjen vinduet.
    correct: false
    why: Dette tillegger noen skyld uten at årsaken kan observeres direkte.
- handle: effect_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: understand
  prompt_md: 'Choose the best practical effect for this fact: ''Varmeovnen virker ikke.'''
  explanation_md: The correct effect is a direct practical consequence of the heater not working. The
    others are emotional, unrelated, or speculative.
  derived_from:
  - section_id: explain-effect
  options:
  - id: opt-2
    text: så jeg er sint.
    correct: false
    why: This is an emotional reaction, not a practical effect.
  - id: opt-3
    text: så jeg får en ny jobb.
    correct: false
    why: This is unrelated to the heater not working.
  - id: opt-4
    text: så jeg blir rik.
    correct: false
    why: This is unrelated to the heater not working.
  - id: opt-1
    text: så jeg må bruke ekstra tepper for å holde varmen.
    correct: true
- handle: request_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: A hotel has delivered your suitcase to the wrong room, and you need it before leaving. Choose
    the request that asks staff to resolve this specific problem.
  explanation_md: Asking staff to bring the misplaced suitcase to your room addresses the problem directly.
    The other options do not recover it or ask for an unrelated action.
  derived_from:
  - section_id: request-remedy
  options:
  - id: opt-3
    text: Kan dere bekrefte at hotellet har bagasjeoppbevaring?
    correct: false
    why: Information about storage does not recover the suitcase from the wrong room.
  - id: opt-4
    text: Kan jeg få en ekstra nøkkel til rommet?
    correct: false
    why: An extra room key does not bring back the suitcase.
  - id: opt-1
    text: Kan dere hente kofferten og levere den til rommet mitt?
    correct: true
  - id: opt-2
    text: Kan dere flytte meg til et annet hotell?
    correct: false
    why: Moving hotels does not address the misplaced suitcase directly.
- handle: confirmation_choice
  op: choose
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: Choose the best confirmation question that asks for a specific completion time after the
    reply 'Vi ordner det snart.'
  explanation_md: The correct question asks for a specific time, turning a vague promise into a checkable
    agreement. The others repeat, demand, or change the topic.
  derived_from:
  - section_id: confirm-next-step
  options:
  - id: opt-3
    text: Kan du gjøre det nå?
    correct: false
    why: This is a demand, not a confirmation of the next step.
  - id: opt-4
    text: Hva er problemet?
    correct: false
    why: This asks for a problem description, not a confirmation.
  - id: opt-1
    text: Kan du si hvilken dag arbeidet blir ferdig?
    correct: true
  - id: opt-2
    text: Så du ordner det?
    correct: false
    why: This merely repeats the promise without checking a concrete detail.
- handle: match_parts
  op: match_pairs
  objective: obj-report-a-problem-and-request-action-01
  bloom: understand
  prompt_md: Match each statement to its part of a problem report.
  explanation_md: The four parts of a problem report are observable fact, effect, requested remedy, and
    confirmed next step. Each statement fits one part.
  derived_from:
  - section_id: complete-pattern
  left:
  - left_id: l1
    text: Badet har ikke hatt varmt vann siden i går.
  - left_id: l2
    text: Jeg må dusje hos naboen.
  - left_id: l3
    text: Kan dere undersøke varmtvannsberederen?
  - left_id: l4
    text: Så dere sender en tekniker i morgen?
  right:
  - right_id: r1
    text: observable fact
  - right_id: r2
    text: effect
  - right_id: r3
    text: request
  - right_id: r4
    text: confirmation
  pairs:
  - left_id: l1
    right_id: r1
  - left_id: l2
    right_id: r2
  - left_id: l3
    right_id: r3
  - left_id: l4
    right_id: r4
- handle: transfer_apartment_issue
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: 'Write a short Norwegian message to your landlord about a broken window in your apartment.
    State the observable fact, its practical effect, and one proportionate request. Then confirm the next
    step using this reply: «Jeg kommer i morgen formiddag.»'
  response_language: 'no'
  judge_prompt: Check for an observable fact about the window, a practical effect, a proportionate request,
    and a confirmation that the landlord will come tomorrow morning. Accept natural Bokmål variants.
  criteria:
  - id: window-fact
    instruction: States an observable fact about the broken window.
  - id: window-effect
    instruction: Describes a practical effect of the broken window.
  - id: window-request
    instruction: Requests one proportionate action to address the window.
  - id: window-confirmation
    instruction: Confirms that the landlord will come tomorrow morning.
  derived_from:
  - section_id: complete-pattern
