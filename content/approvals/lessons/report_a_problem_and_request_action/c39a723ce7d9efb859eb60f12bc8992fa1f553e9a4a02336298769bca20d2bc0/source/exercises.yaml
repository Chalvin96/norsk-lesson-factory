- handle: final_washing_machine_report
  op: write
  objective: obj-report-a-problem-and-request-action-01
  bloom: apply
  prompt_md: "Skriv en kort norsk dialog om vaskemaskinen som stopper midt i hver vask. Ta med et observerbart faktum, en praktisk følge og en passende forespørsel. Bruk svaret fra servicefirmaet: «Vi sender en tekniker på tirsdag mellom klokka to og fire.» Bekreft handlingen og tidspunktet. Skriv dialogen som fire naturlige replikker. Ta med faktum, følge, forespørsel og bekreftelse."
  response_language: 'no'
  judge_prompt: Check that the dialogue includes an observable fact that the washing machine stops during every wash, a practical effect, a proportionate request, and confirmation that a technician will come on Tuesday between two and four. Accept natural Bokmål variants.
  criteria:
  - id: washing-machine-fact
    instruction: Includes an observable fact that the washing machine stops during every wash.
  - id: practical-effect
    instruction: Includes one practical effect of the washing-machine problem.
  - id: proportionate-request
    instruction: Includes one proportionate request addressing the washing-machine problem.
  - id: technician-confirmation
    instruction: Confirms that a technician will come on Tuesday between two and four.
  derived_from:
  - section_id: final-retrieval-review
- handle: observable_fact_choice
