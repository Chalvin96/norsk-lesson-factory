  prompt_md: 'Skriv en dialog på 35–75 ord mellom en besøkende og en lokal person ved stasjonen. Den besøkende skal til museet. Ruten går rett fram til trafikklysene, til venstre ved kiosken og forbi hotellet; museet ligger på høyre side. Ta med et spørsmål om veien, en kort forklaring, en gjentakelse av de viktigste punktene og et svar på gjentakelsen.'
  response_language: 'no'
  min_words: 35
  max_words: 75
  judge_prompt: Check gating criteria clear-request, ordered-route, listener-check, and explicit-ending. Record taught-check-form-observation as an observation only; it never changes the pass result.
  criteria:
  - id: clear-request
    instruction: Includes a clear request for directions to the museum.
  - id: ordered-route
    instruction: Gives an ordered route consistent with the traffic lights, kiosk, hotel, and museum facts.
  - id: listener-check
    instruction: The visitor repeats the route or its key steps to check understanding.
  - id: explicit-ending
    instruction: Ends with an explicit confirmation or a brief correction in response to that check.
  - id: taught-check-form-observation
    instruction: 'Observation only: note whether the listener check begins with Så; do not fail an otherwise successful route check.'
  derived_from:
  - section_id: repeating-route-back
