  derived_from:
  - section_id: asking-for-the-way
- handle: recognize_landmark_relation
  op: choose
  objective: obj-ask-for-and-give-directions-01
  bloom: understand
  prompt_md: Choose the English meaning of the instruction.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Guide
      text_md: «Gå forbi hotellet.»
  options:
  - id: to
    text: Go to the hotel.
    correct: false
    why: Til would make the hotel the endpoint instead of a landmark to pass.
  - id: at
    text: Stop at the hotel.
    correct: false
    why: Ved would tell the listener to stop by the hotel rather than walk past it.
  - id: past
    text: Go past the hotel.
    correct: true
    why: Forbi tells the listener to continue beyond the hotel.
  derived_from:
  - section_id: giving-short-direction-steps
- handle: build_clear_step
  op: build
  objective: obj-ask-for-and-give-directions-01
  bloom: apply
  prompt_md: Build the instruction that tells the listener to turn right at the bank.
  tokens:
  - token_id: tok-2
    text: til
  - token_id: tok-3
    text: høyre
  - token_id: tok-4
    text: ved
  - token_id: tok-5
    text: banken.
  - token_id: tok-1
    text: Ta
  answer_order:
  - tok-1
  - tok-2
  - tok-3
  - tok-4
  - tok-5
  explanation_md: Use ta til høyre for the turn and ved plus the landmark for where it happens.
  derived_from:
  - section_id: giving-short-direction-steps
- handle: review_landmark_relation
  op: recall_fill
  objective: obj-ask-for-and-give-directions-01
  bloom: remember
  prompt_md: The guide wants the visitor to make the left turn at the bank itself, not before or after
    it. Complete the guide's second step.
  audio_target: Gå rett fram til banken. Ta til venstre ved banken.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Guide
      text_md: «Gå rett fram til banken. Ta til venstre ___.»
  segments:
  - text_md: '«Gå rett fram til banken. Ta til venstre '
  - blank_id: landmark-relation
    options:
    - ved banken
    - forbi banken
    - bak banken
    answer_index: 0
  - text_md: .»
  explanation_md: After arriving at the bank, ved banken places the turn at the bank; forbi marks passing
    it and bak marks the turn behind it.
  derived_from:
  - section_id: giving-short-direction-steps
- handle: recognize_movement_location
  op: choose
  objective: obj-ask-for-and-give-directions-01
  bloom: analyze
  prompt_md: Choose the English meaning of the local person's response.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Local
      text_md: «Ta til høyre ved kiosken. Apoteket ligger på venstre side.»
  options:
  - id: wrong-location
    text: Turn right at the kiosk; the pharmacy is on the right-hand side.
    correct: false
    why: The turn matches, but the pharmacy side is wrong.
  - id: correct-contrast
    text: Turn right at the kiosk; the pharmacy is on the left-hand side.
    correct: true
    why: The turn and the pharmacy location both match the Norwegian.
  - id: swapped-forms
    text: Turn left at the kiosk; the pharmacy is on the right-hand side.
    correct: false
    why: This reverses both the movement and the location forms.
  derived_from:
  - section_id: movement-and-final-location
- handle: expand_route
  op: write
  objective: obj-ask-for-and-give-directions-01
  bloom: apply
  prompt_md: 'You are at the station. A visitor wants to reach the pharmacy. Route facts: Walk straight
    ahead to the traffic lights. Continue past the bank. The pharmacy is on the right-hand side immediately
    after the bank. Write three short Bokmål direction sentences that help the visitor reach the pharmacy.'
  response_language: 'no'
  min_words: 15
  max_words: 40
  judge_prompt: Check gating criteria logical-order, accurate-landmarks, and destination-location. Record
    sequence-language-observation as an observation only; it never changes the pass result.
  criteria:
  - id: logical-order
    instruction: Presents three short direction sentences in a usable order from the station.
  - id: accurate-landmarks
    instruction: Directs the visitor to the traffic lights and then past the bank.
  - id: destination-location
    instruction: Locates the pharmacy on the right-hand side immediately after the bank.
  - id: sequence-language-observation
    instruction: 'Observation only: note whether words such as først, så, or deretter clarify the order;
      do not fail an otherwise clear route.'
  derived_from:
  - section_id: movement-and-final-location
- handle: review_turn_vs_location
  op: recall_fill
  objective: obj-ask-for-and-give-directions-01
  bloom: remember
  prompt_md: Complete the sentence that says which side the library is on.
  audio_target: Ta til venstre ved torget. Biblioteket ligger på venstre side.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Local
      text_md: «Ta til venstre ved torget. Biblioteket ligger ___ venstre side.»
  segments:
  - text_md: '«Ta til venstre ved torget. Biblioteket ligger '
  - blank_id: side-preposition
    options:
    - på
    - under
    - over
    answer_index: 0
  - text_md: ' venstre side.»'
  explanation_md: På venstre side names the side where the library lies, while til venstre gives a turn
    direction; under and over do not fit this side phrase.
  derived_from:
  - section_id: movement-and-final-location
- handle: recognize_detail_check
  op: choose
  objective: obj-ask-for-and-give-directions-01
  bloom: analyze
  prompt_md: Choose the visitor's check that confirms only the turn after the bank.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Guide
      text_md: «Gå rett fram til banken. Sving mot venstre når du har passert banken.»
  options:
  - id: wrong-place
    text: Så jeg tar til venstre før banken?
    correct: false
    why: This places the turn before the bank instead of after it.
  - id: focused
    text: Så jeg tar til venstre etter banken?
    correct: true
    why: This echoes only the guide's second step and asks whether the left turn comes after the bank.
  - id: wrong-turn
    text: Så jeg tar til høyre etter banken?
    correct: false
    why: This reverses the turn direction the guide gave.
  derived_from:
  - section_id: checking-one-detail
