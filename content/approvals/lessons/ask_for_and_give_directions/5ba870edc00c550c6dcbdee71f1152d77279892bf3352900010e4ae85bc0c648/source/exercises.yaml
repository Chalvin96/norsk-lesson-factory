- handle: recognize_route_confirmation
  op: choose
  objective: obj-ask-for-and-give-directions-01
  bloom: analyze
  prompt_md: Choose the English meaning of the local person's reply.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Visitor
      text_md: «Så jeg går forbi banken og tar til høyre?»
    - speaker: Local
      text_md: «Ja, det stemmer.»
  options:
  - id: correction
    text: The visitor must take a different turn.
    correct: false
    why: A correction would use Nei and a new instruction.
  - id: new-request
    text: The local person is asking for the route again.
    correct: false
    why: A new request would use a question such as Hvordan kommer jeg meg til …
  - id: confirm
    text: The route the visitor repeated is correct.
    correct: true
    why: Ja, det stemmer confirms the repeated route.
  derived_from:
  - section_id: repeating-route-back
- handle: complete_exchange
  op: write
  objective: obj-ask-for-and-give-directions-01
  bloom: apply
  prompt_md: 'Write for a visitor and a local person at the station. The visitor needs to reach the museum.
    Route facts: Go straight to the traffic lights. Turn left at the kiosk. Go past the hotel. The museum
    is on the right-hand side. The visitor should ask for the route, the local person should explain it,
    the visitor should repeat the key steps to check understanding, and the local person should respond
    to that check. Write a 35–75-word Bokmål dialogue.'
  response_language: 'no'
  min_words: 35
  max_words: 75
  judge_prompt: Check gating criteria clear-request, ordered-route, listener-check, and explicit-ending.
    Record taught-check-form-observation as an observation only; it never changes the pass result.
  criteria:
  - id: clear-request
    instruction: Includes a clear request for directions to the museum.
  - id: ordered-route
    instruction: Gives an ordered route consistent with the traffic lights, kiosk, hotel, and museum facts.
  - id: listener-check
    instruction: The visitor repeats the route or its key steps to check understanding.
  - id: explicit-ending
    instruction: Ends with an explicit confirmation or a brief correction in response to that check.
  - id: taught-check-form-observation
    instruction: 'Observation only: note whether the listener check begins with Så; do not fail an otherwise
      successful route check.'
  derived_from:
  - section_id: repeating-route-back
- handle: final_retrieval
  op: write
  objective: obj-ask-for-and-give-directions-01
  bloom: apply
  prompt_md: 'Write for a visitor and a local person outside the swimming pool. The visitor needs to reach
    the post office. Route facts: Walk straight ahead to the roundabout. Turn right at the roundabout. Go
    past the bakery. The post office is next to the bookshop. The visitor should ask for directions, the
    local person should give brief directions, and the visitor should politely ask for directions and repeat the route back. The local person
    should confirm the repetition or briefly correct it if needed. Write a 35–75-word Bokmål dialogue.'
  response_language: 'no'
  min_words: 35
  max_words: 75
  judge_prompt: Evaluate only the visible task and criteria. Accept natural Bokmål variants that convey
    the required route and exchange; do not require exact wording or taught phrases.
  criteria:
  - id: polite-route-request
    instruction: The visitor politely asks how to get to the post office.
  - id: accurate-direction-steps
    instruction: The local person gives brief, usable directions from the swimming pool via the roundabout
      and past the bakery, and locates the post office next to the bookshop.
  - id: route-check-back
    instruction: The visitor repeats the route or its key steps to check understanding.
  - id: confirmation-response
    instruction: The local person clearly confirms an accurate check-back or briefly corrects an inaccurate
      one.
  derived_from:
  - section_id: final-retrieval
- handle: review_route_confirmation
  op: recall_fill
  objective: obj-ask-for-and-give-directions-01
  bloom: remember
  prompt_md: Complete the local person's reply that confirms the route.
  audio_target: Så jeg tar til venstre etter parken? Ja, helt riktig.
