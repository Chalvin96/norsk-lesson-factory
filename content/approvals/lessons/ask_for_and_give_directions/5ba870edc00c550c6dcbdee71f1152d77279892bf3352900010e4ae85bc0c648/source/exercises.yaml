- handle: recognize_route_request
  op: choose
  objective: obj-ask-for-and-give-directions-01
  bloom: understand
  prompt_md: Choose the English meaning of the visitor's question.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Visitor
      text_md: «Unnskyld, hvordan kommer jeg meg til rådhuset?»
  options:
  - id: location
    text: Excuse me, where is the town hall?
    correct: false
    why: A where-question would use Hvor ligger …, not Hvordan kommer jeg meg til …
  - id: near-station
    text: Excuse me, is the town hall near the station?
    correct: false
    why: The question names no station and asks for the way, not for a yes/no location.
  - id: route
    text: Excuse me, how do I get to the town hall?
    correct: true
    why: The question asks how to reach the town hall.
  derived_from:
  - section_id: asking-for-the-way
- handle: choose_route_question
  op: write
  objective: obj-ask-for-and-give-directions-01
  bloom: apply
  prompt_md: You are visiting a town. You need route steps from the square to the hotel. Ask a nearby
    stranger politely so that you can find the hotel. Write one Bokmål question.
  response_language: 'no'
  min_words: 7
  max_words: 12
  judge_prompt: Check gating criteria polite-address, names-destination, and asks-route-steps. Record
    taught-pattern-observation as an observation only; it never changes the pass result.
  criteria:
  - id: polite-address
    instruction: Politely addresses the stranger before asking.
  - id: names-destination
    instruction: Names the hotel as the destination of the requested route.
  - id: asks-route-steps
    instruction: Asks for the route steps needed to reach the hotel from the square.
  - id: taught-pattern-observation
    instruction: 'Observation only: note whether the response uses Hvordan kommer jeg meg til … or Kan
      du forklare veien til …; do not fail an otherwise successful question.'
  derived_from:
  - section_id: asking-for-the-way
- handle: review_route_request
  op: recall_fill
  objective: obj-ask-for-and-give-directions-01
  bloom: remember
