    question.'
  response_language: 'no'
  min_words: 4
  max_words: 10
  judge_prompt: Evaluate criteria isolated-detail and confirmation-question only.
  criteria:
  - id: isolated-detail
    instruction: Refers only to the right turn after the bank.
  - id: confirmation-question
    instruction: Expresses that detail as a natural Bokmål confirmation question.
  derived_from:
  - section_id: checking-one-detail
