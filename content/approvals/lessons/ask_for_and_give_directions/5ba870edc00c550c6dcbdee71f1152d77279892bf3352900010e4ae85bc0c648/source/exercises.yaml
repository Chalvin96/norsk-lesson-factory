  - kind: dialogue
    turns:
    - speaker: Visitor
      text_md: «Unnskyld, hvordan ___ jeg veien til apoteket?»
  segments:
  - text_md: '«Unnskyld, hvordan '
  - blank_id: route-verb
    options:
    - finner
