      text_md: «___.»
  segments:
  - text_md: «
  - blank_id: confirmation
    options:
    - Ja, helt riktig
    - Nei, du tar til høyre
    - Vi ses i morgen
    answer_index: 0
  - text_md: .»
  explanation_md: Ja, helt riktig confirms that the repeated route is correct; the other options either
    reject the route or close the exchange.
  derived_from:
  - section_id: repeating-route-back
