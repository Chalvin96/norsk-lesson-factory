  prompt_md: "Du skriver til klassekameraten Maja for å avtale et møte. Onsdag klokka 17 på biblioteket passer. Du kan ikke før klokka 16.30. Du må spørre om Maja har tid, og hvor inne hun vil møtes. Skriv en melding på 25–45 ord med planen og spørsmålene."
  derived_from:
  - section_id: cumulative-transfer-weekday-appointment
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: 'Check audience-purpose, supplied-facts, word-bound, and natural main-clause word order as gating criteria. Record sentence-adverb-placement-observation diagnostically. Report a verdict for every criterion id. Anchors: Must pass: «Hei Maja! På onsdag møtes vi på biblioteket klokka fem. Jeg har ikke tid før halv fem. Har du tid da? Hvor vil du møtes inne på biblioteket?» Must fail supplied-facts: «Hei Maja! Skal vi møtes på kafeen på lørdag? Jeg kan hele dagen. Skriv tilbake når du har tid.»'
  criteria:
  - id: audience-purpose
    instruction: Writes a Norwegian message to Maja whose purpose is to arrange the meeting and obtain the missing information.
  - id: supplied-facts
    instruction: States Wednesday, 17:00, the library, and unavailability before 16:30, and asks about Maja's availability and preferred place inside.
  - id: word-bound
    instruction: Contains 25–45 words.
  - id: main-clause-frames-observation
    instruction: Uses natural main-clause word order in statements, a yes/no question, and a wh-question.
  - id: sentence-adverb-placement-observation
    instruction: Diagnostically records whether any sentence adverb is placed naturally; this criterion never controls the pass result.
