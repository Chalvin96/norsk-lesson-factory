- handle: discriminate_yes_no_and_wh_questions
  op: recall_fill
  objective: obj-word-order-main-clauses-01
  bloom: understand
  prompt_md: Choose the question that fits each information need.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Jeg vet ikke om Sara kommer senere.»
    - speaker: Elias
      text_md: «Spør henne.»
    - speaker: Maja
      text_md: «Hun kommer, men jeg vet ikke når.»
  explanation_md: A yes/no question begins with the verb. A wh-question begins with the missing-information
    word, followed by the verb and subject.
  derived_from:
  - section_id: wh-questions-keep-the-verb-in-the-second-slot
  segments:
  - text_md: 'Maja asks: «'
  - blank_id: question-family-yes-no
    options:
    - Kommer Sara senere?
    - Kommer Sara snart?
    - Når Sara kommer?
    answer_index: 0
  - text_md: '» 2. Maja asks: «'
  - blank_id: question-family-wh
    options:
    - Kommer Sara på et senere tidspunkt?
    - Når kommer Sara?
    - Når Sara kommer?
    answer_index: 1
  - text_md: »
  audio_target: '1. Maja asks: «Kommer Sara senere?» 2. Maja asks: «Når kommer Sara?»'
