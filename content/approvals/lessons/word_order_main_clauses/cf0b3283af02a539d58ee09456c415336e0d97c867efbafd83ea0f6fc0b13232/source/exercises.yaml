    - speaker: Elias
      text_md: «Spør henne.»
    - speaker: Maja
      text_md: «Hun kommer, men jeg vet ikke når.»
  explanation_md: A yes/no question begins with the verb. A wh-question begins with the missing-information
    word, followed by the verb and subject.
  derived_from:
  - section_id: wh-questions-keep-the-verb-in-the-second-slot
  segments:
