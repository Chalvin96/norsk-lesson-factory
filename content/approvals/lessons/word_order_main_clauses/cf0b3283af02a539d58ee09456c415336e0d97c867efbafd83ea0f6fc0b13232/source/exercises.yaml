- handle: transfer_word_order_to_library_plans
  op: write
  objective: obj-word-order-main-clauses-01
  bloom: apply
  prompt_md: You are writing to your classmate Maja to arrange a meeting. | Fact | Detail | |---|---|
    | Day | Wednesday | | Start | 17:00 | | Place | the library | | Your availability | not available
    before 16:30 | | Information you need | whether Maja has time and where she wants to meet inside |
    Write a 25–45-word Norwegian message that gives the plans and asks for the missing information.
  derived_from:
  - section_id: cumulative-transfer-weekday-appointment
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: 'Check audience-purpose, supplied-facts, word-bound, and natural main-clause word order
    as gating criteria. Record sentence-adverb-placement-observation diagnostically. Report a verdict
    for every criterion id. Anchors: Must pass: «Hei Maja! På onsdag møtes vi på biblioteket klokka fem.
    Jeg har ikke tid før halv fem. Har du tid da? Hvor vil du møtes inne på biblioteket?» Must fail supplied-facts:
    «Hei Maja! Skal vi møtes på kafeen på lørdag? Jeg kan hele dagen. Skriv tilbake når du har tid.»'
  criteria:
  - id: audience-purpose
    instruction: Writes a Norwegian message to Maja whose purpose is to arrange the meeting and obtain
      the missing information.
  - id: supplied-facts
    instruction: States Wednesday, 17:00, the library, and unavailability before 16:30, and asks about
      Maja's availability and preferred place inside.
  - id: word-bound
    instruction: Contains 25–45 words.
  - id: main-clause-frames-observation
    instruction: Uses natural main-clause word order in statements, a yes/no question, and a wh-question.
  - id: sentence-adverb-placement-observation
    instruction: Diagnostically records whether any sentence adverb is placed naturally; this criterion
      never controls the pass result.
- handle: retrieve_main_clause_frames
  op: write
  objective: obj-word-order-main-clauses-01
  bloom: apply
  prompt_md: Your Norwegian tutor asks for a short practice note. | Meaning to include | Detail | |---|---|
    | ordinary statement | We meet here. | | time-first statement | On Saturdays, we meet here. | | yes/no
    question | Do you often meet here? | | wh-question | Where do you usually meet? | Write a 16–35-word
    Norwegian note that demonstrates all four meanings.
  derived_from:
  - section_id: final-retrieval-request
  response_language: 'no'
  min_words: 16
  max_words: 35
  judge_prompt: Check four-requested-meanings, frame-specific-verb-order, required-adverb-placement, and
    word-bound. All four are gating because the task explicitly requests these meanings and demonstrations.
    Report a verdict for every criterion id. Accept natural Bokmål lexical and punctuation variants that
    preserve each requested meaning.
  criteria:
  - id: four-requested-meanings
    instruction: Includes an ordinary statement, a time-first statement, a yes/no question, and a wh-question
      expressing the four supplied meanings.
  - id: frame-specific-verb-order
    instruction: Places the present-tense verb after the subject in the ordinary statement, after the
      fronted time phrase and before the subject in the time-first statement, first in the yes/no question,
      and after the question word and before the subject in the wh-question.
  - id: required-adverb-placement
    instruction: Places ofte after the subject in the yes/no question and vanligvis after the subject
      in the wh-question, or uses meaning-preserving natural variants.
  - id: word-bound
    instruction: Contains 16–35 words.
