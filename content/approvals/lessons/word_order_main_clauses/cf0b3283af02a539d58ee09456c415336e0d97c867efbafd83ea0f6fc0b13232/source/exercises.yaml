    - Kommer Sara snart?
    - Når Sara kommer?
    answer_index: 0
  - text_md: '» 2. Maja asks: «'
  - blank_id: question-family-wh
    options:
    - Kommer Sara på et senere tidspunkt?
    - Når kommer Sara?
    - Når Sara kommer?
    answer_index: 1
  - text_md: »
  audio_target: '1. Maja asks: «Kommer Sara senere?» 2. Maja asks: «Når kommer Sara?»'
