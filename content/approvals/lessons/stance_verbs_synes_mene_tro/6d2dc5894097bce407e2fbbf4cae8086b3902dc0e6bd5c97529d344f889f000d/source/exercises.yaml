- handle: cafe_decision_context_completion
  op: write
  objective: obj-stance-verbs-synes-mene-tro-01
  bloom: apply
  prompt_md: 'Skriv 4–5 sammenhengende setninger om kafeens åpningstider. Jonas har sett på budsjettet og er usikker på om kafeen har råd til å holde åpent én søndag i måneden. De ansatte foreslår å stenge tidligere på søndager. Mina foretrekker kortere åpningstid. Avslutt med en spådom om kundene blir fornøyde. Bruk «tro», «mene» og «synes» etter betydningen.'
  stimulus: []
  derived_from:
  - section_id: back-at-the-cafe
  response_language: "no"
  min_words: 30
  max_words: 70
  judge_prompt: Check all four required facts and their roles. Accept natural Bokmål paraphrases and pronoun choices, including any belief or uncertainty Jonas expresses about whether the café can afford one Sunday opening a month; do not require an answer that the café can afford it. Require the staff's earlier-closing position, Mina's evaluation of the shorter day, and the customer-satisfaction prediction. Require synes for the evaluation, mener for the position, and tro for beliefs or predictions, with a coherent café update.
  criteria:
  - id: jonas-belief
    instruction: Expresses Jonas's belief or uncertainty about whether the café can afford one Sunday opening a month with tror, without requiring that he believes it can afford the opening.
  - id: staff-position
    instruction: States the staff's position that the café should close earlier on Sundays with mener.
  - id: mina-evaluation
    instruction: Presents Mina's evaluation that a shorter opening day is better with synes.
  - id: customer-prediction
    instruction: Includes a belief or prediction about customers being satisfied with tro.
  - id: cafe-coherence
    instruction: Keeps the speakers, café decision, and relationships among the statements logically consistent.
- handle: stance_verbs_retrieval_review
  op: write
  objective: obj-stance-verbs-synes-mene-tro-01
  bloom: apply
  prompt_md: 'Skriv ett svar på norsk med to deler. Forklar kort forskjellen på «synes», «mener» og «tror». Skriv deretter en sammenhengende oppdatering fra Anja til en kollega om fotoutstillingen på biblioteket. Utstillingen med bilder fra Anjas barndomsbydel gjorde inntrykk på henne. Lokale skoler ønsker mer tid til å besøke den, så koordinatoren mener den bør stå én uke til. Påmeldingstallene tyder på at mange kommer lørdag. Bruk hvert av de tre verbene én gang og begrunn tankene kort.'
  stimulus: []
  derived_from:
  - section_id: retrieval-and-review
  response_language: "no"
  min_words: 35
  max_words: 75
  judge_prompt: 'Check both parts. Part A must explain in Norwegian the difference among a personal evaluation, a stated position, and an uncertain belief or prediction. Part B must be a connected update about the library that preserves Anja''s reaction to the exhibition, the coordinator''s position about its closing date, and the visitor prediction. Accept natural variants and require the three stance verbs to fit their respective meanings. Part B must briefly support each thought with the relevant detail: the childhood neighborhood photos, the schools'' requests, and the high registration numbers. Reasons should explain the characters'' thoughts, not label the stance-verb categories.'
  criteria:
  - id: distinction-explanation
    instruction: Explains in Norwegian the difference among evaluating something, taking a position, and expressing an uncertain belief or prediction.
  - id: library-review-update
    instruction: Writes a connected Norwegian update preserving Anja's evaluation of the exhibition, the coordinator's position about keeping it open, and the prediction about Saturday's visitors; uses synes, mener, and tror once each in meanings that fit those contexts, briefly grounding each thought in the childhood neighborhood photos, the schools' requests, and high registration numbers.
