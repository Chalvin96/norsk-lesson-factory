- handle: final_guided_exchange
  op: write
  objective: obj-make-weather-small-talk-01
  bloom: apply
  prompt_md: 'Nora og Amir møtes utenfor en dagligvarebutikk en varm ettermiddag. Sola skinner, Amir har en flaske vann, og Nora skal snart inn. Skriv en dialog på norsk på 25–60 ord. Start med været, svar med en bekreftelse eller en mild kontrast, still et relevant oppfølgingsspørsmål og avslutt eller fortsett samtalen naturlig.'
  response_language: 'no'
  min_words: 25
  max_words: 60
  judge_prompt: Evaluate criteria brief-exchange, weather-opening, connected-response, related-follow-up, and clear-ending and report each verdict with evidence. Accept natural Bokmål variants that preserve the visible facts and requested sequence.
  criteria:
  - id: brief-exchange
    instruction: Presents a dialogue of 25–60 words between Nora and Amir.
  - id: weather-opening
    instruction: Opens with an observation connected to the hot, sunny afternoon.
  - id: connected-response
    instruction: Follows the opening with a natural acknowledgement or gentle contrast.
  - id: related-follow-up
    instruction: Includes one follow-up question related to the weather or the supplied immediate situation.
  - id: clear-ending
    instruction: Ends with a polite closing or a sentence that clearly continues the exchange.
  derived_from:
  - section_id: final-guided-practice
