  - section_id: second-checkpoint-acknowledge-add-detail
  response_language: 'no'
  min_words: 5
  max_words: 12
  judge_prompt: Evaluate criteria acknowledges-rain and adds-contrasting-fact and report each verdict with evidence.
  criteria:
  - id: acknowledges-rain
    instruction: Acknowledges Nora's observation that it is raining heavily.
  - id: adds-contrasting-fact
    instruction: Adds that it is not particularly cold as a connected contrast.
- handle: third_checkpoint_middle_exchange
  op: write
  objective: obj-make-weather-small-talk-01
  bloom: apply
  prompt_md: 'Amir: «Det blåser kraftig her ved fergekaia.» Reply in Norwegian. Confirm that it is windy, mention that the sun is shining, and ask a relevant follow-up question about the weather that Amir can answer. You do not yet know whether the wind will die down.'
  derived_from:
  - section_id: third-checkpoint-build-middle
  response_language: 'no'
  min_words: 10
  max_words: 25
  judge_prompt: Evaluate criteria acknowledges-wind, adds-sunny-contrast, and asks-weather-follow-up and report each verdict with evidence.
  criteria:
  - id: acknowledges-wind
    instruction: Acknowledges Amir's observation about the strong wind.
  - id: adds-sunny-contrast
    instruction: Adds the supplied fact that the sun is shining as a connected contrast.
  - id: asks-weather-follow-up
    instruction: Asks a relevant weather question that Amir can answer.
- handle: discriminate_close_or_continue
  op: choose
  objective: obj-make-weather-small-talk-01
  bloom: apply
  prompt_md: 'Nora has to leave when the bus arrives. Choose Amir’s most natural next reply.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Det regner fortsatt. Tror du det blir bedre snart?»
    - speaker: Situasjon
      text_md: Bussen til Nora kommer, og hun må gå.
  options:
  - id: abrupt-topic
    text: Hva skal du spise til middag?
    correct: false
    why: It changes topic just as the situation calls for a brief farewell.
  - id: weather-close
    text: Vi får håpe det blir bedre. Ha en fin dag!
    correct: true
    why: It answers within the weather topic and closes naturally because Nora must leave.
  - id: weather-continue
    text: Har du paraply, og liker du regnvær?
    correct: false
    why: It opens two new questions even though Nora's arriving bus calls for a closing.
  explanation_md: 'Når situasjonen endrer seg, passer det å avslutte med en kort kommentar om været og et farvel.'
  derived_from:
  - section_id: closing-or-continuing
- handle: revise_weather_exchange
  op: write
  objective: obj-make-weather-small-talk-01
  bloom: apply
  prompt_md: 'Nora: «Det er kaldt i dag.» Amir: «Det regner. Hva jobber du med?» Rewrite Amir’s line in Norwegian. Reply to Nora, keep the information about the rain, and ask whether she has an umbrella.'
  response_language: 'no'
  min_words: 6
  max_words: 14
  judge_prompt: Evaluate criteria responds-to-nora, uses-rain-fact, and keeps-weather-focus and report each verdict with evidence.
  criteria:
  - id: responds-to-nora
    instruction: Clearly responds to Nora's comment about the cold.
  - id: uses-rain-fact
