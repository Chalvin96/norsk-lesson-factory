- handle: future_anchor_noticing
  op: choose
  objective: obj-future-expressions-01
  bloom: understand
  prompt_md: Choose the function of each numbered line.
  stem_md: Toget går klokka ni i morgen. 2. Jeg skal kjøpe billetter i kveld. 3. Se på de mørke skyene!
    Det kommer til å regne. 4. Jeg tror Jonas vil like Lillehammer.
  options:
  - id: wrong-vil
    text: 1 = timetable; 2 = commitment; 3 = expected result based on signs; 4 = desire
    correct: false
    why: Jeg tror frames the fourth line as an assessment about Jonas's future reaction, not as Jonas's
      desire.
  - id: wrong-plan
    text: 1 = commitment; 2 = timetable; 3 = expected result based on signs; 4 = assessment
    correct: false
    why: The ticket purchase is the decision, while the fixed departure time belongs to a timetable.
  - id: wrong-predictions
    text: 1 = timetable; 2 = commitment; 3 = assessment; 4 = expected result based on signs
    correct: false
    why: The opinion frame marks the assessment, while the dark clouds provide present evidence.
  - id: correct
    text: 1 = timetable; 2 = commitment; 3 = expected result based on signs; 4 = assessment
    correct: true
    why: The fixed departure is a timetable, the decision is a commitment, the clouds support a sign-based
      expectation, and the opinion frame makes a prediction.
  derived_from:
  - section_id: first-checkpoint-speaker-perspective
