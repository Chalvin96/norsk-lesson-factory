- handle: trip_message_completion
  op: write
  objective: obj-future-expressions-01
  bloom: apply
  prompt_md: 'Write a 35–55-word Norwegian message to Maja about tomorrow’s library open house. Facts: Jonas
    has promised to set out chairs before visitors arrive; the posted schedule says the library opens at
    11.00; Maja expects many families to come; dark clouds are gathering and rain is expected. Show which
    event is a settled plan, which is on the timetable, what Maja predicts, and what the present signs
    suggest. Choose natural future wording that makes those perspectives clear; do not copy a sentence
    from the lesson dialogue.'
  derived_from:
  - section_id: back-to-maja-and-jonas
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: >-
    Check the response against the supplied facts and requested perspectives. Accept natural
    Bokmål variants rather than requiring one exact future form for each fact: skal can express the promise,
    present tense can report the fixed opening time, and both vil and kommer til å can express predictions
    when the surrounding wording makes the intended perspective clear. Do not treat a natural alternative
    as wrong solely because it uses a different future expression. Require the message to distinguish the
    settled plan, timetable, opinion-based expectation, and evidence-based expectation.
  criteria:
  - id: message-purpose
    instruction: Writes a connected, practical Norwegian update to Maja about the library open house.
  - id: supplied-facts
    instruction: Accurately includes Jonas's promise, the library's 11.00 opening, Maja's expectation of many families, and the rain outlook.
  - id: future-perspectives
    instruction: Makes clear which event is planned, scheduled, expected as Maja's view, and suggested by the current weather signs, using natural future wording for each.
  - id: word-bound
    instruction: Contains 35–55 words.
  - id: comprehensible-norwegian
    instruction: Is comprehensible Norwegian despite minor errors.
- handle: birthday_future_transfer
  op: write
  objective: obj-future-expressions-01
  bloom: apply
  prompt_md: 'Til: Nora. Formål: Gi Nora en praktisk oppdatering før bursdagsmiddagen. FAKTA • Sara har
    lovet å hente kaken i kveld. • Restauranten: åpningstid klokka 19.00. • Emil forventer gjestene før
    middagen. • Mørke uværsskyer samler seg; det ventes regn i kveld. Uttrykk hvert punkt med den formen
    det krever: Saras løfte med skal + infinitiv, åpningstiden med presens sammen med framtidstiden, Emils
    forventning med vil i en meningsramme som «jeg tror», og regnet med kommer til å + infinitiv. Skriv
    en sammenhengende melding på 35–55 ord.'
  derived_from:
  - section_id: cumulative-transfer-birthday-dinner
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: Evaluate all eight criteria as gating. The message must be a connected update to Nora
    that preserves all four supplied facts, expresses each fact with the required future form named in
    the prompt, and stays within 35–55 words. Accept natural Bokmål wording.
  criteria:
  - id: message-purpose
    instruction: The response is a connected practical message to Nora about the birthday dinner.
  - id: supplied-facts
    instruction: The message accurately communicates all four supplied facts.
  - id: word-bound
    instruction: The message contains 35–55 words.
  - id: comprehensible-norwegian
    instruction: The message is comprehensible Norwegian despite minor errors.
  - id: commitment-form
    instruction: Sara's promise is expressed with skal followed by a bare infinitive.
  - id: arrangement-form
    instruction: The restaurant opening is expressed in the present tense together with its future time.
  - id: assessment-form
    instruction: Emil's expectation is expressed with vil in an opinion frame.
  - id: evidence-form
    instruction: The weather result is expressed with kommer til å followed by an infinitive.
- handle: future_expression_review
  op: choose
  objective: obj-future-expressions-01
  bloom: analyze
  prompt_md: Match each numbered update with the perspective it expresses.
  explanation_md: The first update is a commitment, the second gives a timetable, and the third
    frames an assessment with Jeg tror. The final sentence highlights an expected result supported
    by the visible queue. Both vil and kommer til å can make predictions, so this item asks what the
    chosen sentence emphasizes rather than treating one grammatical prediction form as wrong.
  derived_from:
  - section_id: final-retrieval
  stem_md: 'A: Jeg skal sende deg en melding i kveld. B: Toget går klokka 10.26 i morgen. C: Jeg tror toget vil være fullt. D: Se på den lange køen! Toget kommer til å bli fullt.'
  options:
  - id: wrong-assessment
    text: A = timetable; B = commitment; C = assessment; D = expected result supported by visible signs.
    correct: false
    why: A is a commitment and B gives the timetable.
  - id: wrong-final-plan
    text: A = commitment; B = timetable; C = assessment; D = personal plan.
    correct: false
    why: The queue is evidence for a prediction in D, not a plan by the speaker.
  - id: correct
    text: A = commitment; B = timetable; C = assessment; D = expected result supported by visible signs.
    correct: true
    why: A is a commitment, B is a scheduled departure, C is an opinion-framed assessment, and the queue
      supports the expected result in D.
  - id: wrong-final-assessment
    text: A = commitment; B = timetable; C = expected result supported by visible signs; D = assessment.
    correct: false
    why: Jeg tror frames C as an assessment, while the queue provides visible evidence for the expected
      result in D.
