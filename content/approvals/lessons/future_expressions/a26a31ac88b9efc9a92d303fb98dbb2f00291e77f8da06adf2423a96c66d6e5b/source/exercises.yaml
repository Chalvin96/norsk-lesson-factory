- handle: trip_message_completion
  op: write
  objective: obj-future-expressions-01
  bloom: apply
  prompt_md: >-
    Melding til Maja om åpent hus på biblioteket i morgen: Jonas har lovet å sette fram stolene før
    gjestene kommer. Biblioteket åpner klokka 11. Maja tror det kommer mange familier. Mørke skyer
    samler seg, og det er ventet regn. Skriv en melding på 35–55 ord. Fortell om avtalen,
    åpningstiden, Majas forventning og det været tyder på. Bruk naturlige framtidsformer, og finn
    på dine egne setninger.
  derived_from:
  - section_id: back-to-maja-and-jonas
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: >-
    Check the response against the supplied facts and requested perspectives. Accept natural
    Bokmål variants rather than requiring one exact future form for each fact: skal can express the promise,
    present tense can report the fixed opening time, and both vil and kommer til å can express predictions
    when the surrounding wording makes the intended perspective clear. Do not treat a natural alternative
    as wrong solely because it uses a different future expression. Require the message to distinguish the
    settled plan, timetable, opinion-based expectation, and evidence-based expectation.
  criteria:
  - id: message-purpose
    instruction: Writes a connected, practical Norwegian update to Maja about the library open house.
  - id: supplied-facts
    instruction: Accurately includes Jonas's promise, the library's 11.00 opening, Maja's expectation of many families, and the rain outlook.
  - id: future-perspectives
    instruction: Makes clear which event is planned, scheduled, expected as Maja's view, and suggested by the current weather signs, using natural future wording for each.
  - id: word-bound
    instruction: Contains 35–55 words.
  - id: comprehensible-norwegian
    instruction: Is comprehensible Norwegian despite minor errors.
- handle: birthday_future_transfer
