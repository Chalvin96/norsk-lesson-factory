  prompt_md: "Til kollegaen din: Leila har skrevet: «Jeg har vært på Fjordhuset før, men besøket var forrige fredag. Først har vi spist middag, og så har vi hørt på et band. Jonas vil bare ha kaffe i kveld fordi han spiste allerede. Jeg bodde i området i tre år og bor her fortsatt.» Skriv meldingen om slik at tidsforholdene blir tydelige. Behold alle opplysningene, også Leilas tidligere erfaring."
  explanation_md: En tydelig omskriving skiller mellom tidligere erfaring, et datert besøk, avsluttede hendelser, et resultat som gjelder nå og en periode som fortsetter.
