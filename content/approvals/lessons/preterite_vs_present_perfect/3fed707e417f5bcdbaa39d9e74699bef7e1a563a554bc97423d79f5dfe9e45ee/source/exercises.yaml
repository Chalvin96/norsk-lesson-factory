  explanation_md: Presens perfektum viser den tidligere turen som en erfaring. Preteritum forteller om hendelsene forrige fredag i riktig rekkefølge.
  derived_from:
  - section_id: telling-a-sequence-of-events
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: "Evaluate only the visible account task. Apply supplied-events, event-order, coherent-account, experience-form, and narrative-form as gating criteria. Record all ids ending in -observation diagnostically; they never make an otherwise successful account fail."
  criteria:
  - id: supplied-events
    instruction: The account includes the prior visit, the trip last Friday with colleagues, dinner, listening to music, and the bus home.
  - id: event-order
    instruction: The account presents dinner before listening to music and the bus journey home afterwards.
  - id: coherent-account
    instruction: The events form one understandable Norwegian account.
  - id: experience-form
    instruction: The earlier visit is expressed naturally with presens perfektum.
  - id: narrative-form
    instruction: The completed events last Friday are expressed naturally with preteritum.
- handle: anchor_message_revision
