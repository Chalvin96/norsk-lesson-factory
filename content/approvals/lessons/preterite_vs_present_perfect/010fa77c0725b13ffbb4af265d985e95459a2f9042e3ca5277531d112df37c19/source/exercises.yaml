- handle: anchor_message_revision
  op: write
  objective: obj-preterite-vs-present-perfect-01
  bloom: analyze
  prompt_md: 'Til kollegaen din. Leila har skrevet: «Jeg har vært på Fjordhuset før, men besøket var forrige
    fredag. Først har vi spist middag, og så har vi hørt på et band. Jonas vil bare ha kaffe i kveld fordi
    han spiste allerede. Jeg bodde i området i tre år og bor her fortsatt.» Rewrite the message so its
    time relationships are clear. Preserve every stated meaning, including Leila''s prior experience,
    and use the appropriate tense for each relationship. Write 45–75 Norwegian words.'
  explanation_md: A clear revision distinguishes prior experience, a dated visit, its completed sequence,
    a present result, and a duration that continues now.
  derived_from:
  - section_id: returning-to-leila-and-jonas
  response_language: 'no'
  min_words: 45
  max_words: 75
  judge_prompt: Evaluate only the visible revision task. Apply message-purpose, supplied-meanings, connected-message,
    word-bound, experience-form, completed-past-form, current-result-form, and continuing-duration-form
    as gating criteria. Record all ids ending in -observation diagnostically; they never make an otherwise
    successful revision fail.
  criteria:
  - id: message-purpose
    instruction: The response is a Norwegian message suitable for informing a colleague.
  - id: supplied-meanings
    instruction: The message preserves Leila's prior experience, the visit last Friday, the meal and band,
      Jonas wanting only coffee because he has eaten, and Leila still living in the area after three years.
  - id: connected-message
    instruction: The supplied meanings form an understandable connected message.
  - id: word-bound
    instruction: The response contains 45–75 words.
  - id: experience-form
    instruction: Prior experience is expressed naturally with presens perfektum.
  - id: completed-past-form
    instruction: The dated visit and its completed actions are expressed naturally with preteritum.
  - id: current-result-form
    instruction: Jonas's present reason is expressed naturally with presens perfektum.
  - id: continuing-duration-form
    instruction: Leila's continuing residence is expressed naturally with presens perfektum.
  - id: experience-form-observation
    instruction: 'Observation only: note the exact form used for prior experience.'
  - id: completed-past-form-observation
    instruction: 'Observation only: note the exact form used for the dated visit and completed actions.'
  - id: current-result-form-observation
    instruction: 'Observation only: note the exact form used for Jonas''s present reason.'
  - id: continuing-duration-form-observation
    instruction: 'Observation only: note the exact form used for Leila''s continuing residence.'
- handle: cumulative_evening_transfer
  op: write
  objective: obj-preterite-vs-present-perfect-01
  bloom: apply
  prompt_md: 'Message from Sara to her housemate. Purpose: say what is ready before the guests arrive.
    Facts: today Sara started cleaning this morning and is still working; the dinner is made and the food
    is ready now; she sent the guests a message at three; she moved in four years ago and still lives
    there; she has hosted guests before, at an unspecified time; last month the guests arrived first,
    then they ate, and afterwards they went home. Use presens perfektum for facts linked to the present
    and preteritum for dated or completed events. Write Sara''s 70–110-word Norwegian message.'
  explanation_md: The facts invite a natural mixture of presens perfektum for links to now and preteritum
    for dated or completed events.
  derived_from:
  - section_id: cumulative-transfer-a-different-evening
  response_language: 'no'
  min_words: 70
  max_words: 110
  judge_prompt: Evaluate only the visible message task. Apply audience-purpose, supplied-facts, completed-dinner,
    coherent-account, word-bound, unfinished-period-form, current-result-form, specific-event-form, continuing-duration-form,
    experience-form, and narrative-form as gating criteria. Record all ids ending in -observation diagnostically;
    they never make an otherwise successful message fail.
  criteria:
  - id: audience-purpose
    instruction: The response is a Norwegian message to Sara's housemate explaining the preparations.
  - id: supplied-facts
    instruction: The message includes today's cleaning, the ready meal, the message at three, four years
      in the flat, and prior experience hosting guests.
  - id: completed-dinner
    instruction: The message recounts last month's arrival, meal, and departure in the supplied order.
  - id: coherent-account
    instruction: The facts form one understandable message.
  - id: word-bound
    instruction: The response contains 70–110 words.
  - id: unfinished-period-form
    instruction: Today's continuing work is expressed naturally with presens perfektum.
  - id: current-result-form
    instruction: The ready meal is expressed naturally with presens perfektum.
  - id: specific-event-form
    instruction: The message sent at three is expressed naturally with preteritum.
  - id: continuing-duration-form
    instruction: Residence continuing for four years is expressed naturally with presens perfektum.
  - id: experience-form
    instruction: Unspecified hosting experience is expressed naturally with presens perfektum.
  - id: narrative-form
    instruction: The completed dinner sequence is expressed naturally with preteritum.
  - id: unfinished-period-form-observation
    instruction: 'Observation only: note the form used for today''s continuing work.'
  - id: current-result-form-observation
    instruction: 'Observation only: note the form used for the ready meal.'
  - id: specific-event-form-observation
    instruction: 'Observation only: note the form used for the message at three.'
  - id: continuing-duration-form-observation
    instruction: 'Observation only: note the form used for the continuing residence.'
  - id: experience-form-observation
    instruction: 'Observation only: note the form used for hosting experience.'
