- handle: identify_pronoun_reference_in_cafe
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: understand
  prompt_md: Velg hva hvert pronomen viser til.
  derived_from:
  - section_id: replacing-a-name-with-a-subject-pronoun
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Ali, jobber du her i dag?»
    - speaker: Ali
      text_md: «Ja, jeg jobber her i dag.»
    - speaker: Emil
      text_md: «Nora og Ali lager kaffe. De er raske!»
  options:
  - id: mapping-b
    text: «jeg» = Maja, «du» = Nora og Ali, «de» = Maja
    correct: false
    why: «Du» viser til én person Maja snakker til. Her viser «de» til Nora og Ali,
      ikke til Maja.
  - id: mapping-c
    text: «jeg» = Ali, «du» = Ali, «de» = Nora og Ali
    correct: true
    why: Maja spør Ali med «du», Ali svarer med «jeg» om seg selv, og Emil
      omtaler Nora og Ali som «de».
  - id: mapping-a
    text: «jeg» = Maja, «du» = Maja, «de» = Nora og Ali
    correct: false
    why: «Du» viser til den Maja snakker til, ikke til Maja selv.
  explanation_md: «Jeg» viser til taleren, «du» til én person man snakker til,
    og «de» til personer man omtaler.
- handle: recognize_all_subject_pronouns
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: understand
  prompt_md: Velg pronomenrekken som passer til alle situasjonene.
  derived_from:
  - section_id: a-useful-perspective-map
  stem_md: 'Du presenterer deg selv, snakker til én person, omtaler Emil, omtaler
    Sara, snakker om deg selv sammen med Sara, snakker til Nora og Ali og omtaler
    Nora og Ali.'
  options:
  - id: all-pronouns-b
    text: jeg, du, han, hun, vi, de, dere
    correct: false
    why: This reverses the forms for a group being addressed and a group being
      discussed.
  - id: all-pronouns-c
    text: vi, du, han, hun, jeg, dere, de
    correct: false
    why: This reverses the forms for the speaker alone and the speaker with
      another person.
  - id: all-pronouns-a
    text: jeg, du, han, hun, vi, dere, de
    correct: true
    why: The forms match speaker inclusion, addressee number, and the people
      being discussed.
  explanation_md: Velg pronomen ut fra hvem som snakker, hvem som blir tiltalt,
    og hvem som blir omtalt.
