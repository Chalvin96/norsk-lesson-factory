- handle: review_choose_han_or_hun_for_named_person
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: apply
  prompt_md: Velg Inas naturlige neste setning om Henrik.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ina
      text_md: «Henrik arbeider på biblioteket.»
  options:
  - id: henrik-female
    text: Hun hjelper studentene.
    correct: false
    why: This singular subject pronoun would normally refer to a female person,
      not Henrik.
  - id: address-henrik
    text: Du hjelper studentene.
    correct: false
    why: This changes from discussing Henrik to addressing a listener.
  - id: henrik-male
    text: Han hjelper studentene.
    correct: true
    why: Ina continues discussing Henrik with the masculine singular subject
      pronoun.
  derived_from:
  - section_id: one-person-being-discussed-han-and-hun
- handle: review_shift_from_direct_address_to_discussion
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: apply
  prompt_md: Velg Eiriks svar til Pia.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Eirik
      text_md: «Lise, du har nøkkelen.»
    - speaker: Lise
      text_md: «Ja, jeg låser døra. Ha det!»
    - speaker: Pia
      text_md: «Vent, hvem har nøkkelen?»
  options:
  - id: address-pia
    text: Pia har nøkkelen.
    correct: false
    why: This would tell Pia that Pia has the key, which conflicts with the
      preceding exchange.
  - id: include-eirik
    text: Vi har nøkkelen.
    correct: false
    why: This would say that Eirik and at least one other person have the key.
  - id: discuss-lise
    text: Hun har nøkkelen.
    correct: true
    why: Eirik answers Pia's question by referring back to Lise.
  derived_from:
  - section_id: one-person-being-discussed-han-and-hun
