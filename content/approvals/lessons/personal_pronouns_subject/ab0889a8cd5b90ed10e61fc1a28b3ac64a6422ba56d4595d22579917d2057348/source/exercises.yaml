- handle: use_subject_pronouns_at_the_library
  op: write
  objective: obj-personal-pronouns-subject-01
  bloom: apply
  prompt_md: 'Du er Nora. Skriv en melding på 40–70 ord til klassegruppa om bibliotekplanen.
    Fortell at du er på biblioteket, Ali og Sara er klare, spør Maja om hun er klar,
    be Maja og Jonas legge bøkene på bordet, og si at de arbeider raskt og at du og
    Ali lager klasseutstillingen. Bruk «jeg», «han», «hun», «du», «dere», «de» og
    «vi» der det passer.'
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: "no"
  judge_prompt: Evaluate only the listed criteria. The response passes when
    message-purpose, supplied-facts, word-bound, bokmal-comprehensibility, and
    all pronoun criteria pass. Accept natural Bokmål variants and minor language
    errors when the message remains comprehensible.
  criteria:
  - id: message-purpose
    instruction: The response is a message to the class group that communicates
      the library plan.
  - id: supplied-facts
    instruction: The message communicates all six supplied facts without
      materially changing them.
  - id: word-bound
    instruction: The message contains 40–70 words.
  - id: bokmal-comprehensibility
    instruction: The message is comprehensible Bokmål.
  - id: jeg-pronomen
    instruction: The response refers to Nora with «jeg» where appropriate.
  - id: han-hun-pronomen
    instruction: The response refers to Ali and Sara with suitable singular
      subject pronouns where appropriate.
  - id: du-pronomen
    instruction: The response addresses Maja with «du» where appropriate.
  - id: dere-pronomen
    instruction: The response addresses Maja and Jonas with «dere» where
      appropriate.
  - id: de-pronomen
    instruction: The response discusses Maja and Jonas with «de» where
      appropriate.
  - id: vi-pronomen
    instruction: The response includes Nora with Ali by using «vi» where
      appropriate.
- handle: review_choose_jeg_or_vi_for_speaker
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: understand
  prompt_md: Hvem er med når Liv sier «vi»?
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Omar
      text_md: «Liv, skal vi rydde kjøkkenet etter lunsj?»
    - speaker: Liv
      text_md: «Ja, vi rydder kjøkkenet etter lunsj.»
  options:
  - id: liv-only
    text: Bare Liv.
    correct: false
    why: Da viser «vi» bare til Liv, ikke til Omar som foreslo at de skulle gjøre
      oppgaven sammen.
  - id: omar-only
    text: Bare Omar.
    correct: false
    why: Liv inkluderer seg selv i oppgaven i stedet for å legge den bare på Omar.
  - id: liv-and-omar
    text: Liv og Omar.
    correct: true
    why: Livs svar inkluderer både henne selv og den som foreslo oppgaven.
  derived_from:
  - section_id: the-speaker-jeg-and-vi
