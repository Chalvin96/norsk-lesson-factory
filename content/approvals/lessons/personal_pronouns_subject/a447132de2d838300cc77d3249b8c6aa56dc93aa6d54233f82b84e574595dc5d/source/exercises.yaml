- handle: use_subject_pronouns_at_the_library
  op: write
  objective: obj-personal-pronouns-subject-01
  bloom: apply
  prompt_md: 'You are Nora. Write a 40–70-word Bokmål message to your class group so everyone knows the
    library plan. Include every fact: you are at the library; Ali is ready, and Sara is also ready; ask
    Maja whether she is ready; tell Maja and Jonas to put the books on the table; report that Maja and
    Jonas are working quickly; you and Ali are making the class display. Use the subject pronouns «jeg»,
    «han», «hun», «du», «dere», «de» and «vi» where appropriate.'
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  judge_prompt: Evaluate only the listed criteria. The response passes when message-purpose, supplied-facts,
    word-bound, bokmal-comprehensibility, and all pronoun criteria pass. Accept natural Bokmål variants
    and minor language errors when the message remains comprehensible.
  criteria:
  - id: message-purpose
    instruction: The response is a message to the class group that communicates the library plan.
  - id: supplied-facts
    instruction: The message communicates all six supplied facts without materially changing them.
  - id: word-bound
    instruction: The message contains 40–70 words.
  - id: bokmal-comprehensibility
    instruction: The message is comprehensible Bokmål.
  - id: jeg-pronomen
    instruction: The response refers to Nora with «jeg» where appropriate.
  - id: han-hun-pronomen
    instruction: The response refers to Ali and Sara with suitable singular subject pronouns where appropriate.
  - id: du-pronomen
    instruction: The response addresses Maja with «du» where appropriate.
  - id: dere-pronomen
    instruction: The response addresses Maja and Jonas with «dere» where appropriate.
  - id: de-pronomen
    instruction: The response discusses Maja and Jonas with «de» where appropriate.
  - id: vi-pronomen
    instruction: The response includes Nora with Ali by using «vi» where appropriate.
- handle: review_choose_jeg_or_vi_for_speaker
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: understand
  prompt_md: Choose who is included in Liv's statement.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Omar
      text_md: «Liv, skal vi rydde kjøkkenet etter lunsj?»
    - speaker: Liv
      text_md: «Ja, vi rydder kjøkkenet etter lunsj.»
  options:
  - id: liv-only
    text: Only Liv.
    correct: false
    why: This would treat Liv's reply as referring only to its speaker, not to the shared task Omar proposed.
  - id: omar-only
    text: Only Omar.
    correct: false
    why: Liv includes herself in the agreed task rather than assigning it only to Omar.
  - id: liv-and-omar
    text: Liv and Omar.
    correct: true
    why: Liv's reply includes herself and the person who proposed the shared task.
  derived_from:
  - section_id: the-speaker-jeg-and-vi
