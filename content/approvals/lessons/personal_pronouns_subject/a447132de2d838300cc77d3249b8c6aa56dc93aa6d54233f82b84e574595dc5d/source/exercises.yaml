- handle: identify_pronoun_reference_in_cafe
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: understand
  prompt_md: Choose the correct reference mapping.
  derived_from:
  - section_id: replacing-a-name-with-a-subject-pronoun
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Ja, jeg jobber her i dag.»
    - speaker: Ali
      text_md: «Maja, jobber du her i dag?»
    - speaker: Emil
      text_md: «Nora og Ali lager kaffe. De er raske!»
  options:
  - id: mapping-b
    text: «jeg» = Maja, «du» = Nora og Ali, «de» = Maja
    correct: false
    why: «Du» addresses one listener here, while «de» refers to the two people being discussed.
  - id: mapping-c
    text: «jeg» = Ali, «du» = Maja, «de» = Nora og Ali
    correct: false
    why: The first line is spoken by Maja, so «jeg» refers to Maja.
  - id: mapping-a
    text: «jeg» = Maja, «du» = Maja, «de» = Nora og Ali
    correct: true
    why: Maja refers to herself with «jeg», Ali addresses Maja with «du», and Emil discusses Nora and
      Ali with «de».
  explanation_md: The speaker uses «jeg», one listener is addressed with «du», and a discussed group is
    referred to with «de».
- handle: recognize_all_subject_pronouns
  op: choose
  objective: obj-personal-pronouns-subject-01
  bloom: understand
  prompt_md: Choose the complete pronoun mapping.
  derived_from:
  - section_id: a-useful-perspective-map
  stem_md: 'Speaker alone: ___; one listener: ___; Emil, discussed: ___; Sara, discussed: ___; speaker
    with Sara: ___; Nora and Ali, addressed: ___; Nora and Ali, discussed: ___.'
  options:
  - id: all-pronouns-b
    text: jeg, du, han, hun, vi, de, dere
    correct: false
    why: This reverses the forms for a group being addressed and a group being discussed.
  - id: all-pronouns-c
    text: vi, du, han, hun, jeg, dere, de
    correct: false
    why: This reverses the forms for the speaker alone and the speaker with another person.
  - id: all-pronouns-a
    text: jeg, du, han, hun, vi, dere, de
    correct: true
    why: The forms match speaker inclusion, addressee number, and the people being discussed.
  explanation_md: Choose pronouns from conversational role first, then number and gender where relevant.
