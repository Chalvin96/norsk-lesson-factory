- handle: dinner_plan_transfer
  op: write
  objective: obj-fordi-derfor-sa-01
  bloom: apply
  prompt_md: 'Skriv en melding på 35–55 ord til gjestene om forsinkelsen og middagsplanen. Bruk minst to av «fordi», «derfor» og «så».'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Gjest
      text_md: «Når blir middagen klar? Vi er sultne.»
    - speaker: Emil
      text_md: «Ovnen sluttet å virke. Jeg bestilte mat fra en restaurant, men leveringen kom sent.»
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: Check criteria message-purpose, uses-connectors, supplied-facts, word-bound, and connector word order. A response fails if it uses fordi, derfor, or så with incorrect word order.
  criteria:
  - id: message-purpose
    instruction: The response is a message to the guests that explains the delay and communicates the dinner plan.
  - id: uses-connectors
    instruction: The response uses at least two of fordi, derfor, and så to connect the reason and the result.
  - id: supplied-facts
    instruction: The response remains consistent with the supplied facts and does not invent a conflicting account.
  - id: word-bound
    instruction: The response contains 35–55 words.
  - id: fordi-order-observation
    instruction: If the learner uses fordi, its clause must have appropriate subordinate-clause word order.
  - id: derfor-order-observation
    instruction: If the learner uses sentence-initial derfor, the finite verb must precede the subject.
  - id: sa-order-observation
    instruction: If the learner uses result-linking så, the following result clause must have appropriate main-clause word order.
  derived_from:
  - section_id: transfer-to-a-new-situation
