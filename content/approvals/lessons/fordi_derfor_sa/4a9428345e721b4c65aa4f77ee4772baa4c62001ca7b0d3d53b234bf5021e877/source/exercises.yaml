- handle: connector_meaning_choice
  op: choose
  objective: obj-fordi-derfor-sa-01
  bloom: understand
  prompt_md: 'Velg alternativet der setningene uttrykker riktig årsak eller konsekvens. Her skal «så» knytte årsak til resultat.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Hvorfor flyttet dere møtet?»
    - speaker: Mina
      text_md: «Rommet var dobbeltbooket.»
  options:
  - id: sa-order-error
    text: Vi flyttet møtet fordi rommet var dobbeltbooket. Rommet var dobbeltbooket. Derfor flyttet vi møtet. Rommet var dobbeltbooket, så flyttet vi møtet.
    correct: false
    why: After result-linking så, the result clause keeps subject–verb order.
  - id: correct-three-connectors
    text: Vi flyttet møtet fordi rommet var dobbeltbooket. Rommet var dobbeltbooket. Derfor flyttet vi møtet. Rommet var dobbeltbooket, så vi flyttet møtet.
    correct: true
    why: Fordi gives the reason after the result, sentence-initial derfor takes verb–subject order, and så links the cause to its result with subject–verb order.
  - id: derfor-order-error
    text: Vi flyttet møtet fordi rommet var dobbeltbooket. Rommet var dobbeltbooket. Derfor vi flyttet møtet. Rommet var dobbeltbooket, så vi flyttet møtet.
    correct: false
    why: After sentence-initial derfor the finite verb must come before the subject.
