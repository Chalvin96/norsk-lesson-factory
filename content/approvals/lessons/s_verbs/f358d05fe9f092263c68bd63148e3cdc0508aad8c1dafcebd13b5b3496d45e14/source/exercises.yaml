- handle: respond_to_everyday_questions_with_s_verbs
  op: write
  objective: obj-s-verbs-01
  bloom: apply
  prompt_md: 'Nora writes: «Hva synes du om kafeen?» Facts: quiet room, comfortable chairs, good coffee.
    Write Nora a 15–25-word Norwegian reply that gives your opinion. Use synes.'
  explanation_md: A useful reply answers the question with a clear personal opinion supported by the supplied
    facts and uses synes.
  derived_from:
  - section_id: guided-production
  response_language: 'no'
  min_words: 15
  max_words: 25
  judge_prompt: 'Evaluate only criteria reply-purpose, supplied-fact, word-bound, and opinion-form-observation
    when deciding whether the answer passes. Anchor that must pass: «Jeg synes kafeen er hyggelig. Rommet
    er stille, stolene er komfortable, og kaffen er god.» Any otherwise valid answer without synes must
    fail opinion-form-observation.'
  criteria:
  - id: reply-purpose
    instruction: Replies to Nora in Norwegian and gives an opinion about the café.
  - id: supplied-fact
    instruction: Supports the opinion with at least one supplied fact.
  - id: word-bound
    instruction: Contains 15–25 words.
  - id: opinion-form-observation
    instruction: Uses synes as a complete lexical s-verb.
- handle: transfer_s_verbs_to_an_evening_course
  op: write
  objective: obj-s-verbs-01
  bloom: apply
  prompt_md: 'Message from Jonas: «Hvordan går kveldskurset?» Facts: The speaker is comfortable in the
    group; the teacher explains clearly; a quiet reading room is available upstairs; the class gathers
    there before lessons; the speaker sees Jonas during the break. Write Jonas a connected 35–60-word
    Norwegian update. Use synes, trives, finnes, møtes, and ses naturally as complete lexical s-verbs.'
  explanation_md: The facts invite the five central meanings in a new setting and require the target s-verbs
    in a connected update without requiring a fixed wording.
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 35
  max_words: 60
  judge_prompt: 'Evaluate only criteria message-purpose, fact-coverage, word-bound, lexical-forms-required,
    and mutual-subjects-observation when deciding whether the answer passes. Anchor that must pass: «Hei
    Jonas! Jeg trives godt i gruppa og synes læreren forklarer tydelig. Det finnes et stille leserom oppe,
    så jeg kan lese der etter jobb. Klassen møtes der før timen, og du og jeg ses i pausen.» Near-miss
    that must fail fact-coverage: «Hei Jonas! Kurset går fint, og jeg liker skolen veldig godt. Vi har
    mye å gjøre hver uke.»'
  criteria:
  - id: message-purpose
    instruction: Gives Jonas a connected Norwegian update about the speaker's evening course.
  - id: fact-coverage
    instruction: Communicates all five supplied facts without contradicting them.
  - id: word-bound
    instruction: Contains 35–60 words.
  - id: lexical-forms-required
    instruction: Contains synes, trives, finnes, møtes, and ses naturally as complete lexical s-verbs.
  - id: mutual-subjects-observation
    instruction: Requires that statements with møtes or ses include all mutual participants in the subject;
      fail if a statement uses an invalid reciprocal subject.
- handle: retrieve_five_lexical_s_verbs
  op: write
  objective: obj-s-verbs-01
  bloom: apply
  prompt_md: 'Your friend asks about your new club. Facts: you think it is interesting; you feel comfortable
    there; a quiet room is available; the members meet on Tuesdays; you and your friend will see one another
    tomorrow. Write a 25–45-word Norwegian reply using synes, trives, finnes, møtes, and ses once each.'
  explanation_md: Each required lexical s-verb corresponds to one supplied meaning.
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 25
  max_words: 45
  judge_prompt: 'Decide the pass result only from criteria reply-purpose, five-complete-forms, supplied-meanings,
    mutual-subjects, and word-bound. Anchor that must pass: «Jeg synes klubben er interessant, og jeg
    trives godt der. Det finnes et stille rom. Medlemmene møtes på tirsdager, og du og jeg ses i morgen.»
    Near-miss that must fail five-complete-forms: «Jeg liker klubben og har det bra der. Det finnes et
    rom. Medlemmene samles tirsdag, og vi treffes i morgen.»'
  criteria:
  - id: reply-purpose
    instruction: Writes a Norwegian reply to a friend about the new club.
  - id: five-complete-forms
    instruction: Uses synes, trives, finnes, møtes, and ses exactly once each as complete lexical s-verbs.
  - id: supplied-meanings
    instruction: Expresses the five supplied facts with the corresponding taught meanings.
  - id: word-bound
    instruction: Contains 25–45 words.
  - id: mutual-subjects
    instruction: Uses møtes with the members as mutual participants and ses with both the writer and the
      friend as mutual participants, matching the supplied facts.
