  options:
  - id: direct-object
    text: Nora møtes Amir utenfor biblioteket.
    correct: false
    why: Møtes cannot take Amir as a direct object in this meaning.
  - id: missing-participant
    text: Nora møtes utenfor biblioteket.
    correct: false
    why: The situation names two participants, but this subject names only Nora.
  - id: mutual-subject
    text: Nora og Amir møtes utenfor biblioteket.
    correct: true
    why: Both participants are in the subject of the reciprocal verb.
- handle: review_select_motes_or_ses_by_intended_meaning
  op: choose
  objective: obj-s-verbs-01
  bloom: analyze
  prompt_md: Choose the explanation of the difference between Nora's two highlighted lines.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Vi møtes utenfor kinoen klokka sju.»
    - speaker: Nora
      text_md: «Ha det bra! Vi ses i kveld.»
  explanation_md: Møtes presents the arranged meeting event, while ses refers to seeing one another and
    works naturally in a farewell.
  derived_from:
  - section_id: short-retrieval-review
  options:
  - id: same-function
    text: Both verbs merely repeat the same meeting arrangement, so either line can replace the other
      without changing the exchange.
    correct: false
    why: The first line arranges the meeting, while the second closes the exchange by anticipating future
      contact.
  - id: passive-contrast
    text: Møtes is active, but ses is a passive form meaning that someone will look at the speakers.
    correct: false
    why: Both are lexical reciprocal s-verbs here; ses does not describe an action done to the speakers.
  - id: arrangement-and-farewell
    text: Møtes gives the arranged meeting place and time; ses refers back to the future contact in the
      farewell.
    correct: true
    why: This accounts for both the practical arrangement and the closing function.
- handle: review_ses_with_mutual_subject
  op: choose
  objective: obj-s-verbs-01
  bloom: apply
  prompt_md: Choose the sentence that matches the situation.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Lea og Omar jobber i samme bygning og ser hverandre nesten hver dag, uten å avtale møter.
  explanation_md: Ses expresses seeing one another, so the subject includes both participants.
  derived_from:
  - section_id: short-retrieval-review
  options:
  - id: direct-object
    text: Lea ses Omar nesten hver dag.
    correct: false
    why: Ses does not take Omar as a direct object in the mutual meaning.
  - id: meeting-focus
    text: Lea og Omar møtes til et planlagt møte nesten hver dag.
    correct: false
    why: This adds a planned-meeting meaning that is absent from the situation.
  - id: mutual-seeing
    text: Lea og Omar ses nesten hver dag.
    correct: true
    why: Both people who see one another are included in the subject.
- handle: review_lexical_s_or_passive
  op: choose
  objective: obj-s-verbs-01
  bloom: analyze
  prompt_md: Choose the explanation that fits the sentence. Remember that passive s-forms describe an
    action done to the subject.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ane
      text_md: «Det finnes et apotek ved stasjonen.»
  explanation_md: In this confusable pair, finnes expresses existence; it does not describe an action
    done to the pharmacy.
  derived_from:
  - section_id: short-retrieval-review
  options:
  - id: passive
    text: Finnes is passive because someone performs an action on the pharmacy.
    correct: false
    why: No agent acts on the pharmacy; the sentence expresses existence.
  - id: finding
    text: Finnes means that an unnamed person finds the pharmacy.
    correct: false
    why: A locating event would use a form of finne, such as finner.
  - id: lexical
    text: Finnes is a lexical s-verb meaning that the pharmacy exists or is available.
    correct: true
    why: The sentence states that a pharmacy is available at that location.
