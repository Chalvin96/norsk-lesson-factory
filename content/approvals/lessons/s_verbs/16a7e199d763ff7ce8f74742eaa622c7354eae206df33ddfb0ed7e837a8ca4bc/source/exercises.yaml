    turns:
    - speaker: Context
      text_md: Lea og Omar jobber i samme bygning og ser hverandre nesten hver dag, uten å avtale møter.
  explanation_md: Ses expresses seeing one another, so the subject includes both participants.
  derived_from:
  - section_id: short-retrieval-review
  options:
  - id: direct-object
    text: Lea ses Omar nesten hver dag.
    correct: false
    why: Ses does not take Omar as a direct object in the mutual meaning.
  - id: meeting-focus
    text: Lea og Omar møtes til et planlagt møte nesten hver dag.
    correct: false
    why: This adds a planned-meeting meaning that is absent from the situation.
  - id: mutual-seeing
    text: Lea og Omar ses nesten hver dag.
    correct: true
    why: Both people who see one another are included in the subject.
- handle: review_lexical_s_or_passive
  op: choose
  objective: obj-s-verbs-01
  bloom: analyze
  prompt_md: "Velg forklaringen som passer til Anes setning."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ane
      text_md: «Det finnes et apotek ved stasjonen.»
  explanation_md: "«Finnes» forteller at et apotek er tilgjengelig; det beskriver ikke en handling som utføres på apoteket."
  derived_from:
  - section_id: short-retrieval-review
  options:
  - id: passive
    text: Finnes is passive because someone performs an action on the pharmacy.
    correct: false
    why: No agent acts on the pharmacy; the sentence expresses existence.
  - id: finding
    text: Finnes means that an unnamed person finds the pharmacy.
    correct: false
    why: A locating event would use a form of finne, such as finner.
  - id: lexical
    text: Finnes is a lexical s-verb meaning that the pharmacy exists or is available.
    correct: true
    why: The sentence states that a pharmacy is available at that location.
