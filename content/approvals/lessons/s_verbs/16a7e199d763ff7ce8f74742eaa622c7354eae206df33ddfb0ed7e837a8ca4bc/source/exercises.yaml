- handle: select_motes_or_ses_by_intended_meaning
  op: choose
  objective: obj-s-verbs-01
  bloom: understand
  prompt_md: "Velg forklaringen som passer til de to replikkene."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lærer
      text_md: "«Vi møtes på tirsdager før timen.»"
    - speaker: Elev
      text_md: "«Ha det! Vi ses på torsdag.»"
  explanation_md: Møtes focuses on people coming together for a gathering; ses refers to seeing one another
    and is especially natural as a farewell that points to future contact. These are central uses, not rules
    that make the verbs impossible to exchange in every context.
  derived_from:
  - section_id: motes-and-ses-together
  options:
  - id: gathering-and-farewell
    text: Møtes describes the group's recurring gathering; ses is a farewell that anticipates future contact.
    correct: true
    why: The first line names when the group comes together, while the second is a natural way to say goodbye.
  - id: reversed-focus
    text: Møtes is the group's way of saying goodbye; ses names its recurring weekly gathering.
    correct: false
    why: The group gathers on Tuesdays; «Vi ses på torsdag!» is the farewell.
  - id: passive-meaning
    text: Both verbs are passive forms, saying that the group is met on Tuesdays and seen on Thursday.
    correct: false
    why: Here both forms have lexical reciprocal meanings rather than passive meanings.
  - id: same-arrangement
    text: Both lines announce the same planned group meeting, with no difference in focus.
    correct: false
    why: The first describes the group's regular gathering; the second is a conversational farewell.
