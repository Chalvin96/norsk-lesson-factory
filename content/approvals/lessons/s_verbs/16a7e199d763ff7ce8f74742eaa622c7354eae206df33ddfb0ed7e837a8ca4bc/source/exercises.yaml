  explanation_md: The choir update places the five lexical s-verbs in a new setting; express each fact naturally
    without copying a fixed sentence.
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 35
  max_words: 60
  judge_prompt: "Evaluate only criteria message-purpose, fact-coverage, lexical-forms-required, and mutual-subjects-observation when deciding whether the answer passes. Accept natural paraphrases. Anchor that must pass: «Heisann Jonas! Jeg trives godt i koret og synes dirigenten lærer oss nye sanger på en fin måte. Det finnes ekstra sangbøker i øvingsrommet. Vi møtes på torsdagskveldene, og du og jeg ses etter konserten på lørdag.» Near-miss that must fail fact-coverage: «Heisann Jonas! Jeg trives godt i koret, men synes dirigenten lærer oss sangene uklart.»"
  criteria:
  - id: message-purpose
    instruction: Gives Jonas a connected Norwegian update about the community choir.
  - id: fact-coverage
    instruction: Communicates all five choir facts without contradicting them.
  - id: lexical-forms-required
    instruction: Contains synes, trives, finnes, møtes, and ses naturally as complete lexical s-verbs.
  - id: mutual-subjects-observation
    instruction: Requires that statements with møtes or ses include all mutual participants in the subject;
      fail if a statement uses an invalid reciprocal subject.
