- handle: retrieve_ende_choices_at_the_station
  op: write
  objective: obj-present-participle-01
  bloom: apply
  prompt_md: 'Skriv fire korte setninger om situasjonene på stasjonen: passasjerene venter
    og ser på klokka; konduktøren løper langs perrongen og snakker i telefonen; Jonas
    undersøker togtidene; Ingrid kjøper kaffe med kaffemaskinen. Bruk en «-ende»-form
    om passasjerene og en «-ende»-form for samtidighandlingen til konduktøren, og skriv
    med «ved å» hvordan Ingrid kjøper kaffen.'
  derived_from:
  - section_id: cumulative-transfer
  response_language: "no"
  min_words: 20
  max_words: 65
  judge_prompt: Check the four sentences against the four numbered meanings and
    report evidence for each criterion. Accept natural Norwegian lexical and
    word-order variants when each required structural contrast remains clear.
  criteria:
  - id: waiting-passengers
    instruction: Uses an invariable adjective-like -ende form to describe the
      waiting passengers.
  - id: conductor-accompanying-action
    instruction: Uses an adverb-like -ende form with a finite main verb for the
      conductor’s running along the platform while speaking on the phone.
  - id: station-main-activity
    instruction: Uses an ordinary finite Norwegian verb for Jonas’s looking or
      checking activity, without være plus -ende.
  - id: method-infinitive
    instruction: Uses a natural non-participle method expression with ved å plus
      an infinitive for buying the coffee.
