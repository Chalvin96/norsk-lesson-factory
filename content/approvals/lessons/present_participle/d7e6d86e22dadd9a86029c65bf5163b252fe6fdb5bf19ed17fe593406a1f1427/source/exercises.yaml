  - text_md: ' til Mari.'
- handle: replace_false_progressive_forms
  op: find_fix
  objective: obj-present-participle-01
  bloom: analyze
  prompt_md: Finn det ene uttrykket som ikke passer i setningen.
  derived_from:
  - section_id: norwegian-no-progressive
  tokens:
  - token_id: tok-1
    text: Mina
  - token_id: tok-2
    text: er spisende
  - token_id: tok-3
    text: frokost
  - token_id: tok-4
    text: nå.
  error_token_id: tok-2
  feedback: Replace the selected construction with a finite present-tense verb.
    Norwegian normally uses the ordinary finite verb for an activity happening
    now.
- handle: select_natural_structure_for_english_ing
  op: write
  objective: obj-present-participle-01
  bloom: apply
  prompt_md: 'Skriv fire naturlige norske setninger ut fra notatene: røykvarsleren i gangen og pipelyden; Jonas venter på toget; naboene i etasjen over er et eldre ektepar; kontrakten bør leses grundig. Bruk en form på «-ende» om røykvarsleren, en leddsetning med «som» om naboene, og «å lese» i setningen om kontrakten.'
  derived_from:
  - section_id: other-english-ing-structures
  response_language: "no"
  min_words: 18
  max_words: 55
  judge_prompt: Check all four sentences against the four numbered meanings and
    report evidence for each criterion. Accept natural lexical and word-order
    alternatives when they preserve the meaning and required structure. Reject
    mechanical er plus -ende progressive forms.
  criteria:
  - id: noun-participle
    instruction: Describes the alarm with an adjective-like, invariable -ende
      form.
  - id: finite-main-activity
    instruction: Uses an ordinary finite Norwegian verb for Jonas’s main waiting
      activity, not være plus -ende.
  - id: relative-clause
    instruction: Uses a relative clause with som to identify the people living
      above.
  - id: infinitive-structure
    instruction: Uses an infinitive-based structure to express reading the
      contract as a general activity.
