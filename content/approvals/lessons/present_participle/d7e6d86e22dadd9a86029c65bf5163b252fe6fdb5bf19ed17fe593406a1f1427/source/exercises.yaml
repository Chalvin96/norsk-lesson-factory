- handle: choose_participle_or_relative_clause
  op: choose
  objective: obj-present-participle-01
  bloom: analyze
  prompt_md: Velg setningen som høres mest naturlig ut på norsk.
  derived_from:
  - section_id: relative-clause
  stem_md: Naboene i etasjen over er et eldre ektepar.
  options:
  - id: compressed-participle
    text: De boende i etasjen over er et eldre par.
    correct: false
    why: De boende is a formal or compressed expression; the relative clause is
      more natural in this everyday context.
  - id: relative-clause
    text: De som bor i etasjen over, er et eldre par.
    correct: true
    why: A relative clause is the usual conversational choice when people are
      identified by where they live.
