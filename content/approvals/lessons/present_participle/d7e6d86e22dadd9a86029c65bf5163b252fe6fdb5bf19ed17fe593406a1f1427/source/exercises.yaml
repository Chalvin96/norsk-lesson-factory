- handle: identify_present_participles_in_context
  op: recall_fill
  objective: obj-present-participle-01
  bloom: understand
  prompt_md: Fyll ut hver setning med uttrykket som passer.
  explanation_md: Endelsen «-ende» endres ikke etter kjønn eller tall. Formen
    kan beskrive en samtidig handling eller måte.
  derived_from:
  - section_id: the-present-participle
  audio_target: Jeg så en sovende katt som lå stille i vogna. Vi våknet av en
    pipende alarm. I gangen hørte vi en pipende røykvarsler. Vaktmesteren kommer
    løpende for å undersøke hva som utløste alarmen.
  segments:
  - text_md: 'Jeg så en '
  - blank_id: sleeping-cat
    options:
    - pipende
    - løpende
    - sovende
    answer_index: 2
  - text_md: ' katt som lå stille i vogna.'
  - text_md: ' Vi våknet av en '
  - blank_id: beeping-alarm
    options:
    - sovende
    - smilende
    - pipende
    answer_index: 2
  - text_md: ' alarm.'
  - text_md: ' I gangen hørte vi en '
  - blank_id: beeping-smoke-alarm
    options:
    - smilende
    - pipende
    - sovende
    answer_index: 1
  - text_md: ' røykvarsler.'
  - text_md: ' Vaktmesteren kommer '
  - blank_id: running-caretaker
    options:
    - sovende
    - sittende
    - løpende
    answer_index: 2
  - text_md: ' for å undersøke hva som utløste alarmen.'
