- handle: retrieve_core_question_patterns
  op: write
  objective: obj-question-word-order-01
  bloom: apply
  prompt_md: At a community library, write four short Norwegian questions without looking back at the
    examples. 1. You do not know whether the library is open; ask a yes/no question. 2. Nora was expected
    to be here, but you cannot see her; ask a negative question that checks that expectation. 3. You need
    to find the printer; ask where it is. 4. Ask a staff member for permission to use the printer. Write
    one complete question for each need in this order.
  derived_from:
  - section_id: sec-short-retrieval-review
  response_language: 'no'
  min_words: 12
  max_words: 45
  judge_prompt: Check four natural Norwegian questions responding to the library needs. Require a verb-before-subject
    yes/no question, a negative question that checks the prior expectation that Nora would be present
    and places ikke naturally, a hvor question about the printer, and a natural permission question about
    using it. Accept reasonable Bokmål lexical variants and punctuation; do not require one exact wording.
  criteria:
  - id: yes-no-question
    instruction: Asks whether the library is open with correct question word order.
  - id: negative-expectation
    instruction: Uses a natural negative question with correct verb placement to check the prior expectation
      that Nora would be present.
  - id: where-question
    instruction: Asks where the printer is with a question word and correct order.
  - id: permission-question
    instruction: Asks a staff member for permission to use the printer with natural Norwegian question
      syntax.
