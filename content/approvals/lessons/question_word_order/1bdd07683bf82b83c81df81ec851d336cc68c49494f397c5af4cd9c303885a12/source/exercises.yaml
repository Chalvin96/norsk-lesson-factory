- handle: recognize_negative_question_meaning
  op: choose
  objective: obj-question-word-order-01
  bloom: understand
  prompt_md: Read the situation and dialogue. Choose what Jonas expected and whether Sara says Emil is coming.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Jonas and Sara agreed to meet Emil at 10:00. It is 10:15, and he has not arrived.
    - speaker: Jonas
      text_md: «Kommer han ikke?»
    - speaker: Sara
      text_md: «Jo, han kommer.»
  options:
  - id: neutral-question
    text: Jonas did not expect Emil to come. Sara says he is coming.
    correct: false
    why: Jonas and Sara expected Emil to come.
  - id: negative-confirmed
    text: Jonas expected Emil. Sara says he is not coming.
    correct: false
    why: «Jo» says Emil is coming.
  - id: negative-rejected
    text: Jonas expected Emil, but asks if he is not coming after all. Sara says he is coming.
    correct: true
    why: The question checks whether Emil is no longer coming; «Jo» says he is.
  derived_from:
  - section_id: sec-negative-questions
- handle: distinguish_question_openings
  op: choose
  objective: obj-question-word-order-01
  bloom: understand
  prompt_md: 'In Sara and Jonas''s cinema conversation, choose the pair that matches both intentions:
    first ask whether someone is coming tonight, then ask where to buy a ticket.'
  derived_from:
  - section_id: sec-questions-with-a-question-word
  stem_md: Which pair has the correct opening for each intention?
  options:
  - id: subject-first-pair
    text: Du kommer i kveld? — Are you coming tonight?; Hvor du kjøper billett? — Where do you buy a ticket?
    correct: false
    why: The first line keeps subject-first order, and the second puts the subject before the verb after
      the question word.
  - id: two-yes-no-questions
    text: Kommer du i kveld? — Are you coming tonight?; Kjøper du billett inne? — Do you buy a ticket
      inside?
    correct: false
    why: Both lines are verb-first yes/no questions; the second does not ask for place information with
      a question word.
  - id: correct-pair
    text: Kommer du i kveld? — Are you coming tonight?; Hvor kjøper du billett? — Where do you buy a ticket?
    correct: true
    why: The yes/no question starts with the verb, while the place question starts with a question word
      followed by the verb.
