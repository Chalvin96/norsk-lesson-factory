- handle: recognize_yes_no_question_order
  op: categorize
  objective: obj-question-word-order-01
  bloom: analyze
  prompt_md: In this cinema-plan context, sort each line into the correct group. Put ordinary neutral
    yes/no questions in the first group. Put subject-first lines, including a subject-first checking line,
    in the second group. Use verb-before-subject order, not the question mark alone, as evidence.
  stimulus: []
  explanation_md: Questions place the finite verb before the subject; in wh-questions the question word
    comes first, and ikke follows the subject.
  derived_from:
  - section_id: sec-simple-yes-no-questions
  buckets:
  - bucket_id: verb-first-question
    label: 'Ordinary neutral yes/no question: verb before subject'
  - bucket_id: subject-first-not-target
    label: 'Not an ordinary neutral yes/no question: subject before verb'
  items:
  - item_id: line-1
    text: Kommer du i kveld?
    bucket_id: verb-first-question
  - item_id: line-2
    text: Du kommer i kveld?
    bucket_id: subject-first-not-target
  - item_id: line-3
    text: Har hun en billett?
    bucket_id: verb-first-question
  - item_id: line-4
    text: Du har ikke billett.
    bucket_id: subject-first-not-target
