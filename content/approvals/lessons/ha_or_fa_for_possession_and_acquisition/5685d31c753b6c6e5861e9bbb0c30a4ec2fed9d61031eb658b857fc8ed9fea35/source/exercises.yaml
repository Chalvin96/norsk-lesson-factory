- handle: practice_follow_object_through_a_day
  op: write
  objective: obj-ha-or-fa-for-possession-and-acquisition-01
  bloom: apply
  prompt_md: "Melding til reisefølget: Elias mangler romnøkkelen om morgenen. Resepsjonisten gir ham nøkkelen ved innsjekking. Senere ligger den i jakkelomma hans. Om kvelden finner han den ikke og spør reisefølget om de har den. Skriv en melding og fortell hva som skjer fra morgenen til kvelden. Bruk «har ikke» om morgenen, «får» ved innsjekking og «har» senere."
  derived_from:
  - section_id: practice-follow-object-through-a-day
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Vurder svaret mot kriterie-idene. Alle kriteriene er bindende fordi de gjentar synlige
    krav i oppgaven. Ikke legg til andre bindende krav.
  criteria:
  - id: audience-and-purpose
    instruction: Meldingen er rettet til reisefølget og forklarer hva som skjer med romnøkkelen.
  - id: supplied-facts
    instruction: Meldingen bruker morgenens mangel, overrekkelsen ved innsjekking, plasseringen i jakkelomma
      og kveldens spørsmål uten å motsi tidsforløpet.
  - id: possession-forms
    instruction: Meldingen bruker har ikke om morgenen og har senere om besittelse.
  - id: acquisition-form
    instruction: Meldingen bruker får om mottakelsen i resepsjonen.
  - id: evening-question
    instruction: Meldingen sier at Elias om kvelden ikke finner nøkkelen og spør reisefølget om de har
      den.
- handle: practice_ask_the_useful_question
  op: write
  objective: obj-ha-or-fa-for-possession-and-acquisition-01
  bloom: apply
  prompt_md: "Chat med Henrik: Nora har allerede fått parkeringskortet. Datamaskinen kommer i morgen. Kontraktskopien ligger kanskje hos Nora, men Henrik vet ikke sikkert. Skriv en chat med tre spørsmål og korte svar om hva Nora har nå og hva hun får senere. Bruk minst ett spørsmål som begynner med «Har Nora …?» og ett med «Får Nora …?»."
  derived_from:
  - section_id: practice-ask-the-useful-question
  response_language: 'no'
  min_words: 20
  max_words: 60
  judge_prompt: Vurder svaret mot kriterie-idene. Alle kriteriene er bindende fordi de gjentar synlige
    krav i oppgaven. Ikke legg til andre bindende krav.
  criteria:
  - id: three-items
    instruction: Chatten omtaler parkeringskortet, datamaskinen og kontraktskopien.
  - id: information-needs
    instruction: Spørsmålene og svarene avklarer både nåværende besittelse og senere mottakelse.
  - id: three-questions-short-answers
    instruction: Chatten inneholder nøyaktig tre spørsmål, og hvert spørsmål har et kort svar.
  - id: possession-question
    instruction: Chatten inneholder et spørsmål som begynner med Har Nora …? om nåværende besittelse.
  - id: acquisition-question
    instruction: Chatten inneholder et spørsmål som begynner med Får Nora …? om senere mottakelse.
