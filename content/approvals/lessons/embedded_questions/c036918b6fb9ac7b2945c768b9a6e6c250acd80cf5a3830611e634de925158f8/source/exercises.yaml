- handle: use_embedded_questions_at_hotel_reception
  op: write
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: "Skriv en høflig melding på 30–55 ord til hotellresepsjonen. Bruk indirekte spørsmål for å finne ut hvilken etasje vaskerommet ligger i, når det stenger, om gjester kan bruke bakgården om kvelden, og hvorfor termostaten ikke virker."
  response_language: 'no'
  min_words: 30
  max_words: 55
  judge_prompt: 'Judge the response against the listed criteria. Criteria whose ids end in -observation are diagnostic: flag them when relevant, but do not treat them as failure conditions.'
  criteria:
  - id: content-needs
    instruction: The message intelligibly requests the laundry room's floor and closing time, evening access to the courtyard, and the reason the thermostat does not respond.
  - id: message-purpose
    instruction: The response is a recognizable polite message to hotel reception whose purpose is to request information. It phrases the requests in the learner's own words instead of copying complete example sentences from the lesson.
  - id: word-bound
    instruction: The response contains 30–55 words.
  - id: embedded-form
    instruction: Every request is phrased as an embedded question with the subject before the finite verb.
  - id: introducer-choice
    instruction: Specific-information requests use a suitable question word, and the yes-or-no request is introduced by «om».
  - id: internal-negation
    instruction: In the negative clause about the thermostat, «ikke» stands immediately before the finite verb.
  - id: polite-tone
    instruction: The message is polite.
  derived_from:
  - section_id: transfer-to-a-new-situation
- handle: retrieve_embedded_question_pattern
  op: write
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: 'Forklar kort hvordan subjekt og finitt verb står i et indirekte spørsmål. Skriv også to egne setninger med indirekte spørsmål, hvorav minst ett innledes med «om». Skriv 25–70 ord til sammen.'
  response_language: 'no'
  min_words: 25
  max_words: 70
  judge_prompt: Assess the response against pattern-explanation, two-original-sentences, and om-choice. Report subordinate-order-observation separately.
  criteria:
  - id: pattern-explanation
    instruction: The response explains, in plain language, that inside an embedded question the subject precedes the finite verb.
  - id: two-original-sentences
    instruction: The response contains two original Norwegian sentences, each containing an embedded question whose subject precedes the finite verb.
  - id: om-choice
    instruction: At least one yes-or-no embedded question appears, and it is introduced by «om».
  - id: subordinate-order-observation
    instruction: 'Observation only: report whether subjects precede finite verbs inside the embedded questions.'
  derived_from:
  - section_id: short-retrieval-review
