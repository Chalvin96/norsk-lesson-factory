- handle: review_whole_sentence_punctuation
  op: choose
  objective: obj-embedded-questions-01
  bloom: understand
  prompt_md: 'Velg paret med riktig ordstilling og tegnsetting.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Kan du undersøke om verkstedet åpner på lørdag»
    - speaker: Mina
      text_md: «Jeg undersøker om det er ledige plasser»
  options:
  - id: punctuation-follows-embedded-content
    text: «Kan du undersøke om verkstedet åpner på lørdag.» / «Jeg undersøker om det er ledige plasser?»
    correct: false
    why: It punctuates according to the embedded content instead of each whole sentence.
  - id: main-clause-order-inside-embedded-question
    text: «Kan du undersøke om åpner verkstedet på lørdag?» / «Jeg undersøker om det er ledige plasser.»
    correct: false
    why: The embedded question must keep the subject before the finite verb.
  - id: punctuation-follows-whole-sentence
    text: «Kan du undersøke om verkstedet åpner på lørdag?» / «Jeg undersøker om det er ledige plasser.»
    correct: true
    why: The first whole sentence is a question, while the second is a statement.
  explanation_md: 'Tegnsettingen følger hovedsetningen, ikke spørreordet i det indirekte spørsmålet.'
  derived_from:
  - section_id: short-retrieval-review
