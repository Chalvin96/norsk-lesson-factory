  bloom: analyze
  prompt_md: 'Velg dialogen med riktig ordstilling i det indirekte spørsmålet.'
  stem_md: 'Resepsjonisten ber Mina spørre hvor flybussen stopper. Senere forteller Mina hva hun fant ut.'
  options:
  - id: orders-reversed
    text: «Hvor flybussen stopper?» / «Jeg vet hvor stopper flybussen.»
    correct: false
    why: It uses embedded order in the direct question and direct-question order in the report.
  - id: both-contexts-correct
    text: «Hvor stopper flybussen?» / «Jeg vet hvor flybussen stopper.»
    correct: true
    why: The direct question has inversion, while the embedded question has subject-before-verb order.
  explanation_md: 'Situasjonen viser om personen trenger et direkte eller et indirekte spørsmål.'
