- handle: notice_embedded_question_order
  op: choose
  objective: obj-embedded-questions-01
  bloom: understand
  prompt_md: 'Velg setningen med riktig ordstilling i det indirekte spørsmålet.'
  stem_md: 'Direkte spørsmål: «Når begynner omvisningen?» Mina spør Jonas det samme etter «Vet du …».'
  options:
  - id: direct-order
    text: Vet du når begynner omvisningen?
    correct: false
    why: This keeps direct-question word order inside the embedded question.
  - id: subject-before-verb
    text: Vet du når omvisningen begynner?
    correct: true
    why: The subject precedes the finite verb inside the embedded question.
  explanation_md: 'I et indirekte spørsmål står subjektet foran det finitte verbet når spørreordet ikke er subjektet.'
  derived_from:
  - section_id: direct-and-embedded-questions
