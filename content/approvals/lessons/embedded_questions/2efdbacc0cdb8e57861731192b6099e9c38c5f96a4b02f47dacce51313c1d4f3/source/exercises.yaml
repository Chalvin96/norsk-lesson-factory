- handle: complete_embedded_information_statement
  op: recall_fill
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: Complete the three travel notes.
  audio_target: 'Mina: «Er lunsjen bestilt?» Jonas: «Hvilket rom skal møtet være i?» Mina: «Når stenger
    dere?»'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Er lunsjen bestilt, eller må vi ordne det selv?»
    - speaker: Jonas
      text_md: «Det vet jeg ikke. Og møterommet har jeg glemt.»
    - speaker: Kari
      text_md: «Vi stenger klokka ti i dag, men dere kan spørre igjen i morgen.»
  segments:
  - text_md: 'Mina er usikker på '
  - blank_id: mina-clause
    options:
    - at de har bestilt lunsj
    - om de har bestilt lunsj
    answer_index: 1
  - text_md: '. Jonas husker ikke '
  - blank_id: jonas-clause
    options:
    - hvilket rom møtet er i
    - hvilket rom er møtet i
    answer_index: 0
  - text_md: '. Vi må finne ut '
  - blank_id: reception-clause
    options:
    - når stenger resepsjonen
    - når resepsjonen stenger
    answer_index: 1
  - text_md: .
  explanation_md: These statements contain embedded questions, so each embedded clause uses subordinate-clause
    word order.
  derived_from:
  - section_id: statements-that-contain-questions
- handle: repair_embedded_question_word_order
  op: find_fix
  objective: obj-embedded-questions-01
  bloom: analyze
  prompt_md: Select the token group that must be corrected.
  tokens:
  - token_id: tok-1
    text: Vet
  - token_id: tok-2
    text: du
  - token_id: tok-3
    text: om
  - token_id: tok-4
    text: bussen
  - token_id: tok-5
    text: går ikke
  - token_id: tok-6
    text: til
  - token_id: tok-7
    text: hotellet?
  error_token_id: tok-5
  feedback: 'Replace «går ikke» with «ikke går»: «Vet du om bussen ikke går til hotellet?»'
  explanation_md: The negation belongs inside the embedded question and therefore precedes «går».
  derived_from:
  - section_id: a-practical-editing-check
- handle: use_embedded_questions_at_hotel_reception
  op: write
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: 'Til: Hotellresepsjonen. Mina needs to learn breakfast''s closing time; whether she may leave
    her suitcase after checkout; the airport bus stop; and the reason her key card does not work. Write
    a polite 30–55-word Norwegian message that requests all four details as embedded questions: use question
    words for specific information, use «om» for the yes-or-no item, keep the subject before the finite
    verb inside every embedded question, and place «ikke» immediately before the finite verb in the negative
    clause.'
  response_language: 'no'
  min_words: 30
  max_words: 55
  judge_prompt: 'Judge the response against the listed criteria. Criteria whose ids end in -observation
    are diagnostic: flag them when relevant, but do not treat them as failure conditions.'
  criteria:
  - id: content-needs
    instruction: The message intelligibly requests all four supplied details.
  - id: message-purpose
    instruction: The response is a recognizable polite message to hotel reception whose purpose is to
      request information.
  - id: word-bound
    instruction: The response contains 30–55 words.
  - id: embedded-form
    instruction: Every request is phrased as an embedded question with the subject before the finite verb.
  - id: introducer-choice
    instruction: Specific-information requests use a suitable question word, and the yes-or-no request
      is introduced by «om».
  - id: internal-negation
    instruction: In the clause about the key card, «ikke» stands immediately before the finite verb.
  - id: polite-tone
    instruction: The message is polite.
  derived_from:
  - section_id: transfer-to-a-new-situation
- handle: retrieve_embedded_question_pattern
  op: write
  objective: obj-embedded-questions-01
  bloom: apply
  prompt_md: Explain in plain language how Norwegian orders the subject and the finite verb inside an
    embedded question. Then write two original Norwegian sentences that each contain an embedded question
    in correct subordinate order. At least one sentence must contain a yes-or-no embedded question introduced
    with «om».
  response_language: 'no'
  min_words: 25
  max_words: 70
  judge_prompt: Assess the response against pattern-explanation, two-original-sentences, and om-choice.
    Report subordinate-order-observation separately.
  criteria:
  - id: pattern-explanation
    instruction: The response explains, in plain language, that inside an embedded question the subject
      precedes the finite verb.
  - id: two-original-sentences
    instruction: The response contains two original Norwegian sentences, each containing an embedded question
      whose subject precedes the finite verb.
  - id: om-choice
    instruction: At least one yes-or-no embedded question appears, and it is introduced by «om».
  - id: subordinate-order-observation
    instruction: 'Observation only: report whether subjects precede finite verbs inside the embedded questions.'
  derived_from:
  - section_id: short-retrieval-review
