- handle: notice_embedded_question_order
  op: choose
  objective: obj-embedded-questions-01
  bloom: understand
  prompt_md: Choose the correctly embedded question.
  stem_md: 'Direct question: «På hvilket sted er spor 12?» Mina asks Jonas for the same information after
    «Vet du …».'
  options:
  - id: direct-order
    text: Vet du hvor er spor 12?
    correct: false
    why: This keeps direct-question word order inside the embedded question.
  - id: subject-before-verb
    text: Vet du hvor spor 12 er?
    correct: true
    why: The subject precedes the finite verb inside the embedded question.
  explanation_md: An embedded question uses subject-before-verb order when the question phrase is not
    the subject.
  derived_from:
  - section_id: direct-and-embedded-questions
- handle: discriminate_direct_and_embedded_order
  op: choose
  objective: obj-embedded-questions-01
  bloom: analyze
  prompt_md: Choose the exchange with the correct word order.
  stem_md: A receptionist asks Mina to ask directly where the airport bus stops. Later, Mina reports what
    she found out.
  options:
  - id: orders-reversed
    text: «Hvor flybussen stopper?» / «Jeg vet hvor stopper flybussen.»
    correct: false
    why: It uses embedded order in the direct question and direct-question order in the report.
  - id: both-contexts-correct
    text: «Hvor stopper flybussen?» / «Jeg vet hvor flybussen stopper.»
    correct: true
    why: The direct question has inversion, while the embedded question has subject-before-verb order.
  explanation_md: The surrounding situation determines whether the speaker needs a direct or embedded
    question.
  derived_from:
  - section_id: common-mistake-direct-question-inversion
