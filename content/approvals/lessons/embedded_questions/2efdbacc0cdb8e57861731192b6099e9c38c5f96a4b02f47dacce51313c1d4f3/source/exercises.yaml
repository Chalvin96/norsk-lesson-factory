- handle: select_question_word_or_om
  op: choose
  objective: obj-embedded-questions-01
  bloom: understand
  prompt_md: Mina must ask where the hotel is and whether breakfast is served on Sundays. Choose the pair
    with the right introducer for each request.
  stem_md: The first request asks for specific information. The second asks for a yes-or-no confirmation.
  options:
  - id: wrong-introducer
    text: Vet du om hotellet er? / Kan du sjekke hvor hotellet serverer frokost på søndager?
    correct: false
    why: The specific-location request needs «hvor», while the yes-or-no request needs «om».
  - id: location-then-confirmation
    text: Vet du hvor hotellet er? / Kan du sjekke om hotellet serverer frokost på søndager?
    correct: true
    why: «Hvor» introduces the location question and «om» introduces the yes-or-no question.
  explanation_md: Use a question word for specific information and «om» for an embedded yes-or-no question.
  derived_from:
  - section_id: questions-answered-with-yes-or-no-use-om
