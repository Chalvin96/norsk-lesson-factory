- handle: describe_sara_and_emil
  op: write
  objective: obj-present-tense-01
  bloom: apply
  prompt_md: "Fakta: Sara: hjemme i dag, jobbe på datamaskinen, vanligvis jobbe på kafé på lørdager. Emil: på kjøkkenet, ha tid, lage lunsj. Skriv en melding på 25–50 ord til Sara om hvor de er og hva de gjør. Ta med at Emil har tid."
  response_language: 'no'
  min_words: 25
  max_words: 50
  judge_prompt: 'Evaluate the response only against criteria sara-message-purpose, supplied-facts, word-bound,
    and present-forms. Report a separate verdict and evidence for each criterion. Calibration anchors:
    Must pass: "Hei Sara! Du er hjemme i dag og arbeider på datamaskinen nå. Vanligvis jobber du på kafé
    på lørdager. Emil er på kjøkkenet. Han har tid og lager lunsj nå." Must fail supplied-facts: "Hei
    Sara! Du jobber på kafé i dag, og Emil lager middag på kontoret." Must fail present-forms: "Hei Sara!
    Du er hjemme i dag og jobbe på datamaskinen nå. Vanligvis jobber du på kafé på lørdager. Emil er på
    kjøkkenet, har tid og lager lunsj."'
  criteria:
  - id: sara-message-purpose
    instruction: Writes a message to Sara that confirms the described current situation and her usual
      Saturday routine.
  - id: supplied-facts
    instruction: Includes all supplied facts without contradicting them.
  - id: word-bound
    instruction: Contains 25–50 words.
  - id: present-forms
    instruction: Uses natural simple present-tense forms for the described actions.
  derived_from:
  - section_id: transfer-to-new-everyday-situation
