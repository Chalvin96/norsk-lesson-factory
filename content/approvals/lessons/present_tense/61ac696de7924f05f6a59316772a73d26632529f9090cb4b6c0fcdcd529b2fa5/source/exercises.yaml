- handle: review_avoid_english_progressive_pattern
  op: choose
  objective: obj-present-tense-01
  bloom: analyze
  prompt_md: Choose the natural Bokmål reply.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Hva gjør du nå?»
    - speaker: Ali
      text_md: «___»
  options:
  - id: copied-progressive
    text: Jeg er leser en bok.
    correct: false
    why: This copies the English progressive pattern by adding an unnecessary er before the action verb.
  - id: infinitive-action
    text: Jeg lese en bok.
    correct: false
    why: Lese is the infinitive; the reply needs present-tense leser.
  - id: single-present
    text: Jeg leser en bok.
    correct: true
    why: The single present-tense verb leser naturally expresses the current action.
