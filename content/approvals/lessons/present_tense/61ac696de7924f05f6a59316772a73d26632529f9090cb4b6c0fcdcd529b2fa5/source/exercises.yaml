- handle: identify_present_meaning
  op: choose
  objective: obj-present-tense-01
  bloom: understand
  prompt_md: Choose the correct interpretation.
  stem_md: Mina jobber hjemme i dag. 2. Jonas vasker kjøkkenet hver lørdag.
  options:
  - id: regular-now
    text: 1 describes a habit; 2 describes a current situation.
    correct: false
    why: 'This reverses the time evidence: i dag indicates the current day, while hver lørdag indicates
      repetition.'
  - id: now-regular
    text: 1 describes a current situation; 2 describes a habit.
    correct: true
    why: I dag places the first situation in the current day, while hver lørdag marks the second as a
      repeated habit.
  derived_from:
  - section_id: present-tense-two-common-meanings
