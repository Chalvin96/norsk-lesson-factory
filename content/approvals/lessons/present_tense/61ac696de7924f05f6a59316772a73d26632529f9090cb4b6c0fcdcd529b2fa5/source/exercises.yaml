- handle: avoid_english_progressive_pattern
  op: find_fix
  objective: obj-present-tense-01
  bloom: analyze
  prompt_md: Select the unnecessary token.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Context
      text_md: Jeg er jobber hjemme.
  tokens:
  - token_id: subject-jeg
    text: Jeg
  - token_id: extra-er
    text: er
  - token_id: verb-jobber
    text: jobber
  - token_id: place-hjemme
    text: hjemme.
  error_token_id: extra-er
  feedback: Remove er. The repaired statement is Jeg jobber hjemme; jobber alone expresses the current
    action.
