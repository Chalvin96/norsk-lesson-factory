- handle: notice_actual_consequence
  op: choose
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: understand
  prompt_md: Velg setningen som uttrykker resultatet.
  stem_md: '**Ved kodelåsen** Det er svært mørkt. Derfor kan Mina ikke se tallene.'
  options:
  - id: option-excess
    text: Det er for mørkt til å se tallene.
    correct: false
    why: Denne setningen vurderer handlingen mot en grense i stedet for å presentere det oppgitte resultatet.
  - id: option-sufficiency
    text: Det er mørkt nok til å se tallene.
    correct: false
    why: Denne setningen sier at mørket når en nødvendig terskel og snur dermed forholdet mellom forhold
      og resultat.
  - id: option-consequence
    text: Det er så mørkt at Mina ikke kan se tallene.
    correct: true
    why: Graden av mørke følges av en hel leddsetning som uttrykker resultatet.
  derived_from:
  - section_id: sec-consequence-saa-at
- handle: distinguish_result_from_excess
  op: choose
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: analyze
  prompt_md: Velg svarparet som uttrykker begge beskjedene med riktig konstruksjon. I situasjon 1 skal
    setningen uttrykke at koffertens vekt overskrider grensen for at Jonas kan løfte den alene.
  stem_md: '**To situasjoner** 1. Kofferten veier 32 kilo, og vekten overskrider grensen for at Jonas
    kan løfte den alene. 2. Suppa er svært varm. Derfor må Mina vente.'
  options:
  - id: option-reversed-mapping
    text: Kofferten er så tung at Jonas ikke klarer å løfte den. 2. Suppa er for varm til å spise nå.
    correct: false
    why: 'Begge setningene er naturlige, men de bytter om perspektivene: følgen står der grensevurderingen
      hører hjemme, og omvendt.'
  - id: option-two-results
    text: Kofferten er så tung at Jonas ikke klarer å løfte den. 2. Suppa er så varm at Mina må vente.
    correct: false
    why: Begge setningene presenterer følger; den første uttrykker ikke grensevurderingen som situasjon
      1 ber om.
  - id: option-correct-mapping
    text: Kofferten er for tung til å løfte alene. 2. Suppa er så varm at Mina må vente.
    correct: true
    why: Første svar vurderer løftingen som blokkert av en grense, mens andre svar presenterer en følge
      i en hel leddsetning.
  derived_from:
  - section_id: sec-limit-for-til-aa
