- handle: review_negative_sufficiency
  op: write
  objective: obj-degree-result-and-threshold-constructions-01
  bloom: apply
  prompt_md: '**Skiløypa:** Snøen er 12 cm dyp. Løypa krever minst 25 cm. Fullfør med 6 ord og bruk konstruksjonen
    ikke … nok til å slik at setningen forklarer hvorfor løypa ikke kan åpnes: «Snøen er ___ løypa.»'
  response_language: 'no'
  min_words: 6
  max_words: 6
  judge_prompt: Vurder bare insufficient-meaning, insufficient-form og micro-bound som bindende kriterier.
    Ikke legg til andre bindende krav.
  criteria:
  - id: insufficient-meaning
    instruction: Utfyllingen uttrykker at snøen ikke når den nødvendige dybden for å åpne løypa.
  - id: insufficient-form
    instruction: Utfyllingen bruker konstruksjonen ikke … nok til å, altså ikke + adjektiv + nok + til
      å + infinitiv.
  - id: micro-bound
    instruction: Svaret inneholder nøyaktig 6 ord.
  derived_from:
  - section_id: sec-short-retrieval-and-review
