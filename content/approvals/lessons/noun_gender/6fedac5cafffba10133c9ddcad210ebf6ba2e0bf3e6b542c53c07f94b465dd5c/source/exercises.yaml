- handle: describe_missing_items_in_the_study_room
  op: write
  objective: obj-noun-gender-01
  bloom: apply
  prompt_md: Read Jonas's message about the study room, then write the colleague a 12–35-word Norwegian
    message that reports which of the three objects (stol, hylle, bord) is present and which two are missing,
    using traditional article-noun phrases.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Jeg har sjekket studierommet. Stolen mangler, og bordet mangler også.»
    - speaker: Ida
      text_md: «Takk. Står hylla der fortsatt?»
    - speaker: Jonas
      text_md: «Ja, hylla står der fortsatt.»
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: Evaluate the response against study-audience, study-purpose, study-facts, study-articles,
    and study-length.
  criteria:
  - id: study-audience
    instruction: Is written as a message that can be sent to a colleague.
  - id: study-purpose
    instruction: Reports what is present and missing in the study room.
  - id: study-facts
    instruction: Says that the chair and table are missing and the shelf is present.
  - id: study-articles
    instruction: Uses traditional article-noun phrases en stol, ei hylle, and et bord.
  - id: study-length
    instruction: Contains 12–35 words.
  derived_from:
  - section_id: transfer-to-a-new-situation
- handle: retrieve_three_gender_patterns
  op: write
  objective: obj-noun-gender-01
  bloom: apply
  prompt_md: You are making a 25–70-word Norwegian study note for a classmate. List the nine nouns (stol,
    lampe, bord, bok, nøkkel, teppe, hylle, vindu, and bilde) with traditional article-noun phrases, then
    add three short sentences about objects needed in a room.
  response_language: 'no'
  min_words: 25
  max_words: 70
  judge_prompt: Evaluate the response against note-audience-purpose, note-nine-nouns, note-three-sentences,
    note-article-accuracy, and note-length.
  criteria:
  - id: note-audience-purpose
    instruction: Is a Norwegian study note intended to help a classmate practise the nine nouns taught
      in this lesson.
  - id: note-nine-nouns
    instruction: Includes stol, lampe, bord, bok, nøkkel, teppe, hylle, vindu, and bilde as article-noun
      phrases.
  - id: note-three-sentences
    instruction: Includes three short sentences about objects needed in a room.
  - id: note-article-accuracy
    instruction: Uses traditional article-noun phrases for the nine listed nouns and in the three practice
      sentences.
  - id: note-length
    instruction: Contains 25–70 words.
  derived_from:
  - section_id: retrieval-and-review
