- handle: correct_gender_errors_on_majas_list
  op: choose
  objective: obj-noun-gender-01
  bloom: analyze
  prompt_md: Maja wrote the shopping list «en stol, ei lampe, en hylle, et bord, ei bok». Choose the accurate
    description of the article in «en hylle».
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: '«Handleliste: en stol, ei lampe, en hylle, et bord, ei bok.»'
  explanation_md: Hylle may take traditional feminine ei or common-gender en in Bokmål.
  derived_from:
  - section_id: checkpoint-repair-article-mistakes
  options:
  - id: common-only
    text: Only en hylle is valid; ei hylle must be corrected.
    correct: false
    why: This excludes the accepted traditional feminine form ei hylle.
  - id: both-accepted
    text: Both en hylle and ei hylle are valid Bokmål forms.
    correct: true
    why: Bokmål permits both the common-gender and traditional feminine patterns for hylle.
  - id: feminine-only
    text: Only ei hylle is valid; en hylle must be corrected.
    correct: false
    why: This excludes the accepted common-gender form en hylle.
