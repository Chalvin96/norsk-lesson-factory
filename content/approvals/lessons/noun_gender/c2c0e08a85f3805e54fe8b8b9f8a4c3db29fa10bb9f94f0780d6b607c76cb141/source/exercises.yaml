- handle: correct_gender_errors_on_majas_list
  op: choose
  objective: obj-noun-gender-01
  bloom: analyze
  prompt_md: Maja skrev handlelista «en stol, ei lampe, en hylle, et bord, ei bok». Velg den riktige
    beskrivelsen av artikkelen i «en hylle».
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: '«Handleliste: en stol, ei lampe, en hylle, et bord, ei bok.»'
  explanation_md: "«Hylle» kan ha tradisjonell hunkjønnsform med ei eller felleskjønnsform med en i bokmål."
  derived_from:
  - section_id: checkpoint-repair-article-mistakes
  options:
  - id: common-only
    text: Bare «en hylle» er riktig; «ei hylle» må rettes.
    correct: false
    why: Dette utelukker den godkjente tradisjonelle hunkjønnsformen «ei hylle».
  - id: both-accepted
    text: Både «en hylle» og «ei hylle» er gyldige bokmålsformer.
    correct: true
    why: Bokmål godtar både felleskjønnsformen og den tradisjonelle hunkjønnsformen av «hylle».
  - id: feminine-only
    text: Bare «ei hylle» er riktig; «en hylle» må rettes.
    correct: false
    why: Dette utelukker den godkjente felleskjønnsformen «en hylle».
