- handle: describe_missing_items_in_the_study_room
  op: write
  objective: obj-noun-gender-01
  bloom: apply
  prompt_md: 'Write a message to a colleague. Say which of the three items—the lamp, rug, and key—are in the room and which two are missing. Use an article and a noun. Use the traditional feminine form of «lampe».'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: «Jeg har sjekket studierommet. Det står ei lampe på pulten, og den virker. Gulvet er bart, og jeg finner ikke det som åpner skapet.»
    - speaker: Ida
      text_md: «Takk. Så det står ei lampe på pulten, men det ligger ikke noe teppe på gulvet, og skapet kan ikke låses opp?»
    - speaker: Jonas
      text_md: «Ja, det stemmer.»
  response_language: 'no'
  min_words: 12
  max_words: 35
  judge_prompt: "Evaluate the response against study-audience, study-purpose, study-facts, study-articles."
  criteria:
  - id: study-audience
    instruction: Is written as a message that can be sent to a colleague.
  - id: study-purpose
    instruction: Reports what is present and missing in the study room.
  - id: study-facts
    instruction: Says that the rug and key are missing and the lamp is present.
  - id: study-articles
    instruction: Uses the requested traditional article-noun phrases ei lampe, et teppe, and en nøkkel.
  derived_from:
  - section_id: transfer-to-a-new-situation
- handle: retrieve_three_gender_patterns
  op: write
  objective: obj-noun-gender-01
  bloom: apply
  prompt_md: 'Write a note to a classmate. Include chair, lamp, table, book, key, rug, shelf, window, and picture with the traditional article. Also write three short sentences about things needed in a room. Use one noun from the list in each sentence, and use en, ei, and et once each.'
  response_language: 'no'
  min_words: 25
  max_words: 70
  judge_prompt: "Evaluate the response against note-audience-purpose, note-nine-nouns, note-three-sentences, note-article-accuracy. For each of the three sentences, require one singular article-noun phrase from the listed nouns, with one en, one ei, and one et phrase across the set. Accept natural short sentences and correct traditional Bokmål forms."
  criteria:
  - id: note-audience-purpose
    instruction: Is a Norwegian study note intended to help a classmate practise the nine nouns taught
      in this lesson.
  - id: note-nine-nouns
    instruction: Includes stol, lampe, bord, bok, nøkkel, teppe, hylle, vindu, and bilde as article-noun
      phrases.
  - id: note-three-sentences
    instruction: Includes three short sentences about objects needed in a room, each with a singular article-noun phrase from the list.
  - id: note-article-accuracy
    instruction: Uses correct traditional article-noun phrases for all nine listed nouns and includes one en, one ei, and one et phrase across the three sentences.
  derived_from:
  - section_id: retrieval-and-review
