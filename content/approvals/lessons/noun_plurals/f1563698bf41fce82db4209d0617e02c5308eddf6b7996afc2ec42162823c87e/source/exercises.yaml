- handle: track_plural_reference_in_context
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: Nora and Amir are arranging the meeting room. The first sentence introduces four cups; the
    second refers to that same group. Choose the exchange with the correct plural definiteness.
  derived_from:
  - section_id: following-a-noun-through-a-conversation
  stem_md: Choose the exchange that tracks the introduced group correctly.
  options:
  - id: reversed
    text: Nora finner koppene. Fire kopper står ved døra.
    correct: false
    why: The first sentence treats the group as already known, while the second makes it indefinite.
  - id: first_definite
    text: Nora finner koppene. Koppene står ved døra.
    correct: false
    why: The first sentence is introducing the group, not referring back to an earlier group.
  - id: second_indefinite
    text: Nora finner fire kopper. Kopper står ved døra.
    correct: false
    why: The second sentence should identify the group introduced in the first sentence.
  - id: correct
    text: Nora finner fire kopper. Koppene står ved døra.
    correct: true
    why: kopper introduces the group; koppene refers back to the same identifiable cups.
- handle: repair_plural_form_errors
  op: write
  objective: obj-noun-plurals-01
  bloom: analyze
  prompt_md: >-
    Nora is looking for the chairs Jonas showed her earlier. Correct the plural form, then explain in Norwegian
    why the identifiable chairs take the definite plural and how that form is built from «stol»: «Nora finner stolerene.»
  derived_from:
  - section_id: common-mistakes-to-avoid
  response_language: 'no'
  min_words: 5
  max_words: 22
  judge_prompt: Check that the learner corrects stolerene to stolene, which refers to the previously identified chairs, and explains that the definite plural ending attaches to the noun stem stol, not to the indefinite plural stoler. Accept concise natural Norwegian explanations.
  criteria:
  - id: corrected-form
    instruction: Replaces stolerene with the definite plural stolene, referring to the chairs already identified.
  - id: plural-rule
    instruction: Explains that the definite plural ending attaches to singular stem stol rather than the indefinite plural stoler.
  - id: concise-response
    instruction: Responds in 5–22 words.
- handle: choose_plural_forms_for_picnic
  op: choose
  objective: obj-noun-plurals-01
  bloom: understand
  prompt_md: Two family members are packing a picnic. In each option, the first list introduces items
    and the second list refers to the same items. Choose the list pair with correct plural definiteness
    across regular, unstressed-e, zero-ending and irregular nouns.
  derived_from:
  - section_id: cumulative-transfer-preparing-for-a-picnic
  stem_md: Choose the connected picnic exchange with the correct indefinite and definite plural choices.
  options:
  - id: zero-ending-first-list
    text: 'A: Vi pakker poser, kopper, epler, glassene og bøker. B: Nå ligger posene, koppene, eplene, glassene
      og bøkene i sekken.'
    correct: false
    why: The first list introduces the glasses for the first time, so it needs their indefinite plural form.
  - id: zero-ending-second-list
    text: 'A: Vi pakker poser, kopper, epler, glass og bøker. B: Nå ligger posene, koppene, eplene, glass
      og bøkene i sekken.'
    correct: false
    why: The second list refers back to the known glasses, so it needs the definite plural form.
  - id: irregular-definite
    text: 'A: Vi pakker poser, kopper, epler, glass og bøker. B: Nå ligger posene, koppene, eplene, glassene
      og bøker i sekken.'
    correct: false
    why: The second list refers back to the known books, so it needs the definite plural form.
  - id: correct
    text: 'A: Vi pakker poser, kopper, epler, glass og bøker. B: Nå ligger posene, koppene, eplene, glassene
      og bøkene i sekken.'
    correct: true
    why: The first list introduces the items, and the second list refers back to the known group with definite plurals.
