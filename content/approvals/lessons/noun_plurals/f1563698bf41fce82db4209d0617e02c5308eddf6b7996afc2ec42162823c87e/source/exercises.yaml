  - right_id: books-definite
    text: bøkene
  - right_id: men-indefinite
    text: menn
  - right_id: men-definite
    text: mennene
  - right_id: feet-indefinite
    text: føtter
  - right_id: feet-definite
    text: føttene
  pairs:
