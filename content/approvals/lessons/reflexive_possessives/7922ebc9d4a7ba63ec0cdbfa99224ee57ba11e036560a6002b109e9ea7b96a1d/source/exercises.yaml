- handle: review_transfer_response
  op: choose
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: Velg svaret som passer til situasjonen.
  derived_from:
  - section_id: sec-cumulative-office-ownership-transfer
  stem_md: Amina eier nøkkelen, jakka, passet og billettene. Liv eier veska. Amina skal hente tingene
    før hun drar.
  options:
  - id: wrong-reflexive-forms
    text: Amina finner nøkkelen si, tar på seg jakka sin, pakker passet sine og billettene sitt. Hun setter
      veska hennes ved døra.
    correct: false
    why: Possessivene må samsvare med nøkkelen, jakka, passet og billettene.
  - id: reflexive-forms-but-wrong-ownership
    text: Amina finner nøkkelen sin, tar på seg jakka si, pakker passet sitt og billettene sine. Hun setter
      veska si ved døra.
    correct: false
    why: Si viser her til Amina, men veska tilhører Liv.
  - id: all-owners-and-forms-correct
    text: Amina finner nøkkelen sin, tar på seg jakka si, pakker passet sitt og billettene sine. Hun setter
      veska hennes ved døra.
    correct: true
    why: Sin, si, sitt og sine viser tilbake til Amina og samsvarer med hvert substantiv; hennes viser
      til Liv.
  - id: wrong-ordinary-possessive
    text: Amina finner nøkkelen sin, tar på seg jakka si, pakker passet sitt og billettene sine. Hun setter
      veska sin ved døra.
    correct: false
    why: Veska tilhører Liv, ikke setningssubjektet Amina.
  explanation_md: Eierforholdet avgjør om possessivet viser tilbake til subjektet; substantivet avgjør
    formen.
