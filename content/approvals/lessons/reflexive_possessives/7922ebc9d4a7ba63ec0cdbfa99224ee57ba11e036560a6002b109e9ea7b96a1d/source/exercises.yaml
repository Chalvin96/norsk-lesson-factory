- handle: office_ownership_transfer
  op: write
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: "Skriv en rapport til kontorlederen om hva Amina og Petter skal gjøre før stengetid. Bruk tredje person. Ta med Aminas egen datamaskin, Petters eget vindu, Petters adgangskort på skrivebordet hans og papirene de eier sammen."
  derived_from:
  - section_id: sec-cumulative-office-ownership-transfer
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: "Vurder svaret etter kriteriene office-message, supplied-facts, reflexive-possessives, noun-agreement. Et naturlig norsk svar som oppfyller kriteriene, må bestå. Rapporten skal omtale Amina og Petter i tredje person, ikke henvende seg direkte til dem. Bedøm hvert possessiv ut fra subjektet i setningen: bruk refleksivt possessiv når eieren er subjektet, og vanlig possessiv når eieren er en annen enn subjektet. Godta for eksempel «Petter åpner sitt vindu» og «Amina åpner vinduet hans». Bruk samme regel for adgangskortet og skrivebordet, og bevar at papirene eies av Amina og Petter sammen. Et svar som utelater adgangskortet, skal stryke på supplied-facts."
  criteria:
  - id: office-message
    instruction: Svaret er en norsk rapport til kontorlederen i tredje person om oppgavene Amina og Petter
      skal gjøre før stengetid.
  - id: supplied-facts
    instruction: Meldingen kommuniserer alle fire oppgitte kontorfakta uten å endre hvem som eier hver
      gjenstand.
  - id: reflexive-possessives
    instruction: Bruker refleksivt possessiv når eieren er subjektet i setningen, og vanlig possessiv når
      eieren ikke er subjektet. Bevarer at Amina og Petter eier papirene sammen; godta riktig possessivvalg
      uavhengig av hvem av dem som er subjekt i den aktuelle setningen.
  - id: noun-agreement
    instruction: Refleksive eiendomsord samsvarer riktig med substantivene de bestemmer.
- handle: two_question_review
  op: write
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: "Skriv et notat til en klassekamerat. Forklar hvordan du finner ut om tingen tilhører subjektet, og hvordan substantivet bestemmer formen på eiendomsordet. Gi fire eksempler på eiendomsord som viser at tingen tilhører subjektet: ett eksempel med hvert av «sin», «si», «sitt» og «sine». Bruk ulike substantiv."
  derived_from:
  - section_id: sec-final-retrieval-review
  response_language: 'no'
  min_words: 40
  max_words: 65
  judge_prompt: "Evaluate the response using study-note-purpose, ownership-check, noun-form-check, four-examples. All listed criteria are gating because each mirrors the visible task. Accept natural Norwegian paraphrases. A note that explains both checks and gives at least one accurate subject-owner example for each form must pass, using any suitable nouns and even if it gives extra natural examples. A note that explains only noun agreement must fail ownership-check."
  criteria:
  - id: study-note-purpose
    instruction: The response is a Norwegian study note addressed to a classmate.
  - id: ownership-check
    instruction: The note explains that the learner first checks whether the possessed noun belongs to
      the clause subject.
  - id: noun-form-check
    instruction: The note explains that the learner then checks the possessed noun's gender or number.
  - id: four-examples
    instruction: The note gives at least one accurate subject-owner example each using sin, si, sitt and
      sine with suitable nouns. Extra natural mentions while explaining the forms do not invalidate it.
- handle: review_ownership_relation
  op: choose
  objective: obj-reflexive-possessives-01
  bloom: understand
  prompt_md: Velg setningen som passer til Jonas’ notat.
  derived_from:
  - section_id: sec-final-retrieval-review
  stem_md: 'Merk: Telefonen tilhører Jonas. Han sjekker den før han drar.'
  options:
  - id: wrong-noun-agreement
    text: Jonas sjekker mobilen sitt før han drar.
    correct: false
    why: The ownership relation is reflexive, but mobilen does not take sitt.
  - id: jonas-own-phone
    text: Jonas sjekker mobilen sin før han drar.
    correct: true
    why: Jonas is both the clause subject and the phone's owner.
  - id: jonas-other-phone
    text: Jonas sjekker mobilen hans før han drar.
    correct: false
    why: Hans presents another male person as the owner.
  explanation_md: A reflexive possessive points back to the subject of its own clause.
