- handle: anchor_ownership_map
  op: choose
  objective: obj-reflexive-possessives-01
  bloom: understand
  prompt_md: Choose the interpretation of the possessive in Lina's line.
  derived_from:
  - section_id: sec-checkpoint-anchor-ownership-map
  stem_md: 'Lina: Jonas leter etter jakka si. Oskar: Ja, han la den på stolen.'
  options:
  - id: oskar-owns-jacket
    text: Jonas is the subject, but Oskar owns the jacket.
    correct: false
    why: That ownership reading would require an ordinary possessive referring to Oskar.
  - id: lina-owns-jacket
    text: Lina is the subject and owns the jacket.
    correct: false
    why: Lina speaks in the first line, but Jonas is the subject of the target clause.
  - id: jonas-owns-jacket
    text: Jonas is the subject and owns the jacket.
    correct: true
    why: Si refers to the clause subject, Jonas.
  explanation_md: The confusable pair is reflexive sin, si, sitt, sine versus ordinary hans, hennes, deres.
    This contrast builds on subject pronouns and ordinary possessives.
