- handle: review_transfer_response
  op: choose
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: Velg svaret som gjengir begge eierforholdene riktig.
  derived_from:
  - section_id: sec-cumulative-office-ownership-transfer
  stem_md: 'Amina: Datamaskinen tilhører meg. Veska tilhører Liv. Petter: Hva gjør du før vi går?'
  options:
  - id: both-made-ordinary
    text: Jeg slår av datamaskinen hennes og setter veska hennes ved døra.
    correct: false
    why: Hennes viser til en annen kvinne som eier datamaskinen.
  - id: agreement-only-error
    text: Jeg slår av datamaskinen mitt og setter veska hennes ved døra.
    correct: false
    why: Eierskapskontrasten er riktig, men datamaskinen krever min, ikke mitt.
  - id: both-owners-correct
    text: Jeg slår av datamaskinen min og setter veska hennes ved døra.
    correct: true
    why: Datamaskinen tilhører Amina, mens veska tilhører Liv.
  - id: both-made-reflexive
    text: Jeg slår av datamaskinen min og setter veska si ved døra.
    correct: false
    why: Si viser at Amina eier veska, men veska tilhører Liv.
  explanation_md: Svaret må kombinere riktig eier for hvert objekt med riktig possessivform.
