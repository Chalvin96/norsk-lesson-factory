- handle: office_ownership_transfer
  op: write
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: 'Closing note: Amina must turn off the computer that belongs to her. Petter must close the
    window that belongs to him. Amina must place Petter''s access card on his desk. Both colleagues must
    collect the papers that belong to them. Write a 35–55-word Norwegian message to the closing team confirming
    these tasks. Use the reflexive possessives datamaskinen sin, vinduet sitt and papirene sine, and the
    ordinary possessive Petters adgangskort.'
  derived_from:
  - section_id: sec-cumulative-office-ownership-transfer
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: Vurder svaret etter kriteriene office-message, supplied-facts, reflexive-possessives,
    noun-agreement og word-bound. Et naturlig norsk svar på 35–55 ord må bestå. Svaret må bruke refleksive
    eiendomsord for subjektets eierskap og vanlige eiendomsord for en annen kollegas eierskap. Svaret
    må bruke riktig samsvar mellom eiendomsord og substantiv. Et svar som utelater adgangskortet, skal
    stryke på supplied-facts.
  criteria:
  - id: office-message
    instruction: Svaret er en norsk melding til avslutningsteamet som bekrefter oppgavene ved stengetid.
  - id: supplied-facts
    instruction: Meldingen kommuniserer alle fire oppgitte kontorfakta uten å endre hvem som eier hver
      gjenstand.
  - id: word-bound
    instruction: Meldingen inneholder 35–55 ord.
  - id: reflexive-possessives
    instruction: Meldingen bruker nøyaktig uttrykkene datamaskinen sin, vinduet sitt og papirene sine
      for subjektets eierskap, samt nøyaktig uttrykket Petters adgangskort for den andre kollegaens eierskap.
  - id: noun-agreement
    instruction: Refleksive eiendomsord samsvarer riktig med substantivene de bestemmer.
- handle: two_question_review
  op: write
  objective: obj-reflexive-possessives-01
  bloom: apply
  prompt_md: 'Study-note facts: Check whether the possessed noun belongs to the clause subject. If it
    does, check the possessed noun''s gender or number. Examples needed: bil, jakke, pass and billetter,
    each owned by its sentence subject. Write a 40–65-word Norwegian study note to a classmate explaining
    both checks and illustrating sin, si, sitt and sine once each.'
  derived_from:
  - section_id: sec-final-retrieval-review
  response_language: 'no'
  min_words: 40
  max_words: 65
  judge_prompt: Evaluate the response using study-note-purpose, ownership-check, noun-form-check, four-examples
    and word-bound. All five are gating because each mirrors the visible task. Accept natural Norwegian
    paraphrases. A 40–65-word note that explains both checks and gives exactly one accurate example each
    for sin with bil, si with jakke, sitt with pass and sine with billetter must pass. A note that explains
    only noun agreement must fail ownership-check.
  criteria:
  - id: study-note-purpose
    instruction: The response is a Norwegian study note addressed to a classmate.
  - id: ownership-check
    instruction: The note explains that the learner first checks whether the possessed noun belongs to
      the clause subject.
  - id: noun-form-check
    instruction: The note explains that the learner then checks the possessed noun's gender or number.
  - id: four-examples
    instruction: The note gives exactly one subject-owner example each using sin with bil, si with jakke,
      sitt with pass and sine with billetter, with no additional uses of these four target forms.
  - id: word-bound
    instruction: The note contains 40–65 words.
- handle: review_ownership_relation
  op: choose
  objective: obj-reflexive-possessives-01
  bloom: understand
  prompt_md: Choose the sentence that matches the note.
  derived_from:
  - section_id: sec-final-retrieval-review
  stem_md: 'Note: The phone belongs to Jonas. Jonas checks it before leaving.'
  options:
  - id: wrong-noun-agreement
    text: Jonas sjekker mobilen sitt før han drar.
    correct: false
    why: The ownership relation is reflexive, but mobilen does not take sitt.
  - id: jonas-own-phone
    text: Jonas sjekker mobilen sin før han drar.
    correct: true
    why: Jonas is both the clause subject and the phone's owner.
  - id: jonas-other-phone
    text: Jonas sjekker mobilen hans før han drar.
    correct: false
    why: Hans presents another male person as the owner.
  explanation_md: A reflexive possessive points back to the subject of its own clause.
