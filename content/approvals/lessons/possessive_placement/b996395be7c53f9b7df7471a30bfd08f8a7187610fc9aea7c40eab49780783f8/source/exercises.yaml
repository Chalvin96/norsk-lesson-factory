  objective: obj-possessive-placement-01
  bloom: apply
  prompt_md: 'Liv skriver: «Den blå koppen er din, og begge laderne er mine. Hvor er notatboka di?» Koppen din er rød og står ved vinduet; den blå koppen er Livs. De to laderne dine ligger på bordet, og notatboka di er i veska. Svar Liv på norsk med 35–55 ord. Rett opp misforståelsen med eiendomsordet først, og bruk etterstilt eiendomsord når du forteller hvor tingene dine er.'
  explanation_md: En naturlig melding retter opp hvem som eier tingene og bruker etterstilte eiendomsord når den forteller hvor de står.
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: "no"
  min_words: 35
  max_words: 55
  judge_prompt: Evaluate every listed criterion as a gating criterion. Do not introduce any additional gating requirement.
  criteria:
  - id: reply-purpose
    instruction: The response is a reply to Liv that corrects her ownership assumptions and reports where the learner’s things are.
  - id: supplied-facts
    instruction: The response uses the supplied facts without contradicting them.
  - id: norwegian-reply
    instruction: The response is written in understandable Norwegian.
  - id: word-bound
    instruction: The response contains 35–55 words.
  - id: possessive-placement-observation
    instruction: The response uses owner-first placement for the correction and postposed possessives for routine information about the learner’s things.
  - id: noun-form-observation
    instruction: Each possessive placement is paired with the taught noun form.
