- handle: message_about_meeting_room_belongings
  op: write
  objective: obj-possessive-placement-01
  bloom: apply
  prompt_md: 'Liv writes: «Den blå koppen er din, og begge laderne er mine. Hvor er notatboka di?» Facts:
    | Object | Fact | |---|---| | Your cup | red; beside the window | | Blue cup | Liv’s | | Your two
    chargers | on the table | | Your notebook | in your bag | Write Liv a 35–55-word Norwegian reply that
    corrects her, uses owner-first placement when correcting her, and uses postposed possessives when
    giving routine information about where your things are.'
  explanation_md: A natural reply can foreground an owner while correcting Liv and use neutral postposed
    possessives for routine locations.
  derived_from:
  - section_id: transfer-to-a-new-situation
  response_language: 'no'
  min_words: 35
  max_words: 55
  judge_prompt: Evaluate every listed criterion as a gating criterion. Do not introduce any additional
    gating requirement.
  criteria:
  - id: reply-purpose
    instruction: The response is a reply to Liv that corrects her ownership assumptions and reports where
      the learner’s things are.
  - id: supplied-facts
    instruction: The response uses the supplied facts without contradicting them.
  - id: norwegian-reply
    instruction: The response is written in understandable Norwegian.
  - id: word-bound
    instruction: The response contains 35–55 words.
  - id: possessive-placement-observation
    instruction: The response uses owner-first placement for the correction and postposed possessives
      for routine information about the learner’s things.
  - id: noun-form-observation
    instruction: Each possessive placement is paired with the taught noun form.
