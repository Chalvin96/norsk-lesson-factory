- handle: retrieve_possessive_placement_rule
  op: write
  objective: obj-possessive-placement-01
  bloom: apply
  prompt_md: A classmate missed the lesson and asks how Norwegian possessive placement works. Write a
    30–50-word Norwegian message explaining both taught patterns and giving one example of each.
  explanation_md: The message should distinguish definite noun + possessive from possessive + indefinite
    noun and connect the latter with owner emphasis or contrast.
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 30
  max_words: 50
  judge_prompt: Evaluate rule-after-noun, rule-before-noun, two-examples, classmate-message, norwegian-message,
    and word-bound. Accept natural Bokmål gender variants when placement and noun form remain paired.
    Do not add further gating requirements.
  criteria:
  - id: rule-after-noun
    instruction: Explains that the taught postposed pattern uses a definite common noun followed by the
      possessive.
  - id: rule-before-noun
    instruction: Explains that the taught preposed pattern uses the possessive followed by an indefinite
      common noun and can highlight or contrast the owner.
  - id: two-examples
    instruction: Gives one natural Norwegian example of each taught pattern.
  - id: classmate-message
    instruction: Functions as an explanatory message to the classmate.
  - id: norwegian-message
    instruction: The message is written in understandable Norwegian.
  - id: word-bound
    instruction: The message contains 30–50 words.
