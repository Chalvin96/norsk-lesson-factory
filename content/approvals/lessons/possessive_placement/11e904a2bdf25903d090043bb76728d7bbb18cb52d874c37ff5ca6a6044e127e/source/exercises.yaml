  criteria:
  - id: phrase-completion
    instruction: Gir en samsvarende etterstilt frase som betyr «my book», for eksempel «Boka mi» eller
      «Boken min».
  - id: word-bound
    instruction: Svaret inneholder 1–4 ord.
