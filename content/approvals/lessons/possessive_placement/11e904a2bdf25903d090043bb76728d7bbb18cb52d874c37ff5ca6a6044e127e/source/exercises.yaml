    substantiv og etterstilt eiendomsord: «___ ligger på bordet.»'
  explanation_md: 'A routine location answer uses the definite noun followed by the possessive: boka mi.'
  derived_from:
  - section_id: retrieval-and-review
  response_language: 'no'
  min_words: 1
  max_words: 4
  judge_prompt: Vurder bare frasefullføring og antall ord. Godta «Boka mi» og den vanlige felleskjønnsvarianten
