- handle: notice_possessive_noun_pairing
  op: categorize
  objective: obj-possessive-placement-01
  bloom: analyze
  prompt_md: Sort the phrases by possessive placement and noun form.
  explanation_md: A postposed possessive pairs with a definite noun; a preposed possessive pairs with
    an indefinite noun.
  derived_from:
  - section_id: checkpoint-noticing-two-patterns
  buckets:
  - bucket_id: after-definite
    label: Definite noun + possessive
  - bucket_id: before-indefinite
    label: Possessive + indefinite noun
  items:
  - item_id: item-huset-mitt
    text: huset mitt
    bucket_id: after-definite
  - item_id: item-sykkelen-min
    text: sykkelen min
    bucket_id: after-definite
  - item_id: item-lua-mi
    text: lua mi
    bucket_id: after-definite
  - item_id: item-mitt-hus
    text: mitt hus
    bucket_id: before-indefinite
  - item_id: item-min-sykkel
    text: min sykkel
    bucket_id: before-indefinite
  - item_id: item-mi-lue
    text: mi lue
    bucket_id: before-indefinite
