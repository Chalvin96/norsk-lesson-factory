    - speaker: Maja
      text_md: Hva holder Lea på med?
    - speaker: Lea
      text_md: Jeg svarer på det siste spørsmålet.
  prompt_md: Velg det brede svaret som sier hva Lea arbeider med.
  options:
  - id: aa-answer
    text: Hun holder på å svare på det siste spørsmålet.
    correct: false
    why: Dette svaret angir den nøyaktige handlingen, ikke den brede oppgaven det spørres etter.
  - id: aa-homework
    text: Hun holder på å norskleksene.
    correct: false
    why: Å kan ikke stå direkte foran substantivet norskleksene.
  - id: med-answer
    text: Hun holder på med svare på det siste spørsmålet.
    correct: false
    why: Med kan ikke stå direkte foran infinitiven svare.
  - id: med-homework
    text: Hun holder på med norskleksene.
    correct: true
    why: Svaret beskriver oppgaven med med etterfulgt av et substantiv.
  explanation_md: Spørsmålet ber om den brede oppgaven, så med pluss substantivet norskleksene passer.
  derived_from:
  - section_id: naming-an-activity
