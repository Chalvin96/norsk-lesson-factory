- handle: notice_form_contrast
  op: choose
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: understand
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: Jeg holder på med oppussingen.
    - speaker: Jonas
      text_md: Jeg holder på å male bokhylla.
  prompt_md: Choose the description that matches both sentences.
  options:
  - id: both-projects
    text: Both expressions introduce named projects.
    correct: false
    why: Male identifies an action rather than naming a project.
  - id: both-actions
    text: Both expressions identify the exact action happening now.
    correct: false
    why: Oppussingen leaves the exact action open.
  - id: noun-then-infinitive
    text: Med introduces the named project; å introduces the unfolding action.
    correct: true
    why: Oppussingen is a noun naming the project, while male is an infinitive naming the action.
  - id: infinitive-then-noun
    text: Med introduces the unfolding action; å introduces the named project.
    correct: false
    why: This reverses the contrast between a noun after med and an infinitive after å.
  explanation_md: Med is followed by the named project oppussingen; å is followed by the infinitive male.
  derived_from:
  - section_id: room-in-the-middle-of-a-makeover
- handle: select_named_activity_reply
  op: choose
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  stimulus:
  - kind: dialogue
    turns:
