- handle: ask_then_narrow_the_focus
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: 'In the Teams chat, write a connected 25–40-word Norwegian exchange: Erik opens with «Hva
    holder du på med?», Maja gives the broad answer with holde på med and a noun, and Erik asks what she
    is doing right now using holde på å and an infinitive.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Erik
      text_md: Maja, vi skal møtes klokka 13. Hvordan går det med presentasjonen?
    - speaker: Maja
      text_md: Jeg tester prosjektoren akkurat nå.
  response_language: 'no'
  judge_prompt: Evaluate opening-question, meeting-facts, broad-reply-form, specific-follow-up-form, and
    word-bound as gating. Record specific-follow-up-form-observation diagnostically.
  criteria:
  - id: opening-question
    instruction: The exchange opens with the visible question «Hva holder du på med?».
  - id: meeting-facts
    instruction: The connected exchange concerns the presentation and testing the projector before the
      meeting.
  - id: broad-reply-form
    instruction: Maja's broad reply uses holde på med followed by a noun naming the presentation task.
  - id: specific-follow-up-form
    instruction: Erik follows up by asking what Maja is doing right now with holde på å followed by an
      infinitive.
  - id: word-bound
    instruction: The exchange contains 25–40 words.
  - id: specific-follow-up-form-observation
    instruction: 'Observation only: note whether the follow-up also uses a natural alternative such as
      Hva gjør du nå?; do not use this observation for gating.'
  derived_from:
  - section_id: questions-in-conversation
