- handle: final_practice_new_situation
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: Your family leaves at 10:00. In the family chat, write a 45–65-word Norwegian status update
    that says what each person is responsible for, uses holde på med plus a noun for responsibilities,
    uses holde på å plus an infinitive for current actions, and asks someone to take over the final packing
    task before departure.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Du
      text_md: Jeg har ansvar for bagasjen og pakker klær nå.
    - speaker: Ada
      text_md: Jeg har ansvar for frokosten og lager smørbrød nå.
    - speaker: Per
      text_md: Jeg har ansvar for bilen og sjekker dekkene nå.
  response_language: 'no'
  judge_prompt: Check criteria audience-purpose, supplied-facts, broad-form, action-form, coordination,
    and word-bound as gating. Record naturalness-observation diagnostically.
  criteria:
  - id: audience-purpose
    instruction: The message is suitable for the family chat and gives a useful status update before departure.
  - id: supplied-facts
    instruction: The message accurately includes each person's responsibility and current action.
  - id: broad-form
    instruction: The message uses holde på med plus a noun for each person's responsibility.
  - id: action-form
    instruction: The message uses holde på å plus an infinitive for each person's current action.
  - id: coordination
    instruction: The message asks someone to take over the final packing task before departure.
  - id: word-bound
    instruction: The message contains 45–65 words.
  - id: naturalness-observation
    instruction: 'Observation only: note whether the coordination request sounds natural and clear; do
      not use this observation for gating.'
  derived_from:
  - section_id: final-practice-in-a-new-situation
