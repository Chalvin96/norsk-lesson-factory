- handle: notice_form_contrast
  op: choose
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: understand
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Jonas
      text_md: Jeg holder på med oppussingen.
    - speaker: Jonas
      text_md: Jeg holder på å male bokhylla.
  prompt_md: Velg beskrivelsen som passer til begge setningene.
  options:
  - id: both-projects
    text: Both expressions introduce named projects.
    correct: false
    why: Male identifies an action rather than naming a project.
  - id: both-actions
    text: Both expressions identify the exact action happening now.
    correct: false
    why: Oppussingen leaves the exact action open.
  - id: noun-then-infinitive
    text: Med introduces the named project; å introduces the unfolding action.
    correct: true
    why: Oppussingen is a noun naming the project, while male is an infinitive
      naming the action.
  - id: infinitive-then-noun
    text: Med introduces the unfolding action; å introduces the named project.
    correct: false
    why: This reverses the contrast between a noun after med and an infinitive
      after å.
  explanation_md: «Med» etterfølges av substantivet «oppussingen». «Å»
    etterfølges av infinitiven «male».
  derived_from:
  - section_id: room-in-the-middle-of-a-makeover
- handle: select_named_activity_reply
  op: choose
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Lea, hva holder du på med?»
    - speaker: Lea
      text_md: «Jeg jobber med oppgavene i norskboka.»
  prompt_md: Velg svaret som forteller hva Lea arbeider med.
  options:
  - id: aa-answer
    text: Hun holder på å svare på det siste spørsmålet.
    correct: false
    why: Dette svaret angir den nøyaktige handlingen, ikke den brede oppgaven
      det spørres etter.
  - id: aa-homework
    text: Hun holder på å norskleksene.
    correct: false
    why: Å kan ikke stå direkte foran substantivet norskleksene.
  - id: med-answer
    text: Hun holder på med svare på det siste spørsmålet.
    correct: false
    why: Med kan ikke stå direkte foran infinitiven svare.
  - id: med-homework
    text: Hun holder på med oppgavene i norskboka.
    correct: true
    why: Svaret beskriver oppgaven med med etterfulgt av et substantiv.
  explanation_md: Spørsmålet gjelder oppgaven, så «med» + substantivet
    «norskleksene» passer.
  derived_from:
  - section_id: naming-an-activity
- handle: select_unfolding_action_reply
  op: choose
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Amir
      text_md: Jeg holder på med sykkelen.
    - speaker: Nora
      text_md: «Hva holder du på med akkurat nå?»
    - speaker: Amir
      text_md: Jeg strammer en skrue.
  prompt_md: Velg svaret som forteller hva Amir gjør akkurat nå.
  options:
  - id: aa-bicycle
    text: Han holder på å sykkelen.
    correct: false
    why: Å cannot introduce the noun sykkelen.
  - id: aa-tighten
    text: Han holder på å stramme en skrue.
    correct: true
    why: Å introduces the infinitive stramme and identifies the current action.
  - id: med-bicycle
    text: Han holder på med sykkelen.
    correct: false
    why: This grammatical reply names the broad project but does not identify
      the requested action.
  - id: med-tighten
    text: Han holder på med stramme en skrue.
    correct: false
    why: Med cannot directly introduce the infinitive stramme.
  explanation_md: Spørsmålet gjelder den konkrete handlingen, så «å» +
    infinitiven «stramme» passer.
  derived_from:
  - section_id: showing-an-unfolding-action
