- handle: repair_the_structure
  op: find_fix
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: analyze
  prompt_md: Velg ordet som ikke passer til handlingen.
  tokens:
  - token_id: tok-1
    text: Jeg
  - token_id: tok-2
    text: holder
  - token_id: tok-3
    text: på
  - token_id: tok-4
    text: med
  - token_id: tok-5
    text: lage
  - token_id: tok-6
    text: middag.
  error_token_id: tok-4
  feedback: Replace med with å before the infinitive lage. A noun-focused
    alternative is «Jeg holder på med middagen.»
  derived_from:
  - section_id: common-mistakes
- handle: discriminate_full_response
  op: choose
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: analyze
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Eva
      text_md: Jeg arbeider med bilen.
    - speaker: Kunde
      text_md: Hva gjør du med bilen akkurat nå?
    - speaker: Eva
      text_md: Jeg har jekket opp bilen og løsnet hjulboltene.
  prompt_md: Velg svaret som forteller kunden hva Eva gjør akkurat nå.
  options:
  - id: med-change
    text: Jeg holder på med skifte et dekk.
    correct: false
    why: Med cannot directly introduce the infinitive skifte.
  - id: aa-car
    text: Jeg holder på å bilen.
    correct: false
    why: Å cannot introduce the noun bilen.
  - id: changing-tire
    text: Jeg holder på å skifte et dekk.
    correct: true
    why: It answers the request for the exact current action.
  - id: working-car
    text: Jeg holder på med bilen.
    correct: false
    why: It gives only the broad project, not the exact action requested.
  explanation_md: Kunden spør om den konkrete handlingen, så «å» + infinitiven
    «skifte» passer.
  derived_from:
  - section_id: one-situation-two-viewpoints
- handle: ask_then_narrow_the_focus
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: "Fortsett chatten. Maja svarer på spørsmålet «Hva holder du på med?». Erik spør deretter hva hun gjør akkurat nå, med «holde på å» + infinitiv i spørsmålet."
  min_words: 25
  max_words: 40
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Erik
      text_md: Maja, vi skal møtes klokka 13. Hvordan går det med
        presentasjonen?
    - speaker: Maja
      text_md: Jeg tester prosjektoren akkurat nå.
  response_language: "no"
  judge_prompt: "Evaluate opening-question, meeting-facts, broad-reply-form, specific-follow-up-form as gating. Record specific-follow-up-form-observation diagnostically."
  criteria:
  - id: opening-question
    instruction: The exchange opens with the visible question «Hva holder du på
      med?».
  - id: meeting-facts
    instruction: The connected exchange concerns the presentation and testing
      the projector before the meeting.
  - id: broad-reply-form
    instruction: Maja's broad reply uses holde på med followed by a noun naming
      the presentation task.
  - id: specific-follow-up-form
    instruction: Erik follows up by asking what Maja is doing right now with
      holde på å followed by an infinitive.
  - id: specific-follow-up-form-observation
    instruction: 'Observation only: note whether the follow-up also uses a natural
      alternative such as Hva gjør du nå?; do not use this observation for gating.'
  derived_from:
  - section_id: questions-in-conversation
