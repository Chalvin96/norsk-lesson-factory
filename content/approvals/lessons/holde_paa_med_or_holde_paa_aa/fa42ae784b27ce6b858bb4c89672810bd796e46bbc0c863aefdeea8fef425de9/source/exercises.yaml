  op: choose
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: analyze
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Tom
      text_md: Jeg har grønnsaker på skjærebrettet.
