- handle: final_practice_new_situation
  op: write
  objective: obj-holde-paa-med-or-holde-paa-aa-01
  bloom: apply
  prompt_md: "Dere drar klokka 10. Skriv en statusmelding i familiechatten. Fortell hva hver person har ansvar for og hva hen gjør nå. Bruk «holde på med» + substantiv om ansvaret og «holde på å» + infinitiv om handlingen. Spør om noen kan ta over den siste pakkeoppgaven."
  min_words: 45
  max_words: 65
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Du
      text_md: Jeg har ansvar for bagasjen og pakker klær nå.
    - speaker: Ada
      text_md: Jeg har ansvar for frokosten og lager smørbrød nå.
    - speaker: Per
      text_md: Jeg har ansvar for bilen og sjekker dekkene nå.
  response_language: "no"
  judge_prompt: "Check criteria audience-purpose, supplied-facts, broad-form, action-form, coordination as gating. Record naturalness-observation diagnostically."
  criteria:
  - id: audience-purpose
    instruction: The message is suitable for the family chat and gives a useful
      status update before departure.
  - id: supplied-facts
    instruction: The message accurately includes each person's responsibility
      and current action.
  - id: broad-form
    instruction: The message uses holde på med plus a noun for each person's
      responsibility.
  - id: action-form
    instruction: The message uses holde på å plus an infinitive for each
      person's current action.
  - id: coordination
    instruction: The message asks someone to take over the final packing task
      before departure.
  - id: naturalness-observation
    instruction: 'Observation only: note whether the coordination request sounds natural
      and clear; do not use this observation for gating.'
  derived_from:
  - section_id: final-practice-in-a-new-situation
