        we bring».'
  options:
  - id: comparative-verb-subject
    text: Jo færre ting tar vi med, ...
    correct: false
    why: Dette bruker inversjon i den første delen, der subjektet normalt skal stå foran det finitte verbet.
  - id: comparative-subject-verb
    text: Jo færre ting vi tar med, ...
