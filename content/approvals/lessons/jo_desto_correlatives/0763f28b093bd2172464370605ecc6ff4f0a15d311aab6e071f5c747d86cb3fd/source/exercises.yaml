- handle: notice_the_linked_changes
  op: choose
  objective: obj-jo-desto-correlatives-01
  bloom: understand
  prompt_md: Velg linjen som knytter sammen to endringer i kjøkkenplanleggingen.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Jo lenger vi venter, desto senere blir kjøkkenet ferdig.»
    - speaker: Henrik
      text_md: «Vi bør sammenligne tilbudene før vi bestemmer oss.»
  options:
  - id: loose-facts
    text: Vi venter lenger. Kjøkkenet blir ferdig senere.
    correct: false
    why: Dette er to separate opplysninger, ikke én setning som viser sammenhengen.
  - id: linked-line
    text: Jo mer vi undersøker prisene, desto bedre grunnlag får vi for valget.
    correct: true
    why: Linjen viser hvordan grundigere undersøkelse gir et bedre grunnlag for valget.
  - id: other-changes
    text: Jo lenger vi venter, desto tidligere blir kjøkkenet ferdig.
    correct: false
    why: Dialogen sier at kjøkkenet blir ferdig senere, ikke tidligere, når vi venter lenger.
  derived_from:
  - section_id: a-kitchen-decision
