    why: Den sammenlignende frasen står etter jo, og subjektet vi står foran verbet tar.
  - id: subject-before-comparative
    text: Jo vi færre ting tar med, ...
    correct: false
    why: Dette plasserer subjektet inne i den sammenlignende frasen i stedet for etter færre ting.
