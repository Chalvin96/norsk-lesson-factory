- handle: retrieve_four_indefinites
  op: write
  objective: obj-indefinite-pronouns-01
  bloom: apply
  prompt_md: 'Write a 25–40-word Norwegian reply to your colleague that reports the closing status of
    the shop and uses all four indefinite forms from this lesson: noen, noe, ingen, ingenting.'
  explanation_md: 'A successful reply reports the closing status accurately and uses all four indefinite
    forms: noen for a person or plural countable item, noe for a thing, amount, or infinitive pattern,
    ingen for an absent person or noun, and ingenting as a stand-alone nothing.'
  derived_from:
  - section_id: final-retrieval-request-retrieve-four-indefinites
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kollega
      text_md: «Er butikken klar til å stenge?»
    - speaker: Context
      text_md: Butikken er tom for kunder. Tre esker står utenfor lageret. Det er litt kaffe på pauserommet.
        Alt er kontrollert.
  response_language: 'no'
  max_words: 40
  judge_prompt: 'Check every criterion as gating: message-purpose, supplied-facts, word-bound, uses-noen,
    uses-noe, uses-ingen, and uses-ingenting. Treat none of them as observational.'
  criteria:
  - id: message-purpose
    instruction: Replies to the colleague with a message that reports whether the shop is ready to close.
  - id: supplied-facts
    instruction: Preserves the supplied facts without inventing a contradiction.
  - id: word-bound
    instruction: Contains 25–40 words.
  - id: uses-noen
    instruction: Uses noen for a person or plural countable referent.
  - id: uses-noe
    instruction: Uses noe for a thing, substance, amount, or infinitive pattern.
  - id: uses-ingen
    instruction: Uses ingen for an absent person or before a noun.
  - id: uses-ingenting
    instruction: Uses ingenting as a stand-alone form meaning nothing.
