- handle: retrieve_four_indefinites
  op: write
  objective: obj-indefinite-pronouns-01
  bloom: apply
  prompt_md: Butikken er tom for kunder. Tre esker står utenfor lageret, det er
    litt kaffe på pauserommet, og alt er kontrollert. Skriv en melding på 25–40
    ord til kollegaen din om hvor klare dere er til å stenge. Bruk «noen»,
    «noe», «ingen» og «ingenting».
  explanation_md: «Noen» viser til personer eller ting i flertall; «noe» til en
    ting, mengde, stoff eller handling; «ingen» står foran en person eller et
    substantiv som mangler; «ingenting» står alene.
  derived_from:
  - section_id: final-retrieval-request-retrieve-four-indefinites
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Kollega
      text_md: «Det er tomt for kunder. Tre esker står utenfor lageret, og det
        er litt kaffe på pauserommet. Alt er kontrollert. Er butikken klar til å
        stenge?»
  response_language: "no"
  max_words: 40
  judge_prompt: 'Check every criterion as gating: message-purpose, supplied-facts,
    word-bound, uses-noen, uses-noe, uses-ingen, and uses-ingenting. Treat none of
    them as observational.'
  criteria:
  - id: message-purpose
    instruction: Replies to the colleague with a message that reports whether
      the shop is ready to close.
  - id: supplied-facts
    instruction: Preserves the supplied facts without inventing a contradiction.
  - id: word-bound
    instruction: Contains 25–40 words.
  - id: uses-noen
    instruction: Uses noen for a person or plural countable referent.
  - id: uses-noe
    instruction: Uses noe for a thing, substance, amount, or infinitive pattern.
  - id: uses-ingen
    instruction: Uses ingen for an absent person or before a noun.
  - id: uses-ingenting
    instruction: Uses ingenting as a stand-alone form meaning nothing.
