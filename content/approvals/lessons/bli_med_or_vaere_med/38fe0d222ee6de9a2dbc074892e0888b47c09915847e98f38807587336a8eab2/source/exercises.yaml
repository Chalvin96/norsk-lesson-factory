- handle: contrast_before_after
  op: choose
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: "Choose the reply that describes Nora's decision when she changes her mind and her participation during the rehearsal."
  stem_md: "Monday: Nora says no to choir practice. Tuesday at 5 p.m.: Nora changes her mind. Tuesday at 6 p.m.: Practice is underway, and Nora is singing with the choir."
  options:
  - id: participation-then-entry
    text: «Klokka 17 er Nora med på øvelsen. Klokka 18 blir hun med på øvelsen.»
    correct: false
    why: This places settled participation before the stated change of decision.
  - id: entry-twice
    text: «Klokka 17 blir Nora med på øvelsen. Klokka 18 blir hun med på
      øvelsen.»
    correct: false
    why: The second sentence treats the ongoing rehearsal as another act of
      joining.
  - id: participation-twice
    text: «Klokka 17 er Nora med på øvelsen. Klokka 18 er hun med på øvelsen.»
    correct: false
    why: This does not express the change from saying no to joining at 17.
  - id: entry-then-participation
    text: «Klokka 17 blir Nora med på øvelsen. Klokka 18 er hun med på øvelsen.»
    correct: true
    why: The first sentence presents her decision to join; the second presents
      her participation.
  derived_from:
  - section_id: same-event-two-viewpoints
