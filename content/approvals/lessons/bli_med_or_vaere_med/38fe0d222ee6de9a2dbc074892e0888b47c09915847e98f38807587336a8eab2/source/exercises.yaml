- handle: review_cabin_dual_viewpoint
  op: choose
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: "Choose the update that says Omar joins at nine and takes part at twelve."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Omar sa først at han ville bli hjemme. Hva skjedde på lørdag?»
    - speaker: Jonas
      text_md: «Klokka ni satte han seg i bilen med oss. Klokka tolv satt han
        sammen med gruppa på hytta.»
  options:
  - id: reversed-travel
    text: «Klokka ni var Omar med oss i bilen. Klokka tolv ble han med gruppa på
      hytta.»
    correct: false
    why: This makes his presence in the car a settled state and presents his
      presence at the cabin as a new joining.
  - id: joining-twice
    text: «Klokka ni var Omar med oss i bilen. Klokka tolv var han med gruppa på
      hytta.»
    correct: false
    why: This reports where Omar was at both times but does not highlight when
      he joined the trip.
  - id: joining-then-participating
    text: «Klokka ni ble Omar med oss i bilen. Klokka tolv var han med gruppa på
      hytta.»
    correct: true
    why: Ble med reports the change at nine; var med reports participation at
