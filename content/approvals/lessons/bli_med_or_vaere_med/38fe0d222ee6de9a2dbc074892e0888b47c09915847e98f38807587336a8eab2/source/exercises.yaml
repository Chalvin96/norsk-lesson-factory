- handle: repair_mixed_expression
  op: choose
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: "Choose the correction that keeps the meaning."
  stem_md: "Liv is not on the list yet. You want to invite her on tomorrow's trip. Draft: «Er du bli med på turen i morgen?»"
  options:
  - id: imperative-question
    text: «Bli du med på turen i morgen?»
    correct: false
    why: A present-tense question needs blir med, not the bare form bli med.
  - id: past-joining-question
    text: «Ble du med på turen i morgen?»
    correct: false
    why: Ble places the act of joining in the past, which conflicts with i
      morgen.
  - id: settled-inclusion-question
    text: «Var du med på turen i morgen?»
    correct: false
    why: Var places settled inclusion in the past, which conflicts with i
      morgen.
  - id: joining-question
    text: «Blir du med på turen i morgen?»
    correct: true
    why: Blir med invites Liv to join and fits the present or future invitation.
  derived_from:
  - section_id: common-mistakes
- handle: context_cabin_plan
  op: write
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: "Maja writes: «Jeg gikk glipp av hytteturen. Kan du sende meg en kort oppdatering om planen fredag og det som skjedde lørdag?» Write a short update to Maja. Lea said yes to a seat in Sara's car and to carrying food on Friday, and got a place on the carrying team. Jonas and Omar were on the list on Friday, and Omar was going to meet the group on Saturday. On Saturday, Omar met the group and took part for the rest of the day. Use suitable forms of «bli med» and «være med» for each fact."
  derived_from:
  - section_id: back-at-cabin-trip
  response_language: 'no'
  min_words: 35
  max_words: 65
  judge_prompt: "Evaluate cabin-facts, audience-purpose, viewpoint-forms, clarity, viewpoint-observation, and tense-observation. Only cabin-facts, audience-purpose, viewpoint-forms, and clarity are gating. Criteria whose ids end in -observation are diagnostic and must never make the response fail."
  criteria:
  - id: cabin-facts
    instruction: Covers Lea's car decision, Jonas and Omar on Friday's
      participant list, Omar's Saturday arrival, Lea's food-carrying role, and
      Omar's Saturday participation.
  - id: audience-purpose
    instruction: Reads as a short update to Maja about Friday's plan and
      Saturday's result.
  - id: viewpoint-forms
    instruction: Uses a form of bli med for Lea's car decision, Lea's new
      food-carrying entry, and Omar's Saturday arrival; uses a form of være med
      for Jonas's Friday settled inclusion, Omar's Friday settled inclusion,
      Lea's settled food-carrying role, and Omar's Saturday participation.
  - id: clarity
    instruction: Is understandable Norwegian and keeps the Friday and Saturday
      events distinguishable.
  - id: viewpoint-observation
    instruction: 'Observation only: record whether forms of bli med present acceptance
      or arrival and forms of være med present established inclusion or participation.'
  - id: tense-observation
    instruction: 'Observation only: record whether the verb forms fit the Friday plan
      and the later Saturday report.'
