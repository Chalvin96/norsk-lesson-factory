- handle: first_checkpoint_finding_change
  op: choose
  objective: obj-bli-med-or-vaere-med-01
  bloom: understand
  prompt_md: Choose the description that matches how the two expressions are used.
  stem_md: 'Confusable pair: bli med / være med Prerequisite: Recognize blir/ble as forms of bli and er/var
    as forms of være. Sara: «Vil du bli med på hytta?» Omar står allerede på deltakerlista: «Han er med
    på turen.»'
  options:
  - id: both-entry
    text: Both expressions present joining or entry into the trip.
    correct: false
    why: The line about Omar reports settled inclusion, not a new act of joining.
  - id: bli-entry-vaere-inclusion
    text: bli med presents joining or entry; være med presents being included.
    correct: true
    why: Vil du bli med? invites entry, while er med reports that Omar is already included.
  - id: bli-inclusion-vaere-entry
    text: bli med presents being included; være med presents joining or entry.
    correct: false
    why: This reverses the two expressions.
  derived_from:
  - section_id: central-contrast
