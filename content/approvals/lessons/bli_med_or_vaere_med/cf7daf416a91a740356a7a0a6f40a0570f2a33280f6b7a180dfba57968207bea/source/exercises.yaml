    and tense-observation. Only cabin-facts, audience-purpose, word-bound, viewpoint-forms, and clarity
    are gating. Criteria whose ids end in -observation are diagnostic and must never make the response
    fail.
  criteria:
  - id: cabin-facts
    instruction: Covers Lea's car decision, Jonas and Omar on Friday's participant list, Omar's Saturday
      arrival, Lea's food-carrying role, and Omar's Saturday participation.
  - id: audience-purpose
    instruction: Reads as a short update to Maja about Friday's plan and Saturday's result.
  - id: word-bound
    instruction: Contains 35–65 words.
  - id: viewpoint-forms
    instruction: Uses a form of bli med for Lea's car decision, Lea's new food-carrying entry, and Omar's
      Saturday arrival; uses a form of være med for Jonas's Friday settled inclusion, Omar's Friday settled
      inclusion, Lea's settled food-carrying role, and Omar's Saturday participation.
  - id: clarity
    instruction: Is understandable Norwegian and keeps the Friday and Saturday events distinguishable.
  - id: viewpoint-observation
    instruction: 'Observation only: record whether forms of bli med present acceptance or arrival and
      forms of være med present established inclusion or participation.'
  - id: tense-observation
    instruction: 'Observation only: record whether the verb forms fit the Friday plan and the later Saturday
      report.'
