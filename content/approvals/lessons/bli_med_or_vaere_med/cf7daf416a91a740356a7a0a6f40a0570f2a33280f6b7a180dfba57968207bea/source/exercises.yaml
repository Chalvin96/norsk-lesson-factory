    lørdag. | | Fredag | Lea takket ja til å bære mat og fikk plass på bærelaget. | | Lørdag | Omar møtte
    gruppa og deltok resten av dagen. | Write Maja a 35–65-word Norwegian update covering the listed facts,
    using bli med for Lea''s Friday decisions and Omar''s Saturday arrival, and være med for Jonas''s
    and Omar''s Friday settled inclusion, Lea''s settled role, and Omar''s Saturday participation.'
