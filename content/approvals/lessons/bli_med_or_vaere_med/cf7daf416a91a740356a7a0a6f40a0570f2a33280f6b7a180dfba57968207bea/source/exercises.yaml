- handle: review_cabin_dual_viewpoint
  op: choose
  objective: obj-bli-med-or-vaere-med-01
  bloom: apply
  prompt_md: Choose the update that reports Omar joining at nine and participating at noon.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Maja
      text_md: «Omar sa først at han ville bli hjemme. Hva skjedde på lørdag?»
    - speaker: Jonas
      text_md: «Klokka ni satte han seg i bilen med oss. Klokka tolv satt han sammen med gruppa på hytta.»
  options:
  - id: reversed-travel
    text: «Klokka ni var Omar med oss i bilen. Klokka tolv ble han med gruppa på hytta.»
