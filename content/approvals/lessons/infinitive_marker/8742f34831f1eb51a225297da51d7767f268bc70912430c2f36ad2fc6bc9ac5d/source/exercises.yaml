- handle: notice_infinitive_marker_in_context
  op: choose
  objective: obj-infinitive-marker-01
  bloom: understand
  prompt_md: Choose the group in which both sentences correctly link the first verb to the following infinitive.
  derived_from:
  - section_id: infinitive-and-marker
  stem_md: '**A:** Maja kan å spise. Elias skal å reise. **B:** Maja liker spise. Elias håper reise. **C:**
    Maja liker å spise. Elias håper å reise.'
  options:
  - id: group-a
    text: The first group
    correct: false
    why: The modal verbs kan and skal take a bare infinitive, so å must not appear after them.
  - id: group-b
    text: The second group
    correct: false
    why: The non-modal verbs liker and håper need å before the following infinitives.
  - id: group-c
    text: The third group
    correct: true
    why: The non-modal verbs liker and håper are followed by å and an unchanged infinitive.
- handle: choose_marker_after_first_verb
  op: recall_fill
  objective: obj-infinitive-marker-01
  bloom: apply
  prompt_md: Choose the required infinitive form in each sentence.
  explanation_md: Modal verbs take a bare infinitive, while verbs such as håper and prøver take å plus
    the infinitive.
  derived_from:
  - section_id: after-modal-verbs
  audio_target: På mandag håper jeg … Bergen. I kveld må jeg … middag. På lørdag vil vi … Anna. Etter
    jobb prøver hun … på norsk.
  segments:
  - text_md: 'På mandag håper jeg '
  - blank_id: visit-form
    options:
    - besøke
    - å besøke
    answer_index: 1
  - text_md: ' Bergen. I kveld må jeg '
  - blank_id: dinner-form
    options:
    - lage
    - å lage
    answer_index: 0
  - text_md: ' middag. På lørdag vil vi '
  - blank_id: meet-form
    options:
    - å møte
    - møte
    answer_index: 1
  - text_md: ' Anna. Etter jobb prøver hun '
  - blank_id: read-form
    options:
    - å lese
