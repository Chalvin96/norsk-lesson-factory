- handle: notice_infinitive_marker_in_context
  op: choose
  objective: obj-infinitive-marker-01
  bloom: understand
  prompt_md: Velg gruppa der begge setningene er riktige.
  derived_from:
  - section_id: infinitive-and-marker
  stem_md: 'A: Maja kan å spise. Elias skal å reise. B: Maja liker spise. Elias håper reise. C: Maja liker å spise. Elias håper å reise.'
  options:
  - id: group-a
    text: Gruppe A
    correct: false
    why: Etter modalverbene «kan» og «skal» bruker vi infinitiv uten «å».
  - id: group-b
    text: Gruppe B
    correct: false
    why: Etter «liker» og «håper» bruker vi «å» foran infinitiven.
  - id: group-c
    text: Gruppe C
    correct: true
    why: Etter «liker» og «håper» står «å» foran infinitiven, som beholder grunnformen.
- handle: choose_marker_after_first_verb
  op: recall_fill
  objective: obj-infinitive-marker-01
  bloom: apply
  prompt_md: Fyll ut setningene med riktig infinitivform.
  explanation_md: Modalverb står med infinitiv uten «å». Verb som «håpe» og «prøve» står med «å» foran infinitiven.
  derived_from:
  - section_id: after-modal-verbs
  audio_target: På mandag håper jeg å besøke Bergen. I kveld må jeg lage middag. På lørdag vil vi møte Anna. Etter jobb prøver hun å lese på norsk.
  segments:
