  - blank_id: dinner-form
    options:
    - lage
    - å lage
    answer_index: 0
  - text_md: ' middag. På lørdag vil vi '
  - blank_id: meet-form
    options:
    - å møte
    - møte
    answer_index: 1
  - text_md: ' Anna. Etter jobb prøver hun '
  - blank_id: read-form
    options:
    - å lese
    - lese
    answer_index: 0
  - text_md: ' på norsk.'
