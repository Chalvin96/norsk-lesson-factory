- handle: review_choose_marker_after_first_verb
  op: choose
  objective: obj-infinitive-marker-01
  bloom: understand
  prompt_md: Velg setningen med riktig infinitivform.
  derived_from:
  - section_id: after-modal-verbs
  stem_md: En deltaker forteller om planen sin for kvelden.
  options:
  - id: missing-marker
    text: Hun prøver lese på norsk.
    correct: false
    why: The non-modal verb prøver needs å before lese.
  - id: extra-marker
    text: Hun vil å lese på norsk.
    correct: false
    why: The modal verb vil takes a bare infinitive, so å must not appear.
  - id: correct-marker
    text: Hun prøver å lese på norsk.
    correct: true
    why: The non-modal verb prøver takes å before the infinitive lese.
