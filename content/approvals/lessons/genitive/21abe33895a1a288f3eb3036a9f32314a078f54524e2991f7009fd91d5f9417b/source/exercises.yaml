- handle: identify_thing_and_connection
  op: choose
  objective: obj-genitive-01
  bloom: understand
  prompt_md: 'Choose the interpretation that fits all four labels.'
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: '«På denne etiketten står det: Noras bøker.»'
    - speaker: Emil
      text_md: '«Her står det: nøkkelen til leiligheten.»'
    - speaker: Nora
      text_md: '«Denne etiketten lyder: Noras bror.»'
    - speaker: Emil
      text_md: '«Jeg fant også etiketten: telefonen til Emil.»'
  options:
  - id: reversed-roles
    text: 'Noras bøker: thing = Nora; connection = bøker. nøkkelen til leiligheten: thing = leiligheten;
      connection = nøkkelen. Noras bror: thing = Nora; connection = bror. telefonen til Emil: thing =
      Emil; connection = telefonen.'
    correct: false
    why: This reverses the identified thing and its connection in every phrase.
  - id: mixed-roles
    text: 'Noras bøker: thing = bøker; connection = Nora. nøkkelen til leiligheten: thing = leiligheten;
      connection = nøkkelen. Noras bror: thing = bror; connection = Nora. telefonen til Emil: thing =
      telefonen; connection = Emil.'
    correct: false
    why: It handles the s-phrases correctly but reverses the roles in the til-phrase.
  - id: consistent-roles
    text: 'Noras bøker: thing = bøker; connection = Nora. nøkkelen til leiligheten: thing = nøkkelen;
      connection = leiligheten. Noras bror: thing = bror; connection = Nora. telefonen til Emil: thing
      = telefonen; connection = Emil.'
    correct: true
    why: Each interpretation keeps the identified thing apart from the person or thing connected to it.
  derived_from:
  - section_id: sec-first-notice-who-or-what-is-connected-to-whom
- handle: build_s_pattern
  op: choose
  objective: obj-genitive-01
  bloom: apply
  prompt_md: 'Choose the label for the moving box. Put the owner first.'
  stem_md: 'Owner: Nora. Contents: books.'
  options:
  - id: definite-head
    text: Noras bøkene
    correct: false
    why: This wrongly keeps the definite ending on the noun after the s-form.
  - id: english-apostrophe
    text: Nora's bøker
    correct: false
    why: This imports the English apostrophe instead of attaching Norwegian s directly.
  - id: owner-s-form
    text: Noras bøker
    correct: true
    why: The owner-first pattern attaches s directly to the owner, and the contents stay in their plain
      form.
  derived_from:
  - section_id: sec-the-s-pattern
- handle: repair_s_pattern_errors
  op: find_fix
  objective: obj-genitive-01
  bloom: analyze
  prompt_md: 'Choose the word that needs to change.'
  tokens:
  - token_id: repair-owner
    text: Nora’s
  - token_id: repair-thing
    text: bok.
  error_token_id: repair-owner
  feedback: 'Norwegian attaches s without an apostrophe: Noras bok.'
  derived_from:
  - section_id: sec-the-s-pattern
- handle: build_til_pattern
  op: choose
  objective: obj-genitive-01
  bloom: apply
  prompt_md: 'Choose the label where the item comes first.'
  stem_md: 'The bicycle belongs to Emil.'
  options:
  - id: indefinite-object
    text: sykkel til Emil
    correct: false
    why: This leaves the identified bicycle indefinite and can suggest a bicycle intended for Emil.
  - id: definite-thing-til
    text: sykkelen til Emil
    correct: true
    why: The thing-first pattern uses the definite form of the identified thing before til, with the same
      person after it.
  - id: reversed-order
    text: Emil til sykkelen
    correct: false
    why: This puts the person where the identified thing must stand.
  derived_from:
  - section_id: sec-the-til-pattern
- handle: contrast_noun_form_by_pattern
  op: recall_fill
  objective: obj-genitive-01
  bloom: apply
  prompt_md: 'Complete the expression using both forms.'
  explanation_md: "I eierformen står tingen i ubestemt form. I «til»-formen står tingen i bestemt form foran «til»."
  audio_target: Emils sykkel og sykkelen til Emil.
  segments:
  - text_md: 'Emils '
  - blank_id: s-thing-form
    options:
    - sykkel
    - sykkelen
    answer_index: 0
  - text_md: ' og '
  - blank_id: til-thing-form
    options:
    - sykkel
    - sykkelen
    answer_index: 1
  - text_md: ' til Emil.'
  derived_from:
  - section_id: sec-the-til-pattern
