- handle: review_discriminate_s_and_til
  op: choose
  objective: obj-genitive-01
  bloom: analyze
  prompt_md: Nora wants to name the teacher's office. Choose the reply that gives it first with the owner-first
    pattern and then with the thing-first pattern.
  options:
  - id: til-twice
    text: Kontoret til læreren er kontoret til læreren.
    correct: false
    why: This repeats the thing-first pattern and never uses the owner-first pattern.
  - id: both-patterns
    text: Lærerens kontor er kontoret til læreren.
    correct: true
    why: The first phrase uses the owner-first pattern, and the second uses the thing-first pattern for
      the same relationship.
  - id: definite-after-s
    text: Lærerens kontoret er kontor til læreren.
    correct: false
    why: The owner-first phrase wrongly keeps the definite form, and the thing-first phrase wrongly drops
      it.
  derived_from:
  - section_id: sec-retrieval-and-review
