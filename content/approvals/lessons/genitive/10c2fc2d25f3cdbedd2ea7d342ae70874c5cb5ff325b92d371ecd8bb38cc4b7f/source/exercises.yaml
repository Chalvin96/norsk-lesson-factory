- handle: diagnose_pattern_mistake
  op: find_fix
  objective: obj-genitive-01
  bloom: analyze
  prompt_md: The label «bok til Nora» must name the book that belongs to Nora, using the thing-first pattern.
    Select the token that must change.
  tokens:
  - token_id: diagnose-thing
    text: bok
  - token_id: diagnose-til
    text: til
  - token_id: diagnose-owner
    text: Nora.
  error_token_id: diagnose-thing
  feedback: 'For this ownership reading, use the definite identified thing before til: boka til Nora.'
  derived_from:
  - section_id: sec-common-mistakes-to-avoid
- handle: transfer_patterns_to_community_center
  op: write
  objective: obj-genitive-01
  bloom: apply
  prompt_md: Skriv en norsk melding på 35–55 ord til kveldsvaktene. Nøkkelen til ungdomsgruppa ligger
    på skrivebordet, navnet på bygget er Samfunnshuset, og veska til lederen ligger i rom 2. Oppgi hvor
    disse tingene og opplysningene hører til. Bruk både s-mønsteret og til-mønsteret.
  response_language: 'no'
  judge_prompt: Evaluate the response only against criteria community-audience-purpose, community-facts,
    community-pattern-range, and community-word-bound. Report a verdict for every criterion id.
  criteria:
  - id: community-audience-purpose
    instruction: The response is a message to evening staff that helps them identify the supplied objects
      and information.
  - id: community-facts
    instruction: The message accurately includes the youth group's key on the desk, the building's name
      Samfunnshuset, and the manager's bag in room 2.
  - id: community-pattern-range
    instruction: The message expresses the connections using at least one s-pattern form and at least
      one til-pattern form.
  - id: community-word-bound
    instruction: The message contains 35–55 words.
  derived_from:
  - section_id: sec-cumulative-transfer-at-a-community-center
- handle: final_retrieval_s_and_til
  op: write
  objective: obj-genitive-01
  bloom: apply
  prompt_md: 'Write a 25–45-word Norwegian message to Emil. Tell him where his book is and say that the
    house''s balcony is closed. Express each connection twice: once with the owner or connection first
    and once with the thing first.'
  response_language: 'no'
  judge_prompt: Evaluate the response only against criteria final-message-purpose, final-book-pair, final-balcony-pair,
    and final-word-bound. Report a verdict for every criterion id.
  criteria:
  - id: final-message-purpose
    instruction: The response is a Norwegian message to Emil that states where Emil's book is and that
      the house's balcony is closed.
  - id: final-book-pair
    instruction: The response expresses the Emil-and-book connection both as an s-pattern and as a definite-thing-plus-til
      pattern.
  - id: final-balcony-pair
    instruction: The response expresses the house-and-balcony connection both as an s-pattern and as a
      definite-thing-plus-til pattern.
  - id: final-word-bound
    instruction: The message contains 25–45 words.
  derived_from:
  - section_id: sec-retrieval-and-review
- handle: review_identify_connection_roles
  op: choose
  objective: obj-genitive-01
  bloom: understand
  prompt_md: Choose the interpretation that matches the label on the desk.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Mina
      text_md: «Hva står det på etiketten?»
    - speaker: Jonas
      text_md: '«Det står: telefonen til Mari.»'
  options:
  - id: reading-two
    text: 'Identified thing: Mari. Connection: telefonen.'
    correct: false
    why: This reverses the two roles.
  - id: reading-three
    text: The phrase lists a phone and Mari without connecting them.
    correct: false
    why: Til explicitly marks the relationship between the two nouns.
  - id: reading-one
    text: 'Identified thing: telefonen. Connection: Mari.'
    correct: true
    why: The phrase begins with the identified thing and places its connection after til.
  derived_from:
  - section_id: sec-retrieval-and-review
