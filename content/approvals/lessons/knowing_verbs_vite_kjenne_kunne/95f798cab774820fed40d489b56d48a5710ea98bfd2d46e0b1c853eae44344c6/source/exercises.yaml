- handle: checkpoint_familiarity_or_identity
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: 'Arne har pekt ut Mari for Lea på et personalbilde, men Lea og Mari har aldri snakket sammen. Skriv to separate norske setninger til en kollega: si hva Lea vet om Mari, og om de kjenner hverandre personlig.'
  derived_from:
  - section_id: kjenne-being-familiar-with-someone-or-something
  response_language: 'no'
  min_words: 8
  max_words: 25
  judge_prompt: Vurder om første setning uttrykker en sann opplysning om hvem Mari er eller hvilken rolle hun har, om den andre uttrykker manglende personlig kjennskap, og om svaret består av to separate setninger. Godta naturlige bokmålsformuleringer uten å kreve bestemte ordvalg.
  criteria:
  - id: identity-meaning
    instruction: States a true identity fact about Mari that Lea knows from the context, such as Mari's role or workplace; accept natural phrasing without requiring the exact words «vet hvem».
  - id: familiarity-meaning
    instruction: Makes clear that Lea and Mari are not personally acquainted; accept natural phrasing such as «Lea kjenner ikke Mari» or «de har aldri møttes».
  - id: separate-sentences
    instruction: Uttrykker identitetsfaktaet og den personlige kjennskapen i nøyaktig to setninger.
  - id: target-forms-observation
    instruction: Distinguishes factual knowledge of Mari's identity from personal acquaintance, using a natural valid Norwegian expression for each.
