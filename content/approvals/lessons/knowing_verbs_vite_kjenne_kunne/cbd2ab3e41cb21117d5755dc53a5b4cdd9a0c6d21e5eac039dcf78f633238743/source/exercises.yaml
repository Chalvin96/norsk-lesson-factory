- handle: contextual_practice_lea_first_day
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: Write a 35–60-word Norwegian message to Ingrid explaining what Lea learned and can now do.
    Include where the cups belong using vite, her familiarity with Mari and Arne using kjenne, the fact
    that Mari is on the work schedule, and Lea's ability to make tea with the machine using kunne.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Ingrid
      text_md: «Hvordan gikk dagen på senteret?»
    - speaker: Lea
      text_md: «Arne viste meg hvor koppene skal stå, og jeg jobbet og snakket med Mari og Arne.»
  derived_from:
  - section_id: back-at-the-community-centre
  response_language: 'no'
  min_words: 35
  max_words: 60
  judge_prompt: Evaluate cup-information, organiser-familiarity, schedule-information, tea-ability and
    message-purpose. Observe whether the target verb distinctions are used for the relevant meanings.
  criteria:
  - id: cup-information
    instruction: Communicates that Lea knows where the cups belong.
  - id: organiser-familiarity
    instruction: Communicates that Lea is now somewhat familiar with Mari and Arne.
  - id: schedule-information
    instruction: Communicates the fact that Mari is on the work schedule.
  - id: tea-ability
    instruction: Communicates that Lea can make tea with the machine.
  - id: message-purpose
    instruction: Produces a coherent 35–60-word message to Ingrid about Lea's day.
  - id: verb-choice-observation
    instruction: Uses vite for facts, kjenne for familiarity and kunne for practical ability. This distinction
      is required.
- handle: further_practice_visiting_another_town
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: Write a 25–55-word Norwegian reply to the travel group. Explain who has the hotel location
    fact, who is familiar with Bergen, and who has the relevant driving ability. Use vite, kjenne and
    kunne correctly.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Eva
      text_md: «Hotellet ligger i Strandgaten 8. Jeg har vært i Bergen mange ganger, men jeg har ikke
        førerkort.»
    - speaker: Jon
      text_md: «Jeg vet ikke hvor hotellet ligger. Jeg har aldri vært i Bergen, men jeg har kjørt trygt
        i tett bytrafikk i ti år.»
  derived_from:
  - section_id: further-practice-in-new-situations
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Evaluate hotel-fact, bergen-familiarity, driving-ability, correct use of vite, kjenne
    and kunne, and group-reply. Require the reply to use vite for the hotel fact, kjenne for familiarity
    with Bergen, and kunne for driving ability, while accurately distinguishing the three meanings.
  criteria:
  - id: hotel-fact
    instruction: States that Eva knows the hotel's address or location using vite.
  - id: bergen-familiarity
    instruction: States that Eva is familiar with Bergen using kjenne and does not attribute that familiarity
      to Jon.
  - id: driving-ability
    instruction: States that Jon can drive in heavy city traffic using kunne and does not attribute that
      ability to Eva.
  - id: group-reply
    instruction: Produces a coherent 25–55-word reply for the travel group.
  - id: target-verbs-observation
    instruction: Requires that the location fact uses vite, city familiarity uses kjenne and driving ability
      uses kunne.
- handle: further_practice_planning_a_concert
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: Write a 30–60-word Norwegian exchange between Per and Liv. Per must ask Liv when the concert
    starts using «vite», whether she knows Ada personally using «kjenne», and whether she can operate
    the sound equipment using «kunne»; Liv must answer all three. The concert starts at 19.30; Liv and
    Ada have worked together before, and Liv has used the sound equipment at three concerts.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Per
      text_md: «Per vil planlegge konsertkvelden sammen med Liv og trenger informasjon om tidspunkt, Ada
        og lydutstyret.»
    - speaker: Liv
      text_md: «Liv er klar til å svare på spørsmålene og fortelle om erfaringene sine.»
  derived_from:
  - section_id: further-practice-in-new-situations
  response_language: 'no'
  min_words: 30
  max_words: 60
  judge_prompt: Evaluate time-exchange, singer-exchange, equipment-exchange and exchange-form. Require
    the target verbs for factual knowledge, personal acquaintance and practical ability.
  criteria:
  - id: time-exchange
    instruction: Includes Per's question about the starting time and Liv's answer that it is 19.30.
  - id: singer-exchange
    instruction: Includes a question about personal acquaintance with Ada and an affirmative answer supported
      by their earlier work together.
  - id: equipment-exchange
    instruction: Includes a question about operating the sound equipment and an affirmative answer supported
      by Liv's prior experience.
  - id: exchange-form
    instruction: Produces a coherent 30–60-word exchange between Per and Liv.
  - id: verb-selection-observation
    instruction: Uses vite for the time question, kjenne for acquaintance and kunne for equipment ability.
