- handle: checkpoint_familiarity_or_identity
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: 'Lea har sett navnet til Mari på arbeidsplanen, men de har aldri snakket sammen. Skriv to
    separate norske setninger til en kollega: si at Lea vet hvem Mari er, og si at Lea ikke kjenner henne
    personlig. Bruk «vet hvem» i den første setningen og «kjenner ikke» i den andre.'
  derived_from:
  - section_id: kjenne-being-familiar-with-someone-or-something
  response_language: 'no'
  min_words: 8
  max_words: 25
  judge_prompt: Vurder identitetsbetydning, betydningen av personlig kjennskap og om svaret består av
    to separate setninger. Naturlige bokmålsvarianter er godkjent.
  criteria:
  - id: identity-meaning
    instruction: Sier at Lea vet hvem Mari er, ved å bruke «vet hvem».
  - id: familiarity-meaning
    instruction: Sier at Lea ikke kjenner Mari personlig, ved å bruke «kjenner ikke».
  - id: separate-sentences
    instruction: Uttrykker identitetsfaktaet og den personlige kjennskapen i nøyaktig to setninger.
  - id: target-forms-observation
    instruction: Bruker «vet hvem» for identitet og «kjenner ikke» for manglende personlig kjennskap.
- handle: checkpoint_information_or_ability
  op: write
  objective: obj-knowing-verbs-vite-kjenne-kunne-01
  bloom: apply
  prompt_md: 'Lea has read and understood the sound-system instructions, but she has never operated the
    system. Write exactly two Norwegian sentences for Arne: state what Lea knows and state that the facts
    do not establish whether she can operate the system. Use the forms «vet hvordan» and «kan».'
  derived_from:
  - section_id: kunne-having-a-learned-skill-or-ability
  response_language: 'no'
  min_words: 10
  max_words: 40
  judge_prompt: Evaluate procedure-knowledge, ability-status and two-sentence form. Accept natural Bokmål
    variants, but require both target meanings, the forms vet hvordan and kan, and exactly two sentences.
  criteria:
  - id: procedure-knowledge
    instruction: States that Lea knows how the sound system works, using vet hvordan.
  - id: ability-status
    instruction: States that the available facts do not establish whether Lea can operate it, using kan.
  - id: sentence-count
    instruction: Uses exactly two Norwegian sentences.
  - id: vite-kunne-observation
    instruction: Requires factual procedure knowledge to be expressed with vet hvordan and practical ability
      with kan.
