  explanation_md: Et indirekte ja/nei-spørsmål innledes med «om» og har vanlig
    subjekt–verb-ordstilling. Den som stilte det opprinnelige spørsmålet, står
    fortsatt som subjekt for «spurte».
  derived_from:
  - section_id: reporting-yes-or-no-questions-with-om
  options:
  - id: report-1
    text: Sara spurte, «Bodde Eva der?»
    correct: false
    why: This remains a direct quotation rather than an indirect report.
  - id: report-2
    text: Sara spurte om bodde Eva der.
    correct: false
    why: This combines om with direct-question inversion.
  - id: report-3
    text: Sara spurte om Eva bodde der.
    correct: true
    why: This keeps Sara as the asker and uses the indirect-question marker with
      subordinate order.
  stem_md: Lars forteller senere hva Sara spurte om.
- handle: review_question-word-order
  op: choose
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: Velg det naturlige paret av gjengivelser av Amirs spørsmål.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Amir
      text_md: «Hva forsvant?»
    - speaker: Amir
      text_md: «Hva mistet Eva?»
  explanation_md: Når «hva» er subjekt, bruker vi «som». Når «hva» er objekt,
    kommer subjektet rett etter spørreordet. Amir står fortsatt som subjekt for
    «spurte».
  derived_from:
  - section_id: reporting-questions-with-a-question-word
  options:
  - id: report-3
    text: Amir spurte hva forsvant, og hva Eva mistet.
    correct: false
    why: The first clause lacks som after subject hva.
  - id: report-1
    text: Amir spurte hva som forsvant, og hva Eva mistet.
    correct: true
    why: The first hva is the subject, while Eva is the subject of the second
      clause.
  - id: report-2
    text: Amir spurte hva som forsvant, og hva som Eva mistet.
    correct: false
    why: The second som wrongly treats hva as the subject.
  stem_md: Lars gjengir senere begge spørsmålene.
- handle: review_command-recipient-action
  op: choose
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: Ali forteller Mia hva sykepleieren ba ham om. Velg gjengivelsen av
    oppfordringen.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Sykepleieren
      text_md: «Ali, ikke spis før undersøkelsen.»
    - speaker: Ali
      text_md: «Jeg skal vente med å spise.»
  explanation_md: Sykepleieren henvender seg til Ali, så han bruker «meg» etter
    «ba». «Om ikke å» innleder den negative handlingen.
  derived_from:
  - section_id: reporting-commands-and-requests
  options:
  - id: report-1
    text: Sykepleieren ba henne om ikke å spise før undersøkelsen.
    correct: false
    why: This assigns the requested action to a female referent rather than to
      Ali.
  - id: report-2
    text: Sykepleieren ba meg om å spise før undersøkelsen.
    correct: false
    why: This reverses the negative request and reports that Ali was asked to
      eat.
  - id: report-3
    text: Sykepleieren ba meg om ikke å spise før undersøkelsen.
    correct: true
    why: Ali is the person the nurse addressed, so he reports the request about
      himself with meg.
- handle: review_report-time-viewpoint
  op: choose
  objective: obj-indirect-speech-01
  bloom: analyze
  prompt_md: Velg rapporten som stemmer med faktaene.
  explanation_md: Den generelle sannheten kan stå i presens, mens det tidligere
    avsluttede forsøket bruker pluskvamperfektum.
  derived_from:
  - section_id: choosing-tense-in-a-report
  options:
  - id: report-1
    text: Læreren sa at vann fryser ved null grader, og at forsøket fortsatt
      pågikk.
    correct: false
    why: Forsøket var avsluttet før læreren snakket.
  - id: report-2
    text: Læreren sa at vann fryser ved null grader, og at forsøket allerede
      hadde sluttet.
    correct: true
    why: Formene bevarer både den aktuelle sannheten og den tidligere avsluttede
      hendelsen.
  - id: report-3
    text: Læreren sa at vann fryser ved null grader, og at forsøket allerede
      slutter.
    correct: false
    why: Forsøket blir feilaktig framstilt som pågående.
  stem_md: Vann fryser fortsatt ved null grader. Forsøket var avsluttet før
    læreren snakket i går.
- handle: review_perspective-shift
  op: choose
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: Velg Noras naturlige gjengivelse av Emils melding.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Emil
      text_md: «Jeg møter deg her i morgen.»
  explanation_md: Noras senere gjengivelse endrer taler, lytter, sted og relativ
    dag.
  derived_from:
  - section_id: shifting-pronouns-time-and-place
  options:
  - id: report-2
    text: Nora sa at jeg skulle møte deg her i morgen.
    correct: false
    why: Dette bevarer den opprinnelige talerens ord selv om Nora gjengir
      meldingen.
  - id: report-3
    text: Emil sa at han skulle møte Lea der dagen etter.
    correct: false
    why: Dette endrer den opprinnelige lytteren fra Nora til Lea.
  - id: report-1
    text: Emil sa at han skulle møte meg der dagen etter.
    correct: true
    why: Nora gjengir Emils melding til seg selv mens hun forteller Lea om den.
      Derfor viser «meg» til Nora, «der» til kaféen og «dagen etter» til tirsdag.
  stem_md: Mandag sender Emil meldingen til Nora fra kafeen. Onsdag forteller
    Nora Lea om meldingen hjemme.
