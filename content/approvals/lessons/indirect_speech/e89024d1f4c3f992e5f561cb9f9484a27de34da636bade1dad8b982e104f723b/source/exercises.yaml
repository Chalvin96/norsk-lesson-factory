- handle: report-time-viewpoint
  op: choose
  objective: obj-indirect-speech-01
  bloom: analyze
  prompt_md: Velg gjengivelsen som stemmer med tidslinjen.
  stem_md: Kontoret stenger fortsatt klokka fem. Liv var syk i går, men er frisk
    nå. Amir snakket med kundene før han ga oppdateringen i går.
  explanation_md: Tidsformen i indirekte tale følger tidspunktet vi forteller
    fra. En generell sannhet kan stå i presens, en tidligere tilstand i
    preteritum, og noe som skjedde før en fortelling i fortid kan stå i
    pluskvamperfektum.
  derived_from:
  - section_id: choosing-tense-in-a-report
  options:
  - id: automatic-backshift
    text: Amir sa at kontoret stenger klokka seks. Liv sa at hun var syk. Amir
      sa at han allerede hadde snakket med kundene.
    correct: false
    why: Kontoret stenger fortsatt klokka fem, ikke seks.
  - id: viewpoint-preserved
    text: Amir sa at kontoret stenger klokka fem. Liv sa at hun var syk. Amir sa
      at han allerede hadde snakket med kundene.
    correct: true
    why: The tenses distinguish the current fact, the earlier illness, and the
      still earlier client conversation.
  - id: all-current
    text: Amir sa at kontoret stenger klokka fem. Liv sa at hun er syk. Amir sa
      at han allerede har snakket med kundene.
    correct: false
    why: This incorrectly presents the finished illness and earlier client
      conversation as current.
