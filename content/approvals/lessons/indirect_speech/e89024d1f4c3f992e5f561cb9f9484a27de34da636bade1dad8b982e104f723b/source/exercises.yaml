- handle: final-indirect-speech-retrieval
  op: write
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: "Du er Mina. Skriv Erik en melding og gjengi det museumsverten fortalte deg i går. Ta med opplysningen om åpningstiden, spørsmålene om billetten, forsinkelsen og billettene, og oppfordringen om å vente utenfor."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Museumsvert
      text_md: «Utstillingen åpner klokka ti.»
    - speaker: Museumsvert
      text_md: «Har du bestilt billett?»
    - speaker: Museumsvert
      text_md: «Hvorfor kom dere så sent til museet?»
    - speaker: Museumsvert
      text_md: «Hvem tok med billettene?»
    - speaker: Museumsvert
      text_md: «Vent utenfor.»
  explanation_md: En god gjengivelse tar med alle fem beskjedene fra Minas
    senere ståsted og bruker passende innledningsord, ordstilling og en naturlig
    måte å gjengi en oppfordring på.
  derived_from:
  - section_id: short-retrieval-review
  response_language: "no"
  min_words: 45
  max_words: 75
  judge_prompt: "Vurder alle kriteriene som krav for å bestå: message-to-erik, reports-all-five, coherent-roles-and-time, markers-and-order-observation og request-form-observation. Logg én vurdering per kriterie-id. For å bestå må svaret være en sammenhengende melding som inneholder alle fem budskapene, bruker indirekte spørsmålsform med riktige spørreord og underordnet ordstilling, og gjengir instruksjonen naturlig. Godta både «om» og «hvorvidt» i indirekte ja/nei-spørsmål, og godta både en naturlig anmodning og en gjengitt instruksjon som «verten sa at jeg skulle vente utenfor». Forankring: PASS: «Hei Erik! Museumsverten sa at utstillingen åpner klokka ti. Hun spurte om jeg hadde bestilt billett, og hvorfor vi kom så sent til museet. Hun spurte også hvem som hadde tatt med billettene. Til slutt ba hun meg om å vente utenfor. Nå vet du hva hun tok opp i går, Erik.» FAIL reports-all-five: En melding som utelater instruksjonen eller ett av spørsmålene. FAIL markers-and-order-observation: En melding med feil indirekte spørsmålsform, manglende underordnet ordstilling eller feil bruk av at, om/hvorvidt, spørreord eller som. FAIL request-form-observation: En melding som ikke gjengir instruksjonen på en naturlig måte."
  criteria:
  - id: message-to-erik
    instruction: Is a message to Erik whose purpose is to relay the museum host's
      messages.
  - id: reports-all-five
    instruction: Communicates the statement, all three questions, and the
      instruction.
  - id: coherent-roles-and-time
    instruction: Keeps Mina, Erik, the museum host, and the yesterday timeline
      understandable.
  - id: markers-and-order-observation
    instruction: Uses appropriate introductory words (including «om» or «hvorvidt»
      for a yes-or-no question), question words, «som» where needed, and subordinate
      word order accurately in the indirect report.
  - id: request-form-observation
    instruction: Reports the instruction naturally, either as a request or as a
      reported instruction such as «verten sa at jeg skulle vente utenfor».
- handle: review_statement-word-order
  op: choose
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: Velg gjengivelsen med vanlig ordstilling i leddsetningen.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Oda
      text_md: «Jeg kommer kanskje ikke i dag.»
  explanation_md: I nøytral leddsetningsordstilling står «kanskje» og «ikke»
    foran det finitte verbet. Etter uttrykksverb som «sa» brukes også
    hovedsetningsordstilling av noen, men her øver vi på nøytral
    leddsetningsordstilling.
  derived_from:
  - section_id: reporting-statements-with-at
  options:
  - id: report-1
    text: Per sa at Oda kom kanskje ikke den dagen.
    correct: false
    why: Embedded main-clause order can occur after some assertive speech verbs,
      but it is not the neutral subordinate order requested here.
  - id: report-2
    text: Per sa at Oda kanskje ikke kom den dagen.
    correct: true
    why: The sentence adverbs precede the finite verb in the subordinate clause.
  - id: report-3
    text: Per sa at kom Oda kanskje ikke den dagen.
    correct: false
    why: This incorrectly uses verb–subject inversion.
  stem_md: Per forteller senere hva Oda sa.
