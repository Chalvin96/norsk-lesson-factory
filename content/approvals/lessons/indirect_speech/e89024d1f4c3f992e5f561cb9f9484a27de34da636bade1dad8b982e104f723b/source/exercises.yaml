- handle: anchor-message-map
  op: categorize
  objective: obj-indirect-speech-01
  bloom: analyze
  prompt_md: Sorter hver gjengivelse etter hvem som snakker og hvilken type
    ytring som gjengis. Marker også om mottakeren er nevnt. I disse setningene
    viser «hun» til Liv, «han» til Amir og «meg» til Jonas.
  explanation_md: Utsagn innledes med «at», ja/nei-spørsmål med «om», og
    indirekte spørreord beholdes. En indirekte oppfordring kan bruke «ba noen om
    å». Mottakeren regnes bare som nevnt når det står hvem som skal utføre
    handlingen.
  derived_from:
  - section_id: a-missed-meeting
  buckets:
  - bucket_id: liv-statement-no-recipient
    label: Liv — utsagn (ingen mottaker nevnt)
  - bucket_id: liv-question-no-recipient
    label: Liv — spørsmål (ingen mottaker nevnt)
  - bucket_id: liv-request-jonas
    label: Liv — oppfordring med navngitt mottaker (Jonas)
  - bucket_id: liv-request-no-recipient
    label: Liv — oppfordring uten navngitt mottaker
  - bucket_id: amir-statement-no-recipient
    label: Amir — utsagn (ingen mottaker nevnt)
  - bucket_id: amir-question-no-recipient
    label: Amir — spørsmål (ingen mottaker nevnt)
  items:
  - item_id: item-1
    text: Hun sa at toget til Bergen var innstilt.
    bucket_id: liv-statement-no-recipient
  - item_id: item-2
    text: Hun spurte om vi kunne flytte presentasjonen.
    bucket_id: liv-question-no-recipient
  - item_id: item-3
    text: Hun ba meg om å sende kundene en melding.
    bucket_id: liv-request-jonas
  - item_id: item-4
    text: Han sa at han allerede hadde snakket med dem.
    bucket_id: amir-statement-no-recipient
  - item_id: item-5
    text: Han spurte når Liv kom tilbake til kontoret.
    bucket_id: amir-question-no-recipient
  - item_id: item-6
    text: Hun ba om å få tilsendt referatet.
    bucket_id: liv-request-no-recipient
