- handle: review_question-word-order
  op: choose
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: Choose the natural pair of reports of Amir's questions.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Amir
      text_md: «Hva forsvant?»
    - speaker: Amir
      text_md: «Hva mistet Eva?»
    - speaker: Context
      text_md: Lars later reports both questions.
  explanation_md: Subject hva takes som; object hva is followed directly by the clause subject, and the
    original asker Amir stays the subject of spurte.
  derived_from:
  - section_id: reporting-questions-with-a-question-word
  options:
  - id: report-3
    text: Amir spurte hva forsvant, og hva Eva mistet.
    correct: false
    why: The first clause lacks som after subject hva.
  - id: report-1
    text: Amir spurte hva som forsvant, og hva Eva mistet.
    correct: true
    why: The first hva is the subject, while Eva is the subject of the second clause.
  - id: report-2
    text: Amir spurte hva som forsvant, og hva som Eva mistet.
    correct: false
    why: The second som wrongly treats hva as the subject.
