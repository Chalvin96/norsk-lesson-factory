- handle: report-time-viewpoint
  op: choose
  objective: obj-indirect-speech-01
  bloom: analyze
  prompt_md: Choose the three reports that preserve the timeline.
  stem_md: 'Facts: The office still closes at five. Liv was ill yesterday but is well now. Amir spoke
    to the clients before he gave yesterday''s update.'
  explanation_md: Norwegian tense follows the reporting viewpoint. A current general fact can remain present,
    an earlier state can be past, and an event completed before a past report can use the past perfect.
  derived_from:
  - section_id: choosing-tense-in-a-report
  options:
  - id: automatic-backshift
    text: Amir sa at kontoret stengte klokka fem. Liv sa at hun var syk. Amir sa at han allerede snakket
      med kundene.
    correct: false
    why: This over-backshifts the current closing fact and fails to place the client conversation before
      the update.
  - id: viewpoint-preserved
    text: Amir sa at kontoret stenger klokka fem. Liv sa at hun var syk. Amir sa at han allerede hadde
      snakket med kundene.
    correct: true
    why: The tenses distinguish the current fact, the earlier illness, and the still earlier client conversation.
  - id: all-current
    text: Amir sa at kontoret stenger klokka fem. Liv sa at hun er syk. Amir sa at han allerede har snakket
      med kundene.
    correct: false
    why: This incorrectly presents the finished illness and earlier client conversation as current.
