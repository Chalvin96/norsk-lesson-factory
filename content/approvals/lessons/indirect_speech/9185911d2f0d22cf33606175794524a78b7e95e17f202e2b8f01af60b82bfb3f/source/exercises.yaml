- handle: office-message-relay
  op: write
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: 'You are Sara. Write Liv a 35–60-word message that relays every point in Jonas''s notes:
    Liv''s train was cancelled; Liv was working from home; Liv had asked Jonas to message the clients;
    and Amir had asked when Liv was returning to the office. Report each point, including Amir''s question.
    Use natural Norwegian indirect speech with accurate reporting markers, subordinate-clause word order,
    tense, and pronoun forms.'
  explanation_md: A clear relay preserves all four points and adjusts references to Sara's direct conversation
    with Liv.
  derived_from:
  - section_id: back-at-the-office
  response_language: 'no'
  min_words: 35
  max_words: 60
  judge_prompt: 'Evaluate only criteria reports-all-messages, message-to-liv, word-bound, viewpoint-coherence,
    and indirect-forms-observation as gating criteria. Log one verdict per criterion id. Anchors: PASS:
    «Hei Liv! Jonas sa at toget ditt var innstilt, og at du jobbet hjemmefra. Han fortalte også at du
    hadde bedt ham sende kundene en melding. Til slutt sa han at Amir hadde spurt når du kom tilbake til
    kontoret.» FAIL reports-all-messages: «Hei Liv! Jonas sa at toget ditt var innstilt.» FAIL indirect-forms-observation:
    A message that relays all four facts but contains incorrect reporting markers, subordinate word order,
    tense, or pronoun forms.'
  criteria:
  - id: reports-all-messages
    instruction: Relays the cancelled train, work from home, client message, and Amir's return-time question.
  - id: message-to-liv
    instruction: Is a message addressed to Liv for the purpose of relaying Jonas's account.
  - id: word-bound
    instruction: Contains 35–60 words.
  - id: viewpoint-coherence
    instruction: Keeps Liv, Jonas, Amir, and their roles identifiable from Sara's viewpoint.
  - id: indirect-forms-observation
    instruction: Accurately uses reporting markers, subordinate word order, tense, and pronoun forms.
