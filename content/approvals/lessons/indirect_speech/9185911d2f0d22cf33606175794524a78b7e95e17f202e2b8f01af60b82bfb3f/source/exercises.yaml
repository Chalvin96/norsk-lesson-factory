- handle: anchor-message-map
  op: categorize
  objective: obj-indirect-speech-01
  bloom: analyze
  prompt_md: Classify each report by speaker and message function, and separately record whether the report
    states a recipient. Assign a recipient-bearing bucket only when the report states a recipient; do
    not infer one that is absent. In these reports, hun refers to Liv, han refers to Amir, and meg refers
    to Jonas.
  explanation_md: Statements use at, yes-or-no questions use om, information questions keep their question
    word, and requests can use be noen om å. The recipient axis separates a request that states its recipient,
    such as ba meg naming Jonas, from one that states none, such as ba om å få tilsendt referatet; a report
    with no stated recipient never enters a recipient bucket.
  derived_from:
  - section_id: a-missed-meeting
  buckets:
  - bucket_id: liv-statement-no-recipient
    label: Liv — statement (no recipient stated)
  - bucket_id: liv-question-no-recipient
    label: Liv — question (no recipient stated)
  - bucket_id: liv-request-jonas
    label: Liv — request with a stated recipient (Jonas)
  - bucket_id: liv-request-no-recipient
    label: Liv — request with no stated recipient
  - bucket_id: amir-statement-no-recipient
    label: Amir — statement (no recipient stated)
  - bucket_id: amir-question-no-recipient
    label: Amir — question (no recipient stated)
  items:
  - item_id: item-1
    text: Hun sa at toget til Bergen var innstilt.
    bucket_id: liv-statement-no-recipient
  - item_id: item-2
    text: Hun spurte om vi kunne flytte presentasjonen.
    bucket_id: liv-question-no-recipient
  - item_id: item-3
    text: Hun ba meg om å sende kundene en melding.
    bucket_id: liv-request-jonas
  - item_id: item-4
    text: Han sa at han allerede hadde snakket med dem.
    bucket_id: amir-statement-no-recipient
  - item_id: item-5
    text: Han spurte når Liv kom tilbake til kontoret.
    bucket_id: amir-question-no-recipient
  - item_id: item-6
    text: Hun ba om å få tilsendt referatet.
    bucket_id: liv-request-no-recipient
