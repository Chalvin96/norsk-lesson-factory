- handle: final-indirect-speech-retrieval
  op: write
  objective: obj-indirect-speech-01
  bloom: apply
  prompt_md: 'You are Mina. Write Erik a 45–75-word message that relays everything the museum guide said
    yesterday. The guide''s messages were: «Utstillingen åpner klokka ti.»; «Har Erik bestilt billett?»;
    «Hvorfor kom dere sent?»; «Hvem tok med billettene?»; and the instruction to Mina, «Vent utenfor.»
    Report all five messages, including the instruction. Use at before the reported statement, om in the
    indirect yes/no question, the original question words in the indirect questions, som in the indirect
    question about who brought the tickets, and subordinate word order.'
  explanation_md: A successful relay communicates all five messages from Mina’s later viewpoint and uses
    accurate indirect-speech markers, subordinate word order, and a natural request construction.
  derived_from:
  - section_id: short-retrieval-review
  response_language: 'no'
  min_words: 45
  max_words: 75
  judge_prompt: 'Vurder alle kriteriene som krav for å bestå: message-to-erik, reports-all-five, word-bound,
    coherent-roles-and-time, markers-and-order-observation og request-form-observation. Logg én vurdering
    per kriterie-id. For å bestå må svaret være en sammenhengende melding på 45–75 ord som inneholder
    alle fem budskapene, bruker indirekte spørsmålsform med riktige spørreord og underordnet ordstilling,
    og gjengir instruksjonen som en naturlig anmodning. Forankring: PASS: «Hei Erik! Guiden sa at utstillingen
    åpner klokka ti. Hun spurte om du hadde bestilt billett, og hvorfor vi kom så sent til museet. Hun
    spurte også hvem som tok med billettene. Til slutt ba hun meg om å vente utenfor. Nå vet du hva hun
    tok opp i går, Erik.» FAIL reports-all-five: En melding som utelater instruksjonen eller ett av spørsmålene.
    FAIL markers-and-order-observation: En melding med feil indirekte spørsmålsform, manglende underordnet
    ordstilling eller feil bruk av at, om, spørreord eller som. FAIL request-form-observation: En melding
    som ikke gjengir instruksjonen med en naturlig anmodningskonstruksjon.'
  criteria:
  - id: message-to-erik
    instruction: Is a message to Erik whose purpose is to relay the guide's messages.
  - id: reports-all-five
    instruction: Communicates the statement, all three questions, and the instruction.
  - id: word-bound
    instruction: Contains 45–75 words.
  - id: coherent-roles-and-time
    instruction: Keeps Mina, Erik, the guide, and the yesterday timeline understandable.
  - id: markers-and-order-observation
    instruction: Must use at, om, question words, som, and subordinate word order accurately in the indirect
      report.
  - id: request-form-observation
    instruction: Must report the instruction with a natural request construction.
