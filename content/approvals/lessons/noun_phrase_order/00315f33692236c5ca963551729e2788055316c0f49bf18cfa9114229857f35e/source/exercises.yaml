- handle: find_the_station_luggage
  op: write
  objective: obj-noun-phrase-order-01
  bloom: apply
  prompt_md: "Du er Mina på stasjonen. Skriv fire uttrykk: Pek ut én liten koffert med «denne», si at flere tunge vesker er dine med eiendomsord først, og beskriv den røde ryggsekken dere eier sammen med «vår» til slutt. Pek så ut den samme sekken med «denne» og behold «vår» til slutt. Bruk «koffert», «veske» og «ryggsekk»."
  derived_from:
  - section_id: find-the-station-luggage
  response_language: 'no'
  judge_prompt: >-
    Check all four requested meanings and report evidence for every criterion. Treat Mina as the speaker:
    the heavy bags belong to her, so that phrase means “my heavy bags.” Require natural Bokmål
    agreement and the specified order. Require denne for the fourth demonstrative frame. Accept
    ordinary Bokmål inflection of the specified station nouns, but do not accept a cabin phrase that ignores
    the new luggage meanings.
  criteria:
  - id: demonstrative-suitcase
    instruction: Produces a phrase meaning one small suitcase using denne, a definite adjective, and a
      definite noun.
  - id: preposed-heavy-bags
    instruction: Produces a phrase for several heavy bags belonging to Mina (the speaker), with
      the possessive first, followed by an adjective and an indefinite plural noun.
  - id: postposed-shared-backpack
    instruction: Produces a phrase meaning the shared red backpack, using den + definite adjective + definite
      noun + postposed vår.
  - id: combined-shared-backpack
    instruction: Produces a phrase meaning this shared red backpack of ours, using denne, a definite adjective,
      a definite noun, and a postposed possessive.
  - id: station-transfer
    instruction: Uses the specified station luggage vocabulary and applies the requested noun-phrase frames
      to the changed situation rather than copying a cabin expression.
