- handle: notice-general-man
  op: choose
  objective: obj-generic-pronouns-01
  bloom: understand
  prompt_md: Choose the sentence that gives advice for any person in the situation.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Jeg sjekker værmeldingen før turen.»
    - speaker: Elias
      text_md: «Jeg spør en gjest om kartet.»
    - speaker: Nora
      text_md: «På fjellet bør man sjekke værmeldingen.»
  options:
  - id: nora
    text: A named person checks the weather forecast.
    correct: false
    why: This describes one specific person.
  - id: guest
    text: A particular visitor asks for a map.
    correct: false
    why: This describes one specified visitor.
  - id: generic
    text: People should check the weather forecast when hiking in the mountains.
    correct: true
    why: The sentence gives advice that applies to any person in that situation.
  explanation_md: Generic man presents advice as valid for any person in the stated situation.
  derived_from:
  - section_id: checkpoint-notice-general-man
- handle: notice-singular-agreement
  op: choose
  objective: obj-generic-pronouns-01
  bloom: understand
  prompt_md: Choose the grammatically matching sentence.
  stem_md: 'Språknotat: «Man» viser til mennesker generelt, men er grammatisk entall.'
  options:
  - id: plural
    text: Man blir ofte trøtte etter en lang tur.
    correct: false
    why: Trøtte treats man as grammatically plural because it refers broadly to people.
  - id: noun-group
    text: Folk blir ofte trøtt etter en lang tur.
    correct: false
    why: Folk is a collective noun here and normally takes plural predicative agreement.
  - id: singular
    text: Man blir ofte trøtt etter en lang tur.
    correct: true
    why: Trøtt has singular agreement with man.
  explanation_md: Broad reference does not change the singular grammar of man.
  derived_from:
  - section_id: man-for-a-general-person
- handle: choose-form-by-sentence-role
  op: recall_fill
  objective: obj-generic-pronouns-01
  bloom: apply
  prompt_md: Complete the mountain safety notice with a general pronoun in each blank.
  audio_target: På fjellet er det lurt å følge merkingen. I høyfjellet er det viktig å være forberedt
    på raske værskifter. Dårlig vær kan overraske folk på vei hjem.
  segments:
  - text_md: 'På fjellet bør '
  - blank_id: mountain-subject-man
    options:
    - man
    - meg
    answer_index: 0
  - text_md: ' følge merkingen. I høyfjellet må '
  - blank_id: mountain-subject-en
    options:
    - meg
    - en
    answer_index: 1
  - text_md: ' være forberedt på raske værskifter. Dårlig vær kan overraske '
  - blank_id: mountain-object-en
    options:
    - en
    - man
    answer_index: 0
  - text_md: ' på vei hjem.'
  explanation_md: Man and en can introduce a generic subject, but man cannot fill the object position
    in the impersonal man/en pattern.
  derived_from:
  - section_id: checkpoint-choose-form-by-sentence-role
- handle: recognize-generic-en-subject
  op: choose
  objective: obj-generic-pronouns-01
  bloom: analyze
  prompt_md: Choose the accurate analysis.
  stem_md: 'Reisehåndbok: «Når en reiser alene, må en planlegge økonomien nøye.»'
  options:
  - id: subject-then-object
    text: En is a generic subject in the first clause, but the object of planlegge in the second.
    correct: false
    why: The second clause has its own subject en; planlegge takes økonomien as its object.
  - id: generic-subject
    text: En is a generic subject in both clauses.
    correct: true
    why: Both occurrences occupy subject position and represent a general person.
  - id: article
    text: En is the indefinite article, so neither clause has an explicit subject.
    correct: false
    why: En stands directly before a verb and refers to a person, so it fills the subject role.
  explanation_md: En may be a generic subject; the subject-only restriction belongs to man, not to en.
  derived_from:
  - section_id: generic-en-as-a-subject
- handle: discriminate-man-en-full-response
  op: choose
  objective: obj-generic-pronouns-01
  bloom: analyze
  prompt_md: Choose the complete reply.
  stem_md: 'Redaktør: «Vi beskriver en generell person. Kan jeg skrive: “Sterk varme kan gjøre man svimmel”?»'
  options:
  - id: change-meaning
    text: Nei. Skriv «Sterk varme kan gjøre folk svimmel», fordi folk alltid betyr det samme som man.
    correct: false
    why: This changes the representative-person meaning to a group reading and also mismatches agreement.
  - id: correct-reply
    text: Nei. Skriv «Sterk varme kan gjøre en svimmel», fordi personen er objekt.
    correct: true
    why: The reply preserves the impersonal reference and places en in the object role.
  - id: subject-confusion
    text: Ja. «Man» kan stå i alle roller når betydningen er generell.
    correct: false
    why: This confuses broad meaning with the grammatical role restriction on man.
  explanation_md: Within the impersonal pair, man is restricted to subject position and en supplies the
    object form.
  derived_from:
  - section_id: sentence-role-man-cannot-be-an-object
- handle: choose-direct-or-detached-tone
  op: write
  objective: obj-generic-pronouns-01
  bloom: apply
  prompt_md: 'Fakta: Sjekk værmeldingen før fjellturen. Mottaker 1: turister som trenger et direkte råd;
    bruk du. Mottaker 2: kolleger som trenger en nøytral generell regel; bruk man eller generisk en. Skriv
    to meldinger på til sammen 14–34 ord.'
  response_language: 'no'
  min_words: 14
  max_words: 34
  judge_prompt: Evaluate direct-guidance, detached-rule, direct-form, detached-form, same-fact, and word-bound.
  criteria:
  - id: direct-guidance
    instruction: The first message addresses tourists as actionable, direct guidance.
  - id: detached-rule
    instruction: The second message presents the same information as a detached general rule for colleagues.
  - id: direct-form
    instruction: The first message explicitly uses the pronoun «du».
  - id: detached-form
    instruction: The second message uses man or generic en to express detached generalization.
  - id: same-fact
    instruction: Both messages communicate that the weather forecast should be checked before a mountain
      trip.
  - id: word-bound
    instruction: The combined response contains 14–34 words.
  derived_from:
  - section_id: checkpoint-choose-direct-or-detached-tone
- handle: distinguish-individual-generalization-from-group
  op: categorize
  objective: obj-generic-pronouns-01
  bloom: analyze
  prompt_md: Sort the statements by meaning.
  stem_md: 'Turistkontorets tekster: Noen beskriver hva enhver person typisk gjør. Andre rapporterer et
    mønster blant faktiske besøkende.'
  buckets:
  - bucket_id: representative-person
    label: En representativ person
  - bucket_id: observed-group
    label: En observert gruppe
  items:
  - item_id: representative-work
    text: Når man arbeider på turistkontoret, får man mange spørsmål.
    bucket_id: representative-person
  - item_id: group-weather
    text: Folk spør ofte om værmeldingen før fjellturen.
    bucket_id: observed-group
  - item_id: representative-help
    text: Når man hjelper besøkende, må man lytte nøye.
    bucket_id: representative-person
  - item_id: group-rain
    text: Folk venter ved skranken når det begynner å regne.
    bucket_id: observed-group
  explanation_md: Man presents a representative individual; folk can report behavior among an actual or
    imaginable group.
  derived_from:
  - section_id: checkpoint-distinguish-individual-generalization-from-group
- handle: discriminate-man-folk-full-response
  op: choose
  objective: obj-generic-pronouns-01
  bloom: analyze
  prompt_md: Choose the best continuation.
  stem_md: 'Forsker: «Vi registrerte spørsmål fra 240 faktiske besøkende denne måneden.» Rapport: «_____»'
  options:
  - id: direct-du
    text: Du spør oftest om kart og vær.
    correct: false
    why: Du retter rapporten mot leseren og kan høres personlig anklagende ut.
  - id: folk
    text: Folk spør oftest om kart og vær.
    correct: true
    why: Folk passer i en rapport om en observert gruppe besøkende.
  - id: man
    text: Man spør oftest om kart og vær når man planlegger en reise.
    correct: false
    why: Man uttrykker en generell vane under reiseplanlegging, ikke et funn om de observerte besøkende.
  explanation_md: Opplysninger om faktiske besøkende taler for en gruppebetydning med folk.
  derived_from:
  - section_id: folk-for-people-as-a-group
- handle: revise-generic-pronoun-message
  op: write
  objective: obj-generic-pronouns-01
  bloom: analyze
  prompt_md: 'Utkast til turistinformasjon: «Man bør sjekke været. Sterk vind kan gjøre man usikker. Folk
    må kjenne sin egen grense.» Redaktørens mål: Første og siste setning skal være nøytrale regler om
    en representativ person. Midtsetningen skal beholde samme generelle referanse. Send redaktøren en
    korrigert versjon på 14–28 ord.'
  response_language: 'no'
  min_words: 14
  max_words: 28
  judge_prompt: Evaluate representative-meaning, object-repair, consistent-reference, and word-bound.
    Apply no unstated style requirements.
  criteria:
  - id: representative-meaning
    instruction: The first and last sentences describe a representative generic person rather than an
      observed group.
  - id: object-repair
    instruction: The affected generic person in the middle sentence is expressed as an object within the
      same impersonal reference.
  - id: consistent-reference
    instruction: The revision keeps a coherent impersonal man/en reference across the three statements.
  - id: word-bound
    instruction: The response contains 14–28 words.
  derived_from:
  - section_id: returning-to-nora-and-elias
- handle: transfer-generic-choices-to-pool-context
  op: write
  objective: obj-generic-pronouns-01
  bloom: apply
  prompt_md: 'Svømmehallens fakta: Gjester skal dusje før de bader. Våte gulv kan gjøre en person usikker.
    Personalet har observert at mange kunder glemmer håndkle. Mottakere og formål: 1. Gi gjestene et direkte
    råd med du og deg. 2. Forklar sikkerhet som en nøytral generell regel med man eller en som subjekt,
    og en i en annen rolle. 3. Rapporter personalets observasjon om kundene som folk. Skriv tre korte
    tekster på til sammen 24–55 ord.'
  response_language: 'no'
  min_words: 24
  max_words: 55
  judge_prompt: Evaluate direct-advice, neutral-safety, observed-group, affected-person-form, du-form,
    man-en-form, folk-form, supplied-facts, and word-bound.
  criteria:
  - id: direct-advice
    instruction: The first text gives swimming-pool visitors direct advice to shower before bathing.
  - id: neutral-safety
    instruction: The second text states the wet-floor risk as a neutral general safety rule.
  - id: observed-group
    instruction: The third text reports the staff's observation about customers as a group.
  - id: affected-person-form
    instruction: The wet-floor sentence expresses the affected generic person in a non-subject role.
  - id: du-form
    instruction: The direct advice uses both du and deg to address the visitors directly.
  - id: man-en-form
    instruction: The neutral rule uses man or generic en as subject and en in the non-subject role.
  - id: folk-form
    instruction: The staff report uses folk for the observed group.
  - id: supplied-facts
    instruction: The response uses the supplied facts without inventing a conflicting rule.
  - id: word-bound
    instruction: The combined response contains 24–55 words.
  derived_from:
  - section_id: cumulative-transfer-request
