- handle: retrieve-definite_noun_patterns
  op: write
  objective: obj-definite-articles-01
  bloom: apply
  prompt_md: >-
    Ved piknikbordet i parken ligger én kurv, én bok (ei bok), ett eple, flere kopper og flere
    poser. Skriv en melding på 25–45 ord til en venn og fortell hvor hver ting eller gruppe ligger,
    så vennen kan hente dem. Bruk bestemt form av hvert substantiv.
  derived_from:
  - section_id: final-retrieval-and-review
  response_language: 'no'
  judge_prompt: Check gating criteria picnic-items, audience-purpose, word-bound, definite-forms and comprehensibility.
    Record singular-ending-observation and plural-ending-observation diagnostically; criterion ids ending
    in -observation never cause failure.
  criteria:
  - id: picnic-items
    instruction: States a location for the basket, book, apple, cups and bags.
  - id: audience-purpose
    instruction: Functions as a message to a friend who needs to collect the listed things.
  - id: word-bound
    instruction: Contains 25–45 words.
  - id: definite-forms
    instruction: Uses the definite form of each established noun, not the indefinite form.
  - id: comprehensibility
    instruction: Uses standard Norwegian vocabulary and word order so a Norwegian reader can understand
      and act on every location; a message that is not standard Norwegian fails this criterion.
  - id: singular-ending-observation
    instruction: 'Observation only: note which definite singular endings appear for the basket, book and
      apple; never fail on this observation.'
  - id: plural-ending-observation
    instruction: 'Observation only: note which definite plural endings appear for the cups and bags; never
      fail on this observation.'
