- handle: review_choose-singular-definiteness-from-context
  op: choose
  objective: obj-definite-articles-01
  bloom: understand
  prompt_md: "Velg setningsparet som først introduserer en ny ting og deretter viser til den samme tingen."
  derived_from:
  - section_id: checkpoint-choosing-meaning-not-only-endings
  stem_md: "Nora forteller at hun fant en ting på kjøkkenet, og sier senere til Amir hvor den ligger."
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Nora
      text_md: «Jeg fant noe på kjøkkenet.»
    - speaker: Amir
      text_md: «Hva fant du?»
    - speaker: Nora
      text_md: «Det jeg fant, står nå ved vasken.»
  options:
  - id: known-throughout
    text: På kjøkkenet står koppen. Koppen står ved vasken.
    correct: false
    why: The first sentence treats the cup as already identified instead of introducing it as new.
  - id: new-then-known
    text: På kjøkkenet finner jeg en kopp. Koppen står ved vasken.
    correct: true
    why: En kopp introduces one cup, while Koppen refers back to that identified cup.
  - id: new-throughout
    text: På kjøkkenet finner jeg en kopp. En kopp står ved vasken.
    correct: false
    why: The second indefinite phrase does not clearly identify the same cup.
