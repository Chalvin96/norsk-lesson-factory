- handle: choose-singular-definiteness-from-context
  op: choose
  objective: obj-definite-articles-01
  bloom: understand
  prompt_md: Choose the pair that preserves the change from new to known.
  derived_from:
  - section_id: checkpoint-choosing-meaning-not-only-endings
  stem_md: A teacher points out an object in the hallway and later refers back to that same object.
  stimulus:
  - kind: dialogue
    turns:
    - speaker: Lærer
      text_md: «Jeg ser noe nytt i gangen.»
    - speaker: Elev
      text_md: «Hva mener du?»
    - speaker: Lærer
      text_md: «Den gjenstanden vi nå snakker om, er våt.»
  options:
  - id: known-then-new
    text: I gangen henger jakka. Ei jakke er våt.
    correct: false
    why: This presents the jacket as known before introducing it as an unspecified object.
  - id: new-throughout
    text: I gangen henger ei jakke. Ei jakke er våt.
    correct: false
    why: The second indefinite phrase can introduce another jacket instead of referring clearly to the
      first one.
  - id: new-then-known
    text: I gangen henger ei jakke. Jakka er våt.
    correct: true
    why: The first sentence introduces a jacket, and the second identifies that same jacket with the definite
      form.
