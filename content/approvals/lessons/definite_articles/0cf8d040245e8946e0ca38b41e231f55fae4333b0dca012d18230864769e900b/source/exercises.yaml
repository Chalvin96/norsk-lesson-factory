- handle: notice-known-singular-nouns
  op: choose
  objective: obj-definite-articles-01
  bloom: understand
  prompt_md: Choose the explanation that matches the dialogue.
  derived_from:
  - section_id: checkpoint-noticing-known-things
  stem_md: 'Nora: Kan du gi meg koppen, boka og posen?

    Amir: Ja, her er de.

    '
  options:
  - id: known-but-indefinite
    text: The objects are identifiable, but en, ei or et must still stand before each noun.
    correct: false
    why: In these simple noun phrases, the definite ending replaces the indefinite article.
  - id: known-particular-objects
    text: Koppen, boka and posen identify particular objects that Nora and Amir can distinguish in the
      situation.
    correct: true
    why: The dialogue treats each noun as an identifiable object, so Norwegian marks definiteness with
      a noun ending.
  - id: first-mentions
    text: The three nouns introduce objects that Nora and Amir have not identified.
    correct: false
    why: This reading confuses a later reference to an identifiable object with the first mention of an
      unspecified object.
