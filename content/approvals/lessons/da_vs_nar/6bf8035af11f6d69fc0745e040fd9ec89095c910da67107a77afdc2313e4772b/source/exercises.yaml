- handle: repair_tense_based_choices
  op: write
  objective: obj-da-vs-nar-01
  bloom: analyze
  prompt_md: "Consider the sentence: «Da jeg var på hytta, fisket vi alltid etter middag.» Write in Norwegian whether «da» fits here. Explain how the one cabin stay and the repeated fishing affect your answer."
  derived_from:
  - section_id: common-mistake-choosing-from-tense-alone
  response_language: 'no'
  judge_prompt: Check the context-based assessment and Norwegian explanation against every criterion.
    Require an answer to the stated specific-stay context. Do not accept an alternative repeated-stay interpretation that changes the facts in the prompt.
  criteria:
  - id: context-based-assessment
    instruction: States whether da is defensible in the sentence and gives a context-based reason.
  - id: meaning-distinction
    instruction: Explains in Norwegian that da can frame one specific cabin stay while alltid describes
      repeated fishing during that stay. Do not accept a reading that changes the stay into repeated visits.
