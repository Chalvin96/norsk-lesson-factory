- handle: transform_the_time_context
  op: write
  objective: obj-da-vs-nar-01
  bloom: apply
  prompt_md: "Rewrite the sentence in two ways without changing the main action: «Da jeg kom hjem på fredag, ringte jeg pappa.» First describe a repeated routine with «når», then a future plan with «når». Change the verb tense and time phrase to fit."
  derived_from:
  - section_id: building-your-own-meaning-contrast
  response_language: 'no'
  min_words: 10
  max_words: 30
  judge_prompt: Check the two Norwegian sentences against the task and report evidence for each criterion.
    Accept natural tense and time-expression changes, but require the requested connector choices.
  criteria:
  - id: repeated-time-version
    instruction: Writes a repeated-time version of the arrival-and-call event and uses når.
  - id: future-time-version
    instruction: Writes a future-time version of the arrival-and-call event and uses når.
  - id: same-event
    instruction: Keeps the basic arrival-and-call event in both rewrites while changing the time meaning.
- handle: narrate_memory_routine_and_plan
  op: write
  objective: obj-da-vs-nar-01
  bloom: apply
  prompt_md: "Write a short, connected text in Norwegian about Nora's visit to the swimming pool. Write one sentence about a visit last Tuesday, one about something she usually does, and one about her planned visit tomorrow. Choose linking words to match the time meaning in each situation. Explain the time meaning of each word."
  derived_from:
  - section_id: cumulative-transfer-new-everyday-situation
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Check the connected Norwegian account against the task and report evidence for each criterion.
    Require meaning-based use of da and når, not tense-only matching. Check that the account also explains
    the intended time meaning of each connector.
  criteria:
  - id: specific-past-memory
    instruction: Describes one specific completed swimming-pool visit last Tuesday and uses da for its time clause.
  - id: repeated-routine
    instruction: Describes something Nora usually does on her swimming-pool visits and uses når.
  - id: future-plan
    instruction: Describes Nora’s planned swimming-pool visit tomorrow and uses når, even if the time clause uses
      present tense.
  - id: connected-original
    instruction: Connects all three contexts in one short account with original wording.
  - id: explains-time-meanings
    instruction: Explains that da frames the specific past occasion while når frames the repeated routine and planned future time.
