- handle: repair_tense_based_choices
  op: write
  objective: obj-da-vs-nar-01
  bloom: analyze
  prompt_md: 'Assess this Norwegian sentence: «Da jeg var på hytta, fisket vi alltid etter middag.» Write
    in Norwegian whether da is defensible in this context, and explain how the specific stay and repeated
    fishing pattern affect your answer.'
  derived_from:
  - section_id: common-mistake-choosing-from-tense-alone
  response_language: 'no'
  judge_prompt: Check the context-based assessment and Norwegian explanation against every criterion.
    Accept either a defensible explanation of da or a natural argument for når when the explanation distinguishes
    the meanings.
  criteria:
  - id: context-based-assessment
    instruction: States whether da is defensible in the sentence and gives a context-based reason.
  - id: meaning-distinction
    instruction: Explains in Norwegian that da can frame one specific cabin stay while alltid describes
      repeated fishing during that stay, or clearly explains a different intended repeated-time reading.
