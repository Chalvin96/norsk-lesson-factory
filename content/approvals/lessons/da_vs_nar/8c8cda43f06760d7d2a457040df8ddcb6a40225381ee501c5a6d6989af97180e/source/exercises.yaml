- handle: notice_specific_past_da
  op: choose
  objective: obj-da-vs-nar-01
  bloom: understand
  prompt_md: Choose what the time clause tells us about the arrival.
  derived_from:
  - section_id: one-specific-past-occasion-da
  stem_md: 'Read: Da jeg kom hjem på fredag, lå det en melding på telefonen.'
  options:
  - id: repeated-past
    text: It happened on Fridays as a regular routine.
    correct: false
    why: The sentence names one Friday, not a recurring routine, so når would not fit.
  - id: specific-past
    text: It happened once, on one particular Friday.
    correct: true
    why: The Friday arrival is one identified, completed past occasion, so da fits.
  - id: future-time
    text: It will happen on an upcoming Friday.
    correct: false
    why: The sentence describes a completed past arrival, not a future event.
- handle: distinguish_single_and_repeated_past
  op: categorize
  objective: obj-da-vs-nar-01
  bloom: analyze
  prompt_md: The time word is missing at the start of each sentence. Classify each sentence by its past-time
    meaning. Use one bucket per sentence.
  explanation_md: Use da for one specific past occasion and når for events that happened repeatedly.
  derived_from:
  - section_id: repeated-time-nar
  buckets:
  - bucket_id: single-past
    label: One specific completed past occasion
  - bucket_id: repeated-past
    label: Repeated past pattern
  items:
  - item_id: sunday-visit
    text: jeg besøkte bestemor på søndag, bakte hun vafler.
    bucket_id: single-past
  - item_id: regular-visit
    text: jeg besøkte bestemor, bakte hun alltid vafler.
    bucket_id: repeated-past
  - item_id: train-yesterday
    text: toget kom i går, sto Anna på perrongen.
    bucket_id: single-past
  - item_id: train-mornings
    text: toget kom om morgenen, sto Anna vanligvis på perrongen.
    bucket_id: repeated-past
