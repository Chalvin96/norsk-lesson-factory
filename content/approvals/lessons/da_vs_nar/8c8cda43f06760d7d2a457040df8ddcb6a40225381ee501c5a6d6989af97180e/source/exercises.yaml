- handle: transform_the_time_context
  op: write
  objective: obj-da-vs-nar-01
  bloom: apply
  prompt_md: 'Rewrite this sentence in two ways while keeping the basic event: Da jeg kom hjem på fredag,
    ringte jeg pappa. (When I came home on Friday, I called Dad.) First write a repeated routine with
    når; then write a future plan with når. Adjust tense or time expressions naturally.'
  derived_from:
  - section_id: building-your-own-meaning-contrast
  response_language: 'no'
  min_words: 10
  max_words: 30
  judge_prompt: Check the two Norwegian sentences against the task and report evidence for each criterion.
    Accept natural tense and time-expression changes, but require the requested connector choices.
  criteria:
  - id: repeated-time-version
    instruction: Writes a repeated-time version of the arrival-and-call event and uses når.
  - id: future-time-version
    instruction: Writes a future-time version of the arrival-and-call event and uses når.
  - id: same-event
    instruction: Keeps the basic arrival-and-call event in both rewrites while changing the time meaning.
- handle: narrate_memory_routine_and_plan
  op: write
  objective: obj-da-vs-nar-01
  bloom: apply
  prompt_md: 'Write a short connected account in Norwegian about Sander’s driving lessons. Include one
    sentence for each cue: one specific earlier lesson, something that normally happens during lessons,
    and tomorrow’s lesson or plan. Use da for the single past occasion and når for both the routine and
    future plan. Use your own wording.'
  derived_from:
  - section_id: cumulative-transfer-new-everyday-situation
  response_language: 'no'
  min_words: 25
  max_words: 55
  judge_prompt: Check the connected Norwegian account against the task and report evidence for each criterion.
    Require meaning-based use of da and når, not tense-only matching.
  criteria:
  - id: specific-past-memory
    instruction: Describes one specific completed earlier driving lesson and uses da for its time clause.
  - id: repeated-routine
    instruction: Describes something that normally happens during driving lessons and uses når.
  - id: future-plan
    instruction: Describes tomorrow’s driving lesson or plan and uses når, even if the time clause uses
      present tense.
  - id: connected-original
    instruction: Connects all three contexts in one short account with original wording.
