  distinguish_reason_and_unexpected_contrast:
    exercise_key: distinguish_reason_and_unexpected_contrast
    checked_against:
      expressing-an-unexpected-contrast-with-selv-om: 08692d6e4cd9bb8e1a7edb5285c3263ecf879237f8ea8d41cbcdd13b8df28a7f
    section_sources:
      expressing-an-unexpected-contrast-with-selv-om: '## Expressing an unexpected
        contrast with selv om {#expressing-an-unexpected-contrast-with-selv-om role=contrast
        objectives=obj-subordinating-conjunctions-01}


        Use selv om when the main situation is true despite something that might normally
        lead to a different result. It corresponds to even though or although.


        ::: examples

        - no: Jonas pakker regnjakka selv om han håper på sol.

        - en: Jonas packs his rain jacket even though he hopes for sunshine.

        - no: De drar på tur selv om været er dårlig.

        - en: They go on the trip even though the weather is bad.

        - no: Maja er trøtt selv om hun har sovet lenge.

        - en: Maja is tired even though she has slept for a long time.

        - no: Selv om det regner, går de en liten tur.

        - en: Even though it is raining, they go for a short walk.

        :::


        The dependent clause introduces information that could create an expectation.
        The main clause shows that the expected result does not follow.


        Bad weather might make us expect Maja and Jonas to stay home. Instead:


        ::: examples

        - no: De drar selv om været er dårlig.

        - en: They go even though the weather is bad.

        :::


        A compact rule is:


        ::: {.rule}

        Use selv om when the main event happens despite the situation in the dependent
        clause.

        :::


        Do not use selv om for an ordinary reason:


        ::: examples

        - no: De blir inne fordi det regner.

        - en: They stay inside because it is raining.

        :::


        The rain explains the decision.


        ::: examples

        - no: De går ut selv om det regner.

        - en: They go outside even though it is raining.

        :::


        Going outside contrasts with the expectation created by the rain.


        {{exercise: distinguish_reason_and_unexpected_contrast}}


        {{exercise: identify_selv_om_clause}}


