  contrast_at_and_om:
    exercise_key: contrast_at_and_om
    checked_against:
      asking-indirectly-with-om: a12ad7d454df0ffb749c1d377df57828eb0e588447530175095158a43f1c9e23
    section_sources:
      asking-indirectly-with-om: '## Asking indirectly with om {#asking-indirectly-with-om
        role=model objectives=obj-subordinating-conjunctions-01}


        In the opening dialogue, Maja says:


        ::: examples

        - no: Jeg kan sjekke om butikken ved hytta er åpen.

        - en: I can check whether the shop near the cabin is open.

        :::


        Here, om means whether. It introduces something that is uncertain and can
        be checked, asked, known, or discovered.


        ::: examples

        - no: Jonas spør om veien er åpen.

        - en: Jonas asks whether the road is open.

        - no: Vi vet ikke om det blir regn.

        - en: We do not know whether it will rain.

        - no: Maja undersøker om bussen går på lørdager.

        - en: Maja checks whether the bus runs on Saturdays.

        - no: Jeg lurer på om hytta er varm.

        - en: I wonder whether the cabin is warm.

        :::


        A compact rule is:


        ::: {.rule}

        Use om to introduce an indirect yes-or-no question after expressions such
        as ask, know, check, or wonder.

        :::


        Compare at and om:


        ::: examples

        - no: Jeg vet at butikken er åpen.

        - en: I know that the shop is open.

        - no: Jeg vet ikke om butikken er åpen.

        - en: I do not know whether the shop is open.

        :::


        With at, the speaker presents the information as known. With om, the question
        of whether the shop is open remains uncertain.


        This distinction is about the relationship between the clauses:


        - at introduces content presented as a statement or fact;

        - om introduces an unresolved yes-or-no question.


        {{exercise: contrast_at_and_om}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:48:03.687514+00:00'
