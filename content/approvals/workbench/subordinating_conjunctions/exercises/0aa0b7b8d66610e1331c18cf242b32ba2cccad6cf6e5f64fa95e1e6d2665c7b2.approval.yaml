exercise_alignments:
  identify_at_content_clause:
    exercise_key: identify_at_content_clause
    checked_against:
      reporting-a-thought-or-statement-with-at: a3f81be0c4ca7e27e6d9c222d51168c02b04a46da0940e9b3240f0c539a30b06
    section_sources:
      reporting-a-thought-or-statement-with-at: '## Reporting a thought or statement
        with at {#reporting-a-thought-or-statement-with-at role=model objectives=obj-subordinating-conjunctions-01}


        Use at when one clause gives the content of a thought, belief, statement,
        or piece of information. It often corresponds to English that.


        ::: examples

        - no: Maja tror at det blir regn.

        - en: Maja thinks that it will rain.

        - no: Jonas sier at han er klar.

        - en: Jonas says that he is ready.

        - no: Vi vet at veien er åpen.

        - en: We know that the road is open.

        - no: Jeg håper at butikken ikke er stengt.

        - en: I hope that the shop is not closed.

        :::


        In each example, the words after at tell us what someone thinks, says, knows,
        or hopes.


        Compare the two parts:


        ::: examples

        - no: Maja tror.

        - en: Maja thinks.

        - no: at det blir regn

        - en: that it will rain

        :::


        The first part is grammatically possible, but it does not tell us what Maja
        thinks. The at-clause provides the content.


        A compact rule is:


        ::: {.rule}

        Use at to introduce the content of a thought, statement, belief, hope, or
        known fact.

        :::


        Do not choose at merely because English can sometimes omit that. Norwegian
        may also omit at in some informal contexts, but at is common, clear, and useful
        at this level.


        ::: examples

        - no: Jeg tror at bussen kommer snart.

        - en: I think that the bus will arrive soon.

        :::


        The meaning is not a reason or a condition. The clause tells us what the speaker
        thinks.


        {{exercise: identify_at_content_clause}}


        {{exercise: choose_at_for_reported_content}}


        '
