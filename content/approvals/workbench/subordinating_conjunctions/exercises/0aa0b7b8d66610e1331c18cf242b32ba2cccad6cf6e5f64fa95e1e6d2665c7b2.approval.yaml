  review_at_reported_content:
    exercise_key: review_at_reported_content
    checked_against:
      reporting-a-thought-or-statement-with-at: a3f81be0c4ca7e27e6d9c222d51168c02b04a46da0940e9b3240f0c539a30b06
    section_sources:
      reporting-a-thought-or-statement-with-at: '## Reporting a thought or statement
        with at {#reporting-a-thought-or-statement-with-at role=model objectives=obj-subordinating-conjunctions-01}


        Use at when one clause gives the content of a thought, belief, statement,
        or piece of information. It often corresponds to English that.


        ::: examples

        - no: Maja tror at det blir regn.

        - en: Maja thinks that it will rain.

        - no: Jonas sier at han er klar.

        - en: Jonas says that he is ready.

        - no: Vi vet at veien er åpen.

        - en: We know that the road is open.

        - no: Jeg håper at butikken ikke er stengt.

        - en: I hope that the shop is not closed.

        :::


        In each example, the words after at tell us what someone thinks, says, knows,
        or hopes.


        Compare the two parts:


        ::: examples

        - no: Maja tror.

        - en: Maja thinks.

        - no: at det blir regn

        - en: that it will rain

        :::


        The first part is grammatically possible, but it does not tell us what Maja
        thinks. The at-clause provides the content.


        A compact rule is:


        ::: {.rule}

        Use at to introduce the content of a thought, statement, belief, hope, or
        known fact.

        :::


        Do not choose at merely because English can sometimes omit that. Norwegian
        may also omit at in some informal contexts, but at is common, clear, and useful
        at this level.


        ::: examples

        - no: Jeg tror at bussen kommer snart.

        - en: I think that the bus will arrive soon.

        :::


        The meaning is not a reason or a condition. The clause tells us what the speaker
        thinks.


        {{exercise: identify_at_content_clause}}


        {{exercise: choose_at_for_reported_content}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:48:03.687514+00:00'
    decision_id: null
  review_fordi_reason:
    exercise_key: review_fordi_reason
    checked_against:
      giving-a-reason-with-fordi: 4566c39810d5a78e46b23c73113cd21a56d5a516f3367c60cb809ab6e43a132a
    section_sources:
      giving-a-reason-with-fordi: '## Giving a reason with fordi {#giving-a-reason-with-fordi
        role=model objectives=obj-subordinating-conjunctions-01}


        Use fordi when the dependent clause explains why something happens or why
        someone makes a choice. It corresponds to because.


        ::: examples

        - no: De vurderer å avlyse turen fordi været blir dårlig.

        - en: They are considering cancelling the trip because the weather is going
        to be bad.

        - no: Maja tar med støvler fordi det har regnet.

        - en: Maja is bringing boots because it has rained.

        - no: Jonas ringer fordi han har et spørsmål.

        - en: Jonas calls because he has a question.

        - no: Vi blir inne fordi det blåser mye.

        - en: We are staying inside because it is very windy.

        :::


        The fordi-clause answers a why-question.


        ::: examples

        - no: Hvorfor tar Maja med støvler?

        - en: Why is Maja bringing boots?

        - no: Fordi det har regnet.

        - en: Because it has rained.

        :::


        In conversation, a fordi-clause can be used as a short answer when the missing
        main idea is already understood. In a full sentence, it belongs to a larger
        message:


        ::: examples

        - no: Maja tar med støvler fordi det har regnet.

        - en: Maja is bringing boots because it has rained.

        :::


        A compact rule is:


        ::: {.rule}

        Use fordi when the dependent clause gives a reason.

        :::


        A common mistake is to choose fordi whenever two events are connected. The
        connection must specifically be one of cause or explanation.


        Compare:


        ::: examples

        - no: Vi drar hvis veien er åpen.

        - en: We will go if the road is open.

        - no: Vi drar fordi veien er åpen.

        - en: We are going because the road is open.

        :::


        The first sentence states a condition: the trip depends on the road being
        open. The second gives the open road as a reason for going.


        {{exercise: match_reason_to_fordi_clause}}


        {{exercise: complete_trip_reasons_with_fordi}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:48:03.687514+00:00'
    decision_id: null
  review_hvis_condition:
    exercise_key: review_hvis_condition
    checked_against:
      stating-a-condition-with-hvis: e57bafd932cc337a5758838d0a81b47e827e9642e323f763a279d6973c51888c
    section_sources:
      stating-a-condition-with-hvis: '## Stating a condition with hvis {#stating-a-condition-with-hvis
        role=contrast objectives=obj-subordinating-conjunctions-01}


        Use hvis when an event or decision depends on a condition. It corresponds
        to if.


        ::: examples

        - no: Vi drar hvis veien er åpen.

        - en: We will go if the road is open.

        - no: Jeg kjører hvis du er trøtt.

        - en: I’ll drive if you are tired.

        - no: Vi kan handle på veien hvis butikken ved hytta er stengt.

        - en: We can shop on the way if the shop near the cabin is closed.

        - no: Hvis det regner, blir vi inne.

        - en: If it rains, we will stay inside.

        :::


        The hvis-clause can come after or before the main clause. Its function remains
        the same: it gives the condition under which the main situation applies.


        ::: examples

        - no: Jonas tar med ved hvis det blir kaldt.

        - en: Jonas will bring firewood if it gets cold.

        - no: Hvis det blir kaldt, tar Jonas med ved.

        - en: If it gets cold, Jonas will bring firewood.

        :::


        A compact rule is:


        ::: {.rule}

        Use hvis when the main event depends on a possible condition.

        :::


        Do not confuse a condition with a reason:


        ::: examples

        - no: Jeg tar med mat hvis butikken er stengt.

        - en: I’ll bring food if the shop is closed.

        :::


        The speaker does not yet present the closure as a fact. It is a possibility
        that affects the plan.


        ::: examples

        - no: Jeg tar med mat fordi butikken er stengt.

        - en: I’m bringing food because the shop is closed.

        :::


        Here, the closure is presented as the reason for the decision.


        {{exercise: contrast_fordi_and_hvis}}


        {{exercise: locate_hvis_dependency}}


        '
    outcome: approved
    note: null
    reason: null
