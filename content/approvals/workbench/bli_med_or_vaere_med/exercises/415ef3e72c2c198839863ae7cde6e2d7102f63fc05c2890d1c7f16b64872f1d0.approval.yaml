  context_cabin_plan:
    exercise_key: context_cabin_plan
    checked_against:
      back-at-cabin-trip: 737a4e16f50b1c8cd730eecb1b508bb2b99ff29a362bdd1603cbf52b66907b5e
    section_sources:
      back-at-cabin-trip: '## Back at the cabin trip {#back-at-cabin-trip role=contrast
        objectives=obj-bli-med-or-vaere-med-01}


        On Friday afternoon, the friends meet beside Sara’s car.


        ::: {.reading translation="Lea, are you coming in my car?" dialogue_id="cabin-trip"
        speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Lea, blir du med i bilen min?

        :::


        ::: {.reading translation="Yes. Jonas is coming with us too, right?" dialogue_id="cabin-trip"
        speaker_id="lea" speaker_name="Lea" character_id="lea"}

        Ja. Jonas er også med, ikke sant?

        :::


        ::: {.reading translation="Yes, he’s included. He’s buying food before we
        leave." dialogue_id="cabin-trip" speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Ja, han er med. Han kjøper mat før vi drar.

        :::


        ::: {.reading translation="And Omar?" dialogue_id="cabin-trip" speaker_id="lea"
        speaker_name="Lea" character_id="lea"}

        Og Omar?

        :::


        ::: {.reading translation="He’s taking part in the trip, but he won’t join
        us until tomorrow." dialogue_id="cabin-trip" speaker_id="sara" speaker_name="Sara"
        character_id="sara"}

        Han er med på turen, men han blir med først i morgen.

        :::


        ::: {.reading translation="I’ve bought the food now. Who will come and help
        carry it?" dialogue_id="cabin-trip" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Nå har jeg kjøpt maten. Hvem blir med og bærer?

        :::


        ::: {.reading translation="I’ll come!" dialogue_id="cabin-trip" speaker_id="lea"
        speaker_name="Lea" character_id="lea"}

        Jeg blir med!

        :::


        Omar can already be **med på turen** because he is an included participant
        in the weekend plan. At the same time, he does not **bli med** until Saturday
        because that is when he physically joins the others. The two expressions describe
        different aspects of the same situation.


        **Context-building practice**


        Reconstruct the cabin plan in a short written sequence. State who accepts
        the invitation, who is already included in the trip, who joins later, and
        who takes part in the cooking team. Reuse both present and past forms where
        the timeline requires them.


        Your response should maintain the distinction consistently: decisions and
        arrivals use **bli med**, while established participation and team membership
        use **være med**.


        {{exercise: context_cabin_plan}}


        '
