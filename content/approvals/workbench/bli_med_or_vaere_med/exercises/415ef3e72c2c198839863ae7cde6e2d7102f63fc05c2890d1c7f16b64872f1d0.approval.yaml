  second_participation_check:
    exercise_key: second_participation_check
    checked_against:
      participation-inclusion-vaere-med: b36c9b99ffc65cb8ae8f1370e5f5503479bc1376ce199f0bb44785abb48625ed
    section_sources:
      participation-inclusion-vaere-med: '## Participation and inclusion with være
        med {#participation-inclusion-vaere-med role=model objectives=obj-bli-med-or-vaere-med-01}


        Use **være med** when the important information is that someone participates
        or belongs to the relevant group.


        ::: examples

        - no: Er du med på kurset?

        - en: Are you taking part in the course?

        - no: Ja, jeg er med.

        - en: Yes, I am.

        - no: Femten personer er med i prosjektet.

        - en: Fifteen people are involved in the project.

        - no: Barna var med på hele arrangementet.

        - en: The children took part in the entire event.

        :::


        Here the useful forms are **er med** for a present situation and **var med**
        for a past situation.


        ::: examples

        - no: Sander er med på laget nå.

        - en: Sander is on the team now.

        - no: Sander var med på laget i fjor.

        - en: Sander was on the team last year.

        :::


        The focus is not the moment when Sander joined. It is his membership during
        a particular period.


        **Være med** can also emphasize inclusion or access.


        ::: examples

        - no: Alle kan være med.

        - en: Everyone can take part.

        - no: Er alle med på bildet?

        - en: Is everyone included in the picture?

        - no: Navnet mitt er ikke med på lista.

        - en: My name isn’t included on the list.

        :::


        These examples share the same basic viewpoint: the question is whether a person
        or item is included, not how it enters.


        **Second checkpoint: checking participation**


        Read brief descriptions of a class, a sports team, a volunteer project, and
        a guest list. Complete statements about who currently participates, who participated
        earlier, and who is included.


        Your response should choose **er med** or **var med** when the context reports
        participation or inclusion without highlighting entry.


        {{exercise: second_participation_check}}


        '
