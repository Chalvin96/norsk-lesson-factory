      final-retrieval: '## Final retrieval {#final-retrieval role=recap objectives=obj-bli-med-or-vaere-med-01}


        Without looking back, complete two short pairs from new contexts:


        1. Describe someone accepting an invitation to a study group, then describe
        that person as a member of the group.

        2. Describe someone who participated in a concert last year, then describe
        a friend deciding to join this year.


        Your review response should show the core sequence: use **bli med** for entering
        or accepting participation, and **være med** for existing participation or
        inclusion.


        {{exercise: final_retrieval_pairs}}


