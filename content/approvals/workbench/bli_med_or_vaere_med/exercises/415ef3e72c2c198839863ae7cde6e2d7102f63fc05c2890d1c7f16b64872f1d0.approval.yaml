  controlled_bli_med_viewpoint:
    exercise_key: controlled_bli_med_viewpoint
    checked_against:
      invitations-decisions-bli-med: eef46a0a30d5290298409c37b9476b8db7d316a9bfa1f4ca78d91e0af44567c8
    section_sources:
      invitations-decisions-bli-med: '## Invitations and decisions with bli med {#invitations-decisions-bli-med
        role=model objectives=obj-bli-med-or-vaere-med-01}


        **Bli med** is especially common when someone invites another person to join
        an activity or accompany a group.


        ::: examples

        - no: Vil du bli med på kafé?

        - en: Would you like to come along to a café?

        - no: Kan Emma bli med på festen?

        - en: Can Emma come to the party?

        - no: Bli med oss!

        - en: Come with us!

        :::


        It also appears when someone accepts, refuses, or reports a decision.


        ::: examples

        - no: Jeg blir med på konserten.

        - en: I’m coming to the concert.

        - no: Dessverre kan jeg ikke bli med.

        - en: Unfortunately, I can’t come along.

        - no: Adrian bestemte seg for å bli med.

        - en: Adrian decided to join.

        :::


        The most useful present-tense form is **blir med**.


        ::: examples

        - no: Blir du med i kveld?

        - en: Are you coming along tonight?

        :::


        Although the Norwegian form is present tense, the question often concerns
        an upcoming activity. Its main force is not simply future time. It asks whether
        the listener will join the plan.


        The past form is **ble med**.


        ::: examples

        - no: Nora ble med på turen i siste liten.

        - en: Nora joined the trip at the last minute.

        :::


        This describes the point at which Nora entered the group or accepted the plan.


        ::: examples

        - no: Vi spurte Henrik, og han ble med.

        - en: We asked Henrik, and he joined us.

        :::


        **Controlled practice: choosing the joining viewpoint**


        Complete a short set of contextual sentences about invitations, late decisions,
        and people entering groups. Use the appropriate form of **bli med**, adjusting
        it to the time of the sentence.




        {{exercise: controlled_bli_med_viewpoint}}


        '
