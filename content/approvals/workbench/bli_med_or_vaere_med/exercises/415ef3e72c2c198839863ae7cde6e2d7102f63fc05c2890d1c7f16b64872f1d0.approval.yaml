    section_sources:
      central-contrast: '## The central contrast {#central-contrast role=model objectives=obj-bli-med-or-vaere-med-01}


        The verb **bli** often presents a change. In the expression **bli med**, someone
        goes from not participating to participating.


        ::: examples

        - no: Vil du bli med på tur?

        - en: Would you like to come along on the trip?

        :::


        The speaker is offering the listener a chance to join.


        ::: examples

        - no: Ja, jeg blir med.

        - en: Yes, I’ll come along.

        :::


        The listener accepts and enters the plan.


        The verb **være** presents a situation or state. In **være med**, the person
        already participates, belongs to the group, or is included in the activity.


        ::: examples

        - no: Ingrid er med på turen.

        - en: Ingrid is taking part in the trip.

        :::


        Here the question of joining has already been settled. Ingrid is one of the
        participants.


        Compare the two stages:


        ::: examples

        - no: Først spør Sara om Jonas vil bli med.

        - en: First Sara asks whether Jonas wants to come along.

        - no: Etterpå er Jonas med på turen.

        - en: Afterwards Jonas is included in the trip.

        :::


        This before-and-after picture is the main tool for choosing between the expressions:


        **not yet participating → bli med → participating → være med**


        **First checkpoint: finding the change**


        Return to the opening dialogue and locate each use of **bli med** and **være
        med**. For every example, decide whether the speaker is focusing on an invitation
        or decision to join, or on someone’s existing participation.


        {{exercise: first_checkpoint_finding_change}}


        '
