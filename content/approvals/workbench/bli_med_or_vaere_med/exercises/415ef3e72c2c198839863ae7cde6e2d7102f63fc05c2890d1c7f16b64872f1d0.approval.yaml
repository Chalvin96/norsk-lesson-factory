  repair_mixed_expression:
    exercise_key: repair_mixed_expression
    checked_against:
      common-mistakes: 0e1300392092e9f613aee279a4ee0559c60a68f2b40dc059b9f2d5f3e9707b81
    section_sources:
      common-mistakes: '## Common mistakes {#common-mistakes role=contrast objectives=obj-bli-med-or-vaere-med-01}


        **Mixing the two verb forms**


        Do not combine **er** and **bli med**.


        Incorrect:


        ::: examples

        - no: ✗ Er du bli med på turen?

        - en: ''Incorrect: Are you join the trip?''

        :::


        Choose one complete expression.


        ::: examples

        - no: Blir du med på turen?

        - en: Are you coming along on the trip?

        - no: Er du med på turen?

        - en: Are you taking part in the trip?

        :::


        The first asks about joining. The second asks about participation or inclusion.


        **Using bli med for a stable situation without a change**


        If the context simply describes who belongs to a group now, **være med** is
        normally the clearer choice.


        Less suitable for a stable description:


        ::: examples

        - no: Mina blir med i gruppa nå.

        - en: Mina joins the group now.

        :::


        This can be correct if Mina is entering the group at this moment. If the intended
        meaning is that she already belongs to it, use:


        ::: examples

        - no: Mina er med i gruppa nå.

        - en: Mina is in the group now.

        :::


        Context determines whether **nå** means a current change or a current state.


        **Using være med when the joining decision is the point**


        If a story emphasizes someone changing their mind and entering an activity,
        **bli med** expresses that change clearly.


        ::: examples

        - no: Først ville Theo bli hjemme, men så ble han med.

        - en: At first Theo wanted to stay home, but then he joined us.

        :::


        Using **var med** would only report that he participated. It would weaken
        the contrast between his first decision and his later one.


        Compare:


        ::: examples

        - no: Theo ble med etter middag.

        - en: Theo joined us after dinner.

        - no: Theo var med etter middag.

        - en: Theo was with us after dinner.

        :::


        The first marks his entry after dinner. The second describes his participation
        during the period after dinner.


        '
