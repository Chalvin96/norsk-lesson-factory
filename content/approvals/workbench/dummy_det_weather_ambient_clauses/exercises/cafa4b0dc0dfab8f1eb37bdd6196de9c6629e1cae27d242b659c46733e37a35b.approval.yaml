    checked_against:
      common-mistakes-to-avoid: d323ebd20536d9a3a58e9172450c6b221542b3b6a53b4baf9229c9ba45508841
    section_sources:
      common-mistakes-to-avoid: '## Common mistakes to avoid {#common-mistakes-to-avoid
        role=contrast objectives=obj-dummy-det-weather-ambient-clauses-01}


        **Leaving the subject out**


        Norwegian does not normally use a bare weather verb as a complete statement.


        ::: examples

        - no: ✗ Snør på fjellet.

        - en: Incorrect: Snowing in the mountains.

        - no: Det snør på fjellet.

        - en: It’s snowing in the mountains.

        :::


        **Adding *er* before a weather verb**


        Use the weather verb directly after *det*.


        ::: examples

        - no: ✗ Det er blåser.

        - en: Incorrect: It is windy.

        - no: Det blåser.

        - en: It’s windy.

        :::


        **Named subject or dummy det**


        Both constructions below are grammatical. With **været**, you describe a named
        subject, the weather. With dummy **det**, you describe the general temperature
        without naming a subject.


        ::: examples

        - no: Været er kaldt.

        - en: The weather is cold.

        - no: Det er kaldt.

        - en: It’s cold.

        :::


        For general temperature, **Det er kaldt** is the everyday choice.


        **Treating *det* as a specific object**


        In **Det regner**, *det* does not stand for the sky, the weather, the town,
        or the rain. It fills the subject position because Norwegian requires one.


        **Repair incomplete weather messages**


        {{exercise: repair_incomplete_weather_messages}}


        '
