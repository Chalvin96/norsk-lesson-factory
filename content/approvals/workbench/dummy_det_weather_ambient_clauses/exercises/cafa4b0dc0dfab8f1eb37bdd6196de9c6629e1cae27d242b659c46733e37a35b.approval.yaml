  complete_weather_verb_reports:
    exercise_key: complete_weather_verb_reports
    checked_against:
      weather-verbs-with-det: 58e7aaf8a118ceb824c3482668039258a99e445ea05a39b7b448aef13e228ee7
    section_sources:
      weather-verbs-with-det: '## Weather verbs with det {#weather-verbs-with-det
        role=model objectives=obj-dummy-det-weather-ambient-clauses-01}


        Some common Norwegian weather descriptions use a verb directly after *det*.


        ::: examples

        - no: Det regner.

        - en: It’s raining.

        - no: Det snør.

        - en: It’s snowing.

        - no: Det blåser.

        - en: It’s windy. / The wind is blowing.

        :::


        These are complete sentences. Do not add *er* before the weather verb.


        Compare:


        ::: examples

        - no: Det regner.

        - en: It’s raining.

        - no: Det er regn.

        - en: There is rain.

        :::


        The first is the ordinary way to report what the weather is doing. The second
        is possible in limited contexts, but it does not replace the everyday weather
        expression **Det regner**.


        The same applies to snow:


        ::: examples

        - no: Det snør i Oslo.

        - en: It’s snowing in Oslo.

        - no: Det snør mye i dag.

        - en: It’s snowing a lot today.

        - no: Det blåser ved sjøen.

        - en: It’s windy by the sea.

        :::


        A likely mistake is to omit *det* because the learner thinks the weather verb
        already gives enough information:


        ::: examples

        - no: ✗ Regner i dag.

        - en: Incorrect: Raining today.

        - no: Det regner i dag.

        - en: It’s raining today.

        :::


        Norwegian normally requires the grammatical subject *det* here.


        Another likely mistake is to translate English “It is raining” word for word
        by inserting *er*:


        ::: examples

        - no: ✗ Det er regner.

        - en: Incorrect: It is raining.

        - no: Det regner.

        - en: It’s raining.

        :::


        The compact rule is:


        ::: {.rule}

        Use **det + regner/snør/blåser**. These weather verbs do not need *er*.

        :::


        **Complete weather-verb reports**


        {{exercise: complete_weather_verb_reports}}


        '
