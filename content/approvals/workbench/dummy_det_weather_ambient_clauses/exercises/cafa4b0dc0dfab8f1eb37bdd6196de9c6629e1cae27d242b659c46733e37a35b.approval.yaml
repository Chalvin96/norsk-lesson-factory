  choose_current_or_changing_condition:
    exercise_key: choose_current_or_changing_condition
    checked_against:
      reporting-a-change-with-blir: 71b475a035a88078bdad5166cafb3edf2b23f30333de08c111aa314f23cbcdbc
    section_sources:
      reporting-a-change-with-blir: '## Reporting a change with blir {#reporting-a-change-with-blir
        role=contrast objectives=obj-dummy-det-weather-ambient-clauses-01}


        Mina says:


        ::: examples

        - no: Det begynner å bli mørkt.

        - en: It’s starting to get dark.

        :::


        A simpler way to report the same developing condition is:


        ::: examples

        - no: Det blir mørkt.

        - en: It’s getting dark.

        :::


        Here, **blir** reports a change. Compare:


        ::: examples

        - no: Det er mørkt.

        - en: It’s dark.

        - no: Det blir mørkt.

        - en: It’s getting dark.

        :::


        Both sentences use fixed *det*. The difference is that **er** reports the
        current condition, while **blir** reports that the condition is changing.


        More examples:


        ::: examples

        - no: Det er kaldt nå.

        - en: It’s cold now.

        - no: Det blir kaldt i kveld.

        - en: It’s getting cold this evening. / It will get cold this evening.

        - no: Det er lyst ute.

        - en: It’s light outside.

        - no: Det blir mørkt snart.

        - en: It’s getting dark soon.

        :::


        The target remains fixed *det*. You are using the same subject because the
        changing condition still has no particular person or thing as its semantic
        subject.


        Do not replace *det* with a weather noun unless you actually want to make
        that noun the subject. For example:


        - **Været blir kaldt** is not the ordinary way to say *It’s getting cold*.

        - **Det blir kaldt** is the natural ambient expression.


        **Choose current or changing condition**


        {{exercise: choose_current_or_changing_condition}}


        '
