      for A1: “ambient condition” in a-change-of-plans#10 and “semantic subject” in
      reporting-a-change-with-blir#9 and notice_fixed_det_in_the_cafe_call. Earlier
      examples scaffold the idea, but these additional labels remain unexplained.
      Reuse the established plain explanation about weather and surroundings without
      naming a person or thing.'
