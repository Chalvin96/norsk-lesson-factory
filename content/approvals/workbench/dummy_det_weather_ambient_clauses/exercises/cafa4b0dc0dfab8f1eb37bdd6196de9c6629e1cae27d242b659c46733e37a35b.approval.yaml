  respond_to_local_weather_questions:
    exercise_key: respond_to_local_weather_questions
    checked_against:
      adding-place-and-time: 513b6e908ce1a6d0a6a53e63d76eff5a6abfdc2c406c1a85330c6ce26a178ab7
    section_sources:
      adding-place-and-time: '## Adding place and time {#adding-place-and-time role=model
        objectives=obj-dummy-det-weather-ambient-clauses-01}


        Fixed *det* remains in the sentence when you add information about where or
        when the condition applies.


        ::: examples

        - no: Det regner i Bergen.

        - en: It’s raining in Bergen.

        - no: Det snør på fjellet.

        - en: It’s snowing in the mountains.

        - no: Det blåser mye ved sjøen.

        - en: It’s very windy by the sea.

        - no: Det er kaldt om morgenen.

        - en: It’s cold in the morning.

        - no: Det er varmt inne.

        - en: It’s warm inside.

        - no: Det blir mørkt tidlig om vinteren.

        - en: It gets dark early in winter.

        :::


        The place or time expression does not become the subject. In **Det regner
        i Bergen**, Bergen is the location of the rain, not the grammatical subject
        of **regner**.


        This allows short, useful exchanges:


        ::: {.reading translation="What is the weather like in Trondheim?" dialogue_id=local-weather
        speaker_id=a speaker_name=A}

        Hvordan er været i Trondheim?

        :::


        ::: {.reading translation="It’s raining, and it’s cold." dialogue_id=local-weather
        speaker_id=b speaker_name=B}

        Det regner, og det er kaldt.

        :::


        ::: {.reading translation="What is it like at the cabin?" dialogue_id=cabin-weather
        speaker_id=a speaker_name=A}

        Hvordan er det på hytta?

        :::


        ::: {.reading translation="It’s snowing, and it gets dark early." dialogue_id=cabin-weather
        speaker_id=b speaker_name=B}

        Det snør, og det blir mørkt tidlig.

        :::


        The questions provide a setting, but the answers still need *det*. Do not
        answer with bare forms such as **er kaldt** or **snør** when giving a normal
        complete statement.


        **Respond to local weather questions**


        {{exercise: respond_to_local_weather_questions}}


        '
