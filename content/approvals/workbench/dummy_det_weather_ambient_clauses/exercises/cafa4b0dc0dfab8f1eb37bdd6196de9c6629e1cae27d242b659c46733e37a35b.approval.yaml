exercise_alignments:
  notice_fixed_det_in_the_cafe_call:
    exercise_key: notice_fixed_det_in_the_cafe_call
    checked_against:
      a-change-of-plans: 21b6f2f4ded20599db44accd02345cf2456ca8c71c43a9938b323bd9aacd4a42
    section_sources:
      a-change-of-plans: '## A change of plans {#a-change-of-plans role=orient objectives=obj-dummy-det-weather-ambient-clauses-01}


        Mina and Jonas are preparing to meet outside a café in Bergen. Mina is already
        on her way, but the weather is getting worse.


        ::: {.reading translation="Hi, Jonas. Are you on your way?" dialogue_id=cafe-call
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Hei, Jonas. Er du på vei?

        :::


        ::: {.reading translation="Not yet. What is the weather like there?" dialogue_id=cafe-call
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Ikke ennå. Hvordan er været der?

        :::


        ::: {.reading translation="It’s raining, and it’s quite windy." dialogue_id=cafe-call
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Det regner, og det blåser ganske mye.

        :::


        ::: {.reading translation="Oh no. Is it cold too?" dialogue_id=cafe-call speaker_id=jonas
        speaker_name="Jonas" character_id="jonas"}

        Å nei. Er det kaldt også?

        :::


        ::: {.reading translation="Yes, it’s cold, and it’s starting to get dark."
        dialogue_id=cafe-call speaker_id=mina speaker_name="Mina" character_id="mina"}

        Ja, det er kaldt, og det begynner å bli mørkt.

        :::


        ::: {.reading translation="Then we’ll meet inside the café." dialogue_id=cafe-call
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Da møtes vi inne på kafeen.

        :::


        ::: {.reading translation="Good idea. It’s warm and pleasant inside." dialogue_id=cafe-call
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        God idé. Det er varmt og hyggelig der inne.

        :::


        Mina uses *det* several times because she is describing weather and general
        conditions around her:


        ::: examples

        - no: Det regner.

        - en: It’s raining.

        - no: Det blåser.

        - en: It’s windy. / The wind is blowing.

        - no: Det er kaldt.

        - en: It’s cold.

        - no: Det blir mørkt.

        - en: It’s getting dark.

        - no: Det er varmt der inne.

        - en: It’s warm inside.

        :::


        In these sentences, *det* does not identify a particular object. Mina is not
        saying that some object called “it” is raining, cold, or dark. Norwegian requires
        a grammatical subject in these statements, so it uses fixed *det* when weather
        or an ambient condition has no real person or thing performing the action
        or possessing the quality.


        '
