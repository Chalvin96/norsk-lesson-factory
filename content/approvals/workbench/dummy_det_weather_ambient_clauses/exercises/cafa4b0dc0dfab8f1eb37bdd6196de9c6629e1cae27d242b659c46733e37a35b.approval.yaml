    checked_against:
      returning-to-mina-and-jonas: d41acd25c7b6e429d669cf489dcbe5e79cc7b0213513dd781aa10e67c1e3dfd0
    section_sources:
      returning-to-mina-and-jonas: '## Returning to Mina and Jonas {#returning-to-mina-and-jonas
        role=model objectives=obj-dummy-det-weather-ambient-clauses-01}


        Mina reaches the café first. Jonas calls again.


        ::: {.reading translation="Have you arrived?" dialogue_id=second-cafe-call
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Er du framme?

        :::


        ::: {.reading translation="Yes. I’m sitting inside now." dialogue_id=second-cafe-call
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Ja. Jeg sitter inne nå.

        :::


        ::: {.reading translation="Is it still raining?" dialogue_id=second-cafe-call
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Regner det fortsatt?

        :::


        ::: {.reading translation="Yes, it’s still raining, and it’s windier than
        before." dialogue_id=second-cafe-call speaker_id=mina speaker_name="Mina"
        character_id="mina"}

        Ja, det regner fortsatt, og det blåser mer enn før.

        :::


        ::: {.reading translation="What is it like inside?" dialogue_id=second-cafe-call
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Hvordan er det inne?

        :::


        ::: {.reading translation="It’s warm here. Come inside when you arrive." dialogue_id=second-cafe-call
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Det er varmt her. Kom inn når du kommer.

        :::


        The second conversation reuses the same fixed *det* in a natural development
        of the situation. Outside, **det regner** and **det blåser**. Inside, **det
        er varmt**.


        Notice that *det* can also appear in a question:


        ::: examples

        - no: Regner det?

        - en: Is it raining?

        - no: Er det kaldt?

        - en: Is it cold?

        :::


        The same fixed subject is present, even though its position changes in the
        question. This chapter’s main goal remains recognizing and using *det* when
        there is no real weather or ambient subject.


        **Restore det in Mina’s updates**


        {{exercise: restore_det_in_minas_updates}}


        '
