  distinguish_named_subject_from_ambient_det:
    exercise_key: distinguish_named_subject_from_ambient_det
    checked_against:
      named-subject-and-ambient-det: a815c9e4020617830fd0150d5b2974b0b530e75d5860b4afadd3b81e14ae4229
    section_sources:
      named-subject-and-ambient-det: '## Named subjects and ambient det {#named-subject-and-ambient-det
        role=contrast objectives=obj-dummy-det-weather-ambient-clauses-01}


        Compare the following two uses:


        ::: examples

        - no: Kaffen er kald.

        - en: The coffee is cold.

        - no: Det er kaldt.

        - en: It’s cold.

        :::


        In the first sentence, **kaffen** is the actual subject. The sentence describes
        the coffee. In the second, there is no named thing being described. The sentence
        reports the general temperature, so Norwegian uses fixed *det*.


        The same contrast appears here:


        ::: examples

        - no: Rommet er mørkt.

        - en: The room is dark.

        - no: Det er mørkt.

        - en: It’s dark.

        :::


        **Rommet er mørkt** describes a specific room. **Det er mørkt** describes
        the ambient condition without naming a specific subject.


        And here:


        ::: examples

        - no: Ovnen er varm.

        - en: The oven is hot.

        - no: Det er varmt.

        - en: It’s warm.

        :::


        The descriptive form differs because a named noun may have its own grammatical
        form:


        ::: examples

        - no: Kaffen er kald.

        - en: The coffee is cold.

        - no: Ovnen er varm.

        - en: The oven is hot.

        - no: Rommet er mørkt.

        - en: The room is dark.

        :::


        With fixed *det* in these ambient expressions, use:


        ::: examples

        - no: Det er kaldt.

        - en: It’s cold.

        - no: Det er varmt.

        - en: It’s warm.

        - no: Det er mørkt.

        - en: It’s dark.

        :::


        At this level, it is most useful to learn these as stable expressions. A common
        mistake is to copy the form used with a specific noun:


        ::: examples

        - no: ✗ Det er kald.

        - en: Incorrect for general temperature: It is cold.

        - no: Det er kaldt.

        - en: It’s cold.

        - no: ✗ Det er varm.

        - en: Incorrect for general warmth: It is warm.

        - no: Det er varmt.

        - en: It’s warm.

        :::


        The compact rule is:


        ::: {.rule}

        Use **det er + kaldt/varmt/lyst/mørkt** for a general condition with no named
        subject.

        :::


        **Distinguish named subject from ambient det**


        {{exercise: distinguish_named_subject_from_ambient_det}}


        **Build ambient-condition statements**


        {{exercise: build_ambient_condition_statements}}


        '
