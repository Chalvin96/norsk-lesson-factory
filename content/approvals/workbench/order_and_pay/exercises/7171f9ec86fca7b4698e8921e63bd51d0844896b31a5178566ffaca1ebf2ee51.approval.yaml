  responding_to_choice:
    exercise_key: responding_to_choice
    checked_against:
      choosing-between-options: fa7f31a414f950e4422f8ff4a42af5b245bddf08788291ad274f10936042bc91
    section_sources:
      choosing-between-options: '## Choosing between options {#choosing-between-options
        role=contrast objectives=obj-order-and-pay-01}


        The server may ask you to choose a size, type, or addition.


        ::: examples

        - no: Vil du ha liten eller stor kaffe?

        - en: Would you like a small or large coffee?

        :::


        ::: examples

        - no: Liten, takk.

        - en: Small, please.

        :::


        ::: examples

        - no: Vil du ha kaffe eller te?

        - en: Would you like coffee or tea?

        :::


        ::: examples

        - no: Te, takk.

        - en: Tea, please.

        :::


        ::: examples

        - no: Vil du ha melk i kaffen?

        - en: Would you like milk in the coffee?

        :::


        ::: examples

        - no: Ja takk.

        - en: Yes, please.

        :::


        ::: examples

        - no: Nei takk.

        - en: No, thank you.

        :::


        ::: examples

        - no: Med eller uten kullsyre?

        - en: With or without carbonation?

        :::


        ::: examples

        - no: Uten kullsyre, takk.

        - en: Still, please.

        :::


        A short answer is natural when the choice is already clear from the question.
        Adding takk keeps it polite.


        You can also include the option in your original order:


        ::: examples

        - no: Jeg vil gjerne ha en stor kaffe med melk.

        - en: I’d like a large coffee with milk.

        :::


        ::: examples

        - no: Kan jeg få en flaske vann uten kullsyre?

        - en: Can I have a bottle of still water?

        :::


        ::: examples

        - no: Jeg tar et rundstykke med ost.

        - en: I’ll have a bread roll with cheese.

        :::


        Notice the useful contrast:


        ::: examples

        - no: med melk

        - en: with milk

        :::


        ::: examples

        - no: uten melk

        - en: without milk

        :::


        {{exercise: responding_to_choice}}


        '
