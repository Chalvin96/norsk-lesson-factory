    checked_against:
      choosing-an-item: b72408592519bc5dbd7a0b5e1b901fe8db936079595913581ed6a3a497aab71c
    section_sources:
      choosing-an-item: '## Choosing an item {#choosing-an-item role=model objectives=obj-order-and-pay-01}


        Three useful ways to order are:


        ::: examples

        - no: Jeg vil gjerne ha en kaffe.

        - en: I’d like a coffee.

        :::


        ::: examples

        - no: Kan jeg få en kaffe?

        - en: Can I have a coffee?

        :::


        ::: examples

        - no: Jeg tar en kaffe.

        - en: I’ll have a coffee.

        :::


        Jeg vil gjerne ha is polite and useful in almost any café or shop. Gjerne
        helps make the request sound friendly.


        Kan jeg få literally means can I get. It is a natural way to ask for something
        in Norwegian.


        Jeg tar is common when you are choosing from a menu or from several visible
        items. Here, tar means will have rather than physically take.


        Compare:


        ::: examples

        - no: Jeg vil ha en kaffe.

        - en: I want a coffee.

        :::


        ::: examples

        - no: Jeg vil gjerne ha en kaffe.

        - en: I’d like a coffee.

        :::


        Both are grammatical, but the second version normally sounds more courteous
        in a transaction.


        You can use the same patterns with many items:


        ::: examples

        - no: Jeg vil gjerne ha et rundstykke med ost.

        - en: I’d like a bread roll with cheese.

        :::


        ::: examples

        - no: Kan jeg få en kopp te?

        - en: Can I have a cup of tea?

        :::


        ::: examples

        - no: Jeg tar en flaske vann.

        - en: I’ll have a bottle of water.

        :::


        {{exercise: making_first_request}}


        '
