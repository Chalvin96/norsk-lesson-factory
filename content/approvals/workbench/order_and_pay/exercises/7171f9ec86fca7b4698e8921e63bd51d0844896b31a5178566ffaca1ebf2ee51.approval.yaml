  changing_quantities:
    exercise_key: changing_quantities
    checked_against:
      saying-how-many: 9a7485615768304d804bb50321292a7e97e1561615d8ca48e2a10df913e12c42
    section_sources:
      saying-how-many: '## Saying how many {#saying-how-many role=model objectives=obj-order-and-pay-01}


        Use a number before the item when you need more than one. The one-item form
        is singular (entall); forms used for several items are plural (flertall).


        ::: examples

        - no: en kanelbolle

        - en: one cinnamon bun

        :::


        ::: examples

        - no: to kanelboller

        - en: two cinnamon buns

        :::


        ::: examples

        - no: et rundstykke

        - en: one bread roll

        :::


        ::: examples

        - no: tre rundstykker

        - en: three bread rolls

        :::


        ::: examples

        - no: en flaske vann

        - en: one bottle of water

        :::


        ::: examples

        - no: to flasker vann

        - en: two bottles of water

        :::


        The plural ending varies, so it is useful to learn common menu items in practical
        pairs: en bolle–to boller, et rundstykke–to rundstykker, en flaske–to flasker.


        In a complete order:


        ::: examples

        - no: Jeg vil gjerne ha to kanelboller.

        - en: I’d like two cinnamon buns.

        :::


        ::: examples

        - no: Kan jeg få tre rundstykker med ost?

        - en: Can I have three bread rolls with cheese?

        :::


        ::: examples

        - no: Jeg tar en kaffe og to flasker vann.

        - en: I’ll have one coffee and two bottles of water.

        :::


        When speaking quickly, café staff and customers may sometimes use shortened
        menu language. As a learner, a complete form such as to kopper kaffe or to
        kaffer makes the quantity clear.


        ::: examples

        - no: Kan jeg få to kopper kaffe?

        - en: Can I have two cups of coffee?

        :::


        ::: examples

        - no: Vi tar to kaffer.

        - en: We’ll have two coffees.

        :::


        Common quantity mistake


        Do not leave a singular item unchanged after a number when its normal plural
        form is required.


        Instead of:


        ::: examples

        - no: ✗ to kanelbolle

        - en: two cinnamon bun

        :::


        Use:


        ::: examples

        - no: to kanelboller

        - en: two cinnamon buns

        :::


        {{exercise: changing_quantities}}


        '
    outcome: approved
