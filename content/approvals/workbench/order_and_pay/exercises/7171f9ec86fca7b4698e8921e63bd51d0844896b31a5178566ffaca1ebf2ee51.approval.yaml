  confirming_payment:
    exercise_key: confirming_payment
    checked_against:
      checking-how-to-pay: 45266975ea95e47f73b6da2a6522dbba7783be0b9a759358093f06488f2af030
    section_sources:
      checking-how-to-pay: '## Checking how to pay {#checking-how-to-pay role=model
        objectives=obj-order-and-pay-01}


        The most useful payment question is:


        ::: examples

        - no: Kan jeg betale med kort?

        - en: Can I pay by card?

        :::


        For cash, use kontant:


        ::: examples

        - no: Kan jeg betale kontant?

        - en: Can I pay in cash?

        :::


        The server may ask:


        ::: examples

        - no: Vil du betale kontant eller med kort?

        - en: Would you like to pay in cash or by card?

        :::


        A short response is enough:


        ::: examples

        - no: Med kort, takk.

        - en: By card, please.

        :::


        ::: examples

        - no: Kontant, takk.

        - en: In cash, please.

        :::


        If several people are together, they may ask whether they can pay together
        or separately:


        ::: examples

        - no: Kan vi betale sammen?

        - en: Can we pay together?

        :::


        ::: examples

        - no: Vi betaler sammen.

        - en: We’re paying together.

        :::


        ::: examples

        - no: Kan vi betale hver for oss?

        - en: Can we pay separately?

        :::


        These questions still serve the same immediate goal: completing payment for
        the order.


        Common payment mistake


        English uses by card, but Norwegian uses med kort, literally with card.


        Use:


        ::: examples

        - no: Jeg betaler med kort.

        - en: I’m paying by card.

        :::


        Not:


        ::: examples

        - no: ✗ Jeg betaler av kort.

        - en: Incorrect: I’m paying of card.

        :::


        Also avoid copying English can I have with ha:


        ::: examples

        - no: Kan jeg få en kaffe?

        - en: Can I have a coffee?

        :::


        Kan jeg få is the natural request. Kan jeg ha usually asks whether you are
        allowed or able to keep or possess something, not whether a server can give
        it to you.


        {{exercise: confirming_payment}}


        '
