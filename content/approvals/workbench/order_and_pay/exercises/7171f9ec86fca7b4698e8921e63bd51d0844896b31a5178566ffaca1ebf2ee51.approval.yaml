  integrated_transaction:
    exercise_key: integrated_transaction
    checked_against:
      integrated-practice: b3a8c1957d85e0e89aef757593099feb2d30b00d5b9563877f92500d970bce76
    section_sources:
      integrated-practice: '## Integrated practice: a complete transaction {#integrated-practice
        role=recap objectives=obj-order-and-pay-01}


        Create a short café exchange between a customer and a server. Keep it tightly
        guided by the sequence from Sara and Emil’s visit:


        - The customer orders a drink and a food item.

        - The customer makes one choice about size, type, or an addition.

        - The order includes a clear quantity.

        - The customer asks for the total.

        - The customer checks or states the payment method.

        - The speakers close the transaction politely.


        Make sure the server understands exactly what the customer wants, how many
        items are needed, and how payment will be made. End the exchange clearly rather
        than stopping after the price.


        {{exercise: integrated_transaction}}


        '
