    section_sources:
      closing-the-transaction: '## Closing the transaction {#closing-the-transaction
        role=model objectives=obj-order-and-pay-01}


        A transaction needs a clear ending. When the server asks whether you want
        anything else, you can say:


        ::: examples

        - no: Nei takk, det var alt.

        - en: No, thank you, that was everything.

        :::


        ::: examples

        - no: Ikke noe mer, takk.

        - en: Nothing else, thank you.

        :::


        The server may offer a receipt:


        ::: examples

        - no: Vil du ha kvitteringen?

        - en: Would you like the receipt?

        :::


        ::: examples

        - no: Ja takk.

        - en: Yes, please.

        :::


        ::: examples

        - no: Nei takk.

        - en: No, thank you.

        :::


        Then close with a brief thanks and farewell:


        ::: examples

        - no: Takk skal du ha.

        - en: Thank you very much.

        :::


        ::: examples

        - no: Takk, ha det!

        - en: Thanks, bye!

        :::


        ::: examples

        - no: Ha en fin dag!

        - en: Have a nice day!

        :::


        Vær så god often accompanies the item, card terminal, change, or receipt.


        ::: examples

        - no: Vær så god. Her er kaffen.

        - en: Here you are. Here is the coffee.

        :::


        ::: examples

        - no: Takk.

        - en: Thank you.

        :::


        ::: examples

        - no: Bare hyggelig.

        - en: You’re welcome.

        :::


        '
