  review_yes-no-question-report:
    exercise_key: review_yes-no-question-report
    checked_against:
      reporting-yes-or-no-questions-with-om: 97607b190d5de1a05c6fc37b6ce490d556b64eeeb5d7f8e875614c705393cdea
    section_sources:
      reporting-yes-or-no-questions-with-om: '## Reporting yes-or-no questions with
        om {#reporting-yes-or-no-questions-with-om role=contrast objectives=obj-indirect-speech-01}


        A yes-or-no question has no question word such as hva, hvor or når. In indirect
        speech, it normally begins with **om**, meaning whether or if.


        **Original question**


        ::: examples

        - no: Kan vi flytte presentasjonen?

        - en: Can we move the presentation?

        :::


        **Reported question**


        ::: examples

        - no: Liv spurte om vi kunne flytte presentasjonen.

        - en: Liv asked whether we could move the presentation.

        :::


        The original question uses verb–subject order:


        ::: examples

        - no: Kommer Liv tilbake i dag?

        - en: Is Liv coming back today?

        :::


        The reported question is a subordinate clause. It therefore uses subject–verb
        order:


        ::: examples

        - no: Amir spurte om Liv kom tilbake den dagen.

        - en: Amir asked whether Liv was coming back that day.

        :::


        Compare the structures:


        ::: examples

        - no: Har Amir ringt kundene?

        - en: Has Amir called the clients?

        - no: Sara spurte om Amir hadde ringt kundene.

        - en: Sara asked whether Amir had called the clients.

        - no: Jobber ikke Liv hjemme i dag?

        - en: Isn’t Liv working from home today?

        - no: Sara spurte om Liv ikke jobbet hjemme den dagen.

        - en: Sara asked whether Liv was not working from home that day.

        :::


        The report is not written as a direct question. It has no question mark when
        the whole sentence is a statement, and it does not retain question inversion.


        Incorrect:


        ::: examples

        - no: ✗ Sara spurte om hadde Amir ringt kundene.

        - en: ''Incorrect: Sara asked whether had Amir called the clients.''

        :::


        Natural Bokmål:


        ::: examples

        - no: Sara spurte om Amir hadde ringt kundene.

        - en: Sara asked whether Amir had called the clients.

        :::


        The compact rule is: use om for a reported yes-or-no question, then use subordinate
        word order.


        {{exercise: yes-no-question-report}}


        '
