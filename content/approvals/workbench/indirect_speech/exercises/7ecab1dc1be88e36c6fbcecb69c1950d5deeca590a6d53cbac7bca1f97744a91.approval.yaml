    section_sources:
      back-at-the-office: '## Back at the office {#back-at-the-office role=model objectives=obj-indirect-speech-01}


        Later, Sara phones Liv. She now has to pass on what Jonas told her.


        **Liv**


        ::: {.reading translation="Did you find out what Jonas said about me?" dialogue_id="phone-relay"
        speaker_id="liv" speaker_name="Liv" character_id="liv"}

        Fikk du vite hva Jonas sa om meg?

        :::


        **Sara**


        ::: {.reading translation="Yes. Jonas said that your train was cancelled and
        that you were working from home." dialogue_id="phone-relay" speaker_id="sara"
        speaker_name="Sara" character_id="sara"}

        Ja. Jonas sa at toget ditt var innstilt, og at du jobbet hjemmefra.

        :::


        **Sara**


        ::: {.reading translation="He also said that you had asked him to send the
        clients a message." dialogue_id="phone-relay" speaker_id="sara" speaker_name="Sara"
        character_id="sara"}

        Han fortalte også at du hadde bedt ham om å sende kundene en melding.

        :::


        **Liv**


        ::: {.reading translation="Did he say that Amir had already spoken to them?"
        dialogue_id="phone-relay" speaker_id="liv" speaker_name="Liv" character_id="liv"}

        Sa han at Amir allerede hadde snakket med dem?

        :::


        **Sara**


        ::: {.reading translation="Yes, he said that Amir had already done so." dialogue_id="phone-relay"
        speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Ja, han sa at Amir allerede hadde gjort det.

        :::


        **Liv**


        ::: {.reading translation="Great. Did Amir ask when I was coming back?" dialogue_id="phone-relay"
        speaker_id="liv" speaker_name="Liv" character_id="liv"}

        Flott. Spurte Amir når jeg kom tilbake?

        :::


        **Sara**


        ::: {.reading translation="Yes. Jonas said that Amir had asked when you were
        coming back to the office." dialogue_id="phone-relay" speaker_id="sara" speaker_name="Sara"
        character_id="sara"}

        Ja. Jonas sa at Amir hadde spurt når du kom tilbake til kontoret.

        :::


        The same information has now passed through more than one person. Pronouns
        change again because Sara is speaking directly to Liv: Jonas’s hun becomes
        Sara’s du. The time relationships also become more layered: Amir asked first,
        Jonas reported his question later, and Sara is now reporting Jonas’s account.


        Even in a longer chain, the core decisions remain the same:


        - Use at to report a statement.

        - Use om for a yes-or-no question.

        - Keep the question word in an information question; use hvem or hva + som
        when the question word is the clause subject.

        - Use subordinate word order inside the report.

        - Report commands and requests with a structure such as be noen om å.

        - Choose tense, pronouns, and time or place expressions from the current reporting
        viewpoint.


        {{exercise: office-message-relay}}


        '
