    section_sources:
      a-missed-meeting: '## A missed meeting {#a-missed-meeting role=orient objectives=obj-indirect-speech-01}


        Sara arrives at the office after a delayed bus. She has missed the morning
        meeting, and Jonas tells her what the others said.


        **Sara**


        ::: {.reading translation="I didn’t make it to the meeting. What did Liv say?"
        dialogue_id="office" speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Jeg rakk ikke møtet. Hva sa Liv?

        :::


        **Jonas**


        ::: {.reading translation="She said that the train to Bergen was cancelled,
        so she was working from home." dialogue_id="office" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Hun sa at toget til Bergen var innstilt, så hun jobbet hjemmefra.

        :::


        **Sara**


        ::: {.reading translation="Did she ask whether we could move the presentation?"
        dialogue_id="office" speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Spurte hun om vi kunne flytte presentasjonen?

        :::


        **Jonas**


        ::: {.reading translation="Yes. She asked whether we could do it tomorrow."
        dialogue_id="office" speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Ja. Hun spurte om vi kunne ta den i morgen.

        :::


        **Jonas**


        ::: {.reading translation="She also asked me to send the clients a message
        today." dialogue_id="office" speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Hun ba meg også om å sende kundene en melding i dag.

        :::


        **Sara**


        ::: {.reading translation="What did Amir say?" dialogue_id="office" speaker_id="sara"
        speaker_name="Sara" character_id="sara"}

        Hva sa Amir?

        :::


        **Jonas**


        ::: {.reading translation="He said that he had already spoken to them." dialogue_id="office"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Han sa at han allerede hadde snakket med dem.

        :::


        **Jonas**


        ::: {.reading translation="He also asked when Liv was coming back to the office."
        dialogue_id="office" speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Han spurte også når Liv kom tilbake til kontoret.

        :::


        **Sara**


        ::: {.reading translation="She was going to come back today, wasn’t she?"
        dialogue_id="office" speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Hun skulle komme tilbake i dag, ikke sant?

        :::


        **Jonas**


        ::: {.reading translation="Yes. When she called yesterday, she said that she
        would come back here today." dialogue_id="office" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Ja. Da hun ringte i går, sa hun at hun skulle komme tilbake hit i dag.

        :::


        **Sara**


        ::: {.reading translation="Can you ask her to call me when she arrives?" dialogue_id="office"
        speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Kan du be henne om å ringe meg når hun er framme?

        :::


        **Jonas**


        ::: {.reading translation="Yes, I’ll say that you want her to call you." dialogue_id="office"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Ja, jeg skal si at du vil at hun skal ringe deg.

        :::


        Sara needs more than Liv’s exact words. She needs to know who said what, whether
        something was a statement, a question, or a request, and whether the message
        still applies now. Jonas therefore uses **indirect speech (indirekte tale)**:
        he reports the content of someone’s words without repeating the original conversation
        exactly.


        Notice the three main patterns in the scene:


        ::: examples

        - no: Hun sa at toget var innstilt.

        - en: She said that the train was cancelled.

        - no: Hun spurte om vi kunne flytte presentasjonen.

        - en: She asked whether we could move the presentation.

        - no: Hun ba meg om å sende kundene en melding.

        - en: She asked me to send the clients a message.

        :::


        The type of original message determines how the report begins, and the resulting
        subordinate clause structure determines word order. The reporting viewpoint
        guides tense, pronouns, and expressions such as i dag and her.


        {{exercise: anchor-message-map}}


        '
