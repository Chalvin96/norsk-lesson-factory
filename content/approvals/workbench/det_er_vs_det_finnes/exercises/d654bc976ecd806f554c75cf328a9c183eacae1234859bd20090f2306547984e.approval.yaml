  misconception-repair:
    exercise_key: misconception-repair
    checked_against:
      common-mistakes: 71ab692dcaff43e60c09edc5d13e7cd7763dc8973157ccf29918655a670db5da
    section_sources:
      common-mistakes: '## Common mistakes {#common-mistakes role=contrast objectives=obj-det-er-vs-det-finnes-01}


        **Using det finnes to describe a known thing**


        Avoid:


        ::: examples

        - no: Rommet finnes stort og lyst.

        - en: ''Not: The room is large and bright. (in this situation)''

        :::


        Here, the sentence describes the room. Use **det er**:


        ::: examples

        - no: Rommet er stort og lyst. Det er også stille.

        - en: The room is large and bright. It is also quiet.

        :::


        **Finnes** does not work as a substitute for every form of English *is* or
        *are*.


        **Confusing a general availability question with a question about one room**


        If a guest wants to know whether rooms are available, the intended meaning
        is existence or availability:


        ::: examples

        - no: Finnes det ledige rom i helgen?

        - en: Are there rooms available this weekend?

        :::


        A question such as **Er rommet ledig?** has a different context: it asks whether
        one particular, already identified room is available.


        ::: examples

        - no: Finnes det ledige rom?

        - en: Are there any rooms available?

        - no: Er rommet ledig?

        - en: Is the room available?

        :::


        The first asks whether any suitable rooms exist. **Er det ledige rom?** is
        also a natural way to ask this. The second asks about a specific room.


        **Changing finnes for a plural noun**


        Do not create a separate plural form after **det**. Keep **finnes**:


        ::: examples

        - no: Det finnes ett ledig rom.

        - en: There is one room available.

        - no: Det finnes fem ledige rom.

        - en: There are five rooms available.

        :::


        {{exercise: misconception-repair}}


        '
