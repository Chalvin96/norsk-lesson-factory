  new-to-known-sequence:
    exercise_key: new-to-known-sequence
    checked_against:
      controlled-choice-to-connected-use: dbcfe6323e8fdaf7a49da240c629c9db686cf3d440005555d042ca79a017a582
    section_sources:
      controlled-choice-to-connected-use: '## From controlled choice to short connected
        use {#controlled-choice-to-connected-use role=model objectives=obj-det-er-vs-det-finnes-01}


        Imagine that Jonas sends Sara a message while exploring the hotel. He tells
        her that a small gym is available downstairs. Then he identifies the door
        and describes the room.


        His message needs to move through three stages:


        1. Announce that the gym exists.

        2. Identify which door leads to it.

        3. Describe the gym.


        The target forms make that progression clear:


        ::: examples

        - no: Det finnes et lite treningsrom i kjelleren.

        - en: There is a small gym in the basement.

        - no: Det er døra ved siden av heisen.

        - en: It is the door next to the lift.

        - no: Det er lyst og ganske moderne.

        - en: It is bright and quite modern.

        :::


        The first sentence gives Sara new information. The next two sentences identify
        and describe something now established in the conversation.


        {{exercise: new-to-known-sequence}}


        '
