  hotel-dialogue-completion:
    exercise_key: hotel-dialogue-completion
    checked_against:
      returning-to-sara-and-jonas: a221a0e9abccfddc315aefcc2cdb2a397b9227157bb112a15aca67164b03fb88
    section_sources:
      returning-to-sara-and-jonas: '## Returning to Sara and Jonas {#returning-to-sara-and-jonas
        role=model objectives=obj-det-er-vs-det-finnes-01}


        Sara and Jonas come back to reception later that afternoon.


        ::: {.reading translation="Now we’re back. Is the room ready?" dialogue_id="hotel-return"
        speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Nå er vi tilbake. Er rommet klart?

        :::


        ::: {.reading translation="Yes, it is ready. Here is the key." dialogue_id="hotel-return"
        speaker_id="ingrid" speaker_name="Ingrid" character_id="ingrid"}

        Ja, det er klart. Her er nøkkelen.

        :::


        ::: {.reading translation="Thank you. Are there towels in the room?" dialogue_id="hotel-return"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Takk. Finnes det håndklær på rommet?

        :::


        ::: {.reading translation="Yes, there are towels in the bathroom." dialogue_id="hotel-return"
        speaker_id="ingrid" speaker_name="Ingrid" character_id="ingrid"}

        Ja, det finnes håndklær på badet.

        :::


        ::: {.reading translation="And internet?" dialogue_id="hotel-return" speaker_id="sara"
        speaker_name="Sara" character_id="sara"}

        Og internett?

        :::


        ::: {.reading translation="There is free Wi-Fi throughout the hotel. The password
        is printed on the key card." dialogue_id="hotel-return" speaker_id="ingrid"
        speaker_name="Ingrid" character_id="ingrid"}

        Det finnes gratis trådløst internett på hele hotellet. Passordet står på nøkkelkortet.

        :::


        ::: {.reading translation="Is it this password?" dialogue_id="hotel-return"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Er det dette passordet?

        :::


        ::: {.reading translation="Yes, it is correct." dialogue_id="hotel-return"
        speaker_id="ingrid" speaker_name="Ingrid" character_id="ingrid"}

        Ja, det er riktig.

        :::


        The dialogue now moves back and forth between the two meanings:


        - **Det er klart** describes the known room.

        - **Det finnes håndklær** states that towels are available.

        - **Det finnes gratis trådløst internett** announces the availability of a
        service.

        - **Det er riktig** describes the password Jonas has identified.


        {{exercise: hotel-dialogue-completion}}


        '
