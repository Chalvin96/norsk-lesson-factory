  availability-question:
    exercise_key: availability-question
    checked_against:
      questions-about-existence: d3866596cb1acccda893bd1cecef0abb9e73be73b4885e5bd6cc3a0bcab0740a
    section_sources:
      questions-about-existence: '## Questions about existence {#questions-about-existence
        role=model objectives=obj-det-er-vs-det-finnes-01}


        To ask whether something exists or is available, place **finnes** before **det**:


        ::: examples

        - no: Finnes det en kafé på hotellet?

        - en: Is there a café at the hotel?

        - no: Finnes det ledige rom i kveld?

        - en: Are there rooms available tonight?

        - no: Finnes det en buss til sentrum?

        - en: Is there a bus to the town centre?

        :::


        The question asks about existence or availability. It does not ask for a description
        of a known café, room, or bus.


        Compare:


        ::: examples

        - no: Finnes det en restaurant på hotellet?

        - en: Is there a restaurant at the hotel?

        - no: Er restauranten åpen?

        - en: Is the restaurant open?

        :::


        The first question establishes whether a restaurant exists. The second asks
        for information about a restaurant that is already known.


        {{exercise: availability-question}}


        '
