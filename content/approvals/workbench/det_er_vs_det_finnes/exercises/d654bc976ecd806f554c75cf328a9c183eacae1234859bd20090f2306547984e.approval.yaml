        Use **det er** when you tell someone what a person or thing is, or when you
        give information about it.


        **Identifying something**


        ::: examples

        - no: Det er hotellet vårt.

        - en: That is our hotel.

        - no: Det er resepsjonisten.

        - en: That is the receptionist.

        - no: Det er rom 214.

        - en: It is room 214.

        - no: Det er nøkkelen din.

        - en: That is your key.

        :::


        In each example, the speaker points out or identifies a particular person
        or thing. The meaning is not simply that a hotel, receptionist, room, or key
        exists. The speaker tells us which person or thing we are looking at or talking
        about.


        Compare:


        ::: examples

        - no: Det er hotellet vårt.

        - en: That is our hotel.

        - no: Det finnes et hotell ved stasjonen.

        - en: There is a hotel by the station.

        :::


        The first sentence identifies a particular building as *our hotel*. The second
        tells us that a hotel exists in a particular place.


        **Describing something**


        Once a person, place, or thing is part of the conversation, **det er** can
        describe it.


        ::: examples

        - no: Det er stort.

        - en: It is large.

        - no: Det er ganske dyrt.

        - en: It is quite expensive.

        - no: Det er åpent hele natten.

        - en: It is open all night.

        - no: Det er nær sentrum.

        - en: It is near the town centre.

        :::


        The surrounding context tells us what **det** refers to. For example:


        ::: examples

        - no: Hvordan er rommet? Det er lyst og stille.

        - en: What is the room like? It is bright and quiet.

        - no: Hvor er frokostsalen? Den er i første etasje.

        - en: Where is the breakfast room? It is on the first floor.

        :::


        The thing is already known: *the room* or *the breakfast room*. The answer
        supplies a description or location. Use **det** for the neuter noun **rommet**,
        but **den** for the masculine noun **frokostsalen**.


        {{exercise: known-thing-description}}


        '
    outcome: approved
    note: null
    reason: null
