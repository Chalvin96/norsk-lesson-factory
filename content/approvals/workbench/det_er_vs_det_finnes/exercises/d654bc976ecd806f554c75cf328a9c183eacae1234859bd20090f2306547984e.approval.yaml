  location-meaning-contrast:
    exercise_key: location-meaning-contrast
    checked_against:
      same-place-two-different-messages: db7628535357520bb7e0dbba9e6f03902b1032599ed7f0ec85921527df3c01b6
    section_sources:
      same-place-two-different-messages: '## The same place, two different messages
        {#same-place-two-different-messages role=contrast objectives=obj-det-er-vs-det-finnes-01}


        A location phrase does not decide the form by itself. Both expressions can
        occur with a location, but the speaker’s purpose differs.


        ::: examples

        - no: Det finnes en kafé på torget.

        - en: There is a café in the town square.

        - no: Det er den røde bygningen på torget.

        - en: It is the red building in the town square.

        :::


        The first sentence announces that a café exists. The second identifies which
        building the café is.


        Another pair:


        ::: examples

        - no: Det finnes et bagasjerom ved resepsjonen.

        - en: There is a luggage room by reception.

        - no: Det er ved resepsjonen.

        - en: It is by reception.

        :::


        In the first sentence, the luggage room is new information. In the second,
        the listener already knows that there is a luggage room and asks where it
        is.


        Consider a short exchange:


        ::: {.reading translation="Is there a pharmacy nearby?" dialogue_id="pharmacy-location"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Finnes det et apotek i nærheten?

        :::


        ::: {.reading translation="Yes, there is a pharmacy by the bus station." dialogue_id="pharmacy-location"
        speaker_id="ingrid" speaker_name="Ingrid" character_id="ingrid"}

        Ja, det finnes et apotek ved busstasjonen.

        :::


        ::: {.reading translation="Which building is it?" dialogue_id="pharmacy-location"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Hvilken bygning er det?

        :::


        ::: {.reading translation="It is the yellow building next to the bakery."
        dialogue_id="pharmacy-location" speaker_id="ingrid" speaker_name="Ingrid"
        character_id="ingrid"}

        Det er den gule bygningen ved siden av bakeriet.

        :::


        First Ingrid confirms existence. Then she identifies the building. The physical
        place has not changed, but the communicative job has.


        **Compact rule**


        Ask what the sentence contributes:


        - If it tells the listener **what or which thing it is**, or **what that known
        thing is like**, use **det er**.

        - If it tells the listener **that something exists or is available**, both
        **det er** and **det finnes** are possible. **Finnes** emphasizes existence
        or availability.


        {{exercise: location-meaning-contrast}}


        '
    outcome: approved
    note: null
