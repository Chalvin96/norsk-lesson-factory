  neighbourhood-information-transfer:
    exercise_key: neighbourhood-information-transfer
    checked_against:
      transfer-to-a-neighbourhood: 17c1d5ab13f1a47b884cbb07007a73e3248f2e8383c19a93260fe83a380fecb3
    section_sources:
      transfer-to-a-neighbourhood: '## Transfer to a new situation: a neighbourhood
        visit {#transfer-to-a-neighbourhood role=recap objectives=obj-det-er-vs-det-finnes-01}


        The next day, Sara and Jonas visit Jonas’s friend Emil, who has recently moved
        to a new neighbourhood. The setting changes, but the same meaning choice remains
        useful.


        Emil might introduce the area like this:


        ::: examples

        - no: Det finnes en matbutikk rett rundt hjørnet.

        - en: There is a grocery shop just around the corner.

        - no: Det finnes også et bibliotek i nærheten.

        - en: There is also a library nearby.

        :::


        When Sara sees a building and asks about it, Emil identifies it:


        ::: examples

        - no: Det er biblioteket.

        - en: That is the library.

        :::


        He can then describe it:


        ::: examples

        - no: Det er nytt og veldig lyst.

        - en: It is new and very bright.

        :::


        If Jonas asks about transport, he asks whether a service exists:


        ::: examples

        - no: Finnes det en buss til sentrum?

        - en: Is there a bus to the town centre?

        :::


        Emil can give the departure frequency and then identify the stop. Use **går**
        for recurring bus departures:


        ::: examples

        - no: Ja, det går en buss hvert tiende minutt.

        - en: Yes, a bus leaves every ten minutes.

        - no: Det er holdeplassen på den andre siden av gata.

        - en: It is the stop on the other side of the street.

        :::


        {{exercise: neighbourhood-information-transfer}}


        '
