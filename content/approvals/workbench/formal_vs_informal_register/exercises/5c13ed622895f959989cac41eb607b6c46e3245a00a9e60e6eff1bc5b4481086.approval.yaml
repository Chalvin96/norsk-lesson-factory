      integrated-practice: '## Integrated practice: one situation, three tones {#integrated-practice
        role=recap objectives=obj-formal-vs-informal-register-01}


        Work with the same practical event: a meeting has attracted more participants
        than expected, and the room must be changed.


        First, write a concise internal chat message to a close colleague who already
        knows about the meeting. Then write a complete email request to an unfamiliar
        building coordinator. Finally, write a neutral update for all meeting participants
        after the room has been changed.


        Your texts should preserve the same facts while making each version clearly
        appropriate to its audience, genre and purpose.


        After drafting, compare the three versions. Check whether the chat depends
        appropriately on shared context, whether the professional request is clear
        without sounding commanding, and whether the participant update avoids unnecessary
        conversational detail.


        {{exercise: integrated_three_tones}}


        '
