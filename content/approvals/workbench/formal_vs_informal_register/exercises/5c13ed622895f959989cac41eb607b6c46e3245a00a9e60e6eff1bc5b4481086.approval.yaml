      directness-requests: d23330e2e3aec43667686fc91bd1d164f5cf2abd49add6ad125e3f8d647c01b5
    section_sources:
      directness-requests: '## Directness: commands, requests and reasons {#directness-requests
        role=model objectives=obj-formal-vs-informal-register-01}


        Norwegian workplace communication is often relatively direct. Professional
        does not mean vague, excessively apologetic or full of elaborate politeness.
        Still, a command can sound abrupt when one person is asking another for a
        favor.


        **Direct instructions**


        The imperative is useful when the action is routine, urgent or clearly part
        of the listener’s responsibility.


        ::: examples

        - no: Ring meg når du kommer fram.

        - en: Call me when you arrive.

        - no: Legg rapporten i prosjektmappen.

        - en: Put the report in the project folder.

        - no: Evakuer bygningen umiddelbart.

        - en: Evacuate the building immediately.

        :::


        A direct instruction can also be softened with **takk**, but **takk** does
        not automatically turn every command into a polite request.


        ::: examples

        - no: Send rapporten innen klokka to, takk.

        - en: Send the report by two o’clock, please.

        :::


        Depending on the relationship and tone, this can sound efficient, authoritative
        or impatient.


        **Requests with kan**


        **Kan du …?** is common and neutral. It works in both conversational and professional
        settings.


        ::: examples

        - no: Kan du sende meg den nyeste versjonen?

        - en: Can you send me the latest version?

        - no: Kan du gi meg beskjed når rommet er bekreftet?

        - en: Can you let me know when the room has been confirmed?

        :::


        Among colleagues, this may be all the softening needed.


        **More tentative requests with kunne**


        **Kunne du …?** creates a more tentative request. It is especially useful
        when the task is inconvenient, the relationship is less familiar or the writer
        wants to avoid sounding demanding.


        ::: examples

        - no: Kunne du sett på dette før møtet?

        - en: Could you look at this before the meeting?

        - no: Kunne du sendt oss en oppdatert oversikt?

        - en: Could you send us an updated overview?

        - no: Kunne du sendt meg en oversikt over eventuelle større rom som er ledige?

        - en: Could you send me an overview of any larger rooms that are available?

        :::


        This phrasing fits because Eirik must investigate the options and respond
        quickly.


        **Requests with har du anledning til**


        **Har du anledning til å …?** asks whether the person has the opportunity
        or availability to do something. It often sounds considerate and professional.


        ::: examples

        - no: Har du anledning til å delta på et kort møte i morgen?

        - en: Are you available to attend a short meeting tomorrow?

        - no: Har du anledning til å sende dokumentene innen torsdag?

        - en: Would you be able to send the documents by Thursday?

        :::


        It is less suitable when the action is a firm requirement rather than an optional
        request. If a deadline is fixed, state it clearly.


        ::: examples

        - no: Dokumentene må sendes innen torsdag.

        - en: The documents must be sent by Thursday.

        :::


        A request and a requirement should not be confused merely to sound polite.


        **Give a useful reason**


        A brief reason can make a request feel reasonable rather than arbitrary.


        ::: examples

        - no: Kan du sende meg deltakerlisten?

        - en: Can you send me the participant list?

        - no: Kan du sende meg deltakerlisten i løpet av dagen? Vi må bestille adgangskort
        før klokka fire.

        - en: Can you send me the participant list during the day? We have to order
        access cards before four o’clock.

        :::


        The second version explains both the deadline and its purpose. The reader
        can understand why prompt action matters.


        Useful framing expressions include:


        ::: examples

        - no: Vi har fått flere påmeldinger enn forventet.

        - en: We have received more registrations than expected.

        - no: For at vi skal rekke fristen, trenger vi svar innen onsdag.

        - en: In order for us to meet the deadline, we need an answer by Wednesday.

        - no: Hvis det er mulig, ønsker vi en avklaring i løpet av dagen.

        - en: If possible, we would like clarification during the day.

        - no: Det haster fordi møtet finner sted allerede i morgen.

        - en: It is urgent because the meeting is taking place as early as tomorrow.

        :::


        **Hvis det er mulig** makes a request sound less absolute. Do not use it if
        the deadline is genuinely non-negotiable.


        **Checkpoint: build a professional request**


        Using Nora’s room problem, transform a direct command into a short professional
        request. Include the action, a realistic deadline and the reason for that
        deadline. Keep the message concise.


        {{exercise: build_professional_request}}


        '
