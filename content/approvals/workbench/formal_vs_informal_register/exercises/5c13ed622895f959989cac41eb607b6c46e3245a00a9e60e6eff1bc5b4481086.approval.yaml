    section_sources:
      closings-tone: '## Closings complete the tone {#closings-tone role=model objectives=obj-formal-vs-informal-register-01}


        Nora’s first closing, **Ha det!**, is natural in conversation and friendly
        messages.


        ::: examples

        - no: Ha det!

        - en: Bye!

        - no: Vi snakkes!

        - en: Speak soon!

        - no: Takk, vi ses i morgen.

        - en: Thanks, see you tomorrow.

        :::


        In a professional email, common closings include:


        ::: examples

        - no: Vennlig hilsen

        - en: Kind regards

        - no: Med vennlig hilsen

        - en: Kind regards

        - no: På forhånd takk for hjelpen.

        - en: Thank you in advance for your help.

        - no: Takk for at du ser på saken.

        - en: Thank you for looking into the matter.

        - no: Jeg ser fram til å høre fra deg.

        - en: I look forward to hearing from you.

        :::


        **Vennlig hilsen** is neutral and widely useful. **Med vennlig hilsen** is
        slightly more traditional but still common. A simple **Hilsen** can sound
        less formal and may suit familiar professional contacts.


        ::: examples

        - no: Hilsen Nora

        - en: Regards, Nora

        :::


        The closing should match the rest of the message. A highly ceremonial closing
        after a casual, abbreviated message creates an uneven tone.


        Uneven:


        ::: examples

        - no: Hei! Trenger svar fort. Med vennlig hilsen Nora Vik

        - en: Hi! Need an answer quickly. Kind regards, Nora Vik

        :::


        More consistent:


        ::: examples

        - no: Hei, kan du gi meg en avklaring i løpet av dagen? Takk for hjelpen.
        Vennlig hilsen Nora Vik

