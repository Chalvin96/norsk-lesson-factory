  review_register_choice:
    exercise_key: review_register_choice
    checked_against:
      register-situation: 64bf9b0a5d3764c059d8e8e06e32442ae2c94277d9cf4ad8e4de8760fd316bfd
    section_sources:
      register-situation: '## Register: choosing language for the situation {#register-situation
        role=model objectives=obj-formal-vs-informal-register-01}


        The level and style of language used in a situation is called **register (språkregister)**.
        Register is not simply a choice between formal and informal language. It depends
        on several connected questions:


        - Who is the reader or listener?

        - How well do the people know each other?

        - What kind of text or conversation is this?

        - What is its purpose?

        - How much pressure or inconvenience does the request create?


        Nora is not writing to a close friend. She is contacting someone she knows
        only through work, and she needs him to solve a problem quickly. Her first
        draft communicates the basic information, but its commands and exclamation
        marks make the request sound more demanding than she intends.


        Her revised version does not hide the urgency. Instead, it gives a reason,
        turns the command into a request and states the deadline calmly.


        Compare the central request:


        ::: examples

        - no: Send meg en oversikt over ledige rom i morgen.

        - en: Send me an overview of available rooms tomorrow.

        - no: Kunne du sendt meg en oversikt over eventuelle større rom som er ledige?

        - en: Could you send me an overview of any larger rooms that are available?

        :::


        The first sentence is grammatically correct. It may be suitable when authority,
        routine or urgency makes a direct instruction appropriate. The second is more
        suitable when asking a professional contact for assistance.


        **Checkpoint: notice the relationship**


        Read Nora’s draft and revised email again. Identify the expressions that reveal
        the relationship between Nora and Eirik, the inconvenience involved and the
        purpose of the message. Then explain which changes make the revised email
        sound cooperative rather than commanding.


        {{exercise: notice_relationship}}


        '
