  review_marker_effect:
    exercise_key: review_marker_effect
    checked_against:
      conversational-markers: 39a922064be4ff48a2c61bcaf276fdc40bf5b504b03e72dec9575be252cdaae0
    section_sources:
      conversational-markers: '## Conversational markers and their effect {#conversational-markers
        role=model objectives=obj-formal-vs-informal-register-01}


        Spoken and informal Norwegian often uses small words that organize the conversation
        or express the speaker’s attitude. These are **conversational markers (samtalemarkører)**.
        They can make language sound natural, but their effect depends heavily on
        context and tone.


        **Bare**


        **Bare** can make a suggestion or request feel casual and low-pressure.


        ::: examples

        - no: Bare send meg en melding når du vet mer.

        - en: Just send me a message when you know more.

        - no: Du kan bare legge dokumentene på pulten min.

        - en: You can just put the documents on my desk.

        :::


        In friendly conversation, this can sound relaxed. In some instructions, however,
        **bare** may minimize a task that is actually difficult.


        ::: examples

        - no: Du kan bare flytte møtet til et annet rom.

        - en: You can just move the meeting to another room.

        :::


        If changing the room involves contacting participants and updating equipment,
        **bare** may sound dismissive.


        **Jo**


        **Jo** often signals that information is known, expected or relevant to both
        speakers.


        ::: examples

        - no: Vi trenger jo plass til alle deltakerne.

        - en: We do, after all, need room for all the participants.

        - no: Du kjenner jo bygget bedre enn jeg gjør.

        - en: You know the building better than I do, after all.

        - no: Dette har jeg jo forklart før.

        - en: I have explained this before, you know.

        :::


        Among colleagues, **jo** can create a sense of shared understanding. In a
        disagreement, it can also imply that the other person should already know
        or accept something.


        That sentence may sound impatient or reproachful. It is risky in a sensitive
        professional exchange.


        **Vel**


        **Vel** can make a statement tentative or invite agreement.


        ::: examples

        - no: Vi rekker vel møtet hvis vi går nå.

        - en: We’ll probably make the meeting if we leave now.

        - no: Det blir vel litt trangt med førti personer.

        - en: It will probably be a little cramped with forty people.

        :::


        It is natural in conversation but can weaken a statement that should be precise.


        Less suitable in a firm written requirement:


        ::: examples

        - no: Vi trenger vel svar innen fredag.

        - en: We probably need an answer by Friday.

        :::


        Clearer:


        ::: examples

        - no: Vi trenger svar innen fredag.

        - en: We need an answer by Friday.

        :::


        **Altså**


        **Altså** has several conversational uses. It can introduce a conclusion,
        clarify a point or add emotional emphasis.


        ::: examples

        - no: Det finnes ingen større rom. Vi må altså begrense antallet deltakere.

        - en: There are no larger rooms. We must therefore limit the number of participants.

        :::


        Here, **altså** marks a logical conclusion and can work in careful speech
        or writing.


        ::: examples

        - no: Ellers blir det trangt, altså.

        - en: Otherwise it’ll be cramped, you know.

        :::


        In Nora’s chat message, it adds emphasis. This use sounds conversational.
        In a professional email, it may seem too emotional or spoken.


        **Faktisk**


        **Faktisk** highlights that something is true, often contrary to expectation.


        ::: examples

        - no: Det største rommet er faktisk ledig.

        - en: The largest room is actually available.

        :::


        It can be useful when the contrast matters. Overused, it may sound as if the
        writer is correcting or challenging the reader.


        Compare:


        ::: examples

        - no: Vi har faktisk allerede sendt skjemaet.

        - en: We have actually already sent the form.

        - no: Skjemaet ble sendt på mandag. Jeg legger ved en kopi her.

        - en: The form was sent on Monday. I am attaching a copy here.

        :::


        The second version may be better if the aim is to correct a misunderstanding
        without sounding defensive.


        **Checkpoint: control conversational markers**


        Review the exchange between Nora and Jonas and decide what attitude each marker
        adds.


        {{exercise: control_conversational_markers}}


        Then write a neutral professional update to Eirik that preserves the facts.


        {{exercise: markers_neutral_professional_update}}


        '
