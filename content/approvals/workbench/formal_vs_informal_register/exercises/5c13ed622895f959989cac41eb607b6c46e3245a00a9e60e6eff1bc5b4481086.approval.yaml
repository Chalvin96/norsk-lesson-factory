        role=recap objectives=obj-formal-vs-informal-register-01}


        Work with the same practical event: a meeting has attracted more participants
        than expected, and the room must be changed.


        First, write a concise internal chat message to a close colleague who already
        knows about the meeting. Then write a complete email request to an unfamiliar
        building coordinator. Finally, write a neutral update for all meeting participants
