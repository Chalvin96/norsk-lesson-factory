  review_greeting:
    exercise_key: review_greeting
    checked_against:
      greetings-relationship: 356b6a301a583cdd82ec286be0735835e65f7f784425ac0fdf4ed404fae759f8
    section_sources:
      greetings-relationship: '## Greetings establish the relationship {#greetings-relationship
        role=model objectives=obj-formal-vs-informal-register-01}


        A greeting gives the reader an immediate signal about tone. In contemporary
        Norwegian, **Hei** is extremely flexible. It is common in private messages,
        workplace communication and many professional emails.


        ::: examples

        - no: Hei Eirik,

        - en: Hi Eirik,

        - no: Hei alle sammen,

        - en: Hello everyone,

        - no: Hei, og takk for sist.

        - en: Hello, and thank you for last time.

        :::


        The greeting does not become professional merely by becoming longer. What
        matters is whether it suits the relationship and genre.


        **Kjære** can sound warm, personal or ceremonial. It is natural in personal
        letters and certain formal addresses, but it is not automatically the best
        opening for an ordinary workplace request.


        ::: examples

        - no: Kjære bestemor,

        - en: Dear Grandma,

        - no: Kjære kolleger,

        - en: Dear colleagues,

        :::


        **God morgen** and **God dag** may suit spoken encounters, customer service
        or messages where the time and setting make them natural.


        ::: examples

        - no: God morgen. Jeg har en avtale med rådgiveren klokka ni.

        - en: Good morning. I have an appointment with the adviser at nine.

        :::


        In a message to an unknown organization, the recipient can be named by role
        if no person is known.


        ::: examples

        - no: Til kundeservice,

        - en: To customer service,

        :::


        A bare opening such as **Hei!** can feel friendly and energetic, but repeated
        exclamation marks may create a tone that is too enthusiastic, impatient or
        casual for the situation.


        Compare:


        ::: examples

        - no: Hei Eirik! Vi må bytte rom!

        - en: Hi Eirik! We have to change rooms!

        - no: Hei Eirik, vi ser ut til å ha behov for et større rom.

        - en: Hi Eirik, it appears that we need a larger room.

        :::


        Neither exclamation marks nor short sentences are wrong. The question is what
        effect they create.


        **Checkpoint: match greeting to context**


        Rewrite the opening of one message for three specified recipients: a close
        colleague, an unfamiliar administrative contact and a group of participants
        attending a professional event. Keep the practical purpose unchanged.


        Your response should use natural Bokmål and signal different relationships
        without making the professional versions unnaturally ceremonial.


        {{exercise: match_greeting_to_context}}


        '
