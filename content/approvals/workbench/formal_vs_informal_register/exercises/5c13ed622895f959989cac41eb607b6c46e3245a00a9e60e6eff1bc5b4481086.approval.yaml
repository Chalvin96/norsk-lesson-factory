      back-to-nora: '## Back to Nora and Eirik {#back-to-nora role=model objectives=obj-formal-vs-informal-register-01}


        Eirik replies later that morning.


        ::: examples

        - no: Hei Nora,

        - en: Hi Nora,

        - no: Takk for beskjed. Sal 3 er ledig og har plass til femti personer. Jeg
        kan flytte reservasjonen dit, men jeg trenger en bekreftelse fra deg før klokka
        to.

        - en: Thank you for letting me know. Hall 3 is available and has room for
        fifty people. I can move the reservation there, but I need confirmation from
        you before two o’clock.

        - no: Vennlig hilsen

        - en: Kind regards

        - no: Eirik

        - en: Eirik

        :::


        Nora replies:


        ::: examples

        - no: Hei Eirik,

        - en: Hi Eirik,

        - no: Det høres bra ut. Du kan flytte reservasjonen til Sal 3. Takk for raskt
        svar og god hjelp.

        - en: That sounds good. You can move the reservation to Hall 3. Thank you
        for the quick reply and your help.

        - no: Vennlig hilsen

        - en: Kind regards

        - no: Nora

        - en: Nora

        :::


        Notice that Nora now uses **Du kan flytte reservasjonen** rather than **Kunne
        du flyttet reservasjonen?** Eirik has offered to move it and asked for confirmation.
        Nora’s sentence is therefore permission and confirmation, not an abrupt demand.
        The same grammatical form can have a different effect when the conversational
        context changes.


        She then updates Jonas in the company chat.


        ::: {.reading translation=''We got Hall 3!'' dialogue_id=company_chat_update
        speaker_id=nora speaker_name="Nora" character_id="nora"}

        Vi fikk Sal 3!

        :::


        ::: {.reading translation=''Perfect. Then we won’t have to sit on top of each
        other.'' dialogue_id=company_chat_update speaker_id=jonas speaker_name="Jonas"
        character_id="jonas"}

        Perfekt. Da slipper vi å sitte oppå hverandre.

        :::


        ::: {.reading translation=''Yes, that would have been a little too social.''
        dialogue_id=company_chat_update speaker_id=nora speaker_name="Nora" character_id="nora"}

        Ja, det hadde blitt litt vel sosialt.

        :::


        The chat includes an exclamation mark, an idiomatic expression and humor.
        These choices fit Nora and Jonas’s familiar relationship. Sending the same
        wording to Eirik would be possible in some workplaces, but it would signal
        greater familiarity and a more playful purpose.


