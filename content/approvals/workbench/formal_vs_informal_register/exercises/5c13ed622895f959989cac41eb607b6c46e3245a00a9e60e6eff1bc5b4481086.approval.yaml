  review_sentence_style:
    exercise_key: review_sentence_style
    checked_against:
      sentence-style-flow: 935116e0a5680162438897e29b15ccf958fc20a029f1ce4fabf48b880d791fe2
    section_sources:
      sentence-style-flow: '## Sentence style and information flow {#sentence-style-flow
        role=contrast objectives=obj-formal-vs-informal-register-01}


        Conversational Norwegian often relies on short clauses, shared context and
        incomplete sentences. Professional writing usually needs enough context to
        stand on its own, especially when the recipient cannot immediately ask what
        the writer means.


        In the office chat, Jonas can write:


        ::: examples

        - no: Satser på at de har et større rom.

        - en: I hope they have a larger room.

        :::


        The subject **jeg** is omitted in this conversational expression. Jonas is
        the understood speaker, and both speakers know what **de** and **et større
        rom** refer to.


        The same compressed style may be unclear in an email to someone outside the
        conversation.


        Too dependent on shared context:


        ::: examples

        - no: Hei, det gjelder torsdag. Trenger noe større. Gi beskjed fort.

        - en: Hi, it concerns Thursday. Need something larger. Let me know quickly.

        :::


        Clearer professional version:


        ::: examples

        - no: Hei, det gjelder romreservasjonen for møtet på torsdag. Vi trenger et
        større rom enn det vi opprinnelig bestilte. Kan du gi meg beskjed om hvilke
        alternativer som er ledige?

        - en: Hi, this concerns the room reservation for the meeting on Thursday.
        We need a larger room than the one we originally booked. Can you let me know
        which alternatives are available?

        :::


        Professional writing does not have to use long, abstract sentences. In fact,
        a very formal, noun-heavy style can make a simple request harder to understand.


        Heavy administrative style:


        ::: examples

        - no: På bakgrunn av økningen i antallet registrerte deltakere foreligger
        det et behov for gjennomføring av en endring av romreservasjonen.

        - en: On the basis of the increase in the number of registered participants,
        there is a need for the implementation of a change to the room reservation.

        :::


        Clear professional style:


        ::: examples

        - no: Fordi flere har meldt seg på, må vi endre romreservasjonen.

        - en: Because more people have registered, we need to change the room reservation.

        :::


        Both are formal in subject matter, but the second is clearer and more direct.
        At B2 level, good register control includes resisting the idea that professional
        language must be complicated.


        **Aligned contrast: chat and email**


        **To a close colleague in chat**


        ::: examples

        - no: Hei! Har du den siste deltakerlista? Trenger den før fire.

        - en: Hi! Do you have the latest participant list? Need it before four.

        :::


        **To an external coordinator by email**


        ::: examples

        - no: Hei, har du mulighet til å sende meg den siste deltakerlisten innen
        klokka fire? Vi trenger den for å bestille adgangskort.

        - en: Hi, would you be able to send me the latest participant list by four
        o’clock? We need it to order access cards.

        :::


        **In a standard notice**


        ::: examples

        - no: Oppdatert deltakerliste må sendes inn innen klokka fire for at adgangskort
        skal kunne bestilles.

        - en: An updated participant list must be submitted by four o’clock so that
        access cards can be ordered.

        :::


        The practical content is nearly identical. Pronouns, sentence completeness
        and degree of impersonality change with genre and purpose.


        **Checkpoint: change the genre, not the meaning**


        Express the same room-change request first as a brief internal chat message
        and then as a complete email to an external contact. Preserve the facts and
        deadline.


        {{exercise: change_genre_not_meaning}}


        '
