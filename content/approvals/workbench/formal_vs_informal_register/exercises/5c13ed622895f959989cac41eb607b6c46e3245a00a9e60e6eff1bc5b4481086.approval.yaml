      du-professional: fb0d4ac9669deb00e747dca7de8f859e2f83d5668b4ecc2cc7d1f8128b64ed9a
    section_sources:
      du-professional: '## Du is normal in professional Norwegian {#du-professional
        role=contrast objectives=obj-formal-vs-informal-register-01}


        Nora wonders whether she should replace **du** with **De**. In most present-day
        Norwegian communication, that is unnecessary.


        **Du** is the ordinary singular pronoun used with friends, colleagues, customers,
        officials and many people met for the first time. A professional tone usually
        comes from the whole sentence, not from replacing **du**.


        ::: examples

        - no: Kan du bekrefte at du har mottatt dokumentene?

        - en: Can you confirm that you have received the documents?

        - no: Har du anledning til å delta på møtet?

        - en: Are you available to attend the meeting?

        :::


        The capitalized pronoun **De**, with forms such as **Dem** and **Deres**,
        is now uncommon in ordinary communication. It may occur in older texts, highly
        traditional service language or deliberately distant and ceremonial contexts.
        Used casually, it can sound old-fashioned, unnatural or even ironic.


        A frequent mistake is to assume that English professional you must become
        Norwegian **De**. Usually, it remains **du**.


        Less natural in an ordinary modern workplace email:


        ::: examples

        - no: Kan De bekrefte at De har mottatt dokumentene?

        - en: Can you confirm that you have received the documents?

        :::


        Natural in most present-day workplaces:


        ::: examples

        - no: Kan du bekrefte at du har mottatt dokumentene?

        - en: Can you confirm that you have received the documents?

        :::


        Professional language can also avoid direct reference to the recipient when
        the focus is on a process rather than a person.


        ::: examples

        - no: Søknaden må sendes inn innen 1. september.

        - en: The application must be submitted by 1 September.

        - no: Vi ber om at dokumentasjonen sendes elektronisk.

        - en: We ask that the documentation be sent electronically.

        :::


        These impersonal forms can be useful in regulations, standard notices and
        official procedures. In a personal email, however, too many of them may sound
        distant.


        Compare:


        ::: examples

        - no: Det bes om at vedlagte skjema returneres innen fredag.

        - en: It is requested that the attached form be returned by Friday.

        - no: Kan du returnere det vedlagte skjemaet innen fredag?

        - en: Can you return the attached form by Friday?

        :::


        The first resembles standardized administrative language. The second addresses
        a person directly and will often sound clearer and more natural in an email.


        **Checkpoint: keep du, adjust the tone**


        Take a short, overly direct workplace request containing **du**. Revise it
        without replacing **du** with **De**. Change the request form and add only
        the context needed to make the message professional.


        {{exercise: keep_du_adjust_tone}}


        '
