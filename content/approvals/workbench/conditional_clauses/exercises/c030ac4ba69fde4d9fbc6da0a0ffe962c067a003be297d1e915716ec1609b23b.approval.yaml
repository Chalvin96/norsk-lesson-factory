  distinguish_real_and_imagined_conditions:
    exercise_key: distinguish_real_and_imagined_conditions
    checked_against:
      imagined-conditions: fb71ce70710dc42c69df9e327a74c41d07775749d3d74afbf37d5196ec75c19c
    section_sources:
      imagined-conditions: '## Imagined conditions {#imagined-conditions role=contrast
        objectives=obj-conditional-clauses-01}


        Maja also says:


        ::: examples

        - no: Hvis hytta hadde internett, ville jeg tatt med datamaskinen.

        - en: If the cabin had internet, I would bring my computer.

        :::


        The cabin does not have internet, or Maja at least treats internet there as
        unlikely. She imagines a different situation and its result.


        For this kind of imagined condition, Norwegian commonly uses the past tense
        (*preteritum*) in the *hvis*-clause and *ville* plus an infinitive in the
        result clause:


        ::: examples

        - no: Hvis hytta hadde internett, ville jeg tatt med datamaskinen.

        - en: If the cabin had internet, I would bring my computer.

        :::


        The form *hadde* is past tense, but the sentence is not necessarily about
        past time. It presents the condition as imagined or remote from the current
        situation.


        Compare:


        ::: examples

        - no: Hvis hytta har internett, tar jeg med datamaskinen.

        - en: If the cabin has internet, I’ll bring my computer.

        - no: Hvis hytta hadde internett, ville jeg tatt med datamaskinen.

        - en: If the cabin had internet, I would bring my computer.

        :::


        In the first sentence, Maja treats internet access as a real possibility to
        check. In the second, she imagines a different situation.


        Another pair:


        ::: examples

        - no: Hvis jeg har tid, hjelper jeg deg.

        - en: If I have time, I’ll help you.

        - no: Hvis jeg hadde tid, ville jeg hjulpet deg.

        - en: If I had time, I would help you.

        :::


        The second sentence often suggests that the speaker does not currently have
        enough time.


        A third pair:


        ::: examples

        - no: Hvis vi bor nærmere, besøker vi dem oftere.

        - en: If we live closer, we visit them more often.

        - no: Hvis vi bodde nærmere, ville vi besøkt dem oftere.

        - en: If we lived closer, we would visit them more often.

        :::


        The compact imagined-condition pattern is:


        ::: {.rule}

        **Hvis + past tense, ville + infinitive or past participle form used with
        *ville*.**

        :::


        Common Bokmål examples include *ville hjelpe* and *ville hjulpet*. Both patterns
        occur naturally. In this chapter, focus on recognizing and producing the established
        combinations presented in the examples, without treating the imagined past-tense
        form as ordinary past time.


        **Hvis jeg var deg**


        Jonas gives Maja advice:


        ::: examples

        - no: Hvis jeg var deg, ville jeg latt datamaskinen ligge hjemme.

        - en: If I were you, I would leave the computer at home.

        :::


        *Hvis jeg var deg* is a common way to introduce advice. The speaker cannot
        literally become the other person, so the condition is imagined.


        More examples:


        ::: examples

        - no: Hvis jeg var deg, ville jeg bestilt billettene i dag.

        - en: If I were you, I would book the tickets today.

        - no: Hvis jeg var deg, ville jeg ikke ventet så lenge.

        - en: If I were you, I wouldn’t wait so long.

        - no: Hvis jeg var deg, ville jeg tatt med en varm jakke.

        - en: If I were you, I would bring a warm jacket.

        :::


        Inside *hvis jeg var deg*, the order is subordinate-clause order. In the following
        main clause, *ville* comes before the subject because the *hvis*-clause comes
        first:


        ::: examples

        - no: ville jeg

        - en: would I

        :::


        If the result comes first, ordinary main-clause order returns:


        ::: examples

        - no: Jeg ville tatt med en varm jakke hvis jeg var deg.

        - en: I would bring a warm jacket if I were you.

        :::


        {{exercise: distinguish_real_and_imagined_conditions}}


        {{exercise: form_imagined_conditions}}


        '
