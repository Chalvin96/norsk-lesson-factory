  move_real_condition:
    exercise_key: move_real_condition
    checked_against:
      putting-condition-second: 68bca86cf2ef3b9d01a547e4d82e516b4c9bea0e2eb1d060288da8f235fb9785
    section_sources:
      putting-condition-second: '## Putting the condition second {#putting-condition-second
        role=contrast objectives=obj-conditional-clauses-01}


        The condition can also follow the result:


        ::: examples

        - no: Vi går en lang tur hvis det ikke regner.

        - en: We’ll go for a long walk if it doesn’t rain.

        - no: Jeg kjøper kaffe hvis butikken er åpen.

        - en: I’ll buy coffee if the shop is open.

        - no: Jeg sender Nora en melding hvis hun ikke svarer.

        - en: I’ll send Nora a message if she doesn’t answer.

        :::


        Here the main clause comes first, so it keeps ordinary main-clause order:


        ::: examples

        - no: Vi går en lang tur …

        - en: We’ll go for a long walk …

        :::


        The *hvis*-clause remains a subordinate clause even when it comes second.
        Its internal word order does not change:


        ::: examples

        - no: … hvis det ikke regner

        - en: … if it doesn’t rain

        :::


        Compare the two arrangements:


        ::: examples

        - no: Hvis bussen ikke kommer, tar vi taxi.

        - en: If the bus doesn’t come, we’ll take a taxi.

        - no: Vi tar taxi hvis bussen ikke kommer.

        - en: We’ll take a taxi if the bus doesn’t come.

        :::


        The condition and result are essentially the same. What changes is which part
        the speaker presents first. In the first sentence, the condition is the starting
        point. In the second, the decision is stated first and then limited by the
        condition.


        Do not move *ikke* after the verb merely because the *hvis*-clause comes at
        the end:


        ::: examples

        - no: ✗ Vi tar taxi hvis bussen kommer ikke.

        - en: Intended meaning: We’ll take a taxi if the bus doesn’t come.

        :::


        Use subordinate-clause order:


        ::: examples

        - no: Vi tar taxi hvis bussen ikke kommer.

        - en: We’ll take a taxi if the bus doesn’t come.

        :::


        {{exercise: move_real_condition}}


        '
