  revise_the_cabin_plan:
    exercise_key: revise_the_cabin_plan
    checked_against:
      back-at-the-cabin-plan: b48ccd99a24f8fb97720d91269e7044a7597c845155757c1cce10b60b92c1311
    section_sources:
      back-at-the-cabin-plan: '## Back at the cabin plan {#back-at-the-cabin-plan
        role=model objectives=obj-conditional-clauses-01}


        Jonas checks the forecast again on Friday evening.


        ::: {.reading translation="Apparently it’s going to rain in the morning."
        dialogue_id=updated-cabin-plan speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Det skal visst regne om morgenen.

        :::


        ::: {.reading translation="If it stops raining before lunch, we’ll go for
        a walk afterwards." dialogue_id=updated-cabin-plan speaker_id=maja speaker_name="Maja"
        character_id="maja"}

        Hvis det slutter å regne før lunsj, går vi tur etterpå.

        :::


        ::: {.reading translation="Good idea. If we don’t make it to the shop tonight,
        we can shop on the way tomorrow." dialogue_id=updated-cabin-plan speaker_id=jonas
        speaker_name="Jonas" character_id="jonas"}

        God idé. Hvis vi ikke rekker butikken i kveld, kan vi handle på veien i morgen.

        :::


        ::: {.reading translation="If the cabin were closer, we wouldn’t need to plan
        so much." dialogue_id=updated-cabin-plan speaker_id=maja speaker_name="Maja"
        character_id="maja"}

        Hvis hytta lå nærmere, ville vi ikke trengt å planlegge så mye.

        :::


        ::: {.reading translation="That’s true. But I wouldn’t like it as much if
        it were in the middle of town." dialogue_id=updated-cabin-plan speaker_id=jonas
        speaker_name="Jonas" character_id="jonas"}

        Det er sant. Men jeg ville ikke likt den like godt hvis den lå midt i byen.

        :::


        The same two meaning choices now help them respond to new information.


        Their first two conditions are real:


        ::: examples

        - no: Hvis det slutter å regne før lunsj, går vi tur etterpå.

        - en: If it stops raining before lunch, we’ll go for a walk afterwards.

        - no: Hvis vi ikke rekker butikken i kveld, kan vi handle på veien i morgen.

        - en: If we don’t make it to the shop tonight, we can shop on the way tomorrow.

        :::


        They are practical possibilities that may affect the plan.


        The next two conditions are imagined:


        ::: examples

        - no: Hvis hytta lå nærmere, ville vi ikke trengt å planlegge så mye.

        - en: If the cabin were closer, we wouldn’t need to plan so much.

        - no: Jeg ville ikke likt den like godt hvis den lå midt i byen.

        - en: I wouldn’t like it as much if it were in the middle of town.

        :::


        The cabin is not closer and is not in the middle of town. Jonas and Maja use
        past-tense forms in the conditions—*lå*—and *ville* in the results to imagine
        alternatives.


        Notice the word order in the final sentence. Because the result comes first,
        it begins with normal main-clause order:


        ::: examples

        - no: Jeg ville ikke likt …

        - en: I wouldn’t like …

        :::


        The final *hvis*-clause keeps subordinate-clause order:


        ::: examples

        - no: hvis den lå midt i byen

        - en: if it were in the middle of town

        :::


        {{exercise: revise_the_cabin_plan}}


        '
