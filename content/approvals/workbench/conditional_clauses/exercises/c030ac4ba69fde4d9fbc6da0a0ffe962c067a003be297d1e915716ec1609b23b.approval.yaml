exercise_alignments:
  notice_real_condition_order:
    exercise_key: notice_real_condition_order
    checked_against:
      real-conditions: 5f54359be461c5317a2afd731cb34f1757e280875633a6377d063c359305d29a
    section_sources:
      real-conditions: '## Real conditions {#real-conditions role=model objectives=obj-conditional-clauses-01}


        A real condition presents something as possible, expected, or relevant to
        an actual decision.


        ::: examples

        - no: Hvis det ikke regner, går vi en lang tur.

        - en: If it doesn’t rain, we’ll go for a long walk.

        :::


        The speaker does not know whether it will rain. Both outcomes are still possible.


        A clause introduced by *hvis* is a subordinate clause (*leddsetning*). In
        a subordinate clause, a sentence adverb such as *ikke* normally comes before
        the finite verb:


        ::: examples

        - no: hvis det ikke regner

        - en: if it does not rain

        :::


        Compare the order:


        **Main clause and *hvis*-clause**


        ::: examples

        - no: Det regner ikke.

        - en: It isn’t raining.

        - no: hvis det ikke regner

        - en: if it isn’t raining

        - no: Du tar ikke med kaffe.

        - en: You aren’t bringing coffee.

        - no: hvis du ikke tar med kaffe

        - en: if you don’t bring coffee

        - no: Bussen kommer ikke.

        - en: The bus isn’t coming.

        - no: hvis bussen ikke kommer

        - en: if the bus doesn’t come

        :::


        The compact rule is:


        ::: {.rule}

        In a *hvis*-clause, place *ikke* before the finite verb.

        :::


        This follows the subordinate-clause word order that you already know. The
        word *hvis* does not change the rule.


        **Notice the result clause**


        When the *hvis*-clause comes first, it occupies the first position in the
        complete sentence. The following main clause therefore begins with its finite
        verb:


        ::: examples

        - no: Hvis det ikke regner, går vi en lang tur.

        - en: If it doesn’t rain, we’ll go for a long walk.

        :::


        The main clause is *vi går en lang tur*. After the initial *hvis*-clause,
        the order becomes *går vi*.


        More examples:


        ::: examples

        - no: Hvis butikken er åpen, kjøper jeg kaffe.

        - en: If the shop is open, I’ll buy coffee.

        - no: Hvis toget kommer i tide, rekker vi møtet.

        - en: If the train arrives on time, we’ll make the meeting.

        - no: Hvis Nora ikke svarer, sender jeg henne en melding.

        - en: If Nora doesn’t answer, I’ll send her a message.

        - no: Hvis dere er sultne, kan vi spise nå.

        - en: If you are hungry, we can eat now.

        :::


        Notice that the finite verb comes before the subject in each result clause:
        *kjøper jeg*, *rekker vi*, *sender jeg* and *kan vi*.


        The compact pattern is:


        ::: {.rule}

        **Hvis + subordinate clause, finite verb + subject in the main clause.**

        :::


        A common mistake is to keep ordinary subject–verb order after an initial *hvis*-clause:


        ::: examples

        - no: ✗ Hvis butikken er åpen, jeg kjøper kaffe.

        - en: Intended meaning: If the shop is open, I’ll buy coffee.

        :::


        The correct sentence is:


        ::: examples

        - no: Hvis butikken er åpen, kjøper jeg kaffe.

        - en: If the shop is open, I’ll buy coffee.

        :::


        The comma does not create the inversion. The inversion happens because the
        complete *hvis*-clause fills the first position before the main-clause verb.


        {{exercise: notice_real_condition_order}}


        {{exercise: build_condition_first_results}}


        '
