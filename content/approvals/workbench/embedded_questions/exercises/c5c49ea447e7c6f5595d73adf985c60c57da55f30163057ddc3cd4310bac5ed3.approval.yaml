  complete_embedded_information_statement:
    exercise_key: complete_embedded_information_statement
    checked_against:
      statements-that-contain-questions: 0c3da5fbca66fa0a82dc1181637481493bf32828be780bab4603a0d836a2749f
    section_sources:
      statements-that-contain-questions: '## Statements that contain questions {#statements-that-contain-questions
        role=model objectives=obj-embedded-questions-01}


        An embedded question does not have to appear after a direct request. It can
        be part of a statement.


        ::: examples

        - no: Jeg vet hvor hotellet er.

        - en: I know where the hotel is.

        - no: Vi må finne ut når resepsjonen stenger.

        - en: We need to find out when reception closes.

        - no: Jonas husker ikke hvilket rom møtet er i.

        - en: Jonas does not remember which room the meeting is in.

        - no: Mina er usikker på om de har bestilt lunsj.

        - en: Mina is unsure whether they have ordered lunch.

        - no: Ingen forstår hvorfor programmet er endret.

        - en: No one understands why the schedule has been changed.

        :::


        The whole sentence is a statement, so it normally ends with a full stop. Its
        embedded part still represents information that could be requested with a
        direct question.


        Direct question:


        ::: examples

        - no: Hvor er hotellet?

        - en: Where is the hotel?

        :::


        Statement containing an embedded question:


        ::: examples

        - no: Jeg vet ikke hvor hotellet er.

        - en: I don’t know where the hotel is.

        :::


        Direct question:


        ::: examples

        - no: Har de bestilt lunsj?

        - en: Have they ordered lunch?

        :::


        Statement containing an embedded question:


        ::: examples

        - no: Vi må finne ut om de har bestilt lunsj.

        - en: We need to find out whether they have ordered lunch.

        :::


        The punctuation belongs to the whole sentence. Compare:


        ::: examples

        - no: Vet du hvor hotellet er?

        - en: Do you know where the hotel is?

        - no: Jeg vet hvor hotellet er.

        - en: I know where the hotel is.

        :::


        Both sentences contain hvor hotellet er. Only the first sentence is itself
        a direct question.


        {{exercise: complete_embedded_information_statement}}


        '
    outcome: approved
