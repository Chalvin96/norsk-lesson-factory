  use_embedded_questions_at_hotel_reception:
    exercise_key: use_embedded_questions_at_hotel_reception
    checked_against:
      transfer-to-a-new-situation: 06680bda6ecdf21f8e6ece856fe89f6f7b5cbbf3f2b174d86d9cb7b86cef7573
    section_sources:
      transfer-to-a-new-situation: '## Transfer to a new situation {#transfer-to-a-new-situation
        role=recap objectives=obj-embedded-questions-01}


        The next day, Mina needs several practical details from hotel reception before
        making plans. The setting has changed, but the information problem is similar.


        Possible direct questions include:


        ::: examples

        - no: Når slutter frokosten?

        - en: When does breakfast end?

        - no: Kan jeg la kofferten stå her?

        - en: Can I leave my suitcase here?

        - no: Hvor stopper flybussen?

        - en: Where does the airport bus stop?

        - no: Hvorfor virker ikke nøkkelkortet?

        - en: Why doesn’t the key card work?

        :::


        Mina can make these questions part of longer, more connected sentences:


        ::: examples

        - no: Kan du fortelle meg når frokosten slutter?

        - en: Can you tell me when breakfast ends?

        - no: Jeg lurer på om jeg kan la kofferten stå her.

        - en: I wonder whether I can leave my suitcase here.

        - no: Vet du hvor flybussen stopper?

        - en: Do you know where the airport bus stops?

        - no: Kan du sjekke hvorfor nøkkelkortet ikke virker?

        - en: Can you check why the key card doesn’t work?

        :::


        The grammatical decision remains unchanged. A question word is retained when
        Mina seeks specific information. Om introduces an embedded yes-or-no question.
        The subject comes before the finite verb, and an internal ikke comes before
        that verb.


        {{exercise: use_embedded_questions_at_hotel_reception}}


        '
