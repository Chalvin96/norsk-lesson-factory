  notice_embedded_question_order:
    exercise_key: notice_embedded_question_order
    checked_against:
      direct-and-embedded-questions: 7a14989fbd76315cb03832fa81be8052cc9ee536cdd54a724100a150c419e945
    section_sources:
      direct-and-embedded-questions: '## Direct and embedded questions {#direct-and-embedded-questions
        role=model objectives=obj-embedded-questions-01}


        A direct question stands on its own and asks someone for an answer.


        ::: examples

        - no: Hvor er spor 12?

        - en: Where is platform 12?

        - no: Når kommer toget?

        - en: When does the train arrive?

        - no: Hvorfor er avgangen endret?

        - en: Why has the departure been changed?

        :::


        An embedded question forms part of a larger sentence. It can follow expressions
        such as:


        ::: examples

        - no: Vet du …

        - en: Do you know …

        - no: Kan du sjekke …

        - en: Can you check …

        - no: Jeg lurer på …

        - en: I wonder …

        - no: Vi må finne ut …

        - en: We need to find out …

        - no: Hun forklarte …

        - en: She explained …

        :::


        Compare the direct and embedded versions:


        **Direct question**


        ::: examples

        - no: Hvor er spor 12?

        - en: Where is platform 12?

        :::


        **Embedded question**


        ::: examples

        - no: Vet du hvor spor 12 er?

        - en: Do you know where platform 12 is?

        :::


        **Direct question**


        ::: examples

        - no: Når kommer toget?

        - en: When does the train arrive?

        :::


        **Embedded question**


        ::: examples

        - no: Kan du sjekke når toget kommer?

        - en: Can you check when the train arrives?

        :::


        **Direct question**


        ::: examples

        - no: Hvorfor er avgangen endret?

        - en: Why has the departure been changed?

        :::


        **Embedded question**


        ::: examples

        - no: Jeg lurer på hvorfor avgangen er endret.

        - en: I wonder why the departure has been changed.

        :::


        Notice the change in word order. In a direct question, the finite verb often
        comes before the subject:


        ::: examples

        - no: Hvor er spor 12?

        - en: Where is platform 12?

        :::


        In the embedded question, the subject comes before the finite verb:


        ::: examples

        - no: Vet du hvor spor 12 er?

        - en: Do you know where platform 12 is?

        :::


        For the taught cases where the question phrase is not the subject, the compact
        rule is:


        ::: {.rule}

        Question word + subject + finite verb

        :::


        ::: examples

        - no: hvor + spor 12 + er

        - en: where + platform 12 + is

        - no: når + toget + kommer

        - en: when + the train + arrives

        - no: hvorfor + avgangen + er

        - en: why + the departure + is

        :::


        When the question phrase is itself the subject, use this branch:


        ::: {.rule}

        Subject question phrase + som + finite verb

        :::


        ::: examples

        - no: hvilket tog + som + stopper

        - en: which train + that + stops

        :::


        The larger sentence may itself be a question:


        ::: examples

        - no: Vet du hvor spor 12 er?

        - en: Do you know where platform 12 is?

        :::


        However, the question inside it still has subordinate-clause word order. The
        opening words Vet du make the whole sentence a question; they do not turn
        hvor spor 12 er into a direct question.


        {{exercise: notice_embedded_question_order}}


        '
