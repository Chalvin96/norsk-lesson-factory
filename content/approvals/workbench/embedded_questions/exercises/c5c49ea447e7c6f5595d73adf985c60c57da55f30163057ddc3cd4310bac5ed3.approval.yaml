  discriminate_direct_and_embedded_order:
    exercise_key: discriminate_direct_and_embedded_order
    checked_against:
      common-mistake-direct-question-inversion: 6ad969beba9c303a525efd98b2704c0c6ea8b50cca658551abe851879f0b5738
    section_sources:
      common-mistake-direct-question-inversion: '## A common mistake: keeping direct-question
        inversion {#common-mistake-direct-question-inversion role=contrast objectives=obj-embedded-questions-01}


        A frequent mistake is to put the verb before the subject inside the embedded
        question.


        Incorrect:


        ::: examples

        - no: ✗ Vet du hvor er spor 12?

        - en: ''Incorrect: Do you know where is platform 12?''

        :::


        Correct:


        ::: examples

        - no: Vet du hvor spor 12 er?

        - en: Do you know where platform 12 is?

        :::


        Incorrect:


        ::: examples

        - no: ✗ Kan du sjekke når kommer toget?

        - en: ''Incorrect: Can you check when arrives the train?''

        :::


        Correct:


        ::: examples

        - no: Kan du sjekke når toget kommer?

        - en: Can you check when the train arrives?

        :::


        The incorrect versions copy the order of the direct questions Hvor er spor
        12? and Når kommer toget? Once those questions are placed after Vet du or
        Kan du sjekke, the subject must come before the finite verb.


        English sometimes helps because standard English makes a similar contrast:


        - Direct English: *Where is the station?*

        - Embedded English: *Do you know where the station is?*


        Still, Norwegian word order must be learned from the Norwegian sentence itself.
        The reliable check is to locate the embedded question word and then look for
        the subject before the finite verb.


        {{exercise: change_direct_to_embedded_question}}


        '
    outcome: approved
    note: null
