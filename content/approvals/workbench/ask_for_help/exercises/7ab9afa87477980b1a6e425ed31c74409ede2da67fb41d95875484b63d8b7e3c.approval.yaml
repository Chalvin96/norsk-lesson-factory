    section_sources:
      stating-the-obstacle: '## Stating the obstacle {#stating-the-obstacle role=model
        objectives=obj-ask-for-help-01}


        A useful way to explain a problem is:


        **jeg + verb + ikke**


        In Mina’s sentence, **ikke** makes the statement negative.


        ::: examples

        - no: Jeg finner spor fire.

        - en: I find platform four.

        - no: Jeg finner ikke spor fire.

        - en: I can’t find platform four.

        :::


        The second sentence tells Erik what is preventing Mina from continuing her
        journey.


        **Jeg finner ikke …**


        Use **Jeg finner ikke …** when you cannot find a person, place, or object.


        ::: examples

        - no: Jeg finner ikke billetten.

        - en: I can’t find the ticket.

        - no: Jeg finner ikke hotellet.

        - en: I can’t find the hotel.

        - no: Jeg finner ikke nøkkelen.

        - en: I can’t find the key.

        - no: Jeg finner ikke toalettet.

        - en: I can’t find the toilet.

        :::


        Norwegian often uses the present-tense form **finner ikke** where English
        naturally uses **can’t find**. A word-for-word translation such as *I find
        not the key* is not natural English, but the Norwegian sentence is normal.


        **Jeg forstår ikke …**


        Use **Jeg forstår ikke …** when the obstacle is understanding.


        ::: examples

        - no: Jeg forstår ikke spørsmålet.

        - en: I don’t understand the question.

        - no: Jeg forstår ikke beskjeden.

        - en: I don’t understand the message.

        - no: Jeg forstår ikke dette ordet.

        - en: I don’t understand this word.

        :::


        If the whole situation is unclear, the shorter sentence is enough:


        ::: examples

        - no: Jeg forstår ikke.

        - en: I don’t understand.

        :::


        **Jeg får ikke …**


        Another common pattern is **Jeg får ikke …**, followed by an action. In practical
        situations, it can mean that you are trying but cannot make something work.


        ::: examples

        - no: Jeg får ikke åpnet døra.

        - en: I can’t get the door open.

        - no: Jeg får ikke startet maskinen.

        - en: I can’t get the machine started.

        - no: Jeg får ikke kjøpt billett.

        - en: I can’t manage to buy a ticket.

        :::


        At this level, learn these as useful complete expressions. The important communicative
        job is the same: tell the other person what is stopping you.


        **Aligned contrasts**


        **Obstacle**


        ::: examples

        - no: Jeg finner ikke sporet.

        - en: I can’t find the platform.

        :::


        **Desired result**


        ::: examples

        - no: Jeg vil finne sporet.

        - en: I want to find the platform.

        :::


        **Obstacle**


        ::: examples

        - no: Jeg forstår ikke beskjeden.

        - en: I don’t understand the message.

        :::


        **Desired result**


        ::: examples

        - no: Jeg vil forstå beskjeden.

        - en: I want to understand the message.

        :::


        **Obstacle**


        ::: examples

        - no: Jeg får ikke åpnet døra.

        - en: I can’t get the door open.

        :::


        **Desired result**


        ::: examples

        - no: Jeg vil åpne døra.

        - en: I want to open the door.

        :::


        When asking for help, the obstacle is usually more useful than simply stating
        what you want. **Jeg finner ikke sporet** tells the listener exactly what
        has gone wrong.


        **Checkpoint: choose a useful obstacle statement**


        Imagine that Mina has reached the correct platform, but now she cannot find
        her ticket. Produce one short Norwegian sentence that states this obstacle.
        Your response should use **Jeg finner ikke …** with the ticket as the missing
        object.


        {{exercise: checkpoint_choose_obstacle}}


