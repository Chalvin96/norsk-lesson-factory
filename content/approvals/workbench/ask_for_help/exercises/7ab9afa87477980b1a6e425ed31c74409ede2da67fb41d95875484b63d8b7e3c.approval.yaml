    section_sources:
      accepting-the-next-action: '## Accepting the next action {#accepting-the-next-action
        role=model objectives=obj-ask-for-help-01}


        Once you understand the instruction, show that you accept it. Mina first says
        **Ok**, then later **Ja, takk**.


        ::: examples

        - no: Ok.

        - en: Okay.

        - no: Ja, takk.

        - en: Yes, thank you.

        - no: Greit, takk.

        - en: All right, thank you.

        :::


        These short replies keep the exchange moving. They tell the helper that you
        have understood and agree to the next step.


        Compare the following exchanges:


        **At a machine**


        ::: examples

        - no: Jeg får ikke kjøpt billett. Kan du hjelpe meg?

        - en: I can’t manage to buy a ticket. Can you help me?

        - no: Ja. Trykk her.

        - en: Yes. Press here.

        - no: Ok, takk.

        - en: Okay, thank you.

        :::


        **In a building**


        ::: examples

        - no: Unnskyld, jeg finner ikke resepsjonen. Kan du hjelpe meg?

        - en: Excuse me, I can’t find reception. Can you help me?

        - no: Ja, selvfølgelig. Bli med meg.

        - en: Yes, of course. Come with me.

        - no: Ja, takk.

        - en: Yes, thank you.

        :::


        **In a classroom**


        ::: examples

        - no: Jeg forstår ikke dette ordet. Kan du hjelpe meg?

        - en: I don’t understand this word. Can you help me?

        - no: Ja. Se på eksemplet.

        - en: Yes. Look at the example.

        - no: Greit, takk.

        - en: All right, thank you.

        :::


        The acceptance should fit the response. If someone says **Vent litt**, **Ok**
        is natural. If someone offers to lead you somewhere, **Ja, takk** naturally
        accepts the offer.


        **Checkpoint: complete the communicative sequence**


        Imagine that you cannot open a door at the station. An employee replies:


        ::: examples

        - no: Ja, selvfølgelig. Prøv igjen nå.

        - en: Yes, of course. Try again now.

        :::


        State your obstacle and request before this reply, then add a short Norwegian
        acceptance after it.


        {{exercise: checkpoint_complete_sequence}}


        '
