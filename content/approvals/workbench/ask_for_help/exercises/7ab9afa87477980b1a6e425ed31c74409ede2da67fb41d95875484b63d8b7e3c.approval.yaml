    section_sources:
      at-the-train-station: '## At the train station {#at-the-train-station role=orient
        objectives=obj-ask-for-help-01}


        Mina is travelling from Oslo to Lillehammer. She has bought a ticket on her
        phone, but she cannot find the correct platform. She asks an employee, Erik,
        for help.


        ::: {.reading translation="Excuse me, I can’t find platform four." dialogue_id="station_help"
        speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Unnskyld, jeg finner ikke spor fire.

        :::


        ::: {.reading translation="Are you going to Lillehammer?" dialogue_id="station_help"
        speaker_id="erik" speaker_name="Erik" character_id="erik"}

        Skal du til Lillehammer?

        :::


        ::: {.reading translation="Yes. The train leaves in ten minutes. Can you help
        me?" dialogue_id="station_help" speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Ja. Toget går om ti minutter. Kan du hjelpe meg?

        :::


        ::: {.reading translation="Yes, of course. Look at the screen over there."
        dialogue_id="station_help" speaker_id="erik" speaker_name="Erik" character_id="erik"}

        Ja, selvfølgelig. Se på skjermen der borte.

        :::


        ::: {.reading translation="Okay." dialogue_id="station_help" speaker_id="mina"
        speaker_name="Mina" character_id="mina"}

        Ok.

        :::


        ::: {.reading translation="The train leaves from platform six today. Come
        with me, and I’ll show you the way." dialogue_id="station_help" speaker_id="erik"
        speaker_name="Erik" character_id="erik"}

        Toget går fra spor seks i dag. Bli med meg, så viser jeg deg veien.

        :::


        ::: {.reading translation="Yes, thank you." dialogue_id="station_help" speaker_id="mina"
        speaker_name="Mina" character_id="mina"}

        Ja, takk.

        :::


        ::: {.reading translation="Here is platform six." dialogue_id="station_help"
        speaker_id="erik" speaker_name="Erik" character_id="erik"}

        Her er spor seks.

        :::


        ::: {.reading translation="Great. Thank you very much for the help!" dialogue_id="station_help"
        speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Flott. Tusen takk for hjelpen!

        :::


        Mina’s problem is simple but urgent: she cannot find the platform, and her
        train leaves soon. Her short exchange with Erik follows a useful pattern:


        1. Get the other person’s attention.

        2. State the obstacle.

        3. Ask for help.

        4. Listen for the next action.

        5. Accept the action.


        You can use the same pattern when you cannot find something, cannot understand
        something, or cannot complete a simple task.


        '
