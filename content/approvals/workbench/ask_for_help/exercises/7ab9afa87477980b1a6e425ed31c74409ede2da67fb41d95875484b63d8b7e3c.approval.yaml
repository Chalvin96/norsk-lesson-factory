    section_sources:
      understanding-a-helpful-response: '## Understanding a helpful response {#understanding-a-helpful-response
        role=model objectives=obj-ask-for-help-01}


        A helper will often first accept or refuse the request. Erik accepts with:


        ::: examples

        - no: Ja, selvfølgelig.

        - en: Yes, of course.

        :::


        Other short positive responses include:


        ::: examples

        - no: Ja, det kan jeg.

        - en: Yes, I can.

        - no: Ja, vent litt.

        - en: Yes, wait a moment.

        - no: Klart det.

        - en: Of course.

        :::


        At A1, you do not need to understand every word in a long reply. Listen first
        for whether the person is willing to help and then for the action they want
        you to take.


        Compare:


        ::: examples

        - no: Ja, selvfølgelig.

        - en: Yes, of course.

        - no: Beklager, jeg kan ikke hjelpe deg.

        - en: Sorry, I can’t help you.

        :::


        In the first response, help is available. In the second, it is not.


        A person who agrees to help may immediately give a short next action:


        ::: examples

        - no: Vent litt.

        - en: Wait a moment.

        - no: Se på skjermen.

        - en: Look at the screen.

        - no: Prøv igjen.

        - en: Try again.

        - no: Bli med meg.

        - en: Come with me.

        - no: Gå til informasjonsskranken.

        - en: Go to the information desk.

        - no: Trykk her.

        - en: Press here.

        :::


        Treat these as practical instructions to recognize. You are not learning to
        give a full set of instructions yourself; your job is to understand enough
        of the response to continue.


        **Response plus next action**


        Often the reply has two parts: acceptance and action.


        ::: examples

        - no: Ja, selvfølgelig. Vent litt.

        - en: Yes, of course. Wait a moment.

        - no: Ja, det kan jeg. Trykk her.

        - en: Yes, I can. Press here.

        - no: Klart det. Bli med meg.

        - en: Of course. Come with me.

        - no: Ja. Se på skjermen der borte.

        - en: Yes. Look at the screen over there.

        :::


        In the station dialogue, Erik gives Mina two pieces of useful information.
        First, the train leaves from platform six. Then he says:


        ::: examples

        - no: Bli med meg, så viser jeg deg veien.

        - en: Come with me, and I’ll show you the way.

        :::


        Mina does not need to produce this sentence herself. She needs to recognize
        **Bli med meg** as the action Erik wants her to take.


        **Checkpoint: listen for the next action**


        Read each response below as a complete message and state, in English, what
        you should do next.


        ::: examples

        - no: Ja, vent litt.

        - en: Yes, wait a moment.

        - no: Klart det. Trykk her.

        - en: Of course. Press here.

        - no: Ja, selvfølgelig. Bli med meg.

        - en: Yes, of course. Come with me.

        :::


        Your response should distinguish waiting, pressing the indicated place, and
        following the helper.


        {{exercise: checkpoint_listen_next_action}}


        '
