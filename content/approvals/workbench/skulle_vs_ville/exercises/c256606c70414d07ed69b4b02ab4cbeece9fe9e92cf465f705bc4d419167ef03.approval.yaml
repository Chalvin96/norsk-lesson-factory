  report-future-from-past:
    exercise_key: report-future-from-past
    checked_against:
      skulle-for-future-viewed-from-the-past: 68230779c043de710b9b41df713b1c2283fa6743088e5a78005d7425974c22d2
    section_sources:
      skulle-for-future-viewed-from-the-past: '## *Skulle* for future viewed from
        the past {#skulle-for-future-viewed-from-the-past role=model objectives=obj-skulle-vs-ville-01}


        In the reports taught here, *skulle* can express future seen from an earlier
        time, often called future in the past (*fortidens framtid*), when the report
        preserves a recoverable earlier *skal*-type plan, schedule, expectation, promise,
        or commitment.


        At the moment Sara wrote her message, being late was still in the future:


        ::: examples

        - no: Sara skrev at hun skulle bli forsinket.

        - en: Sara wrote that she would be late.

        :::


        Other examples:


        ::: examples

        - no: Læreren sa at prøven skulle begynne klokka ti.

        - en: The teacher said that the test would begin at ten.

        - no: Jonas lovet at han skulle sende dokumentet samme kveld.

        - en: Jonas promised that he would send the document that evening.

        - no: De trodde at toget skulle gå fra spor fire.

        - en: They thought that the train would leave from platform four.

        - no: Mina fortalte at hun skulle flytte til Tromsø i august.

        - en: Mina said that she was going to move to Tromsø in August.

        :::


        The event is future relative to the earlier saying, promising, or thinking.
        This chapter uses *skulle* when the report preserves an earlier *skal* meaning:
        a plan, schedule, expectation, promise, or commitment. Norwegian *ville* can
        also have future-in-the-past readings, so past viewpoint alone does not always
        determine the modal.


        Compare two reports with explicit source contexts. First, Maja had announced:
        *Jeg skal bli med*:


        ::: examples

        - no: Maja sa at hun skulle bli med.

        - en: Maja said that she would come along.

        :::


        Later, when the group asked who was willing to join, Maja volunteered:


        ::: examples

        - no: Maja sa at hun ville bli med.

        - en: Maja said that she was willing to come along.

        :::


        The first preserves an earlier plan expressed with *skal*. The second uses
        the stated request-and-volunteer context to emphasize past willingness. Without
        such context, an isolated clause with *ville* can also receive a future-in-the-past
        reading.


        **Common misconception: English *would* does not determine one Norwegian modal**


        Suppose he first said *Jeg skal komme senere*, presenting his arrival as a
        plan or commitment. A later report preserves that meaning with *skulle*:


        ::: examples

        - no: Han sa at han skulle komme senere.

        - en: He said that he would come later.

        :::


        If someone had asked who was willing to come later and he volunteered, the
        context supports *ville*:


        ::: examples

        - no: Han sa at han ville komme senere.

        - en: He said that he was willing to come later.

        :::


        *Ville* can also express future in the past in other contexts. Choose from
        the source meaning and surrounding context, not from the English word alone.


        {{exercise: report-future-from-past}}


        '
