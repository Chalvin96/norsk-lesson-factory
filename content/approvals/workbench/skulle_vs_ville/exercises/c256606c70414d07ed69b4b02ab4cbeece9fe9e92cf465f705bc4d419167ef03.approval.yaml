  review_complete_planned_actions:
    exercise_key: review_complete_planned_actions
    checked_against:
      skulle-for-an-earlier-plan: 35ce64a0d09e33ba58a86bfee5122bbdd88c7aeda09a06995596483e9f8d8ad5
    section_sources:
      skulle-for-an-earlier-plan: '## *Skulle* for an earlier plan {#skulle-for-an-earlier-plan
        role=model objectives=obj-skulle-vs-ville-01}


        Use *skulle* in the reports taught here when context preserves a recoverable
        earlier *skal*-type plan, arrangement, schedule, expectation, promise, or
        commitment.


        ::: examples

        - no: Jeg skulle ringe legen etter lunsj.

        - en: I was going to call the doctor after lunch.

        - no: Vi skulle spise sammen på fredag.

        - en: We were supposed to eat together on Friday.

        - no: Bussen skulle komme klokka halv ti.

        - en: The bus was due to arrive at half past nine.

        - no: Emil skulle hente bordene.

        - en: Emil was going to collect the tables.

        :::


        The plan may or may not have happened. *Skulle* tells us about the plan, not
        necessarily its final result.


        ::: examples

        - no: Jeg skulle ringe legen, men jeg glemte det.

        - en: I was going to call the doctor, but I forgot.

        - no: Vi skulle spise sammen, men restauranten var stengt.

        - en: We were supposed to eat together, but the restaurant was closed.

        - no: Bussen skulle komme halv ti, men den kom ikke før ti.

        - en: The bus was due at half past nine, but it did not arrive until ten.

        :::


        A useful compact rule is:


        ::: {.rule}

        Report preserving a recoverable earlier *skal*-type plan or expected arrangement:
        *skulle* + infinitive. Future-from-past viewpoint alone does not select *skulle*.

        :::


        **Plan versus past willingness**


        Compare these sentences carefully. In the second situation, Anna needed someone
        to visit and help her:


        ::: examples

        - no: Jeg skulle besøke Anna.

        - en: I was going to visit Anna.

        - no: Jeg ville besøke Anna.

        - en: I was willing to visit Anna.

        :::


        The first sentence presents the visit as an earlier plan. In the stated help
        context, the second presents the speaker as willing to make the visit.


        Another contrast. In the second situation, the group asked whether anyone
        was willing to join the trip:


        ::: examples

        - no: Per skulle bli med på turen.

        - en: Per was going to come on the trip.

        - no: Per ville bli med på turen.

        - en: Per was willing to come on the trip.

        :::


        Plans and willingness can overlap. Context and the modal show whether the
        speaker emphasizes an existing arrangement or someone’s readiness to act.


        {{exercise: notice-earlier-plans}}


        {{exercise: complete-planned-actions}}


        '
