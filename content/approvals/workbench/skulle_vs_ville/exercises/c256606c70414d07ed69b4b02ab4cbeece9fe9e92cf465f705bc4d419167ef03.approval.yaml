      back-at-the-market: '## Back at the market {#back-at-the-market role=recap objectives=obj-skulle-vs-ville-01}


        Sara arrives earlier than expected.


        ::: {.reading translation="We thought that you would come later." dialogue_id="market-follow-up"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Vi trodde at du skulle komme senere.

        :::


        ::: {.reading translation="I thought so too, but my neighbour was willing
        to drive me." dialogue_id="market-follow-up" speaker_id="sara" speaker_name="Sara"
        character_id="sara"}

        Det trodde jeg også, men naboen min ville kjøre meg.

        :::


        ::: {.reading translation="Great! You said earlier that you were willing to
        make coffee. Do you still want to?" dialogue_id="market-follow-up" speaker_id="emil"
        speaker_name="Emil" character_id="emil"}

        Flott! Du sa tidligere at du ville lage kaffe. Har du fortsatt lyst til det?

        :::


        ::: {.reading translation="Yes. If you found a large thermos, I would make
        coffee for everyone." dialogue_id="market-follow-up" speaker_id="sara" speaker_name="Sara"
        character_id="sara"}

        Ja. Hvis dere fant en stor termos, ville jeg lage kaffe til alle.

        :::


        ::: {.reading translation="The thermos was supposed to be in the kitchen,
        but I cannot find it." dialogue_id="market-follow-up" speaker_id="nora" speaker_name="Nora"
        character_id="nora"}

        Termosen skulle stå på kjøkkenet, men jeg finner den ikke.

        :::


        ::: {.reading translation="Jakob said that he would bring it. I’ll call him."
        dialogue_id="market-follow-up" speaker_id="emil" speaker_name="Emil" character_id="emil"}

        Jakob sa at han skulle ta den med. Jeg ringer ham.

        :::


        Each modal now has a clear job:


        - Sara *skulle komme senere*: an expected event.

        - The neighbour *ville kjøre*: willingness.

        - Sara said earlier that she *ville lage kaffe*: reported past willingness;
        the conditional sentence gives a hypothetical result.

        - The thermos *skulle stå på kjøkkenet*: an expectation.

        - Jakob said he *skulle ta den med*: a report preserving his earlier *skal*-type
        plan or commitment.


        {{exercise: interpret-market-follow-up}}


        '
