      short-retrieval-review: '## Short retrieval review {#short-retrieval-review
        role=recap objectives=obj-ask-for-repetition-or-clarification-01}


        Without looking back, produce one Norwegian request for each of these situations:
        you did not hear the message, the speaker is too fast, one word is unfamiliar,
        and one detail may be wrong. Then choose one situation and complete the full
        sequence: identify the problem, request help, confirm the corrected message,
        and continue.


        Your review response should use an appropriate repair move, clearly acknowledge
        the final information, and return naturally to the conversation or task.


        {{exercise: short-retrieval-review}}


