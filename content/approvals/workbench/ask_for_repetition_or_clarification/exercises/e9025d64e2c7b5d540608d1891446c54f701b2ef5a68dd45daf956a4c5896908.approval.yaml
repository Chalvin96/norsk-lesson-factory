  clarification-word-or-meaning:
    exercise_key: clarification-word-or-meaning
    checked_against:
      ask-about-the-unclear-part: 6b8adc8f5273f5d8d9a71bf50346526fa3164b4aadff3824575b9848b9db2ac3
    section_sources:
      ask-about-the-unclear-part: '## Ask about the unclear part {#ask-about-the-unclear-part
        role=model objectives=obj-ask-for-repetition-or-clarification-01}


        You may hear most of a sentence but fail to understand one word or expression.
        In that case, asking for the entire message again may be unnecessary. Point
        to the unclear part.


        ::: examples

        - no: Hva betyr «hent»?

        - en: What does “hent” mean?

        - no: Hva betyr det?

        - en: What does that mean?

        - no: Hva mener du?

        - en: What do you mean?

        :::


        These questions solve slightly different problems.


        Use **Hva betyr …?**—*What does … mean?*—when a word or expression is unfamiliar.


        ::: examples

        - no: Hva betyr «ledig»?

        - en: What does “ledig” mean?

        - no: «Ledig» betyr at ingen bruker bordet.

        - en: “Ledig” means that nobody is using the table.

        :::


        Use **Hva mener du?**—*What do you mean?*—when you heard the words but do
        not understand the speaker’s intended message.


        ::: {.reading translation="Jonas: You can take it afterwards." dialogue_id=meaning-clarification
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Du kan ta den etterpå.

        :::


        ::: {.reading translation="Mina: Sorry, what do you mean?" dialogue_id=meaning-clarification
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Unnskyld, hva mener du?

        :::


        ::: {.reading translation="Jonas: You can take a break after the customers
        leave." dialogue_id=meaning-clarification speaker_id=jonas speaker_name="Jonas"
        character_id="jonas"}

        Du kan ta pause etter at kundene går.

        :::


        ::: {.reading translation="Mina: Oh, a break afterwards. Now I understand."
        dialogue_id=meaning-clarification speaker_id=mina speaker_name="Mina" character_id="mina"}

        Å, pause etterpå. Nå forstår jeg.

        :::


        Mina does not merely request help. After Jonas explains, she states the corrected
        interpretation: **pause etterpå**—*a break afterwards*. She then confirms
        that communication can continue: **Nå forstår jeg**—*Now I understand.*


        A useful short pattern is:


        ::: examples

        - no: Hva betyr X?

        - en: What does X mean?

        - no: Det betyr Y.

        - en: It means Y.

        - no: Å, Y. Nå forstår jeg.

        - en: Oh, Y. Now I understand.

        :::


        The final line matters. It closes the repair sequence and tells the other
        person that no further explanation is needed.


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:35:20.829229+00:00'
    decision_id: null
