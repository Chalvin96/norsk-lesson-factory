  review_check_uncertain_detail:
    exercise_key: review_check_uncertain_detail
    checked_against:
      check-a-detail-with-mener-du: ad5ed13913c783c30a99ff271e84dfc900819dc04ae0644e09a98b6c940142e1
    section_sources:
      check-a-detail-with-mener-du: '## Check a detail with *Mener du …?* {#check-a-detail-with-mener-du
        role=model objectives=obj-ask-for-repetition-or-clarification-01}


        Sometimes every word is familiar, but one detail remains uncertain. Mina heard
        **bordet ved vinduet**—*the table by the window*—but there was more than one
        possible table. She checked her interpretation:


        ::: examples

        - no: Mener du det lille bordet?

        - en: Do you mean the small table?

        :::


        **Mener du …?**—*Do you mean …?*—allows you to offer your best interpretation
        and ask the speaker to confirm or correct it.


        ::: examples

        - no: Mener du i dag?

        - en: Do you mean today?

        - no: Mener du klokka to?

        - en: Do you mean at two o’clock?

        - no: Mener du bussen til sentrum?

        - en: Do you mean the bus to the city centre?

        :::


        This move is especially useful for places, times, people, numbers, and objects.


        A repair can be very short:


        ::: {.reading translation="Aksel: We’ll meet outside." dialogue_id=place-confirmation
        speaker_id=aksel speaker_name=Aksel}

        Vi møtes utenfor.

        :::


        ::: {.reading translation="Nora: Do you mean outside the library?" dialogue_id=place-confirmation
        speaker_id=nora speaker_name="Nora" character_id="nora"}

        Mener du utenfor biblioteket?

        :::


        ::: {.reading translation="Aksel: Yes, outside the library." dialogue_id=place-confirmation
        speaker_id=aksel speaker_name=Aksel}

        Ja, utenfor biblioteket.

        :::


        ::: {.reading translation="Nora: Good, see you there." dialogue_id=place-confirmation
        speaker_id=nora speaker_name="Nora" character_id="nora"}

        Fint, vi ses der.

        :::


        Nora identifies the uncertain detail, proposes an interpretation, receives
        confirmation, and continues by accepting the arrangement.


        If the interpretation is wrong, the other person corrects it:


        ::: {.reading translation="Aksel: We’ll meet outside." dialogue_id=place-correction
        speaker_id=aksel speaker_name=Aksel}

        Vi møtes utenfor.

        :::


        ::: {.reading translation="Nora: Do you mean outside the library?" dialogue_id=place-correction
        speaker_id=nora speaker_name="Nora" character_id="nora"}

        Mener du utenfor biblioteket?

        :::


        ::: {.reading translation="Aksel: No, outside the cinema." dialogue_id=place-correction
        speaker_id=aksel speaker_name=Aksel}

        Nei, utenfor kinoen.

        :::


        ::: {.reading translation="Nora: Oh, outside the cinema. See you there." dialogue_id=place-correction
        speaker_id=nora speaker_name="Nora" character_id="nora"}

        Å, utenfor kinoen. Vi ses der.

        :::


        Notice how Nora repeats the corrected place. A simple **Ja**—*Yes*—would not
        show whether she had registered the correction. **Å, utenfor kinoen**—*Oh,
        outside the cinema*—makes the repaired message explicit.


        '
