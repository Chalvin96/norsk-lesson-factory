  review_request_repetition:
    exercise_key: review_request_repetition
    checked_against:
      first-repair-move-ask-for-repetition: 53361607d71eb037bfe5ae8370044330990c0850e3d9db1e97e2c1daf1952b1c
    section_sources:
      first-repair-move-ask-for-repetition: '## First repair move: ask for repetition
        {#first-repair-move-ask-for-repetition role=model objectives=obj-ask-for-repetition-or-clarification-01}


        When you do not hear a message, ask the speaker to say it again.


        ::: examples

        - no: Unnskyld, kan du gjenta?

        - en: Sorry, can you repeat that?

        :::


        This is polite, clear, and useful in many situations. **Unnskyld** can attract
        attention or soften the request. The central request is:


        ::: examples

        - no: Kan du gjenta?

        - en: Can you repeat that?

        :::


        You can also say:


        ::: examples

        - no: Kan du si det en gang til?

        - en: Can you say that one more time?

        :::


        Both requests concern the whole message. They are useful when noise, speed,
        distance, or unfamiliar pronunciation prevents you from hearing enough.


        At the café, Mina could use either form:


        ::: examples

        - no: Unnskyld, kan du gjenta?

        - en: Sorry, can you repeat that?

        - no: Unnskyld, kan du si det en gang til?

        - en: Sorry, can you say that one more time?

        :::


        The speaker will normally understand that repetition is needed. A brief **Hva?**—*What?*—may
        sometimes be heard in casual conversation, but it can sound abrupt. At A1
        level, **Unnskyld, kan du gjenta?** is a safer general-purpose choice.


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:35:20.829229+00:00'
    decision_id: null
  review_request_slower_speech:
    exercise_key: review_request_slower_speech
    checked_against:
      when-repetition-is-not-enough-ask-for-slower-speech: de7eddd4bf1c509c745ddc096d90c1dae4dc7bcf1551f104164661d29268a3c7
    section_sources:
      when-repetition-is-not-enough-ask-for-slower-speech: '## When repetition is
        not enough: ask for slower speech {#when-repetition-is-not-enough-ask-for-slower-speech
        role=model objectives=obj-ask-for-repetition-or-clarification-01}


        Sometimes you can hear the speaker, but the message arrives too quickly. Repeating
        it at the same speed may not solve the problem. Ask the person to speak more
        slowly.


        ::: examples

        - no: Kan du snakke litt saktere?

        - en: Can you speak a little more slowly?

        - no: Litt saktere, takk.

        - en: A little more slowly, please.

        :::


        The word **litt**—*a little*—makes the request sound natural and moderate.
        **Takk**—*thank you/please*—adds politeness.


        Imagine that Jonas gives Mina several details quickly:


        ::: {.reading translation="Jonas: The customer wants two coffees, one glass
        of water, and a bun." dialogue_id=fast-order speaker_id=jonas speaker_name="Jonas"
        character_id="jonas"}

        Kunden vil ha to kaffe, ett glass vann og en bolle.

        :::


        Mina hears the words, but not clearly enough to follow the full order.


        ::: {.reading translation="Mina: Can you speak a little more slowly?" dialogue_id=fast-order
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Kan du snakke litt saktere?

        :::


        ::: {.reading translation="Jonas: Yes. Two coffees, one glass of water, and
        a bun." dialogue_id=fast-order speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Ja. To kaffe, ett glass vann og en bolle.

        :::


        ::: {.reading translation="Mina: Two coffees, one glass of water, and a bun.
        All right." dialogue_id=fast-order speaker_id=mina speaker_name="Mina" character_id="mina"}

        To kaffe, ett glass vann og en bolle. Greit.

        :::


        Here Mina does more than say that she has understood. She repeats the important
        information. This gives Jonas an opportunity to correct her if necessary.


        Compare the two repair moves:


        ::: examples

        - no: Kan du gjenta?

        - en: Can you repeat that?

        :::


        Use this when you did not hear the message or missed a large part of it.


        ::: examples

        - no: Kan du snakke litt saktere?

        - en: Can you speak a little more slowly?

        :::


        Use this when speed is the main problem.


        In real conversation, both problems can occur together. You can combine the
        requests:


        ::: examples

        - no: Kan du gjenta litt saktere?

        - en: Can you repeat that a little more slowly?

        :::


        This compact request tells the speaker exactly what would help.


        '
