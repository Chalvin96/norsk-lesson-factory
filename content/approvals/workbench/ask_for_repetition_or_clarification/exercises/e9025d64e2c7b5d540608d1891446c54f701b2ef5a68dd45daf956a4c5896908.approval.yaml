      failing-to-register-a-correction: '## Failing to register a correction {#failing-to-register-a-correction
        role=contrast objectives=obj-ask-for-repetition-or-clarification-01}


        Consider this exchange:


        ::: {.reading translation="Jonas: No, I mean table five." dialogue_id=correction-registration
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Nei, jeg mener bord fem.

        :::


        ::: {.reading translation="Mina: All right." dialogue_id=correction-registration
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Greit.

        :::


        Mina may have understood, but Jonas cannot be certain. A clearer response
        is:


        ::: examples

        - no: Å, bord fem. Greit.

        - en: Oh, table five. All right.

        :::


        Repeating the corrected detail shows that the repair worked.


        '
