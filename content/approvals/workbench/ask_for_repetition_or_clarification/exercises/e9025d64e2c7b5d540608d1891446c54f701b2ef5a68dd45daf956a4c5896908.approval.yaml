        Consider this exchange:


        ::: {.reading translation="Jonas: No, I mean table five." dialogue_id=correction-registration
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Nei, jeg mener bord fem.

        :::


        ::: {.reading translation="Mina: All right." dialogue_id=correction-registration
        speaker_id=mina speaker_name="Mina" character_id="mina"}

