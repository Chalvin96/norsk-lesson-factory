  revise-generic-pronoun-message:
    exercise_key: revise-generic-pronoun-message
    checked_against:
      returning-to-nora-and-elias: e169e5405a22dd6dee79b56a447f326a57706c0c7bcb0487b5d2b29cc7187c74
    section_sources:
      returning-to-nora-and-elias: '## Returning to Nora and Elias {#returning-to-nora-and-elias
        role=recap objectives=obj-generic-pronouns-01}


        Nora now reads the revised safety notice aloud.


        ::: examples

        - no: Når du går i fjellet, må du være forberedt på raske værskifter. Ta med
        klær som beskytter deg mot vind og regn.

        - en: When you go hiking in the mountains, you must be prepared for sudden
        changes in the weather. Bring clothes that protect you from wind and rain.

        :::


        Here **du** is intentional. The notice addresses each reader directly, and
        **deg** continues that direct second-person reference.


        The next paragraph explains a broader principle:


        ::: examples

        - no: Man bør alltid undersøke værmeldingen før man drar. Dårlig vær kan gjøre
        en usikker, og man må kjenne sine egne grenser.

        - en: One should always check the weather forecast before leaving. Bad weather
        can make one uncertain, and one must know one’s own limits.

        :::


        Here **man** provides generic subjects, **en** is the object of **gjøre**
        within the impersonal **man/en** reference, and **sine** points back to the
        generic subject as a recognition cue only.


        Finally, the office reports a pattern it has observed:


        ::: examples

        - no: Folk spør ofte om de kan gå turen uten kart.

        - en: People often ask whether they can do the hike without a map.

        :::


        This is about actual visitors as a group, so **folk** is natural.


        The forms are not competing labels for exactly the same thing. Each choice
        contributes something:


        Within an impersonal **man/en** reference, **man** gives a subject-only form
        and **en** supplies the object form while also being possible as a subject.
        **Du** involves the addressee and uses **deg** outside subject position, while
        the noun **folk** refers to people collectively and remains **folk** as an
        object.


        '
