  notice-singular-agreement:
    exercise_key: notice-singular-agreement
    checked_against:
      man-for-a-general-person: b381fc535b4a02b6797461fb4d69156c3bb0353466de78d0fb153bdcb3b86983
    section_sources:
      man-for-a-general-person: '## **Man** for a general person {#man-for-a-general-person
        role=model objectives=obj-generic-pronouns-01}


        Generic **man** is common when stating a general rule, experience, expectation,
        or human tendency. Grammatically, it functions as a subject.


        ::: examples

        - no: Man lærer mye av å gjøre feil.

        - en: You learn a lot from making mistakes.

        - no: Man må ha billett for å ta toget.

        - en: You need a ticket to take the train.

        - no: I Norge tar man ofte av seg skoene når man kommer inn.

        - en: In Norway, people often take off their shoes when they come inside.

        :::


        English often translates **man** with generic you, people, one, or a passive
        construction. Do not expect one fixed English equivalent.


        ::: examples

        - no: Her kan man kjøpe mat hele døgnet.

        - en: Food can be bought here around the clock.

        :::


        The Norwegian sentence literally presents a general person who can buy food.
        Natural English may instead use a passive form.


        Although **man** refers broadly to people, it is grammatically singular:


        ::: examples

        - no: Man blir ofte trøtt etter en lang arbeidsdag.

        - en: People often become tired after a long workday.

        :::


        The predicative adjective is singular **trøtt**, not plural **trøtte**. This
        agreement makes the grammatical singular visible even though **man** refers
        broadly to people.


        '
    outcome: approved
    note: null
    reason: null
