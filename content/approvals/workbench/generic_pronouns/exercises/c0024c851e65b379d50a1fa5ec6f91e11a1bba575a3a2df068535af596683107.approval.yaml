  recognize-generic-en-subject:
    exercise_key: recognize-generic-en-subject
    checked_against:
      generic-en-as-a-subject: 13baf8c3c76ef11274bd6b59ded60e776e6397bd03008cdac9be0fa1056ce594
    section_sources:
      generic-en-as-a-subject: '## Generic **en** as a subject {#generic-en-as-a-subject
        role=model objectives=obj-generic-pronouns-01}


        **En** can also replace subject **man**:


        ::: examples

        - no: En lærer mye av å gjøre feil.

        - en: One learns a lot from making mistakes.

        - no: Når en bor alene, må en planlegge økonomien nøye.

        - en: When one lives alone, one has to plan one’s finances carefully.

        :::


        This use is established Bokmål, though preferences vary by speaker, region,
        and style. In many contexts, **man** is the more immediately neutral subject
        choice. Some speakers consistently prefer **en**, especially when they wish
        to avoid **man** or maintain the same generic reference across a passage.


        The important grammatical contrast within this impersonal pattern is not that
        **en** is always an object. It is that **man** is restricted to subject position,
        while **en** is not.


        '
    outcome: approved
