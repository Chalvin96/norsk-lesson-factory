  discriminate-man-en-full-response:
    exercise_key: discriminate-man-en-full-response
    checked_against:
      sentence-role-man-cannot-be-an-object: 6036eb9a50403d0e3469f43852251a894de78967b985636df41befba07813edf
    section_sources:
      sentence-role-man-cannot-be-an-object: '## Sentence role: **man** cannot be
        an object {#sentence-role-man-cannot-be-an-object role=model objectives=obj-generic-pronouns-01}


        This is the grammatical problem Nora notices in the draft.


        ::: examples

        - no: Dårlig vær kan gjøre en usikker.

        - en: Bad weather can make you uncertain.

        :::


        Here, bad weather is the subject, and the affected person is the object. Within
        the intended impersonal **man/en** reference, Norwegian uses **en**, not **man**,
        for that object.


        ::: examples

        - no: Slike kommentarer kan gjøre en nervøs.

        - en: Comments like that can make one nervous.

        - no: Ingen liker å bli behandlet som om en ikke forstår noe.

        - en: No one likes to be treated as though one does not understand anything.

        :::


        In the second example, **en** is the subject of the subordinate clause after
        **som om**. It still refers to a generic person.


        Compare the roles:


        ::: examples

        - no: Man blir lett sliten i sterk varme.

        - en: You easily become tired in intense heat.

        - no: Sterk varme kan gjøre en sliten.

        - en: Intense heat can make you tired.

        :::


        In the first sentence, the generic person is the subject, so **man** is possible.
        In the second, the generic person is the object of **gjøre** within the same
        impersonal **man/en** reference, so **en** is required.


        A compact rule is:


        ::: {.rule}

        Within an impersonal **man/en** reference, use **man** only as a generic subject
        and **en** as the object form. **En** may also appear as a generic subject,
        depending on style. Generic **du** instead has object form **deg**, while
        the noun **folk** remains **folk** when used as an object.

        :::


        A common mistake is to treat **man** as if it had the same form in every position.


        ::: examples

        - no: Denne erfaringen lærer en å være forsiktig.

        - en: This experience teaches one to be careful.

        :::


        Not:


        ::: examples

        - no: ✗ Denne erfaringen lærer man å være forsiktig.

        - en: This experience teaches one to be careful.

        :::


        The rejected version does not express the intended object meaning. It instead
        encourages the reader to parse **man** as the subject of what follows.


        '
    outcome: approved
