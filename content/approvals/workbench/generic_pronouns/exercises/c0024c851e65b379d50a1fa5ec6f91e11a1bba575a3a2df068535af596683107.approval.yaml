  discriminate-man-folk-full-response:
    exercise_key: discriminate-man-folk-full-response
    checked_against:
      folk-for-people-as-a-group: d91c6152034e828728d4e0e4e55c4a2f0d5b1e6ea1a4bfc6579fb4e037830e25
    section_sources:
      folk-for-people-as-a-group: '## **Folk** for people as a group {#folk-for-people-as-a-group
        role=model objectives=obj-generic-pronouns-01}


        **Folk** is a noun meaning people. It commonly refers to a group, category,
        or population rather than to an abstract representative person.


        ::: examples

        - no: Folk spør ofte hvor lang turen er.

        - en: People often ask how long the hike is.

        - no: Mange folk undervurderer hvor raskt været kan skifte.

        - en: Many people underestimate how quickly the weather can change.

        - no: Vi prøver å gi folk tydelig informasjon.

        - en: We try to give people clear information.

        :::


        Unlike **man**, **folk** can be either subject or object without changing
        form:


        ::: examples

        - no: Folk trenger tydelige råd.

        - en: People need clear advice.

        - no: Tydelige råd hjelper folk.

        - en: Clear advice helps people.

        :::


        The meaning also differs slightly from **man**. Compare:


        ::: examples

        - no: Man glemmer lett tiden når man har det hyggelig.

        - en: You easily lose track of time when you are enjoying yourself.

        - no: Folk glemmer ofte tiden på denne kafeen.

        - en: People often lose track of time in this café.

        :::


        The first sounds like a general human tendency. The second suggests an observed
        pattern among actual café customers.


        Similarly:


        ::: examples

        - no: Man bruker mindre strøm hvis man senker temperaturen.

        - en: You use less electricity if you lower the temperature.

        - no: Folk bruker mindre strøm enn før.

        - en: People use less electricity than before.

        :::


        The **man** sentence describes what happens to any person under a condition.
        The **folk** sentence makes a claim about people collectively.


        Do not assume that **folk** is simply a more informal substitute for **man**.
        It changes the perspective from a representative individual to a group.


        '
    outcome: approved
    note: null
    reason: null
    comment: null
