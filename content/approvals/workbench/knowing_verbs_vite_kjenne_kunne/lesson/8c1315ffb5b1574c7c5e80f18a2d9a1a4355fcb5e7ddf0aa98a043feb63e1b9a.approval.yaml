      stand. Its dialogue says only that Arne showed Lea where they belong, without
      supplying the actual location. Even the earlier lesson only mentions that Arne
      showed her a cupboard, so an independently attempted exercise cannot supply
      this requested concrete fact. The rubric instead checks merely that Lea knows
      where they belong.
