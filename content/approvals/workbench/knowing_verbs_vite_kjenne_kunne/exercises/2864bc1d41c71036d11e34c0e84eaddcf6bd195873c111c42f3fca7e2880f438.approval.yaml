    exercise_key: contextual_practice_lea_first_day
    checked_against:
      back-at-the-community-centre: addf47ff25d203f3bce05b3154b1615cd44f927d293eba2a8b41e1868dde8a58
    section_sources:
      back-at-the-community-centre: '## Back at the community centre {#back-at-the-community-centre
        role=model objectives=obj-knowing-verbs-vite-kjenne-kunne-01}


        Later that morning, after Mari, Lea, and Arne have spent time setting up rooms
        and talking together, Mari and Lea go into the kitchen to prepare coffee.


        ::: {.reading translation=''Hi, Lea. We’ve been working together for a while
        now. Did you know Arne before today?'' dialogue_id=''later-morning-community-centre''
        speaker_id=''mari'' speaker_name="Mari" character_id="mari"}

        Hei, Lea. Nå har vi jobbet sammen en stund. Kjenner du Arne fra før?

        :::


        ::: {.reading translation=''No, I met him today. But after working together,
        I know both you and Arne a little now.'' dialogue_id=''later-morning-community-centre''
        speaker_id=''lea'' speaker_name="Lea" character_id="lea"}

        Nei, jeg møtte ham i dag. Men etter at vi har jobbet sammen, kjenner jeg både
        deg og Arne litt nå.

        :::


        ::: {.reading translation=''Do you know where we should put the cups?'' dialogue_id=''later-morning-community-centre''
        speaker_id=''mari'' speaker_name="Mari" character_id="mari"}

        Vet du hvor vi skal sette koppene?

        :::


        ::: {.reading translation=''Yes, Arne showed me the cupboard.'' dialogue_id=''later-morning-community-centre''
        speaker_id=''lea'' speaker_name="Lea" character_id="lea"}

        Ja, Arne viste meg skapet.

        :::


        ::: {.reading translation=''Good. Do you also know how to make tea with this
        machine?'' dialogue_id=''later-morning-community-centre'' speaker_id=''mari''
        speaker_name="Mari" character_id="mari"}

        Bra. Kan du også lage te med denne maskinen?

        :::


        ::: {.reading translation=''I can do that. Now I know the kitchen quite well
        too.'' dialogue_id=''later-morning-community-centre'' speaker_id=''lea'' speaker_name="Lea"
        character_id="lea"}

        Det kan jeg. Nå kjenner jeg kjøkkenet ganske godt også.

        :::


        Lea’s knowledge has changed during the morning. She now **kjenner** Mari a
        little because they have spent time talking and working together. She **vet**
        where the cups belong because Arne gave her that information. She **kan**
        make tea because she has the practical ability to use the machine.


        **Contextual practice: Lea explains her first day**


        Imagine that Lea sends a message to a friend after the event. Ask the learner
        to describe what Lea now knows about the building, the organisers, the schedule,
        and the kitchen tasks. The response should include facts, familiarity, and
        skills, but every sentence should still serve the single goal of choosing
        among **vite**, **kjenne**, and **kunne**.


        {{exercise: contextual_practice_lea_first_day}}


        '
