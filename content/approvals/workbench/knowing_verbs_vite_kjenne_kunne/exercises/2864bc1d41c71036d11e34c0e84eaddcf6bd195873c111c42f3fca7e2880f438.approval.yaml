        **vite** for information from the staff list, **kjenne** for the colleague
        the employee has worked closely with without claiming familiarity with the
        rest of the team, and **kunne** for the learned software skill.


        {{exercise: further_practice_new_workplace}}


        **Visiting another town**


        Picture two friends arriving in Bergen. One knows the address of their hotel,
