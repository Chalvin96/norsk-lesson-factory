  notice_identity_or_familiarity:
    exercise_key: notice_identity_or_familiarity
    checked_against:
      kjenne-being-familiar-with-someone-or-something: 1a3f38066ad565135057710f1012f9b9deb87ea0d86267211b418e895a90195e
    section_sources:
      kjenne-being-familiar-with-someone-or-something: '## Kjenne: being familiar
        with someone or something {#kjenne-being-familiar-with-someone-or-something
        role=contrast objectives=obj-knowing-verbs-vite-kjenne-kunne-01}


        Use **kjenne** when the point is familiarity gained through contact or experience.
        You may **kjenne** a person because you have met and interacted with them.
        You may also **kjenne** a city, neighbourhood, building, book, or type of
        situation because it is familiar to you.


        Arne asks Lea:


        ::: examples

        - no: Kjenner du Mari?

        - en: Do you know Mari?

        :::


        He is not asking whether Lea has information about Mari. He wants to know
        whether Mari is personally familiar to her.


        Lea answers:


        ::: examples

        - no: Nei, men jeg vet hvem hun er.

        - en: No, but I know who she is.

        :::


        This contrast is useful:


        ::: examples

        - no: Jeg kjenner Mari.

        - en: I know Mari.

        :::


        ::: examples

        - no: Jeg vet hvem Mari er.

        - en: I know who Mari is.

        :::


        The first sentence suggests personal familiarity. The second says only that
        the speaker knows Mari’s identity. You can know who someone is without knowing
        that person personally.


        The same distinction appears with places.


        ::: examples

        - no: Jeg kjenner Trondheim ganske godt.

        - en: I know Trondheim quite well.

        :::


        ::: examples

        - no: Jeg vet hvor Trondheim ligger.

        - en: I know where Trondheim is.

        :::


        In the first sentence, the speaker is familiar with the city. Perhaps they
        have lived there, visited often, or know their way around. In the second,
        the speaker knows a geographical fact.


        More examples:


        ::: examples

        - no: Kjenner du den nye naboen?

        - en: Do you know the new neighbour?

        :::


        ::: examples

        - no: Jeg kjenner ikke dette området så godt.

        - en: I don’t know this area very well.

        :::


        ::: examples

        - no: Hun kjenner restauranten fra før.

        - en: She is already familiar with the restaurant.

        :::


        ::: examples

        - no: Vi kjenner familien hennes godt.

        - en: We know her family well.

        :::


        ::: examples

        - no: Han kjenner systemet etter mange år i firmaet.

        - en: He knows the system after many years at the company.

        :::


        The phrase **kjenne til** often means to be familiar with something or to
        know of its existence.


        ::: examples

        - no: Kjenner du til denne forfatteren?

        - en: Are you familiar with this author?

        :::


        ::: examples

        - no: Jeg kjenner til problemet, men jeg vet ikke alle detaljene.

        - en: I am aware of the problem, but I don’t know all the details.

        :::


        The contrast remains the same: **kjenne til problemet** expresses familiarity
        or awareness, while **vite hvorfor problemet oppstod** expresses factual knowledge.


        **Checkpoint: familiarity or identity**


        Return to Lea’s first day at the community centre. Imagine she has seen Mari’s
        name on the schedule but has never spoken to her. Describe what Lea knows
        using one sentence about Mari’s identity and one sentence about personal familiarity.


        {{exercise: checkpoint_familiarity_or_identity}}


        '
