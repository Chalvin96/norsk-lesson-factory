    checked_against:
      three-questions-with-three-meanings: b72461f47840cd073985d436cadd21e2018d2271f3aaec626880167511f26552
    section_sources:
      three-questions-with-three-meanings: '## Three questions with three meanings
        {#three-questions-with-three-meanings role=contrast objectives=obj-knowing-verbs-vite-kjenne-kunne-01}


        The difference becomes clearer when all three verbs appear in similar questions.


        ::: examples

        - no: Vet du hvem pianisten er?

        - en: Do you know who the pianist is?

        :::


        This asks for a fact: the pianist’s identity.


        ::: examples

        - no: Kjenner du pianisten?

        - en: Do you know the pianist?

        :::


        This asks about personal familiarity.


        ::: examples

        - no: Kan du spille piano?

        - en: Can you play the piano?

        :::


        This asks about a learned skill.


        Here is another aligned set:


        ::: examples

        - no: Vet du hvor svømmehallen er?

        - en: Do you know where the swimming pool is?

        :::


        ::: examples

        - no: Kjenner du svømmehallen?

        - en: Are you familiar with the swimming pool?

        :::


        ::: examples

        - no: Kan du svømme?

        - en: Can you swim?

        :::


        The first question asks for location information. The second asks whether
        the place is familiar. The third asks about an ability.


        And one more:


        ::: examples

        - no: Vet du hva dette programmet heter?

        - en: Do you know what this program is called?

        :::


        ::: examples

        - no: Kjenner du dette programmet?

        - en: Are you familiar with this program?

        :::


        ::: examples

        - no: Kan du bruke dette programmet?

        - en: Do you know how to use this program?

        :::


        These questions could all arise in one conversation, but they request different
        kinds of knowledge.


        **Checkpoint: compare matched situations**


        For each of several shared topics—a colleague, a town, a computer program,
        and a musical instrument—form or complete questions that ask separately about
        a fact, familiarity, and a learned ability. Keep each topic constant while
        changing the kind of knowing.


        '
