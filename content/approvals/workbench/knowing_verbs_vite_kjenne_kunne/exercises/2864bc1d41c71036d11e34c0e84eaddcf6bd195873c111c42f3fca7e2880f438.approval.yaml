exercise_alignments:
  checkpoint_identify_information:
    exercise_key: checkpoint_identify_information
    checked_against:
      vite-knowing-a-fact: c41364293ba0471ad54fa895858b54c3e4d82047ef86514dae2015681b9dd33e
    section_sources:
      vite-knowing-a-fact: '## Vite: knowing a fact {#vite-knowing-a-fact role=model
        objectives=obj-knowing-verbs-vite-kjenne-kunne-01}


        Use **vite** when knowledge can be understood as information: a time, an address,
        a reason, an answer, or some other fact.


        In the dialogue, Arne asks:


        ::: examples

        - no: Vet du hvor kjøkkenet er?

        - en: Do you know where the kitchen is?

        :::


        The location of the kitchen is information. Lea can give that information
        as an answer.


        ::: examples

        - no: Jeg vet hvor kjøkkenet er.

        - en: I know where the kitchen is.

        :::


        Other common fact patterns include **vite at** for knowing that something
        is true and **vite hvem, hva, hvor, når, hvorfor**, or **hvordan** for knowing
        a piece of information.


        ::: examples

        - no: Jeg vet at møtet begynner klokka ni.

        - en: I know that the meeting starts at nine.

        :::


        ::: examples

        - no: Vet du hvem som har nøkkelen?

        - en: Do you know who has the key?

        :::


        ::: examples

        - no: Hun vet hvorfor bussen er forsinket.

        - en: She knows why the bus is delayed.

        :::


        ::: examples

        - no: Vi vet ikke når butikken stenger.

        - en: We don’t know when the shop closes.

        :::


        ::: examples

        - no: Vet dere hva adressen er?

        - en: Do you know what the address is?

        :::


        When the fact has already been mentioned, **vite** can also be followed by
        a pronoun.


        ::: examples

        - no: Vet du det?

        - en: Do you know that?

        :::


        ::: examples

        - no: Ja, jeg vet det.

        - en: Yes, I know that.

        :::


        **Checkpoint: identify information**


        Read several short situations involving times, names, locations, and reasons.
        For each one, decide whether the speaker is asking for or reporting factual
        information. Then complete a sentence with the present form of **vite**.


        {{exercise: checkpoint_identify_information}}


        '
