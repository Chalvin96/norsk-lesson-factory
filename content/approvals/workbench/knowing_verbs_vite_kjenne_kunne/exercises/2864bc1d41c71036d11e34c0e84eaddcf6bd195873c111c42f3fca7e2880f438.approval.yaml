  select_information_or_ability:
    exercise_key: select_information_or_ability
    checked_against:
      kunne-having-a-learned-skill-or-ability: d758c161dc97e50e14302a64ba5a2a4de96f559d1468f861a2e2665d547ebb02
    section_sources:
      kunne-having-a-learned-skill-or-ability: '## Kunne: having a learned skill or
        ability {#kunne-having-a-learned-skill-or-ability role=model objectives=obj-knowing-verbs-vite-kjenne-kunne-01}


        Use **kunne** when someone has learned how to do something or has the ability
        to do it. Its present form is **kan**.


        At the community centre, Arne asks:


        ::: examples

        - no: Kan du lage kaffe med den store maskinen?

        - en: Do you know how to make coffee with the large machine?

        :::


        Lea has used this type of machine before, so she answers:


        ::: examples

        - no: Jeg kan bruke en slik maskin.

        - en: I know how to use that kind of machine.

        :::


        With a verb, **kan** is normally followed by the infinitive without **å**.


        ::: examples

        - no: Jeg kan svømme.

        - en: I can swim.

        :::


        ::: examples

        - no: Hun kan reparere sykler.

        - en: She knows how to repair bicycles.

        :::


        ::: examples

        - no: Kan dere bruke dette programmet?

        - en: Do you know how to use this program?

        :::


        ::: examples

        - no: Han kan ikke kjøre bil.

        - en: He cannot drive.

        :::


        A language can also be treated as a learned ability.


        ::: examples

        - no: Kan du norsk?

        - en: Do you know Norwegian?

        :::


        ::: examples

        - no: Hun kan litt spansk.

        - en: She knows a little Spanish.

        :::


        Keep the focus on an ability the person possesses. Compare factual knowledge
        with practical ability:


        ::: examples

        - no: Jeg vet hvordan kaffemaskinen fungerer.

        - en: I know how the coffee machine works.

        :::


        ::: examples

        - no: Jeg kan bruke kaffemaskinen.

        - en: I know how to use the coffee machine.

        :::


        The first sentence concerns information about the machine’s operation. The
        second says that the speaker has the practical ability to operate it. Someone
        might understand how a machine works in theory but still be unable to use
        it confidently.


        Another contrast:


        ::: examples

        - no: Emil vet hvordan man skifter et dekk.

        - en: Emil knows how to change a tyre.

        :::


        ::: examples

        - no: Emil kan skifte et dekk.

        - en: Emil knows how to change a tyre.

        :::


        The sentence with **vet hvordan** reports knowledge of the procedure. The
        sentence with **kan** presents changing a tyre as Emil’s skill.


        **Checkpoint: information or ability**


        Use the event context again. Lea has read and understood the operating procedure
        for the sound system, but she has never operated it. Describe her factual
        knowledge of how the system works, then state whether the available context
        supports saying that she has the practical skill to use it.


        {{exercise: checkpoint_information_or_ability}}


        '
