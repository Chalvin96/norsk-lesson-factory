  diagnose_particle_misfit_in_exchange:
    exercise_key: diagnose_particle_misfit_in_exchange
    checked_against:
      one-sentence-four-moves: 12a3994ec58a11f174f807c46cd61fdafd7112b50987bd1921708d4433aeb9e4
    section_sources:
      one-sentence-four-moves: '## One Sentence, Four Moves {#one-sentence-four-moves
        role=contrast objectives=obj-vel-jo-nok-da-in-conversation-01}


        Take one plain sentence and watch each particle change what the speaker is
        doing with it.


        ::: examples

        - no: Han kommer jo klokka åtte.

        - en: He''s coming at eight, you know.

        - no: Han kommer vel klokka åtte?

        - en: He''s coming at eight, isn''t he?

        - no: Han kommer nok klokka åtte.

        - en: He''ll no doubt come at eight.

        - no: Han kommer klokka åtte, da.

        - en: He''s coming at eight, then.

        :::


        The first treats the arrangement as shared. The second tentatively checks
        an

        expectation. The third presents eight o''clock as the likely assessment. The
        fourth

        settles what follows around his arrival. Four sentences, one grammar, four
        different

        conversational tendencies.


        Use four questions as guides, not as an automatic algorithm. Is the claim
        treated as

        shared? — *jo*. Is the speaker tentatively checking an expectation? — often
        *vel*.

        Is the claim presented as likely? — often *nok*. Does the turn respond to
        or settle

        what follows? — conversational *da*. More than one wording may be possible,
        so use

        the whole exchange and its intonation.


        Resist translating tags word for word. English *you know* can be *jo* when
        the speaker presents the claim as shared or readily acceptable background;
        as a pure filler it has no *jo* equivalent. English *right?* can be *vel*
        when you truly wonder, or a pressing *jo* when you expect a nod. And *of course*
        is *jo* inside a sentence but *selvfølgelig* as a reply. The stance decides,
        not the English phrase.


        You will also hear the particles stacked, and that is not a mistake. In *Vi
        tar vel toget, da?* the speaker is both unsure (*vel*) and ready to settle
        (*da*) — agreeing with a sigh. These uses are especially common in conversation
        and informal writing; genre and voice determine whether they fit more formal
        prose.


        {{exercise: diagnose_particle_misfit_in_exchange}}


        '
