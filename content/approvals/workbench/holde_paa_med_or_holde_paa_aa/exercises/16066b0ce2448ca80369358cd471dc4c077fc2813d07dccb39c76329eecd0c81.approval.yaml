      final-practice-in-a-new-situation: '## Final practice in a new situation {#final-practice-in-a-new-situation
        role=model objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        Imagine a family preparing to leave for a weekend trip. One person is occupied
        with the luggage, another with breakfast, and another with the car. First
        describe each broad task using **holde på med**. Then make each description
        more precise by saying that someone is packing clothes, making sandwiches,
        or checking the tires, using **holde på å**.


        Next, turn one pair of descriptions into a brief dialogue. One speaker asks
        what the other is doing, receives a broad answer, and follows up with a question
        about a specific action. Your response should use the two patterns consistently
        and make the shift from activity to action clear.


        {{exercise: final_practice_new_situation}}


