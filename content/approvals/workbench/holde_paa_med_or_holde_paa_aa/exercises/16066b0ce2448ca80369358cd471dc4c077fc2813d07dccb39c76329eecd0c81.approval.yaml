    decision_id: null
  select_unfolding_action_reply:
    exercise_key: select_unfolding_action_reply
    checked_against:
      showing-an-unfolding-action: 89a6bd4a705a7e78f4741ac5076408ab864bf8da16ca6fc5e5e675d075f705cd
    section_sources:
      showing-an-unfolding-action: '## Showing an unfolding action: holde på å {#showing-an-unfolding-action
        role=contrast objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        Use **holde på å** before an infinitive when you want to show an action unfolding
        or developing.


        The pattern is:


        **holde på å + infinitive**


        The infinitive marker is **å**, followed by the infinitive form of the verb.


        ::: examples

        - no: Jonas holder på å male bokhylla.

        - en: Jonas is painting the bookcase.

        - no: Sara holder på å skrive en melding.

        - en: Sara is writing a message.

        - no: Barna holder på å rydde rommet.

        - en: The children are tidying the room.

        - no: Vi holder på å lage middag.

        - en: We are making dinner.

        - no: Hva holder de på å gjøre?

        - en: What are they doing?

        :::


        This construction focuses on the action itself. Compare Jonas’s two descriptions:


        ::: examples

        - no: Jeg holder på med bokhylla.

        - en: I’m working on the bookcase.

        - no: Jeg holder på å male bokhylla.

        - en: I’m painting the bookcase.

        :::


        The first sentence names the object or task. It leaves the exact action open.
        The second says precisely what is happening: Jonas is painting.


        The same distinction appears in these pairs:


        ::: examples

        - no: Nora holder på med middagen.

        - en: Nora is working on dinner.

        - no: Nora holder på å kutte grønnsaker.

        - en: Nora is cutting vegetables.

        - no: Amir holder på med bilen.

        - en: Amir is working on the car.

        - no: Amir holder på å skifte et dekk.

        - en: Amir is changing a tire.

        - no: Elevene holder på med en presentasjon.

        - en: The pupils are working on a presentation.

        - no: Elevene holder på å finne bilder til presentasjonen.

        - en: The pupils are finding pictures for the presentation.

        :::


        In each pair, **med** introduces the named activity or project. **Å** introduces
        the infinitive action unfolding within that activity.


        **Checkpoint: make the action more precise**


        Return to the three people from the previous checkpoint. Replace each broad
        description with a more precise action: the student is answering the final
        question, the cook is washing vegetables, and the cyclist is tightening a
        screw. Use **holde på å** followed by the appropriate infinitive.


        Your response should replace the named activity with an infinitive action
        and use **å**, not **med**, before that infinitive.


        '
    outcome: approved
