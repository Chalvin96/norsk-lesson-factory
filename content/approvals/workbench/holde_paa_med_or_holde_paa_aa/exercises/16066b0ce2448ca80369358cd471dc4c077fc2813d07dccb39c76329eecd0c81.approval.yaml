  select_named_activity_reply:
    exercise_key: select_named_activity_reply
    checked_against:
      naming-an-activity: 9bb8d5673f616ea36e7d2bb1607ae3c002465b05797137e84fdc3a415ce049e3
    section_sources:
      naming-an-activity: '## Naming an activity: holde på med {#naming-an-activity
        role=contrast objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        Use **holde på med** before a noun or a noun-like expression. The noun names
        the activity, task, subject, or project occupying someone.


        The pattern is:


        **holde på med + noun or nominal activity**


        Here, **nominal activity** simply means an activity expressed as a thing or
        a named task rather than as an infinitive verb.


        ::: examples

        - no: Jonas holder på med oppussingen.

        - en: Jonas is working on the renovation.

        - no: Han holder på med kjøkkenet.

        - en: He is working on the kitchen.

        - no: Sara holder på med leksene.

        - en: Sara is doing her homework.

        - no: Vi holder på med et nytt prosjekt.

        - en: We are working on a new project.

        - no: Hva holder dere på med?

        - en: What are you doing?

        :::


        The question **Hva holder du på med?** is extremely useful. Literally, it
        asks what activity someone is occupied with. In ordinary conversation, it
        often corresponds to What are you doing? or What are you working on?


        The answer can name a broad activity:


        ::: examples

        - no: Jeg holder på med norskleksene.

        - en: I’m working on my Norwegian homework.

        :::


        It can name a physical object that represents the work being done:


        ::: examples

        - no: Jeg holder på med sykkelen.

        - en: I’m working on the bicycle.

        :::


        It can also name a larger project:


        ::: examples

        - no: De holder på med en rapport om kollektivtransport.

        - en: They are working on a report about public transport.

        :::


        With **med**, the listener learns what task, subject, or project occupies
        the person. The sentence does not necessarily identify the exact action taking
        place at that second. Jonas may be painting, measuring, cleaning, or moving
        furniture as part of **oppussingen**.


        **Checkpoint: identify the named activity**


        Imagine three people during a busy afternoon: one is occupied with a school
        assignment, one with dinner, and one with repairs to a bicycle. Describe each
        person using **holde på med** and a suitable noun expression.


        '
    outcome: approved
    note: null
    reason: null
    comment: null
