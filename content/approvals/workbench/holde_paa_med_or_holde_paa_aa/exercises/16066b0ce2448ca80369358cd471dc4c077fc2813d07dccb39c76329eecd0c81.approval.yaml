  revise_status_message:
    exercise_key: revise_status_message
    checked_against:
      common-mistakes: cb1ce2ebb33e78f4752c17f58e99d58341ece13610f757eaef5bc4ec8ba5acf0
    section_sources:
      common-mistakes: '## Common mistakes {#common-mistakes role=contrast objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        **Using med directly before an infinitive**


        Do not use the clean **med + noun** pattern and then place a bare infinitive
        after it.


        Incorrect target pattern:


        ::: examples

        - no: ✗ Jeg holder på med lage middag.

        - en: ✗ I am making dinner.

        :::


        Use an infinitive action after **å**:


        ::: examples

        - no: Jeg holder på å lage middag.

        - en: I am making dinner.

        :::


        Or replace the verb with a named task after **med**:


        ::: examples

        - no: Jeg holder på med middagen.

        - en: I am working on dinner.

        :::


        The key question is not simply whether the general meaning is similar. Look
        at the form that follows: **lage** is an infinitive, while **middagen** is
        a noun.


        **Using å before a noun**


        The infinitive marker **å** must introduce an infinitive, not a noun.


        Incorrect:


        ::: examples

        - no: ✗ Hun holder på å rapporten.

        - en: ✗ She is working on the report.

        :::


        Correct with a noun:


        ::: examples

        - no: Hun holder på med rapporten.

        - en: She is working on the report.

        :::


        Correct with an infinitive:


        ::: examples

        - no: Hun holder på å skrive rapporten.

        - en: She is writing the report.

        :::


        **Forgetting that the two versions differ in focus**


        These sentences are both possible, but they do not provide the same amount
        of detail:


        ::: examples

        - no: Jeg holder på med vinduene.

        - en: I’m working on the windows.

        - no: Jeg holder på å vaske vinduene.

        - en: I’m washing the windows.

        :::


        The first does not tell us exactly what is being done to the windows. The
        second identifies the action.


        **Checkpoint: repair the structure**


        Take several short descriptions in which **med** has accidentally been placed
        before an infinitive or **å** before a noun. Repair each one without changing
        the intended meaning. Where useful, produce two repairs: one with a noun after
        **med**, and one with an infinitive after **å**.


        Check the grammatical form after the phrase rather than choosing only from
        the English translation.


        {{exercise: repair_the_structure}}


        '
