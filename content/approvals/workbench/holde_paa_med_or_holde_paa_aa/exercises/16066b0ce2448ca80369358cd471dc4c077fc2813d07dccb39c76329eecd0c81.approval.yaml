    checked_against:
      room-in-the-middle-of-a-makeover: 7d05bdfa372197f55a72895993ea4618686ca290dcdaefa7534599a19d5b4a46
    section_sources:
      room-in-the-middle-of-a-makeover: '## A room in the middle of a makeover {#room-in-the-middle-of-a-makeover
        role=orient objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        Sara calls her friend Jonas on Saturday morning. He has recently moved into
        a small apartment and is trying to finish several jobs before friends visit
        that evening.


        ::: {.reading translation="Hi, Jonas. What are you doing?" dialogue_id="room-makeover"
        speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Hei, Jonas. Hva holder du på med?

        :::


        ::: {.reading translation="I’m painting the bookcase." dialogue_id="room-makeover"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Jeg holder på å male bokhylla.

        :::


        ::: {.reading translation="Are you still working on the renovation?" dialogue_id="room-makeover"
        speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Holder du fortsatt på med oppussingen?

        :::


        ::: {.reading translation="Yes. I’m also working on the kitchen, but the bookcase
        has to be finished first." dialogue_id="room-makeover" speaker_id="jonas"
        speaker_name="Jonas" character_id="jonas"}

        Ja. Jeg holder også på med kjøkkenet, men bokhylla må bli ferdig først.

        :::


        ::: {.reading translation="Can I drop by later?" dialogue_id="room-makeover"
        speaker_id="sara" speaker_name="Sara" character_id="sara"}

        Kan jeg komme innom senere?

        :::


        ::: {.reading translation="Sure, but not right now. I’m moving the bookcase,
        and it’s very heavy." dialogue_id="room-makeover" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Gjerne, men ikke akkurat nå. Jeg holder på å flytte bokhylla, og den er veldig
        tung.

        :::


        ::: {.reading translation="Be careful!" dialogue_id="room-makeover" speaker_id="sara"
        speaker_name="Sara" character_id="sara"}

        Gjør det forsiktig!

        :::


        ::: {.reading translation="Wait a moment … I’m moving the heavy bookcase!"
        dialogue_id="room-makeover" speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Vent litt … Jeg holder på å flytte den tunge bokhylla!

        :::


        Jonas describes the same general situation in two different ways. Sometimes
        he names an activity or project:


        ::: examples

        - no: Jeg holder på med oppussingen.

        - en: I’m working on the renovation.

        :::


        At other times he describes an action unfolding at that moment:


        ::: examples

        - no: Jeg holder på å male bokhylla.

        - en: I’m painting the bookcase.

        :::


        The choice between **holde på med** and **holde på å** depends on what comes
        next.


        '
