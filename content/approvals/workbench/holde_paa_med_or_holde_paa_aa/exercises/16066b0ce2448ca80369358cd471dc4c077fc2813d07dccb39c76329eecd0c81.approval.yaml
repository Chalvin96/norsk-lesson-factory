  ask_then_narrow_the_focus:
    exercise_key: ask_then_narrow_the_focus
    checked_against:
      questions-in-conversation: e7cee11f788b64d6ed5c110c4f7c8ace1785fae1f5a96718ecdc2d364221a25f
    section_sources:
      questions-in-conversation: '## Questions in conversation {#questions-in-conversation
        role=model objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        The contrast also helps you ask different kinds of questions.


        ::: examples

        - no: Hva holder du på med?

        - en: What are you doing?

        :::


        This open question asks for the activity or situation occupying the person.
        An answer can be broad:


        ::: examples

        - no: Jeg holder på med en jobbsøknad.

        - en: I’m working on a job application.

        :::


        If you already know the likely action, you can ask about that unfolding action:


        ::: examples

        - no: Holder du på å skrive en jobbsøknad?

        - en: Are you writing a job application?

        :::


        The answer can confirm or correct the action:


        ::: examples

        - no: Ja, jeg holder på å skrive den nå.

        - en: Yes, I’m writing it now.

        - no: Nei, jeg holder på med CV-en først.

        - en: No, I’m working on the CV first.

        :::


        Notice how the speakers move naturally between the two patterns. The question
        with **å skrive** proposes a specific action. The answer with **med CV-en**
        names a different task.


        Another exchange might sound like this:


        ::: {.reading translation="What are you doing?" dialogue_id="meeting-preparations"
        speaker_id="lina" speaker_name="Lina" character_id="lina"}

        Hva holder dere på med?

        :::


        ::: {.reading translation="We’re working on the preparations for the meeting."
        dialogue_id="meeting-preparations" speaker_id="paal" speaker_name="Pål"}

