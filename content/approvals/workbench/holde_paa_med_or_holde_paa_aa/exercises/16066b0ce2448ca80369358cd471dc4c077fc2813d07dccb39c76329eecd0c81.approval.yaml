  repair_the_structure:
    exercise_key: repair_the_structure
    checked_against:
      common-mistakes: cb1ce2ebb33e78f4752c17f58e99d58341ece13610f757eaef5bc4ec8ba5acf0
    section_sources:
      common-mistakes: '## Common mistakes {#common-mistakes role=contrast objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        **Using med directly before an infinitive**


        Do not use the clean **med + noun** pattern and then place a bare infinitive
        after it.


        Incorrect target pattern:


        ::: examples

        - no: ✗ Jeg holder på med lage middag.

        - en: ✗ I am making dinner.

        :::


        Use an infinitive action after **å**:


        ::: examples

        - no: Jeg holder på å lage middag.

        - en: I am making dinner.

        :::


        Or replace the verb with a named task after **med**:


        ::: examples

        - no: Jeg holder på med middagen.

        - en: I am working on dinner.

        :::


        The key question is not simply whether the general meaning is similar. Look
        at the form that follows: **lage** is an infinitive, while **middagen** is
        a noun.


        **Using å before a noun**


        The infinitive marker **å** must introduce an infinitive, not a noun.


        Incorrect:


        ::: examples

        - no: ✗ Hun holder på å rapporten.

        - en: ✗ She is working on the report.

        :::


        Correct with a noun:


        ::: examples

        - no: Hun holder på med rapporten.

        - en: She is working on the report.

        :::


        Correct with an infinitive:


        ::: examples

        - no: Hun holder på å skrive rapporten.

        - en: She is writing the report.

        :::


        **Forgetting that the two versions differ in focus**


        These sentences are both possible, but they do not provide the same amount
        of detail:


        ::: examples

        - no: Jeg holder på med vinduene.

        - en: I’m working on the windows.

        - no: Jeg holder på å vaske vinduene.

        - en: I’m washing the windows.

        :::


        The first does not tell us exactly what is being done to the windows. The
        second identifies the action.


        **Checkpoint: repair the structure**


        Take several short descriptions in which **med** has accidentally been placed
        before an infinitive or **å** before a noun. Repair each one without changing
        the intended meaning. Where useful, produce two repairs: one with a noun after
        **med**, and one with an infinitive after **å**.


        Check the grammatical form after the phrase rather than choosing only from
        the English translation.


        {{exercise: repair_the_structure}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:48:09.918167+00:00'
    decision_id: null
  discriminate_full_response:
    exercise_key: discriminate_full_response
    checked_against:
      one-situation-two-viewpoints: 16d30d09ea66ac19a6ea39ceb86dc02cb724216a8e92e5fbdce2edf268a60a08
    section_sources:
      one-situation-two-viewpoints: '## One situation, two viewpoints {#one-situation-two-viewpoints
        role=contrast objectives=obj-holde-paa-med-or-holde-paa-aa-01}


        The difference is not always a difference in the real-world situation. Often,
        both constructions can describe the same person at the same time. They simply
        package the information differently.


        Suppose Ingrid is preparing for an exam and is reading chapter six.


        ::: examples

        - no: Ingrid holder på med eksamensforberedelsene.

        - en: Ingrid is working on her exam preparation.

        - no: Ingrid holder på å lese kapittel seks.

        - en: Ingrid is reading chapter six.

        :::


        The first sentence gives the larger activity. The second zooms in on the action
        happening within it.


        Suppose Marius is preparing the garden and is planting flowers.


        ::: examples

        - no: Marius holder på med hagen.

        - en: Marius is working on the garden.

        - no: Marius holder på å plante blomster.

        - en: Marius is planting flowers.

        :::


        Again, the choice depends on the speaker’s focus:


        - Use **med** to name the activity, task, project, or thing being worked on.

        - Use **å** to introduce an infinitive and show the action in progress.


        English often uses an -ing form for both meanings, so translating word by
        word is not enough. First decide whether the Norwegian expression that follows
        will be a noun or an infinitive.


        ::: examples

        - no: De holder på med ryddingen.

        - en: They are doing the tidying.

        - no: De holder på å rydde.

        - en: They are tidying.

        :::


        Here, **ryddingen** is a noun: the tidying or the clean-up. **Rydde** is an
        infinitive: to tidy.


        **Checkpoint: move between broad and specific descriptions**


        Picture a community hall before a party. Some people are occupied with the
        decorations, food, and music. Describe these broad activities with **holde
        på med**. Then zoom in: someone is hanging balloons, someone is baking a cake,
        and someone is testing the speakers. Describe those actions with **holde på
        å**.


        Describe one context from both viewpoints. Keep **med + named activity** and
        **å + infinitive action** distinct while producing descriptions that could
        naturally belong to the same scene.


        '
    outcome: approved
