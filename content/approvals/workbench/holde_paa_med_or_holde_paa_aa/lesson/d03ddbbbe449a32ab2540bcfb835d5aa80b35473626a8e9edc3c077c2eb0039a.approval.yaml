      "P3", "suggested_change": "Replace the final turn with: “Flott, takk for hjelpen!”
      (“Great, thanks for helping!”)", "unit_id": "back-at-jonass-apartment"}'
    message: In back-at-jonass-apartment#6, “Flott. Nå holder jeg på å bytte lyspæra.”
      repeats the action Jonas has just announced, despite Sara already agreeing to
      another task. This makes the dialogue sound like repeated pattern practice rather
      than a natural response. Acknowledge the agreed division of work instead.
