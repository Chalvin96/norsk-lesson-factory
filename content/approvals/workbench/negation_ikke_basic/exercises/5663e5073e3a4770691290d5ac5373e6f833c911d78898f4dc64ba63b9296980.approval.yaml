    at: '2026-10-25T14:35:52.306263+00:00'
    decision_id: null
  distinguish_finite_verb_position:
    exercise_key: distinguish_finite_verb_position
    checked_against:
      statements-two-verbs: 33aedc3f8bdbbafb25a78970c11e0257fe83898f988ee8aaaa59f39c0d7e638b
    section_sources:
      statements-two-verbs: '## Statements with two verbs {#statements-two-verbs role=model
        objectives=obj-negation-ikke-basic-01}


        Sometimes a sentence has a finite verb followed by another verb. **Ikke**
        still follows the finite verb, so it comes before the second verb:


        ::: examples

        - no: Jeg kan ikke spise nå.

        - en: I can’t eat now.

        - no: Vi skal ikke gå ennå.

        - en: We aren’t going to leave yet.

        - no: Elias vil ikke kjøpe kaffe.

        - en: Elias doesn’t want to buy coffee.

        :::


        Compare the positive and negative forms:


        ::: examples

        - no: Maja kan vente.

        - en: Maja can wait.

        - no: Maja kan ikke vente.

        - en: Maja can’t wait.

        :::


        Here **kan** is the finite verb. **Vente** is the second verb, so **ikke**
        comes between them.


        ::: examples

        - no: Vi skal spise klokka elleve.

        - en: We are going to eat at eleven.

        - no: Vi skal ikke spise før elleve.

        - en: We aren’t going to eat before eleven.

        :::


        Here **skal** is the finite verb. The position of **ikke** does not change
        merely because another verb follows.


        {{exercise: distinguish_finite_verb_position}}


        {{exercise: repair_statement_word_order}}


        '
