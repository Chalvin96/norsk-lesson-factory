    checked_against:
      back-at-cafeteria: dcdb802c6fc1058a91fe2cce61e11869e8bbc4fdbc7c33e55e3257b45bea2945
    section_sources:
      back-at-cafeteria: '## Back at the cafeteria {#back-at-cafeteria role=model
        objectives=obj-negation-ikke-basic-01}


        At eleven, Maja and Elias check the cafeteria again.


        ::: {.reading translation="Now the cafeteria is open. Aren’t you coming?"
        dialogue_id="cafeteria-return" speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Nå er kantina åpen. Kommer du ikke?

        :::


        ::: {.reading translation="Yes, I’m coming. But I’m not buying hot food."
        dialogue_id="cafeteria-return" speaker_id="elias" speaker_name="Elias" character_id="elias"}

        Jo, jeg kommer. Men jeg kjøper ikke varm mat.

        :::


        ::: {.reading translation="Don’t you eat hot food for lunch?" dialogue_id="cafeteria-return"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Spiser du ikke varm mat til lunsj?

        :::


        ::: {.reading translation="No, I’m not doing that today." dialogue_id="cafeteria-return"
        speaker_id="elias" speaker_name="Elias" character_id="elias"}

        Nei, jeg gjør ikke det i dag.

        :::


        ::: {.reading translation="Why don’t you buy a bread roll?" dialogue_id="cafeteria-return"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Hvorfor kjøper du ikke et rundstykke?

        :::


        ::: {.reading translation="Good idea. Then I don’t need to wait any longer."
        dialogue_id="cafeteria-return" speaker_id="elias" speaker_name="Elias" character_id="elias"}

        God idé. Da trenger jeg ikke å vente mer.

        :::


        The situation has changed, but the placement remains consistent:


        ::: examples

        - no: Jeg kjøper ikke varm mat.

        - en: I’m not buying hot food.

        :::


        This is a statement, so **ikke** follows the finite verb and subject.


        ::: examples

        - no: Spiser du ikke varm mat?

        - en: Don’t you eat hot food?

        :::


        This is a question with a pronoun subject, so **ikke** follows **du**.


        ::: examples

        - no: Hvorfor kjøper du ikke et rundstykke?

        - en: Why don’t you buy a bread roll?

        :::


        This question begins with **hvorfor**, but **ikke** still follows the pronoun
        subject.


        {{exercise: complete_return_to_cafeteria}}


        '
