  build_negative_pronoun_questions:
    exercise_key: build_negative_pronoun_questions
    checked_against:
      negative-pronoun-questions: 177593a5f57b5e6d3df9930c376ed308730daa528e1fa693a0ffc1b0f9b6236f
    section_sources:
      negative-pronoun-questions: '## Yes–no questions with a pronoun subject {#negative-pronoun-questions
        role=model objectives=obj-negation-ikke-basic-01}


        A yes–no question has no question word. It begins with the finite verb:


        ::: examples

        - no: Kommer du nå?

        - en: Are you coming now?

        :::


        To make this a negative question, put **ikke** after the pronoun subject:


        **finite verb + pronoun subject + ikke + rest**


        ::: examples

        - no: Kommer du ikke nå?

        - en: Aren’t you coming now?

        :::


        This is the pattern heard in the dialogue:


        ::: examples

        - no: Er den ikke åpen?

        - en: Isn’t it open?

        :::


        The finite verb **er** comes first, the pronoun **den** comes next, and **ikke**
        follows the pronoun.


        More examples:


        ::: examples

        - no: Spiser du ikke med oss?

        - en: Aren’t you eating with us?

        - no: Har han ikke matpakke?

        - en: Doesn’t he have a packed lunch?

        - no: Skal dere ikke gå snart?

        - en: Aren’t you going to leave soon?

        - no: Kan hun ikke vente?

        - en: Can’t she wait?

        :::


        With two verbs, **ikke** still follows the finite verb and pronoun subject:


        ::: examples

        - no: Skal du ikke spise?

        - en: Aren’t you going to eat?

        :::


        The order is **skal + du + ikke + spise**.


        A frequent mistake is to use statement order in a question:


        ::: examples

        - no: ✗ Du spiser ikke med oss?

        - en: Intended basic question: Aren’t you eating with us?

        :::


        That order can occur with special conversational intonation, but it is not
        the basic question pattern taught here. For a standard yes–no question, begin
        with the finite verb:


        ::: examples

        - no: Spiser du ikke med oss?

        - en: Aren’t you eating with us?

        :::


        {{exercise: build_negative_pronoun_questions}}


        '
