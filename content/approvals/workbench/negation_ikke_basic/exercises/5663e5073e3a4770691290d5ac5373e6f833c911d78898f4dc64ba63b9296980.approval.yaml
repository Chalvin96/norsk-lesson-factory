  contrast_question_subject_types:
    exercise_key: contrast_question_subject_types
    checked_against:
      negative-full-noun-questions: f0159fe62342ecfe5b60f87015a7b0c50ec49b267d77840f4126a4a5abd00baa
    section_sources:
      negative-full-noun-questions: '## Questions with a named person or other full
        noun {#negative-full-noun-questions role=contrast objectives=obj-negation-ikke-basic-01}


        In a neutral negative yes–no question with a full noun as the subject, **ikke**
        normally comes before that subject:


        **finite verb + ikke + full noun subject + rest**


        Compare the two subject types:


        ::: examples

        - no: Kommer hun ikke i dag?

        - en: Isn’t she coming today?

        - no: Kommer ikke Maja i dag?

        - en: Isn’t Maja coming today?

        :::


        In the first question, **hun** is a pronoun, so it comes before **ikke**.
        In the second, **Maja** is a full noun subject, so **ikke** comes before it.


        More aligned contrasts:


        ::: examples

        - no: Har han ikke matpakke?

        - en: Doesn’t he have a packed lunch?

        - no: Har ikke Elias matpakke?

        - en: Doesn’t Elias have a packed lunch?

        - no: Er den ikke åpen?

        - en: Isn’t it open?

        - no: Er ikke kantina åpen?

        - en: Isn’t the cafeteria open?

        - no: Skal de ikke spise nå?

        - en: Aren’t they going to eat now?

        - no: Skal ikke Maja og Elias spise nå?

        - en: Aren’t Maja and Elias going to eat now?

        :::


        This contrast is about subject form, not about the meaning of **ikke**. Both
        question patterns ask whether a negative situation is true.


        {{exercise: contrast_question_subject_types}}


        '
