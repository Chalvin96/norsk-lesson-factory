  place_ikke_in_basic_statements:
    exercise_key: place_ikke_in_basic_statements
    checked_against:
      initial-element-statements: 32b54f68aa2d0312b07771fbb3077489b1f0e0ed803bf7e384926f650c4a8dc1
    section_sources:
      initial-element-statements: '## When another element comes first {#initial-element-statements
        role=model objectives=obj-negation-ikke-basic-01}


        A statement does not always begin with the subject. A time expression such
        as **i dag** or **nå** can come first. The finite verb still takes the second
        position. With a name or full noun subject, **ikke** can come before or after
        the subject. A known subject often comes before **ikke**; a new or emphasized
        subject can come after it. An unstressed pronoun subject normally comes before
        **ikke**.


        **first element + finite verb + full noun subject + ikke + rest**


        **first element + finite verb + ikke + full noun subject + rest**


        **first element + finite verb + unstressed pronoun + ikke + rest**


        Compare:


        ::: examples

        - no: Elias har ikke matpakke i dag.

        - en: Elias doesn’t have a packed lunch today.

        - no: I dag har Elias ikke matpakke.

        - en: Today Elias doesn’t have a packed lunch.

        :::


        The meaning is almost the same. The second sentence gives **today** special
        prominence, but the position of **ikke** is still connected to the finite
        verb and subject.


        More examples:


        ::: examples

        - no: Vi går ikke til kantina nå.

        - en: We aren’t going to the cafeteria now.

        - no: Nå går vi ikke til kantina.

        - en: Now we aren’t going to the cafeteria.

        - no: Maja jobber ikke hjemme på mandager.

        - en: Maja doesn’t work from home on Mondays.

        - no: På mandager jobber Maja ikke hjemme.

        - en: On Mondays Maja doesn’t work from home.

        :::


        Do not put **ikke** immediately after the opening time expression:


        ::: examples

        - no: ✗ I dag ikke har Elias matpakke.

        - en: Intended meaning: Today Elias doesn’t have a packed lunch.

        :::


        The finite verb comes before the subject in both patterns. A full noun subject
        can come before **ikke**, as here:


        ::: examples

        - no: I dag har Elias ikke matpakke.

        - en: Today Elias doesn’t have a packed lunch.

        :::


        It can also come after **ikke**:


        ::: examples

        - no: I dag har ikke Elias matpakke.

        - en: Today Elias doesn’t have a packed lunch.

        :::


        {{exercise: place_ikke_in_basic_statements}}


        '
    outcome: approved
    note: null
