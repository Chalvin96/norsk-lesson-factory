exercise_alignments:
  notice_ikke_in_anchor_statements:
    exercise_key: notice_ikke_in_anchor_statements
    checked_against:
      statements-finite-verb-subject: 5428e89d5be968d8a7b4c138d709dce46c9b48c135aa848c2614a9f02b035195
    section_sources:
      statements-finite-verb-subject: '## Statements: put ikke after the finite verb
        and subject {#statements-finite-verb-subject role=model objectives=obj-negation-ikke-basic-01}


        A simple positive statement gives information:


        ::: examples

        - no: Elias har matpakke.

        - en: Elias has a packed lunch.

        :::


        The corresponding negative statement uses **ikke**:


        ::: examples

        - no: Elias har ikke matpakke.

        - en: Elias doesn’t have a packed lunch.

        :::


        The verb that carries the tense is called the **finite verb (finitte verb)**.
        In these examples, **har** is the finite verb. In a basic statement beginning
        with the subject, the order is:


        **subject + finite verb + ikke + rest**


        Compare the following pairs:


        ::: examples

        - no: Kantina er åpen.

        - en: The cafeteria is open.

        - no: Kantina er ikke åpen.

        - en: The cafeteria isn’t open.

        - no: Vi går nå.

        - en: We are going now.

        - no: Vi går ikke nå.

        - en: We aren’t going now.

        - no: Maja spiser i kantina.

        - en: Maja eats in the cafeteria.

        - no: Maja spiser ikke i kantina.

        - en: Maja doesn’t eat in the cafeteria.

        - no: Jeg drikker kaffe.

        - en: I drink coffee.

        - no: Jeg drikker ikke kaffe.

        - en: I don’t drink coffee.

        :::


        Norwegian does not normally add an equivalent of English **do** or **does**
        before **ikke**. English says **I do not drink**, but Norwegian simply places
        **ikke** after the finite verb:


        ::: examples

        - no: Jeg drikker ikke kaffe.

        - en: I don’t drink coffee.

        :::


        A common mistake is to copy English word order too closely:


        ::: examples

        - no: ✗ Jeg ikke drikker kaffe.

        - en: Intended meaning: I don’t drink coffee.

        :::


        In a basic Norwegian statement, the finite verb comes before **ikke**:


        ::: examples

        - no: Jeg drikker ikke kaffe.

        - en: I don’t drink coffee.

        :::


        {{exercise: notice_ikke_in_anchor_statements}}


        '
