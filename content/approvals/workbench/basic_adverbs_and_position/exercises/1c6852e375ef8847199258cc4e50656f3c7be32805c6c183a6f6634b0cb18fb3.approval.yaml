    section_sources:
      using-an-adjective-to-describe-an-action: '## Using an adjective to describe
        an action {#using-an-adjective-to-describe-an-action role=contrast objectives=obj-basic-adverbs-and-position-01}


        Norwegian often uses a form related to an adjective to say how an action happens.
        This is **adverbial use of an adjective (adverbial bruk av adjektiv)**.


        Compare a quality with an action:


        ::: examples

        - no: Bilen er rask.

        - en: The car is fast.

        - no: Bilen kjører raskt.

        - en: The car travels quickly.

        :::


        In the first sentence, **rask** describes the car. It is an adjective. In
        the second, **raskt** describes the action **kjører**. It is used adverbially.


        A useful basic rule is:


        ::: {.rule}

        To describe how an action happens, Norwegian commonly uses the neuter singular
        form of the adjective. This often means adding **-t**.

        :::


        Here are several aligned contrasts:


        ::: examples

        - no: Erik er langsom.

        - en: Erik is slow.

        - no: Erik arbeider langsomt.

        - en: Erik works slowly.

        - no: Bilen er rask.

        - en: The car is fast.

        - no: Bilen kjører raskt.

        - en: The car travels quickly.

        - no: Musikken er høy.

        - en: The music is loud.

        - no: De spiller høyt.

        - en: They play loudly.

        - no: Stemmen er lav.

        - en: The voice is low.

        - no: Nora snakker lavt.

        - en: Nora speaks quietly.

        - no: Sangeren er god.

        - en: The singer is good.

        - no: Sangeren synger godt.

        - en: The singer sings well.

        :::


        Notice the common adjective-adverb forms:


        - **rask → raskt** — *fast → quickly*

        - **langsom → langsomt** — *slow → slowly*

        - **høy → høyt** — *loud/high → loudly*

        - **lav → lavt** — *low → quietly/at low volume*

        - **god → godt** — *good → well*


        Some adjectives do not visibly gain **-t**. Adjectives ending in **-ig** commonly
        remain unchanged in this use:


        ::: examples

        - no: Anna er forsiktig.

        - en: Anna is careful.

        - no: Anna setter glasset forsiktig på bordet.

        - en: Anna puts the glass carefully on the table.

        :::


        The same happens with some other forms:


        ::: examples

        - no: Barnet er rolig.

        - en: The child is calm.

        - no: Barnet sover rolig.

        - en: The child sleeps calmly.

        - no: Rommet er stille.

        - en: The room is quiet.

        - no: Erik arbeider stille.

        - en: Erik works quietly.

        :::


        The form may look unchanged, but its job differs. In **Barnet er rolig**,
        the word describes the child. In **Barnet sover rolig**, it describes the
        sleeping.


        **One form for every person**


        An adverbial adjective does not change according to who performs the action:


        ::: examples

        - no: Han løper raskt.

        - en: He runs quickly.

        - no: Hun løper raskt.

        - en: She runs quickly.

        - no: De løper raskt.

        - en: They run quickly.

        :::


        The action is described in the same way each time.


        {{exercise: quality_or_action_form}}


        {{exercise: unchanged_adverbial_form}}


        '
