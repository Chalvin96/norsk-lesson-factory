  adjective_adverb_misconception_repair:
    exercise_key: adjective_adverb_misconception_repair
    checked_against:
      do-you-need-an-adjective-or-an-adverb: ba2e218fd781fe2158795faf4345a89dc4efcbf3de3726a4981aed133715f65a
    section_sources:
      do-you-need-an-adjective-or-an-adverb: '## Do you need an adjective or an adverb?
        {#do-you-need-an-adjective-or-an-adverb role=contrast objectives=obj-basic-adverbs-and-position-01}


        The verb **er** often links a person or thing to an adjective:


        ::: examples

        - no: Erik er rask.

        - en: Erik is fast.

        - no: Anna er forsiktig.

        - en: Anna is careful.

        - no: Musikken er høy.

        - en: The music is loud.

        :::


        Do not automatically add **-t** merely because the word comes after a verb.
        Ask what the word describes.


        If it describes the subject after **er**, use the adjective:


        ::: examples

        - no: Bilen er rask.

        - en: The car is fast.

        :::


        If it describes an action, use the adverbial form:


        ::: examples

        - no: Bilen kjører raskt.

        - en: The car travels quickly.

        :::


        Compare these common errors:


        ::: examples

        - no: ✗ Bilen kjører rask.

        - en: Intended meaning: The car travels quickly.

        - no: Bilen kjører raskt.

        - en: The car travels quickly.

        - no: ✗ Bilen er raskt.

        - en: Intended meaning: The car is fast.

        - no: Bilen er rask.

        - en: The car is fast.

        :::


        The key question is not simply “Does the word follow a verb?” Instead ask:


        ::: {.rule}

        Does it describe a person or thing, or does it describe how an action happens?

        :::


        {{exercise: adjective_adverb_misconception_repair}}


        '
