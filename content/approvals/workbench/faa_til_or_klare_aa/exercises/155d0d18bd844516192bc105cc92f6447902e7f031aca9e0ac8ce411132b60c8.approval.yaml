      integrated-practice: '## Integrated practice: solve the meeting problems {#integrated-practice
        role=recap objectives=obj-faa-til-or-klare-aa-01}


        Continue Mina and Jonas’s meeting with several short exchanges. Include a
        new practical problem, an attempt to solve it, a question about whether one
        person can cope with a difficult action, and a final successful result.


        Use both target patterns, but keep their perspectives distinct. Your response
        should use **klare å** for ability or effort and **få til** for something
        that eventually works or succeeds.


