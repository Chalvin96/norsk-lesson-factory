  - finding_id: codex-faa_til_or_klare_aa-2-1
    key: dinner_plan_transfer
    criterion: visible_prompt_rubric_alignment
    excerpt: Bruk både «få til» og «klare å».
    explanation: The visible gardening prompt asks for both expressions but never
      assigns fa til to sprouting and klare a to planting. Its hidden judge requires
      precisely that assignment and rejects the reverse even while acknowledging both
      expressions can naturally describe either event. A response foregrounding the
      writer's effort getting seeds to sprout and the achieved result of planting
      before the holiday can meet the visible facts and both-expression instruction
      yet fail.
