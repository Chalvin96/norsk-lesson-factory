  replace_false_progressive_forms:
    exercise_key: replace_false_progressive_forms
    checked_against:
      norwegian-no-progressive: 37f612e26cb1f1b80366d223b31fcde9a528e74b038abeb3389b1c66e6e10218
    section_sources:
      norwegian-no-progressive: '## Norwegian does not normally have an English-style
        progressive {#norwegian-no-progressive role=contrast objectives=obj-present-participle-01}


        English frequently uses **be + -ing** to describe an activity in progress:


        English example: Ingrid is looking at the kitchen.


        Norwegian normally uses an ordinary present-tense verb:


        ::: examples

        - no: Ingrid ser på kjøkkenet.

        - en: Ingrid is looking at the kitchen.

        :::


        A mechanical translation with **er + present participle** is usually wrong:


        ::: examples

        - no: ✗ Ingrid er seende på kjøkkenet.

        - en: Ingrid is looking at the kitchen.

        :::


        This does not sound natural in the intended meaning.


        More contrasts:


        ::: examples

        - no: Jeg lager middag nå.

        - en: I am making dinner now.

        :::


        Not:


        ::: examples

        - no: ✗ Jeg er lagende middag nå.

        - en: I am making dinner now.

        :::


        ::: examples

        - no: De diskuterer prisen.

        - en: They are discussing the price.

        :::


        Not:


        ::: examples

        - no: ✗ De er diskuterende prisen.

        - en: They are discussing the price.

        :::


        ::: examples

        - no: Barnet sover.

        - en: The child is sleeping.

        :::


        Not:


        ::: examples

        - no: ✗ Barnet er sovende.

        - en: The child is sleeping.

        :::


        The adjective-like phrase **et sovende barn** is natural because **sovende**
        describes the noun **barn**. In the complete statement **Barnet sover**, however,
        Norwegian normally uses the finite verb **sover**.


        This gives an important contrast:


        ::: examples

        - no: Det ligger et sovende barn i vogna.

        - en: There is a sleeping child lying in the pram.

        - no: Barnet sover i vogna.

        - en: The child is sleeping in the pram.

        :::


        The first describes the child within a larger scene. The second directly states
        what the child is doing.


        **Common misconception**


        An **-ende** form is not simply the Norwegian equivalent of every English
        -ing form. Norwegian has present participles, but it does not normally build
        an ongoing tense by combining **å være** with them.


        Use the ordinary present or past tense when the activity itself is the main
        statement:


        ::: examples

        - no: Jeg venter på bussen.

        - en: I am waiting for the bus.

        - no: Jeg ventet på bussen da hun ringte.

        - en: I was waiting for the bus when she called.

        :::


        Use an **-ende** form when it describes a noun or accompanies another main
        event:


        ::: examples

        - no: De ventende passasjerene så på klokka.

        - en: The waiting passengers looked at the clock.

        - no: Hun kom løpende til bussholdeplassen.

        - en: She came running to the bus stop.

        :::


        {{exercise: replace_false_progressive_forms}}


        '
    outcome: approved
