exercise_alignments:
  identify_present_participles_in_context:
    exercise_key: identify_present_participles_in_context
    checked_against:
      the-present-participle: dfb53f523f818d8948e00885be1f615a8d7465efece8272a1b779106f9abf9eb
    section_sources:
      the-present-participle: '## The present participle {#the-present-participle
        role=model objectives=obj-present-participle-01}


        Forms such as **sovende**, **pipende**, **løpende**, and **bærende** are examples
        of the **present participle (presens partisipp)**. A present participle normally
        ends in **-ende**.


        For an infinitive ending in an unstressed **-e**, remove that final **-e**
        and add **-ende**:


        ::: examples

        - no: å sove → sovende

        - en: to sleep → sleeping

        - no: å pipe → pipende

        - en: to beep → beeping

        - no: å smile → smilende

        - en: to smile → smiling

        - no: å bære → bærende

        - en: to carry → carrying

        :::


        For the ordinary verb patterns illustrated here, if the infinitive does not
        end in an unstressed **-e**, add **-ende** directly:


        ::: examples

        - no: å gå → gående

        - en: to walk → walking

        - no: å bo → boende

        - en: to live → living

        - no: å le → leende

        - en: to laugh → laughing

        :::


        The present participle presents an activity, reaction, or state as a characteristic
        or accompanying circumstance. It does not by itself tell us when the action
        happens. Time comes from the surrounding sentence.


        Compare:


        ::: examples

        - no: Jeg så en gråtende gutt.

        - en: I saw a crying boy.

        - no: Jeg ser en gråtende gutt.

        - en: I see a crying boy.

        :::


        The form **gråtende** remains the same. The verbs **så** and **ser** place
        the scene in past and present time.


        {{exercise: identify_present_participles_in_context}}


        '
