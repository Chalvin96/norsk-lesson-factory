  reconstruct_the_apartment_discussion:
    exercise_key: reconstruct_the_apartment_discussion
    checked_against:
      returning-to-ingrid-and-jonas: 50b674f3b0762f1ae82bc6338a71065d73f358b210da7388591769c24b407273
    section_sources:
      returning-to-ingrid-and-jonas: '## Returning to Ingrid and Jonas {#returning-to-ingrid-and-jonas
        role=recap objectives=obj-present-participle-01}


        After the viewing, Ingrid and Jonas sit in a café and discuss the apartment.


        ::: {.reading translation="What did you think of the apartment?" dialogue_id=cafe_discussion
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Hva syntes du om leiligheten?

        :::


        ::: {.reading translation="I liked it. Even the beeping smoke alarm wasn’t
        so bad." dialogue_id=cafe_discussion speaker_id=ingrid speaker_name="Ingrid"
        character_id="ingrid"}

        Jeg likte den. Selv den pipende røykvarsleren var ikke så ille.

        :::


        ::: {.reading translation="I’m still thinking about the caretaker who came
        running." dialogue_id=cafe_discussion speaker_id=jonas speaker_name="Jonas"
        character_id="jonas"}

        Jeg tenker fortsatt på vaktmesteren som kom løpende.

        :::


        ::: {.reading translation="He came carrying all those tools and looked quite
        stressed." dialogue_id=cafe_discussion speaker_id=ingrid speaker_name="Ingrid"
        character_id="ingrid"}

        Han kom bærende på alle de verktøyene og så ganske stresset ut.

        :::


        ::: {.reading translation="What about the people living on the floor above?"
        dialogue_id=cafe_discussion speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Hva med folkene som bor i etasjen over?

        :::


        ::: {.reading translation="They seem pleasant. And their grandchild was sleeping
        peacefully while we were there." dialogue_id=cafe_discussion speaker_id=ingrid
        speaker_name="Ingrid" character_id="ingrid"}

        De virker hyggelige. Og barnebarnet deres sov rolig da vi var der.

        :::


        ::: {.reading translation="Shall we put in a bid?" dialogue_id=cafe_discussion
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Skal vi legge inn et bud?

        :::


        ::: {.reading translation="Yes. But first we need to read the current sales
        prospectus carefully." dialogue_id=cafe_discussion speaker_id=ingrid speaker_name="Ingrid"
        character_id="ingrid"}

        Ja. Men først må vi lese den gjeldende salgsoppgaven nøye.

        :::


        Notice the repeated choices:


        - **den pipende røykvarsleren** describes a noun.

        - **kom løpende** adds manner to the main event.

        - **kom bærende på alle de verktøyene** presents carrying the tools as an
        accompanying action when the caretaker came.

        - **folkene som bor i etasjen over** uses a natural relative clause rather
        than a mechanical participle.

        - **barnebarnet deres sov rolig** uses a finite verb because sleeping is the
        main statement.

        - **den gjeldende salgsoppgaven** uses an established adjective-like participle,
        unchanged in form.


        {{exercise: reconstruct_the_apartment_discussion}}


        '
