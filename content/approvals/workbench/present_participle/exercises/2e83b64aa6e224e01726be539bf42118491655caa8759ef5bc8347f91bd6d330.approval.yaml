  choose_participle_or_relative_clause:
    exercise_key: choose_participle_or_relative_clause
    checked_against:
      relative-clause: 7582b55b3ef5d9b6ea8be8de3e7bd1ba8fba4da4aed4ed19d20cf641741fa159
    section_sources:
      relative-clause: '## When a relative clause sounds more natural {#relative-clause
        role=contrast objectives=obj-present-participle-01}


        An English noun phrase with -ing can sometimes use a Norwegian present participle:


        ::: examples

        - no: en sovende hund

        - en: a sleeping dog

        :::


        However, Norwegian often prefers a relative clause with **som** when the English
        phrase identifies a person or group by what they regularly do or where they
        live.


        In the dialogue, Mari says:


        ::: examples

        - no: De som bor over dere, er et eldre par.

        - en: The people living above you are an older couple.

        :::


        It is possible to encounter **de boende** in formal language, where it means
        the residents. In ordinary conversation, however, **de som bor der** or **folk
        som bor der** is usually more natural.


        Compare:


        ::: examples

        - no: Folk som jobber hjemmefra, trenger ofte et rolig rom.

        - en: People working from home often need a quiet room.

        - no: Studentene som venter utenfor, skal på visning.

        - en: The students waiting outside are going to the viewing.

        - no: Kvinnen som snakker med Mari, er Ingrid.

        - en: The woman speaking with Mari is Ingrid.

        :::


        A present participle may sound compressed, descriptive, literary, or formal
        where a relative clause sounds clearer and more conversational.


        Compare these two ways of viewing the same scene:


        ::: examples

        - no: Jeg så en mann som bar på en stor eske.

        - en: I saw a man who was carrying a large box.

        - no: Jeg så en mann bærende på en stor eske.

        - en: I saw a man carrying a large box.

        :::


        The second sentence is possible, but the first is often the neutral everyday
        choice. Norwegian uses **-ende** selectively rather than automatically.


        {{exercise: choose_participle_or_relative_clause}}


        '
