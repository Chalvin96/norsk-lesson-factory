  keep_ende_forms_invariable:
    exercise_key: keep_ende_forms_invariable
    checked_against:
      adjective-like-use: 8969accafe87d4fdea83564265283da9a1be904ab0a3ad6e218513f24f99dc08
    section_sources:
      adjective-like-use: '## Adjective-like use: describing someone or something
        {#adjective-like-use role=model objectives=obj-present-participle-01}


        A present participle can be **adjective-like**: it gives information about
        a noun.


        ::: examples

        - no: en sovende katt

        - en: a sleeping cat

        - no: et sovende barn

        - en: a sleeping child

        - no: sovende passasjerer

        - en: sleeping passengers

        :::


        The participle **sovende** is **invariable**. This means it does not change
        for gender, definiteness, or number. Compare it with an ordinary adjective:


        ::: examples

        - no: en rolig katt

        - en: a calm cat

        - no: et rolig barn

        - en: a calm child

        - no: rolige passasjerer

        - en: calm passengers

        :::


        The adjective changes from **rolig** to **rolige** in the plural, but the
        participle remains **sovende**.


        The same pattern appears with definite noun phrases:


        ::: examples

        - no: den sovende katten

        - en: the sleeping cat

        - no: det sovende barnet

        - en: the sleeping child

        - no: de sovende passasjerene

        - en: the sleeping passengers

        :::


        Only the article and noun change. The present participle stays in the same
        form.


        More natural examples include:


        ::: examples

        - no: Vi våknet av en pipende alarm.

        - en: We woke up because of a beeping alarm.

        - no: De bar ut det brennende søppelet.

        - en: They carried out the burning rubbish.

        - no: Hun prøvde å roe de gråtende barna.

        - en: She tried to calm the crying children.

        - no: Kokende vann kan gi alvorlige brannskader.

        - en: Boiling water can cause serious burns.

        :::


        Some common **-ende** forms function much like established adjectives:


        ::: examples

        - no: Det var en spennende visning.

        - en: It was an exciting viewing.

        - no: De diskuterte et overraskende tilbud.

        - en: They discussed a surprising offer.

        - no: Dette er de gjeldende reglene.

        - en: These are the current applicable rules.

        :::


        These forms remain invariable too:


        ::: examples

        - no: en spennende film

        - en: an exciting film

        - no: et spennende tilbud

        - en: an exciting offer

        - no: spennende muligheter

        - en: exciting opportunities

        :::


        **Compact rule**


        ::: {.rule}

        Use an adjective-like present participle when an activity, reaction, or ongoing
        state naturally characterizes a person or thing. Keep the **-ende** form unchanged.

        :::


        {{exercise: keep_ende_forms_invariable}}


        '
    outcome: approved
