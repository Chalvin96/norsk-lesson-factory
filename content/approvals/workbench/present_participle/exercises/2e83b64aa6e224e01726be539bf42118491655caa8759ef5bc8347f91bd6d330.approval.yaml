  use_participle_for_accompanying_action:
    exercise_key: use_participle_for_accompanying_action
    checked_against:
      adverb-like-use: b9c499cd5e2a413734874ed3d3c8969efb3850bab36d1cdd36f30d9c013175e7
    section_sources:
      adverb-like-use: '## Adverb-like use: an accompanying action or manner {#adverb-like-use
        role=model objectives=obj-present-participle-01}


        A present participle can also be **adverb-like**. It then describes how someone
        moves, arrives, reacts, speaks, or performs another action.


        In the dialogue:


        ::: examples

        - no: Vaktmesteren kommer løpende.

        - en: The caretaker comes running.

        :::


        The main verb is **kommer**. The participle **løpende** tells us how he comes.


        ::: examples

        - no: Naboen kom bærende på en stor eske.

        - en: The neighbour came carrying a large box.

        :::


        The main event is his arrival. **Bærende på en stor eske** describes his condition
        or accompanying activity when he arrived.


        This pattern is particularly common with movement and position:


        ::: examples

        - no: Hun kom syklende ned bakken.

        - en: She came cycling down the hill.

        - no: Barna løp leende ut i hagen.

        - en: The children ran laughing into the garden.

        - no: Han gikk haltende bort til bilen.

        - en: He walked limping over to the car.

        - no: Vi ble stående utenfor døra.

        - en: We remained standing outside the door.

        - no: De ble sittende og snakke etter møtet.

        - en: They remained sitting and talking after the meeting.

        :::


        Present participles can also describe manner:


        ::: examples

        - no: Hun svarte nølende.

        - en: She answered hesitantly.

        - no: Han så spørrende på meg.

        - en: He looked at me questioningly.

        - no: Ingrid nikket smilende til Mari.

        - en: Ingrid nodded to Mari with a smile.

        :::


        These sentences do not use the participle to create an English-style progressive
        tense. The sentence already has a main verb: **kom**, **løp**, **gikk**, **svarte**,
        **så**, or **nikket**. The participle adds an accompanying action, posture,
        expression, or manner.


        **Meaning contrast**


        Compare:


        ::: examples

        - no: Jonas løp til bussen.

        - en: Jonas ran to the bus.

        - no: Jonas kom løpende til bussen.

        - en: Jonas came running to the bus.

        :::


        The first sentence presents running as the main action. The second presents
        arrival or movement toward the scene as the main event and running as the
        manner.


        Another contrast:


        ::: examples

        - no: Mari smilte til Ingrid.

        - en: Mari smiled at Ingrid.

        - no: Mari svarte smilende.

        - en: Mari answered with a smile.

        :::


        In the first sentence, smiling is the main action. In the second, answering
        is the main action, while **smilende** describes Mari’s manner or expression.


        {{exercise: use_participle_for_accompanying_action}}


        '
