  select_natural_structure_for_english_ing:
    exercise_key: select_natural_structure_for_english_ing
    checked_against:
      other-english-ing-structures: 02b9a49a785e5da225f9bc47457605ef14498b1ec26bec40eb859bfea0ef47a6
    section_sources:
      other-english-ing-structures: '## Other English -ing forms often need other
        Norwegian structures {#other-english-ing-structures role=contrast objectives=obj-present-participle-01}


        English -ing appears in several grammatical jobs. Norwegian chooses a structure
        according to meaning.


        **An activity as a general idea**


        English can make an activity the subject of a sentence with an -ing form:
        Cycling is good exercise.


        Norwegian usually uses an infinitive:


        ::: examples

        - no: Det er god trening å sykle.

        - en: Cycling is good exercise.

        - no: Å lese kontrakten nøye er viktig.

        - en: Reading the contract carefully is important.

        - no: Det er dyrt å bo alene.

        - en: Living alone is expensive.

        :::


        Do not mechanically use **syklende**, **lesende**, or **boende** for this
        meaning.


        **Two events happening at the same time**


        English can begin with an -ing phrase: Walking home, Ingrid called Jonas.


        Norwegian can often use **mens** or another ordinary clause:


        ::: examples

        - no: Mens Ingrid gikk hjem, ringte hun Jonas.

        - en: While Ingrid was walking home, she called Jonas.

        - no: På vei hjem ringte Ingrid til Jonas.

        - en: On her way home, Ingrid called Jonas.

        - no: Gående hjemover tenkte Ingrid på leiligheten.

        - en: Walking home, Ingrid thought about the apartment.

        :::


        A natural phrase such as **på vei hjem** may also fit the intended meaning:


        ::: examples

        - no: På vei hjem ringte Ingrid til Jonas.

        - en: On her way home, Ingrid called Jonas.

        :::


        A present participle is possible in some descriptive contexts, but it can
        sound more written or compressed:


        ::: examples

        - no: Gående hjemover tenkte Ingrid på leiligheten.

        - en: Walking home, Ingrid thought about the apartment.

        :::


        In ordinary conversation, **mens hun gikk hjem** or **på vei hjem** will often
        be more natural.


        **Method or means**


        English often uses -ing after **by**: You open the door by pressing the green
        button.


        Norwegian commonly uses **ved å** plus the infinitive:


        ::: examples

        - no: Du åpner døra ved å trykke på den grønne knappen.

        - en: You open the door by pressing the green button.

        - no: De sparer penger ved å dele på utgiftene.

        - en: They save money by sharing the expenses.

        :::


        Again, an **-ende** form is not the automatic solution.


        **Structure-choice summary**


        When you meet an English -ing form, ask what it does:


        - If it naturally describes a noun, an invariable Norwegian **-ende** form
        may fit.

        - If it adds manner or an accompanying action to a main event, an adverb-like
        **-ende** form may fit.

        - If it is the main activity in progress, use a finite Norwegian verb.

        - If it identifies people by what they do, a relative clause with **som**
        is often natural.

        - If it names an activity in general, use an infinitive.

        - If it means while doing something or by doing something, use a clause or
        an infinitive structure that expresses that relationship clearly.


        {{exercise: select_natural_structure_for_english_ing}}


        '
