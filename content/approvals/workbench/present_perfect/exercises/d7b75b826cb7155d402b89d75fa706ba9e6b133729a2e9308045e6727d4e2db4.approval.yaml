  participle_not_infinitive:
    exercise_key: participle_not_infinitive
    checked_against:
      sec-negative-statements-questions: 617dc3c6a5fb49423a82f73a581ace5481ddf4c9c90d90a89c362e55a3b5d5ef
    section_sources:
      sec-negative-statements-questions: '## Negative statements and questions {#sec-negative-statements-questions
        role=model objectives=obj-present-perfect-01}


        The central verb form remains har + past participle in statements, negatives,
        and questions.


        ::: examples

        - no: Jeg har åpnet esken.

        - en: I have opened the box.

        - no: Jeg har ikke åpnet esken.

        - en: I have not opened the box.

        - no: Har du åpnet esken?

        - en: Have you opened the box?

        - no: Hun har svart.

        - en: She has answered.

        - no: Hun har ikke svart ennå.

        - en: She has not answered yet.

        - no: Har hun svart?

        - en: Has she answered?

        :::


        Do not replace the participle with the infinitive after har.


        Incorrect:


        ::: examples

        - no: ✗ Jeg har åpne esken.

        - en: I have open the box.

        :::


        Incorrect:


        ::: examples

        - no: ✗ Jeg har åpner esken.

        - en: I have opens the box.

        :::


        Correct:


        ::: examples

        - no: Jeg har åpnet esken.

        - en: I have opened the box.

        :::


        {{exercise: participle_not_infinitive}}


        '
