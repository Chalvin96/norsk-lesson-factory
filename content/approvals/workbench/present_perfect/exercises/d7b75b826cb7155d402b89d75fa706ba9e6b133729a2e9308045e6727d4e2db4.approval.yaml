  participle_recognition:
    exercise_key: participle_recognition
    checked_against:
      sec-recognizing-past-participles: 1caaf783285109c45aa4139df351f425bc0abc2650aa814730c4eea0a21c5a42
    section_sources:
      sec-recognizing-past-participles: '## Recognizing past participles {#sec-recognizing-past-participles
        role=model objectives=obj-present-perfect-01}


        Many past participles are easy to recognize once you have met the verb’s main
        forms. However, there is no single ending that works for every Norwegian verb.
        Learn the past participle as part of the verb.


        Some common verbs have participles ending in -et:


        ::: examples

        - no: å snakke → har snakket

        - en: to speak → has spoken

        - no: å pakke → har pakket

        - en: to pack → has packed

        - no: å vaske → har vasket

        - en: to wash → has washed

        - no: å åpne → har åpnet

        - en: to open → has opened

        - no: å rydde → har ryddet

        - en: to tidy → has tidied

        :::


        Other common verbs have shorter participles:


        ::: examples

        - no: å kjøpe → har kjøpt

        - en: to buy → has bought

        - no: å prøve → har prøvd

        - en: to try → has tried

        - no: å lese → har lest

        - en: to read → has read

        :::


        Several frequent verbs have forms that must be learned individually:


        ::: examples

        - no: å gjøre → har gjort

        - en: to do → has done

        - no: å skrive → har skrevet

        - en: to write → has written

        - no: å se → har sett

        - en: to see → has seen

        - no: å være → har vært

        - en: to be → has been

        - no: å gå → har gått

        - en: to go → has gone

        - no: å spise → har spist

        - en: to eat → has eaten

        - no: å ta → har tatt

        - en: to take → has taken

        - no: å finne → har funnet

        - en: to find → has found

        :::


        The infinitive ending alone does not always tell you the participle. For example,
        å kjøpe becomes kjøpt, not ✗ kjøpet, and å skrive becomes skrevet, not ✗ skrivet.


        When a dictionary gives forms such as kjøpe – kjøpte – kjøpt, the final form,
        kjøpt, is the one used after har.


        {{exercise: participle_recognition}}


        {{exercise: complete_present_perfect_form}}


        '
