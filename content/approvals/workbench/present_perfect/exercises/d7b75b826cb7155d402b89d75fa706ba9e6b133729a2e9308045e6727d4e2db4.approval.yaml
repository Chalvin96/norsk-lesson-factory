  experience_up_to_now:
    exercise_key: experience_up_to_now
    checked_against:
      sec-experience-up-to-now: e396ef293e14afc81097a9ff36129da200994681e5a0a1b32468c71354313fca
    section_sources:
      sec-experience-up-to-now: '## Experience up to now {#sec-experience-up-to-now
        role=contrast objectives=obj-present-perfect-01}


        The present perfect can also describe experience within a period that reaches
        the present.


        ::: examples

        - no: Jeg har vært i Bergen tre ganger.

        - en: I have been to Bergen three times.

        - no: Hun har aldri sett nordlyset.

        - en: She has never seen the northern lights.

        - no: Har du spist norsk brunost?

        - en: Have you eaten Norwegian brown cheese?

        :::


        The exact occasion is not the point. The speaker is asking or stating what
        belongs to someone’s experience up to now.


        Words such as allerede, already, aldri, never, and ennå, yet, often fit this
        meaning:


        ::: examples

        - no: Vi har allerede sett filmen.

        - en: We have already seen the film.

        - no: Jeg har aldri prøvd dette før.

        - en: I have never tried this before.

        - no: Han har ikke svart ennå.

        - en: He hasn’t answered yet.

        :::


        These words do not create the present perfect. They help show how the past
        event is viewed from the present.


        {{exercise: experience_up_to_now}}


        '
