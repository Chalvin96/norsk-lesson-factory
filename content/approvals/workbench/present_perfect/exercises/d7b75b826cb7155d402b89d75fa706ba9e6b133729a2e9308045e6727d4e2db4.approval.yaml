      sec-new-flat: 2458bc8e3e6460f5d5b3104274eb07747abba040e951dc214ef0d067e6332169
    section_sources:
      sec-new-flat: '## A new flat, but not everything is ready {#sec-new-flat role=orient
        objectives=obj-present-perfect-01}


        Maja has recently moved into a new flat. Her friend Sander arrives shortly
        before Maja’s parents are due to visit.


        ::: {.reading translation="Have you unpacked everything?" dialogue_id="maja-flat-opening"
        speaker_id="sander" speaker_name="Sander"}

        Har du pakket ut alt?

        :::


        ::: {.reading translation="I have unpacked the clothes, but I haven’t opened
        the boxes of books." dialogue_id="maja-flat-opening" speaker_id="maja" speaker_name="Maja"
        character_id="maja"}

        Jeg har pakket ut klærne, men jeg har ikke åpnet eskene med bøker.

        :::


        ::: {.reading translation="Have you found the coffee maker?" dialogue_id="maja-flat-opening"
        speaker_id="sander" speaker_name="Sander"}

        Har du funnet kaffetrakteren?

        :::


        ::: {.reading translation="Yes, but I have forgotten to buy coffee." dialogue_id="maja-flat-opening"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Ja, men jeg har glemt å kjøpe kaffe.

        :::


        ::: {.reading translation="That’s all right. I have bought coffee and bread
        on the way." dialogue_id="maja-flat-opening" speaker_id="sander" speaker_name="Sander"}

        Det går bra. Jeg har kjøpt kaffe og brød på veien.

        :::


        ::: {.reading translation="Perfect. My parents are coming soon, and I haven’t
        tidied the kitchen." dialogue_id="maja-flat-opening" speaker_id="maja" speaker_name="Maja"
        character_id="maja"}

        Perfekt. Foreldrene mine kommer snart, og jeg har ikke ryddet kjøkkenet.

        :::


        ::: {.reading translation="I have already cleaned the counter. Now we’ll deal
        with the boxes together." dialogue_id="maja-flat-opening" speaker_id="sander"
        speaker_name="Sander"}

        Jeg har allerede vasket benken. Nå tar vi eskene sammen.

        :::


        The conversation is about actions in the past, but the speakers care about
        their results now. The clothes are out of their boxes, the books are still
        packed, and there is now coffee for the visitors. This connection between
        a past action and the present is the central meaning of the Norwegian present
        perfect.


        {{exercise: anchor_form_noticing}}


        '
