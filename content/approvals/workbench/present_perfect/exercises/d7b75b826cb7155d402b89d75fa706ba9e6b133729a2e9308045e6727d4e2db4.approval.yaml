      sec-back-at-flat: '## Back at Maja’s flat {#sec-back-at-flat role=recap objectives=obj-present-perfect-01}


        A little later, Maja’s parents arrive.


        ::: {.reading translation="It has become so nice here!" dialogue_id="maja-flat-return"
        speaker_id="kari" speaker_name="Kari" voice_profile="feminine"}

        Så fint det har blitt her!

        :::


        ::: {.reading translation="Thanks! We have opened almost all the boxes." dialogue_id="maja-flat-return"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Takk! Vi har åpnet nesten alle eskene.

        :::


        ::: {.reading translation="And we have tidied the kitchen." dialogue_id="maja-flat-return"
        speaker_id="sander" speaker_name="Sander"}

        Og vi har ryddet kjøkkenet.

        :::


        ::: {.reading translation="Have you eaten?" dialogue_id="maja-flat-return"
        speaker_id="kari" speaker_name="Kari" voice_profile="feminine"}

        Har dere spist?

        :::


        ::: {.reading translation="No, we haven’t eaten yet." dialogue_id="maja-flat-return"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Nei, vi har ikke spist ennå.

        :::


        ::: {.reading translation="Then that works well. I have made soup." dialogue_id="maja-flat-return"
        speaker_id="kari" speaker_name="Kari" voice_profile="feminine"}

        Da passer det bra. Jeg har laget suppe.

        :::


        The forms now do practical work in the conversation. Maja reports what is
        ready, Kari asks about the situation now, and the soup she made earlier is
        relevant because everyone can eat it now.


        {{exercise: return_to_flat_completion}}


