  current_result_connection:
    exercise_key: current_result_connection
    checked_against:
      sec-completed-action-result-now: 9cd508ecbfe70630e8e6ed57c2c57ba08bdae70d29c011b96e5128a77a2a828e
    section_sources:
      sec-completed-action-result-now: '## A completed action with a result now {#sec-completed-action-result-now
        role=contrast objectives=obj-present-perfect-01}


        Maja says:


        ::: examples

        - no: Jeg har pakket ut klærne.

        - en: I have unpacked the clothes.

        :::


        The unpacking happened earlier. Its result matters now: the clothes are no
        longer packed.


        Compare:


        ::: examples

        - no: Sander har kjøpt kaffe.

        - en: Sander has bought coffee.

        - no: Jeg har mistet nøkkelen.

        - en: I have lost the key.

        - no: Vi har laget middag.

        - en: We have made dinner.

        :::


        The important result is that they have coffee now.


        The loss happened earlier, but the current problem is that the speaker does
        not have the key.


        The dinner is ready now.


        The action does not need to have happened only a few minutes ago. What matters
        is the present connection.


        ::: examples

        - no: Jeg har lest boka, så du kan låne den.

        - en: I have read the book, so you can borrow it.

        - no: De har solgt bilen og tar bussen nå.

        - en: They have sold the car and take the bus now.

        :::


        {{exercise: current_result_connection}}


        '
