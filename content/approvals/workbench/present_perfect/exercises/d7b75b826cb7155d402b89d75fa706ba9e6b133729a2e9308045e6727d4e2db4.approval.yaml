      sec-trip-preparation-transfer: 16972b002e2b62f8f882a22c1298cde9da1e25717ed8d45e7a1e0f725e686517
    section_sources:
      sec-trip-preparation-transfer: '## Transfer: preparing for a weekend trip {#sec-trip-preparation-transfer
        role=recap objectives=obj-present-perfect-01}


        Now change the situation. Amir and Nora are leaving for a cabin this afternoon.
        They need to check what is ready before they go.


        Relevant statements might include:


        ::: examples

        - no: Nora har pakket varme klær.

        - en: Nora has packed warm clothes.

        - no: Amir har funnet kartet.

        - en: Amir has found the map.

        - no: De har ikke kjøpt mat ennå.

        - en: They have not bought food yet.

        - no: Har Nora tatt med nøklene?

        - en: Has Nora brought the keys?

        - no: Amir har vært på hytta før.

