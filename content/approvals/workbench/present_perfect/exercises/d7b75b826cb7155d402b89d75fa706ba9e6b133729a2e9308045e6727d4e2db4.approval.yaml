  continuing_situation:
    exercise_key: continuing_situation
    checked_against:
      sec-continuing-situation: 57a91b90b1db743891484c6369f11b3fdd82f44085898f4340fd7284f8ccf984
    section_sources:
      sec-continuing-situation: '## A situation that began earlier and still continues
        {#sec-continuing-situation role=contrast objectives=obj-present-perfect-01}


        Norwegian also uses the present perfect for a situation that started in the
        past and is still true now.


        ::: examples

        - no: Jeg har bodd her i to år.

        - en: I have lived here for two years.

        - no: Vi har kjent hverandre lenge.

        - en: We have known each other for a long time.

        - no: Hun har jobbet på hotellet siden mai.

        - en: She has worked at the hotel since May.

        :::


        The time expressions support the present connection:


        - i to år means for two years: a length of time.

        - siden mai means since May: a starting point.


        The situation has not been presented as finished. Jeg har bodd her i to år
        normally means that I still live here.


        A likely mistake is to use only the present tense because the situation is
        still true. Norwegian uses har + past participle when the speaker includes
        the period from the past up to now.


        Incorrect for the intended meaning:


        ::: examples

        - no: ✗ Jeg bor her i to år.

        - en: I live here for two years.

        :::


        Correct:


        ::: examples

        - no: Jeg har bodd her i to år.

        - en: I have lived here for two years.

        :::


        {{exercise: continuing_situation}}


        '
