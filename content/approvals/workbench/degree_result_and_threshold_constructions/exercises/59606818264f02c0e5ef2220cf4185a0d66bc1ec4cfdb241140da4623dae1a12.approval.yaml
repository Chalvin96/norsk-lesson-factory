    section_sources:
      sec-limit-for-til-aa: '## A limit that blocks something: for … til å {#sec-limit-for-til-aa
        role=model objectives=obj-degree-result-and-threshold-constructions-01}


        Use **for** before an adjective or adverb when the degree goes beyond a useful,
        safe, possible, or acceptable limit. The action after **til å** is in the
        **infinitive (infinitiv)**.


        ::: examples

        - no: Mina er for kald til å vente ute.

        - en: Mina is too cold to wait outside.

        - no: Det er for mørkt til å lese koden uten lys.

        - en: It is too dark to read the code without a light.

        - no: Jonas snakker for lavt til å bli hørt gjennom døra.

        - en: Jonas speaks too quietly to be heard through the door.

        :::


        The basic pattern is:


        **for + adjective/adverb + til å + infinitive**


        The degree prevents the action, makes it unsuitable, or places it outside
        a practical limit.


        ::: examples

        - no: Suppa er for varm til å spise nå.

        - en: The soup is too hot to eat now.

        - no: Bussen kjører for fort til å stoppe her.

        - en: The bus is going too fast to stop here.

        - no: Jeg er for trøtt til å kjøre hjem.

        - en: I am too tired to drive home.

        :::


        In the last sentence, tiredness blocks a reasonable or safe action. The speaker
        is not merely reporting that something happened because of tiredness. The
        speaker is judging the action against a limit.


        Compare:


        ::: examples

        - no: Jeg er så trøtt at jeg legger meg.

        - en: I am so tired that I go to bed.

        - no: Jeg er for trøtt til å kjøre.

        - en: I am too tired to drive.

        :::


        The first sentence presents a consequence: I go to bed. The second says that
        driving is not possible or advisable at this degree of tiredness.


        The action after **til å** is usually understood in relation to the person
        or situation already mentioned:


        ::: examples

        - no: Hun er for nervøs til å holde talen.

        - en: She is too nervous to give the speech.

        - no: Vi kom for sent til å ta det siste toget.

        - en: We arrived too late to take the last train.

        - no: Rommet er for lite til å bruke som kontor.

        - en: The room is too small to use as an office.

        :::


        **The important meaning of for**


        In this pattern, **for** means *too*, not *very*.


        ::: examples

        - no: Kaffen er for sterk til å drikke uten melk.

        - en: The coffee is too strong to drink without milk.

        :::


        This sentence does not simply emphasize that the coffee is strong. It says
        that its strength crosses a limit for drinking it without milk.


        A frequent English-influenced mistake is to add **at** directly after this
        use of **for**:


        ::: examples

        - no: Jeg er for sliten til å lage middag.

        - en: I am too tired to make dinner.

        :::


        The target pattern uses **til å + infinitive**, not **at + complete clause**.
        If you want a complete consequence clause, change the structure and usually
        the meaning:


        ::: examples

        - no: Jeg er så sliten at jeg ikke lager middag.

        - en: I am so tired that I am not making dinner.

        :::


        The **så … at** sentence reports the consequence. The **for … til å** sentence
        evaluates dinner-making as beyond the speaker’s present capacity.


        {{exercise: distinguish_result_from_excess}}


        '
