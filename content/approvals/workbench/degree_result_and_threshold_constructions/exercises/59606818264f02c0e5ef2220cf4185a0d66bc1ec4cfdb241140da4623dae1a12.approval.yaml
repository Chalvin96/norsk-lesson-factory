    section_sources:
      sec-consequence-saa-at: '## A consequence: så … at {#sec-consequence-saa-at
        role=model objectives=obj-degree-result-and-threshold-constructions-01}


        Use **så** before an adjective or adverb and follow it with an **at-clause**
        when you want to present a consequence or result. The result clause can describe
        an event, response, modal possibility, or hypothetical result.


        ::: examples

        - no: Det er så mørkt at Mina ikke kan se tallene.

        - en: It is so dark that Mina cannot see the numbers.

        - no: Døra er så tung at Jonas må bruke begge hendene.

        - en: The door is so heavy that Jonas has to use both hands.

        - no: Jonas snakker så lavt at Mina ikke hører ham.

        - en: Jonas speaks so quietly that Mina cannot hear him.

        :::


        The basic pattern is:


        **så + adjective/adverb + at + complete clause**


        The part after **at** contains its own subject and a finite verb: **Mina kan**,
        **Jonas må**, **Mina hører**. It tells us the result of the high or low degree
        described before it.


        Compare two possible consequences of the same condition:


        ::: examples

        - no: Det er så kaldt at vannet fryser.

        - en: It is so cold that the water freezes.

        - no: Det er så kaldt at vi går inn.

        - en: It is so cold that we go inside.

        :::


        The first sentence describes a physical result. The second describes a human
        response. The grammar does not require the consequence to be automatic. It
        only presents the consequence as connected to the degree.


        The result can be positive or negative:


        ::: examples

        - no: Filmen var så morsom at alle lo.

        - en: The film was so funny that everyone laughed.

        - no: Forklaringen var så uklar at ingen forsto oppgaven.

        - en: The explanation was so unclear that nobody understood the task.

        - no: Hun sang så fint at publikum ble helt stille.

        - en: She sang so beautifully that the audience became completely quiet.

        :::


        **Compact rule**


        ::: {.rule}

        Choose **så … at** when your main point is: **This degree is presented as
        leading to this consequence or result.**

        :::


        A common mistake is to treat **så** as if it already meant English *too*.
        It does not. **Så kald** means *so cold*, not automatically *too cold*. The
        consequence must show what the degree leads to.


        ::: examples

        - no: Det er så kaldt at jeg tar på meg en jakke.

        - en: It is so cold that I put on a jacket.

        :::


        This does not say that the cold prevents an action. It says that the cold
        causes a response.


        {{exercise: notice_actual_consequence}}


        '
