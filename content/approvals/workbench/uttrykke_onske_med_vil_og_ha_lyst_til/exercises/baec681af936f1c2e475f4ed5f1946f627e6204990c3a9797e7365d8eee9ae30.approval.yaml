        Write a short plan for an ordinary free afternoon. Include one direct intention,
        one activity you feel inclined to do, and one food, drink, or thing that appeals
        to you. Keep each statement specific enough for the contrast to be clear.


        For example:


        ::: examples

        - no: Jeg vil gjøre ferdig leksene først.

        - en: I want to finish my homework first.

        - no: Etterpå har jeg lyst til å møte en venn.

        - en: Afterwards I feel like meeting a friend.

        - no: I kveld har jeg lyst på pizza.

        - en: This evening I feel like having pizza.

        :::


        Your response should demonstrate the same distinction in a new situation:
        direct desire or intention with **vil**, inclination toward an activity with
        **ha lyst til å**, and inclination toward a thing with **ha lyst på**.


        {{exercise: personalised_bounded_practice}}


