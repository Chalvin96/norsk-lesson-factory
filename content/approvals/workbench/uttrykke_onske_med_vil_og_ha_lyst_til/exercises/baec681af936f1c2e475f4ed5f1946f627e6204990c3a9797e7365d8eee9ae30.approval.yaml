  complete_vil_action:
    exercise_key: complete_vil_action
    checked_against:
      direct-want-or-intention-vil: 15830684914f477ebfc2f19222209330bbd2479ef4016f442476906acf63dc9a
    section_sources:
      direct-want-or-intention-vil: '## A direct want or intention: *vil* {#direct-want-or-intention-vil
        role=model objectives=obj-uttrykke-onske-med-vil-og-ha-lyst-til-01}


        Use **vil** when you state a direct desire, choice, or intention. It is followed
        by the infinitive without **å**.


        ::: examples

        - no: Jeg vil se Bryggen.

        - en: I want to see Bryggen.

        - no: Emma vil ta banen.

        - en: Emma wants to take the railway.

        - no: Vi vil dra tidlig.

        - en: We want to leave early.

        - no: Vil dere spise nå?

        - en: Do you want to eat now?

        :::


        The structure is:


        ::: {.rule}

        **vil + infinitive**

        :::


        Notice that Norwegian does not use **å** after **vil**.


        ::: examples

        - no: Jeg vil gå hjem.

        - en: I want to go home.

        :::


        Not:


        ::: examples

        - no: ✗ Jeg vil å gå hjem.

        - en: I want to go home.

        :::


        This form is incorrect because **vil** takes the infinitive directly.


        In the opening dialogue, Emma has a definite plan:


        ::: examples

        - no: Jeg vil se Bryggen først.

        - en: I want to see Bryggen first.

        :::


        She is not merely saying that sightseeing sounds pleasant. She is putting
        forward a clear intention for the day.


        Compare some other direct choices:


        ::: examples

        - no: Jeg vil bestille fiskesuppe.

        - en: I want to order fish soup.

        - no: Han vil bo i Oslo.

        - en: He wants to live in Oslo.

        - no: De vil reise i juni.

        - en: They want to travel in June.

        - no: Vi vil ikke vente lenger.

        - en: We don’t want to wait any longer.

        :::


        With a thing rather than an activity, **vil ha** is common:


        ::: examples

        - no: Jeg vil ha te.

        - en: I want tea.

        - no: Hun vil ha en ny sykkel.

        - en: She wants a new bicycle.

        - no: Barna vil ha is.

        - en: The children want ice cream.

        :::


        Here **ha** means *have*, so the literal structure is “want to have.” In ordinary
        English, the natural translation is often simply *want*.


        '
    outcome: approved
    note: null
