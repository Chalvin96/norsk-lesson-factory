exercise_alignments:
  notice_infinitive_marker_in_context:
    exercise_key: notice_infinitive_marker_in_context
    checked_against:
      infinitive-and-marker: ee2ce2ce0fedd5d695ac5b5a37e51e9a454c2b7f3973a4bc634ea4025ca330c2
    section_sources:
      infinitive-and-marker: '## The infinitive and its marker {#infinitive-and-marker
        role=model objectives=obj-infinitive-marker-01}


        The basic, unchanged form of a verb is called the **infinitive (infinitiv)**.
        Norwegian dictionary forms are often presented with **å**:


        ::: examples

        - no: **å besøke**

        - en: *to visit*

        - no: **å se**

        - en: *to see*

        - no: **å spise**

        - en: *to eat*

        - no: **å finne**

        - en: *to find*

        - no: **å jobbe**

        - en: *to work*

        :::


        Here, **å** is the **infinitive marker**. It corresponds roughly to English
        *to* in expressions such as *to visit* and *to eat*.


        With the verbs and expressions taught here, such as **liker**, **håper**,
        **prøver**, and **har lyst til**, use **å** before the infinitive:


        **First part:** **Jeg liker**


        **Infinitive:** **å lese.**


        **Complete expression:**


        ::: examples

        - no: **Jeg liker å lese.**

        - en: *I like reading.*

        :::


        **First part:** **Hun håper**


        **Infinitive:** **å komme.**


        **Complete expression:**


        ::: examples

        - no: **Hun håper å komme.**

        - en: *She hopes to come.*

        :::


        **First part:** **Vi prøver**


        **Infinitive:** **å forstå.**


        **Complete expression:**


        ::: examples

        - no: **Vi prøver å forstå.**

        - en: *We are trying to understand.*

        :::


        **First part:** **De har lyst til**


        **Infinitive:** **å reise.**


        **Complete expression:**


        ::: examples

        - no: **De har lyst til å reise.**

        - en: *They feel like travelling.*

        :::


        The first verb changes when necessary, but the infinitive after **å** remains
        in its basic form:


        ::: examples

        - no: **Jeg prøver å lære norsk.**

        - en: *I am trying to learn Norwegian.*

        - no: **Maja prøver å lære norsk.**

        - en: *Maja is trying to learn Norwegian.*

        :::


        The form **lære** stays unchanged in both sentences.


        {{exercise: notice_infinitive_marker_in_context}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:35:36.516998+00:00'
    decision_id: null
  choose_marker_after_first_verb:
    exercise_key: choose_marker_after_first_verb
    checked_against:
      after-modal-verbs: 47ec26abd8746ea227c7ee6290ec7523a71207d95a790f1db7e84d2b9ac50bfe
    section_sources:
      after-modal-verbs: '## After modal verbs: no å {#after-modal-verbs role=contrast
        objectives=obj-infinitive-marker-01}


        A **modal verb (modalt hjelpeverb)** expresses meanings such as ability, necessity,
        intention, or advice. Common modal verbs include:


        - **kan** — *can*

        - **må** — *must / have to*

        - **vil** — *will / want to*

        - **skal** — *will / shall / be going to*

        - **bør** — *should*


        When one of these modal verbs is followed by another verb, leave out **å**.


        ::: examples

        - no: **Jeg kan svømme.**

        - en: *I can swim.*

        - no: **Du må vente.**

        - en: *You have to wait.*

        - no: **Hun vil kjøpe kaffe.**

        - en: *She wants to buy coffee.*

        - no: **Vi skal besøke museet.**

        - en: *We are going to visit the museum.*

        - no: **Dere bør komme tidlig.**

        - en: *You should come early.*

        :::


        The second verb is still an infinitive, but it appears without the infinitive
        marker.


        Compare the patterns directly:


        With **å**:


        ::: examples

        - no: **Jeg liker å svømme.**

        - en: *I like swimming.*

        :::


        After a modal verb:


        ::: examples

        - no: **Jeg kan svømme.**

        - en: *I can swim.*

        :::


        With **å**:


        ::: examples

        - no: **Hun håper å komme.**

        - en: *She hopes to come.*

        :::


        After a modal verb:


        ::: examples

        - no: **Hun skal komme.**

        - en: *She is going to come.*

        :::


        With **å**:


        ::: examples

        - no: **Vi prøver å vente.**

        - en: *We are trying to wait.*

        :::


        After a modal verb:


        ::: examples

        - no: **Vi må vente.**

        - en: *We have to wait.*

        :::


        With **å**:


        ::: examples

        - no: **De ønsker å reise.**

        - en: *They want to travel.*

        :::


        After a modal verb:


        ::: examples

        - no: **De vil reise.**

        - en: *They want to travel.*

        :::


        The English translation may contain *to* in both columns. Norwegian grammar
        makes a different choice:


        ::: examples

        - no: **De ønsker å reise.**

        - en: *They want to travel.*

        - no: **De vil reise.**

        - en: *They want to travel.*

        :::


        The meaning is similar, but **ønsker** is followed by **å reise**, while the
        modal verb **vil** is followed by **reise** without **å**.


        ::: {.rule}

        Use **liker / ønsker / håper / prøver / har lyst til + å + infinitive**. After
        the modal verbs taught here, use the infinitive without **å**. Other nonmodal
        verbs can follow different patterns.

        :::


        {{exercise: choose_marker_after_first_verb}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:35:36.516998+00:00'
    decision_id: null
  contrast_same_infinitive_patterns:
    exercise_key: contrast_same_infinitive_patterns
    checked_against:
      one-decision-at-a-time: 7ff9e89b4f450987c284ebfbef0263174df16d7f789f2aa4e4e333895c82ba6e
    section_sources:
      one-decision-at-a-time: '## One decision at a time {#one-decision-at-a-time
        role=model objectives=obj-infinitive-marker-01}


        A useful way to build a Norwegian two-verb sentence is to look first at the
        verb that comes before the infinitive.


        Suppose Maja wants to say that she likes working at home:


        1. The first verb is **liker**.

        2. **Liker** is not a modal verb.

        3. Use **å** before the infinitive.


        ::: examples

        - no: **Maja liker å jobbe hjemme.**

        - en: *Maja likes working at home.*

        :::


        Now suppose Elias says that he must work at home:


        1. The first verb is **må**.

        2. **Må** is a modal verb.

        3. Do not use **å**.


        ::: examples

        - no: **Elias må jobbe hjemme.**

        - en: *Elias has to work at home.*

        :::


        Here are further aligned contrasts:


        ::: examples

        - no: **Jeg begynner å lage middag.**

        - en: *I am beginning to make dinner.*

        - no: **Jeg skal lage middag.**

        - en: *I am going to make dinner.*

        - no: **Hun prøver å snakke norsk.**

        - en: *She is trying to speak Norwegian.*

        - no: **Hun kan snakke norsk.**

        - en: *She can speak Norwegian.*

        - no: **Vi håper å møte Anna.**

        - en: *We hope to meet Anna.*

        - no: **Vi vil møte Anna.**

        - en: *We want to meet Anna.*

        :::


        In each pair, the activity remains similar. The first verb controls whether
        **å** appears.


        {{exercise: contrast_same_infinitive_patterns}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:35:36.516998+00:00'
    decision_id: null
  repair_infinitive_marker_errors:
    exercise_key: repair_infinitive_marker_errors
    checked_against:
      common-mistake: e27baa220bdd418ce50cec286b55fe7c85cbc3a226aa2b619bffdc1a1b1ed277
    section_sources:
      common-mistake: '## A common mistake {#common-mistake role=contrast objectives=obj-infinitive-marker-01}


        Learners sometimes remember that the dictionary form is **å spise** and then
        put **å** before every infinitive.


        Incorrect:


        ::: examples

        - no: ✗ **Jeg kan å spise nå.**

        - en: *I can eat now.*

        :::


        Correct:


        ::: examples

        - no: **Jeg kan spise nå.**

        - en: *I can eat now.*

        :::


        The word **kan** is modal, so the next verb appears without **å**.


        Another common error is removing **å** from every two-verb expression.


        Incorrect:


        ::: examples

        - no: ✗ **Jeg liker spise ute.**

        - en: *I like eating out.*

        :::


        Correct:


        ::: examples

        - no: **Jeg liker å spise ute.**

        - en: *I like eating out.*

        :::


        The word **liker** is not modal, so use **å**.


        Do not decide only from the English word *to*. English says *I want to visit*,
        but Norwegian can use a modal construction:


        ::: examples

        - no: **Jeg vil besøke museet.**

        - en: *I want to visit the museum.*

        :::


        There is no **å** after **vil**.


        {{exercise: repair_infinitive_marker_errors}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:35:36.516998+00:00'
