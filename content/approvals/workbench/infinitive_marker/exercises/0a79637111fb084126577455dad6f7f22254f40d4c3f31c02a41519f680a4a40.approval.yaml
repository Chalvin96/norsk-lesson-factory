  complete_contextual_two_verb_messages:
    exercise_key: complete_contextual_two_verb_messages
    checked_against:
      back-to-maja-and-elias: 3435d78bac603d73014c55a5e33a35c988d591394fdad416c45817b170583693
    section_sources:
      back-to-maja-and-elias: '## Back to Maja and Elias {#back-to-maja-and-elias
        role=recap objectives=obj-infinitive-marker-01}


        At noon, Maja sends Elias a message.


        ::: {.reading translation="I have finished work. I can meet you in ten minutes."
        dialogue_id="midday-museum-message" speaker_id="maja" speaker_name="Maja"
        character_id="maja"}

        Jeg er ferdig på jobb. Jeg kan møte deg om ti minutter.

        :::


        ::: {.reading translation="Great! I am standing outside the museum. I hope
        to buy tickets before it gets full." dialogue_id="midday-museum-message" speaker_id="elias"
        speaker_name="Elias" character_id="elias"}

        Flott! Jeg står utenfor museet. Jeg håper å kjøpe billetter før det blir fullt.

        :::


        ::: {.reading translation="We should go in at once." dialogue_id="midday-museum-message"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Vi bør gå inn med en gang.

        :::


        ::: {.reading translation="Agreed. Afterwards, I feel like eating something."
        dialogue_id="midday-museum-message" speaker_id="elias" speaker_name="Elias"
        character_id="elias"}

        Enig. Etterpå har jeg lyst til å spise noe.

        :::


        The same contrast now helps them manage the plan:


        - **kan møte** — modal verb, no **å**

        - **håper å kjøpe** — non-modal verb, use **å**

        - **bør gå** — modal verb, no **å**

        - **har lyst til å spise** — use **å** before the infinitive


        Notice that extra information does not change the pattern:


        ::: examples

        - no: **Jeg kan møte deg om ti minutter.**

        - en: *I can meet you in ten minutes.*

        - no: **Jeg kan møte deg i sentrum om ti minutter.**

        - en: *I can meet you in the city centre in ten minutes.*

        - no: **Jeg håper å kjøpe billetter.**

        - en: *I hope to buy tickets.*

        - no: **Jeg håper å kjøpe billetter før det blir fullt.**

        - en: *I hope to buy tickets before it gets full.*

        :::


        The core choice remains **kan møte** versus **håper å kjøpe**.


        {{exercise: complete_contextual_two_verb_messages}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:35:36.516998+00:00'
    decision_id: null
  produce_bounded_everyday_sentences:
    exercise_key: produce_bounded_everyday_sentences
    checked_against:
      building-short-personal-statements: 0cd35d5a0ed0c9ce99fda9544eda3018349a098f94557831df9300a018ed58b9
    section_sources:
      building-short-personal-statements: '## Building short personal statements {#building-short-personal-statements
        role=model objectives=obj-infinitive-marker-01}


        You can now use the pattern to describe ordinary intentions, abilities, obligations,
        preferences, and attempts.


        ::: examples

        - no: **Jeg liker å lage mat.**

        - en: *I like cooking.*

        - no: **Jeg kan lage mat.**

        - en: *I can cook.*

        - no: **Jeg prøver å lese på norsk.**

        - en: *I am trying to read in Norwegian.*

        - no: **Jeg må lese i kveld.**

        - en: *I have to read tonight.*

        - no: **Jeg håper å besøke Bergen.**

        - en: *I hope to visit Bergen.*

        - no: **Jeg vil besøke Bergen.**

        - en: *I want to visit Bergen.*

        :::


        Before speaking or writing, ask one question: Is the first verb a modal verb
        such as **kan**, **må**, **vil**, **skal**, or **bør**?


        - If yes, leave out **å**.

        - If no, use **å** in the target patterns from this chapter.


        {{exercise: produce_bounded_everyday_sentences}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
