    section_sources:
      transfer-to-a-new-situation: '## Transfer to a new situation {#transfer-to-a-new-situation
        role=recap objectives=obj-double-definiteness-01}


        A week later, Jonas is preparing for visitors. Nora calls to ask what still
        needs to be done.


        ::: {.reading translation="Is the flat ready?" dialogue_id="transfer-to-new-flat"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Er leiligheten klar?

        :::


        ::: {.reading translation="Almost. I have to clean the large window in the
        living room." dialogue_id="transfer-to-new-flat" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Nesten. Jeg må vaske det store vinduet i stua.

        :::


        ::: {.reading translation="What about the new sofa?" dialogue_id="transfer-to-new-flat"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Hva med den nye sofaen?

        :::


        ::: {.reading translation="It’s in place. I only need to hang up the red curtains."
        dialogue_id="transfer-to-new-flat" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Den er på plass. Jeg må bare henge opp de røde gardinene.

        :::


        ::: {.reading translation="And the small lamps?" dialogue_id="transfer-to-new-flat"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Og de små lampene?

        :::


        ::: {.reading translation="They’re on the round table." dialogue_id="transfer-to-new-flat"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        De står på det runde bordet.

        :::


        The setting has changed, but the grammar has not. Jonas now uses the phrases
        to identify household objects while preparing his flat.


        {{exercise: describe_specific_items_in_new_flat}}


        '
