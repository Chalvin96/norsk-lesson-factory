  discriminate_close_or_continue:
    exercise_key: discriminate_close_or_continue
    checked_against:
      closing-or-continuing: d8f343649d9a6d4a32b6fba13c68a12aef27f074edebb7cfe63c38dc25781f4f
    section_sources:
      closing-or-continuing: '## Closing or continuing {#closing-or-continuing role=contrast
        objectives=obj-make-weather-small-talk-01}


        A weather exchange can end after only two or three turns. A short closing
        is not rude when the situation changes, someone needs to leave, or there is
        nothing more to add.


        ::: examples

        - no: Vi får håpe det blir bedre.

        - en: We’ll have to hope it gets better.

        - no: Vi får håpe det holder seg tørt.

        - en: We’ll have to hope it stays dry.

        - no: Godt å komme inn i varmen.

        - en: It is good to get inside where it is warm.

        - no: Ha en fin dag!

        - en: Have a nice day!

        - no: Ha en fin tur!

        - en: Have a nice trip!

        - no: Takk, i like måte!

        - en: Thanks, same to you!

        :::


        The closing can refer back to the weather before moving to a polite farewell.


        ::: {.reading translation="Do you think it will stop raining soon?" dialogue_id="weather-closing"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Tror du det slutter å regne snart?

        :::


        ::: {.reading translation="I hope so. We’ll have to hope it gets better. Have
        a nice day!" dialogue_id="weather-closing" speaker_id="amir" speaker_name="Amir"
        character_id="amir"}

        Jeg håper det. Vi får håpe det blir bedre. Ha en fin dag!

        :::


        If both people want to continue, add another connected question instead of
        a farewell.


        ::: {.reading translation="The weather is nice today." dialogue_id="weather-continuing"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Det er fint vær i dag.

        :::


        ::: {.reading translation="Yes, finally! Are you going to be outside this
        afternoon?" dialogue_id="weather-continuing" speaker_id="amir" speaker_name="Amir"
        character_id="amir"}

        Ja, endelig! Skal du være ute i ettermiddag?

        :::


        The question still grows from the weather observation. It allows the conversation
        to continue without abruptly changing subject.


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:37:44.874132+00:00'
    decision_id: null
  revise_weather_exchange:
    exercise_key: revise_weather_exchange
    checked_against:
      common-problems: c7a7da0bf5e4421b465228a7892d6acf28c534ac419ffa4ffb9014528f8b35e0
    section_sources:
      common-problems: '## Common problems {#common-problems role=contrast objectives=obj-make-weather-small-talk-01}


        **Making the opening too formal**


        Været er fint i dag is grammatically correct, but Det er fint vær i dag often
        sounds more natural as a casual opening.


        ::: examples

        - no: Været er fint i dag.

        - en: The weather is nice today.

        - no: Det er fint vær i dag.

        - en: The weather is nice today.

        :::


        The first describes the weather directly. The second is a common conversational
        way to comment on the day.


        **Repeating without responding**


        If one person says it is cold, simply making another separate weather statement
        can feel disconnected.


        ::: {.reading translation="It is cold today." dialogue_id="repeating-without-responding"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Det er kaldt i dag.

        :::


        ::: {.reading translation="It is raining." dialogue_id="repeating-without-responding"
        speaker_id="amir" speaker_name="Amir" character_id="amir"}

        Det regner.

        :::


        Both statements may be true, but Amir has not clearly acknowledged Nora. A
        connector makes the relationship clearer.


        ::: {.reading translation="Yes, and it is raining too." dialogue_id="repeating-with-connector"
        speaker_id="amir" speaker_name="Amir" character_id="amir"}

        Ja, og det regner også.

        :::


        **Asking an unrelated question too quickly**


        A weather opening creates a small shared topic. Stay with it for at least
        one response.


        ::: {.reading translation="It is very windy today." dialogue_id="unrelated-question"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Det blåser mye i dag.

        :::


        A question about rain, clothing, or tomorrow’s weather would continue naturally.
        An abrupt question about an unrelated personal matter may make the opening
        feel unfinished.


        **Giving too much information**


        Small talk works well with short turns. A detailed explanation of several
        days of forecasts can place too much pressure on a new conversation partner.
        At A1, aim for an acknowledgement, one detail, and one question.


        ::: examples

        - no: Ja, virkelig. Men det er ikke kaldt. Tror du det begynner å regne?

        - en: Yes, really. But it is not cold. Do you think it will start raining?

        :::


        This is enough to show attention and invite a reply.


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:37:44.874132+00:00'
