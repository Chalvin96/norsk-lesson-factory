  review_weather_follow_up:
    exercise_key: review_weather_follow_up
    checked_against:
      asking-one-follow-up-question: c0a06230c4c0ebe363d1dc8fe9125fcdf21dac85953418e5dc82ac0da6dd0b29
    section_sources:
      asking-one-follow-up-question: '## Asking one follow-up question {#asking-one-follow-up-question
        role=model objectives=obj-make-weather-small-talk-01}


        A follow-up question shows interest and gives the other person an easy way
        to continue. Keep it short and connected to the weather already mentioned.


        You can ask what the other person expects.


        ::: examples

        - no: Tror du det blir varmere senere?

        - en: Do you think it will get warmer later?

        - no: Tror du det slutter å regne snart?

        - en: Do you think it will stop raining soon?

        - no: Skal det regne i ettermiddag?

        - en: Is it going to rain this afternoon?

        - no: Blir det sol i morgen?

        - en: Will it be sunny tomorrow?

        :::


        You can ask about the other person’s reaction or preference.


        ::: examples

        - no: Liker du sånt vær?

        - en: Do you like this kind of weather?

        - no: Synes du det er for kaldt?

        - en: Do you think it is too cold?

        :::


        You can also ask a practical question that fits the immediate situation.


        ::: examples

        - no: Har du paraply?

        - en: Do you have an umbrella?

        - no: Har du varme klær med deg?

        - en: Do you have warm clothes with you?

        :::


        A good follow-up grows naturally from the opening.


        ::: {.reading translation="It is raining a lot today." dialogue_id="follow-up-practical"
        speaker_id="amir" speaker_name="Amir" character_id="amir"}

        Det regner mye i dag.

        :::


        ::: {.reading translation="Yes, unfortunately. Do you have an umbrella?" dialogue_id="follow-up-practical"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Ja, dessverre. Har du paraply?

        :::


        The practical question works because both people are outside in the rain.


        ::: {.reading translation="It is warm today." dialogue_id="follow-up-expectation"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Det er varmt i dag.

        :::


        ::: {.reading translation="Yes, really. Do you think it will be just as warm
        tomorrow?" dialogue_id="follow-up-expectation" speaker_id="amir" speaker_name="Amir"
        character_id="amir"}

        Ja, virkelig. Tror du det blir like varmt i morgen?

        :::


        The second sentence continues the same topic without requiring specialist
        knowledge about the forecast.


        Avoid making the follow-up too broad. Hvordan er været? means What is the
        weather like?, but it sounds unnecessary when both speakers are standing outside
        and can already see the weather. A more specific question is usually more
        natural.


        ::: examples

        - no: Tror du det begynner å regne?

        - en: Do you think it will start raining?

        :::


        This asks about a possible change and gives the other person something clear
        to answer.


        '
