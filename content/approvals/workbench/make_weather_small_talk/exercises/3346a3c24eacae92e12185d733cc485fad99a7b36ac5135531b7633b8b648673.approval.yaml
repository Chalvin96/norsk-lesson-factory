    checked_against:
      at-the-bus-stop: 4e7e3b143363ce710ad70eefb6140f3bfb32e0dfce97cb001c7c3a86e1009502
    section_sources:
      at-the-bus-stop: '## At the bus stop {#at-the-bus-stop role=model objectives=obj-make-weather-small-talk-01}


        Nora and Amir live in the same neighbourhood, but they have only spoken once
        or twice. They meet while waiting for a bus on a cold spring morning.


        ::: {.reading translation="It is cold today." dialogue_id="at-the-bus-stop"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Det er kaldt i dag.

        :::


        ::: {.reading translation="Yes, it really is. But the sun is shining." dialogue_id="at-the-bus-stop"
        speaker_id="amir" speaker_name="Amir" character_id="amir"}

        Ja, virkelig. Men sola skinner.

        :::


        ::: {.reading translation="Fortunately! Do you think it will get warmer later?"
        dialogue_id="at-the-bus-stop" speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Heldigvis! Tror du det blir varmere senere?

        :::


        ::: {.reading translation="I hope so. It was much warmer yesterday." dialogue_id="at-the-bus-stop"
        speaker_id="amir" speaker_name="Amir" character_id="amir"}

        Jeg håper det. Det var mye varmere i går.

        :::


        ::: {.reading translation="Yes, the weather changes quickly now. Is it going
        to rain this afternoon?" dialogue_id="at-the-bus-stop" speaker_id="nora" speaker_name="Nora"
        character_id="nora"}

        Ja, været skifter fort nå. Skal det regne i ettermiddag?

        :::


        ::: {.reading translation="I don’t think so. But I have an umbrella with me,
        just in case." dialogue_id="at-the-bus-stop" speaker_id="amir" speaker_name="Amir"
        character_id="amir"}

        Jeg tror ikke det. Men jeg har med paraply, for sikkerhets skyld.

        :::


        ::: {.reading translation="That was sensible. Here comes the bus. Have a nice
        day!" dialogue_id="at-the-bus-stop" speaker_id="nora" speaker_name="Nora"
        character_id="nora"}

        Det var lurt. Der kommer bussen. Ha en fin dag!

        :::


        ::: {.reading translation="Thanks, same to you!" dialogue_id="at-the-bus-stop"
        speaker_id="amir" speaker_name="Amir" character_id="amir"}

        Takk, i like måte!

        :::


        This conversation is short, but it has a clear shape. Nora opens with an observation.
        Amir acknowledges it and adds a contrast. Nora asks a follow-up question.
        They continue for a few turns and then close when the bus arrives.


        You can use the same shape in many everyday situations:


        **Open → acknowledge or contrast → ask one follow-up → close or continue**


        You do not need to use every possible expression. One natural sentence at
        each stage is enough.


        '
