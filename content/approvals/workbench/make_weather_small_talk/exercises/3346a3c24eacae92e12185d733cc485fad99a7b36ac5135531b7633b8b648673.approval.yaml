  review_weather_closing:
    exercise_key: review_weather_closing
    checked_against:
      closing-or-continuing: d8f343649d9a6d4a32b6fba13c68a12aef27f074edebb7cfe63c38dc25781f4f
    section_sources:
      closing-or-continuing: '## Closing or continuing {#closing-or-continuing role=contrast
        objectives=obj-make-weather-small-talk-01}


        A weather exchange can end after only two or three turns. A short closing
        is not rude when the situation changes, someone needs to leave, or there is
        nothing more to add.


        ::: examples

        - no: Vi får håpe det blir bedre.

        - en: We’ll have to hope it gets better.

        - no: Vi får håpe det holder seg tørt.

        - en: We’ll have to hope it stays dry.

        - no: Godt å komme inn i varmen.

        - en: It is good to get inside where it is warm.

        - no: Ha en fin dag!

        - en: Have a nice day!

        - no: Ha en fin tur!

        - en: Have a nice trip!

        - no: Takk, i like måte!

        - en: Thanks, same to you!

        :::


        The closing can refer back to the weather before moving to a polite farewell.


        ::: {.reading translation="Do you think it will stop raining soon?" dialogue_id="weather-closing"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Tror du det slutter å regne snart?

        :::


        ::: {.reading translation="I hope so. We’ll have to hope it gets better. Have
        a nice day!" dialogue_id="weather-closing" speaker_id="amir" speaker_name="Amir"
        character_id="amir"}

        Jeg håper det. Vi får håpe det blir bedre. Ha en fin dag!

        :::


        If both people want to continue, add another connected question instead of
        a farewell.


        ::: {.reading translation="The weather is nice today." dialogue_id="weather-continuing"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Det er fint vær i dag.

        :::


        ::: {.reading translation="Yes, finally! Are you going to be outside this
        afternoon?" dialogue_id="weather-continuing" speaker_id="amir" speaker_name="Amir"
        character_id="amir"}

        Ja, endelig! Skal du være ute i ettermiddag?

        :::


        The question still grows from the weather observation. It allows the conversation
        to continue without abruptly changing subject.


        '
