    checked_against:
      opening-shared-observation: c26e3c8de8ae9924d944c5a7d56255c16a963ce671c9a2098f5baa4282778552
    section_sources:
      opening-shared-observation: '## Opening with a shared observation {#opening-shared-observation
        role=model objectives=obj-make-weather-small-talk-01}


        A weather opening usually comments on something both people can see or feel.
        Norwegian commonly uses det er for weather descriptions.


        ::: examples

        - no: Det er fint vær i dag.

        - en: The weather is nice today.

        - no: Det er varmt ute.

        - en: It is warm outside.

        - no: Det er kaldt nå.

        - en: It is cold now.

        - no: Det er grått i dag.

        - en: It is grey today.

        :::


        You can also open by saying what the weather is doing.


        ::: examples

        - no: Det regner mye i dag.

        - en: It is raining a lot today.

        - no: Det snør igjen.

        - en: It is snowing again.

        - no: Det blåser ganske mye.

        - en: It is quite windy.

        - no: Sola skinner endelig.

        - en: The sun is finally shining.

        :::


        Words such as i dag, nå, and endelig make the opening feel connected to the
        immediate situation.


        ::: examples

        - no: Det er kjølig i dag.

        - en: It is chilly today.

        - no: Det er kjølig.

        - en: It is chilly.

        :::


        Both sentences are correct, but i dag makes it clearer that you are commenting
        on today’s shared experience.


        A short opening can also show a reaction.


        ::: examples

        - no: Så fint vær!

        - en: What lovely weather!

        - no: Så kaldt det er!

        - en: It is so cold!

        :::


        These are more expressive than a neutral statement. At this stage, however,
        a simple det er sentence is usually the safest and most useful opening.


        '
