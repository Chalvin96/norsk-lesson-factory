  repair_room_plan:
    exercise_key: repair_room_plan
    checked_against:
      acknowledge-clarify-continue: 1a35412c23eb810231094417e6356085f1e6632daea0391a4b695c280c2a2e4d
    section_sources:
      acknowledge-clarify-continue: '## Acknowledge, clarify, continue {#acknowledge-clarify-continue
        role=model objectives=obj-advanced-pragmatics-01}


        A useful repair often follows this sequence:


        - **Acknowledge** the relevant goal or concern: *Det hadde vært praktisk.*

        - **Clarify** what is intended, known, or confirmed: *Men rommet er ikke bestilt.*

        - **Continue** with a suitable next step: *Jeg ringer resepsjonen, og så oppdaterer
        jeg deg.*


        Acknowledgement is useful, but it does not mean agreement with the mistaken

        inference. It keeps the exchange cooperative while the clarification changes
        the

        shared understanding.


        The exact wording can vary:


        ::: examples

        - no: Det hadde vært praktisk, men jeg vet ikke om rommet er ledig. Jeg sjekker
        det nå.

        - en: That would be practical, but I don''t know whether the room is available.
        I''ll check now.

        - no: Egentlig foreslo jeg bare at vi kunne undersøke møterommet. Kan du vente
        med invitasjonen til jeg har fått svar?

        - en: What I actually suggested was only that we could check the meeting room.
        Can you wait to send the invitation until I have an answer?

        - no: Du forstår det altså som en bekreftet reservasjon? Det er det ikke ennå.
        Jeg sier fra når det er avklart.

        - en: So you understand it as a confirmed reservation? It isn''t one yet.
        I''ll let you know when it has been clarified.

        :::


        **Egentlig** can help recover the underlying intention. Interactional **altså**
        can

        check the partner''s inference. They are optional tools, not requirements.
        Plain

        language may be clearer, especially when the practical consequence matters
        more

        than the tone of the repair.


        **Supported practice: Repair the room plan**


        Respond to Jonas''s supplied misunderstanding. The task gives you the three

        communicative jobs, but you choose the wording.


        {{exercise: repair_room_plan}}


        '
