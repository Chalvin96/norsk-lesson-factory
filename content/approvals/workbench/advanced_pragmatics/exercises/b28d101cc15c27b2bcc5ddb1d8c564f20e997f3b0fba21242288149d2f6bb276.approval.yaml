exercise_alignments:
  separate_words_from_inference:
    exercise_key: separate_words_from_inference
    checked_against:
      possibility-becomes-plan: 8f58f3cdb69ab3605b6765093805068c7719075778dd027de019b99a408cc50c
    section_sources:
      possibility-becomes-plan: '## When a possibility becomes a plan {#possibility-becomes-plan
        role=orient objectives=obj-advanced-pragmatics-01}


        Lea and Jonas are organizing a workshop. They still need a room.


        ::: {.reading translation="We might be able to use the large meeting room,
        but I haven''t asked yet." dialogue_id="room_misunderstanding" speaker_id="lea"
        speaker_name="Lea" character_id="lea"}

        Vi kan kanskje bruke det store møterommet, men jeg har ikke spurt ennå.

        :::


        ::: {.reading translation="Great, then I''ll write in the invitation that
        we''ll be there." dialogue_id="room_misunderstanding" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Flott, da skriver jeg i invitasjonen at vi skal være der.

        :::


        Lea mentioned a **possibility**. Jonas treated it as a **confirmed arrangement**.

        If Lea only says *ja* or changes the subject, the invitation may contain false

        information. She needs to repair the shared plan before they act on it.


        ::: examples

        - no: Vent litt, rommet er ikke bekreftet ennå. Jeg spør i dag, og så gir
        jeg deg beskjed før du sender invitasjonen.

        - en: Wait a moment, the room hasn''t been confirmed yet. I''ll ask today,
        and then I''ll let you know before you send the invitation.

        :::


        This response does three jobs:


        1. It shows which assumption needs attention.

        2. It restores the correct status: possible, not confirmed.

        3. It establishes what happens next and when Jonas can act.


        **Checkpoint: Separate words from inference**


        Decide what Lea actually said and what Jonas added as an inference.


        {{exercise: separate_words_from_inference}}


        '
    outcome: approved
