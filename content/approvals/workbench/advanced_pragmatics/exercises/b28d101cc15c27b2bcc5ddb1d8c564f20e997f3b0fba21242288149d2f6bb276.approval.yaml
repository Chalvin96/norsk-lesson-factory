  compare_client_date_replies:
    exercise_key: compare_client_date_replies
    checked_against:
      preserve-uncertainty: 9e6310d06842d1ae90b60fd68dcd43d6c04d31f26c518e84ea0ccbe95b1c1dca
    section_sources:
      preserve-uncertainty: '## Preserve what is still uncertain {#preserve-uncertainty
        role=model objectives=obj-advanced-pragmatics-01}


        A good repair changes only what needs changing. It should not replace one
        unsupported

        claim with another.


        ::: {.reading translation="The client is interested in Tuesday, but she needs
        to speak with her manager first." dialogue_id="meeting_date" speaker_id="amina"
        speaker_name="Amina" character_id="amina"}

        Kunden er interessert i tirsdag, men hun må snakke med lederen sin først.

        :::


        ::: {.reading translation="Then I''ll book everyone''s tickets for Tuesday."
        dialogue_id="meeting_date" speaker_id="erik" speaker_name="Erik" character_id="erik"}

        Da bestiller jeg billetter til alle på tirsdag.

        :::


        Amina should not answer *Hun kan ikke på tirsdag*, because that is also unknown.

        The accurate repair is that Tuesday is **under consideration**, not accepted
        or

        rejected. A next step can be to wait for the client''s answer or set a deadline
        for

        checking again.


        This matters at B2 because conversational misunderstandings often concern
        force and

        commitment rather than vocabulary: a suggestion becomes a decision, interest
        becomes

        agreement, or an estimate becomes a promise.


        **Checkpoint: Identify the three repair jobs**


        Choose the response that keeps the client''s Tuesday visit undecided and prevents

        premature ticket booking.


        {{exercise: compare_client_date_replies}}


        '
