  choose_confirmed_plan_reply:
    exercise_key: choose_confirmed_plan_reply
    checked_against:
      confirmed-plan: ac1b4fe0cb769dfa14b4f1f71b5ce1ab17c047616c3cf4ae052d772f69913d22
    section_sources:
      confirmed-plan: '## When there is nothing to repair {#confirmed-plan role=model
        objectives=obj-advanced-pragmatics-01}


        Before repairing, check the actual status. If the plan really is confirmed,
        a

        "repair" would be wrong in the other direction: it would re-open a settled
        fact

        and slow the arrangement down.


        ::: {.reading translation="The meeting room is booked. Reception sent the
        confirmation this morning." dialogue_id="confirmed_room" speaker_id="jonas"
        speaker_name="Jonas" character_id="jonas"}

        Møterommet er booket. Resepsjonen sendte bekreftelsen i morges.

        :::


        A partner who reports a confirmation states a **settled fact**. Treating it
        as

        merely possible (*er det helt sikkert?*) can sound distrustful, and stalling
        a

        confirmed plan wastes the arrangement. Repair is for unsupported inferences,
        not

        for every statement you did not make yourself.


        The decision always starts from the words on the table: what was actually
        said,

        what status it carries, and what the partner has added. Then choose the move
        that

        fits — repair, or act on the shared plan.


        **Checkpoint: Which plan is confirmed?**


        Compare a reported confirmation with a possibility that still has a pending
        check.


        {{exercise: choose_confirmed_plan_reply}}


        '
    outcome: approved
