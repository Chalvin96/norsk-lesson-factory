  repair_payment_reminder:
    exercise_key: repair_payment_reminder
    checked_against:
      protect-arrangement-transfer: 183fdf15682da7d97ba13e4b98cd5b872cf53d48274e949c3aa442ee5e684ce2
    section_sources:
      protect-arrangement-transfer: '## Transfer: protect the arrangement {#protect-arrangement-transfer
        role=recap objectives=obj-advanced-pragmatics-01}


        In a new situation, begin from the exact mismatch rather than searching for
        a

        particular marker. Ask:


        - What was actually proposed or confirmed?

        - What has the other person assumed?

        - What could go wrong if nobody repairs it?

        - What next step would make the arrangement safe and clear?


        **Retrieval and transfer: Repair a payment misunderstanding**


        Respond to a new supplied message about concert tickets. No marker is required.

        Success depends on restoring an accurate shared plan and establishing what
        happens

        next.


        {{exercise: repair_payment_reminder}}


        '
