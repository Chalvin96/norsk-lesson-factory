  compare_reply_consequences:
    exercise_key: compare_reply_consequences
    checked_against:
      response-consequences: fd97215084db02118e6a4c882634dafc46af91c4e929ce55e620946159a34a85
    section_sources:
      response-consequences: '## What different replies do {#response-consequences
        role=contrast objectives=obj-advanced-pragmatics-01}


        Several replies can be grammatical without solving the conversational problem.


        ::: examples

        - no: Ja, det blir sikkert bra.

        - en: Yes, it will probably be good.

        - no: Forresten, hvem bestiller kaffe?

        - en: By the way, who is ordering coffee?

        - no: Jeg mente bare at rommet kanskje er ledig. Jeg sjekker det før vi sender
        invitasjonen.

        - en: I only meant that the room might be available. I''ll check before we
        send the invitation.

        :::


        The first reply allows the mistaken plan to stand. The second introduces a
        side

        topic. **Forresten** can make that topic shift clear, but a clear topic shift
        still

        does not repair the misunderstanding. The third reply corrects the degree
        of

        certainty and protects the next action.


        A repair does not need to sound dramatic. Short phrases such as *vent litt*,
        *ikke

        helt*, *jeg mente bare at ...*, or *det er ikke bestemt ennå* can interrupt
        the

        inference without blaming the other person.


        **Checkpoint: Compare the consequences**


        Choose the reply that prevents Jonas from sending unconfirmed information.


        {{exercise: compare_reply_consequences}}


        '
