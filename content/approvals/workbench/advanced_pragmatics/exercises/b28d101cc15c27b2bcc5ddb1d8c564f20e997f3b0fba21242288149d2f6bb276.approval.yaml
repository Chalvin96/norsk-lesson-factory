  answer_supplied_clarification:
    exercise_key: answer_supplied_clarification
    checked_against:
      adapt-after-clarification: 179fa70a505de3f9a874d68cb7f3684837df5c4f7b2d9c40a519810987b907ba
    section_sources:
      adapt-after-clarification: '## Adapt after new information {#adapt-after-clarification
        role=model objectives=obj-advanced-pragmatics-01}


        A repair can invite the other person to clarify in return. The next response
        must

        then use the new information instead of repeating the original correction.


        ::: {.reading translation="I thought we could send the draft today." dialogue_id="draft_clarification"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Jeg tenkte at vi kunne sende utkastet i dag.

        :::


        ::: {.reading translation="Okay, then I''ll send it to the client now." dialogue_id="draft_clarification"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Greit, da sender jeg det til kunden nå.

        :::


        ::: {.reading translation="Wait, don''t send it yet." dialogue_id="draft_clarification"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Vent litt, ikke send det ennå.

        :::


        ::: {.reading translation="Do you mean that it isn''t ready?" dialogue_id="draft_clarification"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Mener du at det ikke er klart?

        :::


        Nora can now explain the precise status and agree on a revised action. Her
        reply

        should answer Jonas''s question directly; simply repeating *ikke send det*
        would leave

        the reason and next step unclear.


        **Guided practice: Answer the clarification**


        Use the supplied follow-up question to clarify the draft''s status and decide
        what

        Jonas should do.


        {{exercise: answer_supplied_clarification}}


        '
