  vil_prediction_interpretation:
    exercise_key: vil_prediction_interpretation
    checked_against:
      two-meanings-of-vil: e74ace08127e24262bbd47b74d48599251848d51b573609285b49b9a9efc65fe
    section_sources:
      two-meanings-of-vil: '## The two meanings of vil {#two-meanings-of-vil role=contrast
        objectives=obj-future-expressions-01}


        With a person as subject, **vil** can mean **want to** or **be willing to**,
        not simply future **will**.


        ::: examples

        - no: Jeg vil reise til Lillehammer.

        - en: I want to travel to Lillehammer.

        - no: Jeg vil hjelpe deg.

        - en: I want to help you. / I’m willing to help you.

        :::


        For a decided plan, use **skal**:


        ::: examples

        - no: Jeg skal reise til Lillehammer på lørdag.

        - en: I’m going to travel to Lillehammer on Saturday.

        :::


        For a prediction, make the predictive context clear:


        ::: examples

        - no: Jeg tror Maja vil like Lillehammer.

        - en: I think Maja will like Lillehammer.

        :::


        The point is not that **vil** can never refer to a person’s future action.
        The important issue is possible ambiguity. If you mean a plan, **skal** is
        usually clearer.


        {{exercise: vil_prediction_interpretation}}


        '
