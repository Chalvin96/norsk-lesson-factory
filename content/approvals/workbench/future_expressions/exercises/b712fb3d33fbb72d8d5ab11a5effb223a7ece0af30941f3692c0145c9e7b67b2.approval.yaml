    checked_against:
      likely-misconception-skal: c415918701558df8faf4319b7d6a578681176519ea4cbb9308ef95adebc6916f
    section_sources:
      likely-misconception-skal: '## Likely misconception {#likely-misconception-skal
        role=contrast objectives=obj-future-expressions-01}


        English **will** does not always correspond to Norwegian **vil**. For a decided
        first-person plan, Norwegian commonly uses **skal**.


        ::: examples

        - no: Jeg skal hente deg klokka seks.

        - en: I’ll pick you up at six.

        - no: Jeg vil hente deg klokka seks.

        - en: I want to pick you up at six.

        :::


        The second sentence can express desire or willingness rather than a neutral
        future plan.


        {{exercise: skal_plan_formation}}


        '
