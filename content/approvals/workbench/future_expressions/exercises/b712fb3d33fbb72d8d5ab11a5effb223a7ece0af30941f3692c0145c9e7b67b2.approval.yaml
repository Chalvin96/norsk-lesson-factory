  prediction_basis_choice:
    exercise_key: prediction_basis_choice
    checked_against:
      vil-or-kommer-til-a: c266a2192f946d4fec0ac424e3bf34b1e0f2f7f17f87bfa040a4383aed035e00
    section_sources:
      vil-or-kommer-til-a: '## Vil or kommer til å? {#vil-or-kommer-til-a role=contrast
        objectives=obj-future-expressions-01}


        Both forms can make predictions. A useful A2-level distinction is:


        - **vil** often presents a prediction as an opinion, assessment, or neutral
        forecast.

        - **kommer til å** often presents an expected result, particularly when circumstances
        or signs point toward it.


        Compare:


        ::: examples

        - no: Jeg tror toget vil være fullt.

        - en: I think the train will be full.

        :::


        The speaker offers an assessment.


        ::: examples

        - no: Se på køen! Toget kommer til å bli fullt.

        - en: Look at the queue! The train is going to be full.

        :::


        The visible queue supports the prediction.


        Another contrast:


        ::: examples

        - no: Ekspertene tror prisene vil stige.

        - en: The experts think prices will rise.

        - no: Med disse nye kostnadene kommer prisene til å stige.

        - en: With these new costs, prices are going to rise.

        :::


        This is a useful tendency, not an absolute boundary. In everyday Norwegian,
        both expressions can sometimes fit. The speaker chooses how to frame the prediction.


        {{exercise: prediction_basis_choice}}


        '
