  trip_message_completion:
    exercise_key: trip_message_completion
    checked_against:
      back-to-maja-and-jonas: 5f451caf641db2abeef943dc298e0804eca30c087054ab55a53fe56cc65d30ec
    section_sources:
      back-to-maja-and-jonas: '## Back to Maja and Jonas {#back-to-maja-and-jonas
        role=model objectives=obj-future-expressions-01}


        On Friday evening, Jonas sends Maja an update.


        ::: {.reading translation="My sister is going to meet us at the station in
        Lillehammer." dialogue_id="friday-evening-update" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Søsteren min skal møte oss på stasjonen i Lillehammer.

        :::


        ::: {.reading translation="Great. The train arrives at 10:26, right?" dialogue_id="friday-evening-update"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Fint. Toget kommer fram klokka 10.26, ikke sant?

        :::


        ::: {.reading translation="Yes. I think she’ll wait by the main entrance."
        dialogue_id="friday-evening-update" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Ja. Jeg tror hun vil vente ved hovedinngangen.

        :::


        ::: {.reading translation="Good. I’ll send her a message when we leave Oslo."
        dialogue_id="friday-evening-update" speaker_id="maja" speaker_name="Maja"
        character_id="maja"}

        Bra. Jeg skal sende henne en melding når vi drar fra Oslo.

        :::


        ::: {.reading translation="Bring warm clothes too. It’s going to be cold in
        the evening." dialogue_id="friday-evening-update" speaker_id="jonas" speaker_name="Jonas"
        character_id="jonas"}

        Ta med varme klær også. Det kommer til å bli kaldt om kvelden.

        :::


        The four choices still serve different purposes:


        - Jonas’s sister has a plan: **skal møte**.

        - The arrival belongs to the timetable: **kommer fram**.

        - Jonas gives his assessment: **vil vente**.

        - The expected cold is presented as a likely result: **kommer til å bli**.


        {{exercise: trip_message_completion}}


        '
