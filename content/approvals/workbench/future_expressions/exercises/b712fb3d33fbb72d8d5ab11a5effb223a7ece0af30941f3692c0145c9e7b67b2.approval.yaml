  - finding_id: ai-34d344b34685eda1e2f4e78e
    key: plans-and-commitments-with-skal#0
    criterion: sequencing
    excerpt: Use **skal + infinitive (infinitiv)** when the subject has a plan, intention,
      agreement, or commitment.
    explanation: 'plans-and-commitments-with-skal#0: infinitive named but not glossed:
      Gloss infinitive at first use: “Use skal + the infinitive—the verb’s basic form,
      such as kjøpe (‘buy’)—for a plan, intention, agreement, or commitment. After
      skal, omit å.” The Norwegian label infinitiv alone does not explain the term
      to an English-speaking learner.'
