    section_sources:
      common-mistake-present-context: '## Common mistake: present tense without future
        context {#common-mistake-present-context role=contrast objectives=obj-future-expressions-01}


        A present-tense form does not automatically mean future time.


        ::: examples

        - no: Jeg jobber.

        - en: I’m working.

        :::


        Without a future expression or a clear shared arrangement, this normally refers
        to the present.


        Compare:


        ::: examples

        - no: Jeg jobber i morgen.

        - en: I’m working tomorrow.

        :::


        Here, **i morgen** supplies the future context.


        {{exercise: plan_or_arrangement_choice}}


