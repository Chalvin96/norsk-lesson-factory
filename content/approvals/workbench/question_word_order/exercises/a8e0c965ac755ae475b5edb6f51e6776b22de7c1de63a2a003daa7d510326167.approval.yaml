exercise_alignments:
  recognize_yes_no_question_order:
    exercise_key: recognize_yes_no_question_order
    checked_against:
      sec-simple-yes-no-questions: 05a455fb91eb9761c6568314b3ceb0fe91ba04c113efee31a65c81f0466f4eb9
    section_sources:
      sec-simple-yes-no-questions: '## Simple yes/no questions {#sec-simple-yes-no-questions
        role=model objectives=obj-question-word-order-01}


        A yes/no question asks whether something is true. The expected response might
        be ja or nei, although the speaker can naturally give more information.


        In a Norwegian main-clause statement, the subject commonly comes before the
        verb:


        ::: examples

        - no: Du bor i Bergen.

        - en: You live in Bergen.

        :::


        To turn this into a yes/no question, put the verb first:


        ::: examples

        - no: Bor du i Bergen?

        - en: Do you live in Bergen?

        :::


        The compact pattern is:


        ::: {.rule}

        verb + subject + rest of the question

        :::


        Compare the word order:


        ::: examples

        - no: Du jobber her.

        - en: You work here.

        - no: Jobber du her?

        - en: Do you work here?

        - no: Hun snakker norsk.

        - en: She speaks Norwegian.

        - no: Snakker hun norsk?

        - en: Does she speak Norwegian?

        - no: Dere kommer i morgen.

        - en: You are coming tomorrow.

        - no: Kommer dere i morgen?

        - en: Are you coming tomorrow?

        :::


        English often adds do or does to make a present-tense question. Norwegian
        normally does not add a corresponding extra word.


        ::: examples

        - no: Liker du kaffe?

        - en: Do you like coffee?

        - no: ✗ Gjør du liker kaffe?

        - en: Do you like coffee?

        :::


        Norwegian simply puts liker before du.


        The same verb-first order works with er:


        ::: examples

        - no: Bussen er sen.

        - en: The bus is late.

        - no: Er bussen sen?

        - en: Is the bus late?

        :::


        It also works when a sentence contains more than one verb. The first verb
        moves before the subject:


        ::: examples

        - no: Du har kjøpt billett.

        - en: You have bought a ticket.

        - no: Har du kjøpt billett?

        - en: Have you bought a ticket?

        - no: Vi skal gå inn.

        - en: We are going to go inside.

        - no: Skal vi gå inn?

        - en: Shall we go inside?

        :::


        **Common mistake: keeping statement order**


        A question mark does not turn statement word order into normal question word
        order.


        Less natural as a neutral question:


        ::: examples

        - no: ✗ Du kommer i kveld?

        - en: You’re coming tonight?

        :::


        This order can occur when someone is surprised or checking something they
        think is already true. For an ordinary yes/no question, use the verb first:


        ::: examples

        - no: Kommer du i kveld?

        - en: Are you coming tonight?

        :::


        {{exercise: recognize_yes_no_question_order}}


        {{exercise: form_yes_no_questions}}


        '
