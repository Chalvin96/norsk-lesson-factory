  form_permission_questions:
    exercise_key: form_permission_questions
    checked_against:
      sec-asking-for-permission: ce0aec02c9ebf0b64e56798adc39c896d873aab120603588eb9ecde046382947
    section_sources:
      sec-asking-for-permission: '## Asking for permission {#sec-asking-for-permission
        role=model objectives=obj-question-word-order-01}


        Norwegian permission questions use the same verb-first pattern as other yes/no
        questions. Two common openings are kan jeg and får jeg.


        ::: examples

        - no: Kan jeg betale med kort?

        - en: Can I pay by card?

        - no: Kan jeg sitte her?

        - en: Can I sit here?

        - no: Får jeg åpne vinduet?

        - en: May I open the window?

        - no: Får jeg gå inn nå?

        - en: May I go inside now?

        :::


        Kan can refer to ability, but in everyday requests kan jeg often asks whether
        an action is allowed or acceptable.


        ::: examples

        - no: Kan jeg bruke telefonen din?

        - en: Can I use your phone?

        :::


        Får jeg more explicitly asks for permission:


        ::: examples

        - no: Får jeg bruke telefonen din?

        - en: May I use your phone?

        :::


        Both begin with a verb:


        - kan + jeg

        - får + jeg


        The action follows:


        ::: examples

        - no: Kan jeg kjøpe billett her?

        - en: Can I buy a ticket here?

        - no: Får vi vente inne?

        - en: May we wait inside?

        - no: Kan barna bli med?

        - en: Can the children come along?

        :::


        Permission questions can also be negative:


        ::: examples

        - no: Kan jeg ikke betale med kort?

        - en: Can’t I pay by card?

        - no: Får vi ikke gå inn ennå?

        - en: Aren’t we allowed to go inside yet?

        :::


        Here the speaker may be surprised that permission appears to be refused. The
        order remains verb + subject + ikke.


        **Permission and ordinary information**


        Compare these two questions:


        ::: examples

        - no: Betaler du med kort?

        - en: Are you paying by card?

        - no: Kan jeg betale med kort?

        - en: Can I pay by card?

        :::


        The first asks about what another person does. The second asks whether the
        speaker may or can do something. Both put the verb before the subject, but
        the opening verb creates a different question meaning.


        {{exercise: form_permission_questions}}


        '
