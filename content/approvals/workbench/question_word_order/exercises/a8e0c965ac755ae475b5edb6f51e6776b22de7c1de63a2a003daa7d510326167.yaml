  op: categorize
  objective: obj-question-word-order-01
  bloom: analyze
  prompt_md: "Sort the lines by word order. Put ordinary, neutral yes/no questions with the verb before the subject in the first group. Put subject-first lines, including check questions, in the second group. Look at the word order, not only the question mark."
  stimulus: []
  explanation_md: "I spørsmål står det finitte verbet før subjektet. I spørreordsspørsmål står spørreordet først, og ikke kommer etter subjektet."
  derived_from:
  - section_id: sec-simple-yes-no-questions
  buckets:
  - bucket_id: verb-first-question
    label: 'Nøytralt spørsmål: verb før subjekt'
  - bucket_id: subject-first-not-target
    label: Subjekt før verb
  items:
  - item_id: line-1
    text: Kommer du i kveld?
    bucket_id: verb-first-question
  - item_id: line-2
    text: Du kommer i kveld?
    bucket_id: subject-first-not-target
  - item_id: line-3
    text: Har hun en billett?
    bucket_id: verb-first-question
  - item_id: line-4
    text: Du har ikke billett.
    bucket_id: subject-first-not-target
