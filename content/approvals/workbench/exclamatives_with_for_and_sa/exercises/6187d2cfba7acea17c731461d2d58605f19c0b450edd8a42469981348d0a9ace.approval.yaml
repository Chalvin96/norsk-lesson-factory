      noun-focused-exclamations-with-for: d51ca57535611e8ef59938430aa2045986ac7be58160571cd67885f4e0cafb2a
    section_sources:
      noun-focused-exclamations-with-for: '## Noun-focused exclamations with **for**
        {#noun-focused-exclamations-with-for role=model objectives=obj-exclamatives-with-for-and-sa-01}


        Use **for** before a noun phrase when your reaction is mainly about the person
        or thing itself. A common pattern is:


        ::: examples

        - no: for + en/et/noen + adjective + noun

        - en: for + en/et/noen + adjective + noun

        :::


        The article agrees with the noun in the usual way:


        ::: examples

        - no: For en fin leilighet!

        - en: What a nice apartment!

        - no: For et stort kjøkken!

        - en: What a large kitchen!

        - no: For noen vakre blomster!

        - en: What beautiful flowers!

        :::


        In the plural, **noen** is optional: **For fine blomster!** is also natural.


        The adjective is useful but not always necessary:


        ::: examples

        - no: For en dag!

        - en: What a day!

        - no: For et vær!

        - en: What weather!

        - no: For en utsikt!

        - en: What a view!

        :::


        These short exclamations do not need a verb. The situation makes the reaction
        clear.


        A longer **for** exclamation can include a full statement:


        ::: examples

        - no: For en fin leilighet dere har!

        - en: What a nice apartment you have!

        - no: For et godt måltid du har laget!

        - en: What a good meal you have made!

        - no: For noen interessante historier hun forteller!

        - en: What interesting stories she tells!

        :::


        Notice the statement word order in the final part:


        ::: examples

        - no: dere har

        - en: you have

        - no: du har laget

        - en: you have made

        - no: hun forteller

        - en: she tells

        :::


        The subject comes before the verb. Although the sentence expresses surprise
        or admiration, it is not a question.


        {{exercise: noun_focus_in_the_cabin}}


        '
