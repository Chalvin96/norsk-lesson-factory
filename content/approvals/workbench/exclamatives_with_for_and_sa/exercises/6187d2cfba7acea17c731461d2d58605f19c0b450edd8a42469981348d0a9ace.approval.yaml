  shift_the_focus:
    exercise_key: shift_the_focus
    checked_against:
      for-sa-focus-contrast: 77f5f9269ebe3827c98b8634754ec41d73f34228e1db4b6bf3e37e7e1e1c4cf0
    section_sources:
      for-sa-focus-contrast: '## The contrast at the heart of the lesson {#for-sa-focus-contrast
        role=contrast objectives=obj-exclamatives-with-for-and-sa-01}


        This is the contrast at the heart of the lesson:


        - Noun-focused with **for**:


        ::: examples

        - no: For en rolig kveld!

        - en: What a peaceful evening!

        - no: For et høyt fjell!

        - en: What a high mountain!

        - no: For noen raske løpere!

        - en: What fast runners!

        - no: For en vakker sang!

        - en: What a beautiful song!

        :::


        - Degree-focused with **så**:


        ::: examples

        - no: Så rolig kvelden er!

        - en: How peaceful the evening is!

        - no: Så høyt fjellet er!

        - en: How high the mountain is!

        - no: Så fort de løper!

        - en: How fast they run!

        - no: Så vakkert hun synger!

        - en: How beautifully she sings!

        :::


        The **for** sentence packages the reaction around a noun: *evening, mountain,
        runners, song*. The **så** sentence highlights the quality or manner: *peaceful,
        high, fast, beautifully*.


        {{exercise: shift_the_focus}}


        '
