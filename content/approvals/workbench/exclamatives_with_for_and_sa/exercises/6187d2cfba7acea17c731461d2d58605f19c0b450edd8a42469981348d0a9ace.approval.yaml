        ::: {.reading translation="Yes, and how clearly we could see the stars!" dialogue_id=cabin-morning
        speaker_id=elias speaker_name="Elias" character_id="elias"}

        Ja, og så klart vi kunne se stjernene!

        :::


        ::: {.reading translation="Good! You didn’t have any problems with the fireplace,
        did you?" dialogue_id=cabin-morning speaker_id=ingrid speaker_name="Ingrid"
        character_id="ingrid"}

        Fint! Dere hadde vel ikke problemer med peisen?

        :::


        ::: {.reading translation="No. How easy it was to use!" dialogue_id=cabin-morning
        speaker_id=maja speaker_name="Maja" character_id="maja"}

        Nei. Så lett den var å bruke!

        :::


        ::: {.reading translation="And what a good breakfast we ate on the terrace!"
        dialogue_id=cabin-morning speaker_id=elias speaker_name="Elias" character_id="elias"}

        Og for en god frokost vi spiste på terrassen!

        :::


        Maja focuses on **en rolig kveld** and **en god frokost**, so she uses **for**.
        Elias emphasizes how clearly they saw the stars and how easy the fireplace
        was to use, so he uses **så**. Their longer exclamations still keep statement
        order:


        ::: examples

        - no: vi hadde

        - en: we had

        - no: vi kunne se

        - en: we could see

        - no: den var

        - en: it was

        - no: vi spiste

        - en: we ate

        :::


