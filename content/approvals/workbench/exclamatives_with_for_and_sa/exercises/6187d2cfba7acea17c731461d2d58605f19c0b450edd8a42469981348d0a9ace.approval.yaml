  exclamation_not_question:
    exercise_key: exclamation_not_question
    checked_against:
      exclamations-keep-statement-word-order: 785efda5ce80d11ae0943d394705aa9e7f83932cfc484974649ac74fa3433e6f
    section_sources:
      exclamations-keep-statement-word-order: '## Exclamations keep statement word
        order {#exclamations-keep-statement-word-order role=contrast objectives=obj-exclamatives-with-for-and-sa-01}


        English exclamations beginning with *how* can make Norwegian learners expect
        question-like word order. Norwegian **så** exclamations do not use question
        inversion.


        A normal statement has the subject before the verb:


        ::: examples

        - no: Utsikten er vakker.

        - en: The view is beautiful.

        :::


        The corresponding exclamation keeps the subject before the verb:


        ::: examples

        - no: Så vakker utsikten er!

        - en: How beautiful the view is!

        :::


        Do not move the verb in front of the subject:


        ::: examples

        - no: ✗ Så vakker er utsikten?

        - en: Is the view that beautiful?

        :::


        With that word order and question intonation, the sentence is interpreted
        as a question rather than the intended exclamation.


        Compare:


        ::: examples

        - no: Så hyggelig naboen er!

        - en: How nice the neighbor is!

        - no: Er naboen hyggelig?

        - en: Is the neighbor nice?

        :::


        And:


        ::: examples

        - no: Så raskt toget går!

        - en: How fast the train goes!

        - no: Går toget raskt?

        - en: Does the train go fast?

        :::


        The compact rule is:


        ::: {.rule}

        In a full **så** exclamation, place the description first, then keep the subject
        before the verb.

        :::


        This also applies when the subject is a pronoun:


        ::: examples

        - no: Så glad hun er!

        - en: How happy she is!

        - no: Så trøtte de er!

        - en: How tired they are!

        - no: Så varmt det er her!

        - en: How warm it is here!

        :::


        Longer **for** exclamations follow the same principle:


        ::: examples

        - no: For en hyggelig nabo vi har!

        - en: What a nice neighbor we have!

        :::


        The ending is **vi har**, not question order.


        {{exercise: exclamation_not_question}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:38:37.409790+00:00'
    decision_id: null
  repair_mixed_reactions:
    exercise_key: repair_mixed_reactions
    checked_against:
      avoid-mixing-the-two-patterns: 07d799de2c24293f7f7739f9b14377373fe4ac3b867fd1afa7c1aca2515b3b13
    section_sources:
      avoid-mixing-the-two-patterns: '## Avoid mixing the two patterns {#avoid-mixing-the-two-patterns
        role=contrast objectives=obj-exclamatives-with-for-and-sa-01}


        A common mistake is to begin with **så** and then continue with the noun pattern
        used after **for**:


        ::: examples

        - no: ✗ Så en fin utsikt!

        - en: What a beautiful view!

        :::


        Intended meaning: *What a beautiful view!*


        Use either the noun-focused pattern:


        ::: examples

        - no: For en fin utsikt!

        - en: What a beautiful view!

        :::


        Or the degree-focused pattern:


        ::: examples

        - no: Så fin utsikten er!

        - en: How beautiful the view is!

        :::


        Another mistake is to omit the article after **for** when a singular countable
        noun needs one:


        ::: examples

        - no: ✗ For fin utsikt!

        - en: What a beautiful view!

        :::


        Intended meaning: *What a beautiful view!*


        The usual form is:


        ::: examples

        - no: For en fin utsikt!

        - en: What a beautiful view!

        :::


        Do not choose mechanically according to whether an adjective appears. Both
        patterns can contain an adjective:


        ::: examples

        - no: For en søt hund!

        - en: What a cute dog!

        - no: Så søt hunden er!

        - en: How cute the dog is!

        :::


        The difference is focus, not merely the presence of **søt**.


        {{exercise: repair_mixed_reactions}}


        '
