      being-in-a-place: 6ae37302f1f964cc1a4a7f58617d311acb8edb5dcc6cb87f75473029dab25031
    section_sources:
      being-in-a-place: '## Being in a place: i and på {#being-in-a-place role=model
        objectives=obj-basic-prepositions-place-time-01}


        Norwegian commonly uses both **i** and **på** for location. English often
        translates both as *in* or *at*, so direct translation is not enough.


        Use **i** with many enclosed places and with towns, cities, and countries:


        ::: examples

        - no: Jeg er i butikken.

        - en: I am in the shop.

        - no: Hun bor i Oslo.

        - en: She lives in Oslo.

        - no: De er i Norge.

        - en: They are in Norway.

        - no: Barna leker i parken.

        - en: The children are playing in the park.

        :::


        Use **på** in many familiar expressions connected with workplaces, schools,
        offices, cafés, and activities:


        ::: examples

        - no: Jonas er på jobb.

        - en: Jonas is at work.

        - no: Maja er på kafeen.

        - en: Maja is at the café.

        - no: Læreren er på skolen.

        - en: The teacher is at the school.

        - no: Vi er på kontoret.

        - en: We are at the office.

        :::


        These are useful phrase patterns, not a perfect geometric system. A person
        can physically be inside both a shop and a café, but ordinary Norwegian commonly
        says **i butikken** and **på kafeen**. Learn the preposition together with
        the place expression.


        Compare:


        ::: examples

        - no: Hun jobber i Oslo.

        - en: She works in Oslo.

        - no: Hun jobber på kontoret.

        - en: She works at the office.

        - no: Vi møtes i parken.

        - en: We are meeting in the park.

        - no: Vi møtes på kafeen.

        - en: We are meeting at the café.

        :::


        A common mistake is to assume that every building takes **i** because someone
        is physically inside it. Norwegian often chooses the preposition according
        to the conventional expression and the activity associated with the place.


        {{exercise: choose-current-place}}


        '
