    section_sources:
      location-or-destination: '## Location or destination? {#location-or-destination
        role=contrast objectives=obj-basic-prepositions-place-time-01}


        The next decision is whether someone is already in a place or moving toward
        it.


        For a simple destination, **til** often means *to*:


        ::: examples

        - no: Jeg går til kafeen.

        - en: I am walking to the café.

        - no: Hun reiser til Oslo.

        - en: She is travelling to Oslo.

        - no: Vi kjører til butikken.

        - en: We are driving to the shop.

        :::


        Compare the destination with the resulting location:


        ::: examples

        - no: Jonas går til kafeen.

        - en: Jonas is going to the café.

        - no: Jonas er på kafeen.

        - en: Jonas is at the café.

        - no: Maja reiser til Oslo.

        - en: Maja is travelling to Oslo.

        - no: Maja er i Oslo.

        - en: Maja is in Oslo.

        :::


        The compact rule is:


        - Use **i** or **på** to say where someone is.

        - Use **til** for a simple destination: where someone is going.


        Do not replace every location preposition with **til** merely because the
        verb describes an action. What matters is whether the place is the destination.


        ::: examples

        - no: Hun jobber i Bergen.

        - en: She works in Bergen.

        :::


        Here, Bergen is her work location, not a destination.


        ::: examples

        - no: Hun reiser til Bergen.

        - en: She travels to Bergen.

        :::


        Here, Bergen is the destination.


        Some fixed expressions with activities can also use **på** after a movement
        verb, particularly **dra på jobb**, “go to work.” The basic **til** contrast
        remains most useful with clear destinations such as a named city, a shop,
        a café, or another person.


        {{exercise: contrast-location-and-destination}}


        '
