  - finding_id: ai-75a220bbb60d1d29cca37d12
    key: contrast-location-and-destination
    criterion: attempt_surface.ambiguous
    excerpt: ''
    explanation: 'The first and third blanks permit competing meanings: «Jeg kjører
      til Tromsø» versus «Jeg kjører i Tromsø», and «Jeg reiser til Spania» versus
      «Jeg reiser i Spania». Later being in the same place fits both travelling there
      and travelling within it. No visible instruction requires those blanks to express
      destinations.'
