    key: contrast-location-and-destination
    criterion: answerable
    excerpt: 'contrast-location-and-destination: prompt_md: Complete the travel descriptions
      with «til», «i», or «på». Stems include «Jeg kjører ___ Tromsø. Senere er jeg
      ___ Tromsø.» and «Jeg reiser ___ Spania. Etterpå er jeg ___ Spania.» Both first
      blanks offer i but key only til. The third stem is «Jeg går ___ garasjen. Når
      jeg kommer fram, er jeg ___ garasjen og henter sykkelen.» Its first blank also
      offers i but keys only til.'
    explanation: 'contrast-location-and-destination rejects valid location readings:
      Explicitly require destination expressions in the first sentence of each pair
      and location expressions after arrival. Alternatively, add unambiguous starting-point
      and destination cues. As written, driving within Tromsø, travelling within Spain,
      and going into the garage are valid readings with i; later location statements
      do not exclude them.'
