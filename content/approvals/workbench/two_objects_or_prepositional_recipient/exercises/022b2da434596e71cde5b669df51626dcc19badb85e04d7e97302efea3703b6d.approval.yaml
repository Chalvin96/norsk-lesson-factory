  complete_office_transfers:
    exercise_key: complete_office_transfers
    checked_against:
      returning-to-the-office: e38a98174abbe5c0f4e2e921ae15e1c52688a529108bb44cb9587b78ab9b4a43
    section_sources:
      returning-to-the-office: '## Returning to the office {#returning-to-the-office
        role=model objectives=obj-two-objects-or-prepositional-recipient-01}


        Later that afternoon, Mari finds Nora’s office.


        ::: {.reading translation="Hi, Nora. Jonas asked me to give you this key."
        dialogue_id=returning-to-the-office speaker_id=mari speaker_name="Mari" character_id="mari"}

        Hei, Nora. Jonas ba meg gi deg denne nøkkelen.

        :::


        ::: {.reading translation="Thanks very much. Can you send Jonas a message
        too?" dialogue_id=returning-to-the-office speaker_id=nora speaker_name="Nora"
        character_id="nora"}

        Tusen takk. Kan du sende Jonas en melding også?

        :::


        ::: {.reading translation="Yes, I’ll send a message to him right away." dialogue_id=returning-to-the-office
        speaker_id=mari speaker_name="Mari" character_id="mari"}

        Ja, jeg sender en melding til ham med en gang.

        :::


        ::: {.reading translation="Great. Give him this folder the next time you see
        him." dialogue_id=returning-to-the-office speaker_id=nora speaker_name="Nora"
        character_id="nora"}

        Flott. Gi ham denne mappen neste gang du ser ham.

        :::


        The scene now uses both frames:


        ::: examples

        - no: gi deg denne nøkkelen

        - en: give you this key

        - no: sende Jonas en melding

        - en: send Jonas a message

        - no: sende en melding til ham

        - en: send a message to him

        - no: gi ham denne mappen

        - en: give him this folder

        :::


        Recipient: deg

        Theme: denne nøkkelen


        Recipient: Jonas

        Theme: en melding


        Theme: en melding

        Recipient: ham


        Recipient: ham

        Theme: denne mappen


        The object pronouns change with the people in the conversation, but the two
        frame patterns remain stable.


        {{exercise: complete_office_transfers}}


        '
