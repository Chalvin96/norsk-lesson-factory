  transform_to_til_recipient:
    exercise_key: transform_to_til_recipient
    checked_against:
      changing-from-one-frame-to-the-other: 2f738132b5069d7da2e6be1fae09616d0919764636554e131b778942d842d36e
    section_sources:
      changing-from-one-frame-to-the-other: '## Changing from one frame to the other
        {#changing-from-one-frame-to-the-other role=model objectives=obj-two-objects-or-prepositional-recipient-01}


        To change frames, move both participants as a unit of meaning. Do not simply
        insert or remove til.


        Start with:


        ::: examples

        - no: Mari sender Jonas adressen.

        - en: Mari sends Jonas the address.

        :::


        Jonas is the recipient. Adressen is the theme. In the til frame, the theme
        moves before the marked recipient:


        ::: examples

        - no: Mari sender adressen til Jonas.

        - en: Mari sends the address to Jonas.

        :::


        The same process works with pronouns:


        ::: examples

        - no: Jonas gir henne nøkkelen.

        - en: Jonas gives her the key.

        - no: Jonas gir nøkkelen til henne.

        - en: Jonas gives the key to her.

        :::


        And with indefinite themes:


        ::: examples

        - no: Vi sender kunden en bekreftelse.

        - en: We send the customer a confirmation.

        - no: Vi sender en bekreftelse til kunden.

        - en: We send a confirmation to the customer.

        :::


        Notice that the identity of the recipient does not change. In both versions,
        kunden receives en bekreftelse.


        {{exercise: transform_to_til_recipient}}


        {{exercise: transform_to_two_object_frame}}


        '
