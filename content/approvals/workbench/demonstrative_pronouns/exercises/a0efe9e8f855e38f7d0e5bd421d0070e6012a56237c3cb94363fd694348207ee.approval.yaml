  definite_form_repair:
    exercise_key: definite_form_repair
    checked_against:
      the-noun-must-be-definite: b4afccd22d3aea1f27635ab6fb20f9d208f450508aaa292fb612e833c79a0f5a
    section_sources:
      the-noun-must-be-definite: '## The noun must be definite {#the-noun-must-be-definite
        role=contrast objectives=obj-demonstrative-pronouns-01}


        Norwegian uses the **definite noun form (bestemt form)** after these demonstratives.
        If you already know forms such as **stolen** (*the chair*), **bordet** (*the
        table*), and **bøkene** (*the books*), use those same forms after the demonstrative.


        Compare:


        ::: examples

        - no: en stol

        - en: a chair

        - no: stolen

        - en: the chair

        - no: denne stolen

        - en: this chair

        :::


        And:


        ::: examples

        - no: et bord

        - en: a table

        - no: bordet

        - en: the table

        - no: det bordet

        - en: that table

        :::


        And in the plural:


        ::: examples

        - no: bøker

        - en: books

        - no: bøkene

        - en: the books

        - no: disse bøkene

        - en: these books

        :::


        A common mistake is to copy the English structure too directly:


        ::: examples

        - no: ✗ denne stol

        - en: Intended meaning: this chair

        :::


        The corrected phrase is:


        ::: examples

        - no: denne stolen

        - en: this chair

        :::


        Another likely mistake is:


        ::: examples

        - no: ✗ det bord

        - en: Intended meaning: that table

        :::


        Use:


        ::: examples

        - no: det bordet

        - en: that table

        :::


        The demonstrative does not replace the noun’s definite ending. The two appear
        together:


        **demonstrative + definite noun**


        This may feel unusual because English says *this chair*, not “this the-chair.”
        In Norwegian, however, **denne stolen** is the normal structure.


        {{exercise: definite_form_repair}}


        '
    outcome: approved
