  demonstrative_agreement_selection:
    exercise_key: demonstrative_agreement_selection
    checked_against:
      plural-disse-or-de: 6798022be26815aac7da69eb627ebe0a2932a89efa9572e9ebe4d458d166703d
    section_sources:
      plural-disse-or-de: '## Plural: disse or de {#plural-disse-or-de role=model
        objectives=obj-demonstrative-pronouns-01}


        All plural nouns use **disse** for *these* and **de** for *those*. Gender
        no longer changes the demonstrative.


        ::: examples

        - no: stolene

        - en: the chairs

        - no: disse stolene

        - en: these chairs

        - no: de stolene

        - en: those chairs

        - no: bordene

        - en: the tables

        - no: disse bordene

        - en: these tables

        - no: de bordene

        - en: those tables

        - no: lampene

        - en: the lamps

        - no: disse lampene

        - en: these lamps

        - no: de lampene

        - en: those lamps

        :::


        The compact pattern is:


        - **denne** + masculine or feminine singular

        - **dette** + neuter singular

        - **disse** + plural

        - **den** + masculine or feminine singular

        - **det** + neuter singular

        - **de** + plural


        {{exercise: demonstrative_agreement_selection}}


        '
