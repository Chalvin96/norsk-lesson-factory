  counter_summary:
    exercise_key: counter_summary
    checked_against:
      back-at-the-counter: 05ba95482d5c7f7e301a8ffb400c4a1cba000410d2269731cf655996a8bddc64
    section_sources:
      back-at-the-counter: '## Back at the counter {#back-at-the-counter role=model
        objectives=obj-demonstrative-pronouns-01}


        Maja and Jonas take their choices to the counter.


        ::: {.reading translation="Do you want to buy this lamp?" dialogue_id="counter"
        speaker_id="ekspeditoren" speaker_name="Ekspeditøren"}

        Vil dere kjøpe denne lampa?

        :::


        ::: {.reading translation="Yes, and this mirror too." dialogue_id="counter"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Ja, og dette speilet også.

        :::


        ::: {.reading translation="We’re not taking those chairs at the back." dialogue_id="counter"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Vi tar ikke de stolene bakerst.

        :::


        ::: {.reading translation="No, we’re taking these chairs here." dialogue_id="counter"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Nei, vi tar disse stolene her.

        :::


        ::: {.reading translation="Good. This lamp, this mirror, and these chairs."
        dialogue_id="counter" speaker_id="ekspeditoren" speaker_name="Ekspeditøren"}

        Fint. Denne lampa, dette speilet og disse stolene.

        :::


        Maja’s final selection uses all three close forms:


        ::: examples

        - no: denne lampa

        - en: this lamp

        - no: dette speilet

        - en: this mirror

        - no: disse stolene

        - en: these chairs

        - no: de stolene bakerst

        - en: those chairs at the back

        :::


        - **denne lampa** because **lampe** is feminine singular;

        - **dette speilet** because **speil** is neuter singular;

        - **disse stolene** because **stolene** is plural.


        Jonas contrasts the selected chairs with **de stolene bakerst**—the chairs
        farther away.


        {{exercise: counter_summary}}


        '
