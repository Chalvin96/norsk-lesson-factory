  pattern_through_description:
    exercise_key: pattern_through_description
    checked_against:
      describing-a-particular-object: ddd62cc079bba3ebac6e9d58474fcb5d917be0117858534af563635bb6aff920
    section_sources:
      describing-a-particular-object: '## Describing a particular object {#describing-a-particular-object
        role=contrast objectives=obj-demonstrative-pronouns-01}


        An adjective may appear between the demonstrative and the noun:


        ::: examples

        - no: denne lille lampa

        - en: this small lamp

        - no: det store speilet

        - en: that large mirror

        - no: disse gamle stolene

        - en: these old chairs

        :::


        The important structure is still visible:


        - **denne** + **lampa**

        - **det** + **speilet**

        - **disse** + **stolene**


        The adjective adds description, but it does not remove the definite ending
        from the noun.


        Compare:


        ::: examples

        - no: denne lampa

        - en: this lamp

        - no: denne lille lampa

        - en: this small lamp

        - no: de stolene

        - en: those chairs

        - no: de gamle stolene

        - en: those old chairs

        :::


        Do not let the extra word hide the target pattern. In **dette lille bordet**,
        **dette** matches the neuter noun **bord**, and **bordet** remains definite.


        ::: examples

        - no: dette lille bordet

        - en: this small table

        - no: denne lille stolen

        - en: this small chair

        - no: disse små bordene

        - en: these small tables

        :::


        At this level, treat the adjective as useful context. The main task remains
        choosing the demonstrative and keeping the noun definite.


        {{exercise: pattern_through_description}}


        '
