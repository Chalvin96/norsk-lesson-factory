exercise_alignments:
  shop_distance_noticing:
    exercise_key: shop_distance_noticing
    checked_against:
      at-the-second-hand-shop: 9e0cd88b6d9686f779dca9c5ede40321de7afa96d338d3aed11a22e9ed194015
    section_sources:
      at-the-second-hand-shop: '## At the second-hand shop {#at-the-second-hand-shop
        role=orient objectives=obj-demonstrative-pronouns-01}


        Maja has recently moved into a new flat. Her friend Jonas is helping her look
        for a few inexpensive things at a second-hand shop. Some objects are beside
        them; others are farther away, near the back wall.


        ::: {.reading translation="Look at this lamp. It fits on my desk." dialogue_id="second-hand-shop"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Se på denne lampa. Den passer på skrivebordet mitt.

        :::


        ::: {.reading translation="Yes, but what about that lamp by the window?" dialogue_id="second-hand-shop"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Ja, men hva med den lampa ved vinduet?

        :::


        ::: {.reading translation="It is nice too. And I like this mirror here." dialogue_id="second-hand-shop"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Den er også fin. Og jeg liker dette speilet her.

        :::


        ::: {.reading translation="I prefer that mirror by the door." dialogue_id="second-hand-shop"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Jeg foretrekker det speilet ved døra.

        :::


        ::: {.reading translation="We also need chairs. Are these chairs comfortable?"
        dialogue_id="second-hand-shop" speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Vi trenger også stoler. Er disse stolene komfortable?

        :::


        ::: {.reading translation="Perhaps, but those chairs at the back are cheaper."
        dialogue_id="second-hand-shop" speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Kanskje, men de stolene bakerst er billigere.

        :::


        ::: {.reading translation="Then I’ll buy this lamp and these chairs." dialogue_id="second-hand-shop"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Da kjøper jeg denne lampa og disse stolene.

        :::


        ::: {.reading translation="Not that large mirror?" dialogue_id="second-hand-shop"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Ikke det store speilet?

        :::


        ::: {.reading translation="No, this small mirror is easier to carry!" dialogue_id="second-hand-shop"
        speaker_id="maja" speaker_name="Maja" character_id="maja"}

        Nei, dette lille speilet er lettere å bære!

        :::


        The scene contains one repeated choice. Maja and Jonas identify objects by
        showing whether they mean something close to them or something farther away.
        At the same time, the Norwegian form changes according to whether the noun
        is masculine or feminine, neuter, or plural.


        Notice one more feature:


        ::: examples

        - no: denne lampa

        - en: this lamp

        - no: dette speilet

        - en: this mirror

        - no: disse stolene

        - en: these chairs

        - no: den lampa

        - en: that lamp

        - no: det speilet

        - en: that mirror

        - no: de stolene

        - en: those chairs

        :::


        The noun after each demonstrative has a definite ending: **lampa**, **speilet**,
        **stolene**. Norwegian does not normally use the indefinite form in these
        phrases.


        {{exercise: shop_distance_noticing}}


        '
