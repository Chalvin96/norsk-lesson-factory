  moving_day_transfer:
    exercise_key: moving_day_transfer
    checked_against:
      transfer-to-a-new-situation: c2b9594b47992a6898ba9f302138df65580f264f7a700a51f1fc27349ea2bc6f
    section_sources:
      transfer-to-a-new-situation: '## Transfer to a new situation {#transfer-to-a-new-situation
        role=recap objectives=obj-demonstrative-pronouns-01}


        The next day, Maja is unpacking in her new flat. Jonas stands near several
        boxes, while Maja points to furniture and objects in different parts of the
        room.


        Use Norwegian phrases to distinguish:


        - a box beside Jonas from a box near the door;

        - a picture in Maja’s hands from a picture on the far wall;

        - several books on the nearby table from several books across the room.


        Then place the phrases into short practical statements such as:


        ::: examples

        - no: Denne esken skal på kjøkkenet.

        - en: This box is going to the kitchen.

        - no: Det bildet skal på soverommet.

        - en: That picture is going in the bedroom.

        - no: Disse bøkene skal i hylla.

        - en: These books are going on the shelf.

        :::


        The new situation changes the purpose. Maja is no longer choosing what to
        buy; she is identifying where particular belongings should go. The same grammar
        lets her make each reference clear.


        {{exercise: moving_day_transfer}}


        '
