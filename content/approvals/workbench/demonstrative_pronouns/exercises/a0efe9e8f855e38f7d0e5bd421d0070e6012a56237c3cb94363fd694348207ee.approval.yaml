  complete_reference_building:
    exercise_key: complete_reference_building
    checked_against:
      making-both-choices-together: 2908bb74a72c12b333f27220797184a8e62f470aff123c35b90315db4352a52d
    section_sources:
      making-both-choices-together: '## Making both choices together {#making-both-choices-together
        role=model objectives=obj-demonstrative-pronouns-01}


        In real use, the learner normally has to make both decisions:


        - close or farther away;

        - masculine/feminine singular, neuter singular, or plural.


        Consider a kitchen table beside you:


        ::: examples

        - no: dette bordet

        - en: this table

        :::


        The table is close, so choose the close set. **Bord** is neuter, so choose
        **dette**. The noun then appears in the definite form **bordet**.


        Now consider several chairs across the room:


        ::: examples

        - no: de stolene

        - en: those chairs

        :::


        The chairs are farther away, so choose the farther-away set. They are plural,
        so choose **de**. The noun appears in the definite plural, **stolene**.


        Here are further aligned contrasts:


        ::: examples

        - no: denne koppen / den koppen

        - en: this cup / that cup

        - no: dette glasset / det glasset

        - en: this glass / that glass

        - no: disse tallerkenene / de tallerkenene

        - en: these plates / those plates

        - no: denne boka / den boka

        - en: this book / that book

        - no: dette bildet / det bildet

        - en: this picture / that picture

        - no: disse bildene / de bildene

        - en: these pictures / those pictures

        :::


        The same meaning contrast works outside physical distance. Two people can
        point to items in a catalogue or on a screen:


        ::: examples

        - no: Jeg liker denne sofaen på side tre.

        - en: I like this sofa on page three.

        - no: Jeg liker ikke den sofaen på neste side.

        - en: I don’t like that sofa on the next page.

        :::


        The central grammar remains the same: choose a demonstrative and follow it
        with a definite noun.


        {{exercise: complete_reference_building}}


        '
