  weekend_trip_future_completion_transfer:
    exercise_key: weekend_trip_future_completion_transfer
    checked_against:
      transfer-preparing-for-a-weekend-trip: 5aa3df90b9eb05d194bf9f3cbf7015575f369e46f78116350cfb4da9fa604af1
    section_sources:
      transfer-preparing-for-a-weekend-trip: '## Transfer: preparing for a weekend
        trip {#transfer-preparing-for-a-weekend-trip role=recap objectives=obj-future-perfect-01}


        Change the situation. A family is leaving for a cabin at ten o’clock on Saturday.
        Several tasks remain: packing food, charging the car, checking the weather
        forecast, and giving a key to a neighbor.


        Use the future-completion forms to describe what will be complete before departure.


        A planned responsibility can use *skal ha*:


        ::: examples

        - no: Før vi drar, skal jeg ha pakket all maten.

        - en: Before we leave, I will have packed all the food.

        :::


        A prediction viewed from departure time can use *vil ha*:


        ::: examples

        - no: Når klokka er ti, vil Sara ha sjekket værmeldingen.

        - en: When it is ten o’clock, Sara will have checked the weather forecast.

        :::


        A result supported by current evidence can use *kommer til å ha*:


        ::: examples

        - no: Bilen lader raskt, så den kommer til å ha ladet ferdig før vi drar.

        - en: The car is charging quickly, so it will have finished charging before
        we leave.

        :::


        '
