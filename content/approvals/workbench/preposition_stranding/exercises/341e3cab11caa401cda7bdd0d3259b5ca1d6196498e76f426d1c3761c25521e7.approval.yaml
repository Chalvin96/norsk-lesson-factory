  form_everyday_questions:
    exercise_key: form_everyday_questions
    checked_against:
      formal-everyday-placement: 471c2c48a39ad35023d847995096ad71bcb53fe8822ea5e290e334f69d941284
    section_sources:
      formal-everyday-placement: '## Formal and everyday placement {#formal-everyday-placement
        role=contrast objectives=obj-preposition-stranding-01}


        It is possible to place some prepositions before the question word:


        ::: examples

        - no: Med hvem snakket du?

        - en: With whom did you speak?

        :::


        This sounds formal or marked in many everyday situations. Natural conversational
        Bokmål normally prefers:


        ::: examples

        - no: Hvem snakket du med?

        - en: Who did you speak with?

        :::


        Use the stranded pattern as the ordinary spoken and neutral everyday model.


        {{exercise: notice_question_links}}


        {{exercise: complete_stranded_prepositions_in_questions}}


        {{exercise: form_everyday_questions}}


        '
