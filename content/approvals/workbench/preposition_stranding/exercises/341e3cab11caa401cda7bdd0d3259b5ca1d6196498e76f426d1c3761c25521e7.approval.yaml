  complete_stranded_prepositions_in_questions:
    exercise_key: complete_stranded_prepositions_in_questions
    checked_against:
      asking-natural-questions: fed56bd96c771a324944a138d1c24a7dbec22e45110f46d2d25a8b7129bc6f8b
    section_sources:
      asking-natural-questions: '## Asking natural questions {#asking-natural-questions
        role=model objectives=obj-preposition-stranding-01}


        Begin with an ordinary statement and notice which noun phrase follows the
        preposition.


        ::: examples

        - no: Du snakker med Nora.

        - en: You are talking with Nora.

        :::


        If Nora is the unknown person, replace her with hvem and move hvem to the
        beginning. Keep med behind.


        ::: examples

        - no: Hvem snakker du med?

        - en: Who are you talking with?

        :::


        The ordinary question word order still applies after the question word.


        ::: examples

        - no: Dere snakker om festen.

        - en: You are talking about the party.

        - no: Hva snakker dere om?

        - en: What are you talking about?

        - no: Hun venter på en kollega.

        - en: She is waiting for a colleague.

        - no: Hvem venter hun på?

        - en: Who is she waiting for?

        - no: De bor i det gule huset.

        - en: They live in the yellow house.

        - no: Hvilket hus bor de i?

        - en: Which house do they live in?

        :::


        The question word can be followed by a noun, as in hvilket hus. The principle
        remains the same: huset is connected to i, so i stays later in the question.


        '
