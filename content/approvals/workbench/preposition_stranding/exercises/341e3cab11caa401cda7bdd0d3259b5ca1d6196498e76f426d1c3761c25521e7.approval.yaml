    section_sources:
      subject-contrast: '## A useful subject contrast {#subject-contrast role=contrast
        objectives=obj-preposition-stranding-01}


        Compare these two questions:


        ::: examples

        - no: Hvem snakker med Maja?

        - en: Who is talking with Maja?

        - no: Hvem snakker Maja med?

        - en: Who is Maja talking with?

        :::


        In the first question, hvem is the person doing the talking. The phrase med
        Maja remains complete.


        In the second, Maja is doing the talking. Hvem represents the person connected
        to med, so med is stranded later in the question.


        '
