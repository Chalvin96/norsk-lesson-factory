    section_sources:
      bare-infinitives: '## Bare infinitives after modal verbs {#bare-infinitives
        role=model objectives=obj-verb-complementation-01}


        Modal verbs such as kan, skal, vil, må and bør are followed directly by a
        bare infinitive. A bare infinitive is an infinitive without å.


        ::: examples

        - no: Kan du jobbe i kveld?

        - en: Can you work tonight?

        - no: Vi må levere rapporten på fredag.

        - en: We have to submit the report on Friday.

        - no: Jeg skal ringe Mina.

        - en: I will call Mina.

        - no: Erik bør begynne å pakke.

        - en: Erik should start packing.

        - no: De vil reise tidlig.

        - en: They want to leave early.

        :::


        The compact pattern is:


        **modal verb + bare infinitive**


        ::: examples

        - no: Hun kan komme.

        - en: She can come.

        :::


        Not: *Hun kan å komme.*


        Not: *Hun kan kommer.*


        After the modal, use the bare infinitive: komme.


        A sentence can contain more than one complement pattern. Return to Mina’s
        advice:


        ::: examples

        - no: Du bør begynne å pakke.

        - en: You should start packing.

        :::


        Here bør is a modal, so it is followed by the bare infinitive begynne. The
        verb begynne is then followed by an å-infinitive, å pakke.


        The structure is:


        **bør + begynne + å pakke**


        ::: examples

        - no: Vi skal prøve å dra før åtte.

        - en: We will try to leave before eight.

        :::


        The structure is:


        **skal + prøve + å dra**


        The bare infinitive rule applies immediately after the modal. It does not
        remove å from a later verb that requires an å-infinitive.


        {{exercise: modal_boundary_completion}}


        {{exercise: complement_chain_construction}}


        '
