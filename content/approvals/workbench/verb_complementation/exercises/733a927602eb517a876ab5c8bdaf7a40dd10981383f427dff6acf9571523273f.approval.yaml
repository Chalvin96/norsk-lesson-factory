  review_clause_structure_identification:
    exercise_key: review_clause_structure_identification
    checked_against:
      at-complete-clause: 563a938107b6152f84beaf704be6042d17269b2f3e7f9324beec44f2b8911289
    section_sources:
      at-complete-clause: '## When at introduces a complete clause {#at-complete-clause
        role=model objectives=obj-verb-complementation-01}


        The conjunction at introduces a subordinate clause (leddsetning). Unlike an
        å-infinitive, an at-clause normally states its own subject and contains a
        tense-bearing finite verb. When the finite verb is a modal, a bare infinitive
        may follow it.


        ::: examples

        - no: Sjefen sier at vi må levere rapporten på fredag.

        - en: The boss says that we have to submit the report on Friday.

        :::


        The at-clause has its own subject, vi, and its finite verb is må.


        ::: examples

        - no: Erik tror at han kan bli ferdig.

        - en: Erik thinks that he can finish.

        :::


        The at-clause has the subject han and the finite modal kan.


        ::: examples

        - no: Mina vet at Erik jobber i kveld.

        - en: Mina knows that Erik is working tonight.

        :::


        Here the at-clause contains Erik and the present-tense verb jobber.


        A compact pattern is:


        **subject + first verb + at + subject + finite verb**


        ::: examples

        - no: Jeg tror at bussen kommer snart.

        - en: I think that the bus is coming soon.

        - no: Hun sier at møtet begynner klokka ni.

        - en: She says that the meeting begins at nine.

        - no: Vi vet at de bor i Bergen.

        - en: We know that they live in Bergen.

        :::


        Verbs of saying, thinking and knowing commonly introduce finite content clauses
        because what follows is a complete statement. This lesson first models the
        full form with **at**:


        ::: examples

        - no: Han sier at han er sliten.

        - en: He says that he is tired.

        - no: Jeg tror at hun har tid.

        - en: I think that she has time.

        - no: De vet at toget er forsinket.

        - en: They know that the train is delayed.

        :::


        After relevant reporting and thinking verbs, **at** may also be omitted in
        natural Bokmål. For example, **Jeg tror du forstår** remains a finite content
        clause with the subject **du** and finite verb **forstår**; it is not a bare
        infinitive.


        The same-subject idea is useful, but it is not the only rule. Norwegian verbs
        also have their own complementation patterns. In neutral everyday Bokmål,
        **tro** normally introduces a finite content clause, with or without overt
        **at**:


        ::: examples

        - no: Jeg tror at jeg forstår.

        - en: I think that I understand.

        - no: Jeg tror jeg forstår.

        - en: I think that I understand.

        :::


        The form **Jeg tror å forstå** can occur in marked or formal Bokmål, but it
        is not the neutral everyday pattern practised in this lesson. None of these
        forms guarantees that understanding is actually achieved.


        {{exercise: clause_structure_identification}}


        {{exercise: reporting_with_at}}


        '
