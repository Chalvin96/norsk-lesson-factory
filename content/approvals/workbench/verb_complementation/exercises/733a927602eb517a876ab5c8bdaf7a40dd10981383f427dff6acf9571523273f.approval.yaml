  meaning_contrast_selection:
    exercise_key: meaning_contrast_selection
    checked_against:
      compare-complements: 0d30a6dfbf14cae6a74c70c8e9a62ac077a3d6ee2147402b7eb62c864031a77c
    section_sources:
      compare-complements: '## Compare å-infinitives and at-clauses {#compare-complements
        role=contrast objectives=obj-verb-complementation-01}


        Some verbs can occur with either pattern, but the meaning relationship changes.


        ::: examples

        - no: Jeg håper å reise på fredag.

        - en: I hope to leave on Friday.

        - no: Jeg håper at Mina reiser på fredag.

        - en: I hope that Mina leaves on Friday.

        :::


        In the first sentence, jeg is understood as the person who will leave. In
        the second, Mina is explicitly the person who will leave.


        ::: examples

        - no: Erik lover å ringe i morgen.

        - en: Erik promises to call tomorrow.

        - no: Erik lover at han skal ringe i morgen.

        - en: Erik promises that he will call tomorrow.

        :::


        Both sentences can refer to Erik’s future call without guaranteeing that the
        call happens. The first presents Erik as the intended performer of the promised
        action. The second presents a complete statement about what is promised. The
        **at**-clause is useful when the subject or the whole claim needs to be explicit.


        Consider another contrast:


        ::: examples

        - no: Vi håper å få svar snart.

        - en: We hope to receive an answer soon.

        - no: Vi håper at de svarer snart.

        - en: We hope that they reply soon.

        :::


        The first sentence focuses on what vi hope to experience: receiving an answer.
        The second states what de are hoped to do: reply.


        Use the å-infinitive when the first verb naturally takes an infinitive and
        its subject is understood as the performer of the second action. Use an at-clause
        when the complement is a complete statement with its own subject and finite
        verb.


        This is a strong working rule, but it must be combined with knowledge of the
        first verb. Compare:


        ::: examples

        - no: Jeg planlegger å dra tidlig.

        - en: I plan to leave early.

        - no: Jeg tror at jeg drar tidlig.

        - en: I think that I am leaving early.

        :::


        English allows both *plan to* and *think that*. Norwegian similarly requires
        the complement pattern associated with the meaning of the first verb.


        {{exercise: meaning_contrast_selection}}


        {{exercise: subject_change_transformation}}


        '
    outcome: approved
