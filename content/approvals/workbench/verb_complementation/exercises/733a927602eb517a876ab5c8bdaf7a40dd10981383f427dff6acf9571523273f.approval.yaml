    checked_against:
      common-mistakes: d2c119ab3a4e7cf1436daf9e74f5bfb60e7941d7536dcf2a693dbe5b88e78c10
    section_sources:
      common-mistakes: '## Common mistakes {#common-mistakes role=contrast objectives=obj-verb-complementation-01}


        **Adding å after a modal**


        Incorrect: *Jeg må å jobbe.*


        Correct:


        ::: examples

        - no: Jeg må jobbe.

        - en: I have to work.

        :::


        Modal verbs take a bare infinitive.


        **Using a present-tense form after å**


        Incorrect: *Vi prøver å kommer tidlig.*


        Correct:


        ::: examples

        - no: Vi prøver å komme tidlig.

        - en: We are trying to come early.

        :::


        The verb after å stays in the infinitive.


        **Omitting the subject from an at-clause**


        Incorrect: *Mina sier at kommer på fredag.*


        Correct:


        ::: examples

        - no: Mina sier at hun kommer på fredag.

        - en: Mina says that she is coming on Friday.

        :::


        An at-clause normally needs its own subject.


        **Neutral everyday complements after tro**


        Marked or formal Bokmål can use **tro + å-infinitive**, but the neutral everyday
        pattern practised here is a finite content clause:


        ::: examples

        - no: Jeg tror at jeg rekker bussen.

        - en: I think that I will catch the bus.

        - no: Jeg tror jeg rekker bussen.

        - en: I think that I will catch the bus.

        :::


        The second version omits **at** but keeps the subject **jeg** and finite verb
        **rekker**. This subsection is a register and structure contrast, not a categorical
        claim that every **tro + å-infinitive** is ungrammatical.


        {{exercise: targeted_error_repair}}


        '
