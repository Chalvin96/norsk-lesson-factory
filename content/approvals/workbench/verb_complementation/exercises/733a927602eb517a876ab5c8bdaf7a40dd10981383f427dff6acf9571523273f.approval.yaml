  scene_relationship_check:
    exercise_key: scene_relationship_check
    checked_against:
      weekend-deadline: 6cc49d8124dac841b01100ae21123000a567cdd89908190a16aeaab8a01ba475
    section_sources:
      weekend-deadline: '## A weekend that depends on a deadline {#weekend-deadline
        role=orient objectives=obj-verb-complementation-01}


        Mina and Erik are planning a weekend at a cabin. Mina is ready to leave, but
        Erik may have to finish some work first.


        ::: {.reading translation="Have you decided to come along to the cabin?" dialogue_id="cabin"
        speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Har du bestemt deg for å bli med på hytta?

        :::


        ::: {.reading translation="I hope to come along, but the boss says that we
        have to submit the report on Friday." dialogue_id="cabin" speaker_id="erik"
        speaker_name="Erik" character_id="erik"}

        Jeg håper å bli med, men sjefen sier at vi må levere rapporten på fredag.

        :::


        ::: {.reading translation="Can you work on the report tonight?" dialogue_id="cabin"
        speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Kan du jobbe med rapporten i kveld?

        :::


        ::: {.reading translation="Yes, I think that I can finish before Thursday."
        dialogue_id="cabin" speaker_id="erik" speaker_name="Erik" character_id="erik"}

        Ja, jeg tror at jeg kan bli ferdig før torsdag.

        :::


        ::: {.reading translation="Then you should start packing too." dialogue_id="cabin"
        speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Da bør du begynne å pakke også.

        :::


        ::: {.reading translation="I promise that I will let you know tomorrow." dialogue_id="cabin"
        speaker_id="erik" speaker_name="Erik" character_id="erik"}

        Jeg lover at jeg skal gi deg beskjed i morgen.

        :::


        The conversation contains three common ways of placing one verb or idea after
        another:


        - å followed by an infinitive: å bli, å pakke

        - at followed by a clause with a subject and a finite verb: at vi må levere

        - a bare infinitive after a modal verb: kan jobbe, bør begynne


        The choice is not simply a choice between two small words. It tells the listener
        how the second action or idea is connected to the first verb.


        {{exercise: scene_relationship_check}}


        '
