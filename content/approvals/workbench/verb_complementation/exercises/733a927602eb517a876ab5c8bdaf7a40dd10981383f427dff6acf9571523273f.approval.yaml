  written_structure_check:
    exercise_key: written_structure_check
    checked_against:
      written-forms: 278b48132298e2ee50f444a61872c1239ea502db36d71d76a4183c98b53595c0
    section_sources:
      written-forms: '## Different written forms for different structures {#written-forms
        role=contrast objectives=obj-verb-complementation-01}


        The written choice among å, at and no marker depends on grammatical structure.


        ::: examples

        - no: Jeg prøver å forstå.

        - en: I am trying to understand.

        :::


        After prøver, the second action is an infinitive performed by the same person,
        so write å forstå.


        ::: examples

        - no: Jeg tror at du forstår.

        - en: I think that you understand.

        :::


        After **tror**, what follows is a complete statement with the subject **du**
        and the finite verb **forstår**. This lesson practises the full overt form
        with **at**; natural Bokmål also permits **Jeg tror du forstår**.


        Choose the written form by examining the structure to the right:


        - If you need an infinitive, consider å.

        - If you have a subject followed by a finite verb, consider the full form
        with **at**. After relevant reporting and thinking verbs, an omitted **at**
        may still introduce the same finite content clause.

        - If the verb immediately before the infinitive is a modal, use no marker.


        Compare all three:


        ::: examples

        - no: Mina håper å komme.

        - en: Mina hopes to come.

        - no: Erik tror at Mina kommer.

        - en: Erik thinks that Mina is coming.

        - no: Mina kan komme.

        - en: Mina can come.

        :::


        {{exercise: written_structure_check}}


        '
