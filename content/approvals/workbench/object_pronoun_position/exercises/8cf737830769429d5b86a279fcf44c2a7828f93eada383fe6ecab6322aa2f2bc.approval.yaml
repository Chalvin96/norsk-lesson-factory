  move_before_ikke:
    exercise_key: move_before_ikke
    checked_against:
      object-pronouns-with-ikke-and-one-verb: 99970b0a1fa13b031228c1b5d106cf9ef6b3f44bbce25eb321bec73cfd36ceaf
    section_sources:
      object-pronouns-with-ikke-and-one-verb: '## Object pronouns with ikke and one
        verb {#object-pronouns-with-ikke-and-one-verb role=contrast objectives=obj-object-pronoun-position-01}


        The important contrast appears when a simple sentence contains ikke.


        With a full noun object, Norwegian commonly places ikke before the object:


        ::: examples

        - no: Jeg finner ikke Sara.

        - en: *I can’t find Sara.*

        - no: Jonas har ikke nøkkelen.

        - en: *Jonas doesn’t have the key.*

        :::


        With a short, unstressed object pronoun and only one verb, the pronoun normally
        comes before ikke:


        ::: examples

        - no: Jeg finner henne ikke.

        - en: *I can’t find her.*

        - no: Jonas har den ikke.

        - en: *Jonas doesn’t have it.*

        :::


        Compare the pairs directly:


        ::: examples

        - no: Maja kjenner ikke Jonas.

        - en: *Maja doesn’t know Jonas.*

        - no: Maja kjenner ham ikke.

        - en: *Maja doesn’t know him.*

        - no: Vi bruker ikke møterommet.

        - en: *We aren’t using the meeting room.*

        - no: Vi bruker det ikke.

        - en: *We aren’t using it.*

        - no: Sara hører ikke Maja.

        - en: *Sara can’t hear Maja.*

        - no: Sara hører henne ikke.

        - en: *Sara can’t hear her.*

        :::


        The compact rule for a neutral sentence with one verb is:


        **full noun: verb + ikke + noun**


        **object pronoun: verb + pronoun + ikke**


        This movement is sometimes called object shift, but the practical choice matters
        more than the label: if a short object pronoun replaces a known noun, put
        it before ikke in this one-verb pattern.


        A common mistake is to assume that ikke always comes immediately after the
        verb.


        ::: examples

        - no: Hun ser ikke meg.

        - en: *She doesn’t see me.*

        :::


        This order can occur when meg is strongly contrasted or emphasized, as in
        not me, but someone else. For an ordinary neutral statement, use:


        ::: examples

        - no: Hun ser meg ikke.

        - en: *She doesn’t see me.*

        :::


        At this level, use the neutral pattern unless the context clearly demands
        strong contrast.


        {{exercise: move_before_ikke}}


        {{exercise: contrast_noun_and_pronoun}}


        '
