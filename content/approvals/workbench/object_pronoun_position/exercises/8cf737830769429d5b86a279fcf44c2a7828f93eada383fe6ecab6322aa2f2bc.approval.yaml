  replace_and_place_affirmative:
    exercise_key: replace_and_place_affirmative
    checked_against:
      position-in-an-affirmative-sentence: fe8b5a625d66955db735e4670bc13fb8ea498692eef5d72286ebeffcd4118be8
    section_sources:
      position-in-an-affirmative-sentence: '## Position in an affirmative sentence
        {#position-in-an-affirmative-sentence role=model objectives=obj-object-pronoun-position-01}


        In a simple affirmative main clause with one verb, the object pronoun normally
        comes after the verb.


        ::: examples

        - no: Maja ringer henne.

        - en: *Maja is calling her.*

        - no: Jonas hjelper meg.

        - en: *Jonas is helping me.*

        - no: Vi trenger det.

        - en: *We need it.*

        :::


        A compact pattern is:


        **subject + verb + object pronoun**


        The pronoun stays connected to the verb even when another element begins the
        sentence. Norwegian main-clause word order places the verb early, but the
        object pronoun still follows the subject when the subject comes after that
        verb.


        ::: examples

        - no: I dag ringer Maja henne.

        - en: *Today Maja is calling her.*

        - no: Etter møtet hjelper Jonas oss.

        - en: *After the meeting Jonas will help us.*

        - no: Nå trenger vi den.

        - en: *Now we need it.*

        :::


        Do not place the pronoun before the verb by copying English questions or other
        familiar patterns.


        ::: examples

        - no: ✗ Maja henne ringer.

        - en: *Maja her calls.*

        :::


        This is not normal Norwegian word order. Use:


        ::: examples

        - no: Maja ringer henne.

        - en: *Maja is calling her.*

        :::


        {{exercise: replace_and_place_affirmative}}


        '
    outcome: approved
