exercise_alignments:
  choose_the_known_object:
    exercise_key: choose_the_known_object
    checked_against:
      what-does-the-pronoun-replace: d5fc62fe281405bdc017a9137d96b3b414882e3e8ccc5aa540a80bf38c25a9a9
    section_sources:
      what-does-the-pronoun-replace: '## What does the pronoun replace? {#what-does-the-pronoun-replace
        role=model objectives=obj-object-pronoun-position-01}


        An object pronoun replaces a person, animal or thing already understood from
        the context.


        ::: examples

        - no: Jeg ringer Sara.

        - en: *I’m calling Sara.*

        - no: Jeg ringer henne.

        - en: *I’m calling her.*

        :::


        The second sentence uses henne because Sara is the object of ringer: she receives
        the call.


        The common object forms are:


        - meg for me

        - deg for you, singular

        - ham for him

        - henne for her

        - den for it when replacing a masculine or feminine noun

        - det for it when replacing a neuter noun

        - oss for us

        - dere for you, plural

        - dem for them


        In Bokmål, han is also accepted as an object form in many contexts. This chapter
        uses ham because its form clearly distinguishes it from subject han.


        Compare who performs the action and who receives it:


        ::: examples

        - no: Hun ringer meg.

        - en: *She is calling me.*

        - no: Jeg ringer henne.

        - en: *I am calling her.*

        :::


        In the first sentence, hun performs the action and meg receives it. In the
        second, jeg performs the action and henne receives it.


        For things, the grammatical gender and number of the known noun guide the
        choice:


        ::: examples

        - no: Har du nøkkelen? – Ja, jeg har den.

        - en: *Do you have the key? – Yes, I have it.*

        :::


        Nøkkelen is masculine, so den replaces it.


        ::: examples

        - no: Har du kortet? – Ja, jeg har det.

        - en: *Do you have the card? – Yes, I have it.*

        :::


        Kortet is neuter, so det replaces it.


        ::: examples

        - no: Har du koppene? – Ja, jeg har dem.

        - en: *Do you have the cups? – Yes, I have them.*

        :::


        Koppene is plural, so dem replaces it.


        {{exercise: choose_the_known_object}}


        '
    outcome: approved
