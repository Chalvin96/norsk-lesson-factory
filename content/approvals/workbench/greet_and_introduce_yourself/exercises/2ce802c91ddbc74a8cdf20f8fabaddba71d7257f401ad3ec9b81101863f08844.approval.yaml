    section_sources:
      a-first-meeting: '## A first meeting {#a-first-meeting role=orient objectives=obj-greet-and-introduce-yourself-01}


        It is Monday morning at a small language school in Bergen. Two new students
        arrive early and wait outside their classroom.


        ::: {.reading translation="Hi! My name is Mina. What’s your name?" dialogue_id="first-meeting"
        speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Hei! Jeg heter Mina. Hva heter du?

        :::


        ::: {.reading translation="Hi, Mina. My name is Jonas." dialogue_id="first-meeting"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Hei, Mina. Jeg heter Jonas.

        :::


        ::: {.reading translation="Nice to meet you." dialogue_id="first-meeting"
        speaker_id="mina" speaker_name="Mina" character_id="mina"}

        Hyggelig å møte deg.

        :::


        ::: {.reading translation="Nice to meet you too." dialogue_id="first-meeting"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Hyggelig å møte deg også.

        :::


        The classroom door opens.


        ::: {.reading translation="See you!" dialogue_id="first-meeting" speaker_id="mina"
        speaker_name="Mina" character_id="mina"}

        Vi ses!

        :::


        ::: {.reading translation="Yes, see you. Bye!" dialogue_id="first-meeting"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Ja, vi ses. Ha det!

        :::


        Mina and Jonas complete a simple first-meeting exchange. Each part has a clear
        job: they greet each other, give one identity fact—their name—ask for the
        same information, and close the conversation.


        {{exercise: notice_name_question}}


        '
