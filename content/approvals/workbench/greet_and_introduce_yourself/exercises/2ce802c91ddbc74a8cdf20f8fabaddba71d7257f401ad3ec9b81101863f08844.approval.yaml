    section_sources:
      building-the-complete-first-meeting: '## Building the complete first meeting
        {#building-the-complete-first-meeting role=model objectives=obj-greet-and-introduce-yourself-01}


        Now put all four jobs together.


        ::: {.reading translation="Hi! My name is Nora. What’s your name?" dialogue_id="complete-first-meeting"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Hei! Jeg heter Nora. Hva heter du?

        :::


        ::: {.reading translation="Hi! My name is Isak." dialogue_id="complete-first-meeting"
        speaker_id="isak" speaker_name="Isak"}

        Hei! Jeg heter Isak.

        :::


        ::: {.reading translation="Nice to meet you." dialogue_id="complete-first-meeting"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Hyggelig å møte deg.

        :::


        ::: {.reading translation="Nice to meet you too." dialogue_id="complete-first-meeting"
        speaker_id="isak" speaker_name="Isak"}

        Hyggelig å møte deg også.

        :::


        ::: {.reading translation="See you!" dialogue_id="complete-first-meeting"
        speaker_id="nora" speaker_name="Nora" character_id="nora"}

        Vi ses!

        :::


        ::: {.reading translation="Bye!" dialogue_id="complete-first-meeting" speaker_id="isak"
        speaker_name="Isak"}

        Ha det!

        :::


        The exchange is complete because both speakers know the other person’s name
        and the conversation has a clear closing.


        The same pattern works in a different first-meeting situation. Two people
        arrive for their first shift at a café.


        ::: {.reading translation="Hi! My name is Selma. What’s your name?" dialogue_id="cafe-first-meeting"
        speaker_id="selma" speaker_name="Selma" character_id="selma"}

        Hei! Jeg heter Selma. Hva heter du?

        :::


        ::: {.reading translation="My name is Noah. Nice to meet you." dialogue_id="cafe-first-meeting"
        speaker_id="noah" speaker_name="Noah"}

        Jeg heter Noah. Hyggelig å møte deg.

        :::


        ::: {.reading translation="Nice to meet you too." dialogue_id="cafe-first-meeting"
        speaker_id="selma" speaker_name="Selma" character_id="selma"}

        Hyggelig å møte deg også.

        :::


        Their manager calls them into the kitchen.


        ::: {.reading translation="See you!" dialogue_id="cafe-first-meeting" speaker_id="noah"
        speaker_name="Noah"}

        Vi ses!

        :::


        ::: {.reading translation="Yes, bye!" dialogue_id="cafe-first-meeting" speaker_id="selma"
        speaker_name="Selma" character_id="selma"}

        Ja, ha det!

        :::


        The setting changes, but the communicative work stays the same: greeting,
        name, matching question, and closing.


        {{exercise: complete_the_exchange}}


        '
