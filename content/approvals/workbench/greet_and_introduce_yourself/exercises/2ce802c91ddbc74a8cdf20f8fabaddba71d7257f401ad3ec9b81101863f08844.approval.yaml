    section_sources:
      marking-the-meeting-as-friendly: '## Marking the meeting as friendly {#marking-the-meeting-as-friendly
        role=model objectives=obj-greet-and-introduce-yourself-01}


        After names have been exchanged, a common expression is:


        ::: examples

        - no: Hyggelig å møte deg.

        - en: Nice to meet you.

        :::


        You can respond with the same expression:


        ::: examples

        - no: Hyggelig å møte deg.

        - en: Nice to meet you.

        :::


        You can also add **også**, meaning “too” or “also”:


        ::: examples

        - no: Hyggelig å møte deg også.

        - en: Nice to meet you too.

        :::


        Compare:


        ::: examples

        - no: Hyggelig å møte deg.

        - en: Nice to meet you.

        - no: Hyggelig å møte deg også.

        - en: Nice to meet you too.

        :::


        The second version explicitly returns the friendly comment.


        Do not translate English word for word. Use the complete Norwegian expression:


        ::: examples

        - no: Hyggelig å møte deg.

        - en: Nice to meet you.

        :::


        A learner may be tempted to build a sentence around English “nice,” but **Hyggelig
        å møte deg** is the natural phrase to remember.


        '
