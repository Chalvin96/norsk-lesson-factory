    section_sources:
      the-shape-of-the-exchange: '## The shape of the exchange {#the-shape-of-the-exchange
        role=model objectives=obj-greet-and-introduce-yourself-01}


        A first meeting can be short and still feel complete:


        ::: examples

        - no: Hei!

        - en: Hi!

        - no: Jeg heter Mina.

        - en: My name is Mina.

        - no: Hva heter du?

        - en: What’s your name?

        - no: Jeg heter Jonas.

        - en: My name is Jonas.

        - no: Hyggelig å møte deg.

        - en: Nice to meet you.

        - no: Ha det!

        - en: Bye!

        :::


        You do not need a long introduction. At this stage, the important skill is
        keeping the exchange moving from opening to closing.


        **First checkpoint: Notice what *jeg heter* means**


        Read one line from the conversation: Mina says «Jeg heter Mina.» Check what
        this line means in the exchange.


        {{exercise: match_line_to_job}}


        '
