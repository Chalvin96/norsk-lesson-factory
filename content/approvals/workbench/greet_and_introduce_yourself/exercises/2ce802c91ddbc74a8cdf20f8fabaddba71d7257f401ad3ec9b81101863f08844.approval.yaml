    checked_against:
      saying-your-name-with-jeg-heter: 4e1fcc199af49234fbd38d7191fc0712877c2823be655a20b9737ece66057ee5
    section_sources:
      saying-your-name-with-jeg-heter: '## Saying your name with *jeg heter* {#saying-your-name-with-jeg-heter
        role=model objectives=obj-greet-and-introduce-yourself-01}


        To state your name, use:


        ::: examples

        - no: Jeg heter + name.

        - en: My name is + name.

        :::


        Literally, **jeg heter** is closer to “I am called,” but the natural English
        translation is “My name is.”


        ::: examples

        - no: Jeg heter Sara.

        - en: My name is Sara.

        - no: Jeg heter Daniel.

        - en: My name is Daniel.

        - no: Hei! Jeg heter Lin.

        - en: Hi! My name is Lin.

        :::


        Keep **jeg heter** together as the useful expression. You do not need to analyze
        or change it to introduce yourself.


        Compare:


        ::: examples

        - no: Jeg heter Eva.

        - en: My name is Eva.

        - no: Hun heter Eva.

        - en: Her name is Eva.

        :::


        For this first-meeting exchange, the form you need for yourself is **jeg heter**.


        Norwegian normally does not use an equivalent of English “name” in this sentence.


        ::: examples

        - no: Jeg heter Emil.

        - en: My name is Emil.

        :::


        Not:


        ::: examples

        - no: ✗ Jeg navn Emil.

        - en: Incorrect: This does not form a natural Norwegian sentence.

        :::


        Another common mistake is to omit **jeg**:


        ::: examples

        - no: Jeg heter Amina.

        - en: My name is Amina.

        :::


        Not:


        ::: examples

        - no: ✗ Heter Amina.

        - en: Incorrect: This does not form a natural Norwegian sentence.

        :::


        Norwegian normally states the subject **jeg** here.


        '
