    section_sources:
      closing-the-exchange: '## Closing the exchange {#closing-the-exchange role=model
        objectives=obj-greet-and-introduce-yourself-01}


        A first meeting needs an ending. Two useful closing expressions are:


        ::: examples

        - no: Ha det!

        - en: Bye!

        - no: Vi ses!

        - en: See you!

        :::


        **Ha det** is a common general goodbye. **Vi ses** is natural when you expect
        to see the person again.


        At the language school, Mina and Jonas are about to enter the same classroom,
        so **Vi ses** fits well.


        ::: {.reading translation="See you!" dialogue_id="school-closing" speaker_id="mina"
        speaker_name="Mina" character_id="mina"}

        Vi ses!

        :::


        ::: {.reading translation="Yes, see you. Bye!" dialogue_id="school-closing"
        speaker_id="jonas" speaker_name="Jonas" character_id="jonas"}

        Ja, vi ses. Ha det!

        :::


        You can use either closing by itself:


        ::: examples

        - no: Ha det!

        - en: Bye!

        - no: Vi ses!

        - en: See you!

        :::


        You can also use both:


        ::: examples

        - no: Vi ses. Ha det!

        - en: See you. Bye!

        :::


        The closing should come after the introduction has reached a natural stopping
        point.


        Compare:


        ::: examples

        - no: Hei! Jeg heter Kim. Hva heter du?

        - en: Hi! My name is Kim. What’s your name?

        :::


        This opens the exchange.


        ::: examples

        - no: Hyggelig å møte deg. Ha det!

        - en: Nice to meet you. Bye!

        :::


        This prepares to close it.


        '
