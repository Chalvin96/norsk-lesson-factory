    section_sources:
      responding-to-the-name-question: '## Responding to the name question {#responding-to-the-name-question
        role=model objectives=obj-greet-and-introduce-yourself-01}


        The answer uses the same form you used for your own introduction:


        ::: examples

        - no: Hva heter du?

        - en: What’s your name?

        - no: Jeg heter Sigrid.

        - en: My name is Sigrid.

        :::


        The speakers can also acknowledge each other’s names:


        ::: examples

        - no: Hei, Sigrid.

        - en: Hi, Sigrid.

        - no: Hyggelig å møte deg, Sigrid.

        - en: Nice to meet you, Sigrid.

        :::


        Using the person’s name is optional, but it can make the response feel attentive
        and friendly.


        Here is another complete opening:


        ::: {.reading translation="Hi! My name is Theo. What’s your name?" dialogue_id="complete-opening"
        speaker_id="theo" speaker_name="Theo"}

        Hei! Jeg heter Theo. Hva heter du?

        :::


        ::: {.reading translation="My name is Iben." dialogue_id="complete-opening"
        speaker_id="iben" speaker_name="Iben"}

        Jeg heter Iben.

        :::


        ::: {.reading translation="Hi, Iben. Nice to meet you." dialogue_id="complete-opening"
        speaker_id="theo" speaker_name="Theo"}

        Hei, Iben. Hyggelig å møte deg.

        :::


        The response **Jeg heter Iben** gives exactly the information requested. It
        does not need to become a longer personal profile.


        {{exercise: choose_next_line}}


        '
