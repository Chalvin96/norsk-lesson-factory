    section_sources:
      guided-exchange-practice: '## Guided exchange practice {#guided-exchange-practice
        role=recap objectives=obj-greet-and-introduce-yourself-01}


        Return to Mina and Jonas outside the classroom. Retell their meeting in your
        own words while keeping the same four communicative jobs. Use different names,
        but do not add extra identity information.


        Your exchange should include a greeting, one speaker’s name, a question for
        the other person’s name, the answer, and a friendly closing.


        {{exercise: first_day_exchange}}


        Next, imagine that you meet someone at a community event. Begin as the first
        speaker and produce a short complete exchange for both people.


        Your response should sound like one connected conversation, not isolated phrases,
        with both speakers responding appropriately to what the other has said.


        Finally, imagine that you are the second speaker. Someone says:


        ::: examples

        - no: Hei! Jeg heter Aleksander. Hva heter du?

        - en: Hi! My name is Aleksander. What’s your name?

        :::


        Continue and finish the meeting. Give your name, return a friendly meeting
        expression, and close.


        Your response should answer Aleksander’s question and bring the conversation
        to a natural end.


        '
