  answer_aleksander:
    exercise_key: answer_aleksander
    checked_against:
      asking-the-other-persons-name: 3f302b02157da3af23aec7ceaff31daf26d0ab02857055e5e9b4488dc5a117d2
    section_sources:
      asking-the-other-persons-name: '## Asking the other person’s name {#asking-the-other-persons-name
        role=model objectives=obj-greet-and-introduce-yourself-01}


        After giving your name, invite the other person to do the same:


        ::: examples

        - no: Hva heter du?

        - en: What’s your name?

        :::


        The question begins with **hva**, meaning “what.” For now, learn the complete
        question as one useful expression.


        ::: examples

        - no: Jeg heter Oskar. Hva heter du?

        - en: My name is Oskar. What’s your name?

        - no: Hei! Jeg heter Fatima. Hva heter du?

        - en: Hi! My name is Fatima. What’s your name?

        :::


        Notice the contrast:


        ::: examples

        - no: Jeg heter Mina.

        - en: My name is Mina.

        - no: Hva heter du?

        - en: What’s your name?

        :::


        In the statement, **jeg** means “I.” In the question, **du** means “you.”


        A frequent error is to copy English word order too directly:


        ::: examples

        - no: Hva heter du?

        - en: What’s your name?

        :::


        Not:


        ::: examples

        - no: ✗ Hva du heter?

        - en: Incorrect: This is not the correct first-meeting question.

        :::


        The correct first-meeting question is **Hva heter du?**


        Another possible mistake is asking the question but never giving your own
        name. Compare these openings:


        ::: examples

        - no: Hei! Hva heter du?

        - en: Hi! What’s your name?

        - no: Hei! Jeg heter Ada. Hva heter du?

        - en: Hi! My name is Ada. What’s your name?

        :::


        Both can be understood, but the second feels more balanced in a first meeting
        because you offer the same information that you request.


        {{exercise: answer_aleksander}}


        '
