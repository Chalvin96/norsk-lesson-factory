    section_sources:
      greeting-with-hei: '## Greeting with *hei* {#greeting-with-hei role=model objectives=obj-greet-and-introduce-yourself-01}


        The most useful general greeting is:


        ::: examples

        - no: Hei!

        - en: Hi! / Hello!

        :::


        It works in many everyday situations. You can use it when meeting someone
        for the first time, entering a small shop, or greeting someone you already
        know.


        ::: examples

        - no: Hei! Jeg heter Nora.

        - en: Hi! My name is Nora.

        - no: Hei, Nora.

        - en: Hi, Nora.

        :::


        Norwegian often uses a person’s name directly after the greeting:


        ::: examples

        - no: Hei, Amir!

        - en: Hi, Amir!

        :::


        The greeting can stand alone, but in a first meeting it naturally leads into
        your identity fact:


        ::: examples

        - no: Hei! Jeg heter Lea.

        - en: Hi! My name is Lea.

        :::


        {{exercise: begin_the_meeting}}


        '
