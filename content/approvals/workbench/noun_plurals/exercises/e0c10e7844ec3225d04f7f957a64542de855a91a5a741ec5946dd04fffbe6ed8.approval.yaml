    key: form_plurals_in_picnic_inventory
    criterion: naturalness
    excerpt: Til pikniken pakker vi flere servietter. De samme serviettene ligger
      i kurven. Vi tar med flere flasker. De samme flaskene står ved maten. Vi pakker
      fire pledd. De samme pleddene er rene. Flere fedre blir med på pikniken. De
      samme fedrene setter seg ved bordet.
    explanation: Repeated “De samme” is unnecessarily emphatic for simple reference
      back to newly mentioned objects or people. It suggests a contrast involving
      identity that this inventory does not supply. Ordinary definite plurals provide
      natural reference without that emphasis.
