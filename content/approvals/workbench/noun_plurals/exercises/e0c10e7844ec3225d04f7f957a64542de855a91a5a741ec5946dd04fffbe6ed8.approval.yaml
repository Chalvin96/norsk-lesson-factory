    decision_id: null
  form_regular_indefinite_plurals:
    exercise_key: form_regular_indefinite_plurals
    checked_against:
      nouns-ending-in-an-unstressed-e: ccc56200fcb9119d84f2977e0b2dd68977f6534bda7def80bddefdb589459d4d
    section_sources:
      nouns-ending-in-an-unstressed-e: '## Nouns ending in an unstressed **-e** {#nouns-ending-in-an-unstressed-e
        role=model objectives=obj-noun-plurals-01}


        Many singular nouns already end in an unstressed **-e**. Their common plural
        forms look slightly different:


        - add **-r** for the indefinite plural

        - add **-ne** for the definite plural


        Compare singular, indefinite plural, and definite plural:


        ::: examples

        - no: en pose

        - en: a bag

        - no: poser

        - en: bags

        - no: posene

        - en: the bags

        - no: ei/en jente

        - en: a girl

        - no: jenter

        - en: girls

        - no: jentene

        - en: the girls

        - no: en lampe

        - en: a lamp

        - no: lamper

        - en: lamps

        - no: lampene

        - en: the lamps

        :::


        The existing **-e** remains part of the word:


        ::: examples

        - no: De kjøper poser.

        - en: They are buying bags.

        - no: Posene ligger på bordet.

        - en: The bags are on the table.

        - no: Det står lamper i vinduet.

        - en: There are lamps in the window.

        - no: Lampene er nye.

        - en: The lamps are new.

        :::


        The overall contrast remains unchanged: **poser** means “bags,” while **posene**
        means “the bags.”


        {{exercise: form_regular_indefinite_plurals}}


        {{exercise: form_regular_definite_plurals}}


        '
