  repair_plural_form_errors:
    exercise_key: repair_plural_form_errors
    checked_against:
      common-mistakes-to-avoid: 95991c9c8f49f2646e4a1e595a6bbc018535f1d9c57f68f7a495d4d83816eb73
    section_sources:
      common-mistakes-to-avoid: '## Common mistakes to avoid {#common-mistakes-to-avoid
        role=contrast objectives=obj-noun-plurals-01}


        **Keeping the singular article before a plural**


        Incorrect pattern:


        ::: examples

        - no: ✗ en stoler

        - en: Incorrect: do not keep the singular article before a plural noun.

        :::


        Use the plural noun without **en**:


        ::: examples

        - no: stoler

        - en: chairs

        - no: to stoler

        - en: two chairs

        :::


        **Adding -er to every noun**


        Short neuter nouns often remain unchanged:


        ::: examples

        - no: tre bord

        - en: three tables

        - no: ✗ tre border

        - en: Incorrect: do not add **-er** to this short neuter noun.

        - no: fem glass

        - en: five glasses

        - no: ✗ fem glasser

        - en: Incorrect: do not add **-er** to this short neuter noun.

        :::


        **Building the definite plural from the whole indefinite form**


        The correct pair is:


        ::: examples

        - no: stoler — stolene

        - en: chairs — the chairs

        - no: kopper — koppene

        - en: cups — the cups

        :::


        Not:


        ::: examples

        - no: ✗ stoler — stolerene

        - en: Incorrect: do not add the definite ending to the whole indefinite plural.

        :::


        **Confusing a known group with an unspecified quantity**


        ::: examples

        - no: Vi trenger kopper.

        - en: We need cups.

        - no: Koppene er på kjøkkenet.

        - en: The cups are in the kitchen.

        :::


        The first does not identify particular cups. The second refers to identifiable
        cups.


        {{exercise: repair_plural_form_errors}}


        '
