  track_plural_reference_in_context:
    exercise_key: track_plural_reference_in_context
    checked_against:
      following-a-noun-through-a-conversation: cb44379b0a3ac7855abbbb5d879aaf9770d982fc4b970c96c7ee394178f0afda
    section_sources:
      following-a-noun-through-a-conversation: '## Following a noun through a conversation
        {#following-a-noun-through-a-conversation role=contrast objectives=obj-noun-plurals-01}


        A natural conversation often introduces a group with an indefinite plural
        and then refers back to it with a definite plural:


        ::: examples

        - no: Nora kjøper epler. Eplene ligger i en pose.

        - en: Nora buys apples. The apples are in a bag.

        :::


        The first sentence introduces some apples. The second sentence refers to those
        same apples.


        ::: examples

        - no: Amir finner tre kopper. Koppene står på kjøkkenet.

        - en: Amir finds three cups. The cups are in the kitchen.

        - no: Det står to bord i gangen. Bordene er tunge.

        - en: There are two tables in the hall. The tables are heavy.

        :::


        This movement from indefinite to definite explains the forms in the opening
        dialogue:


        ::: examples

        - no: Det står fire stoler i gangen.

        - en: There are four chairs in the hall.

        - no: Kan du sette stolene ved bordene?

        - en: Can you put the chairs by the tables?

        :::


        Once the chairs have been introduced, **stolene** identifies that known group.
        **Bordene** also refers to particular tables that Nora and Amir can identify
        in the room.


        Do not choose the definite plural merely because a noun appears for the second
        time mechanically. Choose it because the speakers can identify the intended
        group from earlier words or from the shared situation.


        {{exercise: track_plural_reference_in_context}}


        '
