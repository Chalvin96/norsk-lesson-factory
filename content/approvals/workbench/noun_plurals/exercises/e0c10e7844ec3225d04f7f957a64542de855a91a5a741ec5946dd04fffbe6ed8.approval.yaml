  recognize_common_irregular_plurals:
    exercise_key: recognize_common_irregular_plurals
    checked_against:
      some-common-nouns-change-inside-the-word: 9639c702884d985398ab4d4f22fb4a06d6ba760f8f5f78452cb98b6209c40714
    section_sources:
      some-common-nouns-change-inside-the-word: '## Some common nouns change inside
        the word {#some-common-nouns-change-inside-the-word role=model objectives=obj-noun-plurals-01}


        Not every frequent noun follows the regular patterns. Some change a vowel
        or have another irregular plural form. These forms need to be learned with
        the noun.


        Compare singular, indefinite plural, and definite plural:


        ::: examples

        - no: ei/en bok

        - en: a book

        - no: bøker

        - en: books

        - no: bøkene

        - en: the books

        - no: en mann

        - en: a man

        - no: menn

        - en: men

        - no: mennene

        - en: the men

        - no: en fot

        - en: a foot

        - no: føtter

        - en: feet

        - no: føttene

        - en: the feet

        :::


        Use the complete plural form rather than adding a regular ending to the singular:


        ::: examples

        - no: Det ligger bøker på bordet.

        - en: There are books on the table.

        - no: Bøkene tilhører Nora.

        - en: The books belong to Nora.

        - no: To menn bærer et bord.

        - en: Two men are carrying a table.

        - no: Mennene setter bordet ved døra.

        - en: The men put the table by the door.

        :::


        These examples still follow the same meaning contrast. **Bøker** is indefinite;
        **bøkene** is definite. The unusual part is the noun’s shape, not the communicative
        choice.


        {{exercise: recognize_common_irregular_plurals}}


        '
