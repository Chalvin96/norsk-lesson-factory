exercise_alignments:
  notice_indefinite_and_definite_groups:
    exercise_key: notice_indefinite_and_definite_groups
    checked_against:
      the-most-common-pattern-er-and-ene: 2af66d8836d86ec34e8f7566da16c5b7d516ef248331b061a346ac9d2fecc620
    section_sources:
      the-most-common-pattern-er-and-ene: '## The most common pattern: **-er** and
        **-ene** {#the-most-common-pattern-er-and-ene role=contrast objectives=obj-noun-plurals-01}


        Many common nouns form the indefinite plural with **-er** and the definite
        plural with **-ene**.


        Compare singular, indefinite plural, and definite plural:


        ::: examples

        - no: en stol

        - en: a chair

        - no: stoler

        - en: chairs

        - no: stolene

        - en: the chairs

        - no: en kopp

        - en: a cup

        - no: kopper

        - en: cups

        - no: koppene

        - en: the cups

        - no: en bil

        - en: a car

        - no: biler

        - en: cars

        - no: bilene

        - en: the cars

        - no: et eple

        - en: an apple

        - no: epler

        - en: apples

        - no: eplene

        - en: the apples

        :::


        Notice that the definite form is not normally made by adding **-ene** to the
        complete indefinite form. It is better to learn the two endings as parallel
        forms:


        ::: examples

        - no: stol + er → stoler

        - en: noun stem plus -er gives chairs

        - no: stol + ene → stolene

        - en: noun stem plus -ene gives the chairs

        :::


        This prevents forms such as:


        ::: examples

        - no: ✗ stolerene

        - en: Incorrect: this form adds the definite ending to the complete indefinite
        plural.

        :::


        Compare the forms in sentences:


        ::: examples

        - no: Det står biler utenfor.

        - en: There are cars outside.

        - no: Bilene tilhører gjestene.

        - en: The cars belong to the guests.

        - no: Nora finner kopper på kjøkkenet.

        - en: Nora finds cups in the kitchen.

        - no: Koppene er rene.

        - en: The cups are clean.

        :::


        **Compact rule**


        ::: {.rule}

        For many nouns: indefinite plural: noun stem + **-er**; definite plural: noun
        stem + **-ene**. Use the indefinite form for an unspecified quantity. Use
        the definite form for an identifiable group.

        :::


        {{exercise: notice_indefinite_and_definite_groups}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
