  recognize_zero_ending_neuter_plurals:
    exercise_key: recognize_zero_ending_neuter_plurals
    checked_against:
      short-neuter-nouns-with-no-indefinite-plural-ending: a6a20f1b19d5f2c3173e98916d9a3b68887c273bce3e8f2a09ed30e22f265f71
    section_sources:
      short-neuter-nouns-with-no-indefinite-plural-ending: '## Short neuter nouns
        with no indefinite plural ending {#short-neuter-nouns-with-no-indefinite-plural-ending
        role=model objectives=obj-noun-plurals-01}


        Many short neuter nouns—nouns whose singular form uses **et**—have no visible
        ending in the indefinite plural.


        Compare singular, indefinite plural, and definite plural:


        ::: examples

        - no: et bord

        - en: a table

        - no: bord

        - en: tables

        - no: bordene

        - en: the tables

        - no: et glass

        - en: a glass

        - no: glass

        - en: glasses

        - no: glassene

        - en: the glasses

        - no: et hus

        - en: a house

        - no: hus

        - en: houses

        - no: husene

        - en: the houses

        - no: et barn

        - en: a child

        - no: barn

        - en: children

        - no: barna

        - en: the children

        :::


        The singular and indefinite plural forms may therefore look identical. Other
        words in the sentence reveal the number:


        ::: examples

        - no: Det står et bord i rommet.

        - en: There is one table in the room.

        - no: Det står tre bord i rommet.

        - en: There are three tables in the room.

        - no: Amir finner et glass.

        - en: Amir finds a glass.

        - no: Amir finner seks glass.

        - en: Amir finds six glasses.

        :::


        The definite plural still has a visible ending:


        ::: examples

        - no: Bordene står ved vinduet.

        - en: The tables are by the window.

        - no: Glassene er på kjøkkenet.

        - en: The glasses are in the kitchen.

        :::


        A common mistake is to assume that every plural must end in **-er**. Forms
        such as **border** for “tables” and **glasser** for “glasses” are incorrect
        in standard Bokmål. Here, use **bord** and **glass**.


        ::: examples

        - no: ✗ border

        - en: Incorrect: the common plural for “tables” here is **bord**.

        - no: ✗ glasser

        - en: Incorrect: the common plural for “glasses” here is **glass**.

        :::


        Some neuter nouns can have **-a** in the definite plural in standard Bokmål.
        **Barna** is the normal everyday form for “the children”:


        ::: examples

        - no: barna

        - en: the children

        - no: husa

        - en: the houses

        :::


        The choice between **-a** and **-ene** depends on the noun and usage. **Barnene**
        is also allowed but much less usual than **barna**. For “the houses”, both
        **husene** and **husa** are standard. Learn the common definite plural with
        each noun; use **barna** for “the children”.


        {{exercise: recognize_zero_ending_neuter_plurals}}


        {{exercise: produce_zero_ending_neuter_plurals}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:36:49.738864+00:00'
    decision_id: null
