    section_sources:
      main-meaning-choice: '## The main meaning choice {#main-meaning-choice role=contrast
        objectives=obj-progressive-aspect-01}


        Compare these two sentences:


        ::: examples

        - no: Jeg låser sykkelen.

        - en: I lock the bike. / I’m locking the bike.

        - no: Jeg holder på å låse sykkelen.

        - en: I’m in the middle of locking the bike.

        :::


        The simple present can already describe something happening now, especially
        when the context makes the time clear. The activity frame holder på å gives
        the action extra focus. Jonas is not reporting a general habit. He is explaining
        what is occupying him at that exact moment.


        The same contrast is possible in the past:


        ::: examples

        - no: Jeg lagde kaffe.

        - en: I made coffee. / I was making coffee.

        - no: Jeg holdt på å lage kaffe.

        - en: I was in the middle of making coffee.

        :::


        The simple past reports the action. The frame holdt på å highlights the action
        as ongoing around a past moment.


        {{exercise: notice_ongoing_focus}}


        '
