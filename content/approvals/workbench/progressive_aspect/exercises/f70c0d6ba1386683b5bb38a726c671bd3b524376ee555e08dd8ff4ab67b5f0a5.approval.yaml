  choose_meaningful_activity_frame:
    exercise_key: choose_meaningful_activity_frame
    checked_against:
      showing-posture-as-well-as-activity: 4ab65ea2b2eb7bdc1d8c5410debad7ddb39ae6471a25fde554504d165c18a08c
    section_sources:
      showing-posture-as-well-as-activity: '## Showing posture as well as activity
        {#showing-posture-as-well-as-activity role=model objectives=obj-progressive-aspect-01}


        Norwegian can also describe an ongoing scene with a posture verb:


        - sitte og + activity

        - stå og + activity

        - ligge og + activity


        These frames say both what position someone is in and what that person is
        doing.


        ::: examples

        - no: Sara sitter og skriver.

        - en: Sara is sitting and writing.

        - no: Amir står og lager kaffe.

        - en: Amir is standing and making coffee.

        - no: Katten ligger og sover under bordet.

        - en: The cat is lying and sleeping under the table.

        :::


        In natural English, the posture may be translated explicitly or left in the
        background:


        ::: examples

        - no: Sara sitter og gjør spørsmålene klare.

        - en: Sara is sitting and getting the questions ready. / Sara is getting the
        questions ready.

        :::


        The Norwegian sentence creates a small visual scene. Sara is seated, and getting
        the questions ready is the activity in progress.


        Use a posture frame only when the posture makes sense in the situation. If
        you do not know or care whether someone is sitting, standing, or lying down,
        holde på å is more neutral.


        Compare:


        ::: examples

        - no: Sara holder på å lese spørsmålene.

        - en: Sara is reading the questions.

        - no: Sara sitter og leser spørsmålene.

        - en: Sara is sitting and reading the questions.

        :::


        Both highlight an ongoing activity. The second also tells us how Sara is positioned.


        {{exercise: choose_meaningful_activity_frame}}


        '
