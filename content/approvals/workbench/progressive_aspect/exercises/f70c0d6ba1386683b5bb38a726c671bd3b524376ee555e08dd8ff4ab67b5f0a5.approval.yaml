    section_sources:
      back-at-quiz-night: '## Back at quiz night {#back-at-quiz-night role=model objectives=obj-progressive-aspect-01}


        Jonas enters the hall and sees the scene Ida described.


        ::: {.reading translation=''Now I’m here. What are you doing?'' dialogue_id=''back-at-quiz-night''
        speaker_id=''jonas'' speaker_name="Jonas" character_id="jonas"}

        Nå er jeg her. Hva holder dere på å gjøre?

        :::


        ::: {.reading translation=''We’re dividing into teams.'' dialogue_id=''back-at-quiz-night''
        speaker_id=''ida'' speaker_name=''Ida''}

        Vi holder på å dele oss i lag.

        :::


        ::: {.reading translation=''Where is Sara?'' dialogue_id=''back-at-quiz-night''
        speaker_id=''jonas'' speaker_name="Jonas" character_id="jonas"}

        Hvor er Sara?

        :::


        ::: {.reading translation=''She’s sitting and talking with the new participant.
        Amir is standing and counting the coffee cups.'' dialogue_id=''back-at-quiz-night''
        speaker_id=''ida'' speaker_name=''Ida''}

        Hun sitter og snakker med den nye deltakeren. Amir står og teller kaffekoppene.

        :::


        ::: {.reading translation=''I can help with the teams now. When you called
        earlier, I was standing and waiting for the bus, but now I’m ready.'' dialogue_id=''back-at-quiz-night''
        speaker_id=''jonas'' speaker_name="Jonas" character_id="jonas"}

        Jeg kan hjelpe med lagene nå. Da du ringte tidligere, sto jeg og ventet på
        bussen, men nå er jeg klar.

        :::


        ::: {.reading translation=''Good. Help with the teams while I help Amir.''
        dialogue_id=''back-at-quiz-night'' speaker_id=''ida'' speaker_name=''Ida''}

        Fint. Hjelp med lagene mens jeg hjelper Amir.

        :::


        The scene has moved forward, but the same forms remain useful. Jonas asks
        about activity in progress now. He also returns to the earlier phone call
        and describes what he was doing at that past moment.


        One detail deserves care: holdt på å works most clearly here with activities
        that can continue for some time, such as cooking, reading, preparing, or locking
        something. With certain sudden events, it can instead suggest that something
        nearly happened:


        ::: examples

        - no: Jeg holdt på å falle.

        - en: I nearly fell.

        :::


        For this chapter’s target meaning, use holde på å with clearly ongoing activities.


        {{exercise: repair_mixed_activity_frames}}


        '
