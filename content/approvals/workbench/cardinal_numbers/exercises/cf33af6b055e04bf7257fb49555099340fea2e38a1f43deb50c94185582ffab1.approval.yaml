  number-sequence-recall:
    exercise_key: number-sequence-recall
    checked_against:
      numbers-one-to-ten: ac8daf6bb0220e3a92d58a43ec3a2a0ff78bc7ca26d7f424053db520960ddf9c
    section_sources:
      numbers-one-to-ten: '## The numbers from one to ten {#numbers-one-to-ten role=model
        objectives=obj-cardinal-numbers-01}


        These are the basic cardinal numbers, the numbers used to say how many things
        there are:


        ::: examples

        - no: en / ett

        - en: one

        - no: to

        - en: two

        - no: tre

        - en: three

        - no: fire

        - en: four

        - no: fem

        - en: five

        - no: seks

        - en: six

        - no: sju

        - en: seven

        - no: åtte

        - en: eight

        - no: ni

        - en: nine

        - no: ti

        - en: ten

        :::


        Listen to the sequence several times:


        ::: examples

        - no: en, to, tre, fire, fem, seks, sju, åtte, ni, ti

        - en: one, two, three, four, five, six, seven, eight, nine, ten

        :::


        When the number stands before a noun, the noun tells you whether one is **en**
        or **ett**. From two onward, the number itself does not change:


        ::: examples

        - no: to epler

        - en: two apples

        - no: tre bananer

        - en: three bananas

        - no: fire egg

        - en: four eggs

        - no: fem poser

        - en: five bags

        - no: seks glass

        - en: six glasses

        - no: sju kopper

        - en: seven cups

        - no: åtte tomater

        - en: eight tomatoes

        - no: ni bøker

        - en: nine books

        - no: ti bord

        - en: ten tables

        :::


        The noun normally appears in its plural form after numbers from two onward.
        Some plural forms have an ending, as in **epler** and **bananer**. Others
        remain unchanged, as in **egg**, **glass**, and **bord**. For now, learn each
        useful plural with the noun. The number words themselves remain the same.


        {{exercise: number-sequence-recall}}


        '
    outcome: approved
