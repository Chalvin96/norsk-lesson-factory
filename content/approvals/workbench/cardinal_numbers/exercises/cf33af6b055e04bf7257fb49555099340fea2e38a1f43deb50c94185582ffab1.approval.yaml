  notice-en-ett-in-context:
    exercise_key: notice-en-ett-in-context
    checked_against:
      choosing-en-or-ett: 9b2a39a195261c91688469979ab058ba44ef38010eaef7622c8320c7bc28fa33
    section_sources:
      choosing-en-or-ett: '## Choosing en or ett {#choosing-en-or-ett role=contrast
        objectives=obj-cardinal-numbers-01}


        Norwegian nouns belong to grammatical groups called genders. For this lesson,
        the useful distinction is between nouns that take **en** and nouns that take
        **ett**.


        Use **en** before an **en-word**:


        ::: examples

        - no: en banan

        - en: one banana

        - no: en appelsin

        - en: one orange

        - no: en kartong

        - en: one carton

        - no: en kopp

        - en: one cup

        - no: en pose

        - en: one bag

        - no: en stol

        - en: one chair

        :::


        Use **ett** before an **ett-word**:


        ::: examples

        - no: ett eple

        - en: one apple

        - no: ett egg

        - en: one egg

        - no: ett brød

        - en: one loaf of bread

        - no: ett glass

        - en: one glass

        - no: ett bord

        - en: one table

        - no: ett brev

        - en: one letter

        :::


        A practical way to learn the choice is to learn every new noun together with
        its small identifying word:


        ::: examples

        - no: en banan

        - en: one banana

        - no: en kopp

        - en: one cup

        - no: ett eple

        - en: one apple

        - no: ett glass

        - en: one glass

        :::


        If you know that the noun is **et eple** or **et glass** when it means *an
        apple* or *a glass*, use the number **ett** when you mean exactly one:


        ::: examples

        - no: Jeg har et eple.

        - en: I have an apple.

        - no: Jeg har ett eple, ikke to.

        - en: I have one apple, not two.

        :::


        The number **ett** has two t’s. The small word **et**, meaning *a* or *an*
        before an ett-word, has one t. When you are counting and mean one, write **ett**.


        The compact rule is:


        ::: {.rule}

        Before a noun, use **en** with an en-word and **ett** with an ett-word. From
        **to** onward, the number does not depend on the noun’s gender.

        :::


        {{exercise: notice-en-ett-in-context}}


        '
    outcome: approved
    note: null
    at: '2026-10-17T21:25:18.061955+00:00'
    decision_id: null
  contrast-one-and-more:
    exercise_key: contrast-one-and-more
    checked_against:
      one-and-several: 68a87da1a10e07dd2f86c7a7cfd6b1ca768951230e27c39265e452fff5399b56
    section_sources:
      one-and-several: '## One item and several items {#one-and-several role=contrast
        objectives=obj-cardinal-numbers-01}


        Compare the same noun with different quantities:


        ::: examples

        - no: en banan — to bananer

        - en: one banana — two bananas

        - no: ett eple — to epler

        - en: one apple — two apples

        - no: en kopp — tre kopper

        - en: one cup — three cups

        - no: ett glass — tre glass

        - en: one glass — three glasses

        - no: en pose — fire poser

        - en: one bag — four bags

        - no: ett egg — fire egg

        - en: one egg — four eggs

        :::


        Only the number one makes you choose between **en** and **ett**:


        ::: examples

        - no: en kopp, men to kopper

        - en: one cup, but two cups

        - no: ett glass, men to glass

        - en: one glass, but two glasses

        - no: en banan, men fem bananer

        - en: one banana, but five bananas

        - no: ett eple, men fem epler

        - en: one apple, but five apples

        :::


        This means that you do not need separate masculine or neuter forms of **to**,
        **tre**, or the other numbers.


        Compare:


        ::: examples

        - no: Vi trenger en kopp.

        - en: We need one cup.

        - no: Vi trenger ett glass.

        - en: We need one glass.

        - no: Vi trenger to kopper og to glass.

        - en: We need two cups and two glasses.

        :::


        The first two sentences require a gender choice. The third does not: **to**
        works with both nouns.


        {{exercise: contrast-one-and-more}}


        '
    outcome: approved
