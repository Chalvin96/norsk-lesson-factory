    checked_against:
      new-situation: 5800664ee4a83d96cd8e2fa39b37f2a926ef6b4d31cb393467ab5ac7a6987523
    section_sources:
      new-situation: '## Using the same forms in a new situation {#new-situation role=model
        objectives=obj-cardinal-numbers-01}


        Now imagine that Mina is preparing a table for friends. She counts what is
        available:


        ::: examples

        - no: Jeg har fire kopper, men bare ett glass.

        - en: I have four cups, but only one glass.

        - no: Her er tre stoler og ett bord.

        - en: Here are three chairs and one table.

        - no: Vi trenger en stol til.

        - en: We need one more chair.

        - no: Vi trenger også to glass.

        - en: We also need two glasses.

        :::


        The situation has changed, but the number choice works in exactly the same
        way. Compare the one-quantity phrases:


        ::: examples

        - no: en stol

        - en: one chair

        - no: ett bord

        - en: one table

        - no: en kopp

        - en: one cup

        - no: ett glass

        - en: one glass

        :::


        Then compare the larger quantities:


        ::: examples

        - no: tre stoler

        - en: three chairs

        - no: to bord

        - en: two tables

        - no: fire kopper

        - en: four cups

        - no: fem glass

        - en: five glasses

        :::


        {{exercise: set-the-table-transfer}}


        '
