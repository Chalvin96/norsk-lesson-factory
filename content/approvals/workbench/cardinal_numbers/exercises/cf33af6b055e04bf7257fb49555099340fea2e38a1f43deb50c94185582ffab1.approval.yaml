      common-mistake: ffd29f0d27d8e959ae6c88f15a48f68a77cb4f89eeda717c4841446955bff8b4
    section_sources:
      common-mistake: '## A common mistake {#common-mistake role=contrast objectives=obj-cardinal-numbers-01}


        A learner may understand that **ett** means one and then use it before every
        noun:


        ::: examples

        - no: ✗ Jeg trenger ett pose.

        - en: Intended meaning: I need one bag.

        :::


        This is incorrect because **pose** is an en-word. The correct phrase is:


        ::: examples

        - no: Jeg trenger en pose.

        - en: I need one bag.

        :::


        The opposite mistake is also common:


        ::: examples

        - no: ✗ Hun kjøper en brød.

        - en: Intended meaning: She is buying one loaf of bread.

        :::


        Because **brød** is an ett-word, say:


        ::: examples

        - no: Hun kjøper ett brød.

        - en: She is buying one loaf of bread.

        :::


        Do not choose **ett** because an object is a single complete thing, and do
        not choose **en** because a person or object seems more familiar. The choice
        belongs to the Norwegian noun:


        ::: examples

        - no: en stol

        - en: one chair

        - no: ett bord

        - en: one table

        - no: en kopp

        - en: one cup

        - no: ett glass

        - en: one glass

        :::


        A useful memory habit is to avoid learning only **stol**, **bord**, **kopp**,
        and **glass**. Learn the complete pairs **en stol**, **ett bord**, **en kopp**,
        and **ett glass**.


        {{exercise: repair-the-one-form}}


        '
