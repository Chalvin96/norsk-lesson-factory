  complete-the-checkout-quantities:
    exercise_key: complete-the-checkout-quantities
    checked_against:
      checkout: 20d0619cd2ca4415ea4a515f4a180e41675645e2c061560b6fbc0dfa4461a1c3
    section_sources:
      checkout: '## Back at the checkout {#checkout role=model objectives=obj-cardinal-numbers-01}


        Mina reaches the checkout with her groceries. Jonas checks whether she has
        everything.


        ::: {.reading translation="You have four apples and two bananas. Is that right?"
        dialogue_id=checkout speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Du har fire epler og to bananer. Stemmer det?

        :::


        ::: {.reading translation="Yes. And I have six eggs." dialogue_id=checkout
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Ja. Og jeg har seks egg.

        :::


        ::: {.reading translation="There is only one loaf of bread here." dialogue_id=checkout
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Her er det bare ett brød.

        :::


        ::: {.reading translation="That’s right. I only need one loaf of bread." dialogue_id=checkout
        speaker_id=mina speaker_name="Mina" character_id="mina"}

        Det stemmer. Jeg trenger bare ett brød.

        :::


        ::: {.reading translation="And how many bags would you like?" dialogue_id=checkout
        speaker_id=jonas speaker_name="Jonas" character_id="jonas"}

        Og hvor mange poser vil du ha?

        :::


        ::: {.reading translation="One bag, please." dialogue_id=checkout speaker_id=mina
        speaker_name="Mina" character_id="mina"}

        En pose, takk.

        :::


        The same contrast from the first dialogue returns naturally:


        - **ett brød**, because **brød** is an ett-word

        - **en pose**, because **pose** is an en-word

        - **to bananer**, **fire epler**, and **seks egg**, with unchanged number
        forms above one


        {{exercise: complete-the-checkout-quantities}}


        '
    outcome: approved
    note: null
    at: '2026-10-17T21:25:18.061955+00:00'
