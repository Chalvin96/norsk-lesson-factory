  answer-how-many:
    exercise_key: answer-how-many
    checked_against:
      asking-how-many: bd51cfc9239ebf4a44ce963642f68d607b5991cc87441cdf67e663505f182e21
    section_sources:
      asking-how-many: '## Asking and answering “How many?” {#asking-how-many role=model
        objectives=obj-cardinal-numbers-01}


        The question **Hvor mange …?** means *How many …?* It gives a natural reason
        to answer with a number.


        ::: examples

        - no: Hvor mange epler trenger du?

        - en: How many apples do you need?

        - no: Jeg trenger tre epler.

        - en: I need three apples.

        - no: Hvor mange brød har dere?

        - en: How many loaves of bread do you have?

        - no: Vi har ett brød.

        - en: We have one loaf of bread.

        - no: Hvor mange poser trenger du?

        - en: How many bags do you need?

        - no: Jeg trenger en pose.

        - en: I need one bag.

        :::


        You can also give a short answer when the object is already clear:


        ::: examples

        - no: Hvor mange kopper? – Fire kopper.

        - en: How many cups? – Four cups.

        - no: Hvor mange glass? – Ett glass.

        - en: How many glasses? – One glass.

        :::


        The full noun phrase is useful in early practice because it keeps the relationship
        between the number and the noun visible.


        {{exercise: answer-how-many}}


        '
    outcome: approved
