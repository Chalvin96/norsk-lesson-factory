  - finding_id: codex-hedging_stance_markers-3-1
    key: presenting_a_view_supported
    criterion: feedback_accuracy
    excerpt: The two opinion frames are stacked without a separate function, even
      though the reason is present.
    explanation: 'The stacked-support option starts «Etter min mening mener komiteen
      ...». Its two attitude expressions have different subjects and can have different
      scopes: the speaker''s assessment of what the committee believes, and the committee''s
      policy position. Calling these equivalent opinion frames stacked without a separate
      function misses the actual reason the option fits poorly: it turns an official
      committee statement into a personal inference about that committee.'
