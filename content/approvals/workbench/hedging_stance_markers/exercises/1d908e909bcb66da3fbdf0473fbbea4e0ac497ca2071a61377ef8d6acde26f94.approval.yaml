    checked_against:
      marking-personal-opinion-with-synes-mener-and-etter-min-mening: cb0138b32a9a022b1857d5a824c693e49fcb4e2a6254b8de67d7eb85aa682e3a
    section_sources:
      marking-personal-opinion-with-synes-mener-and-etter-min-mening: '## Marking
        personal opinion with synes, mener, and etter min mening {#marking-personal-opinion-with-synes-mener-and-etter-min-mening
        role=model objectives=obj-hedging-stance-markers-01}


        Henrik reacts to the price with a personal evaluation:


        ::: examples

        - no: Jeg synes det høres dyrt ut.

        - en: I think it sounds expensive.

        :::


        **Synes** is common when expressing an opinion, impression, preference, or
        evaluation.


        ::: examples

        - no: Jeg synes planen virker fornuftig.

        - en: I think the plan seems sensible.

        - no: Vi synes konserten var vellykket.

        - en: We think the concert was successful.

        - no: Synes du dette er en god løsning?

        - en: Do you think this is a good solution?

        :::


        By framing the evaluation as personal, synes leaves room for another person
        to disagree. It is therefore a useful stance marker in discussion.


        **Mener** can also mean think, but it commonly presents a more considered
        belief, position, or claim.


        ::: examples

        - no: Jeg mener at kommunen bør støtte arrangementet.

        - en: I believe that the municipality should support the event.

        - no: Henrik mener at teltet er for dyrt.

        - en: Henrik believes that the tent is too expensive.

        :::


        Compare:


        ::: examples

        - no: Jeg synes lokalet er hyggelig.

        - en: I think the venue is pleasant.

        - no: Jeg mener at lokalet er det beste alternativet.

        - en: I believe that the venue is the best option.

        :::


        The first is a personal impression. The second sounds more like a position
        that could be supported with reasons.


        **Etter min mening** means in my opinion. It explicitly labels the statement
        as the speaker’s view and is useful when contrasting positions.


        ::: examples

        - no: Etter min mening bør vi flytte konserten inn.

        - en: In my opinion, we should move the concert indoors.

        - no: Dette er, etter min mening, den sikreste løsningen.

        - en: This is, in my opinion, the safest solution.

        :::


        Do not pile up opinion markers without a reason:


        Less natural:


        ::: {.callout variant=warning}

        Not: Etter min mening synes jeg at planen er god. (In my opinion, I think
        that the plan is good.)

        :::


        Usually choose one clear frame:


        ::: examples

        - no: Etter min mening er planen god.

        - en: In my opinion, the plan is good.

        - no: Jeg synes planen er god.

        - en: I think the plan is good.

        :::


        A stance marker does not automatically make a forceful statement polite. Tone
        and wording still matter. Compare:


        ::: examples

        - no: Dette er en dårlig idé.

        - en: This is a bad idea.

        - no: Jeg synes dette er en dårlig idé.

        - en: I think this is a bad idea.

        - no: Jeg synes kanskje vi bør vurdere en annen løsning.

        - en: I think perhaps we should consider another solution.

        :::


        The final version combines personal opinion and uncertainty to create more
        room for discussion. It is softer, but its communicative purpose remains clear.


        **Checkpoint: presenting a view without turning it into fact**


        Continue the planning meeting. Give Maja and Henrik different reactions to
        the price, location, expected attendance, and weather plan. Express each reaction
        as a personal evaluation or considered position.


        {{exercise: presenting_a_view_checkpoint}}


        '
