      giving-approximate-amounts: 63fd36f2369cce5c0c7be968eb98247039ecf4379301eef6ced70fff1fe717fd
    section_sources:
      giving-approximate-amounts: '## Giving approximate amounts {#giving-approximate-amounts
        role=model objectives=obj-hedging-stance-markers-01}


        Several expressions make quantities less exact. In the opening dialogue, Maja
        says:


        ::: examples

        - no: Det kommer visstnok rundt to hundre mennesker.

        - en: Apparently, around two hundred people are coming.

        :::


        **Rundt** means around or approximately before numbers and quantities:


        ::: examples

        - no: Det tar rundt en halvtime.

        - en: It takes around half an hour.

        - no: Vi trenger rundt femti stoler.

        - en: We need around fifty chairs.

        - no: Billetten koster rundt fire hundre kroner.

        - en: The ticket costs around four hundred kroner.

        :::


        **Omtrent** also means approximately and is neutral in register:


        ::: examples

        - no: Det kommer omtrent to hundre mennesker.

        - en: Approximately two hundred people are coming.

        - no: Turen er omtrent ti kilometer lang.

        - en: The walk is approximately ten kilometres long.

        :::


        **Cirka**, often written **ca.** in practical texts, is another common equivalent:


        ::: examples

        - no: Møtet varer cirka én time.

        - en: The meeting lasts about one hour.

        :::


        In informal conversation, **sånn** can introduce a rough example, size, number,
        or category:


        ::: examples

        - no: Vi trenger et telt sånn til tjue personer.

        - en: We need a tent for something like twenty people.

        - no: Det tar sånn fem–ti minutter.

        - en: It takes something like five to ten minutes.

        - no: Hun er sånn rundt tretti.

        - en: She is, like, around thirty.

        :::


        Sånn is conversational and deliberately loose. It is useful when precision
        is unnecessary, but it can sound vague in formal reports or technical instructions.
        In those settings, omtrent, cirka, or a precise figure is usually more suitable.


        Avoid unnecessary stacking in neutral prose:


        Overloaded:


        ::: {.callout variant=warning}

        Not: Det kommer kanskje sånn cirka rundt to hundre mennesker. (Perhaps something
        like around two hundred people are coming, in this situation.)

        :::


        Clearer alternatives:


        ::: examples

        - no: Det kommer kanskje rundt to hundre mennesker.

        - en: Perhaps around two hundred people are coming.

        - no: Det kommer visstnok cirka to hundre mennesker.

        - en: Apparently, about two hundred people are coming.

        :::


        Multiple markers can be natural when they do different jobs. In the second
        sentence, visstnok marks uncertainty about the source, while cirka marks approximation
        of the number. The sentence communicates both: the report is not fully confirmed,
        and the reported figure is not exact.


        **Checkpoint: exact, approximate, or informally rough**


        Use details from an event plan: audience size, ticket price, walking distance,
        setup time, and tent capacity. Restate each figure with a degree of precision
        suited to the situation. Include both neutral planning language and informal
        conversation between Maja and Henrik.


        {{exercise: exact_approximate_or_informally_rough_checkpoint}}


        '
