  open_uncertainty_checkpoint:
    exercise_key: open_uncertainty_checkpoint
    checked_against:
      expressing-uncertainty-with-kanskje: 62d4704bb9ace8d1aa617caa75278597f48914909e56fb0f23b81a174cf32a0c
    section_sources:
      expressing-uncertainty-with-kanskje: '## Expressing uncertainty with kanskje
        {#expressing-uncertainty-with-kanskje role=model objectives=obj-hedging-stance-markers-01}


        The most common general marker of uncertainty is **kanskje**, meaning perhaps,
        maybe, or possibly.


        ::: examples

        - no: Det blir kanskje færre hvis det regner.

        - en: There may be fewer if it rains.

        - no: Hun kommer kanskje senere.

        - en: Perhaps she is coming later.

        - no: Vi kan kanskje flytte konserten inn.

        - en: We could perhaps move the concert indoors.

        :::


        Kanskje does not explain why the speaker is uncertain. The uncertainty might
        come from missing information, an undecided plan, or simple caution.


        Its position can change the sentence structure. When kanskje appears inside
        the sentence, normal main-clause word order is common:


        ::: examples

        - no: Vi kan kanskje låne et telt.

        - en: Perhaps we can borrow a tent.

        :::


        When kanskje begins a main clause, two patterns are accepted:


        ::: examples

        - no: Kanskje kan vi låne et telt.

        - en: Perhaps we can borrow a tent.

        - no: Kanskje vi kan låne et telt.

        - en: Perhaps we can borrow a tent.

        :::


        The first pattern uses verb–subject order after fronted kanskje. The second
        uses sentence-initial kanskje followed by subject–verb order. Both are accepted
        Bokmål constructions, and the choice can reflect style or emphasis.


        **Checkpoint: identifying open uncertainty**


        Return to the concert preparations. Read several short updates about weather,
        attendance, transport, and equipment. For each update, rewrite one definite
        claim so that it becomes an open possibility with kanskje.


        {{exercise: open_uncertainty_checkpoint}}


        '
