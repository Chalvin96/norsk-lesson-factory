    section_sources:
      back-at-the-cultural-centre: '## Back at the cultural centre {#back-at-the-cultural-centre
        role=model objectives=obj-hedging-stance-markers-01}


        Later that afternoon, Henrik calls the sports club. He then returns to Maja
        with an update.


        ::: {.reading translation=''Apparently, the sports club has a tent we can
        borrow.'' dialogue_id=''back-at-centre'' speaker_id=''henrik'' speaker_name="Henrik"
        character_id="henrik"}

        Idrettslaget har visst et telt vi kan låne.

        :::


        ::: {.reading translation=''That’s great! It is large enough, I suppose?''
        dialogue_id=''back-at-centre'' speaker_id=''maja'' speaker_name="Maja" character_id="maja"}

        Så bra! Det er vel stort nok?

        :::


        ::: {.reading translation=''Yes, it is for something like thirty people. It
        will probably be enough.'' dialogue_id=''back-at-centre'' speaker_id=''henrik''
        speaker_name="Henrik" character_id="henrik"}

        Ja, det er sånn til tretti personer. Det holder nok.

        :::


        ::: {.reading translation=''Perhaps we should collect it on Friday, if that
        suits them.'' dialogue_id=''back-at-centre'' speaker_id=''maja'' speaker_name="Maja"
        character_id="maja"}

        Vi bør kanskje hente det på fredag, hvis det passer for dem.

        :::


        ::: {.reading translation=''Agreed. After all, we have to put it up before
        the sound check.'' dialogue_id=''back-at-centre'' speaker_id=''henrik'' speaker_name="Henrik"
        character_id="henrik"}

        Enig. Vi må jo sette det opp før lydprøven.

        :::


        ::: {.reading translation=''I think this turned into a much better solution.''
        dialogue_id=''back-at-centre'' speaker_id=''maja'' speaker_name="Maja" character_id="maja"}

        Jeg synes dette ble en mye bedre løsning.

        :::


        The second dialogue reuses the same forms, but the situation has moved forward.
        Henrik now has indirect information from the club, so visst is appropriate.
        Maja expects the tent to be large enough and invites confirmation with vel.
        Henrik gives an informal capacity with sånn and makes an inference with nok.
        Maja offers a softened proposal with kanskje, and Henrik supports it with
        shared scheduling knowledge marked by jo. Finally, Maja clearly labels her
        positive evaluation with synes.


        **Integrated practice: reconstructing the planning conversation**


        Create a short written exchange between Maja and Henrik after a new problem
        arises: the delivery van may be unavailable, another volunteer has heard that
        the sound equipment is delayed, and the walk from the car park takes about
        ten minutes. Keep the exchange focused on how certain each person is and where
        the information comes from.


        Your exchange should distinguish possibility, inference, shared assumptions,
        reported information, personal opinion, and approximation. Avoid using every
        marker in every turn; each marker should have a clear reason to be present.


        {{exercise: reconstructing_the_planning_conversation}}


        '
