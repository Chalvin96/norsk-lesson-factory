    exercise_key: changing_only_the_stance_checkpoint
    checked_against:
      combining-stance-markers-naturally: f65f778fc7233d6913028c362af5eedee6522b5312dd9124973c8e9c0e81aa0f
    section_sources:
      combining-stance-markers-naturally: '## Combining stance markers naturally {#combining-stance-markers-naturally
        role=contrast objectives=obj-hedging-stance-markers-01}


        Norwegian speakers often use more than one marker because each contributes
        different information. The key is to understand the job of each one.


        ::: examples

        - no: Det kommer kanskje rundt hundre personer.

        - en: Perhaps around one hundred people are coming.

        :::


        Kanskje marks uncertainty about whether that expectation is correct. Rundt
        marks the number as approximate.


        ::: examples

        - no: De har visst et telt til sånn tretti personer.

        - en: Apparently, they have a tent for something like thirty people.

        :::


        Visst marks indirect information. Sånn makes the capacity informally approximate.


        ::: examples

        - no: Vi bør vel kanskje ringe dem først.

        - en: Perhaps we should probably call them first, shouldn’t we?

        :::


        Both vel and kanskje soften the proposal. This combination is possible in
        conversation, but too many hedges can make a speaker sound hesitant. Often
        one is enough:


        ::: examples

        - no: Vi bør vel ringe dem først.

        - en: We should probably call them first, shouldn’t we?

        - no: Kanskje vi bør ringe dem først.

        - en: Perhaps we should call them first.

        :::


        Notice that the second example uses the accepted sentence-initial kanskje
        followed by subject–verb order: kanskje vi bør. It follows the same pattern
        as Kanskje vi kan låne et telt above.


        Markers can also reveal different relationships to the same claim:


        ::: examples

        - no: Konserten blir kanskje avlyst.

        - en: Perhaps the concert will be cancelled.

        - no: Konserten blir nok avlyst.

        - en: The concert will probably be cancelled.

        - no: Konserten blir visst avlyst.

        - en: Apparently, the concert is going to be cancelled.

        - no: Konserten blir vel avlyst?

        - en: The concert is going to be cancelled, I suppose?

        - no: Konserten blir jo avlyst.

        - en: The concert is being cancelled, as we both know.

        :::


        These are not interchangeable decorations. Each version positions the speaker
        differently toward the same event.


        **Checkpoint: changing only the stance**


        Take one basic statement about the concert, such as the expected attendance,
        the need for a tent, or the chance of cancellation. Recast it several times
        so that it becomes an open possibility, an inference, reported information,
        a shared assumption, and a tentative request for agreement.


        {{exercise: changing_only_the_stance_checkpoint}}


        '
    outcome: approved
