    checked_against:
      reporting-uncertain-information-with-visst-and-visstnok: 4692e63d542c69d96ed679fedd9abcd00f2f9163531c0a57fdcf3fa612be5fe2
    section_sources:
      reporting-uncertain-information-with-visst-and-visstnok: '## Reporting uncertain
        information with visst and visstnok {#reporting-uncertain-information-with-visst-and-visstnok
        role=model objectives=obj-hedging-stance-markers-01}


        Maja says that the tent costs five thousand kroner, but she does not present
        herself as the source:


        ::: examples

        - no: Teltet koster visst fem tusen kroner.

        - en: The tent apparently costs five thousand kroner.

        :::


        Henrik later says:


        ::: examples

        - no: De har visst flere.

        - en: They apparently have several.

        :::


        **Visst** can indicate that the speaker has heard or learned something indirectly.
        It often corresponds to apparently or I understand that. The speaker passes
        on the information without fully guaranteeing it.


        ::: examples

        - no: Kari har visst fått ny jobb.

        - en: Apparently, Kari has got a new job.

        - no: Veien er visst stengt.

        - en: The road is apparently closed.

        - no: De skal visst flytte til Bergen.

        - en: They are apparently going to move to Bergen.

        :::


        **Visstnok** also marks reported information and often makes the distance
        from the claim especially clear. It can suggest reportedly, supposedly, or
        according to what I have heard.


        ::: examples

        - no: Det kommer visstnok rundt to hundre mennesker.

        - en: Apparently, around two hundred people are coming.

        - no: Restauranten er visstnok en av de beste i byen.

        - en: The restaurant is reportedly one of the best in the city.

        - no: Denne bygningen er visstnok over tre hundre år gammel.

        - en: This building is supposedly more than three hundred years old.

        :::


        In many contexts, visst and visstnok are close. Visst is very common in conversational
        Bokmål, while visstnok can place slightly more emphasis on the reported or
        unverified nature of the information.


        Do not confuse stance-marking visst with **visst** meaning certainly in more
        formal or fixed uses, or with **viss** meaning certain or particular:


        ::: examples

        - no: Det er visst en feil i programmet.

        - en: Apparently, there is an error in the software.

        - no: Under visse forhold fungerer programmet bedre.

        - en: Under certain conditions, the software works better.

        :::


        The first sentence reports uncertain information. In the second, visse is
        an inflected form of viss and identifies particular conditions.


        There is also an important difference between visst and nok:


        ::: examples

        - no: Veien er visst stengt.

        - en: Apparently, the road is closed.

        - no: Veien er nok stengt.

        - en: The road is probably closed.

        :::


        With visst, the speaker has apparently received the information from somewhere.
        With nok, the speaker reaches a likely conclusion, perhaps after seeing a
        barrier or a line of stationary cars.


        **Checkpoint: report or inference**


        Work with short pieces of context. Some should provide an indirect source,
        such as a colleague’s message, a local rumour, or an online notice. Others
        should provide observable evidence, such as barriers across a road or a dark,
        empty building. State the likely situation using a suitable stance marker.


        {{exercise: report_or_inference_checkpoint}}


        '
