    section_sources:
      retrieval-and-review: '## Retrieval and review {#retrieval-and-review role=recap
        objectives=obj-hedging-stance-markers-01}


        Without looking back, write a brief update from Henrik to a colleague about
        the concert. Include one uncertain possibility, one inference based on evidence,
        one piece of indirectly reported information, one reminder of shared knowledge,
        one tentative assumption seeking agreement, one personal opinion, and one
        approximate amount. Keep the update natural and connected rather than presenting
        separate example sentences. Your response should make the source and strength
        of each claim clear through the stance markers.


        {{exercise: retrieval_and_review}}


        '
