      particle-foundation-contrast: cf2f2b19bdc4588414b4ca340e1471c0a4ba82a60d23434308c1cb41f6f602d6
    section_sources:
      particle-foundation-contrast: '## Building from the particle foundation {#particle-foundation-contrast
        role=contrast objectives=obj-hedging-stance-markers-01}


        The prerequisite lesson established three useful stances toward a claim: *jo*
        treats

        it as shared, *vel* often leaves room for the listener''s uptake, and *nok*
        presents it

        as likely. Here those familiar choices become reference points for a broader
        system.


        Compare open possibility with a likely assessment:


        ::: examples

        - no: Det regner kanskje på lørdag.

        - en: Perhaps it will rain on Saturday.

        - no: Det regner nok på lørdag.

        - en: It will probably rain on Saturday.

        :::


        *Kanskje* leaves rain as one possibility. *Nok* presents rain as the outcome
        the

        speaker considers likely; that assessment may rest on evidence, experience,
        or an

        ordinary expectation. The next sections add indirect source, personal viewpoint,
        and

        approximation, rather than reteaching each particle separately.


        {{exercise: possibility_or_inference_checkpoint}}


        '
