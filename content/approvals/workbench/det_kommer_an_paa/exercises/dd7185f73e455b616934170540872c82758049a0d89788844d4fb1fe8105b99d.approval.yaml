  revise_cabin_reply:
    exercise_key: revise_cabin_reply
    checked_against:
      back-to-cabin-plan: 043ced0cd306021fec73e3510e89eeaacc261c5f3b2d8b0c38b078a584d9cc4a
    section_sources:
      back-to-cabin-plan: '## Back to the cabin plan {#back-to-cabin-plan role=model
        objectives=obj-det-kommer-an-paa-01}


        On Friday, Nora checks the forecast and calls Amir.


        ::: {.reading translation="Now I’ve checked the weather forecast. There will
        be a little rain in the morning, but sun after lunch." dialogue_id=friday-cabin-plan
        speaker_id=nora speaker_name="Nora" character_id="nora"}

        Nå har jeg sett på værmeldingen. Det blir litt regn om morgenen, men sol etter
        lunsj.

        :::


        ::: {.reading translation="Then we can go. When shall we meet?" dialogue_id=friday-cabin-plan
        speaker_id=amir speaker_name="Amir" character_id="amir"}

        Da kan vi dra. Når møtes vi?

        :::


        ::: {.reading translation="It depends on which train we take. If we take the
        express train, we’ll meet at nine. It leaves at quarter past nine." dialogue_id=friday-cabin-plan
        speaker_id=nora speaker_name="Nora" character_id="nora"}

        Det kommer an på hvilket tog vi tar. Hvis vi tar hurtigtoget, møtes vi klokka
        ni. Det går kvart over ni.

        :::


        ::: {.reading translation="Let’s take that one. How much food should I buy?"
        dialogue_id=friday-cabin-plan speaker_id=amir speaker_name="Amir" character_id="amir"}

        La oss ta det. Hvor mye mat skal jeg kjøpe?

        :::


        ::: {.reading translation="It depends on how many people are coming. Sara
        will reply this evening." dialogue_id=friday-cabin-plan speaker_id=nora speaker_name="Nora"
        character_id="nora"}

        Det kommer an på hvor mange som kommer. Sara svarer i kveld.

        :::


        ::: {.reading translation="All right. And how long will we stay at the cabin?"
        dialogue_id=friday-cabin-plan speaker_id=amir speaker_name="Amir" character_id="amir"}

        Greit. Og hvor lenge blir vi på hytta?

        :::


        ::: {.reading translation="It depends on the weather on Sunday. If it is nice,
        we’ll stay until the evening." dialogue_id=friday-cabin-plan speaker_id=nora
        speaker_name="Nora" character_id="nora"}

        Det kommer an på været på søndag. Hvis det blir fint, blir vi til kvelden.

        :::


        The new conversation reuses the expression naturally, but the factors are
        more precise. Nora does not say only **toget**; she says **hvilket tog vi
        tar**. She does not say only **folkene**; she says **hvor mange som kommer**.
        The expression helps Amir understand what information they still need before
        they can settle each part of the plan.


        '
    outcome: approved
    note: null
