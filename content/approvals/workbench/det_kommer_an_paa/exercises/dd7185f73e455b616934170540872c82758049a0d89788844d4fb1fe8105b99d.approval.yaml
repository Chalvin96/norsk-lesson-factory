  choose_direct_or_dependent_answer:
    exercise_key: choose_direct_or_dependent_answer
    checked_against:
      common-mistakes: d71ac2b2c23f03fadab4c72591fe0da38483f7ea3eaafa73f311dfc77aa54e9c
    section_sources:
      common-mistakes: '## Common mistakes {#common-mistakes role=contrast objectives=obj-det-kommer-an-paa-01}


        **Leaving out an**


        The target expression is **kommer an på**, not simply **kommer på**.


        ::: examples

        - no: Det kommer an på prisen.

        - en: It depends on the price.

        :::


        Not:


        ::: examples

        - no: ✗ Det kommer på prisen.

        - en: ✗ It comes on the price.

        :::


        Without **an**, the sentence no longer has the intended fixed-expression meaning.


        **Replacing på with another preposition**


        Keep **på** in this expression.


        ::: examples

        - no: Det kommer an på været.

        - en: It depends on the weather.

        :::


        Not:


        ::: examples

        - no: ✗ Det kommer an av været.

        - en: ✗ It depends from the weather.

        :::


        It is safer to remember the entire sequence **kommer an på** as one phrase.


        **Giving no meaningful factor**


        ::: examples

        - no: Det kommer an på.

        - en: It depends.

        :::


        This can occur when the factor is obvious from the conversation, but it does
        not meet the lesson goal when the listener needs to know what the answer depends
        on. Prefer:


        ::: examples

        - no: Det kommer an på hvor mye tid vi har.

        - en: It depends on how much time we have.

        :::


        Naming the factor turns a vague answer into useful information.


        **Using the phrase when the answer does not vary**


        If you know that the shop is closed, say so directly:


        ::: examples

        - no: Nei, butikken er stengt.

        - en: No, the shop is closed.

        :::


        **Det kommer an på** is appropriate only when different conditions could lead
        to different answers.


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:51:21.439930+00:00'
    decision_id: null
  complete_answer_with_named_noun:
    exercise_key: complete_answer_with_named_noun
    checked_against:
      complete-answer-with-named-noun: 4cb0e7b97b293dfdced3093b596b469bf8a0ac1d2e17c4400bffc7dd761afe66
    section_sources:
      complete-answer-with-named-noun: '## Controlled practice: complete an answer
        with a named noun {#complete-answer-with-named-noun role=contrast objectives=obj-det-kommer-an-paa-01}


        Answer short practical questions with **Det kommer an på** followed by a relevant
        noun from the context. The situations include travel, eating outside, journey
        times, and cost.


        For example, the learner might hear a question about whether a train journey
        will be quick after being told that some trains stop at every station. The
        response should name **toget** as the deciding factor. In another prompt,
        a proposed outdoor activity may be affected by rain, so the response should
        name **været**.


        Your response should contain the complete fixed expression, include **på**,
        and name a factor that genuinely explains why the answer can vary.


        {{exercise: complete_answer_with_named_noun}}


        '
    outcome: approved
    note: null
    reason: null
    comment: null
    at: '2026-10-25T14:51:21.439930+00:00'
    decision_id: null
