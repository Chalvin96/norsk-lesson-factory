      final-retrieval: '## Final retrieval {#final-retrieval role=recap objectives=obj-det-kommer-an-paa-01}


        Without looking back, answer three new practical questions with **det kommer
        an på**. Name a different deciding factor each time, and make one answer precise
        with **om**, **hva**, **hvem**, **hvor**, **når**, or **hvordan**. Use the
        complete expression when the answer genuinely varies with the factor you name.


        {{exercise: final_retrieval}}


        '
