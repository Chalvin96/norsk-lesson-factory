  explain_two_possible_outcomes:
    exercise_key: explain_two_possible_outcomes
    checked_against:
      explain-two-possible-outcomes: 8dfba6b53ac127e44b377a60c5239a7d72bd17abf469adaef21ad36a59c161fa
    section_sources:
      explain-two-possible-outcomes: '## Guided practice: explain two possible outcomes
        {#explain-two-possible-outcomes role=contrast objectives=obj-det-kommer-an-paa-01}


        Answer each question in two parts: first **Det kommer an på** plus a named
        factor, then briefly explain how two conditions would lead to different outcomes.


        Contexts should remain practical and familiar. A journey might be short without
        traffic but long during rush hour. A restaurant might be affordable at lunchtime
        but expensive in the evening. A walk might be pleasant in dry weather but
        difficult in heavy rain.


        {{exercise: explain_two_possible_outcomes}}


        '
