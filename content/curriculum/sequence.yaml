schema_version: 1
entries:
  - lesson_id: greet_and_introduce_yourself
    rationale: Complete a first meeting with the taught greeting, name statement, matching question, and closing as whole expressions.
  - lesson_id: ask_for_repetition_or_clarification
    rationale: Equip the learner to repair the next exchange immediately; translated requests, supplied replies, and confirmation models support phrase-based use before productive question grammar.
  - lesson_id: personal_pronouns_subject
    rationale: Generalize jeg and du from the first exchanges to speaker, listener, and third-person reference before changing subjects in present-tense practice.
  - lesson_id: present_tense
    rationale: Build simple statements with the familiar subjects, regular verbs, and er, har, and gjør before studying clause order.
  - lesson_id: word_order_main_clauses
    rationale: Organize the present-tense statements into subject-first and fronted clauses, including the introductory question and ikke patterns used in help-seeking.
  - lesson_id: ask_for_help
    rationale: Apply the clause foundation to an obstacle and Kan du hjelpe meg; use the taught response phrases to accept a next action before returning to question analysis.
  - lesson_id: question_word_order
    rationale: Revisit the question patterns encountered in repair and help exchanges, extending the main-clause introduction to negative, wh-, and permission questions.
  - lesson_id: cardinal_numbers
    rationale: Prepare quantities one to ten and the taught en/ett noun pairs immediately before ordering; this lesson does not teach spoken prices above ten.
  - lesson_id: order_and_pay
    rationale: Integrate greetings, requests, questions, quantities, and closings in a supported transaction using the supplied menu forms and written price examples.
